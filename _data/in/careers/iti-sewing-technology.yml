    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Can I join ITI Sewing Technology after Class 8?"
            a: "Yes, this is one of the trades that accepts Class 8 pass students in many states, alongside Class 10 pass entry, making it accessible earlier than most technical trades. Exact eligibility varies by state, so confirm with your target institute."
          - q: "What is the difference between ITI Sewing Technology and Diploma in Fashion Design?"
            a: "ITI Sewing Technology focuses specifically on garment stitching, industrial machine operation and production techniques — a shorter, practical, production-floor-oriented trade. Diploma in Fashion Design is broader, covering design, pattern making, textile knowledge and creative direction over a longer duration. Sewing Technology is production-focused; Fashion Design is design-focused."
          - q: "How long is the ITI Sewing Technology course?"
            a: "Sewing Technology is typically a shorter trade, around 1 year under the NCVT-affiliated Craftsman Training Scheme, focused on industrial sewing machine operation and garment production techniques."
          - q: "Can I get a job in a garment export house after this trade?"
            a: "Yes, this is one of the most common and realistic paths. India's large garment export industry regularly hires trained machine operators for mass production work, particularly in textile manufacturing hubs."
          - q: "Can I start my own tailoring business after this trade?"
            a: "Yes, this is a genuine and common path. Many graduates start independent tailoring or boutique stitching businesses after gaining practical experience, serving local customers directly rather than working in factory production."
