            - "ITI Instrument Mechanic is a <strong>2-year</strong>, NCVT/DGT-affiliated trade under the Craftsman Training Scheme, training students to install, calibrate, maintain and repair industrial measuring and control instruments — pressure gauges, temperature sensors, flow meters, control valves and process control panels."
            - "These instruments are essential for monitoring and controlling production processes in factories and process plants."
            - "Where <a href=\"iti-electronics-mechanic.html\">Electronics Mechanic</a> focuses on consumer electronics, Instrument Mechanic works specifically in industrial/process-plant settings, requiring precise calibration skills and an understanding of process control principles."
