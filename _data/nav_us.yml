# USA Edition navigation — same shape as _data/nav.yml (`sidebar` groups →
# items → optional children), rendered by _includes/sidebar.html when the
# page's region is `us` (see _data/regions.yml → us.nav).
# Group ids start with "us-" so they never clash with India group ids
# (both editions are rendered together on region-neutral pages).
# Only link to pages that exist. Individual career pages are reached from
# the Careers hub (us/careers/), which links every pathway marked `live`.
# icon is the inner SVG markup for a 24x24, stroke-based icon.

sidebar:
  - id: us-start
    label: Plan Your Path
    items:
      - label: USA Home
        short: Home
        href: us/
        icon: '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>'
      - label: High School
        short: H.School
        href: us/high-school/
        icon: '<path d="M12 3l10 5-10 5L2 8z"/><path d="M6 10.5V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-5.5"/>'
        children:
          - { label: "Grade-by-grade plan", href: "us/high-school/#plan" }
          - { label: "How GPA works", href: "us/high-school/#gpa" }
          - { label: "Honors, AP, IB, dual enrollment", href: "us/high-school/#rigor" }
          - { label: "What colleges weigh", href: "us/high-school/#what-counts" }
      - label: "Tests: SAT, ACT, AP"
        short: Tests
        href: us/tests/
        icon: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/>'
        children:
          - { label: "Do colleges require tests?", href: "us/tests/#policies" }
          - { label: "SAT vs ACT", href: "us/tests/#sat-act" }
          - { label: "AP exams", href: "us/tests/#ap" }
          - { label: "MCAT, DAT, LSAT", href: "us/tests/#grad-tests" }
      - label: College & Money
        short: College
        href: us/college/
        icon: '<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/><path d="M6 12h.01M18 12h.01"/>'
        children:
          - { label: "Degree levels", href: "us/college/#degrees" }
          - { label: "What college costs", href: "us/college/#cost" }
          - { label: "FAFSA, grants and loans", href: "us/college/#aid" }
          - { label: "Community college and transfer", href: "us/college/#transfer" }
  - id: us-careers
    label: Careers & Beyond
    items:
      - label: Career Pathways
        short: Careers
        href: us/careers/
        icon: '<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18"/>'
        children:
          - { label: "Technology", href: "us/careers/#cat-technology" }
          - { label: "Engineering", href: "us/careers/#cat-engineering" }
          - { label: "Healthcare", href: "us/careers/#cat-healthcare" }
          - { label: "Law", href: "us/careers/#cat-law" }
          - { label: "Business & Finance", href: "us/careers/#cat-business" }
          - { label: "Psychology & Social Science", href: "us/careers/#cat-social-science" }
          - { label: "Compare careers", href: "us/compare/" }
          - { label: "New York City hub", href: "us/new-york-city/" }
      - label: Licensed Professions
        short: Licenses
        href: us/professional-licenses/
        icon: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/>'
        children:
          - { label: "Medicine", href: "us/professional-licenses/medicine/" }
          - { label: "Law", href: "us/professional-licenses/law/" }
          - { label: "CPA", href: "us/professional-licenses/cpa/" }
          - { label: "Engineering (PE)", href: "us/professional-licenses/pe/" }
          - { label: "Nursing", href: "us/professional-licenses/nursing/" }
          - { label: "Pharmacy, dentistry, PT, psychology", href: "us/professional-licenses/#pharmacy" }
      - label: International Students
        short: Intl
        href: us/international-students/
        icon: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"/>'
        children:
          - { label: "Admission to arrival", href: "us/international-students/#steps" }
          - { label: "English and credentials", href: "us/international-students/#credentials" }
          - { label: "Work, OPT and H-1B", href: "us/international-students/work-authorization/" }
          - { label: "Rules changing now", href: "us/international-students/work-authorization/#changes" }

# Footer for USA pages (_includes/footer.html uses it when present).
