  - id: "faq"
    hid: "faq-heading"
    alt: true
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Do I need to be good at drawing to work in Animation or VFX?"
            a: "Traditional 2D animation benefits significantly from drawing skill, but 3D animation and most VFX roles rely more heavily on software proficiency, technical problem-solving and an eye for movement, lighting and realism than freehand drawing ability."
          - q: "What is the difference between Animation and VFX?"
            a: "Animation typically means creating movement and characters from scratch, often for cartoons, films or games. VFX usually means adding digital elements — explosions, creatures, environments — to live-action footage that was actually filmed. The skills overlap in 3D software but serve different creative purposes."
          - q: "Do I need a specific degree, or can I learn Animation/VFX through short courses?"
            a: "Both routes exist. Institutes like Whistling Woods International or MAAC offer structured diploma and degree programmes, while many professionals also build skills through focused, software-specific short courses combined with a strong demo reel — studios generally hire based on reel quality more than the exact course taken."
          - q: "What software should I learn for Animation and VFX?"
            a: "Maya and Blender are standard for 3D animation, Nuke and After Effects are widely used for compositing and VFX, and Houdini is valued for complex simulations like fire, water and destruction effects. Most studios expect proficiency in at least one or two of these, depending on the role."
          - q: "How much do Animation and VFX artists earn in India?"
            a: "It varies by specialisation, studio and experience. Entry-level roles at production houses typically start modestly, while experienced artists working on major film, VFX or gaming projects, especially for international studios outsourcing work to India, can earn considerably more."
      - note: "*Fee and salary figures are indicative, based on publicly available information as of 2026, and vary significantly by institute, specialisation and studio type."
        class: "table-note mt-lg"
