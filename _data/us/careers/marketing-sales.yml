    license_text: "None"
    routes:
      - id: bachelor
        title: "Bachelor's with statistics and research methods → analyst"
        tag: "Typical"
        who: "Courses in statistics, research methods and marketing are important; economics and consumer behavior help too. An internship or volunteer research work may help."
        steps:
          - { tag: "Start", title: "High school diploma", text: "", kind: start, source: ooh_mktresearch }
          - { tag: "About 4 years", title: "Bachelor's in market research, business, communications or social science", text: "", kind: stage, source: ooh_mktresearch }
          - { tag: "During college", title: "Internship or volunteer research project", text: "", kind: stage, source: ooh_mktresearch }
          - { tag: "Goal", title: "Market research analyst", text: "", kind: goal, source: ooh_mktresearch }
      - id: masters
        title: "Master's in marketing research, or an MBA"
        tag: "Leadership and technical research"
        who: "Several schools offer graduate programs in marketing research; some analysts earn a bachelor's in statistics or marketing and then an MBA."
        steps:
          - { tag: "Start", title: "Bachelor's degree", text: "", kind: start, source: ooh_mktresearch }
          - { tag: "Admission test", title: "GMAT or GRE (for an MBA)", text: "The GMAT has three sections (Quantitative Reasoning, Verbal Reasoning, Data Insights) and takes 2 hours 15 minutes.", kind: exam, source: gmac_structure, href: "us/exams/gmat/", link: "GMAT and GRE exam pages" }
