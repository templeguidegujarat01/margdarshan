  - slug: rowing
    short: "Rowing"
    domain: solo
    checked: 2026-10-17
    body: "World Rowing · Rowing Federation of India (RFI)"
    card: "World Rowing 2026 rules — boat classes, the 2,000 m course, U19/U23 ages, cox weight — LA28 places incl. new coastal beach sprints, SAI rowing centres, Asian Games 2026 bronze and CRPF posts."
    card_facts: ["2,000 m straight course", "6 + 6 Olympic boats", "Asia: 5 single-scull places"]
    eyebrow: "Sports Cockpit · Solo, Track &amp; Pool · World Rowing rules 2026 · LA28 qualification"
    title: "Rowing — boats, the 2,000 m race &amp; the road to LA28"
    lede: "Education Margdarshan's rowing map for India in simple words: the boat classes from single sculls to the eight, the 2,000 m race and its rules, the Under 19 and Under 23 age limits, how LA28 places are won (including the new coastal beach sprints), the SAI rowing centres, who pays, India's Asian Games medal and the CRPF posts for rowers."
    official:
      - { label: "World Rowing Rules (PDF)", url: "https://d2cx26qpfwuhvu.cloudfront.net/worldrowing/wp-content/uploads/2026/07/14073746/Overall-Classic-Rowing-Rules.pdf" }
      - { label: "LA28 rowing qualification (PDF)", url: "https://cdn.dosb.de/Relaunch_2024/Athletenservice/Games/LA_2028/Internationale_Qualikriterien/Stand_01072026/ROW-LA28-Qualification-System_20260512.pdf" }
    facts:
      - { label: "Standard race", value: "<strong>2,000 m</strong> straight course", source: wr-rules }
      - { label: "Olympic boats (LA28)", value: "<strong>6 men · 6 women</strong> · 438 rowers", source: wr-la28 }
      - { label: "Age groups", value: "U19 to the year you turn <strong>18</strong> · U23 to <strong>22</strong>", source: wr-rules }
      - { label: "Coxswain minimum", value: "<strong>55 kg</strong> (up to 15 kg dead weight)", source: wr-rules }
    sections:
      - id: rules
        nav: "Boats &amp; rules"
        eyebrow: "Core rules &amp; selection formats"
        heading: "Sculling and sweep, the boat classes and the 2,000 m race"
        parts:
          - p: "Rowers sit facing backwards and move the boat with oars. In <strong>sculling</strong> each rower uses <strong>two oars</strong>; in <strong>sweep</strong> rowing each rower has <strong>one</strong>. A <strong>coxswain</strong> (cox) steers some boats. The standard race is <strong>2,000 m</strong> on a straight course with lanes."
            source: "wr-rules,wr-la28"
          - table:
              caption: "Olympic boat classes at LA28 (same for men and women)"
              head: ["Boat", "Code", "Rowers"]
              rows:
                - ["Single sculls", "1x", "1 (two oars)"]
                - ["Double sculls", "2x", "2"]
                - ["Quadruple sculls", "4x", "4"]
                - ["Pair", "2-", "2 (one oar each, no cox)"]
                - ["Four", "4-", "4 (no cox)"]
                - ["Eight", "8+", "8 + cox"]
            source: wr-la28
          - list:
              - "<strong>Coastal rowing / beach sprints</strong> are new at LA28: men's and women's <strong>solo</strong> and a <strong>mixed double sculls</strong>, 32 rowers per gender, at most one man and one woman per country."
              - "World Rowing also has a <strong>lightweight</strong> category (men's crews average 70 kg, no rower over 72.5 kg; women's crews average 57 kg, no rower over 59 kg), but lightweight is <strong>not</strong> on the LA28 programme."
            source: "wr-coastal28,wr-rules,wr-la28"
      - id: recognition
        nav: "Recognition"
        eyebrow: "Institutional &amp; global recognition"
        heading: "Olympics, Asian Games — and the cash that follows"
        parts:
          - table:
              caption: "LA28 Olympic rowing — how boats qualify"
              head: ["Route", "What it gives"]
              rows:
                - ["<strong>2027 World Rowing Championships</strong>, Lucerne", "Most places — e.g. the top 10 boats in single sculls"]
                - ["<strong>Asia/Oceania Continental Qualification Regatta</strong>", "<strong>5 men's and 5 women's single sculls</strong> (no other boat classes)"]
                - ["Final Qualification Regatta", "The last places in each boat class"]
                - ["Host and universality", "1 + 1 per gender (single sculls)"]
            source: wr-la28
          - list:
              - "Boats qualified at the 2027 Worlds belong to the <strong>country</strong> — it may send different rowers. Boats qualified at continental or final regattas must be raced by the <strong>same rowers</strong> in the same event."
            source: wr-la28
          - list:
              - "<strong>Asian Games 2026</strong>: <strong>Satnam Singh and Salman Khan</strong> won <strong>bronze</strong> in the men's double sculls."
            source: air-ag26-row
          - table:
              caption: "Government cash award for a senior rowing medal (₹ lakh)"
              head: ["Event", "Gold", "Silver", "Bronze"]
              rows:
                - ["<strong>Olympic Games</strong>", "75", "50", "30"]
                - ["Asian Games / Commonwealth Games", "30", "20", "10"]
                - ["World Rowing Championship (every year)", "10", "7", "4"]
                - ["Asian Championship (every year)", "3.75", "2.5", "1.25"]
            source: myas-cash
      - id: eligibility
        nav: "Ages &amp; weights"
        eyebrow: "Physical benchmarks &amp; anti-doping"
        heading: "Age groups, cox weight and anti-doping"
        parts:
          - table:
              caption: "World Rowing age groups"
              head: ["Group", "Who"]
              rows:
                - ["Under 19", "Until 31 December of the year you turn <strong>18</strong>"]
                - ["Under 23", "Until 31 December of the year you turn <strong>22</strong>"]
                - ["Senior", "Open to all ages"]
                - ["Masters", "Age groups set for the World Rowing Masters Regatta"]
            source: wr-rules
          - list:
              - "A coxswain must weigh at least <strong>55.0 kg</strong> in racing kit and may carry up to <strong>15 kg</strong> of dead weight to reach it."
              - "There is also a <strong>Para rowing</strong> category for seniors."
            source: wr-rules
          - list:
              - "Under the anti-doping code you must be <strong>available for testing</strong> and check every medicine against the <strong>Prohibited List</strong>; apply to NADA for a <strong>TUE</strong> if you need a banned medicine."
            source: nada-rr
      - id: roadmap
        nav: "Roadmap"
        eyebrow: "Grassroots-to-elite residential pipeline"
        heading: "From the first boat to the national camp"
        parts:
          - table:
              caption: "The rowing ladder"
              head: ["Step", "Age", "What happens"]
              rows:
                - ["1. Learn on water", "Teens", "Rowing clubs, state associations and SAI centres teach sculling and sweep"]
                - ["2. SAI Training Centre", "12–18", "Up to 8th at Sub-Junior/Junior Nationals, or top 3 in the state, plus a battery of tests"]
                - ["3. SAI NCOE", "Scouted", "Residential rowing at Alappuzha (Alleppey) or Jagatpur"]
                - ["4. Under 19 / Under 23", "To 18 / to 22", "World Rowing U19 and U23 Championships"]
                - ["5. Senior national camp", "Senior", "Asian Championships, Asian Games, 2027 Worlds and the Asia/Oceania Olympic regatta"]
            source: "sai-schemes,wr-rules,wr-la28"
      - id: academies
        nav: "Centres"
        eyebrow: "Top elite academies &amp; cities"
        heading: "Where India's rowers train"
        parts:
          - table:
              caption: "SAI National Centres of Excellence with rowing"
              head: ["Centre", "Other sports there"]
              rows:
                - ["<strong>Alappuzha (Alleppey)</strong>, Kerala", "Kayaking &amp; canoeing"]
                - ["<strong>Jagatpur</strong>, Odisha", "Kayaking &amp; canoeing"]
            source: sai-schemes
          - note: "Rowing is one of SAI's <strong>13 priority sports</strong> and is taught at SAI Training Centres (ages 12–18)."
            source: sai-schemes
      - id: costs
        nav: "Boats &amp; cost"
        eyebrow: "Equipment costs &amp; who pays"
        heading: "Boats, oars and who pays"
        parts:
          - list:
              - "Racing boats and oars are expensive and need water, a boathouse and a coach boat — which is why most rowers train at SAI or club centres that own the fleet. Education Margdarshan does not print shop prices — no governing body publishes them."
            source: sai-schemes
          - table:
              caption: "Who pays — rowing ladder"
              head: ["Stage", "Paid by", "What you get"]
              rows:
                - ["SAI centre trainee", "Sports Authority of India", "Coaching, boarding, sports science, diet"]
                - ["Khelo India athlete", "Ministry of Youth Affairs &amp; Sports", "<strong>₹6.28 lakh a year</strong> incl. ₹1.20 lakh cash"]
                - ["Olympic prospect", "TOPS Core Group", "<strong>₹50,000 a month</strong> + approved training plan"]
                - ["Athlete in hardship", "PDU National Welfare Fund", "Up to ₹2.50 lakh"]
            source: "sai-schemes,pib-support"
      - id: earnings
        nav: "Earnings &amp; jobs"
        eyebrow: "Earning channels &amp; central job quotas"
        heading: "CRPF and other sports-quota jobs"
        parts:
          - list:
              - "<strong>CRPF's 2026 sports quota</strong> listed <strong>rowing</strong> among its water sports, with <strong>7 rowing posts</strong> for men and women (plus kayaking and canoeing posts)."
            source: crpf26
          - list:
              - "Rowing is one of the <strong>65 sports</strong> in the central sports quota for <strong>Group C</strong> posts, with up to 5 years' age relaxation (10 for SC/ST)."
              - "Medals at the Olympics, Asian Games, Commonwealth Games or World Championships can bring up to <strong>three out-of-turn promotions</strong>."
            source: dopt-2022
          - list:
              - "<strong>Pension to Meritorious Sportspersons</strong>: ₹12,000–20,000 a month after retirement."
            source: pib-support
      - id: traps
        nav: "Red flags"
        eyebrow: "Disqualification traps"
        heading: "Mistakes that cost rowers"
        parts:
          - list:
              - "<strong>False starts</strong> — a crew that starts rowing and crosses the line before the start command gets a <strong>yellow card</strong>; two yellow cards in the same race mean a <strong>red card</strong>."
              - "<strong>Ageing out</strong> — U19 ends on 31 December of the year you turn 18; plan the move to U23."
              - "<strong>Changing crew</strong> after a continental or final-regatta qualification — those boats must be raced by the same rowers at LA28."
            source: "wr-rules,wr-la28"
      - id: doubts
        nav: "Player doubts"
        eyebrow: "Real-world player doubts"
        heading: "Late start, Olympics, jobs and money — straight answers"
        parts:
          - qa:
              q: "I never rowed in school. Can I start at 16 or 18?"
              a: "Yes — seniors are open to all ages, and U23 runs to the year you turn 22. SAI Training Centres take ages <strong>12–18</strong>, and the NCOEs at Alappuzha and Jagatpur train rowers in residence. The real clock is the job deadline: Railways sports quota stops at <strong>25</strong> and CRPF at <strong>23</strong> (28 for an unreserved sportsperson after relaxation)."
            source: "wr-rules,sai-schemes,rrc-wr26,crpf26"
          - qa:
              q: "What is India's most realistic route to LA28?"
              a: "The <strong>Asia/Oceania Olympic regatta</strong> offers <strong>5 men's and 5 women's single-scull</strong> places; crew boats mostly qualify at the <strong>2027 World Championships</strong>. So a strong single sculler is the most direct path."
            source: wr-la28
          - qa:
              q: "Which government jobs can rowing get me?"
              a: "<strong>CRPF's 2026 sports quota</strong> had 7 rowing posts. DoPT lists rowing for central <strong>Group C</strong> posts. Western Railway's 2026-27 notice had <strong>no rowing posts</strong> — each zone advertises only the events its team needs."
            source: "crpf26,dopt-2022,rrc-wr26"
          - table:
              caption: "Sports-quota job routes open in 2026 — age, qualifying results, pay"
              head: ["Route", "Age", "Main qualifying results", "Pay level"]
              rows:
                - ["Railways <strong>Level 5/4</strong> (graduates)", "18–25 on 1 Jan 2027", "Played the <strong>Olympics</strong>, or top 3 at a World Cup, World Championship, Asian Games, Commonwealth Games or Youth Olympics", "Level 5/4"]
                - ["Railways <strong>Level 3/2</strong> (12th, or 10th + apprenticeship)", "18–25 on 1 Jan 2027", "Top 3 at <strong>Senior, Youth or Junior Nationals</strong>, National Games or All India Inter-University; or Federation Cup gold", "Level 3/2"]
                - ["Railways <strong>Level 1</strong>", "18–25 on 1 Jan 2027", "Played for your state and finished <strong>at least 8th at Senior Nationals</strong>; or top 3 at the Federation Cup", "Level 1"]
                - ["CRPF <strong>Head Constable (GD)</strong> (10+2)", "18–23 on 1 Aug 2026; sportspersons get <strong>+5 years</strong> (OBC +8, SC/ST +10)", "Played for India; or top 3 for your state at Nationals or National Games; or <strong>gold/silver at Junior Nationals</strong>", "Level 4 · ₹25,500–81,100"]
                - ["CRPF <strong>Constable (GD)</strong> (10th pass)", "18–23 on 1 Aug 2026; sportspersons get <strong>+5 years</strong> (OBC +8, SC/ST +10)", "Played for your state at <strong>Senior or Junior Nationals</strong>; or top 3 at SGFI school nationals or Khelo India Games", "Level 3 · ₹21,700–69,100"]
            source: "rrc-wr26,crpf26"
          - note: "Railways count results from <strong>1 April 2024</strong>; CRPF counts the <strong>two years before 30 September 2026</strong>. Railways fee ₹500 (₹400 back if you attend the trial; ₹250, refunded in full on attending, for SC/ST, women, PwBD, minorities, ex-servicemen and EBC). CRPF fee ₹100 for UR/OBC/EWS men; free for women, SC, ST and ex-servicemen. CRPF picks sign a <strong>₹1 lakh bond to serve at least 3 years</strong>."
            source: "rrc-wr26,crpf26"
          - qa:
              q: "Does any 'national' certificate count for a job?"
              a: "No. Railways will <strong>not recruit on a certificate from a federation MoYAS did not recognise</strong> at the time of the championship, and CRPF counts only championships of MoYAS-recognised federations or the IOA's National Games."
            source: "rrc-wr26,crpf26"
