  # ---------------------------------------------------------------- NEET UG
  - slug: neet-ug
    short: "NEET UG"
    stream: medical
    body: "National Testing Agency (NTA)"
    eyebrow: "Entrance Exam · Medical · 2026 cycle"
    title: "NEET UG — eligibility, marking, reservation & fees"
    lede: "The single national entrance for MBBS, BDS, BAMS, BUMS, BSMS and BHMS in every medical institution in India, including AIIMS and JIPMER."
    coaching_href: "coaching-neet.html"
    colleges_href: "colleges-mbbs.html"
    facts:
      - { label: "Conducted by", value: "National Testing Agency (NTA)", source: neet-ib }
      - { label: "Mode", value: "Pen and paper, one shift", source: neet-ib }
      - { label: "Paper", value: "180 questions · 720 marks · 3 hours", source: neet-ib }
      - { label: "2026 exam", value: "Re-held on Sun 21 June 2026", source: neet-re }
    official:
      - { label: "neet.nta.nic.in", url: "https://neet.nta.nic.in/" }
      - { label: "Information Bulletin 2026 (PDF)", url: "https://cdnbbsr.s3waas.gov.in/s37bc1ec1d9c3426357e69acd5bf320061/uploads/2026/02/202602231394640855.pdf" }
    sections:
      - id: overview
        nav: "Overview"
        eyebrow: "Overview &amp; governing bodies"
        heading: "Who runs NEET UG, and what it decides"
        parts:
          - p: "NEET (UG) is required by <strong>Section 14 of the National Medical Commission Act, 2019</strong> (and the matching sections of the NCISM Act, 2020 and NCH Act, 2020) as the one uniform entrance for undergraduate medical courses in all medical institutions. <strong>NTA</strong> has conducted it since 2019. It has also been the entrance for MBBS at AIIMS and JIPMER since 2020."
            source: neet-ib
          - list:
              - "Courses: MBBS, BDS, BAMS, BUMS, BSMS and BHMS."
              - "NEET (UG) results are also used for B.Sc. (Hons) Nursing and for BVSc &amp; AH seats under the 15% VCI quota."
              - "NTA conducts the exam, declares the result and issues the All India Rank. Merit lists, domicile and counselling belong to the admitting and state authorities."
              - "Counselling: the <strong>Medical Counselling Committee (MCC)</strong> for the 15% All India Quota in MBBS/BDS; <strong>AACCC</strong> for the All India Quota in BAMS/BUMS/BSMS and BHMS; state authorities for state quotas."
            source: neet-res
          - table:
              caption: "NEET (UG) 2026 calendar"
              head: ["Event", "Date"]
              rows:
                - ["Online application", "8 Feb – 8 Mar 2026"]
                - ["Correction window", "10 – 12 Mar 2026"]
                - ["Exam as first scheduled", "Sun 3 May 2026, 2:00 – 5:00 PM"]
            source: neet-ib
          - p: "NTA then held a <strong>re-examination on Sunday 21 June 2026</strong> (2:00 – 5:15 PM including formalities), in pen-and-paper mode in 13 languages, with no fee charged to candidates (public notice of 15 May 2026)."
            source: neet-re
          - p: "The result came on <strong>16 July 2026</strong>: close to 20 lakh candidates appeared at 5,440 centres and 11.21 lakh qualified."
            source: neet-res
          - warn: "The NEET (UG) 2027 Information Bulletin was not yet published on 14 October 2026, so this page describes the 2026 cycle."
      - id: eligibility
        nav: "Eligibility"
        eyebrow: "Eligibility criteria"
        heading: "Age, subjects and the qualifying percentile"
        parts:
          - list:
              - "<strong>Minimum age:</strong> 17 years on or before 31 December of the exam year — for NEET 2026, born on or before 31 December 2009."
              - "<strong>No upper age limit</strong> (NMC letter of 9 March 2022), and the bulletin sets no cap on the number of attempts."
              - "<strong>Subjects:</strong> Physics, Chemistry, Biology/Biotechnology and English in Class 12 (or equivalent). Since NMC's November 2023 public notice, students who studied these as additional subjects after Class 12 from a recognised board may also sit."
              - "Students whose Class 12 result is awaited can sit, but cannot be admitted unless they have passed by the first counselling round."
              - "Indian citizens and OCI holders who want to study medicine abroad must also qualify NEET (UG)."
            source: neet-ib
          - table:
              caption: "Qualifying percentile for admission (marks at or above this percentile)"
              head: ["Category", "Minimum percentile"]
              rows:
                - ["General, Gen-EWS", "50th"]
                - ["SC, ST, OBC", "40th"]
                - ["PwBD — General / Gen-EWS", "45th"]
                - ["PwBD — SC / ST / OBC-NCL", "40th"]
            source: neet-ib
          - note: "The Central Government, with NMC and the other councils, may lower these percentiles for a year if too few candidates qualify."
            source: neet-ib
      - id: scheme
        nav: "Exam scheme"
        eyebrow: "Exam scheme &amp; marking matrix"
        heading: "180 compulsory MCQs, +4 / −1"
        parts:
          - table:
              caption: "NEET (UG) 2026 pattern — pen and paper, 3 hours"
              head: ["Subject", "Questions", "Marks"]
              rows:
                - ["Physics", "45", "180"]
                - ["Chemistry", "45", "180"]
                - ["Biology (Botany &amp; Zoology)", "90", "360"]
                - ["Total", "180", "720"]
            source: neet-ib
          - table:
              caption: "Marking matrix"
              head: ["Response", "Marks"]
              rows:
                - ["Correct or most appropriate answer", "+4"]
                - ["Incorrect option", "−1"]
                - ["Unanswered", "0"]
            source: neet-ib
          - list:
              - "All 180 questions are compulsory — there are no optional questions (NMC letter of 5 December 2025)."
              - "Every question is an MCQ with four options and one correct or best answer. There is no numerical-value section."
              - "If more than one option is correct, +4 goes to anyone who marked a correct one; if a question is wrong or dropped, all candidates get +4."
              - "13 mediums: Assamese, Bengali, English, Gujarati, Hindi, Kannada, Malayalam, Marathi, Odia, Punjabi, Tamil, Telugu and Urdu."
              - "PwD/PwBD candidates with a physical limitation to write get one extra hour, whether or not they use a scribe."
            source: neet-ib
      - id: reservation
        nav: "Reservation"
        eyebrow: "Reservation thresholds"
        heading: "Central reservation — and why state seats differ"
        parts:
          - table:
              caption: "15% All India Quota, central institutes and central universities"
              head: ["Category", "Share of seats"]
              rows:
                - ["SC", "15%"]
                - ["ST", "7.5%"]
                - ["OBC-NCL (central list)", "27%"]
                - ["Gen-EWS", "10%"]
                - ["PwBD", "5% (horizontal)"]
            source: neet-ib
          - list:
              - "This applies to the 15% All India Quota, central institutes (ABVIMS &amp; RML, VMMC &amp; Safdarjung, ESIC), DU, AMU, BHU, AIIMS and JIPMER."
              - "<strong>State quota seats</strong> (and private colleges under state governments) follow the state's own reservation policy and eligibility rules."
              - "Creamy-layer OBC candidates, and OBCs not in the central list, should choose General."
            source: neet-ib
      - id: fees
        nav: "Registration &amp; fees"
        eyebrow: "Step-by-step registration &amp; form costs"
        heading: "How to apply, and what it costs"
        parts:
          - list:
              - "<strong>Step 1 — Register:</strong> on neet.nta.nic.in; create a password and security question and note the application number."
              - "<strong>Step 2 — Complete the form:</strong> personal details, question-paper medium, exam cities and education; take a live photograph and upload a passport photo taken after 1 January 2026, signature, left- and right-hand finger and thumb impressions, Class 10 marksheet and certificate, and category / PwBD certificates if they apply."
              - "<strong>Step 3 — Pay:</strong> online by card, net banking or UPI, by the last date (8 March 2026, 11:50 PM, for 2026)."
            source: neet-ib
          - table:
              caption: "NEET (UG) 2026 application fee"
              head: ["Category", "Centre in India", "Centre outside India"]
              rows:
                - ["General", "₹1,700", "₹9,500"]
                - ["Gen-EWS / OBC-NCL", "₹1,600", "₹9,500"]
                - ["SC / ST / PwBD / PwD / Third gender", "₹1,000", "₹9,500"]
            source: neet-ib
          - note: "Unlike JEE Main, the NEET fee does not change with gender."
            source: neet-ib
          - note: "No fee was charged for the 21 June 2026 re-examination."
            source: neet-re
      - id: horizons
        nav: "Careers &amp; institutions"
        eyebrow: "In-hand career horizons &amp; mapped institutions"
        heading: "Where a NEET rank takes you — and a doctor's government pay"
        parts:
          - list:
              - "<strong>Through MCC:</strong> 15% All India Quota MBBS/BDS seats in government colleges of the states; 100% MBBS at AIIMS; JIPMER, AMU, BHU, DU and IP University seats; ESIC seats; Deemed Universities; and B.Sc. Nursing at selected central institutes. MCC only registers candidates for AFMC."
              - "<strong>Through state authorities:</strong> the remaining state quota seats in government and private colleges."
            source: neet-ib
          - table:
              caption: "Government pay for MBBS doctors — UPSC Combined Medical Services Examination 2026"
              head: ["Post (2026 vacancies)", "Pay Matrix level", "Basic pay range"]
              rows:
                - ["Medical Officer, General Duty, Central Health Service (864)", "Level 10", "₹56,100 – ₹1,77,500 + NPA"]
                - ["Assistant Divisional Medical Officer, Railways (450)", "Level 10, Group A Junior Scale", "₹56,100 – ₹1,77,500 + NPA"]
                - ["General Duty Medical Officer, NDMC (14)", "Level 10", "₹56,100 – ₹1,77,500 + restricted NPA"]
                - ["General Duty Medical Officer Grade-II, MCD (30)", "Level 10, first cell", "Starts at ₹56,100 + NPA and allowances"]
            source: cms
          - table:
              caption: "Promotion ladder for an NDMC General Duty Medical Officer"
              head: ["Grade", "Pay Matrix level", "Range"]
              rows:
                - ["Senior Medical Officer", "Level 11", "₹67,700 – ₹2,08,700"]
                - ["Chief Medical Officer", "Level 12", "₹78,800 – ₹2,09,200"]
                - ["CMO (Non-functional Selection Grade)", "Level 13", "₹1,18,500 – ₹2,14,100"]
                - ["Senior Administrative Grade", "Level 14", "₹1,44,200 – ₹2,18,200"]
            source: cms
          - note: "These are basic pay ranges. In-hand pay also depends on allowances (DA, HRA, NPA) that change over time and are not stated as amounts in the notice. Private practice is not allowed in these posts."
            source: cms
          - links:
              - { label: "MBBS (Doctor)", url: "mbbs.html" }
              - { label: "BDS (Dentist)", url: "bds.html" }
              - { label: "BAMS", url: "bams.html" }
              - { label: "BHMS", url: "bhms.html" }
              - { label: "MBBS college finder", url: "colleges-mbbs.html" }
              - { label: "NEET coaching finder", url: "coaching-neet.html" }
              - { label: "UPSC CMS (government doctors)", url: "upsc-cms.html" }
    sources:
      - { id: neet-ib, name: "NTA — NEET (UG) 2026 Information Bulletin", url: "https://cdnbbsr.s3waas.gov.in/s37bc1ec1d9c3426357e69acd5bf320061/uploads/2026/02/202602231394640855.pdf", covers: "Legal basis, dates, pattern, marking, age, subjects, percentiles, reservation, steps, fees, MCC seats", checked: 2026-10-14 }
      - { id: neet-re, name: "NTA — Public notice: Conduct of re-examination for NEET (UG) 2026 (15 May 2026)", url: "https://cdnbbsr.s3waas.gov.in/s37bc1ec1d9c3426357e69acd5bf320061/uploads/2026/05/20260515960654684.pdf", covers: "21 June 2026 re-exam date, timing, mode, no fee", checked: 2026-10-14 }
      - { id: neet-res, name: "NTA — Press release: Result of NEET (UG) 2026 (16 July 2026)", url: "https://cdnbbsr.s3waas.gov.in/s37bc1ec1d9c3426357e69acd5bf320061/uploads/2026/07/20260716477215762.pdf", covers: "Result date, candidates appeared and qualified, counselling bodies, other courses using NEET", checked: 2026-10-14 }
      - { id: cms, name: "UPSC — Combined Medical Services Examination 2026, Notice No. 9/2026-CMS", url: "https://www.upsc.gov.in/sites/default/files/Notification-CMSE-2026-English-110326.pdf", covers: "2026 vacancies, Pay Matrix levels and promotion ladder for government doctors", checked: 2026-10-14 }

  # ---------------------------------------------------------------- UPSC ESE
  - slug: upsc-ese
    short: "UPSC ESE"
    stream: govt
    body: "Union Public Service Commission (UPSC)"
    eyebrow: "Recruitment Exam · Engineering Services · 2027 cycle"
    title: "UPSC ESE — eligibility, age limits, exam scheme & fees"
    lede: "The UPSC exam that recruits engineering graduates to Group A and Group B central services and posts — Railways, CPWD, telecom, defence engineering, water and power — in Civil, Mechanical, Electrical and Electronics &amp; Telecommunication."
    colleges_href: "colleges-btech.html"
    facts:
      - { label: "Conducted by", value: "UPSC · Rules by the Department of Telecommunications", source: ese27 }
      - { label: "Vacancies (2027)", value: "About 480, including 19 for PwBD", source: ese27 }
      - { label: "Exam dates", value: "Prelims 31 Jan 2027 · Mains 18 Jun 2027", source: ese27 }
      - { label: "Age on 1 Jan 2027", value: "21 to under 30 years (relaxations below)", source: ese27 }
    official:
      - { label: "ESE 2027 notice (PDF)", url: "https://www.upsc.gov.in/sites/default/files/Notif-ESEP-2027-Engl-160926.pdf" }
      - { label: "upsconline.nic.in", url: "https://upsconline.nic.in/" }
    sections:
      - id: overview
        nav: "Overview"
        eyebrow: "Overview &amp; governing authority"
        heading: "Who runs ESE, and which services it fills"
        parts:
          - p: "The Engineering Services Examination (ESE) is held by the <strong>Union Public Service Commission (UPSC)</strong> under the Rules of Engineering Services Examination, 2027, notified by the <strong>Department of Telecommunications, Ministry of Communications</strong> in the Gazette of India (Extraordinary) on 16 September 2026. The 2027 notice is Examination Notice No. 02/2027-ENGG."
            source: ese27
          - p: "Recruitment is in four engineering categories. A candidate applies for <strong>only one</strong> of them — Civil, Mechanical, Electrical, or Electronics &amp; Telecommunication."
            source: ese27
          - table:
              caption: "ESE 2027 calendar"
              head: ["Event", "Date"]
              rows:
                - ["Notification", "16 Sep 2026"]
                - ["Online application", "16 Sep – 6 Oct 2026 (till 6:00 PM)"]
                - ["Preliminary / Stage-I exam", "31 Jan 2027"]
                - ["Main / Stage-II exam", "18 Jun 2027"]
            source: ese27
          - list:
              - "<strong>Stage-I:</strong> Preliminary exam — two objective papers; it screens candidates for the Main exam."
              - "<strong>Stage-II:</strong> Main exam — two conventional (written-answer) papers in your engineering discipline."
              - "<strong>Stage-III:</strong> Personality Test / Interview."
              - "Marks from all three stages are added for the final rank."
            source: ese27
          - warn: "The ESE 2027 application window closed on 6 October 2026. If you missed it, the next window opens with the ESE 2028 notice on upsc.gov.in — UPSC can change dates, vacancies and the pattern in every notice."
      - id: eligibility
        nav: "Eligibility"
        eyebrow: "Academic eligibility"
        heading: "The degree you need to sit ESE"
        parts:
          - list:
              - "A <strong>degree in Engineering</strong> from a university set up by a Central or State Act, an institution set up by an Act of Parliament, or a deemed university under Section 3 of the UGC Act; or"
              - "Sections A and B of the Institution Examinations of the <strong>Institution of Engineers (India)</strong>; or"
              - "A degree/diploma in Engineering from a foreign university or institution recognised by the Government; or"
              - "Graduate Membership Examination of the IETE (India); Associate Membership Parts II and III / Sections A and B of the Aeronautical Society of India; or Graduate Membership of the Institution of Electronics and Radio Engineers, London (held after November 1959)."
            source: ese27
          - list:
              - "<strong>M.Sc. route (two services only):</strong> Indian Naval Armament Service (Electronics Engg. posts) and Indian Radio Regulatory Service Group A also accept an M.Sc. with Wireless Communication Electronics, Radio Physics or Radio Engineering (and, for IRRS, a Master's in Science with Physics and Radio Communication, Electronics or Telecommunication)."
              - "<strong>IETE / AeSI after 31 May 2013:</strong> degrees or certificates from these bodies taken by admission after 31.05.2013 are <strong>not</strong> admissible for ESE 2027. Institution of Engineers (India) admissions after that date are subject to a pending Government decision."
              - "<strong>Final-year students can apply.</strong> Proof of passing must be uploaded in a 10-day window after the Main result, or you cannot appear in the interview."
            source: ese27
          - p: "<strong>Nationality:</strong> a citizen of India, or a subject of Nepal or Bhutan, a Tibetan refugee who came before 1 January 1962, or a person of Indian origin who migrated from the listed countries to settle in India — the non-citizen groups need a Government eligibility certificate before an offer of appointment."
            source: ese27
          - note: "Physical and medical standards apply. Every finally recommended candidate has a medical examination, and its findings are binding for service allocation."
            source: ese27
      - id: scheme
        nav: "Exam scheme"
        eyebrow: "Exam scheme &amp; marking matrix"
        heading: "Three stages, 1,300 marks"
        parts:
          - table:
              caption: "ESE 2027 plan of examination (each discipline)"
              head: ["Stage", "Paper", "Type", "Duration", "Marks"]
              rows:
                - ["Stage-I Prelims", "Paper I — General Studies &amp; Engineering Aptitude", "Objective (MCQ)", "2 hours", "200"]
                - ["Stage-I Prelims", "Paper II — your engineering discipline", "Objective (MCQ)", "3 hours", "300"]
                - ["Stage-II Mains", "Paper I — your engineering discipline", "Conventional", "3 hours", "300"]
                - ["Stage-II Mains", "Paper II — your engineering discipline", "Conventional", "3 hours", "300"]
                - ["Stage-III", "Personality Test / Interview", "—", "—", "200"]
                - ["Total", "", "", "", "1,300"]
            source: ese27
          - table:
              caption: "Marking in the objective (Prelims) papers"
              head: ["Response", "Marks"]
              rows:
                - ["Correct answer", "Marks assigned to the question"]
                - ["Wrong answer", "One-third (0.33) of the question's marks deducted"]
                - ["More than one answer marked", "Treated as wrong — same penalty"]
                - ["Left blank", "0 (no penalty)"]
            source: ese27
          - list:
              - "About <strong>six to seven times</strong> the number of vacancies are called to the Main exam, on minimum qualifying marks in both Prelims papers."
              - "About <strong>twice</strong> the number of vacancies are called to the interview. The interview has <strong>no minimum qualifying marks</strong>."
              - "Conventional papers must be answered in English; question papers are set in English only."
            source: ese27
      - id: reservation
        nav: "Age &amp; relaxations"
        eyebrow: "Age limits &amp; category relaxations"
        heading: "21 to 30 on 1 January 2027, with fixed relaxations"
        parts:
          - p: "You must be at least <strong>21</strong> and must not have reached <strong>30</strong> on <strong>1 January 2027</strong> — born between <strong>2 January 1997 and 1 January 2006</strong>. Date of birth is taken only from the Matriculation / Secondary certificate or equivalent."
            source: ese27
          - table:
              caption: "Relaxation of the upper age limit (30 years)"
              head: ["Category", "Relaxation", "Highest upper limit"]
              rows:
                - ["SC / ST", "Up to 5 years", "35"]
                - ["OBC (eligible for reservation)", "Up to 3 years", "33"]
                - ["Defence personnel disabled in hostilities / disturbed areas and released", "Up to 3 years", "33"]
                - ["Ex-servicemen incl. Commissioned Officers and ECOs/SSCOs with 5 years' service by 1 Jan 2027", "Up to 5 years", "35"]
                - ["ECOs/SSCOs with extended assignment and an MoD certificate", "Up to 5 years", "35"]
                - ["PwBD (low vision, deaf and hard of hearing, locomotor, SLD, mental illness)", "Up to 10 years", "40"]
                - ["Government servants in the listed departments, applying for those departments' services", "Upper limit raised", "35"]
            source: ese27
          - list:
              - "SC, ST and OBC candidates who are also ex-servicemen or PwBD get the relaxations <strong>added together</strong>."
              - "Reservation for SC, ST, OBC, EWS and PwBD is as fixed by the Government. The caste must be on the Central list."
              - "OBC (Non-Creamy Layer) and EWS certificates must be issued on or after 1 April 2026 and by the closing date, 6 October 2026."
              - "The category cannot be changed after the application; a reserved candidate moves to unreserved only by qualifying every stage on the general standard."
            source: ese27
          - note: "Blindness: no ESE 2027 vacancy is identified for blind candidates, and UPSC advises them not to apply. Low-vision candidates may apply only for services that accept it."
            source: ese27
      - id: fees
        nav: "Application &amp; fees"
        eyebrow: "Application steps &amp; registration fee"
        heading: "Apply online at upsconline.nic.in — ₹200, many exempt"
        parts:
          - list:
              - "<strong>Step 1 — URN:</strong> create an account and the one-time Universal Registration Number (URN) profile, ideally with Aadhaar as ID."
              - "<strong>Step 2 — Common Application Form:</strong> upload a photograph and capture a live photograph; upload your signature signed three times on white paper in black ink."
              - "<strong>Step 3 — Exam-specific module:</strong> choose the engineering category and centre, pay the fee and submit. Each exam gives its own Application Number."
              - "No withdrawal and no change in any field after submission. Centre seats are first-apply-first-allot."
            source: ese27
          - table:
              caption: "ESE 2027 examination fee"
              head: ["Candidate", "Fee"]
              rows:
                - ["General, OBC and EWS (male)", "₹200"]
                - ["All female candidates", "Exempt (₹0)"]
                - ["SC / ST", "Exempt (₹0)"]
                - ["PwBD", "Exempt (₹0)"]
            source: ese27
          - note: "Pay by net banking, Visa / Master / RuPay credit or debit card, or UPI. OBC and EWS candidates get no fee exemption. The fee is not refunded or carried to another exam."
            source: ese27
      - id: horizons
        nav: "Pay &amp; cadre"
        eyebrow: "Pay scales &amp; cadre placement"
        heading: "Where an ESE rank places you"
        parts:
          - p: "Services are allotted strictly by <strong>merit rank, your preferences, the number of vacancies and medical fitness</strong>. Most services are Group A; a few posts (for example Junior Telecom Officer) are Group B."
            source: ese27
          - table:
              caption: "Some participating services in each ESE 2027 category"
              head: ["Category", "Services include"]
              rows:
                - ["Civil", "Central Engineering Service, CES (Roads), Central Water Engineering Service, Indian Railway Management Service (Civil), Indian Defence Service of Engineers, Survey of India"]
                - ["Mechanical", "IRMS (Mechanical), Indian Naval Armament Service, Defence Aeronautical Quality Assurance Service, Central Power Engineering Service, GSI Engineering Service"]
                - ["Electrical", "IRMS (Electrical), Central Electrical &amp; Mechanical Engineering Service, Central Power Engineering Service, Indian Naval Material Management Service"]
                - ["Electronics &amp; Telecom", "Indian Telecommunications Service Gr A, Indian Radio Regulatory Service Gr A, IRMS (Signal &amp; Telecommunication), Junior Telecom Officer Gr B"]
            source: ese27
          - p: "<strong>Pay benchmark (Indian Telecommunications Service):</strong> ESE 2024 candidates allotted to ITS were offered Assistant Divisional Engineer Telecom (Junior Time Scale, Group A) at <strong>Pay Matrix Level 10 — ₹56,100 to ₹1,77,500 plus allowances</strong> (7th CPC), with two years' probation and liability to serve anywhere in or outside India."
            source: dot-its
          - warn: "The ESE 2027 notice states no pay figure. The Level 10 figure above is from one service's official offer letter; other services set pay in their own rules, and Group B posts are not Group A scale. Non-Practising Allowance is a doctors' allowance, not part of ESE pay."
          - links:
