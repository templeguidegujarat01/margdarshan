# UK Edition — source registry. Every fact in _data/uk/careers/*.yml points here by id (source: <id>).
# Only official / primary sources: UK government (ONS, National Careers Service, GOV.UK), the regulators
# (SRA, BSB) and the professional bodies that award the qualification (ICAEW, ACCA, UCAS for admissions).
# accessed = the date the page was read and the facts copied (YYYY-MM-DD). scripts/check-uk-data.mjs
# fails on an unknown id, a missing url or a missing date.
#
# Pay figures are NOT typed anywhere: they come from _data/uk/ashe.json, built from the ONS ASHE
# download by scripts/build-ashe.mjs (see the header of that script).

ashe:
  year: 2025
  label: "ONS ASHE 2025 (provisional)"
  note: "ASHE counts employees only, so self-employed people (most barristers, many contractors) are not in these figures."

