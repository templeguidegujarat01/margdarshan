  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Is Civil Engineering a good career in 2026?"
            a: "Yes, and it's actually improving. India's ongoing infrastructure investment — highways, metro expansion, smart cities and railways — has driven real demand growth, and civil engineering is currently one of the better-paid branches for PSU/GATE roles specifically. JEE cutoffs for civil at several top IITs have also tightened noticeably in recent years, reflecting renewed student interest."
          - q: "What's the real salary difference between private and PSU jobs after Civil Engineering?"
            a: "Private-sector site engineer roles, especially at smaller contractors, often start modestly — commonly ₹3-6 LPA. PSU Graduate Engineer Trainee roles secured through GATE, particularly at Maharatna companies like ONGC and IOCL, are reported to start considerably higher, often in the ₹9-18 LPA range including allowances — among the strongest PSU fresher packages of any engineering branch."
          - q: "Do I need GATE for Civil Engineering government jobs?"
            a: "Not always. GATE is the main route into PSU jobs and M.Tech admissions, but exams like Staff Selection Commission (SSC) Junior Engineer (JE), State Public Service Commission (PSC) AE/JE and Railway Recruitment Board (RRB) JE (Railways) run their own independent selection process and don't require a GATE score. Diploma holders are also eligible for several of these, sometimes with an experience requirement."
          - q: "Is BIM necessary for civil engineers?"
            a: "It isn't compulsory, but it's increasingly one of the highest-value skills a civil engineer can add. Building Information Modeling (BIM) skills are reported to carry a genuine salary premium over generic site experience, and are especially valued for structural design, project management and large infrastructure roles."
          - q: "Can diploma holders get Civil Engineering government jobs?"
            a: "Yes. Many government exams, including SSC JE and RRB JE, are open to Diploma in Civil Engineering holders directly, sometimes alongside degree holders in the same exam. Diploma holders can also join a B.Tech/B.E. programme in the second year through most states' lateral entry route."
      - note: "Figures are indicative (2026) — confirm on the official college or authority website."
        class: "table-note mt-lg"
