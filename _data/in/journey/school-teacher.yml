    - { label: "Each paper", value: "150 MCQs · 150 marks · 2½ hours · no negative", source: ctet-ib }
    - { label: "Pass", value: "60%", source: ctet-ib }
    - { label: "Next CTET", value: "12–13 Dec 2026", source: ctet-dates }
  stages:
    head: ["Paper", "Sections", "Who takes it"]
    rows:
      - ["Paper I", "Child Development &amp; Pedagogy, Maths, Environmental Studies, Language I, Language II — 30 each", "Teachers for Classes 1–5"]
      - ["Paper II", "Child Development &amp; Pedagogy, Language I, Language II, and Maths &amp; Science or Social Studies", "Teachers for Classes 6–8"]
      - ["Both", "Take both papers", "Teachers for Classes 1–8"]
    source: ctet-ib
  notes:
    - text: "The CTET applies to central government schools (KVS, NVS, Central Tibetan Schools) and UT schools; private unaided schools may also accept it."
      source: ctet-ib
state_uses: [board, tet, psc, scholarship]
state_rules:
  - state: delhi
    text: "DSSSB recruits Delhi government teachers with <strong>CTET</strong>: Primary — Class 12 (50%) + D.El.Ed; TGT — subject degree (50%) + B.Ed; PGT — master's (50%) + B.Ed. Age up to 30. Pay Levels 6, 7 and 8."
    source: [d-0525, d-0625, d-1024]
    href: "state/delhi/dsssb.html"
  - state: rajasthan
    text: "BSER runs <strong>REET</strong>. The last one, REET-2024, was held on 27 February 2025 (fee ₹550 one level, ₹750 both); no REET 2026 notice was out when we checked."
    source: [reet-24, bser-site]
    href: "state/rajasthan/reet.html"
  - state: chhattisgarh
    text: "Assistant Teacher 2026: Higher Secondary with 50% + D.El.Ed (or B.El.Ed), <strong>and a TET pass</strong>; age 21–35 on 1 Jan 2026 (relaxations up to 45). The exam was moved to <strong>6 December 2026</strong> after a High Court order."
    source: [ls-advt, ls-oct]
    href: "state/chhattisgarh/vyapam.html"
  - state: west-bengal
    text: "WBSSC's 2nd SLST (2025) for Classes IX–X needs a degree or PG with 50% + B.Ed; Classes XI–XII need a PG with 50% + B.Ed. Age 21–40. You must have passed the language of the school's medium."
    source: ssc-at
    href: "state/west-bengal/wbssc.html"
  - text: "NCTE's minimum qualifications apply in every state. State government and aided schools use the state TET; central schools and UT schools use CTET."
    source: [ncte-mq11, ctet-ib]
