            text: "Big 4 US-practice teams and GCCs pay a premium over general accounting roles."
          - label: "Mid-career (3–5 yrs)"
            value: "₹18–30 LPA"
            text: "US tax advisory, FP&amp;A and international audit roles grow fastest."
          - label: "Senior / Leadership"
            value: "₹50 LPA–₹1 Cr+"
            text: "Finance Director, CFO-track and specialised advisory roles at the top end."
      - note: "CPAs who relocate to the US can expect roughly $60,000–$130,000+ depending on role and location — a meaningful jump, though it comes with its own visa and relocation considerations. CA + CPA dual-qualified professionals typically command the strongest premiums in Indian GCCs and Big 4 US-practice teams."
  - id: "jobs"
    hid: "jobs-heading"
    alt: true
    eyebrow: "Where CPAs work"
    heading: "Job profiles, recruiters & industries"
    parts:
