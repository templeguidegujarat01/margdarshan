  - id: "passing"
    hid: "passing-heading"
    eyebrow: "No fixed deadline"
    heading: "Passing criteria & membership levels"
    parts:
      - prose:
          - "IAI does not impose a fixed timeframe to complete the 13 subjects — you can take exams at whatever pace suits your circumstances, which is unusual among the courses. Progress is marked by three membership levels:"
          - list:
              - "<strong>Student membership</strong> — granted on clearing ACET."
              - "<strong>Associate (AIAI)</strong> — after clearing all 7 Core Principles + all 3 Core Practices subjects."
              - "<strong>Fellow (FIAI)</strong> — after clearing all 13 prescribed subjects (or approved exemptions) plus practical experience and professionalism seminar requirements."
            ticks: true
      - note_box: "The actuarial education model deliberately blends exams with real work — \"substantially, all education beyond CS, CM & CB takes place in the work environment itself,\" per IAI. Most students work as actuarial trainees while clearing later-stage subjects."
  - id: "fees"
    hid: "fees-heading"
    alt: true
    eyebrow: "Spread over years"
    heading: "Fees"
    parts:
      - prose:
          - "IAI's exam fees are charged per subject per attempt, alongside membership fees, so total cost depends heavily on how many attempts each subject takes. Across the full journey — ACET, all exam fees, membership fees and study materials — most candidates budget a realistic total of roughly <strong>₹3–5 lakh</strong> to reach Fellowship, spread across several years rather than paid upfront."
      - note: "Exact current per-subject fees change periodically — always check the official fee schedule on actuariesindia.org before budgeting, since this is one area where relying on third-party estimates can be genuinely misleading."
  - id: "difficulty"
    hid: "difficulty-heading"
    eyebrow: "Set expectations correctly"
    heading: "Difficulty & realistic duration"
    parts:
      - prose:
          - "This is widely regarded as one of the toughest professional qualifications in India — 13 rigorous, heavily quantitative subjects with no fixed timeline. Most candidates take roughly <strong>5–8 years</strong> from starting preparation to completing Fellowship, often while working full-time as an actuarial trainee or analyst. A meaningful share of candidates who clear the early Core Principles subjects choose to stop at Associate level rather than push through to Fellowship, and that's a genuinely viable, well-paid career stopping point too."
  - id: "salary"
    hid: "salary-heading"
    alt: true
    eyebrow: "Indicative figures"
    heading: "Actuarial salary in India"
    intro: "Pay rises sharply with each subject cleared, not just with years of experience — a distinctive feature of this profession."
