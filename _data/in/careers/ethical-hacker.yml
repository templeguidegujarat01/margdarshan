    heading: "Legal rules and industry standards"
    parts:
      - chips:
          - label: "IT Act, 2000"
            text: "Unauthorised access and damage to computer systems are offences."
            source: "itact"
          - label: "CERT-In empanelment"
            text: "CERT-In empanels auditing organisations for security audits."
            source: "certin"
          - label: "Private certifications"
            text: "Optional, from industry bodies; check how hands-on they are before paying."
          - label: "Bug bounties"
            text: "Company programmes that legally reward reported vulnerabilities."
