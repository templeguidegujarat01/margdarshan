  - id: "fees"
    hid: "fees-heading"
    eyebrow: "Affordable at government colleges"
    heading: "Fees & scholarships"
    parts:
      - prose:
          - "BA Psychology at government-funded colleges — total fees for the full 3-year course at a DU or central university college are typically in the range of <strong>₹15,000-60,000</strong>, well below professional or private-college courses. Private and deemed universities charge considerably more, often ₹1.5-4 lakh per year given high demand for the subject. Postgraduate clinical training (MA + M.Phil) adds significant further cost, particularly at private institutes. Merit-based, SC/ST and income-linked scholarships are available at most government institutions. Always confirm current fees directly on your target college's official admission page."
