          - "<strong>B.Tech CSE, Bachelor of Computer Applications (BCA), or any degree</strong> — helpful for formal job hunting, but not a strict requirement."
          - "<strong>Self-taught + a shipped app</strong> — genuinely viable; a real, published app in the Play Store or App Store carries real weight with employers."
