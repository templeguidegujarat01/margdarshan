  - { id: rci-ma, name: "Rehabilitation Council of India — Master of Arts in Clinical Psychology (RCI regulated): Guidelines &amp; Syllabus, effective 2025-26, in place of M.Phil (copy hosted by Gurugram University)", url: "https://gurugramuniversity.ac.in/academics/syllabus/utd/sosciedu/MA_Clinical_Psychology%20Guidelines_copy.pdf", covers: "4-year BA / B.Sc Psychology 55% (50% SC / ST), bridge route, entrance 70% + interview 30%, 2 years full time, 80% attendance, 4-year limit, trainee-to-faculty ratios, scheme of examination", checked: 2026-10-25 }
  - { id: rci-name, name: "Rehabilitation Council of India — Office Memorandum: Change of nomenclature of courses in Clinical / Rehabilitation Psychology (3 May 2026)", url: "https://cdnbbsr.s3waas.gov.in/s34f4eeef3a8c90dfceaddd5c6d64e4ebb/uploads/2026/05/202605111585522882.pdf", covers: "B.Clin.Psy and M.Clin.Psy names", checked: 2026-10-25 }
  - { id: rci-mphil, name: "Rehabilitation Council of India — Public Notice: Continuation of M.Phil Clinical Psychology for 2024-25 &amp; 2025-26, with UGC letters", url: "https://cdnbbsr.s3waas.gov.in/s34f4eeef3a8c90dfceaddd5c6d64e4ebb/uploads/2026/05/202605121269434903.pdf", covers: "M.Phil admissions only till 2025-26; new nomenclature from 2026-27", checked: 2026-10-25 }
  - { id: rci-bsc, name: "Rehabilitation Council of India — Public Notice: Launching of B.Sc Clinical Psychology (Hons), with course document", url: "https://cdnbbsr.s3waas.gov.in/s34f4eeef3a8c90dfceaddd5c6d64e4ebb/uploads/2026/05/202605121753364959.pdf", covers: "4-year regular course, no midway exit or online mode, Class 12 science + entrance test, licensure as Clinical Assistant (Clinical Psychology) with a separate CRR category", checked: 2026-10-25 }
  - { id: rci-bsc-n, name: "Rehabilitation Council of India — Notification for B.Sc Clinical Psychology (Hons)", url: "https://cdnbbsr.s3waas.gov.in/s34f4eeef3a8c90dfceaddd5c6d64e4ebb/uploads/2026/05/20260512112805192.pdf", covers: "programme details, start from 2024-25, may not be run without RCI approval", checked: 2026-10-25 }
