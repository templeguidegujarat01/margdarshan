    source: [neet-ib, crmi, npg26, pgmer23]
state_rules:
  - { text: "National route: NEET (UG), NEET-PG, INI-CET and NMC's PGMER 2023 apply across India. State quota seats are filled by each state's counselling authority.", source: [neet-ib, npg26, pgmer23] }
