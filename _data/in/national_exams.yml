    sections:
      - id: overview
        nav: "Overview"
        eyebrow: "Overview &amp; governing bodies"
        heading: "Seven IISERs, one test"
        parts:
          - p: "The IISERs at <strong>Berhampur, Bhopal, Kolkata, Mohali, Pune, Thiruvananthapuram and Tirupati</strong> are autonomous institutes under the Ministry of Education. For 2026 all their admissions were made only through the <strong>IISER Aptitude Test (IAT) 2026</strong>, run by a Joint Admissions Committee chaired from IISER Berhampur."
            source: iat-ib
          - list:
              - "<strong>5-year BS-MS (dual degree)</strong> in the natural sciences at all seven IISERs, and in Computational &amp; Data Sciences at IISER Kolkata."
              - "<strong>4-year BS</strong> in Economic Sciences (IISER Bhopal) and in Economic &amp; Statistical Sciences (IISER Tirupati)."
              - "<strong>4-year B.Tech</strong> in Chemical Engineering, Data Science &amp; Engineering and Electrical Engineering &amp; Computer Science (IISER Bhopal)."
            source: iat-ib
          - table:
              caption: "IAT 2026 dates"
              head: ["Event", "Date"]
              rows:
                - ["Application", "5 Mar – 13 Apr 2026"]
                - ["Form correction", "16 – 18 Apr 2026"]
                - ["Hall ticket", "24 May 2026"]
                - ["IAT (computer-based)", "Sunday 7 Jun 2026, 9:00 am"]
                - ["Class 12 marksheet upload deadline", "21 Jun 2026"]
            source: iat-ib
          - warn: "The IAT 2027 brochure was not out on 15 October 2026. The brochure calls IAT the only channel of admission to the IISERs."
            source: iat-ib
      - id: eligibility
        nav: "Eligibility"
        eyebrow: "Strict academic eligibility"
        heading: "60% in Class 12 — counted over all subjects"
        parts:
          - list:
              - "<strong>Qualifying exam:</strong> Class 12 from a COBSE-recognised board, or a diploma of at least 3 years (AICTE / COBSE / state technical board), passed in 2024, 2025 or 2026, or appearing in 2026."
              - "Those who passed in 2023 or earlier cannot apply. The passing year is when you were first declared 'pass'; improvement attempts do not reset it."
              - "<strong>Marks:</strong> at least <strong>60% aggregate</strong> (55% for SC, ST and PwD), worked out over <strong>all</strong> subjects of the qualifying exam."
              - "<strong>Subjects:</strong> BS-MS needs at least three of Biology, Chemistry, Mathematics and Physics; Mathematics is compulsory for Computational &amp; Data Sciences (Kolkata), all B.Tech and BS Economic Sciences (Bhopal), and BS Economic &amp; Statistical Sciences (Tirupati)."
              - "Open to Indian nationals, OCI/PIO holders and foreign nationals (OCI/PIO and foreign nationals compete for unreserved seats)."
            source: iat-ib
      - id: scheme
        nav: "Exam scheme"
        eyebrow: "Exam scheme &amp; marking matrix"
        heading: "15 questions from each science"
        parts:
          - table:
