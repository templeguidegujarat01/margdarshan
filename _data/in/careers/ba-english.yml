  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What is BA English?"
    parts:
      - overview:
          points:
            - "BA English is a 3-year undergraduate degree (4 years for Honours with Research under National Education Policy (NEP) 2020) that studies literature written in English — from Shakespeare and Romantic poetry to postcolonial and contemporary Indian writing in English — alongside literary theory and criticism."
            - "The degree trains close reading, textual analysis and above all, structured, persuasive writing, which is why it feeds so naturally into publishing, media, teaching and competitive exams."
            - "It's offered widely across Indian universities."
          more:
            - "Delhi University colleges — <strong>Lady Shri Ram College, Hindu College and St. Stephen's</strong> — are among the most competitive destinations, alongside Jadavpur University, Presidency University Kolkata, and St. Xavier's College Mumbai, under the University Grants Commission (UGC) framework."
  - id: "who"
    hid: "who-heading"
    alt: true
    eyebrow: "Fit check"
    heading: "Who should choose BA English"
    parts:
      - fit:
          match:
            - "Genuinely enjoy reading widely and writing about what you've read, not just occasionally for school."
            - "Are considering publishing, content, journalism, teaching or Union Public Service Commission (UPSC), where strong writing is a genuine advantage."
            - "Are comfortable analysing texts critically, not just summarising plot or \"liking\" a book."
          mismatch:
            - "Dislike heavy reading loads — university-level literary study involves substantially more reading than school English."
            - "Want a degree with a fixed, direct pipeline into campus placements straight after graduation."
            - "Are choosing it because you \"like reading novels casually\" without expecting rigorous academic analysis and theory alongside it."
  - id: "eligibility"
    hid: "elig-heading"
    eyebrow: "Eligibility"
    heading: "Who can apply for BA English"
    parts:
      - elig_list:
          - "Class 12 pass (10+2) from a recognised board, typically <strong>45-55% aggregate</strong> with a good score in English specifically, varying by university."
          - "Open to students from any stream — Arts, Commerce or Science — since no specific Class 12 subject beyond English itself is compulsory."
          - "Most schools don't teach English Literature as a separate subject, so nearly all students start serious literary study fresh at university."
