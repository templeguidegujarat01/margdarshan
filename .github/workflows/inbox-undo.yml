# Inbox undo — the owner's undo button for one upload (docs/free-claude/README.md, "Galti ho jaaye to").
# Actions tab → "Inbox undo" → Run workflow → type the upload name (e.g. ca-coaching--kerala) → Run.
# scripts/inbox-undo.mjs removes that upload's rows (marked blocks in scripts/learn-src/local/), then the site is
# rebuilt, checked and committed exactly like an inbox build. If a check fails nothing is committed.
name: Inbox undo

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Upload to take off the site (name from inbox/done/, e.g. ca-coaching--kerala)'
        required: true

permissions:
  contents: write
  pages: write

concurrency:
  group: inbox-build
  cancel-in-progress: false

jobs:
  undo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install js-yaml + liquidjs
        run: npm install --prefix "$RUNNER_TEMP/deps" --no-save --no-audit --no-fund js-yaml@4 liquidjs@10
      - name: Remove the upload's rows
        env:
          VERIFY_DEPS: ${{ runner.temp }}/deps
          UNDO_NAME: ${{ inputs.name }}
        run: node scripts/inbox-undo.mjs "$UNDO_NAME"
      - name: Rebuild finders, pages, menu
        env:
          VERIFY_DEPS: ${{ runner.temp }}/deps
        run: node scripts/rebuild-learn.mjs
      - name: Safety checks (nothing is committed if one fails)
        env:
          VERIFY_DEPS: ${{ runner.temp }}/deps
        run: |
          node scripts/build-learn-finders.mjs --check
          node scripts/build-seo-landings.mjs --check
          node scripts/build-nav-mega.mjs --check
          node scripts/check-in-data.mjs
          node scripts/verify-site.mjs --only=learn/
      - name: Commit
        env:
          UNDO_NAME: ${{ inputs.name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Inbox undo: $UNDO_NAME"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Ask GitHub Pages to rebuild
        continue-on-error: true
        run: |
          curl -fsS -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/pages/builds"
