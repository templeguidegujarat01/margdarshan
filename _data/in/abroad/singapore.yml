# Singapore — study abroad sheet (shape: _data/in/abroad_common.yml header). Read 2026-10-29 (ICA, MOM, MOE, A*STAR).
id: singapore
name: Singapore
short: Singapore
region: Asia
currency: SGD
checked: 2026-10-29
review_by: 2027-01-29
status: open
eyebrow: "Study abroad · Asia"
title: "Study in Singapore from India"
seo_title: "Study in Singapore from India: Student's Pass, TG and EP"
description: "Singapore Student's Pass from India: S$45 fee, 16 work hours a week, the MOE Tuition Grant's 3-year bond, a graduate job-search LTVP and the S$5,600 Employment Pass floor."
lede: "Singapore has no separate post-study work visa. Students hold a Student's Pass issued by ICA; after graduating, the route is a job and an Employment Pass, with a job-search pass available to graduates of local institutions."
facts:
  - { label: "Student's Pass", value: "S$45 processing fee", source: ica_ihl }
  - { label: "Processing", value: "1 week (2 weeks if a visa is needed)", source: ica_ihl }
  - { label: "Work in term", value: "Up to 16 hours a week (approved institutions)", source: mom_students }
  - { label: "Employment Pass floor", value: "S$5,600 a month (S$6,000 from 2027)", source: mom_ep }
card:
  line: "Student's Pass via ICA; no post-study visa, EP route"
  psw: "Job-search LTVP; then EP"
  work: "16 h/week in term"
  funds: "Shown to ICA in the form"
tests:
  - { exam: ielts, need: "Set by each university for admission", source: ica_ihl }
pillars:
  language_and_eligibility:
    heading: "Admission and the Student's Pass"
    parts:
      - points:
          - { t: "You must apply for a Student's Pass if you are accepted as a full-time student at an approved Institute of Higher Learning (local universities, polytechnics and listed offshore institutes).", source: ica_ihl }
          - { t: "The application asks about your education, employment history and financial support, and your family's details.", source: ica_ihl }
  intakes_and_streams:
    heading: "Courses and the Tuition Grant choice"
    parts:
      - points:
          - { t: "International students in selected full-time diploma and undergraduate courses can take the MOE Tuition Grant and pay subsidised fees.", source: moe_tg }
          - { t: "In return, international students owe a 3-year bond: work full time for a Singapore entity after graduating.", source: moe_bond }
      - note: "University terms mostly start in August; check each university's admission calendar."
  tuition_and_living_costs:
    heading: "Fees"
    parts:
      - money:
          - { item: "Student's Pass processing fee", cur: SGD, amount: 45, per: "application", source: ica_ihl }
          - { item: "Multiple Journey Visa (if needed)", cur: SGD, amount: 30, per: "issue", source: ica_ihl }
          - { item: "Graduate LTVP issuance", cur: SGD, amount: 60, per: "issue", source: ica_ltvp }
          - { item: "Employment Pass minimum salary (most sectors)", cur: SGD, amount: 5600, per: "month", source: mom_ep }
      - note: "Tuition with and without the Tuition Grant is published by each institution."
        source: moe_tg
  global_scholarships:
    heading: "Funding"
    parts:
      - awards:
          - { name: "MOE Tuition Grant", by: "Ministry of Education, Singapore", who: "International students in selected full-time diploma and undergraduate courses", gives: "Subsidised tuition; 3-year Singapore work bond", url: "https://www.moe.gov.sg/financial-matters/tuition-grant-scheme/overview", source: moe_tg }
          - { name: "Singapore International Graduate Award (SINGA)", by: "A*STAR with NUS, NTU, SUTD and SMU", who: "International students for a full-time PhD in Singapore", gives: "PhD funding at a partner university", url: "https://www.a-star.edu.sg/scholarships", source: astar }
  application_funnel:
    heading: "From admission to the Student's Pass"
    parts:
      - steps:
          - { title: "Registration letter", text: "Get the Registration Acknowledgement Letter from your institution.", source: ica_ihl }
          - { title: "Apply online to ICA", text: "Pay S$45; processing about 1 week (2 if a visa is needed).", source: ica_ihl }
          - { title: "In-Principle Approval", text: "Complete the tasks, acknowledge the terms and do a medical exam if required.", source: ica_issue }
          - { title: "Travel and formalities", text: "Arrive no more than 1 month before the course; enrol biometrics and download your digital pass.", source: ica_issue }
  visa_chokepoints:
    heading: "The Student's Pass in short"
    parts:
      - points:
          - { t: "Errors in the online entries can affect processing and the documents issued.", source: ica_issue }
          - { t: "Working illegally on a Student's Pass can lead to a fine of up to S$20,000, jail of up to two years, or both.", source: mom_students }
  post_study_work:
    heading: "Work during and after your course"
    parts:
      - points:
          - { t: "Full-time students at approved institutions may work up to 16 hours a week in term, or do a required/credit-bearing internship; full-time work is allowed in vacations. Exchange students may not work.", source: mom_students }
          - { t: "Graduates of an Institute of Higher Learning can apply for a Long-Term Visit Pass to seek employment (S$45 application, S$60 issuance).", source: ica_ltvp }
          - { t: "Employment Pass: at least S$5,600 a month for most sectors (S$6,200 in financial services), higher with age, plus the COMPASS points test; it rises to S$6,000 for new applications from 1 January 2027.", source: mom_ep }
visa:
  slug: singapore-students-pass
  name: "Singapore Student's Pass"
  short: "Student's Pass"
  seo_title: "Singapore Student's Pass from India: Fees, IPA, Steps"
  description: "Singapore Student's Pass for Indian students: ICA online application, S$45 fee, In-Principle Approval, medical exam, biometrics and the digital pass."
  lede: "The Student's Pass is issued by ICA after your institution registers you. Approval comes as an In-Principle Approval (IPA) letter that you show on arrival."
  facts:
    - { label: "Fee", value: "S$45", source: ica_ihl }
    - { label: "Processing", value: "1 week; 2 with a visa", source: ica_ihl }
    - { label: "Arrive", value: "Not more than 1 month before the course", source: ica_issue }
    - { label: "Pass format", value: "Digital, via FileSG", source: ica_issue }
  official:
    - { label: "ICA — Student's Pass (Institutes of Higher Learning)", url: "https://www.ica.gov.sg/information-and-e-services/long-term-visit-and-study/student-s-pass/student's-pass-application-renewal/institutes-of-higher-learning" }
    - { label: "MOM — Work for foreign students", url: "https://www.mom.gov.sg/passes-and-permits/work-pass-exemption-for-foreign-students" }
  sections:
    - id: steps
      nav: Steps
      eyebrow: "Order of work"
      heading: "Step by step"
      parts:
        - steps:
            - { title: "Apply online", text: "With the registration letter, passport, personal, education, employment and financial details.", source: ica_ihl }
            - { title: "IPA letter", text: "Includes your entry visa if you need one; show it at the checkpoint.", source: ica_issue }
            - { title: "Medical and tasks", text: "Complete the e-Service tasks and a medical exam if required.", source: ica_issue }
            - { title: "Pay issuance fees and formalities", text: "Biometrics in person if told to; download the digital pass.", source: ica_issue }
    - id: chokepoints
      nav: "Common problems"
      eyebrow: "Where files go wrong"
      heading: "Choke points to check twice"
      parts:
        - points:
            - { t: "Arriving more than 1 month before the course, or letting the visit pass expire before formalities.", source: ica_issue }
            - { t: "Digitally enhanced photos or patterned contact lenses at biometrics.", source: ica_issue }
            - { t: "Working more than 16 hours a week in term.", source: mom_students }
doubts:
  - { q: "Is there a post-study work visa in Singapore?", a: "No separate post-study work visa. Graduates of an Institute of Higher Learning can apply for a Long-Term Visit Pass to look for a job, then need an Employment Pass or other work pass.", source: ica_ltvp }
  - { q: "How many hours can students work in Singapore?", a: "Up to 16 hours a week during term at an approved institution, plus required internships; full time during vacations.", source: mom_students }
  - { q: "What is the Tuition Grant bond in Singapore?", a: "International students who take the MOE Tuition Grant must work full time for a Singapore entity for 3 years after graduating.", source: moe_bond }
  - { q: "What salary is needed for a Singapore Employment Pass?", a: "At least 5,600 Singapore dollars a month for most sectors, more with age, plus the COMPASS test. New applications from 1 January 2027 need 6,000.", source: mom_ep }
