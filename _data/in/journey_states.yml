# journey_states — the 28 states and 8 union territories for journey-blueprint.html (state layer).
# Shared by every career, so a state's board and official portals are written once here instead of once per career.
#
# Rules:
#   - Every `url` was opened on the date in `checked` and its page title matched the body named. Portals that would
#     not open from our side were checked on a 2025–26 Wayback Machine capture instead (marked `via: wayback`).
#   - A body we could not open at all is left out and listed under `gaps` — never guessed.
#   - `bodies` roles: scholarship (state scholarship portal), psc (State Public Service Commission or the state's
#     main recruitment board), police (state police recruitment board, or the state police website when no separate
#     board was found), tech (state technical / professional admissions or entrance board), med (state-quota NEET
#     counselling for medical, dental and AYUSH seats), tet (state teacher eligibility test), admin (a UT
#     administration's own website, for UTs with no separate board or commission).
#     Careers name the roles they need in `state_uses`; the page prints only those.
#   - `board` is the state's own school board(s). UTs without one have none: their schools follow CBSE or a
#     neighbouring state's board.
#   - Career-specific state facts (quotas, seat counts, exam rules) are not here — they sit in each career's
#     `state_rules` in journey_matrix.yml with their own source.
#   - `legacy`: the old journey_matrix board id this state + board type maps to, so careers written before the
#     36-state picker keep their board notes (gseb, upmsp, msbshse, wb).
#   - scripts/check-journey-matrix.mjs checks ids, roles and https links.
checked: 2026-10-25

types:
  - { id: state, label: "My state's board" }
  - { id: cbse, label: "CBSE" }
  - { id: cisce, label: "CISCE (ICSE / ISC)" }
