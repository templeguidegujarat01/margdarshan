  - id: "fees"
    hid: "fees-heading"
    eyebrow: "Varies significantly by institute type"
    heading: "Fees & scholarships"
    parts:
      - prose:
          - "Government polytechnic fees for the diploma are generally the most affordable option, typically in the range of <strong>₹15,000-60,000</strong> for the full course. Private design institutes charge considerably more, often <strong>₹60,000-2 lakh per year</strong>, sometimes higher at institutes with strong industry reputations or metro-city locations. Budget additionally for drafting/model-making materials, a laptop capable of running design software, and software licenses (though many institutes provide lab access or student-edition licenses). Merit-based and income-linked scholarships are available at most government institutions. Always confirm current fees directly with your target institute's admission office."
