# Journey Blueprint — Government Mechanical Engineer (diploma / B.Tech → RRB JE, GATE PSU, UPSC ESE). Printed on journey-mechanical-engineer.html (_includes/journey-doubts.html).
# Rules, classes and the money items / sources several careers share: _data/in/journey_common.yml.
# This career has no money_defs / sources of its own: everything it cites is shared with the electrical engineer.
# Check: node scripts/check-journey-matrix.mjs
id: mechanical-engineer
v: 2
name: "Government Mechanical Engineer (RRB JE · GATE PSU · UPSC ESE)"
search: ["government mechanical engineer", "mechanical engineer", "mechanical engineering", "junior engineer mechanical", "rrb je mechanical", "ese mechanical", "psu mechanical engineer"]
page: "mechanical.html"
roadmap: "roadmaps/mechanical.html"
doubts_page: "journey-mechanical-engineer.html"
gate: "Class 10 → a 3-year polytechnic diploma, or Class 12 with Physics and Maths → JEE Main / state CET → B.E. / B.Tech Mechanical. Central jobs then come through three doors: Railway Junior Engineer (diploma or degree), PSU trainee posts through GATE (degree), and UPSC's Engineering Services (degree, Group A)."
gate_source: [jee-ib, jm-ib, rrb-je25, ntpc-eet27, ese27]
core:
  what:
    text: "Government mechanical engineers design, run and maintain machines, rolling stock, power plants and defence equipment. The Railways recruit Junior Engineers, PSUs such as NTPC hire graduate trainees through GATE, and UPSC's Engineering Services fill Group A and B mechanical posts in central services."
    source: [rrb-je25, ntpc-eet27, ese27]
  day:
    - "Inspect, maintain and repair machines, engines and plant."
    - "Plan production, workshop and maintenance schedules."
    - "Check quality and safety, and keep records for audits."
  pay:
    - { level: "Junior Engineer, Indian Railways (RRB CEN 05/2025)", value: "Pay Level 6 · ₹35,400 starting pay", source: rrb-je25 }
    - { level: "Group A officer through UPSC ESE (example: ITS, ESE 2024)", value: "Pay Level 10 · ₹56,100 – ₹1,77,500", source: dot-its }
  pay_note: "NTPC's GATE-2027 notice does not print pay, and private-sector pay is not officially published, so neither is printed."
  routes:
    - { title: "Polytechnic diploma → Railway JE", text: "A 3-year diploma in Mechanical (or a listed allied branch) is enough for Railway Junior Engineer posts; a B.E. / B.Tech in the same discipline is also accepted. Age 18–33.", source: rrb-je25 }
    - { title: "B.E. / B.Tech → GATE → PSU", text: "NTPC recruits Engineering Executive Trainees 2027 in Mechanical and five other branches only through GATE-2027 scores; earlier GATE marks are not accepted.", source: ntpc-eet27 }
    - { title: "B.E. / B.Tech → UPSC ESE", text: "Category II (Mechanical Engineering) of ESE fills posts such as Indian Railway Management Service (Mechanical), Central Water Engineering Service, Indian Naval Armament Service and Central Power Engineering Service. Age 21–30.", source: ese27 }
  cost_time:
    - { label: "Diploma → JE", value: "3-year diploma after Class 10, then the RRB JE exam (two CBTs)", source: [jee-ib, rrb-je25] }
    - { label: "UPSC ESE fee", value: "₹200 · women, SC, ST and PwBD exempt", source: ese27 }
    - { label: "RRB JE fee", value: "₹500 (₹400 back if you sit CBT 1) · ₹250 for SC, ST, women and other listed groups (all back if you sit CBT 1)", source: rrb-je25 }
    - { label: "GATE 2027 fee (one paper)", value: "₹2,000 · ₹1,000 for women, SC, ST, PwD (regular period)", source: gate27-fee }
  cost_note: "College fees differ by state and college, so they are not printed here."
  challenges:
    - text: "UPSC ESE 2027 has about 480 vacancies across Civil, Mechanical, Electrical and Electronics together — far fewer than the number of engineering graduates."
      source: ese27
    - text: "ESE has negative marking: one-third of a question's marks is cut for every wrong answer in the objective papers."
      source: ese27
    - text: "PSU recruitment through GATE uses only the current year's score — NTPC's 2027 drive will not accept older GATE marks."
      source: ntpc-eet27
  not_for:
    - "You dislike Physics and Maths — every route tests them."
    - "You want only a desk job — plant and workshop postings are common."
    - "You cannot sit for long competitive exams with negative marking."
journey:
  - stages: [c8, c9]
    title: "Build Maths and Science"
    do:
      - text: "Engineering degrees need Class 12 with Physics and Maths, and the polytechnic route starts right after Class 10 — so Maths and Science in Classes 8–10 decide both doors."
        source: [jm-ib, jee-ib]
    doubts:
      - q: "What does a government mechanical engineer do?"
        a: "They run and maintain machines, rolling stock, power plants and defence equipment. The Railways hire Junior Engineers, PSUs such as NTPC hire graduate trainees through GATE, and UPSC's Engineering Services fill Group A mechanical posts."
        next: "Read the Routes list above."
        source: [rrb-je25, ntpc-eet27, ese27]
      - q: "Which is the quickest route to a government engineering job?"
        a: "A 3-year polytechnic diploma after Class 10. Railway Junior Engineer posts accept a diploma in Mechanical or a listed allied branch, with age 18 to 33."
        next: "Plan for a polytechnic entrance after Class 10 if you want this route."
        source: [rrb-je25, jee-ib]
  - stages: [c10]
    title: "Diploma or Class 11 Science?"
    do:
      - text: "Polytechnic entrance tests open right after Class 10 — UP's JEECUP, for example, needs Class 10 with 35%."
        source: jee-ib
      - text: "For B.E. / B.Tech, choose Physics, Chemistry and Maths in Class 11."
        source: jm-ib
    stream: "Science with Maths (PCM), or a mechanical diploma after Class 10."
    money: [apprentice-dip]
    doubts:
      - q: "Can I become a Railway Junior Engineer with a diploma?"
        a: "Yes. RRB's 2025 JE notice asks for a 3-year diploma in Mechanical or a listed allied branch from a recognised institute; a B.E. / B.Tech in the same discipline is also accepted."
        next: "Pick a mechanical diploma at a recognised polytechnic."
        source: rrb-je25
      - q: "What marks do I need in Class 10 for a polytechnic?"
        a: "It depends on the state. UP's JEECUP 2026, for example, needs Class 10 with 35% for engineering diploma courses."
        next: "Check your own state's polytechnic brochure."
        source: jee-ib
  - stages: [c11, c12]
    title: "JEE Main for a B.Tech seat"
    do:
      - text: "NIT seats through JoSAA need 75% in Class 12 (65% for SC / ST / PwD) or a place in your board's top 20 percentile."
        source: jm-ib
    exams:
      - { name: "JEE Main 2026", when: "Session 1: 21–30 Jan · Session 2: 2–9 Apr 2026", source: jm-ib }
    doubts:
      - q: "Do I need 75% in Class 12 for an NIT?"
        a: "Yes, for NIT seats through JoSAA: 75% in Class 12 (65% for SC, ST and PwD) or a place in the top 20 percentile of your board."
        next: "Keep your board marks high along with JEE preparation."
        source: jm-ib
      - q: "How much is the JEE Main fee?"
        a: "Per session in 2026: ₹1,000 for General male candidates, ₹800 for female candidates and ₹500 for SC, ST and PwD."
        next: "Budget for both sessions if you plan to write twice."
        source: jm-ib
  - stages: [ug]
    title: "In college: GATE and the PSU door"
    do:
      - text: "You can write GATE from the 3rd year of your degree."
        source: gate27-elig
      - text: "NTPC will recruit Engineering Executive Trainees-2027 in Mechanical only through GATE-2027; a detailed advertisement follows the exam."
        source: ntpc-eet27
    exams:
      - { name: "GATE 2027", when: "6–7, 13–14, 20–21 Feb 2027 · result 19 Mar 2027", source: gate27 }
    money: [gate-fee]
    doubts:
      - q: "When can I write GATE?"
        a: "From the 3rd year of any undergraduate degree, or after completing it."
        next: "Write GATE in your 3rd or 4th year so the score is ready when you graduate."
        source: gate27-elig
      - q: "Will NTPC accept my old GATE score?"
        a: "No. NTPC's 2027 Engineering Executive Trainee drive uses only GATE-2027 marks; marks of previous years or of any other exam are not accepted."
        next: "Write GATE in the year you want to apply."
        source: ntpc-eet27
      - q: "How is the GATE paper set?"
        a: "A 3-hour computer-based test with 65 questions for 100 marks — 10 General Aptitude and 55 subject questions — with negative marking for wrong MCQs."
        next: "Practise full papers in your branch."
        source: gate27-qp
  - stages: [grad]
    title: "UPSC ESE and Railway JE"
    do:
      - text: "ESE has three stages: Prelims (500 marks), Mains (600 marks, two conventional papers in your discipline) and a 200-mark Personality Test."
        source: ese27
      - text: "You may apply to ESE in only one category — Civil, Mechanical, Electrical or Electronics & Telecommunication."
        source: ese27
    exams:
      - { name: "UPSC ESE 2027 prelims", when: "31 Jan 2027", source: ese27 }
      - { name: "UPSC ESE 2027 mains", when: "18 Jun 2027", source: ese27 }
    money: [ese-fee]
    doubts:
      - q: "What is the age limit for UPSC ESE?"
        a: "21 to 30 years on 1 January 2027 for ESE 2027 — born between 2 January 1997 and 1 January 2006. Some government servants get relaxation up to 35."
        next: "Count your attempts from the year you turn 21."
        source: ese27
      - q: "Can a final-year B.Tech student apply for ESE?"
        a: "Yes. Candidates who have appeared for, or will appear for, the qualifying degree exam may apply; they must show proof of passing if they reach the interview."
        next: "Apply in your final year."
        source: ese27
      - q: "Is there negative marking in ESE?"
        a: "Yes. In the objective Prelims papers one-third of a question's marks is cut for each wrong answer; a blank answer costs nothing."
        next: "Attempt only questions you are sure about."
        source: ese27
      - q: "Which services can a mechanical engineer get through ESE?"
        a: "Category II (Mechanical) includes the Indian Railway Management Service (Mechanical and Stores), Central Water Engineering Service, Indian Naval Armament Service, Indian Naval Material Management Service, Defence Aeronautical Quality Assurance Service, Central Power Engineering Service, Indian Skill Development Service and more."
        next: "Rank your preferences carefully when UPSC asks."
        source: ese27
      - q: "How many candidates reach the ESE interview?"
        a: "About six to seven times the vacancies are admitted to Mains, and about twice the vacancies are called for the Personality Test, which has no minimum qualifying marks."
        next: "Treat Mains as the real filter."
        source: ese27
      - q: "Can a B.Tech graduate apply for Railway JE?"
        a: "Yes. The 2025 notice says a B.E. / B.Tech is accepted in place of the 3-year diploma in the same discipline. Candidates still awaiting final results should not apply."
        next: "Apply only after your result is declared."
        source: rrb-je25
  - stages: [work]
    title: "Already working?"
    do:
      - text: "RRB JE has two CBTs: CBT 1 (100 questions, 90 minutes) screens; CBT 2 (150 questions, 120 minutes) includes technical questions for the post. Both cut one-third of a mark per wrong answer."
        source: rrb-je25
    doubts:
      - q: "How many Railway JE posts were notified in 2025?"
        a: "CEN 05/2025 notified 2,569 posts for Junior Engineer, Depot Material Superintendent and Chemical & Metallurgical Assistant across all RRBs, at Pay Level 6 (₹35,400). A corrigendum later added posts for ICF and RCF."
        next: "Watch rrb.indianrailways.gov.in for the next JE notice."
        source: rrb-je25
      - q: "Can a private-sector engineer still join government service?"
        a: "Yes, while within the age limit: RRB JE allows 18 to 33 (with category relaxation) and ESE allows 21 to 30 on 1 January of the exam year."
        next: "Check your age against the next notice."
        source: [rrb-je25, ese27]
board_note: "Any board. Engineering degrees need Physics and Maths in Class 12; the polytechnic route starts after Class 10."
board_source: [jm-ib, jee-ib]
