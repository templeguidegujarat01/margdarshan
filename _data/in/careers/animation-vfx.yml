          - "<strong>Diploma route:</strong> Shorter, software-focused programmes at MAAC, Arena Animation and similar institutes, often 1-2 years."
          - "<strong>Self-taught route:</strong> Online courses and independent practice building specific software skills, backed by a strong demo reel — genuinely viable for entry-level roles at many studios."
