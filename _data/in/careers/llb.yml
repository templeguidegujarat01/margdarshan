            text: "CLAT for the 5-year integrated programme, or complete any bachelor's first."
          - title: "5 (or 3) years of legal study"
            text: "Core law subjects, moot courts, internships and legal drafting."
          - title: "Clear the All India Bar Examination (AIBE)"
            text: "Required to formally practise as an advocate in India."
          - title: "Litigation, firm, in-house or judiciary"
            text: "Choose your specific direction based on interest and internship experience."
      - roadmap_card: "LLB"
  - id: "exam"
    hid: "exam-heading"
    eyebrow: "The main entrance route"
    heading: "CLAT — exam details"
    parts:
      - chips:
          - label: "Conducting authority"
            text: "Consortium of National Law Universities, for admission to NLUs and many affiliated law colleges nationwide."
            source: "clat"
          - label: "Who takes it"
            text: "Class 12 students (any stream) for the 5-year integrated UG programme, and law graduates for the PG (LLM) programme."
          - label: "Exam sections"
            text: "English Language, Current Affairs including General Knowledge, Legal Reasoning, Logical Reasoning, and Quantitative Techniques."
          - label: "Other exams"
            text: "AILET (for NLU Delhi specifically) and several state-level and private-university law entrance tests exist as alternatives. LSAT—India is no longer held: LSAC discontinued it from 2025."
            source: "lsac"
          - label: "After qualifying"
            text: "Counselling rounds based on rank, seat allotment across participating NLUs and colleges, and document verification."
  - id: "specialisations"
    hid: "spec-heading"
    alt: true
    eyebrow: "Specialisations"
    heading: "Choosing a field inside LLB"
    parts:
      - spec:
          - id: "criminal-law"
            title: "Criminal Law"
            summary: "Studied inside the LLB (core papers plus electives), then deepened through an LLM or years of practice. There is no separate \"criminal law degree\" at the undergraduate level."
            points:
              - "<strong>The law you study:</strong> since 1 July 2024 the Bharatiya Nyaya Sanhita (BNS), Bharatiya Nagarik Suraksha Sanhita (BNSS) and Bharatiya Sakshya Adhiniyam (BSA) replaced the IPC, CrPC and Indian Evidence Act."
              - "<strong>Where it leads:</strong> criminal litigation (defence work under a senior advocate), Public Prosecutor / Assistant Public Prosecutor posts through state recruitment, and the judiciary through State Judicial Services exams."
              - "<strong>Going deeper:</strong> an LLM with a criminal law specialisation, offered at many NLUs and university law faculties."
            links:
