          - label: "Subject combination"
            text: "DU requires one Language (List A) plus three other domain subjects from the CUET list; Psychology itself is not compulsory as an entry subject."
          - label: "State & private universities"
            text: "Many admit on Class 12 merit directly, or run their own entrance test/interview — check your target university's specific process."
          - label: "Typical process"
