  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What is Medical Laboratory Technology?"
    parts:
      - overview:
          points:
            - "Medical Laboratory Technology (MLT) is a healthcare profession focused on laboratory testing and disease diagnosis."
            - "A large share of medical diagnoses depend on laboratory test results — MLT professionals perform scientific tests on blood, urine, tissue and other biological samples across clinical pathology, microbiology, haematology, biochemistry, immunology and blood banking, generating the reports doctors rely on to diagnose and treat patients."
            - "Demand here is genuinely, measurably growing: rising preventive health checkups, corporate hospitals upgrading their pathology departments, continued post-COVID testing infrastructure expansion, and the growth of home sample collection through e-diagnostics companies are all real, ongoing drivers — not speculative hype."
          more:
            - "It's also a genuinely accessible entry point into healthcare for students who want to work in medicine and diagnostics without the long duration and intense competition of a degree like Bachelor of Medicine and Bachelor of Surgery (MBBS)."
