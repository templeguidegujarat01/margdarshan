sections:
  - id: "quick"
    hid: "quick-heading"
    alt: true
    eyebrow: "Quick answers"
    heading: "Data Protection Officer at a glance"
    intro: "Check whether your Class 12 background qualifies. Duration and pay are in the summary at the top of the page."
    parts:
      - subhead: "Can I apply from my stream?"
      - streams:
          - label: "Science"
            fit: "Eligible"
            tone: "y"
            icon: "science"
          - label: "Commerce"
            fit: "Eligible"
            tone: "y"
            icon: "commerce"
          - label: "Arts / Humanities"
            fit: "Eligible"
            tone: "y"
            icon: "arts"
      - note: "Any stream — the role mixes law, technology and governance, so all three backgrounds can lead here."
  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What does a Data Protection Officer do?"
    parts:
      - overview:
          points:
            - "A DPO is the organisation's point of contact for data-privacy questions and complaints, and oversees how personal data is collected, used, stored and deleted."
            - "Significant Data Fiduciaries must also run periodic Data Protection Impact Assessments and audits — work the DPO leads."
            - "Privacy teams handle consent, data-breach response, vendor contracts and staff training."
          more:
            - "The Act applies to digital personal data; the DPDP Rules set out the detailed obligations and their timelines — read the notified text on MeitY's website."
  - id: "who"
    hid: "who-heading"
    alt: true
    eyebrow: "Fit check"
    heading: "Who should become a Data Protection Officer"
    parts:
      - fit:
          match:
            - "Like both law and technology."
            - "Are careful, ethical and comfortable saying “no” to senior people."
            - "Enjoy writing policies and explaining rules simply."
          mismatch:
            - "Want a purely technical or purely courtroom role."
            - "Dislike documentation and audits."
            - "Expect a quick entry-level DPO job — it is a senior role."
  - id: "eligibility"
    hid: "elig-heading"
    eyebrow: "Eligibility"
    heading: "What you need, stage by stage"
    parts:
      - elig_list:
          - "The DPDP Act sets <strong>no fixed degree</strong> for DPOs; employers usually look for law, IT/cybersecurity or compliance backgrounds."
          - "For Significant Data Fiduciaries the DPO must be <strong>based in India</strong> and responsible to the board of directors."
          - "Strong working knowledge of the <strong>DPDP Act, 2023 and the DPDP Rules</strong>, plus information-security basics."
          - "Private privacy certifications exist; they are optional and not issued by the Government."
      - warn_box: "No Government body issues a “DPO licence”. Be careful with courses that claim to make you a certified DPO under Indian law."
  - id: "roadmap"
    hid: "roadmap-heading"
    alt: true
    eyebrow: "Step-by-step"
    heading: "Your full path to becoming a Data Protection Officer"
    parts:
      - steps:
          - title: "Class 12, any stream"
            text: "Pick a degree that suits you."
          - title: "Degree"
            text: "LLB, B.Tech/BCA (security), or commerce + CS."
          - title: "Learn the DPDP framework"
            text: "Act, Rules, consent, breach reporting, rights of data principals."
          - title: "Entry compliance role"
            text: "Privacy analyst, GRC associate or legal associate."
          - title: "Privacy manager"
            text: "Run assessments, audits, vendor reviews."
          - title: "DPO"
            text: "Senior role reporting to the board."
  - id: "exams"
    hid: "exams-heading"
    eyebrow: "Law & regulator"
    heading: "The legal framework behind the role"
    parts:
      - chips:
          - label: "DPDP Act, 2023"
            text: "Defines data fiduciaries, Significant Data Fiduciaries and the DPO requirement."
            source: "dpdp"
          - label: "DPDP Rules"
            text: "Notified by MeitY; set procedures for notices, consent, breaches and SDF duties."
            source: "meity"
          - label: "Data Protection Board of India"
            text: "Adjudicates breaches and can impose penalties under the Act."
            source: "meity"
