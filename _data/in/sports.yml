  # ------------------------------------------------------------------------------------------------ Badminton
  - slug: badminton
    short: "Badminton"
    domain: solo
    checked: 2026-10-16
    body: "Badminton World Federation (BWF) · Badminton Association of India (BAI)"
    card: "The new 15-point scoring, BWF World Tour levels and ranking points, LA28 places, BAI's U11-to-senior ladder, Hyderabad and Bengaluru academies, awards and jobs."
    card_facts: ["15-point games from 4 Jan 2027", "Super 1000 to Super 100", "U19 = junior"]
    eyebrow: "Sports Cockpit · Solo, Track &amp; Pool · BWF Laws 2027 · BAI calendar 2026-27"
    title: "Badminton — new scoring, World Tour points &amp; the BAI ladder"
    lede: "Education Margdarshan's badminton map for India: the switch to 15-point games, the court and racket rules, how BWF World Tour levels turn into ranking points and prize money, the road to LA28, BAI's ranking tournaments and nationals from the Mini National upward, the academies in Hyderabad and Bengaluru, who pays, and the awards and jobs after a medal."
    official:
      - { label: "BWF Laws of Badminton, 4 Jan 2027 (PDF)", url: "https://extranet.bwf.sport/docs/document-system/81/1466/1470/Section%204.1%20-%20Laws%20of%20Badminton%20-%2004%20January%202027%20V6.0.pdf" }
      - { label: "badmintonindia.org", url: "https://www.badmintonindia.org/" }
    facts:
      - { label: "Game (from 4 Jan 2027)", value: "<strong>First to 15</strong>, win by 2, capped at 21", source: bwf-laws27 }
      - { label: "World Tour", value: "<strong>Finals + Super 1000 / 750 / 500 / 300</strong>, plus Super 100", source: bwf-wt-page }
      - { label: "LA28 badminton places", value: "<strong>172 players</strong>; max 2 per singles event per country", source: bwf-la28 }
      - { label: "Junior (BWF)", value: "<strong>Under 19</strong> for the whole calendar year", source: bwf-junior }
    sections:
      - id: rules
        nav: "Scoring &amp; rules"
        eyebrow: "Core rules &amp; selection formats"
        heading: "The new scoring, the court and the racket"
        parts:
          - table:
              caption: "Laws of Badminton — scoring before and after 4 January 2027"
              head: ["Rule", "Until 3 Jan 2027", "<strong>From 4 Jan 2027</strong>"]
              rows:
                - ["Match", "Best of three games", "Best of three games"]
                - ["Game won at", "21 points", "<strong>15 points</strong>"]
                - ["Deuce", "At 20-all, two clear points", "At <strong>14-all</strong>, two clear points"]
                - ["Cap", "At 29-all, the 30th point wins", "At <strong>20-all, the 21st point wins</strong>"]
                - ["Mid-game interval (max 60 s)", "When the leader reaches 11", "When the leader reaches <strong>8</strong>"]
                - ["Ends change in game 3", "At 11", "At <strong>8</strong>"]
            source: "bwf-laws25,bwf-laws27"
          - note: "India switched early: by BAI's circular of <strong>30 June 2026</strong>, all main-draw and qualifying matches at BAI events are played as <strong>best of three games of 15 points</strong>, extendable to 21."
            source: bai-interstate
          - list:
              - "Up to <strong>120 seconds</strong> between games."
              - "The net top is <strong>1.524 m</strong> at the centre and 1.55 m over the doubles side lines."
              - "On serve, the whole shuttle must be <strong>below 1.15 m</strong> from the court surface when struck."
              - "A feathered shuttle has <strong>16 feathers</strong> and weighs <strong>4.74–5.50 g</strong>."
              - "The racket frame may be at most <strong>680 mm long and 230 mm wide</strong>."
            source: bwf-laws27
          - list:
              - "BWF junior events are <strong>Under 19</strong>: a player must remain under 19 throughout the calendar year of the tournament."
            source: bwf-junior
      - id: recognition
        nav: "Tour &amp; ranking"
        eyebrow: "Institutional &amp; global recognition"
        heading: "World Tour levels, ranking points and India's big events"
        parts:
          - table:
              caption: "BWF tournament levels — winner's ranking points and minimum prize money (2026)"
              head: ["Level", "Name", "Events a year", "Winner's points", "Min. prize money"]
              rows:
                - ["Grade 1", "World Championships, Olympic Games", "—", "<strong>14,500</strong>", "Set by BWF"]
                - ["Level 1", "World Tour Finals (top 8)", "1", "14,000", "US$3.5 million"]
                - ["Level 2", "<strong>Super 1000</strong>", "4", "12,000–13,500*", "US$1.45 million"]
                - ["Level 3", "Super 750 (incl. India)", "6", "11,000", "US$950,000"]
                - ["Level 4", "Super 500", "9", "9,200", "US$500,000"]
                - ["Level 5", "Super 300 (incl. India)", "11", "7,000", "US$250,000"]
                - ["Level 6", "Super 100", "Set by BWF", "5,500", "US$120,000"]
                - ["Grade 3", "International Challenge / Series / Future Series", "—", "4,000 / 2,500 / 1,700", "US$20,000 / 10,000 / under 10,000"]
            source: "bwf-wt,bwf-wt-page,bwf-ranking,bwf-sanction"
          - note: "*Super 1000 points rise with extra prize money above the minimum. A player's world ranking adds the <strong>best 10 results in the last 52 weeks</strong>; points from a tournament drop off after 52 weeks or when that event is next held."
            source: bwf-ranking
          - table:
              caption: "Government cash award for a senior badminton medal (₹ lakh)"
              head: ["Event", "Gold", "Silver", "Bronze"]
              rows:
                - ["<strong>Olympic Games</strong>", "75", "50", "30"]
                - ["Asian Games / Commonwealth Games", "30", "20", "10"]
                - ["World Championships (annual) / <strong>All England</strong>", "10", "7", "4"]
                - ["Asian Championships (annual)", "3.75", "2.5", "1.25"]
            source: myas-cash
          - note: "The <strong>Thomas Cup</strong> and <strong>Uber Cup</strong> are also on the list; in team events each player gets 75% of the individual amount."
            source: myas-cash
          - list:
              - "India hosted the <strong>BWF World Championships 2026</strong> in New Delhi, 17–23 August 2026; the 2026 Thomas &amp; Uber Cup Finals were in Horsens, Denmark."
              - "India's World Tour stops include the <strong>Syed Modi India International</strong> (Super 300, Lucknow, 24–29 Nov 2026) and the Super 100 <strong>Guwahati and Odisha Masters</strong> (December 2026)."
              - "BAI's 2026-27 calendar lists <strong>no Premier Badminton League</strong> season."
            source: bai-calendar
      - id: eligibility
        nav: "Age &amp; testing"
        eyebrow: "Physical benchmarks &amp; anti-doping"
        heading: "Age checks, clean sport and the LA28 cut-offs"
        parts:
          - list:
              - "If a player's date of birth was <strong>registered more than one year after birth</strong>, BAI requires <strong>medical age tests at a government hospital</strong> in SAI's format before age-group events."
              - "BAI may run an <strong>age-estimation test</strong> — physical, dental and X-ray examination — on players who cannot produce the forms."
            source: bai-age
          - list:
              - "At least <strong>15 doping tests</strong> must be done at every Level 1–4 World Tour event (8 at Level 5–6)."
            source: bwf-wt
          - list:
              - "The athlete must be available for testing in and out of competition and check every medicine against the Prohibited List; apply to NADA for a <strong>TUE</strong> if no permitted treatment exists."
            source: nada-rr
          - table:
              caption: "LA28 Olympic badminton — how places are given"
              head: ["Event", "Places", "Country limit"]
              rows:
                - ["Men's / Women's singles", "<strong>38 each</strong> (35 by ranking + host and universality places)", "2 players if both rank <strong>1–16</strong>, otherwise 1"]
                - ["Men's / Women's / Mixed doubles", "<strong>16 pairs each</strong>", "2 pairs if both rank <strong>1–8</strong>, otherwise 1"]
            source: bwf-la28
          - note: "The LA28 Olympic Ranking counts results from <strong>3 May 2027 to 30 April 2028</strong> and is frozen on <strong>2 May 2028</strong>."
            source: bwf-la28
      - id: roadmap
        nav: "Roadmap"
        eyebrow: "Grassroots-to-elite residential pipeline"
        heading: "BAI's ladder from the Mini National to the Senior National"
        parts:
          - table:
              caption: "BAI national championships, 2026-27 season"
              head: ["Championship", "Age", "Dates", "Venue"]
              rows:
                - ["5th Mini National", "11 years", "24–27 Nov 2026", "Chhattisgarh (venue to be announced)"]
                - ["38th Sub-Junior National", "<strong>13 years</strong>", "9–12 Dec 2026", "To be announced"]
                - ["38th Sub-Junior National", "<strong>U15 &amp; U17</strong>", "30 Nov–5 Dec 2026", "Bengaluru"]
                - ["49th Junior National (team &amp; individual)", "<strong>U19</strong>", "14–21 Nov 2026", "Gangtok"]
                - ["88th Senior National (team &amp; individual)", "Men &amp; women", "17–24 Dec 2026", "Bhubaneswar"]
            source: bai-calendar
          - list:
              - "Between the nationals, BAI runs <strong>All India ranking tournaments</strong> for <strong>U13, U15 &amp; U17, U19 and seniors</strong> all season — these are the 'qualifying' events that build a player's BAI ranking."
              - "State teams meet at the <strong>Inter-State Zonal Championships</strong> (September 2026); a team has 6–10 men, 6–10 women and 3–7 junior boys and girls (U19)."
            source: "bai-calendar,bai-interstate"
          - list:
              - "India's U19 squad for the <strong>BWF World Junior Championships 2026</strong> (Cairo) trained at BAI's <strong>National Centre of Excellence, Guwahati</strong>; players make their own way to the camp."
            source: bai-wjc26
          - p: "Above that, the senior route runs through BWF Grade 3 events in India (International Challenges in Raipur and Bengaluru, late October–November 2026), then Super 100 and World Tour events, and from <strong>May 2027</strong> the LA28 ranking race."
            source: "bai-calendar,bwf-la28"
      - id: academies
        nav: "Academies"
        eyebrow: "Top elite academies &amp; cities"
        heading: "Where India's shuttlers train"
        parts:
          - table:
              caption: "Verified badminton centres"
              head: ["Centre", "City", "What its own notice says"]
              rows:
                - ["<strong>Pullela Gopichand Badminton Academy</strong>", "Gachibowli, Hyderabad", "Founded 2004 by All England champion Pullela Gopichand; recognised by the Ministry of Sports, SAI and BAI; trained Saina Nehwal, P.V. Sindhu, Srikanth Kidambi, H.S. Prannoy"]
                - ["<strong>Centre for Badminton Excellence</strong> (formerly PPBA)", "Bengaluru", "Founded 1994 by Prakash Padukone, Vimal Kumar and Vivek Kumar; 75+ high-performance players incl. P.V. Sindhu, Lakshya Sen, Ayush Shetty; 16 BWF-approved courts at the Yonex Sunrise Badminton Centre, CSE"]
                - ["Padukone School of Badminton", "Bengaluru", "Launched June 2025; 200+ students train at the CSE centre; mentored by Prakash Padukone"]
                - ["BAI National Centre of Excellence", "Guwahati, Assam", "BAI's base for national coaching camps"]
                - ["SAI NCOE Hamirpur", "Hamirpur, Himachal Pradesh", "Government residential centre — badminton with athletics, boxing, hockey, judo, wrestling"]
            source: "pgba,cse-badminton,bai-wjc26,sai-schemes"
          - warn: "Name change: the academy many families still call the <strong>Prakash Padukone Badminton Academy</strong> now trades as the <strong>Centre for Badminton Excellence (formerly PPBA)</strong>; the separate Padukone School of Badminton is a newer, wider programme."
            source: cse-badminton
      - id: costs
        nav: "Gear &amp; cost"
        eyebrow: "Equipment costs &amp; who pays"
        heading: "Rackets, shuttles, fines — and who pays"
        parts:
          - list:
              - "Any racket within the BWF limits (<strong>680 × 230 mm</strong> frame) and any shuttle meeting the 4.74–5.50 g standard is legal — no special 'graphite' rule exists. Education Margdarshan does not print shop prices; no governing body publishes them."
            source: bwf-laws27
          - list:
              - "At the Inter-State Championships the <strong>host state pays boarding, food and local transport</strong> for up to 28 members (24 players + 4 officials); extra members cost the state <strong>₹1,500 a day</strong> each."
              - "Clothing violations from the main draw on cost <strong>₹1,000</strong>; a yellow card ₹500, a red card ₹2,000."
            source: bai-interstate
          - table:
              caption: "Who pays — badminton"
              head: ["Stage", "Paid by", "What you get"]
              rows:
                - ["SAI centre trainee", "Sports Authority of India", "Coaching, boarding, sports science"]
                - ["Khelo India athlete", "Ministry of Youth Affairs &amp; Sports", "<strong>₹6.28 lakh a year</strong> incl. ₹1.20 lakh cash"]
                - ["Junior medal prospect", "TOPS Development Group", "₹25,000 a month"]
                - ["Olympic prospect", "TOPS Core Group", "<strong>₹50,000 a month</strong> + approved training plan"]
                - ["Athlete in hardship", "PDU National Welfare Fund", "Up to ₹2.50 lakh"]
            source: pib-support
          - list:
              - "<strong>Food first</strong>, with a certified nutritionist — no supplement is 100% safe and strict liability applies."
            source: nada-supp
      - id: earnings
        nav: "Earnings &amp; jobs"
        eyebrow: "Earning channels &amp; central job quotas"
        heading: "Prize money, awards and sports-quota jobs"
        parts:
          - list:
              - "World Tour prize money follows fixed BWF tables; a player or pair must achieve a <strong>confirmed result</strong> in the event to receive it."
            source: bwf-wt
          - list:
              - "Badminton is one of the <strong>65 sports</strong> in the central sports quota for <strong>Group C</strong> posts, with up to 5 years' age relaxation (10 for SC/ST)."
              - "Medals at the Olympics, Asian Games, Commonwealth Games or World Championships can bring up to <strong>three out-of-turn promotions</strong>."
            source: dopt-2022
          - p: "Since <strong>4 March 2024</strong>, medals at Junior Nationals, the <strong>Khelo India Youth Games (above 18)</strong>, Khelo India University Games and SGFI school games also qualify."
            source: dopt-2024
          - p: "Retired champions can receive the <strong>Pension to Meritorious Sportspersons</strong> of ₹12,000–20,000 a month."
            source: pib-support
      - id: traps
        nav: "Red flags"
        eyebrow: "Disqualification traps"
        heading: "Mistakes that cost shuttlers matches and selections"
        parts:
          - list:
              - "<strong>Training for 21-point games</strong> — BAI events already use 15-point games; pacing and the 8-point interval change match plans."
            source: "bai-interstate,bwf-laws27"
          - list:
              - "<strong>Late birth registration without medical papers</strong> — no age-group entry."
            source: bai-age
          - list:
              - "<strong>Clothing violations and cards</strong> — fines at BAI events; a black card means disqualification for misconduct."
            source: bai-interstate
          - list:
              - "<strong>Age fraud, doping or misconduct</strong> are grounds for weeding a player out of SAI centres."
            source: sai-schemes
      - id: doubts
        nav: "Player doubts"
        eyebrow: "Real-world player doubts"
        heading: "Late start, sports-quota jobs, money and certificates — straight answers"
        parts:
          - qa:
              q: "I am 18, 20 or 22. Is it too late for badminton?"
              a: "For age-group titles, yes: a BWF junior is <strong>Under 19</strong> for the whole calendar year, and BAI's ladder runs U13 → U15 &amp; U17 → U19. After that everyone plays the <strong>senior</strong> ranking tournaments and the Senior National, and LA28 places come from the BWF Olympic ranking (results from <strong>3 May 2027</strong>), not age. The real clock is the job deadline: Railways sports quota stops at <strong>25</strong> and CRPF at <strong>23</strong> (28 for an unreserved sportsperson after relaxation)."
            source: "bwf-junior,bai-calendar,bwf-la28,rrc-wr26,crpf26"
          - qa:
              q: "Which government jobs can badminton get me?"
              a: "<strong>Central Group C posts</strong> under DoPT rules list badminton among 65 sports. Railways norms name the <strong>Thomas/Uber Cup</strong> for higher levels, but Western Railway's 2026-27 notice advertised <strong>no badminton posts</strong> (only ball badminton, a different sport) — each zone advertises only the events its team needs, so read every zone's notice. <strong>CRPF's 2026 sports quota</strong> includes badminton."
            source: "dopt-2022,rrc-wr26,crpf26"
          - table:
              caption: "Sports-quota job routes open in 2026 — age, qualifying results, pay"
              head: ["Route", "Age", "Main qualifying results", "Pay level"]
              rows:
                - ["Railways <strong>Level 5/4</strong> (graduates)", "18–25 on 1 Jan 2027", "Played the <strong>Olympics</strong>, or top 3 at a World Cup, World Championship, Asian Games, Commonwealth Games or Youth Olympics", "Level 5/4"]
                - ["Railways <strong>Level 3/2</strong> (12th, or 10th + apprenticeship)", "18–25 on 1 Jan 2027", "Top 3 at <strong>Senior, Youth or Junior Nationals</strong>, National Games or All India Inter-University; or Federation Cup gold", "Level 3/2"]
                - ["Railways <strong>Level 1</strong>", "18–25 on 1 Jan 2027", "Played for your state and finished <strong>at least 8th at Senior Nationals</strong>; or top 3 at the Federation Cup", "Level 1"]
                - ["CRPF <strong>Head Constable (GD)</strong> (10+2)", "18–23 on 1 Aug 2026; sportspersons get <strong>+5 years</strong> (OBC +8, SC/ST +10)", "Played for India; or top 3 for your state at Nationals or National Games; or <strong>gold/silver at Junior Nationals</strong>", "Level 4 · ₹25,500–81,100"]
                - ["CRPF <strong>Constable (GD)</strong> (10th pass)", "18–23 on 1 Aug 2026; sportspersons get <strong>+5 years</strong> (OBC +8, SC/ST +10)", "Played for your state at <strong>Senior or Junior Nationals</strong>; or top 3 at SGFI school nationals or Khelo India Games", "Level 3 · ₹21,700–69,100"]
            source: "rrc-wr26,crpf26"
          - note: "Railways count results from <strong>1 April 2024</strong>; CRPF counts the <strong>two years before 30 September 2026</strong>. Railways fee ₹500 (₹400 back if you attend the trial; ₹250, refunded in full on attending, for SC/ST, women, PwBD, minorities, ex-servicemen and EBC). CRPF fee ₹100 for UR/OBC/EWS men; free for women, SC, ST and ex-servicemen. CRPF picks sign a <strong>₹1 lakh bond to serve at least 3 years</strong>."
            source: "rrc-wr26,crpf26"
          - qa:
              q: "We are a lower-middle-class family. How do we keep costs down?"
              a: "Aim for the free seats: SAI centres such as <strong>NCOE Hamirpur</strong> give coaching and boarding, and a Khelo India athlete gets <strong>₹6.28 lakh a year</strong>. At the Inter-State Championships the <strong>host state pays boarding, food and local transport</strong> for state teams. Avoid fines: clothing ₹1,000, yellow card ₹500, red card ₹2,000."
            source: "sai-schemes,pib-support,bai-interstate"
          - qa:
              q: "Does any 'national' certificate count for a job?"
              a: "No. Railways will <strong>not recruit on a certificate from a federation MoYAS did not recognise</strong> at the time of the championship, and CRPF counts only championships of MoYAS-recognised federations or the IOA's National Games. BAI also demands <strong>government-hospital age tests</strong> if a birth was registered more than a year late — settle that before you need the certificate."
            source: "rrc-wr26,crpf26,bai-age"
