    hid: "higher-heading"
    alt: true
    eyebrow: "Beyond the degree"
    heading: "Higher studies"
    parts:
      - prose:
          - "BMS is a common feeder degree into an MBA, M.Com or other master's programmes. Mumbai-based students frequently prepare for <strong>MAH-MBA-CET</strong>, the entrance exam for well-known local business schools including JBIMS, Sydenham Institute and SIMSREE, alongside national exams like Common Admission Test (CAT) and XAT if they're targeting institutes outside Maharashtra."
  - id: "proscons"
    hid: "pc-heading"
    eyebrow: "Honest take"
    heading: "Advantages and disadvantages"
    parts:
      - proscons:
          pros:
            - "Well-established, widely trusted degree within Maharashtra with 200+ affiliated colleges to choose from."
            - "Generally affordable, especially at government-aided colleges."
            - "Good local pipeline into Mumbai's strong MBA and corporate ecosystem."
          cons:
            - "Much less accessible and less immediately recognisable outside Maharashtra than BBA."
            - "Placement outcomes vary hugely by college — average figures hide a wide spread."
            - "On its own, rarely leads to a high starting salary without a strong college or a follow-on MBA."
