  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What does a Data Scientist actually do?"
    parts:
      - overview:
          points:
            - "Data Science is the process of extracting useful insight from data to drive business decisions — collecting data, cleaning it, analysing it, building predictive models, and clearly communicating findings to decision-makers who may not be technical themselves."
            - "It's broader and more business-facing than Machine Learning Engineering, which focuses more narrowly on building and deploying the models themselves."
            - "Demand is genuinely strong and broad-based: industry estimates point to a significant shortage of qualified data professionals in India, with growth spanning banking, healthcare, e-commerce and manufacturing."
          more:
            - "What makes this field distinctive compared to Artificial Intelligence (AI) Engineer or Machine Learning (ML) Engineer roles covered elsewhere is that it has a genuinely low-code entry ramp — you don't need to already be a strong programmer to get started."
