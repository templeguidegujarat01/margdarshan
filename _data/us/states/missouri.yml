# Missouri (USA 50-state licensure portal, 2026-10-22). Schema: _data/us/state_index.yml. Boards tier: the
# licensing boards for lawyers, physicians, CPAs and nurses, copied from the national directories of state boards (NCBE,
# FSMB, NASBA, NCSBN). Diploma, state test, tuition, aid, jobs and apprenticeship blocks are still in the Phase 11 queue;
# the page prints only the blocks that exist.
name: "Missouri"
abbr: MO
checked: 2026-10-22
review_by: 2027-04-22
lede: "In Missouri, the Missouri Board of Law Examiners handles bar admission for lawyers, the Missouri Board of Registration for the Healing Arts licenses physicians, the Missouri State Board of Accountancy licenses CPAs and the Missouri State Board of Nursing licenses registered nurses."

boards:
  # 50-state portal (2026-10-22): bar admission agency (NCBE jurisdiction page), medical board(s) (FSMB directory),
  # board of accountancy (NASBA directory), board of nursing (NCSBN member page). Links checked 2026-10-22.
  law: { body: "Missouri Board of Law Examiners", url: "https://www.mble.org", stat: "NextGen UBE", exam: "NextGen UBE.", note: "MPRE required (passing score 80).", src: ncbe_mo }
  medicine:
    src: fsmb_boards
    boards:
      - { body: "Missouri Board of Registration for the Healing Arts", url: "https://pr.mo.gov/healingarts.asp" }
  cpa:
    src: nasba_boards
    boards:
      - { body: "Missouri State Board of Accountancy", url: "https://pr.mo.gov/accountancy.asp" }
  nursing:
    src: ncsbn_mo
    boards:
      - { body: "Missouri State Board of Nursing", url: "https://pr.mo.gov/nursing.asp" }
