          - title: "4-year B.Tech/B.E."
            text: "Core CS subjects, building toward a chosen specialisation and electives."
          - title: "Internships & projects"
            text: "Real coding experience is what actually differentiates candidates by Year 3."
          - title: "Placement or higher study"
