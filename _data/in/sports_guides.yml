              - { label: "Nutrition &amp; Dietetics", url: "nutrition-dietetics.html" }
              - { label: "Data Science", url: "datascience.html" }
      - id: medicine
        nav: "Sports medicine &amp; physio"
        eyebrow: "Path 4"
        heading: "Sports doctor and physiotherapist"
        parts:
          - list:
              - "<strong>Sports doctor:</strong> first become a doctor (MBBS through NEET-UG). Then SAI NSNIS runs a <strong>2-year PG Diploma in Sports Medicine</strong> for MBBS doctors — <strong>6 seats</strong>, admission through <strong>NEET-PG</strong>, affiliated to Baba Farid University of Health Sciences and recognised by the National Medical Commission."
              - "Trainees work in Government Medical College, Patiala and give medical cover at national camps and competitions."
            source: nsnis-sm
          - links:
              - { label: "NEET-UG", url: "neet-ug.html" }
              - { label: "NEET-PG", url: "neet-pg.html" }
              - { label: "Physiotherapy (BPT)", url: "bpt.html" }
      - id: business
        nav: "Management &amp; media"
        eyebrow: "Path 5"
        heading: "Sports management, journalism and broadcasting"
        parts:
          - list:
              - "<strong>LNIPE Masters in Sports Management (MSM)</strong>: any bachelor's degree with <strong>45%</strong> (40% SC/ST). It is one of LNIPE's CUET-based programmes."
              - "LNIPE also lists a <strong>Master of Arts in Sports Journalism</strong> and a <strong>Master of Sports Sciences</strong>."
            source: "lnipe-msm,lnipe-adm"
          - links:
              - { label: "BBA", url: "bba.html" }
              - { label: "Integrated MBA", url: "integrated-mba.html" }
              - { label: "Journalism &amp; Mass Communication (BJMC)", url: "bjmc.html" }
      - id: officials
        nav: "Referee &amp; law"
        eyebrow: "Path 6"
        heading: "Referee, umpire and sports lawyer"
        parts:
          - list:
              - "<strong>Referees</strong> are recruited, trained and examined through the state associations of their sport, which must follow the national federation's structure. In football, AIFF set up this structure (in line with FIFA) so that refereeing becomes a real career."
            source: aiff-ref
          - list:
              - "<strong>Sports law</strong> is growing: the new <strong>National Sports Tribunal</strong> will hear sports disputes, and the National Sports Board will check federations on governance, money and ethics. The route is a law degree (LLB) first."
            source: pib-nsga-rules
          - links:
              - { label: "LLB guide", url: "llb.html" }
              - { label: "CLAT", url: "clat.html" }
              - { label: "Sports bodies and the new law", url: "sports-bodies.html" }
      - id: doubts
        nav: "Quick doubts"
        eyebrow: "Quick doubts"
        heading: "Straight answers"
        parts:
          - qa:
              q: "I never played at a high level. Can I still become a coach?"
              a: "The <strong>SAI coaching diploma</strong> needs a playing record (at least national level with a degree). <strong>NSU's B.Sc. Sports Coaching</strong> asks only for district or zonal school-level participation plus Class 12 with 50%, and <strong>B.P.Ed./B.P.E.S.</strong> courses lead to physical education teaching."
            source: "nsnis-dip,nsu-elig,lnipe-bped"
          - qa:
              q: "Which stream should I take in Class 11 for a sports career?"
              a: "For <strong>coaching, physical education or management</strong> any stream works — the courses above ask for Class 12 marks, not a stream. For <strong>sports medicine</strong> you need the doctor route (MBBS through NEET-UG), so take science with biology."
            source: "nsu-elig,lnipe-bped,lnipe-msm,nsnis-sm"
