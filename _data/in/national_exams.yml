  # ---------------------------------------------------------------- COMEDK UGET
  - slug: comedk
    short: "COMEDK UGET (Karnataka)"
    stream: engineering
    checked: 2026-10-15
    body: "Consortium of Medical, Engineering and Dental Colleges of Karnataka (COMEDK)"
    eyebrow: "Entrance Exam · Engineering · 2026 cycle"
    title: "COMEDK UGET — eligibility, marking, KKR quota &amp; fees"
    lede: "The common entrance of about 150 private unaided engineering colleges of Karnataka (KUPECA members), open to students from every state. This page follows the COMEDK UGET 2026 Information Brochure (version 1.0, 3 February 2026)."
    coaching_href: "coaching-jee.html"
    colleges_href: "colleges-btech.html"
    facts:
      - { label: "Conducted by", value: "COMEDK, Bengaluru", source: cm-ib }
      - { label: "Class 12 (PCM)", value: "45% · 40% for Karnataka SC/ST/OBC", source: cm-ib }
      - { label: "Paper", value: "180 MCQs · 1 mark each · no negative", source: cm-ib }
      - { label: "Application fee", value: "₹1,950 + charges", source: cm-ib }
    official:
      - { label: "comedk.org", url: "https://www.comedk.org/" }
      - { label: "Information Brochure 2026 (PDF)", url: "https://www.comedk.org/uploads/Information-brochure-2026-version-1.0.pdf" }
    sections:
      - id: overview
        nav: "Overview"
        eyebrow: "Overview &amp; governing body"
        heading: "A private-college consortium with an all-India test"
        parts:
          - p: "<strong>COMEDK</strong> is an autonomous merit-determination body set up by KPCF and KUPECA (the Karnataka Unaided Private Engineering Colleges Association). Since NEET became the only test for medical and dental seats, COMEDK UGET serves <strong>about 150 KUPECA engineering colleges</strong> with around 20,000 seats, followed by a single-window centralised counselling."
            source: cm-ib
          - table:
              caption: "COMEDK UGET 2026 calendar"
              head: ["Event", "Date"]
              rows:
                - ["Registration opens", "3 Feb 2026"]
                - ["Last date for payment and application", "16 Mar 2026"]
                - ["Exam (CBT, 200+ cities, 400+ centres)", "Saturday 9 May 2026"]
                - ["Provisional answer keys", "13 May 2026"]
                - ["Score cards", "26 May 2026"]
            source: cm-ib
          - warn: "The COMEDK UGET 2027 brochure was not out on 15 October 2026. COMEDK scores are valid only for the year of the test."
            source: cm-ib
      - id: eligibility
        nav: "Eligibility"
        eyebrow: "Strict academic eligibility"
        heading: "45% in PCM from one board — no diploma entry"
        parts:
          - list:
              - "<strong>Nationality:</strong> Indian citizens, OCI and PIO candidates."
              - "<strong>Qualifying exam:</strong> 2nd PUC / Class 12 with Physics, Mathematics and English compulsory, plus Chemistry, Biotechnology, Biology, Computer Science or Electronics."
              - "<strong>Marks:</strong> at least <strong>45% aggregate in Physics, Chemistry and Mathematics</strong> (40% for SC, ST and OBC candidates <em>of Karnataka</em>), with a pass in each subject — and a pass in every subject taken, including optional ones."
              - "All subjects must be passed from <strong>one board</strong>; marks cards from two boards are not accepted."
              - "Diploma holders cannot take the test — there is no lateral entry."
              - "Any attempt is enough to be ranked, but a score of zero gets no rank."
            source: cm-ib
          - note: "B.Arch seats are filled through COMEDK counselling using NATA or JEE Main scores — COMEDK holds no test for architecture."
            source: cm-ib
      - id: scheme
        nav: "Exam scheme"
        eyebrow: "Exam scheme &amp; marking matrix"
        heading: "180 questions, no negative marking"
        parts:
          - table:
              caption: "COMEDK UGET 2026 test pattern (computer-based, English only)"
              head: ["Subject", "Questions", "Marks"]
              rows:
                - ["Physics", "60", "60"]
                - ["Chemistry", "60", "60"]
                - ["Mathematics", "60", "60"]
                - ["Total", "180", "180"]
            source: cm-ib
          - list:
              - "<strong>Marking:</strong> +1 for each correct answer; <strong>no negative marking</strong>."
              - "<strong>Syllabus:</strong> CBSE — about 33% from the Class 11 (2024-25) syllabus and 67% from Class 12 (2025-26)."
              - "Rank comes only from the entrance score, as a percentile normalised across sessions."
              - "<strong>Ties:</strong> higher percentile in Physics + Mathematics, then Mathematics, then Chemistry; then the older candidate ranks higher."
              - "A free mock test opens online for candidates who have paid."
            source: cm-ib
      - id: reservation
        nav: "Quotas"
        eyebrow: "Reservation &amp; home-state quotas"
        heading: "Only one reserved pool: Kalyana Karnataka"
        parts:
          - p: "COMEDK has <strong>no caste-based seat reservation</strong>. Candidates are classified as General Merit, SC, ST or OBC (on a Karnataka basis) only to apply the lower 40% eligibility; the one reservation is for <strong>Kalyana Karnataka Region (KKR)</strong> 'local persons' under Article 371(J), as per the Karnataka order of 6 November 2013."
            source: cm-ib
          - list:
              - "<strong>KKR seats</strong> are made available by all COMEDK institutions; you need an Annexure-A certificate under Article 371(J) with an RD number and a Karnataka domicile certificate from a Tahsildar."
              - "<strong>Karnataka candidate:</strong> born or domiciled in Karnataka with at least seven years of schooling (Class 1 to 12) and Class 10 or 12 passed in Karnataka, or of Karnataka origin with 1st and 2nd PUC in Karnataka and a parent schooled in Karnataka for seven years."
              - "Seats per college under General Merit and KKR, and the fee structure, are published before counselling."
            source: cm-ib
      - id: fees
        nav: "Application &amp; fees"
        eyebrow: "Application steps &amp; fees"
        heading: "One fee for all categories"
        parts:
          - table:
              caption: "COMEDK UGET 2026 application fee (plus transaction charges)"
              head: ["Exam chosen", "Fee"]
              rows:
                - ["PCM — COMEDK only", "₹1,950"]
                - ["PCM — Uni-GAUGE only", "₹1,600"]
                - ["PCM — both COMEDK and Uni-GAUGE", "₹3,200"]
            source: cm-ib
          - list:
              - "<strong>Step 1</strong> — register online on comedk.org; user ID comes by e-mail and password by SMS."
              - "<strong>Step 2</strong> — fill academic details and upload photo, signature, ID proof, Class 10 marks card and (for Karnataka claims) KKR, category and domicile certificates — each under 160 KB in JPEG."
              - "<strong>Step 3</strong> — choose three test cities (allotted first come, first served) and pay; the fee is not refunded."
              - "<strong>Step 4</strong> — download the Test Admission Ticket, take the test, then download the rank card for counselling."
            source: cm-ib
      - id: horizons
        nav: "Courses &amp; colleges"
        eyebrow: "Career horizons &amp; mapped institutions"
        heading: "Private engineering in Bengaluru and beyond"
        parts:
          - p: "A COMEDK rank is the entry to the participating KUPECA engineering colleges across Karnataka; the list of institutions and courses is published separately on comedk.org."
            source: cm-ib
          - links:
              - { label: "KCET (Karnataka government quota)", url: "state/karnataka/kcet.html" }
              - { label: "Karnataka exam hub", url: "state/karnataka/index.html" }
              - { label: "B.Tech college finder", url: "colleges-btech.html" }
              - { label: "VITEEE", url: "viteee.html" }
    sources:
      - { id: cm-ib, name: "COMEDK — UGET 2026 Information Brochure, version 1.0 (notified 3 Feb 2026)", url: "https://www.comedk.org/uploads/Information-brochure-2026-version-1.0.pdf", covers: "about COMEDK, calendar, eligibility, categories, KKR, domicile rules, test pattern, marking, ties, fees, steps", checked: 2026-10-15 }

  # ---------------------------------------------------------------- NEST
  - slug: nest
    short: "NEST (NISER &amp; CEBS)"
    stream: science
    checked: 2026-10-15
    body: "NISER Bhubaneswar and UM-DAE CEBS Mumbai (Department of Atomic Energy)"
    eyebrow: "Entrance Exam · Pure Science · 2026 cycle"
    title: "NEST — eligibility, scoring, reservation &amp; fees"
    lede: "The National Entrance Screening Test admits students to the 5-year Integrated M.Sc. in Biology, Chemistry, Mathematics and Physics at NISER Bhubaneswar and UM-DAE CEBS Mumbai, two Department of Atomic Energy institutes. This page follows the NEST 2026 Information Brochure (updated 12 January 2026)."
    colleges_href: "colleges-science.html"
    facts:
      - { label: "Conducted by", value: "NISER &amp; UM-DAE CEBS (DAE)", source: nest-ib }
      - { label: "Class 12", value: "60% aggregate · 55% SC/ST/PwD", source: nest-ib }
      - { label: "Paper", value: "4 sections × 20 MCQs · 3 hours · best 3 count", source: nest-ib }
      - { label: "Fee", value: "₹1,400 UR/OBC men · ₹700 women, SC/ST, EWS, PwD", source: nest-ib }
    official:
      - { label: "nestexam.in", url: "https://nestexam.in/" }
      - { label: "NEST 2026 brochure (PDF)", url: "https://nestexam.in/docs/26/NEST2026_Brochure_Syllabus_Updated_12Jan2026.pdf" }
    sections:
      - id: overview
        nav: "Overview"
        eyebrow: "Overview &amp; governing bodies"
        heading: "A research-first Integrated M.Sc., with a stipend"
        parts:
          - p: "NEST is a compulsory online computer-based test for the 5-year <strong>Integrated M.Sc.</strong> at the <strong>National Institute of Science Education and Research (NISER)</strong>, Bhubaneswar — an off-campus centre of the Homi Bhabha National Institute — and the <strong>UM-DAE Centre for Excellence in Basic Sciences (CEBS)</strong>, Mumbai, run jointly by DAE and the University of Mumbai. Both were set up by the Department of Atomic Energy in 2007."
            source: nest-ib
          - list:
              - "Residential, stipendiary programmes in Biology, Chemistry, Mathematics and Physics, with early exposure to research."
              - "Students can receive a <strong>DISHA scholarship of ₹60,000 a year</strong> from DAE plus ₹20,000 a year for summer internships; DST INSPIRE-SHE selectees are endorsed for the INSPIRE scholarship."
            source: nest-ib
          - table:
              caption: "NEST 2026 dates"
              head: ["Event", "Date"]
              rows:
                - ["Online application", "5 Jan – 6 Apr 2026 (payment till 12 Apr)"]
                - ["Admit card", "From 15 May 2026"]
                - ["Exam (single session, CBT)", "6 Jun 2026, 2:00 – 5:00 pm"]
                - ["Merit list on nestexam.in", "By 25 Jun 2026"]
            source: nest-ib
          - warn: "The NEST 2027 brochure was not out on 15 October 2026; NEST usually opens applications in January."
            source: nest-ib
      - id: eligibility
        nav: "Eligibility"
        eyebrow: "Strict academic eligibility"
        heading: "Three of four sciences, 60% in Class 12, no age limit"
        parts:
          - list:
              - "At least <strong>three of Biology, Chemistry, Mathematics and Physics</strong> in Classes 11 and 12."
              - "<strong>Year of Class 12:</strong> passed in 2024 or 2025, or appearing in 2026 — from any recognised board, with the aggregate from a single board."
              - "<strong>Marks:</strong> at least <strong>60% aggregate</strong> (or equivalent grade) for unreserved candidates; <strong>55%</strong> for SC, ST and Divyangjan."
              - "<strong>No age limit</strong> for NEST or for admission."
              - "Certificates are checked only at admission — none are needed to sit the test."
            source: nest-ib
      - id: scheme
        nav: "Scoring"
        eyebrow: "Exam scheme &amp; marking matrix"
        heading: "Four sections, your best three count"
        parts:
          - table:
              caption: "NEST 2026 paper (computer-based, Hindi and English)"
              head: ["Section", "Questions", "Marks"]
              rows:
                - ["Biology", "20 MCQs", "60"]
                - ["Chemistry", "20 MCQs", "60"]
                - ["Mathematics", "20 MCQs", "60"]
                - ["Physics", "20 MCQs", "60"]
                - ["Total time", "3 hours", "Best three sections = 180"]
            source: nest-ib
          - list:
              - "<strong>Marking:</strong> +3 correct, −1 wrong, 0 unanswered."
              - "<strong>Section cut-off (SMAS):</strong> for each section, 20% of the average of the best 100 scores. OBC candidates need 90% of that, SC/ST 50%, and Divyangjan 95% / 85% / 45% (UR / OBC / SC-ST)."
              - "You must clear SMAS in <strong>at least three sections</strong>; your total is the sum of your best three qualifying sections."
              - "Totals become percentiles, and you also need the category-wise <strong>Minimum Admissible Percentile</strong> announced with the result."
              - "Ties: sum of the two best sections, then the best section, then Class 12 and Class 10 aggregates at counselling."
              - "Syllabus: CBSE (2025-26) / NCERT Classes 11-12. No calculators or log tables; a simple on-screen calculator is given."
            source: nest-ib
      - id: reservation
        nav: "Reservation"
        eyebrow: "Reservation &amp; seats"
        heading: "200 seats at NISER, 57 at CEBS"
        parts:
          - table:
              caption: "Proposed intake 2026-31"
              head: ["Category", "NISER", "UM-DAE CEBS"]
              rows:
                - ["Unreserved (UR)", "101", "23"]
                - ["UR-EWS", "0", "6"]
                - ["OBC-NCL", "54", "15"]
                - ["SC", "30", "9"]
                - ["ST", "15", "4"]
                - ["Total", "200", "57"]
                - ["J&amp;K and Ladakh (supernumerary)", "2", "2"]
            source: nest-ib
          - list:
              - "Government of India rules: OBC-NCL 27% (central list), SC 15%, ST 7.5%."
              - "<strong>EWS</strong> reservation applies at UM-DAE CEBS only."
              - "<strong>Divyangjan</strong> (40%+ impairment): 5% horizontal in every category — at NISER UR 5, OBC-NCL 3, SC 2, ST 1."
              - "State-notified SEBC lists do not qualify unless the candidate meets the central OBC-NCL criteria."
            source: nest-ib
      - id: fees
        nav: "Application &amp; fees"
        eyebrow: "Application steps &amp; fees"
        heading: "Half fee for women and reserved categories"
        parts:
          - table:
              caption: "NEST 2026 application fee"
              head: ["Candidates", "Fee"]
              rows:
                - ["Male — Unreserved and OBC", "₹1,400"]
                - ["UR-EWS, SC, ST, Divyangjan, and all female candidates", "₹700"]
            source: nest-ib
          - list:
              - "Apply only on nestexam.in; login details for the form and payment are given on registration."
              - "Pay by credit or debit card, net banking or UPI (Mastercard, Visa, RuPay)."
              - "Choose three exam centres in order of preference from about 140 cities; no documents are sent to the NEST office."
              - "Photo and signature: JPG, up to 80 KB each."
            source: nest-ib
      - id: horizons
        nav: "Where it leads"
        eyebrow: "Career horizons &amp; mapped institutions"
        heading: "Most graduates go on to a PhD"
        parts:
          - p: "A large majority of NISER and CEBS integrated M.Sc. graduates go on to doctoral research in India and abroad and to research positions in academia and industry."
            source: nest-ib
          - links:
              - { label: "IISER Aptitude Test (IAT)", url: "iiser-iat.html" }
              - { label: "CMI B.S. (Hons) entrance", url: "cmi.html" }
              - { label: "ISI B.Stat / B.Math", url: "isi.html" }
              - { label: "Science college finder", url: "colleges-science.html" }
    sources:
      - { id: nest-ib, name: "NEST 2026 — Information Brochure & Syllabus (updated 12 Jan 2026)", url: "https://nestexam.in/docs/26/NEST2026_Brochure_Syllabus_Updated_12Jan2026.pdf", covers: "institutes, scholarship, eligibility, reservation, intake, exam, scoring, SMAS / MAP, ties, dates, fees, application", checked: 2026-10-15 }

  # ---------------------------------------------------------------- IISER Aptitude Test
  - slug: iiser-iat
    short: "IISER Aptitude Test (IAT)"
    stream: science
    checked: 2026-10-15
    body: "Joint Admissions Committee of the IISERs (IAT 2026 organised by IISER Berhampur)"
    eyebrow: "Entrance Exam · Pure Science · 2026 cycle"
    title: "IISER Aptitude Test — eligibility, marking, seats &amp; fees"
    lede: "The IAT is now the only way into the seven Indian Institutes of Science Education and Research for their BS-MS, BS and B.Tech programmes. This page follows the IAT 2026 Information Brochure published by the Joint Admissions Committee."
    colleges_href: "colleges-science.html"
    facts:
      - { label: "Conducted by", value: "Joint Admissions Committee, IISERs", source: iat-ib }
      - { label: "Class 12", value: "60% aggregate · 55% SC/ST/PwD", source: iat-ib }
      - { label: "Paper", value: "60 MCQs · 240 marks · 3 hours", source: iat-ib }
      - { label: "Fee", value: "₹2,000 · ₹1,000 SC/ST/PwD/KM", source: iat-ib }
    official:
