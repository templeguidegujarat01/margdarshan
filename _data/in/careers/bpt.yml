  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Is NEET required for BPT?"
            a: "Generally, no. Unlike MBBS, BDS, BAMS and BHMS, BPT admission is typically through a state-level Common Entrance Test (CET) or direct Class 12 PCB merit, not NEET. A small number of programmes may reference NEET scores where locally mandated, so it's worth verifying your specific state and college's exact requirement before assuming either way."
          - q: "Is physiotherapy regulated in India like nursing or pharmacy?"
            a: "Not to the same extent, historically. Unlike Nursing, which has the long-established Indian Nursing Council, physiotherapy in India has lacked a single unified national regulatory council. The NCAHP Act 2021 is progressively building this framework, with a national physiotherapy register expected to become operational by 2026-27. In the meantime, some states — including Karnataka, Tamil Nadu, Maharashtra and Andhra Pradesh — already have their own State Allied Health Professions Councils."
          - q: "What is a realistic physiotherapist salary in India?"
            a: "Freshers commonly earn ₹2.5-4.5 LPA, or roughly ₹15,000-40,000 per month, with small clinics at the lower end and metro-city hospitals at the higher end. With 3-5 years of experience, this typically rises to ₹5-10 LPA. Specialists in sports or neuro-rehabilitation, and those in established private practice, are reported to reach ₹8-18 LPA."
          - q: "Can I work abroad as a physiotherapist after BPT?"
            a: "Yes, and this is one of BPT's genuine strengths. The UK (via HCPC registration, with the NHS actively recruiting), the US (NPTE plus state licensure), Australia (AHPRA registration), Canada, and Gulf countries (DHA, MOH or HAAD registration) all face reported physiotherapist shortages and are actively recruiting internationally. Registered graduates abroad are reported to earn considerably more than typical Indian starting salaries, though the licensing process takes real time and preparation."
          - q: "Should I do MPT after BPT?"
            a: "It's a strong option for increasing both your clinical scope and earning potential. MPT (Master of Physiotherapy) is a 2-year postgraduate specialisation in fields like Orthopaedics, Neurology, Sports or Paediatric physiotherapy, and is reported to open higher-paying specialist and academic roles. It isn't mandatory, though — many BPT graduates build successful careers directly, especially those pursuing international licensing routes."
      - note: "Figures are indicative (2026) — confirm on the official college or authority website."
        class: "table-note mt-lg"
