  - { id: ugc18, name: "UGC — Regulations on Minimum Qualifications for Appointment of Teachers and Other Academic Staff, 2018", url: "https://www.ugc.gov.in/pdfnews/4033931_UGC-Regulation_min_Qualification_Jul2018.pdf", covers: "NET / SLET / SET as minimum eligibility, Ph.D. (2009 / 2016 regulations) exemption, 55% at master's with 5% relaxation, Academic Level 10 entry and CAS promotion to Levels 11 and 12", checked: 2026-10-25 }
