# Help centre (help.html). Each group is one section; the same q/a text feeds the visible list and the
# FAQPage JSON-LD, so they can never disagree (verify-site checks this). Keep answers short and plain.
help:
  - id: start
    title: "Getting started"
    items:
      - q: "Is Education Margdarshan free?"
        a: "Yes. Every guide, finder and tool is free to read. There is no sign-up, no paid tier and no locked page."
      - q: "Where should I start if I am in Class 10?"
        a: "Open After Class 10 from the India home page. It compares the five pathways (Science, Commerce, Arts, Diploma and ITI) side by side, and each pathway opens its own list of careers."
      - q: "Where should I start if I am in Class 12?"
        a: "Open After Class 12 from the India home page, or pick your stream from the top menu. If you are unsure, try Find My Fit, a short quiz that suggests directions to read about."
      - q: "What are the India, USA and UK editions?"
        a: "Each edition covers the careers, exams and colleges of one country. India is the main edition; the USA and UK (beta) editions follow the same plan. You can switch from the top bar; the site remembers your choice."
  - id: pages
    title: "Reading a guide"
    items:
      - q: "What does the Last updated date mean?"
        a: "It is the date the page or the data it is built from last changed. It sits on the right of the breadcrumb bar near the top of each guide."
      - q: "Where do the facts on a page come from?"
        a: "From official sources such as the exam body, regulator or government portal. Each guide ends with a Sources section that lists them with links, so you can check any fact yourself."
      - q: "Why does a guide tell me to check the official website?"
        a: "Dates, fees and seat numbers change every year. We update guides, but the official notice is always the final word, so please confirm before you pay a fee or fill a form."
      - q: "What is a roadmap page?"
        a: "A roadmap shows a career as steps in order, from school to your first job, with the exam or course at each step. Most career and sport guides have a button that opens their roadmap."
  - id: finders
    title: "College and coaching finders"
    items:
      - q: "How are colleges and coaching centres chosen for the finders?"
        a: "A place is added only when we can open its own official website or an official government list that names it. Big chains, small local institutes and free government schemes all follow the same rule."
      - q: "What does verified mean in the finders?"
        a: "It means the official page opened and named the place when we checked it. It does not mean we rate the teaching, the results or the fees."
      - q: "Are the finders ranked?"
        a: "No. Listings are in alphabetical order. Nobody pays to appear, and nobody can pay to move up."
      - q: "A college or coaching centre I know is missing. Why?"
        a: "The finders are curated lists, not complete directories. If we could not find an official page for a place, it is not listed yet. Email us the name, city and official link and we will check it."
  - id: help
    title: "Corrections and contact"
    items:
      - q: "I found a mistake. How do I report it?"
        a: "Email us the page link, the fact you think is wrong and, if you can, the official source that shows the right fact. Clear reports are checked first."
      - q: "Can I ask for a career or exam guide that is not on the site?"
        a: "Yes. Email us the name. We read every request, but we cannot promise a date."
      - q: "Do you give one-to-one counselling?"
        a: "No. We publish guides that anyone can read. For a personal decision, talk to your school counsellor, teachers and family, and use our guides to prepare your questions."
      - q: "Does the site collect my personal data?"
        a: "We count visits with Google Analytics in aggregate, and your browser stores small settings such as dark mode and your edition. The Privacy Policy explains this in full."
