          - label: "Premium-pay recruiters"
            text: "Consumer tech and fintech companies — Ola, Swiggy, PhonePe, Zomato, Dream11, Zepto and Lenskart among them — pay the most, and often prefer native expertise for core, high-scale app teams."
          - label: "Industries"
