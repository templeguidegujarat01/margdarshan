  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "What is a realistic Environmental Science salary in India?"
            a: "Freshers commonly earn ₹3-6 LPA in entry-level environmental analyst or technician roles. With an MSc and 3-7 years of experience, this commonly rises to ₹8-15 LPA, especially in consulting, engineering or ESG-related roles. Senior ESG consultants and sustainability specialists are reported to reach ₹18-30+ LPA, particularly at investment, banking or large consulting firms — genuinely the field's highest-paying specific track."
          - q: "Is ESG/sustainability consulting really a growing field, or just hype?"
            a: "It's genuinely backed by real drivers, not just hype. Corporate ESG compliance requirements, India's Net Zero by 2070 commitment, and global Paris Agreement compliance pressures are all pushing companies to hire environmental and sustainability specialists. Banking, energy and consulting firms in particular are reported to pay a real premium for strong ESG skills, making this one of the field's clearest, best-documented growth areas."
          - q: "What is the difference between Environmental Science and Environmental Engineering?"
            a: "Environmental Science is a broader science degree covering ecology, pollution, climate and policy, generally admitting after PCB or PCB-adjacent Class 12 streams. Environmental Engineering is a technical engineering degree focused on designing pollution-control systems, water treatment plants and industrial waste solutions, generally requiring PCM and often JEE-adjacent entry. Engineering roles are reported to pay somewhat more at the technical/design end, while science-track roles offer broader entry into research, policy, consulting and ESG work."
          - q: "Should I specialise within Environmental Science?"
            a: "Yes — this is reported as one of the clearest levers for higher pay in the field. Staying too generalist for too long is reported to cap earning potential; specialising in a specific area like pollution control, climate change, ESG reporting, GIS, or Environmental Health & Safety (EHS) is reported to lead to meaningfully higher pay than remaining a generalist environmental scientist."
          - q: "Is NEET required for Environmental Science?"
            a: "No. Admission is via CUET, university-specific entrance exams, state-level admissions, or direct Class 12 merit, depending on the institute — NEET is not required."
      - note: "Figures are indicative (2026) — confirm on the official college or authority website."
        class: "table-note mt-lg"
