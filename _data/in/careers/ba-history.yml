    eyebrow: "Common myths"
    heading: "Myths vs facts"
    parts:
      - myths:
          - myth: "BA History only leads to teaching."
            fact: "Graduates also work in archives, museums, heritage consulting, publishing, research organisations and government services — teaching is one path among several."
          - myth: "You need to have studied History in Class 11-12 to take BA History."
            fact: "Most universities admit students from any Class 12 stream and subject combination — prior History study helps but isn't a strict requirement."
          - myth: "History is just about memorising dates."
            fact: "University-level History focuses on analysing sources, understanding causation and building arguments — dates are a small part of the actual coursework."
