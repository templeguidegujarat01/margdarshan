# Journey undo — the owner's undo button for one Journey Blueprint upload (docs/free-claude/JOURNEY-README.md).
# Actions tab → "Journey undo" → Run workflow → type the career id (e.g. agricultural-drone-pilot) or the alias upload
# name (e.g. journey-alias--railway-ntpc) → Run. scripts/journey-undo.mjs takes it off; the checks run; one commit.
# Only inbox uploads can be undone — the hand-built blueprints are never touched.
name: Journey undo

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Career id or alias upload to take off the site (see inbox/JOURNEY-REPORT.md or docs/free-claude/JOURNEY-LOG.md)'
        required: true

permissions:
  contents: write
  pages: write

concurrency:
  group: inbox-build
  cancel-in-progress: false

jobs:
  undo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install js-yaml + liquidjs
        run: npm install --prefix "$RUNNER_TEMP/deps" --no-save --no-audit --no-fund js-yaml@4 liquidjs@10
      - name: Take the upload off
        env:
          VERIFY_DEPS: ${{ runner.temp }}/deps
          UNDO_NAME: ${{ inputs.name }}
        run: node scripts/journey-undo.mjs "$UNDO_NAME"
      - name: Safety checks (nothing is committed if one fails)
        env:
          VERIFY_DEPS: ${{ runner.temp }}/deps
        run: |
          node scripts/check-journey-matrix.mjs
          node scripts/build-journey-pages.mjs --check
          node scripts/check-search.mjs
          node scripts/verify-site.mjs --only=journey
      - name: Commit
        env:
          UNDO_NAME: ${{ inputs.name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Journey undo: $UNDO_NAME"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Ask GitHub Pages to rebuild
        continue-on-error: true
        run: |
          curl -fsS -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/pages/builds"
