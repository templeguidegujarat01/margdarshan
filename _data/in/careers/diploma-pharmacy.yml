  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Can I become a Registered Pharmacist with just a D.Pharm?"
            a: "Yes. Unlike many diplomas, D.Pharm is itself a recognised route to becoming a Registered Pharmacist in India. After completing D.Pharm and any required internship/training under your State Pharmacy Council, you register under the Pharmacy Act, 1948, which legally qualifies you to practise as a pharmacist and be the qualified person in charge of a retail or wholesale medical store."
          - q: "What is the difference between D.Pharm and B.Pharm?"
            a: "D.Pharm is a 2-year diploma focused on practical, retail and hospital pharmacy skills, and is enough to register as a Registered Pharmacist. B.Pharm is a 4-year degree with deeper pharmaceutical science, industry and research exposure, and is typically required for roles like Drug Inspector, pharmaceutical R&amp;D, and for pursuing M.Pharm. Many D.Pharm holders use lateral entry to join B.Pharm's second year later."
          - q: "Is an entrance exam required for D.Pharm admission?"
            a: "It varies by state and institute. Many colleges admit purely on Class 12 merit, while a few states run their own pharmacy/paramedical entrance exam. There is no single national entrance exam that every D.Pharm college requires, so always check your target institute's and state's current admission process."
          - q: "Can I open my own medical store after D.Pharm?"
            a: "Yes, this is one of the diploma's biggest draws. After registering as a Registered Pharmacist with your State Pharmacy Council, you can apply for a retail drug license and be the qualified person for your own medical store, subject to the specific licensing rules of your state's drug control authority."
          - q: "Which subjects are covered in D.Pharm?"
            a: "Core subjects include Pharmaceutics, Pharmaceutical Chemistry, Pharmacology, Pharmacognosy, Biochemistry, Human Anatomy & Physiology, Hospital & Community Pharmacy, and Pharmaceutical Jurisprudence, combined with practical lab work each semester."
      - note: "*Fee and salary figures are indicative, based on publicly available information as of 2026, and vary significantly by state, institute and employer — always verify current figures directly with your target institute and State Pharmacy Council."
        class: "table-note mt-lg"
