# USA Edition — student-facing copy for each career page (/us/careers/<slug>/).
# Facts (pay, outlook, tasks, states…) come from occupations.yml and
# occupation_details.yml; this file only holds explanation and guidance.
#   intro      what the field is, in plain U.S. English
#   study      what you study in college
#   hs         high school courses that help (Margdarshan suggestions; the page
#              also shows BLS's own advice from occupation_details → hs_prep)
#   majors     typical college majors
#   route      roadmap steps "Tag|Title|Text" (s1..s5 of roadmap-flow.html)
#   tips       practical tips — shown as Margdarshan's advice, not as source facts
#   faqs       { q, a } — rendered and emitted as FAQPage JSON-LD
#   key_numbers  optional reality-check cards { label, value, note, source }
#   last_reviewed

computer-science:
  intro: "Computer science is the study of computation: algorithms, data structures, programming, systems and the theory behind them. It is a field of study, not a single job — graduates become software developers, systems analysts, security analysts, data scientists and researchers."
  study: "Programming, algorithms and data structures, computer architecture, operating systems, databases, networks, discrete math, calculus, linear algebra and electives such as AI, security or graphics."
  hs: ["The most advanced math you can take (calculus if available)", "AP Computer Science A or AP Computer Science Principles where offered", "Physics or another lab science", "Writing-heavy courses — documentation and teamwork are daily work"]
  majors: ["Computer science", "Computer engineering", "Software engineering", "Mathematics with programming"]
  route:
    - "High school|Math and programming|Take the strongest math available and any CS course your school offers."
    - "College|Bachelor's in computer science|Four years; most software jobs list a bachelor's as the typical entry level."
    - "Experience|Internships and projects|Summer internships, research or open-source work before graduating."
    - "Job|Entry-level role|Software developer, systems analyst, QA or IT roles."
    - "Goal|Grow or specialize|Senior engineering, security, data or research; a master's helps for some specialties."
  tips:
    - "Build things outside class — a small portfolio on GitHub shows employers what you can do."
    - "Aim for at least one internship before senior year; many full-time offers start from internships."
    - "Learn to read and write clearly: specifications, code reviews and reports are a large part of the job."
  faqs:
    - { q: "Is computer science the same as software engineering?", a: "They overlap heavily. Computer science is broader and more theoretical; software engineering programs focus on building and maintaining large software systems. BLS counts both kinds of graduates who write software as software developers." }
    - { q: "Do I need a master's degree?", a: "Not for most software jobs, where a bachelor's is the typical entry level. Research roles, such as computer and information research scientists, typically need a master's degree and some prefer a Ph.D." }
    - { q: "Is AI reducing demand for computer science graduates?", a: "BLS still projects software developer employment to grow much faster than average from 2025 to 2035, partly because of software for AI, IoT and robotics. It does note that AI tools may soften growth for some roles, such as web development." }
  last_reviewed: 2026-10-07

software-engineering:
  intro: "Software engineering applies engineering discipline — requirements, design, testing and maintenance — to building software that real people and businesses rely on. Graduates design, build, test and improve applications and systems."
  study: "Programming, software design and architecture, testing and quality, requirements, databases, project management and team-based capstone projects, alongside core computer science."
  hs: ["Advanced math (algebra through calculus if available)", "AP Computer Science A or AP Computer Science Principles", "Any course with team projects", "English and communication — you will write and review a lot"]
  majors: ["Software engineering", "Computer science", "Computer engineering"]
  route:
    - "High school|Build a base|Math, any programming course and small personal projects."
    - "College|Bachelor's degree|Software engineering or computer science, usually four years."
    - "Experience|Internships|Team projects, internships and code you can show."
    - "Job|Developer or QA|Software developer, QA analyst/tester, web or database roles."
    - "Goal|Lead and design|Senior engineer, architect or engineering manager with experience."
  tips:
    - "Learn version control (Git) and testing early — O*NET lists Git among the technologies software developers use most."
    - "Practice working in teams; 71% of software developers told O*NET that teamwork is extremely important."
    - "Read other people's code: modifying existing software is one of the most common tasks."
  faqs:
    - { q: "Is there a license for software engineers?", a: "No license is required for most software jobs in the U.S. A PE license exists for engineers who offer services directly to the public, but it is rarely part of software careers." }
    - { q: "What is the difference between a software developer and a QA tester?", a: "Developers design and build software; quality assurance analysts and testers design and run tests to find problems. BLS reports a median pay of $135,980 for developers and $104,300 for QA analysts and testers (May 2025)." }
    - { q: "Can I get a job without a degree?", a: "Some web roles accept a high school diploma plus a strong portfolio, according to BLS, but a bachelor's degree is the typical entry level for software developers." }
  last_reviewed: 2026-10-07

artificial-intelligence:
  intro: "Artificial intelligence and machine learning build systems that learn from data, recognize patterns and make predictions. There is no separate 'AI engineer' occupation in U.S. government statistics, so this page shows the occupations where AI work is counted: computer and information research scientists, data scientists and software developers."
  study: "Computer science foundations plus linear algebra, calculus, probability and statistics, machine learning, deep learning, data systems and, for research, graduate-level theory."
  hs: ["Calculus and statistics (AP Calculus and AP Statistics where offered)", "AP Computer Science A", "Physics", "Any research, science fair or data project"]
  majors: ["Computer science", "Data science", "Mathematics or statistics", "Computer engineering"]
  route:
    - "High school|Math first|Calculus, statistics and programming matter most."
    - "College|Bachelor's degree|Computer science, math or data science with ML electives."
    - "Graduate|Master's or Ph.D.|Research scientist roles typically need a master's; some prefer a Ph.D."
    - "Job|Applied or research role|Software developer, data scientist or research scientist working on AI."
    - "Goal|Build or advance AI|Lead AI products or research."
  tips:
    - "Get strong at linear algebra and statistics — they are the foundation of machine learning."
    - "Do a research project with a professor; research experience matters for graduate school."
    - "Expect competition for research roles; there were 38,600 computer and information research scientist jobs in 2025, far fewer than software developer jobs."
  faqs:
    - { q: "Why doesn't this page show an 'AI engineer' salary?", a: "Because neither BLS nor O*NET has an AI engineer occupation. We show official figures for the occupations where AI work is counted instead of inventing a number." }
    - { q: "Do I need a Ph.D. to work in AI?", a: "Not for applied roles — many software developers and data scientists work with AI after a bachelor's or master's. Research scientist roles typically require a master's, and some employers prefer a Ph.D." }
    - { q: "Is AI changing what students study?", a: "Yes. In a Lumina–Gallup survey from October 2025, 42% of bachelor's students said AI made them think at least a fair amount about changing their major, and 16% of enrolled students had already switched because of AI." }
  last_reviewed: 2026-10-07

data-science:
  intro: "Data science turns large amounts of data into decisions, using statistics, programming and machine learning. Data scientists clean and analyze data, build predictive models and explain the results to people who act on them."
  study: "Statistics and probability, linear algebra, calculus, programming (often Python or R), databases, machine learning, data visualization and communication."
  hs: ["Linear algebra, calculus, and probability and statistics where offered (BLS's own advice)", "AP Statistics and AP Computer Science", "Any course that asks you to present findings"]
  majors: ["Data science", "Statistics", "Mathematics", "Computer science", "Economics with heavy quantitative coursework"]
  route:
    - "High school|Math and stats|Calculus and statistics are the core."
    - "College|Bachelor's degree|Math, statistics, computer science or data science."
    - "Option|Master's degree|44% of data scientists told O*NET a master's is required for their job."
    - "Job|Analyst or data scientist|Start with analysis, then modeling and machine learning."
    - "Goal|Lead with data|Senior data scientist, ML specialist or analytics lead."
  tips:
    - "Show your work: a project that takes a messy real dataset to a clear recommendation is worth more than certificates."
    - "Practice explaining results simply — presenting findings to managers is a core task."
    - "Learn SQL; most data lives in databases."
  faqs:
    - { q: "Do I need a master's degree?", a: "Not always. BLS lists a bachelor's degree as the typical entry level, but some employers require or prefer a master's or doctorate, and 44% of data scientists surveyed by O*NET said a master's is required for their job." }
    - { q: "Is data science growing?", a: "Yes. BLS projects employment of data scientists to grow 35% from 2025 to 2035, much faster than average, with about 24,800 openings a year." }
    - { q: "Which states have the most data science jobs?", a: "In May 2025, California, Texas, New York, Pennsylvania and North Carolina had the most data scientist jobs, according to BLS state data." }
  last_reviewed: 2026-10-07

cybersecurity:
  intro: "Cybersecurity protects computer systems, networks and data from attacks. Information security analysts plan and carry out security measures, monitor for threats and respond when something goes wrong."
  study: "Networking, operating systems, programming, cryptography, security architecture, risk management, digital forensics and incident response."
  hs: ["Computer science or IT courses", "Math through at least precalculus", "Any networking or cyber club or competition", "Writing — reports on risks and incidents are part of the job"]
  majors: ["Cybersecurity", "Computer science", "Information technology or information systems", "Computer engineering"]
  route:
    - "High school|Tech foundations|Computer, networking and math courses; cyber clubs or competitions."
    - "College|Bachelor's degree|Computer science, cybersecurity or IT."
    - "Experience|Related IT work|BLS: often less than 5 years in network or systems administration first."
    - "Credential|Security certification|Many employers prefer an information security certification."
    - "Goal|Security analyst and beyond|Analyst, then senior, architect or security management roles."
  tips:
    - "Expect an experience-first path: many analysts start in IT support or network administration."
    - "Be ready for irregular hours — 62% of analysts told O*NET they work more than 40 hours a week, and BLS notes on-call duty."
    - "Look at where the jobs are: Virginia had the most information security analyst jobs in May 2025, ahead of Texas and California."
  faqs:
    - { q: "Can I start in cybersecurity without a degree?", a: "Some people do, with a high school diploma plus industry certifications, according to BLS. A bachelor's degree in computer science or a related field is the usual route." }
    - { q: "Are certifications required?", a: "Not by law, but BLS says many employers prefer candidates with an information security certification." }
    - { q: "How fast is cybersecurity growing?", a: "BLS projects 21% growth for information security analysts from 2025 to 2035, much faster than average, with about 14,100 openings a year." }
  last_reviewed: 2026-10-07

computer-engineering:
  intro: "Computer engineering sits between electrical engineering and computer science: designing processors, circuit boards, embedded systems and the low-level software that runs on them. Graduates work as computer hardware engineers, electrical and electronics engineers, and software developers."
  study: "Circuits, digital logic, computer architecture, embedded systems, signals, programming (C and C++), operating systems and lab work, alongside engineering math and physics."
  hs: ["Calculus and physics (AP Physics C where offered)", "AP Computer Science A", "Electronics, robotics or maker clubs"]
  majors: ["Computer engineering", "Electrical engineering", "Electrical and computer engineering"]
  route:
    - "High school|Math, physics, code|Calculus, physics and programming."
    - "College|Bachelor's degree|Computer engineering, ideally ABET-accredited."
    - "Experience|Labs and co-ops|Internships in hardware, semiconductors or embedded systems."
    - "Job|Hardware or embedded role|Hardware engineer, embedded software or electronics engineer."
    - "Goal|Specialize|Chip design, systems architecture or a master's for advanced design roles."
  tips:
    - "Plan for graduate study if you want advanced chip design: 34% of hardware engineers told O*NET a master's is required for their job."
    - "Expect long weeks at times — 76% of hardware engineers reported working more than 40 hours."
    - "Jobs cluster in a few states: California had most hardware engineer jobs in May 2025, followed by Texas and New Mexico."
  faqs:
    - { q: "Computer engineering or computer science?", a: "Choose computer engineering if you want to work on hardware and how software meets it; computer science if you mainly want to build software. Both lead to software jobs." }
    - { q: "Do computer engineers need a PE license?", a: "BLS does not list a license requirement for computer hardware engineers. A PE matters mainly for engineers who offer services directly to the public." }
    - { q: "How much do computer hardware engineers earn?", a: "BLS reports a median of $161,740 in May 2025; the lowest 10% earned under $92,940 and the highest 10% over $225,330." }
  last_reviewed: 2026-10-07

mechanical-engineering:
  intro: "Mechanical engineering designs and improves anything that moves or uses energy: engines, machines, vehicles, robots, HVAC systems and manufacturing equipment. It is one of the broadest engineering fields."
  study: "Statics and dynamics, thermodynamics, fluid mechanics, materials, machine design, manufacturing, controls, CAD and lab work."
  hs: ["Calculus and physics", "Chemistry", "Shop, robotics or engineering design courses", "Drafting or CAD if offered"]
  majors: ["Mechanical engineering", "Mechanical engineering technology", "Aerospace engineering"]
  route:
    - "High school|Math and physics|Calculus, physics and hands-on projects."
    - "College|Bachelor's degree|Mechanical engineering, ideally ABET-accredited; co-ops common."
    - "Exam|FE exam (optional)|Leads to Engineer in Training status — the first PE step."
    - "Job|Design or manufacturing|Product design, testing, manufacturing or HVAC."
    - "Goal|Senior engineer or PE|PE license if you offer services to the public; management roles."
  tips:
    - "Do a co-op or internship; BLS notes many programs emphasize them."
    - "Learn CAD tools such as SolidWorks — O*NET lists them among the most-used technologies."
    - "Look beyond California: Michigan had the most mechanical engineer jobs of any state in May 2025."
  faqs:
    - { q: "Do mechanical engineers need a license?", a: "BLS says all states and DC require mechanical engineers who sell services to the public to be licensed (PE). Many engineers in industry work without a PE." }
    - { q: "What is the job outlook?", a: "BLS projects 11% growth from 2025 to 2035, much faster than average, driven by automation and innovation." }
    - { q: "What is mechanical engineering technology?", a: "A more applied, hands-on degree. BLS lists it as a route into the field; check how the program affects PE eligibility in your state." }
  last_reviewed: 2026-10-07

civil-engineering:
  intro: "Civil engineering plans, designs and builds infrastructure: roads, bridges, tunnels, water and sewer systems, airports and buildings. Much of the work is public, so many civil engineers work for government or government contractors."
  study: "Statics, structures, geotechnical engineering, transportation, water resources, environmental engineering, surveying and CAD."
  hs: ["Calculus and physics", "Chemistry or environmental science", "Drafting or CAD if offered", "Any project-management or team activities"]
  majors: ["Civil engineering", "Environmental engineering", "Structural or construction engineering programs"]
  route:
    - "High school|Math and science|Calculus, physics and chemistry."
    - "College|Bachelor's degree|Civil engineering from an ABET-accredited program."
    - "Exam|FE exam|Pass and become an Engineer in Training (EIT)."
    - "Experience|About 4 years|Qualifying work under licensed engineers."
    - "Goal|PE license|Needed to sign off and provide services directly to the public."
  tips:
    - "Plan for the PE: in civil engineering it is the normal route to senior and public-facing roles."
    - "Expect a mix of office and site work — O*NET reports daily phone calls and face-to-face meetings for most civil engineers."
    - "Government is a big employer: BLS lists state government (11%) and local government (10%) among the largest employers of civil engineers."
  faqs:
    - { q: "Do civil engineers need a PE license?", a: "Not for entry-level jobs. BLS says civil engineers need a PE license to provide services directly to the public, and it helps with advancement." }
    - { q: "What is the job outlook?", a: "BLS projects 6% growth from 2025 to 2035, faster than average, with about 22,700 openings a year, driven by infrastructure investment." }
    - { q: "Where are the most civil engineering jobs?", a: "In May 2025, California, Texas, Florida, New York and Pennsylvania had the most civil engineer jobs, according to BLS state data." }
  last_reviewed: 2026-10-07

electrical-engineering:
  intro: "Electrical engineering designs and develops electrical equipment and systems — power grids, motors, communications, navigation and control systems — and, with electronics engineering, the circuits inside consumer and industrial products."
  study: "Circuits, electromagnetics, signals and systems, electronics, power systems, controls, communications, programming and lab work."
  hs: ["Physics and math, including algebra, trigonometry and calculus (BLS's own advice)", "AP Physics C where offered", "Robotics or electronics clubs"]
  majors: ["Electrical engineering", "Electronics engineering", "Electrical and computer engineering"]
  route:
    - "High school|Physics and calculus|BLS points to physics and math through calculus."
    - "College|Bachelor's degree|Electrical or electronics engineering; co-ops and internships common."
    - "Exam|FE exam (optional)|First step toward a PE license."
    - "Job|Design, power or electronics|Utilities, manufacturing, engineering services or federal work."
    - "Goal|Senior engineer or PE|A PE lets you sign off on projects and serve the public."
  tips:
    - "Pick a direction early: power, electronics and communications lead to different industries."
    - "Learn MATLAB and Python — both appear among O*NET's most-used technologies for electrical engineers."
    - "Michigan ranks third for electrical engineer jobs, behind California and Texas (May 2025)."
  faqs:
    - { q: "Do electrical engineers need a PE license?", a: "Not to work in most industry jobs. BLS says experienced engineers may earn a PE to oversee other engineers, sign off on projects and provide services directly to the public." }
    - { q: "What is the job outlook?", a: "BLS projects 8% growth from 2025 to 2035 for electrical and electronics engineers combined, driven by consumer electronics, solar, semiconductors and communications." }
    - { q: "Electrical or electronics engineering?", a: "Electrical engineering covers power and large systems; electronics engineering focuses on circuits and devices. BLS reports a May 2025 median of $120,630 for electrical engineers and $130,220 for electronics engineers." }
  last_reviewed: 2026-10-07

aerospace-engineering:
  intro: "Aerospace engineering designs aircraft, spacecraft, satellites, missiles and drones, and the systems that keep them flying. It splits into aeronautical (within the atmosphere) and astronautical (space) engineering."
  study: "Aerodynamics, propulsion, structures, flight mechanics, orbital mechanics, controls, materials and design projects."
  hs: ["Chemistry, physics and math (BLS's own advice)", "AP Calculus and AP Physics where offered", "Rocketry, drone or robotics clubs"]
  majors: ["Aerospace engineering", "Mechanical engineering", "Aeronautical or astronautical engineering"]
  route:
    - "High school|Math and science|Chemistry, physics and calculus."
    - "College|Bachelor's degree|Aerospace engineering, ideally ABET-accredited."
    - "Check|Clearance and citizenship|Defense projects may need a security clearance; some require U.S. citizenship."
    - "Job|Design, test or systems|Aircraft, space or defense manufacturers, federal agencies."
    - "Goal|Lead programs|Senior or lead engineer; graduate study for research roles."
  tips:
    - "If you are not a U.S. citizen, check clearance and export-control limits before choosing defense-focused employers."
    - "Expect long weeks at times: 73% of aerospace engineers told O*NET they work more than 40 hours."
    - "Jobs cluster around aerospace hubs: California, Texas, Alabama, Washington and Colorado led in May 2025."
  faqs:
    - { q: "Can international students become aerospace engineers in the U.S.?", a: "Yes, but defense-related jobs may need a security clearance, and BLS notes some clearances require U.S. citizenship. Check each employer's requirements before you apply." }
    - { q: "What is the job outlook?", a: "BLS projects 8% growth from 2025 to 2035, much faster than average, citing quieter, more efficient aircraft, cheaper satellite launches and drones." }
    - { q: "Aerospace or mechanical engineering?", a: "Aerospace is more specialized; mechanical is broader and can still lead into aerospace companies. Both are common routes." }
  last_reviewed: 2026-10-07

# ======================= Phase 6 pathways =======================
# key_numbers (optional): reality-check figures shown as cards — { label, value, note, source }

medicine:
  intro: "Medicine trains physicians and surgeons who diagnose and treat illness and injury. In the U.S. it is a graduate path: a bachelor's degree with pre-med courses, four years of medical school (M.D. or D.O.), then three to nine years of residency before practicing independently."
  study: "As an undergraduate: biology, general and organic chemistry, physics, biochemistry, math or statistics, plus psychology and sociology (all tested on the MCAT). In medical school: two years of basic and clinical science, then clinical rotations."
  hs: ["Biology, chemistry and physics (AP or honors where offered)", "Calculus or statistics", "Strong writing and speaking skills", "Volunteering or shadowing in healthcare to test your interest early"]
  majors: ["Any major — medical schools do not require a specific one", "Common choices: biology, chemistry, biochemistry, neuroscience, psychology"]
  route:
    - "High school|Science foundation|Biology, chemistry, physics and math; early healthcare exposure."
    - "College|Bachelor's + pre-med|Any major with the pre-med courses, then the MCAT."
    - "Med school|M.D. or D.O.|Four years; USMLE (M.D.) or COMLEX-USA (D.O.) exams begin here."
    - "Residency|3 to 9 years|Paid supervised training in a specialty; fellowship adds 1 to 3 years."
    - "Goal|State medical license|Granted by a state medical board; board certification is optional."
  key_numbers:
    - { label: "Applied to U.S. M.D. schools (2025)", value: "54,699", note: "23,440 enrolled — the largest class to date", source: aamc_enrollment_2025 }
    - { label: "Median 4-year cost of attendance, class of 2026", value: "$297,745 public / $408,150 private", note: "AAMC figures; plan financing early", source: aamc_cost }
    - { label: "Federal loans for professional students from July 2026", value: "$50,000 a year", note: "$200,000 total; Grad PLUS ends for new borrowers", source: ed_obbba_loans }
  tips:
    - "Plan the money before you apply: with Grad PLUS ending for new borrowers, federal loans may not cover a full cost of attendance."
    - "Get real exposure — shadowing and clinical volunteering show admissions committees (and you) that you understand the work."
    - "Specialty choice changes pay a lot: BLS medians range from $210,040 for general pediatricians to $559,030 for pediatric surgeons."
  faqs:
    - { q: "How long does it take to become a doctor in the U.S.?", a: "It takes 4 years of college, 4 years of medical school and 3 to 9 years of residency depending on the specialty, plus 1 to 3 years of fellowship if you subspecialize (BLS)." }
    - { q: "What is the difference between an M.D. and a D.O.?", a: "Both are fully licensed physicians who can practice any specialty. D.O. programs add emphasis on the musculoskeletal system and whole-person care, and D.O. students take the COMLEX-USA licensing exams." }
    - { q: "Does passing the USMLE make me a licensed doctor?", a: "No. You also need an M.D. or D.O., residency training and a license from a state medical board." }
  last_reviewed: 2026-10-07

dentistry:
  intro: "Dentistry diagnoses and treats problems of the teeth, gums and mouth. U.S. dentists earn a D.D.S. or D.M.D. after college, pass national and clinical exams, and are licensed by the state; specialists such as orthodontists and oral surgeons train further."
  study: "Pre-dental college science (biology, general and organic chemistry, physics), then dental school: anatomy, local anesthesia, periodontics, radiology and supervised patient care."
  hs: ["Biology, chemistry and math (BLS's own advice)", "Physics", "Art, crafts or anything that builds fine hand skills", "Healthcare volunteering or shadowing a dentist"]
  majors: ["Any major with the pre-dental science courses", "Common choices: biology, chemistry, biochemistry"]
  route:
    - "High school|Science and dexterity|Biology, chemistry, math; shadow a dentist."
    - "College|Bachelor's + DAT|Pre-dental courses, then the Dental Admission Test."
    - "Dental school|D.D.S. or D.M.D.|Usually four years with clinical patient care."
    - "Exams|INBDE + clinical exam|National board exam plus a state or regional clinical exam."
    - "Goal|State dental license|Optional 2- to 4-year residency for a specialty."
  key_numbers:
    - { label: "Dentists working in dental offices", value: "78%", note: "12% are self-employed — many own a practice", source: bls_ooh }
    - { label: "Federal loans for professional students from July 2026", value: "$50,000 a year", note: "$200,000 total; Grad PLUS ends for new borrowers", source: ed_obbba_loans }
  tips:
    - "Think about business as well as science — many dentists run their own practice."
    - "Specialties pay more but add years: oral and maxillofacial surgeons had a median of $352,220 versus $170,950 for general dentists (BLS, May 2025)."
    - "Prepare early for the DAT; besides science and reading, it has a Perceptual Ability section that tests spatial reasoning (ADA)."
  faqs:
    - { q: "D.D.S. or D.M.D. — which is better?", a: "Neither. They are the same degree with different names, depending on the school, and both lead to the same license." }
    - { q: "Do dentists work long hours?", a: "Often not: BLS says many dentists work less than 40 hours a week, although some work considerably more and some work evenings and weekends." }
    - { q: "What exams do dentists take?", a: "The DAT to get into dental school, then the INBDE national board exam and usually a state or regional clinical exam for the license." }
  last_reviewed: 2026-10-07

pharmacy:
  intro: "Pharmacy prepares pharmacists who dispense medications, check prescriptions for safety, advise patients and work with doctors on drug therapy. The U.S. entry degree is the Doctor of Pharmacy (Pharm.D.), followed by licensing exams."
  study: "Prerequisites in chemistry, biology, anatomy and physiology, physics and statistics, then pharmacology, medicinal chemistry, pharmacotherapy, pharmacy law and supervised practice experiences."
  hs: ["Chemistry and biology (AP where offered)", "Math through calculus or statistics", "Customer-facing work — pharmacists talk to patients all day"]
  majors: ["Pre-pharmacy coursework in any major", "Common choices: chemistry, biology, biochemistry", "Some 6-year programs admit students straight from high school"]
  route:
    - "High school|Chemistry first|Chemistry, biology and math."
    - "College|Prerequisites|Usually at least 2 years of prerequisite courses; the PCAT is no longer used."
    - "Pharm.D.|Doctor of Pharmacy|Usually 4 years; some 3-year options and 6-year direct-entry programs."
    - "Exams|NAPLEX + MPJE|National practice exam plus a state law exam (or Uniform MPJE)."
    - "Goal|State license|Optional 1- to 2-year residency for clinical roles."
  key_numbers:
    - { label: "Pharmacists in hospitals", value: "32%", note: "37% work in pharmacies and drug retailers", source: bls_ooh }
    - { label: "PCAT admission test", value: "Retired Jan 2024", note: "Pharmacy schools no longer require it", source: aacp_pcat }
  tips:
    - "Look at where growth is: BLS expects more demand in hospitals and clinics and limited demand in retail as prescriptions move online and by mail."
    - "A residency helps for clinical hospital roles; hospital pharmacists had a higher median ($157,290) than pharmacy-retail ones ($132,940) in May 2025."
    - "Be ready for precision under pressure — 89% of pharmacists told O*NET that being exact is extremely important."
  faqs:
    - { q: "Do I need the PCAT?", a: "No. The PCAT was retired in January 2024 and pharmacy schools no longer use it." }
    - { q: "Can I enter pharmacy school straight from high school?", a: "Some 6-year programs admit high school graduates. Most students complete about 2 years of prerequisite college courses first." }
    - { q: "Is pharmacy still a good career?", a: "BLS projects 5% growth from 2025 to 2035, faster than average, but expects slower demand in retail pharmacies and more demand in hospitals and clinics." }
  last_reviewed: 2026-10-07

nursing:
  intro: "Registered nurses held 3,465,400 jobs in 2025, according to BLS. RNs assess patients, give medications and treatments, and coordinate care. With a graduate degree, RNs can become advanced practice nurses — nurse practitioners, nurse midwives and nurse anesthetists."
  study: "Anatomy, physiology, microbiology, chemistry, pharmacology, psychology and nursing practice, with supervised clinical rotations in hospitals and clinics."
  hs: ["Biology and chemistry", "Algebra and statistics (dosage math matters)", "Psychology or health science courses", "Volunteering in a hospital or care home"]
  majors: ["Nursing (BSN)", "Associate degree in nursing (ADN/ASN) at community colleges", "Accelerated BSN for people who already have a bachelor's"]
  route:
