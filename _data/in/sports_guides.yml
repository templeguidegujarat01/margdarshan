        nav: "Quick doubts"
        eyebrow: "Quick doubts"
        heading: "Straight answers"
        parts:
          - qa:
              q: "I live far from the mountains. Can I still try a winter sport?"
              a: "India's national winter competitions are held only in <strong>Leh (ice)</strong> and <strong>Gulmarg (snow)</strong>, so most players come from or train in Ladakh and Jammu &amp; Kashmir. Ice skating and ice hockey need an ice rink, and snow sports need a slope."
            source: "pib-kiwg26,kiwg26"
          - qa:
              q: "Do winter players get government support?"
              a: "Yes. Winter athletes can be in <strong>TOPS</strong> — skier Arif Khan was added in 2022 — and the <strong>Khelo India Winter Games</strong> are run by the Sports Ministry every year."
            source: "pib-arif22,pib-kiwg26"
