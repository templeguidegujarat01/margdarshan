  read_time: "8 min read"
  intro:
    - "Deck officers navigate merchant ships, manage cargo and lead the crew, rising from Deck Cadet to Third Officer, Second Officer, Chief Officer and finally Master (Captain). Entry is through a Directorate General of Shipping (DG Shipping)-approved pre-sea course — usually admitted through the Indian Maritime University Common Entrance Test (IMU CET) — followed by sea time and Certificate of Competency exams."
