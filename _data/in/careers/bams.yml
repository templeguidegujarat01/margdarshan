  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What is BAMS?"
    parts:
      - overview:
          points:
            - "BAMS is a professional degree in Ayurveda, India's traditional system of medicine, combining Ayurvedic principles with modern medical science subjects like anatomy and physiology to diagnose, prevent and treat disease."
            - "It's regulated by the <strong>National Commission for Indian System of Medicine (NCISM)</strong> under the Ministry of AYUSH."
            - "The field's standing has genuinely shifted in recent years."
          more:
            - "Regulatory reform now permits <strong>58 authorised surgical procedures</strong> for MS Ayurveda postgraduates, the <strong>National AYUSH Mission and Ayushman Bharat's AYUSH Wellness Centres</strong> are creating real government positions, and the global Ayurveda and wellness market is projected to cross <strong>$14.9 billion by 2030</strong>."
            - "What hasn't changed is an honest, important limit: BAMS does not grant full modern-medicine (allopathic) practice rights in India."
  - id: "who"
    hid: "who-heading"
    alt: true
    eyebrow: "Fit check"
    heading: "Who should choose BAMS"
    parts:
      - fit:
          match:
            - "Have genuine interest in Ayurveda and natural healing — not just choosing it because the NEET cutoff is lower."
            - "Want a licensed medical career with a considerably more accessible entrance requirement than MBBS."
            - "Are interested in India's growing wellness, spa tourism and Ayurvedic pharmaceutical industry as a career direction."
          mismatch:
            - "Specifically want to practise modern/allopathic medicine — BAMS does not grant this right in India, with narrow rural exceptions."
            - "Are choosing it purely as an \"easier NEET\" fallback without genuine interest in Ayurveda itself."
            - "Expect a BAMS degree to be automatically recognised as a medical licence abroad — recognition varies significantly by country."
  - id: "eligibility"
    hid: "elig-heading"
    eyebrow: "Eligibility"
    heading: "Who can apply for BAMS"
    parts:
      - elig_list:
          - "Class 12 pass with <strong>Physics, Chemistry and Biology (PCB)</strong> — under updated NCISM 2025-26 regulations, no minimum PCB aggregate is mandated beyond a Class 12 pass."
          - "A qualifying score in <strong>NEET-UG</strong> is mandatory — the qualifying floor is just the <strong>50th percentile</strong> for General category (40th for SC/ST/OBC)."
          - "This makes BAMS one of the more genuinely accessible NEET-based medical routes, though a safe government-college score is still considerably higher, typically <strong>550-650 marks</strong>."
