  - id: "faq"
    hid: "faq-heading"
    alt: true
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Can I start CFA right after Class 12?"
            a: "Not immediately. To sit the CFA Level I exam you generally need a bachelor's degree, or to be within 23 months of completing one, or an alternative combination of 4,000 hours of work experience and/or higher education over at least 3 sequential years. Most Indian students start preparing for Level I during the final year or two of their bachelor's degree."
          - q: "Is the CFA charter recognised for jobs in India?"
            a: "Yes. The CFA charter is widely recognised in Indian investment banks, asset management companies, research firms and Global Capability Centres, and many roles in equity research, portfolio management and financial analysis explicitly prefer or require it."
          - q: "How is CFA different from an MBA in Finance?"
            a: "An MBA is a broad management degree covering strategy, marketing, operations and more, completed through a university over 1-2 years. CFA is a narrower, self-study qualification focused specifically on investment analysis, valuation and portfolio management, usually completed over 2-4 years alongside work."
          - q: "Do I need to know the exact passing marks to clear each CFA level?"
            a: "No fixed percentage is published. CFA Institute sets a Minimum Passing Score (MPS) for each exam using a standard-setting process after each administration, rather than a fixed 50% or similar rule. Your result is reported simply as pass or fail."
          - q: "Can commerce, science or arts students all pursue CFA?"
            a: "Yes. CFA doesn't require a specific stream in school — what matters is your bachelor's degree (in progress or completed) or equivalent work experience. Students from Commerce, Science and Arts backgrounds all pursue CFA successfully."
      - note: "*Salary and fee figures are illustrative and based on figures reported for the 2026 exam cycle; USD-based fees will vary with the exchange rate at the time of payment."
        class: "table-note mt-lg"
