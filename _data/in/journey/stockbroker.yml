# Journey Blueprint — Stockbroker (NISM certification → dealer / approved user → SEBI-registered broker). Printed on journey-stockbroker.html.
# Rules, classes and the money items / sources several careers share: _data/in/journey_common.yml.
id: stockbroker
v: 2
name: "Stockbroker (NISM certification → dealer → SEBI-registered broker)"
search: ["stockbroker", "stock broker", "share broker", "equity dealer", "derivatives dealer", "nism series viii", "sub broker", "authorised person"]
page: "journey-stockbroker.html"
doubts_page: "journey-stockbroker.html"
gate: "Any stream; a commerce or finance degree helps → NISM certification (Series VIII Equity Derivatives for approved users and sales staff, Series VII for operations and risk) → work for a stock broker → after experience, a broker firm can register with SEBI under the Stock Brokers Regulations, 2026."
gate_source: [nism-viii, nism-vii, sebi-sb26]
core:
  what:
    text: "A stock broker is a SEBI-registered member of a stock exchange that buys and sells securities for clients. The people who place trades and sell products for a broker — approved users, dealers and sales staff — must pass the NISM certification that SEBI requires for their role."
    source: [sebi-sb26, nism-viii, nism-vii]
  day:
    - "Take client orders and place trades on the exchange terminal."
    - "Explain equity, futures and options products and their risks to clients."
    - "Handle margins, settlement and client complaints in the broker's back office."
  pay_note: "Brokers and dealers are paid by private firms; no official pay scale exists, so none is printed."
  routes:
    - { title: "Dealer / approved user (derivatives)", text: "NISM-Series-VIII: Equity Derivatives is the benchmark for associated persons working as approved users and sales personnel of a trading member in the equity derivatives segment.", source: nism-viii }
    - { title: "Operations and risk", text: "NISM-Series-VII: Securities Operations and Risk Management is for associated persons of a broker who handle client funds and assets, grievances, internal control and risk management.", source: nism-vii }
    - { title: "Your own broking firm", text: "SEBI's Stock Brokers Regulations, 2026 ask the applicant for at least two years in the business of trading or dealing in securities, NISM certification, a minimum net worth (₹1 crore base for a trading member) and a designated director who stays in India at least 182 days a year.", source: sebi-sb26 }
    - { title: "Research analyst", text: "To publish research and recommendations, SEBI's Research Analyst registration needs a graduate degree plus NISM Series XV.", source: sebi }
  cost_time:
    - { label: "NISM Series VIII fee", value: "₹1,500 + payment-gateway charges", source: nism-viii }
    - { label: "Certificate validity", value: "3 years (Series VIII)", source: nism-viii }
  cost_note: "We did not read NISM's Series VII fee on its page, so it is not printed."
  challenges:
    - text: "Negative marking: 25% of a question's marks is lost for a wrong answer in both Series VII and VIII."
      source: [nism-vii, nism-viii]
    - text: "Certificates expire — Series VIII is valid for 3 years."
      source: nism-viii
    - text: "Starting your own broking firm needs at least ₹1 crore base net worth as a trading member, plus two years' experience."
      source: sebi-sb26
  not_for:
    - "You panic when markets fall — dealers work through volatile days."
    - "You dislike rules and compliance paperwork."
    - "You want a government job with a fixed pay scale."
journey:
  - stages: [c8, c9]
    title: "Numbers and the news"
    do:
      - text: "NISM's derivatives exam tests the Indian equity derivatives market, futures and options strategies, clearing and settlement, and market regulation."
        source: nism-viii
    doubts:
      - q: "What does a stockbroker do?"
        a: "A stock broker is a SEBI-registered member of a stock exchange that trades securities for clients. People who place trades or sell products for a broker must hold the NISM certificate for that role."
        next: "Follow the share market news to learn the words."
        source: [sebi-sb26, nism-viii]
  - stages: [c10]
    title: "Commerce helps, but any stream works"
    do:
      - text: "NISM certifications are open exams; the pages read do not ask for a school stream."
        source: [nism-viii, nism-vii]
    stream: "Commerce with Maths is the most direct; Science or Arts students can also take NISM exams."
    doubts:
      - q: "Which stream should I take to become a stockbroker?"
        a: "NISM's Series VII and VIII pages do not ask for a school stream. Commerce with Maths prepares you best for markets and accounts, and a graduate degree is needed if you later want to be a SEBI research analyst."
        next: "Pick Commerce with Maths if you can."
        source: [nism-viii, sebi]
  - stages: [c11, c12]
    title: "Learn how markets work"
    do:
      - text: "NISM offers free study material downloads for its certification exams."
        source: nism-viii
    doubts:
      - q: "Can I sit an NISM exam while in school?"
        a: "NISM's Series VIII page lists no age or education rule, but the pass certificate is issued only to candidates who have updated their PAN in their registration."
        next: "Get a PAN card before you register."
        source: nism-viii
      - q: "Where can I study for NISM exams?"
        a: "NISM's certification pages offer workbooks as free study material downloads, and you can also buy printed material."
        next: "Download the Series VIII workbook and read a chapter a week."
        source: nism-viii
  - stages: [ug]
    title: "Get certified during college"
    do:
      - text: "NISM-Series-VIII: 100 questions of 1 mark each in 2 hours, 60% to pass, −25% for a wrong answer."
        source: nism-viii
    doubts:
      - q: "What is the pass mark for NISM Series VIII?"
        a: "60%. The exam has 100 one-mark questions in 2 hours, and a wrong answer loses 25% of that question's marks."
        next: "Practise with the NISM workbook before booking."
        source: nism-viii
      - q: "How much does NISM Series VIII cost?"
        a: "₹1,500 plus payment-gateway charges."
        next: "Book only when you are scoring well in practice tests."
        source: nism-viii
      - q: "What is NISM Series VII for?"
        a: "Securities Operations and Risk Management — for people at a broker who handle client funds and assets, investor grievances, internal control, risk management or operational risk. It has 100 questions in 2 hours, 50% to pass, with −25% for a wrong answer."
        next: "Take it if you want a back-office or risk job."
        source: nism-vii
  - stages: [grad]
    title: "Join a broker as dealer or sales"
    do:
      - text: "Series VIII is the benchmark for approved users and sales personnel of a trading member in equity derivatives."
        source: nism-viii
    doubts:
      - q: "Which NISM exam do I need to become a derivatives dealer?"
        a: "NISM-Series-VIII: Equity Derivatives — the benchmark for associated persons working as approved users and sales personnel of a trading member in the equity derivatives segment."
        next: "Pass Series VIII before applying for dealer jobs."
        source: nism-viii
      - q: "How long is an NISM Series VIII certificate valid?"
        a: "Three years."
        next: "Plan to renew before it lapses."
        source: nism-viii
      - q: "Can I give investment advice as a stockbroker?"
        a: "Research and recommendations are a separate SEBI registration: a Research Analyst needs a graduate degree plus NISM Series XV."
        next: "Read the research analyst and investment adviser pages."
        source: sebi
  - stages: [work]
    title: "Start your own broking firm"
    do:
      - text: "SEBI (Stock Brokers) Regulations, 2026 came into force on publication on 7 January 2026 and repealed the 1992 regulations."
        source: sebi-sb26
    doubts:
      - q: "What do I need to start my own stock broking firm?"
        a: "Under SEBI's Stock Brokers Regulations, 2026 the applicant must be eligible for exchange membership, have adequate office, equipment and staff, at least two years in the business of trading or dealing in securities, NISM certification, the minimum net worth and deposit, and be fit and proper."
        next: "Build experience at a broker first."
        source: sebi-sb26
      - q: "How much net worth does a broker need?"
        a: "Base net worth of ₹1 crore for a trading member, ₹5 crore for a self-clearing member, ₹15 crore for a clearing member and ₹50 crore for a professional clearing member — or the variable net worth, whichever is higher."
        next: "Plan capital before applying."
        source: sebi-sb26
      - q: "Did SEBI change the stock broker rules in 2026?"
        a: "Yes. The SEBI (Stock Brokers) Regulations, 2026 were published on 7 January 2026 and repealed the Stock Brokers Regulations of 1992."
        next: "Read the 2026 regulations, not old summaries."
        source: sebi-sb26
      - q: "Does a broking firm need a director based in India?"
        a: "Yes. SEBI checks that the applicant has at least one designated director who stays in India for at least 182 days in the financial year."
        next: "Plan your firm's board accordingly."
        source: sebi-sb26
      - q: "Who registers a stock broker?"
        a: "SEBI grants the certificate of registration under its Stock Brokers Regulations, 2026, after checking among other things that the applicant is eligible to be a member of a recognised stock exchange."
        next: "Read the 2026 regulations before you plan a firm."
        source: sebi-sb26
board_note: "Any board and stream. NISM certificates need a PAN in your registration."
board_source: nism-viii
