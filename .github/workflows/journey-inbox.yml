# Journey inbox — turns Journey Blueprint files made by any Claude chat into live career pages
# (docs/free-claude/JOURNEY-README.md).
#
# 1. The owner opens emargdarshan.com/journey-next.html, copies a career (prompt included), pastes it into any Claude
#    chat, and uploads the file it gives (journey--<id>.yml, journey-alias--<id>.yml, or the .zip) anywhere in the
#    repo on github.com.
# 2. This job: scripts/journey-ingest.mjs (title, links, data check, page) → safety checks → one commit to main.
# 3. GitHub Pages rebuilds the site; the career is on journey-blueprint.html search, site search and journey-next.html
#    drops the title.
name: Journey inbox

on:
  push:
    branches: [main]
    paths:
      - '**/journey--*.yml'
      - '**/journey--*.yaml'
      - '**/journey--*.txt'
      - '**/journey--*.zip'
      - '**/journey-alias--*.yml'
      - '**/journey-alias--*.yaml'
      - '**/journey-alias--*.zip'
      - '!inbox/done/**'
      - '!inbox/rejected/**'
      - '!inbox/undone/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: inbox-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install js-yaml + liquidjs (the only packages the scripts use)
        run: npm install --prefix "$RUNNER_TEMP/deps" --no-save --no-audit --no-fund js-yaml@4 liquidjs@10
      - name: Read the uploads
        env:
          VERIFY_DEPS: ${{ runner.temp }}/deps
        run: node scripts/journey-ingest.mjs
      # Safety net: the site is published only if every check passes. If anything above or here fails, the next
      # step throws all changes away and only parks the uploads in inbox/rejected/ (reason in inbox/JOURNEY-REPORT.md).
      - name: Safety checks (nothing is published if one fails)
        env:
          VERIFY_DEPS: ${{ runner.temp }}/deps
        run: |
          node scripts/check-journey-matrix.mjs
          node scripts/build-journey-pages.mjs --check
          node scripts/check-search.mjs
          node scripts/verify-site.mjs --only=journey
      - name: Failed — publish nothing, park the uploads in inbox/rejected
        if: failure()
        env:
          VERIFY_DEPS: ${{ runner.temp }}/deps
        run: |
          git reset -q --hard HEAD
          git clean -qfd
          node scripts/journey-ingest.mjs --reject-all="the build or a site check failed (run ${{ github.run_id }} on the Actions tab)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Journey inbox FAILED: uploads moved to inbox/rejected, site unchanged"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          added=$(git diff --cached -U0 docs/free-claude/JOURNEY-LOG.md | grep "^+- " | sed 's/^+- [0-9-]* · //' | cut -c1-80 | tr '\n' ';' || true)
          git commit -m "Journey inbox: ${added:-rebuild}"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Ask GitHub Pages to rebuild
        continue-on-error: true
        run: |
          curl -fsS -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/pages/builds"
