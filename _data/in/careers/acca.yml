  - id: "difficulty"
    hid: "difficulty-heading"
    eyebrow: "Set expectations correctly"
    heading: "Difficulty & approximate pass rates"
    parts:
      - prose:
          - "Difficulty increases sharply as you climb levels. Applied Knowledge pass rates typically run <strong>64–88%</strong> (Business and Technology is usually the highest), Applied Skills is more variable, and Strategic Professional pass rates typically run <strong>38–53%</strong> — comparable in difficulty to the harder papers in CA or CMA. Most working professionals complete the full qualification, papers alone, in roughly <strong>2.5–4 years</strong>; strong full-time students with exemptions can finish faster."
