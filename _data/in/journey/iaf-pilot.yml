# Journey Blueprint — Indian Air Force Pilot (NDA · AFCAT Flying Branch). Printed on journey-iaf-pilot.html (_includes/journey-doubts.html).
# Rules, classes and the money items / sources several careers share: _data/in/journey_common.yml.
# `money_defs` / `sources` below are used only by this career. Check: node scripts/check-journey-matrix.mjs
id: iaf-pilot
v: 2
name: "Indian Air Force Pilot (NDA · AFCAT Flying Branch)"
search: ["indian air force fighter pilot", "air force pilot", "fighter pilot", "iaf pilot", "flying officer", "afcat", "air force flying branch"]
page: "afcat.html"
doubts_page: "journey-iaf-pilot.html"
gate: "Physics and Mathematics in Class 12 → NDA (Air Force wing) straight after school, or any degree → AFCAT Flying Branch at age 20–24 (26 with a DGCA Commercial Pilot Licence). Then the Air Force Selection Board, the once-in-a-lifetime pilot aptitude test (CPSS), medicals and about 62 weeks of training."
gate_source: [nda226, afcat226]
core:
  what:
    text: "Flying Branch officers are the Indian Air Force's pilots. They join as Group A gazetted officers, train for about 62 weeks and are commissioned as Flying Officers."
    source: afcat226
  day:
    - "Fly training and operational sorties; brief before and debrief after every flight."
    - "Study aircraft systems, navigation and tactics; keep simulator and fitness checks current."
    - "Lead and look after the airmen in your section."
  pay:
    - { level: "Flying Officer on commissioning (7th CPC)", value: "Level 10 · ₹56,100 – ₹1,77,500 + Military Service Pay ₹15,500", source: afcat226 }
    - { level: "Flight Cadet in training", value: "Fixed stipend ₹56,100 a month for one year", source: afcat226 }
  routes:
    - { title: "NDA (after Class 12)", text: "UPSC's NDA exam; the Air Force wing needs Class 12 with Physics and Mathematics. Full rules are in the NDA blueprint.", source: nda226 }
    - { title: "AFCAT Flying Branch (after a degree)", text: "Physics and Mathematics passed at 10+2, plus any 3-year degree or a 4-year B.E. / B.Tech. AFCAT 02/2026 offered 35 Flying seats on Short Service Commission — 30 for men and 5 for women.", source: afcat226 }
    - { title: "NCC Special Entry", text: "NCC Air Wing Senior Division 'C' certificate holders: 10% of CDS seats (Permanent Commission) and 10% of AFCAT seats (Short Service) in Flying Branch, with no AFCAT fee.", source: afcat226 }
  cost_time:
    - { label: "AFCAT fee", value: "₹550 + GST (not charged for NCC Special Entry)", source: afcat226 }
    - { label: "Training", value: "About 62 weeks for Flying Branch, from the first week of July 2027", source: afcat226 }
    - { label: "Short Service Commission", value: "14 years for Flying Branch; no pension", source: afcat226 }
  cost_note: "Training is paid by the government, and Flight Cadets get a stipend."
  challenges:
    - text: "The pilot aptitude test (CPSS) is <strong>once in a lifetime</strong> — fail it and Flying Branch is closed to you for good."
      source: afcat226
    - text: "AFCAT gives <strong>+3 for a right answer and −1 for a wrong one</strong> in a 100-question, 300-mark, 2-hour test."
      source: afcat226
    - text: "You must be unmarried when training starts; marrying during training means termination and refund of the training cost."
      source: afcat226
    - text: "Glasses wearers must meet the eye standards in para 147 of the AFCAT medical appendix to be eligible for flying."
      source: afcat226
  not_for:
    - "You cannot take strict discipline, fitness tests and a long, hard training."
    - "You want to settle in one city — postings move across India."
    - "You are not ready to stake your flying dream on a one-shot test."
journey:
  - stages: [c8, c9]
    title: "Physics, Maths and fitness"
    do:
      - text: "Every Flying Branch route needs <strong>Physics and Mathematics at 10+2</strong> — build them from now."
        source: afcat226
      - text: "The Academy expects you to run 4 km in 15 minutes, do 20 push-ups and 20 sit-ups, 8 chin-ups, climb a 3–4 m rope and swim 25 m."
        source: afcat226
    doubts:
      - q: "Can a girl become a fighter pilot in the Indian Air Force?"
        a: "Yes. AFCAT's Flying Branch is open to men and women; AFCAT 02/2026 had Short Service Commission seats for both."
        next: "Keep Physics and Maths in Class 11–12."
        source: afcat226
      - q: "What fitness does the Air Force Academy expect?"
        a: "The AFCAT notice asks candidates to be able to run 4 km in 15 minutes, do at least 20 push-ups and 20 sit-ups, 8 chin-ups, climb a 3–4 m rope and swim 25 m."
        next: "Start running and swimming now."
        source: afcat226
  - stages: [c10]
    title: "Take PCM in Class 11"
    do:
      - text: "NDA's Air Force wing and AFCAT Flying Branch both need Physics and Mathematics in Class 12."
        source: [nda226, afcat226]
    stream: "Science with Physics and Mathematics (PCM)."
    mistakes:
      - "Dropping Physics or Maths — it closes Flying Branch on every route."
    doubts:
      - q: "Can a Commerce or Arts student become an Air Force pilot?"
        a: "Only if Physics and Mathematics were passed at 10+2. AFCAT then accepts any 3-year degree, but the 10+2 subject rule stays."
        next: "If you are in Class 10, choose PCM."
        source: afcat226
      - q: "Can I be an Air Force pilot if I wear glasses?"
        a: "Glasses wearers can be eligible for Flying Branch only if they meet the vision standards in para 147 of the AFCAT medical appendix."
        next: "Get an eye check and read the medical appendix of the latest notice."
        source: afcat226
  - stages: [c11, c12]
    title: "NDA from Class 12"
    do:
      - text: "NDA's Air Force wing takes Class 12 PCM students — its written exam, SSB and rules are in the NDA blueprint."
        source: nda226
    doubts:
      - q: "Should I try NDA or wait for AFCAT?"
        a: "Both lead to Flying Branch. NDA takes you after Class 12 with Physics and Maths; AFCAT takes graduates aged 20–24. Many try NDA first and keep AFCAT as the next door."
        next: "Open the NDA blueprint for its dates and rules."
        source: [nda226, afcat226]
      - q: "What is CPSS?"
        a: "The Computerised Pilot Selection System, given at the Air Force Selection Board only to recommended Flying Branch candidates. It is a once-in-a-lifetime test."
        next: "Prepare seriously before your first board."
        source: afcat226
  - stages: [ug]
    title: "In college: get AFCAT-ready"
    do:
      - text: "Final-year students can apply for AFCAT with no current backlog, and must submit proof of completing final exams (for the July 2027 course: by 30 May 2027)."
        source: afcat226
      - text: "Age window for the July 2027 Flying course: born 2 July 2003 – 1 July 2007."
        source: afcat226
    doubts:
      - q: "Can I apply for AFCAT in my final year?"
        a: "Yes, if you have no current backlog. You must submit proof of completing your final exams by the date in the notice (30 May 2027 for AFCAT 02/2026)."
        next: "Apply in your final year."
        source: afcat226
      - q: "Is there a minimum percentage for AFCAT Flying Branch?"
        a: "The AFCAT 02/2026 notice asks for Physics and Mathematics at 10+2 and a 3-year degree in any discipline or a 4-year B.E. / B.Tech; it prints no minimum percentage for Flying Branch."
        next: "Read each new notice — rules can change."
        source: afcat226
      - q: "Does NCC help to become an Air Force pilot?"
        a: "Yes. NCC Air Wing Senior Division 'C' certificate holders can use the NCC Special Entry — 10% of CDS (Permanent Commission) and AFCAT (Short Service) Flying seats — and pay no AFCAT fee."
        next: "Join NCC Air Wing in college."
        source: afcat226
  - stages: [grad]
    title: "AFCAT, Air Force Selection Board and training"
    do:
      - text: "AFCAT: 100 questions, 300 marks, 2 hours, English only — General Awareness, Verbal Ability, Numerical Ability, Reasoning and Military Aptitude."
        source: afcat226
      - text: "Selection Board: Stage-I (Officer Intelligence Rating test, picture perception and discussion) screens on day 1; Stage-II is psychological tests, group tests and interview over the next five days."
        source: afcat226
    exams:
      - { name: "AFCAT 02/2026", when: "8 Aug 2026", source: afcat226 }
    money: [iaf-stipend]
    doubts:
      - q: "What is the age limit for AFCAT Flying Branch?"
        a: "20 to 24 on the course start date (1 July 2027 for AFCAT 02/2026), or up to 26 if you hold a valid DGCA Commercial Pilot Licence."
        next: "Work out how many AFCAT cycles your age allows."
        source: afcat226
      - q: "Is there negative marking in AFCAT?"
        a: "Yes. +3 for a correct answer, −1 for a wrong one, nothing for a skipped question."
        next: "Skip guesses you cannot narrow down."
        source: afcat226
      - q: "Do Short Service Flying officers get a pension?"
        a: "Flying Branch joins on Short Service Commission for 14 years, and SSC officers are not entitled to pension. Permanent Commission may be granted later, subject to vacancies and merit."
        next: "Read the commission terms before you join."
        source: afcat226
      - q: "How many Flying seats does AFCAT have?"
        a: "AFCAT 02/2026 listed 35 Flying Branch seats on Short Service Commission — 30 for men and 5 for women. NCC Special Entry has 10% of the CDS and AFCAT Flying seats."
        next: "Seats change each cycle; read the latest notice."
        source: afcat226
      - q: "Can I marry during Air Force training?"
        a: "No. You must be unmarried when the course starts, and marrying during training leads to termination and refund of the training expenditure."
        next: "Plan your personal life around training."
        source: afcat226
  - stages: [work]
    title: "Already flying, or tried before?"
    do:
      - text: "A valid DGCA Commercial Pilot Licence raises the AFCAT Flying age limit to 26."
        source: afcat226
    doubts:
      - q: "I failed CPSS once. Can I try Flying Branch again?"
        a: "No. Candidates who failed CPSS / PABT earlier, or Flight Cadets suspended from flying training at the Air Force Academy, cannot apply for Flying Branch."
        next: "Ground Duty branches stay open through AFCAT."
        source: afcat226
board_note: "Any board works. What matters is passing Physics and Mathematics at 10+2."
board_source: afcat226
