                - ["3. U23", "Under 23", "Col. C.K. Nayudu Trophy; the winners play Rest of India"]
                - ["4. Senior domestic", "Open", "Ranji Trophy, then Duleep Trophy and Irani Cup"]
                - ["5. Targeted / contracted", "—", "Screened and monitored at the BCCI Centre of Excellence"]
                - ["6. IPL", "Any (auction)", "Franchise contract plus ₹7.5 lakh a match"]
            source: "bcci-age,bcci-dom26,bcci-coe,ipl-regs"
          - p: "You can only play for the state unit where you genuinely belong: <strong>domicile fraud brings a 2-year ban</strong>, for senior men and women too, and the voluntary-disclosure amnesty never covered it."
            source: bcci-age
