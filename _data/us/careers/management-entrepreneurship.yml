# Management & Entrepreneurship careers (USA Master Plan Phase 4). Schema: comment at the top of _includes/us-career-overview.html.
# Every fact is copied from the page its `source` names, opened 2026-10-20: BLS Occupational Outlook Handbook (pay May
# 2025, jobs 2025, outlook 2025–35; pages last modified 27 Aug 2026), PMI, SHRM, HRCI, AGA, GMAC (GMAT) and ETS (GRE)
# (_data/us/sources.yml). None of these careers needs a state license; `certs[].kind` says what is voluntary.
# The MBA route shows the GMAT/GRE admission test as an exam gate only where BLS names an MBA for the career; it links
# no exam page because the USA edition has no GMAT/GRE page yet (Master Plan Phase 10).
# A `pathway:` entry keeps its existing us/careers/<pathway>/ page and only gets a roadmap here.
# Batch 1 and the queue: docs/us-edition/PHASE-4-MANAGEMENT-MARKETING.md.
checked: 2026-10-20
review_by: 2027-04-20
list:

  # 3,890,600 jobs (chief executives + general and operations managers)
  - slug: top-executive
    short: "Top Executive & Operations Manager"
    title: "Top executive and general and operations manager: degree, years of management experience, sometimes an MBA"
    eyebrow: "Management & Entrepreneurship · Leadership & Operations"
    lede: "Top executives typically need at least a bachelor's degree and considerable work experience. Most general and operations managers hired from outside need lower level supervisory or management experience; executives of large corporations may have an MBA."
    for: "People who like leading teams, making decisions and running the day-to-day operations of an organization."
    soc: ["11-1011", "11-1021"]
    does: { text: "Top executives plan strategies and policies to ensure that an organization meets its goals.", source: ooh_qf_topexec }
    work: { text: "Top executives work in nearly every industry, for both small and large organizations. They often have irregular schedules, which may include working evenings and weekends. Travel is common, particularly for chief executives.", source: ooh_qf_topexec }
    become: { text: "Top executives typically need at least a bachelor’s degree and considerable work experience to enter the occupation.", source: ooh_qf_topexec }
    metrics: { pay: 108780, pay_hour: "52.30", pay_by: "Top executives", jobs: 3890600, outlook: 5, outlook_words: "Faster than average", change: 190600, entry: "Bachelor's degree", experience: "5 years or more", training: "None", source: ooh_qf_topexec }
    license_text: "None for most jobs"
    routes:
      - id: operations
        title: "Degree → supervisor → general and operations manager"
        tag: "Typical"
        who: "Many top executives advance within their own organizations, moving up from lower level management or supervisory positions. Most general and operations managers hired from outside an organization need lower level supervisory or management experience in a related field."
        steps:
          - { tag: "Start", title: "High school diploma", text: "", kind: start, source: ooh_topexec }
          - { tag: "About 4 years", title: "Bachelor's degree related to the field", text: "Such as business or engineering.", kind: stage, source: ooh_topexec }
          - { tag: "Years of work", title: "Supervisory or lower level management job", text: "Those promoted from lower level positions may be able to substitute experience for education.", kind: stage, source: ooh_topexec }
          - { tag: "Goal", title: "General and operations manager", text: "Some general managers move into higher level managerial or executive positions.", kind: goal, source: ooh_topexec }
      - id: mba
        title: "Bachelor's → work → MBA → executive"
        tag: "Large corporations"
        who: "Top executives of large corporations may have a master's degree in business administration (MBA). Chief executives typically need extensive managerial experience in the organization's area of specialty."
        steps:
          - { tag: "Start", title: "Bachelor's degree", text: "", kind: start, source: ooh_topexec }
          - { tag: "Work", title: "Management experience", text: "", kind: stage, source: ooh_topexec }
          - { tag: "Admission test", title: "GMAT or GRE for business school", text: "The GMAT has three sections (Quantitative Reasoning, Verbal Reasoning, Data Insights) and takes 2 hours 15 minutes.", kind: exam, source: gmac_structure }
          - { tag: "Graduate", title: "MBA", text: "", kind: stage, source: ooh_topexec }
          - { tag: "Goal", title: "Chief executive or other top executive", text: "Executive training and development programs often benefit managers or executives.", kind: goal, source: ooh_topexec }
        facts:
          - { k: "GRE instead of GMAT", v: "ETS calls the GRE General Test one test for graduate, business and law school, accepted at thousands of schools.", source: ets_gre_about }
      - id: own-business
        title: "Start and run your own small business"
        tag: "Entrepreneur"
        who: "The Small Business Administration's free business guide: plan the business, then do the paperwork before you open. The hub lists every step."
        steps:
          - { tag: "Plan", title: "Market research and a business plan", text: "Market research helps you find customers; competitive analysis helps you make your business unique.", kind: start, source: sba_plan }
          - { tag: "Plan", title: "Calculate startup costs and fund the business", text: "", kind: stage, source: sba_plan }
          - { tag: "Launch", title: "Choose a structure, then register with the state", text: "You need to choose a business structure before you register your business with the state.", kind: stage, source: sba_launch }
          - { tag: "Launch", title: "Tax IDs, licenses and permits", text: "The federal EIN is free from the IRS: do not apply on websites that charge a fee.", kind: licence, source: sba_launch, href: "us/clusters/management-entrepreneurship/#small-business", link: "All SBA steps" }
          - { tag: "Goal", title: "Small business owner", text: "", kind: goal, source: sba_launch }
    certs:
      - { name: "License or certification for the field", who: "Depends on the area managed", kind: "Employer may require", text: "Some top executive positions may require one relevant to their area of management; for example, some employers may require their chief executive officer to be a certified public accountant (CPA).", source: ooh_topexec }

  # 1,094,300 jobs
  - slug: project-management-specialist
    short: "Project Manager"
    title: "Project management specialist: bachelor's degree, experience, optional CAPM or PMP"
    eyebrow: "Management & Entrepreneurship · Project Management"
    lede: "Project management specialists typically need a bachelor's degree in business, project management or a related field; some employers prefer a technical degree for their industry. Certification is not always required but may be beneficial: PMI's CAPM needs no experience, the PMP needs 2 to 5 years of it."
    for: "Organized people who like planning, deadlines, budgets and keeping a team on track."
    soc: ["13-1082"]
    does: { text: "Project management specialists coordinate the budget, schedule, staffing, and other details of a project.", source: ooh_qf_pmspec }
    work: { text: "Project management specialists usually work in an office setting, but they occasionally travel to visit clients. Most work full time, and some work more than 40 hours per week.", source: ooh_qf_pmspec }
    become: { text: "Project management specialists typically need a bachelor’s degree that may be in a variety of fields, including business or project management. Although not always required, certification may be beneficial.", source: ooh_qf_pmspec }
    metrics: { pay: 102320, pay_hour: "49.19", pay_by: "Project management specialists", jobs: 1094300, outlook: 7, outlook_words: "Much faster than average", change: 73200, entry: "Bachelor's degree", training: "None", source: ooh_qf_pmspec }
    license_text: "None"
    routes:
      - id: degree
        title: "Degree → related job → small projects → large projects"
        tag: "Typical"
        who: "Some positions require relevant work experience, for example as a business analyst, information security analyst or training and development specialist."
        steps:
          - { tag: "Start", title: "High school diploma", text: "", kind: start, source: ooh_pmspec }
          - { tag: "About 4 years", title: "Bachelor's in business, project management or a related field", text: "Some employers prefer a technical field such as computer and information technology or engineering.", kind: stage, source: ooh_pmspec }
          - { tag: "Experience", title: "Related job or internship", text: "", kind: stage, source: ooh_pmspec }
          - { tag: "Goal", title: "Project management specialist", text: "They may begin as trainees working on small projects and progress to large, complex projects.", kind: goal, source: ooh_pmspec }
      - id: capm
        title: "CAPM: the entry certification, no experience needed"
        tag: "Voluntary"
        who: "PMI's Certified Associate in Project Management needs a secondary diploma (such as a high school diploma or GED), age 18 and 23 hours of project management education."
        steps:
          - { tag: "Start", title: "High school diploma or GED, age 18+", text: "", kind: start, source: pmi_capm }
          - { tag: "23 hours", title: "Project management education", text: "Completed before the exam.", kind: stage, source: pmi_capm }
          - { tag: "Exam", title: "CAPM exam", text: "150 questions.", kind: exam, source: pmi_capm }
          - { tag: "Goal", title: "CAPM holder", text: "15 professional development units in each 3-year cycle keep it active.", kind: goal, source: pmi_capm }
      - id: pmp
        title: "PMP: experience + 35 hours of training + exam"
        tag: "Voluntary"
        who: "PMI counts project management experience from the last 10 years; the years needed depend on your education."
        steps:
          - { tag: "Start", title: "Degree or diploma", text: "", kind: start, source: pmi_pmp }
          - { tag: "2–5 years", title: "Experience managing projects", text: "High school diploma: 5 years. Associate's degree or vocational diploma: 4. Bachelor's or higher: 3. Degree from a PMI Global Accreditation Center program: 2.", kind: stage, source: pmi_pmp }
          - { tag: "35 hours", title: "Project Professional training", text: "", kind: stage, source: pmi_pmp }
          - { tag: "Exam", title: "PMP exam", text: "180 questions.", kind: exam, source: pmi_pmp }
          - { tag: "Goal", title: "Project Management Professional (PMP)", text: "", kind: goal, source: pmi_pmp }
    certs:
      - { name: "CAPM", who: "Project Management Institute (PMI)", kind: "Voluntary", text: "No experience required: a secondary diploma, age 18 and 23 hours of project management education.", source: pmi_capm }
      - { name: "PMP", who: "Project Management Institute (PMI)", kind: "Voluntary", text: "2 to 5 years of experience managing projects depending on education, plus 35 hours of training and a 180-question exam.", source: pmi_pmp }

