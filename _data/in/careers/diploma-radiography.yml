  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Is a Radiographer the same as a Radiologist?"
            a: "No, and this is a very common confusion. A Radiographer (X-Ray/imaging technician) operates the imaging equipment and positions patients for X-rays, CT or MRI scans. A Radiologist is a doctor (MD Radiology) who interprets the images and makes the diagnosis. A Diploma in Radiography trains you as a Radiographer, not a Radiologist."
          - q: "Do I need special certification to operate X-ray equipment?"
            a: "Yes. Operating X-ray and other radiation-emitting equipment in India is regulated by the Atomic Energy Regulatory Board (AERB), which requires operators to be certified/registered. Most recognised Diploma in Radiography programmes are structured to meet this requirement, but always confirm your institute's specific AERB compliance before enrolling."
          - q: "Can I operate CT and MRI machines with this diploma?"
            a: "Many diploma programmes cover CT and MRI basics, but operating advanced modalities like CT and MRI independently often requires additional specialised training or certification beyond the base diploma, depending on the employer and equipment. Confirm what your specific course covers before assuming full CT/MRI competency."
          - q: "What is the difference between Diploma in Radiography and B.Sc Radiography?"
            a: "The diploma is typically a 2-year, practical, technician-focused course. B.Sc Radiography/Radio-Imaging Technology is a 3-4 year degree with deeper theory and typically better access to senior technologist and supervisory roles. Many diploma holders pursue the B.Sc later via lateral entry where available."
          - q: "Is radiography a safe career in terms of radiation exposure?"
            a: "When following proper radiation safety protocols — lead aprons, shielding, distance and monitoring badges, as taught in the course and mandated by AERB guidelines — radiography is considered a safe profession. Institutes are expected to train students thoroughly in radiation safety as a core part of the curriculum."
      - note: "*Fee and salary figures are indicative, based on publicly available information as of 2026, and vary significantly by state, institute and employer — always verify current figures directly with your target institute."
        class: "table-note mt-lg"
