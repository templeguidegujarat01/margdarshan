  # 903,100 jobs
  - slug: computer-support-specialist
    short: "Computer Support Specialist"
    title: "Computer support specialist: certifications, associate's degree or college courses"
    eyebrow: "Digital Technology · Information Technology (IT) Support & Services"
    lede: "Network support specialists typically need an associate's degree and user support specialists some college courses, but either may qualify with a high school diploma plus IT certifications. Many move on to network, security or software jobs."
    for: "Patient people who like fixing computer problems and explaining the fix to people who are not technical; some jobs mean nights or weekends."
    soc: ["15-1231", "15-1232"]
    does: { text: "Computer support specialists maintain computer networks and provide technical help to computer users.", source: ooh_qf_css }
    work: { text: "Most computer support specialists work full time. Because computer support services may need to be available 24 hours a day, some specialists work nights or weekends.", source: ooh_qf_css }
    become: { text: "Entry requirements vary for computer support specialists. Network support specialists typically need an associate’s degree, and user support specialists typically need to complete some college courses. However, candidates may qualify with a high school diploma plus relevant information technology (IT) certifications.", source: ooh_qf_css }
    metrics: { pay: 62890, pay_hour: "30.24", pay_by: "Computer support specialists", jobs: 903100, outlook: -3, outlook_words: "Decline", change: -24300, entry: "Associate's degree (network support) or some college (user support); a diploma plus IT certifications can also qualify", training: "Moderate-term on-the-job training", source: ooh_qf_css }
    license_text: "Not required"
    routes:
      - id: diploma-certs
        title: "High school diploma + IT certifications"
        tag: "Fastest start"
        who: "Computer user support jobs need some computer knowledge but not necessarily a college degree."
        steps:
          - { tag: "Start", title: "High school diploma", text: "", kind: start, source: ooh_css }
          - { tag: "Courses", title: "Courses in networking, server administration or information security", text: "Applicants who have taken courses in these areas may qualify for user support jobs.", kind: stage, source: ooh_css }
          - { tag: "Optional exam", title: "CompTIA A+ (Core 1 and Core 2)", text: "A vendor-neutral certification: two exams, in any order. CompTIA recommends 12 months of hands-on IT support experience for Core 1.", kind: exam, source: comptia_aplus }
          - { tag: "Goal", title: "Computer user support specialist", text: "Companies may require certifications in the products they use.", kind: goal, source: ooh_css }
      - id: associate
        title: "Associate's degree → network support"
        tag: "Network support"
        who: "Employers may accept an associate's degree for computer network support specialists; some prefer a bachelor's."
        steps:
          - { tag: "Start", title: "High school diploma", text: "", kind: start, source: ooh_css }
          - { tag: "About 2 years", title: "Associate's degree", text: "More technical positions are likely to require a degree in a field such as computer and information technology or engineering.", kind: stage, source: ooh_css }
          - { tag: "Optional exam", title: "CompTIA Network+", text: "CompTIA recommends A+ and 9 to 12 months as a junior network administrator or network support technician first.", kind: exam, source: comptia_netplus }
          - { tag: "Goal", title: "Computer network support specialist", text: "", kind: goal, source: ooh_qf_css }
      - id: climb
        title: "From the help desk to other IT jobs"
        tag: "Next steps"
        who: "Many computer support specialists advance to other information technology positions."
        steps:
          - { tag: "Start", title: "Computer support specialist", text: "Keep studying: technology changes throughout a career.", kind: start, source: ooh_css }
          - { tag: "Move up", title: "Network and computer systems administrator", text: "", kind: stage, source: ooh_css, href: "us/careers/network-administrator/", link: "Network administrator" }
          - { tag: "Goal", title: "Information security analyst, software developer or support manager", text: "", kind: goal, source: ooh_css, href: "us/roadmaps/information-security-analyst.html", link: "Security analyst roadmap" }
    certs:
      - { name: "CompTIA A+", who: "CompTIA", kind: "Voluntary", text: "Two exams (Core 1: hardware and networking; Core 2: operating systems and security). Core 1 (V15): up to 90 questions in 90 minutes, passing score 675 on a 900-point scale.", source: comptia_aplus_core1 }
      - { name: "CompTIA Network+", who: "CompTIA", kind: "Voluntary", text: "One exam (N10-009): up to 90 questions in 90 minutes, passing score 720 on a 100–900 scale.", source: comptia_netplus }
      - { name: "Product certifications", who: "Software and hardware vendors", kind: "Employer may require", text: "Companies may require their support specialists to hold certifications in the products the companies use.", source: ooh_css }

