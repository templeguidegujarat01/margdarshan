money: [nmmss, csss, pms-sc, gpat-sch, mysy, wbscc, tfw-up]

money_defs:
  - id: gpat-sch
    kind: scholarship
    name: "PCI scholarship for GPAT-qualified M.Pharm students"
    by: "Pharmacy Council of India (GPAT is run by NBEMS)"
    who: "B.Pharm graduates who qualify GPAT and join an M.Pharm course. GPAT exists to award this scholarship; the GPAT 2026 bulletin does not print the amount."
    apply: "Qualify GPAT, then follow your M.Pharm admission body's process. NBEMS has no role in counselling or paying the scholarship, and a GPAT score gives no automatic right to it."
    stages: [ug, grad]
    source: gp-ib

sources:
  - { id: pci-bph, name: "Pharmacy Council of India — B.Pharm Course Regulations, 2014 (Gazette, 11 Dec 2014)", url: "https://www.pci.nic.in/pdf/B.Pharm%20Regulations.pdf", covers: "4-year course, 10+2 with English and Physics, Chemistry, Maths / Biology, no minimum percentage, open-school exclusion, age 17 by 31 Dec, D.Pharm lateral entry, 150 hours of practical training, PCI approval needed to run the course", checked: 2026-10-25 }
  - { id: pci-er20, name: "Pharmacy Council of India — Education Regulations, 2020 (Diploma in Pharmacy)", url: "https://www.pci.nic.in/pdf/Education_REGULATION_2020_12022021.pdf", covers: "D.Pharm as the minimum qualification for registration, 10+2 science with Physics, Chemistry and Biology or Maths, 2 academic years, 500 hours of practical training over 3 months, training contract form", checked: 2026-10-25 }
  - { id: pci-pharmd, name: "Pharmacy Council of India — Pharm.D Regulations, 2008", url: "https://www.pci.nic.in/pdf/PharmD_regu_2008.pdf", covers: "6 years (5 + 1 internship / residency), 10+2 with Physics and Chemistry plus Maths or Biology, or D.Pharm; age 17", checked: 2026-10-25 }
  - { id: pci-dpee, name: "Pharmacy Council of India — Diploma in Pharmacy Exit Examination Regulations, 2022 (Gazette, 24 Feb 2022)", url: "https://www.pci.nic.in/pdf/Diploma%20in%20Pharmacy%20Exit%20Examination%20Regulations,%202022.pdf", covers: "three MCQ papers in English, 50% in each, no limit on attempts; D.Pharm from a section-12-approved institution; registration with the State Pharmacy Council; definition of registered pharmacist", checked: 2026-10-25 }
  - { id: pci-dpee26, name: "Pharmacy Council of India — Circular 14-285/2025-PCI, 'Update on Diploma in Pharmacy Exit Examination' (20 Feb 2026), copy published by the Goa State Pharmacy Council", url: "https://goaspc.org/wp-content/uploads/2026/03/NOTICE-D.Pharm-Exit-Exam-batches-New-Reg.-_9.03.2026.pdf", covers: "State Pharmacy Councils to issue registration to pass-outs under section 32(2); circular of 8 Dec 2025 declared null and void", checked: 2026-10-25 }
  - { id: pci-s42, name: "Pharmacy Council of India — 'No person other than a Registered Pharmacist can dispense medicine' (Kerala High Court judgment of 23 Aug 2017)", url: "https://www.pci.nic.in/pdf/3.pdf", covers: "section 42 of the Pharmacy Act, 1948 and the Pharmacy Practice Regulations, 2015 upheld", checked: 2026-10-25 }
  - { id: gp-ib, name: "NBEMS — GPAT 2026 Information Bulletin", url: "https://nbe.edu.in/IB/Information%20bulletin%20GPAT%202026.pdf", covers: "scholarship purpose, NBEMS role, calendar, final / pre-final-year eligibility, 125 questions / 500 marks / −1, top-10% qualifying rule, percentiles, fees, 3-year score validity", checked: 2026-10-25 }
  - { id: nj-br, name: "NIPER JEE 2026 — Revised Information Brochure, Master's (19 June 2026)", url: "https://www.niper.gov.in/niperjee2026/include/2026_Masters_Brochure_Revised_19June.pdf", covers: "GPAT / GATE / NET requirement for NIPER JEE", checked: 2026-10-15 }
  - { id: rrb-para, name: "Railway Recruitment Boards — CEN 03/2025 (Paramedical Categories), detailed notice", url: "https://rrbsecunderabad.gov.in/wp-content/uploads/2025/08/Final-CEN-03_2025-English.pdf", covers: "Pharmacist (Entry Grade): Level 5, ₹29,200, age 20–35 on 1 Jan 2026, 105 posts, D.Pharm or B.Pharm + registration; application dates; single CBT with −1/3 marking", checked: 2026-10-25 }
  - { id: ke-pros, name: "CEE Kerala — KEAM 2026 Prospectus", url: "https://cee.kerala.gov.in/keam2026/pdf/Prospectus.pdf", covers: "pharmacy paper (Chemistry 45 + Physics 30, 90 minutes), B.Pharm ranked on the pharmacy score out of 300", checked: 2026-10-19 }
  - { id: gujcet-reg, name: "GSEB — Press note, GUJCET 2026 registration (Gujarati)", url: "https://www.gsebeservice.com/assets/news/Press%20Note%20for%20GUJCET%20Registration-2026.pdf", covers: "GUJCET used for degree engineering and degree / diploma pharmacy", checked: 2026-10-14 }
  - { id: dcece-pros, name: "BCECEB — Prospectus, DCECE (PE/PMM/PM)-2026 (Hindi)", url: "https://bceceboard.bihar.gov.in/pdf_Pros/PROS_DCECE26.pdf", covers: "PM group courses incl. D.Pharm, eligibility, age 17–32, Bihar residence rule", checked: 2026-10-18 }
