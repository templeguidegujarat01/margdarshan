    lede: "The Bharatanatyam path laid out from official files: how Kalakshetra's four-year diploma is taught year by year, the age limits for the diploma and the children's Pratama course, Doordarshan's dance grades, Sangeet Natak Akademi honours, ICCR empanelment, the scholarships that pay for training, the real fees, and what a teaching job in the field asks for."
    official:
      - { label: "Kalakshetra Prospectus 2026-27 (PDF)", url: "https://kalakshetra.in/wp-content/uploads/2026/02/Prospectus-2026-2027-.pdf" }
