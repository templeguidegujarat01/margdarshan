  # ------------------------------------------------------------------ PHYSIOTHERAPIST (batch 5, three-layer schema)
  - id: physiotherapist
    v: 2
    name: "Physiotherapist (BPT)"
    search: ["physiotherapist", "sports physiotherapist", "neurological physiotherapist", "orthopaedic physiotherapist", "paediatric physiotherapist", "geriatric physiotherapist", "cardiopulmonary physiotherapist"]
    search_not: ["equipment", "technician", "assistant"]
    page: "bpt.html"
    roadmap: "roadmaps/bpt.html"
    doubts_page: "journey-physiotherapist.html"
    gate: "Class 12 with Physics, Chemistry, Biology and English (50% in PCB) → your state's BPT admission (merit list or entrance test) → Bachelor of Physiotherapy: 4 years + 1-year internship under the NCAHP curriculum → registration under the NCAHP Act → hospital, sports, clinic or MPT."
    gate_source: [ncahp-bpt, cahet]
    core:
      what:
        text: "A physiotherapist helps people move and work again after injury, surgery, stroke or long illness — with exercise, hands-on therapy and training. Physiotherapists are healthcare professionals under the National Commission for Allied and Healthcare Professions (NCAHP) Act, 2021."
        source: ncahp-bpt
      day:
        - "Assess a patient's pain, strength and movement, then plan exercises and treatment."
        - "Treat patients in a hospital ward, an OPD, a sports team or a home visit."
        - "Teach patients and families exercises to do at home, and track progress session by session."
      pay_note: "We found no 2026 official recruitment notice that prints physiotherapist pay, and no official body publishes private pay — so no pay is printed here yet."
      routes:
        - { title: "Hospital physiotherapist", text: "Work with doctors on wards, ICUs and OPDs on recovery after surgery, stroke or injury." }
        - { title: "Sports and fitness", text: "Sports teams, academies and sports-medicine clinics." }
        - { title: "Own clinic or home care", text: "After registration, practise independently or visit patients at home." }
        - { title: "MPT and teaching", text: "A master's (MPT) leads to specialist and teaching posts; NCAHP's curriculum asks for 55% in MPT for academic posts.", source: ncahp-bpt }
      cost_time:
        - { label: "BPT (NCAHP 2025 curriculum)", value: "4 years of study + 1-year full-time rotatory internship; English medium", source: ncahp-bpt }
        - { label: "UP CAHET registration 2026", value: "₹750 UR / OBC · ₹500 SC / ST / PwD", source: cahet }
        - { label: "WB JENPAS(UG) 2026", value: "₹500 for one paper · ₹400 SC / ST / OBC", source: jenpas }
      cost_note: "College fees are set by each state or the college, so we do not print one national figure."
      challenges:
        - text: "There is no single national route: each state runs BPT admissions its own way — a merit list on Class 12 marks in Uttar Pradesh, Karnataka and Gujarat, an entrance test (JENPAS) in West Bengal."
          source: [cahet, kcet-ib, gj-nur, jenpas]
        - text: "The course length is changing: BPT used to be 4½ years including internship; NCAHP's 2025 curriculum sets 4 years plus a 1-year internship."
          source: ncahp-bpt
        - text: "Attendance rules are strict — 75% in theory and 85% in skills training, with no relaxation."
          source: ncahp-bpt
      not_for:
        - "You want to prescribe medicines or do surgery — physiotherapists treat with movement, exercise and hands-on therapy."
        - "You do not enjoy being on your feet and physically helping patients all day."
        - "You lack patience — recovery often takes many weeks of repeated sessions."
    journey:
      - stages: [c8, c9]
        title: "Biology, fitness and helping people"
        do:
          - text: "BPT needs Physics, Chemistry and Biology later, with 50% marks. Learn the human body chapters well."
            source: ncahp-bpt
          - text: "Play a sport or watch a physiotherapist at a hospital or sports academy to see the work up close."
        doubts:
          - q: "Is a physiotherapist a doctor?"
            a: "No. A physiotherapist is a healthcare professional under the NCAHP Act, 2021, with a Bachelor of Physiotherapy. Physiotherapists treat with exercise and hands-on therapy rather than medicines or surgery."
            next: "Read the Routes list above to see where physiotherapists work."
            source: ncahp-bpt
          - q: "Do I need NEET for BPT?"
            a: "It depends on your state. NCAHP's 2025 curriculum says candidates must have appeared in NEET and that merit is based on Class 12 marks. In 2026, Uttar Pradesh filled seats on Class 12 PCB marks, Karnataka on PU marks and West Bengal through its own JENPAS test."
            next: "Sit NEET to stay safe, and follow your state's own bulletin."
            source: [ncahp-bpt, cahet, kcet-ib, jenpas]
      - stages: [c10]
        title: "Choose Science with Biology"
        do:
          - text: "Take <strong>Physics, Chemistry and Biology</strong>, with English, in Class 11–12."
