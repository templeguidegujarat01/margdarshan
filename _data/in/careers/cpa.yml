  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Can a B.Com graduate sit the US CPA exam directly?"
            a: "Usually not immediately. A standard 3-year Indian B.Com typically evaluates to around 90 US credit hours, short of the 120 needed to sit the exam. Most B.Com graduates add a postgraduate qualification (M.Com, Master of Business Administration (MBA)) or a professional qualification like CA Inter or CMA Inter to reach 120 credits."
          - q: "Can Indian candidates take the CPA exam in India?"
            a: "Yes. India is a permanent international testing location, with Prometric test centres in cities including Mumbai, Delhi, Bangalore, Chennai, Hyderabad, Kolkata, Ahmedabad and Thiruvananthapuram. Testing internationally adds an extra International Testing Fee per section on top of the standard exam fee."
          - q: "Does US CPA give Indian statutory audit rights like CA?"
            a: "No. The US CPA license authorises practice under US state board rules and is highly valued for US GAAP, SEC-reporting and US-client work. It does not grant Indian statutory audit signing rights, which remain reserved for ICAI-qualified Chartered Accountants."
          - q: "Is US CPA a good addition for an Indian CA?"
            a: "Often yes. Qualified CAs usually already meet or come close to the 120-credit requirement, and only need to clear 4 exam sections rather than a full multi-level course. CPA adds US GAAP and SEC-reporting expertise on top of CA's Indian audit and tax grounding, which is valuable for Big 4 US-practice teams and GCC roles."
          - q: "How is the new CPA Evolution exam different from the old CPA exam?"
            a: "Since January 2024, the CPA exam moved from four equally-weighted sections (including a general BEC section) to a Core + Discipline model: three mandatory Core sections (AUD, FAR, REG) that every candidate takes, plus one Discipline section chosen from BAR, ISC or TCP based on the candidate's specialisation."
      - note: "*Exam duration alone is often 12-18 months for eligible candidates; total time including any additional degree needed to reach 120/150 credits and work experience can be considerably longer."
        class: "table-note mt-lg"
