lede: "In Minnesota, the Minnesota State Board of Law Examiners handles bar admission for lawyers, the Minnesota Board of Medical Practice licenses physicians, the Minnesota State Board of Accountancy licenses CPAs and the Minnesota Board of Nursing licenses registered nurses."

