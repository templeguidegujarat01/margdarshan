sections:
  - id: "quick"
    hid: "quick-heading"
    alt: true
    eyebrow: "Quick answers"
    heading: "Patent Agent at a glance"
    intro: "Check whether your Class 12 background qualifies. Duration and pay are in the summary at the top of the page."
    parts:
      - subhead: "Can I apply from my stream?"
      - streams:
          - label: "Science"
            fit: "Eligible"
            tone: "y"
            icon: "science"
          - label: "Commerce"
            fit: "Not eligible"
            tone: "n"
            icon: "commerce"
          - label: "Arts / Humanities"
            fit: "Not eligible"
            tone: "n"
            icon: "arts"
      - note: "The degree must be in science, engineering or technology, so Class 12 Science (PCM or PCB) is the practical route."
  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What does a Patent Agent do?"
    parts:
      - overview:
          points:
            - "Patent agents read inventions, search earlier patents, draft claims and specifications, file applications and respond to Patent Office objections."
            - "They advise companies, universities and start-ups on whether an idea is patentable and how to protect it in India and abroad."
            - "Technical depth matters: pharma, biotech, electronics, software-related and mechanical patents each need subject knowledge."
  - id: "who"
    hid: "who-heading"
    alt: true
    eyebrow: "Fit check"
    heading: "Who should become a Patent Agent"
    parts:
      - fit:
          match:
            - "Enjoy both science and precise writing."
            - "Like reading research and finding what is genuinely new."
            - "Want a niche, well-paid career that uses your technical degree outside the lab."
          mismatch:
            - "Dislike detailed legal drafting and deadlines."
            - "Want hands-on lab or field work."
            - "Expect instant high pay — skill builds over years of drafting."
  - id: "eligibility"
    hid: "elig-heading"
    eyebrow: "Eligibility"
    heading: "What you need, stage by stage"
    parts:
      - elig_list:
          - "<strong>Indian citizen</strong>, at least <strong>21 years</strong> old."
          - "A <strong>degree in science, engineering or technology</strong> from a recognised university (or an equivalent the Government specifies)."
          - "Pass the <strong>Patent Agent Examination</strong> conducted by the CGPDTM."
          - "Apply for registration with the required documents (including your degree) within the time the result notice allows."
  - id: "roadmap"
    hid: "roadmap-heading"
    alt: true
    eyebrow: "Step-by-step"
    heading: "Your full path to becoming a Patent Agent"
    parts:
      - steps:
          - title: "Class 12 Science"
            text: "PCM or PCB."
          - title: "Science / engineering / tech degree"
            text: "Pharma, biotech, electronics and computer science are in high demand."
          - title: "Prepare patent law"
            text: "The Patents Act, 1970 and Patents Rules — drafting practice matters most."
          - title: "Patent Agent Examination"
            text: "Paper I (objective) and Paper II (descriptive), per the current notice."
          - title: "Register and practise"
            text: "Join an IP law firm, a company IP cell or start your own practice."
          - title: "Optional: LLB"
            text: "Become a patent attorney who can also litigate."
      - roadmap_card: "Patent Agent"
  - id: "exams"
    hid: "exams-heading"
    eyebrow: "Exams & licences"
    heading: "The Patent Agent Examination"
    parts:
      - chips:
          - label: "Paper I"
            text: "Objective, multiple-choice questions on the Patents Act and Rules."
            source: "ipindia"
          - label: "Paper II"
            text: "Descriptive: drafting specifications and claims, and interpreting patent documents."
            source: "ipindia"
          - label: "Pass marks & viva"
            text: "Minimum marks per paper and any viva are fixed in each year's notice — read the current one."
            source: "ipindia"
          - label: "Who conducts it"
            text: "The Office of the Controller General of Patents, Designs and Trade Marks (IP India)."
            source: "ipindia"
  - id: "salary"
    hid: "salary-heading"
    alt: true
    eyebrow: "Indicative figures"
    heading: "Patent Agent pay in India"
    intro: "Pay varies a lot by employer, city and whether you practise independently; these are broad, commonly reported ranges, not guarantees."
    parts:
      - salary:
          - label: "Trainee / analyst"
            value: "Entry level"
            text: "Patent search and analytics roles are a common first job."
          - label: "Registered agent"
            value: "Clear step up"
            text: "Drafting and prosecution skill is what firms pay for."
          - label: "Partner / IP head"
            value: "High"
            text: "Senior agents and attorneys with a client base earn well."
  - id: "jobs"
    hid: "jobs-heading"
    eyebrow: "Where they work"
    heading: "Employers & growth path"
    parts:
      - chips:
          - label: "Employers"
            text: "IP law firms, pharma and tech companies' IP cells, patent analytics firms, universities' tech-transfer offices"
          - label: "Growth path"
            text: "Patent analyst → patent agent → senior associate → partner / head of IP"
          - label: "Government"
            text: "The Patent Office recruits Examiners of Patents & Designs through its own exam"
  - id: "proscons"
    hid: "pc-heading"
    alt: true
    eyebrow: "Honest take"
    heading: "Advantages and disadvantages"
    parts:
      - proscons:
          pros:
            - "Uses your science degree in a niche, respected field."
            - "Desk-based, intellectually rich work."
            - "Can be practised independently."
          cons:
            - "Small, competitive field with demanding drafting standards."
            - "Exam needs serious legal preparation."
            - "Early pay can be modest in analytics roles."
  - hid: "myth-heading"
    eyebrow: "Common myths"
    heading: "Myths vs facts"
    parts:
      - myths:
          - myth: "You need a law degree to work on patents."
            fact: "A science/tech graduate can become a registered patent agent without an LLB."
  - hid: "related-heading"
    alt: true
    eyebrow: "Related careers"
    heading: "If you're considering Patent Agent, also look at"
    parts:
      - related:
          - name: "Trademark Agent"
            sub: "Brand protection practice"
            href: "trademark-agent.html"
          - name: "LLB (Law)"
            sub: "Become a patent attorney"
            href: "llb.html"
          - name: "Biotechnology"
            sub: "Common patent-agent background"
            href: "biotechnology.html"
          - name: "B.Pharm"
            sub: "Pharma patents"
            href: "bpharm.html"
  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Who can sit the Patent Agent Examination?"
            a: "An Indian citizen aged 21 or more with a degree in science, engineering or technology, as section 126 of the Patents Act sets out."
          - q: "What is the difference between a patent agent and a patent attorney?"
            a: "A patent agent is registered with the Patent Office and can file and prosecute patents. A patent attorney is usually also an advocate, who can additionally argue cases in court."
          - q: "Can a B.Com or BA graduate become a patent agent?"
            a: "No. The degree must be in science, engineering or technology."
          - q: "Is there a viva in the exam?"
            a: "The paper pattern and any viva are fixed in the yearly notice; check the current notice on ipindia.gov.in."
      - note: "*Pay figures are indicative unless they quote an official pay level, and rules change: confirm eligibility, dates and fees on the official websites listed under Sources before you act."
        class: "table-note mt-lg"
