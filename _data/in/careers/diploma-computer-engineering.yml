  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Can I become a software developer with just this diploma?"
            a: "Yes, it's possible, particularly for junior developer or support roles, though many companies — especially larger ones — prefer or require a full B.Tech/BCA degree for core software development roles. Building a strong personal portfolio of projects genuinely helps diploma holders compete for these roles."
          - q: "Can I join B.Tech Computer Science/Engineering after this diploma?"
            a: "Yes. Diploma holders can use lateral entry to join the second year of a B.Tech Computer Science or Computer Engineering programme directly, through a state lateral entry exam or quota, skipping the first year entirely."
          - q: "What is the difference between Diploma in Computer Engineering and Diploma in IT?"
            a: "Diploma in Computer Engineering covers programming, computer hardware, operating systems and databases more broadly. Diploma in Information Technology leans more toward networking, system administration and IT infrastructure support. There's significant overlap, and course content can vary somewhat by institute."
          - q: "Do I need to know programming before starting this diploma?"
            a: "No prior programming knowledge is required — the diploma teaches programming fundamentals from the basics, typically starting with a language like C, and building up through the semesters."
          - q: "What jobs can I get with just this diploma, without a further degree?"
            a: "Common roles include junior software developer, IT support technician, web developer, database administrator assistant, and QA/testing roles at IT companies and businesses with in-house technology teams."
