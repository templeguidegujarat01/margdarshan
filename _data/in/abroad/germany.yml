# Germany — study abroad sheet (shape: _data/in/abroad_common.yml header). Read 2026-10-29 (APS India, DAAD, German missions, BAMF).
id: germany
name: Germany
short: Germany
region: Europe
currency: EUR
checked: 2026-10-29
review_by: 2027-01-29
status: open
eyebrow: "Study abroad · Europe"
title: "Study in Germany from India"
seo_title: "Study in Germany from India: APS, dMAT, €11,904 Account"
description: "Germany from India: APS certificate, the new €150 dMAT for B.Tech/B.Com master's applicants, €11,904 blocked account, 140 full working days and an 18-month job-search permit."
lede: "Most public universities in Germany charge no tuition, but the paperwork is strict. Indian applicants need an APS certificate before the visa, money in a blocked account, and — for many master's applicants from 2027 — a dMAT score."
alert:
  text: "New: from summer semester 2027, B.Tech/B.Eng, Commerce, Economics, BBA and Management graduates applying for a master's need the dMAT (€150) as part of APS. Those who registered for APS before 29 June 2026 are exempt."
  source: aps_dmat
facts:
  - { label: "Blocked account", value: "€11,904 a year (€992 a month)", source: mission_funds }
  - { label: "Before the visa", value: "APS certificate (India)", source: aps_home }
  - { label: "Work", value: "140 full or 280 half days a year", source: daad_jobs }
  - { label: "After graduating", value: "Up to 18 months to find a job", source: bamf_grad }
card:
  line: "Mostly no tuition at public universities; APS + blocked account"
  psw: "Up to 18 months job search"
  work: "140 full / 280 half days a year"
  funds: "€11,904 a year (blocked)"
tests:
  - { exam: dmat, need: "APS certificate for Indian degrees; dMAT for master's applicants in engineering, commerce, economics and management (summer 2027 onwards)", source: aps_dmat }
  - { exam: testdaf, need: "For German-taught degrees: TDN 4 in all four parts admits to almost all programmes", source: testdaf_levels }
  - { exam: ielts, need: "English-taught courses set their own IELTS/TOEFL score on the course page", source: aps_home }
pillars:
  language_and_eligibility:
    heading: "APS, dMAT and language"
    parts:
      - points:
          - { t: "APS India verifies Indian marksheets and degrees; the certificate is part of the German student-visa file.", source: aps_home }
          - { t: "A three-year diploma after Class X alone is generally not enough: 12 years of school are normally required.", source: aps_faq }
          - { t: "The dMAT (an academic aptitude test) is required for APS applications for intakes from summer semester 2027 for all B.Tech/B.Eng graduates and for degrees in Commerce, Accounting, Finance, Economics, Business Administration or Management.", source: aps_dmat }
          - { t: "German-taught degrees need German proof such as TestDaF (TDN 4 in all four parts covers almost all programmes).", source: testdaf_levels }
  intakes_and_streams:
    heading: "Semesters and courses"
    parts:
      - points:
          - { t: "The dMAT 2027 dates are 16 January and 13 March 2027, aimed at Winter Semester 2027/28 starts.", source: aps_dmat }
          - { t: "APS gives no fixed processing time; it depends on volume and how fast your board or university answers — start months ahead.", source: aps_faq }
      - note: "German universities have a winter semester (starting October) and a summer semester (starting April); many English-taught master's start only in winter. Check the DAAD International Programmes database and each university's deadline."
  tuition_and_living_costs:
    heading: "Money you must show"
    parts:
      - money:
          - { item: "Blocked account (proof of funds)", cur: EUR, amount: 11904, per: "year", source: mission_funds }
          - { item: "Monthly release from the blocked account", cur: EUR, amount: 992, per: "month", source: mission_funds }
          - { item: "dMAT fee (master's applicants)", cur: EUR, amount: 150, per: "test", source: aps_dmat }
          - { item: "DAAD master's scholarship (if you win one)", cur: EUR, amount: 992, per: "month", source: daad_master }
      - points:
          - { t: "German missions state the yearly amount to pay into a blocked account as €11,904.", source: mission_funds }
          - { t: "The APS fee is paid online and is not refunded whatever the outcome.", source: aps_faq }
      - note: "Most public universities charge only a semester contribution; some states charge non-EU students tuition. Check the university's fee page."
  global_scholarships:
    heading: "DAAD and other funding"
    parts:
      - awards:
          - { name: "DAAD Study Scholarships — Master Studies for All Academic Disciplines", by: "DAAD", who: "Graduates applying for a full master's in Germany", gives: "€992 a month for 10–24 months, insurance and a yearly study allowance; DAAD does not pay tuition", url: "https://www2.daad.de/deutschland/stipendium/datenbank/en/21148-scholarship-database/?detail=50026200", source: daad_master }
          - { name: "KOSPIE (with Indian IITs)", by: "DAAD", who: "IIT master's/M.Tech students in engineering, maths and sciences with CGPA 8.5+", gives: "7-month thesis project in Germany, €992 a month, research allowance and travel subsidy", url: "https://www2.daad.de/deutschland/stipendium/datenbank/en/21148-scholarship-database/?detail=57504697", source: daad_kospie }
          - { name: "Erasmus Mundus Joint Masters", by: "European Union", who: "Students from any country", gives: "Joint master's across several EU universities; scholarships for top applicants", url: "https://www.eacea.ec.europa.eu/scholarships/erasmus-mundus-catalogue_en", source: erasmus }
  application_funnel:
    heading: "From APS to visa"
    parts:
      - steps:
          - { title: "APS (and dMAT if your field needs it)", text: "Check your procedure, register, pay online, courier the documents and track the status.", source: aps_home }
          - { title: "Apply to universities", text: "Use each university's portal (or uni-assist where the university says so) before the semester deadline." }
          - { title: "Open a blocked account", text: "€11,904 for the year, released at €992 a month after arrival.", source: mission_funds }
          - { title: "Visa appointment", text: "Apply at the German mission with admission, APS certificate, blocked account proof and health insurance.", source: aps_home }
          - { title: "After arrival", text: "Get your residence permit from the local foreigners' office." }
  visa_chokepoints:
    heading: "The student visa in short"
    parts:
      - points:
          - { t: "No APS certificate, or one issued for a different degree level, is the most direct blocker for Indian files.", source: aps_home }
          - { t: "If you finish another qualification that changes your admission category, APS must evaluate you again, for a new fee.", source: aps_faq }
          - { t: "The blocked account must show the full year's amount when you apply.", source: mission_funds }
  post_study_work:
    heading: "Work during and after your course"
    parts:
      - points:
          - { t: "International students from outside the EU may work 140 full days or 280 half days a year; more needs permission from the Federal Employment Agency and the foreigners' office.", source: daad_jobs }
          - { t: "Academic assistant (student assistant) jobs at the university have no day limit, but you must tell the foreigners' office.", source: daad_jobs }
          - { t: "After graduating you can get a residence permit for up to 18 months to look for a job if your living costs are covered; you may work during that time.", source: bamf_grad }
visa:
  slug: germany-student-visa
  name: "German student visa"
  short: "Student visa"
  seo_title: "German Student Visa from India: APS, Blocked Account, Steps"
  description: "German national student visa from India: APS certificate (and dMAT for many master's), €11,904 blocked account, admission letter, insurance and the post-study 18 months."
  lede: "For Indians, the German student visa starts months earlier at APS India. Without the APS certificate and a funded blocked account, the visa file is not complete."
  facts:
    - { label: "Document check", value: "APS India certificate", source: aps_home }
    - { label: "Blocked account", value: "€11,904 a year", source: mission_funds }
    - { label: "dMAT", value: "€150, many master's applicants from 2027", source: aps_dmat }
    - { label: "Job search after", value: "Up to 18 months", source: bamf_grad }
  official:
    - { label: "APS India", url: "https://aps-india.de/" }
    - { label: "German Missions in India", url: "https://india.diplo.de/" }
  sections:
    - id: steps
      nav: Steps
      eyebrow: "Order of work"
      heading: "Step by step"
      parts:
        - steps:
            - { title: "APS certificate", text: "Follow the checklist for your background (Class XII, JEE, undergraduates, graduates). Send documents together; do not send originals unless asked.", source: aps_checklists }
            - { title: "dMAT if your field needs it", text: "B.Tech/B.Eng, commerce, economics, business and management graduates for master's intakes from summer 2027.", source: aps_dmat }
            - { title: "Admission", text: "Get the university's admission letter." }
            - { title: "Blocked account", text: "Pay in €11,904 for the year.", source: mission_funds }
            - { title: "Visa appointment", text: "Submit the file with APS certificate, admission, funds and insurance at the mission." }
    - id: chokepoints
      nav: "Common problems"
      eyebrow: "Where files go wrong"
      heading: "Choke points to check twice"
      parts:
        - points:
            - { t: "Applying for the visa before APS is issued.", source: aps_home }
            - { t: "Assuming a dMAT is not needed: it is mandatory for affected master's fields from summer semester 2027.", source: aps_dmat }
            - { t: "A 3-year diploma after Class X without 12 years of school.", source: aps_faq }
            - { t: "Agents who promise a faster APS: APS gives no fixed time and decides only on complete, correct documents.", source: aps_faq }
doubts:
  - { q: "Is APS compulsory for a German student visa from India?", a: "Yes for applicants with Indian school or university documents. APS India verifies them and the certificate is part of the visa file. Some cases, such as degrees not issued in India, are exempt.", source: aps_faq }
  - { q: "What is the dMAT for Germany?", a: "A standardised aptitude test for master's applicants run by g.a.s.t. as part of APS. It is required from summer semester 2027 for B.Tech, B.Eng, commerce, economics, business and management graduates, and costs 150 euros.", source: aps_dmat }
  - { q: "How much money is needed in a German blocked account?", a: "German missions state 11,904 euros a year, which is released at 992 euros a month after you arrive.", source: mission_funds }
  - { q: "How many hours can I work as a student in Germany?", a: "Non-EU students may work 140 full days or 280 half days a year. Student assistant jobs at the university have no day limit.", source: daad_jobs }
  - { q: "Can I stay in Germany after graduation to find a job?", a: "Yes. You can get a residence permit for up to 18 months to look for a job if your living costs are covered, and you may work during that time.", source: bamf_grad }
