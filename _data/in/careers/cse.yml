  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What is Computer Science Engineering?"
    parts:
      - overview:
          points:
            - "Computer Science Engineering (CSE) is a 4-year engineering degree that teaches how computers actually work and how to build software on top of them — programming, algorithms, data structures, operating systems, databases and computer networks form the core."
            - "From this foundation, students branch into specialisations like artificial intelligence, machine learning, cybersecurity, cloud computing or data science, either through electives inside CSE or through closely related sibling branches offered at the same colleges."
            - "It's the single most in-demand engineering branch at almost every Indian engineering college, which is exactly why its entrance cutoffs are the highest and its outcomes vary the most — the gap between a CSE graduate from a top Indian Institute of Technology (IIT) and one from a lesser-known private college is larger than in almost any other branch."
  - id: "who"
    hid: "who-heading"
    alt: true
    eyebrow: "Fit check"
    heading: "Who should choose CSE"
    parts:
      - fit:
          match:
            - "Genuinely enjoy logical puzzles, breaking problems into steps, and don't mind long hours debugging code that isn't working."
            - "Are willing to keep learning constantly — the tools and frameworks that matter change every few years."
            - "Want a field with genuinely global demand, remote work options, and strong freelance/startup potential."
          mismatch:
            - "Are choosing CSE only because \"it pays the most\" without any real interest in coding — most students who dislike programming in Year 1 continue to dislike it."
            - "Expect a guaranteed high package regardless of college — outcomes vary enormously by institute and by your own effort."
            - "Strongly dislike long screen time and mostly sedentary, desk-based work."
  - id: "eligibility"
    hid: "elig-heading"
    eyebrow: "Eligibility"
    heading: "Who can apply for CSE"
    parts:
      - elig_list:
          - "Class 12 pass with <strong>Physics, Chemistry and Mathematics (PCM)</strong> from a recognised board — this is non-negotiable for any credible CSE programme."
          - "For IITs and National Institutes of Technology (NITs) via Joint Entrance Examination (JEE), a minimum of <strong>75% aggregate in Class 12</strong> (65% for SC/ST) is required to be eligible for counselling, regardless of your JEE rank."
          - "Private colleges are generally more flexible, often accepting <strong>50-60% in PCM</strong>, with no strict age limit on JEE Main itself."
  - id: "roadmap"
    hid: "roadmap-heading"
