# ---------------------------------------------------------------------------
# India edition top menu (_includes/in-header-hubs.html), drawn on EVERY India
# edition page (region "in", not region-neutral) — those pages have no sidebar.
# Left to right in the order below; the items sit tight together (no end push).
#   type home  = icon-only link
#   type menu  = <details> dropdown of children (label, href, desc)
#   type tile  = solid gold action link
#   sub        = optional flyout at the base of a menu panel: { label, href, children }.
#                Desktop with a mouse: opens to the RIGHT of the panel on hover/focus
#                (flips left when there is no room). Touch / below 1024px: listed inline.
# icon (home and tile only) is the inner SVG markup for a 24x24, stroke-based icon.
# ---------------------------------------------------------------------------
topnav:
  - type: home
    label: India Home
    href: india.html
    icon: '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>'
  # Menus with `nodes` open as a mega panel: a rail of node names on the left, and the hovered node's
  # columns on the right. `mega: <key>` takes the columns from _data/nav_mega.yml, which
  # scripts/build-nav-mega.mjs builds from the hub pages and data (rerun it after adding a career).
  # Optional node keys: `title` (pane heading), `head: {label, href}` (pane's top-right link),
  # `badge: stem | health | finance` (a small category tag after the node's name in the rail).
  #
  # Domain menus (2026-10-31): Engineering, Medical, Commerce, Law & Arts, Design, Govt Jobs, Diploma & ITI.
  # Every domain keeps ONE rail order so a student who learns one menu can read them all:
  #   Exams & Admissions (hand list here) → Careers & Courses → Colleges → Coaching → Roadmaps (mega keys
  #   <d>-careers / <d>-colleges / <d>-coaching / <d>-roadmaps, built by scripts/build-nav-mega.mjs).
  # "Start Here" comes first for students who do not know their domain yet. Only pages that exist and finder
  # keys with verified listings are linked — no sponsored or "apply now" links, no dated leftovers.
  - type: menu
    label: Start Here
    nodes:
      - label: Choose a Stream
        href: after-10th.html
        title: Pick your stream after Class 10
        head: { label: Compare all 5 pathways, href: after-10th.html }
        cols:
          - label: After Class 10th
            links:
              - { label: Science, href: science.html, desc: "PCM for engineering · PCB for medical" }
