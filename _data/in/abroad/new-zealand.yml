doubts:
  - { q: "How much money is needed for a New Zealand student visa?", a: "NZD 20,000 for each year of study of one year or more, or NZD 1,667 a month for shorter study, plus paid tuition for the first year or course.", source: fpsv }
  - { q: "How many hours can students work in New Zealand?", a: "Up to 25 hours a week while studying and full time in the summer holidays or scheduled breaks, depending on your visa conditions.", source: fpsv }
  - { q: "How long is the post-study work visa in New Zealand after a master's?", a: "Three years, if you studied the master's full time in New Zealand for at least 30 weeks.", source: inz_length }
  - { q: "Can I take my spouse with me on a New Zealand student visa?", a: "You cannot include them in your application, but your partner and children can apply for visas based on their relationship to you.", source: fpsv }
