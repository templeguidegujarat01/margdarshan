sections:
  - id: "quick"
    hid: "quick-heading"
    alt: true
    eyebrow: "Quick answers"
    heading: "Commercial Pilot at a glance"
    intro: "Check whether your Class 12 background qualifies. Duration and pay are in the summary at the top of the page."
    parts:
      - subhead: "Can I apply from my stream?"
      - streams:
          - label: "Science"
            fit: "Eligible"
            tone: "y"
            icon: "science"
          - label: "Commerce"
            fit: "Eligible with NIOS"
            tone: "m"
            icon: "commerce"
          - label: "Arts / Humanities"
            fit: "Eligible with NIOS"
            tone: "m"
            icon: "arts"
      - note: "Physics and Maths at Class 12 level are compulsory; students without them can pass both through NIOS before applying."
  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What does a Commercial Pilot do?"
    parts:
      - overview:
          points:
            - "A commercial pilot flies an aircraft for hire — airline passenger flights, cargo, charters or training flights — and is legally responsible for the safety of everyone on board."
            - "New pilots join an airline as a <strong>First Officer</strong> (co-pilot) and become a <strong>Captain</strong> after building command experience and upgrading to an Airline Transport Pilot Licence (ATPL)."
            - "The job is shift-based and rule-bound: flight-duty limits, regular simulator checks, medical renewals and recurrent training never stop."
  - id: "who"
    hid: "who-heading"
    alt: true
    eyebrow: "Fit check"
    heading: "Who should become a Commercial Pilot"
    parts:
      - fit:
          match:
            - "Love flying and are calm, disciplined and rule-following under pressure."
            - "Can meet the DGCA Class 1 medical standard and keep it for decades."
            - "Have a realistic funding plan for training that commonly costs tens of lakhs."
          mismatch:
            - "Need a cheap or guaranteed route — training is expensive and jobs depend on airline hiring cycles."
            - "Dislike irregular hours, nights away from home and constant re-testing."
            - "Are not willing to keep your medical fitness and skills sharp for your whole career."
  - id: "eligibility"
    hid: "elig-heading"
    eyebrow: "Eligibility"
    heading: "What you need, stage by stage"
    parts:
      - elig_list:
          - "Class 12 (10+2) pass with <strong>Physics and Mathematics</strong>; candidates from other streams can clear both subjects through NIOS."
          - "Minimum age 17 for a Student Pilot Licence and <strong>18 to be issued a CPL</strong>."
          - "A DGCA <strong>Class 2 medical</strong> before solo flying and a <strong>Class 1 medical</strong> from a DGCA-empanelled examiner for the CPL."
          - "Pass the DGCA theory examinations and the radio-telephony (RTR) licence exam, plus a skill test with a DGCA examiner."
      - warn_box: "Do a DGCA Class 1 medical before paying a flying school. Eyesight, hearing and other conditions can make you unfit, and fees are rarely refunded."
  - id: "roadmap"
    hid: "roadmap-heading"
    alt: true
    eyebrow: "Step-by-step"
    heading: "Your full path to becoming a Commercial Pilot"
    parts:
      - steps:
          - title: "Class 12 with Physics & Maths"
            text: "Add them through NIOS if your stream did not include them."
          - title: "DGCA medicals"
            text: "Class 2 first, then the Class 1 medical with a DGCA-empanelled examiner."
          - title: "Join a DGCA-approved flying school"
            text: "In India or abroad; foreign licences must be converted under DGCA rules."
          - title: "Theory exams and 200 flying hours"
            text: "Clear DGCA papers on eGCA and log the hours the CPL rules require."
          - title: "CPL + RTR(A) licence"
            text: "DGCA issues the CPL after a skill test and document checks."
          - title: "Type rating and airline entry"
            text: "Training on one airliner type, then First Officer; Captain after the ATPL."
  - id: "exams"
    hid: "exams-heading"
    eyebrow: "Exams & licences"
    heading: "DGCA exams, medicals and licences"
    parts:
      - chips:
          - label: "Theory papers"
            text: "Air Regulations, Air Navigation, Aviation Meteorology, Technical General and Technical Specific, booked and tracked on the eGCA portal."
            source: "egca"
          - label: "Radio telephony RTR(A)"
            text: "A separate radio licence every CPL holder needs to talk to air traffic control."
            source: "dgca"
          - label: "Skill test"
            text: "A check flight with a DGCA-approved examiner after the required flight time."
            source: "dgca"
          - label: "Airline selection"
            text: "Airlines run their own written tests, simulator checks and interviews; some run cadet programmes that train you from zero."
      - note_box: "Hour splits (solo, cross-country, instrument and night flying) are set in DGCA Civil Aviation Requirements and change over time — read the current CAR on dgca.gov.in."
  - id: "salary"
    hid: "salary-heading"
    alt: true
    eyebrow: "Indicative figures"
    heading: "Commercial Pilot pay in India"
    intro: "Private-sector pay varies a lot by employer and city; these are broad, commonly reported ranges, not guarantees."
    parts:
      - salary:
          - label: "Training cost"
            value: "Tens of lakhs"
            text: "Flying schools quote very different totals for the CPL; type rating is usually extra. Get the full written fee schedule."
          - label: "First Officer"
            value: "Well above most fresher jobs"
            text: "Airline First Officers are among the better-paid early-career professionals once hired."
          - label: "Captain"
            value: "Top of the scale"
            text: "Command pay rises sharply; it depends on airline, aircraft type and flying hours."
  - id: "jobs"
    hid: "jobs-heading"
    eyebrow: "Where they work"
    heading: "Employers & growth path"
    parts:
      - chips:
          - label: "Employers"
            text: "Scheduled airlines, cargo carriers, charter and regional operators, flying schools (as instructors)"
          - label: "Growth path"
            text: "First Officer → Senior First Officer → Captain → Training Captain / Examiner"
          - label: "While waiting for a job"
            text: "Many new CPL holders instruct or keep their licence current until airline hiring opens"
  - id: "proscons"
    hid: "pc-heading"
    alt: true
    eyebrow: "Honest take"
    heading: "Advantages and disadvantages"
    parts:
      - proscons:
          pros:
            - "One of the best-paid careers once you are flying for an airline."
            - "A clear, rule-based licence path with no entrance-exam rank race."
            - "Respected, international skill set."
          cons:
            - "Very high training cost and real job-market risk between CPL and first job."
            - "A failed medical can end the career at any stage."
            - "Irregular hours, nights away and constant checks."
  - hid: "myth-heading"
    eyebrow: "Common myths"
    heading: "Myths vs facts"
    parts:
      - myths:
          - myth: "Any flying school certificate gets you an airline job."
            fact: "Airlines hire through their own tests; a CPL makes you eligible to apply, not hired."
          - myth: "You need a science degree to fly."
            fact: "Class 12 with Physics and Maths is the academic requirement; a degree is optional."
  - hid: "related-heading"
    alt: true
    eyebrow: "Related careers"
    heading: "If you're considering Commercial Pilot, also look at"
    parts:
      - related:
          - name: "Aircraft Maintenance Engineer"
            sub: "DGCA-licensed aircraft engineering"
            href: "aircraft-maintenance-engineer.html"
          - name: "Air Traffic Controller"
            sub: "AAI Junior Executive (ATC)"
            href: "air-traffic-controller.html"
          - name: "Aerospace Engineering"
            sub: "Aircraft & spacecraft design"
            href: "aerospace.html"
          - name: "Pilot & aviation hub"
            sub: "Flight schools and DGCA basics"
            href: "niche-careers/aviation.html"
  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Can a Commerce or Arts student become a pilot?"
            a: "Yes, by passing Physics and Mathematics at Class 12 level through NIOS. DGCA asks for those two subjects, not for the Science stream as such."
          - q: "How many flying hours does a CPL need?"
            a: "At least 200 hours of flight time under DGCA rules, with minimums for solo, cross-country, instrument and night flying set in the current CAR."
          - q: "Do I need a degree to become a commercial pilot?"
            a: "No. Some students do a degree alongside as a back-up, but DGCA licences are not tied to a degree."
          - q: "What is a type rating?"
            a: "Training and a check on one specific airliner type (for example the A320 or B737). Airlines need it before you fly their aircraft; it is a separate cost unless the airline sponsors it."
      - note: "*Pay figures are indicative unless they quote an official pay level, and rules change: confirm eligibility, dates and fees on the official websites listed under Sources before you act."
        class: "table-note mt-lg"
