    phase: 8
    live: false
    summary: "The Hospitality, Events, & Tourism Career Cluster encompasses a broad range of services and experiences related to food and beverage, lodging, travel, events, and conferences."
    definition: "The Hospitality, Events, & Tourism Career Cluster encompasses a broad range of services and experiences related to food and beverage, lodging, travel, events, and conferences. This Cluster focuses on delivering quality customer service, memorable experiences, and seamless logistics to cater to the needs and preferences of guests, tourists, and event participants. The Cluster is characterized by its diversity, including everything from luxury hotels and international travel to local dining, cultural events, and business conferences, aiming to enhance the overall experience of visitors and attendees."
