sections:
  - id: "quick"
    hid: "quick-heading"
    alt: true
    eyebrow: "Quick answers"
    heading: "Fisheries Scientist at a glance"
    intro: "Check whether your Class 12 background qualifies. Duration and pay are in the summary at the top of the page."
    parts:
      - subhead: "Can I apply from my stream?"
      - streams:
          - label: "Science"
            fit: "Eligible"
            tone: "y"
            icon: "science"
          - label: "Commerce"
            fit: "Not eligible"
            tone: "n"
            icon: "commerce"
          - label: "Arts / Humanities"
            fit: "Not eligible"
            tone: "n"
            icon: "arts"
      - note: "Class 12 Science with Biology (PCB) is the standard requirement; some colleges also accept PCM."
  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What does a Fisheries Scientist do?"
    parts:
      - overview:
          points:
            - "Fisheries professionals design and run fish and shrimp farms, manage hatcheries, control fish diseases and improve feed."
            - "Others work in fish processing and export quality, marine fisheries management or fisheries extension with farmers."
            - "Research covers breeding, genetics, nutrition and sustainable fisheries."
  - id: "who"
    hid: "who-heading"
    alt: true
    eyebrow: "Fit check"
    heading: "Who should become a Fisheries Scientist"
    parts:
      - fit:
          match:
            - "Like biology, water and field work."
            - "Want an agriculture-linked career with business options."
            - "Are open to working in coastal or rural areas."
          mismatch:
            - "Want a city office job."
            - "Dislike handling fish and farms."
            - "Expect a big urban job market straight after graduation."
  - id: "eligibility"
    hid: "elig-heading"
    eyebrow: "Eligibility"
    heading: "What you need, stage by stage"
    parts:
      - elig_list:
          - "Class 12 with <strong>Physics, Chemistry and Biology</strong> (some colleges accept PCM or PCMB); minimum marks as each university sets."
          - "For ICAR's national quota seats: a valid <strong>CUET-UG</strong> score and ICAR counselling."
          - "State quota seats through state agricultural university admission rules."
  - id: "roadmap"
    hid: "roadmap-heading"
    alt: true
    eyebrow: "Step-by-step"
    heading: "Your full path to becoming a Fisheries Scientist"
    parts:
