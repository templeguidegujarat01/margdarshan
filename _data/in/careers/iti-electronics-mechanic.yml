    hid: "faq-heading"
    alt: true
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "What is the difference between Electronics Mechanic and Electrician trades?"
            a: "Electronics Mechanic focuses on repairing and servicing electronic devices — TVs, mobile phones, appliances, circuit boards. Electrician focuses on electrical wiring, motors and power systems. Electronics Mechanic works with low-voltage circuits and components; Electrician works with power distribution and higher-current electrical systems."
          - q: "How long is the ITI Electronics Mechanic course?"
            a: "Electronics Mechanic is typically a 2-year NCVT-affiliated trade, combining electronics theory, circuit analysis and substantial hands-on repair and troubleshooting practice."
          - q: "Can I repair mobile phones after this trade?"
            a: "The base trade gives you a strong electronics fundamentals foundation, but mobile phone repair specifically (especially modern smartphones) often requires additional specialised training or certification, since phone repair techniques and tools have become quite specific. Many graduates pursue a separate mobile repair course to specialise in this growing niche."
          - q: "What industries hire ITI Electronics Mechanics?"
            a: "Consumer electronics service centres, appliance manufacturers, electronics assembly and manufacturing companies, and increasingly, IoT/embedded device companies all hire trained electronics mechanics, alongside government/PSU and defence technical recruitment routes."
          - q: "Can I start my own electronics repair shop after this trade?"
            a: "Yes, this is a genuine and common path. Many electronics mechanics open their own repair shops for TVs, appliances, mobile phones and other consumer electronics after gaining practical experience and building relevant specialised skills."
      - note: "*Fee and salary figures are indicative, based on publicly available information as of 2026, and vary significantly by state, institute and employer — always verify current figures directly with your target ITI."
