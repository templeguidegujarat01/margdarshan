    alt: true
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Is demand for AC technicians genuinely growing in India?"
            a: "Yes. Rising temperatures, increasing AC ownership across Indian households and businesses, and growth in commercial refrigeration (cold storage, food retail) have created strong, steady demand for trained refrigeration and AC technicians, particularly during summer months."
          - q: "How long is the ITI Refrigeration & AC Technician course?"
            a: "This trade is typically a 1-2 year NCVT-affiliated course (duration varies by state/institute), combining refrigeration cycle theory and substantial hands-on installation, servicing and repair practice."
          - q: "Do I need special certification to handle refrigerant gases?"
            a: "Certain refrigerants are regulated under environmental guidelines, and proper handling training is part of the course. Always follow current environmental and safety regulations regarding refrigerant handling, which are periodically updated — check current requirements with your training institute or employer."
          - q: "Can I start my own AC repair/installation business after this trade?"
            a: "Yes, this is one of the trade's biggest draws. Many technicians build independent AC repair, installation and servicing businesses after gaining practical experience, particularly benefiting from seasonal demand spikes during summer."
          - q: "What industries hire Refrigeration & AC Technicians beyond home AC repair?"
            a: "Commercial refrigeration (cold storage, supermarkets), industrial HVAC systems, hotels and hospitals (large-scale climate control), and food processing/logistics (cold chain) all hire trained technicians, beyond typical home AC service work."
