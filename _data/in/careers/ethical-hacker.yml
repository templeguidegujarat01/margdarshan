  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Is ethical hacking legal in India?"
            a: "Yes, when done with written permission from the system owner. Without permission it is an offence under the IT Act, 2000."
          - q: "Do I need a certification to become an ethical hacker?"
            a: "No law requires one, but reputable hands-on certifications help in hiring."
          - q: "What is CERT-In?"
            a: "The Indian Computer Emergency Response Team, the national agency for cyber-security incidents, which also empanels security-audit organisations."
      - note: "*Pay figures are indicative unless they quote an official pay level, and rules change: confirm eligibility, dates and fees on the official websites listed under Sources before you act."
        class: "table-note mt-lg"
