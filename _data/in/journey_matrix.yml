  # ------------------------------------------------------------------ DENTIST (batch 5, three-layer schema)
  - id: dentist
    v: 2
    name: "Dentist / Dental Surgeon (NEET-UG → BDS)"
    search: ["dentist", "dental surgeon", "general dentist", "paediatric dentist", "dental implantologist", "army dental officer"]
    search_not: ["veterinary", "technician", "assistant", "hygienist", "ceramist", "laboratory"]
    page: "bds.html"
    roadmap: "roadmaps/bds.html"
    doubts_page: "journey-dentist.html"
    gate: "Class 12 with Physics, Chemistry, Biology and English → NEET (UG) → BDS seat through MCC or your state's counselling → 4 years of study + 1 year of paid rotatory internship → registration with your State Dental Council → practice, government job, or NEET-MDS for a specialty."
    gate_source: [neet-ib, bds13, mds26]
    core:
      what:
        text: "A dentist examines, diagnoses and treats problems of the teeth, gums and mouth — fillings, extractions, root canals, braces and dentures — and teaches people how to keep their mouth healthy."
        source: upsc-adv06
      day:
        - "See patients one by one: check teeth and gums, read X-rays, explain the treatment and its cost."
        - "Do procedures with your hands for long hours — fillings, cleaning, extractions, root canals."
        - "Keep instruments sterile, write records and prescriptions, and guide dental assistants."
      pay:
        - { level: "Government entry (UPSC, 2026)", value: "Pay Level 9 (7th CPC) — Dental Surgeon, UT of Ladakh, UPSC Advertisement 06/2026", source: upsc-adv06 }
      pay_note: "No official body publishes private-clinic or senior dentist pay, so we print only a government entry level."
      routes:
        - { title: "Own clinic or private practice", text: "After BDS and registration with your State Dental Council. Many dentists start by working in an established clinic.", source: mds26 }
        - { title: "Government dental surgeon", text: "UPSC and state commissions recruit Dental Surgeons who hold a BDS and are registered with the Dental Council of India or a State Dental Council.", source: upsc-adv06 }
        - { title: "Specialist (MDS)", text: "NEET-MDS after BDS and the internship is the single entrance for the Master of Dental Surgery (MDS) in a dental specialty.", source: mds26 }
      cost_time:
        - { label: "BDS", value: "4 years of study + 1 year of paid rotatory internship", source: bds13 }
        - { label: "NEET (UG) fee 2026", value: "₹1,700 General · ₹1,600 EWS / OBC-NCL · ₹1,000 SC / ST / PwBD / third gender", source: neet-ib }
        - { label: "NEET-MDS fee 2026", value: "₹3,500 General / OBC / EWS · ₹2,500 SC / ST / PwD", source: mds26 }
      cost_note: "College fees depend on the state fee committee and the college (government, private or deemed), so we do not print one national figure."
      challenges:
        - text: "Every BDS seat — government or private — is filled only through NEET (UG), and you must cross the NEET qualifying percentile."
          source: neet-ib
        - text: "Some states tie government seats to service: in Uttar Pradesh, government MBBS and BDS students sign a <strong>2-year, ₹10 lakh service bond</strong>."
          source: up-neet
        - text: "NEET-MDS cuts <strong>25% of the marks</strong> for every wrong answer, so guessing costs you."
          source: mds26
      not_for:
        - "You do not like fine, careful work with your hands for many hours a day."
        - "You feel uneasy with blood, saliva or close contact with patients' faces."
        - "You want a job with fixed government pay straight after college — most dentists start in private clinics."
    journey:
      - stages: [c8, c9]
        title: "Biology and steady hands"
        do:
          - text: "NEET (UG) has <strong>Physics 45, Chemistry 45 and Biology 90 questions</strong>. Strong school Science now makes Class 11–12 far easier."
            source: neet-ib
          - text: "Hobbies like drawing, craft or model-making build the fine hand control that dentistry needs."
        doubts:
          - q: "Do I need NEET to become a dentist?"
            a: "Yes. All seats in undergraduate medical and dental courses, including BDS, are filled through NEET (UG) — in government and private colleges alike."
            next: "Plan for NEET in your Class 12 year."
            source: neet-ib
          - q: "Is a dentist a real doctor?"
            a: "A dentist holds a Bachelor of Dental Surgery (BDS) and is registered with the State Dental Council. It is a separate degree from MBBS, and a dentist treats the teeth, gums and mouth."
            next: "Read the Routes list above to see where dentists work."
            source: [mds26, upsc-adv06]
      - stages: [c10]
        title: "Choose Science with Biology and English"
        do:
          - text: "Take Physics, Chemistry and <strong>Biology or Biotechnology</strong>, with English, in Class 11–12 — these are the subjects NEET (UG) needs."
            source: neet-ib
        stream: "PCB with English (Maths optional). PCMB keeps engineering open too."
        mistakes:
          - "Dropping Biology in Class 11 to 'keep options open' — you will need it for NEET."
        late: "Already took Maths without Biology? NMC's 2023 notice lets you pass Biology later as an additional subject from a recognised board and still sit NEET."
        doubts:
          - q: "Can I take NEET with PCM instead of PCB?"
            a: "Not with PCM alone. You need Physics, Chemistry, Biology or Biotechnology and English. Students who studied these as additional subjects after Class 12 from a recognised board are also allowed."
            next: "If you are in PCM, add Biology as an additional subject before you apply."
            source: neet-ib
          - q: "Do I need Maths for BDS?"
            a: "No. NEET (UG) needs Physics, Chemistry, Biology or Biotechnology and English. Your other subject can be Mathematics or any other elective."
            next: "Keep Maths only if you want engineering as a backup."
            source: neet-ib
          - q: "Can I study dentistry after Class 10?"
            a: "Not BDS. You need Class 12 with Physics, Chemistry, Biology and English, and a NEET (UG) rank."
            next: "Choose Science with Biology for Class 11."
            source: neet-ib
      - stages: [c11, c12]
        title: "NEET year: age, percentile and counselling"
        do:
          - text: "You must be <strong>17 by 31 December</strong> of the NEET year. There is <strong>no upper age limit</strong>."
            source: neet-ib
          - text: "You can sit NEET while your Class 12 result is awaited, but you must have passed by the first counselling round."
            source: neet-ib
          - text: "After the result, register for <strong>MCC counselling</strong> (15% All India Quota, central and deemed universities) and, separately, for your state's counselling."
            source: neet-ib
        exams:
          - { name: "NEET (UG) 2026", when: "Re-held 21 June 2026 · result 16 July 2026", source: [neet-re, neet-res] }
          - { name: "MCC and state counselling 2026", when: "Round 2 from 3 Sept · stray round to 17 Oct · last joining 26 Oct 2026", source: ndc-r4 }
        money: [neet-fee, csss, pms-sc]
        mistakes:
          - "Registering only for MCC and forgetting your state's own counselling — most dental seats are state seats."
          - "Leaving a government seat after the last round — UP bars such students from the next year's admission."
        late: "Did not get a BDS seat? There is no limit on NEET attempts, so you can try again next year."
        doubts:
          - q: "What NEET percentile do I need for BDS?"
            a: "The 50th percentile for General and EWS, the 40th for SC, ST and OBC, and the 45th for General candidates with a benchmark disability."
            next: "Aim well above it — the percentile only makes you eligible, not admitted."
            source: neet-ib
          - q: "Is there an age limit for NEET?"
            a: "You must be 17 on or before 31 December of the exam year. There is no upper age limit."
            next: "Check your birth date against 31 December of your NEET year."
            source: neet-ib
          - q: "Who gives out BDS seats after NEET?"
            a: "MCC counsels the 15% All India Quota and the seats of central institutions, central universities and deemed universities. State authorities counsel the state-quota seats under their own rules."
            next: "Register with both MCC and your state's counselling body."
            source: neet-ib
          - q: "Can I apply for NEET before my Class 12 result?"
            a: "Yes. You may sit NEET while the result is awaited, but you must have passed Class 12 by the first counselling round."
            next: "Fill the NEET form in your Class 12 year."
            source: neet-ib
      - stages: [ug]
        title: "In BDS: four years, then a paid internship"
        do:
          - text: "BDS is <strong>4 years of study plus 1 year of paid rotatory internship</strong>; this counts for MDS admission, government jobs and State Dental Council registration."
            source: bds13
          - text: "In your internship year you may already apply for NEET-MDS if you will finish the internship by the cut-off date (31 May in 2026)."
            source: mds26
        doubts:
          - q: "How long is the BDS course?"
            a: "Four years of study followed by one year of paid rotatory internship."
            next: "Plan for five years in total before you can practise."
            source: bds13
          - q: "Who regulates dental colleges now?"
            a: "The National Dental Commission, set up under the National Dental Commission Act, 2023, has taken over from the Dental Council of India."
            next: "Check your college's recognition on the Commission's website before you pay fees."
            source: ndc-site
      - stages: [grad]
        title: "Register, then practise, join government service or go for MDS"
        do:
          - text: "Register with your <strong>State Dental Council</strong> — MDS admission and government posts ask for it."
            source: [mds26, upsc-adv06]
          - text: "For MDS, sit <strong>NEET-MDS</strong>: 240 MCQs in 3 hours, in two timed parts, with 25% negative marking."
            source: mds26
        exams:
          - { name: "NEET-MDS 2026", when: "Applications 14–30 Mar 2026 · exam 2 May 2026 · result by 2 June 2026", source: mds26 }
        doubts:
          - q: "How do I get into MDS?"
            a: "Through NEET-MDS, run by NBEMS. You need a recognised BDS, State Dental Council registration and a one-year internship completed by the cut-off date — 31 May in 2026."
            next: "Start NEET-MDS practice during your internship."
            source: mds26
          - q: "What score do I need in NEET-MDS?"
            a: "At least the 50th percentile for General and EWS, and the 40th for SC, ST and OBC candidates."
            next: "Check the year's bulletin — the cut-off can be lowered by notice."
            source: mds26
          - q: "How do I become a government dentist?"
            a: "Watch UPSC and your state commission for Dental Surgeon posts. In UPSC Advertisement 06/2026, Dental Surgeons for Ladakh needed a BDS and registration, at Pay Level 9."
            next: "Register on UPSC's online portal and your state's recruitment site."
            source: upsc-adv06
      - stages: [work]
        title: "Starting dentistry later"
        do:
          - text: "NEET (UG) has no upper age limit, so a later start is allowed if you have Class 12 with Physics, Chemistry, Biology and English."
            source: neet-ib
        doubts:
          - q: "I am 22 and working. Can I still become a dentist?"
            a: "Yes. NEET (UG) has no upper age limit and no cap on attempts — you need Class 12 with Physics, Chemistry, Biology and English."
            next: "If Biology is missing, pass it as an additional subject first, then register for NEET."
            source: neet-ib
    board_note: "NEET (UG) treats every board the same. Your Class 12 must include Physics, Chemistry, Biology or Biotechnology and English. State-quota seats follow your state's own domicile rules."
    board_source: neet-ib
    exam:
      name: "NEET (UG) 2026 → BDS · NEET-MDS 2026 → MDS"
      body: "National Testing Agency · NBEMS"
      href: "neet-ug.html"
      facts:
        - { label: "NEET paper", value: "180 questions · 720 marks · 3 hours, pen and paper", source: neet-ib }
        - { label: "NEET marking", value: "+4 correct · −1 wrong", source: neet-ib }
        - { label: "NEET-MDS paper", value: "240 MCQs · 3 hours · two timed parts", source: mds26 }
        - { label: "NEET-MDS marking", value: "+4 correct · 25% negative", source: mds26 }
      stages:
        head: ["Stage", "What it is", "Rule"]
        rows:
          - ["NEET (UG)", "Physics 45, Chemistry 45, Biology 90 questions", "50th percentile (General / EWS), 40th (SC / ST / OBC)"]
          - ["Counselling", "MCC for 15% AIQ and central / deemed seats; state bodies for state quota", "State domicile rules apply to state seats"]
          - ["BDS", "4 years + 1 year paid rotatory internship", "Then State Dental Council registration"]
          - ["NEET-MDS", "240 MCQs, Part A 100 questions / 75 min, Part B 140 / 105 min", "Internship done by the cut-off date"]
        source: [neet-ib, bds13, mds26]
      notes:
        - text: "If too few candidates cross the NEET percentile, the Central Government may lower it for that year only."
          source: neet-ib
        - text: "NEET-MDS questions are in English only."
          source: mds26
    state_uses: [board, med, scholarship, psc]
    state_rules:
      - state: uttar-pradesh
        text: "UP government dental colleges need a <strong>UP domicile</strong>; private colleges are open to other states. Government BDS students sign a <strong>2-year, ₹10 lakh service bond</strong>. Counselling fee ₹2,000; security money ₹30,000 (government) or ₹2,00,000 (private)."
        source: up-neet
      - state: maharashtra
        text: "The State CET Cell fills BDS seats in government, aided, municipal and private colleges on NEET (UG) merit. Register with it separately even if you registered with MCC."
        source: mh-neet3
      - state: gujarat
        text: "ACPUGMEC's state process (medical and dental) is for students who passed <strong>SSC and HSC from Gujarat</strong> and are domiciled in or born in Gujarat; merit is on the NEET All India Rank. ₹1,000 PIN + ₹10,000 refundable deposit."
        source: acpug-reg
      - state: west-bengal
        text: "State-quota seats need a domicile certificate: 10 years' residence as on 31 Dec 2025 with Class 10 and 12 passed in West Bengal, or a parent who is a permanent resident living there for those 10 years."
        source: wb-neet
      - state: karnataka
        text: "Medical, dental and AYUSH seats use your NEET rank, but you must <strong>also register with KEA</strong> for Karnataka's counselling."
        source: kcet-ib
        href: "state/karnataka/kcet.html"
      - state: kerala
        text: "Kerala's KEAM process ranks MBBS / BDS on NEET (UG) and asks for <strong>50% in Physics, Chemistry and Biology</strong> (40% for SC / ST / SEBC / PwD)."
        source: ke-noti
        href: "state/kerala/keam.html"
      - text: "MCC counsels the 15% All India Quota and central, ESIC, central-university and deemed-university seats; every state counsels its own state-quota seats."
        source: neet-ib
    multiverse:
