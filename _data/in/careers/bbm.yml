    parts:
      - overview:
          points:
            - "BBM is a 3-year undergraduate degree covering business administration, management principles, leadership, organisational behaviour and corporate decision-making."
            - "It is offered by <strong>Bangalore University</strong> and its affiliated government colleges, as well as private universities like Christ University and Jain University, making it especially strong in Karnataka's corporate and startup ecosystem."
            - "Structurally and academically, BBM sits alongside BBA and Bachelor of Management Studies (BMS) as a broad, management-focused option — where B.Com goes deep into accounting and taxation, BBM builds analytical, communication and people-management skills aimed at corporate and entrepreneurial roles, with the added advantage of proximity to Bangalore's Information Technology (IT), startup and consulting industries."
