doubts:
  - { q: "Who sponsors a student visa in the UAE?", a: "Either the accredited university you study at, or a parent who is a UAE resident.", source: uae_study }
  - { q: "Can students work part time in the UAE?", a: "Yes, with a MOHRE permit. Registered establishments can train or employ students aged 15 and above under the student training and employment permit.", source: mohre_student }
  - { q: "Can I get a UAE Golden Visa after graduating?", a: "Graduates of a top-100 world university with a GPA of at least 3.5, applying within two years of graduating, can qualify; UAE graduates need 3.5 (Category A) or 3.8 (Category B).", source: icp_golden }
