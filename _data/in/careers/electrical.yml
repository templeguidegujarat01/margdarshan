          - "For Indian Institutes of Technology (IITs) and National Institutes of Technology (NITs) via Joint Entrance Examination (JEE), a minimum of <strong>75% aggregate in Class 12</strong> (65% for SC/ST) is required for counselling eligibility."
          - "<strong>Diploma holders</strong> in Electrical Engineering can join directly in the second year through most states' lateral entry route."
