          - p: "<strong>A government career benchmark:</strong> after the degree, the UPSC Engineering Services Examination recruits engineers to Group A central services; the ESE 2026 notice expected about 474 vacancies."
            source: ese
          - warn: "The IITs, JoSAA and the ESE 2026 notice publish no starting-salary or pay-level figure for B.Tech graduates, so this page gives none. Branch-wise salary ranges are on the career pages below."
          - links:
              - { label: "Computer Science Engineering", url: "cse.html" }
              - { label: "AI Engineering", url: "ai-engineer.html" }
              - { label: "Aerospace Engineering", url: "aerospace.html" }
              - { label: "Electrical Engineering", url: "electrical.html" }
              - { label: "B.Tech college finder", url: "colleges-btech.html" }
