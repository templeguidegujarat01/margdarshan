  # board of accountancy (NASBA directory), board of nursing (NCSBN member page). Links checked 2026-10-22.
  law: { body: "Board of Bar Examiners of the Delaware Supreme Court", url: "https://courts.delaware.gov/bbe/", stat: "State exam", exam: "Delaware's own bar exam with the MBE and MPT.", note: "MPRE required (passing score 85). NextGen UBE from February 2028.", src: ncbe_de }
