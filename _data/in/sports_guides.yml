  # ------------------------------------------------------------------------------------------------ Sports doubts
  - slug: sports-doubts
    short: "Sports doubts answered"
    eyebrow: "Sports Guide · Every doubt, one place"
    title: "Every sports doubt a student has — answered simply"
    lede: "Education Margdarshan collected the questions young players and parents ask most — on forums, in comments and at home — and answered each one only from official rules and government files: starting late, studies, money, getting into a SAI centre, selection and politics, girls in sport, doping, jobs and life after playing."
    meta: "Answers from official files only — questions from real students"
    official:
      - { label: "SAI — centres and selection (PDF)", url: "https://www.sportsauthorityofindia.gov.in/sai/public/assets/pdfs/schemes/NCOE_Brief.pdf" }
      - { label: "NADA India", url: "https://nadaindia.yas.gov.in/" }
    facts:
      - { label: "SAI Training Centre age", value: "<strong>12 to 18</strong> (team games from 10)", source: sai-schemes }
      - { label: "KIRTI talent hunt age", value: "<strong>9 to 18</strong>", source: pib-cwg26 }
      - { label: "Railways sports-quota age", value: "<strong>18 to 25</strong> (on 1 Jan 2027)", source: rrc-wr26 }
      - { label: "Sports for central quota jobs", value: "<strong>65 sports</strong>", source: dopt-2022 }
    sections:
      - id: start
        nav: "Starting &amp; age"
        eyebrow: "Starting out"
        heading: "Age, late start and choosing a sport"
        parts:
          - qa:
              q: "I am 15 (or 16, 17). Is it too late to start?"
              a: "It is late for some free pipelines, not for playing. <strong>SAI Training Centres</strong> take players aged <strong>12 to 18</strong> (team games from 10), and <strong>KIRTI</strong> tests children aged <strong>9 to 18</strong>. After that, you rise through your state association's club and championships. Keep the job clock in mind: Railways sports quota takes <strong>18 to 25</strong>, CRPF <strong>18 to 23</strong> (+5 years for sportspersons)."
            source: "sai-schemes,pib-cwg26,rrc-wr26,crpf26"
          - qa:
              q: "Which sport should I choose?"
              a: "Pick a sport you love, then check three things: where it is played (Olympics, Asian Games, Khelo India — see the A–Z list), whether it is among the <strong>65 sports</strong> for government sports-quota jobs, and whether its medals earn government <strong>cash awards</strong>. A sport that ticks all three gives you more doors."
            source: "dopt-2022,myas-cash"
          - links:
              - { label: "Every sport A–Z", url: "all-sports.html" }
              - { label: "Pick your sport — sports hub", url: "sports-hub.html" }
      - id: sai
        nav: "SAI centres"
        eyebrow: "Free training"
        heading: "Getting into a SAI centre"
        parts:
          - qa:
              q: "How do I get into a SAI Training Centre (STC)?"
              a: "For individual sports you need one of these: up to <strong>8th place</strong> at Sub-Junior or Junior Nationals, up to <strong>6th</strong> at inter-university or SGFI school nationals, <strong>top 3</strong> at your State Championship, or having played for India. Top-3 finishers at district or school-board events can be called for <strong>selection trials</strong>. Then you take a battery of tests — body measurements, fitness, physiological and psychological tests. <strong>There is no direct admission.</strong>"
            source: sai-schemes
          - qa:
              q: "Can I be sent out of a SAI centre?"
              a: "Yes. Players are 'weeded out' for <strong>not keeping their performance level</strong>, an injury that stops training for <strong>more than six months</strong>, or <strong>doping, age fraud or misconduct</strong>. A training diary is kept for every player, and age is checked medically."
            source: sai-schemes
          - qa:
              q: "Is it only for the best — how many seats are there?"
              a: "There are <strong>69 STCs</strong> with <strong>4,366</strong> players (2,664 boys, 1,702 girls), in 27 sports, and NCOEs with a sanctioned strength of <strong>4,819</strong> players. SAI also tries to get its players into nearby schools."
            source: sai-schemes
      - id: studies
        nav: "Studies vs sport"
        eyebrow: "Studies"
        heading: "Studies and sport together"
        parts:
          - qa:
              q: "Do I have to choose between studies and sport?"
              a: "No. The <strong>National Sports Policy 2025</strong> backs a <strong>dual career</strong> — sport joined with education. And you will need marks later: sports-quota jobs ask for <strong>Class 10, Class 12 or a degree</strong>, and sports courses like NSU's B.Sc. Sports Coaching or LNIPE's B.P.Ed. ask for <strong>50% in Class 12</strong>."
            source: "pib-nsp25,rrc-wr26,nsu-elig,lnipe-bped"
          - qa:
              q: "Are new sports schools coming?"
              a: "Yes. The revamped Khelo India scheme (2026-31) adds <strong>Khelo India Feeder Schools</strong> and <strong>Khelo India Utkrishta Vidyalayas</strong> to join sport with regular schooling."
            source: pib-ki-revamp
      - id: money
        nav: "Money"
        eyebrow: "Money"
        heading: "We are not rich. How do we pay?"
        parts:
          - qa:
              q: "Our family cannot spend much. What free help is there?"
              a: "Aim for government seats and schemes: SAI centres give free coaching (the residential NCOEs also give stay and individual diets); a <strong>Khelo India Athlete</strong> gets <strong>₹6.28 lakh a year</strong> (₹1.20 lakh as cash); <strong>TOPS</strong> pays ₹25,000–50,000 a month to top players; the <strong>PDU National Welfare Fund</strong> gives up to <strong>₹2.50 lakh</strong> to players in need."
            source: "sai-schemes,pib-support,pib-cwg26"
          - qa:
              q: "How much does a medal pay?"
              a: "The government cash award for a senior gold is <strong>₹75 lakh</strong> at the Olympics or Paralympics and <strong>₹30 lakh</strong> at the Asian Games or Commonwealth Games (silver and bronze less). Apply within six months."
            source: myas-cash
      - id: selection
        nav: "Selection &amp; politics"
        eyebrow: "Selection"
        heading: "Trials, selection and unfair treatment"
        parts:
          - qa:
              q: "How is the Indian team picked? I hear about politics."
              a: "Each federation publishes rules. In athletics, the national championship was the <strong>only trial</strong> for the 2026 Asian Games; normally <strong>one athlete per event</strong> who meets the standard is picked, and the <strong>selection committee's decision is final</strong>. Read your federation's selection rules early and keep all result proofs."
            source: afi-ag26
          - qa:
              q: "What can I do if I am treated unfairly?"
              a: "The new <strong>National Sports Tribunal</strong> (rules notified in 2026) is a special body for <strong>sports disputes</strong> — faster and cheaper than ordinary courts, with an online portal and virtual hearings."
            source: pib-nsga-rules
          - qa:
              q: "Do certificates from any 'national' event count?"
              a: "No. Railways and CRPF count results only from <strong>federations recognised by the Sports Ministry</strong> (or the IOA's National Games). Check recognition before you pay entry fees."
            source: "rrc-wr26,crpf26"
      - id: girls
        nav: "Girls in sport"
        eyebrow: "Girls in sport"
        heading: "Girls in sport"
        parts:
          - qa:
              q: "Are there real chances for girls?"
              a: "More than ever. Paris 2024 was the first Olympics with <strong>equal places for women and men</strong>, and at LA28 every team sport will have at least as many women's teams as men's. In India, <strong>ASMITA</strong> women's leagues had 83,763 women players by December 2024."
            source: "ioc-paris,ioc-la28,pib-ye24"
          - qa:
              q: "How many girls train at SAI centres?"
              a: "Of the 4,366 players in SAI Training Centres, <strong>1,702 are girls</strong>."
            source: sai-schemes
      - id: doping
        nav: "Doping &amp; supplements"
        eyebrow: "Doping"
        heading: "Supplements, medicines and tests"
        parts:
          - qa:
              q: "My gym trainer says this powder is safe. Is it?"
              a: "<strong>No supplement is 100% safe.</strong> Under <strong>strict liability</strong>, anything found in your sample is your responsibility. Eat food first and talk to a qualified nutritionist."
            source: nada-supp
          - qa:
              q: "I am only 15. Do doping rules apply to me?"
              a: "Yes — the rules apply at <strong>every level</strong>. From <strong>1 January 2027</strong> the new world code gives extra protection to players <strong>under 16</strong>, and makes coaches and parents responsible too."
            source: aiu-code27
      - id: jobs
        nav: "Jobs &amp; after"
        eyebrow: "The future"
        heading: "Jobs and life after playing"
        parts:
          - qa:
              q: "Can I get a government job without an international medal?"
              a: "Yes, at lower levels. For <strong>CRPF Constable (GD)</strong>, playing for your state at <strong>Senior or Junior Nationals</strong> can be enough; for <strong>Railways Level 1</strong>, playing for your state and finishing at least <strong>8th at Senior Nationals</strong>. Medals at the <strong>Khelo India Games</strong> also count now."
            source: "crpf26,rrc-wr26,dopt-2024"
          - qa:
              q: "What happens when my playing career ends?"
              a: "You can become a coach (the SAI coaching diploma gives weight to your playing record), a PE teacher or a sports scientist. The Sports Ministry's <strong>RESET</strong> programme trains retired players for new jobs, and retired champions can get a <strong>pension of ₹12,000–20,000 a month</strong>."
            source: "nsnis-dip,pib-ye24,pib-support"
          - links:
              - { label: "Careers in sports — all paths", url: "sports-careers.html" }
              - { label: "Sports-quota jobs guide", url: "niche-careers/sports.html" }
      - id: odds
        nav: "Real chances"
        eyebrow: "The honest numbers"
        heading: "What are my real chances?"
        parts:
          - qa:
              q: "How many people really reach the top?"
              a: "At Paris 2024, about <strong>10,500</strong> athletes from <strong>206</strong> teams fought for <strong>329</strong> golds, and <strong>115 teams</strong> won no medal at all. India sent <strong>501</strong> players to the 2026 Asian Games. Reaching that level means being among the very best in India in your event — so build a plan B (studies, coaching, sports science) alongside."
            source: "ioc-paris,ioc-la28,pib-ag26fs"
          - links:
              - { label: "Summer Olympics explained", url: "olympic-games.html" }
              - { label: "Asian Games, CWG and Khelo India", url: "multi-sport-games.html" }
              - { label: "Para sports", url: "para-sports.html" }
