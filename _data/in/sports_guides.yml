                - ["Snow", "Gulmarg, Jammu &amp; Kashmir", "23–26 Feb 2026", "Alpine skiing, Nordic skiing, snowboard, ski mountaineering"]
            source: "pib-kiwg26,kiwg26"
          - note: "The Indian Army won the overall title at the Khelo India Winter Games and defended it in 2026."
            source: pib-kiwg26
          - links:
