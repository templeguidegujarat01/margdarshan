      - note: "Official ICSI fees across all levels typically add up to roughly ₹40,000–60,000 — among the lowest of any Indian professional qualification. Most students spend a total of about ₹1–2 lakh once coaching and study material are included. ICSI revised its fee structure in 2026, so check icsi.edu for the current attempt's exact figures. SC/ST, differently-abled and a few other categories are eligible for meaningful fee concessions."
