  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Is homeopathy scientifically proven to work?"
            a: "This is genuinely disputed. Major scientific reviews, including a large 2015 systematic review by Australia's National Health and Medical Research Council, found no reliable evidence that homeopathy is effective for treating any health condition beyond a placebo effect. At the same time, BHMS is a legally recognised, licensed medical qualification in India, regulated by the Central Council of Homeopathy (CCH) under the Ministry of AYUSH, and millions of Indians use homeopathic treatment. Students considering BHMS should be aware of this scientific debate alongside the degree's legal and professional standing."
          - q: "Is NEET compulsory for BHMS?"
            a: "Yes. NEET-UG is mandatory for admission to every BHMS programme in India, government or private, with a qualifying floor of the 50th percentile for General category (40th for SC/ST/OBC) — the same low bar as BAMS."
          - q: "What is a realistic BHMS/homeopathic doctor salary in India?"
            a: "Freshers commonly earn ₹2.5-6.5 LPA, or roughly ₹20,000-55,000 per month, with government positions generally paying more than private roles at entry level — AYUSH Medical Officer posts have been reported starting around ₹44,900 per month plus benefits. Established private practitioners commonly earn ₹5-15+ LPA, with some consultants and entrepreneurial clinic owners earning considerably more."
          - q: "Should I choose BHMS or BAMS?"
            a: "Both are similarly accessible AYUSH medical degrees with comparable NEET cutoffs and fresher salaries. The choice comes down to which system of medicine genuinely interests you — Ayurveda (BAMS) or Homeopathy (BHMS) — since both lead to legally recognised, licensed practice within their respective systems, not one being a stronger or weaker version of the other."
          - q: "Can BHMS doctors work abroad?"
            a: "Some do, particularly in countries where homeopathy has an established regulatory and cultural presence — Germany, and parts of Europe among them — alongside Gulf countries like the UAE where demand for homeopathic practitioners exists. Recognition and licensing requirements vary significantly by country, so BHMS graduates interested in practising abroad should research the specific requirements of their target country carefully."
      - note: "Figures are indicative (2026) — confirm on the official college or authority website."
        class: "table-note mt-lg"
