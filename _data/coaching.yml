# Coaching Finder data — single source for every coaching-*.html finder (rendered by _includes/finder.html).
#
# Editorial rule (see "A note on rankings" on every finder page): only list a
# centre with a genuine, verifiable official website or official centre
# listing. Every URL below was checked to load the provider's own page for
# that city. No star ratings, success rates, AIR counts or student numbers
# unless they come from a disclosed, verifiable source.
#
# exams:   which exam finders the centre appears in (neet, jee, cuet, ca, cs,
#          cma, clat, design, nata, ssc, banking, upsc)
# brand:   key into `brands` below for batch/format info shared by every branch
# area:    localities from the official site
# region:  JSON-LD addressRegion when the city sits outside the finder state
#          (Noida, Gurugram under Delhi NCR)
# extra:   optional per-exam note, e.g. extra.jee
# ownership: optional, Private / Government (state-run academies such as SPIPA, SIAC,
#          AICSCC, SPI, MRSAFPI). Not shown on the card yet; kept for filters.
# featured / sponsored:  monetisation slots. `featured: true` shows a
#          "Featured" badge and sorts the card first; add `sponsored: true`
#          as well for paid placements so the badge reads "Sponsored".
#          Never set these without a real agreement with the provider.

