# Journey Blueprint — Dermatologist (MBBS → NEET-PG → MD / DNB Dermatology, Venereology and Leprosy). Printed on journey-dermatologist.html.
# Rules, classes and the money items / sources several careers share: _data/in/journey_common.yml.
# The MBBS and NEET-PG parts cite the doctor / gynaecologist blueprints' sources. Check: node scripts/check-journey-matrix.mjs
id: dermatologist
v: 2
name: "Dermatologist (MBBS → NEET-PG → MD Dermatology, Venereology and Leprosy)"
search: ["dermatologist", "skin doctor", "skin specialist", "dermatology", "md dermatology", "dvl", "venereology", "trichologist"]
page: "neet-pg.html"
doubts_page: "journey-dermatologist.html"
gate: "Class 12 with Physics, Chemistry, Biology and English → NEET (UG) → MBBS with a 12-month internship → NEET-PG → a 3-year M.D. (Dermatology, Venereology and Leprosy) or its DNB → skin specialist."
gate_source: [neet-ib, crmi, npg26, pgmer23]
core:
  what:
    text: "A dermatologist is a specialist doctor for skin, hair and nail diseases, sexually transmitted infections and leprosy. In India the specialist degree is the M.D. (Dermatology, Venereology and Leprosy), entered through NEET-PG after MBBS."
    source: [npg26, pgmer23]
  day:
    - "See patients with rashes, acne, infections, allergies and hair or nail problems."
    - "Do skin biopsies and small procedures."
    - "Treat leprosy and sexually transmitted infections, and screen for skin cancers."
  pay:
    - { level: "Government doctor after MBBS (UPSC CMS 2026)", value: "Pay Level 10 · ₹56,100 – ₹1,77,500 plus NPA", source: cms }
  pay_note: "We found no 2026 central notice for a dermatology specialist post, so specialist pay is not printed. PG residents get a stipend at par with government medical colleges of that state; private-practice income is not officially published."
  routes:
    - { title: "MBBS → NEET-PG → M.D. (DVL)", text: "NEET-PG is the single entrance for MD, MS and PG Diploma seats in government, private and deemed colleges. A broad-speciality M.D. takes 3 years.", source: [npg26, pgmer23] }
    - { title: "DNB Dermatology", text: "NBEMS's post-MBBS DNB seats are also filled through the NEET-PG rank.", source: npg26 }
    - { title: "INI-CET for AIIMS, JIPMER, PGIMER, NIMHANS", text: "These institutes do not admit through NEET-PG — they hold INI-CET.", source: npg26 }
    - { title: "Diploma D.D.V.L.", text: "NMC still lists a 2-year Diploma in Dermatology, Venereology and Leprosy, but colleges may convert diploma seats to degree seats and no new diploma seats are being allowed.", source: pgmer23 }
  cost_time:
    - { label: "Time after Class 12", value: "MBBS with 12-month internship, then a 3-year M.D.", source: [crmi, pgmer23] }
    - { label: "NEET-PG 2026 fee", value: "₹3,500 General / OBC / EWS · ₹2,500 SC / ST / PwBD", source: npg26 }
    - { label: "NEET (UG) fee (India centre)", value: "₹1,700 General · ₹1,600 EWS / OBC-NCL · ₹1,000 SC / ST / PwBD / third gender", source: neet-ib }
  cost_note: "MBBS and PG tuition fees differ by state and college, so they are not printed here."
  challenges:
    - text: "NEET-PG needs the 50th percentile (General / EWS) just to qualify, and qualifying does not by itself give a seat."
      source: npg26
    - text: "You cannot sit NEET-PG until your 12-month internship ends by the bulletin's cut-off date (30 September 2026 for NEET-PG 2026)."
      source: npg26
    - text: "Diploma seats are being converted to degree seats, so the M.D. is the main road."
      source: pgmer23
  not_for:
    - "You want to skip MBBS — there is no direct route to dermatology after Class 12."
    - "You only want cosmetic work — the M.D. also covers leprosy and sexually transmitted infections."
    - "You want to start earning early — the road is MBBS plus at least 3 more years."
journey:
  - stages: [c8, c9]
    title: "Biology, Chemistry and patience"
    do:
      - text: "NEET (UG) has Physics 45, Chemistry 45 and Biology 90 questions — 180 in all, 720 marks."
        source: neet-ib
    doubts:
      - q: "What does a dermatologist do?"
        a: "A dermatologist treats diseases of the skin, hair and nails, sexually transmitted infections and leprosy. The specialist degree is the M.D. (Dermatology, Venereology and Leprosy) after MBBS."
        next: "Read the Routes list above."
        source: [npg26, pgmer23]
      - q: "How many years does it take to become a dermatologist?"
        a: "MBBS with a compulsory rotating internship of at least 12 months, then a 3-year M.D. in Dermatology, Venereology and Leprosy after clearing NEET-PG."
        next: "Plan for a long road and pace yourself."
        source: [crmi, pgmer23]
  - stages: [c10]
    title: "Choose PCB with English"
    do:
      - text: "NMC allows NEET (UG) only after 10+2 with Physics, Chemistry, Biology / Biotechnology and English."
        source: neet-ib
    stream: "Science with Biology (PCB) and English."
    doubts:
      - q: "Which subjects do I need in Class 11 and 12 to become a dermatologist?"
        a: "Physics, Chemistry, Biology or Biotechnology, and English — the subjects NMC requires for NEET (UG)."
        next: "Take PCB with English in Class 11."
        source: neet-ib
      - q: "Can I become a dermatologist after a B.Sc or a cosmetology course?"
        a: "Not as a specialist doctor. The M.D. in Dermatology, Venereology and Leprosy needs MBBS first, and NEET-PG is the entrance."
        next: "Aim for NEET (UG) and MBBS."
        source: [npg26, pgmer23]
  - stages: [c11, c12]
    title: "NEET (UG) for MBBS"
    do:
      - text: "NEET (UG) is 180 questions for 720 marks in 3 hours, with +4 for a correct answer and −1 for a wrong one."
        source: neet-ib
      - text: "Minimum age is 17 on or before 31 December of the exam year; there is no upper age limit."
        source: neet-ib
    exams:
      - { name: "NEET (UG) 2026", when: "3 May 2026 (re-exam 21 June 2026)", source: [neet-ib, neet-re] }
    money: [neet-fee]
    doubts:
      - q: "Is there an age limit for NEET (UG)?"
        a: "You must be 17 on or before 31 December of the exam year. There is no upper age limit."
        next: "Prepare without worrying about an age cap."
        source: neet-ib
      - q: "What percentile do I need in NEET (UG)?"
        a: "The 50th percentile for General / EWS, the 40th for SC, ST and OBC and the 45th for PwBD (General) to be eligible for admission."
        next: "Aim far above the cut-off — seats go by rank."
        source: neet-ib
      - q: "Is there negative marking in NEET (UG)?"
        a: "Yes. A correct answer gets +4, a wrong one −1 and an unanswered question 0, across 180 questions for 720 marks."
        next: "Skip questions you cannot narrow down."
        source: neet-ib
  - stages: [ug]
    title: "MBBS and internship"
    do:
      - text: "After the final MBBS exam you do a rotating internship of at least 12 months; interns get a stipend fixed by the authority that runs the college."
        source: crmi
      - text: "Your State Medical Council registers you provisionally for the internship."
        source: nmc-reg
    money: [mbbs-intern]
    doubts:
      - q: "When can I write NEET-PG?"
        a: "Only after MBBS with your 12-month internship completed by the bulletin's cut-off — 30 September 2026 for NEET-PG 2026. Applications from candidates finishing later are rejected."
        next: "Track your internship end date against the bulletin."
        source: npg26
      - q: "Is NEET-PG the only way into M.D. Dermatology?"
        a: "For almost all seats, yes — All India Quota, state quota, private and deemed colleges, armed forces institutions and DNB. AIIMS, JIPMER, PGIMER and NIMHANS admit through INI-CET instead."
        next: "Prepare for both NEET-PG and INI-CET to widen your options."
        source: npg26
  - stages: [grad]
    title: "NEET-PG and M.D. (DVL)"
    do:
      - text: "NEET-PG: 180 MCQs in 3 hours 30 minutes, in English, computer-based; +4 correct, −1 wrong. The paper runs in five timed sections you cannot revisit."
        source: npg26
      - text: "Every MD / MS student does a compulsory 3-month District Residency Programme in district hospitals in the 3rd, 4th or 5th semester."
        source: pgmer23
    exams:
      - { name: "NEET-PG 2026", when: "30 Aug 2026 · result by 30 Sep 2026", source: npg26 }
    money: [npg-fee, pg-stipend]
    doubts:
      - q: "What is the NEET-PG cut-off percentile?"
        a: "50th percentile for General / EWS, 45th for UR PwBD and 40th for SC, ST and OBC (including their PwBD) in NEET-PG 2026."
        next: "Remember seats go by rank, not just by qualifying."
        source: npg26
      - q: "Who fills the All India Quota PG seats?"
        a: "The Medical Counselling Committee (MCC, DGHS) fills the 50% All India Quota, all deemed and central university seats and all-India open DNB seats. State quota seats go through each state's counselling authority under its own rules."
        next: "Register for both MCC and your state's counselling."
        source: npg26
      - q: "Is the dermatology diploma (D.D.V.L.) still a good option?"
        a: "NMC still lists the 2-year D.D.V.L., but colleges may apply to convert diploma seats to degree seats and no new diploma seats are being allowed. The 3-year M.D. is the main route."
        next: "Fill M.D. choices first in counselling."
        source: pgmer23
      - q: "Do PG residents in dermatology get paid?"
        a: "Yes. NMC's PG regulations say every PG student gets a stipend at par with PG students of government medical colleges in that state, including during the District Residency."
        next: "Ask your college for the current rate."
        source: pgmer23
  - stages: [work]
    title: "After M.D.: practice or teach"
    do:
      - text: "The M.D. (Dermatology, Venereology and Leprosy) is a recognised post-graduate qualification in NMC's list; extra one-year certificate courses and two-year fellowships are optional."
        source: pgmer23
    doubts:
      - q: "Can I work as a government doctor before specialising?"
        a: "Yes. UPSC's Combined Medical Services exam recruits MBBS doctors into central services at Pay Level 10 (₹56,100 – ₹1,77,500) plus non-practising allowance."
        next: "Read the UPSC CMS guide."
        source: cms
      - q: "Is a fellowship after M.D. Dermatology needed?"
        a: "Not to practise. NMC lists one-year Post-Doctoral Certificate Courses and two-year Post-Doctoral Fellowships for extra training, but the M.D. is the specialist qualification."
        next: "Decide after a few years of practice."
        source: pgmer23
board_note: "Any board. NMC needs Physics, Chemistry, Biology / Biotechnology and English in Class 12 for NEET (UG)."
board_source: neet-ib
