  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What is Actuarial Science?"
    parts:
      - overview:
          points:
            - "An actuary uses mathematics, statistics and financial theory to assess and price risk — mainly in life insurance, general insurance, health insurance and pensions."
            - "The profession is regulated in India by the <strong>IAI</strong>, a statutory body established under the Actuaries Act, 2006, making it the only body legally recognised to certify actuaries in India."
            - "It's a demanding, exam-heavy path — 13 subjects stand between a fresh candidate and full Fellowship — but the payoff is real: <strong>IRDAI (India's insurance regulator) legally requires every registered insurer to employ a Fellow Actuary</strong> for the critical \"Appointed Actuary\" role, which keeps qualified actuaries in persistent short supply relative to demand."
  - id: "who"
    hid: "who-heading"
    alt: true
    eyebrow: "Fit check"
    heading: "Who should choose Actuarial Science — and who should think twice"
    parts:
      - fit:
          match:
            - "Are genuinely strong at maths and statistics — this is non-negotiable, not a nice-to-have."
            - "Can sustain years of disciplined self-study while working, without a fixed classroom structure."
            - "Want one of the highest ceiling salaries in Indian finance, and are willing to trade years of exams for it."
          mismatch:
            - "Dislike sustained, heavily mathematical study — this is one of the most quantitative courses in Science."
            - "Want a fast qualification — 13 subjects with no fixed deadline genuinely takes most people the better part of a decade."
            - "Want broad general finance exposure — actuarial work is narrower and more specialised than Chartered Financial Analyst (CFA) or a Master of Business Administration (MBA)."
