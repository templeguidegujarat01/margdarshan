            a: "Yes, in many states Plumber is one of the trades accepting Class 8 pass students, alongside Class 10 pass entry at other institutes. Exact eligibility varies by state, so confirm with your target institute."
          - q: "How long is the ITI Plumber course?"
            a: "Plumber is typically a 1-year NCVT-affiliated trade, combining pipefitting theory and substantial hands-on installation and repair practice for water supply and drainage systems."
          - q: "Is plumbing a good trade for self-employment?"
            a: "Yes, genuinely so. Plumbing is one of the most reliably self-employable ITI trades since demand is constant, hyper-local, and not easily outsourced or automated — many plumbers build independent businesses relatively quickly after gaining practical experience."
          - q: "What jobs can I get after ITI Plumber?"
            a: "Common roles include Plumber/Pipefitting Technician at construction companies and real estate developers, maintenance plumber roles at hotels/hospitals/facilities, and various municipal water supply department technical posts via relevant recruitment exams."
          - q: "Does this trade cover modern plumbing systems like RO/water purifiers?"
            a: "The base trade covers core water supply and drainage systems. Water purifier/RO system installation and repair is often a separate, additional skill that many plumbers pick up through further short courses or on-the-job training, given growing household demand for these systems."
