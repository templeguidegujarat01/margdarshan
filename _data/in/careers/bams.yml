  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Can BAMS doctors practice modern medicine?"
            a: "Not fully. BAMS does not grant full allopathic (modern medicine) practice rights in India. Some states permit limited prescribing of certain allopathic medicines in specific rural Primary Health Centre contexts, but this is not equivalent to an MBBS doctor's scope of practice. BAMS graduates practise as licensed Ayurvedic doctors within the Ayurveda system."
          - q: "Is BAMS a good career or just a backup for MBBS?"
            a: "It's a genuine primary career choice for students actually interested in Ayurveda, not merely a fallback. Real regulatory reforms — including 58 authorised surgical procedures now permitted for MS Ayurveda graduates — combined with a strong government AYUSH job push and a booming global wellness market have transformed BAMS's standing considerably. It remains a poor choice, though, if you're only picking it because the NEET cutoff is lower, without genuine interest in Ayurvedic medicine."
          - q: "What is a realistic BAMS/Ayurvedic doctor salary in India?"
            a: "Freshers working at private Ayurveda hospitals or wellness centres commonly earn ₹3-5 LPA, or roughly ₹25,000-40,000 per month. MD Ayurveda specialists employed in hospitals commonly earn ₹8-15 LPA, with meaningfully higher and more variable income reported for established private practice, reputed Panchakarma centres, and international wellness consulting."
          - q: "Is a BAMS degree recognised internationally?"
            a: "It varies significantly by country. Ayurveda itself is gaining global popularity as a wellness practice, and BAMS graduates do find opportunities at wellness resorts and consulting internationally, but most countries require additional certification or licensing exams for clinical recognition — a BAMS degree from India isn't automatically equivalent to a medical licence abroad."
          - q: "Should I do MD Ayurveda after BAMS?"
            a: "It's a strong option for increasing both your scope of practice and earning potential. MD/MS Ayurveda specialisations — Kayachikitsa (Internal Medicine), Shalya Tantra (Surgery), Prasuti Tantra (Obstetrics & Gynaecology), Shalakya Tantra (ENT/Ophthalmology) and Panchakarma among them — are accessed via NEET-PG for AYUSH courses and typically take 3 more years, with specialists commonly earning ₹8-15 LPA in hospital roles and more in private practice."
      - note: "Figures are indicative (2026) — confirm on the official college or authority website."
        class: "table-note mt-lg"
