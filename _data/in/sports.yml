                - ["Kolkata", "Archery, athletics, gymnastics, table tennis"]
                - ["M.D.C.N.S., Delhi", "Hockey only"]
            source: sai-schemes
          - p: "The senior <strong>national camps</strong> run mainly at the <strong>SAI Centre, Bengaluru</strong> — Hockey India's 2025-26 pathway to the Asian Games put almost every men's and women's preparatory camp there, plus Pro League matches in Bhubaneswar."
            source: hi-selection
          - note: "Lucknow and Bhopal are development NCOEs for scouted juniors; the national team itself camps at SAI Bengaluru."
            source: "sai-schemes,hi-selection"
