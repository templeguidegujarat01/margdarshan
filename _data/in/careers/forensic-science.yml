  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Is forensic science as glamorous as TV shows make it look?"
            a: "Not really — this is genuinely worth understanding before enrolling. Real forensic work is far more methodical and less dramatic than crime shows suggest: careful evidence documentation, routine lab analysis, detailed report writing, and preparing for court testimony, often within backlogged government labs. It's described as looking dramatic from the outside but disciplined on the inside — meaningful, scientifically rigorous work, but rarely as fast-paced or conclusive as television depicts."
          - q: "What is a realistic Forensic Science salary in India?"
            a: "Freshers with a BSc commonly earn ₹3-4.5 LPA. Those with an MSc or specific specialisation commonly start higher, around ₹4.5-9.5 LPA. With 5+ years of experience, salaries commonly reach ₹6-12 LPA. Private labs, legal consulting firms and cybercrime units are reported to pay 20-40% more than government roles, but with fewer openings and less job stability than government positions."
          - q: "Is digital forensics genuinely a better career path than traditional forensic science?"
            a: "It's reported as the field's fastest-growing and highest-paying niche, driven by a real, measurable trend — India's digital forensics market is projected to grow at roughly 40% annually, reaching an estimated ₹11,829 crore by FY 2029-30, more than three times the global average growth rate. Digital forensics salaries are reported to range from ₹3.5-35 LPA depending on experience and employer, a considerably wider ceiling than traditional lab-based forensic roles."
          - q: "What is the difference between Forensic Science and Criminology?"
            a: "Forensic Science applies scientific methods — biology, chemistry, physics — to analyse physical evidence from crime scenes. Criminology studies criminal behaviour, social patterns and the justice system, and is described as closer to sociology than science. Both feed into criminal justice, but the day-to-day work and required skill sets are genuinely different."
          - q: "Is NEET required for Forensic Science?"
            a: "No. Admission is via CUET-UG (National Forensic Sciences University (NFSU) and central universities), university-specific entrance exams, state-level admissions, or direct Class 12 merit — NEET is not required."
      - note: "Figures are indicative (2026) — confirm on the official college or authority website."
        class: "table-note mt-lg"
