  - id: "fees"
    hid: "fees-heading"
    eyebrow: "A genuinely large investment"
    heading: "Fees & scholarships"
    parts:
      - prose:
          - "This is one of the most expensive undergraduate-entry programmes in India. Total fees for the full 5-year IPM at IIM Indore are commonly reported around <strong>₹38-45 lakh</strong> for domestic students, with IIM Rohtak, IIM Ranchi and IIM Shillong in a broadly similar ₹35-40 lakh range — covering tuition, residential accommodation, and related institute charges, with the final two years billed at the institute's prevailing MBA/PGP fee. Private university integrated MBA-style programmes are generally less expensive, though total costs still commonly run into several lakh rupees. Need-based financial assistance and merit scholarships are available at some IIMs for eligible students — always check the specific institute's current fee structure and financial aid options before applying."
