# Journey Blueprint — Petroleum Engineer (JEE → B.Tech Petroleum → ONGC E1 through CBT). Printed on journey-petroleum-engineer.html.
# Rules, classes and the money items / sources several careers share: _data/in/journey_common.yml.
id: petroleum-engineer
v: 2
name: "Petroleum Engineer (JEE → B.Tech Petroleum → ONGC E1 officer)"
search: ["petroleum engineer", "petroleum engineering", "oil and gas engineer", "drilling engineer", "production engineer ongc", "ongc engineer", "reservoir engineer"]
search_not: ["petrochemical"]
page: "journey-petroleum-engineer.html"
doubts_page: "journey-petroleum-engineer.html"
gate: "Class 12 with Physics, Chemistry and Maths → JEE (Main) / JEE (Advanced) and JoSAA counselling for B.E. / B.Tech → a degree in Petroleum (or Applied Petroleum) Engineering with 60% → ONGC's computer-based test, interview and medical for E1-level engineers. Mechanical, Chemical and Instrumentation graduates can also join ONGC as engineers."
gate_source: [jm-ib, josaa-br, ongc-gt26]
core:
  what:
    text: "Petroleum engineers plan and run the drilling and production of oil and gas wells. ONGC, which says it produces over 73% of India's oil and 57% of its gas, recruits E1-level engineers in Petroleum, Mechanical, Chemical and Instrumentation streams."
    source: ongc-gt26
  day:
    - "Plan and supervise drilling of oil and gas wells."
    - "Keep wells producing and solve problems in production."
    - "Work at onshore fields and offshore rigs, often in shifts."
  pay:
    - { level: "E1 engineer, ONGC — Advt 2/2026", value: "Basic ₹60,000 – ₹1,80,000 + 35% allowances, DA, HRA and more (ONGC states about ₹26 lakh CTC)", source: ongc-gt26 }
  pay_note: "Private oil-company pay is not officially published."
  routes:
    - { title: "JEE → B.E. / B.Tech", text: "JEE (Main), run by NTA, and JoSAA counselling fill B.E. / B.Tech seats at NITs, IIITs and other institutes; JEE (Advanced) is for the IITs.", source: [jm-ib, josaa-br] }
    - { title: "ONGC E1 through CBT (Petroleum)", text: "Advt 2/2026: 9 Petroleum Engineering posts for a graduate degree in Petroleum Engineering with 60%; Applied Petroleum Engineering graduates are considered for 7 of the 9.", source: ongc-gt26 }
    - { title: "Other branches into ONGC", text: "The same 2026 advertisement had 27 Mechanical, 10 Chemical and 2 Instrumentation engineer posts, each needing the degree with 60%.", source: ongc-gt26 }
  cost_time:
    - { label: "ONGC registration fee", value: "₹1,000 General / OBC / EWS · no charge for SC / ST / PwBD", source: ongc-gt26 }
    - { label: "ONGC 2026 cycle", value: "Apply 17 – 31 Jul 2026 · CBT 6 Sep 2026 (tentative)", source: ongc-gt26 }
  cost_note: "B.Tech fees differ by institute, so none are printed."
  challenges:
    - text: "Very few posts per stream: ONGC's 2026 advertisement had 52 posts in all, 9 for Petroleum Engineering."
      source: ongc-gt26
    - text: "Strict age limit — 26 for UR / EWS engineers (29 OBC-NCL, 31 SC / ST) on the last application date."
      source: ongc-gt26
    - text: "You need 60% in your degree, and you must have it by the last date of application."
      source: ongc-gt26
  not_for:
    - "You want a desk job in a big city — oil fields and rigs are remote."
    - "You dislike physics, maths and machines."
    - "You cannot work shifts or long stretches away from home."
journey:
  - stages: [c8, c9]
    title: "Physics, Chemistry, Maths"
    do:
      - text: "ONGC's CBT has a 40-question domain section in Petroleum, Mechanical, Chemical, Instrumentation or Geology, plus aptitude, general awareness and English."
        source: ongc-gt26
    doubts:
      - q: "What does a petroleum engineer do?"
        a: "Plans and runs the drilling and production of oil and gas wells. ONGC hires E1-level engineers in Petroleum, Mechanical, Chemical and Instrumentation streams for this work."
        next: "Keep Physics, Chemistry and Maths strong."
        source: ongc-gt26
      - q: "How big is ONGC?"
        a: "ONGC describes itself as India's Maharatna energy company, with around 22,600 professionals, a presence in 18 countries and over 73% of the nation's oil and 57% of its gas production."
        next: "Read the ONGC careers page to see the kinds of jobs."
        source: ongc-gt26
  - stages: [c10]
    title: "Choose PCM"
    do:
      - text: "JEE (Main) Paper 1 for B.E. / B.Tech needs Physics, Chemistry and Mathematics in Class 12."
        source: jm-ib
    stream: "Science with Physics, Chemistry and Mathematics."
    doubts:
      - q: "Which stream do I need for petroleum engineering?"
        a: "Science with Physics, Chemistry and Mathematics, because B.E. / B.Tech admission through JEE (Main) needs those subjects."
        next: "Pick PCM after Class 10."
        source: jm-ib
  - stages: [c11, c12]
    title: "JEE (Main), JEE (Advanced), JoSAA"
    do:
      - text: "JEE (Main) is NTA's entrance for B.E. / B.Tech; JoSAA allots IIT, NIT, IIIT and other seats."
        source: [jm-ib, josaa-br]
    doubts:
      - q: "Which exam do I write for B.Tech Petroleum Engineering?"
        a: "JEE (Main) for NITs, IIITs and other participating institutes, and JEE (Advanced) for the IITs; JoSAA then allots seats by rank."
        next: "Register for JEE (Main) in Class 12."
        source: [jm-ib, josaa-br]
      - q: "Can I join ONGC with Mechanical or Chemical engineering?"
        a: "Yes. ONGC's 2026 advertisement had 27 Mechanical, 10 Chemical and 2 Instrumentation posts, alongside 9 for Petroleum Engineering."
        next: "If you miss a petroleum seat, Mechanical or Chemical also lead to ONGC."
        source: ongc-gt26
  - stages: [ug]
    title: "Keep 60% in your degree"
    do:
      - text: "ONGC asks for a graduate degree in the stream with at least 60% marks."
        source: ongc-gt26
    doubts:
      - q: "What percentage do I need in B.Tech for ONGC?"
        a: "At least 60% in your degree, calculated as per your university's rules; if your university uses CGPA, you need its conversion certificate."
        next: "Keep your CGPA safely above the 60% line."
        source: ongc-gt26
      - q: "Can final-year B.Tech students apply to ONGC?"
        a: "No. ONGC's 2026 advertisement considered only candidates who had the qualification on or before the last date of application."
        next: "Apply in the first ONGC cycle after your result."
        source: ongc-gt26
      - q: "Is Applied Petroleum Engineering accepted?"
        a: "Yes, but for 7 of the 9 Petroleum posts in 2026 (UR 3, OBC 2, SC 1, EWS 1). Petroleum Engineering graduates were considered for all 9."
        next: "Check which degree name your college awards."
        source: ongc-gt26
  - stages: [grad]
    title: "ONGC's CBT, interview and medical"
    do:
      - text: "Selection: CBT (85 marks weight) and interview (15), then medical fitness. No negative marking in the CBT."
        source: ongc-gt26
    exams:
      - { name: "ONGC E1 recruitment, Advt 2/2026", when: "Applications 17 – 31 Jul 2026 · CBT 6 Sep 2026 (tentative)", source: ongc-gt26 }
    money: [ongc-fee]
    doubts:
      - q: "Does ONGC still recruit through GATE?"
        a: "Not in 2026. Advt 2/2026 recruits Geologists and Engineers at E1 level through ONGC's own Computer Based Test."
        next: "Prepare for ONGC's CBT pattern."
        source: ongc-gt26
      - q: "What is in ONGC's CBT?"
        a: "85 multiple-choice questions in 2 hours: 40 in your domain, 10 general awareness, 25 aptitude and 10 English. There is no negative marking."
        next: "Revise your core subjects and practise aptitude."
        source: ongc-gt26
      - q: "What score do I need to qualify ONGC's CBT?"
        a: "45% for General, EWS and OBC, 40% for SC, ST and PwBD. You must also score 60% in the interview (9 of 15) — 40% (6 of 15) for SC / ST / PwBD."
        next: "Aim well above the cut-off — shortlisting is 1:5 for interview."
        source: ongc-gt26
      - q: "What is the age limit for ONGC engineers?"
        a: "26 for UR / EWS, 29 for OBC (NCL), 31 for SC / ST on the last date of application; PwBD get more (36 General / EWS, 39 OBC)."
        next: "Apply in the first cycles after graduating."
        source: ongc-gt26
      - q: "How much does an ONGC E1 engineer earn?"
        a: "Basic pay ₹60,000 to ₹1,80,000 with 3% annual increments, plus allowances at 35% of basic, DA, HRA or company housing and other benefits. ONGC states a package of about ₹26 lakh CTC."
        next: "Read the pay section of each advertisement."
        source: ongc-gt26
      - q: "Is there an application fee for ONGC?"
        a: "₹1,000 for General, OBC and EWS candidates (plus bank charges and GST); SC, ST and PwBD candidates pay nothing. The fee is not refundable."
        next: "Pay online before the closing date."
        source: ongc-gt26
  - stages: [work]
    title: "Offshore and onshore careers"
    do:
      - text: "ONGC's E1 package includes CPF, gratuity, a post-retirement benefit scheme and medical facilities for the family."
        source: ongc-gt26
    doubts:
      - q: "I work in a private company. Can I still join ONGC?"
        a: "Yes, if you are within the age limit on the last application date and have the 60% degree in a listed stream."
        next: "Check the age limit in each new advertisement."
        source: ongc-gt26
board_note: "Any board. JEE (Main) Paper 1 needs Physics, Chemistry and Mathematics in Class 12."
board_source: jm-ib
