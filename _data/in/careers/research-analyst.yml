sections:
  - id: "quick"
    hid: "quick-heading"
    alt: true
    eyebrow: "Quick answers"
    heading: "Research Analyst at a glance"
    intro: "Check whether your Class 12 background qualifies. Duration and pay are in the summary at the top of the page."
    parts:
      - subhead: "Can I apply from my stream?"
      - streams:
          - label: "Science"
            fit: "Eligible"
            tone: "y"
            icon: "science"
          - label: "Commerce"
            fit: "Eligible"
            tone: "y"
            icon: "commerce"
          - label: "Arts / Humanities"
            fit: "Eligible"
            tone: "y"
            icon: "arts"
      - note: "Any stream; strong accounting, maths and writing skills matter most."
  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What does a Research Analyst do?"
    parts:
      - overview:
          points:
            - "Research analysts study companies and sectors, build financial models, meet managements and publish reports with ratings and target prices."
            - "They work on the sell side (brokerages) or buy side (mutual funds, insurers, PMS), or independently with their own SEBI registration."
            - "SEBI rules govern conflicts of interest, disclosures and record-keeping for every report."
  - id: "who"
    hid: "who-heading"
    alt: true
    eyebrow: "Fit check"
    heading: "Who should become a Research Analyst"
    parts:
      - fit:
          match:
            - "Love reading annual reports and building spreadsheets."
            - "Write clearly and defend a view with data."
            - "Want a finance career rooted in analysis."
          mismatch:
            - "Dislike long hours around results season."
            - "Want guaranteed predictions — markets are uncertain."
            - "Prefer people-facing sales roles."
  - id: "eligibility"
    hid: "elig-heading"
    eyebrow: "Eligibility"
    heading: "What you need, stage by stage"
    parts:
      - elig_list:
          - "A <strong>graduate degree</strong> in any discipline (SEBI's December 2024 amendments relaxed the earlier requirements)."
          - "Pass <strong>NISM Series XV: Research Analyst</strong> certification."
          - "For independent practice: SEBI registration, deposit and compliance conditions."
          - "Employees publishing research must also hold the certification as SEBI requires."
  - id: "roadmap"
    hid: "roadmap-heading"
    alt: true
    eyebrow: "Step-by-step"
    heading: "Your full path to becoming a Research Analyst"
    parts:
      - steps:
          - title: "Graduate"
            text: "Commerce, economics, engineering or finance."
          - title: "NISM Series XV"
            text: "Research Analyst certification."
          - title: "Learn modelling and valuation"
            text: "Accounting, financial modelling and sector knowledge."
          - title: "Join a research team"
            text: "Associate analyst at a brokerage, fund or research firm."
          - title: "Grow or go independent"
            text: "Senior analyst, sector head, or your own SEBI registration."
      - roadmap_card: "Research Analyst"
  - id: "exams"
    hid: "exams-heading"
    eyebrow: "Exams & licences"
    heading: "Certification and registration"
    parts:
      - chips:
          - label: "NISM Series XV"
            text: "Research Analyst certification required by SEBI."
            source: "nism"
          - label: "SEBI registration"
            text: "Under the SEBI (Research Analysts) Regulations, 2014, as amended."
            source: "sebi"
          - label: "Optional credentials"
            text: "CFA, FRM or an MBA in finance help in hiring but do not replace NISM/SEBI requirements."
  - id: "salary"
    hid: "salary-heading"
    alt: true
    eyebrow: "Indicative figures"
    heading: "Research Analyst pay in India"
    intro: "Pay varies a lot by employer, city and whether you practise independently; these are broad, commonly reported ranges, not guarantees."
    parts:
      - salary:
          - label: "Associate analyst"
            value: "Entry level"
            text: "Brokerages and research firms hire graduates and MBAs."
          - label: "Analyst"
            value: "Rises with coverage"
            text: "Owning a sector raises pay."
          - label: "Senior / head of research"
            value: "High"
            text: "Top analysts in large institutions earn very well."
  - id: "jobs"
    hid: "jobs-heading"
    eyebrow: "Where they work"
    heading: "Employers & growth path"
    parts:
      - chips:
          - label: "Employers"
            text: "Stock brokers, mutual funds, insurers, PMS and AIFs, independent research houses, credit-rating agencies"
          - label: "Growth path"
            text: "Associate → Analyst → Senior Analyst → Head of Research / Fund Manager"
          - label: "Related"
            text: "Investment Advisers give personal advice under a different SEBI registration"
  - id: "proscons"
    hid: "pc-heading"
    alt: true
    eyebrow: "Honest take"
    heading: "Advantages and disadvantages"
    parts:
      - proscons:
          pros:
            - "Entry with a graduate degree and one NISM exam."
            - "Intellectually rich, market-facing work."
            - "Paths into fund management."
          cons:
            - "Long hours, especially in results season."
            - "Competitive hiring at top firms."
            - "Strict conflict-of-interest rules."
  - hid: "related-heading"
    alt: true
    eyebrow: "Related careers"
    heading: "If you're considering Research Analyst, also look at"
    parts:
      - related:
          - name: "Investment Adviser"
            sub: "SEBI RIA"
            href: "investment-adviser.html"
          - name: "CFA"
            sub: "Investment analysis credential"
            href: "cfa.html"
          - name: "FRM"
            sub: "Risk management"
            href: "frm.html"
          - name: "Data Science"
            sub: "Quant & analytics skills"
            href: "datascience.html"
  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Do I need SEBI registration to work as an equity research analyst in a brokerage?"
            a: "The firm holds the registration; as an employee you need the NISM Series XV certification and must follow its policies."
          - q: "Can a B.Tech graduate become a research analyst?"
            a: "Yes. Any graduate can, with NISM Series XV; engineers often cover tech and industrial sectors."
          - q: "Is CFA compulsory?"
            a: "No, but it is widely respected in research hiring."
      - note: "*Pay figures are indicative unless they quote an official pay level, and rules change: confirm eligibility, dates and fees on the official websites listed under Sources before you act."
        class: "table-note mt-lg"
