  # ------------------------------------------------------------------------------------------------ Kho-Kho
  - slug: kho-kho
    short: "Kho-Kho"
    domain: ball
    checked: 2026-10-17
    body: "Kho Kho Federation of India (KKFI) · International Kho Kho Federation"
    card: "India's chase game — how a 'kho' is given, chasers, attackers and runners, the 2025 World Cup double, KKFI nationals, Khelo India, SAI centres and Railways posts."
    card_facts: ["World Cup 2025: India won both", "Touch + say 'Kho'", "In Khelo India &amp; job quota"]
    eyebrow: "Sports Cockpit · Ball &amp; Team Games · Indian sport · KKFI recognised 2026"
    title: "Kho-Kho — the rules of the chase, the World Cup &amp; the jobs"
    lede: "Education Margdarshan's kho-kho map in simple words: how the game is played, what a 'kho' is and the fouls around it, India's double win at the first Kho Kho World Cup, the national championships and Khelo India, the SAI centres, who pays, and the Railways and central sports-quota jobs open to kho-kho players."
    official:
      - { label: "khokhofederation.in", url: "https://khokhofederation.in/" }
      - { label: "KKFI recognition 2026 (MYAS, PDF)", url: "https://khokhofederation.in/wp-content/uploads/2026/05/Annual-Recognition-of-Kho-Kho-Federation-of-India-for-2026_0001.pdf" }
    facts:
      - { label: "Kho Kho World Cup 2025", value: "<strong>India won both</strong> — men 54–36, women 78–40 v Nepal", source: air-wc25 }
      - { label: "Federation status", value: "<strong>KKFI recognised</strong> by MYAS to 31 Dec 2026", source: myas-kkfi26 }
      - { label: "Khelo India Youth Games", value: "<strong>Yes</strong> — one of 27 sports", source: kiyg25 }
      - { label: "Railways 2026-27", value: "<strong>Level 1</strong> posts, men and women", source: rrc-wr26 }
    sections:
      - id: rules
        nav: "Rules of the chase"
        eyebrow: "Core rules &amp; selection formats"
        heading: "How kho-kho is played — chasers, runners and the 'kho'"
        parts:
          - p: "Kho-kho is India's 'game of chase'. One team <strong>chases</strong>, the other <strong>runs</strong>. The chasing team's players sit in a line of squares along the <strong>central lane</strong> between two wooden <strong>posts</strong>; one of them, the <strong>attacker</strong>, chases the <strong>defenders</strong> (the runners who are on the field) and tries to touch them out. Then the teams swap."
            source: cec-kho
          - list:
              - "<strong>Giving a kho</strong>: the attacker passes the chase by touching a sitting chaser <strong>from behind with the hand</strong> and saying <strong>'Kho'</strong> loudly. Saying 'Kho' <strong>before</strong> the touch is a foul; touch and word together are fine."
              - "Saying any word other than 'Kho', or a sitting chaser saying it, is a foul. An attacker may not lean or rest on a chaser to reach a defender."
              - "<strong>Taking a direction</strong>: once the attacker runs towards one post, they may not turn back over ground they have already covered (receding is a foul). They can change direction only in the <strong>free zone</strong> beyond a post — for example by going round the post."
              - "A defender who steps <strong>out of the field</strong> is out. Runners enter the field from a marked <strong>entry zone</strong> beside the scorer's table."
            source: cec-kho
          - list:
              - "In top matches each team chases and defends in <strong>turns</strong> (a match has four turns). A <strong>'Dream Run'</strong> is a long spell in which the chasers cannot get defenders out — at the 2025 World Cup an Indian women's Dream Run lasted <strong>more than five minutes</strong>."
            source: air-wc25-sf
      - id: recognition
        nav: "Recognition"
        eyebrow: "Institutional &amp; global recognition"
        heading: "World Cup champions — and the push for the Asian Games"
        parts:
          - list:
              - "At the <strong>first Kho Kho World Cup</strong> (New Delhi, 2025) India won <strong>both titles</strong>, beating Nepal 78–40 (women) and 54–36 (men). Both Indian teams were unbeaten."
              - "The Sports Ministry has said it wants kho-kho in the <strong>Asian Games</strong> and later the <strong>Olympics</strong>. It was <strong>not</strong> on the 2026 Asian Games programme; KKFI has named the 2030 Asian Games as its target."
            source: "air-wc25,air-wc25-sf,air-minister,ag26,air-kkfi"
          - table:
              caption: "Government cash award for a senior kho-kho medal (₹ lakh)"
              head: ["Event", "Gold", "Silver", "Bronze"]
              rows:
                - ["World Kho Kho Championship (every 2 years)", "20", "14", "8"]
                - ["Asian Kho Kho Championship (every 2 years)", "7.5", "5", "2.5"]
            source: myas-cash
          - p: "On 14 May 2026 the Sports Ministry renewed the <strong>annual recognition of KKFI for 2026</strong> (to 31 December 2026), subject to the outcome of court cases."
            source: myas-kkfi26
      - id: eligibility
        nav: "Eligibility &amp; age"
        eyebrow: "Physical benchmarks &amp; anti-doping"
        heading: "Age papers and anti-doping"
        parts:
          - list:
              - "For sub-junior and junior nationals, each player's <strong>eligibility certificate</strong> must be signed by the head of the school or college with the date and place of birth, admission number, class, attendance and a <strong>sealed photograph</strong>, and countersigned by the state association."
            source: kkfi-elig
          - list:
              - "Under the anti-doping code you must be <strong>available for testing</strong> and check every medicine against the <strong>Prohibited List</strong>; apply to NADA for a <strong>TUE</strong> if you need a banned medicine."
            source: nada-rr
      - id: roadmap
        nav: "Roadmap"
        eyebrow: "Grassroots-to-elite residential pipeline"
        heading: "From the school ground to the India team"
        parts:
          - table:
              caption: "The kho-kho ladder"
              head: ["Step", "Age", "What happens"]
              rows:
                - ["1. School &amp; district", "From childhood", "Play for your school and district; state associations hold sub-junior and junior state championships"]
                - ["2. Sub-junior &amp; junior nationals", "School and college age", "KKFI's national championships — e.g. the 44th Junior Nationals in Bengaluru drew about 1,000 players"]
                - ["3. Khelo India Youth Games", "Under 18", "Kho-kho is one of the 27 KIYG sports; KKFI runs a scholarship form for players of KIYG semi-finalist teams"]
                - ["4. SAI Training Centre / NCOE", "12–18 (STC)", "STCs teach kho-kho; NCOEs at Dharamshala (girls) and Gandhinagar"]
                - ["5. Senior nationals", "Senior", "Senior National championships feed the India squad"]
                - ["6. India team", "Senior", "World Cup and Asian championships"]
            source: "air-jr,kiyg25,kkfi-schol,sai-schemes,air-wc25"
      - id: academies
        nav: "Centres"
        eyebrow: "Top elite academies &amp; cities"
        heading: "Where kho-kho players train"
        parts:
          - table:
              caption: "SAI National Centres of Excellence with kho-kho"
              head: ["Centre", "Other sports there"]
              rows:
                - ["<strong>Dharamshala</strong>, Himachal Pradesh (girls only)", "Athletics, kabaddi, volleyball"]
                - ["<strong>Gandhinagar</strong>, Gujarat", "Handball, kabaddi, athletics, powerlifting, swimming, table tennis (para)"]
            source: sai-schemes
          - note: "Kho-kho is also taught at SAI Training Centres (ages 12–18) and in SAI's school and college extension centres."
            source: sai-schemes
      - id: costs
        nav: "Cost"
        eyebrow: "Equipment costs &amp; who pays"
        heading: "A low-cost sport — and who pays the rest"
        parts:
          - list:
              - "Kho-kho needs only a marked ground, two wooden posts and sports clothing and shoes, so the kit needed to start is small; at higher levels the costs are travel and camps. Education Margdarshan does not print shop prices — no governing body publishes them."
            source: cec-kho
          - table:
              caption: "Who pays — kho-kho ladder"
              head: ["Stage", "Paid by", "What you get"]
              rows:
                - ["SAI centre trainee", "Sports Authority of India", "Coaching, boarding, sports science, diet"]
                - ["Khelo India athlete", "Ministry of Youth Affairs &amp; Sports", "<strong>₹6.28 lakh a year</strong> incl. ₹1.20 lakh cash"]
                - ["KIYG semi-finalist team player", "KKFI scholarship (apply through your state association)", "Scholarship payment to your bank account"]
                - ["Athlete in hardship", "PDU National Welfare Fund", "Up to ₹2.50 lakh"]
            source: "sai-schemes,pib-support,kkfi-schol"
      - id: earnings
        nav: "Earnings &amp; jobs"
        eyebrow: "Earning channels &amp; central job quotas"
        heading: "Railways and central sports-quota jobs"
        parts:
          - list:
              - "<strong>Western Railway's 2026-27 sports quota</strong> had <strong>Level 1 kho-kho posts</strong> (all-rounders) for both men and women, and Railways list a <strong>Junior National Kho-Kho Championship</strong> for each as the recognised junior national."
            source: rrc-wr26
          - list:
              - "Kho-kho is one of the <strong>65 sports</strong> in the central sports quota for <strong>Group C</strong> posts, with up to 5 years' age relaxation (10 for SC/ST)."
            source: dopt-2022
          - list:
              - "<strong>Pension to Meritorious Sportspersons</strong>: ₹12,000–20,000 a month after retirement."
            source: pib-support
      - id: traps
        nav: "Red flags"
        eyebrow: "Disqualification traps"
        heading: "Fouls and paperwork that cost teams"
        parts:
          - list:
              - "<strong>Saying 'Kho' before touching</strong>, or saying any other word — a foul."
              - "<strong>Turning back</strong> after taking a direction (receding), or leaving the free zone the wrong way — a foul."
              - "<strong>Stepping out of the field</strong> as a defender — you are out."
            source: cec-kho
          - list:
              - "<strong>Incomplete eligibility forms</strong> — no school seal on the photo or missing details can keep a player out of the nationals."
            source: kkfi-elig
      - id: doubts
        nav: "Player doubts"
        eyebrow: "Real-world player doubts"
        heading: "Future, jobs and money — straight answers"
        parts:
          - qa:
              q: "Kho-kho is not in the Olympics. Is there a future in it?"
              a: "Yes, in India. Kho-kho counts for <strong>central sports-quota jobs</strong>, Western Railway advertised kho-kho posts for 2026-27, it is a <strong>Khelo India Youth Games</strong> sport, and India are the <strong>World Cup champions</strong>. The Ministry is pushing for Asian Games entry. It is not an Olympic or 2026 Asian Games sport yet, so Olympic-scheme money such as TOPS does not apply."
            source: "dopt-2022,rrc-wr26,kiyg25,air-wc25,air-minister,ag26"
          - qa:
              q: "Which government jobs can kho-kho get me?"
              a: "<strong>Railways</strong>: Western Railway's 2026-27 notice had Level 1 posts for men and women. <strong>Central Group C posts</strong> under DoPT rules list kho-kho. CRPF's 2026 sports quota had <strong>no kho-kho posts</strong> — each recruiter advertises only the sports its teams need."
            source: "rrc-wr26,dopt-2022,crpf26"
          - table:
              caption: "Sports-quota job routes open in 2026 — age, qualifying results, pay"
              head: ["Route", "Age", "Main qualifying results", "Pay level"]
              rows:
                - ["Railways <strong>Level 5/4</strong> (graduates)", "18–25 on 1 Jan 2027", "Played the <strong>Olympics</strong>, or top 3 at a World Cup, World Championship, Asian Games, Commonwealth Games or Youth Olympics", "Level 5/4"]
                - ["Railways <strong>Level 3/2</strong> (12th, or 10th + apprenticeship)", "18–25 on 1 Jan 2027", "Top 3 at <strong>Senior, Youth or Junior Nationals</strong>, National Games or All India Inter-University; or Federation Cup gold", "Level 3/2"]
                - ["Railways <strong>Level 1</strong>", "18–25 on 1 Jan 2027", "Played for your state and finished <strong>at least 8th at Senior Nationals</strong>; or top 3 at the Federation Cup", "Level 1"]
                - ["CRPF <strong>Head Constable (GD)</strong> (10+2)", "18–23 on 1 Aug 2026; sportspersons get <strong>+5 years</strong> (OBC +8, SC/ST +10)", "Played for India; or top 3 for your state at Nationals or National Games; or <strong>gold/silver at Junior Nationals</strong>", "Level 4 · ₹25,500–81,100"]
                - ["CRPF <strong>Constable (GD)</strong> (10th pass)", "18–23 on 1 Aug 2026; sportspersons get <strong>+5 years</strong> (OBC +8, SC/ST +10)", "Played for your state at <strong>Senior or Junior Nationals</strong>; or top 3 at SGFI school nationals or Khelo India Games", "Level 3 · ₹21,700–69,100"]
            source: "rrc-wr26,crpf26"
          - note: "Railways count results from <strong>1 April 2024</strong>; CRPF counts the <strong>two years before 30 September 2026</strong>. Railways fee ₹500 (₹400 back if you attend the trial; ₹250, refunded in full on attending, for SC/ST, women, PwBD, minorities, ex-servicemen and EBC). CRPF fee ₹100 for UR/OBC/EWS men; free for women, SC, ST and ex-servicemen. CRPF picks sign a <strong>₹1 lakh bond to serve at least 3 years</strong>."
            source: "rrc-wr26,crpf26"
          - qa:
              q: "We are a lower-middle-class family. Can my child still play?"
              a: "Kho-kho needs very little kit to start — a marked ground and two posts. For higher levels, aim for SAI Training Centres and the NCOEs at Dharamshala (girls) and Gandhinagar, Khelo India support (<strong>₹6.28 lakh a year</strong>) and KKFI's scholarship for KIYG semi-finalist players."
            source: "cec-kho,sai-schemes,pib-support,kkfi-schol"
          - qa:
              q: "Does any 'national' certificate count for a job?"
              a: "No. Railways will <strong>not recruit on a certificate from a federation MoYAS did not recognise</strong> at the time of the championship, and CRPF counts only championships of MoYAS-recognised federations or the IOA's National Games. KKFI's recognition was renewed for 2026."
            source: "rrc-wr26,crpf26,myas-kkfi26"
