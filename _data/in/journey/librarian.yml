# Journey Blueprint — Librarian (B.Lib.I.Sc → KVS / NVS librarian; M.Lib.I.Sc + NET → college / university). Printed on journey-librarian.html.
# Rules, classes and the money items / sources several careers share: _data/in/journey_common.yml.
id: librarian
v: 2
name: "Librarian (B.Lib.I.Sc → school librarian; M.Lib.I.Sc + NET → college librarian)"
search: ["librarian", "library science", "school librarian", "college librarian", "assistant librarian", "blib", "mlib", "library and information officer"]
page: "library-science.html"
roadmap: "roadmaps/library-science.html"
doubts_page: "journey-librarian.html"
gate: "Any stream → bachelor's degree → B.Lib.I.Sc (KVS / NVS school librarian posts ask 50%) → M.Lib.I.Sc with 55% + UGC NET (or a Ph.D.) for college / university librarian posts. Central offices such as the Central Ground Water Board hire Library and Information Officers through UPSC."
gate_source: [kvs-nvs25, ugc18, upsc-adv07]
core:
  what:
    text: "A librarian runs a library — buying and cataloguing books, journals and digital resources, and helping readers find information. Schools, colleges, universities and government offices all hire librarians; each post has its own qualification rules."
    source: [kvs-nvs25, ugc18, upsc-adv07]
  day:
    - "Select, buy, catalogue and classify books, journals and e-resources."
    - "Run library software and computerised catalogues."
    - "Teach students and staff how to search for information."
  pay:
    - { level: "Librarian (KVS) / TGT Library (NVS), 2025 notification", value: "Level 7 — ₹44,900 – ₹1,42,400", source: kvs-nvs25 }
    - { level: "University Assistant Librarian / College Librarian (UGC)", value: "Academic Level 10 at entry", source: ugc18 }
    - { level: "Library and Information Officer, CGWB — UPSC 2026", value: "Level 11", source: upsc-adv07 }
  routes:
    - { title: "School librarian (KVS / NVS)", text: "Bachelor's degree in Library Science or Library and Information Science with at least 50%, knowledge of computer applications and working knowledge of Hindi and English. KVS–NVS Notification 01/2025 had 147 KVS Librarian and 134 NVS TGT (Library) posts.", source: kvs-nvs25 }
    - { title: "College / university librarian", text: "Master's in Library / Information / Documentation Science with at least 55%, knowledge of library computerisation, and UGC NET / SET or a Ph.D. under UGC's regulations.", source: ugc18 }
    - { title: "Central government offices", text: "UPSC Advt 07/2026: Library and Information Officer in the Central Ground Water Board — Master's in Library Science plus 5 years' professional library experience, age up to 40 (UR).", source: upsc-adv07 }
  cost_time:
    - { label: "KVS–NVS 2025 application", value: "₹1,200 exam fee + ₹500 processing (SC / ST / PwBD / ex-servicemen pay only ₹500)", source: kvs-nvs25 }
  cost_note: "B.Lib.I.Sc and M.Lib.I.Sc fees differ by university, so none are printed."
  challenges:
    - text: "Few posts per drive: the 2025 KVS–NVS notification had 147 KVS Librarian posts across India."
      source: kvs-nvs25
    - text: "College librarian posts need a master's with 55% plus NET or a Ph.D."
      source: ugc18
    - text: "Senior central posts ask for years of experience — 5 years for UPSC's Library and Information Officer post in 2026."
      source: upsc-adv07
  not_for:
    - "You want a job with lots of travel or fieldwork."
    - "You dislike computers — libraries now run on software and e-resources."
    - "You expect many openings every year in one city."
journey:
  - stages: [c8, c9]
    title: "Read widely, learn computers"
    do:
      - text: "KVS and NVS librarian posts ask for knowledge of computer applications along with the library degree."
        source: kvs-nvs25
    doubts:
      - q: "Where do librarians work in government?"
        a: "In Kendriya and Navodaya Vidyalayas, colleges and universities, and central offices — for example UPSC recruited a Library and Information Officer for the Central Ground Water Board in 2026."
        next: "Read the Routes list above."
        source: [kvs-nvs25, ugc18, upsc-adv07]
  - stages: [c10]
    title: "Any stream"
    do:
      - text: "KVS and NVS ask for a Bachelor's in Library Science after your first degree — not a particular Class 11 stream."
        source: kvs-nvs25
    stream: "Any stream. Good English and Hindi help for KVS / NVS posts."
    doubts:
      - q: "Which stream should I take to become a librarian?"
        a: "Any stream. KVS and NVS ask for a Bachelor's in Library Science or Library and Information Science with 50%, computer knowledge, and working knowledge of Hindi and English."
        next: "Choose the stream you like; keep Hindi and English strong."
        source: kvs-nvs25
  - stages: [c11, c12]
    title: "Plan your degree"
    do:
      - text: "College librarian posts follow UGC's rules: a master's in Library Science with 55% and NET / SET or a Ph.D."
        source: ugc18
    doubts:
      - q: "Can I join B.Lib.I.Sc right after Class 12?"
        a: "Plan for a first degree. KVS–NVS 2025 asked for a Bachelor's in Library Science or Library and Information Science, and UGC's college posts ask for a Master's in Library Science."
        next: "Check each university's B.Lib.I.Sc admission rules."
        source: [kvs-nvs25, ugc18]
      - q: "Do I need UGC NET to be a school librarian?"
        a: "No. KVS and NVS asked for a Bachelor's in Library Science with 50%, computer knowledge and Hindi and English. NET or a Ph.D. is needed for college and university librarian posts."
        next: "Decide whether you aim for schools or colleges."
        source: [kvs-nvs25, ugc18]
  - stages: [ug]
    title: "B.Lib.I.Sc with 50% or more"
    do:
      - text: "Keep at least 50% in B.Lib.I.Sc — the KVS–NVS 2025 cut-off for librarian posts."
        source: kvs-nvs25
    doubts:
      - q: "What marks do I need for a KVS librarian post?"
        a: "At least 50% in your Bachelor's degree in Library Science or Library and Information Science."
        next: "Aim well above 50% to keep the college route open too."
        source: kvs-nvs25
      - q: "Do I need CTET for a KVS librarian job?"
        a: "No. The 2025 notification asked for a valid CTET for PRT and TGT posts, but listed Librarian among the exceptions."
        next: "Focus on B.Lib.I.Sc marks and the written test."
        source: kvs-nvs25
      - q: "Is the Navodaya librarian post different from KVS?"
        a: "Only in name and some details: NVS calls it TGT (Library). Both ask for a Bachelor's in Library Science or Library and Information Science with 50%, and NVS lists experience in a residential school as desirable."
        next: "Read both post descriptions in each notification."
        source: kvs-nvs25
  - stages: [grad]
    title: "KVS / NVS librarian or M.Lib.I.Sc + NET"
    do:
      - text: "KVS–NVS 2025: two-tier exam followed by an interview for TGT including Librarian; merit uses Tier-2 (85%) and interview (15%)."
        source: kvs-nvs25
    money: [kvs-fee, ugc-jrf]
    doubts:
      - q: "What is the age limit for KVS librarian?"
        a: "Not more than 35 years in the 2025 notification."
        next: "Apply in the first drive after your B.Lib.I.Sc."
        source: kvs-nvs25
      - q: "How is the KVS librarian selected?"
        a: "Through a two-tier written exam followed by a 100-mark interview. The merit list gives 85% weight to Tier-2 and 15% to the interview."
        next: "Prepare for both written tiers and the interview."
        source: kvs-nvs25
      - q: "What is the pay of a KVS librarian?"
        a: "Level 7 of the Pay Matrix — ₹44,900 to ₹1,42,400 in the 2025 notification."
        next: "Read each new notification for current vacancies."
        source: kvs-nvs25
      - q: "How many librarian posts did KVS and NVS advertise?"
        a: "Notification 01/2025 had 147 Librarian posts in KVS and 134 TGT (Library) posts in NVS."
        next: "Watch for the next KVS–NVS notification."
        source: kvs-nvs25
      - q: "What do I need to become a college librarian?"
        a: "A Master's in Library, Information or Documentation Science with at least 55%, a good academic record with knowledge of library computerisation, and UGC NET / SET or a Ph.D. under UGC's regulations."
        next: "Do M.Lib.I.Sc and sit UGC NET."
        source: ugc18
      - q: "When is the next UGC NET?"
        a: "UGC NET December 2026 is on 14–18 and 21 December 2026."
        next: "Register on the NTA site for your subject."
        source: net-dec26
  - stages: [work]
    title: "Experience opens senior posts"
    do:
      - text: "UPSC's 2026 Library and Information Officer post asked for 5 years' professional experience in a recognised library."
        source: upsc-adv07
    doubts:
      - q: "Are there librarian jobs through UPSC?"
        a: "Yes, as individual posts. Advt 07/2026 had a Library and Information Officer post in the Central Ground Water Board at Level 11, needing a Master's in Library Science and 5 years' professional library experience."
        next: "Build experience in a government, university or research library."
        source: upsc-adv07
      - q: "How does a college librarian get promoted?"
        a: "Under UGC's 2018 regulations, a University Assistant Librarian / College Librarian enters at Academic Level 10 and can move to Senior Scale (Level 11) after four years of service with a Ph.D., five with an M.Phil. or six without either, plus a 21-day orientation course and automation training."
        next: "Keep records of your service and training."
        source: ugc18
board_note: "Any board and stream. KVS / NVS posts ask for working knowledge of Hindi and English."
board_source: kvs-nvs25
