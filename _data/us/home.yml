# USA Edition home (us/index.html) — the five routes ("vectors") and the facts only the home shows.
# High school, degrees, tests and licences come from degrees.yml / guides.yml / tests.yml / licenses.yml;
# this file holds the trade (CTE) and public-sector facts. Same rules as every _data/us file: each
# record has a source id from sources.yml, values are copied from the source (never computed), and
# pay/outlook use the BLS vintage in sources.yml (bls_vintage). Checked by scripts/check-us-data.mjs.

# The five routes. Until 2026-10-20 (USA Master Plan Phase 1) each was a section of us/index.html; the detail now
# lives in its hub (`moved_to`), and the home keeps one short card per route. id = the old home anchor: the home
# forwards a visit to us/#<id> to the card's link (inline script in us/index.html), so old links keep working.
vectors:
  - { id: k12, n: "01", title: "K-12 & high school planning", line: "Grades 9–12, credits, GPA and the SAT/ACT", moved_to: "us/high-school/#plan" }
  - { id: college, n: "02", title: "Colleges & universities", line: "Bachelor's, graduate school, medical and law school", moved_to: "us/college/#degrees" }
  - { id: cte, n: "03", title: "Career & technical education", line: "Community college and the skilled trades", moved_to: "us/cte/#route" }
  - { id: licensure, n: "04", title: "State licensing boards", line: "CPA, Professional Engineer, Registered Nurse", moved_to: "us/professional-licenses/" }
  - { id: public-sector, n: "05", title: "Federal & state civil service", line: "USAJOBS, police, fire and state exams", moved_to: "us/clusters/public-service-safety/#public-sector" }

# The six support hubs on the USA Home, next to the 14 Career Cluster hubs (_data/us/clusters.yml). A card links
# only when its page exists (`href`); otherwise it names the Master Plan phase that builds it. `planned` is the
# hub's planned URL (docs/us-edition/ARCHITECTURE.md); Exams lives on us/tests/ until Phase 9 builds us/exams/.
support:
  - { id: exams, title: "Exams", line: "SAT, ACT, PSAT, AP, then MCAT, DAT and LSAT", href: "us/tests/", planned: "us/exams/", phase: 9 }
  - { id: states, title: "States", line: "50 states and DC: diploma rules, in-state tuition, boards", planned: "us/states/", phase: 11 }
  - { id: licensing, title: "Licensing", line: "State license routes for doctors, lawyers, CPAs, engineers, nurses", href: "us/professional-licenses/", planned: "us/professional-licenses/", phase: 12 }
  - { id: colleges, title: "Colleges & training", line: "Colleges by state and city, community colleges, apprenticeships", planned: "us/colleges/", phase: 13 }
  - { id: high-school, title: "High school", line: "Grades 9–12: credits, GPA, honors, AP, IB", href: "us/high-school/", planned: "us/high-school/", phase: 9 }
  - { id: paying, title: "Paying for college", line: "Costs, FAFSA, Pell Grants, loans and transfer", href: "us/college/", planned: "us/college/", phase: 13 }

# Skilled trades, shown as the entry matrix on the Trades & CTE hub us/cte/index.html. roadmap = slug of the trade in
# _data/us/cte_careers.yml (career page us/cte/<slug>.html, roadmap us/cte/roadmaps/<slug>.html).
# "license" is BLS's own wording; welders and machinists are NOT mainly licensed trades.
trades:
  - name: "Electrician"
    entry: "High school diploma or equivalent"
    training: "Usually a 4- or 5-year apprenticeship"
    license: "Most states require electricians to pass a test and be licensed."
    pay: 63190
    outlook: 9
    source: ooh_electricians
    roadmap: electrician
  - name: "Plumber, pipefitter, steamfitter"
    entry: "High school diploma or equivalent"
    training: "Usually a 4- or 5-year apprenticeship"
    license: "Most states and some localities require plumbers to be licensed."
    pay: 63800
    outlook: 7
    source: ooh_plumbers
    roadmap: plumber
  - name: "HVAC technician"
    entry: "Postsecondary nondegree award (certificate)"
    training: "Long on-the-job training after hire"
    license: "Some states and localities require a license; the EPA requires nearly all HVAC technicians to be certified in refrigerant handling."
    pay: 61010
    outlook: 11
    source: ooh_hvac
    roadmap: hvac-technician
  - name: "Welder"
    entry: "High school diploma plus technical and on-the-job training"
    training: "Technical school courses and on-the-job training"
    license: "Licensed only in some states and localities; professional bodies offer general certification."
    pay: 53750
    outlook: 2
    source: ooh_welders
    roadmap: welder
  - name: "Machinist (precision machining)"
    entry: "High school diploma or equivalent"
    training: "On-the-job training or an apprenticeship"
    license: "No license; optional certification (for example CNC operation, CAD/CAM) shows competency."
    pay: 59620
    pay_note: "machinists and tool and die makers together"
    outlook: -1
    source: ooh_machinists
  - name: "Automotive service technician"
    entry: "Postsecondary nondegree award (certificate)"
    training: "Short-term on-the-job training"
    license: "The EPA requires all technicians who buy or work with refrigerants to be certified; other certifications typically need experience and an exam."
    pay: 50620
    outlook: 5
    source: ooh_auto
    roadmap: automotive-service-technician
trades_note: "\"Licensed trade\" is not one national rule: each state, and sometimes each city or county, decides which trades need a license and how to get one."

public_sector:
  federal:
    portal: "USAJOBS"
    url: "https://www.usajobs.gov/"
    summary: "The federal government's official employment site, run by the U.S. Office of Personnel Management (OPM). You create a profile with an email address and apply to agency job announcements there."
    source: usajobs_about
    facts:
      - { label: "Competitive service", text: "Most executive-branch civil service jobs. When agencies hire from outside their own workforce for jobs lasting more than 120 days, the law requires them to post the vacancy with OPM.", source: opm_fed_overview }
      - { label: "Excepted service", text: "Jobs excepted from the competitive hiring rules. Some agencies post these on USAJOBS voluntarily; others recruit on their own websites.", source: opm_fed_overview }
  state_local:
    summary: "Federal rules stop at federal agencies. Each state, county and city runs its own hiring system, often with its own civil service exams, so check the government you want to work for."
    example: "Example: New York State fills jobs by \"merit and fitness\" under its constitution, through civil service exams and eligible lists, plus non-competitive roles."
    source: nys_civil_service
  jobs:
    - name: "Police officer"
      href: "us/careers/police-officer/"
      entry: "High school diploma to a college degree, depending on the agency"
      steps: "Written exams and physical tests (vision, hearing, strength, agility), then the agency's training academy"
      rules: "Usually at least 21; most states and local jurisdictions require U.S. citizenship"
      pay: 77310
      pay_title: "police and detectives"
      outlook: 3
      source: ooh_police
    - name: "Firefighter"
      href: "us/careers/firefighter/"
      entry: "High school diploma or equivalent"
      steps: "Written and physical tests and interviews, then fire academy training"
      rules: "Departments may also require EMT certification"
      pay: 59280
      outlook: 4
      source: ooh_firefighters
  # Phase 5 (2026-10-20): Foreign Service and military entry routes, shown on the Public Service & Safety hub
  # (#service-routes). Each fact is copied from the page its source names; enlisted age limits come from each
  # service's own recruiting site (BLS's list is older: it still gives the Army 35).
  service_routes:
    foreign_service:
      name: "Foreign Service Officer"
      by: "U.S. Department of State"
      summary: "As a U.S. Foreign Service Officer (FSO), you'll engage with foreign governments, advocate for U.S. interests, and shape global policy, at more than 270 embassies and consulates and in Washington, D.C."
      source: state_fs
      rules: "U.S. citizen, at least 20 and under 60, willing to serve anywhere in the world. No specific degree and no foreign language are required first."
      steps:
        - { title: "Foreign Service Officer Test (FSOT)", text: "Multiple choice: general knowledge, English grammar, U.S. history and foreign policy, and logical reasoning. In 2026 it is given quarterly; registration opens one month before each test." }
        - { title: "Oral Assessment", text: "A two-part written and oral exam of general knowledge, analytical and negotiation skills." }
        - { title: "Medical and security clearances", text: "Background and medical checks for service at high-risk posts." }
        - { title: "Final review panel", text: "The Department decides final suitability." }
      tracks: "Five career tracks: Consular, Economic, Management, Political and Public Diplomacy."
      href: "https://careers.state.gov/fs/"
    enlisted:
      common: "Common to all branches: at least 17 (with a parent's consent at 17), a U.S. citizen or permanent resident, a high school diploma or equivalent, no felony conviction, and a medical exam."
      common_source: ooh_military
      asvab: "Enlisted recruits take the ASVAB. The AFQT score that decides eligibility comes from four subtests (Arithmetic Reasoning, Mathematics Knowledge, Paragraph Comprehension, Word Knowledge) and is a percentile from 1 to 99. A recruiter can schedule the ASVAB with no obligation to join, and many high schools offer it."
      asvab_sources: [asvab_scores, ooh_military]
      training: "Most first enlistments are 4 years. Basic training lasts 7 to 13 weeks, then technical school about 10 to 20 weeks for your military job."
      training_source: ooh_military
      ages:
        - { service: "Army", age: "17 to 42", note: "Minimum score on the Army's entrance test.", source: army_reqs }
        - { service: "Navy", age: "17 to 41", note: "Qualifying ASVAB score and the MEPS medical exam.", source: navy_reqs }
        - { service: "Air Force", age: "17 until your 42nd birthday", note: "17 to 48 for healthcare or ministry professionals.", source: af_join }
        - { service: "Marine Corps", age: "17 to 28", note: "High school diploma or GED; background check.", source: usmc_reqs }
        - { service: "Space Force", age: "17 to 42", note: "U.S. citizen and a qualifying ASVAB score; apply through an Air Force recruiter.", source: ussf_enlisted }
        - { service: "Coast Guard", age: "BLS lists 41", note: "The Coast Guard's own eligibility page did not load its enlisted tab for us; confirm with a recruiter.", source: ooh_military }
    officer:
      common: "Officers typically need at least a bachelor's degree, U.S. citizenship, a background check and the physical and age rules; they do not take the ASVAB."
      common_source: ooh_military
      routes:
        - { name: "Service academy", text: "A free bachelor's degree with a commission and typically a 5-year active-duty obligation. Candidates must be unmarried with no dependents and, except at the Coast Guard Academy, nominated, usually by a member of Congress.", source: ooh_military }
        - { name: "West Point (Army)", text: "U.S. citizen, 17 to 22 on 1 July of the admission year, unmarried, no legal duty to support children. SAT, ACT or CLT, a fitness assessment, a DoDMERB medical exam and a nomination from your Senators, Representative or the Vice President.", source: usma_steps }
        - { name: "Naval Academy (Navy, Marine Corps)", text: "U.S. citizen by 1 July of the entry year, at least 17 and not past your 23rd birthday on 1 July, unmarried, no dependents; apply for a nomination.", source: usna_apply }
        - { name: "Coast Guard Academy", text: "Admission is on merit; congressional nominations are not required or considered.", source: uscga_admissions }
        - { name: "ROTC", text: "Regular college classes plus 3 to 5 hours of military instruction a week; competitive 2-, 3- and 4-year scholarships. Graduates serve on active duty or in the Reserves or National Guard.", source: ooh_military }
        - { name: "OCS / OTS", text: "For college graduates: several weeks of academic, physical and leadership training.", source: ooh_military }
        - { name: "Marine Corps officer", text: "A four-year college degree by commissioning, U.S. citizen, at least 20; talk to an Officer Selection Officer.", source: usmc_reqs }
        - { name: "Direct appointment", text: "Lawyers (Judge Advocate General's Corps), chaplains and health professionals; the Uniformed Services University gives a free M.D. for at least 7 years of service.", source: ooh_military }

# Corrections to common claims, shown on the home so students are not misled.
corrections:
  cpa_150: "The 150-hour rule is no longer the only CPA route: the 2025 NASBA/AICPA model also allows a 120-hour bachelor's plus 2 years of experience, in states whose law has adopted it."
last_verified: 2026-10-20
