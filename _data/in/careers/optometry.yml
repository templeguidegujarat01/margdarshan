  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "What is the difference between an Optometrist and an Ophthalmologist?"
            a: "They are genuinely different professions. An Optometrist holds a B.Optom or BSc Optometry degree (4 years), tests vision, prescribes corrective lenses, and detects common eye conditions for referral. An Ophthalmologist is a medical doctor — MBBS followed by MS in Ophthalmology, roughly 8-9+ years of total training — who can perform eye surgery and treat complex eye disease directly. Optometrists cannot perform surgery; that requires an Ophthalmologist's medical qualification."
          - q: "Is NEET required for Optometry?"
            a: "No. Optometry admission does not require NEET — colleges use CUET, their own entrance exams, state-level admissions, or direct Class 12 merit instead. This makes it a genuinely accessible healthcare career alternative for students who didn't appear for or qualify NEET."
          - q: "What is a realistic Optometrist salary in India?"
            a: "Freshers commonly earn ₹2.5-4 LPA, with an entry-level average around ₹2.6 LPA commonly cited. At retail optical chains like Lenskart or Titan Eye+, total compensation including incentives is reported to reach ₹3.5-10 LPA depending on performance and experience. Experienced optometrists, senior clinical roles, or those running an established private practice are reported to earn ₹7-15+ LPA."
          - q: "Is Optometry a good alternative if I didn't clear NEET?"
            a: "Yes, it's a genuine, licensed healthcare career that doesn't require NEET at all. It's a strong option for students who want to work in patient-facing healthcare with real scientific and technical content, without needing to clear the highly competitive NEET cutoffs required for MBBS, Bachelor of Dental Surgery (BDS), Bachelor of Ayurvedic Medicine and Surgery (BAMS) or Bachelor of Homoeopathic Medicine and Surgery (BHMS)."
          - q: "What is the difference between an Optometrist and an Optician?"
            a: "An Optician dispenses and fits eyewear based on a prescription someone else has already written, typically after a much shorter certificate or diploma course. An Optometrist holds a full 4-year degree, can independently test vision, write prescriptions, and detect common eye conditions — a considerably broader scope of practice than an Optician's."
      - note: "Figures are indicative (2026) — confirm on the official college or authority website."
        class: "table-note mt-lg"
