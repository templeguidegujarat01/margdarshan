# Journey Blueprint — School Teacher (D.El.Ed / B.Ed / ITEP + TET). Printed on journey-school-teacher.html (_includes/journey-doubts.html).
# Rules, classes and the money items / sources several careers share: _data/in/journey_common.yml.
# `money_defs` / `sources` below are used only by this career. Check: node scripts/check-journey-matrix.mjs
id: school-teacher
v: 2
name: "School Teacher (D.El.Ed / B.Ed / ITEP + TET)"
search: ["school teacher", "primary school teacher", "upper primary school teacher", "secondary school teacher", "senior secondary school teacher", "government school teacher", "private school teacher", "mathematics teacher", "physics teacher", "chemistry teacher", "biology teacher", "english language teacher", "hindi language teacher", "gujarati language teacher", "sanskrit teacher", "computer science teacher", "economics teacher", "history teacher", "geography teacher", "political science teacher", "accountancy teacher", "business studies teacher", "sociology teacher", "psychology teacher", "information technology teacher"]
search_not: ["special education", "preschool", "kindergarten", "montessori", "physical education", "piano", "guitar", "violin", "religious", "gita", "dance", "music", "drama", "art teacher"]
page: "bed.html"
roadmap: "roadmaps/bed.html"
doubts_page: "journey-school-teacher.html"
gate: "Classes 1–5: Class 12 (50%) + 2-year D.El.Ed. Classes 6–8: graduation + B.Ed (50%) or D.El.Ed. Higher classes: subject degree / master's + B.Ed. Or the 4-year ITEP after Class 12. Then pass a Teacher Eligibility Test (CTET or your state's TET) and clear the recruitment exam."
gate_source: [ncte-mq11, ncet26, ctet-ib]
core:
  what:
    text: "A school teacher plans lessons, teaches a class or a subject, checks work and helps each child learn. To teach Classes 1–8 in a recognised school you need the NCTE minimum qualification and a pass in a Teacher Eligibility Test (TET)."
    source: ncte-mq11
  day:
    - "Teach four to six periods, keep the class engaged and give homework."
    - "Check notebooks and tests, and keep attendance and marks records."
    - "Meet parents, help weaker students and join school events and duties."
  pay:
    - { level: "Primary teacher (PRT), Delhi govt", value: "Pay Level 6 · ₹35,400 starting basic", source: d-0525 }
    - { level: "Trained graduate teacher (TGT), Delhi govt", value: "Pay Level 7 · ₹44,900 starting basic", source: d-0625 }
    - { level: "Post graduate teacher (PGT), Delhi govt", value: "Pay Level 8 · ₹47,600 starting basic", source: d-1024 }
  pay_note: "Pay differs by state and school; private-school pay is not published officially."
  routes:
    - { title: "Primary (Classes 1–5)", text: "Class 12 with 50% + a 2-year D.El.Ed (or a 4-year B.El.Ed), then a TET Paper I.", source: ncte-mq11 }
    - { title: "Upper primary (Classes 6–8)", text: "Graduation + B.Ed (50%) or D.El.Ed, or a 4-year integrated B.A.Ed / B.Sc.Ed, then a TET Paper II.", source: ncte-mq11 }
    - { title: "Secondary and senior secondary", text: "A subject degree (TGT) or master's (PGT) with 50% + B.Ed, as in Delhi's DSSSB posts.", source: [d-0625, d-1024] }
    - { title: "4-year ITEP", text: "The Integrated Teacher Education Programme straight after Class 12, through NCET.", source: ncet26 }
  cost_time:
    - { label: "D.El.Ed", value: "2 years after Class 12", source: ncte-mq11 }
    - { label: "B.Ed", value: "After graduation (1-year B.Ed in the 2011 rules; check the current length with your university)", source: ncte-mq11 }
    - { label: "ITEP", value: "4 years after Class 12 · NCET fee 2026 ₹1,200 / ₹1,000 / ₹650", source: ncet26 }
    - { label: "CTET fee", value: "₹1,000 one paper · ₹1,200 both (₹500 / ₹600 SC / ST / disabled)", source: ctet-ib }
  cost_note: "D.El.Ed and B.Ed college fees are set by each state and college, so we do not print one figure."
  challenges:
    - text: "A TET pass is only an eligibility: it gives no right to a job — you still need the recruitment exam."
      source: ctet-ib
    - text: "TET pass mark is <strong>60%</strong>; employers may give reserved categories some concession."
      source: ctet-ib
    - text: "State schools use the <strong>state TET</strong>; CTET mainly covers central schools (KVS, NVS) and UT schools — pick the right test for the job you want."
      source: ctet-ib
  not_for:
    - "You do not enjoy explaining the same thing many times in different ways."
    - "You want a job without paperwork — marks, attendance and reports are part of every week."
    - "You lose patience easily in a large, noisy class."
journey:
  - stages: [c8, c9]
    title: "Become the student others ask for help"
    do:
      - text: "Explain a chapter to a younger sibling or a friend each week — it is the best test of whether you enjoy teaching."
      - text: "Keep your language skills strong: the CTET has two language papers in Paper I."
        source: ctet-ib
    doubts:
      - q: "What do I need to become a government school teacher?"
        a: "Three things: the NCTE minimum qualification for your level (D.El.Ed for Classes 1–5, B.Ed or D.El.Ed for Classes 6–8), a Teacher Eligibility Test pass, and then the recruitment exam of your state or of KVS / NVS."
        next: "Decide which classes you want to teach — it decides your course."
        source: [ncte-mq11, ctet-ib]
      - q: "Which subject should I like to become a teacher?"
        a: "Any. Primary teachers teach all subjects; from Class 6 up you teach the subject of your degree. The NCTE rules are about the course and the TET, not one subject."
        next: "Pick the subject you enjoy most — you may teach it for 30 years."
        source: ncte-mq11
  - stages: [c10]
    title: "Any stream works — choose what you will teach"
    do:
      - text: "Every stream can lead to teaching. For a subject teacher, choose the stream that leads to that subject's degree (Science for Maths / Science, Commerce for Accountancy, Arts for History and languages)."
    stream: "Any stream. Plan for 50% in Class 12 — primary routes need it."
    doubts:
      - q: "Is Science compulsory to become a teacher?"
        a: "No. The NCTE qualifications ask for Class 12 or a degree with set marks plus a teacher-education course — not a stream. Your stream only decides which subject you can teach later."
        next: "Choose the stream of the subject you want to teach."
        source: ncte-mq11
  - stages: [c11, c12]
    title: "Score 50% and pick D.El.Ed, ITEP or a degree"
    do:
      - text: "Aim for <strong>50% in Class 12</strong> — the primary-teacher route (D.El.Ed or B.El.Ed) needs it (5% less for reserved categories)."
        source: ncte-mq11
      - text: "After Class 12, choose: a 2-year D.El.Ed (primary), the 4-year ITEP through NCET, or a degree and then B.Ed."
        source: [ncte-mq11, ncet26]
    exams:
      - { name: "NCET 2026 (for ITEP)", when: "Form 12 Feb – 10 Mar 2026 · exam 17 Apr 2026", source: ncet26 }
    money: [csss, pms-sc]
    mistakes:
      - "Joining a teacher-education college that is not NCTE-recognised."
      - "Scoring under 50% in Class 12 and losing the primary route."
    late: "Already doing a regular degree? Finish it, then do B.Ed — it opens Classes 6–12."
    doubts:
      - q: "Can I become a primary teacher right after Class 12?"
        a: "You need Class 12 with 50% and a 2-year D.El.Ed (or the 4-year B.El.Ed), and then a TET Paper I pass."
        next: "Look for NCTE-recognised D.El.Ed colleges in your state."
        source: ncte-mq11
      - q: "What is ITEP?"
        a: "The 4-year Integrated Teacher Education Programme, joined straight after Class 12 through NCET, in central and state universities, IITs, NITs, RIEs and government colleges."
        next: "Watch for the NCET form in February of your Class 12 year."
        source: ncet26
      - q: "Is there an age limit for NCET?"
        a: "No. NCET 2026 had no age limit; students who passed or were appearing in Class 12 could sit it. Each university may set its own age rule for admission."
        next: "Check the age rule of the university you want."
        source: ncet26
      - q: "Can NIOS students apply for NCET?"
        a: "Yes. The NIOS Senior Secondary exam with at least five subjects is a listed qualifying exam for NCET 2026."
        next: "Keep your NIOS marksheet with five subjects ready."
        source: ncet26
  - stages: [ug]
    title: "In college: degree, then B.Ed — or D.El.Ed / ITEP"
    do:
      - text: "For Classes 6–8: graduation with <strong>50%</strong> and a B.Ed, or graduation and a 2-year D.El.Ed."
        source: ncte-mq11
      - text: "For TGT / PGT posts: a subject degree or master's with 50% plus B.Ed (DSSSB's rule)."
        source: [d-0625, d-1024]
      - text: "Sit the TET in your final year or right after the course."
    exams:
      - { name: "CTET (22nd edition)", when: "Applications 11 May – 10 Jun 2026 (reopened 25 Aug – 1 Sep) · exam 12–13 Dec 2026", source: [ctet-ib, ctet-reopen, ctet-dates] }
    doubts:
      - q: "Can I teach primary classes with a B.Ed?"
        a: "The primary route in the NCTE rules is D.El.Ed or B.El.Ed. Recent primary-teacher notices — Delhi's DSSSB 2025 and Chhattisgarh's 2026 recruitment — ask for D.El.Ed or B.El.Ed, not B.Ed."
        next: "If you want Classes 1–5, do D.El.Ed; B.Ed is for Classes 6 and above."
        source: [ncte-mq11, d-0525, ls-advt]
      - q: "What marks do I need in graduation for B.Ed teaching posts?"
        a: "50% in graduation with B.Ed for Classes 6–8, with up to 5% relaxation for reserved categories."
        next: "Protect your graduation percentage."
        source: ncte-mq11
      - q: "Can I teach with a master's and an integrated B.Ed-M.Ed?"
        a: "Yes. Since NCTE's 2021 amendment, post-graduation with 55% and a 3-year integrated B.Ed-M.Ed counts for Classes 6–8, and for Classes 1–5 with a six-month bridge course within two years of joining."
        next: "Check your recruitment notice for the exact wording."
        source: ncte-mq21
  - stages: [grad]
    title: "Pass the TET, then the recruitment exam"
    do:
      - text: "<strong>CTET</strong>: Paper I for Classes 1–5, Paper II for Classes 6–8 — 150 one-mark MCQs each, 2½ hours, no negative marking. 60% is a pass."
        source: ctet-ib
      - text: "A TET certificate is now valid for life (unless your government notifies otherwise)."
        source: ctet-valid
      - text: "Then apply to recruitment exams: KVS / NVS, DSSSB in Delhi, your state's teacher recruitment body."
        source: ctet-ib
    exams:
      - { name: "CTET (22nd edition)", when: "12–13 Dec 2026", source: ctet-dates }
    doubts:
      - q: "What is the CTET pass mark?"
        a: "60% or more is a TET pass. School managements may give concessions to SC, ST, OBC and disabled candidates under their reservation policy."
        next: "Aim for at least 90 out of 150."
        source: ctet-ib
      - q: "Is there negative marking in CTET?"
        a: "No. All 150 questions in each paper are one-mark MCQs with no negative marking."
        next: "Attempt every question."
        source: ctet-ib
      - q: "How long is my TET certificate valid?"
        a: "For life, unless your government notifies otherwise. NCTE changed the old seven-year rule in 2021."
        next: "Keep the certificate safe; you will not need to re-sit for validity."
        source: ctet-valid
      - q: "CTET or state TET — which should I take?"
        a: "CTET applies to central government schools (KVS, NVS) and schools of the UTs, and private schools may accept it. State government and aided schools use the state's own TET, unless the state decides to accept CTET."
        next: "Take the TET of the schools you want to join — many students take both."
        source: ctet-ib
      - q: "Does passing CTET give me a job?"
        a: "No. CTET is only one eligibility condition; it gives no right to recruitment. You must still clear the recruiting body's exam."
        next: "Prepare for KVS, NVS or your state's recruitment exam."
        source: ctet-ib
  - stages: [work]
    title: "Switching to teaching later"
    do:
      - text: "Many recruitment exams have age limits — Delhi's DSSSB primary, TGT and PGT posts took candidates up to 30 years, with relaxations."
        source: [d-0525, d-0625, d-1024]
      - text: "NCET for ITEP has no age limit, but universities can set one."
        source: ncet26
    doubts:
      - q: "I am 28 and working. Can I still become a teacher?"
        a: "Yes, but check age limits. Delhi's DSSSB teacher posts allowed up to 30 years (with relaxations), and Chhattisgarh's 2026 assistant teacher posts 21 to 35. TET itself has no age limit."
        next: "Do B.Ed or D.El.Ed now and watch your state's age rule."
        source: [d-0525, ls-advt]
board_note: "Every board's Class 12 counts for D.El.Ed, ITEP (NCET also accepts NIOS with five subjects) and degrees. Your Class 12 percentage matters for the primary route (50%)."
board_source: [ncte-mq11, ncet26]
