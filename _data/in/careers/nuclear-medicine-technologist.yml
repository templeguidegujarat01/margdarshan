hero:
  eyebrow: "Science (PCB) · Allied Health"
  title: "Nuclear Medicine Technologist — Imaging with Radioactivity"
  meta:
    - "Radiation safety regulated by AERB"
    - "Class 12 with Physics, Chemistry & Biology"
  read_time: "8 min read"
  intro:
    - "Nuclear medicine technologists prepare and give small doses of radioactive tracers and run PET-CT, SPECT and gamma cameras that show how organs are working — vital in cancer, heart and thyroid care. The route is a B.Sc in Nuclear Medicine Technology (or a B.Sc followed by a postgraduate diploma). Nuclear medicine facilities are licensed by the Atomic Energy Regulatory Board (AERB), which also sets the staff qualifications they need."
  quickfacts:
