sports:
  # ------------------------------------------------------------------------------------------------ Wrestling
  - slug: wrestling
    short: "Wrestling"
    domain: combat
    body: "United World Wrestling (UWW) · Wrestling Federation of India (WFI)"
    card: "Freestyle, Greco-Roman and women's wrestling — weight classes, the two-morning weigh-in, akhara-to-Olympics ladder."
    card_facts: ["10 senior weight classes / style", "6 at the Olympics", "0 g tolerance on day 2"]
    eyebrow: "Sports Cockpit · Combat &amp; Mat · UWW rules January 2026"
    title: "Wrestling — weight classes, weigh-in rules &amp; the road to the Olympics"
    lede: "Everything a wrestler and family need from the first akhara to an Olympic mat: the three styles, every weight class, the weigh-in that can end a final, age categories, SAI and corporate camps, who pays, and the jobs and awards that follow a medal."
    official:
      - { label: "UWW Wrestling Rules (PDF)", url: "https://cdn.uww.org/2026-01/wrestling_rules.pdf" }
      - { label: "wrestlingfederationofindia.org", url: "https://www.wrestlingfederationofindia.org/" }
    facts:
      - { label: "Olympic weight classes", value: "<strong>6 per style</strong> — 18 medal events", source: uww-rules }
      - { label: "Weigh-in", value: "<strong>Every morning</strong> of the category, 30 min; finalists again on day 2", source: uww-rules }
      - { label: "Senior bout", value: "<strong>2 × 3 min</strong>, 30-second break", source: uww-rules }
      - { label: "Win early by", value: "Fall · <strong>8-point</strong> lead (Greco) · <strong>10-point</strong> lead (freestyle)", source: uww-rules }
    sections:
      - id: rules
        nav: "Rules &amp; weight"
        eyebrow: "Core rules &amp; category limits"
        heading: "Styles, weight classes and the weigh-in that decides who wrestles"
        parts:
          - p: "There are three Olympic styles. In <strong>Greco-Roman</strong> it is strictly forbidden to hold the opponent below the belt, trip him or use the legs to attack. <strong>Freestyle</strong> and <strong>Women's Wrestling</strong> allow leg holds and trips; women's wrestling follows freestyle rules but bans the double nelson."
            source: uww-rules
          - table:
              caption: "Senior, U23 and U20 weight classes (kg) — the Olympic ones in bold"
              head: ["Style", "All 10 world-level classes", "Olympic Games (incl. qualifiers)"]
              rows:
                - ["Men's Freestyle", "57 · 61 · 65 · 70 · 74 · 79 · 86 · 92 · 97 · 125", "<strong>57 · 65 · 74 · 86 · 97 · 125</strong>"]
                - ["Greco-Roman", "55 · 60 · 63 · 67 · 72 · 77 · 82 · 87 · 97 · 130", "<strong>60 · 67 · 77 · 87 · 97 · 130</strong>"]
                - ["Women's Wrestling", "50 · 53 · 55 · 57 · 59 · 62 · 65 · 68 · 72 · 76", "<strong>50 · 53 · 57 · 62 · 68 · 76</strong>"]
            source: uww-rules
          - table:
              caption: "U17 and U15 weight classes (kg)"
              head: ["Style", "U17 (16–17 years)", "U15 (14–15 years)"]
              rows:
                - ["Freestyle &amp; Greco-Roman", "41–45 · 48 · 51 · 55 · 60 · 65 · 71 · 80 · 92 · 110", "34–38 · 41 · 44 · 48 · 52 · 57 · 62 · 68 · 75 · 85"]
                - ["Women's Wrestling", "36–40 · 43 · 46 · 49 · 53 · 57 · 61 · 65 · 69 · 73", "29–33 · 36 · 39 · 42 · 46 · 50 · 54 · 58 · 62 · 66"]
            source: uww-rules
          - list:
              - "A wrestler competes in <strong>only one weight class — the one matching body weight at the official weigh-in</strong>. Seniors and U23 may move up one class; the heaviest class needs <strong>over 97 kg</strong> (freestyle and Greco-Roman) or <strong>over 72 kg</strong> (women)."
              - "Each weight class runs over <strong>two days</strong>: qualification and elimination rounds on day 1, repechage and finals on day 2."
              - "Weigh-in and medical check are held <strong>every morning of the category and last 30 minutes</strong>. On the <strong>second morning only finalists and repechage wrestlers</strong> weigh in again, in a <strong>15-minute</strong> window."
              - "The rule book says <strong>no weight tolerance is allowed at the second weigh-in</strong>. A <strong>2 kg tolerance</strong> is allowed only at the World Cup, UWW Ranking Series and international tournaments."
              - "The only dress at the scale is the correct <strong>singlet — with no tolerance for its weight</strong>. Wrestlers may step on the scale as many times as they like within the window."
              - "Missing or failing <strong>either weigh-in</strong> means the wrestler is <strong>eliminated and ranked last, without rank</strong>."
            source: uww-rules
          - warn: "The 100-gram lesson: at the Paris 2024 Olympics Vinesh Phogat, entered in the women's 50 kg class, was found <strong>100 grams over</strong> the limit at the morning weigh-in before her final and was declared ineligible — the Sports Minister told Parliament the UWW rule disqualifies any athlete who misses or fails the weight check."
            source: air-phogat
          - list:
              - "The mat is a <strong>9 m circle</strong> with a 1.5 m protection border; the 1 m orange band inside the edge is the passivity zone."
              - "Bouts: <strong>2 × 3 minutes</strong> for U20, U23 and seniors; <strong>2 × 2 minutes</strong> for U15, U17 and veterans, with a 30-second break."
              - "A bout ends early by <strong>fall</strong>, by <strong>technical superiority</strong> (8 points clear in Greco-Roman, 10 in freestyle and women's), by <strong>three cautions</strong> to the opponent, or by injury/disqualification."
              - "There must be at least <strong>20 minutes</strong> of rest before a wrestler is called for the next bout."
            source: uww-rules
      - id: recognition
        nav: "Recognition"
        eyebrow: "Institutional &amp; global recognition"
        heading: "Where a wrestling medal counts — and what India pays for it"
        parts:
          - table:
              caption: "International competitions by age group (UWW calendar)"
              head: ["Age group", "Competitions"]
              rows:
                - ["Seniors (20+)", "<strong>Olympic Games</strong>; World Championships and Continental Championships every year except the Olympic year; World Cup every four years"]
                - ["U23 (19–23)", "World Championships and Continental Championship every year"]
                - ["U20 (18–20)", "World Championships and Continental Championships every year"]
                - ["U17 (16–17)", "World Championships and Continental Championships every year"]
                - ["U15 (14–15)", "Continental Championships and international events on request"]
                - ["Veterans (35+)", "World Championships every year"]
            source: uww-rules
          - p: "The Olympic wrestling tournament runs <strong>7 days on 3 mats</strong>; the senior World Championships run 9 days on 4 mats. Only the <strong>top four in each class</strong> are on the podium — gold, silver and <strong>two bronzes</strong> (the repechage winners)."
            source: uww-rules
          - p: "India's federation calendar for 2026 lists the <strong>U17 National Championship</strong> (Chhatrapati Sambhaji Nagar, 28–30 April 2026), the <strong>U23 World Championship</strong> (Las Vegas, 12–18 October 2026) and the <strong>Senior World Championships</strong> (Astana, 24 October–1 November 2026)."
            source: wfi
          - table:
              caption: "Government cash award for a senior wrestling medal (₹ lakh)"
              head: ["Event", "Gold", "Silver", "Bronze"]
              rows:
                - ["<strong>Olympic Games</strong>", "75", "50", "30"]
                - ["Asian Games", "30", "20", "10"]
                - ["Commonwealth Games", "30", "20", "10"]
                - ["Senior World Championship (held every year)", "10", "7", "4"]
                - ["Senior Asian Championship (held every year)", "3.75", "2.5", "1.25"]
            source: myas-cash
          - note: "The coach of an individual medallist gets <strong>50%</strong> of the athlete's award. Apply on the Department of Sports DBT-MIS portal <strong>within six months</strong> of the event."
            source: myas-cash
      - id: eligibility
        nav: "Eligibility"
        eyebrow: "Physical, age &amp; gender eligibility"
        heading: "Age categories, licences and clean-sport duties"
        parts:
          - table:
              caption: "UWW age categories"
              head: ["Category", "Age in the competition year", "Early entry"]
              rows:
                - ["U15", "14–15", "From 13 with medical and parental authorisation"]
                - ["U17", "16–17", "From 15 with medical and parental authorisation"]
                - ["U20", "18–20", "From 17 with medical and parental authorisation"]
                - ["U23", "19–23", "From 18 with medical and parental authorisation"]
                - ["Senior", "20 and older", "U20 wrestlers may enter senior events — <strong>except those aged 17 that year</strong>"]
                - ["Veteran", "Over 35", "—"]
            source: uww-rules
          - list:
              - "Categories are set by <strong>age and body weight only</strong> — the UWW rule book has <strong>no height rule</strong>. Men wrestle freestyle or Greco-Roman; women have their own ten classes."
              - "Every wrestler at a UWW-calendar event needs an <strong>international licence, valid for one calendar year</strong>. The request must reach UWW <strong>at least 2 months</strong> before the competition; the licence also insures medical costs abroad."
              - "A wrestler competes only under the nationality on the licence and may <strong>change nationality only once</strong>."
              - "Wrestlers must arrive at the medical check and weigh-in with licence and accreditation, nails cut very short, and in perfect physical condition; doctors remove anyone with a contagious disease."
            source: uww-rules
          - list:
              - "Under the anti-doping code the athlete has the right to a <strong>Therapeutic Use Exemption (TUE)</strong> process, a fair hearing and an appeal."
              - "The athlete must be <strong>available for testing in and out of competition</strong>, stay in sight of the Doping Control Officer from notification to the end of sample collection, and check every medicine against the <strong>Prohibited List</strong> in force."
              - "If no permitted alternative treatment exists, the athlete must <strong>apply to NADA for a TUE</strong>."
            source: nada-rr
      - id: roadmap
        nav: "Roadmap"
        eyebrow: "Grassroots-to-elite roadmap"
        heading: "From the akhara to the national camp, step by step"
        parts:
          - table:
              caption: "The selection ladder"
              head: ["Step", "Age", "How you move up"]
              rows:
                - ["1. Akhara or school", "8–14", "SAI adopts <strong>akharas</strong> under the National Sports Talent Contest; medals at district or state level get a child admitted after medical and fitness tests"]
                - ["2. School games", "U14 · U17 · U19", "State school games, e.g. Delhi's wrestling meet at <strong>Chhatrasal Stadium</strong>, 2–11 Sept 2026, weigh-in at 8 AM, bouts from 9:30 AM"]
                - ["3. State &amp; national age-group", "U15 · U17 · U20 · U23", "State association trials, then federation nationals (U17 Nationals 2026: Chhatrapati Sambhaji Nagar)"]
                - ["4. SAI Training Centre", "12–18", "Up to <strong>8th place</strong> at Sub-Junior/Junior Nationals, or <strong>top 3</strong> at a state championship, plus a battery of tests — no direct admission"]
                - ["5. Khelo India / NCOE", "Scouted", "Talent Identification and Development Committees pick athletes at competitions; skill, fitness, medical and <strong>age-verification</strong> tests"]
                - ["6. National camp &amp; TOPS", "Senior", "Medal prospects enter TOPS Development or Core Group"]
            source: "sai-schemes,edudel,wfi,pib-support"
          - list:
              - "You <strong>cannot apply</strong> to become a Khelo India athlete — scouts from the TIDC visit recognised competitions (school games, national championships, state leagues, university games) and shortlist."
              - "Shortlisted athletes fill a Players Basic Information Form and attend assessment camps with <strong>skill, fitness, medical and age-verification</strong> tests."
              - "Create a profile on the <strong>National Sports Repository System</strong> (nsrs.kheloindia.gov.in) with age proof (Aadhaar or birth certificate) and certificates — it is your digital sports resume."
            source: kia-guide
          - p: "SAI's <strong>KIRTI</strong> programme tests children aged <strong>9 to 18</strong> at <strong>174 Talent Assessment Centres</strong> to feed this pipeline."
            source: pib-transform
          - links:
              - { label: "Delhi school wrestling circular (PDF)", url: "https://edudel.nic.in/upload/upload_2025_26/Sports_OrganizationofDelhiStateSchoolGamesWrestling_dt_20082026_3074_80.pdf" }
              - { label: "NSRS athlete registration", url: "https://nsrs.kheloindia.gov.in/" }
              - { label: "SAI, NIS &amp; sports-quota guide", url: "niche-careers/sports.html" }
      - id: academies
        nav: "Academies"
        eyebrow: "Top training centres &amp; cities"
        heading: "Where India's wrestlers train"
        parts:
          - table:
              caption: "Verified wrestling centres"
              head: ["Centre", "City / state", "What it is"]
              rows:
                - ["SAI NCOE Sonepat", "Sonepat, Haryana", "Government residential centre — wrestling with archery, athletics, hockey, kabaddi"]
                - ["SAI NCOE Hamirpur", "Hamirpur, Himachal Pradesh", "Wrestling with athletics, badminton, boxing, hockey, judo"]
                - ["SAI NCOE Lucknow", "Lucknow, Uttar Pradesh", "Wrestling with athletics, hockey, taekwondo, weightlifting"]
                - ["SAI NCOE Kandivali", "Mumbai, Maharashtra", "Wrestling with hockey and kabaddi"]
            source: sai-schemes
          - note: "SAI NCOEs give boarding, coaches, sports science (physiology, biomechanics, psychology, strength &amp; conditioning, physiotherapy) and <strong>individual diets set by nutritionists</strong>. <strong>SAI Bengaluru is not a wrestling centre</strong> — its NCOE disciplines are athletics, hockey, taekwondo and weightlifting."
            source: sai-schemes
          - p: "<strong>Inspire Institute of Sport (IIS), Vijayanagar, Karnataka</strong> — the JSW-backed high-performance centre — runs the <strong>Parle G Wrestling Champions Programme</strong>, which it says supports <strong>over 150 wrestlers</strong>, inside a campus with athlete residences, recovery, physiotherapy, nutrition and biomechanics."
            source: iis
          - p: "<strong>Chhatrasal Stadium, Model Town, Delhi</strong> is the base of the Delhi Directorate of Education's Sports Branch and the venue of the state's school wrestling championships for U14, U17 and U19 boys and girls."
            source: edudel
      - id: costs
        nav: "Diet &amp; cost"
        eyebrow: "Dietary framework &amp; financial cost breakdown"
        heading: "Food, supplements and who pays the bills"
        parts:
          - list:
              - "<strong>No supplement is 100% risk-free</strong> — supplements can contain substances on WADA's Prohibited List because of contamination, poor labelling or fake products."
              - "<strong>Strict liability</strong>: the athlete alone is accountable for any prohibited substance in the body, however it got there."
              - "Use a <strong>food-first approach</strong> and do any supplement risk assessment with a <strong>certified nutritionist</strong> who knows the anti-doping system. Anti-doping bodies do not certify products as safe."
            source: nada-supp
          - table:
              caption: "Who pays — wrestling ladder"
              head: ["Stage", "Paid by", "Amount"]
              rows:
                - ["Adopted akhara / school (age 8–14)", "SAI National Sports Talent Contest", "Kit ₹2,000 · competitions ₹2,000 · stipend ₹3,000 a year"]
                - ["SAI STC / NCOE", "Sports Authority of India", "Boarding, coaching, sports science, diet"]
                - ["Khelo India athlete", "Ministry of Youth Affairs &amp; Sports", "<strong>₹6.28 lakh a year</strong> incl. ₹1.20 lakh cash to the athlete"]
                - ["TOPS Development Group", "National Sports Development Fund", "<strong>₹25,000 a month</strong>"]
                - ["TOPS Core Group", "National Sports Development Fund", "<strong>₹50,000 a month</strong> + full training plan approved by the Mission Olympic Cell"]
                - ["Athlete in hardship", "PDU National Welfare Fund for Sportspersons", "Up to <strong>₹2.50 lakh</strong>"]
            source: pib-support
          - p: "Corporate partners also back wrestlers: IIS Vijayanagar runs the <strong>Parle G Wrestling Champions Programme</strong> alongside the <strong>JSW Sports Excellence Programme</strong>, which manages elite pathways, nutritional planning and academic support."
            source: iis
          - note: "The NSTC amounts are SAI's financial norms for adopted regular schools; the TOPS amounts are from the Sports Minister's 2024 reply to Parliament."
            source: sai-schemes
      - id: earnings
        nav: "Earnings &amp; jobs"
        eyebrow: "Earning channels &amp; post-athletic horizons"
        heading: "Awards, sports-quota jobs, promotions and pension"
        parts:
          - list:
              - "<strong>Cash awards</strong> from the Ministry: ₹75 lakh for Olympic gold down to ₹1.25 lakh for a Senior Asian Championship bronze (table in block 02)."
              - "<strong>Pension to Meritorious Sportspersons</strong>: ₹12,000 to ₹20,000 a month after retirement from active sport."
              - "National Sports Awards — Major Dhyan Chand Khel Ratna, Arjuna, Dronacharya (coaches) and Dhyan Chand Award."
            source: pib-support
          - list:
              - "Wrestling is on the list of <strong>65 sports</strong> that qualify for central government sports-quota recruitment."
              - "Quota jobs are <strong>Group C (and erstwhile Group D)</strong> posts filled by direct recruitment — <strong>not Group A or B</strong>."
              - "Upper age limit relaxed by <strong>up to 5 years (10 for SC/ST)</strong>; vacancies are advertised in Employment News."
              - "Serving employees can get up to <strong>three out-of-turn promotions</strong> in a career for medals at the Olympics, Commonwealth Games, Asian Games or World Championships."
            source: dopt-2022
          - p: "Since <strong>4 March 2024</strong>, medal winners at Junior Nationals, the <strong>Khelo India Youth Games (above 18)</strong>, Khelo India University, Para and Winter Games and SGFI school games also qualify."
            source: dopt-2024
          - note: "These central instructions do not apply to Railways Services, the Department of Atomic Energy, the Department of Space and some DRDO technical services."
            source: dopt-2022
      - id: traps
        nav: "Red flags"
        eyebrow: "Disqualification traps"
        heading: "Mistakes that end a wrestler's tournament"
        parts:
          - list:
              - "<strong>Day-2 weight</strong>: making weight on day 1 is not enough — finalists and repechage wrestlers weigh in again with <strong>zero tolerance</strong>."
              - "<strong>Wrong singlet or no licence</strong> at the scale — referees refuse to weigh a wrestler in an altered singlet; wrong colour on the mat means a one-minute fix or forfeit."
              - "<strong>Licence not requested 2 months ahead</strong> — no licence, no UWW event."
              - "<strong>Greasy or sticky substance</strong> on the body, rings, piercings or under-wired bras are prohibited; arriving at the mat sweating is also banned."
            source: uww-rules
          - list:
              - "<strong>Age fraud, doping or misconduct</strong> are grounds for weeding an athlete out of SAI centres; age verification is compulsory at admission."
              - "Being <strong>injured and out for more than six months</strong>, or not keeping up performance, can also end an SAI place."
            source: sai-schemes
