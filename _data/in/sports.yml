              caption: "Hockey India League 2026 auction rules"
              head: ["Rule", "Men", "Women"]
              rows:
                - ["Salary cap per team", "<strong>₹4 crore</strong>", "₹2 crore"]
                - ["Squad", "20 players (2 goalkeepers + 18 outfield)", "20 players (2 goalkeepers + 18 outfield)"]
