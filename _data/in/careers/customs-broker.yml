  meta:
    - "Licensed under CBLR 2018 (CBIC)"
    - "Graduate or listed qualification"
  read_time: "8 min read"
  intro:
    - "Customs brokers file the documents that move goods through Indian ports and airports — classifying goods, paying duties and handling compliance for importers and exporters. A licence under the Customs Brokers Licensing Regulations, 2018 needs a written and an oral exam, conducted for the Central Board of Indirect Taxes and Customs (CBIC) through its academy NACIN."
