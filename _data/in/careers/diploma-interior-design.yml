  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Can I do a Diploma in Interior Design right after Class 10?"
            a: "Yes. Most polytechnics and design institutes offer a 3-year Diploma in Interior Design directly after Class 10. Several institutes also offer a shorter 1-2 year diploma after Class 12, so always check the specific duration at your target institute."
          - q: "Is a Diploma in Interior Design the same as being a certified Interior Designer?"
            a: "Not automatically. Interior design isn't a government-licensed profession in India the way architecture is, so there's no single mandatory license to use the title. Professional credibility usually comes from a recognised diploma plus a strong portfolio, and voluntary membership bodies like IIID are widely respected even though membership isn't legally compulsory."
          - q: "Does this diploma make me an Architect?"
            a: "No. Architect is a legally protected title in India that requires a B.Arch degree and registration with the Council of Architecture. A Diploma in Interior Design qualifies you to design interior spaces, materials and finishes, but not to sign off on structural or load-bearing building changes."
          - q: "Which software should I learn for interior design?"
            a: "AutoCAD for 2D drafting and SketchUp for 3D modelling are the most widely expected tools across the industry, with 3ds Max and V-Ray commonly used for advanced rendering. Many studios also value familiarity with Revit for larger commercial projects. Depth of software training varies by institute."
          - q: "Can I freelance after this diploma?"
            a: "Yes, and this is one of the diploma's genuine strengths since interior design isn't a licensed profession. Many diploma holders take on residential and small commercial projects directly, or freelance as Computer-Aided Design (CAD) drafters and 3D visualisers for studios, though income can be inconsistent early on and depends heavily on networking and portfolio quality."
      - note: "*Fee and salary figures are indicative, based on publicly available information as of 2026, and vary significantly by state, institute and employer — always verify current figures directly with your target institute."
        class: "table-note mt-lg"
