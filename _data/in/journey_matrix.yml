  - id: neet-fee
    kind: fee
    name: "Lower NEET (UG) fee"
    by: "National Testing Agency"
    amount: "₹1,000 instead of ₹1,700 (₹1,600 for EWS / OBC-NCL)"
    who: "SC, ST, PwBD / PwD and third-gender candidates, for an exam centre in India."
