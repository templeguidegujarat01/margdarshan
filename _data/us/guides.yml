# USA Edition — facts used by the hub pages (high school, tests, college & money,
# international). Same rules as the other _data/us files: every value has a
# source id (sources.yml) and an as_of / last-checked date. Numbers are copied,
# never computed. "experience" blocks are survey data about what students
# actually go through — real experience, but from official/primary surveys.

admissions:
  factors:
    survey: "Fall 2023 admission cycle, 185 four-year colleges"
    label: "Share of colleges giving each factor 'considerable importance'"
    rows:
      - { factor: "Grades in college-prep courses", pct: 76.8 }
      - { factor: "Grades in all courses", pct: 74.1 }
      - { factor: "Strength of curriculum", pct: 63.8 }
      - { factor: "Positive character attributes", pct: 28.3 }
      - { factor: "Essay or writing sample", pct: 18.9 }
      - { factor: "Student's interest in attending", pct: 15.7 }
      - { factor: "Counselor recommendation", pct: 11.9 }
      - { factor: "Teacher recommendation", pct: 10.8 }
      - { factor: "Extracurricular activities", pct: 6.5 }
      - { factor: "Class rank", pct: 5.5 }
      - { factor: "Admission test scores (SAT, ACT)", pct: 4.9 }
      - { factor: "Interview", pct: 4.3 }
    source: nacac_factors
  plans:
    - { name: "Early Decision (ED)", text: "Binding: apply to only one college ED; if admitted with enough financial aid, you must attend. Some colleges offer two rounds (ED I and ED II). Not a fit if you need to compare aid offers." }
    - { name: "Early Action (EA)", text: "Non-binding: apply early to several colleges, hear back early, and still decide by spring." }
    - { name: "Regular Decision (RD)", text: "Non-binding: apply by the regular deadline and get a decision later in the year." }
  plans_timing: "Early applications are usually due in October or November, with decisions in December or January. Most colleges give admitted students until May 1 to accept."
  plans_source: cb_ed_ea
  gpa:
    text: "Colleges usually look at GPA on a 4.0 scale. Some high schools weight AP and honors classes higher; many colleges recalculate GPAs, focusing on core subjects (English, math, science, social studies, world languages) and adjusting or removing extra weighting, because grading scales differ between schools."
    source: cb_gpa
  example_state:
    name: "University of California (example of state-specific rules)"
    facts:
      - "At least 15 year-long 'A-G' courses in grades 9–12 with a C or better, 11 of them finished before senior year."
      - "Minimum GPA in A-G courses taken in grades 10–11: 3.0 for California residents, 3.4 for nonresidents."
      - "SAT and ACT scores are not considered for admission or scholarships."
    source: uc_requirements
  as_of: 2026-10-07

dual_enrollment:
  students: "More than 3.1 million"
  year: "2024–25"
  facts:
    - "Up 10% from 2.8 million in 2023–24 and 24% from 2.5 million in 2022–23."
    - "Community colleges taught about 70% of dual enrollment students."
  source: ccrc_dual_enrollment
  as_of: 2026-10-07

testing:
  sat_format: "About 2 hours 14 minutes (Reading and Writing 64 minutes, Math 70 minutes), digital and adaptive: each section has two modules, and the second adjusts to how you did on the first."
  sat_source: cb_sat_length
  act_format: "About 2 hours 5 minutes for a Composite score: English (35 min, 50 questions), Math (50 min, 45 questions), Reading (40 min, 36 questions); Science (40 min) and Writing (40 min) are optional."
  act_source: act_vs_sat
  ap:
    fee_us: 99
    fee_outside_us: 129
    late_fee: 40
    fee_reduction: 37
    exam_year: 2027
    note: "Schools may charge more to cover local costs; some states add fee help."
    source: cb_ap_fees
    courses_source: cb_ap_courses
  policies:
    note: "Testing policies change often and differ even among similar colleges. These are examples checked on official admissions pages; always check each college's own page."
    examples:
      - { college: "MIT", policy: "Required", detail: "SAT or ACT required for first-year and transfer applicants.", source: mit_testing }
      - { college: "Yale University", policy: "Required", detail: "All first-year and transfer applicants must submit ACT or SAT scores; AP/IB scores optional but encouraged.", source: yale_testing }
      - { college: "Princeton University", policy: "Optional now, required later", detail: "Test optional for students entering in fall 2027; SAT or ACT required for students entering in fall 2028.", source: princeton_testing }
      - { college: "University of California", policy: "Test-free", detail: "SAT and ACT scores are not considered for admission or scholarships.", source: uc_requirements }
  as_of: 2026-10-07

money:
  sticker_prices:
    year: "2025–26"
    label: "Average published tuition and fees (before any aid)"
    rows:
      - { type: "Public two-year (in-district)", usd: 4150 }
      - { type: "Public four-year (in-state)", usd: 11950 }
      - { type: "Public four-year (out-of-state)", usd: 31880 }
      - { type: "Private nonprofit four-year", usd: 45000 }
    notes:
      - "These are tuition and fees only — housing, food, books and transport are extra."
      - "Public four-year in-state tuition ranges from $6,360 in Florida to $18,090 in Vermont."
      - "Many students pay less than the sticker price after grants; College Board estimates average net tuition and fees of about $2,300 for first-time, full-time in-state students at public four-year colleges."
    source: cb_pricing_2025
  fafsa:
    text: "The FAFSA is the free federal form for grants, work-study and federal loans. The 2027–28 FAFSA (for college between July 1, 2027 and June 30, 2028) is open — the law requires launch by October 1. States and colleges set their own, often earlier, deadlines."
    source: ed_fafsa_2027_28
  pell:
    max: 7395
    min: 740
    year: "2026–27"
    text: "Need-based federal grant for undergraduates that usually does not have to be repaid."
    source: fsa_pell_2026_27
  loans:
    first_year_dependent: 5500
    first_year_subsidized_max: 3500
    text: "Federal Direct Loans for a dependent first-year undergraduate are capped at $5,500 a year (no more than $3,500 subsidized), rising to $6,500 in year two and $7,500 after that."
    source: fsa_loans
  grad_changes:
    date: 2026-07-01
    text: "Under the One Big Beautiful Bill Act, Grad PLUS loans end for new graduate and professional borrowers from July 1, 2026, with new federal caps of $20,500 a year ($100,000 total) for graduate students and $50,000 a year ($200,000 total) for professional students such as medical and law students. Students already borrowing for a program before that date keep their old terms until they finish."
    source: ed_obbba_loans
  as_of: 2026-10-07

transfer:
  cohort: "Students who first started at a community college in fall 2018"
  transferred_pct: 31.6
  of_those_bachelor_pct: 48.7
  text: "About a third transferred to a four-year college within six years, and just under half of those finished a bachelor's degree in that time."
  # tips = Margdarshan's practical advice (not from the source); pages label them as tips.
  tips:
    - "Pick the four-year college (or at least the state system) early and follow its transfer agreement or guaranteed-admission program."
    - "Ask both colleges in writing which courses will transfer and count toward your major, not just as electives."
    - "Meet a transfer advisor every term; requirements differ by major."
  source: nsc_tracking_transfer
  as_of: 2026-10-07

experience:
  stopout:
    study: "Lumina Foundation–Gallup 2024 State of Higher Education (surveyed Oct–Nov 2023; 6,015 enrolled students)"
    considered_pct: 35
    reasons:
      - { reason: "Emotional stress", pct: 54 }
      - { reason: "Mental health", pct: 43 }
      - { reason: "Cost", pct: 31 }
    note: "Among bachelor's students who considered leaving, 67% cited emotional stress."
    source: gallup_stopout
  ai:
    study: "Lumina Foundation–Gallup 2026 State of Higher Education (surveyed Oct 2–31, 2025; 1,433 associate and 2,368 bachelor's students)"
    facts:
      - "57% of college students use AI for coursework at least weekly; about 20% use it daily."
      - "42% say their school discourages AI use and 11% say it prohibits it; 42% say it is encouraged (mostly with limits)."
      - "42% of bachelor's students say AI made them think at least a fair amount about changing their major; 16% of enrolled students have already switched majors because of AI."
    sources: [gallup_ai_use, gallup_ai_majors]
  as_of: 2026-10-07

international:
  numbers:
    year: "2024/25"
    total: 1177766
    india: 363019
    china: 265919
    undergrad: 357231
    grad: 488481
    opt: 294253
    note: "India was the largest country of origin, up 10%; China second, down 4%. Students on OPT grew 21%."
    source: open_doors_2025
  steps:
    - { step: "Get admitted", text: "Apply to SEVP-certified colleges. Each college sets its own English-test rules (for example TOEFL, IELTS or Duolingo) and may ask for a credential evaluation of foreign transcripts." }
    - { step: "Receive your Form I-20", text: "A Designated School Official (DSO) at your college issues the I-20 when you are accepted. You need it for every step that follows." }
    - { step: "Pay the I-901 SEVIS fee", text: "$350 for F-1 students, paid after you receive the I-20 and before the visa is issued." }
    - { step: "Apply for the F-1 visa", text: "Visas can be issued up to 365 days before your program start date; bring the original I-20 to the interview." }
    - { step: "Enter the U.S.", text: "You may arrive no more than 30 days before the program start date on your I-20." }
    - { step: "Study and work within the rules", text: "On-campus jobs: up to 20 hours a week while school is in session, full time during breaks. Off-campus work needs separate authorization (CPT, OPT)." }
  step_sources: [dhs_i20, ice_sevis_fee, ice_employment]
  credential_eval: "Colleges often ask for a course-by-course evaluation of foreign transcripts from a NACES member such as World Education Services (WES) or Educational Credential Evaluators (ECE). Use the evaluator your college names."
  credential_source: naces
  as_of: 2026-10-07

# Foundation pass (2026-10-22): depth blocks for us/high-school/ and us/college/.
gpa_weighting:
  # The worked example on the page uses UC's published method because it is one real, sourced rule; schools differ.
  intro: "An unweighted GPA counts every A as 4, B as 3, C as 2 and D as 1, whatever the course. A weighted GPA adds extra points for harder courses such as honors, AP or IB, so it can go above 4.0. Each high school sets its own weighting, and colleges see your school's profile next to your transcript."
  uc:
    name: "University of California"
    rules:
      - "Counts letter grades in A-G courses from the summer after 9th grade through the summer after 11th grade."
      - "A = 4, B = 3, C = 2, D = 1. Plus and minus grades are not counted."
      - "One extra honors point per semester for an A, B or C in an approved honors course (AP, IB HL, designated IB SL, UC-transferable college courses, UC-certified honors courses)."
      - "At most 8 honors points in total, and no more than 4 from 10th grade. D and F grades earn no honors point."
      - "Nonresidents get honors weight for AP and IB courses only, not for school-designated honors courses."
      - "Minimum GPA: 3.0 for California residents, 3.4 for nonresidents. The result is not rounded."
    source: uc_gpa
  as_of: 2026-10-22

ap_credit:
  facts:
    - "Most U.S. colleges offer credit or advanced placement, or both, for qualifying AP scores."
    - "Each college decides which scores it accepts and how many credits a score is worth; College Board's own example is a college granting 8 credits for a 4 on AP Biology."
    - "You usually need 120 credits to get a bachelor's degree."
  source: cb_ap_credit
  search_url: "https://apstudents.collegeboard.org/getting-credit-placement/search-policies"
  # credits_per_year is Education Margdarshan's planning assumption (120 credits over 4 years), not a sourced figure;
  # the page labels the savings sum as Margdarshan's arithmetic.
  credits_per_year: 30
  as_of: 2026-10-22

# Margdarshan's checklist (advice, labelled as such on the page). Dates inside repeat the sourced blocks above.
hs_checklist:
  - grade: "Grade 9"
    focus: "Start strong"
    items:
      - "Meet your school counselor and write a four-year course plan."
      - "Take the hardest core classes you can earn A's or B's in. Your GPA starts now."
      - "Try two or three activities. Keep the ones you enjoy."
      - "Start a simple record of awards, activities and hours. You will need it in grade 12."
  - grade: "Grade 10"
    focus: "Add rigor"
    items:
      - "Add an honors, AP or dual enrollment course in a subject you are good at."
      - "Take the PSAT 10 if your school offers it. It is practice only."
      - "Go deeper in one or two activities. Aim for a role with responsibility."
      - "Use summer for a job, a course, volunteering or a project."
  - grade: "Grade 11"
    focus: "Test and research"
    items:
      - "Take the PSAT/NMSQT in October. It is the National Merit Scholarship year."
      - "Take the SAT or ACT in spring if any college on your list uses scores."
      - "Build a balanced list: reach, match and likely colleges, plus one you can surely afford."
      - "Run each college's net price calculator with your family."
      - "Ask two teachers who know you well for recommendation letters before summer."
  - grade: "Grade 12"
    focus: "Apply and decide"
    items:
      - "Finish essays by early fall. Early Decision and Early Action deadlines are usually in October or November."
      - "File the FAFSA as soon as it opens (by October 1), plus any state or college aid form."
      - "Send test scores and transcripts, then check every application portal."
      - "Compare aid offers side by side. Most colleges ask you to reply by May 1."
      - "Keep your grades up. Offers can be withdrawn after a big drop."

fafsa_rules:
  award_year: "2026–27"
  federal_deadline: "June 30, 2027"
  corrections_deadline: "September 11, 2027"
  deadline_note: "The federal deadline is the last day of the award year. The Department publishes each year's dates in the Federal Register; these are for the 2026–27 form. The 2027–28 form covers college from July 1, 2027 to June 30, 2028."
  deadline_source: fr_fafsa_2026_27
  eligibility:
    - { t: "Be a U.S. citizen or national, a citizen of the Freely Associated States, or a U.S. lawful permanent resident or other eligible noncitizen. F-1 and J-1 student visas do not make you eligible.", src: fsa_hb_ch2 }
    - { t: "Have a valid Social Security number. Citizens of the Freely Associated States are the exception.", src: fsa_hb_ch4 }
    - { t: "Have a high school diploma or a recognized equivalent.", src: fsa_hb_ch1 }
    - { t: "Enroll as a regular student in an eligible degree or certificate program.", src: fsa_hb_ch1 }
    - { t: "Keep up satisfactory academic progress once you are in college.", src: fsa_hb_ch1 }
    - { t: "Not be in default on a federal student loan, or owe a federal grant overpayment, without a repayment arrangement.", src: fsa_hb_ch3 }
  as_of: 2026-10-22

residency:
  points:
    - { t: "Public colleges charge state residents far less. Each state, and sometimes each university system, writes its own residency rules.", src: cb_pricing_2025 }
    - { t: "Rules usually ask for a real, permanent home (domicile) in the state for about a year before you enroll, not a home set up just to attend college. Florida, for example, requires 12 consecutive months.", src: fl_stat_1009_21 }
    - { t: "If you are a dependent student, residency usually follows your parents.", src: fl_stat_1009_21 }
    - { t: "The University of California counts one year as 366 days, and every applicant files a Statement of Legal Residence.", src: ca_uc_rpg }
  as_of: 2026-10-22

regional_tuition:
  intro: "Four regional programs let students cross a state line for less than full out-of-state tuition. Each covers only participating colleges and programs."
  programs:
    - { name: "Western Undergraduate Exchange (WUE)", by: "WICHE", deal: "Pay 150% or less of the college's resident tuition at about 170 participating public colleges.", who: "Alaska, Arizona, California, Colorado, Hawaii, Idaho, Montana, Nevada, New Mexico, North Dakota, Oregon, South Dakota, Utah, Washington, Wyoming, plus American Samoa, the Northern Mariana Islands and Guam.", src: wiche_wue }
    - { name: "Midwest Student Exchange Program (MSEP)", by: "MHEC", deal: "A discounted tuition rate at colleges that choose to join; average savings of about $7,000 a year.", who: "Indiana, Kansas, Minnesota, Missouri, Nebraska, North Dakota, Ohio, Wisconsin.", src: mhec_msep }
    - { name: "Tuition Break (New England RSP)", by: "NEBHE", deal: "Up to 175% of in-state tuition at a public college in another New England state, in approved programs; average savings of $8,500 in 2024–25.", who: "Connecticut, Maine, Massachusetts, New Hampshire, Rhode Island, Vermont.", src: nebhe_rsp }
    - { name: "Academic Common Market (ACM)", by: "SREB", deal: "In-state tuition at an out-of-state public college, for a degree no public college in your home state offers. You must be admitted and approved by your home state.", who: "Residents of 15 SREB states in the South; check your state's ACM contact for the current list.", src: sreb_acm }
  as_of: 2026-10-22

two_plus_two:
  intro: "In a 2+2 plan you spend about two years at a community college, earn an associate degree, then transfer to a four-year university for the last two years. The savings are real only if your credits count toward your major."
  examples:
    - { place: "Florida", name: "Associate in arts (A.A.) guarantee", text: "Every A.A. graduate of a Florida College System institution has met all general education requirements and must be admitted to the upper division of a state university, except limited-access, teacher certification and audition programs. A.A. graduates get priority over out-of-state students. 2+2 targeted pathways also guarantee a specific degree program if you join before 30 credit hours.", src: fl_stat_1007_23 }
    - { place: "California", name: "Associate Degree for Transfer (AA-T / AS-T)", text: "A 60-unit, CSU-transferable degree with a C or better in each required course. Graduates are guaranteed admission with junior standing to select CSU campuses, and in a similar major can finish the bachelor's within 60 units after transfer.", src: losrios_adt }
  as_of: 2026-10-22

css_profile:
  intro: "Some colleges, mostly private ones, ask for a second aid form on top of the FAFSA. The FAFSA unlocks federal aid; the CSS Profile is how those colleges decide their own grants."
  cards:
    - { h: "What it is", t: "An online application, run by College Board, that colleges and scholarship programs use to award non-federal institutional aid. For federal aid you still file the FAFSA.", src: cb_css_about }
    - { h: "Who uses it", t: "Hundreds of colleges and scholarship programs, not every college. Check each college's list, and whether it also wants a form from a divorced or separated (noncustodial) parent.", src: cb_css_flyer }
    - { h: "When it opens", t: "October 1 each year, the same day the FAFSA becomes available. Most students file it in the fall of senior year, before each college's priority date.", src: cb_css_flyer }
    - { h: "What it asks", t: "Tax records plus questions on income, assets and expenses. College Board says it lets families give a more complete picture than the FAFSA may give.", src: cb_css_howto }
    - { h: "What it costs", t: "$25 for the first college or program and $16 for each extra report. Free for domestic first-year undergraduates with family income up to $100,000, an SAT fee waiver, or who are orphans or wards of the court under 24.", src: cb_css_howto }
  as_of: 2026-10-22

scholarship_stacking:
  intro: "Stacking means adding outside (private) scholarships on top of the grants a college gives you. It only lowers your bill if the college does not cut its own aid when the outside money arrives — called scholarship displacement."
  steps:
    - { t: "Start with the big sources: the FAFSA for federal aid, and the CSS Profile where a college asks for it.", src: cb_css_about }
    - { t: "Add private scholarships from local groups, employers and foundations. Colleges ask you to report them, and they count toward your total aid.", src: ecfr_673_5 }
    - { t: "Federal rules stop need-based campus aid such as work-study and FSEOG from going above your financial need once scholarships and grants are counted. When the total is too high, something gets cut.", src: ecfr_673_5 }
    - { t: "Some states limit displacement at public colleges. New Jersey's law (P.L. 2021, c. 223) lets a public college reduce its aid for a private scholarship only when total aid exceeds the student's need and the scholarship's donor agrees, or to follow NCAA-type athletic rules.", src: nj_oshe_displacement }
  warning: "Before you accept, ask each college's aid office in writing: \"If I win an outside scholarship, do you reduce my loans and work-study first, or my grants?\" Reducing loans first saves you money; reducing grants does not."
  as_of: 2026-10-22
