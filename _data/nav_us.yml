    - { href: "us/high-school/", label: "High School" }
    - { href: "us/tests/", label: "Tests: SAT, ACT, AP" }
    - { href: "us/college/", label: "College & Money" }
    - { href: us/careers/, label: "Career Pathways" }
    - { href: "us/professional-licenses/", label: "Licensed Professions" }
    - { href: "us/international-students/", label: "International Students" }
  tagline: "Pay and job outlook data: U.S. Bureau of Labor Statistics."
