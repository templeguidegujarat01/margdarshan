    eyebrow: "Beyond the diploma"
    heading: "Lateral entry & higher studies"
    parts:
      - prose:
          - "<strong>Lateral entry</strong> is the standard upgrade path — diploma holders can join the second year of a <strong>B.Tech/B.E. in Electrical Engineering</strong> directly, through a state lateral entry exam or quota, at AICTE-approved engineering colleges. Others add certifications in <strong>Programmable Logic Controller (PLC) programming, industrial automation, or renewable energy systems</strong> to strengthen their technical profile, particularly relevant given growing demand in solar and renewable power installation and maintenance."
