    does: { text: "Social workers help people prevent and cope with problems in their everyday lives.", source: ooh_qf_socialwork }
    work: { text: "Social workers are employed in a variety of settings, including child welfare and human service agencies, healthcare providers, and schools. Most work full time, and some work evenings, weekends, and holidays.", source: ooh_qf_socialwork }
    become: { text: "Social workers typically need a bachelor’s or master’s degree in social work. They also may need a license; specific requirements vary by state.", source: ooh_qf_socialwork }
    metrics: { pay: 61780, pay_hour: "29.70", pay_by: "Social workers", jobs: 816100, outlook: 6, outlook_words: "Faster than average", change: 50400, entry: "Bachelor's or master's degree in social work", training: "Clinical: supervised experience after the MSW", source: ooh_qf_socialwork }
