    heading: "Higher studies"
    parts:
      - prose:
          - "An <strong>M.Tech via GATE</strong> at an IIT or IISc is the standard route for students aiming at research roles or a stronger ISRO/DRDO application. An <strong>MS abroad</strong> — particularly in the US, Germany or France — is common for students targeting advanced propulsion or aerodynamics research at global aerospace companies. A <strong>PhD</strong> is the typical path for research scientist roles within ISRO or academic institutions."
  - id: "proscons"
    hid: "pc-heading"
    eyebrow: "Honest take"
    heading: "Advantages and disadvantages"
    parts:
