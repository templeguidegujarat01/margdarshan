    heading: "Myths vs facts"
    parts:
      - myths:
          - myth: "You need to already be an excellent artist to get into NIFT."
            fact: "Basic sketching ability is assessed, but design sensibility, problem-solving and consistent practice matter just as much — sketching skills improve significantly with structured training."
          - myth: "Fashion Design careers are all glamorous and fast-paced from day one."
            fact: "Most early careers involve detailed, technical work — pattern-making, sampling, production coordination — behind the scenes before reaching more visible creative roles."
          - myth: "The only good outcome is starting your own label."
            fact: "Most graduates build strong, stable careers working within established design houses, export companies or brands — independent labels are one path, not the default expectation."
