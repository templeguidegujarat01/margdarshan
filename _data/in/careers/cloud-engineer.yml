  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What does a Cloud Engineer actually do?"
    parts:
      - overview:
          points:
            - "A Cloud Engineer designs, builds, manages and secures the cloud-based infrastructure — servers, storage, networking, databases — that modern apps and websites run on, using platforms like <strong>AWS, Microsoft Azure or Google Cloud Platform</strong> instead of physical hardware."
            - "It's a role that overlaps heavily with DevOps Engineering and Cyber Security, but its core emphasis is architecture and infrastructure — designing systems that scale reliably and cost-effectively."
            - "Enterprise cloud adoption is genuinely broad-based across India — banks, hospitals, e-commerce companies and startups alike are moving workloads to the cloud, creating a well-documented, resilient demand for skilled cloud engineers."
          more:
            - "What makes this field distinctive is how measurable the certification ROI is compared to most other tech specialisations."
