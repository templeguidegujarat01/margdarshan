          - label: "Senior (5–8+ years), product companies"
            value: "₹25–50 LPA"
            text: "A senior native Android developer at an Information Technology (IT) services firm might earn ₹16-20 lakh per annum (LPA), while the same seniority at a consumer tech startup can reach ₹28-40 LPA or more."
  - id: "jobs"
