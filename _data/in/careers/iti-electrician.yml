  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Can I legally work as an electrical contractor right after ITI Electrician?"
            a: "Not independently as a licensed contractor. Most states require a separate Electrical Supervisor/Contractor License issued by the state Electrical Inspectorate, which typically needs the ITI certificate plus a specified period of work experience and passing a state licensing exam. The ITI trade qualifies you to work as an electrician, but independent contracting/supervisory sign-off usually needs this additional license."
          - q: "What is the difference between Electrician and Wireman trades?"
            a: "Electrician is a broader 2-year trade covering wiring, motors, electrical machines, control systems and troubleshooting. Wireman is typically a shorter, more focused 1-year trade centred specifically on domestic and building wiring installation. Electrician offers wider job scope; Wireman is a quicker, narrower entry point."
          - q: "How long is the ITI Electrician course?"
            a: "The Electrician trade is typically a 2-year NCVT-affiliated course, split into semesters combining theory, practical workshop training and employability skills."
          - q: "What government jobs can I get after ITI Electrician?"
            a: "Electrician trade-qualified candidates can apply for various technical posts in Indian Railways, state electricity boards/DISCOMs, defence technical trades, and other PSUs, most through their own trade-specific recruitment exams. Apprenticeship experience often strengthens these applications."
          - q: "Can I start my own electrical business after this ITI trade?"
            a: "Yes, this is a common and realistic path, but it typically requires obtaining the state Electrical Contractor/Supervisor License mentioned above, plus the practical experience most states require before granting it. Many electricians work as employees first to build this experience before going independent."
      - note: "*Fee and salary figures are indicative, based on publicly available information as of 2026, and vary significantly by state, institute and employer — always verify current figures directly with your target ITI and state Electrical Inspectorate."
        class: "table-note mt-lg"
