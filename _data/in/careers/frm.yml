  - id: "passing"
    hid: "passing-heading"
    eyebrow: "No fixed percentage, and no exemptions for anyone"
    heading: "Passing criteria"
    parts:
      - prose:
          - "Like CFA, GARP does not publish a fixed pass percentage. The passing score for each exam is determined by the FRM exam committee after each sitting, and your result is reported as a simple <strong>pass or fail</strong>, along with a <strong>quartile</strong> showing how your performance compared to other candidates in each topic area (not a raw score)."
      - warn_box: "<strong>Important:</strong> GARP grants no exemptions to any part of the FRM exam for any prior qualification — not for CA, CFA, CPA, or any other credential. Every candidate passes both parts independently, and Part II must be passed by December 31 of the 4th year after passing Part I, or your Part I result expires and you must re-sit it."
  - id: "experience"
    hid: "exp-heading"
    alt: true
    eyebrow: "Beyond the exams"
    heading: "Work experience & using the FRM designation"
    parts:
      - prose:
          - "Passing both exam parts alone doesn't let you use the FRM designation. GARP requires <strong>2 years of full-time, relevant professional work experience</strong> in financial risk management or a closely related field — roles like risk analysis, model validation, trading, portfolio management, treasury, audit or consulting all qualify."
          - list:
              - "Experience can be accrued <strong>before, during, or after</strong> you sit the exams — many candidates already have the two years by the time they pass Part II."
              - "You have <strong>10 years</strong> after passing Part II to submit and get this experience verified."
              - "Internships, part-time jobs and student work do <strong>not</strong> count toward the requirement."
            ticks: true
