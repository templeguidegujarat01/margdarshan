  law: { body: "South Carolina Supreme Court, Board of Law Examiners", url: "https://scbaradmissions.sccourts.org/home", stat: "UBE", exam: "Uniform Bar Exam (MBE, MEE and MPT).", note: "MPRE required (passing score 77). NextGen UBE from July 2028.", src: ncbe_sc }
  medicine:
    src: fsmb_boards
    boards:
      - { body: "South Carolina Board of Medical Examiners", url: "https://llr.sc.gov/med/" }
  cpa:
    src: nasba_boards
    boards:
      - { body: "South Carolina Board of Accountancy", url: "https://llr.sc.gov/acct/" }
  nursing:
    src: ncsbn_sc
    boards:
      - { body: "South Carolina Board of Nursing", url: "https://llr.sc.gov/nurse/" }
