# Ukraine — study abroad sheet (shape: _data/in/abroad_common.yml header). Read 2026-10-29 (Embassy of India in Kyiv, NMC).
# The latest advisory on the Embassy's site (25 Oct 2022) asks all Indians to leave Ukraine; no later advisory is listed.
