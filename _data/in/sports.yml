  # ------------------------------------------------------------------------------------------------ Gymnastics
  - slug: gymnastics
    short: "Gymnastics"
    domain: solo
    checked: 2026-10-17
    body: "International Gymnastics Federation (FIG) · Gymnastics Federation of India (GFI)"
    card: "Artistic, rhythmic and trampoline gymnastics under the FIG 2025-2028 codes — the apparatus, D + E scoring, senior and junior ages, LA28's new mixed team, SAI centres and Railways posts."
    card_facts: ["Score = Difficulty + Execution", "Senior: men 18 · women 16", "Fall = −1.0"]
    eyebrow: "Sports Cockpit · Solo, Track &amp; Pool · FIG Codes 2025-2028 · LA28 qualification"
    title: "Gymnastics — apparatus, scoring, age rules &amp; the road to LA28"
    lede: "Education Margdarshan's gymnastics map for India in simple words: the six disciplines, the apparatus for men and women, how a routine is scored (difficulty plus execution), the minimum ages to be a senior, how LA28 places are won from the 2026 and 2027 World Championships, the SAI gymnastics centres, who pays, and the Railways and other jobs that recruit gymnasts."
    official:
      - { label: "FIG LA28 artistic qualification (PDF)", url: "https://www.gymnastics.sport/publicdir/rules/files/en_1.1%20-%20Olympic%20Qualification%20System%20Los%20Angeles%202028%20Artistic.pdf" }
      - { label: "FIG rules &amp; codes", url: "https://www.gymnastics.sport/site/rules/" }
    facts:
      - { label: "Final score", value: "<strong>D-score + E-score</strong> (E out of 10)", source: fig-mag }
      - { label: "Youngest senior", value: "<strong>Men 18 · women 16</strong> in the year", source: fig-tr }
      - { label: "Fall from apparatus", value: "<strong>1.0</strong> point deducted", source: fig-mag }
      - { label: "LA28 artistic", value: "<strong>192</strong> gymnasts · teams of 5 · new mixed team", source: fig-la28 }
    sections:
      - id: rules
        nav: "Apparatus &amp; scoring"
        eyebrow: "Core rules &amp; selection formats"
        heading: "Six disciplines, the apparatus, and how a routine is scored"
        parts:
          - table:
              caption: "FIG gymnastics disciplines"
              head: ["Discipline", "What you do", "Olympic?"]
              rows:
                - ["<strong>Artistic</strong> (men MAG, women WAG)", "Routines on fixed apparatus", "Yes"]
                - ["<strong>Rhythmic</strong> (RG)", "Dance-like routines with a hand apparatus — rope, hoop, ball, clubs or ribbon; individual or group", "Yes"]
                - ["<strong>Trampoline</strong> (TRA)", "Somersaults on a trampoline (also double mini-trampoline and tumbling)", "Yes"]
                - ["Acrobatic (ACRO)", "Pairs and groups doing balances and throws", "No"]
                - ["Aerobic (AER)", "Non-stop aerobic movement patterns to music", "No"]
                - ["Parkour (PK)", "Running, jumping and climbing over an urban-style course", "No"]
            source: "fig-tr,la28-oly"
          - table:
              caption: "Artistic gymnastics apparatus"
              head: ["Men (6)", "Women (4)"]
              rows:
                - ["Floor exercise", "Vault"]
                - ["Pommel horse", "Uneven bars"]
                - ["Rings", "Balance beam"]
                - ["Vault", "Floor exercise"]
                - ["Parallel bars", "—"]
                - ["Horizontal bar", "—"]
            source: fig-la28
          - list:
              - "Each routine gets a <strong>D-score</strong> (Difficulty — how hard your skills and links are) plus an <strong>E-score</strong> (Execution — how well you do them, starting from <strong>10.00</strong> with deductions). <strong>Final score = D + E</strong>."
              - "A <strong>fall</strong> costs <strong>1.0</strong>. A routine with too few elements loses big chunks too; extra penalties are taken off the final score for things like wrong attire or taking more than 30 seconds to restart after a fall."
              - "The <strong>all-around</strong> score is the total of all apparatus — six for men, four for women. Only the D-score can be appealed."
              - "A rhythmic routine lasts <strong>1 min 15 s to 1 min 30 s</strong>."
            source: "fig-mag,fig-wag,fig-tr,fig-rg"
      - id: recognition
        nav: "Recognition"
        eyebrow: "Institutional &amp; global recognition"
        heading: "Olympics, Commonwealth Games, Asian Games — and India's gymnasts"
        parts:
          - table:
              caption: "LA28 Olympic artistic gymnastics — the hard numbers"
              head: ["Rule", "What it says"]
              rows:
                - ["Events", "Men 8 (team, all-around, 6 apparatus) · women 6 (team, all-around, 4 apparatus) · <strong>1 mixed team (new)</strong>"]
                - ["Places", "<strong>192</strong> (96 men, 96 women); a country has at most <strong>one team of five</strong> (no reserves) or up to three individuals"]
                - ["How you qualify", "Top 3 teams at the <strong>2026 World Championships</strong>; more teams, individuals, all-around and apparatus places at the <strong>2027 World Championships</strong>; then the <strong>2028 Apparatus World Cup series</strong>"]
                - ["Age", "Men born on or before <strong>31 Dec 2010</strong>; women on or before <strong>31 Dec 2012</strong>"]
                - ["Licence", "A valid <strong>FIG licence</strong> to the end of the Games"]
            source: fig-la28
          - list:
              - "Artistic gymnastics is one of only <strong>10 sports</strong> at the Glasgow 2026 Commonwealth Games; artistic, rhythmic and trampoline are all in the 2026 Asian Games."
              - "<strong>Dipa Karmakar</strong> became the first Indian gymnast to win gold at the Asian Gymnastics Championships, and <strong>Pranati Nayak</strong> has won a bronze in women's vault at an FIG World Cup."
            source: "cwg26,ag26,air-dipa,air-pranati"
          - table:
              caption: "Government cash award for a senior medal (₹ lakh)"
              head: ["Event", "Gold", "Silver", "Bronze"]
              rows:
                - ["<strong>Olympic Games</strong>", "75", "50", "30"]
                - ["Asian Games / Commonwealth Games", "30", "20", "10"]
                - ["FIG World Championship (every year)", "10", "7", "4"]
                - ["Asian Championship (every year)", "3.75", "2.5", "1.25"]
            source: myas-cash
          - note: "The World and Asian Championship awards cover <strong>artistic, rhythmic, trampoline, aerobic and acrobatic</strong> gymnastics."
            source: myas-cash
      - id: eligibility
        nav: "Age rules"
        eyebrow: "Physical benchmarks &amp; anti-doping"
        heading: "The age you must reach — and anti-doping"
        parts:
          - table:
              caption: "FIG minimum and junior ages (age in the year of competition)"
              head: ["Discipline", "Senior from", "Junior"]
              rows:
                - ["Men's artistic", "<strong>18</strong>", "15–18 (an 18-year-old is declared junior or senior for the year)"]
                - ["Women's artistic", "<strong>16</strong>", "14–15 (WAG youth 12–14)"]
                - ["Rhythmic", "<strong>16</strong>", "14–15"]
                - ["Trampoline", "<strong>17</strong>", "13–16"]
                - ["Acrobatic", "15", "13–19"]
                - ["Aerobic", "18", "15–17"]
                - ["Parkour", "17", "14–16"]
            source: fig-tr
          - list:
              - "Once you have competed at a senior World Championship, continental championship, World Cup or multi-sport Games, you <strong>cannot go back</strong> to junior events."
              - "Organisers check <strong>age and nationality</strong> at accreditation for every official FIG event."
            source: fig-tr
          - list:
              - "Under the anti-doping code you must be <strong>available for testing</strong> and check every medicine against the <strong>Prohibited List</strong>; apply to NADA for a <strong>TUE</strong> if you need a banned medicine."
            source: nada-rr
      - id: roadmap
        nav: "Roadmap"
        eyebrow: "Grassroots-to-elite residential pipeline"
        heading: "From the school mat to the national camp"
        parts:
          - table:
              caption: "The gymnastics ladder"
              head: ["Step", "Age", "What happens"]
              rows:
                - ["1. Early start", "From childhood", "Join a club, school or state centre and learn the basics"]
                - ["2. SAI Training Centre", "12–18", "Up to 8th at Sub-Junior/Junior Nationals, or top 3 in the state, then a battery of tests"]
                - ["3. Khelo India Youth Games", "Under 18", "Gymnastics is one of the 27 KIYG sports; medals count for central jobs"]
                - ["4. Junior nationals &amp; FIG junior events", "WAG 14–15 · MAG 15–18", "Junior World Championships and continental events"]
                - ["5. SAI NCOE / national camp", "Scouted", "Residential training at Aurangabad, Kolkata or IG Stadium Delhi"]
                - ["6. Senior", "Women 16+ · men 18+", "World Cups, Asian and World Championships — the LA28 route"]
            source: "sai-schemes,kiyg25,dopt-2024,fig-tr,fig-la28"
      - id: academies
        nav: "Centres"
        eyebrow: "Top elite academies &amp; cities"
        heading: "Where India's gymnasts train"
        parts:
          - table:
              caption: "SAI National Centres of Excellence with gymnastics"
              head: ["Centre", "Other sports there"]
              rows:
                - ["<strong>Aurangabad</strong> (Chhatrapati Sambhajinagar), Maharashtra", "Boxing, fencing, hockey, weightlifting"]
                - ["<strong>Kolkata</strong>, West Bengal", "Archery, athletics, hockey, table tennis"]
                - ["<strong>IG Stadium, New Delhi</strong>", "Cycling"]
            source: sai-schemes
          - note: "Gymnastics is also taught at SAI Training Centres (ages 12–18) and in SAI's school and college extension centres."
            source: sai-schemes
      - id: costs
        nav: "Cost"
        eyebrow: "Equipment costs &amp; who pays"
        heading: "Halls, apparatus and who pays the bills"
        parts:
          - list:
              - "Training needs a hall with apparatus and mats; SAI centres provide these to the gymnasts they select. Education Margdarshan does not print shop prices for attire or grips — no governing body publishes them."
              - "A <strong>FIG licence</strong> is needed for every FIG-sanctioned event and must stay valid to the end of the competition."
            source: "sai-schemes,fig-tr"
          - table:
              caption: "Who pays — gymnastics ladder"
              head: ["Stage", "Paid by", "What you get"]
              rows:
                - ["SAI centre trainee", "Sports Authority of India", "Coaching, boarding, sports science, diet"]
                - ["Khelo India athlete", "Ministry of Youth Affairs &amp; Sports", "<strong>₹6.28 lakh a year</strong> incl. ₹1.20 lakh cash"]
                - ["Olympic prospect", "TOPS Core Group", "<strong>₹50,000 a month</strong> + approved training plan"]
                - ["Athlete in hardship", "PDU National Welfare Fund", "Up to ₹2.50 lakh"]
            source: "sai-schemes,pib-support"
      - id: earnings
        nav: "Earnings &amp; jobs"
        eyebrow: "Earning channels &amp; central job quotas"
        heading: "Railways, CRPF and other sports-quota jobs"
        parts:
          - list:
              - "<strong>Western Railway's 2026-27 sports quota</strong> had men's gymnastics posts at <strong>Level 5/4 and Level 3/2</strong>: all-rounder, floor exercise, pommel horse, still rings, vault, parallel bars and horizontal bar. Railways treat the <strong>Junior National Gymnastics Championship</strong> as the junior national for gymnastics."
              - "<strong>CRPF's 2026 sports quota</strong> had <strong>gymnastics (all-rounder)</strong> posts for men."
            source: "rrc-wr26,crpf26"
          - list:
              - "Gymnastics is one of the <strong>65 sports</strong> in the central sports quota for <strong>Group C</strong> posts, with up to 5 years' age relaxation (10 for SC/ST)."
              - "Medals at the Olympics, Asian Games, Commonwealth Games or World Championships can bring up to <strong>three out-of-turn promotions</strong>."
            source: dopt-2022
          - list:
              - "<strong>Pension to Meritorious Sportspersons</strong>: ₹12,000–20,000 a month after retirement."
            source: pib-support
      - id: traps
        nav: "Red flags"
        eyebrow: "Disqualification traps"
        heading: "Mistakes that cost gymnasts points and places"
        parts:
          - list:
              - "<strong>Short routines</strong> — too few counted elements bring a heavy neutral deduction."
              - "<strong>Wrong attire, slow restart after a fall (over 30 s), or a spotter where none is allowed</strong> — each is taken off the final score."
            source: fig-mag
          - list:
              - "<strong>Competing senior too early</strong> — after one senior World Cup or championship you cannot return to junior events."
              - "<strong>Letting your FIG licence lapse</strong> before an event."
            source: fig-tr
      - id: doubts
        nav: "Player doubts"
        eyebrow: "Real-world player doubts"
        heading: "Starting age, jobs and money — straight answers"
        parts:
          - qa:
              q: "My child is 10. Is that too late — or too early?"
              a: "Neither. FIG keeps children out of senior events until <strong>16 (women) or 18 (men)</strong>, and junior events start at <strong>14–15</strong>. That leaves years for basics. SAI Training Centres take ages <strong>12–18</strong>, so aim to be ready for their tests by 12."
            source: "fig-tr,sai-schemes"
          - qa:
              q: "Which government jobs can gymnastics get me?"
              a: "Railways recruit gymnasts: Western Railway's 2026-27 notice had men's gymnastics posts at <strong>Level 5/4 and 3/2</strong> on every apparatus. <strong>CRPF's 2026 quota</strong> had gymnastics posts too, and DoPT lists gymnastics for central <strong>Group C</strong> posts."
            source: "rrc-wr26,crpf26,dopt-2022"
          - table:
              caption: "Sports-quota job routes open in 2026 — age, qualifying results, pay"
              head: ["Route", "Age", "Main qualifying results", "Pay level"]
              rows:
                - ["Railways <strong>Level 5/4</strong> (graduates)", "18–25 on 1 Jan 2027", "Played the <strong>Olympics</strong>, or top 3 at a World Cup, World Championship, Asian Games, Commonwealth Games or Youth Olympics", "Level 5/4"]
                - ["Railways <strong>Level 3/2</strong> (12th, or 10th + apprenticeship)", "18–25 on 1 Jan 2027", "Top 3 at <strong>Senior, Youth or Junior Nationals</strong>, National Games or All India Inter-University; or Federation Cup gold", "Level 3/2"]
                - ["Railways <strong>Level 1</strong>", "18–25 on 1 Jan 2027", "Played for your state and finished <strong>at least 8th at Senior Nationals</strong>; or top 3 at the Federation Cup", "Level 1"]
                - ["CRPF <strong>Head Constable (GD)</strong> (10+2)", "18–23 on 1 Aug 2026; sportspersons get <strong>+5 years</strong> (OBC +8, SC/ST +10)", "Played for India; or top 3 for your state at Nationals or National Games; or <strong>gold/silver at Junior Nationals</strong>", "Level 4 · ₹25,500–81,100"]
                - ["CRPF <strong>Constable (GD)</strong> (10th pass)", "18–23 on 1 Aug 2026; sportspersons get <strong>+5 years</strong> (OBC +8, SC/ST +10)", "Played for your state at <strong>Senior or Junior Nationals</strong>; or top 3 at SGFI school nationals or Khelo India Games", "Level 3 · ₹21,700–69,100"]
            source: "rrc-wr26,crpf26"
          - note: "Railways count results from <strong>1 April 2024</strong>; CRPF counts the <strong>two years before 30 September 2026</strong>. Railways fee ₹500 (₹400 back if you attend the trial; ₹250, refunded in full on attending, for SC/ST, women, PwBD, minorities, ex-servicemen and EBC). CRPF fee ₹100 for UR/OBC/EWS men; free for women, SC, ST and ex-servicemen. CRPF picks sign a <strong>₹1 lakh bond to serve at least 3 years</strong>."
            source: "rrc-wr26,crpf26"
          - qa:
              q: "We are a lower-middle-class family. How do we keep costs down?"
              a: "Aim for the free seats: SAI Training Centres and the NCOEs at <strong>Aurangabad, Kolkata and Delhi</strong> give coaching, boarding, sports science and diet on proper apparatus; a Khelo India athlete gets <strong>₹6.28 lakh a year</strong>. A gymnast in hardship can apply to the PDU National Welfare Fund for up to ₹2.50 lakh."
            source: "sai-schemes,pib-support"
          - qa:
              q: "Does any 'national' certificate count for a job?"
              a: "No. Railways will <strong>not recruit on a certificate from a federation MoYAS did not recognise</strong> at the time of the championship, and CRPF counts only championships of MoYAS-recognised federations or the IOA's National Games. Check that your nationals are held by the federation recognised by the Sports Ministry before you rely on the certificate."
            source: "rrc-wr26,crpf26"
