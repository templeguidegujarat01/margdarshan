# Advanced Manufacturing careers (USA Master Plan Phase 6). Schema: comment at the top of _includes/us-career-overview.html.
# Every fact is copied from the page its `source` names, opened 2026-10-21: BLS Occupational Outlook Handbook (pay May
# 2025, jobs 2025, outlook 2025–35; pages last modified 27 Aug 2026) and NCEES (_data/us/sources.yml). The production
# trades of this cluster (machinist, CNC tool operator, industrial machinery mechanic, welder) live in
# _data/us/cte_careers.yml and the us/cte/ pages; this file holds the engineering careers.
# A `pathway:` entry keeps its existing us/careers/<pathway>/ page and only gets a roadmap here.
# Batch notes: docs/us-edition/PHASE-6-CONSTRUCTION-MANUFACTURING.md.
checked: 2026-10-21
review_by: 2027-04-21
list:

  # 365,100 jobs
  - slug: industrial-engineer
    short: "Industrial Engineer"
    title: "Industrial engineer: bachelor's degree, optional PE license"
    eyebrow: "Advanced Manufacturing · Engineering"
    lede: "Industrial engineers typically need a bachelor's degree in industrial engineering or a related field such as mechanical or electrical engineering. No license is needed for entry-level jobs; experienced engineers may earn a PE license."
    for: "Students who like math, statistics and finding faster, safer and cheaper ways to make things."
    soc: ["17-2112"]
    does: { text: "Industrial engineers design, develop, and test integrated systems for managing industrial production processes.", source: ooh_qf_indeng }
    work: { text: "Industrial engineers work in a variety of settings, such as offices and manufacturing plants. Most work full time, and some work more than 40 hours per week.", source: ooh_qf_indeng }
    become: { text: "Industrial engineers typically need a bachelor’s degree in industrial engineering or a related field, such as mechanical or electrical engineering.", source: ooh_qf_indeng }
    metrics: { pay: 102440, pay_hour: "49.25", pay_by: "Industrial engineers", jobs: 365100, outlook: 12, outlook_words: "Much faster than average", change: 45400, entry: "Bachelor's degree", training: "None", source: ooh_qf_indeng }
    license_text: "Optional (PE)"
    routes:
      - id: bachelor
        title: "Bachelor's in industrial engineering"
        tag: "Typical"
        who: "High school students should take algebra, trigonometry, calculus, computer science, chemistry and physics."
        steps:
          - { tag: "Start", title: "High school: math and science", text: "", kind: start, source: ooh_indeng }
          - { tag: "About 4 years", title: "Bachelor's in industrial engineering (or mechanical, manufacturing or general engineering)", text: "Statistics, production systems planning and manufacturing systems design, with lab work. Human factors engineers may need a bachelor's in psychology.", kind: stage, source: ooh_indeng }
          - { tag: "During college", title: "Internship or co-op", text: "", kind: stage, source: ooh_indeng }
          - { tag: "Goal", title: "Industrial engineer", text: "Some advance to management positions.", kind: goal, source: ooh_indeng }
      - id: five-year
        title: "5-year bachelor's + master's program"
        tag: "Some colleges"
        who: "Some colleges and universities offer 5-year programs that lead to both a bachelor's and a master's degree."
        steps:
          - { tag: "Start", title: "High school diploma", text: "", kind: start, source: ooh_indeng }
          - { tag: "5 years", title: "Combined bachelor's and master's", text: "", kind: stage, source: ooh_indeng }
          - { tag: "Goal", title: "Industrial engineer", text: "", kind: goal, source: ooh_qf_indeng }
      - id: pe
        title: "Optional: Professional Engineer (PE) license"
        tag: "Experienced engineers"
        who: "A PE can oversee other engineers, sign off on projects and provide services directly to the public."
        steps:
          - { tag: "Start", title: "Bachelor's or higher in engineering", text: "", kind: start, source: ooh_indeng }
          - { tag: "Exam", title: "FE exam", text: "Passing usually leads to Engineer in Training (EIT) or Engineer Intern (EI) status.", kind: exam, source: ncees_fe, href: "us/professional-licenses/pe/#exams", link: "FE and PE exams" }
          - { tag: "Several years", title: "Relevant work experience", text: "", kind: stage, source: ooh_indeng }
          - { tag: "Exam", title: "PE exam", text: "", kind: exam, source: ncees_pe }
          - { tag: "Goal", title: "State PE license", text: "", kind: goal, source: ooh_indeng, href: "us/professional-licenses/pe/", link: "PE license steps" }
    certs:
      - { name: "Professional credential", who: "Voluntary", kind: "Voluntary", text: "Not required; some industrial engineers choose to earn one.", source: ooh_indeng }

  # 298,500 jobs (mechanical engineers; existing pathway page us/careers/mechanical-engineering/)
  - slug: mechanical-engineer
    pathway: mechanical-engineering
    short: "Mechanical Engineer"
    title: "Mechanical engineer: ABET degree, then an optional PE license"
    eyebrow: "Advanced Manufacturing · Engineering"
    lede: "Mechanical engineers typically need a bachelor's degree in mechanical engineering or mechanical engineering technology. Entry-level jobs need no license; mechanical engineers who sell services to the public must be licensed in every state and D.C."
    for: "Students who like physics and math and want to design and test machines, engines and devices."
    routes:
      - id: bachelor
        title: "Bachelor's in mechanical engineering (or ME technology)"
        tag: "Typical"
        who: "Most employers prefer students from an accredited program; an accredited degree is usually necessary for a PE license."
        steps:
          - { tag: "Start", title: "High school: math and science", text: "", kind: start, source: ooh_mecheng }
          - { tag: "About 4 years", title: "Bachelor's in mechanical engineering", text: "Mathematics, life and physical sciences, engineering and design. Technology programs focus more on practical application.", kind: stage, source: ooh_mecheng }
          - { tag: "Optional", title: "5- or 6-year co-op or bachelor's + master's plan", text: "Classroom study combined with paid practical work.", kind: stage, source: ooh_mecheng }
          - { tag: "Goal", title: "Mechanical engineer", text: "Licensure is not required for entry-level positions.", kind: goal, source: ooh_mecheng }
      - id: pe
        title: "Professional Engineer (PE) license"
        tag: "Later in the career"
        who: "A PE can oversee other engineers, sign off on projects and provide services directly to the public."
        steps:
          - { tag: "Start", title: "Degree from an accredited engineering program", text: "", kind: start, source: ooh_mecheng }
          - { tag: "Exam", title: "FE exam", text: "Can be taken after the bachelor's degree; those who pass are called engineers in training (EITs) or engineer interns (EIs).", kind: exam, source: ooh_mecheng, href: "us/professional-licenses/pe/#exams", link: "FE and PE exams" }
          - { tag: "Typically 4+ years", title: "Relevant work experience", text: "", kind: stage, source: ooh_mecheng }
          - { tag: "Exam", title: "PE exam (Principles and Practice of Engineering)", text: "", kind: exam, source: ncees_pe }
          - { tag: "Goal", title: "State PE license", text: "Several states require continuing education to renew every year.", kind: goal, source: ooh_mecheng, href: "us/professional-licenses/pe/", link: "PE license steps" }
    certs:
      - { name: "Specialty certification", who: "Professional organizations", kind: "Voluntary", text: "Certification programs show competency in specific fields of mechanical engineering.", source: ooh_mecheng }

  # 297,900 jobs (electrical and electronics engineers; existing pathway page us/careers/electrical-engineering/)
  - slug: electrical-engineer
    pathway: electrical-engineering
    short: "Electrical & Electronics Engineer"
    title: "Electrical engineer: engineering degree, internships, optional PE"
    eyebrow: "Advanced Manufacturing · Engineering"
    lede: "Electrical and electronics engineers typically need at least a bachelor's degree in a related engineering field, and employers value internships or co-op experience. Some employers prefer a master's; a PE license is optional."
    for: "Students who like physics, calculus and circuits and want to design electrical and electronic systems."
    routes:
      - id: bachelor
        title: "Bachelor's in electrical or electronics engineering"
        tag: "Typical"
        who: "High school students benefit from physics and math, including algebra, trigonometry and calculus."
        steps:
          - { tag: "Start", title: "High school: physics and math", text: "", kind: start, source: ooh_eleceng }
          - { tag: "About 4 years", title: "Bachelor's in electrical, electronics or a related engineering field", text: "Digital systems design, calculus and electrical circuit theory, with classroom, lab and field study.", kind: stage, source: ooh_eleceng }
          - { tag: "During college", title: "Co-op program or internship", text: "", kind: stage, source: ooh_eleceng }
          - { tag: "Goal", title: "Electrical or electronics engineer", text: "Some advance to supervisory or management positions.", kind: goal, source: ooh_eleceng }
      - id: master
        title: "Master's degree"
        tag: "Some employers"
        who: "Some employers may prefer to hire workers with a master's degree."
        steps:
          - { tag: "Start", title: "Bachelor's degree", text: "", kind: start, source: ooh_eleceng }
          - { tag: "Graduate", title: "Master's in electrical engineering", text: "", kind: stage, source: ooh_eleceng }
          - { tag: "Goal", title: "Electrical engineer", text: "", kind: goal, source: ooh_eleceng }
      - id: pe
        title: "Optional: Professional Engineer (PE) license"
        tag: "Experienced engineers"
        who: "Licensure is not required for entry-level positions; a PE can oversee other engineers, sign off on projects and serve the public directly."
        steps:
          - { tag: "Start", title: "Bachelor's or higher in engineering", text: "", kind: start, source: ooh_eleceng }
          - { tag: "Exam", title: "FE exam", text: "Passing usually leads to Engineer in Training (EIT) or Engineer Intern (EI) status.", kind: exam, source: ncees_fe, href: "us/professional-licenses/pe/#exams", link: "FE and PE exams" }
          - { tag: "Several years", title: "Relevant work experience", text: "", kind: stage, source: ooh_eleceng }
          - { tag: "Exam", title: "PE exam", text: "", kind: exam, source: ncees_pe }
          - { tag: "Goal", title: "State PE license", text: "", kind: goal, source: ooh_eleceng, href: "us/professional-licenses/pe/", link: "PE license steps" }
