sections:
  - id: "quick"
    hid: "quick-heading"
    alt: true
    eyebrow: "Quick answers"
    heading: "Investment Adviser at a glance"
    intro: "Check whether your Class 12 background qualifies. Duration and pay are in the summary at the top of the page."
    parts:
      - subhead: "Can I apply from my stream?"
      - streams:
          - label: "Science"
            fit: "Eligible"
            tone: "y"
            icon: "science"
          - label: "Commerce"
            fit: "Eligible"
            tone: "y"
            icon: "commerce"
          - label: "Arts / Humanities"
            fit: "Eligible"
            tone: "y"
            icon: "arts"
      - note: "Any stream; Commerce helps, but the legal requirement is a graduate degree plus NISM certifications."
  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What does an Investment Adviser do?"
    parts:
      - overview:
          points:
            - "RIAs assess a client's goals and risk, build financial plans and recommend investments — for a fee paid by the client, not commissions from products."
            - "They must keep records, follow SEBI's code of conduct and keep client advice separate from product distribution."
            - "Many work independently; others join advisory firms, wealth teams or fintech platforms."
  - id: "who"
    hid: "who-heading"
    alt: true
    eyebrow: "Fit check"
    heading: "Who should become an Investment Adviser"
    parts:
      - fit:
          match:
            - "Enjoy markets, planning and explaining money to people."
            - "Want to build your own client-facing practice."
            - "Are comfortable with regulation and ethics rules."
          mismatch:
            - "Want to earn commissions from selling products — that is distribution, not advice."
            - "Dislike paperwork and compliance."
            - "Expect quick income — clients come through trust."
  - id: "eligibility"
    hid: "elig-heading"
    eyebrow: "Eligibility"
    heading: "What you need, stage by stage"
    parts:
      - elig_list:
          - "A <strong>graduate degree</strong> in any discipline (SEBI relaxed the earlier postgraduate requirement in its December 2024 amendments)."
          - "Pass <strong>NISM Series X-A</strong> (Level 1) and <strong>NISM Series X-B</strong> (Level 2)."
          - "Meet SEBI's fit-and-proper criteria and the deposit and other registration conditions."
          - "Keep certifications valid as SEBI requires."
  - id: "roadmap"
    hid: "roadmap-heading"
    alt: true
    eyebrow: "Step-by-step"
    heading: "Your full path to becoming an Investment Adviser"
    parts:
      - steps:
          - title: "Graduate"
            text: "Finance, commerce or economics helps."
          - title: "NISM X-A"
            text: "Level 1: basics of personal finance and regulation."
          - title: "NISM X-B"
            text: "Level 2: advanced planning and advisory."
          - title: "Apply to SEBI"
            text: "Registration as an individual Investment Adviser."
          - title: "Build a practice"
            text: "Fee-only clients, compliance and record-keeping."
  - id: "exams"
    hid: "exams-heading"
    eyebrow: "Exams & licences"
    heading: "NISM certifications and SEBI registration"
    parts:
      - chips:
          - label: "NISM Series X-A"
            text: "Investment Adviser (Level 1) certification."
            source: "nism"
          - label: "NISM Series X-B"
            text: "Investment Adviser (Level 2) certification."
            source: "nism"
          - label: "SEBI registration"
            text: "Application under the SEBI (Investment Advisers) Regulations, 2013 as amended."
            source: "sebi"
  - id: "salary"
    hid: "salary-heading"
    alt: true
    eyebrow: "Indicative figures"
    heading: "Investment Adviser pay in India"
    intro: "Pay varies a lot by employer, city and whether you practise independently; these are broad, commonly reported ranges, not guarantees."
    parts:
      - salary:
          - label: "Starting out"
            value: "Fee-based, slow build"
            text: "Independent RIAs grow income as their client base grows."
          - label: "Advisory firm roles"
            value: "Salaried"
            text: "Wealth and advisory firms hire certified staff."
          - label: "Established RIA"
            value: "High"
            text: "A large, loyal client base can earn very well."
  - id: "jobs"
    hid: "jobs-heading"
    eyebrow: "Where they work"
    heading: "Employers & growth path"
    parts:
      - chips:
          - label: "Employers"
            text: "Advisory firms, wealth-management teams, fintech platforms, family offices"
          - label: "Growth path"
            text: "Associate → RIA → principal of an advisory firm"
          - label: "Related credentials"
            text: "CFA and financial-planning credentials add depth but are not SEBI registration"
  - id: "proscons"
    hid: "pc-heading"
    alt: true
    eyebrow: "Honest take"
    heading: "Advantages and disadvantages"
    parts:
      - proscons:
          pros:
            - "Low entry barrier: graduate + NISM."
            - "Fee-only, client-first career."
            - "Independent practice possible."
          cons:
            - "Client acquisition is slow."
            - "Strict compliance and record-keeping."
            - "Cannot earn product commissions as an adviser."
  - hid: "related-heading"
    alt: true
    eyebrow: "Related careers"
    heading: "If you're considering Investment Adviser, also look at"
    parts:
      - related:
          - name: "Research Analyst"
            sub: "SEBI-registered stock research"
            href: "research-analyst.html"
          - name: "CFA"
            sub: "Investment analysis"
            href: "cfa.html"
          - name: "B.Com"
            sub: "Commerce degree"
            href: "bcom.html"
          - name: "Bachelor of Finance"
            sub: "Finance degree"
            href: "bachelor-of-finance.html"
  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Can a graduate from any stream become a SEBI RIA?"
            a: "Yes, under the amended regulations a graduate degree plus NISM X-A and X-B is the qualification requirement."
          - q: "Is a mutual fund distributor an investment adviser?"
            a: "No. Distributors earn commissions on products; RIAs charge clients a fee for advice. SEBI keeps the two separate."
          - q: "Do I need a CFA to be an RIA?"
            a: "No. CFA is a respected credential, but SEBI registration needs NISM certifications."
      - note: "*Pay figures are indicative unless they quote an official pay level, and rules change: confirm eligibility, dates and fees on the official websites listed under Sources before you act."
        class: "table-note mt-lg"
