      - id: rules
        nav: "Rules"
        eyebrow: "Core rules &amp; selection formats"
        heading: "How handball is played"
        parts:
          - p: "Handball is a fast team game: players pass and bounce the ball with their <strong>hands</strong> and throw it into a goal 3 m wide. A team has up to <strong>16 players</strong>, but only <strong>7</strong> (six court players and a goalkeeper) may be on court at once. Only the goalkeeper may be inside the <strong>goal area</strong> (the 6-metre line)."
            source: ihf-rog
          - list:
              - "You may take <strong>at most 3 steps</strong> with the ball and <strong>hold it for at most 3 seconds</strong>; then pass, shoot or bounce it."
              - "Court players may not step into the goal area; the goalkeeper may stop the ball there with any part of the body."
              - "Holding on to the ball without trying to attack is <strong>passive play</strong> and gives the ball to the other side."
              - "A clear scoring chance destroyed by a foul brings a <strong>7-metre throw</strong> (penalty)."
              - "Serious or repeated fouls bring a <strong>2-minute suspension</strong>: the team plays a player short for two minutes."
            source: ihf-rog
          - table:
              caption: "Playing time and ball size by age (IHF)"
              head: ["Group", "Playing time", "Ball (with resin)"]
              rows:
                - ["Men 16+ and senior", "2 × 30 min", "Size 3 — 58–60 cm, 425–475 g"]
