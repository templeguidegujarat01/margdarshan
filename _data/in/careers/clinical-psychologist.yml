  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "How many years does it take to become a Clinical Psychologist in India?"
            a: "Roughly 7-8 years after Class 12 — a 3-year BA/B.Sc Psychology, a 2-year MA/M.Sc Psychology, and a 2-year M.Phil in Clinical Psychology, followed by supervised practice before independent registration. It's one of the longer, more demanding paths in the Arts stream."
          - q: "What is the difference between a Clinical Psychologist and a Psychiatrist?"
            a: "A Psychiatrist is a medical doctor (MBBS + MD Psychiatry) who can diagnose mental illness and prescribe medication. A Clinical Psychologist has a non-medical postgraduate qualification (MA + M.Phil) and provides therapy, psychological assessment and counselling, but cannot prescribe medicines in most Indian states."
          - q: "What is RCI and why does it matter?"
            a: "The Rehabilitation Council of India (RCI) is the statutory body that recognises M.Phil Clinical Psychology programmes and registers qualified professionals to practise. Practising clinical psychology without RCI recognition is not considered a licensed, legitimate professional pathway in India."
          - q: "Is the M.Phil in Clinical Psychology hard to get into?"
            a: "Yes, extremely. Seats at recognised institutes like NIMHANS Bengaluru are very limited nationally each year relative to the large number of MA Psychology graduates applying, making this one of the most competitive postgraduate entrance processes in the Arts stream."
          - q: "Can I work in mental health without completing the full M.Phil path?"
            a: "Yes, but not as a licensed clinical psychologist. With an MA in Psychology, you can work in roles like school counsellor, Human Resources (HR) wellness roles, or as a counsellor in some settings, though scope and legal recognition for clinical diagnosis/treatment remain tied to the M.Phil and RCI registration."
      - note: "*Fee and salary figures are indicative, based on publicly available information as of 2026, and vary significantly by institution, city and experience level — always verify current figures on the official institute website."
        class: "table-note mt-lg"
