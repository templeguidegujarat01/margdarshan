  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What is B.Com?"
    parts:
      - overview:
          points:
            - "Bachelor of Commerce (B.Com) is a 3-year (6-semester) undergraduate degree covering the fundamentals of accounting, finance, taxation, business law and economics."
            - "It's offered by hundreds of universities across India — from large central universities like Delhi University to state universities, private universities and distance/online providers like IGNOU."
            - "Unlike Chartered Accountant (CA) or CS, B.Com is a conventional university degree, not a professional body qualification — you attend regular semesters and exams rather than clearing standalone institute-administered levels."
          more:
            - "It's often the starting point students build on with a professional course (CA, CS, Cost and Management Accountant (CMA)), a postgraduate degree (M.Com, MBA), or go straight into a job."
  - id: "who"
    hid: "who-heading"
    alt: true
    eyebrow: "Fit check"
    heading: "Who should choose B.Com — and who should think twice"
    parts:
      - fit:
          match:
            - "Want a broad, affordable foundation in business and finance without committing to a narrow professional track yet."
            - "Plan to add CA, CS, CMA or an MBA afterward and want a degree that supports that."
            - "Want a conventional university experience (regular classes, semesters) rather than self-study-heavy professional courses."
          mismatch:
            - "Already know you want a specific professional qualification like CA — you could register for CA Foundation directly instead."
            - "Want a management/leadership-focused curriculum from day one — Bachelor of Business Administration (BBA) is generally the closer fit."
            - "Expect a plain B.Com alone to guarantee a high starting salary — it's a solid foundation, not a high-ceiling credential by itself."
  - id: "eligibility"
    hid: "elig-heading"
    eyebrow: "Eligibility"
    heading: "Who can apply for B.Com"
    parts:
      - elig_list:
          - "Class 12 pass (10+2) from a recognised board — CBSE, ICSE, or any state board."
          - "Open to <strong>any stream</strong> at most universities, including Delhi University — Commerce background is preferred but not mandatory at the majority of institutions."
          - "Minimum marks typically <strong>45-60% aggregate</strong> in Class 12, varying by institution (often lower for reserved categories where applicable)."
      - note_box: "Eligibility cutoffs change every year and vary by college — always confirm the exact current requirement on your target university's official admission page before applying."
