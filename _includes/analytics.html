<!-- Google Analytics 4 (Measurement ID: G-QJBL4452FF) — loaded in <head> on every page via _layouts/default.html.
     Phase 16: gtag.js (~180 KB, ~0.6 s of main-thread work on a phone) is fetched after the page has loaded
     and the browser is idle, so it no longer competes with the page's first paint. The dataLayer queue below
     is created immediately, so the page view is still recorded when the library arrives. -->
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-QJBL4452FF');
  (function(){
    function load(){ var s = document.createElement('script'); s.async = true; s.src = 'https://www.googletagmanager.com/gtag/js?id=G-QJBL4452FF'; document.head.appendChild(s); }
    function idle(){ if('requestIdleCallback' in window) requestIdleCallback(load, {timeout: 3000}); else setTimeout(load, 1); }
    if(document.readyState === 'complete') idle(); else window.addEventListener('load', idle);
  })();
</script>
