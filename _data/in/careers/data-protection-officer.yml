  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Is a DPO mandatory for every company in India?"
            a: "The DPDP Act requires it for Significant Data Fiduciaries, which the Government notifies. Other organisations must still name a contact person for data-privacy questions."
          - q: "What degree do I need to become a DPO?"
            a: "The law does not prescribe one. Law, cybersecurity and compliance backgrounds are the common routes."
          - q: "Are privacy certifications compulsory?"
            a: "No. They can help in hiring but are private credentials, not a Government licence."
      - note: "*Pay figures are indicative unless they quote an official pay level, and rules change: confirm eligibility, dates and fees on the official websites listed under Sources before you act."
        class: "table-note mt-lg"
