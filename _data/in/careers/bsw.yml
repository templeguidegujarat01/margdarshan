    parts:
      - prose:
          - "BSW is one of the more affordable degrees in India at government-funded colleges — total fees for the full 3-year course are typically in the range of <strong>₹15,000-60,000</strong>. Private colleges and deemed universities charge more, often ₹1-2.5 lakh per year. Merit-based, SC/ST and income-linked scholarships are available at most government institutions, and some institutes offer fee waivers tied to development-sector career commitments. Always confirm current fees directly on your target college's official admission page."
