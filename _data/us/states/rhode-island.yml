# Rhode Island (USA 50-state licensure portal, 2026-10-22). Schema: _data/us/state_index.yml. Boards tier: the
# licensing boards for lawyers, physicians, CPAs and nurses, copied from the national directories of state boards (NCBE,
# FSMB, NASBA, NCSBN). Diploma, state test, tuition, aid, jobs and apprenticeship blocks are still in the Phase 11 queue;
# the page prints only the blocks that exist.
name: "Rhode Island"
abbr: RI
checked: 2026-10-22
review_by: 2027-04-22
lede: "In Rhode Island, the Rhode Island Supreme Court Clerk's Office handles bar admission for lawyers, the Rhode Island Board of Medical Licensure and Discipline licenses physicians, the Rhode Island Board of Accountancy licenses CPAs and the Rhode Island Board of Nurse Registration and Nursing Education licenses registered nurses."

boards:
  # 50-state portal (2026-10-22): bar admission agency (NCBE jurisdiction page), medical board(s) (FSMB directory),
  # board of accountancy (NASBA directory), board of nursing (NCSBN member page). Links checked 2026-10-22.
  law: { body: "Rhode Island Supreme Court Clerk's Office", url: "https://www.courts.ri.gov/attorney-resources/Pages/Admission-to-the-Rhode-Island-Bar.aspx", stat: "UBE", exam: "Uniform Bar Exam (MBE, MEE and MPT).", note: "MPRE required (passing score 80). NextGen UBE from July 2028.", src: ncbe_ri }
  medicine:
    src: fsmb_boards
    boards:
      - { body: "Rhode Island Board of Medical Licensure and Discipline", url: "https://health.ri.gov/licensing/physicians" }
  cpa:
    src: nasba_boards
    boards:
      - { body: "Rhode Island Board of Accountancy", url: "https://dbr.ri.gov/building-design-fire-professionals-board-accountancy/board-accountancy" }
  nursing:
    src: ncsbn_ri
    boards:
      - { body: "Rhode Island Board of Nurse Registration and Nursing Education", url: "https://health.ri.gov/" }
