  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Is Electrical Engineering a good career in 2026?"
            a: "Yes, particularly for engineers willing to specialise. India's renewable energy target and the EV transition are creating fast-growing, well-paid roles in grid integration, battery systems and power electronics, on top of the traditional strong PSU/power-sector pathway through GATE. Generalist electrical roles without any added specialisation face more competition and more modest pay."
          - q: "What's the real difference between Electrical (EEE) and Electronics (ECE)?"
            a: "They share a common first-year foundation but diverge significantly after that. Electrical Engineering focuses on power generation, transmission, electrical machines and power electronics. <a href=\"electronics.html\">Electronics (ECE)</a> focuses on circuits, communication systems, embedded systems and semiconductors. Some colleges also offer a combined \"Electrical and Electronics Engineering (EEE)\" programme — always check the actual syllabus rather than assuming from the name."
          - q: "What's the real salary difference between private and PSU jobs after Electrical Engineering?"
            a: "Private-sector fresher salaries commonly start around ₹3-5.5 LPA. PSU roles secured through GATE — at NTPC, PGCIL, BHEL and similar companies — typically start around ₹6-12 LPA including allowances, with senior or Maharatna-level positions going considerably higher."
          - q: "Is a renewable energy or EV specialisation genuinely worth it?"
            a: "For a graduate willing to build the right skills, yes — renewable energy and EV/power electronics are reported as among the fastest-growing salary segments for electrical engineers in 2026. But the widely shared figures at the very top of these ranges apply to specialised, experienced professionals, not to a fresher on day one."
          - q: "Do I need GATE for Electrical Engineering government jobs?"
            a: "For most PSU roles, yes — GATE is the standard route into companies like NTPC, PGCIL and BHEL. Some government positions, including certain Junior Engineer posts and Union Public Service Commission (UPSC)'s Engineering Services Examination, run their own separate selection process instead."
      - note: "Figures are indicative (2026) — confirm on the official college or authority website."
        class: "table-note mt-lg"
