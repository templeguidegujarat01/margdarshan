  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Is BA Philosophy a \"useless\" degree with no career value?"
            a: "No — this is a common but inaccurate assumption. Philosophy builds strong logical reasoning, argumentation and writing skills that transfer well into law, civil services, content and editorial work, and academia. Like most Arts degrees, its value comes from what you build on top of it rather than the degree alone."
          - q: "Is Philosophy a good optional subject for UPSC?"
            a: "Yes. Philosophy is considered one of the more scoring UPSC Mains optional subjects because it has a compact, logically structured syllabus, and it also strengthens the analytical and ethics-related parts of the General Studies papers, including the compulsory Ethics paper."
          - q: "Do I need CUET to get into a good BA Philosophy college?"
            a: "For Delhi University and most central universities, yes — CUET (UG) scores decide admission, submitted through the DU CSAS portal or the respective university's counselling system. Many state and private universities instead admit directly on Class 12 marks."
          - q: "Can I do law or journalism after BA Philosophy?"
            a: "Yes, and it's a fairly common route. Philosophy's focus on logic, argument construction and ethical reasoning translates well into a follow-on LLB or into journalism and editorial roles that require clear, structured writing and critical thinking."
          - q: "What jobs can I get with just a BA Philosophy degree?"
            a: "A plain BA Philosophy alone mostly leads to content, editorial and research-support roles, or entry-level government jobs via SSC/state exams. Stronger, more specialised outcomes — academia, law, civil services — generally need a further degree or competitive exam on top."
      - note: "*Fee and salary figures are indicative, based on publicly available information as of 2026, and vary significantly by institution and admission cycle — always verify current figures on the official college or university website."
