lede: "In Mississippi, the Mississippi Board of Bar Admissions handles bar admission for lawyers, the Mississippi State Board of Medical Licensure licenses physicians, the Mississippi State Board of Public Accountancy licenses CPAs and the Mississippi Board of Nursing licenses registered nurses."

boards:
