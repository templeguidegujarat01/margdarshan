  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Can I do Diploma in Fashion Design right after Class 10?"
            a: "Yes. Many institutes offer a 3-year diploma directly after Class 10. Several institutes also offer a shorter 1-2 year diploma after Class 12, so always check the specific duration at your target institute."
          - q: "Do I need to be good at drawing to study fashion design?"
            a: "Not necessarily from the start. Freehand sketching helps, but the course teaches fashion illustration alongside pattern making, garment construction and textile knowledge. Many designers develop their sketching skills during the diploma rather than arriving with them."
          - q: "Is a Diploma in Fashion Design the same as being a certified designer?"
            a: "Fashion design isn't a government-licensed profession in India, so there's no mandatory certification or license required to call yourself a designer or start working. Professional credibility comes from your qualification, portfolio and industry reputation rather than a regulatory license."
          - q: "Which software should I learn for fashion design?"
            a: "CorelDRAW and Adobe Illustrator are widely used for flat sketches and print/pattern design, with Adobe Photoshop for digital rendering. Many institutes also introduce 3D garment visualisation tools like CLO 3D. Depth of software training varies by institute."
          - q: "Can I freelance or start my own label after this diploma?"
            a: "Yes, and this is one of the diploma's genuine strengths since fashion design isn't a licensed profession. Many diploma holders freelance, take custom orders, or start their own small label or boutique, though building a client base and brand takes real time and networking effort."
      - note: "*Fee and salary figures are indicative, based on publicly available information as of 2026, and vary significantly by state, institute and employer — always verify current figures directly with your target institute."
