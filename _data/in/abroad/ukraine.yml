  - { q: "Can Ukraine-returned MBBS students finish their degree?", a: "In September 2022 the NMC accepted Ukraine's academic mobility programme, letting students finish remaining semesters at universities in other countries with the degree awarded by the parent Ukrainian university.", source: nmc_amp_news }
