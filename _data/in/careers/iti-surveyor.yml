  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "What equipment does an ITI Surveyor learn to use?"
            a: "Training covers chain surveying, compass surveying, levelling instruments (dumpy level), theodolite, and increasingly, modern total station and basic GPS-based surveying equipment, though depth of exposure to advanced instruments varies by institute."
          - q: "Does ITI Surveyor make me a licensed Land Surveyor?"
            a: "Not automatically for all purposes. This trade qualifies you to perform survey work as a Survey Assistant/Surveyor under supervision. Certain official land survey and settlement roles in government departments may require additional departmental certification or specific state licensing, so check requirements for the specific role you're targeting."
          - q: "How long is the ITI Surveyor course?"
            a: "Surveyor is typically a 1-year NCVT-affiliated trade, combining survey theory and substantial hands-on field practice with survey instruments."
          - q: "What is the difference between Surveyor and Draughtsman Civil?"
            a: "Surveyor focuses on on-site land measurement, mapping and levelling using survey instruments — mostly field-based work. Draughtsman Civil focuses on preparing building/structural drawings and plans, mostly using AutoCAD in an office setting. Surveyor is field/measurement-based; Draughtsman is drawing/office-based."
          - q: "What government jobs can I get after ITI Surveyor?"
            a: "Common routes include state Revenue Department (land records/settlement) posts, PWD (Public Works Department) surveying roles, and municipal corporation technical posts, each through its own separate recruitment exam."
      - note: "*Fee and salary figures are indicative, based on publicly available information as of 2026, and vary significantly by state, institute and employer — always verify current figures directly with your target ITI."
