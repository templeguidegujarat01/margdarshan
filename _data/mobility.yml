routes:
  icai-to-aca:
    from: in
    to: uk
    from_label: "Indian CA (ICAI member)"
    to_label: "ICAEW Chartered Accountant (ACA)"
    badge: "12 of 15 exams credited"
    points:
      - "ICAI members get credit on <strong>12 of the 15</strong> ACA exams."
      - "Still to do: <strong>3 exams</strong> (Corporate Reporting, Strategic Business Management, Case Study) + online ethics training."
      - "ICAI member for <strong>5+ years</strong>? You can apply through ICAEW's Pathways to Membership instead."
      - "Signing UK audits needs more: ICAEW says the ICAI qualification is <strong>not recognised</strong> for the UK Audit Qualification."
    sources: [icaew_icai_aca, icaew_icai_join]
    roadmap: "uk/roadmaps/icai-to-uk-accountant.html"
  icai-to-acca:
    from: in
    to: uk
    from_label: "Indian CA (ICAI)"
    to_label: "ACCA"
    badge: "Exemptions possible"
    points:
      - "ACCA can exempt you from <strong>Applied Knowledge and Applied Skills</strong> exams (up to 9)."
      - "<strong>No exemptions</strong> for the 4 Strategic Professional exams."
      - "Check your exact exemptions with ACCA's official exemptions calculator."
    sources: [acca_exemptions]
    roadmap: "uk/roadmaps/icai-to-uk-accountant.html"
  icai-to-cpa:
    from: in
    to: us
    from_label: "Indian CA (ICAI)"
    to_label: "U.S. CPA"
    badge: "No shortcut agreement"
    points:
      - "ICAI has <strong>no mutual recognition agreement</strong> with the U.S. board (NASBA/AICPA IQAB), so there is no shortened exam route."
      - "Bodies that do have one: SAICA, CPA Australia, CA ANZ, CPA Canada, Chartered Accountants Ireland, CPA Ireland, IMCP (Mexico)."
    sources: [nasba_mra]
    roadmap: "us/roadmaps/cpa-international.html"
  aca-to-cpa:
    from: uk
    to: us
    from_label: "ICAEW Chartered Accountant (ACA)"
    to_label: "U.S. CPA"
    badge: "No shortcut agreement"
    points:
      - "ICAEW is <strong>not on NASBA's list</strong> of mutual recognition agreements, so there is no shortened exam route."
      - "Bodies that do have one: SAICA, CPA Australia, CA ANZ, CPA Canada, Chartered Accountants Ireland, CPA Ireland, IMCP (Mexico)."
    sources: [nasba_mra]
  lawyer-to-solicitor:
    from: [in, us]
    to: uk
    from_label: "Lawyer qualified outside England and Wales"
    to_label: "Solicitor of England and Wales"
    badge: "No 2-year work rule"
    points:
      - "Pass <strong>SQE1</strong>. <strong>SQE2</strong> too, unless the SRA gives you an exemption."
      - "Qualified lawyers <strong>do not need</strong> the 2 years of qualifying work experience."
      - "You still need a degree (any subject) or equivalent, and the SRA's character checks."
    sources: [sra_qualified_lawyers]
    roadmap: "uk/roadmaps/sqe-overseas-lawyer.html"
  lawyer-to-barrister:
    from: [in, us]
    to: uk
    from_label: "Lawyer qualified abroad"
    to_label: "Barrister of England and Wales"
    badge: "Limited right now"
    points:
      - "Overseas lawyers may be exempt from some or all barrister training."
      - "But for now the BSB only takes transfer applications if you have a <strong>pupillage starting before 1 January 2029</strong>, or a job that needs a practising certificate."
    sources: [bsb_tql]
  common-law-to-ny:
    from: [in, uk]
    to: us
    from_label: "Law degree from a common-law country (India, UK)"
    to_label: "New York bar exam"
    badge: "Degree check + maybe LL.M."
    points:
      - "New York accepts law degrees from countries whose law is based on <strong>English common law</strong>."
      - "The degree must match a U.S. J.D. in length and content. If it does not, a U.S. <strong>LL.M. of at least 24 credits</strong> (with set subjects) can fill the gap."
      - "Some routes also need you to be <strong>admitted to practise</strong> in your home country first."
    sources: [nycrr_520_6]
    roadmap: "us/roadmaps/foreign-lawyer-us-bar.html"
  doctor-to-gmc:
    from: [in, us]
    to: uk
    from_label: "Doctor who qualified outside the UK, EEA and Switzerland (e.g. Indian MBBS)"
    to_label: "UK doctor (GMC licence to practise)"
    badge: "PLAB 1 + PLAB 2"
    checked: 2026-10-23
    points:
      - "You will <strong>probably need the PLAB test</strong>. It checks you know and can do what a UK doctor starting the second Foundation year can."
      - "Before PLAB, the GMC checks that your degree is an <strong>acceptable overseas qualification</strong> and that your English is good enough."
      - "English: IELTS Academic <strong>7.5 overall and 7.0 in each part</strong>, or OET Medicine <strong>grade B in all four parts</strong>, in one sitting. Valid for 2 years."
      - "PLAB 1: <strong>180 questions in 3 hours</strong>, held in several countries. PLAB 2: a clinical exam (OSCE) of <strong>16 scenarios</strong> at the GMC's centre in the UK."
      - "Pass both, then apply for registration: it must be approved <strong>within 2 years</strong> of passing PLAB 2. The GMC made PLAB meet the UK Medical Licensing Assessment (MLA) in 2024."
    sources: [gmc_plab, gmc_pmq, gmc_ielts, gmc_oet, gmc_mla]
  img-to-ecfmg:
    from: [in, uk]
    to: us
    from_label: "Medical graduate from outside the U.S. (e.g. Indian or UK MBBS)"
    to_label: "U.S. residency and licence (ECFMG Certification)"
    badge: "USMLE + ECFMG"
    checked: 2026-10-23
    points:
      - "ECFMG counts you as an international medical graduate (IMG) by where your <strong>medical school</strong> is, not by your passport."
      - "Your school must be in the World Directory of Medical Schools with an <strong>ECFMG Sponsor Note</strong> that covers your graduation year. No note = not eligible."
      - "Pass <strong>USMLE Step 1 and Step 2 CK</strong>, and meet an ECFMG Pathway, which includes <strong>OET Medicine</strong>."
      - "ACGME residency programs and U.S. state medical boards both <strong>require ECFMG Certification</strong> from IMGs."
    sources: [ecfmg_cert]
    roadmap: "us/roadmaps/img-usmle.html"
  nurse-to-nmc:
    from: [in, us]
    to: uk
    from_label: "Nurse trained outside the UK (e.g. Indian B.Sc Nursing)"
    to_label: "UK registered nurse (NMC)"
    badge: "CBT + OSCE"
    checked: 2026-10-23
    points:
      - "Without a recognised European qualification you take the NMC <strong>Test of Competence</strong>: a computer-based test (<strong>CBT</strong>) and a practical exam (<strong>OSCE</strong>)."
      - "Pass the CBT and OSCE <strong>within 2 years</strong> of each other, in either order. Once passed, the test stays valid for <strong>5 years</strong>."
      - "English: IELTS Academic <strong>7 in listening, reading and speaking, 6.5 in writing</strong>, or OET <strong>B (350)</strong> with <strong>C+ (300)</strong> in writing. Scores count for 2 years."
      - "Order: eligibility and qualification application (<strong>£140</strong> evaluation fee, non-refundable), the test, then health, character, English and indemnity evidence."
    sources: [nmc_overseas, nmc_toc, nmc_english]
  nurse-to-us-rn:
    from: [in, uk]
    to: us
    from_label: "Nurse educated outside the U.S. (e.g. Indian B.Sc Nursing)"
    to_label: "U.S. Registered Nurse (NCLEX-RN)"
    badge: "CGFNS check + NCLEX-RN"
    checked: 2026-10-23
    points:
      - "State boards of nursing first want your education and licence checked by <strong>CGFNS (now called TruMerit)</strong> against U.S. nursing standards."
      - "Then pass the <strong>NCLEX-RN</strong> for the state where you will work. Some states also want the CGFNS Qualifying Exam before it."
      - "For a work visa (H-1B or green card) you need <strong>VisaScreen</strong>: education and licence checks, an English test, and a pass in the NCLEX-RN or the CGFNS Qualifying Exam."
      - "A <strong>U.S. employer</strong> must file your visa petition, and the VisaScreen certificate goes with it."
    sources: [cgfns_us_nurse, cgfns_visascreen]

# Which routes each career page shows (order = order on the page).
pages:
  in:
    ca: [icai-to-aca, icai-to-acca, icai-to-cpa]
    cpa: [icai-to-cpa]
    llb: [lawyer-to-solicitor, lawyer-to-barrister, common-law-to-ny]
    mbbs: [doctor-to-gmc, img-to-ecfmg]
    nursing: [nurse-to-nmc, nurse-to-us-rn]
  us:
    accounting: [icai-to-cpa, aca-to-cpa]
    law: [lawyer-to-solicitor, lawyer-to-barrister]
    medicine: [img-to-ecfmg, doctor-to-gmc]
    nursing: [nurse-to-us-rn, nurse-to-nmc]
  uk:
    accountancy: [icai-to-aca, icai-to-acca, aca-to-cpa]
    law: [common-law-to-ny, lawyer-to-solicitor, lawyer-to-barrister]
    medicine: [doctor-to-gmc, img-to-ecfmg]
    nursing: [nurse-to-nmc, nurse-to-us-rn]
