# Journey Blueprint — Civil Engineer (B.E. / B.Tech Civil or Diploma). Printed on journey-civil-engineer.html (_includes/journey-doubts.html).
# Rules, classes and the money items / sources several careers share: _data/in/journey_common.yml.
# `money_defs` / `sources` below are used only by this career. Check: node scripts/check-journey-matrix.mjs
id: civil-engineer
v: 2
name: "Civil Engineer (B.E. / B.Tech Civil or Diploma)"
search: ["civil engineer", "civil site engineer", "government civil engineer", "railway civil engineer", "environmental civil engineer", "structural engineer", "site engineer"]
search_not: ["software", "cad technician", "documentation"]
page: "civil.html"
roadmap: "roadmaps/civil.html"
doubts_page: "journey-civil-engineer.html"
gate: "Class 12 with Physics and Mathematics → JEE Main or your state's engineering entrance → 4-year B.E. / B.Tech Civil. Or Class 10 → 3-year polytechnic diploma in Civil (Junior Engineer route) → lateral entry to B.Tech. Government jobs: UPSC ESE (Civil), state commissions for AE / JE posts."
gate_source: [jm-ib, jee-ib, ese27]
core:
  what:
    text: "A civil engineer plans, designs and builds roads, bridges, buildings, water supply, drains and railways — and checks that they are safe. In government, civil engineers run services such as the Central Engineering Service, Central Water Engineering Service and Border Roads."
    source: ese27
  day:
    - "On site: check that work matches the drawings, test materials, guide contractors and workers."
    - "In the office: prepare drawings, estimates and bills, and get approvals."
    - "In government: plan public works, inspect quality and manage budgets and tenders."
  pay:
    - { level: "Junior Engineer (Civil), Delhi govt (DSSSB 2026)", value: "Pay Level 6 · ₹35,400 starting basic", source: d-0126 }
    - { level: "Assistant Engineer (Civil), Delhi govt (DSSSB 2026)", value: "Pay Level 7 · ₹44,900 starting basic", source: d-0126 }
    - { level: "Group A officer through UPSC ESE (example: ITS, ESE 2024)", value: "Pay Level 10 · ₹56,100 – ₹1,77,500", source: dot-its }
  pay_note: "Private construction pay is not published officially, so we print only government levels."
  routes:
    - { title: "B.E. / B.Tech Civil", text: "Class 12 with Physics and Maths → JEE Main or a state CET → 4 years. JoSAA seats at NITs need 75% in Class 12 (65% SC / ST / PwD) or your board's top 20 percentile.", source: jm-ib }
    - { title: "Polytechnic diploma (Junior Engineer)", text: "After Class 10 — e.g. UP's JEECUP needs Class 10 with 35% — then JE jobs or lateral entry into B.Tech.", source: [jee-ib, acpc-be] }
    - { title: "Central government Group A", text: "UPSC Engineering Services (ESE) — Civil category: Central Engineering Service, CES (Roads), Survey of India, Central Water Engineering, Railway Management Service (Civil) and more.", source: ese27 }
    - { title: "State and city government", text: "State commissions and boards recruit JE / AE (Civil) — e.g. DSSSB for Delhi Jal Board and NDMC.", source: d-0126 }
  cost_time:
    - { label: "B.E. / B.Tech", value: "4 years after Class 12", source: acpc-be }
    - { label: "JEE Main fee 2026 (per session)", value: "₹1,000 General male · ₹800 female · ₹500 SC / ST / PwD", source: jm-ib }
    - { label: "UPSC ESE fee", value: "₹200 · women, SC, ST and PwBD exempt", source: ese27 }
  cost_note: "College fees vary by state, college type and quota, so we do not print one national figure."
  challenges:
    - text: "ESE is three stages — a 500-mark objective prelims with <strong>−1/3 per wrong answer</strong>, a conventional mains and an interview — for about 480 posts across four branches in 2027."
      source: ese27
    - text: "Most good government-college seats depend on JEE Main or your state CET rank — and board marks still count (for example 50% of ACPC's Gujarat merit is your HSC theory percentile)."
      source: [jm-ib, acpc-advt]
    - text: "Site work means heat, dust, travel and long hours, especially early in your career."
  not_for:
    - "You dislike Maths and Physics — the whole degree is built on them."
    - "You want only a desk job in one city — civil work moves from site to site."
    - "You are not ready to take responsibility for safety — a design mistake can cost lives."
journey:
  - stages: [c8, c9]
    title: "Maths, drawing and how things are built"
    do:
      - text: "JEE Main Paper 1 is Mathematics, Physics and Chemistry, 100 marks each. Strong school Maths now makes Class 11–12 easier."
        source: jm-ib
      - text: "Look at buildings and bridges around you; try simple models — it shows whether you enjoy structures."
    doubts:
      - q: "What does a civil engineer actually build?"
        a: "Roads, bridges, buildings, dams, water supply and railways. Government civil engineers work in services such as the Central Engineering Service, CES (Roads), Central Water Engineering and Border Roads."
        next: "Read the Routes list above."
        source: ese27
      - q: "Can I become a civil engineer without JEE?"
        a: "Yes. State engineering seats use state routes too (Gujarat's GUJCET with ACPC, Maharashtra's MHT-CET), and a polytechnic diploma after Class 10 leads to Junior Engineer jobs or lateral entry into B.Tech."
        next: "Check your state's route in the State rules section of this page."
        source: [acpc-advt, mht-ib, jee-ib, acpc-be]
  - stages: [c10]
    title: "Science with Maths — or a polytechnic diploma"
    do:
      - text: "For B.E. / B.Tech at NITs and NIT+ institutes, Class 12 must include <strong>Physics and Mathematics</strong>."
        source: jm-ib
      - text: "Or join a 3-year polytechnic diploma in Civil after Class 10 — UP's JEECUP asks for Class 10 with 35%, age 14+."
        source: jee-ib
    stream: "PCM (Physics, Chemistry, Mathematics) for the degree route."
    mistakes:
      - "Dropping Mathematics in Class 11 — it closes the B.Tech route."
    doubts:
      - q: "Can I do civil engineering after Class 10?"
        a: "Yes, as a polytechnic diploma. UP's JEECUP, for example, admits to engineering diplomas with Class 10 and 35% marks, age 14 or more. Diploma holders can later join B.Tech through lateral entry."
        next: "Look up your state's polytechnic entrance (JEECUP, ACPDC, JEXPO, POLYCET)."
        source: [jee-ib, acpc-be]
      - q: "Is Maths compulsory for civil engineering?"
        a: "For B.E. / B.Tech, yes — Class 12 must include Physics and Mathematics."
        next: "Take PCM in Class 11."
        source: jm-ib
  - stages: [c11, c12]
    title: "JEE Main year and your state CET"
    do:
      - text: "JEE Main can be taken in your Class 12 year and the two years after it, two sessions a year, with <strong>no age limit</strong>."
        source: jm-ib
      - text: "For NIT seats you also need <strong>75% in Class 12</strong> (65% SC / ST / PwD) or your board's top 20 percentile."
        source: jm-ib
      - text: "Register for your state's counselling too — ACPC, UPTAC, MHT-CET CAP, WBJEE and others."
        source: [acpc-advt, tac-ib, mht-ib, wb-ib]
    exams:
      - { name: "JEE Main 2026", when: "Session 1: 21–30 Jan · Session 2: 2–9 Apr 2026", source: jm-ib }
    money: [csss, pms-sc]
    mistakes:
      - "Ignoring board marks — NIT eligibility and some state merit lists use them."
      - "Choosing a branch only by rank — if you want civil, check the college's civil department too."
    late: "Rank too low for a top college? ESE asks for an engineering degree from a recognised university — not a particular college — so a good B.Tech anywhere keeps Group A open."
    doubts:
      - q: "How many attempts do I get in JEE Main?"
        a: "You can sit JEE Main in your Class 12 year and the two following years, with two sessions each year. There is no age limit."
        next: "Treat your Class 12 sessions as real attempts."
        source: jm-ib
      - q: "Do Class 12 marks matter for engineering?"
        a: "Yes. NIT, IIIT and other JoSAA seats need 75% (65% SC / ST / PwD) or the top 20 percentile of your board. In Gujarat, half of ACPC merit is your HSC theory percentile."
        next: "Prepare for boards and JEE together."
        source: [jm-ib, acpc-advt]
      - q: "What is the home-state quota at NITs?"
        a: "NIT seats are split into Home State and Other States quotas. Your home state is where you passed Class 12, not your home town."
        next: "Remember this if you plan to study Class 12 in another state."
        source: [jm-ib, josaa-br]
  - stages: [ug]
    title: "In B.Tech Civil: build skills for site and exams"
    do:
      - text: "Lateral entry: polytechnic diploma holders can join the second year of B.E. / B.Tech — Gujarat fills these seats through ACPC's DDCET."
        source: acpc-be
      - text: "If you aim for UPSC ESE, note the age window: <strong>21 to under 30</strong> on 1 January of the exam year (2027 notice)."
        source: ese27
    doubts:
      - q: "Can a diploma holder get a B.Tech?"
        a: "Yes, through lateral entry into the second year. In Gujarat ACPC runs this through the DDCET; other states have their own lateral-entry tests or merit."
        next: "Check your state's lateral-entry notice in your final diploma year."
        source: acpc-be
      - q: "Can I apply for ESE in my final year of B.Tech?"
        a: "Yes, if you are appearing in the degree exam. You must upload proof of passing within 10 days after the mains result, or you will not be allowed into the interview."
        next: "Plan your ESE attempt to match your final-year result."
        source: ese27
      - q: "Can I write ESE for more than one branch?"
        a: "No. You apply in only one category — Civil, Mechanical, Electrical, or Electronics and Telecommunication."
        next: "Civil graduates choose Category I: Civil Engineering."
        source: ese27
  - stages: [grad]
    title: "Government exams or the private sector"
    do:
      - text: "<strong>UPSC ESE 2027</strong> (Civil): prelims 31 Jan 2027, mains 18 Jun 2027; about 480 vacancies across all four categories; age 21–30; fee ₹200 (women, SC, ST, PwBD exempt)."
        source: ese27
      - text: "State / city JE and AE posts — e.g. DSSSB 2026: one 300-mark paper with 0.25 negative marking."
        source: d-0126
    exams:
      - { name: "UPSC ESE 2027 prelims", when: "31 Jan 2027", source: ese27 }
      - { name: "UPSC ESE 2027 mains", when: "18 Jun 2027", source: ese27 }
    doubts:
      - q: "What is UPSC ESE?"
        a: "The Engineering Services Examination. You pick one category — Civil, Mechanical, Electrical or Electronics &amp; Telecommunication. It has an objective prelims (500 marks: Paper I 200, Paper II 300), a conventional mains and a personality test."
        next: "Start preparing in your final year."
        source: ese27
      - q: "Is there negative marking in ESE?"
        a: "Yes. In the objective papers one-third of a question's marks is cut for each wrong answer, and marking two answers counts as wrong."
        next: "Answer only what you are sure about."
        source: ese27
      - q: "What is the age limit for ESE?"
        a: "At least 21 and under 30 on 1 January of the exam year — for ESE 2027, born between 2 January 1997 and 1 January 2006 — with relaxations for reserved categories."
        next: "Count how many attempts your age allows."
        source: ese27
      - q: "What do JE and AE (Civil) earn in government?"
        a: "In Delhi's DSSSB 2026 recruitment, Junior Engineer (Civil) is Pay Level 6 (₹35,400 starting basic) and Assistant Engineer (Civil) Level 7 (₹44,900)."
        next: "Check your own state's JE / AE notice."
        source: d-0126
  - stages: [work]
    title: "Switching later"
    do:
      - text: "JEE Main has no age limit, so a later start is possible; but government exams like ESE stop at age 30 (plus relaxations)."
        source: [jm-ib, ese27]
    doubts:
      - q: "I have a B.Sc. Can I still become a civil engineer?"
        a: "Only by doing an engineering degree or diploma. JEE Main has no age limit, but its attempts are counted from your Class 12 year."
        next: "Look at your state's engineering admission rules for older students."
        source: jm-ib
board_note: "Every board counts for JEE Main and state CETs. NIT seats need 75% in Class 12 (65% SC / ST / PwD) or the top 20 percentile of your own board."
board_source: jm-ib
exam:
  name: "JEE Main → B.Tech · UPSC ESE (Civil) → Group A"
  body: "NTA · UPSC"
  href: "upsc-ese.html"
  facts:
    - { label: "JEE Main Paper 1", value: "75 questions · 300 marks · 3 hours", source: jm-ib }
    - { label: "ESE prelims", value: "500 marks (Paper I 200 + Paper II 300)", source: ese27 }
    - { label: "ESE negative marking", value: "−1/3 per wrong answer", source: ese27 }
    - { label: "ESE 2027", value: "About 480 vacancies (all categories)", source: ese27 }
  stages:
    head: ["Stage", "What it is", "Rule"]
    rows:
      - ["JEE Main / state CET", "Entrance for B.E. / B.Tech", "Physics + Maths in Class 12"]
      - ["ESE Stage I", "Objective: General Studies &amp; Engineering Aptitude + Civil Engineering", "−1/3 per wrong answer; marks count in final merit"]
      - ["ESE Stage II", "Two conventional Civil Engineering papers", "About 6–7 times the vacancies are called"]
      - ["ESE Stage III", "Personality test", "Final merit and service allotment"]
    source: [jm-ib, ese27]
  notes:
    - text: "Services are allotted by merit rank, your preferences, vacancies and medical fitness."
      source: ese27
state_uses: [board, tech, psc, scholarship]
state_rules:
  - { state: gujarat, text: "ACPC merit = <strong>50% HSC theory percentile</strong> (Maths, Physics, Chemistry) + <strong>50% GUJCET percentile</strong>; 95% of Govt / GIA seats go to Gujarat-schooled GUJCET candidates and 5% on JEE Main. Diploma holders enter through DDCET.", source: [acpc-advt, acpc-be], href: "state/gujarat/acpc.html" }
  - { state: uttar-pradesh, text: "UPTAC fills B.Tech seats on <strong>JEE Main</strong> rank (45%, 40% SC / ST, in the required subjects). Polytechnic diplomas after Class 10 go through <strong>JEECUP</strong> (35% in Class 10, fee ₹300 / ₹200).", source: [tac-ib, jee-ib], href: "state/uttar-pradesh/aktu-uptac.html" }
  - { state: maharashtra, text: "MHT-CET is compulsory for Maharashtra-candidature B.E. / B.Tech seats; B.E. needs 45% in PCM (40% reserved) and a non-zero MHT-CET score.", source: [mht-ib, cap-ib], href: "state/maharashtra/mhtcet.html" }
  - { state: west-bengal, text: "WBJEE counselling: West Bengal domicile is needed for government-aided seats and every reserved seat.", source: wb-ib }
  - { state: karnataka, text: "Engineering government seats go through <strong>KCET (PCM)</strong>; B.E. needs II PUC with English, Physics and Maths and 45% (40% reserved).", source: kcet-ib, href: "state/karnataka/kcet.html" }
  - { state: andhra-pradesh, text: "<strong>AP EAPCET</strong>: engineering test 12–15 and 18 May 2026; 45% (40% reserved) in the qualifying subjects; diploma holders from SBTET AP may also apply.", source: eap-ib, href: "state/andhra-pradesh/eapcet.html" }
  - { state: telangana, text: "<strong>TG EAPCET</strong>: ranks only from normalised EAPCET marks; fee ₹900 (₹500 SC / ST / PH).", source: tg-eap-dn, href: "state/telangana/eapcet.html" }
  - { state: delhi, text: "DSSSB 2026: Junior Engineer (Civil) Level 6 and Assistant Engineer (Civil) Level 7 for Delhi Jal Board, NDMC and others; one 300-mark paper with 0.25 negative marking.", source: d-0126, href: "state/delhi/dsssb-combined.html" }
  - { text: "UPSC ESE and JEE Main are national; NIT seats split into Home State and Other States quotas by the state where you passed Class 12.", source: [ese27, josaa-br] }
