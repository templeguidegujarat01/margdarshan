  # ------------------------------------------------------------------------------------------------ Kathak
  - slug: kathak
    short: "Kathak"
    domain: arts
    checked: 2026-10-16
    body_label: "Recognised by"
    body: "Sangeet Natak Akademi (SNA) · Ministry of Culture"
    rules_note: "Akademi, Ministry, Prasar Bharati &amp; ICCR files only"
    sources_note: "Every fact on this Education Margdarshan page is taken from a Sangeet Natak Akademi, Ministry of Culture, Prasar Bharati or ICCR file below, or from an academy's own 2026-27 notice (used only for that academy). Age limits, fees and scheme amounts change every year — open the current file before you apply or pay."
    card: "Kathak Kendra's age-banded courses, Doordarshan dance grades, SNA awards, ICCR empanelment and the scholarships that pay for training."
    card_facts: ["Foundation course at 10–15", "DD grades B → Top", "SNA Yuva up to age 40"]
    eyebrow: "Performing Arts Cockpit · Classical Dance · Kathak Kendra 2026-27"
    title: "Kathak — training ladder, gharanas, Doordarshan grades &amp; scholarships"
    lede: "Everything a Kathak student and family need from the first class with a guru to a national stage: what the course syllabus demands, the age limit of every Kathak Kendra course, how Doordarshan grades dancers, the Sangeet Natak Akademi honours, ICCR empanelment, the scholarships and fellowships that pay for training, and an honest look at jobs."
    official:
      - { label: "Kathak Kendra admissions", url: "https://www.kathakkendra.in/admission" }
      - { label: "sangeetnatak.gov.in", url: "https://sangeetnatak.gov.in/" }
    facts:
      - { label: "Kathak Kendra Foundation course", value: "<strong>Age 10–15</strong> · 5 years · after Class III", source: kk-adm }
      - { label: "Doordarshan dance grades", value: "<strong>B · B-High · A · Top</strong> — minimum age 18 / 25 / 35 / 40", source: dd-dance }
      - { label: "SNA Yuva Puraskar", value: "<strong>₹25,000</strong> + tamrapatra · up to <strong>age 40</strong>", source: sna-yuva }
      - { label: "Young-artiste scholarship", value: "<strong>₹5,000 a month</strong> for 2 years · age 18–25", source: pib-ksvy }
    sections:
      - id: rules
        nav: "Form &amp; gharanas"
        eyebrow: "Core rules, lineages &amp; gharana frameworks"
        heading: "What Kathak training is built on"
        parts:
          - p: "There is no single 'rule book' for a classical dance. The nearest official benchmark is what India's national Kathak institute asks of a dancer at the door of its full-time course — Kathak Kendra's Diploma Honours entry standard (age 19–23) lists the repertoire and theory below."
            source: kk-courses
          - list:
              - "<strong>Teentaal</strong> repertoire: theka, nagma, tatkaar, thaat, amad, tihai, paltey / bol-bant / ladi, tukda, paran, parmelu, chakkardar compositions, gat nikas, gat bhav, kavitta and musical compositions such as sargam."
              - "<strong>Jhaptaal and Dhamaar taal</strong>: theka, nagma, tatkaar and tihai."
              - "<strong>Thumri</strong> in its primary format, and a Vandana."
              - "The ability to <strong>recite and dance all nritta and musical compositions on theka</strong>."
              - "Theory: history and evolution of Kathak, an introduction to <strong>Panchajaati</strong> in rhythm, the relevant chapters of the <strong>Natya Shastra and Abhinaya Darpan</strong>, India's classical and major folk dances, the eminent artistes and gurus of Kathak, and the definition of every technical term used."
              - "Desirable: training in <strong>Hindustani vocal music, tabla or pakhawaj</strong> — Kathak is taught as one discipline with Hindustani music."
            source: kk-courses
          - table:
              caption: "The two halves every Doordarshan dance audition tests"
              head: ["Segment", "Minimum time", "Rule"]
              rows:
                - ["<strong>Abhinaya</strong> (expressive dance)", "7 min 30 s", "Recorded in a single take, no editing"]
                - ["<strong>Nritta</strong> (technical dance)", "7 min 30 s", "Black cyclorama / black background; live or pre-recorded music"]
            source: dd-dance
          - p: "On lineage, the Sangeet Natak Akademi's own history of Kathak Kendra says the Kendra became a venue for <strong>merging formats from the Lucknow and Jaipur gharanas</strong>, and that Uttar Pradesh set up a state Kathak Kendra in <strong>Lucknow in 1973</strong> (founding director Lachhu Maharaj) while Rajasthan set up the <strong>Jaipur Kathak Kendra</strong> — 'both places are known for their respective gharanas'."
            source: sna-kk
          - p: "Doordarshan treats a lineage as a credential: <strong>'stake holders of the legacy traditions (gharana)'</strong> are one of the three groups that may ask the Director General, Doordarshan for exemption from the routine audition."
            source: dd-dance
          - warn: "The <strong>Banaras gharana</strong> (and Raigarh) are widely taught, but Margdarshan found no Sangeet Natak Akademi or Ministry of Culture file that defines or ranks Kathak gharanas, so this page does not. Judge a guru by checkable facts — their own training, their students' Doordarshan grades and Akademi recognition — not by a gharana label alone."
      - id: recognition
        nav: "Awards &amp; grades"
        eyebrow: "Institutional &amp; national recognition"
        heading: "The recognitions that count for a Kathak dancer"
        parts:
          - table:
              caption: "Sangeet Natak Akademi honours (Kathak is a named dance category)"
              head: ["Honour", "Who is considered", "What it carries"]
              rows:
                - ["<strong>Akademi Ratna</strong> (Fellow)", "Ordinarily <strong>age 50+</strong>; at most 40 living Fellows", "₹3 lakh, citation, angavastram, tamrapatra; medical cover up to ₹1.5 lakh a year"]
                - ["<strong>Akademi Puraskar</strong> (Award)", "Ordinarily <strong>age 35+</strong>; 12 awards a year in the dance field", "₹1 lakh (raised from ₹50,000 in 2009), citation, angavastram, tamrapatra; medical cover up to ₹1 lakh a year"]
                - ["<strong>Ustad Bismillah Khan Yuva Puraskar</strong>", "<strong>Up to age 40</strong>; at most 33 a year, 8 of them in dance", "₹25,000 and a tamrapatra; awardees are, as far as possible, invited to perform at the Akademi's festival"]
            source: "sna-awards,sna-yuva"
          - p: "Nobody applies for these honours. Yuva Puraskar names come from Akademi Fellows and awardees, General Council members, chairpersons of State Akademis, State/UT culture secretaries, heads of performing-arts departments in recognised universities and eminent experts; Akademi Ratna Fellows are elected by a majority of at least three-fourths of the members present and voting."
            source: "sna-yuva,sna-awards"
          - table:
              caption: "Doordarshan dance grades (guidelines of 27 Feb 2025)"
              head: ["Grade", "Minimum age", "Who awards it", "Processing fee"]
              rows:
                - ["<strong>B</strong>", "18", "Local Dance Audition Committee at the Doordarshan Kendra", "₹2,000"]
                - ["<strong>B-High</strong>", "25", "Central Dance Audition Board, DG Doordarshan, New Delhi", "₹3,000 (B → B-High)"]
                - ["<strong>A</strong>", "35", "Central Dance Audition Board", "₹4,000 (B-High → A)"]
                - ["<strong>Top</strong>", "40", "Central Dance Audition Board", "₹5,000 (A → Top)"]
            source: dd-dance
          - list:
              - "Kendras may invite applications from <strong>1–30 April and/or 1–30 November</strong>; Doordarshan Kendra Lucknow, for example, took classical-dance applications from 1 to 30 April 2026."
              - "Kathak is one of eight listed classical forms; a <strong>separate application is needed for each dance form</strong>."
              - "Proof of age, certificates from gurus or institutions and press reviews go with the form."
              - "Anyone not found suitable can <strong>reappear only after one year</strong>."
              - "<strong>Exemption route</strong>: national, Padma, SNA, State Government or State Akademi award winners, gharana stake-holders and renowned performers may apply with a recording of at least 15 minutes, not older than 6 months, and a ₹10,000 fee — each grade has its own minimum years of national/international performing experience and minimum age."
            source: dd-dance
          - list:
              - "The Indian Council for Cultural Relations (ICCR) empanels artists <strong>aged 18 and above</strong>; applications are open <strong>throughout the year</strong> and expert advisory committees review them annually."
              - "ICCR's published genre-wise list (updated 25 Nov 2025) shows each empanelled artist's <strong>current category — Outstanding, Established or Proficient</strong> — and the countries ICCR has sponsored them to."
            source: "iccr-intro,iccr-list"
          - note: "ICCR's pages do not publish what separates Proficient, Established and Outstanding, so Margdarshan does not guess the criteria. Empanelment puts you on the panel; it is not a promise of a tour."
      - id: eligibility
        nav: "Ages &amp; scholarships"
        eyebrow: "Professional portfolios &amp; scholarship age benchmarks"
        heading: "Age limits for every course and scholarship"
        parts:
          - table:
              caption: "Kathak Kendra courses, session 2026-27 (ages as on 1 June 2026)"
              head: ["Course", "Age", "Schooling needed", "Length"]
              rows:
                - ["<strong>Foundation</strong>", "10–15", "Continuing school, Class III completed", "5 years"]
                - ["<strong>Diploma Pass</strong>", "15–20", "Continuing school, Class IX completed", "3 years"]
                - ["<strong>Diploma Honours</strong> (full-time, 25 seats)", "19–23", "Class XII passed + Diploma Pass or equivalent", "3 years"]
                - ["<strong>Post Diploma</strong> (full-time, 25 seats)", "21–26", "Graduate + Diploma Honours or equivalent", "2 years"]
            source: "kk-adm,kk-courses"
          - table:
              caption: "Central scholarships and fellowships open to dancers"
              head: ["Scheme", "Age", "Amount", "Term"]
              rows:
                - ["<strong>CCRT Cultural Talent Search Scholarship</strong>", "10–14", "₹3,600 a year + guru/institution tuition reimbursed up to ₹9,000 a year", "2 years at a time, renewable up to the first degree or age 20; 650 new awards a year"]
                - ["<strong>Scholarship to Young Artistes</strong> (Ministry of Culture)", "18–25, with at least 5 years under a guru or institution", "₹5,000 a month", "2 years; up to 400 a batch; interview before an expert committee"]
                - ["<strong>Junior Fellowship</strong>", "25–40", "₹10,000 a month", "2 years, for a cultural research project; 200 a batch"]
                - ["<strong>Senior Fellowship</strong>", "Above 40", "₹20,000 a month", "2 years; 200 a batch"]
            source: "ccrt-ctss,pib-sya,pib-ksvy"
          - list:
              - "Kathak Kendra's form needs a passport photo, the ₹200 fee receipt, a <strong>medical fitness certificate from an MBBS doctor</strong>, qualification and Kathak training certificates, and government ID."
              - "Doordarshan's form needs proof of age, certificates from your gurus or institutions and press reviews — start a file of every certificate, programme and review from the first year of training."
            source: "kk-adm,dd-dance"
          - warn: "BVA and BFA are visual / fine-arts degrees, not dance degrees. A dancer's routes are an institute diploma (such as Kathak Kendra's) or a performing-arts degree (BPA / MPA) from a recognised university — check the university's recognition before paying any fee."
      - id: roadmap
        nav: "Guru to stage"
        eyebrow: "Grassroots-to-maestro residential pipeline"
        heading: "From a local guru to national stages"
        parts:
          - table:
              caption: "The Kathak ladder, step by step"
              head: ["Stage", "Typical age", "What happens", "Who pays"]
              rows:
                - ["<strong>Guru–shishya start</strong>", "Under 10", "Lessons with a local guru; keep a dated certificate for every year of training", "Family"]
                - ["<strong>Talent scholarship</strong>", "10–14", "CCRT Cultural Talent Search Scholarship", "Govt: ₹3,600 a year + tuition up to ₹9,000"]
                - ["<strong>Foundation / Diploma Pass</strong>", "10–20", "Kathak Kendra part-time courses alongside school", "Family: ₹400–450 a month"]
                - ["<strong>Full-time training</strong>", "19–23", "Diploma Honours; Doordarshan B grade possible from 18", "Family ₹500 a month; Young-artiste scholarship ₹5,000 a month (18–25)"]
                - ["<strong>Post Diploma</strong>", "21–26", "Two more years for graduates; B-High grade from 25", "Family ₹650 a month"]
                - ["<strong>Early career</strong>", "25–40", "Doordarshan bookings, ICCR empanelment, SNA Yuva Puraskar (to 40), Junior Fellowship", "Fees, fellowships, award money"]
                - ["<strong>Senior artiste / guru</strong>", "35 +", "A (35+) and Top (40+) grades; Akademi Puraskar (35+); a guru's Repertory grant", "Ministry of Culture, SNA"]
            source: "ccrt-ctss,kk-adm,kk-fees,dd-dance,pib-ksvy,sna-yuva,sna-awards"
          - p: "The Ministry of Culture's <strong>Repertory grant (Guru–Shishya Parampara)</strong> funds one guru and up to 18 shishyas in a dance, music or theatre group: <strong>₹15,000 a month for the guru</strong> and <strong>₹2,000–10,000 a month for each shishya</strong>, depending on age."
            source: pib-ksvy
          - p: "The Sangeet Natak Akademi's own <strong>'Kala Deeksha' (Guru Shishya Parampara)</strong> scheme also funds training programmes under named gurus across the country."
            source: pib-kd
      - id: academies
        nav: "Academies"
        eyebrow: "Top elite academies &amp; universities"
        heading: "Where to train — verified 2026-27 details"
        parts:
          - list:
              - "<strong>Kathak Kendra (National Institute of Kathak Dance), New Delhi</strong> — a unit of the Sangeet Natak Akademi, established in 1964; it also teaches Hindustani vocal music, pakhawaj and tabla."
              - "2026-27 forms were available <strong>6–27 June 2026</strong> (online at admission@kathakkendra.in or at the reception), fee ₹200; applicants sit a pre-admission test and are admitted on merit and seats; orientation was on 10 July 2026."
            source: "sna-kk,kk-adm"
          - table:
              caption: "Kathak Kendra fee structure"
              head: ["Course", "Fee"]
              rows:
                - ["Foundation", "₹400 a month"]
                - ["Diploma Pass", "₹450 a month"]
                - ["Preparatory phase (for Diploma Honours)", "₹500 a month"]
                - ["Diploma Honours", "₹500 a month"]
                - ["Post Diploma", "₹650 a month"]
                - ["Refresher", "₹1,250 a month"]
                - ["ICCR scholarship holders", "₹5,000 a month"]
                - ["One-time at admission", "₹300 admission + ₹1,000 security deposit + ₹500 library (non-refundable)"]
            source: kk-fees
          - list:
              - "<strong>Gandharva Mahavidyalaya, New Delhi</strong> (founded 1939, affiliated to Akhil Bharatiya Gandharva Mahavidyalaya Mandal, Mumbai) teaches Kathak and Odissi; dance admission age is <strong>11 and above</strong> (as on 1 May 2026)."
              - "Audition: a 2-minute dance sequence with your own music; Kathak classes are 45 minutes, 3 days a week; 75% attendance is compulsory."
              - "2026-27 fees: form ₹500, admission ₹5,000, tuition and instrument fee <strong>₹3,000 a month</strong> (Indian nationals), all in cash."
              - "For the 2026 batch, the Vidyalaya teaches from Prarambhik to Alankar Purna but <strong>does not hold the Mandal's exams</strong> — students sit them privately at other centres."
            source: gmv-prosp
          - warn: "<strong>Bhatkhande Sanskriti Vishwavidyalaya, Lucknow</strong> also teaches Kathak, but its official website could not be reached when Margdarshan checked (16 Oct 2026), so its seats, fees and dates are not quoted here. Take them only from the university's own notice."
      - id: costs
        nav: "Costs"
        eyebrow: "Costume overheads &amp; who bears the cost"
        heading: "What Kathak training costs — and who pays"
        parts:
          - table:
              caption: "Costs that are published in official notices"
              head: ["Item", "Amount", "Paid by"]
              rows:
                - ["Kathak Kendra Diploma Honours tuition", "₹500 a month (₹6,000 a year)", "Family, or a scholarship"]
                - ["Gandharva Mahavidyalaya, New Delhi", "₹5,000 admission + ₹3,000 a month", "Family"]
                - ["Doordarshan grading / upgrading", "₹2,000 to ₹5,000 per application", "The artiste"]
            source: "kk-fees,gmv-prosp,dd-dance"
          - list:
              - "<strong>Guru's fees, ages 10–14</strong>: the CCRT scholarship reimburses actual tuition paid to the guru or institution up to ₹9,000 a year."
              - "<strong>Advanced training, ages 18–25</strong>: the Ministry of Culture's young-artiste scholarship pays ₹5,000 a month for 2 years."
              - "<strong>Touring abroad</strong>: under the Ministry of Culture's Global Engagement Scheme, all expenditure on deputing an artist to a 'Festival of India' abroad is borne by the Government."
              - "<strong>Institutions</strong>: Sangeet Natak Akademi grants-in-aid to training institutions run from ₹30,000 to ₹1,00,000 a year — and expressly <strong>do not pay for musical instruments, stage lights or other capital items</strong>."
            source: "ccrt-ctss,pib-sya,pib-foi,sna-grants"
          - p: "Gandharva Mahavidyalaya's rules tell dance students to bring their own <strong>ghungroo</strong>, notebook and towel, and to follow the teacher's dress code (kurta-churidar, salwar-kameez or frock-slacks with dupatta)."
            source: gmv-prosp
          - warn: "Ghungroo, stage costumes, jewellery and recorded music are bought by the family. No Government file publishes a price list, and how many bells a ghungroo set carries is the guru's call — so Margdarshan does not print prices. Ask the guru for an itemised list, buy practice wear first, and buy stage costumes only when a performance is fixed."
      - id: earnings
        nav: "Earnings &amp; jobs"
        eyebrow: "Earning channels &amp; government-job reality"
        heading: "How Kathak artistes earn — and what the government offers"
        parts:
          - list:
              - "A Doordarshan grade is <strong>not a salary</strong>: graded artists 'may be given an opportunity to showcase their talent' on Doordarshan's platform when the Kendra needs them."
            source: dd-dance
          - list:
              - "<strong>Guru's Repertory grant</strong>: ₹15,000 a month (Ministry of Culture)."
              - "<strong>Junior / Senior Fellowship</strong>: ₹10,000 / ₹20,000 a month for 2 years of research."
              - "<strong>Festival engagements</strong>: Zonal Cultural Centres engage artists from across India for the Rashtriya Sanskriti Mahotsavs — 14 held since November 2015."
              - "<strong>Old age</strong>: Financial Assistance for Veteran Artists pays up to ₹6,000 a month to artistes aged 60+ with annual income up to ₹72,000; it passes to the spouse on death."
              - "<strong>Prize money</strong>: SNA Yuva ₹25,000, Akademi Puraskar ₹1 lakh, Akademi Ratna ₹3 lakh."
            source: "pib-ksvy,sna-yuva,sna-awards"
          - table:
              caption: "A senior government post in the field — as advertised"
              head: ["Post", "Pay", "Age", "Qualification"]
