  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "What is the difference between Production Engineering and Mechanical Engineering diplomas?"
            a: "Mechanical Engineering is broader, covering machine design, thermal systems and general mechanical principles. Production Engineering focuses specifically on manufacturing processes, factory operations, quality control and production planning — a more specialised, factory-floor-oriented branch."
          - q: "Is CNC machine knowledge important for this diploma?"
            a: "Yes, genuinely important. CNC machine operation and programming is a core, practical skill covered in this diploma, since CNC machines are widely used in modern manufacturing for precision production."
          - q: "Can I join B.Tech Production/Industrial Engineering after this diploma?"
            a: "Yes. Diploma holders can use lateral entry to join the second year of a related B.Tech programme (Production, Industrial, or Mechanical Engineering) directly, through a state lateral entry exam or quota, skipping the first year entirely."
          - q: "What is Quality Control and why does it matter in this field?"
            a: "Quality Control involves inspecting and testing manufactured products to ensure they meet required specifications and standards. It's a genuinely important, well-established career track within Production Engineering, since manufacturing defects can be costly and, in some industries, safety-critical."
          - q: "What jobs can I get with just this diploma, without a further degree?"
            a: "Common roles include production supervisor, quality control inspector, CNC machine operator/programmer, and industrial engineering assistant at manufacturing companies across automotive, consumer goods and industrial equipment sectors."
      - note: "*Fee and salary figures are indicative, based on publicly available information as of 2026, and vary significantly by state, institute and employer — always verify current figures on your state technical education board's official website."
        class: "table-note mt-lg"
