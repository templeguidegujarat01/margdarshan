      - { label: Journey Blueprint, href: journey-blueprint.html, desc: "Career + class + board: your plan, exams and scholarships" }
  # Menus with `nodes` open as a mega panel: a rail of node names on the left, and the hovered node's
  # columns on the right. `mega: <key>` takes the columns from _data/nav_mega.yml, which
  # scripts/build-nav-mega.mjs builds from the hub pages and data (rerun it after adding a career).
  # `badge: stem | health | finance` adds a small category tag after a node's name in the rail.
