  # ------------------------------------------------------------------------------------------------ Karate
  - slug: karate
    short: "Karate"
    domain: combat
    checked: 2026-10-17
    body: "World Karate Federation (WKF) · Indian federation under dispute (IOA ad-hoc committee)"
    card: "WKF 2026 kumite rules — yuko, waza-ari, ippon, the 8-point lead, Senshu, warnings — weight classes from U14 to senior, the Asian Games, India's federation dispute and CRPF posts."
    card_facts: ["Yuko 1 · Waza-ari 2 · Ippon 3", "Win by 8 clear points", "Senior bout 3 min"]
    eyebrow: "Sports Cockpit · Combat &amp; Mat · WKF rules 2026 · Asian Games sport"
    title: "Karate — kumite scoring, weight classes &amp; India's federation tangle"
    lede: "Education Margdarshan's karate map for India in simple words: how a kumite (sparring) bout is scored under the World Karate Federation's 2026 rules, the time limits and warnings, the weight classes from Under 14 to senior, kata in brief, why who runs karate in India matters for your certificate, the Asian Games and World Games, who pays and the CRPF posts for karateka."
    official:
      - { label: "WKF Kumite Rules 2026 (PDF)", url: "https://www.englishkaratefederation.com/uploads/page-images/WKF-2026-Kumite-Competition-Rules-MASTER-COPY_V11.pdf" }
      - { label: "OCA: IOA to oversee karate (2026)", url: "https://oca.asia/news/6939-indian-sports-ministry-directs-ioa-to-oversee-karate-ahead-of-asian-games.html" }
    facts:
      - { label: "Scores", value: "<strong>Yuko 1 · Waza-ari 2 · Ippon 3</strong>", source: wkf-kumite }
      - { label: "Senior bout", value: "<strong>3 minutes</strong> · U21 2 min · cadet/junior 1.5 min", source: wkf-kumite }
      - { label: "Early win", value: "A clear lead of <strong>8 points</strong>", source: wkf-kumite }
      - { label: "Weigh-in tolerance", value: "<strong>0.2 kg</strong> men · <strong>0.5 kg</strong> women", source: wkf-kumite }
    sections:
      - id: rules
        nav: "Kumite scoring"
        eyebrow: "Core rules &amp; selection formats"
        heading: "How a karate (kumite) bout is scored"
        parts:
          - p: "Karate competitions have two events: <strong>kumite</strong> (sparring between two athletes, by weight class) and <strong>kata</strong> (a set pattern of moves performed alone and judged). In kumite, techniques must be controlled — points are for good form, not for hurting the opponent."
            source: "wkf-kumite,crpf26"
          - table:
              caption: "Kumite points (WKF 2026)"
              head: ["Score", "Points", "For"]
              rows:
                - ["<strong>Yuko</strong>", "1", "A straight punch (tsuki) or strike (uchi) to a scoring area"]
                - ["<strong>Waza-ari</strong>", "2", "A kick to the body (chudan)"]
                - ["<strong>Ippon</strong>", "3", "A kick to the head (jodan), or any legal technique on an opponent who is down on the mat"]
            source: wkf-kumite
          - list:
              - "A technique must meet <strong>all six scoring criteria</strong> to count. Hand techniques to the head may only lightly touch the skin (<strong>'skin touch'</strong>, allowed in all age groups); there may be no contact at all with the throat."
              - "You win by a <strong>clear lead of 8 points</strong>, by leading at time-up, by <strong>Senshu</strong> (the first unopposed score, if level), or by referees' decision (Hantei)."
              - "<strong>Kicking an opponent who is lying flat on the floor</strong> is a prohibited act."
            source: wkf-kumite
          - table:
              caption: "Bout duration (effective time)"
              head: ["Category", "Duration"]
              rows:
                - ["Senior", "<strong>3 minutes</strong>"]
                - ["Under 21", "2 minutes"]
                - ["Cadet, junior and Under 14", "1.5 minutes"]
            source: wkf-kumite
          - list:
              - "<strong>Warnings</strong>: <strong>Chui</strong> for smaller fouls (the third Chui means disqualification from the bout) and <strong>Hansoku Chui</strong> for serious ones. Exaggerating or faking an injury is also punished."
            source: wkf-kumite
      - id: recognition
        nav: "Recognition"
        eyebrow: "Institutional &amp; global recognition"
        heading: "Asian Games, World Games — and who runs karate in India"
        parts:
          - list:
              - "Karate is a medal sport at the <strong>2026 Asian Games</strong> and at <strong>The World Games</strong> (kata and kumite). It is <strong>not</strong> on the LA28 Olympic programme."
            source: "ag26,twg25,la28-oly"
          - warn: "<strong>Who runs karate in India is disputed.</strong> In February 2026 the Sports Ministry asked the Indian Olympic Association to set up an <strong>ad-hoc committee</strong>, with the world federation, to manage karate, because at least <strong>five bodies</strong> claimed to be the national federation. Before you pay for any 'national' championship, check which body the Sports Ministry and IOA currently accept — a certificate from an unrecognised body does not count for jobs."
            source: "oca-karate,rrc-wr26"
          - table:
              caption: "Government cash award for a senior karate medal (₹ lakh)"
              head: ["Event", "Gold", "Silver", "Bronze"]
              rows:
                - ["Asian Games", "30", "20", "10"]
                - ["World Championship (every 2 years)", "20", "14", "8"]
                - ["Asian Championship (every year)", "3.75", "2.5", "1.25"]
            source: myas-cash
      - id: eligibility
        nav: "Weights &amp; safety"
        eyebrow: "Physical benchmarks &amp; anti-doping"
        heading: "Weight classes, weigh-in and safety kit"
        parts:
          - table:
              caption: "WKF kumite weight classes (kg)"
              head: ["Category", "Men", "Women"]
              rows:
                - ["<strong>Senior</strong> (18+)", "60 · 67 · 75 · 84 · +84", "50 · 55 · 61 · 68 · +68"]
                - ["Under 21 (18 to under 21)", "60 · 67 · 75 · 84 · +84", "50 · 55 · 61 · 68 · +68"]
                - ["Junior (16 to under 18)", "55 · 61 · 68 · 76 · +76", "48 · 53 · 59 · 66 · +66"]
                - ["Cadet (14 to under 16)", "52 · 57 · 63 · 70 · +70", "47 · 54 · 61 · +61"]
                - ["Under 14 (12 to under 14)", "40 · 45 · 50 · 55 · +55", "42 · 47 · 52 · +52"]
            source: wkf-kumite
          - list:
              - "At the weigh-in the tolerance is <strong>0.2 kg</strong> for men and <strong>0.5 kg</strong> for women."
              - "Under-14 athletes must wear a WKF-approved <strong>helmet</strong> and body protector; girls under 14 also a chest protector."
            source: wkf-kumite
          - list:
              - "Under the anti-doping code you must be <strong>available for testing</strong> and check every medicine against the <strong>Prohibited List</strong>; apply to NADA for a <strong>TUE</strong> if you need a banned medicine."
            source: nada-rr
      - id: roadmap
        nav: "Roadmap"
        eyebrow: "Grassroots-to-elite residential pipeline"
        heading: "From the dojo to the national team"
        parts:
          - table:
              caption: "The karate ladder"
              head: ["Step", "Age", "What happens"]
              rows:
                - ["1. Dojo (club)", "From childhood", "Learn the basics, kata and controlled kumite"]
                - ["2. Under 14 and cadet events", "12–15", "Helmets and protectors compulsory for U14; shorter bouts"]
                - ["3. SAI Training Centre", "12–18", "Karate is one of the 27 STC sports; entry by results and tests"]
                - ["4. Junior and Under 21", "16–20", "Junior and U21 categories at national and international events"]
                - ["5. Senior", "18+", "Asian Championships, World Championships, Asian Games"]
            source: "wkf-kumite,sai-schemes"
      - id: academies
        nav: "Centres"
        eyebrow: "Top elite academies &amp; cities"
        heading: "Where karateka train"
        parts:
          - list:
              - "Karate is taught at <strong>SAI Training Centres</strong> (ages 12–18) but has no SAI National Centre of Excellence; most athletes train in dojos and state-association centres."
            source: sai-schemes
      - id: costs
        nav: "Gear &amp; cost"
        eyebrow: "Equipment costs &amp; who pays"
        heading: "Karategi, protectors and who pays"
        parts:
          - list:
              - "Compulsory WKF-approved kit: <strong>mitts, shin pads and foot protectors</strong> (one athlete in red, one in blue), a <strong>gum shield</strong>, a <strong>body protector</strong> (chest and body protector for women), a groin guard for men, and for under-14s a helmet. Education Margdarshan does not print shop prices — no governing body publishes them."
            source: wkf-kumite
          - table:
              caption: "Who pays — karate ladder"
              head: ["Stage", "Paid by", "What you get"]
              rows:
                - ["SAI centre trainee", "Sports Authority of India", "Coaching, boarding, sports science, diet"]
                - ["Khelo India athlete", "Ministry of Youth Affairs &amp; Sports", "<strong>₹6.28 lakh a year</strong> incl. ₹1.20 lakh cash"]
                - ["Athlete in hardship", "PDU National Welfare Fund", "Up to ₹2.50 lakh"]
            source: "sai-schemes,pib-support"
      - id: earnings
        nav: "Earnings &amp; jobs"
        eyebrow: "Earning channels &amp; central job quotas"
        heading: "CRPF and other sports-quota jobs"
        parts:
          - list:
              - "<strong>CRPF's 2026 sports quota</strong> had karate posts in <strong>kumite</strong> (women −50, −61 and −68 kg; men −55, −60, −67 and −75 kg) and <strong>individual kata</strong>."
            source: crpf26
          - list:
              - "Karate is one of the <strong>65 sports</strong> in the central sports quota for <strong>Group C</strong> posts, with up to 5 years' age relaxation (10 for SC/ST)."
            source: dopt-2022
      - id: traps
        nav: "Red flags"
        eyebrow: "Disqualification traps"
        heading: "Mistakes that cost karateka"
        parts:
          - list:
              - "<strong>Too much contact</strong> — hand techniques to the head may only touch the skin; heavy contact brings warnings."
              - "<strong>Kicking a downed opponent</strong> lying flat on the floor — prohibited."
              - "<strong>Faking injury or overreacting</strong> — Chui or Hansoku Chui."
              - "<strong>Missing weight</strong> by more than 0.2 kg (men) or 0.5 kg (women)."
            source: wkf-kumite
          - list:
              - "<strong>Paying an unrecognised body</strong> for 'national' events — the certificate may be worthless."
            source: "oca-karate,rrc-wr26"
      - id: doubts
        nav: "Player doubts"
        eyebrow: "Real-world player doubts"
        heading: "Certificates, Olympics, jobs — straight answers"
        parts:
          - qa:
              q: "Is karate in the Olympics?"
              a: "Not at LA28. Karate is on the <strong>2026 Asian Games</strong> and <strong>World Games</strong> programmes, and the Ministry's cash award covers World and Asian Championships."
            source: "la28-oly,ag26,twg25,myas-cash"
          - qa:
              q: "My child has many karate 'national' certificates. Do they count?"
              a: "Only if the event was held by a body the Sports Ministry recognised at the time. Railways will <strong>not recruit on a certificate from a federation MoYAS did not recognise</strong>, and CRPF counts only championships of MoYAS-recognised federations or the IOA's National Games. In 2026 several bodies claimed to run Indian karate, so check carefully."
            source: "rrc-wr26,crpf26,oca-karate"
          - qa:
              q: "Which government jobs can karate get me?"
              a: "<strong>CRPF's 2026 sports quota</strong> had kumite and kata posts, and DoPT lists karate for central <strong>Group C</strong> posts. Western Railway's 2026-27 notice had <strong>no karate posts</strong>."
            source: "crpf26,dopt-2022,rrc-wr26"
          - table:
              caption: "Sports-quota job routes open in 2026 — age, qualifying results, pay"
              head: ["Route", "Age", "Main qualifying results", "Pay level"]
              rows:
                - ["Railways <strong>Level 5/4</strong> (graduates)", "18–25 on 1 Jan 2027", "Played the <strong>Olympics</strong>, or top 3 at a World Cup, World Championship, Asian Games, Commonwealth Games or Youth Olympics", "Level 5/4"]
                - ["Railways <strong>Level 3/2</strong> (12th, or 10th + apprenticeship)", "18–25 on 1 Jan 2027", "Top 3 at <strong>Senior, Youth or Junior Nationals</strong>, National Games or All India Inter-University; or Federation Cup gold", "Level 3/2"]
                - ["Railways <strong>Level 1</strong>", "18–25 on 1 Jan 2027", "Played for your state and finished <strong>at least 8th at Senior Nationals</strong>; or top 3 at the Federation Cup", "Level 1"]
                - ["CRPF <strong>Head Constable (GD)</strong> (10+2)", "18–23 on 1 Aug 2026; sportspersons get <strong>+5 years</strong> (OBC +8, SC/ST +10)", "Played for India; or top 3 for your state at Nationals or National Games; or <strong>gold/silver at Junior Nationals</strong>", "Level 4 · ₹25,500–81,100"]
                - ["CRPF <strong>Constable (GD)</strong> (10th pass)", "18–23 on 1 Aug 2026; sportspersons get <strong>+5 years</strong> (OBC +8, SC/ST +10)", "Played for your state at <strong>Senior or Junior Nationals</strong>; or top 3 at SGFI school nationals or Khelo India Games", "Level 3 · ₹21,700–69,100"]
            source: "rrc-wr26,crpf26"
          - note: "Railways count results from <strong>1 April 2024</strong>; CRPF counts the <strong>two years before 30 September 2026</strong>. Railways fee ₹500 (₹400 back if you attend the trial; ₹250, refunded in full on attending, for SC/ST, women, PwBD, minorities, ex-servicemen and EBC). CRPF fee ₹100 for UR/OBC/EWS men; free for women, SC, ST and ex-servicemen. CRPF picks sign a <strong>₹1 lakh bond to serve at least 3 years</strong>."
            source: "rrc-wr26,crpf26"
