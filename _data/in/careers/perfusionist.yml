hero:
  eyebrow: "Science (PCB) · Allied Health"
  title: "Perfusionist — Running the Heart-Lung Machine"
  meta:
    - "Allied health profession (NCAHP Act, 2021)"
    - "Class 12 with Physics, Chemistry & Biology"
  read_time: "8 min read"
  intro:
    - "During open-heart surgery the heart is stopped — and a perfusionist runs the heart-lung machine that keeps the patient alive. Perfusionists also manage ECMO (life support) in intensive care. The route is a B.Sc in Perfusion Technology (often with a one-year internship) at a medical college or health-sciences university. It is one of the allied health professions covered by the National Commission for Allied and Healthcare Professions Act, 2021."
  quickfacts:
    - label: "Degree"
      value: "B.Sc Perfusion Technology"
    - label: "Duration"
      value: "3–4 yrs incl. internship (varies)"
