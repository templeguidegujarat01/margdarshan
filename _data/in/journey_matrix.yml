  # ------------------------------------------------------------------ CIVIL SERVICES (batch 2)
  - id: civil-services
    name: "Civil Servant (UPSC Civil Services — IAS, IPS, IFS)"
    search: ["indian administrative service", "indian police service", "indian foreign service", "ias officer", "ips officer", "civil servant"]
    page: "upsc-civil-services.html"
    roadmap: "roadmaps/upsc-civil-services.html"
    gate: "Any graduate aged 21–32 (more for SC, ST, OBC and others) → Preliminary (screening) → Main (9 written papers) → Personality Test → service by rank and preference."
    gate_source: cse26
    foundation:
      - stages: [c8, c9]
        title: "Read widely and write every week"
        points:
          - text: "Prelims General Studies and the Main Essay and GS papers cover heritage, history, geography, polity, economy, environment, technology and ethics — your school Social Science and Science books are the first layer."
            source: cse26
          - text: "Read a newspaper daily and write short answers on what you read. Writing speed matters: every Main paper is a 3-hour essay-type paper."
            source: cse26
      - stages: [c10]
        title: "Any stream is fine — choose what you can score in"
        points:
          - text: "The exam asks only for a <strong>graduate degree in any subject</strong> from a recognised university. No Class 10 or 12 stream or percentage is checked."
            source: cse26
          - text: "Pick a Class 11 stream you enjoy; a degree subject you like often becomes your Optional paper later."
      - stages: [c11, c12]
        title: "Plan your language — you may write Main in it"
        points:
          - text: "You may answer every Main paper except the two qualifying language papers in <strong>any language of the Eighth Schedule</strong> (including Hindi, Gujarati, Marathi and Bengali) or in English. Prelims papers are set in Hindi and English."
            source: cse26
          - text: "Main Paper A (an Indian language) and Paper B (English) are of Matriculation standard and only need <strong>25% each</strong>; they do not count for rank."
            source: cse26
      - stages: [grad]
        title: "Final-year students can apply"
        points:
          - text: "You can sit Prelims while your final degree exam is pending; proof of passing is needed only if you reach the interview."
            source: cse26
          - text: "Age <strong>21–32</strong> on 1 August of the exam year (CSE 2026); upper limit +5 years for SC/ST and +3 for OBC. Attempts: 6 (General / EWS), 9 (OBC and PwBD), unlimited for SC/ST."
            source: cse26
    board_notes:
      gseb: "<strong>Gujarati</strong> is an Eighth Schedule language: you may choose it for Main Paper A and write the GS, Essay and Optional papers in it."
      cbse-gj: "You may write Main in English or in an Eighth Schedule language such as Gujarati or Hindi; Prelims is in Hindi and English."
      upmsp: "You may write Main in <strong>Hindi</strong> and pick Hindi for Paper A; Prelims papers are also set in Hindi."
      msbshse: "<strong>Marathi</strong> is an Eighth Schedule language: you may choose it for Main Paper A and write the GS, Essay and Optional papers in it."
      wb: "<strong>Bengali</strong> is an Eighth Schedule language: you may choose it for Main Paper A and write the GS, Essay and Optional papers in it."
      cbse: "You may write Main in English or any Eighth Schedule language; Prelims is in Hindi and English."
      other: "If your state language is in the Eighth Schedule, you may write Main in it; Prelims is in Hindi and English."
    board_source: cse26
    exam:
      name: "UPSC Civil Services Examination 2026 (Notice 05/2026-CSE)"
      body: "Union Public Service Commission"
      href: "upsc-civil-services.html"
      facts:
        - { label: "Vacancies (approx.)", value: "933, incl. 33 for PwBD", source: cse26 }
        - { label: "Prelims date", value: "24 May 2026", source: cse26 }
        - { label: "Fee", value: "₹100 Prelims + ₹200 Main · women, SC, ST, PwBD exempt", source: cse26 }
        - { label: "Age", value: "21–32 on 1 Aug 2026 (relaxations by category)", source: cse26 }
      stages:
        head: ["Stage", "Papers", "Marking", "Rule"]
        rows:
          - ["Preliminary", "GS Paper I + GS Paper II (CSAT): 200 marks each, 2 hours each, objective", "−1/3 of the question's marks per wrong answer", "Screening only; GS II needs 33%; about 12–13 times the vacancies go to Main"]
          - ["Main — written", "Essay, GS I–IV and two Optional papers (250 marks each, 1,750 in all) + qualifying Paper A (Indian language) and Paper B (English), 300 each; 3 hours per paper", "Conventional essay type", "Papers A and B need 25% each and do not count for rank"]
          - ["Personality Test", "Interview, 275 marks", "No minimum qualifying marks", "About twice the vacancies are called"]
          - ["Final merit", "Main written + interview = 2,025 marks", "—", "Ties: compulsory papers + interview, then compulsory papers, then the older candidate"]
        source: cse26
      notes:
        - text: "Services are allotted by your rank and the order of preference you give for services and posts."
          source: cse26
        - text: "This is the 2026 notice. UPSC publishes the CSE 2027 notice early in 2027 on upsc.gov.in — check age, attempts and vacancies there."
    state_rules:
      - text: "Paper A (Indian language) is <strong>not compulsory</strong> for candidates from Arunachal Pradesh, Manipur, Meghalaya, Mizoram, Nagaland and Sikkim."
        source: cse26
      - text: "Selection is on one all-India rank list; the notice prints no state quota for candidates. Your state language matters through the medium you choose for Main."
        source: cse26
      - state: west-bengal
        text: "The West Bengal <strong>Student Credit Card</strong> loan covers coaching for competitive exams such as IAS, IPS and WBCS (see Money help)."
        source: wbscc
    multiverse:
      - { title: "IAS, IPS, IFS and more", text: "One exam fills many central services; your rank and preference decide which.", href: "upsc-civil-services.html" }
      - { title: "State civil services", text: "Your state PSC exam (GPSC, UPPSC, MPSC, WBCS) runs on a similar pattern.", href: "state/gujarat/gpsc.html" }
      - { title: "CAPF Assistant Commandant", text: "UPSC's exam for officer posts in the central armed police forces.", href: "upsc-capf-ac.html" }
      - { title: "Coaching", text: "UPSC coaching centres near you.", href: "coaching-upsc.html" }
    money: [nmmss, csss, pms-sc, upsc-fee, wbscc, mysy]

  # ------------------------------------------------------------------ DOCTOR / PHYSICIAN (batch 3)
  - id: doctor
    name: "Doctor / Physician (NEET-UG → MBBS)"
    search: ["doctor", "physician", "general physician", "mbbs"]
    search_not: ["veterinary", "ayurvedic", "siddha", "unani", "homoeopathic", "naturopathy"]
    page: "mbbs.html"
    roadmap: "roadmaps/mbbs.html"
    gate: "Class 12 with Physics, Chemistry, Biology and English → NEET (UG) → MBBS seat through MCC (All India Quota) or your state's counselling → rotating internship of at least 12 months → registration with your State Medical Council and the National Medical Register."
    gate_source: [neet-ib, crmi, nmc-reg]
    foundation:
      - stages: [c8, c9]
        title: "Biology is half the NEET paper"
        points:
          - text: "NEET (UG) has <strong>Physics 45, Chemistry 45 and Biology 90 questions</strong> — 180 in all, 720 marks. Biology alone carries 360 marks."
            source: neet-ib
          - text: "Read your Science textbook properly now: Class 11–12 Biology and Chemistry build directly on Class 8–10 chapters."
      - stages: [c10]
        title: "Choose Science with Biology for Class 11"
        points:
          - text: "NMC allows NEET (UG) only after 10+2 with <strong>Physics, Chemistry, Biology / Biotechnology and English</strong>."
            source: gmer
          - text: "Took Mathematics instead of Biology? Since NMC's November 2023 notice, Biology passed later as an additional subject from a recognised board also counts."
            source: neet-ib
      - stages: [c11, c12]
        title: "NEET year — and the qualifying percentile"
        points:
          - text: "Minimum age <strong>17 on or before 31 December</strong> of the exam year. There is <strong>no upper age limit</strong> and no cap on attempts."
            source: neet-ib
          - text: "To be eligible for admission you need the <strong>50th percentile</strong> (General / EWS), 40th (SC, ST, OBC) or 45th (PwBD General) in NEET."
            source: neet-ib
          - text: "You can sit NEET while your Class 12 result is awaited, but you must have passed by the first counselling round."
            source: neet-ib
      - stages: [grad]
        title: "After MBBS: internship, then registration"
        points:
          - text: "At most <strong>4 attempts</strong> at the first-year MBBS exam, and the course must be finished within <strong>9 years</strong> of admission."
            source: gmer
          - text: "You are not a graduate until you finish a rotating internship of <strong>at least 12 months</strong> after the final MBBS exam. Interns are paid a stipend set by the institution's authority."
            source: crmi
          - text: "Your State Medical Council registers you provisionally for the internship. The 2023 Registration Regulations then link National Medical Register entry to the National Exit Test (NExT); the licence is valid for <strong>5 years</strong> and is renewed through the State Medical Council."
            source: nmc-reg
    board_notes:
      gseb:
        text: "ACPUGMEC's Gujarat state-quota process is for students who passed <strong>SSC and HSC (Science B / AB group) from Gujarat</strong> and are domiciled in or born in Gujarat. The merit list is built on your NEET-UG All India Rank."
        source: [acpug-reg, acpug-ins]
      cbse-gj:
        text: "ACPUGMEC accepts Gujarat Board, CBSE, ICSE, Cambridge and NIOS students — as long as SSC and HSC were passed from Gujarat and you are domiciled in or born in Gujarat."
        source: acpug-reg
      upmsp:
        text: "UP government medical and dental colleges need a <strong>UP domicile</strong>; if you passed both High School and Intermediate in UP, no domicile certificate is needed. Private colleges in UP are open to candidates from other states too."
        source: up-neet
      msbshse:
        text: "The State CET Cell fills MBBS and BDS seats in Maharashtra's government, aided, municipal and private colleges on NEET (UG) merit. You must register with it separately even if you registered for All India Quota counselling."
        source: mh-neet3
      wb:
        text: "West Bengal state-quota seats need a domicile certificate: 10 years' residence as on 31 Dec 2025 with Class 10 and 12 passed in West Bengal — or a parent who is a permanent resident living there for those 10 years."
        source: wb-neet
      cbse: "NEET (UG) is one national paper for every board; Class 12 must include Physics, Chemistry, Biology / Biotechnology and English."
      other: "NEET (UG) is offered in 13 languages, including Assamese, Bengali, Gujarati, Hindi, Marathi, Odia, Tamil and Telugu. State-quota seats follow your own state's domicile rule."
    board_source: neet-ib
    exam:
      name: "NEET (UG) 2026 → MCC / state counselling"
      body: "National Testing Agency (NTA) · Medical Counselling Committee · state authorities"
      href: "neet-ug.html"
      facts:
        - { label: "Paper", value: "180 questions · 720 marks · 3 hours, pen and paper", source: neet-ib }
        - { label: "Marking", value: "+4 correct · −1 wrong · 0 unanswered", source: neet-ib }
        - { label: "Fee (India centre)", value: "₹1,700 General · ₹1,600 EWS / OBC-NCL · ₹1,000 SC / ST / PwBD / third gender", source: neet-ib }
        - { label: "2026 cycle", value: "Re-held 21 June 2026 · result 16 July 2026", source: [neet-re, neet-res] }
      stages:
        head: ["Stage", "What it is", "Marking", "Rule"]
        rows:
          - ["NEET (UG)", "Physics 45, Chemistry 45, Biology 90 questions — all compulsory MCQs", "+4 / −1", "Qualify at the 50th percentile (General / EWS), 40th (SC, ST, OBC), 45th (PwBD General)"]
          - ["MCC counselling", "15% All India Quota in state government colleges, AIIMS, JIPMER, central universities, ESIC and deemed universities", "—", "Central reservation: SC 15%, ST 7.5%, OBC-NCL 27%, EWS 10%, PwBD 5%"]
          - ["State counselling", "ACPUGMEC (Gujarat), DGME (UP), State CET Cell (Maharashtra), DME (West Bengal)", "—", "Each state's own domicile and reservation rules — see block 03"]
          - ["MBBS + internship", "University exams, then a rotating internship of at least 12 months", "—", "Max 4 attempts at first-year MBBS; finish within 9 years of admission"]
        source: [neet-ib, gmer, crmi]
      notes:
        - text: "The NEET fee does not change with gender, and no fee was charged for the 21 June 2026 re-examination."
          source: [neet-ib, neet-re]
        - text: "Government doctors through UPSC CMS 2026 start at Pay Matrix Level 10 (₹56,100 – ₹1,77,500) plus non-practising allowance."
          source: cms
        - text: "These are the 2026 rules. NTA publishes the NEET (UG) 2027 bulletin on neet.nta.nic.in — check dates, fees and pattern there the day it is out."
    state_rules:
      - state: gujarat
        text: "ACPUGMEC registration costs a <strong>₹1,000 PIN plus a ₹10,000 refundable security deposit</strong>. One application covers Government seats and the management seats of unaided medical and dental colleges."
        source: [acpug-reg, acpug-ins]
      - state: uttar-pradesh
        text: "UP NEET UG 2026 counselling: ₹2,000 registration fee; security money <strong>₹30,000</strong> for government colleges and <strong>₹2,00,000</strong> for private medical colleges (₹2,00,000 covers both). Government MBBS / BDS students sign a <strong>2-year, ₹10 lakh service bond</strong>; leaving a government seat after the last round bars you from the next year's admission."
        source: up-neet
      - state: maharashtra
        text: "In 2026, Round 1 of Maharashtra's MBBS / BDS CAP ran from registration on 6 August to college joining by 28 August, on NEET (UG) 2026 merit."
        source: mh-neet3
      - state: west-bengal
        text: "Only a domicile certificate signed by an officer listed in the DME notice counts. Certificates from councillors, panchayat members, MLAs or MPs are not accepted."
        source: wb-neet
      - text: "MCC fills the 15% All India Quota, AIIMS, JIPMER, central-university, ESIC and deemed-university seats; state authorities fill the state-quota seats under their own rules."
        source: [neet-ib, neet-res]
    multiverse:
      - { title: "MBBS", text: "The degree route to becoming a doctor.", href: "mbbs.html" }
      - { title: "BDS", text: "Dentistry through the same NEET rank.", href: "bds.html" }
      - { title: "AYUSH (BAMS and more)", text: "Ayurveda and other AYUSH degrees, also on NEET.", href: "bams.html" }
      - { title: "Government doctor", text: "UPSC CMS for central health service posts after MBBS.", href: "upsc-cms.html" }
      - { title: "Nursing", text: "A clinical career with its own entrance tests.", href: "nursing.html" }
      - { title: "Coaching", text: "NEET coaching centres near you.", href: "coaching-neet.html" }
    money: [nmmss, neet-fee, csss, pms-sc, mysy, wbscc, mbbs-intern]

  # ------------------------------------------------------------------ REGISTERED NURSE (batch 3)
  - id: nurse
    name: "Registered Nurse (B.Sc Nursing / GNM)"
    search: ["nurse", "nursing officer", "staff nurse"]
    page: "nursing.html"
    roadmap: "roadmaps/nursing.html"
    gate: "Class 12 Science with 45% in Physics, Chemistry and Biology and a pass in English → state nursing entrance or merit list → 4-year B.Sc Nursing → registration with your State Nursing Council. Or Class 12 with English and 40% → GNM diploma."
    gate_source: [inc-bsc, inc-elig]
    foundation:
      - stages: [c8, c9]
        title: "Science, English and care"
        points:
          - text: "INC's model entrance test has five parts of 20 marks each: <strong>Aptitude for Nursing, Physics, Chemistry, Biology and English</strong>. You need 50% to qualify."
            source: inc-bsc
          - text: "Volunteer at a health camp or learn first aid — it tells you early whether patient care suits you."
      - stages: [c10]
        title: "Pick Science with Biology — or know the GNM door"
        points:
          - text: "B.Sc Nursing needs Class 12 Science with <strong>45% in Physics, Chemistry and Biology taken together</strong> (40% for SC, ST and OBC) and a pass in English."
            source: inc-bsc
          - text: "GNM needs Class 12 with English and <strong>40%</strong> in the qualifying exam and in English, from any recognised board — Science is preferred, not compulsory. SC / ST candidates get 5% relaxation."
            source: inc-elig
      - stages: [c11, c12]
        title: "Entrance year"
        points:
          - text: "Minimum age <strong>17 on 31 December</strong> of the admission year. Married candidates may apply; colour-blind candidates are eligible with corrective lenses; you must be medically fit."
            source: inc-bsc
          - text: "Admission is once a year: the semester starts on 1 August and no admission is allowed after 30 September."
            source: inc-bsc
          - text: "NIOS and State Open School students with Science and English are also eligible."
            source: inc-bsc
      - stages: [grad]
        title: "Inside the degree — and registration"
        points:
          - text: "B.Sc Nursing runs <strong>8 semesters</strong>; the last semester is an internship of 22 weeks (1,056 hours)."
            source: inc-bsc
          - text: "After the degree you register with your <strong>State Nurses and Midwives Registration Council</strong> as RN &amp; RM; renewing that registration needs Continuing Nursing Education every 5 years."
            source: inc-bsc
    board_notes:
      gseb:
        text: "Gujarat's admission committee fills B.Sc Nursing and GNM seats from a <strong>merit list built on your board marks</strong> — the merit report shows your HSC PCB total, Class 12 total and English, and SSC marks. There is no entrance test, and boys get a separate male merit list for these two courses."
        source: gj-nur
      cbse-gj:
        text: "The Gujarat nursing merit report records your board (GSEB, CBSE and others) with your Class 12 and Class 10 marks. Read the current year's rules on medadmgujarat.org for how CBSE marks are counted."
        source: gj-nur
      upmsp:
        text: "UP's <strong>CNET 2026</strong> (by ABVMU) is the only door into B.Sc Nursing at ABVMU colleges, SGPGIMS, KGMU, RMLIMS, UPUMS Saifai and LLRM Meerut. Government colleges need UP domicile — or both High School and Intermediate passed in UP."
        source: up-cnet
      msbshse:
        text: "MH-Nursing-CET needs <strong>SSC and HSC passed in Maharashtra</strong> (HSC with English, Physics, Chemistry and Biology) and a Maharashtra domicile, apart from the brochure's listed exceptions."
        source: mh-ncet
      wb:
        text: "JENPAS(UG) admits only <strong>West Bengal domiciles</strong>, to any seat. Government-college B.Sc Nursing seats are for female candidates only; a few private colleges take male candidates."
        source: jenpas
      cbse: "INC's rule is the same for every board: 45% in Physics, Chemistry and Biology taken together and a pass in English."
      other: "Each state runs its own nursing entrance or merit list, but INC's minimum — 45% in PCB and a pass in English — applies everywhere."
    board_source: inc-bsc
    exam:
      name: "State nursing entrance tests 2026 (INC rules) → state counselling"
      body: "Indian Nursing Council rules · state universities and boards"
      href: "nursing.html"
      facts:
        - { label: "INC test pattern", value: "Aptitude for Nursing, Physics, Chemistry, Biology, English — 20 marks each", source: inc-bsc }
        - { label: "Qualify (INC)", value: "50% in the entrance test", source: inc-bsc }
        - { label: "Run by", value: "A university or the state government", source: inc-bsc }
        - { label: "Degree", value: "4 years, 8 semesters, last semester internship", source: inc-bsc }
      stages:
        head: ["State test (2026)", "Pattern", "Marking", "Qualify"]
        rows:
          - ["UP — CNET (ABVMU), 6 Jun 2026", "120 MCQs: Nursing Aptitude, Physics, Chemistry, Biology, English (20% each); English and Hindi", "1 mark each, no negative marking", "50th percentile General, 45th General-PwD, 40th SC / ST / OBC"]
          - ["Maharashtra — MH-Nursing-CET", "100 MCQs in 90 minutes: Physics, Chemistry, Biology, English, Nursing Aptitude (20 each); English only", "1 mark each, no negative marking", "50 percentile Open / EWS, 40 reserved, 45 General-PwD"]
          - ["West Bengal — JENPAS(UG), 7 Jun 2026", "Paper I: 100 questions, 115 marks — Physics, Chemistry, Biology, Basic English, Health Aptitude", "1-mark questions −¼ if wrong; 2-mark questions no negative", "50th percentile General / EWS, 45th General-PwD, 40th SC / ST / OBC"]
          - ["Gujarat — no test", "Admission committee merit list from board marks", "—", "Separate male merit for B.Sc Nursing and GNM"]
        source: [up-cnet, mh-ncet, jenpas, gj-nur]
      notes:
        - text: "2026 fees: UP CNET ₹3,000 (₹2,000 SC / ST / PwD); MH-Nursing-CET ₹1,300 (₹1,000 reserved, PwD, orphan and other gender); JENPAS(UG) ₹500 for one paper (₹400 SC / ST / OBC / EWS)."
          source: [up-cnet, mh-ncet, jenpas]
        - text: "NEET (UG) results are also used for B.Sc (Hons) Nursing at selected central institutes."
          source: neet-res
        - text: "These are the 2026 tests. Each state posts its 2027 bulletin early in 2027 — check the fee, date and pattern there."
    state_rules:
      - state: gujarat
        text: "One Gujarat merit list covers B.Sc Nursing, GNM, ANM, BPT, BOT, BASLP, optometry and other allied courses; your merit report shows which of them you are eligible for."
        source: gj-nur
      - state: uttar-pradesh
        text: "UP's GNM entrance (UPGET 2026) asks for 10+2 with English and <strong>40%</strong> (three core subjects, English excluded but passed), with 5% relaxation for SC / ST. Fee ₹3,000 (₹2,000 SC / ST / PwD)."
        source: up-get
      - state: maharashtra
        text: "Maharashtra's GNM (Public Health Department) needs HSC Science with Physics, Chemistry and Biology and <strong>45% aggregate</strong> — stricter than INC's 40%. NRIs may take only the 15% institute quota in unaided private colleges."
        source: mh-ncet
      - state: west-bengal
        text: "JENPAS(UG) sets no upper age limit for Nursing. A reserved-category candidate without a domicile certificate may use the category certificate instead — but if that is rejected, the candidate becomes non-West Bengal."
        source: jenpas
      - text: "Reservation follows the central or state policy of the college. 5% of seats go to candidates with 40–50% locomotor disability of the lower limbs."
        source: inc-bsc
    multiverse:
      - { title: "B.Sc Nursing", text: "The 4-year degree route to Registered Nurse.", href: "nursing.html" }
      - { title: "GNM diploma", text: "The diploma route, open to more streams.", href: "gnm-nursing.html" }
      - { title: "Nursing colleges", text: "Find nursing colleges near you.", href: "colleges-nursing.html" }
      - { title: "AIIMS Nursing Officer", text: "NORCET, the exam for nursing officer posts at AIIMS.", href: "aiims-norcet.html" }
      - { title: "Physiotherapy", text: "Another clinical degree on the same merit lists in many states.", href: "bpt.html" }
    money: [nmmss, csss, pms-sc, mysy, wbscc]

  # ------------------------------------------------------------------ DEFENCE OFFICER VIA NDA (batch 3)
  - id: nda-officer
    name: "Defence Officer via NDA (Army, Navy, Air Force)"
    search: ["nda", "indian army", "indian navy", "indian air force"]
    search_not: ["medical", "education", "architect", "inspector", "commando", "meteorology", "logistics", "hydrographic", "air traffic", "administration", "flight test"]
    page: "nda.html"
    roadmap: "roadmaps/nda.html"
    gate: "Unmarried and born inside the notice's window (1 Jan 2008 – 1 Jan 2011 for NDA (II) 2026) → Class 12 (Physics, Chemistry and Maths for Navy and Air Force) → UPSC NDA & NA written exam → SSB interview (+ pilot test for flying) → 3 years at NDA → service academy → commission as an officer."
    gate_source: nda226
    foundation:
      - stages: [c8, c9]
        title: "Maths and English decide the written paper"
        points:
          - text: "The written exam is <strong>Mathematics (300 marks)</strong> and the <strong>General Ability Test (600)</strong> — English 200 + General Knowledge 400 (Physics, Chemistry, General Science, Social Studies, Geography and Current Events). No calculators."
            source: nda226
          - text: "Start running and swimming now. Medical and physical standards are checked after SSB, and they are listed in Appendix III of every notice."
            source: nda226
      - stages: [c10]
        title: "Choose PCM if you want the Navy or Air Force"
        points:
          - text: "<strong>Army wing:</strong> Class 12 pass in any stream. <strong>Air Force and Naval wings</strong>, and the 10+2 Cadet Entry at the Indian Naval Academy: Class 12 with <strong>Physics, Chemistry and Mathematics</strong>."
            source: nda226
          - text: "Your Class 10 certificate is the only proof of date of birth UPSC accepts — check that it is correct now."
            source: nda226
      - stages: [c11, c12]
        title: "Apply while you are in Class 12"
        points:
          - text: "Students appearing in Class 12 can apply; proof of passing was due by <strong>10 June 2027</strong> for NDA (II) 2026. Class 11 students cannot apply."
            source: nda226
          - text: "You must stay <strong>unmarried until training ends</strong>. A cadet who marries during training is discharged and must refund the cost of training."
            source: nda226
          - text: "UPSC holds the NDA &amp; NA exam twice a year (I and II), so a Class 12 student usually gets more than one try inside the age window."
      - stages: [grad]
        title: "Past the age window?"
        points:
          - text: "NDA is a school-level entry. After the birth-date window closes, graduate entries such as UPSC's Combined Defence Services exam are the route to a commission."
    board_notes:
      gseb: "UPSC counts your GSEB HSC like any 10+2 pass; your <strong>SSC certificate</strong> is the only accepted proof of date of birth."
      cbse-gj: "Your CBSE Class X certificate is the only proof of date of birth UPSC accepts — no birth certificates, affidavits or horoscopes."
      upmsp: "Your UP Board High School certificate fixes your date of birth for UPSC. Agra, Aligarh, Bareilly, Gorakhpur, Kanpur, Lucknow, Meerut, Prayagraj and Varanasi are among the exam centres."
