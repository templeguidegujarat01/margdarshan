          - myth: "You can only succeed in performing arts if you started training as a young child."
            fact: "Starting young helps, especially for classical forms, but many performers, particularly in theatre and contemporary dance, build genuine careers after starting serious training as teenagers or in college."
          - myth: "Performing arts careers always mean unstable, poverty-level income."
            fact: "Many performers build stable income by combining performance with teaching, choreography or arts administration — full instability isn't the norm for disciplined, business-savvy performers."
          - myth: "You need a formal degree to be taken seriously as a performer."
