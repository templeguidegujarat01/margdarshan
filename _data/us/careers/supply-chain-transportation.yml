# Supply Chain & Transportation careers (USA Master Plan Phase 4: logistics management, placed here by the crosswalk).
# Schema: comment at the top of _includes/us-career-overview.html. Every fact is copied from the page its `source`
# names, opened 2026-10-20: BLS Occupational Outlook Handbook (pay May 2025, jobs 2025, outlook 2025–35; pages last
# modified 27 Aug 2026) and ASCM (_data/us/sources.yml). The cluster's trades (automotive, diesel …) stay in
# _data/us/cte_careers.yml; the rest of the cluster is Master Plan Phase 7.
# Batches 1–2 and notes: docs/us-edition/PHASE-4-MANAGEMENT-MARKETING.md.
checked: 2026-10-20
review_by: 2027-04-20
list:

  # 255,100 jobs
  - slug: logistician
    short: "Logistician"
    title: "Logistician: supply chain or business degree, related experience, optional supply chain certification"
    eyebrow: "Supply Chain & Transportation · Planning & Logistics"
    lede: "Logisticians typically need a bachelor's degree in logistics and supply chain management, business or a related field, although less education may be enough for some jobs. Employers often prefer related experience, and some let experience substitute for the degree."
    for: "Organized problem-solvers who like keeping goods, parts and supplies moving on time."
    soc: ["13-1081"]
    does: { text: "Logisticians analyze and coordinate an organization’s supply chain.", source: ooh_qf_logistician }
    work: { text: "Logisticians work in many industries. Most work full time, and some work more than 40 hours per week.", source: ooh_qf_logistician }
    become: { text: "Logisticians typically need a bachelor’s degree, although less education may be sufficient for some jobs. Employers may prefer work experience, especially when hiring candidates who do not have a degree.", source: ooh_qf_logistician }
    metrics: { pay: 82320, pay_hour: "39.58", pay_by: "Logisticians", jobs: 255100, outlook: 18, outlook_words: "Much faster than average", change: 44900, entry: "Bachelor's degree", training: "None", source: ooh_qf_logistician }
    license_text: "None"
    routes:
      - id: degree
        title: "Supply chain or business degree → logistician"
        tag: "Typical"
        who: "Coursework includes accounting, economics, procurement and other business topics. Internships during college give experience."
        steps:
          - { tag: "Start", title: "High school diploma", text: "", kind: start, source: ooh_logistician }
          - { tag: "About 4 years", title: "Bachelor's in logistics and supply chain management or business", text: "", kind: stage, source: ooh_logistician }
          - { tag: "During college", title: "Internship", text: "", kind: stage, source: ooh_logistician }
          - { tag: "Goal", title: "Logistician", text: "Experienced logisticians may advance to supply chain manager or project management specialist.", kind: goal, source: ooh_logistician, href: "us/careers/project-management-specialist/", link: "Project manager" }
      - id: experience
        title: "Logistics support job or military → logistician"
        tag: "Experience instead of a degree"
        who: "Some employers allow candidates to substitute work experience for a specific degree."
        steps:
          - { tag: "Start", title: "High school diploma", text: "", kind: start, source: ooh_logistician }
          - { tag: "Work", title: "Logistical support role or military service", text: "For example, as a material recording clerk.", kind: stage, source: ooh_logistician }
          - { tag: "Goal", title: "Logistician", text: "", kind: goal, source: ooh_logistician }
      - id: cscp
        title: "APICS CSCP certification"
        tag: "Voluntary"
        who: "ASCM's Certified Supply Chain Professional covers the supply chain end to end, from suppliers to customers."
        steps:
          - { tag: "Start", title: "Working in supply chain or logistics", text: "", kind: start, source: ascm_cscp }
          - { tag: "Exam", title: "CSCP exam", text: "One exam covering eight modules: 150 questions in 3.5 hours, scored 200–350; above 300 passes.", kind: exam, source: ascm_cscp }
          - { tag: "Goal", title: "Certified Supply Chain Professional", text: "", kind: goal, source: ascm_cscp }
    certs:
      - { name: "Logistics certification", who: "Professional associations", kind: "Voluntary", text: "Not required, but it demonstrates professional competence and a broad knowledge of logistics.", source: ooh_logistician }
      - { name: "APICS CSCP", who: "Association for Supply Chain Management (ASCM)", kind: "Voluntary", text: "One exam of 150 questions in 3.5 hours.", source: ascm_cscp }

  # 228,100 jobs
  - slug: logistics-manager
    short: "Transportation & Distribution Manager"
    title: "Transportation, storage and distribution manager: high school diploma or degree, then years of related work"
    eyebrow: "Supply Chain & Transportation · Planning & Logistics"
    lede: "Transportation, storage and distribution managers typically need a high school diploma, though some employers prefer or require a bachelor's degree, plus several years of related work experience. Some need a driver's license or a commercial driver's license (CDL)."
    for: "Hands-on leaders who like running warehouses, fleets or distribution networks and fixing problems fast."
    soc: ["11-3071"]
    does: { text: "Transportation, storage, and distribution managers plan, direct, or coordinate the movement of people and goods.", source: ooh_qf_logmgr }
    work: { text: "Most transportation, storage, and distribution managers work full time, and some work more than 40 hours per week.", source: ooh_qf_logmgr }
    become: { text: "Transportation, storage, and distribution managers typically need a high school diploma, although some employers prefer or require a bachelor’s degree. They also need related work experience to enter the occupation.", source: ooh_qf_logmgr }
    metrics: { pay: 107230, pay_hour: "51.55", pay_by: "Transportation, storage, and distribution managers", jobs: 228100, outlook: 6, outlook_words: "Faster than average", change: 14000, entry: "High school diploma or equivalent", experience: "5 years or more", training: "None", source: ooh_qf_logmgr }
    license_text: "Driver's license or CDL for some jobs"
    states_note: "Some managers may need a driver's license or a commercial driver's license (CDL). Depending on the goods or facility, some states have additional licensing requirements, and managers who oversee some workers, such as engineers or marine captains, may need that occupation's license."
    states_source: ooh_logmgr
    routes:
      - id: work-up
        title: "Warehouse or transport job → supervisor → manager"
        tag: "Typical"
        who: "For example, hand laborers and material movers may progress to first-line supervisors before qualifying for storage and warehouse manager positions."
        steps:
          - { tag: "Start", title: "High school diploma", text: "English, mathematics and economics classes may help.", kind: start, source: ooh_logmgr }
          - { tag: "Several years", title: "Related work, e.g. warehousing", text: "", kind: stage, source: ooh_logmgr }
          - { tag: "Supervisor", title: "First-line supervisor", text: "", kind: stage, source: ooh_logmgr }
          - { tag: "Goal", title: "Transportation, storage or distribution manager", text: "", kind: goal, source: ooh_logmgr }
      - id: degree
        title: "Supply chain, business or engineering degree → manager"
        tag: "Some employers prefer"
        who: "Some colleges and universities offer bachelor's degree programs in supply chain management and logistics."
        steps:
          - { tag: "Start", title: "High school diploma", text: "", kind: start, source: ooh_logmgr }
          - { tag: "About 4 years", title: "Bachelor's in business, transportation, engineering or supply chain", text: "", kind: stage, source: ooh_logmgr }
          - { tag: "Several years", title: "Related work experience", text: "", kind: stage, source: ooh_logmgr }
          - { tag: "Goal", title: "Transportation, storage or distribution manager", text: "", kind: goal, source: ooh_logmgr }
    certs:
      - { name: "Driver's license or CDL", who: "State driver licensing agency", kind: "State license", text: "Some managers need one to travel to warehouses and storage facilities or to assist with transportation operations.", source: ooh_logmgr }
      - { name: "Transportation, storage or distribution certifications", who: "Professional associations", kind: "Employer may require", text: "Some employers require or prefer specific certifications, licenses or both.", source: ooh_logmgr }

  # ---- Phase 4 batch 2 (2026-10-20) ----

  # 604,400 jobs (purchasing managers + buyers and purchasing agents)
  - slug: purchasing-manager
    short: "Purchasing Manager, Buyer & Purchasing Agent"
    title: "Buyer, purchasing agent or purchasing manager: bachelor's degree, months of on-the-job training, years before manager"
    eyebrow: "Supply Chain & Transportation · Purchasing & Warehousing"
    lede: "Purchasing managers, buyers and purchasing agents typically need a bachelor's degree, although some employers hire candidates with a high school diploma. Buyers train on the job for a few months; purchasing managers also need several years of related work experience."
    for: "Careful negotiators who like comparing suppliers, prices and quality and keeping stock on track."
    soc: ["11-3061", "13-1020"]
    does: { text: "Buyers and purchasing agents buy products and services for organizations. Purchasing managers oversee the work of buyers and purchasing agents.", source: ooh_qf_purchasing }
    work: { text: "Purchasing managers and buyers and purchasing agents usually work in an office setting. Most work full time. Travel may be required.", source: ooh_qf_purchasing }
    become: { text: "Purchasing managers, buyers, and purchasing agents typically need a bachelor’s degree, although some employers hire candidates who have a high school diploma. Purchasing managers also need several years of related work experience.", source: ooh_qf_purchasing }
    metrics: { pay: 81670, pay_hour: "39.27", pay_by: "Purchasing managers, buyers, and purchasing agents", jobs: 604400, outlook: 6, outlook_words: "Faster than average", change: 34400, entry: "Bachelor's degree", training: "See How to Become One", source: ooh_qf_purchasing }
    license_text: "None"
    routes:
      - id: buyer
        title: "Degree → a few months of training → buyer or purchasing agent"
        tag: "Typical"
        who: "A degree in business, finance or supply management may help; for farm products, agriculture or animal science. A high school diploma may be enough for some positions."
        steps:
          - { tag: "Start", title: "High school diploma", text: "", kind: start, source: ooh_purchasing }
          - { tag: "About 4 years", title: "Bachelor's in business, finance or supply management", text: "", kind: stage, source: ooh_purchasing }
          - { tag: "A few months", title: "On-the-job training", text: "Monitoring inventory levels and negotiating with suppliers.", kind: stage, source: ooh_purchasing }
          - { tag: "Goal", title: "Buyer or purchasing agent", text: "", kind: goal, source: ooh_purchasing }
      - id: manager
        title: "Buyer → assistant purchasing manager → purchasing manager"
        tag: "Moving up"
        who: "Purchasing managers typically need several years of work experience in a related occupation, often starting as buyers or purchasing agents."
        steps:
          - { tag: "Start", title: "Buyer or purchasing agent", text: "", kind: start, source: ooh_purchasing }
          - { tag: "Several years", title: "Procurement experience; assistant purchasing manager", text: "", kind: stage, source: ooh_purchasing }
          - { tag: "Goal", title: "Purchasing manager", text: "With extensive experience, some become an organization's Chief Procurement Officer (CPO).", kind: goal, source: ooh_purchasing }
    certs:
      - { name: "Procurement or supply chain certification", who: "Professional associations", kind: "Voluntary", text: "Some workers choose optional certification in an area such as procurement or supply chain management.", source: ooh_purchasing }

  # ---- Master Plan Phase 7 (2026-10-21): FAA rules copied from 14 CFR part 61 on eCFR ----

  # 154,900 jobs (aircraft pilots and flight engineers: airline + commercial pilots)
  - slug: airline-pilot
    short: "Airline & Commercial Pilot"
    title: "Pilot: FAA certificates from private to commercial, 250 hours, then 1,500 hours for the ATP"
    eyebrow: "Supply Chain & Transportation · Air & Space Transportation"
    lede: "Pilots climb a ladder of FAA certificates: student, private, instrument rating, commercial (at least 250 flight hours), multi-engine and finally the airline transport pilot (ATP) certificate, usually 1,500 hours and age 23. Airline pilots typically also have a bachelor's degree; an aviation degree or military flying can lower the ATP hours."
    for: "Calm decision-makers with good vision, clear communication and a real love of flying."
    soc: ["53-2010"]
    does: { text: "Airline and commercial pilots fly and navigate airplanes, helicopters, and other aircraft.", source: ooh_qf_pilots }
    work: { text: "Pilots usually have variable work schedules, with overnight layovers that are more common for airline pilots.", source: ooh_qf_pilots }
    become: { text: "Airline pilots typically need a bachelor’s degree and experience as a commercial or military pilot. Commercial pilots typically need flight training. Both also must meet Federal Aviation Administration (FAA) requirements.", source: ooh_qf_pilots }
    metrics: { pay: 210020, pay_hour: null, pay_by: "Aircraft pilots and flight engineers", jobs: 154900, outlook: 7, outlook_words: "Much faster than average", change: 11300, entry: "See How to Become One", experience: "See How to Become One", training: "Moderate-term on-the-job training", source: ooh_qf_pilots }
    license_text: "FAA certificates (federal)"
    routes:
      - id: civilian
        title: "Flight school: private → instrument → commercial → ATP"
        tag: "Typical"
        who: "The FAA certifies hundreds of civilian flight schools, from small fixed base operators to state universities. Each certificate and rating needs a knowledge test and a practical check ride."
        steps:
          - { tag: "Start", title: "Student pilot certificate", text: "", kind: start, source: ooh_pilots }
          - { tag: "Age 17 · 40 hours", title: "Private pilot certificate", text: "At least 40 hours of flight time, including 20 with an instructor and 10 solo.", kind: licence, source: cfr_14_61_109 }
          - { tag: "Rating", title: "Instrument rating", text: "At least 40 hours of instrument time and 50 hours of cross-country flight as pilot in command.", kind: licence, source: ooh_pilots }
          - { tag: "Age 18 · 250 hours", title: "Commercial pilot certificate", text: "At least 250 hours as a pilot, including 100 as pilot in command; medical exam (vision correctable to 20/20).", kind: licence, source: cfr_14_61_129 }
          - { tag: "Build hours", title: "Multi-engine rating; flight instructor or charter pilot", text: "Many pilots earn a flight instructor certificate to build flight time.", kind: stage, source: ooh_pilots }
          - { tag: "Age 23 · 1,500 hours", title: "Airline transport pilot (ATP) certificate", text: "Including 500 hours cross-country, 100 night and 75 instrument; written and practical exams.", kind: exam, source: cfr_14_61_159 }
          - { tag: "Goal", title: "Airline first officer", text: "Then aircraft type ratings through employer training; promotion follows seniority.", kind: goal, source: ooh_pilots }
        facts:
          - { k: "Private pilot age", v: "At least 17 for airplanes (16 for gliders or balloons).", source: cfr_14_61_103 }
          - { k: "Commercial pilot age", v: "At least 18.", source: cfr_14_61_123 }
          - { k: "ATP age", v: "At least 23 (21 with restricted privileges).", source: cfr_14_61_153 }
      - id: aviation-degree
        title: "Aviation degree → restricted ATP at 1,000 hours"
        tag: "R-ATP"
        who: "A bachelor's degree with an aviation major from a school the FAA has authorized, 60 credit hours of aviation coursework and a commercial certificate with instrument rating earned in its part 141 program."
        steps:
          - { tag: "Start", title: "High school diploma", text: "", kind: start, source: ooh_pilots }
          - { tag: "4 years", title: "FAA-authorized bachelor's with an aviation major", text: "Some colleges offer pilot training within a 2- or 4-year aviation degree.", kind: stage, source: cfr_14_61_160 }
          - { tag: "1,000 hours", title: "Restricted ATP (age 21)", text: "1,250 hours with an authorized associate degree.", kind: exam, source: cfr_14_61_160 }
          - { tag: "Goal", title: "Airline first officer", text: "", kind: goal, source: ooh_pilots }
      - id: military
        title: "Military pilot → airline"
        tag: "750 hours"
        who: "Military pilots may transfer to civilian aviation and apply directly to airlines."
        steps:
          - { tag: "Start", title: "U.S. Armed Forces pilot training", text: "", kind: start, source: ooh_pilots }
          - { tag: "750 hours", title: "Restricted ATP for U.S. military pilots", text: "With a DD-214 (or current service record) and proof of graduating from military undergraduate pilot training.", kind: exam, source: cfr_14_61_160 }
          - { tag: "Goal", title: "Airline pilot", text: "", kind: goal, source: ooh_pilots }
    certs:
      - { name: "Aircraft type ratings", who: "FAA · usually through employer training", kind: "Federal license", text: "Needed to fly specific aircraft such as the Boeing 737; generally earned by pilots with at least a commercial certificate.", source: ooh_pilots }
      - { name: "Flight instructor certificate", who: "FAA", kind: "Federal license", text: "Many commercial pilots get one to build flight time and experience at less personal expense.", source: ooh_pilots }
    states_note: "Pilot certificates are federal: the FAA issues them, and the same rules apply in every state. Pilots also pass periodic medical and practical flight exams to keep flying."
    states_source: ooh_pilots
    watch:
      - { text: "Pay differs a lot by type of flying: median $232,140 for airline pilots, copilots and flight engineers and $123,220 for commercial pilots (May 2025).", source: ooh_pilots_pay }
