  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Is BA English only useful for becoming a teacher?"
            a: "No. Graduates also work in publishing, content writing and editing, journalism, corporate communications, and civil services after clearing UPSC — teaching (via B.Ed) is one common path, not the only one."
          - q: "Do I need to have studied English Literature in Class 11-12 to take BA English?"
            a: "No. Most schools don't offer English Literature as a separate subject at the school level, so almost all students begin serious literary study fresh at university — what matters more is genuine comfort with reading and writing in English."
          - q: "Do I need CUET to get into a good BA English college?"
            a: "For Delhi University and most central universities, yes — CUET (UG) scores decide admission, submitted through the DU CSAS portal or the respective university's counselling system, and English Honours is typically one of the more competitive subjects. Many state and private universities admit directly on Class 12 marks."
          - q: "Is English Literature a good optional subject for UPSC?"
            a: "It's a less commonly chosen optional compared to History, Geography or Sociology, but candidates with a genuine background and interest in literature have used it successfully. Its main benefit for UPSC aspirants is the strong reading and writing skills the degree builds, which help across the exam generally."
          - q: "What jobs can I get with just a BA English degree?"
            a: "A plain BA English alone commonly leads to content writing, editorial assistant roles, publishing house jobs, and entry-level teaching or government roles. Higher-paying, more specialised outcomes — senior editor, published author, professor — usually need further experience, an MA, or a strong independent portfolio."
      - note: "*Fee and salary figures are indicative, based on publicly available information as of 2026, and vary significantly by institution and admission cycle — always verify current figures on the official college or university website."
        class: "table-note mt-lg"
