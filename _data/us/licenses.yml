# USA Edition — professional licensing model.
# Every U.S. license is granted by a state/jurisdiction board; national bodies
# only write exams or accredit schools. Pages must show `jurisdiction_note`
# and never present one state's rule as national.
#
# Fields
#   short            label for navigation
#   name             what the license/credential is called
#   authority        who grants the license
#   national_bodies  who writes the exams / accredits programs (not licensers)
#   education        required education (as stated by the sources)
#   exams            [{ name, by, what, source }]
#   experience       supervised practice / experience requirement
#   steps            ordered student-facing route (high school → license)
#   jurisdiction_note  what varies by state — always displayed
#   not_required_for   roles where the license is NOT needed (avoid overclaiming)
#   watch            time-sensitive changes with dates — re-check on refresh
#   sources          ids from sources.yml
#   last_verified

medicine:
  short: "Medicine"
  name: "State medical license (physician)"
  authority: "State medical boards"
  national_bodies:
    - "USMLE — owned by the Federation of State Medical Boards (FSMB) and the National Board of Medical Examiners (NBME)"
    - "COMLEX-USA — National Board of Osteopathic Medical Examiners (NBOME)"
  education: "Bachelor's degree, then a 4-year medical school program leading to an M.D. or a D.O., then residency"
  exams:
    - name: "USMLE Step 1, Step 2 CK, Step 3"
      by: "FSMB and NBME"
      what: "Three-step exam taken at different points in an M.D. student's education and training; results go to state medical boards, which grant the license."
      source: usmle
    - name: "COMLEX-USA Level 1, Level 2-CE, Level 3"
      by: "NBOME"
      what: "Three-level licensing exam for osteopathic physicians (D.O.). Levels 1 and 2-CE are required to graduate from accredited D.O. programs; NBOME says it is the only licensing exam accepted for D.O.s in all 50 states."
      source: nbome_comlex
  experience: "Residency of 3 to 9 years depending on specialty; optional fellowship of 1 to 3 years (BLS)."
  steps:
    - "High school diploma"
    - "Bachelor's degree with pre-med coursework (any major)"
    - "MCAT and medical school application"
    - "Medical school — M.D. or D.O. (4 years)"
    - "USMLE (M.D.) or COMLEX-USA (D.O.) during and after medical school"
    - "Residency (3–9 years)"
    - "State medical license"
    - "Optional: fellowship and board certification"
  jurisdiction_note: "Each state medical board sets its own licensure rules. Passing USMLE or COMLEX-USA alone does not grant a license."
  not_required_for:
    - "Board certification is not required to practice (BLS), though it can widen job options."
  watch:
    - "NBOME is changing how D.O. students show clinical skills for COMLEX Level 3 starting with the Class of 2029."
  sources: [bls_ooh, usmle, nbome_comlex, aamc_mcat]
  last_verified: 2026-10-07

law:
  short: "Law"
  name: "Admission to the bar (lawyer)"
  authority: "Each jurisdiction's highest court / bar admission authority"
  national_bodies:
    - "National Conference of Bar Examiners (NCBE) — UBE, NextGen UBE, MPRE"
    - "American Bar Association (ABA) — accredits law schools"
  education: "Bachelor's degree, then a J.D. from a law school (most jurisdictions require an ABA-accredited school)"
  exams:
    - name: "Bar exam — legacy Uniform Bar Exam (UBE) or NextGen UBE, plus any state-specific components"
      by: "NCBE (jurisdictions decide which exam they use)"
      what: "NextGen UBE debuted in July 2026 in 10 jurisdictions; the legacy UBE is given through February 2028; most large states (including California, Texas and New York) switch in July 2028. A few jurisdictions have not announced adoption."
      source: ncbe_nextgen
    - name: "MPRE (Multistate Professional Responsibility Examination)"
      by: "NCBE"
      what: "Two-hour, 60-question ethics exam required for bar admission in all U.S. jurisdictions except Wisconsin and Puerto Rico; Connecticut and New Jersey also accept a law school professional-responsibility course instead."
      source: ncbe_mpre
  experience: "None nationally; jurisdictions also run a character and fitness review."
  steps:
    - "High school diploma"
    - "Bachelor's degree (any major)"
    - "Law school admission (LSAT or GRE at most schools)"
    - "J.D. (typically 3 years full time)"
    - "MPRE"
    - "Bar exam in the chosen jurisdiction"
    - "Character and fitness review"
    - "Admission to the bar"
  jurisdiction_note: "Bar admission is granted state by state. Which bar exam is given, passing scores and score transfer rules all vary by jurisdiction."
  watch:
    - "Bar exam transition: legacy UBE ends February 2028; check your jurisdiction's NextGen UBE start date."
    - "Law school admission tests: ABA Standard 503 still requires a valid and reliable test, but the ABA grants variances; 21 of 198 ABA-accredited schools held one as of August 2026."
  sources: [bls_ooh, ncbe_nextgen, ncbe_mpre, aba_journal_503]
  last_verified: 2026-10-07

cpa:
  short: "CPA"
  name: "Certified Public Accountant (CPA) license"
  authority: "State boards of accountancy"
  national_bodies:
    - "AICPA — writes the Uniform CPA Examination"
    - "NASBA — coordinates boards of accountancy; co-publishes the Uniform Accountancy Act (UAA)"
  education: "Depends on the jurisdiction's pathway (see pathways below)"
  pathways:
    - "Graduate degree in accounting + 1 year of professional experience + CPA Exam"
    - "Bachelor's degree in accounting + 30 additional semester credits (150 hours total) + 1 year of experience + CPA Exam"
    - "Bachelor's degree in accounting (120 semester hours) + 2 years of professional experience + CPA Exam"
  pathways_note: "These three routes are the NASBA/AICPA model (UAA 9th edition, 2025). A jurisdiction offers them only after its own law adopts them."
  exams:
    - name: "Uniform CPA Examination"
      by: "AICPA (delivered with NASBA)"
      what: "Three 4-hour Core sections — Auditing and Attestation (AUD), Financial Accounting and Reporting (FAR), Taxation and Regulation (REG) — plus one 4-hour Discipline of the candidate's choice: Business Analysis and Reporting (BAR), Information Systems and Controls (ISC) or Tax Compliance and Planning (TCP)."
      source: aicpa_disciplines
  experience: "1 or 2 years depending on the pathway; details set by each board."
  steps:
    - "High school diploma"
    - "Bachelor's degree in accounting (or qualifying coursework)"
    - "Optional: master's or extra credits, depending on pathway"
    - "Uniform CPA Exam (3 Core + 1 Discipline)"
    - "Qualifying experience"
    - "State board application and license"
  jurisdiction_note: "Education, experience and ethics-exam rules differ by state. Since 2025 more states let a 120-hour bachelor's plus 2 years of experience qualify, but not all. Check your state board."
  not_required_for:
    - "Many accounting jobs do not require a CPA license; BLS says anyone who files reports with the SEC must be a licensed CPA."
  watch:
    - "State adoption of the 120-hour pathway is ongoing in 2026 (NASBA tracks enacted laws)."
  sources: [nasba_pathways, nasba_cpa_exam, aicpa_disciplines, bls_ooh]
  last_verified: 2026-10-07

pe:
  short: "Engineering (PE)"
  name: "Professional Engineer (PE) license"
  authority: "State engineering licensing boards"
  national_bodies:
    - "NCEES — writes the FE and PE exams"
    - "ABET (Engineering Accreditation Commission) — accredits engineering degree programs"
  education: "Usually a bachelor's degree from an EAC/ABET-accredited engineering program"
  exams:
    - name: "FE (Fundamentals of Engineering)"
      by: "NCEES"
      what: "For recent graduates and students close to finishing an EAC/ABET-accredited degree. Computer-based, 110 questions, about 5 hours 20 minutes of testing; pass/fail. Passing usually leads to Engineer in Training (EIT) or Engineer Intern (EI) status."
      source: ncees_fe
    - name: "PE (Principles and Practice of Engineering)"
      by: "NCEES"
      what: "More than 20 discipline exams for engineers with at least 4 years of post-college experience in their field."
      source: ncees_pe
  experience: "Typically at least 4 years of qualifying work experience before the PE exam."
  steps:
    - "High school diploma (strong math and science)"
    - "Bachelor's degree from an ABET-accredited engineering program"
    - "FE exam → EIT / EI"
    - "About 4 years of qualifying experience"
    - "PE exam"
    - "State PE license"
  jurisdiction_note: "Each state board sets its own application rules, fees and approval steps; many states require continuing education to renew."
  not_required_for:
    - "Many engineering jobs do not require a PE. BLS: a PE is required to offer services directly to the public (e.g. civil engineers signing off public projects); entry-level civil engineers do not need one."
    - "Computer hardware and most software/industry roles rarely require a PE."
  sources: [ncees_fe, ncees_pe, abet_programs, bls_ooh]
  last_verified: 2026-10-07

nursing:
  short: "Nursing"
  name: "Registered Nurse (RN) license"
  authority: "State boards of nursing"
  national_bodies:
    - "NCSBN — writes the NCLEX-RN and NCLEX-PN"
  education: "BSN, associate's degree in nursing (ADN/ASN) or an approved diploma program"
  exams:
    - name: "NCLEX-RN (Next Generation NCLEX since April 2023)"
      by: "NCSBN"
      what: "National licensure exam used by U.S. boards of nursing to decide whether a new graduate is safe to practice at entry level."
      source: ncsbn_nclex
  experience: "Supervised clinical experience is part of every program."
  steps:
    - "High school diploma (biology, chemistry, math)"
    - "Nursing program — BSN, ADN/ASN or diploma"
    - "NCLEX-RN"
    - "State board of nursing license"
    - "Optional: RN-to-BSN, then graduate study for advanced practice (NP, CNM, CRNA)"
  jurisdiction_note: "Each state board sets licensing rules, including background checks. Advanced practice (NP, nurse midwife, nurse anesthetist) has additional state requirements."
  sources: [bls_ooh, ncsbn_nclex]
  last_verified: 2026-10-07

pharmacy:
  short: "Pharmacy"
  name: "Pharmacist license"
  authority: "State boards of pharmacy"
  national_bodies:
    - "NABP — writes the NAPLEX and MPJE"
    - "ACPE — accredits Pharm.D. programs"
  education: "Doctor of Pharmacy (Pharm.D.) from an ACPE-accredited program"
  exams:
    - name: "NAPLEX"
      by: "NABP"
      what: "General pharmacy practice knowledge, taken shortly after graduation."
      source: nabp_exams
    - name: "MPJE or Uniform MPJE"
      by: "NABP"
      what: "Pharmacy law exam for the state where the candidate seeks a license; states adopting the Uniform MPJE (from 2026) need only one law exam."
      source: nabp_exams
  experience: "Practice experience is built into Pharm.D. programs; residencies (1–2 years) are optional."
  steps:
    - "High school diploma (chemistry, biology, math)"
    - "Prerequisite college coursework (usually at least 2 years) or a 6-year program that admits high school graduates"
    - "Pharm.D. (usually 4 years)"
    - "NAPLEX + MPJE / Uniform MPJE"
    - "State pharmacist license"
  jurisdiction_note: "Each state board of pharmacy sets licensure and transfer rules; most states also require certification to give vaccinations (BLS)."
  watch:
    - "The PCAT admission test was retired in January 2024; pharmacy schools no longer require it."
    - "Uniform MPJE rollout began in 2026 in adopting states."
  sources: [bls_ooh, nabp_exams, aacp_pcat]
  last_verified: 2026-10-07

dentistry:
  short: "Dentistry"
  name: "Dentist license"
  authority: "State dental boards"
  national_bodies:
    - "Joint Commission on National Dental Examinations (JCNDE) — INBDE"
    - "American Dental Association (ADA) — DAT admission test"
  education: "D.D.S. or D.M.D. from an accredited dental school (admission usually after a bachelor's degree)"
  exams:
    - name: "INBDE (Integrated National Board Dental Examination)"
      by: "JCNDE"
      what: "Two-day licensure exam accepted in all U.S. licensing jurisdictions."
      source: jcnde_inbde
    - name: "State or regional clinical exam"
      by: "Varies by state"
      what: "Most states also require a state or regional clinical examination (BLS)."
      source: bls_ooh
  experience: "None for general practice; specialties need a 2- to 4-year residency."
  steps:
    - "High school diploma"
    - "Bachelor's degree with science coursework"
    - "DAT and dental school application"
    - "D.D.S. or D.M.D."
    - "INBDE + clinical exam"
    - "State dental license"
    - "Optional: specialty residency"
  jurisdiction_note: "All states license dentists, and requirements vary by state (BLS)."
  sources: [bls_ooh, jcnde_inbde, ada_dat]
  last_verified: 2026-10-07

physical-therapy:
  short: "Physical Therapy"
  name: "Physical therapist license"
  authority: "State physical therapy licensing boards"
  national_bodies:
    - "FSBPT — writes the National Physical Therapy Examination (NPTE)"
    - "CAPTE — accredits PT programs"
  education: "Doctor of Physical Therapy (DPT) from a CAPTE-accredited program (typically 3 years after a bachelor's degree)"
  exams:
    - name: "NPTE"
      by: "FSBPT"
      what: "Entry-level competence exam; all jurisdictions use the same passing standard, and some add other requirements."
      source: fsbpt_npte
  experience: "Clinical education is part of the DPT; residencies (about 1 year) are optional."
  steps:
    - "High school diploma"
    - "Bachelor's degree with anatomy, chemistry and physics prerequisites"
    - "DPT (about 3 years)"
    - "NPTE"
    - "State license"
  jurisdiction_note: "All 50 states, DC, Puerto Rico and the U.S. Virgin Islands require a license; each sets its own eligibility rules."
  sources: [bls_ooh, fsbpt_npte]
  last_verified: 2026-10-07

psychology:
  short: "Psychology"
  name: "Licensed psychologist"
  authority: "State and provincial psychology boards"
  national_bodies:
    - "ASPPB — writes the EPPP"
  education: "Usually a doctoral degree (Ph.D. or Psy.D.) for independent clinical practice; school psychologists may hold a master's or Ed.S. (BLS)"
  exams:
    - name: "EPPP (Part 1–Knowledge; some boards also require Part 2–Skills)"
      by: "ASPPB"
      what: "All 66 ASPPB member jurisdictions require EPPP Part 1. An integrated EPPP replaces the two-part format for first-time candidates from Q4 2027."
      source: asppb_eppp
  experience: "Supervised internship and/or postdoctoral experience, set by each board."
  steps:
    - "High school diploma"
    - "Bachelor's degree (psychology or related)"
    - "Doctoral program (Ph.D./Psy.D.) with internship"
    - "Supervised experience"
    - "EPPP"
    - "State license"
  jurisdiction_note: "Most states require a license to provide psychology services or use the title 'psychologist'; supervised-hour and exam rules vary."
  not_required_for:
    - "Industrial-organizational psychologists and many research roles may not need a clinical license (BLS: I-O roles usually need a master's)."
  watch:
    - "Integrated EPPP takes effect in Q4 2027."
  sources: [bls_ooh, asppb_eppp]
  last_verified: 2026-10-07

# USA Master Plan Phase 2 (2026-10-20): four Healthcare & Human Services licenses. Extra fields used here:
#   page     { title, description, current }  the stub us/professional-licenses/<id>/index.html is written from
#            this by scripts/build-us-clusters.mjs (the nine older pages are hand-written and have no `page`)
#   boards   [{ place, body, rule, sources }]  what named state boards publish, copied from each board's own page;
#            shown on the license page and, through `states_from`, on the career roadmaps
practical-nursing:
  short: "LPN / LVN"
  name: "Licensed Practical Nurse (LPN) or Licensed Vocational Nurse (LVN) license"
  authority: "State boards of nursing"
  national_bodies:
    - "NCSBN — writes the NCLEX-PN"
  education: "A state-approved practical nursing program, typically about 1 year (certificate or diploma)"
  exams:
    - name: "NCLEX-PN"
      by: "NCSBN"
      what: "National licensure exam for practical nurses, given by computerized adaptive testing. Candidates first meet the requirements of the nursing regulatory body where they plan to practice, then register with Pearson VUE."
      source: ncsbn_exams
  experience: "Supervised clinical experience is part of every approved program (BLS)."
  steps:
    - "High school diploma or equivalent"
    - "State-approved practical nursing program (about 1 year)"
    - "Apply to your state board of nursing, then register with Pearson VUE"
    - "NCLEX-PN"
    - "State LPN or LVN license"
    - "Optional: LPN-to-RN program, then the NCLEX-RN"
  jurisdiction_note: "Each state board of nursing approves programs and sets its own licensing rules, such as minimum age, background checks and extra state courses. Texas and California call the license LVN; most other states call it LPN."
  not_required_for:
    - "Optional certifications in areas such as gerontology, wound care and IV therapy come from professional associations, not the state (BLS)."
  watch:
    - "NCSBN: from 1 February 2027 the NCLEX registration fee is $350 in the United States."
  boards:
    - place: "Texas"
      body: "Texas Board of Nursing"
      rule: "Apply in the Texas Nurse Portal (NCLEX-PN application), register with Pearson VUE ($200), pass the Texas Nursing Jurisprudence Exam and have the program submit an Affidavit of Graduation before an Authorization to Test is issued. The license is called LVN."
      sources: [tx_bon_exam]
    - place: "California"
      body: "Board of Vocational Nursing and Psychiatric Technicians"
      rule: "12th grade or equivalent, DOJ and FBI fingerprints, and the NCLEX-PN (a passing RN exam does not count). Besides an approved school, the board accepts 51 months of paid bedside nursing experience plus a 54-hour pharmacology course, or 12 months of military medical-corps bedside care."
      sources: [ca_bvnpt_vn]
    - place: "New York"
      body: "NYSED Office of the Professions"
      rule: "At least 17, high school graduate, an acceptable nursing program, infection control coursework and the NCLEX-PN. The license is for life; registration is renewed every 3 years. Licensure and first registration fee $143."
      sources: [ny_op_lpn]
    - place: "Florida"
      body: "Florida Board of Nursing"
      rule: "Apply for licensure by examination, then sit the NCLEX. Electronic fingerprinting is required under House Bill 975 (2024). Florida joined the Nurse Licensure Compact on 19 January 2018 and offers a multistate upgrade."
      sources: [fl_bon_rn_lpn]
  sources: [bls_ooh, ooh_lpn, ncsbn_exams, nclex_about, nclex_fees]
  last_verified: 2026-10-20
  page:
    title: "How to Get an LPN or LVN License: Program, NCLEX-PN and State Boards | Education Margdarshan USA"
    description: "Becoming a licensed practical or vocational nurse: a state-approved program of about a year, the NCLEX-PN and a state board of nursing license, with Texas, California, New York and Florida rules."
    current: "LPN / LVN license"

social-work:
  short: "Social Work"
  name: "Social work license (LBSW, LMSW, LCSW)"
  authority: "State social work boards"
  national_bodies:
    - "ASWB — writes the Social Work Licensing Exams (Associate, Bachelors, Masters, Advanced Generalist, Clinical)"
    - "CSWE — accredits BSW and MSW programs (state boards name it as the accreditor)"
  education: "A bachelor's (BSW) or master's (MSW) degree in social work; clinical licenses need an MSW from an accredited program"
  exams:
    - name: "ASWB Bachelors, Masters, Advanced Generalist or Clinical exam"
      by: "ASWB"
      what: "122 questions (110 scored), 4-hour limit, based on the 2026 blueprint. Apply to the state board first, then register with ASWB and test at a Pearson center. Fees: Associate, Bachelors or Masters US$230; Advanced Generalist or Clinical US$260."
      source: aswb_exam
  experience: "Clinical licenses need supervised clinical experience after the MSW; the length is set by each state (for example 3,000 hours over at least 24 months in Texas, 3 years in New York, 2 years and 1,500 hours in Florida)."
  steps:
    - "High school diploma"
    - "BSW, or a bachelor's in any field before an MSW"
    - "ASWB Bachelors exam, where the state requires it for BSWs"
    - "MSW (generally 2 years, with a supervised practicum)"
    - "ASWB Masters exam, then the LMSW where a state offers it"
    - "Supervised clinical experience (state-set hours)"
    - "ASWB Clinical exam"
    - "Clinical social work license (LCSW)"
  jurisdiction_note: "A social work license is issued by each state, and states differ in the categories they license. All states require clinical social workers to be licensed; some also license nonclinical social workers (BLS, ASWB)."
  not_required_for:
    - "Some nonclinical social work jobs do not need a license; that depends on the state (BLS)."
  boards:
    - place: "Texas"
      body: "Behavioral Health Executive Council — State Board of Social Worker Examiners"
      rule: "Three licenses. LBSW: CSWE-accredited BSW + ASWB Bachelors. LMSW: CSWE-accredited master's or doctorate + ASWB Masters. LCSW: master's or doctorate, 3,000 hours of supervised clinical experience over at least 24 months with 100 hours of supervision, and ASWB Clinical. All three also need the Texas jurisprudence exam and an NPDB self-query."
      sources: [tx_bhec_lbsw, tx_bhec_lmsw, tx_bhec_lcsw]
    - place: "California"
      body: "Board of Behavioral Sciences"
      rule: "Two exams for the LCSW: the LCSW California Law and Ethics Exam, then the ASWB Clinical exam, which must be taken within one year of approval."
      sources: [ca_bbs_lcsw_exam]
    - place: "New York"
      body: "NYSED Office of the Professions"
      rule: "LMSW: at least 21, an MSW and the ASWB Masters exam. LCSW: an MSW with 12 semester hours of clinical coursework, 3 years of supervised post-MSW experience in diagnosis and psychotherapy, and the ASWB Clinical exam. Both need child-abuse reporting training. Licensure fee $294."
      sources: [ny_op_lmsw, ny_op_lcsw]
    - place: "Florida"
      body: "Board of Clinical Social Work, Marriage & Family Therapy and Mental Health Counseling"
      rule: "Licensed clinical social worker: a CSWE-accredited MSW with 24 semester hours of clinical coursework, 2 years of post-master's supervision (100 hours of supervision, 1,500 hours of face-to-face psychotherapy), the ASWB clinical exam and an 8-hour Florida laws and rules course."
      sources: [fl_lcsw]
  sources: [bls_ooh, ooh_socialwork, aswb_exam, aswb_license]
  last_verified: 2026-10-20
  page:
    title: "How to Get a Social Work License: BSW, MSW, ASWB Exams and LCSW | Education Margdarshan USA"
    description: "Social work licensing in the U.S.: BSW or MSW, the ASWB Bachelors, Masters and Clinical exams, supervised clinical hours and the LCSW, with Texas, California, New York and Florida board rules."
    current: "Social work license"

counseling:
  short: "Counseling"
  name: "Professional counselor license (LPC, LMHC, LPCC)"
  authority: "State counseling boards"
  national_bodies:
    - "NBCC — writes the National Counselor Examination (NCE) and the National Clinical Mental Health Counseling Examination (NCMHCE)"
  education: "A master's degree in counseling with a supervised internship; some states name 60 semester hours"
  exams:
    - name: "NCE (National Counselor Examination)"
      by: "NBCC"
      what: "200-item multiple-choice exam; a requirement for counselor licensure in many states and one of two exam options for the National Certified Counselor (NCC) credential. A 2027 version is coming."
      source: nbcc_nce
    - name: "NCMHCE (National Clinical Mental Health Counseling Examination)"
      by: "NBCC"
      what: "Required for licensure in some states. NBCC says all 50 states, DC, Puerto Rico and Guam require one or more of its exams."
      source: nbcc_exams
  experience: "Supervised clinical work after the master's, set by each state (for example 3,000 hours in Texas and New York; 2 years and 1,500 hours of face-to-face psychotherapy in Florida)."
  steps:
    - "High school diploma"
    - "Bachelor's degree (psychology, social science or a related field)"
    - "Master's in counseling with a supervised internship"
    - "NCE or NCMHCE, as the state requires"
    - "Supervised clinical experience after the master's"
    - "State counselor license (LPC, LMHC or LPCC)"
  jurisdiction_note: "All states require mental health counselors to be licensed (BLS). The license title, required exam, coursework and supervised hours differ by state."
  not_required_for:
    - "Substance abuse and behavioral disorder counselors outside private practice: requirements vary by state, and not all states require a specific degree (BLS)."
  watch:
    - "NBCC is preparing a 2027 version of the NCE."
  boards:
    - place: "Texas"
      body: "Behavioral Health Executive Council — State Board of Examiners of Professional Counselors"
      rule: "Start as an LPC Associate (practice only under a board-approved supervisor) with NCE or NCMHCE scores, the Texas jurisprudence exam and fingerprints, then upgrade to a full LPC after at least 3,000 hours of supervised experience. Texas has no reciprocity or temporary license."
      sources: [tx_bhec_lpc_associate, tx_bhec_lpc_full]
    - place: "California"
      body: "Board of Behavioral Sciences"
      rule: "Licensed Professional Clinical Counselor (LPCC): pass the LPCC California Law and Ethics Exam, then the NCMHCE."
      sources: [ca_bbs_lpcc_exam]
    - place: "New York"
      body: "NYSED Office of the Professions"
      rule: "Licensed Mental Health Counselor: at least 21, a master's or doctorate in counseling (60 semester hours of clinical mental health counseling, or equivalent), at least 3,000 clock hours of supervised experience after the master's, the licensing exam and child-abuse reporting training."
      sources: [ny_op_lmhc]
    - place: "Florida"
      body: "Board of Clinical Social Work, Marriage & Family Therapy and Mental Health Counseling"
      rule: "Licensed Mental Health Counselor: from 1 July 2025 a 60-semester-hour master's in mental health counseling from a CACREP, MPCAC or equivalent program; 2 years of supervision (1,500 hours of face-to-face psychotherapy); the national exam; and Florida laws and rules (8 hours) and HIV/AIDS (3 hours) courses."
      sources: [fl_lmhc]
  sources: [bls_ooh, ooh_counselors, nbcc_exams, nbcc_nce]
  last_verified: 2026-10-20
  page:
    title: "How to Get a Counselor License (LPC, LMHC): Master's, NCE or NCMHCE, Supervised Hours | Education Margdarshan USA"
    description: "Becoming a licensed professional or mental health counselor: a counseling master's, the NBCC NCE or NCMHCE, supervised clinical hours and the state license, with Texas, California, New York and Florida rules."
    current: "Counselor license"

emt:
  short: "EMT / Paramedic"
  name: "EMT and paramedic state license or certification"
  authority: "State EMS offices"
  authority_lede: "state EMS offices"   # lede wording (the page lower-cases authority, which would give "ems")
  national_bodies:
    - "NREMT (National Registry of Emergency Medical Technicians) — national certification exams for EMR, EMT, AEMT and Paramedic"
  education: "A state-approved EMT program (typically under 1 year); paramedic programs require EMT-Intermediate certification and lead to a nondegree award, an associate or a bachelor's degree (BLS)"
  exams:
    - name: "NREMT EMT, AEMT or Paramedic certification exam"
      by: "NREMT"
      what: "National certification used by many states as the licensing exam. NREMT says its certification by itself does not give the right to practice: the state EMS office grants that."
      source: nremt_licensure
    - name: "State EMS exam (some states)"
      by: "State EMS office"
      what: "Some states give their own exam instead. New York, for example, delivers a state written certification exam through PSI after an approved course (BLS: most states require certification, others an equivalent state exam)."
      source: ny_doh_ems_exam
  experience: "Paramedics typically need work experience as an EMT before a paramedic program (BLS)."
  steps:
    - "High school diploma and CPR / basic life support certification"
    - "State-approved EMT course (under 1 year)"
    - "NREMT EMT exam, or the state's own exam"
    - "State EMT license or certification"
    - "Work as an EMT, then a paramedic program (nondegree award, associate or bachelor's)"
    - "NREMT Paramedic exam"
    - "State paramedic license or certification"
  jurisdiction_note: "All states require EMTs and paramedics to be licensed, and requirements vary by state; many states call the authorization a certification. States may add a minimum age and a background check (BLS, NREMT)."
  not_required_for:
    - "Ambulance driver certification is not a license; employers may prefer it, and typically require a driver's license (BLS)."
  boards:
    - place: "Texas"
      body: "Department of State Health Services (DSHS)"
      rule: "At least 18, high school diploma or GED, a DSHS-approved EMS course, the state application and fee, the National Registry exam and fingerprints. Paramedics: EMT-Paramedic certification after a paramedic course, or Paramedic Licensure with a two-year EMS degree or a four-year degree in any field."
      sources: [tx_dshs_ems]
    - place: "New York"
      body: "Department of Health, Bureau of EMS and Trauma Systems"
      rule: "After an approved course, students take the New York State written certification exam by computer through PSI (EMT students may use live remote proctoring). Reciprocity is possible with a current certification from another state, the military or the NREMT."
      sources: [ny_doh_ems_exam, ny_doh_ems_reciprocity]
    - place: "Florida"
      body: "Department of Health, Division of Medical Quality Assurance"
      rule: "Uses the NREMT exam. Florida-trained applicants must pass within 2 years of finishing the course or retake the course. Paramedic students must graduate from a CAAHEP-accredited program (or one with a CoAEMSP letter of review)."
      sources: [fl_doh_ems]
  sources: [bls_ooh, ooh_emt, nremt_home, nremt_licensure]
  last_verified: 2026-10-20
  page:
    title: "How to Get an EMT or Paramedic License: Course, NREMT Exam and State EMS Office | Education Margdarshan USA"
    description: "Becoming an EMT or paramedic: a state-approved course, the NREMT exam (or a state exam), and the state EMS license or certification, with Texas, New York and Florida rules."
    current: "EMT / paramedic license"

# ---- USA Master Plan Phase 3 batch 2 (2026-10-20): Financial Services licenses ----
real-estate:
  short: "Real Estate"
  name: "Real estate sales agent and broker license"
  authority: "State real estate licensing commissions"
  education: "A high school diploma or equivalent and the state's prelicensing real estate courses; the hours differ by state"
  exams:
    - name: "State real estate salesperson exam"
      by: "Each state's licensing commission"
      what: "Every state gives its own licensing exam after the prelicensing courses; some states also require a background check (BLS). Texas schedules state and national exam portions through Pearson VUE; Florida needs a grade of at least 75."
      source: ooh_realestate
  experience: "None for a sales agent license. A broker's license usually needs at least 2 years as a licensed sales agent (BLS)"
  steps:
    - "Be at least 18, with a high school diploma or equivalent"
    - "State-approved prelicensing courses"
    - "State licensing exam (and a background check in some states)"
    - "Sales agent license, often active only under a sponsoring broker"
    - "Continuing education to renew every 2 to 4 years"
    - "Optional: at least 2 years as an agent, broker courses and exam, broker's license"
  jurisdiction_note: "Every state requires real estate brokers and sales agents to be licensed. Licenses typically are not transferable between states, though some states have reciprocity agreements; renewal is typically every 2 to 4 years with continuing education in most states (BLS)."
  boards:
    - place: "Texas"
      body: "Texas Real Estate Commission (TREC)"
      rule: "U.S. citizen or lawfully admitted alien, 18 or older. 180 classroom hours: Principles of Real Estate I and II, Law of Agency, Law of Contracts, Promulgated Contract Forms and Real Estate Finance (30 hours each). Apply in the REALM Portal, fingerprints with Texas DPS, then the exam through Pearson VUE; three failures mean more education. The license stays inactive until a broker sponsors you. One year from filing to meet everything."
      sources: [trec_sales_agent]
    - place: "California"
      body: "Department of Real Estate (DRE)"
      rule: "Three college-level courses before the salesperson exam: Real Estate Principles, Real Estate Practice (with implicit bias and fair housing since 2024) and one course from a list such as finance, appraisal or legal aspects. Each approved course is at least 45 hours. Pass the exam first, then apply for the license; 18 or older to be issued one. Without a responsible broker a salesperson may not do licensed acts."
      sources: [ca_dre_sales]
    - place: "New York"
      body: "Department of State, Division of Licensing Services"
      rule: "18 or older, 77 hours of approved qualifying education, the NYS Real Estate Salesperson exam, sponsorship by a NYS-licensed broker and a current NYS photo driver's license or non-driver ID."
      sources: [ny_dos_salesperson]
    - place: "Florida"
      body: "Florida Real Estate Commission (DBPR)"
      rule: "Sales associate: a 63-hour FREC-approved prelicensing course (valid 2 years), application with electronic fingerprints, the state exam with at least 75, then a 45-hour post-licensing course before the first license expires. Broker: 24 months of experience in the last 5 years, a 72-hour course, the broker exam with at least 75 and a 60-hour post-licensing course."
      sources: [fl_frec_sales, fl_frec_broker]
  sources: [bls_ooh, ooh_realestate]
  last_verified: 2026-10-20
  page:
    title: "How to Get a Real Estate License: Prelicensing Hours, State Exam and Broker | Education Margdarshan USA"
    description: "Becoming a real estate sales agent or broker in the U.S.: prelicensing courses, the state exam and a sponsoring broker, with Texas (180 hours), California, New York (77 hours) and Florida (63 hours) rules."
    current: "Real estate license"

insurance-producer:
  short: "Insurance Agent"
  name: "Insurance producer (agent) license"
  authority: "State insurance departments"
  education: "A high school diploma; some states also require prelicensing courses before the exam"
  exams:
    - name: "State insurance licensing exam"
      by: "Each state's insurance department (through a testing vendor)"
      what: "Separate licenses, and exams, for life and health and for property and casualty insurance. In most states licenses are issued only after specified courses and state exams on insurance fundamentals and state insurance law (BLS)."
      source: ooh_insagent
  experience: "None required; new agents learn by shadowing an experienced agent (BLS)"
  steps:
    - "High school diploma (some employers prefer a bachelor's)"
    - "The state's prelicensing courses, where required"
    - "State exam for each line: life and health, property and casualty"
    - "Fingerprints and the license application"
    - "A license in every state where you sell, plus continuing education"
    - "Optional: FINRA exams to sell securities such as variable annuities"
  jurisdiction_note: "Agents must be licensed in each state where they work, and most states require continuing education. Course hours, exams and fees are set by each state's insurance department (BLS)."
  not_required_for:
    - "Insurance specialty certifications from industry organizations are voluntary (BLS)."
  watch:
    - "California repealed its 20-hour prelicensing course for most producer licenses from 1 January 2026 (AB 943); the 12-hour ethics and Insurance Code course is still required."
  boards:
    - place: "Texas"
      body: "Texas Department of Insurance (TDI)"
      rule: "No prelicensing course: pass the state exam first (InsTX-LAH05 for life, accident and health; InsTX-PC06 for property and casualty), get fingerprints through IdentoGO, then apply on Sircon or NIPR within one year. Agent application fee $50. A temporary license needs a sponsor who already has an insurance license; it lasts 180 days and cannot be renewed."
      sources: [tdi_general_lines, tdi_be_agent]
    - place: "California"
      body: "California Department of Insurance (CDI)"
      rule: "From 1 January 2026 the 20-hour prelicensing course is no longer required for property, casualty, personal and commercial lines, limited line automobile, life, and accident and health licenses. The 12 hours of ethics and California Insurance Code is still required before the license is issued (not before the exam). Fingerprints come after the exam, before the application."
      sources: [ca_cdi_ab943]
    - place: "New York"
      body: "Department of Financial Services (DFS)"
      rule: "A DFS-approved prelicensing course: 40 hours for life, accident and health (20 for life only or accident and health only), 40 for personal lines, 90 for property/casualty. Holders of CPCU, CLU, ChFC and some other designations are exempt. Exams are given by PSI."
      sources: [ny_dfs_prelicensing]
  sources: [bls_ooh, ooh_insagent]
  last_verified: 2026-10-20
  page:
    title: "How to Get an Insurance Agent License: State Exam, Prelicensing and Lines | Education Margdarshan USA"
    description: "Becoming a licensed insurance agent (producer) in the U.S.: life and health or property and casualty, prelicensing courses where required and the state exam, with Texas, California and New York rules."
    current: "Insurance agent license"

mortgage-loan-originator:
  short: "Mortgage Loan Originator"
  name: "Mortgage Loan Originator (MLO) license"
  authority: "State financial regulators, through NMLS"
  authority_lede: "state financial regulators through NMLS"
  national_bodies:
    - "NMLS — approves pre-licensure courses and delivers the SAFE MLO Test"
  education: "At least 20 hours of NMLS-approved pre-licensure education under the SAFE Act, plus any state-specific hours"
  exams:
    - name: "SAFE MLO Test (National Test with Uniform State Test)"
      by: "NMLS"
      what: "190 minutes at a Prometric center or online proctored. Pass with at least 75%; fee $110. Passing once meets the test requirement of every state agency; results expire if you hold no license or registration for 5 years. A course is not required before the test, but the 20 hours still are before the license application."
      source: nmls_test_faq
  experience: "Background and credit checks; mortgage companies may prefer residential mortgage or real estate experience (BLS)"
  steps:
    - "A bachelor's degree is typical for loan officers (BLS)"
    - "20 hours of NMLS-approved pre-licensure education: 3 federal law, 3 ethics, 2 nontraditional lending, 12 electives (some states add more)"
    - "SAFE MLO Test (pass with 75%)"
    - "License application in NMLS, with background and credit checks"
    - "8 hours of NMLS-approved continuing education every year"
  jurisdiction_note: "The SAFE Act's 20 hours of pre-licensure and 8 hours of yearly continuing education are minimums: a state may require more hours, or require some of the electives to be on state law (NMLS). Licenses must be renewed annually (BLS)."
  not_required_for:
    - "Loan originators at insured depositories regulated by the OCC, FDIC, Federal Reserve, NCUA or Farm Credit Administration are registrants, not state licensees, and are not required to take the National Test (NMLS)."
    - "Commercial and consumer loan officers who do not originate mortgages need no MLO license (BLS)."
  boards:
    - place: "Texas"
      body: "Department of Savings and Mortgage Lending (TX-SML)"
      rule: "23 hours: the 20 SAFE hours plus 3 hours of Texas law, either as a 23-hour Texas comprehensive course or a 20-hour course plus a 3-hour TX-SML elective. Other states' law hours do not count as electives. Pre-licensing education must be completed within 3 years of the application."
      sources: [nmls_tx_sml]
    - place: "California"
      body: "Department of Financial Protection and Innovation (DFPI)"
      rule: "20 hours, with 2 of the 12 elective hours on California DFPI law. Continuing education: 8 hours a year including 1 hour of California law."
      sources: [nmls_ca_dfpi]
    - place: "New York"
      body: "New York state agency (NMLS state page)"
      rule: "20 hours, with 3 of the 12 elective hours on New York law."
      sources: [nmls_ny]
    - place: "Florida"
      body: "Florida state agency (NMLS state page)"
      rule: "20 hours, with 2 of the 12 elective hours on Florida law. Continuing education: 8 hours a year including 1 hour of Florida law; MLOs cannot apply to renew without it."
      sources: [nmls_fl]
  sources: [bls_ooh, ooh_loanoff, nmls_pe_faq, nmls_test_faq, nmls_safe_ed]
  last_verified: 2026-10-20
  page:
    title: "How to Get a Mortgage Loan Originator (MLO) License: 20 Hours, SAFE MLO Test, NMLS | Education Margdarshan USA"
    description: "Becoming a licensed mortgage loan officer: 20 hours of NMLS-approved education, the SAFE MLO Test (75% to pass) and a state license through NMLS, with Texas, California, New York and Florida hours."
    current: "MLO license"

real-estate-appraiser:
  short: "Real Estate Appraiser"
  name: "Real estate appraiser license or certification (trainee, licensed residential, certified residential, certified general)"
  authority: "State appraiser regulatory agencies"
  national_bodies:
    - "Appraiser Qualifications Board (AQB) of The Appraisal Foundation — sets the minimum Real Property Appraiser Qualification Criteria and issues the National Uniform Licensing and Certification Examination"
  education: "Qualifying appraisal education for the credential; certified residential also needs college-level education, and certified general a bachelor's degree"
  exams:
    - name: "National Uniform Licensing and Certification Examination"
      by: "Appraiser Qualifications Board (AQB)"
      what: "One exam for each credential (licensed residential, certified residential, certified general). Under FIRREA (1989), everyone seeking a state real property appraiser license or certification must pass an AQB-issued or endorsed exam. You sit it after the state has verified your education and experience."
      source: taf_national_exam
  experience: "Hours of supervised experience (for example 1,000 hours over at least 6 months for licensed residential), or PAREA or a practicum course in their place"
  steps:
    - "Ask your state agency which credentials it offers (not every state has trainee or licensed residential)"
    - "Qualifying education, through a provider your state approves"
    - "Experience under a supervisory appraiser, or a practicum, or PAREA"
    - "College-level education for certified residential; a bachelor's degree for certified general"
    - "AQB National Uniform exam for your credential"
    - "State license or certification"
  jurisdiction_note: "State requirements may not be less stringent than the AQB Criteria, and your state's rules define your actual path; not every state offers every classification (The Appraisal Foundation). Federal law requires a state license or certification for appraisals in federally related transactions (BLS)."
  not_required_for:
    - "Appraisers of personal and business property, and assessors, have no federal licensing requirement, although some states require certification (BLS)."
  boards:
    - place: "Texas"
      body: "Texas Appraiser Licensing and Certification Board (TALCB)"
      rule: "Trainee: 83 hours of qualifying education plus the 4-hour trainee/supervisor course and a supervisor. Licensed residential: 158 hours and 1,000 hours over at least 6 months (or Licensed Residential PAREA). Certified residential: 200 hours, college-level education (6 options) and 1,500 hours over at least 12 months. Certified general: 300 hours, a bachelor's degree and 3,000 hours over at least 18 months with 1,500 non-residential. Exams through Pearson VUE; a pass is valid 24 months."
      sources: [talcb_trainee, talcb_lr, talcb_cr, talcb_cg]
    - place: "California"
      body: "Bureau of Real Estate Appraisers (BREA)"
      rule: "Trainee: 75 hours, no experience. Residential (AL): 150 hours and 1,000 hours over at least 6 months. Certified residential (AR): college-level education, 200 hours and 1,500 hours over 12 months. Certified general (AG): bachelor's degree, 300 hours and 3,000 hours over 18 months with 1,500 non-residential. Licensed residential applicants also take a 1-hour cultural competency and a 4-hour California laws course."
      sources: [brea_levels, brea_lr]
  sources: [bls_ooh, ooh_appraiser, taf_real_property, taf_national_exam]
  last_verified: 2026-10-20
  page:
    title: "How to Become a Real Estate Appraiser: Trainee to Certified General, AQB Exam | Education Margdarshan USA"
    description: "U.S. real estate appraiser credentials: qualifying education hours, supervised experience or PAREA, college rules and the AQB national exam, with Texas (TALCB) and California (BREA) requirements."
    current: "Appraiser license"

teaching:
  short: "Teaching"
  name: "State teaching certificate or license (public schools)"
  authority: "State education departments and educator certification boards"
  authority_lede: "state education departments"   # lede wording (lower-casing is fine here; kept explicit like emt)
  national_bodies:
    - "ETS — writes the Praxis tests; Pennsylvania, for example, sets which Praxis tests and passing scores it requires"
    - "Pearson — runs state test programs such as New York's NYSTCE and some Pennsylvania tests"
  education: "A bachelor's degree with a minimum grade point average and a teacher preparation program that includes student teaching (BLS). Every state also has an alternative route for people who already hold a bachelor's degree"
  exams:
    - name: "General teaching test + subject test (the state's choice)"
      by: "Each state"
      what: "BLS: certification generally involves passing a general teaching certification test and a test of the subject you will teach. States pick the tests: Praxis, a Pearson program, or their own."
      source: ooh_elemteach
    - name: "Praxis (Pennsylvania and other states)"
      by: "ETS"
      what: "Pennsylvania assesses General Knowledge, Professional Knowledge and Subject Area Knowledge before it issues a certificate; its registration list names ETS/Praxis and Pearson. PK-12 candidates also take Fundamental Subjects: Content Knowledge (5511) on a first certificate."
      source: pa_cert_testing
    - name: "NYSTCE (New York)"
      by: "New York State Education Department"
      what: "Usually the Educating All Students (EAS) test plus the Content Specialty Test(s) for the certificate title."
      source: nysed_certexam
    - name: "Florida General Knowledge Test and subject area exams"
      by: "Florida Department of Education"
      what: "A passing General Knowledge score counts for 10 years; a master's degree, a standard certificate from another state or set GRE scores can also meet the requirement."
      source: fldoe_gk
    - name: "Texas certification exams"
      by: "Texas Education Agency"
      what: "Your educator preparation program approves you to test. Core Subjects EC–6 (391) is last offered on 31 August 2027 and is being replaced by new Core EC–6 exams with constructed-response questions."
      source: tea_testing
  experience: "Student teaching inside the preparation program; some states then require a master's degree after you are certified and hired (BLS)."
  steps:
    - "High school diploma"
    - "Bachelor's degree (education, or a content major where the state asks for one)"
    - "State-approved teacher preparation program with student teaching (or an alternative program)"
    - "The state's tests: general teaching knowledge and your subject"
    - "Background check and fingerprints"
    - "State certificate or license for a grade level and subject"
    - "Professional development to keep it"
  jurisdiction_note: "All states require public school teachers to be licensed or certified in the specific grade level they teach (BLS). The tests, routes, fees and renewal rules differ by state, so follow your state's education department."
  not_required_for:
    - "Private school teachers typically do not need a license (BLS)."
    - "College and university (postsecondary) teachers: no state teaching license, unless the subject they prepare students for needs one (BLS)."
  watch:
    - "Texas: Core Subjects EC–6 (391) is last offered 31 August 2027; new Core EC–6 exams come no earlier than September 2027 (TEA)."
    - "California: from 27 September 2026, candidates need a permit, a credential or an application for a Certificate of Clearance before a preparation program admits them (CTC)."
  boards:
    - place: "Texas"
      body: "Texas Education Agency (TEA)"
      rule: "Five requirements: a bachelor's degree from an accredited college; an approved educator preparation program (a university program if you have no degree; an alternative certification or post-baccalaureate program if you do); the certification exams your program approves; a state application; and fingerprinting for a national criminal background check."
      sources: [tea_classroom, tea_testing]
    - place: "California"
      body: "Commission on Teacher Credentialing (CTC)"
      rule: "Multiple Subject (elementary) preliminary credential, valid up to 5 years: a bachelor's degree; subject matter competence by exam, an approved subject matter program, coursework or a liberal studies major; a U.S. Constitution course or exam; an approved preparation program with reading instruction, CPR training and a Teaching Performance Assessment; and the program's recommendation. The clear credential comes through an induction program."
      sources: [ctc_cl561c]
    - place: "New York"
      body: "NYSED Office of Teaching Initiatives"
      rule: "A New York State certificate is required to teach in public schools; it confirms degree, coursework, test and experience requirements. Pathways include an approved New York preparation program, an alternative program, individual evaluation and applicants from other states. Tests usually include the EAS and the Content Specialty Test(s)."
      sources: [nysed_certprocess, nysed_pathways, nysed_certexam]
    - place: "Florida"
      body: "Florida Department of Education"
      rule: "Temporary certificate (5 school years, not renewable): a bachelor's degree and subject area knowledge (an exam, or subject specialization with a 2.5 GPA); issued once a Florida school hires you and your fingerprints clear. Professional certificate (5 years, renewable): adds general knowledge and professional preparation and education competence."
      sources: [fldoe_cert_types, fldoe_gk]
    - place: "Pennsylvania"
      body: "Pennsylvania Department of Education (PDE)"
      rule: "At least 18, good moral character, a U.S. citizen or legally authorized to work, and a bachelor's degree. Finish a traditional preparation program (GPA of at least 3.0) or enroll in an intern program (a free intern certificate lets you teach up to 3 years). Pass the required tests and apply through TIMS; an instructional certificate application is typically $200."
      sources: [pa_get_certified, pa_cert_testing]
  sources: [bls_ooh, ooh_elemteach, ooh_hsteach, pa_cert_testing, nysed_certexam]
  last_verified: 2026-10-20
  page:
    title: "How to Get a Teaching License: Degree, Student Teaching, Praxis or State Tests, Certification | Education Margdarshan USA"
    description: "U.S. teacher certification for public schools: bachelor's degree, teacher preparation with student teaching, Praxis or state tests, background check and the state certificate, with Texas, California, New York, Florida and Pennsylvania rules."
    current: "Teaching license"

# Phase 6 (2026-10-21): architecture. NCARB writes the ARE and runs the AXP; NAAB accredits degrees; each of the 55
# jurisdictions' boards grants the license (NCARB: "there is no national license").
architecture:
  short: "Architecture"
  name: "State architecture license (registered architect)"
  authority: "State architecture licensing boards (55 U.S. jurisdictions)"
  authority_lede: "state architecture licensing boards"
  national_bodies:
    - "NCARB (National Council of Architectural Registration Boards): runs the Architectural Experience Program (AXP) and the Architect Registration Examination (ARE), keeps candidates' NCARB Records; issues no licenses"
    - "NAAB (National Architectural Accrediting Board): accredits B.Arch, M.Arch and D.Arch programs"
  education: "Most jurisdictions require a degree from a NAAB-accredited program; 17 jurisdictions offer additional pathways for applicants with other (or no) college degrees (NCARB)"
  exams:
    - name: "Architect Registration Examination (ARE 5.0)"
      by: "NCARB"
      what: "Required by all 55 U.S. jurisdictions. Six divisions, scheduled separately, with content that aligns to the AXP's experience areas."
      source: ncarb_license
    - name: "ARE question types"
      by: "NCARB"
      what: "Every division mixes multiple-choice, check-all-that-apply and hotspot items with case studies; each item is worth one point, with no partial credit, and each appointment includes 30 to 45 minutes of break time."
      source: ncarb_are_format
    - name: "ARE fees"
      by: "NCARB"
      what: "$263 per division ($1,578 for all six); retakes $263. The NCARB Record costs $105 to open and $105 a year to renew."
      source: ncarb_fees
    - name: "State supplemental exam (some states)"
      by: "The state board"
      what: "Some boards require additional experience or a location-specific supplemental exam before licensure, such as the California Supplemental Examination (CSE)."
      source: ncarb_license
  experience: "The AXP: 3,740 hours across six experience areas (Practice Management 160, Project Management 360, Programming & Analysis 260, Project Planning & Design 1,080, Project Development & Documentation 1,520, Construction & Evaluation 360). About half must be in an architecture firm under a licensed architect; up to 1,860 hours may be gained outside a firm."
  steps:
    - "High school diploma"
    - "NAAB-accredited degree: 5-year B.Arch, or a pre-professional degree + M.Arch (or another pathway in 17 jurisdictions)"
    - "Open an NCARB Record"
    - "AXP: 3,740 documented hours"
    - "ARE 5.0: six divisions (most jurisdictions let you start before the AXP is finished)"
    - "Any extra state requirement (experience or a supplemental exam)"
    - "NCARB Record transmitted to the state board, then the state license"
  jurisdiction_note: "Each of the 55 U.S. jurisdictions sets its own requirements for licensure, and some require more experience or a supplemental exam. A licensed architect can seek a reciprocal license in another state; all jurisdictions accept the NCARB Certificate."
  not_required_for:
    - "Working in an architecture firm before licensure (AXP experience is earned under a licensed architect); you may not call yourself an architect until licensed (NCARB)."
  watch:
    - "NCARB updated the ARE on 27 April 2026 (12 of 91 objectives adjusted, case studies shortened) and the AXP in November 2025 (experience up to a year old earns full credit, older experience 75%)."
    - "NCARB plans new licensure pathways, including for people without a NAAB degree; no changes before 2027 at the earliest."
  boards:
    - place: "Texas"
      body: "Texas Board of Architectural Examiners (TBAE)"
      rule: "Registration by examination under TBAE Rules 1.21 and 1.23. Create a TBAE account only if you have or are completing a NAAB-accredited degree; $100 application fee, proof of legal status and a fingerprint-based criminal history check. TBAE offers an ARE grant to residents who meet income criteria and have passed at least 2 divisions."
      sources: [tx_tbae_exam]
    - place: "California"
      body: "California Architects Board (CAB)"
      rule: "At least 18 (or a high school graduate); all ARE divisions; the California Supplemental Examination (CSE); the AXP (or Canada's IAP); and 8 years of architectural training and education combined (education credit or extra AXP hours), under Business and Professions Code s. 5552."
      sources: [ca_cab_become]
    - place: "New York"
      body: "NYSED Office of the Professions"
      rule: "At least 21, good moral character, and education plus experience totalling at least 12 units (a NAAB degree counts up to 9; a NAAB degree is not required). Initial applicants document the AXP and pass the ARE. Licensure fee $377 (Form 1)."
      sources: [ny_op_arch]
  sources: [ncarb_license, ncarb_axp, ncarb_are, ncarb_fees, naab_students, ooh_architects]
  last_verified: 2026-10-21
  page:
    title: "How to Become a Licensed Architect: NAAB Degree, AXP, ARE and State License | Education Margdarshan USA"
