# Journey Blueprint — Digital Marketing Manager. Printed on journey-digital-marketer.html (_includes/journey-doubts.html).
# Rules, classes and the money items / sources several careers share: _data/in/journey_common.yml.
# `money_defs` / `sources` below are used only by this career. Check: node scripts/check-journey-matrix.mjs
id: digital-marketer
v: 2
name: "Digital Marketing Manager"
search: ["digital marketing manager", "digital marketer", "digital marketing executive", "social media manager", "seo specialist", "performance marketer", "content marketer", "social media marketing"]
page: "bba.html"
doubts_page: "journey-digital-marketer.html"
gate: "Any Class 12 stream → a degree such as BBA, B.Com or BA (CUET (UG) for central universities, or IIM Indore's 5-year IPM straight after Class 12) → skills and a portfolio. Skill India's NSQF Level 6 'Digital Marketing Manager' qualification asks for a postgraduate degree, or a graduate degree plus 1–3 years' experience. Every paid endorsement must be disclosed under India's consumer rules."
gate_source: [cuet26, ipm26, nqr-dmm, pib-endorse]
core:
  what:
    text: "A digital marketing manager runs a brand's online marketing — search engine advertising, search engine optimisation, social media and email marketing — to raise its online visibility and bring in leads and sales."
    source: nqr-dmm
  day:
    - "Plan campaigns and budgets across search, social media and email."
    - "Write or approve posts, ads and landing pages."
    - "Read the numbers — clicks, leads, sales — and change what is not working."
    - "Check that every paid post is clearly marked as an ad."
  pay_note: "Digital marketing pay is set by private employers and is not officially published, so we print no figure."
  routes:
    - { title: "A degree through CUET (UG)", text: "Central universities admit to BBA, B.Com, BA and similar degrees through CUET (UG); NTA runs the test and each university makes its own merit list.", source: cuet26 }
    - { title: "IIM Indore IPM (after Class 12)", text: "A 5-year Integrated Programme in Management; selection on IIM Indore's aptitude test plus a personal interview. The 2026-31 rules set no minimum percentage; you must be born on or after 1 Aug 2006 (5 years' relaxation for SC / ST / PwD).", source: ipm26 }
    - { title: "Skill India qualification (NSQF Level 6)", text: "'Digital Marketing Manager' by the Media and Entertainment Skills Council: 840 hours (355 theory, 485 practical). Entry: postgraduate; or graduate in digital marketing / social media + 1 year; or any graduate + 3 years; or a 3-year diploma after Class 12 + 3 years; or Social Media Manager (NSQF Level 5) + 2 years.", source: nqr-dmm }
  cost_time:
    - { label: "Skill India 'Digital Marketing Manager'", value: "840 hours · NSQF Level 6 · qualification valid 5 years from Feb 2022", source: nqr-dmm }
    - { label: "CUET (UG) test", value: "Up to 5 of 37 tests · 50 MCQs, 60 minutes each", source: cuet26 }
  cost_note: "Course and college fees vary widely and are not fixed nationally, so we print no figure."
  challenges:
    - text: "Endorsements must disclose any 'material connection' — money, free products, trips, discounts, gifts, even family or work ties — with words like 'advertisement', 'sponsored' or 'paid promotion'."
      source: pib-endorse
    - text: "Endorsers must not promote a product they have not used or checked; misleading advertisements in any form are prohibited under the Consumer Protection Act 2019 and the 2022 guidelines."
      source: pib-endorse
    - text: "The skill list moves fast — even the Skill India qualification for this job is due for review on 23 Feb 2027."
      source: nqr-dmm
  not_for:
    - "You dislike numbers — campaigns are judged by data every day."
    - "You want the same work every year — platforms and rules keep changing."
    - "You want a government job with a fixed recruitment exam."
journey:
  - stages: [c8, c9]
    title: "Write, design, observe"
    do:
      - text: "Digital marketing covers search engine advertising, search engine optimisation, social media marketing and email marketing."
        source: nqr-dmm
      - text: "Practise writing short posts and studying why some ads work — and keep your English strong."
    doubts:
      - q: "What does a digital marketing manager do?"
        a: "Manages a brand's online marketing — search engine advertising, search engine optimisation, social media and email — to raise visibility and bring in leads and sales."
        next: "Notice the ads you see online and ask why they were made that way."
        source: nqr-dmm
      - q: "Can a student post paid promotions for brands on Instagram?"
        a: "If you get money, free products or any other benefit, you must clearly say so using words like 'advertisement', 'sponsored' or 'paid promotion', as the government's Endorsement Know-hows require."
        next: "Never hide a paid post among hashtags."
        source: pib-endorse
  - stages: [c10]
    title: "Any stream works"
    do:
      - text: "IIM Indore's IPM rules for 2026-31 set no minimum Class 10 or 12 percentage; CUET (UG) lets you choose up to 5 tests."
        source: [ipm26, cuet26]
    stream: "Any stream. Commerce or Maths helps with budgets and analytics."
    doubts:
      - q: "Which stream is best for digital marketing?"
        a: "There is no fixed stream. CUET (UG) lets you choose up to 5 of 37 tests for your degree, and IIM Indore's IPM sets no minimum percentage in its 2026-31 rules."
        next: "Choose subjects you can score well in, and keep English strong."
        source: [cuet26, ipm26]
      - q: "Do I need a high percentage for IIM Indore's IPM?"
        a: "IIM Indore's admission procedure for the 2026-31 batch sets no minimum Class 10 or Class 12 percentage; selection is on the aptitude test and a personal interview."
        next: "Prepare for the test and interview instead."
        source: ipm26
  - stages: [c11, c12]
    title: "CUET or IPMAT"
    do:
      - text: "IPMAT Indore has three 40-minute sections — Quantitative Ability (MCQ), Quantitative Ability (short answer) and Verbal Ability; +4 / −1, no minus in short answers."
        source: ipm26
      - text: "CUET (UG): +5 for a correct answer, −1 for a wrong one."
        source: cuet26
    exams:
      - { name: "IPMAT Indore 2026", when: "4 May 2026", source: ipm26 }
      - { name: "CUET (UG) 2026", when: "11–31 May 2026 (bulletin schedule)", source: cuet26 }
    money: [csss]
    doubts:
      - q: "What is IPMAT?"
        a: "IIM Indore's own aptitude test for its 5-year Integrated Programme in Management. Selection is on the test plus a personal interview; missing either means you are not considered."
        next: "Read the IPMAT guide for dates and sections."
        source: ipm26
      - q: "What is the age limit for IIM Indore's IPM?"
        a: "For the 2026-31 batch you had to be born on or after 1 August 2006, with 5 years' relaxation for SC, ST and PwD candidates."
        next: "Check the age rule in the next admission procedure."
        source: ipm26
      - q: "Is there negative marking in CUET (UG)?"
        a: "Yes. Each test has 50 MCQs in 60 minutes, with +5 for a correct answer and −1 for a wrong one."
        next: "Answer only what you can reason out."
        source: cuet26
  - stages: [ug]
    title: "In college: skills and proof of work"
    do:
      - text: "Skill India's 'Digital Marketing Manager' qualification is 840 hours long and counts a graduate in digital marketing / social media with 1 year's experience as eligible."
        source: nqr-dmm
    doubts:
      - q: "Is there a government-recognised digital marketing qualification?"
        a: "Yes. 'Digital Marketing Manager' is an NSQF Level 6 qualification from the Media and Entertainment Skills Council, approved by NCVET in February 2022: 840 hours (355 theory, 485 practical)."
        next: "Look for training providers that teach this qualification."
        source: nqr-dmm
      - q: "Is there a starting-level skill qualification?"
        a: "The Level 6 qualification lists 'Social Media Manager at NSQF Level 5' with two years' experience as one entry route."
        next: "Start with social media work and build experience."
        source: nqr-dmm
      - q: "Do influencers need to disclose free products?"
        a: "Yes. A 'material connection' includes free products, discounts, gifts, trips and hotel stays, not just money, and it must be clearly disclosed."
        next: "Keep a written note of every brand deal."
        source: pib-endorse
      - q: "Can I do the Level 6 Digital Marketing Manager course while in college?"
        a: "Not usually. Its entry rule asks for a postgraduate degree, or a graduate degree with 1 to 3 years of relevant experience, or a 3-year diploma with 3 years of experience."
        next: "Build experience through internships first."
        source: nqr-dmm
  - stages: [grad]
    title: "First job and the rules of the trade"
    do:
      - text: "Guidelines for Prevention of Misleading Advertisements and Endorsements for Misleading Advertisements came into force on 9 June 2022 under the Consumer Protection Act 2019."
        source: pib-endorse
    doubts:
      - q: "Do I need an MBA for digital marketing?"
        a: "No official rule requires one. The Skill India qualification accepts a postgraduate with no experience, or a graduate with 1–3 years' experience."
        next: "Build a portfolio of real campaigns."
        source: nqr-dmm
      - q: "What happens if an ad I run is misleading?"
        a: "Misleading advertisement in any form, format or medium is prohibited under the Consumer Protection Act 2019, and the 2022 guidelines set duties for advertisers, agencies and endorsers."
        next: "Check every claim in an ad before it goes live."
        source: pib-endorse
      - q: "How long is the Digital Marketing Manager course?"
        a: "840 hours in all — 355 hours of classroom theory and 485 hours of practical work."
        next: "Plan it alongside a job or internship."
        source: nqr-dmm
  - stages: [work]
    title: "Switching from another job"
    do:
      - text: "A 3-year diploma after Class 12 plus 3 years' relevant experience also qualifies for the Level 6 course."
        source: nqr-dmm
    doubts:
      - q: "I have a diploma, not a degree. Can I become a digital marketing manager?"
        a: "Yes. The Skill India qualification accepts a 3-year diploma after Class 12 with 3 years of relevant experience."
        next: "Count your relevant experience and pick a training provider."
        source: nqr-dmm
board_note: "Any board and stream. CUET (UG) and IIM Indore's IPM set no board-specific rules in this blueprint's sources."
board_source: [cuet26, ipm26]
