  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Is Bachelor of Finance the same as BFM?"
            a: "Yes. In India, \"Bachelor of Finance\" almost always refers to BFM — Bachelor of Financial Markets — a specialised undergraduate degree introduced by the University of Mumbai in 2008-09. It is not the same as a general finance elective inside a B.Com programme."
          - q: "Is BFM available outside Mumbai and Maharashtra?"
            a: "BFM is predominantly offered at University of Mumbai-affiliated colleges. A small number of colleges elsewhere may offer similarly named finance-specialised degrees, but for students outside Maharashtra, a B.Com with a finance specialisation or a Bachelor of Finance-equivalent programme abroad is usually the more accessible option."
          - q: "Is BFM better than B.Com for a finance career?"
            a: "Neither is universally better. BFM goes deeper into financial markets, equity research, derivatives and financial modelling from the first year, which suits students who already know they want a markets-focused career. B.Com is broader and keeps options like CA, CS and CMA more naturally open."
          - q: "Can I do CFA or an MBA after BFM?"
            a: "Yes. BFM's syllabus overlaps meaningfully with the CFA curriculum, making it a strong stepping stone toward the CFA charter, FRM or an MBA in Finance via CAT, XAT or a university-specific entrance test."
          - q: "Does BFM guarantee a stock market or investment banking job?"
            a: "No degree guarantees a job. BFM builds a genuinely relevant foundation for stock markets, investment banking and fintech roles, but landing into the most competitive investment banking or trading roles usually still requires a strong college, further certification like CFA, or an MBA on top."
      - note: "*Fee and salary figures are indicative, based on publicly available information as of 2026, and vary significantly by institution — always verify current figures on the official college or university website."
