# Karnataka State Exam & Career Hub — one data sheet for the cockpit (state/karnataka/index.html) and every
# exam page under state/karnataka/. Rendered by _includes/state-cockpit.html and _includes/state-exam.html;
# checked by scripts/check-in-data.mjs (state sheets block).
#
# Rules for this sheet (same as gujarat.yml, maharashtra.yml, uttar-pradesh.yml and delhi.yml):
#   - Every fact part carries `source: <id>`; the id must be listed under that exam's `sources`.
#   - Sources are the official files themselves (read 2026-10-14): the KPSC Gazetted Probationers 2026-27
#     notification and its corrigendum (Kannada image scans, read page by page), the KEA UGCET-2026 and
#     PGCET-2026 information bulletins (English text PDFs), the KEA Village Administrative Officer 2026
#     notifications and notices (Kannada scans), the Karnataka State Police constable notification 2026-27
#     (Kannada scan) and the KSEAB 2027 time tables and fee memo (scans). Nothing comes from coaching or news sites.
#     Where no official file we could open states a value (KPSC pay scales, KCET application fee, PGCET
#     registration fee, a current PSI notification, in-hand pay), the text says so instead of guessing.
#   - Section ids are the same on every exam page: overview, eligibility, scheme, fees, reservation,
#     documents, pay, posting (+ sources, drawn automatically).
#   - Part kinds: p (paragraph), list (bullets), table {head, rows, caption?}, note (small print),
#     warn (callout box), links [{label, url}] (official buttons).
state:
  id: karnataka
  name: Karnataka
  checked: 2026-10-14

cockpit:
  eyebrow: "State Exam &amp; Career Hub · Karnataka"
  title: "Karnataka Exam &amp; Career Hub"
  intro:
    - "Every major Karnataka government recruitment and admission route on one screen: KPSC Gazetted Probationers (Group A and B), KEA's Village Administrative Officer recruitment, Karnataka State Police constables, KCET (UGCET) for engineering, farm science and pharmacy, PGCET for MBA, MCA and M.Tech, and the KSEAB SSLC and II PUC board exams. Each page is built only from the official notification, bulletin or circular, and every fact links back to that file."
    - "Three Karnataka rules decide more results than any other. Rural reservation (study from Class 1 to 10 in a rural area) and Kannada-medium reservation (Class 1 to 10 in Kannada medium) need their own certificates; candidates who have not passed Kannada as a first or second language in SSLC must clear a compulsory Kannada test for state jobs; and Kalyana-Karnataka (Article 371(J)) seats and posts need a separate eligibility certificate from the Assistant Commissioner."
  facts:
    - { label: "Recruitment nodes", value: "KPSC Gazetted Probationers · KEA VAO · Police Constable" }
    - { label: "Admission nodes", value: "KCET (UGCET) · UGNEET · PGCET · KSEAB SSLC &amp; II PUC" }
    - { label: "Coming up", value: "KPSC GP prelims 15 Nov 2026 (tentative)" }
    - { label: "Last checked", value: "14 Oct 2026" }
  groups:
    - id: civil
      eyebrow: "Civil recruitment &amp; administrative"
      heading: "Government recruitment exams"
      intro: "Group A and B administrative posts through the Karnataka Public Service Commission (KPSC), village-level Revenue Department posts through the Karnataka Examinations Authority (KEA), and Civil Police Constables of the Karnataka State Police, whose written test KEA also conducts."
      exams: [kpsc, vao, police]
    - id: academic
      eyebrow: "Academic &amp; professional admissions"
      heading: "Admission routes, and the board behind them"
      intro: "Government-quota seats in engineering, farm science, veterinary, nursing and pharmacy through KCET, MBBS, BDS and AYUSH seats on NEET UG rank through UGNEET counselling, MBA, MCA and M.E. / M.Tech seats through PGCET (all run by KEA), and the SSLC and II PUC exams of the Karnataka School Examination and Assessment Board (KSEAB) that most Karnataka students take."
      exams: [kcet, pgcet, kseab, neet-ug]
  compare_note: "Fees, age limits and dates are from the latest notice of each body. They change every cycle, so always open the current notice before applying."
  portals_note: "KPSC applications run only on kpsconline.karnataka.gov.in (one-time registration first); KEA recruitment and CET applications run on cetonline.karnataka.gov.in/kea; police notifications are posted on ksp.karnataka.gov.in and ksp-recruitment.in; board circulars are on kseab.karnataka.gov.in. Only use these official addresses."
  portals:
    - { label: "KPSC (notifications)", url: "https://kpsc.karnataka.gov.in/" }
    - { label: "KPSC online application", url: "https://kpsconline.karnataka.gov.in/" }
    - { label: "Karnataka Examinations Authority (KEA)", url: "https://cetonline.karnataka.gov.in/kea/" }
    - { label: "Karnataka State Police — recruitment", url: "https://ksp.karnataka.gov.in/info-3/Recruitment/kn" }
    - { label: "KSP recruitment portal", url: "https://ksp-recruitment.in/" }
    - { label: "KSEAB (SSLC and II PUC)", url: "https://kseab.karnataka.gov.in/" }

exams:
  # ------------------------------------------------------------------ KEA UGNEET — MBBS / BDS (read 31 Oct 2026)
  - slug: neet-ug
    group: academic
    short: "UGNEET — MBBS, BDS &amp; AYUSH Counselling (KEA)"
    body: "Karnataka Examinations Authority (KEA), Bengaluru"
    card: "KEA counsels every government, private, NRI and 'others' MBBS and BDS seat in Karnataka on NEET UG rank, plus 85% of government AYUSH seats. Government seats need 7 years of study in Karnataka; cancelling late costs up to ₹1 lakh."
    card_facts: ["NEET UG rank", "Fee ₹750 / ₹2,500 / ₹5,000", "1-year rural service"]
    eyebrow: "KEA · UGNEET 2026"
    title: "Karnataka NEET UG Counselling 2026 — KEA UGNEET Seat Types, Eligibility, Fees &amp; Penalties"
    lede: "The Karnataka Examinations Authority (KEA) runs the online counselling for all Medical and Dental seats in the state, and for UG AYUSH seats, on NEET UG merit under the CET-2006 admission rules. This page follows KEA's UGNEET-2026 Information Bulletin (24 July 2026)."
    facts:
      - { label: "Merit", value: "NEET UG 2026 rank", source: ka-ib }
      - { label: "Seat types", value: "G · P · N (NRI) · Q (others)", source: ka-ib }
      - { label: "Registration fee", value: "₹750 Karnataka · ₹2,500 others · ₹5,000 NRI", source: ka-ib }
      - { label: "Bond", value: "1-year compulsory rural service (MBBS)", source: ka-ib }
    official:
      - { label: "KEA UGNEET-2026 page", url: "https://cetonline.karnataka.gov.in/kea/ugneet2026.aspx" }
      - { label: "UGNEET-2026 Information Bulletin (PDF)", url: "https://cetonline.karnataka.gov.in/keawebentry456/ugneet2026/NEET_INFORMATION_2026kannada.pdf" }
    sections:
      - id: overview
        nav: "Overview"
        eyebrow: "Overview &amp; official source"
        heading: "One KEA counselling for every Medical and Dental seat"
        parts:
          - p: "On the state government's direction KEA runs a common counselling for UG Medical and Dental seats in Government colleges, the government share in private and minority colleges, and <strong>all seats in private colleges</strong> (KPCF, KRLMPCA, AMPCK). Following NMC's letter of 24 July 2023, every round including the stray vacancy round is held only by KEA, online."
            source: ka-ib
          - p: "KEA also allots 85% of the seats in government and aided AYUSH colleges (the other 15% is All India quota) and all seats in private Ayurveda, Unani and Homoeopathy colleges."
            source: ka-ib
          - table:
              caption: "When you can register (2026)"
              head: ["Stage", "New registration?"]
              rows:
                - ["Main registration", "17 – 24 Jul 2026"]
                - ["Second round", "No"]
                - ["Third (mop-up) round", "No"]
                - ["Stray vacancy round", "Yes, on a separate schedule"]
            source: ka-ib
          - note: "Candidates who registered for UGCET (KCET) 2026 only add their NEET roll number to that application; no fresh registration is needed."
            source: ka-ib
      - id: eligibility
        nav: "Eligibility"
        eyebrow: "Who can apply"
        heading: "50% in PCB with English, NEET qualified"
        parts:
          - list:
              - "Passed 2nd PUC / Class 12 with English, and at least <strong>50%</strong> in Physics, Chemistry and Biology together (<strong>40%</strong> for SC, ST, Category-1, 2A, 2B, 3A and 3B), and qualified in UGNEET-2026."
              - "Candidates who did not pass every subject in the qualifying exam are not called for verification."
              - "Anyone holding a medical / dental / AYUSH seat from an earlier year that was not surrendered in time, or already studying such a course, cannot get a seat in 2026."
            source: ka-ib
          - list:
              - "<strong>Government seats (Clause a):</strong> studied in Karnataka for at least <strong>seven academic years</strong> between Class 1 and 2nd PUC / Class 12, and passed SSLC / Class 10 or 2nd PUC / Class 12 from Karnataka. Other clauses cover children of parents who studied 7 years in Karnataka, state and central employees, defence personnel and more."
              - "Category reservation, rural, Kannada-medium and special categories (NCC, sports) apply only to Karnataka candidates eligible for government seats."
            source: ka-ib
      - id: scheme
        nav: "Rounds &amp; Choices"
        eyebrow: "Counselling rounds"
        heading: "Option entry once, then Choice 1 to 4 after each round"
        parts:
          - list:
              - "Register and get documents verified to receive a <strong>verification slip</strong>; only then can you enter options."
              - "<strong>One-time option entry:</strong> options entered before Round 1 carry over to Round 2; you may delete or reorder them, and add only colleges newly added to the seat matrix."
              - "A mock allotment comes before the real first round. Seats are allotted by option priority, merit and the roster."
            source: ka-ib
          - table:
              caption: "After a Round 1 allotment"
              head: ["Choice", "Meaning"]
              rows:
                - ["Choice 1", "Happy with the seat: pay the fee, take admission, leave further rounds"]
                - ["Choice 2", "Keep the seat but try for a better one in Round 2"]
                - ["Choice 3", "Reject the seat but stay in Round 2"]
                - ["Choice 4", "Taken admission elsewhere: exit KEA counselling"]
            source: ka-ib
          - list:
              - "Rounds: first, second, third (mop-up) and a stray vacancy round, subject to seats."
              - "A seat taken elsewhere (another board) must be surrendered to KEA in writing before the Round 2 option deadline; not reporting does not count as surrender."
            source: ka-ib
      - id: fees
        nav: "Fees &amp; Penalties"
        eyebrow: "Registration fee &amp; surrender penalties"
        heading: "₹750 to register, up to ₹1 lakh to quit late"
        parts:
          - table:
              caption: "Registration fee"
              head: ["Candidate", "Fee"]
              rows:
                - ["Karnataka (SC / ST / Cat-1 / PwD / GM / 2A / 2B / 3A / 3B)", "₹750"]
                - ["Non-Karnataka", "₹2,500"]
                - ["NRI Ward / NRI / OCI / PIO / foreign national", "₹5,000"]
            source: ka-ib
          - table:
              caption: "Surrendering a seat"
              head: ["When", "Deduction"]
              rows:
                - ["Round 1 seat, before Round 2 option deadline", "₹5,000"]
                - ["After Round 2, before Round 3 option deadline", "₹5,000 + ₹5,000"]
                - ["After Round 3 option deadline, before stray round", "₹1,00,000 (Medical) · ₹50,000 (Dental) · ₹25,000 (AYUSH), incl. the ₹10,000"]
                - ["After the stray round option deadline", "One year's fee forfeited plus the same penalty"]
            source: ka-ib
          - note: "No surrender is accepted after the third (mop-up) round, and no one is exempt from the penalty."
            source: ka-ib
      - id: reservation
        nav: "Seat Types &amp; Quotas"
        eyebrow: "Seat classification"
        heading: "G, P, N and Q seats"
        parts:
          - table:
              caption: "Who fills what (UGNEET-2026)"
              head: ["Seat type", "Where"]
              rows:
                - ["G — Government", "100% of seats in government colleges; 40% (Medical) / 35% (Dental) in private non-minority (KPCF) colleges; 25% in private minority colleges"]
                - ["P — Private", "KPCF: 40% Medical / 45% Dental; KRLMPCA &amp; AMPCK: 55%. Half of KPCF private seats are GMP (Karnataka only), half OPN (all-India merit, Indian citizens)"]
                - ["N — NRI", "15% of seats in KPCF, KRLMPCA and AMPCK colleges"]
                - ["Q — Others", "5% of seats in KPCF, KRLMPCA and AMPCK colleges; open to all NEET-qualified Indians"]
            source: ka-ib
          - list:
              - "In minority colleges, 66% of the private share goes to the religious / linguistic minority; of the rest, half is GMP and half OPN."
              - "Scheduled Castes now have internal reservation (SCA, SCB, SCC); enter the RD number of a caste certificate showing it."
              - "Kalyana-Karnataka (Hyderabad-Karnataka, Article 371 J) candidates need the Assistant Commissioner's eligibility certificate."
            source: ka-ib
      - id: documents
        nav: "Documents"
        eyebrow: "Document checklist"
        heading: "Originals at verification"
        parts:
          - list:
              - "Nothing is posted to KEA. After online registration, the categories that must attend document verification are notified, and originals are checked there."
              - "Clause (a) needs the study certificate for the seven years in Karnataka, signed by the Block Education Officer / DDPU."
              - "Income certificate from the Tahsildar to claim tuition fee exemption (SC / ST / Category-1); NRI Ward certificate (Annexure-6) if claimed."
            source: ka-ib
      - id: pay
        nav: "Tuition &amp; Bond"
        eyebrow: "College fees &amp; rural service"
        heading: "Separate fee for each seat type, then a year of rural service"
        parts:
          - list:
              - "Each seat type (G, P, N, Q) has its own fee, and G seats in government colleges and in private colleges are charged differently. The government order on fees is published before option entry."
              - "Every MBBS student admitted through KEA must give an affidavit (₹100 e-stamp) and do <strong>one year of compulsory rural service</strong> in a government hospital after the course; until then only temporary registration is given."
            source: ka-ib
      - id: posting
        nav: "After Allotment"
        eyebrow: "After allotment"
        heading: "Pay, download the order, report"
        parts:
          - p: "A Choice 1 candidate must pay the fee and download the admission order by the deadline; otherwise the seat is cancelled and any fee paid is forfeited. Appeals against the Executive Director's decisions go within 15 days to the Additional Chief Secretary; disputes fall under the Karnataka High Court."
            source: ka-ib
          - links:
              - { label: "NEET UG", url: "neet-ug.html" }
              - { label: "KCET", url: "state/karnataka/kcet.html" }
              - { label: "MBBS college finder", url: "colleges-mbbs.html" }
    sources:
      - { id: ka-ib, name: "Karnataka Examinations Authority — UGNEET-2026 Information Bulletin for Medical, Dental and AYUSH counselling (24 Jul 2026)", url: "https://cetonline.karnataka.gov.in/keawebentry456/ugneet2026/NEET_INFORMATION_2026kannada.pdf", covers: "scope, AYUSH share, registration window and fee, academic eligibility, Clause a, seat classification and percentages, internal SC reservation, options, choices, rounds, surrender penalties, rural service, fees by seat type, appeals", checked: 2026-10-31 }
  # ------------------------------------------------------------------ KPSC GAZETTED PROBATIONERS
  - slug: kpsc
    group: civil
    short: "KPSC Gazetted Probationers (Group A &amp; B)"
    body: "Karnataka Public Service Commission"
    card: "Karnataka's state civil services exam: Assistant Commissioner, Tahsildar, Commercial Tax Officer, Assistant Commissioner of Commercial Taxes, Chief Officer and other Group A and B posts, through a prelims, a mains with two qualifying language papers, and a personality test."
    card_facts: ["2026-27: 319 posts", "Age 21–40 (43 / 45 for reserved)", "Prelims 15 Nov 2026 (tentative)"]
    eyebrow: "KPSC · Group A &amp; B services"
    title: "KPSC Gazetted Probationers 2026-27 — 319 Group A and B Posts"
    lede: "The Gazetted Probationers (GP) exam fills Karnataka's senior administrative posts. This page follows the KPSC notification of 31 July 2026 for 319 posts (117 Group A, 202 Group B; 297 in the residual parent cadre and 22 in the Hyderabad-Karnataka cadre) and its corrigendum of 31 August 2026."
    facts:
      - { label: "Posts", value: "319 (Group A 117 · Group B 202)", source: gp-26 }
      - { label: "Qualification", value: "Any bachelor's degree", source: gp-26 }
      - { label: "Age", value: "21 to 40 (2A–3B: 43 · SC/ST/Cat-1: 45)", source: gp-26 }
      - { label: "Fee", value: "₹600 · 2A–3B ₹300 · SC/ST/Cat-1/PH nil", source: gp-26 }
    official:
      - { label: "KPSC notifications", url: "https://kpsc.karnataka.gov.in/256/latest-notifications/kn" }
      - { label: "GP 2026-27 notification (PDF)", url: "https://demo.karnataka.gov.in/kpsc2/public/uploads/notification%20GP%202026_1785564344.pdf" }
      - { label: "Apply on kpsconline.karnataka.gov.in", url: "https://kpsconline.karnataka.gov.in/" }
    sections:
      - id: overview
        nav: "Overview"
        eyebrow: "Overview &amp; official source"
        heading: "The 2026-27 notification"
        parts:
          - p: "KPSC notification No. KPSCKA/EXA1/EXMF/9/2026-EXAM-1/I/251710/2026 of 31 July 2026 invites applications for 319 Gazetted Probationer posts under the Karnataka Gazetted Probationers (Appointment by Competitive Examinations) Rules, 1997. Online applications opened on 1 August 2026; the preliminary examination is tentatively set for 15 November 2026."
            source: gp-26
          - p: "The original closing date of 31 August 2026 was extended to 7 September 2026 because many applicants could not get caste, income and Hyderabad-Karnataka certificates in time from the Nadakacheri and Seva Sindhu servers. Nothing else in the notification changed."
            source: gp-cor
          - table:
              caption: "Group A posts (residual parent cadre + Hyderabad-Karnataka cadre)"
              head: ["Post and department", "RPC", "HK", "Total"]
              rows:
                - ["Assistant Commissioner (junior scale), DPAR", "36", "3", "39"]
                - ["Assistant Commissioner of Commercial Taxes", "50", "–", "50"]
                - ["Assistant Director, Treasury", "2", "–", "2"]
                - ["Executive Officer / Assistant Secretary, Rural Development &amp; Panchayat Raj", "13", "2", "15"]
                - ["Assistant Director Grade-1, Social Welfare", "11", "–", "11"]
                - ["Total Group A", "112", "5", "117"]
            source: gp-26
          - table:
              caption: "Group B posts"
              head: ["Post and department", "RPC", "HK", "Total"]
              rows:
                - ["Tahsildar (Grade-2), Revenue", "18", "7", "25"]
                - ["Commercial Tax Officer", "74", "–", "74"]
                - ["Assistant Superintendent, Prisons", "5", "1", "6"]
                - ["Assistant Registrar of Co-operative Societies", "19", "2", "21"]
                - ["Assistant Director, Agricultural Marketing", "10", "2", "12"]
                - ["Excise Deputy Superintendent", "5", "–", "5"]
                - ["Employment Officer, Skill Development", "3", "–", "3"]
                - ["Chief Officer (Grade-1), Urban Development", "18", "2", "20"]
                - ["Assistant Treasury Officer, Finance", "12", "–", "12"]
                - ["Assistant Director, Food &amp; Civil Supplies", "2", "2", "4"]
                - ["Section Officer, Karnataka Government Secretariat", "5", "–", "5"]
                - ["Section Officer, KPSC", "3", "1", "4"]
                - ["Assistant Director Grade-2, Social Welfare", "11", "–", "11"]
                - ["Total Group B", "185", "17", "202"]
            source: gp-26
      - id: eligibility
        nav: "Eligibility &amp; Age"
        eyebrow: "Eligibility &amp; age limits"
        heading: "Degree, age and number of attempts"
        parts:
          - list:
              - "<strong>Qualification:</strong> a bachelor's or master's degree from a university established by law in India, or an equivalent qualification (Rule 7). Final-year students may sit the prelims, but must show the degree when applying for the mains."
              - "<strong>Citizenship:</strong> the candidate must be a citizen of India."
              - "<strong>Age:</strong> at least 21 on the last date for applications."
            source: gp-26
          - table:
              caption: "Maximum age (includes the one-time 5-year relaxation of Government Order 29-01-2026)"
              head: ["Category", "Maximum age"]
              rows:
                - ["General merit", "40"]
                - ["Category 2A, 2B, 3A, 3B", "43"]
                - ["SC, ST, Category-1", "45"]
            source: gp-26
          - list:
              - "<strong>Ex-servicemen:</strong> military service + 3 years."
              - "<strong>Persons with disabilities:</strong> 10 years more."
              - "<strong>Widows:</strong> 10 years more (with a certificate that they have not remarried)."
            source: gp-26
          - table:
              caption: "Maximum attempts at the preliminary exam"
              head: ["Category", "Attempts"]
              rows:
                - ["General merit", "5"]
                - ["Category 1, 2A, 2B, 3A, 3B", "7"]
                - ["SC, ST", "No limit"]
            source: gp-26
          - note: "Physical standards apply to some posts — for example Deputy Superintendent of Police (Civil) asks men for 165 cm height and 84 cm chest, and women for 157 cm and 46 kg; Assistant Superintendent of Prisons and Excise Deputy Superintendent have their own tables in para 11 of the notification."
            source: gp-26
      - id: scheme
        nav: "Exam Scheme"
        eyebrow: "Exam scheme"
        heading: "Prelims, mains with Kannada and English, then interview"
        parts:
          - table:
              caption: "Preliminary exam — two objective papers, 2 hours each, 2 marks per question"
              head: ["Paper", "Subject", "Questions", "Marks"]
              rows:
                - ["Paper 1", "General studies (national and international importance)", "40", "80"]
                - ["Paper 1", "Humanities", "60", "120"]
                - ["Paper 2", "General studies related to State importance", "40", "80"]
                - ["Paper 2", "General science &amp; technology, environment &amp; ecology", "30", "60"]
                - ["Paper 2", "General mental ability", "30", "60"]
                - ["Total", "", "200", "400"]
            source: gp-26
          - list:
              - "Negative marking: one-fourth (0.25) of the marks of a question is deducted for each wrong answer; more than one answer counts as wrong; a blank answer has no penalty."
              - "Papers are set in Kannada and English; general mental ability is at SSLC level, the rest at degree level."
              - "15 times the number of vacancies are admitted to the mains, category-wise."
            source: gp-26
          - table:
              caption: "Main examination (descriptive)"
              head: ["Paper", "Subject", "Marks", "Hours"]
              rows:
                - ["Qualifying", "Kannada", "150", "2"]
                - ["Qualifying", "English", "150", "2"]
                - ["Paper 1", "Essay", "250", "3"]
                - ["Papers 2–5", "General Studies 1, 2, 3, 4 (250 each)", "1,000", "3 each"]
                - ["Written total", "", "1,250", ""]
                - ["Personality test", "", "25", ""]
                - ["Grand total", "", "1,275", ""]
            source: gp-26
          - warn: "The Kannada and English papers only qualify, but you must score at least 35% (52.5 of 150) in each. Anyone who misses this mark is not called for the personality test, however high the other papers are."
            source: gp-26
          - note: "Candidates are called for the personality test in a 1:3 ratio to vacancies; the final 1:1 select list adds written and interview marks."
            source: gp-26
      - id: fees
        nav: "Fees"
        eyebrow: "Fee structure"
        heading: "Application fee"
        parts:
          - table:
              head: ["Candidate", "Fee"]
              rows:
                - ["General merit", "₹600"]
                - ["Category 2A, 2B, 3A, 3B", "₹300"]
                - ["Ex-servicemen", "₹50"]
                - ["SC, ST, Category-1, persons with disabilities", "Exempt"]
            source: gp-26
          - note: "Paid online only (net banking, debit or credit card, UPI) and never refunded or carried over to another exam. Demand drafts and postal orders are not accepted."
            source: gp-26
      - id: reservation
        nav: "Reservation &amp; Certificates"
        eyebrow: "Reservation &amp; certificates"
        heading: "Caste forms, rural, Kannada medium and Hyderabad-Karnataka"
        parts:
          - table:
              caption: "Caste certificate formats (Annexure-2 of the notification)"
              head: ["Category", "Form"]
              rows:
                - ["SC (Category A, B, C) and ST", "Form D"]
                - ["Category-1", "Form E"]
                - ["Category 2A, 2B, 3A, 3B", "Form F"]
            source: gp-26
          - list:
              - "<strong>Validity:</strong> SC, ST and Category-1 certificates stay valid for life unless cancelled; 2A, 2B, 3A and 3B certificates are valid for 5 years and must be valid on the last date for applications."
              - "<strong>Balija sub-castes:</strong> Balija, Banajiga, Naidu, Telaga Balija, Shetty Balija and related sub-castes are 2A for education but must claim 3A for jobs."
              - "<strong>Rural candidates:</strong> must have studied Class 1 to 10 in a rural area; general-merit applicants need Form-1 (creamy-layer exclusion from the Tahsildar) and Form-2 (study certificate signed by the head teacher and countersigned by the Block Education Officer); reserved categories need Form-2."
              - "<strong>Kannada medium:</strong> Class 1 to 10 in Kannada medium, certified by the head teacher (Government notification of 24-10-2002)."
              - "<strong>Hyderabad-Karnataka (Article 371(J)):</strong> local-person eligibility certificate in Annexure-A from the Assistant Commissioner of the sub-division."
              - "<strong>Category is final:</strong> a reservation not claimed in the online form cannot be claimed later."
            source: gp-26
      - id: documents
        nav: "Documents"
        eyebrow: "Document checklist"
        heading: "What to upload and keep ready"
        parts:
          - list:
              - "KPSC one-time registration (OTR) on kpsconline.karnataka.gov.in, then 'Apply to Post'."
              - "Photograph and signature in JPEG (photo up to 200 KB, signature up to 70 KB)."
              - "Date of birth: only the SSLC (or equivalent) marks card, transfer certificate or cumulative-record extract is accepted."
              - "Degree certificate and marks cards (for the mains)."
              - "Caste / income certificate RD number, rural Form-1 / Form-2, Kannada-medium certificate, Annexure-A for HK, ex-servicemen and disability papers — all obtained before the last date and uploaded with the form."
            source: gp-26
      - id: pay
        nav: "Pay &amp; Salary"
        eyebrow: "Salary"
        heading: "Pay scales"
        parts:
          - note: "The 2026-27 notification lists posts, cadres and vacancy classification but does not print pay scales, so none is shown here. Each department's pay scale is notified under the Karnataka Civil Services rules; in-hand salary adds dearness allowance and HRA and subtracts deductions."
      - id: posting
        nav: "Job &amp; Posting"
        eyebrow: "Job profile &amp; posting"
        heading: "Where Gazetted Probationers work"
        parts:
          - p: "Group A officers start as Assistant Commissioners (sub-division revenue heads), Assistant Commissioners of Commercial Taxes, Executive Officers of taluk panchayats and Assistant Directors; Group B officers start as Tahsildars, Commercial Tax Officers, Chief Officers of urban local bodies, Assistant Registrars of co-operatives, Section Officers and similar posts. The 22 Hyderabad-Karnataka cadre posts are filled from local candidates of that region."
            source: gp-26
    sources:
      - { id: gp-26, name: "KPSC — Notification, Gazetted Probationers Group A &amp; B 2026-27, No. KPSCKA/EXA1/EXMF/9/2026-EXAM-1/I/251710/2026 (31 Jul 2026, Kannada)", url: "https://demo.karnataka.gov.in/kpsc2/public/uploads/notification%20GP%202026_1785564344.pdf", covers: "319 posts, dates, qualification, age and attempts, fee, prelims and mains scheme, negative marking, reservation certificates, physical standards, documents", checked: 2026-10-14 }
      - { id: gp-cor, name: "KPSC — Corrigendum notification, GP 2026-27 (31 Aug 2026)", url: "https://demo.karnataka.gov.in/kpsc2/public/uploads/corrigendum_notification_GP-2026_1788240823.pdf", covers: "application deadline extended to 7 Sep 2026", checked: 2026-10-14 }

  # ------------------------------------------------------------------ KEA VILLAGE ADMINISTRATIVE OFFICER
  - slug: vao
    group: civil
    short: "KEA Village Administrative Officer (VAO)"
    body: "Karnataka Examinations Authority (for the Revenue Department)"
    card: "Group-C Village Administrative Officer posts of the Revenue Department, filled district-wise through a KEA OMR exam after Class 12 (PUC). 2026: 505 posts in the residual cadre and 67 in Kalyana-Karnataka."
    card_facts: ["2026: 505 + 67 posts", "PUC · age 18–40", "Exam held 4 Oct 2026"]
    eyebrow: "KEA · Revenue Department"
    title: "KEA Village Administrative Officer (VAO) Recruitment 2026 — 572 Posts"
    lede: "Village Administrative Officers (Grama Adalitha Adhikari) are the Revenue Department's officers at village level. In 2026 KEA notified 505 posts in 21 districts of the residual parent cadre (RPC) and 67 in the Kalyana-Karnataka (KK) districts, with the written exam on 4 October 2026."
    facts:
      - { label: "Posts", value: "505 (RPC) + 67 (KK)", source: vao-rpc }
      - { label: "Qualification", value: "PUC (Class 12) or equivalent", source: vao-rpc }
      - { label: "Age", value: "18 to 40 (2A–3B: 43 · SC/ST/Cat-1: 45)", source: vao-rpc }
      - { label: "Pay scale", value: "₹34,100 – ₹67,600", source: vao-rpc }
    official:
      - { label: "KEA VAO 2026 (RPC) page", url: "https://cetonline.karnataka.gov.in/kea/vaorpc2026" }
      - { label: "KEA VAO 2026 (KK) page", url: "https://cetonline.karnataka.gov.in/kea/vaokk2026" }
      - { label: "RPC notification (PDF)", url: "https://cetonline.karnataka.gov.in/keawebentry456/vaorpc2026/vao_rpc_notification_10072026kannada.pdf" }
    sections:
      - id: overview
        nav: "Overview"
        eyebrow: "Overview &amp; official source"
        heading: "The 2026 notifications"
        parts:
          - p: "KEA notification No. ED/KEA/26/Ne.V./2026 (RPC) of 10 July 2026 invites applications for 505 Group-C Village Administrative Officer posts in 21 districts of the residual parent cadre, for direct recruitment through a competitive exam. Candidates may apply for one district only."
            source: vao-rpc
          - table:
              caption: "RPC posts by district (largest first)"
              head: ["District", "Posts"]
              rows:
                - ["Tumakuru, Mandya", "50 each"]
                - ["Belagavi", "48"]
                - ["Mysuru", "45"]
                - ["Hassan", "35"]
                - ["Chamarajanagar", "31"]
                - ["Bengaluru South", "30"]
                - ["Bengaluru Rural", "29"]
                - ["Kolar", "22"]
                - ["Chikkaballapur", "21"]
                - ["Bengaluru Urban, Dakshina Kannada", "20 each"]
                - ["Shivamogga", "18"]
                - ["Bagalkote", "16"]
                - ["Chitradurga, Haveri", "15 each"]
                - ["Gadag", "14"]
                - ["Udupi, Chikkamagaluru", "10 each"]
                - ["Bidar", "4"]
                - ["Raichur", "2"]
                - ["Total", "505"]
            source: vao-rpc
          - p: "A separate notification No. ED/KEA/27/Ne.V./2026 (KK) of the same date covers 67 posts in the Kalyana-Karnataka local cadre: Kalaburagi 40, Bidar 17 and Raichur 10."
            source: vao-kk
          - p: "Applications ran from 11 July 2026; the closing date was extended to 20 August 2026 and fee payment to 26 August 2026 (4 pm)."
            source: vao-ext
          - p: "The written exam was held on 4 October 2026 and provisional keys were published on 6 October; objections were accepted online until 10.30 am on 8 October 2026 at ₹25 per objection."
            source: vao-key
      - id: eligibility
        nav: "Eligibility &amp; Age"
        eyebrow: "Eligibility &amp; age limits"
        heading: "PUC and the age table"
        parts:
          - list:
              - "<strong>Qualification:</strong> PUC (Class 12) or equivalent, held on the last date for applications. Equivalents: CBSE / ICSE Class 12, another state board's Class 12, NIOS senior secondary, a 2-year ITI with an NIOS or PU-board language + subject, the state's JOC vocational course, and a 3-year diploma of the Technical Education Department (Government orders of 2018 and 2021)."
              - "<strong>Age:</strong> at least 18 on the last date."
              - "<strong>Citizenship:</strong> the candidate must be a citizen of India."
            source: vao-rpc
          - table:
              caption: "Maximum age (includes the one-time 5-year relaxation of Government Order 29-01-2026)"
              head: ["Category", "Maximum age"]
              rows:
                - ["General merit", "40"]
                - ["Category 2A, 2B, 3A, 3B", "43"]
                - ["SC, ST, Category-1", "45"]
            source: vao-rpc
          - list:
              - "<strong>Persons with disabilities, widows, and freed bonded labourers:</strong> 10 years more."
              - "<strong>Ex-servicemen:</strong> service + 3 years."
              - "<strong>State / local-body employees:</strong> years of service or 10 years, whichever is less."
            source: vao-rpc
      - id: scheme
        nav: "Exam Scheme"
        eyebrow: "Exam scheme"
        heading: "Two OMR papers and the compulsory Kannada test"
        parts:
          - table:
              caption: "Competitive exam (offline OMR)"
              head: ["Paper", "Subjects", "Questions / Marks", "Time"]
              rows:
                - ["Paper 1", "General knowledge: current events, everyday science, Indian Constitution, history and geography of India with focus on Karnataka, state administration, rural development and panchayat raj, Karnataka's economy and environment", "100 / 100", "2 hours"]
                - ["Paper 2", "General Kannada, general English, computer knowledge", "100 / 100", "2 hours"]
            source: vao-rpc
          - list:
              - "At least 35% is required in the competitive exam to be considered for selection."
              - "Negative marking: 0.25 mark for each wrong answer; leaving the 5th 'not attempted' circle unshaded also costs 0.25 per question."
              - "Selection is district-wise; KEA hands the merit list to the Deputy Commissioner of each district, who is the appointing authority."
            source: vao-rpc
          - warn: "Compulsory Kannada test: anyone who has not passed Kannada as a first or second language in SSLC (or higher), or studied in Kannada medium, or cleared an earlier compulsory Kannada test, must pass this 150-mark objective test with at least 50 marks. Its marks do not count for merit."
            source: vao-rpc
          - note: "The 2026 compulsory Kannada test was held on 8 October 2026, 3 pm to 5 pm: 100 questions, 1.5 marks each, 150 marks."
            source: vao-kan
      - id: fees
        nav: "Fees"
        eyebrow: "Fee structure"
        heading: "Application fee"
        parts:
          - table:
              head: ["Candidate", "Fee"]
              rows:
                - ["General merit and Category 2A, 2B, 3A, 3B", "₹750 (₹500 application + ₹250 processing)"]
                - ["SC, ST, Category-1, ex-servicemen, transgender", "₹500 (₹250 + ₹250)"]
                - ["Persons with disabilities", "₹250 (processing fee only)"]
            source: vao-rpc
          - note: "Paid online only and never refunded."
            source: vao-rpc
      - id: reservation
        nav: "Reservation &amp; Certificates"
        eyebrow: "Reservation &amp; certificates"
        heading: "Forms D, E, F, rural and Kannada medium"
        parts:
          - table:
              caption: "Caste certificate formats"
              head: ["Category", "Form"]
              rows:
                - ["SC (A, B, C) and ST", "Form D (enter the RD number for SC A / B / C)"]
                - ["Category-1", "Form E"]
                - ["Category 2A, 2B, 3A, 3B", "Form F"]
            source: vao-rpc
          - list:
              - "Only caste and income certificates issued for <strong>employment</strong> are accepted — certificates taken for education are not."
              - "Married women of 2A, 2B, 3A and 3B need a caste and income certificate issued in the husband's name."
              - "<strong>Rural reservation:</strong> study from Class 1 to 10 in a rural area; general-merit applicants need Form-1 (Tahsildar) and Form-2 (head teacher, countersigned by the Block Education Officer); reserved categories need Form-2. Losing a caste claim also cancels the rural claim."
              - "<strong>Kannada medium:</strong> Class 1 to 10 in Kannada medium, certified by the head teacher."
              - "<strong>Ex-servicemen:</strong> 10% of direct-recruitment posts."
              - "<strong>Persons with disabilities:</strong> 5% horizontal reservation in Group-C posts (40% or more disability; blind and low-vision candidates are not eligible for this post)."
              - "<strong>Transgender persons:</strong> 1% of posts in every category, with a District Magistrate certificate."
              - "<strong>Project-displaced families:</strong> certificate from the Tahsildar."
            source: vao-rpc
      - id: documents
        nav: "Documents"
        eyebrow: "Document checklist"
        heading: "What to keep ready"
        parts:
          - list:
              - "Aadhaar card."
              - "Marks cards of the qualifying exam (all subjects / semesters) and the provisional degree or diploma certificate."
              - "Proof of date of birth: SSLC marks card, school transfer certificate or birth certificate."
              - "Caste and income certificate in the prescribed form, rural Form-1 / Form-2, Kannada-medium certificate, ex-servicemen, transgender or disability papers, if claimed."
              - "No-objection certificate from the employer, for candidates already in service."
              - "Photo (JPEG, 50–200 KB) and signature (JPEG, 50–70 KB)."
            source: vao-rpc
      - id: pay
        nav: "Pay &amp; Salary"
        eyebrow: "Salary"
        heading: "Pay scale"
        parts:
          - p: "<strong>Pay scale:</strong> ₹34,100 – 800 – 35,700 – 900 – 39,300 – 1,000 – 43,300 – 1,125 – 47,800 – 1,250 – 52,800 – 1,375 – 58,300 – 1,500 – 64,300 – 1,650 – 67,600. Probation is two years, and the post is covered by the National Pension System."
            source: vao-rpc
          - note: "The first figure is the starting basic pay. In-hand salary adds dearness allowance, HRA and other allowances and subtracts deductions; the notification gives only the pay scale, so no in-hand figure is shown here."
      - id: posting
        nav: "Job &amp; Posting"
        eyebrow: "Job profile &amp; posting"
        heading: "A district-level post"
        parts:
          - p: "The Village Administrative Officer post has district-level seniority. KEA sends the district-wise merit lists to the government, which passes them to each Deputy Commissioner; the Deputy Commissioner completes verification and appointment."
            source: vao-rpc
    sources:
      - { id: vao-rpc, name: "KEA — Detailed notification, Village Administrative Officer recruitment (RPC), No. ED/KEA/26/Ne.V./2026 (10 Jul 2026, Kannada)", url: "https://cetonline.karnataka.gov.in/keawebentry456/vaorpc2026/vao_rpc_notification_10072026kannada.pdf", covers: "district posts, qualification, age and relaxations, fee, pay scale, exam scheme, negative marking, compulsory Kannada test, reservation certificates, documents", checked: 2026-10-14 }
      - { id: vao-kk, name: "KEA — Detailed notification, Village Administrative Officer recruitment (KK), No. ED/KEA/27/Ne.V./2026 (10 Jul 2026, Kannada)", url: "https://cetonline.karnataka.gov.in/keawebentry456/vaokk2026/vao_kk_notification_10072026kannada.pdf", covers: "67 Kalyana-Karnataka posts by district", checked: 2026-10-14 }
      - { id: vao-ext, name: "KEA — Notices extending the VAO (RPC) application and fee dates (6 Aug 2026 and 25 Aug 2026)", url: "https://cetonline.karnataka.gov.in/keawebentry456/vaorpc2026/vaorpc_06082026kannada.pdf", covers: "application until 20 Aug 2026; fee until 26 Aug 2026", checked: 2026-10-14 }
      - { id: vao-key, name: "KEA — Notice on provisional keys of the VAO (RPC) competitive exam (6 Oct 2026)", url: "https://cetonline.karnataka.gov.in/keawebentry456/vaorpc2026/VAO_KEY_WITH_NOTE_06102026kannada.pdf", covers: "exam held 4 Oct 2026; objections till 8 Oct 2026, ₹25 each", checked: 2026-10-14 }
      - { id: vao-kan, name: "KEA — Compulsory Kannada language test 2026: date and bell timings (8 Oct 2026)", url: "https://cetonline.karnataka.gov.in/keawebentry456/vaorpc2026/08_10_2026_KANNADA_EXAM_2026kannada.pdf", covers: "Kannada test on 8 Oct 2026, 100 questions, 150 marks", checked: 2026-10-14 }

  # ------------------------------------------------------------------ KARNATAKA STATE POLICE
  - slug: police
    group: civil
    short: "Karnataka Police Constable (Civil) &amp; PSI"
    body: "Karnataka State Police (written test by KEA)"
    card: "Police Constable (Civil) posts across Karnataka's districts and commissionerates: 3,395 in the residual cadre and 596 in Kalyana-Karnataka for 2026-27, through a KEA written test, physical standard and endurance tests, and a medical."
    card_facts: ["2026-27: 3,395 + 596 posts", "PUC · age 18–33 (35 reserved)", "Height 168 cm men · 157 cm women"]
    eyebrow: "Karnataka State Police · Constable recruitment"
    title: "Karnataka Police Constable (Civil) Recruitment 2026-27 — 3,395 + 596 Posts"
    lede: "The Karnataka State Police recruits Civil Police Constables through notification No. 02/Recruitment-4/2026-27 of 5 June 2026 (3,395 posts in the residual cadre) and a parallel Kalyana-Karnataka notification (596 posts). The Karnataka Examinations Authority runs the application and the written test."
    facts:
      - { label: "Posts", value: "3,395 (residual) + 596 (Kalyana-Karnataka)", source: pc-pet }
      - { label: "Qualification", value: "PUC (Class 12) or equivalent", source: pc-26 }
      - { label: "Age", value: "18 to 33 (SC/ST/Cat-1/2A–3B: 35)", source: pc-26 }
      - { label: "Pay scale", value: "₹37,500 – ₹76,100", source: pc-26 }
    official:
      - { label: "KSP recruitment page", url: "https://ksp.karnataka.gov.in/info-3/Recruitment/kn" }
      - { label: "Constable 3,395 notification (PDF)", url: "https://ksp.karnataka.gov.in/storage/pdf-files/Police%20Constable%20(Civil)%20Recruitment%202026%E2%80%9327-3395%20Posts.pdf" }
      - { label: "KEA constable (RPC) page", url: "https://cetonline.karnataka.gov.in/kea/cpcrpc2026" }
    sections:
      - id: overview
        nav: "Overview"
        eyebrow: "Overview &amp; official source"
        heading: "The 2026-27 constable drive"
        parts:
          - table:
              caption: "Police Constable (Civil), residual cadre — notification of 5 Jun 2026"
              head: ["Direct men", "Direct women", "In-service men", "In-service women", "Transgender", "Total"]
              rows:
                - ["2,266", "755", "257", "82", "35", "3,395"]
            source: pc-26
          - p: "Applications ran from 8 June to 3 July 2026 (fee by 4 July 2026) on the KEA website, and the written test was held on 2 August 2026, 10.30 am to 12 noon."
            source: pc-26
          - p: "On 15 September 2026 the Director General's office asked KEA to issue call letters for the physical standard and endurance tests for both the 596 Kalyana-Karnataka (Article 371(J)) posts and the 3,395 residual-cadre posts, and to publish the test schedule."
            source: pc-pet
          - p: "The Karnataka State Police recruitment page also lists armed police constable (CAR / DAR) drives — 1,421 vacancies in the non-Kalyana-Karnataka region and 179 in Kalyana-Karnataka."
            source: ksp-rec
          - warn: "Police Sub-Inspector (PSI): no PSI (Civil) recruitment was open when we checked. The KSP 2021 recruitment portal shows final select lists for the last PSI (Civil) drives of 545 and 402 posts; a new PSI notification will appear on ksp.karnataka.gov.in and ksp-recruitment.in."
            source: psi-21
      - id: eligibility
        nav: "Eligibility &amp; Age"
        eyebrow: "Eligibility &amp; age limits"
        heading: "PUC, age and the Kannada test"
        parts:
          - list:
              - "<strong>Qualification:</strong> PUC (Class 12) or equivalent held on the last date — CBSE / ICSE or another state board's Class 12, NIOS senior secondary, the specified ITI + language combination, JOC, or a 3-year diploma of the Technical Education Department."
              - "<strong>Kannada:</strong> candidates who have not passed Kannada as a first or second language in SSLC or higher (or an earlier compulsory Kannada test) must score at least 50 of 150 in KEA's compulsory Kannada test."
              - "<strong>Age:</strong> at least 18 on the last date."
            source: pc-26
          - table:
              caption: "Maximum age (includes the one-time 5-year relaxation of Government Order 29-01-2026)"
              head: ["Candidate", "Maximum age"]
              rows:
                - ["Direct men, women, transgender — general merit", "33"]
                - ["Direct — SC, ST, Category 1, 2A, 2B, 3A, 3B", "35"]
                - ["Tribal candidates living in Karnataka's forest areas", "38"]
                - ["In-service (CAR / DAR / KSRP / IRB / KSISF with 5 years' service) — general merit", "38"]
                - ["In-service — SC, ST, Category 1, 2A, 2B, 3A, 3B", "40"]
            source: pc-26
          - note: "Ex-servicemen get military service + 3 years. The 'forest tribal' relaxation covers named communities such as Siddi, Jenu Kuruba, Kadu Kuruba, Yerava, Soliga, Gowdalu, Hasalaru, Malekudiya and the Kodagu tribal communities living in the forest areas of listed districts."
            source: pc-26
      - id: scheme
        nav: "Exam Scheme"
        eyebrow: "Exam scheme &amp; physical standards"
        heading: "Written test, then PST and endurance test"
        parts:
          - table:
              caption: "Written test (offline OMR)"
              head: ["Paper", "Subjects", "Questions / Marks", "Time"]
              rows:
                - ["Written", "General knowledge: science, geography, history, Indian Constitution, freedom movement, mental ability and ethics", "100 / 100", "1½ hours"]
            source: pc-26
          - list:
              - "At least 30% in the written test is required."
              - "Negative marking: 0.25 mark for each wrong answer, and 0.25 for leaving the 5th 'not attempted' circle unshaded."
              - "Candidates are called for the physical tests in a 1:5 ratio; after PST and ET, a 1:2 shortlist goes to the medical."
            source: pc-26
          - table:
              caption: "Physical standard test (PST)"
              head: ["Candidate", "Standard"]
              rows:
                - ["Men, in-service men, ex-servicemen", "Height 168 cm; chest 86 cm with 5 cm expansion"]
                - ["Women and transgender", "Height 157 cm; weight 45 kg"]
                - ["Forest-tribal men", "Height 155 cm; chest expansion 5 cm (75 cm unexpanded)"]
                - ["Forest-tribal women", "Height 150 cm"]
            source: pc-26
          - table:
              caption: "Endurance test (qualifying only; every event must be passed)"
              head: ["Event", "Men", "Women and transgender"]
              rows:
                - ["Run", "1,600 m in 6 min 30 s", "400 m in 2 min"]
                - ["High jump or long jump", "1.20 m or 3.80 m (3 chances)", "0.90 m or 2.50 m (3 chances)"]
                - ["Shot put", "7.26 kg, 5.60 m (3 chances)", "4 kg, 3.75 m (3 chances)"]
            source: pc-26
          - note: "The medical checks eyesight (distant vision 6/9 in both eyes, or 6/9 and 6/12; colour blindness disqualifies), hearing, varicose veins, speech, chest X-ray and limb deformities such as knock knees and flat feet."
            source: pc-26
      - id: fees
        nav: "Fees"
        eyebrow: "Fee structure"
        heading: "Application fee"
        parts:
          - table:
              head: ["Candidate", "Fee"]
              rows:
                - ["General merit and Category 2A, 2B, 3A, 3B", "₹750"]
                - ["SC, ST, Category-1, ex-servicemen, transgender", "₹500"]
            source: pc-26
          - note: "Paid online only and never refunded."
            source: pc-26
      - id: reservation
        nav: "Reservation &amp; Certificates"
        eyebrow: "Reservation &amp; certificates"
        heading: "Caste forms, rural, Kannada medium and transgender posts"
        parts:
          - list:
              - "<strong>Caste certificates:</strong> Form D (SC, ST), Form E (Category-1), Form F (2A, 2B, 3A, 3B), valid on the last date; only certificates issued for employment are accepted."
              - "<strong>Rural reservation:</strong> study from Class 1 to 10 in a rural area, proved by Form-2 (and Form-1 for general merit)."
              - "<strong>Kannada medium:</strong> Class 1 to 10 in Kannada medium, certified by the head teacher."
              - "<strong>Ex-servicemen:</strong> 10% of direct-recruitment posts."
              - "<strong>Transgender candidates:</strong> 1% of posts; under the government letter of 12 November 2025, transgender-quota posts left unfilled go 25% to women and then 75% to men of the same category."
              - "<strong>Project-displaced families:</strong> Tahsildar's certificate in the prescribed form."
            source: pc-26
      - id: documents
        nav: "Documents"
        eyebrow: "Document checklist"
        heading: "What to keep ready"
        parts:
          - list:
              - "Aadhaar card; SSLC marks card as proof of date of birth; PUC / equivalent marks cards."
              - "Caste and income certificate, rural Form-1 / Form-2, Kannada-medium certificate, ex-servicemen or transgender certificate, if claimed."
              - "Photo (JPEG, 50–200 KB) and signature (JPEG, 50–70 KB)."
              - "For the PST and ET: the call letter, a printout of the online application, and one original photo ID (passport, driving licence, PAN, service ID, bank passbook with photo, voter ID or Aadhaar)."
            source: pc-26
      - id: pay
        nav: "Pay &amp; Salary"
        eyebrow: "Salary"
        heading: "Pay scale and training"
        parts:
          - p: "<strong>Pay scale:</strong> ₹37,500 – 900 – 39,300 – 1,000 – 43,300 – 1,125 – 47,800 – 1,250 – 52,800 – 1,375 – 58,300 – 1,500 – 64,300 – 1,650 – 74,200 – 1,900 – 76,100. Selected candidates do nine months of basic training at police training schools and a probation of two years and six months, and are covered by the National Pension System."
            source: pc-26
          - note: "The first figure is the starting basic pay. In-hand salary adds dearness allowance, HRA and other allowances and subtracts deductions; the notification gives only the pay scale."
      - id: posting
        nav: "Job &amp; Posting"
        eyebrow: "Job profile &amp; posting"
        heading: "Districts and commissionerates"
        parts:
          - p: "Constable (Civil) vacancies are spread over district police units, city commissionerates such as Bengaluru, Mysuru, Mangaluru, Hubballi-Dharwad and Kalaburagi, and the Railways unit in Bengaluru; the KSP recruitment portal publishes candidate lists unit by unit for the physical tests."
            source: ksp-portal
    sources:
      - { id: pc-26, name: "Karnataka State Police — Notification No. 02/Recruitment-4/2026-27, Police Constable (Civil) 3,395 posts (5 Jun 2026, Kannada)", url: "https://ksp.karnataka.gov.in/storage/pdf-files/Police%20Constable%20(Civil)%20Recruitment%202026%E2%80%9327-3395%20Posts.pdf", covers: "posts, dates, qualification, Kannada test, age, fee, pay, written test, PST, ET, medical, reservation, documents", checked: 2026-10-14 }
      - { id: pc-pet, name: "Karnataka State Police — Letter to KEA on PST &amp; ET call letters, Police Constable (Civil) 2026-27 (15 Sep 2026)", url: "https://cetonline.karnataka.gov.in/keawebentry456/cpcrpc2026/20260916181455kannada.pdf", covers: "596 Kalyana-Karnataka and 3,395 residual-cadre posts; PST / ET call letters", checked: 2026-10-14 }
