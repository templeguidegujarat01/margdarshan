  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What does a Machine Learning Engineer actually do?"
    parts:
      - overview:
          points:
            - "A Machine Learning Engineer sits at the intersection of software engineering, data science and statistics."
            - "Unlike a Data Scientist, who focuses mainly on analysis and generating insight, a Machine Learning (ML) Engineer builds and deploys systems that learn from data and make decisions at scale — model training, optimisation, deployment and reliability in production are the core of the job."
            - "What most guides don't explain clearly: the title covers genuinely different work depending on the company."
          more:
            - "A Research ML Engineer at a deeptech startup, a Production ML Engineer keeping a recommendation system running at scale, a Data Platform ML Engineer building the pipelines everything else depends on, and an Application ML Engineer wiring ML into a product feature are all called \"ML Engineer\" — but they do meaningfully different jobs and need different strengths."
  - id: "who"
    hid: "who-heading"
    alt: true
    eyebrow: "Fit check"
    heading: "Who should aim for a Machine Learning Engineer career"
    parts:
      - fit:
          match:
            - "Enjoy rigorous statistical and mathematical thinking combined with real engineering discipline."
            - "Want deployment and production-focused work, not just the headline idea of \"building Artificial Intelligence (AI).\""
            - "Are willing to research a specific job posting carefully, since the role varies so much by company and sub-type."
          mismatch:
            - "Specifically want GenAI/LLM application-building work — the <a href=\"ai-engineer.html\">AI Engineer</a> path is the closer match."
            - "Assume every \"ML Engineer\" job means cutting-edge research — most roles in the market are production or application-focused, not research-focused."
            - "Dislike statistics — it's a genuine foundation here, not an optional extra."
