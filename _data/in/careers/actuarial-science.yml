  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Do I need to be a Maths topper in Class 12 to become an actuary?"
            a: "You need to be genuinely strong at mathematics and statistics, since the ACET entrance test and every Core Principles subject are heavily quantitative. You don't need to be the class topper, but comfort with advanced maths and probability is essential, not optional."
          - q: "How long does it actually take to become a Fellow Actuary in India?"
            a: "IAI sets no fixed deadline — you can attempt exams at your own pace. In practice, most candidates take roughly 5-8 years from starting ACET preparation to completing all 13 subjects and the Fellowship's work-experience and professionalism requirements, often while working as an actuarial trainee."
          - q: "Is actuarial science the same as data science?"
            a: "No, though they overlap. Actuarial science is a regulated, exam-based profession focused specifically on pricing financial risk in insurance, pensions and related fields, governed by IAI. Data science is a broader, less formally regulated discipline focused on extracting insights from data across any industry, without a fixed licensing body or exam pathway."
          - q: "Can I switch into actuarial science from an engineering or B.Sc background?"
            a: "Yes. ACET is open to any stream after Class 12, and strong quantitative graduates from engineering, statistics, mathematics or economics backgrounds are common in the profession. What matters is your comfort with mathematics and statistics, not your specific degree title."
          - q: "Why is actuarial science considered such a well-paying career?"
            a: "Because very few candidates complete the full 13-subject pathway to Fellowship, and IRDAI legally requires every registered Indian insurer to employ a Fellow Actuary (FIAI) for the Appointed Actuary role, qualified actuaries remain in persistent short supply relative to demand, which keeps salaries high even at the trainee stage."
      - note: "Figures are indicative (2026) — confirm on the official college or authority website."
        class: "table-note mt-lg"
