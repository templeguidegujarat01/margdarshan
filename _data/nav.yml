# ---------------------------------------------------------------------------
# India edition top menu (_includes/in-header-hubs.html), drawn on EVERY India
# edition page (region "in", not region-neutral) — those pages have no sidebar.
# Left to right in the order below; the items sit tight together (no end push).
#   type home  = icon-only link
#   type menu  = <details> dropdown of children (label, href, desc)
#   type tile  = solid gold action link
#   sub        = optional flyout at the base of a menu panel: { label, href, children }.
#                Desktop with a mouse: opens to the RIGHT of the panel on hover/focus
#                (flips left when there is no room). Touch / below 1024px: listed inline.
# icon (home and tile only) is the inner SVG markup for a 24x24, stroke-based icon.
# ---------------------------------------------------------------------------
topnav:
  - type: home
    label: India Home
