  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What is FRM?"
    parts:
      - overview:
          points:
            - "FRM is a certification issued by the <strong>GARP</strong>, focused entirely on the tools, models and frameworks used to measure and manage financial risk — market risk, credit risk, operational risk, and liquidity risk."
            - "Where CFA covers the broad craft of investing, FRM goes deep on one specific function: understanding exactly how much risk an institution is carrying, and what to do about it."
            - "Independent benchmarking by UK ENIC has assessed the FRM's difficulty as comparable to a Master's degree."
          more:
            - "It's the credential banks, asset managers, regulators and consulting firms look for when hiring into VaR modelling, stress testing, Basel-compliance and model validation roles — work that has only grown more central as regulators like the Reserve Bank of India (RBI) have tightened requirements on Indian financial institutions."
  - id: "who"
    hid: "who-heading"
    alt: true
    eyebrow: "Fit check"
    heading: "Who should choose FRM — and who should think twice"
    parts:
      - fit:
          match:
            - "Are comfortable with statistics, probability and quantitative reasoning, and want a narrowly-specialised finance credential."
            - "Want the lowest-barrier entry point among major global finance credentials — no degree needed to start."
            - "Are specifically drawn to risk analytics, model validation, or regulatory capital work rather than general investing."
          mismatch:
            - "Dislike heavily quantitative material — FRM leans more mathematical than Chartered Accountant (CA), CS or Association of Chartered Certified Accountants (ACCA)."
            - "Want a broad investment-management career — CFA covers more ground for portfolio and equity-research roles."
            - "Already hold CA, CFA or CPA and expect exemptions — GARP grants none, regardless of prior qualification."
  - id: "eligibility"
    hid: "elig-heading"
    eyebrow: "The most open eligibility of any course on this site"
    heading: "Who can register"
    parts:
      - prose:
          - "GARP imposes <strong>no formal educational prerequisites</strong> to register for FRM Part I — no minimum degree, no age requirement, no prior work experience. You can technically begin during your undergraduate years, or even earlier. In practice, most candidates do hold at least a bachelor's degree by the time they attempt the exam, simply because the material assumes comfort with probability, statistics, calculus and financial concepts — but this is a matter of practical preparation, not a GARP rule."
      - note_box: "Important distinction: the exam has no prerequisites, but the full FRM <em>certification</em> (using the \"FRM\" designation after your name) requires 2 years of relevant work experience, covered in detail further down this page."
