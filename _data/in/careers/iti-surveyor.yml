            - "ITI Surveyor is a shorter, NCVT/DGT-affiliated trade — typically around <strong>1 year</strong> — under the Craftsman Training Scheme, training students in land measurement, mapping and levelling using survey instruments including chains, compasses, dumpy levels, theodolites, and increasingly, <strong>total stations</strong> and basic GPS-based tools."
            - "Where <a href=\"iti-draughtsman-civil.html\">Draughtsman Civil</a> works mostly at a desk preparing drawings, Surveyors work primarily in the field, taking measurements on construction sites, land parcels and infrastructure projects that feed into planning, construction and legal land records."
