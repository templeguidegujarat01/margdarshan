    heading: "Higher studies"
    parts:
      - prose:
          - "An MA in History — at institutions like <strong>Jawaharlal Nehru University, Delhi University or Jadavpur University</strong> — is the natural next step for students aiming at research, teaching (via UGC-NET) or a career in archives and museums. Others pursue a Master's in Archaeology, Museology or Archival Studies for specialised heritage roles, or move into law, journalism or civil services preparation, all of which value the reading, writing and analytical skills the degree builds."
