# USA Edition — curated comparison pages /us/compare/<id>/ (global-platform Phase 14).
# IA rule R9: only pairs students really decide between, both sides live, and at least 5 rows that
# differ (check-us-data.mjs counts them from the same data the page uses). Every row on the page is built
# from pathways.yml, pathway_pages.yml, occupations.yml, licenses.yml, accreditors.yml and
# colleges_summary.json; this file only holds the pair, the question and a one-paragraph takeaway that
# restates what those rows show (no new facts or numbers).
#
#   a, b       pathway slugs (a is shown on the left)
#   question   page H1
#   takeaway   short summary of the differences in the table
#   last_reviewed

computer-science-vs-software-engineering:
  a: computer-science
  b: software-engineering
  question: "Computer Science or Software Engineering?"
  takeaway: "Both lead to the same BLS occupation, software developer, so pay and job numbers are the same. Computer science is broader and more theoretical (algorithms, systems, math) and is offered by far more colleges; software engineering puts design, testing and team projects first."
  last_reviewed: 2026-10-08

mechanical-vs-electrical-engineering:
  a: mechanical-engineering
  b: electrical-engineering
  question: "Mechanical or Electrical Engineering?"
  takeaway: "Both start with a bachelor's degree in engineering, look for ABET accreditation and share the same optional PE license. Mechanical engineering works with motion, energy and machines; electrical engineering with power, circuits and signals. BLS pay, jobs and growth for each are in the table."
  last_reviewed: 2026-10-08

accounting-vs-finance:
  a: accounting
  b: finance
  question: "Accounting or Finance?"
  takeaway: "Accounting records, checks and explains the numbers and has a state license path (CPA). Finance uses those numbers to value, invest and plan; it has no state license, though some jobs need FINRA licenses that employers usually sponsor."
  last_reviewed: 2026-10-08

data-science-vs-computer-science:
  a: data-science
  b: computer-science
  question: "Data Science or Computer Science?"
  takeaway: "Data science centers on statistics and machine learning to answer questions with data; computer science on building software and computing systems. Data scientists are a much smaller occupation than software developers, but BLS projects it to grow far faster."
  last_reviewed: 2026-10-08
