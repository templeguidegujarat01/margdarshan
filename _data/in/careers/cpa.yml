            text: "NIES/WES converts your Indian degree to US credits."
          - title: "Choose a state board"
            text: "Apply where your credits and background fit best."
          - title: "3 Core sections"
            text: "AUD, FAR, REG — continuous testing year-round."
          - title: "1 Discipline section"
            text: "Choose BAR, ISC or TCP; quarterly windows only."
          - title: "Ethics exam"
            text: "Open-book, required by most state boards."
          - title: "Experience + License"
            text: "~2,000 hours verified by a licensed CPA."
      - roadmap_card: "US CPA"
  - id: "syllabus"
    hid: "syllabus-heading"
    eyebrow: "CPA Evolution model (since January 2024)"
    heading: "3 Core + 1 Discipline — every section explained"
    parts:
      - subhead: "3 Core + 1 Discipline — every section explained"
      - table:
          head:
            - "Section"
            - "Full name"
            - "Covers"
          rows:
            -
              - "AUD (Core)"
              - "Auditing and Attestation"
              - "Audit procedures, professional judgment, ethics, internal controls"
            -
              - "FAR (Core)"
              - "Financial Accounting and Reporting"
              - "US GAAP financial statements — traditionally the most content-heavy section"
            -
              - "REG (Core)"
              - "Regulation"
              - "US federal taxation, business law, ethics and professional responsibilities"
            -
              - "BAR (Discipline)"
              - "Business Analysis and Reporting"
              - "Advanced financial reporting, business performance analysis — best paired with FAR strength"
            -
              - "ISC (Discipline)"
              - "Information Systems and Controls"
              - "Information Technology (IT) governance, data/systems controls, SOC engagements — best paired with AUD strength"
            -
              - "TCP (Discipline)"
              - "Tax Compliance and Planning"
              - "Advanced individual & entity tax planning — best paired with REG strength"
      - note: "Every candidate takes all 3 Core sections; you choose exactly 1 of the 3 Discipline sections based on your career direction. This replaced the old fixed 4-section exam (which included a general \"BEC\" section) starting January 2024."
  - id: "pattern"
    hid: "pattern-heading"
    alt: true
    eyebrow: "Format"
    heading: "Exam pattern & testing windows"
    parts:
      - chips:
          - label: "Duration"
            text: "4 hours per section, all sections equally weighted at 4 hours"
          - label: "Question format"
            text: "Multiple-choice questions (MCQs) and Task-Based Simulations (TBS), each roughly 50% of the score (ISC is closer to 60% MCQ)"
          - label: "Core sections"
            text: "AUD, FAR, REG — available for continuous testing nearly year-round at Prometric"
          - label: "Discipline sections"
            text: "BAR, ISC, TCP — only offered in specific one-month quarterly windows (Jan, Apr, Jul, Oct); all 3 Core sections must be passed first"
          - label: "Test centres in India"
            text: "Mumbai, Delhi, Bangalore, Chennai, Hyderabad, Kolkata, Ahmedabad, Thiruvananthapuram"
          - label: "Negative marking"
            text: "None"
  - id: "passing"
    hid: "passing-heading"
    eyebrow: "A single scaled score per section"
    heading: "Passing criteria"
    parts:
      - prose:
          - "Each section is scored on a scale of 0-99, and you need a minimum scaled score of <strong>75</strong> to pass — there's no separate \"group\" or aggregate concept like ICAI/ICSI/ICMAI use. Once you pass your first section, you generally have an <strong>18-month rolling window</strong> to pass the remaining three (this window has been extended and standardised across jurisdictions in recent years) — plan your section order and timing around it."
      - warn_box: "<strong>Common mistake:</strong> saving the Discipline section for last without checking the quarterly window dates. Since Discipline sections only run in specific one-month windows, poor timing here can add months to your overall timeline even if you're otherwise ready."
  - id: "experience"
    hid: "exp-heading"
    alt: true
    eyebrow: "Beyond the exams"
    heading: "Ethics exam & work experience"
    parts:
      - prose:
          - "Passing all 4 sections doesn't complete your licence on its own. Most state boards additionally require:"
          - list:
              - "An <strong>open-book Ethics exam</strong>, separate from the main CPA exam."
              - "<strong>1-2 years of relevant accounting experience</strong> (commonly cited as roughly 2,000 hours), verified and signed off by a licensed CPA supervisor."
            ticks: true
          - "Requirements vary meaningfully by state board — some are more accommodating for international candidates than others, which is why choosing the right state board early is a genuine strategic decision, not a formality."
  - id: "fees"
