# Journey Blueprint — Homoeopathic Physician (NEET (UG) → BHMS → registration → AIAPGET for MD (Hom.)). Printed on journey-homoeopathy-doctor.html (_includes/journey-doubts.html).
# Rules, classes and the money items / sources several careers share: _data/in/journey_common.yml.
# `money_defs` / `sources` below are used only by this career. Check: node scripts/check-journey-matrix.mjs
id: homoeopathy-doctor
v: 2
name: "Homoeopathic Physician (NEET → BHMS)"
search: ["homoeopathic physician", "homeopathic doctor", "homoeopathy", "homeopathy", "bhms", "homoeopathic doctor"]
page: "bhms.html"
roadmap: "roadmaps/bhms.html"
doubts_page: "journey-homoeopathy-doctor.html"
gate: "Class 12 with Physics, Chemistry and Biology / Biotechnology → NEET (UG) → counselling (AACCC for All India seats, the state for state seats) → BHMS: 5½ years including a 12-month internship → registration with your State Board → practice, government posts, or AIAPGET for MD (Hom.)."
gate_source: [neet-ib, bhms22, aiap26]
core:
  what:
    text: "A homoeopathic physician holds the BHMS degree and treats patients with homoeopathy. The course is regulated by the National Commission for Homoeopathy (NCH) under the NCH Act 2020, and every BHMS seat in India is filled through NEET (UG)."
    source: [neet-ib, bhms22]
  day:
    - "Take detailed case histories and examine patients."
    - "Prescribe and follow up homoeopathic treatment."
    - "Work in clinics, government dispensaries and National Health Programmes."
  pay_note: "We did not find a 2026 central notice printing pay for a homoeopathy medical officer, so no pay is printed. Interns get a stipend at par with other medical systems in government colleges."
  routes:
    - { title: "NEET (UG) → BHMS", text: "Admission to every BHMS seat is through NEET (UG). The course lasts 5 years 6 months, including a 12-month compulsory rotatory internship.", source: [neet-ib, bhms22] }
    - { title: "MD (Hom.) through AIAPGET", text: "NTA's AIAPGET is the entrance for MD / MS seats in Ayurveda, Siddha, Unani and Homoeopathy. You need a BHMS, registration and the internship done by the cut-off date.", source: aiap26 }
    - { title: "Government and health programmes", text: "NCH's Professional Conduct rules allow a homoeopathic practitioner to work under National Health Programmes and other Central or State programmes after the training the competent authority recognises.", source: nch-cross26 }
  cost_time:
    - { label: "BHMS", value: "5 years 6 months: 18 + 12 + 12 + 12 months of study + 12-month internship", source: bhms22 }
    - { label: "NEET (UG) fee 2026", value: "₹1,700 General · ₹1,600 EWS / OBC-NCL · ₹1,000 SC / ST / PwBD / third gender", source: neet-ib }
    - { label: "AIAPGET fee 2026", value: "₹2,700 General · ₹2,450 EWS / OBC-NCL · ₹1,800 SC / ST / PwBD / third gender", source: aiap26 }
  cost_note: "BHMS college fees differ by state and college, so they are not printed here."
  challenges:
    - text: "NCH warned in October 2026 that some colleges admitted students without NEET, without counselling, or in years when the college had no permission — such students risk not getting their degree recognised."
      source: nch-adv26
    - text: "The whole course, including internship, must be completed within 10 years."
      source: bhms22
    - text: "Practising another system of medicine is professional misconduct under NCH's rules, except under government health programmes after recognised training."
      source: nch-cross26
  not_for:
    - "You want to prescribe allopathic medicines in private practice."
    - "You dislike long patient interviews — homoeopathic case-taking is detailed."
    - "You want to skip NEET — every BHMS seat needs it."
journey:
  - stages: [c8, c9]
    title: "Biology and Chemistry first"
    do:
      - text: "BHMS admission needs Class 12 with Physics, Chemistry and Biology or Biotechnology, and a NEET (UG) rank."
        source: [neet-ib, bhms25]
    doubts:
      - q: "What does a homoeopathic physician do?"
        a: "A BHMS graduate treats patients with homoeopathy in clinics, government dispensaries and National Health Programmes. The course is regulated by the National Commission for Homoeopathy."
        next: "Read the Routes list above."
        source: [bhms22, nch-cross26]
      - q: "Is NEET compulsory for BHMS?"
        a: "Yes. Admission to all BHMS seats is done through NEET (UG), under NCH's BHMS Regulations 2022."
        next: "Prepare for NEET (UG) like an MBBS aspirant."
        source: neet-ib
  - stages: [c10]
    title: "Choose PCB"
    do:
      - text: "Take Physics, Chemistry and Biology (or Biotechnology) in Class 11–12."
        source: bhms25
    stream: "Science with Biology (PCB)."
    doubts:
      - q: "Which stream do I need for BHMS?"
        a: "Science with Physics, Chemistry and Biology or Biotechnology in Class 12."
        next: "Take PCB in Class 11."
        source: [neet-ib, bhms25]
      - q: "Do I need 50% in PCB for BHMS?"
        a: "Two NCH documents differ. The BHMS Regulations 2022 asked for 50% in PCB (40% for SC, ST and OBC; 45% / 40% for PwD); NCH's January 2025 amendment replaced that clause with only 'passed 10+2 with Physics, Chemistry, Biology or Biotechnology'. But NCH's advisory of 19 October 2026 still names admissions below 50% in PCB as a problem."
        next: "Keep 50% or more in PCB to be safe, and confirm with your counselling authority."
        source: [bhms22, bhms25, nch-adv26]
  - stages: [c11, c12]
    title: "NEET (UG) and counselling"
    do:
      - text: "Minimum age: 17 on or before 31 December of the year of admission."
        source: neet-ib
      - text: "Qualifying percentile: 50th (General), 40th (SC, ST, OBC), 45th (PwBD General) / 40th (PwBD SC, ST, OBC)."
        source: neet-ib
    exams:
      - { name: "NEET (UG) 2026", when: "3 May 2026 (re-exam 21 June 2026)", source: [neet-ib, neet-re] }
    money: [neet-fee]
    doubts:
      - q: "Who runs counselling for BHMS seats?"
        a: "AACCC (Ayush Admissions Central Counselling Committee) runs All India Quota counselling for government, government-aided, central university, national institute and deemed university seats. A central authority handles private All India seats, and each state runs its state-quota counselling."
        next: "Register on aaccc.gov.in and on your state's Ayush counselling site."
        source: neet-ib
      - q: "Is there reservation in All India Quota BHMS seats?"
        a: "Yes: SC 15%, ST 7.5% and PwBD 5% (horizontal). OBC-NCL 27% and EWS 10% apply only in national institutes and central universities. State-quota seats follow the state's own policy."
        next: "Keep your category certificate ready."
        source: neet-ib
      - q: "How do I know a BHMS college is genuine?"
        a: "NCH publishes the list of colleges granted or denied permission for each academic year on nch.org.in — for 2026-27, the status as on 16 October 2026. NCH advises students not to take admission without checking it."
        next: "Check the permission list before paying any fee."
        source: nch-adv26
      - q: "What is the minimum age for BHMS?"
        a: "You must be 17 on or before 31 December of the year you join the first year of BHMS."
        next: "Check your date of birth against the admission year."
        source: [bhms22, neet-ib]
  - stages: [ug]
    title: "BHMS and internship"
    do:
      - text: "First Professional BHMS lasts 18 months; Second, Third and Fourth (Final) Professional 12 months each; then a 12-month compulsory rotatory internship."
        source: bhms22
      - text: "To join the internship you must pass all four professional exams and six electives, and hold a provisional degree and provisional registration from your State Board or Council."
        source: bhms22
    money: [bhms-intern]
    doubts:
      - q: "How long is the BHMS course?"
        a: "5 years 6 months: 18 months for the First Professional, 12 months each for the next three, and a 12-month internship."
        next: "Plan your finances for five and a half years."
        source: bhms22
      - q: "Do BHMS interns get a stipend?"
        a: "Yes. Interns in central, state and UT government institutions and in private homoeopathic colleges are eligible for a stipend at par with other medical systems under that government."
        next: "Ask your college what its government pays."
        source: bhms22
      - q: "What is the maximum time allowed to finish BHMS?"
        a: "The entire course, including the internship, must be completed within 10 years."
        next: "Clear each professional exam on time."
        source: bhms22
  - stages: [grad]
    title: "Registration and AIAPGET"
    do:
      - text: "AIAPGET: 120 questions, 480 marks, 2 hours, +4 / −1. You need a BHMS, permanent or provisional registration, and the internship done by the cut-off date."
        source: aiap26
    exams:
      - { name: "AIAPGET 2026", when: "Apply 10–30 Jul 2026 · exam 22 Aug 2026", source: aiap26 }
    doubts:
      - q: "How do I get an MD in Homoeopathy?"
        a: "Through AIAPGET, the national entrance for MD / MS in Ayurveda, Siddha, Unani and Homoeopathy. You need a recognised BHMS, registration with the CCH / NCH or a State Board, and the 12-month internship completed by the cut-off date."
        next: "Prepare for AIAPGET during your internship."
        source: aiap26
      - q: "Is there negative marking in AIAPGET?"
        a: "Yes. 120 questions for 480 marks in 2 hours: +4 for a correct answer and −1 for a wrong one."
        next: "Answer only when you are fairly sure."
        source: aiap26
  - stages: [work]
    title: "Practice and government programmes"
    do:
      - text: "NCH's Regulation 36(y) treats practising any other system of medicine as misconduct, but allows work under National Health Programmes and other government programmes after recognised training."
        source: nch-cross26
    doubts:
      - q: "Can a homoeopathic doctor prescribe allopathic medicine?"
        a: "Not in private practice: NCH's Professional Conduct Regulations 2022 list practising any other system of medicine as misconduct. The exception is work under a National Health Programme or other Central / State programme after training recognised by the competent authority."
        next: "Learn the programme rules before joining one."
        source: nch-cross26
      - q: "Can a BHMS graduate work in government health programmes?"
        a: "Yes. NCH's August 2026 notice confirms that homoeopathic practitioners can practise under National Health Programmes after the prescribed training, and the BHMS Regulations ask students to take part in programmes run by the State Government."
        next: "Watch your state health department's notices."
        source: nch-cross26
board_note: "Any board. Class 12 needs Physics, Chemistry and Biology or Biotechnology."
board_source: [neet-ib, bhms25]
