  - id: "exam"
    hid: "exam-heading"
    eyebrow: "Three-stage process"
    heading: "Exam pattern"
    parts:
      - chips:
          - label: "Prelims"
            text: "Two objective-type papers — General Studies Paper I (counts for merit) and Paper II, CSAT (qualifying only) — used to shortlist candidates for Mains."
          - label: "Mains"
            text: "Nine descriptive papers, including Essay, four General Studies papers, two Optional Subject papers, and two qualifying language papers, testing depth of knowledge and writing ability."
          - label: "Personality Test (Interview)"
            text: "A final interview assessing the candidate's suitability for a career in public service, covering general awareness, judgment and personality, for those who clear Mains."
          - label: "Final merit & service allocation"
            text: "Combined Mains and Interview marks determine the final rank, which decides which service (IAS, IPS, IFS, etc.) and cadre you're allocated."
  - id: "services"
    hid: "services-heading"
    alt: true
    eyebrow: "Where a top rank can lead"
    heading: "Key services & roles"
    parts:
      - chips:
          - label: "IAS (Indian Administrative Service)"
            text: "Manages district and state administration, policy implementation and government schemes — typically the most sought-after service."
          - label: "IPS (Indian Police Service)"
            text: "Leads police forces at the district, state and national level, overseeing law enforcement and internal security."
          - label: "IFS (Indian Foreign Service)"
            text: "Represents India diplomatically through embassies and consulates abroad, working on foreign policy and international relations."
          - label: "Other Group A/B services"
            text: "Indian Revenue Service, Indian Audit and Accounts Service, and dozens of other specialised central services, allocated based on rank and preference."
