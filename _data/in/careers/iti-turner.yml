  - id: "faq"
    hid: "faq-heading"
    alt: true
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "What is the difference between Turner and Machinist trades?"
            a: "Turner is a narrower, lathe-specific trade focused specifically on turning operations to produce cylindrical and shaped metal parts. Machinist is a broader trade covering multiple machine tools — lathes, milling machines, grinders and shapers. Turner offers deeper specialisation in one machine type; Machinist offers wider machine-shop versatility."
          - q: "How long is the ITI Turner course?"
            a: "Turner is typically a 2-year NCVT-affiliated trade, combining trade theory, engineering drawing, workshop calculation and substantial hands-on lathe operation practice."
          - q: "Is Turner a good trade if I want to specialise deeply in one skill?"
            a: "Yes. Turner is specifically designed for deep expertise in lathe/turning work, which is valuable in industries needing precise cylindrical parts — shafts, bushings, threaded components — rather than broad machine-shop generalism."
          - q: "What industries hire ITI Turners?"
            a: "Automobile component manufacturers, precision engineering firms, tool and die companies, and general machine shops across manufacturing hubs commonly hire trained turners, alongside government/PSU and defence technical recruitment routes."
          - q: "Can I move from Turner to CNC machine operation?"
            a: "Yes, this is a common and valuable progression. Manual lathe skills translate well into CNC turning centre operation, and many Turners pursue a dedicated CNC operator certification afterward to access higher-paying, more automated roles."
      - note: "*Fee and salary figures are indicative, based on publicly available information as of 2026, and vary significantly by state, institute and employer — always verify current figures directly with your target ITI."
