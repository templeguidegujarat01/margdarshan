      - overview:
          points:
            - "Travel & Tourism (typically a Bachelor of Arts (BA) or Bachelor of Business Administration (BBA) in Tourism/Travel Management) trains students in the business side of travel — planning itineraries and tour packages, managing tour operations, destination marketing, and understanding the broader travel and hospitality ecosystem, including airlines, transport and local tourism boards."
            - "It's distinct from Hotel Management, which focuses specifically on running a hotel property."
            - "It's offered at institutions like the <strong>Indian Institute of Tourism and Travel Management (IITTM)</strong>, several university tourism departments, and private colleges offering BBA in Tourism & Travel Management, often with a strong practical/internship component."
