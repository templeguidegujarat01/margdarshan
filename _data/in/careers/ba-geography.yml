  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Is BA Geography a science subject or an arts subject?"
            a: "Both, in a way. Geography is unusual because it bridges physical processes (climate, landforms, rivers) and human/social processes (population, urbanisation, economic activity). Most Indian universities offer it as a BA, though some also offer a B.Sc Geography route with a more physical-science emphasis."
          - q: "Is Geography a good optional subject for UPSC?"
            a: "Yes. Geography is consistently one of the most popular and reliably scoring optional subjects for the UPSC Mains exam, and its content overlaps significantly with the General Studies papers on Indian and world geography, environment and disaster management."
          - q: "What is GIS and why does it matter for Geography graduates?"
            a: "GIS is software used to map, analyse and visualise spatial data — used in urban planning, disaster management, agriculture, logistics and environmental monitoring. Geography graduates who add a GIS/remote sensing certification significantly widen their job options in both government and private-sector roles."
          - q: "Do I need CUET to get into a good BA Geography college?"
            a: "For Delhi University and most central universities, yes — CUET (UG) scores decide admission, submitted through the DU CSAS portal or the respective university's counselling system. Many state and private universities instead admit directly on Class 12 marks."
          - q: "What jobs can I get with a BA Geography degree?"
            a: "Graduates work in urban and town planning, environmental consultancy, disaster management authorities, meteorology-adjacent roles, cartography and GIS analysis, and civil services after clearing UPSC. Several of these roles benefit from an additional certification or master's degree in GIS, remote sensing or urban planning."
      - note: "*Fee and salary figures are indicative, based on publicly available information as of 2026, and vary significantly by institution and admission cycle — always verify current figures on the official college or university website."
        class: "table-note mt-lg"
