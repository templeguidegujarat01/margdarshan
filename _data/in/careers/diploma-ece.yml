  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Can I join B.Tech ECE after this diploma?"
            a: "Yes. Diploma holders can use lateral entry to join the second year of a B.Tech Electronics & Communication Engineering programme directly, through a state lateral entry exam or quota, skipping the first year entirely."
          - q: "What is the difference between Diploma in ECE and Diploma in Computer Engineering?"
            a: "Diploma in ECE focuses on circuits, signal processing, communication systems and embedded hardware. Diploma in Computer Engineering focuses more on computer hardware architecture, programming and software systems. There's overlap in embedded systems and hardware, but the core emphasis differs."
          - q: "Can I work in telecom companies with this diploma?"
            a: "Yes, telecom is one of the traditional core industries for ECE diploma holders — field technician and network maintenance roles at telecom companies and infrastructure providers are common, established career paths."
          - q: "Is embedded systems knowledge important for this diploma?"
            a: "Yes, increasingly so. As electronics devices become more connected (IoT), embedded systems programming — writing software that runs on hardware chips and microcontrollers — has become a valuable, growing skill area within ECE, often covered in the later semesters of the diploma."
          - q: "What jobs can I get with just this diploma, without a further degree?"
            a: "Common roles include electronics technician, field service engineer, telecom network technician, and quality control technician in electronics manufacturing, telecom and consumer electronics companies, alongside various government technical posts."
      - note: "*Fee and salary figures are indicative, based on publicly available information as of 2026, and vary significantly by state, institute and employer — always verify current figures on your state technical education board's official website."
        class: "table-note mt-lg"
