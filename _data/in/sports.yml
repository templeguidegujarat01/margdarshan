  # ------------------------------------------------------------------------------------------------ Carnatic music
  - slug: carnatic-music
    short: "Carnatic Music"
    domain: arts
    checked: 2026-10-16
    body_label: "Recognised by"
    body: "Sangeet Natak Akademi · Prasar Bharati (All India Radio)"
    rules_note: "Akademi, Ministry, Prasar Bharati &amp; ICCR files only"
    sources_note: "Every fact on this Education Margdarshan page is taken from an All India Radio, Sangeet Natak Akademi, Ministry of Culture or ICCR file below, or from an academy's own 2026-27 notice (used only for that academy). Fees, grades and scheme amounts change — open the current file before you apply or pay."
    card: "Vocal, veena, violin, flute and mridangam: AIR's raga groups and audition format, Kalakshetra's diploma and Pratama classes, SNA awards and scholarships."
    card_facts: ["AIR list: 15 items, 3 raga groups", "Kalakshetra: 3 hrs main class daily", "Pratama at 7–17"]
    eyebrow: "Performing Arts Cockpit · Classical Music · AIR guidelines &amp; Kalakshetra 2026-27"
    title: "Carnatic Music — AIR raga groups, Kalakshetra training, grades &amp; scholarships"
    lede: "The Carnatic path from official files: how All India Radio auditions a vocalist, instrumentalist or percussionist, the raga groups it tests, the B-to-Top grade ladder and its fees, Kalakshetra's four-year diploma and children's Pratama classes, Sangeet Natak Akademi honours, ICCR empanelment, scholarships, fellowships and what broadcasting actually pays."
    official:
      - { label: "AIR Music Audition guidelines (PDF)", url: "https://prasarbharati.gov.in/wp-content/uploads/2024/04/Guidelines_AIR_Music_Auditions.pdf" }
      - { label: "Kalakshetra Prospectus 2026-27 (PDF)", url: "https://kalakshetra.in/wp-content/uploads/2026/02/Prospectus-2026-2027-.pdf" }
    facts:
      - { label: "AIR audition list", value: "<strong>15 items</strong> — 5 each from raga Groups A, B and C", source: air-aud }
      - { label: "Kalakshetra Diploma in Carnatic Music", value: "<strong>4 years</strong> · 3 hours of main class daily · max age 25", source: kala-prosp }
      - { label: "Top grade", value: "Only after <strong>10 years in A</strong> grade", source: air-aud }
      - { label: "Young-artiste scholarship", value: "<strong>₹5,000 a month</strong> for 2 years · age 18–25", source: pib-ksvy }
    sections:
      - id: rules
        nav: "Raga &amp; tala rules"
        eyebrow: "Core rules, lineages &amp; raga–tala frameworks"
        heading: "What AIR auditions in Carnatic music — and how it judges"
        parts:
          - table:
              caption: "AIR's three raga groups for Carnatic auditions"
              head: ["Group", "Kind of raga", "Examples from AIR's list"]
              rows:
                - ["<strong>A</strong> (21 ragas)", "Shuddha madhyama", "Begada, Bhairavi, Kambhoji, Kharaharapriya, Mayamalavagowla, Shankarabharanam, Thodi"]
                - ["<strong>B</strong> (14 ragas)", "Prati madhyama", "Dharmavati, Kalyani, Pantuvarali, Shanmukhapriya, Simhendramadhyamam, Vachaspati, Varali"]
                - ["<strong>C</strong> (27 ragas)", "Audava / shadava (five- and six-note)", "Abhogi, Hamsadhwani, Hindola, Madhyamavati, Mohanam, Sahana, Surati"]
            source: air-aud
          - table:
              caption: "Carnatic audition format (vocal / instrumental, excluding percussion)"
              head: ["Level", "What you perform", "Duration"]
              rows:
                - ["Fresh and B → B-High", "Ragalapana + kriti with <strong>neraval and swaraprastharam</strong> (Group A or B, 15 min); a second item from the other group (10 min); raga alapana only from Group C (5 min)", "30 min"]
                - ["B-High → A", "Kriti with neraval and swaraprastharam (30 min); a second kriti of the other madhyama (15 min, station's choice); Group C alapana (10 min, station's choice)", "55 min"]
                - ["Percussion (except thavil), fresh", "Accompaniment for an Adi tala varnam and a Roopaka / Khanda Chapu kriti; then one talam of your choice and one of the station's, each 5 min accompaniment + 10 min solo", "40 min"]
                - ["Percussion, upgrade", "Ata tala varnam accompaniment; then two talams (yours and the station's), each 10 min accompaniment + 10 min solo", "50 min"]
            source: air-aud
          - list:
              - "Tanpura and mridangam accompaniment is provided by the station; <strong>nagaswaram</strong> is auditioned as a party — leader with ottu, thavil and talam."
              - "Judging rests on <strong>swar</strong> (raga grammar, purity of tradition, tone, pitch, developing the raga in full), <strong>taal</strong> (command of laya, systematic improvisation, variety across talas, sensitive accompaniment) and <strong>sahitya</strong> (purity of the composition with bhava and correct pronunciation, rendered in its entirety)."
              - "No reverb or echo is allowed on audition recordings, and recordings made outside the AIR studio are not accepted."
              - "Approved instruments include veena, chitra veena, gottu vadyam, violin, flute, mridangam, kanjira, ghatam, morsing, thavil and nagaswaram."
            source: air-aud
          - list:
              - "Kalakshetra's Carnatic diploma gives <strong>3 hours of main music class every day</strong> — more, it says, than any comparable programme — in small classes paced to each student."
              - "Voice culture is built through regular <strong>sruti exercises, aakaram</strong> and repeated basic exercises in many ragas; rare ragas and kritis are covered, along with works of all the major composers."
              - "Every vocal student takes an <strong>instrument as a subsidiary</strong>; a veena, violin or mridangam major takes vocal as subsidiary. Two of Tamil, Sanskrit and Telugu are compulsory, with yoga and field trips to Thiruvaiyaru."
            source: kala-prosp
          - warn: "Margdarshan found no Government file that lists or ranks Carnatic schools or lineages, so this page does not. The AIR audition judges what you actually sing or play."
      - id: recognition
        nav: "Grades &amp; awards"
        eyebrow: "Institutional &amp; national recognition"
        heading: "AIR grading, Akademi honours and ICCR"
        parts:
          - table:
              caption: "Who grades a classical musician at All India Radio"
              head: ["Board", "Where", "Role in classical music"]
              rows:
                - ["Local Audition Board (LAB)", "Every AIR station", "Live preliminary screening; successful candidates are recorded and sent on"]
                - ["Central Audition Board (CAB)", "Directorate General, AIR, New Delhi", "Grades every fresh case and every upgrade from B up to Top"]
            source: air-aud
          - list:
              - "A <strong>B-grade artiste must be upgraded within 5 years</strong> or is removed from the list; if the CAB keeps you at B, the 5 years restart."
              - "For B-High, A and Top artistes, a station that sees a decline in quality can send a recording to the CAB, which may reduce or withhold bookings."
            source: air-aud
          - table:
              caption: "Sangeet Natak Akademi honours (Carnatic vocal and instrumental are named music categories)"
              head: ["Honour", "Who is considered", "What it carries"]
              rows:
                - ["<strong>Akademi Ratna</strong> (Fellow)", "Ordinarily <strong>age 50+</strong>; at most 40 living Fellows", "₹3 lakh, citation, angavastram, tamrapatra; medical cover up to ₹1.5 lakh a year"]
                - ["<strong>Akademi Puraskar</strong> (Award)", "Ordinarily <strong>age 35+</strong>; 12 awards a year in the music field", "₹1 lakh, citation, angavastram, tamrapatra; medical cover up to ₹1 lakh a year"]
                - ["<strong>Ustad Bismillah Khan Yuva Puraskar</strong>", "<strong>Up to age 40</strong>; at most 33 a year, 8 of them in music", "₹25,000 and a tamrapatra; invitation to perform at the Akademi's festival"]
            source: "sna-awards,sna-yuva"
          - list:
              - "ICCR empanels artists <strong>aged 18 and above</strong> in Carnatic vocal and instrumental music, with applications open all year and expert committees meeting annually."
              - "Its genre-wise list (updated 25 Nov 2025) shows each artist's <strong>current category — Outstanding, Established or Proficient</strong> — and the countries ICCR sent them to."
            source: "iccr-intro,iccr-list"
      - id: eligibility
        nav: "Fees, ages &amp; scholarships"
        eyebrow: "Professional portfolios &amp; age benchmarks"
        heading: "Age limits, audition fees and scholarships"
        parts:
          - table:
              caption: "Kalakshetra (Rukmini Devi College of Fine Arts) admissions, 2026-27"
              head: ["Course", "Age", "Qualification", "Selection"]
              rows:
                - ["<strong>Diploma in Carnatic Music</strong> (4 years) — vocal, veena, violin, flute or mridangam", "<strong>Maximum 25</strong> on 1 July 2026", "Higher Secondary pass (those writing it in April/May 2026 may apply)", "Interview → aptitude test → fitness-cum-medical test; ₹500 online application"]
                - ["<strong>Pratama</strong> (6 years, part-time) — vocal, veena, violin, mridangam", "<strong>7 to 17</strong> on 1 July 2026", "School students", "Interaction with the child; 2026-27 forms closed 5 June 2026"]
            source: "kala-prosp,kala-pratama"
          - table:
              caption: "AIR music audition fees (audition fee + ₹100 form fee + 18% GST)"
              head: ["Category", "Total", "SC/ST (25% off the audition fee)"]
              rows:
                - ["<strong>Fresher</strong>", "₹1,298", "₹1,003"]
                - ["<strong>Any upgrade</strong> (B → B-High, B-High → A)", "₹2,478", "₹1,888"]
                - ["<strong>A → Top</strong>", "₹6,018", "₹4,543"]
                - ["Divyaang, senior citizens, AIR / Doordarshan staff artists", "Nil", "Nil"]
            source: air-aud
          - table:
              caption: "Central scholarships and fellowships open to musicians"
              head: ["Scheme", "Age", "Amount", "Term"]
              rows:
                - ["<strong>CCRT Cultural Talent Search Scholarship</strong>", "10–14", "₹3,600 a year + guru/institution tuition reimbursed up to ₹9,000 a year", "2 years at a time, renewable up to the first degree or age 20; 650 new awards a year"]
                - ["<strong>Scholarship to Young Artistes</strong>", "18–25, with at least 5 years under a guru or institution", "₹5,000 a month", "2 years; up to 400 a batch"]
                - ["<strong>Junior Fellowship</strong>", "25–40", "₹10,000 a month", "2 years, research project; 200 a batch"]
                - ["<strong>Senior Fellowship</strong>", "Above 40", "₹20,000 a month", "2 years; 200 a batch"]
            source: "ccrt-ctss,pib-sya,pib-ksvy"
          - warn: "M.Mus / B.Mus and BPA / MPA are university degrees; an institute diploma such as Kalakshetra's is a different credential. Before choosing, ask the university or employer in writing which one a job or higher course accepts."
      - id: roadmap
        nav: "Guru to Top grade"
        eyebrow: "Grassroots-to-maestro pipeline"
        heading: "From the first varisai to Top grade"
        parts:
          - table:
              caption: "The Carnatic music ladder, step by step"
              head: ["Stage", "Typical age", "What happens", "Who pays"]
              rows:
                - ["<strong>Guru–shishya start</strong>", "From about 7", "A local guru, or Kalakshetra's Pratama course in Chennai (7–17)", "Family (Pratama ₹17,200 in year 1)"]
                - ["<strong>Talent scholarship</strong>", "10–14", "CCRT Cultural Talent Search Scholarship", "Govt: ₹3,600 a year + tuition up to ₹9,000"]
                - ["<strong>Full-time diploma</strong>", "After Class XII, up to 25", "Kalakshetra's 4-year diploma, residential (hostel)", "Family ₹15,000 (year 1), then ₹26,800 a year + hostel"]
                - ["<strong>First AIR grade</strong>", "Adult", "LAB screening at your station → recording → CAB grades you", "₹1,298 fee"]
                - ["<strong>Advanced training</strong>", "18–25", "Young-artiste scholarship after 5 years' training", "Govt ₹5,000 a month"]
                - ["<strong>Climb the grades</strong>", "Within 5 years of B", "B-High, then A, by recorded upgrade auditions", "₹2,478 per upgrade"]
                - ["<strong>Senior artiste</strong>", "10 years after A", "Top grade; SNA Award (35+), Ratna (50+); a guru's Repertory grant", "₹6,018 fee; Ministry of Culture, SNA"]
            source: "kala-pratama,ccrt-ctss,kala-prosp,air-aud,pib-sya,sna-awards,pib-ksvy"
          - p: "The Ministry of Culture's <strong>Repertory grant (Guru–Shishya Parampara)</strong> supports music ensembles — one guru and up to 18 shishyas, <strong>₹15,000 a month for the guru</strong> and <strong>₹2,000–10,000 a month per shishya</strong>, depending on age."
            source: pib-ksvy
      - id: academies
        nav: "Academies"
        eyebrow: "Top elite academies &amp; universities"
        heading: "Kalakshetra in detail — and where else to look"
        parts:
          - table:
              caption: "Kalakshetra fees, 2026-27"
              head: ["Course / year", "Fee for the year", "How it is paid"]
              rows:
                - ["Diploma in Carnatic Music — 1st year", "<strong>₹15,000</strong>", "₹7,750 by 30 June + ₹7,250 by 31 October"]
                - ["Diploma — 2nd to 4th year", "<strong>₹26,800</strong>", "₹13,700 + ₹13,100"]
                - ["Pratama — 1st year", "<strong>₹17,200</strong>", "₹8,900 before classes (incl. ₹400 admission) + ₹8,300 by 31 October 2026"]
            source: "kala-prosp,kala-pratama"
          - list:
              - "Teachers who shaped Kalakshetra's music teaching include <strong>Tiger Varadachariar, Mysore Vasudevachariar, Budalur Krishnamurthi Sastri and M.D. Ramanathan</strong>."
              - "Teacher–student ratio <strong>1 : 8</strong>; a library of over 10,000 books; vegetarian hostels with two or three students to a room."
              - "The Ministry of Social Justice's <strong>Top Class Scholarship</strong> has been extended to the college, and a few CSR-funded scholarships go to very talented students whose families cannot pay."
              - "During the course students may <strong>not learn privately under another teacher</strong>, take tuition classes, record on campus without permission, or perform publicly without the institution's permission."
            source: kala-prosp
          - note: "Margdarshan lists only institutions whose own 2026-27 notice it has read. Several states also run government music colleges and universities — check each one's own current prospectus for seats and fees."
      - id: costs
        nav: "Costs"
        eyebrow: "Instrumentation expenses &amp; who bears the cost"
        heading: "What Carnatic music training costs — and who pays"
        parts:
          - list:
              - "Kalakshetra students must <strong>bring their own musical instruments</strong>, textbooks and notebooks; damage to an institution instrument is <strong>recovered at market price</strong> (Pratama parents pay too)."
              - "At an AIR audition the station provides tanpura and mridangam; your own accompanists must hold <strong>at least B-High grade</strong>, and AIR pays them nothing."
            source: "kala-prosp,kala-pratama,air-aud"
          - list:
              - "<strong>Guru's fees, ages 10–14</strong>: CCRT reimburses actual tuition up to ₹9,000 a year."
              - "<strong>Ages 18–25</strong>: the young-artiste scholarship pays ₹5,000 a month for advanced training."
              - "<strong>Touring abroad</strong>: for a 'Festival of India', the Government bears all expenditure on deputing the artist."
              - "<strong>Institutions</strong>: SNA grants-in-aid (₹30,000–₹1,00,000) <strong>do not pay for buying or repairing musical instruments</strong>."
            source: "ccrt-ctss,pib-sya,pib-foi,sna-grants"
          - warn: "A veena, violin or mridangam is the family's biggest single cost, and no Government file publishes prices — so Margdarshan prints none. Start on a teacher-approved student instrument, buy only with your guru, and budget for strings, skins and maintenance."
      - id: earnings
        nav: "Earnings &amp; jobs"
        eyebrow: "Earning channels &amp; government-job reality"
        heading: "What broadcasting pays — and the government-job reality"
        parts:
          - table:
              caption: "AIR basic fee per booking by grade — AIR Mumbai's annual list of music artistes, as on 1 Jan 2020"
              head: ["Grade", "Basic fee shown"]
              rows:
                - ["<strong>Top</strong>", "₹11,000"]
                - ["<strong>A</strong>", "₹7,400"]
                - ["<strong>B-High</strong>", "₹3,000"]
                - ["<strong>B</strong>", "₹1,700"]
            source: air-mumbai
          - note: "These are the grade-wise figures printed in one station's 2020 list — AIR Chennai's list on the same site shows grades but not amounts. Ask your station for the current rate. A grade is not a salary: bookings depend on the station, and the boards can reduce booking frequency."
          - list:
              - "<strong>Guru's Repertory grant</strong>: ₹15,000 a month."
              - "<strong>Junior / Senior Fellowship</strong>: ₹10,000 / ₹20,000 a month for 2 years."
              - "<strong>Festival engagements</strong> through the Zonal Cultural Centres' Rashtriya Sanskriti Mahotsavs (14 since November 2015)."
              - "<strong>Veteran Artists</strong>: up to ₹6,000 a month at 60+ with annual income up to ₹72,000."
              - "<strong>Prize money</strong>: SNA Yuva ₹25,000, Akademi Puraskar ₹1 lakh, Akademi Ratna ₹3 lakh."
            source: "pib-ksvy,sna-yuva,sna-awards"
          - warn: "There is <strong>no 'cultural quota'</strong> in the central sports-quota rules — DoPT's qualifying list covers games and sports only. Government income for a musician comes from open teaching posts, graded broadcasts and festival engagements, and the schemes above."
            source: dopt-2022
      - id: traps
        nav: "Red flags"
        eyebrow: "Red flags &amp; honest warnings"
        heading: "Before you pay anyone"
        parts:
          - list:
              - "<strong>Nobody can 'arrange' an AIR grade</strong> — classical grades are given only by the Central Audition Board, and its decision is final."
              - "Audition recordings are made <strong>at the AIR studio</strong>; a privately produced recording is not accepted."
              - "A B grade <strong>lapses after 5 years</strong> without an upgrade — plan the next audition early."
              - "<strong>Akademi honours are by nomination only</strong> — no one can sell you an 'SNA award application'."
              - "Kalakshetra fees are <strong>not refunded</strong>, and a student who leaves mid-term pays for the whole term."
            source: "air-aud,sna-yuva,kala-prosp"
          - note: "Riyaz builds a career, but strain does not: vocalists should treat lasting hoarseness, and instrumentalists lasting wrist or finger pain, as a reason to see a doctor."
