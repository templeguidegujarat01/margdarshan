    body: "FIVB · Volleyball Federation of India (VFI)"
    card: "FIVB's 2025–2028 rules — court, net heights, ball pressure, liberos and the new serving-team rule — the FIVB–IOA Steering Committee running Indian volleyball since April 2026, VFI's age-group nationals, SAI centres, the Prime Volleyball League, awards and jobs."
    card_facts: ["Net 2.43 m men · 2.24 m women", "Court 18 × 9 m", "Sets to 25 · 5th set to 15"]
    eyebrow: "Sports Cockpit · Ball &amp; Team Games · FIVB Official Volleyball Rules 2025–2028"
    title: "Volleyball — FIVB rules, net heights &amp; India's national ladder"
    lede: "Education Margdarshan's volleyball map for India: the court, net and ball standards and the game rules in FIVB's Official Volleyball Rules 2025–2028, who runs Indian volleyball after FIVB withdrew the VFI interim body's recognition in April 2026, the age-group nationals and their strict age screening, the SAI and FIVB centres, the Prime Volleyball League, who pays, and the awards and jobs after a medal."
    official:
      - { label: "FIVB Official Volleyball Rules 2025–2028 (PDF)", url: "https://www.fivb.com/wp-content/uploads/2025/01/FIVB-Volleyball_Rules2025_2028-EN-v05.pdf" }
      - { label: "FIVB statement on VFI (21 Apr 2026)", url: "https://www.fivb.com/fivb-statement-on-the-volleyball-federation-of-india/" }
    facts:
      - { label: "Net height", value: "<strong>2.43 m men · 2.24 m women</strong>", source: fivb-rules }
      - { label: "Court", value: "<strong>18 m × 9 m</strong>, free zone at least 3 m", source: fivb-rules }
      - { label: "Ball pressure", value: "<strong>0.30–0.325 kg/cm²</strong> (4.26–4.61 psi)", source: fivb-rules }
      - { label: "Who runs Indian volleyball", value: "<strong>FIVB–IOA Steering Committee</strong> since 21 Apr 2026", source: fivb-vfi }
    sections:
      - id: rules
        nav: "Court &amp; net"
        eyebrow: "Core rules &amp; equipment standards"
        heading: "Court, net, ball and the 2025–2028 game rules"
        parts:
          - p: "FIVB's <strong>Official Volleyball Rules 2025–2028</strong>, approved by the 39th FIVB World Congress in 2024, apply to competitions from 1 January 2025."
            source: fivb-rules
          - table:
              caption: "Court, net and ball (FIVB 2025–2028)"
              head: ["Item", "Standard"]
              rows:
                - ["Court", "<strong>18 m × 9 m</strong>, free zone at least <strong>3 m</strong> on all sides and at least <strong>7 m</strong> clear height (FIVB world events: 5 m beside, 6.5 m behind, 12.5 m height)"]
                - ["Net height", "<strong>2.43 m for men, 2.24 m for women</strong>, measured at the centre of the court"]
                - ["Net", "<strong>1 m</strong> wide (± 3 cm), 9.50–10 m long"]
                - ["Ball", "Circumference <strong>65–67 cm</strong>, weight <strong>260–280 g</strong>"]
                - ["Ball pressure", "<strong>0.30–0.325 kg/cm²</strong> (4.26–4.61 psi; 294.3–318.82 mbar)"]
            source: fivb-rules
          - list:
              - "A team may have <strong>up to 12 players</strong> (up to <strong>14</strong> at FIVB, world and official senior events), with up to <strong>two liberos</strong> — two are compulsory when more than 12 are listed. Only one libero may be on court."
              - "A set goes to <strong>25 points</strong> with a 2-point lead; the match is won with <strong>three sets</strong>; a deciding 5th set goes to <strong>15</strong>."
              - "The server must hit the ball within <strong>8 seconds</strong> of the first referee's whistle."
              - "New in 2025–2028: the receiving team must be in rotation order at the service hit, but <strong>players of the serving team may stand anywhere</strong>."
            source: fivb-rules
      - id: recognition
        nav: "Recognition"
        eyebrow: "Institutional &amp; global recognition"
        heading: "World Championship, Asian Championship — and the Prime Volleyball League"
        parts:
          - list:
              - "Volleyball medals count for the government cash award at the <strong>Olympic Games</strong>, Asian Games and Commonwealth Games, and at the <strong>World Championship</strong> (every four years) and the <strong>Asian Championship</strong> (every two years)."
              - "In team events each player — including bench and reserves — gets <strong>75%</strong> of the individual award; outside the Olympics, Asian and Commonwealth Games a team gets the full amount only if <strong>at least 12 countries</strong> take part (half for 6–11)."
            source: myas-cash
          - table:
              caption: "Individual cash award base (₹ lakh) — a team player gets 75% of this"
              head: ["Event", "Gold", "Silver", "Bronze"]
              rows:
                - ["<strong>Olympic Games</strong>", "75", "50", "30"]
                - ["Asian Games / Commonwealth Games", "30", "20", "10"]
                - ["World Championship (every 4 years)", "40", "25", "15"]
                - ["Asian Championship (every 2 years)", "7.5", "5", "2.5"]
            source: myas-cash
          - p: "India's professional league is the <strong>Prime Volleyball League</strong>: in the 2025 final in Hyderabad (26 October 2025) Bengaluru Torpedoes beat Mumbai Meteors 3–0 for their first title."
            source: fivb-pvl
          - p: "In May 2026 the Steering Committee named the immediate priority as the <strong>AVC Men's Cup 2026</strong> in Ahmedabad; the men's squad was picked through a process involving coaches, former national-team players and technical staff."
            source: fivb-momentum
      - id: eligibility
        nav: "Age &amp; screening"
        eyebrow: "Physical benchmarks &amp; NADA clearance"
        heading: "Age groups, age screening and medical checks"
        parts:
          - table:
              caption: "VFI age categories (selection policy, January 2026)"
              head: ["Category", "Indoor", "Beach"]
              rows:
                - ["Senior", "Men &amp; women", "Men &amp; women"]
                - ["Youth", "<strong>Under 21</strong>", "—"]
                - ["Junior", "<strong>Under 18</strong>", "Under 18"]
                - ["Sub-Junior", "<strong>Under 16</strong>", "Under 16"]
            source: vfi-sel
          - list:
              - "An athlete must be an Indian citizen, meet the age rule (VFI runs <strong>date-of-birth verification and random checks</strong> for every category except senior), be <strong>medically fit</strong> at pre-camp and pre-event checks, follow NADA/WADA rules and be free of any suspension."
            source: vfi-sel
          - list:
              - "Age screening at the 26th Youth Nationals (Bhubaneswar, March 2026): players born <strong>on or after 1 January 2005</strong>; bring the <strong>original</strong> birth certificate (issued at least 2 years earlier), passport, Aadhaar or a Government-hospital medical certificate. <strong>Affidavits are not accepted.</strong>"
              - "No player plays without screening; a rejected player gets no ID card, no medal and no certificate, and the screening committee's decision is final."
            source: vfi-ync
          - list:
              - "SAI's <strong>Age Verification Test</strong> (boys up to 17, girls up to 15) uses a doctor's, a dentist's and a TW3 X-ray opinion; appeals go to the <strong>Medical Appellate Board at AIIMS New Delhi</strong>."
            source: sai-avt
          - list:
              - "You must be available for doping tests in and out of competition and check every medicine against the <strong>Prohibited List</strong>; if no permitted treatment exists, apply to NADA for a <strong>TUE</strong>."
            source: nada-rr
      - id: roadmap
        nav: "Roadmap"
        eyebrow: "Grassroots-to-elite residential pipeline"
        heading: "From sub-junior nationals to the national camp"
        parts:
          - warn: "On <strong>21 April 2026</strong> FIVB <strong>revoked the provisional recognition</strong> of VFI's interim leadership and gave temporary charge to a <strong>Steering Committee of FIVB and Indian Olympic Association</strong> representatives. It must set up an Athletes' Commission, oversee State association elections, align the VFI constitution with the law and introduce <strong>transparent, merit-based national-team selection</strong>; FIVB is putting <strong>USD 258,000</strong> into athlete support and national teams in 2026."
            source: fivb-vfi
          - table:
              caption: "National championships 2026-27 (VFI calendar issued 2 Feb 2026)"
              head: ["Championship", "Venue", "When"]
              rows:
