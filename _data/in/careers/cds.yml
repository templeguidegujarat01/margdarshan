          - "<strong>IMA (Army) & OTA:</strong> A bachelor's degree in <strong>any discipline</strong> from a recognised university — open to Arts, Commerce and Science graduates alike."
          - "<strong>AFA (Air Force) & INA (Navy):</strong> Typically require an engineering degree or a bachelor's degree with Physics and Mathematics at the Class 12 level — check the specific entry's current requirement."
          - "Age limits vary by entry, typically <strong>19-25 years</strong>, with women eligible for the OTA entry and expanding eligibility in other entries — always verify against the latest official notification."
