  # ================================================================ Phase 6 (read 15 Oct 2026)
  # Science flyout expansion. 2027 bulletins of these exams were not out on 15 Oct 2026 (only CMI had
  # announced its 2027 test date), so every page below follows the 2026 cycle's official files.

  # ---------------------------------------------------------------- JEE Main Paper 2 (B.Arch / B.Planning)
  - slug: jee-main-paper2
    short: "JEE Main Paper 2 (B.Arch / B.Plan)"
    stream: architecture
    checked: 2026-10-15
    body: "National Testing Agency (NTA)"
    eyebrow: "Entrance Exam · Architecture &amp; Planning · 2026 cycle"
    title: "JEE Main Paper 2A &amp; 2B — B.Arch and B.Planning: eligibility, marking &amp; fees"
    lede: "The architecture (Paper 2A) and planning (Paper 2B) papers of JEE Main. Their NTA ranks fill B.Arch and B.Planning seats at NITs, Schools of Planning and Architecture and other institutes in the JoSAA NIT+ System. This page follows the JEE (Main) 2026 Information Bulletin."
    coaching_href: "coaching-nata.html"
    colleges_href: "colleges-barch.html"
    facts:
      - { label: "Conducted by", value: "National Testing Agency (NTA)", source: jm-ib }
      - { label: "Paper 2A (B.Arch)", value: "77 questions · 400 marks · 3 hours", source: jm-ib }
      - { label: "Paper 2B (B.Planning)", value: "100 questions · 400 marks · 3 hours", source: jm-ib }
      - { label: "Fee, one paper", value: "₹1,000 General male · ₹500 SC/ST/PwD", source: jm-ib }
    official:
      - { label: "jeemain.nta.nic.in", url: "https://jeemain.nta.nic.in/" }
      - { label: "Information Bulletin 2026 (PDF)", url: "https://cdnbbsr.s3waas.gov.in/s3f8e59f4b2fe7c5705bf878bbd494ccdf/uploads/2025/11/202511021649722475.pdf" }
    sections:
      - id: overview
        nav: "Overview"
        eyebrow: "Overview &amp; governing bodies"
        heading: "Two design papers inside JEE Main"
        parts:
          - p: "JEE Main is conducted by the <strong>National Testing Agency (NTA)</strong>. Besides Paper 1 for B.E./B.Tech, it has <strong>Paper 2A for B.Arch</strong> and <strong>Paper 2B for B.Planning</strong>. Both are held twice a year, in January and April, like Paper 1."
            source: jm-ib
          - p: "NTA only conducts the test. Seats in the <strong>NIT+ System</strong> — NITs, IIEST Shibpur, IIITs and Other-GFTIs, including the Schools of Planning and Architecture — are allotted on JEE Main ranks by the <strong>Joint Seat Allocation Authority (JoSAA)</strong>."
            source: josaa-br
          - table:
              caption: "JEE Main 2026 sessions (the same for all papers)"
              head: ["Event", "Session 1", "Session 2"]
              rows:
                - ["Exam dates", "21 – 30 Jan 2026", "2 – 9 Apr 2026"]
                - ["Result", "By 12 Feb 2026", "By 20 Apr 2026"]
            source: jm-ib
          - warn: "The JEE (Main) 2027 Information Bulletin was not published on 15 October 2026, so this page describes the 2026 cycle. NTA can change the pattern, fees and dates in the 2027 bulletin."
      - id: eligibility
        nav: "Eligibility"
        eyebrow: "Academic eligibility"
        heading: "Class 12 subjects for B.Arch and B.Planning"
        parts:
          - list:
              - "<strong>No age limit</strong> to sit JEE Main."
              - "<strong>Year of Class 12:</strong> passed in 2024 or 2025, or appearing in 2026 — the same rule as Paper 1."
            source: jm-ib
          - table:
              caption: "Subjects needed in Class 12 for NIT+ System seats"
              head: ["Programme", "Class 12 subjects required"]
              rows:
                - ["B.Arch (Paper 2A)", "Physics, Chemistry, Mathematics and two more subjects"]
                - ["B.Planning (Paper 2B)", "Mathematics and four other subjects"]
            source: jm-ib
          - p: "For NIT+ seats the <strong>75% rule</strong> also applies: at least 75% aggregate in Class 12 (65% for SC, ST and PwD), or a place in the category-wise top 20 percentile of your board."
            source: jm-ib
          - p: "Outside the NIT+ System, the bulletin quotes the Council of Architecture rule for B.Arch — Physics and Mathematics compulsory plus one listed subject with at least 45% aggregate, or a 10+3 diploma with Mathematics and 45% — and, for B.Planning, at least 50% in Mathematics and 50% aggregate."
            source: jm-ib
      - id: scheme
        nav: "Exam scheme"
        eyebrow: "Exam scheme &amp; marking matrix"
        heading: "Maths and aptitude on screen, drawing on paper"
        parts:
          - table:
              caption: "Paper 2A (B.Arch)"
              head: ["Part", "Questions", "Marks", "Mode"]
              rows:
                - ["I — Mathematics", "20 MCQ (Section A) + 5 numerical (Section B)", "100", "Computer-based"]
                - ["II — Aptitude Test", "50", "200", "Computer-based"]
                - ["III — Drawing Test", "2", "100", "Pen and paper, A4 drawing sheet"]
                - ["Total", "77", "400", "3 hours"]
            source: jm-ib
          - table:
              caption: "Paper 2B (B.Planning)"
              head: ["Part", "Questions", "Marks", "Mode"]
              rows:
                - ["I — Mathematics", "20 MCQ (Section A) + 5 numerical (Section B)", "100", "Computer-based"]
                - ["II — Aptitude Test", "50", "200", "Computer-based"]
                - ["III — Planning-based questions", "25", "100", "Computer-based"]
                - ["Total", "100", "400", "3 hours"]
            source: jm-ib
          - list:
              - "<strong>Marking:</strong> +4 for a correct answer, −1 for a wrong answer, 0 for unanswered — in MCQs and in the numerical-value questions. The Drawing Test has no negative marking; its two questions are evaluated out of 100."
              - "Numerical answers are typed as an integer with the on-screen keypad, rounded off to the nearest integer."
              - "<strong>Time:</strong> 3 hours for Paper 2A or 2B; 3 hours 30 minutes if you take both. PwD candidates eligible for a scribe get 4 hours (4 hours 10 minutes for both)."
              - "Raw scores in each part are converted to NTA scores, and the overall merit list merges all shifts of both sessions."
              - "<strong>Ties (2A):</strong> NTA score in Mathematics, then Aptitude, then Drawing, then the lower ratio of wrong to right answers."
            source: jm-ib
      - id: reservation
        nav: "Reservation"
        eyebrow: "Reservation thresholds"
        heading: "Central reservation, as for Paper 1"
        parts:
          - table:
              caption: "Central reservation applied to JEE Main admissions"
              head: ["Category", "Share of seats"]
              rows:
                - ["SC", "15%"]
                - ["ST", "7.5%"]
                - ["OBC-NCL", "27%"]
                - ["Gen-EWS", "10%"]
                - ["PwD / PwBD", "5% horizontal, inside every category"]
            source: jm-ib
          - p: "JoSAA applies a <strong>Home State quota</strong> at NITs and reserves <strong>female-only supernumerary seats</strong> in the NIT+ System, alongside the gender-neutral pool."
            source: josaa-br
      - id: fees
        nav: "Application &amp; fees"
        eyebrow: "Application steps &amp; fees"
        heading: "Fee per session, by paper and category"
        parts:
          - table:
              caption: "JEE Main 2026 fee per session, centres in India"
              head: ["Category", "One paper (2A, 2B or 1)", "Two or three papers"]
              rows:
                - ["General — male", "₹1,000", "₹2,000"]
                - ["General — female", "₹800", "₹1,600"]
                - ["Gen-EWS / OBC-NCL — male", "₹900", "₹2,000"]
                - ["Gen-EWS / OBC-NCL — female", "₹800", "₹1,600"]
                - ["SC / ST / PwD — male or female", "₹500", "₹1,000"]
                - ["Third gender", "₹500", "₹1,000"]
            source: jm-ib
          - list:
              - "Apply online on jeemain.nta.nic.in for each session; one application per candidate."
              - "Pay by credit card, debit card, net banking or UPI. Processing charges and GST are extra."
              - "Only some fields can be corrected, and only in the correction window NTA announces."
            source: jm-ib
      - id: horizons
        nav: "Courses &amp; colleges"
        eyebrow: "Career horizons &amp; mapped institutions"
        heading: "From Paper 2 to a B.Arch or B.Planning seat"
        parts:
          - p: "Paper 2A ranks are used for B.Arch and Paper 2B ranks for B.Planning in the JoSAA NIT+ System, which includes the Schools of Planning and Architecture."
            source: josaa-br
          - links:
              - { label: "NATA (Council of Architecture)", url: "nata.html" }
              - { label: "B.Arch college finder", url: "colleges-barch.html" }
              - { label: "JEE Main (Paper 1)", url: "jee-main.html" }
              - { label: "Architect career guide", url: "architect.html" }
    sources:
      - { id: jm-ib, name: "NTA — JEE (Main) 2026 Information Bulletin", url: "https://cdnbbsr.s3waas.gov.in/s3f8e59f4b2fe7c5705bf878bbd494ccdf/uploads/2025/11/202511021649722475.pdf", covers: "Paper 2A / 2B pattern, marking, timing, ties, eligibility, reservation, fees", checked: 2026-10-15 }
      - { id: josaa-br, name: "JoSAA — Business Rules for Joint Seat Allocation 2026-27 (1 June 2026)", url: "https://cdnbbsr.s3waas.gov.in/s313111c20aee51aeb480ecbd988cd8cc9/uploads/2026/06/20260601632081678.pdf", covers: "NIT+ System incl. Schools of Planning and Architecture, Home State quota, female supernumerary seats", checked: 2026-10-14 }

  # ---------------------------------------------------------------- BITSAT
  - slug: bitsat
    short: "BITSAT"
    stream: engineering
    checked: 2026-10-15
    body: "Birla Institute of Technology &amp; Science (BITS), Pilani"
    eyebrow: "Entrance Exam · Engineering · 2026 cycle"
    title: "BITSAT — eligibility, marking, admission rules &amp; fees"
    lede: "BITS Pilani's own computer-based test for its B.E., B.Pharm. and M.Sc. programmes at the Pilani, K K Birla Goa and Hyderabad campuses. This page follows the BITSAT-2026 brochure; the 2027 brochure was not out when it was checked."
    coaching_href: "coaching-jee.html"
    colleges_href: "colleges-btech.html"
    facts:
      - { label: "Conducted by", value: "BITS Pilani (deemed university)", source: bits-br }
      - { label: "Class 12 (PCM)", value: "75% aggregate · 60% in each subject", source: bits-br }
      - { label: "Paper", value: "130 MCQs · 3 hours · +12 bonus questions", source: bits-br }
      - { label: "Marking", value: "+3 correct · −1 wrong", source: bits-br }
    official:
      - { label: "admissions.bits-pilani.ac.in", url: "https://admissions.bits-pilani.ac.in/FD/FD.html" }
      - { label: "BITSAT-2026 brochure (PDF)", url: "https://admissions.bits-pilani.ac.in/FD/downloads/BITSAT-2026_Brochure.pdf" }
    sections:
      - id: overview
        nav: "Overview"
        eyebrow: "Overview &amp; governing body"
        heading: "One test for three BITS campuses"
        parts:
          - p: "All Integrated First Degree admissions at <strong>BITS Pilani</strong> — an Institution of Eminence and deemed-to-be university — for its Pilani, K K Birla Goa and Hyderabad campuses are made through the <strong>BITS Admission Test (BITSAT)</strong>, a computer-based online test conducted by the Institute itself."
            source: bits-br
          - list:
              - "<strong>B.E.</strong> — Chemical, Civil, Computer Science, Electrical &amp; Electronics, Electronics &amp; Instrumentation, Electronics &amp; Communication, Mathematics &amp; Computing, Mechanical, Manufacturing, Environmental &amp; Sustainability and Pharmaceutical Engineering (branches differ by campus)."
              - "<strong>B.Pharm.</strong> at Pilani and Hyderabad."
              - "<strong>M.Sc.</strong> — Biological Sciences, Chemistry, Economics, Mathematics, Physics, Semiconductor &amp; Nanoscience (and General Studies at Pilani). M.Sc. students can compete for a dual degree in engineering after the first year."
            source: bits-br
          - table:
              caption: "BITSAT-2026 sessions"
              head: ["Session", "Test dates"]
              rows:
                - ["Session 1", "15 – 17 Apr 2026"]
                - ["Session 2", "25 – 27 May 2026"]
                - ["Admission form with Class 12 marks and preferences", "29 Apr – 1 Jun 2026"]
            source: bits-br
          - p: "<strong>Board toppers:</strong> first-rank students of every State and Central board in 2026 get direct admission to the programme of their choice, whatever their BITSAT score."
            source: bits-br
          - warn: "The BITSAT-2027 brochure was not published on 15 October 2026. BITS can change the pattern, fees and dates for 2027."
      - id: eligibility
        nav: "Eligibility"
        eyebrow: "Strict academic eligibility"
        heading: "75% in PCM and 60% in each — no exceptions by category"
        parts:
          - table:
              caption: "Class 12 marks needed for admission"
              head: ["Programmes", "Subjects", "Minimum marks"]
              rows:
                - ["All B.E. (except Environmental &amp; Sustainability) and M.Sc.", "Physics, Chemistry, Mathematics, a language and one more subject", "75% aggregate in PCM and at least 60% in each of P, C and M"]
                - ["B.Pharm., B.E. Environmental &amp; Sustainability, M.Sc. Biological Sciences", "Physics, Chemistry, Biology or Mathematics, a language and one more subject", "75% aggregate in PCB/PCM and at least 60% in each"]
            source: bits-elig
          - list:
              - "Theory and practical marks are both counted when working out the percentages."
              - "<strong>Year of Class 12:</strong> appearing in 2026 or passed in 2025 only. Students who passed Class 12 in 2024 or earlier cannot sit BITSAT-2026."
              - "If you took Class 12 more than once, only your latest performance counts, and your 'pass' status must not change."
              - "PCB students need Mathematics at the Class 10 level. CAIE students need the subjects at A Level; IB students at Higher Level."
              - "Students already enrolled in any BITS programme cannot appear."
            source: bits-br
          - note: "BITS sets no age limit in the brochure, and the brochure gives no category-wise relaxation of these marks."
            source: bits-br
      - id: scheme
        nav: "Exam scheme"
        eyebrow: "Exam scheme &amp; marking matrix"
        heading: "130 questions in 3 hours, then 12 optional extras"
        parts:
          - table:
              caption: "BITSAT-2026 test format (computer-based, English only)"
              head: ["Part", "Subject", "Questions"]
              rows:
                - ["I", "Physics", "30"]
                - ["II", "Chemistry", "30"]
                - ["III (a)", "English Proficiency", "10"]
                - ["III (b)", "Logical Reasoning", "20"]
                - ["IV", "Mathematics (or Biology for B.Pharm., Environmental &amp; Sustainability and M.Sc. Biological Sciences)", "40"]
                - ["Total", "3 hours, no break", "130"]
            source: bits-br
          - list:
              - "<strong>Marking:</strong> +3 for each correct answer, −1 for each wrong answer, 0 for unattempted questions. All questions are MCQs with one correct option out of four."
              - "<strong>Bonus questions:</strong> a candidate who answers all 130 questions can attempt 12 extra questions (3 each from Physics, Chemistry, Mathematics/Biology and Logical Reasoning) — but cannot go back to change earlier answers once they choose this."
              - "There is no time limit per part; questions are picked at random from a large bank, so different candidates get different papers, followed by a moderation process."
              - "<strong>Attempts:</strong> at most two — one in each session. If you sit both, the higher score counts."
              - "<strong>Ties</strong> are broken by Mathematics (or Biology) score, then Physics, then Chemistry, then total positive marks; then a female candidate is preferred, then the older application."
              - "Calculators and log tables are not allowed."
            source: bits-br
      - id: reservation
        nav: "Admission rules"
        eyebrow: "Reservation &amp; quotas"
        heading: "Pure merit — no caste or home-state quota"
        parts:
          - p: "BITS admits <strong>purely on merit</strong>: the merit position is the BITSAT score of candidates who also meet the Class 12 minimum marks. The brochure lays down no reservation by caste, category or home state."
            source: bits-br
          - list:
              - "The only route outside BITSAT is the <strong>direct admission of 2026 board toppers</strong> (first rank in a State or Central board)."
              - "<strong>Persons with benchmark disabilities</strong> (40% or more) can ask for extra facilities by e-mailing bitsat@pilani.bits-pilani.ac.in with the subject 'PWD CANDIDATE'; a scribe, if needed, is provided at a BITS campus."
            source: bits-br
      - id: fees
        nav: "Application &amp; fees"
        eyebrow: "Application steps &amp; fees"
        heading: "Gender-wise test fees"
        parts:
          - table:
              caption: "BITSAT-2026 application fee"
              head: ["Option", "Male", "Female / Transgender", "Dubai centre"]
              rows:
                - ["One session (Session 1 or Session 2)", "₹3,600", "₹3,100", "₹7,250"]
                - ["Both sessions", "₹5,600", "₹4,600", "₹9,250"]
                - ["Add Session 2 later (17 Apr – 2 May 2026 window)", "₹2,000", "₹1,500", "₹2,000"]
            source: bits-br
          - list:
              - "<strong>Step 1</strong> — apply online and choose Session 1 or both; Session 2 alone is applied for in the second window."
              - "<strong>Step 2</strong> — pick three test cities; the allotted city is announced, then you book a test date and slot (or the system allots one)."
              - "<strong>Step 3</strong> — download the hall ticket and sit the test; your score is shown on screen at the end."
              - "<strong>Step 4</strong> — submit the admission form with Class 12 marks and programme preferences by 1 June 2026."
              - "The application fee is non-refundable and non-transferable."
            source: bits-br
          - table:
              caption: "Tuition for students admitted in 2026-27 (domestic)"
              head: ["Item", "Amount"]
              rows:
                - ["Semester tuition fee, 2026-27", "₹2,91,500"]
                - ["Summer term fee, 2026-27 (only if you register for it)", "₹1,02,000"]
            source: bits-fee
          - note: "Tuition rises every year for each batch (₹3,06,000 a semester in 2027-28 for the 2026 batch); hostel and mess fees are extra."
            source: bits-fee
      - id: horizons
        nav: "Courses &amp; colleges"
        eyebrow: "Career horizons &amp; mapped institutions"
        heading: "Dual degrees, 2+2 abroad and a 3+2 MBA route"
        parts:
          - list:
              - "<strong>2+2 programmes</strong> with partner universities (for example RMIT Melbourne, Iowa State, University at Buffalo, Rensselaer, CentraleSupélec): two years at a BITS campus, two years abroad."
              - "<strong>3+2 B.E. + MBA</strong>: high performers in PCM-input B.E. programmes can add an MBA at BITSOM, Mumbai."
            source: bits-br
          - links:
              - { label: "JEE Main", url: "jee-main.html" }
              - { label: "VITEEE", url: "viteee.html" }
              - { label: "B.Tech college finder", url: "colleges-btech.html" }
              - { label: "Computer Science Engineering career", url: "cse.html" }
    sources:
      - { id: bits-br, name: "BITS Pilani — BITSAT-2026 Brochure", url: "https://admissions.bits-pilani.ac.in/FD/downloads/BITSAT-2026_Brochure.pdf", covers: "programmes, board toppers, eligibility, test format, marking, bonus questions, sessions, fees, ties, PwD", checked: 2026-10-15 }
      - { id: bits-elig, name: "BITS Pilani — BITSAT eligibility criteria page", url: "https://admissions.bits-pilani.ac.in/FD/BITSAT_eligibility.html", covers: "subject-wise Class 12 minimum marks", checked: 2026-10-15 }
      - { id: bits-fee, name: "BITS Pilani — First Degree fee structure 2026-27", url: "https://admissions.bits-pilani.ac.in/FD/FD_fee.html", covers: "semester and summer-term tuition by year", checked: 2026-10-15 }

