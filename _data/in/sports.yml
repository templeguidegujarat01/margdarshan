    title: "Cricket — formats, BCCI age groups, the IPL &amp; the road to India colours"
    lede: "Education Margdarshan's cricket map for India: the playing conditions the ICC uses for Tests, ODIs and T20Is, the BCCI's age-group ladder for 2026-27 and its age-fraud bans, the Centre of Excellence fitness system, IPL player rules, central-contract grades, match fees, and where cricket sits in government schemes and job quotas."
