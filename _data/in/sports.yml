  # ------------------------------------------------------------------------------------------------ Football
  - slug: football
    short: "Football"
    domain: ball
    body: "IFAB / FIFA · All India Football Federation (AIFF)"
    card: "Laws of the Game 2026/27, AIFF contract and minor rules, Blue Cubs to ISL, Tata Football Academy trials."
    card_facts: ["11 a side · 90 min", "No contract under 16", "ISL: 14 clubs"]
    eyebrow: "Sports Cockpit · Ball &amp; Team · Laws of the Game 2026/27"
    title: "Football — rules, youth leagues, contracts &amp; the road to the ISL"
    lede: "Education Margdarshan's complete football map for India: the Laws in force from 1 July 2026, the age and contract rules every academy player signs under, the Blue Cubs-to-ISL pathway, the trials at Tata Football Academy and SAI, who pays, and the coaching licences and jobs after playing."
    official:
      - { label: "Laws of the Game 2026/27 (PDF)", url: "https://downloads.theifab.com/downloads/laws-of-the-game-202627-single-pages?l=en" }
      - { label: "the-aiff.com", url: "https://www.the-aiff.com/" }
    facts:
      - { label: "Match", value: "<strong>11 a side</strong>, 2 × 45 min; no match below 7 players", source: ifab-log }
      - { label: "Substitutes", value: "Up to <strong>5</strong> in 3 windows + half-time", source: ifab-log }
      - { label: "First contract", value: "<strong>Not before 16</strong>; max 3 years until 18", source: aiff-rstp }
      - { label: "ISL 2025-26", value: "<strong>14 clubs</strong>, 91 matches, relegation to IFL", source: isl-2526 }
    sections:
      - id: rules
        nav: "Rules"
        eyebrow: "Core rules &amp; category limits"
        heading: "The Laws of the Game in force from 1 July 2026"
        parts:
          - list:
              - "A match is two teams of <strong>maximum eleven</strong> players, one a goalkeeper. A match may not start or continue if a team has <strong>fewer than seven</strong>."
              - "A match is <strong>two equal halves of 45 minutes</strong>; half-time may not exceed 15 minutes. The referee adds time lost to substitutions, injuries, time-wasting, VAR checks, goal celebrations, drinks breaks (up to 1 minute) and cooling breaks (90 seconds to 3 minutes)."
              - "In official competitions up to <strong>five substitutes</strong> may be used; top-division club and senior A international teams get <strong>three substitution opportunities plus half-time</strong>. Competitions may also allow <strong>additional permanent concussion substitutes</strong>."
            source: ifab-log
          - table:
              caption: "Field and ball"
              head: ["Item", "Any match", "International match"]
              rows:
                - ["Touchline (length)", "90–120 m", "<strong>100–110 m</strong>"]
                - ["Goal line (width)", "45–90 m", "<strong>64–75 m</strong>"]
                - ["Ball", "Circumference 68–70 cm · 410–450 g at kick-off · 0.6–1.1 atmosphere", "Same, and FIFA/confederation competitions need an approved ball"]
            source: ifab-log
          - list:
              - "Friendlies between senior A national teams may now use <strong>eight substitutes</strong> (eleven if both teams agree), still in three windows."
              - "A substituted player has <strong>ten seconds</strong> to leave the field; if exceeded, the substitute cannot enter until the first stoppage after one minute."
              - "Barring exceptions, a player treated on the field must <strong>stay off for one minute</strong> after play restarts."
              - "VAR may now review a red card from a clearly wrong second yellow, a card shown to the wrong player and (competition option) a wrongly awarded corner."
              - "The 'Only the captain' guideline becomes <strong>compulsory from 1 July 2027</strong>."
            source: ifab-log
          - note: "Football has <strong>no weight or height classes</strong>. Competitions are split by age group and by men's/women's football; the age limits come from each competition's rules."
            source: ifab-log
      - id: recognition
        nav: "Recognition"
        eyebrow: "Institutional &amp; global recognition"
        heading: "World Cup, Olympics, Asian Games and India's leagues"
        parts:
          - p: "The <strong>FIFA World Cup 2026</strong> in Canada, Mexico and the United States was the first with <strong>48 teams and 104 matches</strong>; <strong>1,248 players</strong> were named in final squads (26 per team). The youngest was 17 years and 240 days old."
            source: fifa-wc26
          - table:
              caption: "Indian Super League 2025-26"
              head: ["Item", "Fact"]
              rows:
                - ["Organiser", "<strong>AIFF ran the ISL itself for the first time</strong>, in line with a Supreme Court judgement"]
                - ["Clubs and format", "<strong>14 clubs</strong>, single-leg round robin, <strong>91 matches</strong> at 11 venues in 10 states, from 14 February 2026"]
                - ["Relegation", "First time: the bottom club drops to the <strong>Indian Football League (IFL)</strong>; the IFL champion moves up"]
                - ["Asian reward", "The ISL champion enters the <strong>AFC Champions League Two</strong> preliminary round"]
            source: isl-2526
          - list:
              - "Football medals at the <strong>Olympic Games, Asian Games and Commonwealth Games</strong> earn the Ministry's cash award, as do the <strong>FIFA World Cup</strong> and the 'AFC Cup (quadrennial)' named in the scheme."
              - "In team events every squad member, including reserves, gets <strong>75%</strong> of the matching individual award; the coach gets 50% of the athlete's share."
            source: myas-cash
      - id: eligibility
        nav: "Eligibility"
        eyebrow: "Physical, age &amp; gender eligibility"
        heading: "Contracts, minors and what academies test at trials"
        parts:
          - list:
              - "A <strong>minor</strong> is any player under 18. A <strong>professional</strong> has a written contract and is paid more than his or her football expenses; an <strong>amateur</strong> signs an AIFF consent form and is not paid beyond expenses."
              - "<strong>Players under 16 may not sign a contract under any circumstance.</strong>"
              - "Under 18, a professional contract needs the <strong>parents' or guardian's counter-signature</strong> and may run for <strong>no more than 3 years</strong>."
              - "Any contract runs at least to the end of the season and <strong>at most 5 years</strong>."
              - "<strong>International transfers of minors</strong> are allowed only under Article 19 of FIFA's transfer regulations."
              - "Every club academy and private academy must <strong>report all minors</strong> it trains to the state association, which keeps a register."
            source: aiff-rstp
          - table:
              caption: "What Tata Football Academy asked for at its 2018 trials (15th batch)"
              head: ["Requirement", "Benchmark"]
              rows:
                - ["Date of birth", "1 Jan 2002 – 31 Dec 2003 (aged about 14–16)"]
                - ["Minimum height", "<strong>5 ft 6 in</strong> (approx.)"]
                - ["Minimum weight", "<strong>55 kg</strong>"]
                - ["Birth proof", "Government birth certificate <strong>registered within one year of birth</strong>, Aadhaar, and a principal's letter on age and class"]
                - ["Tested on", "Match performance, technique, tactics, physical and medical parameters"]
            source: tfa-2018
          - note: "These are one academy's published trial rules for one year, not a national standard. Check the academy's current notice before travelling."
            source: tfa-2018
          - list:
              - "Footballers in India are bound by NADA's anti-doping rules: be available for testing, check every medicine against the <strong>Prohibited List</strong>, and apply for a <strong>TUE</strong> when no permitted treatment exists."
            source: nada-rr
      - id: roadmap
        nav: "Roadmap"
        eyebrow: "Grassroots-to-elite roadmap"
        heading: "From Blue Cubs to the ISL"
        parts:
          - table:
              caption: "The football ladder"
              head: ["Step", "Age", "What happens"]
              rows:
                - ["1. Blue Cubs League", "<strong>4–12</strong>", "AIFF's grassroots leagues with small-sided games from <strong>2v2 to 7v7</strong>; find one in the Blue Cubs app"]
                - ["2. School &amp; district", "U14–U19", "School games and district/state leagues — where SAI and Khelo India scouts look"]
                - ["3. SAI centres", "10–18 (team games)", "Team members finishing top 4 at Sub-Junior/Junior Nationals, or top 2 at state level, can enter SAI Training Centres after tests"]
                - ["4. AIFF U-18 Elite League", "U18", "<strong>130+ clubs and academies</strong> (ISL, I-League and accredited academies) in 2025-26; the best 16 reach the final rounds"]
                - ["5. Professional club", "16+ (contract)", "First contract from 16; ISL or IFL squad"]
                - ["6. National teams", "Men U17 · U19 · U23 · Senior; women U15 · U17 · U19 · Senior", "AIFF national teams"]
            source: "aiff-bcl,sai-schemes,aiff-elite,aiff-rstp,aiff-home"
          - list:
              - "Blue Cubs leagues need a <strong>No Objection Certificate from the state association</strong>; operators follow the AIFF operating manual."
            source: aiff-bcl
          - list:
              - "The FIFA Talent Development Scheme in India builds a pathway from <strong>FIFA Talent Academies</strong> to youth national teams, with zonal scouting, centralised assessment, GPS/video monitoring, education and safeguarding; the first academy visit was to <strong>Bhubaneswar, Odisha</strong>."
            source: aiff-ftds
          - p: "Team-game entry to SAI Training Centres is for ages <strong>10 to 18</strong>; a player who misses the motor-quality tests may be taken provisionally for six months."
            source: sai-schemes
      - id: academies
        nav: "Academies"
        eyebrow: "Top training academies &amp; cities"
        heading: "Where India's footballers are trained"
        parts:
          - table:
              caption: "Verified football centres"
              head: ["Centre", "City / state", "What it is"]
              rows:
                - ["SAI NCOE Thiruvananthapuram", "Kerala", "Government residential centre — football with athletics, cycling, taekwondo, volleyball"]
                - ["SAI NCOE Guwahati", "Assam", "Football with archery, athletics, boxing, cycling, fencing, taekwondo"]
                - ["SAI NCOE Imphal", "Manipur", "Football with archery, athletics, cycling, fencing, hockey, judo, weightlifting, wushu"]
            source: sai-schemes
          - p: "<strong>Tata Football Academy, Bistupur, Jamshedpur (Jharkhand)</strong> selects cadets through open trials judged on match situations, technique, tactics and physical ability; shortlisted boys stay for final trials, and <strong>no travel fare is paid</strong> for attending."
            source: tfa-2018
          - p: "<strong>FIFA Talent Academy, Bhubaneswar (Odisha)</strong> is part of the FIFA Talent Development Scheme run with the AIFF."
            source: aiff-ftds
          - p: "The AIFF's <strong>National Centre of Excellence — India Football Campus, Kolkata</strong> is planned as the home of all national teams; its first phase (technical centre, one natural and one floodlit artificial pitch) is under construction with FIFA and AFC help."
            source: aiff-ncoe
          - note: "SAI Bengaluru is not a football centre — its NCOE disciplines are athletics, hockey, taekwondo and weightlifting. AIFF also publishes a list of accredited academies on its website."
            source: sai-schemes
      - id: costs
        nav: "Diet &amp; cost"
        eyebrow: "Dietary framework &amp; financial cost breakdown"
        heading: "Food, supplements and who pays"
        parts:
          - list:
              - "<strong>Food first</strong>: NADA's advice is to meet needs from food before considering supplements, with a certified nutritionist."
              - "<strong>No supplement is 100% safe</strong> and <strong>strict liability</strong> applies — the player is responsible for whatever is found in the sample."
            source: nada-supp
          - table:
              caption: "Who pays — football"
              head: ["Stage", "Paid by", "Amount"]
              rows:
                - ["Adopted school (age 8–14)", "SAI National Sports Talent Contest", "Kit ₹2,000 · competitions ₹2,000 · stipend ₹3,000 a year"]
                - ["Khelo India athlete", "Ministry of Youth Affairs &amp; Sports", "<strong>₹6.28 lakh a year</strong> incl. ₹1.20 lakh cash"]
                - ["Athlete in hardship", "PDU National Welfare Fund", "Up to ₹2.50 lakh"]
                - ["Professional", "The club, under a written contract", "Set by the contract"]
            source: "sai-schemes,pib-support,aiff-rstp"
          - note: "The TOPS core group (August 2024) was 174 individual athletes plus the men's and women's <strong>hockey</strong> teams — no football team."
            source: pib-support
      - id: earnings
        nav: "Earnings &amp; jobs"
        eyebrow: "Earning channels &amp; post-athletic horizons"
        heading: "Contracts, coaching licences and sports-quota jobs"
        parts:
          - list:
              - "A <strong>professional contract</strong> is your main income; a club wanting a player under contract must <strong>inform his current club in writing</strong> first, and he is free to sign elsewhere only when his contract has expired or ends within <strong>6 months</strong>."
              - "If a licensed football agent negotiated the deal, the contract must <strong>name the agent</strong>."
            source: aiff-rstp
          - table:
              caption: "Coaching qualifications offered in India (AIFF calendar 2026)"
              head: ["Level", "Examples on the calendar"]
              rows:
                - ["AIFF D Certificate", "Aizawl 5–10 Oct 2026 · Indore 1–6 Nov 2026"]
                - ["AFC C Diploma", "Rising Stars FA, 18–29 Nov 2026"]
                - ["AFC B Diploma", "Bhopal, Imphal, Goa and other venues through 2026"]
                - ["AFC A Diploma", "Minerva Academy (Mar–Oct 2026) · Dempo FC, Goa (Mar–Oct 2026)"]
            source: aiff-coach
          - list:
              - "Football is one of the <strong>65 sports</strong> in the central sports quota for <strong>Group C</strong> posts, with age relaxation of up to 5 years (10 for SC/ST)."
              - "Medals at Olympics, Asian Games, Commonwealth Games or World Championships can bring up to <strong>three out-of-turn promotions</strong> for a government employee — in team events only if the player played <strong>at least 50% of the matches</strong>; reserves do not qualify."
            source: dopt-2022
          - p: "Retired champions can receive the <strong>Pension to Meritorious Sportspersons</strong> of ₹12,000–20,000 a month."
            source: pib-support
      - id: traps
        nav: "Red flags"
        eyebrow: "Disqualification traps"
        heading: "Mistakes that cost young footballers their chance"
        parts:
          - list:
              - "<strong>A late-registered birth certificate</strong> — TFA accepted only certificates registered within one year of birth."
              - "<strong>Canvassing</strong> for selection automatically disqualified the applicant."
            source: tfa-2018
          - list:
              - "<strong>Signing before 16</strong>, or a contract over 3 years before 18 — AIFF will not recognise it."
              - "Joining a <strong>private academy that does not report its minors</strong> to the state association — state associations must report wrongdoing at private academies."
            source: aiff-rstp
          - list:
              - "<strong>Age fraud</strong> and doping are grounds for removal from SAI centres; age verification is compulsory when admission is based on sub-junior or junior results."
            source: sai-schemes
