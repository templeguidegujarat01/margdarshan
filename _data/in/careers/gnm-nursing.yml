    heading: "What is GNM?"
    parts:
      - overview:
          points:
            - "GNM (General Nursing & Midwifery) is a nursing diploma regulated by the <strong>Indian Nursing Council (INC)</strong> and state nursing councils, covering patient care, medical-surgical nursing, midwifery, community health and psychiatric nursing."
            - "The course runs approximately <strong>3 years of academics plus a 6-month compulsory internship</strong>, giving students substantial hands-on hospital and clinical exposure."
            - "After completing GNM and passing your State Nursing Council's registration exam, you become a <strong>Registered Nurse and Registered Midwife (RNRM)</strong> — a genuine, legally recognised professional qualification, similar in spirit to how <a href=\"diploma-pharmacy.html\">D.Pharm</a> leads to Registered Pharmacist status."
