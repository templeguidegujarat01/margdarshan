              - "SAI's <strong>Age Verification Test</strong> applies to boys up to 17 and girls up to 15: a doctor's examination, a dental examination and a TW3 X-ray; appeals go to the <strong>Medical Appellate Board at AIIMS New Delhi</strong>."
