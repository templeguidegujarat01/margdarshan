              head: ["Centre", "City", "What it is"]
              rows:
                - ["<strong>BCCI Centre of Excellence</strong>", "Bengaluru", "The BCCI's high-performance campus — coaching, sports science, sports medicine, strength and conditioning; screening and rehab of contracted, targeted and age-group players"]
                - ["<strong>MRF Pace Foundation</strong>", "Chennai", "Fast-bowling academy set up in <strong>1987</strong>; its 2024 'Ace of Pace' trials in Kolkata, Mumbai, Delhi and Chennai shortlisted 1,000+ bowlers, sent the top 20 from each city to the final and picked 3 to train free"]
            source: "bcci-coe,mrf-pace"
