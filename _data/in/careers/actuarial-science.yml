  - id: "higher"
    hid: "higher-heading"
    alt: true
    eyebrow: "Beyond IAI"
    heading: "Higher studies & international mobility"
    parts:
      - prose:
          - "IAI has a <strong>mutual recognition agreement (MRA)</strong> with the UK's Institute and Faculty of Actuaries (IFoA) — a Fellow of IAI (FIAI) with 3+ years of post-qualification experience can be recognised as a Fellow of IFoA (FIA), and vice versa, opening doors across the UK, Singapore, Hong Kong, UAE and Australia without repeating the full exam sequence. Many Indian actuarial students also sit IFoA papers directly, since the Core Principles syllabus (CS1, CS2, CM1, CM2) is shared between the two bodies."
  - id: "future"
    hid: "future-heading"
    eyebrow: "Looking ahead"
    heading: "Future scope & the impact of AI"
    parts:
      - prose:
          - "Routine calculation work is increasingly assisted by modelling software, but actuarial work has always been about far more than computation — it's about judgment: which assumptions are reasonable for a 40-year pension liability, how a new insurance product should be priced, and how a company should hold capital against a rare but catastrophic event. That judgment, backed by legal and professional accountability, is exactly what Artificial Intelligence (AI) cannot yet replace, and it's precisely what IRDAI legally requires a human Fellow to sign off on."
          - "Growth areas include health insurance pricing (an expanding market in India), climate-risk modelling for general insurers, and actuaries who pair their core training with data science and machine-learning skills for more sophisticated risk models."
  - id: "proscons"
    hid: "pc-heading"
    alt: true
    eyebrow: "Honest take"
    heading: "Advantages and disadvantages"
    parts:
      - proscons:
          pros:
            - "One of the highest salary ceilings of any Indian professional qualification, at every career stage."
            - "Legally mandated demand (IRDAI's Appointed Actuary requirement) keeps job security genuinely high."
            - "Strong international portability via the IAI-IFoA mutual recognition agreement."
          cons:
            - "Arguably the longest, most demanding qualification path — realistically 5-8 years."
            - "Heavily mathematical throughout — a genuine barrier without strong Maths and Statistics fundamentals."
            - "Narrower industry scope than CFA or an MBA — mainly insurance, pensions and related risk fields."
  - hid: "myth-heading"
    alt: true
    eyebrow: "Common myths"
    heading: "Myths vs facts"
    parts:
      - myths:
          - myth: "Actuarial science is basically the same as data science."
            fact: "Actuarial science is a regulated, IAI-governed profession focused on pricing risk in insurance and pensions — a narrower, exam-based path than the broader, less formally regulated field of data science."
          - myth: "You must complete all 13 subjects to have a viable career."
            fact: "Reaching Associate level (10 subjects) alone already opens well-paid actuarial roles — Fellowship is the ceiling, not the minimum bar for a career."
          - myth: "Only engineers and Maths graduates can become actuaries."
            fact: "ACET is open to any stream after Class 12 — what matters is genuine strength in maths and statistics, not your specific degree title."
  - hid: "tips-heading"
    eyebrow: "Practical advice"
    heading: "Expert tips for actuarial students"
    parts:
      - prose:
          - list:
              - "Start applying for actuarial trainee roles as soon as you clear a few Core Principles subjects — the work-integrated learning model means real job experience genuinely accelerates later subjects."
              - "Don't underestimate CP3 (Communications Practice) just because it seems less technical — many strong quantitative students lose marks here."
              - "Choose your SP and SA specialisms based on the industry you actually want to work in — life insurance, general insurance and pensions lead to genuinely different career paths."
              - "Pace yourself deliberately — since there's no fixed deadline, burning out by over-attempting subjects too fast is a more common failure mode than running out of time."
            ticks: true
