  - id: "faq"
    hid: "faq-heading"
    alt: true
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Does ITI Draughtsman Civil make me an engineer or architect?"
            a: "No. This trade trains you to prepare technical drawings and plans under the direction of engineers or architects. It does not grant the legally protected \"Architect\" or \"Engineer\" title, which require separate degrees (B.Arch or B.E./B.Tech Civil) and, for Architect specifically, Council of Architecture registration."
          - q: "What is the difference between Draughtsman Civil and Surveyor trades?"
            a: "Draughtsman Civil focuses on preparing building and structural drawings, plans and layouts, typically using software like AutoCAD. Surveyor focuses on on-site land measurement, mapping and levelling using survey instruments. Draughtsman is drawing/office-based; Surveyor is measurement/field-based."
          - q: "How long is the ITI Draughtsman Civil course?"
            a: "Draughtsman Civil is typically a 2-year NCVT-affiliated trade, combining building drawing theory, surveying basics, estimation and substantial hands-on drafting practice including AutoCAD training."
          - q: "Is AutoCAD taught in this trade?"
            a: "Yes, AutoCAD training is a standard, important part of the modern Draughtsman Civil syllabus, since most construction and architecture firms now expect digital drafting skills alongside traditional manual drawing knowledge."
          - q: "What jobs can I get after ITI Draughtsman Civil?"
            a: "Common roles include Draughtsman/CAD Operator at architecture firms, civil engineering consultancies and construction companies, alongside various government PWD (Public Works Department) and municipal technical posts via relevant recruitment exams."
      - note: "*Fee and salary figures are indicative, based on publicly available information as of 2026, and vary significantly by state, institute and employer — always verify current figures directly with your target ITI."
