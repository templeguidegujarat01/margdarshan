    hid: "faq-heading"
    alt: true
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Why is Fitter one of the most popular ITI trades?"
            a: "Fitter is broadly applicable across almost every manufacturing and maintenance environment, and it's specifically preferred or required for many Railways (Railway Recruitment Board (RRB) Technician/ALP) and defence technical recruitment exams, giving it wider government job access than many other trades."
          - q: "What is the difference between Fitter and Machinist trades?"
            a: "Fitter focuses on manual assembly, bench work, fitting components together and general mechanical maintenance using hand tools and basic machines. Machinist focuses specifically on operating precision machine tools (lathes, milling machines, grinders) to shape metal parts to exact specifications. Fitter is broader and more assembly/maintenance-oriented; Machinist is more machine-operation specialised."
          - q: "How long is the ITI Fitter course?"
            a: "Fitter is typically a 2-year NCVT-affiliated trade, combining trade theory, workshop calculation, engineering drawing and substantial hands-on bench/fitting practice."
          - q: "Can I get a railway job after ITI Fitter?"
            a: "Yes, this is one of the most common and realistic paths. Fitter trade-qualified candidates are eligible for various RRB technical posts including Technician and Assistant Loco Pilot (ALP) categories, through their own separate recruitment exams — the ITI certificate is a prerequisite, not a guarantee of selection."
          - q: "What industries hire ITI Fitters?"
            a: "Virtually every manufacturing sector hires Fitters — automobile, machinery, heavy engineering, construction equipment, and maintenance departments across industries — alongside strong government/PSU and railway/defence recruitment demand."
      - note: "*Fee and salary figures are indicative, based on publicly available information as of 2026, and vary significantly by state, institute and employer — always verify current figures directly with your target ITI."
