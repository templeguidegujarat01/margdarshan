  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What is UPSC Civil Services?"
    parts:
      - overview:
          points:
            - "The <strong>Civil Services Examination (CSE)</strong>, conducted annually by the <strong>UPSC</strong>, recruits officers for India's top administrative, police and foreign services — including the <strong>IAS, IPS and IFS (Indian Foreign Service)</strong>, along with dozens of other Group A and B central services."
            - "It's widely considered India's most prestigious and competitive government exam, testing a vast syllabus across history, polity, economy, geography, ethics, current affairs and more."
            - "The exam is genuinely open to graduates of any discipline, though Arts subjects like History, Political Science, Sociology and Geography naturally overlap with much of the General Studies syllabus, which is why the Arts stream produces a disproportionate share of successful candidates."
  - id: "who"
    hid: "who-heading"
    alt: true
    eyebrow: "Fit check"
    heading: "Who should pursue UPSC"
    parts:
      - fit:
          match:
            - "Are genuinely drawn to public service, governance and having real impact on policy and people's lives."
            - "Are prepared for 1-2+ years of sustained, disciplined study across an enormous syllabus."
            - "Can handle setbacks — most successful candidates don't clear it on their first attempt."
          mismatch:
            - "See it purely as a prestige label without genuine interest in the actual administrative/policy work."
            - "Need quick, guaranteed career progress — the exam's low success rate means most aspirants need multiple attempts, if they clear it at all."
            - "Aren't willing to have a backup plan — preparing without one, indefinitely, carries real financial and emotional risk."
  - id: "eligibility"
    hid: "elig-heading"
    eyebrow: "Eligibility"
    heading: "Who can apply for UPSC Civil Services"
    parts:
      - elig_list:
          - "A <strong>bachelor's degree</strong> in any discipline from a recognised university — no specific subject or stream is required."
          - "Age limit typically <strong>21-32 years</strong> for General category, with relaxations up to 35 years for Other Backward Classes (OBC) and 37 years for SC/ST, plus additional relaxations for specific categories."
          - "Indian citizenship is required (with specific provisions for certain services); exact rules are published in each year's official UPSC notification."
