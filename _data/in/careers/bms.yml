    heading: "What is BMS?"
    parts:
      - overview:
          points:
            - "BMS is a 3-year undergraduate degree covering business management — marketing, finance, human resources, operations and business law — first standardised by the <strong>University of Mumbai</strong>, where it's now offered at 200+ affiliated colleges."
            - "It's the dominant management-degree name in Maharashtra, in much the same way BBA dominates in most other states and Bachelor of Business Management (BBM) dominates in Karnataka."
            - "Structurally and academically, BMS sits alongside B.Com as a commerce-stream-friendly option, but where B.Com goes deep into accounting and taxation, BMS gives you the broader, management-focused education — closer in spirit to BBA than to B.Com."
