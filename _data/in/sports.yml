              caption: "BFI national championships by age group"
              head: ["Championship", "Age group", "Latest listed edition"]
              rows:
                - ["Sub-Junior Nationals", "U13 / U14", "51st — Vijayawada, 27 Sep–4 Oct 2026"]
                - ["Youth Nationals", "<strong>U16</strong>", "41st — Pune, 27 Oct–3 Nov 2026"]
                - ["Junior Nationals", "<strong>U18</strong>", "76th — Puducherry, 22–29 May 2026"]
                - ["U23 Nationals (5x5 and 3x3)", "U23", "2nd U23 Nationals — dates to be announced"]
                - ["Senior Nationals", "Open", "76th — Indore, Dec 2026–Jan 2027"]
                - ["3x3 Nationals", "Senior", "5th — Delhi, 29–31 Jan 2026"]
