                - ["3. Hockey India Nationals", "Sub Junior · Junior · Senior", "Divisions A/B/C with promotion and relegation"]
                - ["4. Core probables", "—", "Picked by the selection committee at Nationals, Hockey India-sanctioned all-India tournaments or <strong>through academies</strong>"]
                - ["5. National camp", "—", "Further assessment; <strong>only campers or core probables</strong> can be picked for tournaments"]
                - ["6. HIL", "—", "Every squad must carry at least <strong>3 Indian juniors</strong>"]
