# Australia — study abroad sheet (shape: _data/in/abroad_common.yml header). Read 2026-10-29 from the Department of Home Affairs.
id: australia
name: Australia
short: Australia
region: Oceania
currency: AUD
checked: 2026-10-29
review_by: 2027-01-29
status: caution
eyebrow: "Study abroad · Oceania"
title: "Study in Australia from India"
seo_title: "Study in Australia from India: Visa 500, AUD 29,710, 485"
description: "Australian Student visa (500) from India: AUD 2,500 fee, AUD 29,710 a year living funds, 48 hours a fortnight, new family rules from 2 Oct 2026, and 485 lengths for Indians."
lede: "Australia's Student visa (subclass 500) depends on a Confirmation of Enrolment (CoE), health cover (OSHC), English, money, and passing the Genuine Student test. Indian graduates get longer post-study work under the Australia–India trade agreement (AI-ECTA)."
alert:
  text: "From 2 October 2026, most Student visa applicants can no longer include partners or children, and family members cannot apply later as subsequent entrants. Applications lodged earlier keep the old rules."
  source: sv500
facts:
  - { label: "Visa fee", value: "From AUD 2,500", source: sv500 }
  - { label: "Living money", value: "AUD 29,710 a year (student)", source: sv500 }
  - { label: "Work in term", value: "48 hours a fortnight", source: sv500 }
  - { label: "After a master's (Indians)", value: "485 visa: 3 years under AI-ECTA", source: tg485 }
card:
  line: "CoE + OSHC + Genuine Student test; AI-ECTA post-study work"
  psw: "2–4 years (Indians, AI-ECTA)"
  work: "48 h/fortnight in term"
  funds: "AUD 29,710 a year + fees"
tests:
  - { exam: ielts, need: "Student visa: IELTS Academic or General 6.0 overall (5.5 with 10+ weeks ELICOS, 5.0 with 20+ weeks). 485 visa: 6.5 overall, 5.5 in each part", source: sv500 }
  - { exam: pte-academic, need: "Student visa: 47 (39 with 10+ weeks ELICOS). 485 visa: 55 overall", source: sv500 }
  - { exam: toefl-ibt, need: "Student visa: 67 (51 with 10+ weeks ELICOS); select 'Taking TOEFL for Australia' from 21 Jan 2026. 485 visa: 81", source: sv500 }
  - { exam: duolingo, need: "Not on Home Affairs' list of accepted visa tests; at-home tests are refused", source: sv500 }
# Official course searches / institution lists (rendered under "Intakes & courses"). Read 2026-10-29.
find:
  - { label: "Study Australia", by: "Australian Government", url: "https://www.studyaustralia.gov.au/", what: "The Australian Government site for international students: search courses, education providers and scholarships." }
pillars:
  language_and_eligibility:
    heading: "English for the visa (not only for the university)"
    parts:
      - table:
          caption: "Student visa minimum scores, tests taken on or after 7 August 2025"
          head: ["Test", "Main course alone", "With 10+ weeks ELICOS or a foundation", "With 20+ weeks ELICOS"]
          rows:
            - ["IELTS Academic / General Training", "6.0", "5.5", "5.0"]
            - ["PTE Academic", "47", "39", "31"]
            - ["TOEFL iBT", "67", "51", "37"]
            - ["LANGUAGECERT Academic", "61", "54", "46"]
            - ["OET", "1210", "1090", "1020"]
        source: sv500
      - points:
          - { t: "Tests must be taken within 2 years before you lodge the visa (Regular Evidence level).", source: sv500 }
          - { t: "Fully online, at-home tests are not accepted: IELTS Online, TOEFL iBT Home Edition, LANGUAGECERT Academic Online, OET@Home, CELPIP Online.", source: sv500 }
          - { t: "You are exempt if you completed at least 5 years' study in English in Australia, the UK, USA, Canada, New Zealand, South Africa or Ireland, or are enrolled in a postgraduate research course.", source: sv500 }
  intakes_and_streams:
    heading: "Courses and what the visa covers"
    parts:
      - points:
          - { t: "The visa lasts up to 6 years, in line with your enrolment, and can cover a package (for example ELICOS, then a bachelor's), with a CoE for each course.", source: sv500 }
          - { t: "Your provider must be on CRICOS and offer degree-level programmes if you want the post-study 485 visa later.", source: tg485 }
      - note: "Most universities start in February and July; some have more intakes. Dates are on each course page."
  tuition_and_living_costs:
    heading: "Money Home Affairs asks you to show"
    parts:
      - money:
          - { item: "Living costs, student", cur: AUD, amount: 29710, per: "year", source: sv500 }
          - { item: "Living costs, partner", cur: AUD, amount: 10394, per: "year", source: sv500 }
          - { item: "Living costs, each child", cur: AUD, amount: 4449, per: "year", source: sv500 }
          - { item: "Travel (applying from outside Africa)", cur: AUD, amount: 2000, per: "one time", source: sv500 }
          - { item: "Student visa fee", cur: AUD, amount: 2500, per: "application (from)", source: sv500 }
          - { item: "Temporary Graduate (485) visa fee", cur: AUD, amount: 5750, per: "main applicant", source: tg485 }
      - points:
          - { t: "Add one year of course fees (a multi-year fee is divided by the years), less anything already paid with a receipt or CoE.", source: sv500 }
          - { t: "Instead of savings you can show a parent's or partner's income of at least AUD 87,856 in the last 12 months (AUD 102,500 if family come with you).", source: sv500 }
          - { t: "For a loan, Home Affairs says the best evidence of genuine access is proof of disbursement.", source: sv500 }
  global_scholarships:
    heading: "Funding in Australia"
    parts:
      - points:
          - { t: "The Research Training Program (RTP) is the Australian Government's support for higher-degree-by-research students, through universities: fee offsets, stipends and allowances, with rates indexed every 1 January.", source: rtp }
          - { t: "Master's by research and PhD students on a Student visa have no work-hour limit.", source: sv500 }
      - note: "Coursework scholarships for Indian students are run by universities; apply through the university's scholarship page."
  application_funnel:
    heading: "From offer to visa"
    parts:
      - steps:
          - { title: "Offer and CoE", text: "Accept the offer and pay what the provider asks; you need a CoE for each course when you apply.", source: sv500 }
          - { title: "OSHC", text: "Buy Overseas Student Health Cover from an approved insurer for the whole stay; it must start the day you arrive.", source: sv500 }
          - { title: "Genuine Student answers", text: "Answer the questions in the online form in English, up to 150 words each, with evidence.", source: sv500 }
          - { title: "English and money", text: "Approved test within 2 years, and funds or income at the levels above.", source: sv500 }
          - { title: "Lodge and pay", text: "From AUD 2,500. Lodge well before the course: peak periods are slower.", source: sv500 }
  visa_chokepoints:
    heading: "The Student visa (500) in short"
    parts:
      - points:
          - { t: "Applications from outside Australia are processed under Ministerial Direction 115 if lodged on or after 14 November 2025 (Direction 111 before that).", source: sv500 }
          - { t: "From 2 October 2026, most applicants cannot include family members, and family cannot follow later as subsequent entrants.", source: sv500 }
          - { t: "You may be refused entry if you cannot prove health insurance on arrival.", source: sv500 }
  post_study_work:
    heading: "Work during and after your course"
    parts:
      - points:
          - { t: "Up to 48 hours a fortnight while the course is in session; master's by research and doctoral students have no limit.", source: sv500 }
          - { t: "Temporary Graduate visa (485), Post-Higher Education Work stream: apply within 6 months of finishing, aged 35 or under (exceptions apply), fee AUD 5,750.", source: tg485 }
          - { t: "Indian nationals (AI-ECTA): bachelor's 2 years, bachelor's with first-class honours in STEM incl. ICT 3 years, master's (coursework, extended or research) 3 years, PhD 4 years.", source: tg485 }
          - { t: "English for the 485 (tests from 7 Aug 2025): IELTS 6.5 overall with at least 5.5 in each part; PTE Academic 55; TOEFL iBT 81. IELTS One Skill Retake is accepted.", source: tg485 }
visa:
  slug: australia-student-visa-500
  name: "Australian Student visa (subclass 500)"
  short: "Visa 500"
  seo_title: "Australia Student Visa 500 from India: Funds, GS, OSHC"
  description: "Subclass 500 from India: CoE, OSHC, Genuine Student answers, AUD 29,710 living funds or AUD 87,856 parental income, English scores and the 2 Oct 2026 family rule."
  lede: "The 500 visa is decided on five things: your CoE, health cover, English evidence, money, and the Genuine Student answers. Get each one exactly right before you lodge."
  facts:
    - { label: "Fee", value: "From AUD 2,500", source: sv500 }
    - { label: "Stay", value: "Up to 6 years, in line with enrolment", source: sv500 }
    - { label: "Funds", value: "AUD 29,710 a year + fees + travel", source: sv500 }
    - { label: "Work", value: "48 hours a fortnight in session", source: sv500 }
  official:
    - { label: "Home Affairs — Student visa (500)", url: "https://immi.homeaffairs.gov.au/visas/getting-a-visa/visa-listing/student-500" }
    - { label: "Temporary Graduate visa (485)", url: "https://immi.homeaffairs.gov.au/visas/getting-a-visa/visa-listing/temporary-graduate-485/post-higher-education-work" }
  sections:
    - id: steps
      nav: Steps
      eyebrow: "Order of work"
      heading: "Step by step"
      parts:
        - steps:
            - { title: "CoE for every course", text: "Without a valid CoE the application is not valid and cannot be processed (some sponsored students give a letter instead).", source: sv500 }
            - { title: "OSHC from arrival", text: "Cover must run from the day you arrive (usually 1 week to 1 month before the course) until you leave.", source: sv500 }
            - { title: "English test (not at-home)", text: "Approved test within 2 years; TOEFL takers pick 'Taking TOEFL for Australia'.", source: sv500 }
            - { title: "Money or income", text: "Living costs, one year of fees and travel, or parental/partner income of AUD 87,856+.", source: sv500 }
            - { title: "Genuine Student answers", text: "150 words per question, in English, with evidence.", source: sv500 }
    - id: money
      nav: Money
      eyebrow: "Financial capacity"
      heading: "How Home Affairs counts your money"
      parts:
        - points:
            - { t: "Example 1: course fee AUD 50,000 for 3 years → AUD 16,666 a year to show.", source: sv500 }
            - { t: "Example 2: AUD 15,000 for 10 months with AUD 5,000 already paid → AUD 10,000.", source: sv500 }
            - { t: "School-age children add at least AUD 13,502 a year each.", source: sv500 }
            - { t: "Travel: AUD 2,000 if applying from outside Australia (outside Africa); AUD 1,000 if applying in Australia.", source: sv500 }
    - id: chokepoints
      nav: "Common problems"
      eyebrow: "Where files go wrong"
      heading: "Choke points to check twice"
      parts:
        - points:
            - { t: "An at-home English test, or a TOEFL taken between 26 July 2023 and 4 May 2024.", source: sv500 }
            - { t: "Loan funds shown as a sanction only: disbursement is the best evidence.", source: sv500 }
            - { t: "OSHC that starts after your arrival date.", source: sv500 }
            - { t: "Planning to bring family on a new application after 2 October 2026 without meeting an exemption.", source: sv500 }
doubts:
  - { q: "How much bank balance is needed for an Australian student visa?", a: "AUD 29,710 a year for the student, plus one year of course fees and AUD 2,000 for travel, or proof that a parent or partner earned at least AUD 87,856 in the last 12 months.", source: sv500 }
  - { q: "What IELTS score is needed for an Australia student visa?", a: "IELTS Academic or General Training 6.0 overall for the main course alone; 5.5 with at least 10 weeks of ELICOS and 5.0 with at least 20 weeks.", source: sv500 }
  - { q: "Can I take my spouse to Australia on a student visa?", a: "From 2 October 2026 most Student visa applicants cannot include partners or children unless they meet an exemption, and family cannot apply later as subsequent entrants.", source: sv500 }
  - { q: "How long is post-study work in Australia for Indian students?", a: "Under AI-ECTA: bachelor's 2 years (3 years with first-class honours in STEM including ICT), master's 3 years and PhD 4 years.", source: tg485 }
  - { q: "How many hours can students work in Australia?", a: "Up to 48 hours a fortnight while the course is in session. Master's by research and doctoral students have no limit.", source: sv500 }
  - { q: "Is the Duolingo English Test accepted for an Australian visa?", a: "No. Home Affairs lists the tests it accepts and does not take fully online tests taken at home.", source: sv500 }
sources:
  - { id: sv500, name: "Home Affairs — Student visa (subclass 500)", url: "https://immi.homeaffairs.gov.au/visas/getting-a-visa/visa-listing/student-500", covers: "Fee, funds, English, work, OSHC, 2 Oct 2026 rules", checked: 2026-10-29 }
  - { id: tg485, name: "Home Affairs — Temporary Graduate visa (485), Post-Higher Education Work stream", url: "https://immi.homeaffairs.gov.au/visas/getting-a-visa/visa-listing/temporary-graduate-485/post-higher-education-work", covers: "AI-ECTA lengths, age 35, AUD 5,750, English", checked: 2026-10-29 }
  - { id: rtp, name: "Department of Education — Research Training Program", url: "https://www.education.gov.au/research-block-grants/research-training-program", covers: "RTP fee offset and stipend", checked: 2026-10-29 }
