# Vermont (USA 50-state licensure portal, 2026-10-22). Schema: _data/us/state_index.yml. Boards tier: the
# licensing boards for lawyers, physicians, CPAs and nurses, copied from the national directories of state boards (NCBE,
# FSMB, NASBA, NCSBN). Diploma, state test, tuition, aid, jobs and apprenticeship blocks are still in the Phase 11 queue;
# the page prints only the blocks that exist.
name: "Vermont"
abbr: VT
checked: 2026-10-22
review_by: 2027-04-22
lede: "In Vermont, the Vermont Board of Bar Examiners (Office of Attorney Licensing) handles bar admission for lawyers, the Vermont Board of Medical Practice and Vermont Board of Osteopathic Physicians and Surgeons license physicians, the Vermont Board of Public Accountancy licenses CPAs and the Vermont State Board of Nursing licenses registered nurses."

boards:
  # 50-state portal (2026-10-22): bar admission agency (NCBE jurisdiction page), medical board(s) (FSMB directory),
  # board of accountancy (NASBA directory), board of nursing (NCSBN member page). Links checked 2026-10-22.
  law: { body: "Vermont Board of Bar Examiners (Office of Attorney Licensing)", url: "https://www.vermontjudiciary.org/attorneys/admission-vermont-bar", stat: "UBE", exam: "Uniform Bar Exam (MBE, MEE and MPT).", note: "MPRE required (passing score 80). NextGen UBE from July 2027.", src: ncbe_vt }
  medicine:
    src: fsmb_boards
    boards:
      - { body: "Vermont Board of Medical Practice", url: "https://www.healthvermont.gov/systems/medical-practice-board" }
      - { body: "Vermont Board of Osteopathic Physicians and Surgeons", url: "https://sos.vermont.gov/osteopathic-physicians/" }
  cpa:
    src: nasba_boards
    boards:
      - { body: "Vermont Board of Public Accountancy", url: "https://sos.vermont.gov/accountancy/" }
  nursing:
    src: ncsbn_vt
    boards:
      - { body: "Vermont State Board of Nursing", url: "https://sos.vermont.gov/nursing/" }
