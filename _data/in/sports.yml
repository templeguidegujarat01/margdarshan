      - { label: "Fake birth certificate", value: "<strong>2-year ban</strong>, then no age-group cricket", source: bcci-age }
      - { label: "IPL match fee", value: "<strong>₹7.5 lakh</strong> a match on top of the contract", source: ipl-regs }
    sections:
      - id: rules
        nav: "Formats &amp; ages"
        eyebrow: "Core rules &amp; selection formats"
        heading: "The three formats and the BCCI age-group ladder"
        parts:
          - table:
              caption: "International formats under the ICC men's playing conditions (2025)"
              head: ["Rule", "Test", "ODI", "T20I"]
              rows:
                - ["Length", "<strong>5 days</strong>, 6 hours a day, at least <strong>90 overs a day</strong>", "<strong>50 overs</strong> an innings", "<strong>20 overs</strong> an innings"]
                - ["Max overs per bowler", "No limit", "<strong>10</strong>", "<strong>4</strong>"]
                - ["Fielding restrictions", "None", "Overs 1–10: max 2 fielders outside the 30-yard circle · 11–40: max 4 · 41–50: max 5", "Overs 1–6 (powerplay): max 2 outside · after that: max 5"]
                - ["New ball", "Home board supplies approved balls", "Two new balls, one from each end, for overs 1–34; the fielding side then keeps one for the rest", "One ball"]
            source: "icc-test,icc-odi,icc-t20"
          - list:
              - "A match is two sides of <strong>eleven players</strong>; each captain names the 11 plus <strong>up to 4 substitute fielders</strong> to the match referee before the toss. <strong>Concussion replacements</strong> are allowed."
              - "By being nominated, a player agrees to the ICC's Code of Conduct, <strong>Anti-Doping Code</strong> and Anti-Corruption Code."
            source: icc-t20
          - table:
              caption: "Ball and bat limits (ICC Test playing conditions)"
              head: ["Item", "Limit"]
              rows:
                - ["Ball (new)", "<strong>155.9–163 g</strong>; circumference 22.4–22.9 cm"]
                - ["Bat length", "Not more than <strong>96.52 cm (38 in)</strong>; the handle no more than 52% of it"]
                - ["Blade", "<strong>Wood only</strong>; width ≤ 10.8 cm, depth ≤ 6.7 cm, edges ≤ 4.0 cm, and it must pass the bat gauge"]
            source: icc-test
          - table:
              caption: "BCCI domestic season 2026-27 — 1,788 matches"
              head: ["Level", "Men", "Women"]
              rows:
                - ["Senior", "Duleep Trophy (six zonal teams, from 23 Aug 2026) · Irani Cup (from 1 Oct) · <strong>Ranji Trophy</strong>: Elite Group of 32 teams in 4 groups + Plate Group of 6, played in two phases", "Senior competitions"]
                - ["U23", "<strong>Col. C.K. Nayudu Trophy</strong> (two phases; Winners vs Rest of India returns 1–4 Oct 2026) · Men's U23 State A Trophy, now <strong>T20</strong>", "U23 competitions"]
                - ["U19", "U19 tournaments incl. the <strong>Cooch Behar Trophy</strong> (Elite knockouts at Bengaluru and Mysuru)", "U19 competitions"]
                - ["U16 / U15", "<strong>Vijay Merchant Trophy (U16)</strong>, moved to November–January", "U15 competitions"]
            source: bcci-dom26
          - list:
              - "Only players aged <strong>14 to 16</strong> may register for the BCCI Under-16 tournament."
              - "In Under-19 cricket, if a birth was <strong>registered more than 2 years after the birth</strong>, the number of years the player may play BCCI U19 tournaments is restricted."
            source: bcci-age
      - id: recognition
        nav: "Recognition"
        eyebrow: "Institutional &amp; global recognition"
        heading: "Olympics 2028, Asian Games and the IPL"
        parts:
          - table:
              caption: "Cricket at the Los Angeles 2028 Olympics"
              head: ["Item", "Fact"]
              rows:
                - ["Format", "<strong>T20</strong>, men and women"]
                - ["Teams", "<strong>6 per gender</strong>; 90 athlete places each, so <strong>15-player squads</strong>"]
                - ["Dates", "12–29 July 2028; women's medal matches 20 July, men's 29 July"]
                - ["Venue", "The Fairgrounds, Pomona, about 50 km from downtown Los Angeles"]
                - ["History", "Cricket's second Olympic appearance, 128 years after Paris 1900"]
            source: icc-la28
          - p: "At the <strong>Asian Games 2026</strong> in Nagoya, India's women won back-to-back gold, beating Sri Lanka by <strong>147 runs</strong> in the final — India's first gold of those Games."
            source: bcci-ag26
          - table:
              caption: "IPL player regulations 2025-27"
              head: ["Rule", "What it says"]
              rows:
                - ["Retentions", "Up to <strong>6</strong> players by retention or Right to Match — at most 5 capped and 2 uncapped"]
                - ["Auction purse", "<strong>₹120 crore</strong> for IPL 2025"]
                - ["Total salary cap", "₹146 crore (2025) · ₹151 crore (2026) · ₹157 crore (2027), counting purse, performance pay and match fees"]
                - ["Match fee", "<strong>₹7.5 lakh</strong> per match to each playing member, including the Impact Player"]
                - ["Uncapped status", "A capped Indian becomes uncapped if he has not been in a starting XI in Tests, ODIs or T20Is in the last <strong>5 calendar years</strong>, or has no BCCI central contract"]
            source: ipl-regs
          - warn: "The Ministry's cash-award scheme pays for medals at the <strong>Olympic, Asian and Commonwealth Games</strong> in all disciplines, but its sport-by-sport list of world championships has <strong>no ICC event</strong> — only the Blind Cricket World Cup in the para section."
            source: myas-cash
      - id: eligibility
        nav: "Fitness &amp; anti-doping"
        eyebrow: "Physical benchmarks &amp; anti-doping"
        heading: "How the BCCI tests fitness and clears injured players"
        parts:
          - list:
              - "Contracted and <strong>targeted</strong> players go through <strong>pre-season screening</strong> at the BCCI Centre of Excellence — fitness assessments and field tests, including the <strong>Bronco Test</strong>."
              - "Every session is logged on the <strong>Athlete Management System</strong>, with GPS used to track activity and workloads."
              - "Each fast bowler — contracted, targeted and Under-19 — has an <strong>individual weekly workload range</strong>."
              - "An injured player returns only after meeting the fitness <strong>benchmark</strong> and playing <strong>two return-to-play matches</strong>; the CoE sends fitness reports to the selectors."
            source: bcci-coe
          - list:
              - "Keep to the anti-doping rules: be available for testing, check every medicine against the <strong>Prohibited List</strong> and get a <strong>TUE</strong> when no permitted treatment exists."
            source: nada-rr
          - note: "Cricket is not one of the 27 SAI Training Centre disciplines, so SAI's battery of entry tests does not apply — selection runs through state associations and BCCI tournaments."
            source: sai-schemes
      - id: roadmap
        nav: "Roadmap"
        eyebrow: "Grassroots-to-elite roadmap"
        heading: "From the U16 trophy to India colours"
