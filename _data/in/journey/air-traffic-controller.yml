# Journey Blueprint — Air Traffic Controller (AAI Junior Executive – ATC). Printed on journey-air-traffic-controller.html (_includes/journey-doubts.html).
# Rules, classes and the money items / sources several careers share: _data/in/journey_common.yml.
# `money_defs` / `sources` below are used only by this career. Check: node scripts/check-journey-matrix.mjs
id: air-traffic-controller
v: 2
name: "Air Traffic Controller (AAI Junior Executive – ATC)"
search: ["air traffic controller", "air traffic control", "atc officer", "junior executive air traffic control", "aai atc"]
page: "air-traffic-controller.html"
roadmap: "roadmaps/air-traffic-controller.html"
doubts_page: "journey-air-traffic-controller.html"
gate: "Physics and Mathematics in Class 12 → a full-time 3-year B.Sc with Physics and Mathematics, or a B.E. / B.Tech in any branch with Physics and Maths in the course → Airports Authority of India's Junior Executive (ATC) exam, age up to 27 → voice test, psychological assessment and medical → paid training, with ICAO English level 4 required."
gate_source: aai-atc
core:
  what:
    text: "Air traffic controllers keep aircraft safely apart in the air and on the ground. In India the Airports Authority of India (AAI), a Mini Ratna public sector enterprise that manages civil aviation infrastructure and airspace, recruits them as Junior Executives (Air Traffic Control)."
    source: aai-atc
  day:
    - "Talk to pilots by radio and give clearances for take-off, landing and routes."
    - "Watch radar and traffic, and keep safe distances between aircraft."
    - "Work in shifts — airports run day and night."
  pay:
    - { level: "Junior Executive (ATC), Group B, E-1 (Advt 02/2025/CHQ)", value: "₹40,000 – 3% – ₹1,40,000 · about ₹13 lakh a year cost to company", source: aai-atc }
  routes:
    - { title: "B.Sc with Physics and Mathematics", text: "A full-time regular 3-year B.Sc with Physics and Mathematics.", source: aai-atc }
    - { title: "B.E. / B.Tech", text: "A full-time regular engineering degree in any discipline, with Physics and Mathematics in any one semester.", source: aai-atc }
    - { title: "AAI recruitment", text: "Advt 02/2025/CHQ: 309 Junior Executive (ATC) posts. Computer-based test → application verification, voice test, psychoactive substances test, psychological assessment and medical.", source: aai-atc }
  cost_time:
    - { label: "AAI application fee", value: "₹1,000 · SC, ST, PwD, women and AAI apprentices exempt", source: aai-atc }
    - { label: "Age", value: "Up to 27 (+5 SC / ST, +3 OBC-NCL, +10 PwBD)", source: aai-atc }
    - { label: "Training bond", value: "₹7 lakh surety bond to serve AAI until 3 years after training", source: aai-atc }
  cost_note: "Training is paid by AAI: trainees get basic pay and allowances."
  challenges:
    - text: "You must reach <strong>ICAO English proficiency level 4</strong> during training, or your services can be terminated."
      source: aai-atc
    - text: "A ₹7 lakh surety bond ties you to AAI until 3 years after training, and you can be posted anywhere in India."
      source: aai-atc
    - text: "Selection checks more than marks: a voice test, a psychoactive substances test, a psychological assessment and a medical."
      source: aai-atc
  not_for:
    - "You freeze under pressure — controllers decide in seconds."
    - "You dislike night shifts and rotating rosters."
    - "Your spoken English is weak and you will not work on it."
journey:
  - stages: [c8, c9]
    title: "English, Physics and Maths"
    do:
      - text: "You need spoken and written English at 10+2 level — English must be a subject in Class 10 or 12."
        source: aai-atc
    doubts:
      - q: "What does an air traffic controller do?"
        a: "Keeps aircraft safely apart in the air and on the ground. In India the Airports Authority of India manages airspace and recruits controllers as Junior Executives (ATC)."
        next: "Read the Routes list above."
        source: aai-atc
      - q: "Is English important for air traffic control?"
        a: "Very. AAI asks for 10+2-level spoken and written English (English as a subject in Class 10 or 12), and you must reach ICAO English level 4 during training."
        next: "Practise speaking English every day."
        source: aai-atc
  - stages: [c10]
    title: "Take PCM"
    do:
      - text: "The degree must include Physics and Mathematics, so take PCM in Class 11."
        source: aai-atc
    stream: "Science with Physics and Mathematics (PCM)."
    mistakes:
      - "Dropping Maths or Physics — the B.Sc route needs both."
    doubts:
      - q: "Which stream do I need for air traffic control?"
        a: "Science with Physics and Mathematics, because AAI asks for a B.Sc with Physics and Mathematics, or an engineering degree with both in the course."
        next: "Choose PCM in Class 11."
        source: aai-atc
  - stages: [c11, c12]
    title: "Plan a B.Sc (PM) or B.Tech"
    do:
      - text: "Plan a full-time B.Sc with Physics and Mathematics, or a B.E. / B.Tech through JEE Main or your state CET."
        source: [aai-atc, jm-ib]
    exams:
      - { name: "JEE Main 2026", when: "Session 1: 21–30 Jan · Session 2: 2–9 Apr 2026", source: jm-ib }
    money: [csss]
    doubts:
      - q: "Can I become an air traffic controller right after Class 12?"
        a: "No. AAI asks for a full-time regular B.Sc with Physics and Mathematics, or a B.E. / B.Tech in any discipline."
        next: "Plan your degree first."
        source: aai-atc
      - q: "Is a B.Sc enough for ATC, or do I need B.Tech?"
        a: "A full-time regular 3-year B.Sc with Physics and Mathematics is enough; an engineering degree in any branch also works if Physics and Maths were in a semester."
        next: "Pick the degree you can do well in."
        source: aai-atc
  - stages: [ug]
    title: "In college"
    do:
      - text: "Final-year students may apply, but must have the final result by application verification."
        source: aai-atc
    doubts:
      - q: "Can I apply for AAI ATC in my final year?"
        a: "Yes. Final-semester / final-year students on the cut-off date may apply, but must have the final result by application verification."
        next: "Make sure your result comes out in time."
        source: aai-atc
      - q: "Does a distance-learning B.Sc count for ATC?"
        a: "No. AAI asks for a full-time regular degree."
        next: "Join a regular college."
        source: aai-atc
      - q: "Does any engineering branch work for ATC?"
        a: "Yes — any discipline, as long as Physics and Mathematics were subjects in any one semester."
        next: "Keep the marksheet that shows those subjects."
        source: aai-atc
  - stages: [grad]
    title: "AAI exam, tests and training"
    do:
      - text: "The computer-based test has no negative marking; shortlisted candidates then face application verification, the voice test, a psychoactive substances test, psychological assessment and medical."
        source: aai-atc
    money: [aai-fee]
    doubts:
      - q: "Is there negative marking in the AAI ATC exam?"
        a: "No. AAI's advertisement says there is no negative marking for wrong answers in the computer-based test."
        next: "Attempt every question."
        source: aai-atc
      - q: "What is the age limit for AAI ATC?"
        a: "27 years on the cut-off date, relaxed by 5 years for SC / ST, 3 for OBC (non-creamy layer) and 10 for PwBD."
        next: "Check the cut-off date in each new notice."
        source: aai-atc
      - q: "What is the ATC training bond?"
        a: "Selected candidates sign a ₹7 lakh surety bond to serve AAI until 3 years after completing training; you get basic pay and allowances during training."
        next: "Read the bond terms before joining."
        source: aai-atc
      - q: "What is ICAO level 4?"
        a: "The minimum 'operational' English proficiency level that controllers need for a licence or rating. If you cannot reach level 4 during training, your services can be terminated."
        next: "Work on aviation English during training."
        source: aai-atc
      - q: "How many ATC posts were there?"
        a: "AAI's Advt 02/2025/CHQ had 309 Junior Executive (ATC) posts; numbers change with each advertisement."
        next: "Watch aai.aero for the next notice."
        source: aai-atc
      - q: "Who pays no fee for the AAI ATC exam?"
        a: "SC, ST and PwD candidates, women, and apprentices who completed one year of apprenticeship training in AAI. Everyone else pays ₹1,000."
        next: "Choose your category correctly in the form."
        source: aai-atc
  - stages: [work]
    title: "Postings"
    do:
      - text: "Selected candidates can be posted anywhere in India."
        source: aai-atc
    doubts:
      - q: "Is an AAI ATC job transferable?"
        a: "Yes. Selected candidates are liable to be posted anywhere in India."
        next: "Be ready to move for your first posting."
        source: aai-atc
board_note: "Any board works. English must be a subject in Class 10 or 12, and Physics and Mathematics are needed for the degree."
board_source: aai-atc
