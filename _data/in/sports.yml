          - p: "Indian players also reach FIBA youth events through 3x3: Aahana George, Aanaya Bhavsar and Gunjan Mantri were picked for the <strong>FIBA 3x3 U18 World Cup 2024</strong> in Hungary."
            source: air-3x3
      - id: academies
        nav: "Centres"
        eyebrow: "Top elite academies &amp; cities"
        heading: "Where basketball players train in the SAI system"
        parts:
          - warn: "<strong>None of SAI's 23 National Centres of Excellence lists basketball.</strong> Basketball training in the SAI system runs through SAI Training Centres, STC extension centres in schools and colleges, and SAI-adopted schools."
            source: sai-schemes
          - table:
              caption: "SAI schemes that include basketball"
              head: ["Scheme", "Who it is for"]
              rows:
                - ["SAI Training Centre (STC)", "Ages 12–18, residential, in State-built infrastructure with SAI coaches"]
                - ["STC extension centre", "Non-residential training in schools and colleges with a record of national players"]
                - ["NSTC regular schools", "Schools SAI adopts so children can study and play in the same school"]
            source: sai-schemes
      - id: costs
        nav: "Gear &amp; cost"
        eyebrow: "Equipment costs &amp; who pays"
        heading: "Shoes, balls and who pays the bills"
        parts:
          - list:
              - "A player's own kit is mainly court shoes and training balls of the right size — <strong>size 7</strong> for men, <strong>size 6</strong> for women, size 5 for mini-basketball. Player equipment must not endanger other players; protective gear must be suitably padded."
            source: "fiba-eq26,fiba-obr26"
          - note: "Education Margdarshan does not print shop prices — no governing body publishes them."
          - table:
              caption: "Who pays — basketball ladder"
              head: ["Stage", "Paid by", "What you get"]
              rows:
                - ["NSTC school / extension-centre trainee", "Sports Authority of India", "Coaching while you study"]
                - ["SAI Training Centre trainee", "Sports Authority of India", "Coaching, boarding, sports science, diet"]
                - ["Khelo India athlete", "Ministry of Youth Affairs &amp; Sports", "<strong>₹6.28 lakh a year</strong> incl. ₹1.20 lakh cash"]
                - ["Athlete in hardship", "PDU National Welfare Fund", "Up to ₹2.50 lakh"]
            source: "sai-schemes,pib-support"
          - list:
              - "No supplement is 100% safe and <strong>strict liability</strong> applies — food first, with a certified nutritionist."
            source: nada-supp
      - id: earnings
        nav: "Earnings &amp; jobs"
        eyebrow: "Earning channels &amp; central job quotas"
        heading: "Awards, pension and sports-quota jobs"
        parts:
          - list:
              - "Basketball is one of the <strong>65 sports</strong> in the central sports quota for <strong>Group C</strong> posts, with up to 5 years' age relaxation (10 for SC/ST)."
              - "Team sports count too: State medallists (up to 3rd) at Senior or Junior Nationals or the National Games are in the second order of preference after those who represented India."
              - "These central instructions do not apply to Railways Services, the Department of Atomic Energy, the Department of Space and some DRDO technical services."
            source: "dopt-2022,dopt-2024"
          - list:
              - "Medals at the <strong>Khelo India Youth Games (above-18 category)</strong>, Junior Nationals and SGFI school games now count for central sports-quota jobs."
            source: dopt-2024
          - list:
              - "<strong>Pension to Meritorious Sportspersons</strong>: ₹12,000–20,000 a month after retirement."
            source: pib-support
      - id: traps
        nav: "Red flags"
        eyebrow: "Disqualification traps"
        heading: "Mistakes that cost a player the game"
        parts:
          - list:
              - "<strong>Playing to the old rules</strong> — since 1 October 2026 there is no unsportsmanlike foul; two flagrant fouls, two category-1 technicals or one of each end your game."
              - "<strong>Five personal fouls</strong> — you are out of the game."
            source: "fiba-chg26,fiba-obr26"
          - list:
              - "<strong>Expecting an NCOE seat</strong> — basketball has none; aim for an STC or a SAI-adopted school instead."
              - "<strong>Age fraud or misconduct</strong> — grounds for weeding a player out of SAI centres."
            source: sai-schemes
