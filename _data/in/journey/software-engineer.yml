# Journey Blueprint — Software Engineer (B.Tech CSE / BCA → MCA). Printed on journey-software-engineer.html (_includes/journey-doubts.html).
# Rules, classes and the money items / sources several careers share: _data/in/journey_common.yml.
# `money_defs` / `sources` below are used only by this career. Check: node scripts/check-journey-matrix.mjs
id: software-engineer
name: "Software Engineer (B.Tech CSE / BCA → MCA)"
search: ["software engineer", "software developer", "backend developer", "frontend developer", "full stack developer", "full-stack developer", "application developer"]
page: "software-engineer.html"
roadmap: "roadmaps/software-engineer.html"
gate: "Class 12 with Physics and Mathematics → JEE Main (or your state's own merit route) → 4-year B.E./B.Tech in Computer Science or IT → campus or off-campus hiring. Or a BCA / B.Sc followed by an MCA."
gate_source: [jm-ib, tac-ib]
foundation:
  - stages: [c8, c9]
    title: "Mathematics is the real filter"
    points:
      - text: "JEE Main Paper 1 is <strong>Mathematics, Physics and Chemistry — 100 marks each</strong>, 75 questions in 3 hours. Strong school algebra, geometry and arithmetic now make Class 11–12 far easier."
        source: jm-ib
      - text: "Try a beginner coding course or your school's computer lab projects — it tells you early whether you enjoy building software. No exam on this path tests coding before college."
  - stages: [c10]
    title: "Choose Science with Mathematics for Class 11"
    points:
      - text: "For B.E./B.Tech at NITs, IIITs and other NIT+ institutes, Class 12 must include <strong>Physics and Mathematics</strong>, a language, one of Chemistry / Biotechnology / Biology / a technical vocational subject, and one more subject."
        source: jm-ib
      - text: "Without Mathematics in Class 12, the B.Tech door closes; a BCA → MCA route may still be open — check each college's rule."
  - stages: [c11, c12]
    title: "JEE Main year — and protect your board percentage"
    points:
      - text: "For NIT+ seats through JoSAA you also need <strong>75% in Class 12</strong> (65% for SC, ST, PwD) — or a place in the top 20 percentile of your own board, category-wise."
        source: jm-ib
      - text: "You can sit JEE Main in your Class 12 year and the two years after it, with two sessions each year. The bulletin sets <strong>no age limit</strong>."
        source: jm-ib
      - text: "Your <strong>state code of eligibility</strong> is the state where you pass Class 12 — not your home town. It decides your Home State quota at NITs."
        source: [jm-ib, josaa-br]
  - stages: [ug, grad]
    title: "Already in college? BCA / B.Sc → MCA"
    points:
      - text: "In Uttar Pradesh's 2026-27 counselling, MCA admits BCA, B.Sc (CS/IT) or B.Tech (CSE/IT) graduates — or any graduate who had Mathematics at 10+2 or in the degree — with 50% (45% for SC/ST). Other states set similar rules; read your state's brochure."
        source: tac-ib
      - text: "Whatever the degree, employers test data structures, algorithms and problem solving in their own hiring rounds. Build projects and practise those from year one."
board_notes:
  gseb:
    text: "For Gujarat state-quota B.E. seats, ACPC merit is <strong>50% your HSC theory percentile</strong> in Mathematics, Physics and Chemistry + <strong>50% your GUJCET percentile</strong> — your board theory marks count directly. HSC needs 45% (40% reserved)."
    source: acpc-advt
  cbse-gj:
    text: "Schooling at a Gujarat-located school plus a GUJCET attempt opens ACPC's state-quota seats; your CBSE Class XII theory percentile goes into the same 50:50 merit formula."
    source: acpc-advt
  upmsp:
    text: "UPTAC fills B.Tech seats on your <strong>JEE Main</strong> rank. Passing Intermediate from an institution in UP makes you eligible for the regular rounds; you need 45% (40% SC/ST) in the required subjects taken together."
    source: tac-ib
  msbshse:
    text: "Passing SSC and HSC from Maharashtra (and being domiciled or born there) makes you a <strong>Type A</strong> Maharashtra candidate. MHT-CET is compulsory for Maharashtra-candidature B.E./B.Tech seats; its paper comes in English, Marathi or Urdu."
    source: mht-ib
  wb:
    text: "West Bengal domicile — 10 years' continuous residence as of 31.12.2025, or a parent who is a permanent resident — is needed for government-aided college seats and every reserved seat in WBJEEB counselling."
    source: wb-ib
  cbse: "JEE Main is the same paper for every board. Your board's own top-20-percentile list is the backup to the 75% rule for NIT+ seats."
  other: "JEE Main is offered in 13 languages, including Hindi, Bengali, Gujarati, Marathi, Tamil and Telugu. Your board's top-20-percentile list is the backup to the 75% rule."
board_source: jm-ib
exam:
  name: "JEE Main 2026 (Paper 1) → JoSAA / state counselling"
  body: "National Testing Agency (NTA) · JoSAA · state admission bodies"
  href: "jee-main.html"
  facts:
    - { label: "Paper 1", value: "75 questions · 300 marks · 3 hours", source: jm-ib }
    - { label: "Marking", value: "+4 correct · −1 wrong (MCQ and numerical)", source: jm-ib }
    - { label: "Fee per session", value: "₹1,000 General male · ₹800 female · ₹500 SC/ST/PwD", source: jm-ib }
    - { label: "Sessions (2026)", value: "21–30 Jan and 2–9 Apr 2026", source: jm-ib }
  stages:
    head: ["Stage", "What it is", "Marking", "Rule"]
    rows:
      - ["JEE Main Paper 1", "Maths, Physics, Chemistry: 20 MCQs + 5 numerical questions each", "+4 / −1 in both sections", "Ties go to Maths, then Physics, then Chemistry NTA score"]
      - ["JEE Advanced (for IITs)", "Separate exam by the IITs", "—", "Top 2,50,000 Paper 1 candidates become eligible"]
      - ["JoSAA / CSAB", "Seat allotment at NITs, IIITs, IIEST and other GFTIs", "—", "75% in Class 12 (65% SC/ST/PwD) or top 20 percentile of your board"]
      - ["State counselling", "ACPC (Gujarat), UPTAC (UP), CAP (Maharashtra), WBJEEB (West Bengal)", "—", "Each state's own merit and domicile rules — see the State rules section of this career's blueprint"]
    source: jm-ib
  notes:
    - text: "Central reservation on JEE Main seats: SC 15%, ST 7.5%, OBC-NCL 27%, Gen-EWS 10%, and 5% horizontal for PwD inside each."
      source: jm-ib
    - text: "JoSAA seat acceptance fee: ₹15,000 for SC, ST and PwD, ₹30,000 for everyone else — it includes ₹5,000 processing charges and the rest goes towards the institute fee."
      source: josaa-br
    - text: "These are the 2026 rules. NTA publishes the JEE Main 2027 bulletin on jeemain.nta.nic.in — check dates, fees and pattern there the day it is out."
state_rules:
  - state: gujarat
    text: "ACPC fills <strong>95% of Govt / Grant-in-Aid and 50% of unaided seats</strong> with Gujarat-schooled GUJCET candidates; <strong>5% of Govt / GIA seats</strong> go on JEE Main rank to candidates from any board in India."
    source: acpc-advt
  - state: uttar-pradesh
    text: "Government and aided institutes fill 100% of first-year seats through UPTAC; private colleges fill 85% through UPTAC and 15% through management / NRI quota. Without a UP qualifying exam or a UP-domiciled parent, you are considered only in the special round."
    source: tac-ib
  - state: maharashtra
    text: "CAP reserves 60% of seats vertically for Maharashtra candidates — SC 13%, ST 7%, VJ/NT 11%, OBC 19%, SEBC 10% — plus 10% EWS over the intake and 30% for women. Candidature Types A–E decide who counts as a Maharashtra candidate."
    source: [cap-ib, mht-ib]
  - state: west-bengal
    text: "Reservation for SC, ST, OBC-A, OBC-B, PwD, TFW and EWS in WBJEEB counselling is only for candidates domiciled in West Bengal. Domicile also decides 90% of Jadavpur University's general seats."
    source: wb-ib
  - text: "NIT, IIEST Shibpur and PEC Chandigarh seats are split into a <strong>Home State</strong> and an <strong>Other States</strong> quota; Home State is where you passed Class 12. Extra supernumerary seats lift female enrolment at NITs to at least 20%."
    source: josaa-br
