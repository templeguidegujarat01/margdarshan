# USA Edition — the 14 Career Clusters (hubs) of the National Career Clusters® Framework, modernized by
# Advance CTE in 2024 (careertech.org/career-clusters). India groups careers by stream (Science, Commerce,
# Arts…); U.S. schools group them by Career Cluster, so the USA Home and us/clusters/ use these 14 hubs.
#
# Every name, definition, sub-cluster, example program of study and "closely connected" cluster below is
# copied from the cluster's own careertech.org page (source id acte_<slug>, read 2026-10-20). `summary` is the
# first sentence of that definition and `line` the first sentence of each sub-cluster description, unchanged.
#
#   slug           URL us/clusters/<slug>/ (same slug as careertech.org/career-clusters/<slug>/)
#   phase          Master Plan phase that builds this cluster's careers (docs/us-edition/ARCHITECTURE.md)
#   live           true once the hub page us/clusters/<slug>/ exists (scripts/build-us-clusters.mjs writes it).
#                  Only then do the USA Home and the clusters index link to it; otherwise the card says "Next".
#   cross_cutting  Advance CTE: one of the three Cross-Cutting Clusters (skills used in every other cluster)
#   connected      clusters the page calls "most closely connected" (from national labor market data)
#   sub_clusters   name (as on the page) · xw (the crosswalk's spelling, when it differs) · line · programs
#                  (Advance CTE: example programs of study are illustrative and vary by state)
#   careers        career pages on this site that sit in this cluster (the hub's career matrix):
#                    pathway: <slug>   _data/us/pathways.yml  → us/careers/<slug>/ (SOC from its lead occupation)
#                    trade: <slug>     _data/us/cte_careers.yml → us/cte/<slug>.html (soc: given here)
#                    career: <slug>    _data/us/careers/<cluster>.yml → us/careers/<slug>/ (Phase 2 onward)
#                  sub   = the sub-cluster Advance CTE's SOC crosswalk gives that SOC in this cluster.
#                  also  = other clusters the crosswalk also places that SOC in (shown on those hubs as
#                          "Also in this cluster"). Each career is listed once, under the cluster with the most
#                          crosswalk rows for its SOC(s); tie: true marks a tie, placed by the field's main industry.
# The SOC → cluster mapping is checked against scripts/data/acte-soc-crosswalk.json (Advance CTE's official
# "SOC – Career Clusters Crosswalk", written by scripts/build-us-clusters.mjs --crosswalk <xlsx>).
# Checked by scripts/check-us-data.mjs; stubs written by scripts/build-us-clusters.mjs.
#
# Notes from the sources (2026-10-20): the crosswalk lists no SOC code for "Unmanned Vehicle Technology"
# (Digital Technology) and spells four sub-clusters differently (see xw). The framework page says "five
# Cluster Groupings" but names six; groupings are not used on this site.
checked: 2026-10-20
review_by: 2027-04-20
framework:
  name: "National Career Clusters® Framework"
  steward: "Advance CTE"
  version: "Modernized framework, released 2024"
  clusters: 14
  sub_clusters: 72
  cross_cutting: 3
  intro: "The Career Clusters Framework serves as the foundation for designing consistent, high-quality Career Technical Education (CTE) and career pathway programs."
  source: acte_framework
  used_by: "First introduced in 2002, a version of the Framework is used by the majority of states with Advance CTE as its steward."
  used_by_source: acte_crosswalk
  # "Structure Definitions" on the framework page, word for word.
  terms:
    - term: "Clusters"
      text: "Industry sectors as defined by groupings from Standard Occupational Classification (SOC) and North American Industry Classification System (NAICS) codes."
    - term: "Sub-Clusters"
      text: "Major groupings of career areas within a given field that have similar skills as defined by industry area."
    - term: "Cross-Cutting Clusters"
      text: "Clusters that are based on both sector-specific and contextualized functions instead of purely discrete industry sectors. These Clusters have both Sub-Clusters and implications for courses taken in all other Career Clusters."
  programs_note: "Examples intended to show potential alignment with currently existing state or local secondary or postsecondary programs of study and provide inspiration for the expansion and innovation of future programs."
clusters:
  - slug: healthcare-human-services
    name: "Healthcare & Human Services"
    phase: 2
    live: true
    summary: "The Healthcare & Human Services Career Cluster promotes whole health in individuals and communities through a diverse array of services."
    definition: "The Healthcare & Human Services Career Cluster promotes whole health in individuals and communities through a diverse array of services. This sector includes technical, mental, and therapeutic services and personal care, supported by medical and social sciences. By addressing social determinants of health and leveraging health data and science, this Cluster aims to enhance the overall health and resilience of individuals, families, and communities."
    source: acte_healthcare_human_services
    connected: [advanced-manufacturing, education, financial-services, hospitality-events-tourism, public-service-safety]
    sub_clusters:
      - name: "Behavioral & Mental Health"
        line: "Careers dedicated to mental and emotional well-being, including counseling, psychology, and psychiatric services aimed at supporting individuals through mental health challenges and promoting psychological health."
        programs: ["Counseling & Mental Health Services"]
      - name: "Biotechnology Research & Development"
        line: "Careers focused on research and development in the medical field, including biotechnology, and scientific research."
        programs: ["Biomedical Science", "Biotechnology Research & Development"]
      - name: "Community & Social Services"
        line: "Careers that address the societal and environmental factors affecting health such as access to healthy foods, income and poverty, adequate child care, and access to education."
        programs: ["Community Health", "Human Services", "Social Work"]
      - name: "Health Data & Administration"
        line: "Careers centered on the management, analysis, and administration of health information and data."
        programs: ["Health Informatics", "Medical Assisting", "Medical Record Keeping"]
      - name: "Personal Care Services"
        line: "Careers that encompass in-home and personal care support and offer esthetics and wellness services such as hairdressing, nail care, skincare, fitness, and massage therapy."
        programs: ["Barbering", "Cosmetology", "Massage & Spa Services"]
      - name: "Physical Health"
        line: "Careers in healthcare that directly affect the physical well-being of individuals by providing medical care, conducting diagnostics, offering therapeutic services, administering pharmaceuticals, and supporting nutrition and dental health."
        programs: ["Allied Health", "Nursing", "Pharmacy Tech", "Physical Therapy", "Radiology", "Sports Medicine"]
    # Ordered by BLS 2025 employment (Phase 2 batch 1, 2026-10-20); dentistry and psychology follow until their batch
    careers:
      - { career: home-health-aide, sub: "Personal Care Services" }
      - { pathway: nursing, sub: "Physical Health" }
      - { career: nursing-assistant, sub: "Physical Health" }
      - { pathway: medicine, sub: "Physical Health" }
      - { career: medical-assistant, sub: "Health Data & Administration" }
      - { career: social-worker, sub: "Community & Social Services", also: [education] }
      - { career: licensed-practical-nurse, sub: "Physical Health" }
      - { career: mental-health-counselor, sub: "Behavioral & Mental Health" }
      - { career: pharmacy-technician, sub: "Physical Health" }
      - { career: social-human-service-assistant, sub: "Community & Social Services" }
      - { career: nurse-practitioner, sub: "Physical Health" }
      - { career: dental-assistant, sub: "Physical Health" }
      - { career: clinical-lab-technologist, sub: "Physical Health" }
      - { pathway: pharmacy, sub: "Physical Health" }
      - { career: emt-paramedic, sub: "Physical Health" }
      - { pathway: physical-therapy, sub: "Physical Health" }
      - { pathway: dentistry, sub: "Physical Health" }
      - { pathway: psychology, sub: "Behavioral & Mental Health", also: [management-entrepreneurship, education] }
  - slug: digital-technology
    name: "Digital Technology"
    phase: 3
    live: true
    cross_cutting: true
    summary: "The Digital Technology Career Cluster focuses on developing digital systems for communication and data storage using critical technologies such as artificial intelligence (AI), data analytics, and cybersecurity."
    definition: "The Digital Technology Career Cluster focuses on developing digital systems for communication and data storage using critical technologies such as artificial intelligence (AI), data analytics, and cybersecurity. This Cluster builds skills necessary for all careers to navigate and lead in the constantly evolving tech landscape and drives innovation across all industries to tackle complex challenges and opportunities in communities and economies. This Career Cluster is also a Cross-Cutting Cluster as the skills gained through this Career Clusters area are applicable across all Career Clusters. Practitioners are encouraged to combine content from this Cluster across other CTE programs."
    source: acte_digital_technology
    connected: []
    sub_clusters:
      - name: "Data Science & Artificial Intelligence"
        xw: "Data Science & AI"
        line: "Careers combining the power of data analysis, machine learning, and artificial intelligence (AI), including key processes such as data modeling and natural language processing."
        programs: ["Applied Data Science & Analytics"]
      - name: "Information Technology (IT) Support & Services"
        xw: "IT Support & Services"
        line: "Careers focused on providing setup, assistance, and problem-solving solutions for software, hardware, and other technology-related issues to ensure smooth and efficient operation of communication and data systems for individuals and organizations."
        programs: ["Information Support & Services"]
      - name: "Network Systems & Cybersecurity"
        line: "Careers focused on establishing and managing communication networks and protecting them against cyber threats."
        programs: ["Computer Networking", "Cybersecurity", "IT Systems"]
      - name: "Software Solutions"
        line: "Careers involved in the development and maintenance of software solutions, built on computer science and encompassing programming, application development, and front-end and back-end software development."
        programs: ["App Design", "Computer Simulation", "Game Development", "Programming"]
      - name: "Unmanned Vehicle Technology"
        line: "Careers related to the development, operation, and use of unmanned vehicles, such as unmanned aerial vehicles, drones, and autonomous ground vehicles, across various sectors."
        programs: ["Drone Technology", "Unmanned Aircraft Systems"]
      - name: "Web & Cloud"
        line: "Careers focused on creating and managing websites and web applications, including front-end and back-end development and maintenance, as well as overseeing cloud services and infrastructure."
        programs: ["Cloud Computing", "Web & Digital Communications", "Web Development"]
    # Phase 3 batch 1: ordered by the BLS 2025 employment of each career's occupation (docs/us-edition/PHASE-3-DIGITAL-FINANCE.md).
    careers:
      - { pathway: computer-science, sub: "Software Solutions", also: [arts-entertainment-design] }
      - { pathway: software-engineering, sub: "Software Solutions", also: [arts-entertainment-design] }
      - { career: computer-support-specialist, sub: "Information Technology (IT) Support & Services", also: [healthcare-human-services] }
      - { career: computer-systems-analyst, sub: "Network Systems & Cybersecurity" }
      - { career: network-administrator, sub: "Network Systems & Cybersecurity" }
      - { pathway: data-science, sub: "Data Science & Artificial Intelligence", also: [financial-services, marketing-sales], tie: true }
      - { career: web-developer, sub: "Web & Cloud", also: [arts-entertainment-design], tie: true }
      - { pathway: cybersecurity, sub: "Network Systems & Cybersecurity" }
      - { pathway: computer-engineering, sub: "Information Technology (IT) Support & Services" }
      - { pathway: artificial-intelligence, sub: "Data Science & Artificial Intelligence" }
    # Certifications and licenses in this cluster (hub table "Certifications and licenses"); kind values: us-cluster-hub.html.
    credentials:
      - { name: "CompTIA A+", owner: "CompTIA", kind: "Voluntary", what: "Two exams, Core 1 and Core 2, in any order; aimed at help desk and IT support roles.", for: "Computer support specialist", href: "us/careers/computer-support-specialist/", source: comptia_aplus }
      - { name: "CompTIA Network+", owner: "CompTIA", kind: "Voluntary", what: "One exam; CompTIA recommends A+ and 9 to 12 months in a junior network role first.", for: "Network administrator", href: "us/careers/network-administrator/", source: comptia_netplus }
      - { name: "CompTIA Security+", owner: "CompTIA", kind: "Voluntary", what: "One exam for core security jobs; V8 is expected on or around 17 November 2026.", for: "Information security analyst", href: "us/roadmaps/information-security-analyst.html", source: comptia_secplus_v8 }
      - { name: "Certified in Cybersecurity (CC)", owner: "ISC2", kind: "Voluntary", what: "Entry-level exam; no work experience required.", for: "Information security analyst", href: "us/roadmaps/information-security-analyst.html", source: isc2_cc }
      - { name: "CISSP", owner: "ISC2", kind: "Voluntary", what: "5 years of security experience (a degree can count for 1); passing without it makes you an Associate of ISC2.", for: "Information security analyst", href: "us/roadmaps/information-security-analyst.html", source: isc2_cissp_exp }
      - { name: "Product certifications", owner: "Software and hardware vendors", kind: "Employer may require", what: "Employers may require certification in the products they use.", for: "Support specialist, network administrator", href: "us/careers/network-administrator/", source: ooh_netadmin }
      - { name: "Professional Engineer (PE)", owner: "State engineering boards (NCEES writes the exams)", kind: "State license", what: "FE exam, about 4 years of experience, then the PE exam; computer hardware roles rarely require it.", for: "Computer hardware engineer", href: "us/professional-licenses/pe/", source: ncees_pe }
  - slug: financial-services
    name: "Financial Services"
    phase: 3
    live: true
    summary: "The Financial Services Career Cluster encompasses careers in managing and advising financial transactions, including banking, lending, corporate finance, debt management, accounting, insurance, and real estate."
    definition: "The Financial Services Career Cluster encompasses careers in managing and advising financial transactions, including banking, lending, corporate finance, debt management, accounting, insurance, and real estate. These careers contribute to economic stability and growth by supporting the financial health of individuals and organizations."
    source: acte_financial_services
    connected: [healthcare-human-services, public-service-safety]
    sub_clusters:
      - name: "Accounting"
        line: "Careers focused on managing financial records for individuals and businesses and advising on individual and family financial planning and debt management."
        programs: ["Accounting", "Business Finance", "Economics"]
      - name: "Banking & Credit"
        line: "Careers centered on money management, loans, microlending, and commercial and consumer credit across banks, credit unions, mortgage brokers, and finance companies."
        programs: ["Banking", "Credit"]
      - name: "Financial Strategy & Investments"
        line: "Careers involved in managing a company’s capital structure and corporate financial strategies, operations, and investments, including venture capital and private equity."
        programs: ["Business Administration", "Securities & Investments"]
      - name: "Insurance"
        line: "Careers rooted in assessing risk; providing financial protection against loss; and offering products including life, health, and property insurance."
        programs: ["Insurance Operations"]
      - name: "Real Estate"
        line: "Careers focused on the buying, selling, leasing, and management of residential, commercial, and industrial properties."
        programs: ["Real Estate"]
    # Phase 3 batches 1-2: ordered by the BLS 2025 employment of each career's occupation (docs/us-edition/PHASE-3-DIGITAL-FINANCE.md).
    careers:
      - { pathway: accounting, sub: "Accounting" }
      - { career: bookkeeping-clerk, sub: "Accounting" }
      - { career: insurance-sales-agent, sub: "Insurance" }
      - { pathway: investment-banking, sub: "Financial Strategy & Investments" }
      - { career: real-estate-agent, sub: "Real Estate" }
      - { career: property-manager, sub: "Real Estate" }
      - { pathway: finance, sub: "Financial Strategy & Investments" }
      - { career: claims-adjuster, sub: "Insurance" }
      - { career: bank-teller, sub: "Accounting" }
      - { career: personal-financial-advisor, sub: "Financial Strategy & Investments" }
      - { career: loan-officer, sub: "Banking & Credit" }
      - { career: bill-collector, sub: "Accounting" }
      - { career: insurance-underwriter, sub: "Insurance" }
      - { career: compensation-benefits-specialist, sub: "Insurance" }
      - { career: financial-examiner, sub: "Banking & Credit" }
      - { career: real-estate-appraiser, sub: "Real Estate" }
      - { career: actuary, sub: "Insurance" }
      - { career: credit-counselor, sub: "Banking & Credit" }
    credentials:
      - { name: "CPA", owner: "State boards of accountancy (AICPA writes the exam)", kind: "State license", what: "Required for accountants who file reports with the SEC; optional for many other accounting jobs.", for: "Accountant", href: "us/professional-licenses/cpa/", source: ooh_acct }
      - { name: "SIE", owner: "FINRA", kind: "Exam (no firm needed)", what: "Open to anyone 18 or older and valid for four years, but it does not register you on its own.", for: "Investment banker, financial advisor", href: "us/roadmaps/investment-banker.html", source: finra_sie }
      - { name: "Series 7, Series 79", owner: "FINRA", kind: "Registration through an employer", what: "Representative exams: you must be associated with and sponsored by a FINRA member firm.", for: "Investment banker, financial advisor", href: "us/roadmaps/investment-banker.html", source: finra_series7 }
      - { name: "Series 63, 65, 66", owner: "NASAA (given by FINRA)", kind: "Exam for a state license", what: "Passing is normally a prerequisite for a state license before an agent or adviser representative can work with investors.", for: "Personal financial advisor", href: "us/careers/personal-financial-advisor/", source: nasaa_exams }
      - { name: "CFA charter", owner: "CFA Institute", kind: "Voluntary", what: "Three exams, 4,000 hours of investment work experience and membership.", for: "Financial analyst", href: "us/roadmaps/financial-analyst.html", source: cfa_program }
      - { name: "CFP certification", owner: "CFP Board", kind: "Voluntary", what: "Registered coursework, the CFP exam, a bachelor's degree, experience and ethics.", for: "Personal financial advisor", href: "us/careers/personal-financial-advisor/", source: cfp_process }
      - { name: "ASA / FSA, ACAS / FCAS", owner: "Society of Actuaries; Casualty Actuarial Society", kind: "Professional credential", what: "A series of exams and courses; BLS says actuaries typically complete a certification program.", for: "Actuary", href: "us/careers/actuary/", source: ooh_actuary }
      - { name: "Real estate license", owner: "State real estate commissions", kind: "State license", what: "Every state requires agents and brokers to be licensed: prelicensing courses, a state exam, usually a sponsoring broker.", for: "Real estate agent, property manager", href: "us/professional-licenses/real-estate/", source: ooh_realestate }
      - { name: "Insurance producer license", owner: "State insurance departments", kind: "State license", what: "Required in every state where an agent works; life and health and property and casualty are separate licenses.", for: "Insurance sales agent", href: "us/professional-licenses/insurance-producer/", source: ooh_insagent }
      - { name: "Mortgage loan originator (MLO) license", owner: "State regulators, through NMLS", kind: "State license", what: "20 hours of NMLS-approved education and the SAFE MLO Test (75% to pass); bank-employed originators register instead.", for: "Loan officer", href: "us/professional-licenses/mortgage-loan-originator/", source: nmls_pe_faq }
      - { name: "Appraiser license or certification", owner: "State appraiser agencies (AQB sets the minimum)", kind: "State license", what: "Required for federally related transactions: qualifying education, experience or PAREA, and the AQB national exam.", for: "Real estate appraiser", href: "us/professional-licenses/real-estate-appraiser/", source: taf_real_property }
      - { name: "Enrolled actuary", owner: "Joint Board for the Enrollment of Actuaries", kind: "Federal license", what: "Pension actuaries typically must be licensed; experience and exams are required.", for: "Actuary", href: "us/roadmaps/actuary.html", source: ooh_actuary }
  - slug: management-entrepreneurship
    name: "Management & Entrepreneurship"
    phase: 4
    live: true
    cross_cutting: true
    summary: "The Management & Entrepreneurship Career Cluster involves skills and occupations that are essential across all industries, focusing on business administration, operations optimization, strategic planning, workforce management, and entrepreneurship."
    definition: "The Management & Entrepreneurship Career Cluster involves skills and occupations that are essential across all industries, focusing on business administration, operations optimization, strategic planning, workforce management, and entrepreneurship. It merges key areas such as data management and analysis, human resources, general operations, administrative support, project management, and organizational leadership. This Cluster ensures that businesses across all industries efficiently meet their goals, adapt to market changes, and maintain competitive advantage. By emphasizing entrepreneurship, this Cluster supports the creation of new ventures, driving economic growth and innovation and making it a cornerstone of modern economies. This Career Cluster is also a Cross-Cutting Cluster as the skills gained through this Career Clusters area are applicable across all Career Clusters. Practitioners are encouraged to combine content from this Cluster across other CTE programs."
    source: acte_management_entrepreneurship
    connected: []
    sub_clusters:
      - name: "Business Information Management"
        line: "Careers centered around using technology to collect information that supports and enhances business operations."
        programs: ["Business Technology Applications"]
      - name: "Entrepreneurship & Small Business"
        line: "Careers focused on initiating and managing businesses, including startups, small businesses, gig economy work, and social enterprises."
        programs: ["Entrepreneurship"]
      - name: "Leadership & Operations"
        line: "Careers involving the leadership of business activities, including strategic planning; resource forecasting and allocation; engaging with boards, shareholders, and other constituents; administrative support; and management consulting."
        programs: ["Business Essentials", "Business Management", "Human Resources Management"]
      - name: "Project Management"
        line: "Careers focused on planning, leading, initiating, executing, controlling, and closing out projects to achieve specific goals within a set timeline and budget."
        programs: ["Principles of Management"]
      - name: "Regulation"
        line: "Careers dedicated to corporate responsibility, ensuring that all industries adhere to health, safety, financial, and environmental regulations."
        programs: ["Business Law"]
    # Phase 4 batches 1–2: ordered by the BLS 2025 employment of each career's occupation (docs/us-edition/PHASE-4-MANAGEMENT-MARKETING.md).
    careers:
      - { career: top-executive, sub: "Leadership & Operations", also: [energy-natural-resources] }
      - { career: secretary-administrative-assistant, sub: "Leadership & Operations", also: [healthcare-human-services, public-service-safety] }
      - { career: project-management-specialist, sub: "Project Management" }
      - { pathway: business, sub: "Business Information Management", also: [education, public-service-safety] }
      - { career: human-resources-specialist, sub: "Leadership & Operations" }
      - { career: financial-manager, sub: "Business Information Management" }
      - { career: training-development-specialist, sub: "Leadership & Operations" }
      - { career: administrative-services-manager, sub: "Leadership & Operations", also: [energy-natural-resources, public-service-safety] }
      - { career: public-relations-specialist, sub: "Leadership & Operations" }
      - { career: human-resources-manager, sub: "Leadership & Operations", also: [public-service-safety] }
      - { career: public-relations-manager, sub: "Leadership & Operations", also: [arts-entertainment-design, financial-services, hospitality-events-tourism] }
      - { career: labor-relations-specialist, sub: "Leadership & Operations" }
      - { career: training-development-manager, sub: "Leadership & Operations", also: [public-service-safety] }
      - { career: compensation-benefits-manager, sub: "Leadership & Operations" }
    credentials:
      - { name: "CAPM", owner: "Project Management Institute (PMI)", kind: "Voluntary", what: "No experience required: a secondary diploma, age 18 and 23 hours of project management education, then a 150-question exam.", for: "Project manager", href: "us/careers/project-management-specialist/", source: pmi_capm }
      - { name: "PMP", owner: "Project Management Institute (PMI)", kind: "Voluntary", what: "2 to 5 years of experience managing projects (depending on education), 35 hours of training and a 180-question exam.", for: "Project manager", href: "us/roadmaps/project-management-specialist.html", source: pmi_pmp }
      - { name: "aPHR, PHR", owner: "HR Certification Institute (HRCI)", kind: "Voluntary", what: "aPHR needs no HR experience; PHR needs 1 to 4 years of professional HR experience depending on education.", for: "HR specialist, HR manager", href: "us/roadmaps/human-resources-specialist.html", source: hrci_phr }
      - { name: "SHRM-CP", owner: "Society for Human Resource Management (SHRM)", kind: "Voluntary", what: "For people who perform general HR duties or are pursuing an HR career; 134 questions at a Prometric test center.", for: "HR specialist, HR manager", href: "us/careers/human-resources-manager/", source: shrm_cp }
      - { name: "CPA", owner: "State boards of accountancy (AICPA writes the exam)", kind: "State license", what: "Financial managers who are CPAs are licensed by their state's board of accountancy and must pass an exam.", for: "Financial manager", href: "us/professional-licenses/cpa/", source: ooh_finmgr }
      - { name: "CGFM", owner: "AGA", kind: "Voluntary", what: "Government financial management: three exams, renewed every year with continuing education.", for: "Financial manager", href: "us/careers/financial-manager/", source: aga_cgfm }
    # Starting your own business (hub section "Start a small business"): SBA's free business guide, step names and
    # lines copied from sba.gov (redesigned 2026; the old "10 steps" page redirects to it). No paid courses.
    small_business:
      intro: "SBA's free business guide walks you through starting a small business: plan it first, then take care of the paperwork and processes before you can start doing business."
      source: sba_counseling
      groups:
        - name: "Plan your business"
          source: sba_plan
          href: "https://www.sba.gov/counseling/plan-your-business/"
          steps:
            - { title: "Market research and competitive analysis", text: "Market research helps you find customers for your business. Competitive analysis helps you make your business unique." }
            - { title: "Write your business plan", text: "Your business plan is the foundation of your business." }
            - { title: "Calculate your startup costs", text: "So you can request funding, attract investors, and estimate when you’ll turn a profit." }
            - { title: "Establish business credit", text: "Poor credit history is one of the main reasons why loan applications for small businesses are often declined." }
            - { title: "Fund your business", text: "Once you know how much startup funding you’ll need, choose how to get it: loans, self-funding or investors." }
            - { title: "Or buy an existing business or franchise", text: "" }
        - name: "Launch your business"
          source: sba_launch
          href: "https://www.sba.gov/counseling/launch-your-business/"
          steps:
            - { title: "Pick your business location", text: "Your business location determines the taxes, zoning laws, and regulations your business will be subject to." }
            - { title: "Choose a business structure", text: "It affects how much you pay in taxes, your ability to raise money, the paperwork you need to file, and your personal liability. Choose it before you register with the state." }
            - { title: "Choose your business name", text: "Once you’ve picked your name, protect it by registering it with the right agencies." }
            - { title: "Register your business", text: "How and where you need to register depends on your business structure and business location." }
            - { title: "Get federal and state tax ID numbers", text: "The federal Employer Identification Number (EIN) is free from the IRS: do not apply on websites that charge a fee. State tax IDs depend on your state's income and employment taxes." }
            - { title: "Apply for licenses and permits", text: "Most small businesses need a combination of licenses and permits from federal and state agencies; requirements and fees vary by activity and location." }
            - { title: "Open a business bank account", text: "As soon as you start accepting or spending money as your business." }
            - { title: "Get business insurance", text: "An LLC or corporation can protect your personal property from lawsuits, but that protection has limits." }
      help:
        text: "SBA and its resource partners offer free or low-cost counseling, training and mentoring; find the nearest one by ZIP code."
        source: sba_partners
        href: "https://www.sba.gov/counseling/local-assistance/resource-partners/"
        partners:
          - { name: "Small Business Development Centers (SBDC)", text: "Assistance and counseling in your area to start, run, or grow your business." }
          - { name: "SCORE", text: "The nation’s largest network of small business mentors." }
          - { name: "Women’s Business Centers", text: "Free to low-cost counseling and training, focused on women who want to start, grow, and expand a small business." }
          - { name: "Veterans Business Outreach Centers", text: "For veterans, service members and military spouses starting or growing a small business." }
  - slug: marketing-sales
    name: "Marketing & Sales"
    phase: 4
    live: true
    cross_cutting: true
    summary: "The Marketing & Sales Career Cluster focuses on promoting products, understanding consumer needs, engaging with communities, and driving sales."
    definition: "The Marketing & Sales Career Cluster focuses on promoting products, understanding consumer needs, engaging with communities, and driving sales. It integrates digital marketing, data analysis, brand promotion, customer relationship management, strategic communications, human-centered design, and retail strategies to build strong customer connections and support business growth. This Cluster is essential in all industries for creating value, effectively reaching and engaging target audiences, and achieving commercial success in a competitive marketplace. This Career Cluster is also a Cross-Cutting Cluster as the skills gained through this Career Clusters area are applicable across all Career Clusters. Practitioners are encouraged to combine content from this Cluster across other CTE programs."
    source: acte_marketing_sales
    connected: []
    sub_clusters:
      - name: "Market Research, Analytics, & Ethics"
        line: "Careers focused on gathering, analyzing, and interpreting market data and consumer behaviors to inform strategic decisions and enhance business relationships."
        programs: ["Marketing Research", "Social Media & Analytics"]
      - name: "Marketing & Advertising"
        line: "Careers focused on using digital technologies and traditional strategies to promote products and services to engage customers and maintain brand identity."
        programs: ["Marketing", "Marketing Management"]
      - name: "Retail & Customer Experience"
        line: "Careers focused on the essentials of retail operations and the delivery of outstanding customer experiences."
        programs: ["Merchandising"]
      - name: "Strategic Sales"
        line: "Careers that help businesses grow and achieve goals."
        programs: ["Business Communications"]
    # Phase 4 batches 1–2: ordered by the BLS 2025 employment of each career's occupation (docs/us-edition/PHASE-4-MANAGEMENT-MARKETING.md).
    careers:
      - { career: retail-sales-worker, sub: "Retail & Customer Experience" }
      - { career: customer-service-representative, sub: "Retail & Customer Experience" }
      - { career: wholesale-sales-representative, sub: "Strategic Sales" }
      - { career: market-research-analyst, sub: "Market Research, Analytics, & Ethics" }
      - { career: sales-manager, sub: "Retail & Customer Experience" }
      - { career: marketing-manager, sub: "Marketing & Advertising" }
      - { career: advertising-sales-agent, sub: "Strategic Sales" }
      - { career: sales-engineer, sub: "Strategic Sales" }
  - slug: public-service-safety
    name: "Public Service & Safety"
    phase: 5
    live: true
    summary: "The Public Service & Safety Career Cluster encompasses roles in local, state, and federal government; legal and justice systems; security; and military operations, all aimed at promoting civic responsibility and ensuring the well-being, security, functionality, and resilience of communities, states, and countries."
    definition: "The Public Service & Safety Career Cluster encompasses roles in local, state, and federal government; legal and justice systems; security; and military operations, all aimed at promoting civic responsibility and ensuring the well-being, security, functionality, and resilience of communities, states, and countries."
    source: acte_public_service_safety
    public_sector: true      # hub shows the USAJOBS / state & city civil service block (home.yml public_sector), moved from the USA Home
    connected: [education, energy-natural-resources, financial-services, healthcare-human-services]
    sub_clusters:
      - name: "Emergency Response"
        line: "Careers focused on strategic actions taken to prepare for and manage crises and emergencies, including natural disasters, fires, accidents, and other urgent situations."
        programs: ["Emergency & Fire Management Services", "Fire Science"]
      - name: "Judicial Systems"
        line: "Careers dedicated to maintaining the legal system, upholding justice, fairness, and the rule of law for both individuals and organizations."
        programs: ["Legal Studies", "Paralegal & Legal Assistant Training"]
      - name: "Local, State & Federal Services"
        xw: "Local, State, & Federal Services"
        line: "Careers in government agencies responsible for policy and economic development, ensuring democratic processes, access to public services, governance, public administration, public policy, urban and regional planning, and community development."
        programs: ["Economics", "Public Management & Administration", "Regional & Urban Planning"]
      - name: "Military & National Security"
        line: "Careers centered on safeguarding countries through defense operations, strategic planning, intelligence gathering, and technological resilience."
        programs: ["National Security"]
      - name: "Public Safety"
        line: "Careers in law enforcement, corrections, and both public and private security."
        programs: ["Criminal Justice", "Law Enforcement Services", "Security & Protective Services"]
    # Phase 5 batch 1: ordered by the BLS 2025 employment of each career (docs/us-edition/PHASE-5-PUBLIC-SERVICE-EDUCATION.md).
    careers:
      - { pathway: law, sub: "Judicial Systems" }
      - { career: police-officer, sub: "Public Safety", also: [energy-natural-resources] }
      - { career: correctional-officer, sub: "Public Safety" }
      - { career: paralegal, sub: "Judicial Systems" }
      - { career: firefighter, sub: "Emergency Response", also: [energy-natural-resources], tie: true }
  - slug: education
    name: "Education"
    phase: 5
    live: true
    summary: "The Education Career Cluster spans careers aimed at fostering learning from early childhood to adulthood, including teaching, instructional design, counseling services, community engagement, learner support, and educator training."
    definition: "The Education Career Cluster spans careers aimed at fostering learning from early childhood to adulthood, including teaching, instructional design, counseling services, community engagement, learner support, and educator training. This Cluster emphasizes quality education standards and lifelong learning, preparing individuals for success through all life stages by nurturing knowledge, skills, and critical thinking and encouraging personal and societal growth in a constantly evolving world."
    source: acte_education
    connected: [healthcare-human-services, public-service-safety]
    sub_clusters:
