          - note: "NSU admission 2026-27: online form from 25 May to 25 June 2026, then the <strong>NSU Entrance Exam (NSUEE)</strong> and <strong>physical fitness and game proficiency test</strong> (15–17 July), result 27 July, classes from 10 August. You cannot change your sport after admission."
            source: nsu-elig
          - list:
