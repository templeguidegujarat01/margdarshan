  # 4,271,400 jobs (retail salespersons + parts salespersons)
  - slug: retail-sales-worker
    short: "Retail Sales Worker"
    title: "Retail sales worker: no formal education needed, on-the-job training, then supervisor or manager"
    eyebrow: "Marketing & Sales · Retail & Customer Experience"
    lede: "Retail sales workers typically do not need formal education; some employers prefer a high school diploma. Most learn on the job in a few days to a few months. Some states license selected retail sales jobs, such as car salespersons."
    for: "Friendly, outgoing people who like helping customers and don't mind evenings and weekends."
    soc: ["41-2022", "41-2031"]
    does: { text: "Retail sales workers sell merchandise, spare and replacement parts, and equipment to customers.", source: ooh_qf_retail }
    work: { text: "Retail sales workers usually work in clean, well-lit stores. Most are employed full time. Schedules may vary, with evening and weekend work required in some jobs.", source: ooh_qf_retail }
    become: { text: "Retail sales workers typically do not need formal education to enter the occupation. However, some employers prefer to hire candidates who have a high school diploma or the equivalent. Most retail sales workers learn on the job.", source: ooh_qf_retail }
    metrics: { pay: 35560, pay_hour: "17.10", pay_by: "Retail sales workers", jobs: 4271400, outlook: 0, outlook_words: "Little or no change", change: -5700, entry: "No formal educational credential", training: "See How to Become One", source: ooh_qf_retail }
    license_text: "Some states, for some jobs"
    states_note: "Some states require licensure for selected retail sales occupations, such as car salespersons; you may need to pass an exam or a background check. Requirements vary by state: contact the state licensing agency."
    states_source: ooh_retail
    routes:
      - id: on-the-job
        title: "Get hired → on-the-job training"
        tag: "Typical"
        who: "Training usually lasts a few days to a few months and covers customer service, security, store policies and the cash register or point-of-sale system."
        steps:
          - { tag: "Start", title: "No formal education required", text: "Some employers prefer a high school diploma or equivalent.", kind: start, source: ooh_retail }
          - { tag: "Days to months", title: "On-the-job training", text: "Auto and parts sellers get extra product training.", kind: stage, source: ooh_retail }
          - { tag: "Goal", title: "Retail sales worker", text: "With experience and seniority, workers may choose departments with higher earnings and commissions.", kind: goal, source: ooh_retail }
      - id: supervisor
        title: "Sales worker → supervisor or store manager"
        tag: "Moving up"
        who: "Some employers prefer a bachelor's degree for managerial positions."
        steps:
          - { tag: "Start", title: "Retail sales worker", text: "", kind: start, source: ooh_retail }
          - { tag: "Optional", title: "Bachelor's degree", text: "", kind: stage, source: ooh_retail }
          - { tag: "Goal", title: "Supervisor or manager", text: "", kind: goal, source: ooh_retail, href: "us/careers/sales-manager/", link: "Sales manager" }
    certs:
      - { name: "State license for some sales jobs", who: "State licensing agencies", kind: "State license", text: "Only for selected retail sales occupations in some states, such as car salespersons.", source: ooh_retail }

  # 1,571,400 jobs
  - slug: wholesale-sales-representative
    short: "Wholesale & Manufacturing Sales Rep"
    title: "Wholesale and manufacturing sales representative: diploma or a degree that matches the product, then company training"
    eyebrow: "Marketing & Sales · Strategic Sales"
    lede: "For products that are not scientific or technical, a high school diploma is generally enough. Representatives of scientific and technical products, such as pharmaceuticals, medical instruments or industrial equipment, typically need at least a bachelor's degree. Company training programs may last up to 1 year."
    for: "Self-starters who like travel, meeting business clients and being paid for results."
    soc: ["41-4011", "41-4012"]
    does: { text: "Wholesale and manufacturing sales representatives sell goods for wholesalers or manufacturers to businesses, government agencies, and other organizations.", source: ooh_qf_wholesale }
    work: { text: "Wholesale and manufacturing sales representatives work under pressure because their income and job security depend on the amount of merchandise they sell. Some sales representatives travel frequently.", source: ooh_qf_wholesale }
    become: { text: "Educational requirements vary for sales representatives and depend on the type of products sold. If the products are not scientific or technical, a high school diploma is generally sufficient for entry into the occupation. If the products are scientific or technical, sales representatives typically need at least a bachelor's degree.", source: ooh_qf_wholesale }
    metrics: { pay: 76460, pay_hour: "36.76", pay_by: "Wholesale and manufacturing sales representatives", jobs: 1571400, outlook: 0, outlook_words: "Little or no change", change: -7700, entry: "See How to Become One", training: "Moderate-term on-the-job training", source: ooh_qf_wholesale }
    license_text: "None"
