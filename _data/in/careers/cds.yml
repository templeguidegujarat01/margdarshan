            text: "Three papers — English, General Knowledge and Elementary Mathematics — each objective-type."
          - label: "Written exam (OTA)"
            text: "Two papers — English and General Knowledge — since Mathematics isn't required for this entry."
          - label: "SSB Interview"
            text: "A rigorous 5-day process covering psychological tests, group tasks, group discussions, an interview and physical tasks, assessing \"Officer-Like Qualities\" beyond academics."
          - label: "Medical examination"
            text: "Final stage for candidates who clear the SSB, confirming medical fitness for military service before final selection."
