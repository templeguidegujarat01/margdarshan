# Indiana (USA 50-state licensure portal, 2026-10-22). Schema: _data/us/state_index.yml. Boards tier: the
# licensing boards for lawyers, physicians, CPAs and nurses, copied from the national directories of state boards (NCBE,
# FSMB, NASBA, NCSBN). Diploma, state test, tuition, aid, jobs and apprenticeship blocks are still in the Phase 11 queue;
# the page prints only the blocks that exist.
name: "Indiana"
abbr: IN
checked: 2026-10-22
review_by: 2027-04-22
lede: "In Indiana, the Indiana State Board of Law Examiners handles bar admission for lawyers, the Medical Licensing Board of Indiana licenses physicians, the Indiana Board of Accountancy licenses CPAs and the Indiana State Board of Nursing licenses registered nurses."

boards:
  # 50-state portal (2026-10-22): bar admission agency (NCBE jurisdiction page), medical board(s) (FSMB directory),
  # board of accountancy (NASBA directory), board of nursing (NCSBN member page). Links checked 2026-10-22.
  law: { body: "Indiana State Board of Law Examiners", url: "https://www.in.gov/courts/ace/", stat: "UBE", exam: "Uniform Bar Exam (MBE, MEE and MPT).", note: "MPRE required (passing score 80). NextGen UBE from July 2028.", src: ncbe_in }
  medicine:
    src: fsmb_boards
    boards:
      - { body: "Medical Licensing Board of Indiana", url: "https://www.in.gov/pla/professions/physicians-home/" }
  cpa:
    src: nasba_boards
    boards:
      - { body: "Indiana Board of Accountancy", url: "https://www.in.gov/pla/professions/accountancy-home/" }
  nursing:
    src: ncsbn_in
    boards:
      - { body: "Indiana State Board of Nursing", url: "https://www.in.gov/pla/professions/nursing-home/" }
