          - myth: "You need to be a coding expert to start a data career."
            fact: "Business Analyst, Data Analyst and BI Developer roles need minimal coding — Excel, SQL and Power BI/Tableau are genuinely enough for many entry-level and even mid-level roles; deeper Python/ML skills matter more as you grow into Data Scientist and beyond."
          - myth: "Data Scientist and Data Analyst are the same job with different titles."
            fact: "Data Analysts primarily focus on collecting, cleaning and interpreting data for reporting, while Data Scientists build predictive models and solve more complex business problems using advanced analytics — which is also why Data Scientists generally earn meaningfully more."
          - myth: "A Data Science bootcamp certificate alone guarantees a high-paying job."
            fact: "Employers increasingly prioritise a real GitHub portfolio and demonstrated project work over a specific bootcamp name or certificate — the credential matters far less than what you can actually show you've built."
