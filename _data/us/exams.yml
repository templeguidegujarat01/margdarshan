# USA Edition — Exams hub (USA Master Plan Phase 9, 2026-10-21): us/exams/ and one page per exam, us/exams/<slug>/.
# Extends tests.yml (which still drives the live us/tests/ overview page, unchanged): an exam with `tests:` names its
# tests.yml record, and scripts/check-us-data.mjs requires the score range here to match that record.
# Every fact was copied from the exam owner's own page (or the statute) opened on 2026-10-21; each block names its
# source id in _data/us/sources.yml. Nothing is computed. Where an owner's page does not state something (a fee, a
# date), the page says so instead of guessing.
#
# Page stubs: scripts/build-us-exams.mjs [--check] writes us/exams/index.html (_includes/us-exams-hub.html) and
# us/exams/<slug>/index.html (_includes/us-exam-page.html, `exam: <slug>`).
#
# Exam schema:
#   name, short (card / menu label), by, stage (a stages[].id), status (current | retired), grades, tests (optional
#   tests.yml path such as high_school.sat), lede (one sentence, the answer box), facts (4 stat tiles: label, value,
#   note), sections: who, format, scoring, fees, dates, accepted, practice — each optional, each
#   { intro, table: { head: [..], rows: [[..]] }, points: [ { t, src } ], source }; `source` covers intro + table.
#   used_by: { careers: bachelor | hs (careers on this site whose BLS typical entry starts there), need: [career or
#   pathway slugs whose roadmap has this exam as a step], colleges: [ {name, text, src} ], links: [ { label, href,
#   text } ] }. license (optional): the licenses.yml id this exam leads to; the page links that license page instead of
#   repeating its state rules. page: { title, description }. search: { s, k }.
# Phase 10 (2026-10-21) added the graduate admission and health licensing exams (batch 1); see
# docs/us-edition/PHASE-10-EXAMS.md for the queue.
as_of: 2026-10-21
review_by: 2027-04-21

# The hub groups exams by stage, youngest first. `exams` = slugs with a page here; `elsewhere` = live pages on this
# site that already cover a stage (Phase 10 builds dedicated graduate, licensing and government exam pages).
stages:
  - id: grades-3-8
    title: "Grades 3–8: state tests and national samples"
    line: "Federal law makes every state test reading or language arts and math in each of grades 3 through 8 and once in grades 9 through 12, and science once in grades 3–5, 6–9 and 10–12. Each state writes or picks its own test; NAEP samples students to compare states."
    source: usc_6311_assess
    exams: [naep]
    note: "Your state's own test (its name, grades and score reports) is covered on the state pages, Master Plan Phase 11."
  - id: grades-8-11
    title: "Grades 8–11: practice and scholarship tests"
    line: "Taken at school, usually on a school day. They preview the SAT or ACT, and the PSAT/NMSQT in grade 11 is the entry to the National Merit Scholarship Program."
    exams: [psat-8-9, psat-10, psat-nmsqt, preact]
  - id: admission
    title: "College admission and college credit"
    line: "Admission tests (SAT, ACT, CLT) and exams that can earn college credit or placement (AP, IB, CLEP). Each college sets its own rules."
    exams: [sat, act, clt, ap, ib, clep]
  - id: equivalency
    title: "High school equivalency"
    line: "No diploma? A passing score on the GED or HiSET earns a state high school equivalency credential. Your state decides which test it offers."
    exams: [ged, hiset]
  - id: english
    title: "English proficiency"
    line: "For students whose first language is not English. Each college sets which tests and scores it accepts."
    exams: [toefl-ibt, ielts, duolingo-english-test]
  - id: military-career
    title: "Military and career readiness"
    line: "The ASVAB decides military enlistment and job placement (and is also given in high schools for career exploration); WorkKeys certifies workplace skills."
    exams: [asvab, workkeys]
  - id: graduate
    title: "Graduate and professional school"
    line: "Admission tests taken near the end of a bachelor's degree, for graduate, business, law, medical, dental and optometry school. Each school decides which tests it accepts."
    exams: [gre, gmat, lsat, mcat, dat, oat]
    elsewhere:
      - { label: "PCAT (retired)", href: "us/tests/#grad-tests", text: "Retired January 2024; pharmacy schools no longer list it", retired: true }
  - id: licensing
    title: "Licensing exams"
    line: "National exams that a state board requires before it grants a license. Passing is one step: the license itself always comes from the state board."
    exams: [usmle, comlex-usa, nclex-rn, nclex-pn, naplex-mpje, inbde, npte, pance, nbcot, eppp, nce]
    elsewhere:
      - { label: "Bar, CPA, FE/PE, ARE and other license exams", href: "us/professional-licenses/", text: "Their exams and state rules are on each license page until their own exam pages are added" }
  - id: government
    title: "Government jobs"
    line: "Federal jobs hire through USAJOBS assessments; police, fire and state civil service have their own exams."
    exams: []
    elsewhere:
      - { label: "Federal and state civil service", href: "us/clusters/public-service-safety/#public-sector", text: "USAJOBS, police, fire and state exams on the Public Service hub" }

exams:

  naep:
    name: "NAEP (The Nation's Report Card)"
    short: "NAEP"
    by: "National Center for Education Statistics (U.S. Department of Education)"
    stage: grades-3-8
    status: current
    grades: "Grades 4, 8 and 12 (a sample of students)"
    lede: "NAEP is not a test you sign up for: NCES picks a sample of schools and students to measure how the nation, states and some large districts are doing. No student or school gets a score."
    facts:
      - { label: "Grades", value: "4, 8, 12", note: "Sampled, not every student" }
      - { label: "Window", value: "Jan–Mar", note: "Long-term trend: Oct–May" }
      - { label: "Your score", value: "None", note: "Results only for groups" }
      - { label: "Who picks", value: "NCES", note: "Schools, then students, at random" }
    sections:
      who:
        intro: "NAEP is required by Congress and run by NCES, part of the U.S. Department of Education's Institute of Education Sciences; the National Assessment Governing Board sets its policy. It has measured achievement since 1969."
        source: naep_about
        points:
          - { t: "Schools are chosen to match the makeup of the nation, a state or a district; inside each chosen school and grade, students are picked at random.", src: naep_faqs }
          - { t: "National results use 10,000 to 20,000 students; state and district results about 3,000 students from about 100 schools in each place.", src: naep_faqs }
      format:
        intro: "Subjects, grades and where results are reported:"
        source: naep_about
        table:
          head: ["Subject", "Grades", "Results for"]
          rows:
            - ["Reading", "4, 8, 12", "Nation, states, districts"]
            - ["Mathematics", "4, 8, 12", "Nation, states, districts"]
            - ["Science", "4, 8, 12", "Nation; states (grades 4 and 8)"]
            - ["Writing", "8, 12", "Nation"]
            - ["Arts", "8", "Nation"]
            - ["Civics", "4, 8, 12", "Nation"]
            - ["Geography", "4, 8, 12", "Nation"]
        points:
          - { t: "NAEP also assesses economics, technology and engineering literacy, and U.S. history.", src: naep_about }
      scoring:
        points:
          - { t: "No scores for individual students or schools, by design: each student takes only a small part of the assessment, and results are reliable only when added up for a state, district or the nation.", src: naep_faqs }
          - { t: "State tests measure a state's own standards and usually give each student a score; NAEP is the only assessment that compares one state with another or with the nation. NAEP's 'Proficient' does not mean the same as 'proficiency' on a state test.", src: naep_faqs }
      dates:
        intro: "All assessments take place between January and March, except long-term trend assessments (October to May). Schedule as of 15 May 2026:"
        source: naep_calendar
        points:
          - { t: "NAEP 2027: a grade 8 science pilot with student, teacher and school questionnaires, 25 January to 19 March 2027. Pilot results are not released.", src: naep_participating }
      practice:
        points:
          - { t: "Sample questions from recent assessments by subject, content area, difficulty and grade, from the NAEP Questions Tool (over 3,000 questions).", src: naep_participating }
    used_by:
      links:
        - { label: "Grades 3–8 state tests", href: "us/exams/#grades-3-8", text: "How state tests and NAEP fit together" }
    page:
      title: "NAEP, The Nation's Report Card: Grades, Subjects and the 2027 Schedule"
      description: "NAEP samples students in grades 4, 8 and 12 to compare states and the nation. No individual scores; all assessments run January to March; 2027 is a grade 8 science pilot."
    search:
      s: "Grades 4, 8, 12 sample; no individual scores; 2027 grade 8 science pilot"
      k: "usa naep nations report card national assessment of educational progress nces grade 4 grade 8 state test comparison"

