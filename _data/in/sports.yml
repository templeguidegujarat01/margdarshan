                - ["50th Junior Nationals", "Lucknow, Uttar Pradesh", "November / December 2026"]
                - ["73rd Senior Nationals", "Ranchi, Jharkhand", "December 2026 / January 2027"]
                - ["38th Federation Cup", "Sirsa, Haryana", "January / February 2027"]
