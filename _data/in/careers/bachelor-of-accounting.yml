  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What is Bachelor of Accounting (BAF)?"
    parts:
      - overview:
          points:
            - "BAF is a 3-year specialised undergraduate degree covering financial accounting, cost accounting, corporate accounting, taxation (GST and Income Tax), auditing and business law."
            - "It is offered at reputed Delhi University colleges including <strong>SRCC and Hindu College</strong>, across University of Mumbai-affiliated colleges, at Gujarat University, and at numerous other universities across India — making it considerably more widely available than Bachelor of Financial Markets (BFM) (Bachelor of Financial Markets)."
            - "Where a general B.Com introduces accounting alongside a broad mix of business, economics and law subjects, BAF front-loads accounting, cost accounting and taxation more intensively from the first year — closer in spirit to a direct CA-preparation track than to a general commerce degree."
