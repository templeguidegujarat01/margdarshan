  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "What is the difference between a Radiographer and a Radiologist?"
            a: "They are genuinely different roles. A Radiographer (or Radiology Technologist) holds a BSc or diploma in Radiology & Imaging Technology, operates the imaging equipment, positions patients, administers contrast and acquires the images. A Radiologist is a medical doctor — MBBS followed by MD in Radiology — who interprets those images and writes the diagnostic report. Radiographers do not diagnose; Radiologists do not typically operate the scanning equipment themselves."
          - q: "Will AI replace radiology technologists?"
            a: "It doesn't look like it. AI tools assist Radiologists with image interpretation, but Radiology Technologists handle patient positioning, machine operation, contrast administration, patient safety and image acquisition — none of which AI performs. These remain fundamentally hands-on, physical tasks requiring a technologist present with the patient."
          - q: "What is a realistic Radiology Technologist salary in India?"
            a: "Freshers commonly earn ₹2-4 LPA. With 3-5 years of experience, this typically rises to ₹3-4.5 LPA, and senior technologists with 5-10+ years commonly earn ₹7 LPA or more. MRI Technologists specifically are reported to earn a 20-35% premium over general radiography technologists, since MRI is the most in-demand specific specialisation in the field."
          - q: "Is NEET required for Radiology & Imaging Technology?"
            a: "No. Admission is via CUET, university-specific entrance exams, state-level admissions, or direct Class 12 merit, depending on the institute — NEET is not required."
          - q: "Which imaging specialisation should I aim for?"
            a: "MRI Technology is reported as the most in-demand specialisation currently, commanding a genuine 20-35% salary premium over general radiography, with further sub-specialisation possible in neuro, cardiac or musculoskeletal MRI. CT and ultrasound remain consistently in-demand too, while interventional radiology support work — assisting image-guided procedures — is a smaller but valuable niche for technologists wanting more procedural involvement."
      - note: "Figures are indicative (2026) — confirm on the official college or authority website."
        class: "table-note mt-lg"
