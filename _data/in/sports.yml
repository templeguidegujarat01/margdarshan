  # ------------------------------------------------------------------------------------------------ Swimming
  - slug: swimming
    short: "Swimming"
    domain: solo
    checked: 2026-10-16
    body: "World Aquatics · Swimming Federation of India (SFI)"
    card: "World Aquatics stroke and swimsuit rules, the LA28 programme, SFI's new 2026 age groups and qualifying times, the National Talent Pool, SAI pools, awards and jobs."
    card_facts: ["New 50m back/breast/fly at LA28", "15 m underwater limit", "SFI juniors 15–18"]
    eyebrow: "Sports Cockpit · Solo, Track &amp; Pool · World Aquatics rules Feb 2026 · SFI 2026"
    title: "Swimming — stroke rules, approved swimsuits &amp; SFI's age-group ladder"
    lede: "Education Margdarshan's swimming map for India: the Olympic programme under the 2026 World Aquatics rules, how each stroke must be swum, which swimsuits are legal, the minimum ages, SFI's new sub-junior and junior groups, qualifying times and entry rules for the Nationals, the National Talent Pool that leads to TOPS, the SAI and corporate pools, who pays, and the awards and jobs after a medal."
    official:
      - { label: "World Aquatics Competition Regulations, Feb 2026 (PDF)", url: "https://resources.fina.org/fina/document/2026/02/18/e6815ecc-06d9-4f0b-98e9-4c441cf5e6a3/2026-02-18_World-Aquatics_CR-Final.pdf" }
      - { label: "swimming.org.in", url: "https://www.swimming.org.in/" }
    facts:
      - { label: "Olympic sprint events", value: "<strong>50m in all four strokes</strong>", source: wa-cr }
      - { label: "Underwater after start/turn", value: "<strong>Max 15 m</strong> (free, back, fly)", source: wa-cr }
      - { label: "Min. age, Olympics &amp; Worlds", value: "<strong>14 on 31 Dec</strong> — younger only with a 'B' time", source: wa-cr }
      - { label: "SFI junior groups (2026)", value: "<strong>15–16 &amp; 17–18</strong> · sub-junior 11–12 &amp; 13–14", source: sfi-age }
    sections:
      - id: rules
        nav: "Strokes &amp; events"
        eyebrow: "Core rules &amp; selection formats"
        heading: "The Olympic programme and how each stroke must be swum"
        parts:
          - table:
              caption: "Olympic swimming programme (World Aquatics rules, February 2026) — same for men and women"
              head: ["Stroke", "Events"]
              rows:
                - ["Freestyle", "50m, 100m, 200m, 400m, 800m, 1500m"]
                - ["Backstroke", "<strong>50m</strong>, 100m, 200m"]
                - ["Breaststroke", "<strong>50m</strong>, 100m, 200m"]
                - ["Butterfly", "<strong>50m</strong>, 100m, 200m"]
                - ["Individual medley", "200m, 400m"]
                - ["Relays", "4×100m and 4×200m freestyle · 4×100m medley · mixed 4×100m medley"]
            source: wa-cr
          - list:
              - "Freestyle, breaststroke, butterfly and individual medley start with a <strong>dive</strong>; backstroke and medley relays start <strong>in the water</strong>. The command is 'take your marks'."
              - "Any swimmer who <strong>starts before the signal may be disqualified</strong> — if the signal has already gone, the race continues and the swimmer is disqualified at the end."
              - "In freestyle, backstroke and butterfly a swimmer may be fully underwater for <strong>no more than 15 m</strong> after the start and each turn; the head must break the surface by the 15 m mark."
              - "Breaststroke: one arm stroke and one leg kick per cycle, arms moving together — never rolling onto the back except at the turn."
              - "Individual medley order: <strong>butterfly, backstroke, breaststroke, freestyle</strong>. Medley relay order: <strong>backstroke, breaststroke, butterfly, freestyle</strong>."
            source: "wa-cr,wa-commentary"
          - list:
              - "India's <strong>79th Senior National Aquatic Championships</strong> (Ahmedabad, 16–21 June 2026) used this full programme in a 50 m pool under the 2026 World Aquatics rules: heats and finals, the <strong>fastest eight</strong> reaching the final, and 800m/1500m freestyle as timed finals."
            source: sfi-sr26
      - id: recognition
        nav: "Recognition"
        eyebrow: "Institutional &amp; global recognition"
        heading: "Olympics, World Championships, Asian Games — and the cash award"
        parts:
          - table:
              caption: "Government cash award for a senior swimming medal (₹ lakh)"
              head: ["Event", "Gold", "Silver", "Bronze"]
              rows:
                - ["<strong>Olympic Games</strong>", "75", "50", "30"]
                - ["Asian Games / Commonwealth Games", "30", "20", "10"]
                - ["World Championships, long course (every 2 years)", "20", "14", "8"]
                - ["Asian Championships, long course (every 4 years)", "15", "10", "5"]
            source: myas-cash
          - note: "Relay swimmers get 75% of the individual amount; the coach of an individual medallist gets 50%. Apply on the DBT-MIS portal within six months."
            source: myas-cash
          - list:
              - "SFI publishes its own <strong>qualification systems</strong> for the 2026 Asian Games, the 2026 Commonwealth Games and the Asian Aquatics Championships, and selection policies for the World Championships and World Junior Championships."
            source: sfi-qual
      - id: eligibility
        nav: "Swimsuits &amp; age"
        eyebrow: "Physical benchmarks &amp; anti-doping"
        heading: "Legal swimsuits, minimum ages and doping control"
        parts:
          - list:
              - "Swimsuits must be on World Aquatics' <strong>List of Approved Swimwear</strong> at the time of the competition — a suit off the list is illegal at Olympic and World Aquatics events."
              - "<strong>Men</strong>: suit no higher than the navel and no lower than the knee, in one piece. <strong>Women</strong>: may not cover the neck or go past the shoulders or below the knee; one or two pieces."
              - "Material must be <strong>textile fabric</strong>, at most two layers, with no shapes or structures on the surface; nothing else may be worn on the body besides suit, cap and goggles."
            source: wa-cr
          - list:
              - "Olympic Games, World Championships and the 25 m World Championships: a swimmer must be <strong>at least 14 on 31 December</strong> of the competition year, or younger with at least the <strong>'B' entry time</strong>."
              - "World Junior Championships: aged <strong>14 to 18</strong> on 31 December of the competition year."
            source: wa-cr
          - list:
              - "NADA tests at the Senior Nationals; a swimmer called for testing must stay with the NADA escort, even between events."
              - "Every swimmer entered needs a valid <strong>SFI UID for 2026-27</strong>."
            source: sfi-sr26
          - list:
              - "Check every medicine against the <strong>Prohibited List</strong> and apply to NADA for a <strong>TUE</strong> if no permitted treatment exists."
            source: nada-rr
      - id: roadmap
        nav: "Roadmap"
        eyebrow: "Grassroots-to-elite residential pipeline"
        heading: "From sub-junior nationals to the National Talent Pool"
        parts:
          - table:
              caption: "SFI national championships, 2026 (new age groups adopted 18 May 2026)"
              head: ["Championship", "Groups", "Dates &amp; venue"]
              rows:
                - ["42nd Sub-Junior National", "Group III <strong>11–12</strong> (born 2014–15) · Group II <strong>13–14</strong> (born 2012–13)", "6–9 Aug 2026, Jaipur"]
                - ["52nd Junior National", "Group I(B) <strong>15–16</strong> (born 2010–11) · Group I(A) <strong>17–18</strong> (born 2008–09)", "18–23 Aug 2026, Bhubaneswar"]
                - ["79th Senior National", "Open", "16–21 June 2026, Ahmedabad"]
            source: "sfi-age,sfi-subjr26,sfi-jr26,sfi-sr26"
          - list:
              - "Entries go through the state unit on SFI's GMS portal. A swimmer may enter at most <strong>5 individual events</strong> with at least one qualifying time; a state may enter <strong>2 swimmers per event</strong> with the two-entry time."
              - "A state with fewer than 6 qualified swimmers per gender may fill up to 6 without times, in at most 2 events each."
            source: sfi-sr26
          - table:
              caption: "SFI National Talent Pool &amp; Development Pool (2026)"
              head: ["Pool", "Who", "What it gives"]
              rows:
                - ["<strong>National Talent Pool Athlete</strong>", "Age 13+ who meets SFI's age-specific time standards, electronically timed", "Eligibility for <strong>government-funded</strong> international exposure meets and national camps; SFI recommends NTPA swimmers for TOPS"]
                - ["Development Pool Athlete", "Ages 9–12, or scouted talent", "Regional camps and a long-term development plan"]
            source: sfi-ntpd
          - note: "TOPS selection itself is decided by SAI's <strong>Mission Olympic Cell</strong>. A swimmer who breaks the pool conditions for 6 months in a row, or stops training for more than 6 months, is dropped."
            source: sfi-ntpd
      - id: academies
        nav: "Pools"
        eyebrow: "Top elite academies &amp; cities"
        heading: "Where India's swimmers train"
        parts:
          - table:
              caption: "Verified swimming centres"
              head: ["Centre", "City", "What it is"]
              rows:
                - ["SAI NCOE — Dr SPM Swimming Pool Complex", "New Delhi", "SAI's residential centre for swimming (a priority discipline)"]
                - ["SAI NCOE Gandhinagar", "Gandhinagar, Gujarat", "Swimming for para athletes, with other sports"]
                - ["Inspire Institute of Sport — <strong>Mizuho High Performance Swimming Programme</strong>", "Vijayanagar, Karnataka", "Corporate-backed high-performance swimming at IIS"]
            source: "sai-schemes,iis-programmes"
          - warn: "We could not find a 'SAI Glenmark Aquatic Academy' in SAI's list of National Centres of Excellence, so Education Margdarshan does not list it. Ask any academy for its SAI or SFI recognition letter before paying fees."
            source: sai-schemes
      - id: costs
        nav: "Suits &amp; cost"
        eyebrow: "Equipment costs &amp; who pays"
        heading: "Tech suits, entry fees and who pays"
        parts:
          - list:
              - "A racing 'tech suit' is legal only if its model is on the <strong>approved list</strong>; check the label before buying. Education Margdarshan does not print suit prices — World Aquatics and SFI do not publish them."
            source: wa-cr
          - list:
              - "Senior Nationals entry: <strong>₹40 per event</strong> per swimmer and <strong>₹200 per relay team</strong>, paid by the state unit."
              - "A swimmer entered on a qualifying time who fails to swim the single-entry time in at least one event pays a <strong>₹1,000 penalty</strong> and gets no participation certificate."
            source: sfi-sr26
          - table:
              caption: "Who pays — swimming"
              head: ["Stage", "Paid by", "What you get"]
              rows:
                - ["National Talent Pool", "Government schemes via SFI", "International exposure meets, national camps"]
                - ["Khelo India athlete", "Ministry of Youth Affairs &amp; Sports", "<strong>₹6.28 lakh a year</strong> incl. ₹1.20 lakh cash"]
                - ["Junior medal prospect", "TOPS Development Group", "₹25,000 a month"]
                - ["Olympic prospect", "TOPS Core Group", "<strong>₹50,000 a month</strong> + approved training plan"]
                - ["Athlete in hardship", "PDU National Welfare Fund", "Up to ₹2.50 lakh"]
            source: "sfi-ntpd,pib-support"
          - list:
              - "<strong>Food first</strong> — no supplement is 100% safe and strict liability applies; NTPA swimmers also sign SFI's clean-sport and supplement declaration."
            source: "nada-supp,sfi-ntpd"
      - id: earnings
        nav: "Earnings &amp; jobs"
        eyebrow: "Earning channels &amp; central job quotas"
        heading: "Awards, admissions and sports-quota jobs"
        parts:
          - p: "SFI's own development plan says it plainly: in India a medal at the Nationals, the Khelo India Games or the National Games is the road to a <strong>college admission or a government job</strong>."
            source: sfi-ntpd
          - list:
              - "Swimming is one of the <strong>65 sports</strong> in the central sports quota for <strong>Group C</strong> posts, with up to 5 years' age relaxation (10 for SC/ST)."
              - "Medals at the Olympics, Asian Games, Commonwealth Games or World Championships can bring up to <strong>three out-of-turn promotions</strong>."
            source: dopt-2022
          - p: "Since <strong>4 March 2024</strong>, medals at Junior Nationals, the <strong>Khelo India Youth Games (above 18)</strong> and SGFI school games also count."
            source: dopt-2024
          - p: "Retired champions can receive the <strong>Pension to Meritorious Sportspersons</strong> of ₹12,000–20,000 a month."
            source: pib-support
      - id: traps
        nav: "Red flags"
        eyebrow: "Disqualification traps"
        heading: "Mistakes that cost swimmers a race"
        parts:
          - list:
              - "<strong>Moving before the signal</strong> — disqualification, even if the race is allowed to finish."
              - "<strong>Staying under past 15 m</strong> off the start or a turn."
              - "<strong>Racing in an unapproved suit</strong>, or wearing anything besides suit, cap and goggles."
            source: wa-cr
          - list:
              - "<strong>Late scratch from a final</strong> — withdraw within 30 minutes of the heats, or face a ₹1,000 fine or removal from the rest of the day's events."
              - "<strong>Relay names not handed in</strong> one hour before the session — the team is excluded."
              - "<strong>No valid SFI UID</strong> — no entry."
            source: sfi-sr26
