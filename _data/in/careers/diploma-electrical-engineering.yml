    parts:
      - prose:
          - "Government polytechnic fees for the full 3-year diploma are typically in the range of <strong>₹15,000-60,000</strong>, making it one of the most affordable technical qualifications in India. Private polytechnic institutes charge considerably more, often ₹60,000-1.5 lakh per year. Merit-based, SC/ST and income-linked scholarships are available at most government institutions. Always confirm current fees directly on your target institute's official admission page."
