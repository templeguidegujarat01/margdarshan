            source: "icc-test,icc-odi,icc-t20"
          - list:
              - "A match is two sides of <strong>eleven players</strong>; each captain names the 11 plus <strong>up to 4 substitute fielders</strong> to the match referee before the toss. <strong>Concussion replacements</strong> are allowed."
              - "By being nominated, a player agrees to the ICC's Code of Conduct, <strong>Anti-Doping Code</strong> and Anti-Corruption Code."
            source: icc-t20
          - table:
              caption: "Ball and bat limits (ICC Test playing conditions)"
              head: ["Item", "Limit"]
              rows:
                - ["Ball (new)", "<strong>155.9–163 g</strong>; circumference 22.4–22.9 cm"]
                - ["Bat length", "Not more than <strong>96.52 cm (38 in)</strong>; the handle no more than 52% of it"]
                - ["Blade", "<strong>Wood only</strong>; width ≤ 10.8 cm, depth ≤ 6.7 cm, edges ≤ 4.0 cm, and it must pass the bat gauge"]
            source: icc-test
          - table:
              caption: "BCCI domestic season 2026-27 — 1,788 matches"
