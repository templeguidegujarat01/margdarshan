  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "What is the difference between Occupational Therapy and Physiotherapy?"
            a: "They genuinely differ in focus. Physiotherapy centres on restoring movement and physical function through exercise and manual therapy. Occupational Therapy focuses specifically on helping patients perform daily living activities — dressing, eating, working, studying — and regain functional independence, often working with distinct patient populations including children with developmental disorders like autism."
          - q: "Is NEET required for Occupational Therapy?"
            a: "No. Occupational Therapy admission does not require NEET — colleges use CUET, their own entrance exams, state-level admissions, or direct Class 12 merit instead."
          - q: "What is a realistic Occupational Therapist salary in India?"
            a: "Freshers commonly earn ₹3-5 LPA. With 5-10 years of experience, specialised practitioners in neurological or paediatric rehabilitation commonly reach ₹7-10 LPA. Senior consultants and those running their own rehabilitation practice are reported to earn ₹12-20+ LPA."
          - q: "Is paediatric occupational therapy a good specialisation?"
            a: "Yes, it's reported as the field's fastest-growing segment. Rising awareness of autism, ADHD, and other developmental and sensory processing disorders has significantly increased demand for paediatric occupational therapists who can support children's motor development, sensory processing and daily-living skills."
          - q: "Can I work abroad as an occupational therapist?"
            a: "Yes, and demand is reported to be genuinely strong — countries like the USA, UK, Canada and Australia face real occupational therapist shortages, partly driven by their own ageing populations. This pathway is less standardised than nursing's international licensing process, so research your specific target country's requirements carefully."
      - note: "Figures are indicative (2026) — confirm on the official college or authority website."
        class: "table-note mt-lg"
