            text: "Junior roles in compliance, legal or security teams."
          - label: "Privacy manager"
            value: "Mid level"
            text: "Demand is rising as the DPDP Rules come into force."
          - label: "DPO"
            value: "Senior"
            text: "A board-level role in large organisations."
  - id: "jobs"
    hid: "jobs-heading"
    eyebrow: "Where they work"
    heading: "Employers & growth path"
    parts:
      - chips:
          - label: "Employers"
