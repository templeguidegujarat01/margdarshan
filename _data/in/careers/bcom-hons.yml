  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "What is the real difference between B.Com and B.Com Honours?"
            a: "B.Com Programme (sometimes called B.Com General) gives you a broader mix of commerce, some general-studies and language papers, and a bit more flexibility in electives. B.Com Honours goes deeper into your core commerce subjects — Accounting, Finance, Economics, Taxation and Business Law — with more advanced, specialised and often research-oriented coursework in the same core areas."
          - q: "Is B.Com Honours harder to get into than B.Com Programme?"
            a: "At most colleges that offer both, yes. B.Com Honours is usually the more sought-after option, so cutoffs and CUET score requirements tend to run higher for Honours than for the Programme course at the same college."
          - q: "Does B.Com Honours pay a higher starting salary than B.Com Programme?"
            a: "Not automatically. Salary depends far more on the specific college's placement record, your own skills and any add-on qualification (CA, CS, CMA, MBA) than on whether your degree said \"Honours\" or \"Programme\". Honours is generally viewed as marginally stronger for competitive recruiters and for postgraduate admissions, but it is not a guaranteed pay premium on its own."
          - q: "Can I do CA, CS or CMA alongside B.Com Honours?"
            a: "Yes. Many students pursue CA Intermediate, CS Executive or CMA Intermediate alongside B.Com Honours, since these professional courses are largely self-study with periodic exams. Honours' deeper accounting and taxation coverage genuinely overlaps with and supports these professional syllabi."
          - q: "Is B.Com Honours a 3-year or 4-year course?"
            a: "It is a 3-year (6-semester) course at most universities. Under NEP 2020, some universities now offer an optional 4th year leading to an \"Honours with Research\" degree instead of the standard 3-year Honours degree — this is an additional option at some institutions, not a universal requirement."
      - note: "*Fee, salary and placement figures are indicative, based on publicly available information as of 2026, and vary significantly by institution — always verify current figures directly on the official university or college website."
        class: "table-note mt-lg"
