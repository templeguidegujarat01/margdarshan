# Journey Blueprint — Statistical Officer (SSC CGL JSO · UPSC Indian Statistical Service). Printed on journey-statistical-officer.html (_includes/journey-doubts.html).
# Rules, classes and the money items / sources several careers share: _data/in/journey_common.yml.
# `money_defs` / `sources` below are used only by this career. Check: node scripts/check-journey-matrix.mjs
id: statistical-officer
v: 2
name: "Statistical Officer (SSC CGL JSO · UPSC Indian Statistical Service)"
search: ["statistical officer", "junior statistical officer", "statistical investigator", "indian statistical service", "iss officer", "government statistician", "statistician"]
page: "statistician.html"
roadmap: "roadmaps/statistician.html"
doubts_page: "journey-statistical-officer.html"
gate: "Class 12 Mathematics with 60% (then any degree) or a degree with Statistics → SSC CGL for Junior Statistical Officer (Pay Level 6, age 18–32). A bachelor's or master's with Statistics → UPSC Indian Statistical Service (Group A, age 21–30)."
gate_source: [cgl26, iss26]
core:
  what:
    text: "Government statisticians collect and analyse the numbers India runs on — surveys, prices and official data. The Ministry of Statistics and Programme Implementation hires Junior Statistical Officers through SSC's Combined Graduate Level exam, and UPSC recruits Indian Statistical Service officers."
    source: [cgl26, iss26]
  day:
    - "Plan and check surveys; clean and tabulate the data."
    - "Work out estimates and indices, and write reports for ministries."
    - "Use spreadsheets and statistical software every day."
  pay:
    - { level: "Junior Statistical Officer, MoSPI (SSC CGL 2026)", value: "Pay Level 6 · ₹35,400 – ₹1,12,400 · Group B", source: cgl26 }
    - { level: "Statistical Investigator Grade-II, Registrar General of India (SSC CGL 2026)", value: "Pay Level 6 · ₹35,400 – ₹1,12,400 · Group B", source: cgl26 }
  pay_note: "The 2026 UPSC notice does not print Indian Statistical Service pay, so we do not print it."
  routes:
    - { title: "SSC CGL → Junior Statistical Officer", text: "Any bachelor's degree with at least 60% in Class 12 Mathematics, or a degree with Statistics as a subject. Age 18–32. SSC's tentative list of 24 Sep 2026 shows 158 JSO vacancies.", source: [cgl26, cgl26-vac] }
    - { title: "SSC CGL → Statistical Investigator Grade-II", text: "A bachelor's in Statistics, Mathematics, Economics, Demography, Population Studies, Operation Research, IT, Computer Science / Engineering / Technology / Application, Data Science or AI. Age 18–30. 48 tentative vacancies (Census, Ministry of Home Affairs).", source: [cgl26, cgl26-vac] }
    - { title: "UPSC Indian Statistical Service", text: "A bachelor's with Statistics, Mathematical Statistics or Applied Statistics as a subject, or a master's in one of them. Age 21–30 on 1 Aug 2026. 28 ISS vacancies in 2026.", source: iss26 }
    - { title: "ISI B.Stat (Hons)", text: "A 3-year degree at ISI Kolkata after Class 12 with Mathematics and English — no tuition and a ₹5,000 monthly stipend.", source: [isi26, isi26-pros] }
  cost_time:
    - { label: "SSC CGL fee", value: "₹100 · women, SC, ST, PwBD and eligible ex-servicemen pay nothing", source: cgl26 }
    - { label: "UPSC IES / ISS fee", value: "₹200 · women, SC, ST and PwBD pay nothing", source: iss26 }
    - { label: "ISI B.Stat (Hons)", value: "3 years · no tuition · ₹5,000 a month stipend", source: isi26-pros }
  cost_note: "B.Sc Statistics fees vary by state, college and quota, so we print no national figure."
  challenges:
    - text: "CGL Tier-I cuts <strong>0.50 mark</strong> per wrong answer; Tier-II Paper-I cuts <strong>1 mark</strong> in Sections I–III, and the Statistics paper cuts 0.50."
      source: cgl26
    - text: "ISS is a 1,000-mark written exam plus a 200-mark viva, answered in English only — for 28 posts in 2026."
      source: iss26
    - text: "Statistics taught for only one or two semesters does not count for ISS — it must be studied in all years of the bachelor's degree."
      source: iss26
  not_for:
    - "You dislike Maths and long data tables."
    - "You want quick results — CGL runs for months from Tier-I to the final list."
    - "You avoid computers — Tier-II has a qualifying computer test and a data entry speed test."
journey:
  - stages: [c8, c9]
    title: "Fall in love with numbers"
    do:
      - text: "JSO eligibility can rest on <strong>60% in Class 12 Mathematics</strong>, so school Maths is the base of this whole road."
        source: cgl26
    doubts:
      - q: "What does a government statistical officer do?"
        a: "Junior Statistical Officers work in the Ministry of Statistics and Programme Implementation, and Indian Statistical Service officers are the central government's Group A statisticians. Both handle surveys and official data."
        next: "Read the Routes list above."
        source: [cgl26, iss26]
      - q: "Which is higher, JSO or ISS?"
        a: "ISS is a Group A service recruited by UPSC. JSO is a Group B post at Pay Level 6 recruited through SSC CGL."
        next: "Many start with CGL and try ISS within the age limit."
        source: [cgl26, iss26]
      - q: "Do I need to top Maths to become a statistical officer?"
        a: "There is no topper rule, but for JSO with a non-Statistics degree you need at least 60% in Mathematics in Class 12."
        next: "Aim for 60% or more in Class 12 Maths."
        source: cgl26
  - stages: [c10]
    title: "Keep Mathematics in Class 11"
    do:
      - text: "Take Mathematics in Class 11–12. ISI's B.Stat needs Class 12 with Mathematics and English."
        source: isi26
    stream: "Science with Maths, or Commerce / Arts with Mathematics."
    mistakes:
      - "Dropping Maths after Class 10 — it closes the JSO 60% door and ISI."
    doubts:
      - q: "Can a Commerce student become a statistical officer?"
        a: "Yes. JSO accepts any degree if you scored 60% in Class 12 Mathematics, or a degree with Statistics as a subject — so Commerce with Maths works."
        next: "Keep Mathematics in Class 11."
        source: cgl26
  - stages: [c11, c12]
    title: "Class 12 Maths and your degree choice"
    do:
      - text: "Score at least 60% in Class 12 Mathematics — it keeps JSO open whatever your degree."
        source: cgl26
      - text: "B.Sc seats at central universities go through CUET (UG): NTA runs the test, and each university makes its own merit list."
        source: cuet26
    exams:
      - { name: "CUET (UG) 2026", when: "11–31 May 2026 (bulletin schedule)", source: cuet26 }
    money: [csss]
    doubts:
      - q: "Which degree is best for the Indian Statistical Service?"
        a: "A bachelor's with Statistics, Mathematical Statistics or Applied Statistics as a subject in every year, or a master's in one of them. Statistics for only one or two semesters does not count."
        next: "Choose a B.Sc where Statistics runs through all years."
        source: iss26
      - q: "Is ISI B.Stat free?"
        a: "ISI charges no tuition for B.Stat (Hons) and pays a ₹5,000 monthly stipend, as per its 2026-27 prospectus."
        next: "Watch for ISI's admission notice in spring."
        source: isi26-pros
      - q: "How does CUET decide my B.Sc college?"
        a: "NTA only runs the test and publishes scores; each university prepares its own merit list and handles admission."
        next: "Read each university's B.Sc Statistics rules."
        source: cuet26
  - stages: [ug]
    title: "During the degree"
    do:
      - text: "ISS accepts final-year students; you must show proof of passing if called for the interview."
        source: iss26
      - text: "SSC CGL needs the degree by its cut-off date (1 Aug 2026 for CGL 2026)."
        source: cgl26
    doubts:
      - q: "Can I write ISS in my final year?"
        a: "Yes. Candidates appearing in the qualifying exam may apply, but must produce proof of passing if they are called for the personality test."
        next: "Plan your first ISS attempt in the final year."
        source: iss26
      - q: "What is the age limit for ISS?"
        a: "21 to 30 on 1 August of the exam year — for 2026, born between 2 August 1996 and 1 August 2005 — with relaxations for reserved categories."
        next: "Count your attempts by age."
        source: iss26
      - q: "Which degrees count for Statistical Investigator Grade-II?"
        a: "A bachelor's in Statistics, Mathematics, Economics, Demography, Population Studies, Operation Research, IT, Computer Science, Computer Engineering, Computer Technology, Computer Application, Data Science or Artificial Intelligence."
        next: "Check your degree title against the next CGL notice."
        source: cgl26
  - stages: [grad]
    title: "SSC CGL and UPSC ISS"
    do:
      - text: "CGL 2026: Tier-I held 30 Sep – 30 Oct 2026; Tier-II scheduled for December 2026."
        source: [cgl26-t1, cgl26]
      - text: "JSO and SI-II candidates also write Tier-II Paper-II: Statistics, 100 questions, 200 marks, 2 hours."
        source: cgl26
      - text: "ISS 2026 written exam began on 19 June 2026."
        source: iss26
    exams:
      - { name: "SSC CGL 2026 Tier-I", when: "30 Sep – 30 Oct 2026", source: cgl26-t1 }
      - { name: "SSC CGL 2026 Tier-II", when: "December 2026 (tentative)", source: cgl26 }
    money: [ssc-fee]
    doubts:
      - q: "Is there negative marking in SSC CGL?"
        a: "Yes: 0.50 per wrong answer in Tier-I; 1 mark in Sections I–III of Tier-II Paper-I; 0.50 in the Statistics paper."
        next: "Practise accuracy, not just speed."
        source: cgl26
      - q: "How is the JSO merit list made?"
        a: "From Tier-II only: Sections I and II of Paper-I plus Paper-II (Statistics), after you qualify the Computer Knowledge test and the data entry speed test."
        next: "Prepare Statistics early — it is 200 of your marks."
        source: cgl26
      - q: "How many JSO posts are there?"
        a: "SSC's tentative list of 24 September 2026 shows 158 JSO vacancies in MoSPI (Pay Level 6, Group B), out of 10,731 CGL vacancies in all."
        next: "Vacancies can change until the final result."
        source: cgl26-vac
      - q: "What is the ISS exam pattern?"
        a: "1,000 marks written plus a 200-mark viva. Statistics I and II are objective — 80 questions, 200 marks each, 2 hours; Statistics III and IV are descriptive. Everything is in English."
        next: "Read the ISS syllabus in UPSC's notice."
        source: iss26
      - q: "Who pays no fee for SSC CGL?"
        a: "Women, SC, ST, PwBD and ex-servicemen eligible for reservation. Everyone else pays ₹100."
        next: "Choose your category correctly in the form."
        source: cgl26
  - stages: [work]
    title: "Switching later"
    do:
      - text: "JSO's age limit (18–32) is higher than most CGL posts (18–27 or 18–30)."
        source: cgl26
    doubts:
      - q: "I am 31. Can I still become a statistical officer?"
        a: "For JSO in CGL 2026 the limit was 32 (born not earlier than 2 August 1994), so yes for general candidates, and reserved categories get more. ISS stops at 30 plus relaxations."
        next: "Check the age table in the next CGL notice."
        source: [cgl26, iss26]
board_note: "Every board counts. What matters is your Class 12 Mathematics mark (60% for the JSO route with a non-Statistics degree)."
board_source: cgl26
