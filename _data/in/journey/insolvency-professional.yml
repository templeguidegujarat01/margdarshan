# Journey Blueprint — Insolvency Professional (IBBI: LIE → IPA → registration). Printed on journey-insolvency-professional.html.
# Rules, classes and the money items / sources several careers share: _data/in/journey_common.yml.
id: insolvency-professional
v: 2
name: "Insolvency Professional (IBBI: Limited Insolvency Examination → registration)"
search: ["insolvency resolution professional", "insolvency professional", "resolution professional", "ibbi", "liquidator", "limited insolvency examination"]
page: "insolvency-professional.html"
roadmap: "roadmaps/insolvency-professional.html"
doubts_page: "journey-insolvency-professional.html"
gate: "Any stream → a degree and professional experience (10 years as a CA, CS, CMA or advocate; 10 years in law or management after an LLB or MBA; 15 years in management after a bachelor's) — or the 2-year Post Graduate Insolvency Programme with no experience → pass IBBI's Limited Insolvency Examination → join an Insolvency Professional Agency, finish its pre-registration course → register with IBBI."
gate_source: [ibbi-ipreg, ibbi-lie26, pgip-faq]
core:
  what:
    text: "An insolvency professional (IP) runs the insolvency resolution or liquidation of a company or person under the Insolvency and Bankruptcy Code, 2016. IPs are registered by the Insolvency and Bankruptcy Board of India (IBBI), and passing its Limited Insolvency Examination is a mandatory condition."
    source: [ibbi-liefaq, ibbi-ipreg]
  day:
    - "Take charge of a company in insolvency as interim resolution professional, resolution professional or liquidator."
    - "Collect and verify creditors' claims and run the Committee of Creditors."
    - "Report to the National Company Law Tribunal (NCLT) and IBBI."
  pay_note: "IP fees and salaries are not set by an official pay scale, so none are printed."
  routes:
    - { title: "Experience route", text: "10 years as a CA, CS, cost accountant or advocate; or 10 years in law after an LLB; or 10 years in management after an MBA / 2-year PGDM; or 15 years in management after a bachelor's degree.", source: ibbi-ipreg }
    - { title: "Post Graduate Insolvency Programme (no experience)", text: "Finishing the IBBI-approved Post Graduate Insolvency Programme makes you eligible without the years of experience. IICA's 2026-28 batch admitted 52 students through GIPCET, group discussion and interview.", source: [ibbi-ipreg, pgip-faq, ibbi-liefaq] }
    - { title: "Then: LIE + IPA + registration", text: "Pass the Limited Insolvency Examination within 12 months before enrolling with an Insolvency Professional Agency, complete its 50-hour pre-registration educational course, then apply to IBBI for registration.", source: [ibbi-ipreg, ibbi-liefaq] }
  cost_time:
    - { label: "LIE fee", value: "₹5,000 + GST = ₹5,900 per enrolment", source: ibbi-lie26 }
    - { label: "PGIP (IICA) fee", value: "₹13.50 lakh for the 2-year residential programme, incl. boarding and lodging", source: pgip-faq }
  challenges:
    - text: "Without the PGIP, you need 10 to 15 years of professional or management experience first."
      source: ibbi-ipreg
    - text: "LIE is tough: negative marking of 25% for each wrong answer and a 60% pass mark."
      source: ibbi-lie26
    - text: "Your LIE pass counts only if you enrol with an IPA within 12 months of it."
      source: ibbi-ipreg
  not_for:
    - "You want a first job straight after graduation — most IPs come with a decade of experience."
    - "You dislike law, accounts and long legal procedures."
    - "You avoid hard decisions under pressure from creditors and courts."
journey:
  - stages: [c8, c9]
    title: "Reading, numbers and law"
    do:
      - text: "IBBI's exam covers the Insolvency and Bankruptcy Code, its rules and regulations, business laws such as the Companies Act, general laws, case laws and case studies."
        source: ibbi-lie26
    doubts:
      - q: "What does an insolvency professional do?"
        a: "An IP manages the insolvency resolution or liquidation of a company or person under the Insolvency and Bankruptcy Code, 2016. IBBI registers IPs, and its Limited Insolvency Examination is a mandatory step."
        next: "Read the Routes list above."
        source: [ibbi-liefaq, ibbi-ipreg]
  - stages: [c10]
    title: "Any stream works"
    do:
      - text: "The routes start from a CA, CS, CMA, LLB, MBA / PGDM, B.E. / B.Tech or a bachelor's degree — no single Class 11 stream is fixed."
        source: [ibbi-ipreg, pgip-faq]
    stream: "Commerce or Arts suit CA, CS, CMA and law; Science suits B.E. / B.Tech — all can lead here."
    doubts:
      - q: "Which stream is best for becoming an insolvency professional?"
        a: "IBBI does not fix a school stream. Its routes start from CA, CS, cost accountancy, law, MBA / PGDM or a bachelor's degree, and the Post Graduate Insolvency Programme also admits B.E. / B.Tech graduates."
        next: "Choose the stream for the professional course you want first."
        source: [ibbi-ipreg, pgip-faq]
  - stages: [c11, c12]
    title: "Pick your first profession"
    do:
      - text: "CAs, CSs, cost accountants and advocates qualify after 10 years' experience in their profession."
        source: ibbi-ipreg
    doubts:
      - q: "Can I become an insolvency professional right after Class 12?"
        a: "No. You first need a degree or professional qualification, and then either years of experience or the Post Graduate Insolvency Programme."
        next: "Start with CA, CS, CMA, law, or a degree you can build on."
        source: [ibbi-ipreg, pgip-faq]
      - q: "Is CA or LLB better for this career?"
        a: "Both work. IBBI accepts 10 years as a CA, CS, cost accountant or advocate, or 10 years in law after an LLB. The PGIP also admits CAs, advocates, cost accountants and company secretaries."
        next: "Pick the one you would enjoy for ten years."
        source: [ibbi-ipreg, pgip-faq]
  - stages: [ug]
    title: "Degree — and the PGIP option"
    do:
      - text: "IICA's PGIP 2026-28 took CAs, advocates, cost accountants, company secretaries, B.E. / B.Tech graduates and postgraduates in Economics, Finance, Commerce, Management, Insolvency or Law with 50%."
        source: pgip-faq
    doubts:
      - q: "What is the Post Graduate Insolvency Programme?"
        a: "An IBBI-approved programme for students who want insolvency as a career. Finishing it makes you eligible without the years of experience the regulations otherwise ask for."
        next: "Check the institutes running it (IICA and others approved by IBBI)."
        source: [ibbi-ipreg, ibbi-liefaq]
      - q: "Can a final-year student apply for the PGIP entrance?"
        a: "Yes. IICA's GIPCET FAQ says candidates who have appeared for their final exams and are awaiting results may apply, if they submit the passing certificate by the notified date."
        next: "Apply in your final year."
        source: pgip-faq
      - q: "Is there an age limit for the PGIP?"
        a: "For IICA's 2026-28 batch, not more than 28 years on 30 April 2026 (33 for SC / ST / PwD and 31 for OBC non-creamy layer)."
        next: "Apply while you are within the age limit."
        source: pgip-faq
      - q: "What does the PGIP cost?"
        a: "IICA charges ₹13.50 lakh for the two-year residential programme, covering tuition, boarding and lodging."
        next: "Plan your finances or an education loan early."
        source: pgip-faq
  - stages: [grad]
    title: "Pass the Limited Insolvency Examination"
    do:
      - text: "LIE from 1 October 2026: online, objective MCQs, 2 hours, −25% for a wrong answer, 60% to pass, on every working day at centres across India."
        source: ibbi-lie26
    exams:
      - { name: "Limited Insolvency Examination (Phase 10 syllabus)", when: "Every working day from 1 Oct 2026 · book your own slot", source: ibbi-lie26 }
    doubts:
      - q: "What is the pass mark in the Limited Insolvency Examination?"
        a: "60%. A wrong answer costs 25% of the marks for that question, every question must be answered, and the test lasts 2 hours."
        next: "Answer only when you are sure of the option."
        source: ibbi-lie26
      - q: "How much is the LIE fee?"
        a: "₹5,000 plus GST, that is ₹5,900, on every enrolment. Registration on the exam portal itself is free."
        next: "Budget for a retake."
        source: [ibbi-lie26, ibbi-liefaq]
      - q: "When can I take the LIE?"
        a: "It runs on every working day at centres across the country. You pick the date, time and centre when you enrol on IBBI's exam portal."
        next: "Book a slot when you are ready."
        source: ibbi-lie26
      - q: "Can I take notes or a bare Act into the LIE?"
        a: "No. No workbook or study material is allowed or provided, and no electronic devices, including mobile phones and smart watches, are allowed."
        next: "Prepare to answer from memory."
        source: ibbi-lie26
      - q: "Does my LIE pass expire?"
        a: "You must enrol with an Insolvency Professional Agency within 12 months of passing; IBBI's regulations count only a pass in the 12 months before your enrolment application."
        next: "Enrol with an IPA soon after passing."
        source: ibbi-ipreg
  - stages: [work]
    title: "IPA, pre-registration course, IBBI registration"
    do:
      - text: "After passing: seek membership of an Insolvency Professional Agency, finish its 50-hour pre-registration educational course, then register as an IP."
        source: ibbi-liefaq
    doubts:
      - q: "I am a CA with 10 years' experience. What are my steps?"
        a: "Pass the LIE, enrol with an Insolvency Professional Agency within 12 months, complete its pre-registration educational course, and apply to IBBI for registration."
        next: "Book your LIE slot."
        source: [ibbi-ipreg, ibbi-liefaq]
      - q: "Who cannot be registered as an insolvency professional?"
        a: "Among others: a minor, a person not resident in India, someone without the required qualification and experience, an undischarged insolvent, or someone convicted of certain offences — and IBBI checks that you are 'fit and proper'."
        next: "Read regulation 4 of the IP Regulations before you apply."
        source: ibbi-ipreg
board_note: "Any board and stream. The route starts after a degree or professional qualification."
board_source: ibbi-ipreg
