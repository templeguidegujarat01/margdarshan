      - note: "All levels are computer-based, taken at approved test centres. A Practical Skills Module (PSM) — 10-15 hours of case studies and MCQs — must be completed at each level to receive your result. You may sit a given level a maximum of twice per calendar year."
  - id: "passing"
    hid: "passing-heading"
    eyebrow: "Different from Indian professional bodies"
    heading: "How CFA passing actually works"
    parts:
      - prose:
          - "Unlike ICAI, ICSI or ICMAI's fixed \"40% per paper + 50% aggregate\" rule, CFA Institute does not publish a fixed passing percentage. Instead, each exam has a <strong>Minimum Passing Score (MPS)</strong> set through a standard-setting process after the exam is administered, based on the difficulty of that specific exam. You'll only ever see a simple <strong>pass or fail</strong> result — Level I and II give you a topic-level score breakdown if you fail; Level III only gives a score report if you fail."
      - warn_box: "<strong>Common mistake:</strong> assuming a rough \"70% correct\" target like some competitive exams. Because the MPS moves with each exam's difficulty, chasing a fixed personal percentage target is the wrong strategy — focus on covering the full curriculum breadth instead."
