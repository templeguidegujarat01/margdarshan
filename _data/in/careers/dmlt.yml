            fact: "Lab technicians perform and process tests; interpreting and certifying diagnostic reports is legally the role of a qualified pathologist, not the lab technician."
          - myth: "DMLT can start and independently run a diagnostic lab."
            fact: "Most states require a qualified pathologist (or equivalent) as the responsible signing authority for a diagnostic lab — DMLT holders can work in or help manage a lab, but not independently head one as the certifying authority."
          - myth: "Lab technology careers are low-growth compared to nursing or pharmacy."
            fact: "The diagnostic sector has grown rapidly with expanding hospital networks and diagnostic chains, creating steady, ongoing demand for trained lab technicians."
