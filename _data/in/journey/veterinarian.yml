# Journey Blueprint — Veterinary Doctor (B.V.Sc &amp; A.H.). Printed on journey-veterinarian.html (_includes/journey-doubts.html).
# Rules, classes and the money items / sources several careers share: _data/in/journey_common.yml.
# `money_defs` / `sources` below are used only by this career. Check: node scripts/check-journey-matrix.mjs
id: veterinarian
v: 2
name: "Veterinary Doctor (B.V.Sc &amp; A.H.)"
search: ["veterinarian", "veterinary surgeon", "veterinary physician", "vet doctor", "poultry veterinarian", "zoo veterinarian", "wildlife veterinarian", "animal shelter veterinarian", "army veterinary officer"]
search_not: ["technician", "assistant", "coordinator", "representative", "analyst", "processor", "pharmacist", "manager", "administrator", "receptionist"]
page: "veterinarian.html"
roadmap: "roadmaps/veterinarian.html"
doubts_page: "journey-veterinarian.html"
gate: "Class 12 with Physics, Chemistry, Biology and English (50% aggregate) → NEET (UG) for the 15% VCI quota, or your state's own route for state seats → B.V.Sc &amp; A.H.: 5½ years including a 1-year internship → veterinary practice, government service or a master's."
gate_source: [vci-ib, neet-ib]
core:
  what:
    text: "A veterinary doctor diagnoses and treats illness in animals — pets, farm animals, poultry and wildlife — and helps keep milk, meat and eggs safe. The Veterinary Council of India regulates veterinary education and practice and keeps the Indian Veterinary Practitioners' Register."
    source: vci-ib
  day:
    - "Examine and treat animals in a clinic, a government veterinary hospital or on farms in villages."
    - "Vaccinate herds, test for disease, help animals give birth and do surgery."
    - "Advise farmers and pet owners, and keep treatment and vaccination records."
  pay_note: "We could not open an official 2026 notice that prints veterinary officer pay, and no official body publishes private veterinary pay — so no pay is printed here yet."
  routes:
    - { title: "Clinic or farm practice", text: "Treat pets or livestock in your own or another vet's practice after the degree.", source: vci-ib }
    - { title: "Government veterinary service", text: "States run veterinary hospitals and dispensaries and recruit veterinary graduates through their own commissions — see your state's offices in the State rules section of this page." }
    - { title: "Master's and research", text: "A master's after B.V.Sc &amp; A.H. leads to specialist, teaching and research work." }
  cost_time:
    - { label: "B.V.Sc &amp; A.H.", value: "5½ years, including a compulsory 1-year internship", source: vci-ib }
    - { label: "NEET (UG) fee 2026", value: "₹1,700 General · ₹1,600 EWS / OBC-NCL · ₹1,000 SC / ST / PwBD / third gender", source: neet-ib }
    - { label: "VCI stray-round deposit 2026", value: "₹50,000 General / OBC / EWS · ₹25,000 SC / ST / PH (refunded after counselling, forfeited if you skip an allotted seat)", source: vci-ib }
  cost_note: "Private veterinary college fees are set by the state government or the university; VCI has no role in fees."
  challenges:
    - text: "Only <strong>15% of seats</strong> are filled all-India by VCI — <strong>858 seats</strong> in 2026-27. Most seats are state seats with each state's own rules."
      source: vci-ib
    - text: "You need <strong>50% in English, Physics, Chemistry and Biology</strong> in Class 12 (47.5% for SC / ST and other special categories) on top of NEET."
      source: vci-ib
    - text: "Miss reporting after a Round 1 allotment and you are out of every later VCI round."
      source: vci-ib
  not_for:
    - "You are scared of large animals or cannot handle blood and dirt."
    - "You want only a city job — much veterinary work is on farms and in villages."
    - "You expect pet clinics alone to keep you busy everywhere — livestock work is a big part of the job."
journey:
  - stages: [c8, c9]
    title: "Science, and time with animals"
    do:
      - text: "NEET (UG) — used for the all-India veterinary quota — has <strong>90 Biology questions out of 180</strong>. Build your Biology base now."
        source: neet-ib
      - text: "Spend time at a dairy, a gaushala or an animal shelter with an adult to see if you enjoy the work."
    doubts:
      - q: "Do I need NEET to become a vet?"
        a: "For the 15% all-India VCI quota, yes — VCI fills those seats from the NEET (UG) 2026 merit list. State seats follow each state's own rules: Karnataka uses KCET, and Andhra Pradesh and Telangana use EAPCET."
        next: "Check your state's route in the State rules section of this page and plan for both."
        source: [vci-ib, kcet-ib, eap-ib, tg-eap-dn]
      - q: "Who controls veterinary education in India?"
        a: "The Veterinary Council of India, a statutory body set up under the Indian Veterinary Council Act, 1984. It regulates veterinary practice and education and keeps the Indian Veterinary Practitioners' Register."
        next: "Join only a VCI-recognised veterinary college."
        source: vci-ib
  - stages: [c10]
    title: "Choose Science with Biology and English"
    do:
      - text: "Class 12 must have <strong>Physics, Chemistry, Biology or Biotechnology, and English</strong>, with practical tests in the science subjects."
        source: vci-ib
    stream: "PCB with English."
    mistakes:
      - "Taking PCM without Biology — the veterinary degree needs Biology or Biotechnology."
    doubts:
      - q: "Can a PCM student become a vet?"
        a: "Not without Biology or Biotechnology. The veterinary degree needs Physics, Chemistry, Biology or Biotechnology and English in Class 12."
        next: "Choose PCB for Class 11."
        source: vci-ib
      - q: "Can I become a vet after Class 10?"
        a: "Not a veterinary doctor — the degree needs Class 12 Science. Some states run veterinary diplomas after Class 10; Telangana fills them through POLYCET."
        next: "For the full degree, take PCB in Class 11."
        source: [vci-ib, tg-poly]
  - stages: [c11, c12]
    title: "Class 12 marks, NEET and VCI counselling"
    do:
      - text: "Score <strong>50% aggregate in English, Physics, Chemistry and Biology</strong> (47.5% for SC / ST and other special categories)."
        source: vci-ib
      - text: "You must be <strong>17 by 31 December</strong> of the admission year."
        source: vci-ib
      - text: "After NEET, register on <strong>vci.admissions.nic.in</strong> for the 15% quota, and separately for your state's veterinary admissions."
        source: vci-ib
    exams:
      - { name: "NEET (UG) 2026", when: "Re-held 21 June 2026 · result 16 July 2026", source: [neet-re, neet-res] }
      - { name: "VCI counselling 2026-27", when: "Round 1 registration 18–23 Aug · Round 2 from 1 Sept · stray round 9–10 Sept 2026", source: vci-sch }
    money: [neet-fee, csss, pms-sc]
    mistakes:
      - "Not reporting to the college after a Round 1 allotment — you lose every later VCI round."
      - "Forgetting your state's own veterinary admission, where most seats are."
    late: "Missed this year? NEET has no cap on attempts, and the VCI rule sets only a minimum age of 17."
    doubts:
      - q: "How many marks do I need in Class 12 to become a vet?"
        a: "At least 50% aggregate in English, Physics, Chemistry and Biology or Biotechnology — 47.5% for SC, ST and other special categories."
        next: "Keep your English marks up too — they count in the 50%."
        source: vci-ib
      - q: "How many seats does VCI fill?"
        a: "15% of the seats in recognised veterinary colleges, all-India. In 2026-27 that was 858 seats."
        next: "Register for your state's admissions as well."
        source: vci-ib
      - q: "How are VCI quota seats reserved?"
        a: "SC 15%, ST 7.5%, EWS 10% and OBC (non-creamy layer, central list) 27%, with 5% horizontal reservation for persons with disabilities."
        next: "Keep your category certificate in the central format ready."
        source: vci-ib
      - q: "Are private veterinary colleges in the VCI quota?"
        a: "Yes. Seats are allotted in recognised government and private veterinary colleges. Private-college fees are set by the state or the university, not by VCI."
        next: "Check each college's fee before you fill choices."
        source: vci-ib
      - q: "What is the VCI stray round fee?"
        a: "₹50,000 for General, OBC and EWS and ₹25,000 for SC, ST and PH candidates. It is refunded after counselling, but forfeited if you are allotted a seat and do not take it."
        next: "Join the stray round only if you will really take the seat."
        source: vci-ib
      - q: "What if I get a VCI seat in Round 1 but do not report?"
        a: "The seat is cancelled and given to someone else, and you cannot take part in any later VCI round. Only students who reported in time may upgrade through re-choice in Round 2."
        next: "Report within the dates even if you hope to upgrade."
        source: vci-ib
  - stages: [ug]
    title: "In B.V.Sc &amp; A.H."
    do:
      - text: "The course lasts <strong>5½ years</strong>, including a compulsory internship of one year."
        source: vci-ib
    doubts:
      - q: "How long is the veterinary course?"
        a: "Five and a half years, which includes a compulsory one-year internship."
        next: "Plan for about 5½ years before you can practise."
        source: vci-ib
      - q: "Who decides my veterinary college fee?"
        a: "Your state government or the university or college. VCI has no role in fees."
        next: "Read the fee notice of the college before you join."
        source: vci-ib
  - stages: [grad]
    title: "Register, then practise or join government service"
    do:
      - text: "Get your name on the practitioners' register before you practise — VCI keeps the Indian Veterinary Practitioners' Register."
        source: vci-ib
      - text: "Watch your state commission and animal husbandry department for veterinary officer posts."
    doubts:
      - q: "Do I need registration to work as a vet?"
        a: "Yes. The Veterinary Council of India regulates veterinary practice and keeps the Indian Veterinary Practitioners' Register — the list of vets allowed to practise."
        next: "Ask your college for the registration form in your internship year."
        source: vci-ib
      - q: "Is there government work for vets?"
        a: "Yes. States run veterinary hospitals and dispensaries and recruit veterinary graduates through their own public service commissions and animal husbandry departments."
        next: "Open your state's recruitment office listed in the State rules section of this page."
  - stages: [work]
    title: "Starting later"
    do:
      - text: "The VCI rule sets only a minimum age of 17, and NEET (UG) has no upper age limit. State routes may have their own age rules."
        source: [vci-ib, neet-ib]
    doubts:
      - q: "Is there an upper age limit for B.V.Sc?"
        a: "The VCI 2026-27 bulletin sets only a minimum age — 17 by 31 December 2026 — and NEET (UG) has no upper age. Your state's route may add its own rule."
        next: "Check your state's brochure if you are older."
        source: [vci-ib, neet-ib]
board_note: "Veterinary admission needs Class 12 with Physics, Chemistry, Biology or Biotechnology and English, 50% aggregate (47.5% SC / ST). Every recognised board counts; foreign boards need an AIU equivalence certificate."
board_source: vci-ib
exam:
  name: "NEET (UG) 2026 → VCI 15% quota counselling"
  body: "NTA (test) · Veterinary Council of India (counselling)"
  href: "neet-ug.html"
  facts:
    - { label: "VCI seats 2026-27", value: "858 (15% all-India quota)", source: vci-ib }
    - { label: "Class 12 marks", value: "50% · 47.5% SC / ST", source: vci-ib }
    - { label: "Course", value: "5½ years incl. 1-year internship", source: vci-ib }
    - { label: "Merit", value: "NEET (UG) 2026 rank only", source: vci-ib }
  stages:
    head: ["Stage", "What it is", "Rule"]
    rows:
      - ["NEET (UG)", "National test; its merit list is used for VCI seats", "Qualify NEET"]
      - ["VCI Round 1", "Register, fill and lock choices, report to the college", "Not reporting ends your VCI counselling"]
      - ["VCI Round 2", "Re-choice for those who reported, plus new registrations", "A Round 2 seat cancels the Round 1 seat"]
      - ["Stray round", "Vacant seats only", "₹50,000 / ₹25,000 refundable deposit"]
    source: [vci-ib, vci-sch]
  notes:
    - text: "No other merit or weightage counts for the VCI quota — only the NEET (UG) 2026 rank, subject to the eligibility rules."
      source: vci-ib
state_uses: [board, tech, med, scholarship, psc]
state_rules:
  - state: karnataka
    text: "B.V.Sc &amp; A.H. government seats go through <strong>KCET (PCB)</strong>; you need 50% in Physics, Chemistry, Biology and English (40% reserved). An agriculturist quota adds a practical test (merit = 50% CET + 50% practical)."
    source: kcet-ib
    href: "state/karnataka/kcet.html"
  - state: telangana
    text: "<strong>TG EAPCET</strong> admits to B.V.Sc. with 50% in English, Physics, Chemistry and Biology (10% less for SC / ST). Veterinary diplomas after Class 10 go through <strong>POLYCET</strong> (age 15–22 at admission)."
    source: [tg-eap-dn, tg-poly]
    href: "state/telangana/eapcet.html"
  - state: andhra-pradesh
    text: "<strong>AP EAPCET</strong> admits to B.V.Sc. &amp; A.H.; the agriculture and pharmacy stream test ran on 19–20 May in 2026."
    source: eap-ib
    href: "state/andhra-pradesh/eapcet.html"
  - state: kerala
    text: "Veterinary and allied courses in Kerala's KEAM process are ranked on <strong>NEET-UG 2026</strong>."
    source: ke-noti
    href: "state/kerala/keam.html"
  - text: "VCI fills 15% of seats in every recognised veterinary college all-India on NEET merit; the rest are filled under each state's or university's own rules."
    source: vci-ib
