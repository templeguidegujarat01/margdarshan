  - id: "fees"
    hid: "fees-heading"
    eyebrow: "You're paid to train, not the other way around"
    heading: "Cost & training stipend"
    parts:
      - prose:
          - "Unlike most other career paths, NDA involves <strong>no tuition fees</strong> — training is fully funded, and cadets receive a <strong>stipend of ₹56,100 per month</strong> throughout the roughly 4-year training period at the NDA and the respective service academy. This is a genuine, significant financial advantage over degree routes that require years of tuition payment before any income begins."
