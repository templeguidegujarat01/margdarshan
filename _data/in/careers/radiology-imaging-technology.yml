            fact: "A Radiographer (Radiology Technologist) operates the imaging equipment and positions patients; a Radiologist is a medical doctor (MBBS + MD Radiology) who interprets the images and writes the diagnostic report. The qualification paths and scope of practice differ substantially."
          - myth: "AI will make radiology technologists obsolete."
            fact: "AI assists radiologists in image interpretation, but technologists handle patient positioning, machine operation, contrast administration and safety — none of which AI performs. These remain fundamentally hands-on tasks."
          - myth: "All imaging specialisations pay roughly the same."
            fact: "MRI Technology is reported to carry a genuine 20-35% salary premium over general radiography, since it's currently the most in-demand specific imaging specialisation — deliberately building this skill is a real, direct lever for higher pay."
