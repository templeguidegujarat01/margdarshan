  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Is Bachelor of Accounting the same as BAF?"
            a: "Yes. In India, \"Bachelor of Accounting\" almost always refers to BAF — Bachelor of Accounting and Finance — a specialised 3-year undergraduate degree offered at colleges like SRCC and Hindu College under Delhi University, at University of Mumbai-affiliated colleges, at Gujarat University, and at many others nationally."
          - q: "Is BAF available outside Mumbai and Delhi?"
            a: "Yes, unlike BFM, BAF is far more widely available — offered at Delhi University, University of Mumbai colleges, Gujarat University, and numerous other universities and colleges across India."
          - q: "Does BAF guarantee I'll become a CA?"
            a: "No. BAF builds a genuinely strong accounting and taxation foundation that makes CA preparation easier, but it does not replace the CA Foundation, Intermediate and Final exams or the mandatory articleship — those still need to be cleared separately through ICAI."
          - q: "Is BAF better than B.Com for an accounting career?"
            a: "Neither is universally better. BAF front-loads accounting, cost accounting, taxation and auditing more intensively and earlier, which suits students already committed to an accounting or CA-focused career. B.Com is broader and keeps options like CS, CMA and general business roles more naturally open."
          - q: "Can I do CPA or ACCA after BAF?"
            a: "Yes. BAF's accounting-heavy syllabus overlaps meaningfully with both CPA (US) and ACCA (UK) curricula, making it a genuinely useful base if you're aiming at an international accounting qualification alongside or instead of CA."
