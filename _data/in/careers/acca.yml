    eyebrow: "ACCA's biggest advantage over CA/CS/CMA"
    heading: "Exemptions — skip papers you've already covered"
    intro: "Exemptions apply only to Applied Knowledge and Applied Skills (9 papers total) — never to Strategic Professional, which every candidate must sit regardless of background."
