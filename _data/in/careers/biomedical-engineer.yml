sections:
  - id: "quick"
    hid: "quick-heading"
    alt: true
    eyebrow: "Quick answers"
    heading: "Biomedical Engineer at a glance"
    intro: "Check whether your Class 12 background qualifies. Duration and pay are in the summary at the top of the page."
    parts:
      - subhead: "Can I apply from my stream?"
      - streams:
          - label: "Science"
            fit: "Eligible"
            tone: "y"
            icon: "science"
          - label: "Commerce"
            fit: "Not eligible"
            tone: "n"
            icon: "commerce"
          - label: "Arts / Humanities"
            fit: "Not eligible"
            tone: "n"
            icon: "arts"
      - note: "Class 12 with Physics, Chemistry and Mathematics; a few colleges also admit PCB students with Maths."
  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What does a Biomedical Engineer do?"
    parts:
      - overview:
          points:
            - "Biomedical engineers design and test devices, run hospital equipment programmes (installation, calibration, safety, maintenance) and support doctors with technology."
            - "In industry they work in R&D, quality, regulatory affairs, clinical applications and field service for device makers."
            - "Specialisations include medical imaging, biomaterials and implants, rehabilitation engineering and medical electronics."
  - id: "who"
    hid: "who-heading"
    alt: true
    eyebrow: "Fit check"
    heading: "Who should become a Biomedical Engineer"
    parts:
      - fit:
          match:
            - "Like both engineering and biology/medicine."
            - "Enjoy electronics, sensors and problem-solving."
            - "Want to work in healthcare without being a doctor."
          mismatch:
            - "Want a pure software career — CSE is more direct."
            - "Dislike hospital environments."
            - "Expect many campus placements — the field is smaller than CSE or mechanical."
  - id: "eligibility"
    hid: "elig-heading"
    eyebrow: "Eligibility"
    heading: "What you need, stage by stage"
    parts:
      - elig_list:
          - "Class 12 with <strong>Physics, Chemistry and Mathematics</strong> (some colleges accept PCB with Maths)."
          - "Admission through <strong>JEE Main</strong>, JoSAA/CSAB counselling or the <strong>state engineering CET</strong>."
          - "Minimum Class 12 marks as set by each counselling authority."
  - id: "roadmap"
    hid: "roadmap-heading"
    alt: true
    eyebrow: "Step-by-step"
    heading: "Your full path to becoming a Biomedical Engineer"
    parts:
      - steps:
          - title: "Class 12 PCM"
            text: "Strong Physics and Maths matter."
          - title: "JEE Main / state CET"
            text: "Rank decides the college."
          - title: "B.Tech Biomedical Engineering"
            text: "Electronics, physiology, imaging, biomaterials."
          - title: "Internship"
            text: "Hospital clinical engineering or a device company."
          - title: "First job"
            text: "Clinical engineer, service engineer, R&D or regulatory associate."
          - title: "Higher study (optional)"
            text: "M.Tech/MS for R&D roles."
  - id: "exams"
    hid: "exams-heading"
    eyebrow: "Exams & licences"
    heading: "Entrance exams and industry rules"
    parts:
      - chips:
          - label: "JEE Main"
            text: "National engineering entrance used for NITs and many other colleges."
            source: "jee"
          - label: "State CETs"
            text: "Most state engineering colleges admit through their own CET."
          - label: "Medical device regulation"
            text: "CDSCO licenses the manufacture and import of medical devices; regulatory roles need this knowledge."
            source: "cdsco"
          - label: "GATE (later)"
            text: "Biomedical Engineering is a GATE paper, used for M.Tech admission."
  - id: "salary"
    hid: "salary-heading"
    alt: true
    eyebrow: "Indicative figures"
    heading: "Biomedical Engineer pay in India"
    intro: "Pay varies a lot by employer, city and experience; these are broad, commonly reported ranges, not guarantees."
    parts:
      - salary:
          - label: "Fresher"
            value: "Entry level"
            text: "Service and clinical engineering roles are common first jobs."
          - label: "Experienced"
            value: "Mid level"
            text: "R&D, applications and regulatory specialists earn more."
          - label: "Senior"
            value: "High"
            text: "Product, regulatory and business leadership in device companies."
  - id: "jobs"
    hid: "jobs-heading"
    eyebrow: "Where they work"
    heading: "Employers & growth path"
    parts:
      - chips:
          - label: "Employers"
            text: "Hospitals, medical-device makers, imaging companies, diagnostics firms, regulatory consultancies"
          - label: "Growth path"
            text: "Clinical / service engineer → specialist → manager (biomedical dept, product, regulatory)"
          - label: "Research"
            text: "IITs, IISc and medical-technology incubators run biomedical research"
  - id: "proscons"
    hid: "pc-heading"
    alt: true
    eyebrow: "Honest take"
    heading: "Advantages and disadvantages"
    parts:
      - proscons:
          pros:
            - "Meaningful healthcare impact."
            - "Growing Indian medical-device industry."
            - "Blend of engineering and biology."
          cons:
            - "Fewer colleges and campus jobs than core branches."
            - "Early field-service jobs can be travel-heavy."
            - "R&D roles often need a master's degree."
  - hid: "related-heading"
    alt: true
