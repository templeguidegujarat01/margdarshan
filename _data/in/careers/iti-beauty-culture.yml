          - q: "What is the difference between ITI Beauty Culture & Hair and a private beauty academy course?"
            a: "ITI Beauty Culture & Hair is a government-recognised, NCVT-affiliated trade with a standardised syllabus, generally more affordable than private academies. Private beauty academies (some tied to well-known salon brands) often offer more specialised, brand-specific or advanced techniques and can carry strong industry recognition, but typically cost significantly more. Both are valid paths; the right choice depends on your budget and specific goals."
          - q: "How long is the ITI Beauty Culture & Hair course?"
            a: "This trade is typically a 1-year NCVT-affiliated course, combining haircare, skincare and basic makeup theory with substantial hands-on salon practice."
          - q: "Can I open my own salon after this trade?"
            a: "Yes, this is one of the most common and realistic paths. Many graduates start their own salons or work as freelance beauticians after gaining practical experience and building a client base, though success depends on location, skill and reputation."
          - q: "Does this trade cover advanced makeup artistry?"
            a: "The base trade covers foundational skincare, haircare and basic makeup skills. Advanced or bridal makeup artistry is typically a separate specialisation that many graduates pursue afterward through additional certification or on-the-job training under experienced makeup artists."
          - q: "Is this trade only for female students?"
            a: "No, this is an outdated assumption. Men's grooming and hairstyling is a genuinely growing segment, and male students are increasingly enrolling in and working within this trade, particularly in men's salons and grooming lounges."
