pay:
  - { soc: "2237", label: "Other registered nursing professionals", note: "The ONS group for nursing work not counted in a specialist nursing group.", source: ons_soc2020 }
  - { soc: "2235", label: "Mental health nurses" }
  - { soc: "2236", label: "Children's nurses" }
ncs:
  - { label: "Adult nurse", starter: 32000, experienced: 48000, source: ncs_nurse }
school:
