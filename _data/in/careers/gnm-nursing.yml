  - id: "higher"
    hid: "higher-heading"
    alt: true
    eyebrow: "Beyond the diploma"
    heading: "Higher studies & degree progression"
    parts:
      - prose:
          - "<strong>Post Basic B.Sc Nursing</strong> (typically a 2-year programme for GNM holders) is the standard upgrade path, giving access to senior clinical, teaching and administrative nursing roles, and a stronger base for <strong>M.Sc Nursing</strong> later. GNM alone is sufficient for Registered Nurse status and most staff nurse roles, so upgrading is a matter of career ambition rather than a legal requirement to practise as a nurse."
