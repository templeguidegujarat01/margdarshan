  # ------------------------------------------------------------------ WBSSC (SCHOOL SERVICE COMMISSION)
  - slug: wbssc
    group: civil
    short: "WBSSC — 2nd SLST Teachers &amp; 1st SLST Clerk / Group-D"
    body: "West Bengal Central School Service Commission"
    card: "The School Service Commission's fresh selection tests ordered by the Supreme Court in April 2025: the 2nd SLST for Assistant Teachers of Classes IX–X and XI–XII, and the 1st SLST for non-teaching Clerk (Group C) and Group-D posts in aided schools."
    card_facts: ["Teachers: 23,209 (IX–X) + 12,445 (XI–XII)", "NTS: Clerk 2,989 · Group-D 5,488", "Fee ₹500 / ₹400 · SC/ST/PH less"]
    eyebrow: "WBSSC · School teachers &amp; non-teaching staff"
    title: "WBSSC 2nd SLST (Assistant Teachers) 2025 &amp; 1st SLST (Clerk, Group-D) 2025 — Eligibility, Marks, Status"
    lede: "The West Bengal Central School Service Commission runs State Level Selection Tests (SLST) for government-aided and sponsored schools. After the Supreme Court's judgment of 3 April 2025 (Civil Appeal 4800 of 2024), it began fresh selections: the 2nd SLST (AT) 2025 for teachers and the 1st SLST (NTS) 2025 for Clerks and Group-D staff. This page follows those notifications, the Rules 2025, the vacancy lists and the Commission's 2026 notices."
    facts:
      - { label: "Teacher vacancies", value: "23,209 (IX–X) · 12,445 (XI–XII)", source: ssc-vac }
      - { label: "NTS vacancies", value: "Clerk 2,989 · Group-D 5,488", source: ssc-nts }
      - { label: "Teacher age", value: "21–40 on 1 Jan 2025 (+5 SC/ST, +3 OBC)", source: ssc-at }
      - { label: "Teacher selection", value: "Written 60 + academic 10 + experience 10 + interview 10 + lecture 10", source: ssc-rules }
    official:
      - { label: "WBSSC website", url: "https://www.westbengalssc.com/" }
      - { label: "2nd SLST (AT) 2025 advertisement (PDF)", url: "https://old.westbengalssc.com/sscorg/wbssc/download/notice/Advertisement_2nd_SLST_AT_2025_30_MAY25.pdf" }
      - { label: "1st SLST (NTS) 2025 notification (PDF)", url: "https://old.westbengalssc.com/sscorg/wbssc/download/notice/Notification_1stSLST_2025_NTS_09_October_2025.pdf" }
    sections:
      - id: overview
        nav: "Overview"
        eyebrow: "Overview &amp; official source"
        heading: "Fresh selections after the Supreme Court judgment"
        parts:
          - p: "The Supreme Court's judgment of 3 April 2025 in Civil Appeal 4800 of 2024 directed the School Service Commission to start a fresh selection for Assistant Teachers of Classes IX–X and XI–XII. The Commission notified the 2nd SLST (AT) 2025 on 30 May 2025, stating that the process runs subject to the pending review petitions."
            source: ssc-at
          - p: "The same judgment led to the 1st SLST (NTS) 2025 for Clerks and Group-D staff of aided schools, notified on 9 October 2025. Candidates identified as 'tainted' under the judgment are not eligible to apply."
            source: ssc-nts
          - table:
              caption: "Vacancies (as received from the West Bengal Board of Secondary Education)"
              head: ["Post", "Vacancies"]
              rows:
                - ["Assistant Teacher, Classes IX–X", "23,209"]
                - ["Assistant Teacher, Classes XI–XII", "12,445"]
                - ["Clerk (Group C), aided schools", "2,989 (indicative)"]
                - ["Group-D, aided schools", "5,488 (indicative)"]
            source: ssc-vac
          - p: "<strong>2nd SLST (AT) 2025:</strong> applications 16 June – 14 July 2025; written test planned for the first week of September 2025."
            source: ssc-at
          - p: "<strong>1st SLST (NTS) 2025:</strong> applications 3 November – 3 December 2025; written exam planned for January 2026."
            source: ssc-nts
          - p: "Status on the Commission's notice board (18 Oct 2026): counselling of empanelled Classes XI–XII teachers due from 14 August 2026 was adjourned on 11 August 2026; a revised preliminary interview list for Classes IX–X was published on 12 October 2026 and a second interview schedule for XI–XII on 13 October 2026."
            source: ssc-status
      - id: eligibility
        nav: "Eligibility &amp; Age"
        eyebrow: "Eligibility &amp; age limits"
        heading: "Degree + B.Ed for teachers, Madhyamik or Class VIII for NTS"
        parts:
          - table:
              caption: "Assistant Teachers — 2nd SLST (AT) 2025"
              head: ["Post", "Qualification", "Age (1 Jan 2025)"]
              rows:
                - ["Assistant Teacher, IX–X", "Graduate or PG with 50% in either, plus B.Ed from an NCTE-recognised institution; or a 4-year B.A.Ed / B.Sc.Ed", "21 – 40"]
                - ["Assistant Teacher, XI–XII", "Post-graduate with 50% plus B.Ed, or PG with 50% plus B.A.Ed / B.Sc.Ed", "21 – 40"]
            source: ssc-at
          - list:
              - "<strong>Relaxation:</strong> 5 years for SC / ST, 3 years for OBC and 8 years for physically handicapped candidates, plus 5% relaxation in qualifying marks for reserved categories. Candidates given age relaxation by the Supreme Court's order of 3 April 2025 also get it."
              - "<strong>Medium:</strong> to teach in a Bengali, English, Hindi, Nepali, Oriya, Santhali, Telugu or Urdu medium school, you must have passed that language at the level set in the Rules."
              - "Male candidates are not eligible for appointment in girls' schools."
            source: ssc-at
          - table:
              caption: "Non-teaching staff — 1st SLST (NTS) 2025"
              head: ["Post", "Qualification", "Age (1 Jan 2025)"]
              rows:
                - ["Clerk (Group C)", "Madhyamik / School Final or equivalent (or old HS)", "18 – 40"]
                - ["Group-D", "Class VIII from a recognised school", "18 – 40"]
            source: ssc-nts
          - note: "NTS age relaxation is the same (SC / ST 5, OBC 3, physically handicapped 8 years). Non-teaching staff must have passed the school's medium language as a first, second or third language."
            source: ssc-nts
      - id: scheme
        nav: "Selection &amp; Marks"
        eyebrow: "Selection scheme &amp; marks"
        heading: "Written test plus academics, experience, interview and lecture"
        parts:
          - table:
              caption: "Assistant Teacher (IX–X and XI–XII) — 100 marks"
              head: ["Component", "Marks"]
              rows:
                - ["Written examination (OMR)", "60"]
                - ["Educational qualification (60%+ = 10, 50–60% = 8, below 50% = 6)", "10"]
                - ["Prior teaching experience (2 marks per year in a substantive post)", "10"]
                - ["Oral interview", "10"]
                - ["Lecture demonstration", "10"]
            source: ssc-rules
          - list:
              - "Candidates are called for interview category-wise at 1.6 times the final vacancies, on the preliminary merit score (written test + academic score)."
              - "Ties are broken by the written-test marks, then the academic score."
            source: ssc-rules
          - list:
              - "Each question has four options with one correct answer carrying one mark. Teacher papers are set in English and Bengali (language papers in the same language; Sanskrit in Bengali)."
              - "Panels and waiting lists are drawn subject-wise, medium-wise, gender-wise and category-wise and stay valid for one year from the first counselling."
            source: ssc-at
          - p: "<strong>Clerk and Group-D:</strong> Clerks are selected on a written exam, academic score, prior similar experience and an interview including a typing-cum-computer proficiency test; Group-D on the written exam, experience and interview. Papers are in English and Bengali, and there is <strong>no negative marking</strong>."
            source: ssc-nts
      - id: fees
        nav: "Fees"
        eyebrow: "Fee structure"
        heading: "Examination fees"
        parts:
          - table:
              caption: "2nd SLST (AT) 2025"
              head: ["Post", "General &amp; OBC", "SC / ST / PH"]
              rows:
                - ["Assistant Teacher (IX–X or XI–XII)", "₹500", "₹200"]
            source: ssc-at
          - table:
              caption: "1st SLST (NTS) 2025"
              head: ["Post", "General, OBC &amp; EWS", "SC / ST / PH"]
              rows:
                - ["Clerk (Group C) or Group-D", "₹400", "₹150"]
            source: ssc-nts
          - note: "Bank and payment charges are extra. Reserved-category candidates of other states pay the general fee."
            source: ssc-at
      - id: reservation
        nav: "Reservation &amp; Certificates"
        eyebrow: "Reservation &amp; certificates"
        heading: "Only West Bengal certificates count"
        parts:
          - list:
              - "Reserved-category certificates are valid only if issued by competent authorities of the Government of West Bengal on or before the last date of the online application."
              - "Candidates of reserved categories from other states appear as General candidates, with no relaxation in age, fees or qualifying marks."
            source: ssc-at
          - p: "After the Backward Classes Welfare Department memo of 7 August 2026, the Commission opened an edit window (1–8 September 2026) for 1st SLST (NTS) candidates to update their OBC sub-category or Unreserved status; candidates who did not do so were treated as Unreserved."
            source: ssc-obc
      - id: documents
        nav: "Documents"
        eyebrow: "Document checklist"
        heading: "What the Commission asks for"
        parts:
          - list:
              - "Name, parent's name and date of birth exactly as on the Madhyamik or equivalent certificate."
              - "Degree, PG and B.Ed / B.A.Ed / B.Sc.Ed marksheets and certificates, with qualifications obtained by the last date of the online application."
              - "West Bengal caste / category certificates and disability certificate, if claimed."
            source: ssc-at
          - p: "For the NTS exam the Commission told candidates whose uploaded photo or signature was blank or unclear to bring the original Aadhaar and PAN card, self-attested copies and a self-attested photograph to the venue by 10 am."
            source: ssc-nts-exam
          - note: "Admit cards are provisional: eligibility is checked online or physically right up to counselling, and ineligible candidates are removed at any stage."
            source: ssc-prov
      - id: pay
        nav: "Pay &amp; Salary"
        eyebrow: "Salary"
        heading: "Pay as per state norms"
        parts:
          - p: "Both notifications state the scale of pay only as \"as per extant State Government norms\"."
            source: ssc-nts
          - note: "No rupee pay scale or in-hand salary is printed, so none is shown here."
      - id: posting
        nav: "Counselling &amp; Posting"
        eyebrow: "Counselling &amp; posting"
        heading: "Panels, counselling and recommendation"
        parts:
          - p: "After interviews the Commission publishes merit-based panels equal to the vacancies and a waiting list. Empanelled candidates attend counselling, choose a school against notified final vacancies and are recommended for appointment; no one is recommended against a post they did not apply for."
            source: ssc-at
          - links:
              - { label: "B.Ed and teaching careers", url: "bed.html" }
    sources:
      - { id: ssc-at, name: "WB Central School Service Commission — Notification, 2nd SLST for Assistant Teachers (IX–X and XI–XII), 2025, Memo 1092 (30 May 2025)", url: "https://old.westbengalssc.com/sscorg/wbssc/download/notice/Advertisement_2nd_SLST_AT_2025_30_MAY25.pdf", covers: "Supreme Court background, dates, fees, qualification, age, medium, reservation rule, panels, documents", checked: 2026-10-18 }
      - { id: ssc-rules, name: "WBSSC (Selection for Appointment to the Posts of Assistant Teachers ...) Rules, 2025 (29 May 2025)", url: "https://old.westbengalssc.com/sscorg/wbssc/download/notice/RULES_2025_FOR_APPOINTMENT_29_May_2025.pdf", covers: "100-mark selection scheme, 1.6:1 interview ratio, tie-break", checked: 2026-10-18 }
      - { id: ssc-vac, name: "WBSSC / WBBSE — Final vacancy lists, Assistant Teacher IX–X (21 Nov 2025) and XI–XII category-wise (25 Sep 2026)", url: "https://old.westbengalssc.com/sscorg/wbssc/download/notice/CategorywiseVacancy_2ndSLST_AT_25_September_2026.pdf", covers: "23,209 IX–X and 12,445 XI–XII vacancies; NTS indicative vacancies from the NTS notification", checked: 2026-10-18 }
      - { id: ssc-nts, name: "WBSSC — Notice (29 Aug 2025) and Notification, 1st SLST 2025 for Non-Teaching Staff (Clerk &amp; Group D), Memo 1803 (9 Oct 2025)", url: "https://old.westbengalssc.com/sscorg/wbssc/download/notice/Notification_1stSLST_2025_NTS_09_October_2025.pdf", covers: "NTS vacancies, dates, fees, selection, no negative marking, qualification, age, medium, pay rule", checked: 2026-10-18 }
      - { id: ssc-nts-exam, name: "WBSSC — Public notice on photo and signature, 1st SLST (NTS) 2025 (23 Feb 2026)", url: "https://old.westbengalssc.com/sscorg/wbssc/download/notice/Notice_1stSLST_NTS_2025_23_February_2026.pdf", covers: "documents to carry to the NTS exam", checked: 2026-10-18 }
      - { id: ssc-prov, name: "WBSSC — Notice on provisional admit cards, 2nd SLST (AT) 2025 (25 Aug 2025)", url: "https://old.westbengalssc.com/sscorg/wbssc/download/notice/Important_Notice_2ND_SLST_AT2025_25_August_2025.pdf", covers: "provisional candidature, post-exam verification", checked: 2026-10-18 }
      - { id: ssc-obc, name: "WBSSC — Notification on OBC sub-category / UR edit option, 1st SLST (NTS) 2025 (25 Aug 2026)", url: "https://old.westbengalssc.com/sscorg/wbssc/download/notice/Notice_OBC_Edit%20Option_1stSLSTNTS2025_25_Aug_2026.pdf", covers: "OBC edit window 1–8 Sep 2026", checked: 2026-10-18 }
      - { id: ssc-status, name: "WBSSC — Notice adjourning XI–XII counselling (11 Aug 2026) and notice board entries of 12–13 Oct 2026", url: "https://old.westbengalssc.com/sscorg/wbssc/download/notice/Notice_CancelletionCounselling2ndSLSTAT2025_11_August_2026.pdf", covers: "counselling adjourned; revised IX–X interview list; second XI–XII interview schedule", checked: 2026-10-18 }

  # ------------------------------------------------------------------ POLYTECHNIC (JEXPO / VOCLET)
  - slug: jexpo
    group: academic
    short: "WB Polytechnic Admission — JEXPO &amp; VOCLET route"
    body: "West Bengal State Council of Technical and Vocational Education and Skill Development"
    card: "First-year (old JEXPO route) and lateral-entry second-year (old VOCLET route) admission to diplomas in engineering and technology. For 2026-27 the Council held no entrance test: merit came from qualifying-exam marks."
    card_facts: ["2026-27: no test — merit on marks", "Year 1: Madhyamik with Science &amp; Maths", "Fee ₹450 · ₹225 Kanyashree"]
    eyebrow: "WBSCTVESD · Polytechnic admission"
    title: "West Bengal Polytechnic Admission 2026-27 (JEXPO / VOCLET) — Merit, Eligibility, Reservation, Fees"
    lede: "JEXPO (first year) and VOCLET (second-year lateral entry) were the State Council's entrance tests for polytechnic diplomas. For the 2026-27 session the Council admitted on a merit list made from qualifying-exam marks, with online counselling on its Common Admission Portal. This page follows the 2026-27 information brochures and counselling notices."
    facts:
      - { label: "Admitting body", value: "WBSCTVESD (Technical Education Division)", source: wb-ib1 }
      - { label: "Entrance test 2026-27", value: "None — merit on qualifying-exam marks", source: wb-ib1 }
      - { label: "Year-1 eligibility", value: "Madhyamik / Class 10 with Science and Maths", source: wb-ib1 }
      - { label: "Application fee", value: "₹450 · ₹225 Kanyashree", source: wb-ib1 }
    official:
      - { label: "Common Admission Portal", url: "https://admission-tetsd.wb.gov.in/" }
      - { label: "WBSCTVESD (Technical Education)", url: "https://webscte.co.in/" }
    sections:
      - id: overview
        nav: "Overview"
        eyebrow: "Overview &amp; governing authority"
        heading: "A merit list, not an exam, for 2026-27"
        parts:
          - p: "Polytechnic admission is run by the <strong>West Bengal State Council of Technical and Vocational Education and Skill Development</strong> (Technical Education Division), a statutory body under West Bengal Act XXVI of 2013. The Council prepares merit lists either through entrance tests — <strong>JEXPO</strong> for the first year and <strong>VOCLET</strong> for the second year — or on the marks of the qualifying exam. For 2026-27 both the first-year and lateral-entry brochures use qualifying-exam marks."
            source: wb-ib1
          - table:
              caption: "First-year counselling 2026-27 (revised schedule of 4 Aug 2026)"
              head: ["Step", "Date"]
              rows:
                - ["Counselling fee and choice filling", "29 – 30 Jul 2026"]
                - ["Phase 1 allotment / admission", "1 Aug / 1 – 5 Aug 2026"]
                - ["Phase 2 allotment / admission", "7 Aug / 7 – 10 Aug 2026"]
                - ["Phase 3 allotment / admission", "12 Aug / 13 – 17 Aug 2026"]
            source: wb-cs
          - note: "Mop-up, online spot and a physical spot round (9 Oct 2026) followed for vacant seats. The Council can bring a test back for 2027-28 — watch the portal."
            source: wb-spot
      - id: eligibility
        nav: "Eligibility"
        eyebrow: "Academic eligibility"
        heading: "Madhyamik for year one, Class 12 or ITI for year two"
        parts:
          - list:
              - "<strong>First year (3-year diploma):</strong> passed or appearing Madhyamik / Class 10 or equivalent with Science or Physical Science and Mathematics; no minimum percentage."
              - "<strong>Age:</strong> born on or before 1 July 2011; no upper limit."
              - "<strong>Domicile:</strong> Indian citizens only; a West Bengal domicile certificate (10 years' continuous residence as on 31 Dec 2025) at admission."
              - "<strong>Medical:</strong> no colour blindness; a registered doctor's fitness certificate at admission."
            source: wb-ib1
          - list:
              - "<strong>Second year (lateral entry, old VOCLET route):</strong> passed or appearing 10+2 with the subjects in AICTE table 8.4, or Higher Secondary (Vocational) of the Council, or 10th + 2-year ITI; no age limit."
              - "Branch subjects: Civil and Chemical need Physics, Chemistry and Maths; Computer, IT, Electrical and Electronics branches need Physics and Maths plus one listed subject."
              - "Candidates still appearing in ITI cannot take lateral entry."
            source: wb-ib2
      - id: scheme
        nav: "Merit scheme"
        eyebrow: "Exam scheme &amp; merit"
        heading: "No paper to sit for 2026-27"
        parts:
          - list:
              - "There is no JEXPO or VOCLET question paper, mode or marking scheme for 2026-27: applicants are ranked on the marks of their eligibility exam."
              - "Seats are allotted through online counselling on the Common Admission Portal; take admission by the date on the allotment letter or the seat moves on."
              - "Eligibility documents are checked physically at the institute; any mismatch cancels the candidature."
              - "The first-year brochure lists 45 disciplines, from Civil, Mechanical and Electrical to Artificial Intelligence, Cyber Forensics and Electric Vehicle Technology."
            source: wb-ib1
          - warn: "Websites still describing a JEXPO OMR or CBT test, its syllabus or section marks are out of date for 2026-27."
            source: wb-ib1
      - id: fees
        nav: "Fees"
        eyebrow: "Fee structure"
        heading: "₹450 application, low government tuition"
        parts:
          - table:
              head: ["Item", "Amount"]
              rows:
                - ["Application fee", "₹450 (₹225 for Kanyashree enrollees)"]
                - ["Tuition — government polytechnic", "₹50 a month"]
                - ["Tuition — self-financed, counselling seat", "₹1,500 a month"]
                - ["Tuition — self-financed, management quota", "₹2,500 a month"]
            source: wb-ib1
          - note: "Kanyashree enrollees get 50% off the form, registration and counselling fees and hostel priority in government polytechnics."
            source: wb-ib1
      - id: reservation
        nav: "Reservation"
        eyebrow: "Reservation &amp; quotas"
        heading: "West Bengal quotas and the district quota"
        parts:
          - table:
              caption: "Seats in government and government-sponsored polytechnics"
              head: ["Quota", "Share"]
              rows:
                - ["SC (West Bengal certificates)", "22%"]
                - ["ST (West Bengal certificates)", "6%"]
                - ["OBC", "As per government norms, subject to income"]
                - ["EWS", "10%"]
                - ["Persons with disability (40%+)", "Up to 5%"]
                - ["Women (all categories)", "20%"]
                - ["Land losers", "2%"]
                - ["District quota (Madhyamik from a school in the district)", "50% — not in Kolkata, North &amp; South 24-Parganas, Howrah and some sub-divisions"]
                - ["Tuition Fee Waiver (income up to ₹8 lakh)", "Up to 5%, over the intake"]
            source: wb-ib1
          - note: "On 18 May 2026 the state withdrew its 2025 OBC notifications, so check the portal for the current OBC rules before claiming the quota."
            source: wb-obc
      - id: documents
        nav: "Documents"
        eyebrow: "Document checklist"
        heading: "Originals at the institute"
        parts:
          - list:
              - "Madhyamik / Class 10 (or 10+2 / ITI for lateral entry) marksheet and certificate."
              - "West Bengal domicile certificate (Proforma A, B or C)."
              - "Caste, EWS, Tuition-Fee-Waiver income, disability and land-loser certificates, if claimed."
              - "Medical fitness certificate from a registered doctor; Kanyashree ID if claiming the waiver."
            source: wb-ib1
      - id: pay
        nav: "Costs &amp; support"
        eyebrow: "Costs &amp; support"
        heading: "Tuition Fee Waiver"
        parts:
          - p: "Students from West Bengal whose family income is up to ₹8 lakh a year can take a Tuition Fee Waiver seat (up to 5%, over and above the intake) and pay no tuition fee."
            source: wb-ib1
      - id: posting
        nav: "After admission"
        eyebrow: "After admission"
        heading: "Register with the Council"
        parts:
          - p: "After taking admission, students must register with the Council in time, or the admission is cancelled. Women's Polytechnics at Kolkata and Chandannagar admit only women; Darjeeling, Kalimpong and Mirik polytechnics prefer hill-area candidates."
            source: wb-ib1
          - links:
              - { label: "Polytechnic colleges in West Bengal", url: "colleges/west-bengal/diploma.html" }
              - { label: "JEXPO console (national view)", url: "jexpo.html" }
              - { label: "Diploma after Class 10", url: "diploma.html" }
