  funds: "US$2,000 minimum"
tests:
  - { exam: ielts, need: "KNB: IELTS 5.5, TOEFL iBT 53, TOEFL ITP 477 or TOEIC 510 (taken within 2 years)", source: knb }
  - { exam: toefl-ibt, need: "KNB: TOEFL iBT 53", source: knb }
pillars:
  language_and_eligibility:
    heading: "KNB eligibility and English"
    parts:
      - points:
          - { t: "KNB is for prospective international students from developing countries, for bachelor's, master's and doctoral degrees at selected Indonesian universities.", source: knb }
          - { t: "For the bachelor's scholarship: maximum age 21 on 31 December 2026, a high-school certificate (bachelor's degree holders cannot apply), and English of IELTS 5.5 / TOEFL iBT 53 / TOEFL ITP 477 / TOEIC 510.", source: knb }
          - { t: "You need a recommendation letter from the Indonesian Embassy or Consulate in your country of origin.", source: knb }
  intakes_and_streams:
    heading: "The KNB calendar"
    parts:
      - points:
          - { t: "The 2026 KNB selection ran from 2 February to 31 March 2026, with results announced on 19 June 2026.", source: knb }
          - { t: "Universities may hold online interviews and psychological tests as part of selection.", source: knb }
  tuition_and_living_costs:
    heading: "Visa costs and money"
    parts:
      - money:
          - { item: "Study e-visa, 1 year", cur: IDR, amount: 6000000, per: "visa", source: evisa_study }
          - { item: "Study e-visa, 2 years", cur: IDR, amount: 8500000, per: "visa", source: evisa_study }
          - { item: "Study e-visa, 4 years", cur: IDR, amount: 12000000, per: "visa", source: evisa_study }
          - { item: "Proof of living expenses (minimum)", cur: USD, amount: 2000, per: "at application", source: evisa_study }
      - note: "Tuition for self-funded students is set by each university."
  global_scholarships:
    heading: "Government of Indonesia scholarship"
    parts:
      - awards:
          - { name: "KNB Scholarship (Kemitraan Negara Berkembang)", by: "Ministry of Higher Education, Science and Technology, Indonesia", who: "Students from developing countries; embassy recommendation needed", gives: "Degree study at one of 47 partner universities", url: "https://knb.kemdiktisaintek.go.id/", source: knb }
      - points:
          - { t: "Since 2006 KNB has supported 2,299 students and alumni from 107 countries.", source: knb }
  application_funnel:
    heading: "From KNB to visa"
    parts:
      - steps:
          - { title: "Embassy recommendation", text: "Download the KNB offering letter and get a recommendation from the Indonesian Embassy with your documents.", source: knb }
          - { title: "Online application", text: "Upload academic certificates and transcripts legalised by your country's education and foreign ministries, plus recommendations.", source: knb }
          - { title: "Selection", text: "Administrative and academic selection; results online.", source: knb }
          - { title: "Study e-visa", text: "Acceptance letter, guarantee letter from the institution, CV, funds of US$2,000+; use the visa within 90 days.", source: evisa_study }
  visa_chokepoints:
    heading: "The study visa in short"
    parts:
      - points:
          - { t: "The visa must be used within 90 days of issue; on arrival you receive the electronic limited stay permit (e-ITAS).", source: evisa_study }
          - { t: "The study visa does not allow work in Indonesia.", source: evisa_study }
  post_study_work:
    heading: "Work rules"
    parts:
      - points:
          - { t: "Holders of the study visa are not allowed to work in Indonesia.", source: evisa_study }
      - note: "Indonesia has no post-study work visa for international graduates; a job needs a separate work permit sponsored by an employer."
