              - "Medals at the Olympics, Asian Games, Commonwealth Games or World Championships can bring up to <strong>three out-of-turn promotions</strong>."
            source: dopt-2022
          - p: "Since <strong>4 March 2024</strong>, medals at Junior Nationals, the <strong>Khelo India Youth Games (above 18)</strong>, Khelo India University Games and SGFI school games also qualify."
            source: dopt-2024
          - p: "Retired champions can receive the <strong>Pension to Meritorious Sportspersons</strong> of ₹12,000–20,000 a month."
            source: pib-support
      - id: traps
        nav: "Red flags"
        eyebrow: "Disqualification traps"
        heading: "Mistakes that cost shuttlers matches and selections"
        parts:
          - list:
              - "<strong>Training for 21-point games</strong> — BAI events already use 15-point games; pacing and the 8-point interval change match plans."
            source: "bai-interstate,bwf-laws27"
          - list:
              - "<strong>Late birth registration without medical papers</strong> — no age-group entry."
            source: bai-age
          - list:
              - "<strong>Clothing violations and cards</strong> — fines at BAI events; a black card means disqualification for misconduct."
            source: bai-interstate
          - list:
              - "<strong>Age fraud, doping or misconduct</strong> are grounds for weeding a player out of SAI centres."
            source: sai-schemes
