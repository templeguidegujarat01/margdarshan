          - "<strong>M.Tech or MS</strong> — adds real weight, especially for research-adjacent or highly specialised roles."
          - "<strong>PhD</strong> — generally preferred specifically for Research ML Engineer roles at deeptech firms and research labs."
          - "<strong>Bachelor of Computer Applications (BCA) or self-taught + strong portfolio</strong> — genuinely viable for Application and some Production roles, with demonstrated project work."
