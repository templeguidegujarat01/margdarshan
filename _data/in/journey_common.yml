# journey_common.yml — shared data for the Student Journey Blueprint (journey-blueprint.html + journey-<id>.html).
# Split from the single journey_matrix.yml on 2026-10-26 (scripts/split-journey-matrix.mjs) so a batch only touches
# small files. Each career is its own file, _data/in/journey/<id>.yml; this file keeps what they all share:
#   classes, boards, `careers` (the order careers are listed in — add a new id here), general_money, and the
#   money items / sources used by more than one career. A money item or source only one career uses lives in that
#   career's file under `money_defs` / `sources`. Any career may cite any id from any file; every id is unique.
# The pages merge the files in _includes/journey-data.html; the scripts in scripts/lib/journey-data.mjs.
#
# Original header of journey_matrix.yml (the rules still apply to every career file):
# journey_matrix — data for the Student Journey Blueprint. Every career here has its own page, journey-<id>.html
# (_includes/journey-doubts.html, stubs by scripts/build-journey-pages.mjs); journey-blueprint.html only picks a
# career + class and redirects there with ?class=10. Edit the data files, not the pages.
#
# LEAN DATA TIER (from 2026-10-26): there is no state / board picker any more. New careers carry the deep National /
# Central road only — core, journey (Class 8, 9, 10, 11, 12, college, graduated, working), exam, multiverse, money —
# plus all-India `state_rules` lines (no `state:`). Do NOT research state-by-state rows or `state_uses` for new
# careers. State rows already written (with `state:`) stay: the career page prints them as "State notes we have
# checked", one fold per state, and `state_uses` careers keep their 36-state office table.
#
# Rules (same as every India sheet):
#   - Never type a number you did not read on the official document. Every fact line carries `source:`
#     (an id from `sources` at the bottom). Lines without `source:` are Margdarshan guidance, not facts.
#   - `stages` lists the class ids a step / scheme applies to. The page shows only what is still ahead
#     of the student: an item is hidden once every stage in it is behind the chosen class.
#   - `state:` ties an existing item to one of the 36 states / UTs in journey_states.yml; the page labels it with that
#     state's name. `boards` below are kept for the older careers' board_notes: `other` is printed as the general
#     board note, the state boards' notes go into that state's fold.
#   - `source:` may be one id or a list of ids. A board_notes value may be plain text (cited to the career's
#     `board_source`) or { text, source } when that board's note comes from a different file.
#   - `search` lists phrases that tie titles from the 10,000-title search list (assets/data/career-titles.json) to
#     this full blueprint: a title containing a phrase as whole words opens it as the closest route; "=phrase"
#     must be the whole title; `search_not` words veto the match. Keep phrases narrow — a wrong match shows a
#     student the wrong route.
#   - scripts/check-journey-matrix.mjs validates ids, stages and source links. Run it after editing.
# Written 2026-10-24 from the official files listed under `sources`. Batch 2 (software engineer, merchant
# navy, commercial pilot, bank PO, civil services) and the UP / Maharashtra / West Bengal boards added 2026-10-25.
# Batch 3 (doctor, nurse, NDA officer, company secretary, data scientist) added 2026-10-25.
# Batch 4 (architect, clinical psychologist, hotel manager, biotech research scientist) added 2026-10-25; the
# financial-analyst entry was upgraded with CFA Institute's official enrollment, fee and charter rules instead of
# adding a second CFA career.
# Batch 5 (2026-10-25): three-layer careers (`v: 2`) — pharmacist, dentist, Ayurveda doctor, veterinarian, physiotherapist,
# school teacher, police, civil engineer, fashion designer, assistant professor. Each adds `core` (the job, pay, routes,
# time and cost, hidden challenges, who should not choose it), `journey` (the stage layer: Class 8 → college → graduated →
# working, each step with what to do, stream, exam windows, money, mistakes, a "late?" line and the student doubts as
# doubt → answer → next) and `state_uses` (which offices from journey_states.yml the state layer prints). Their doubts
# are also printed on journey-<id>.html with FAQPage JSON-LD. Classes now include "In college" (ug) and "Working" (work).
# The order of careers to build comes from journey_queue.yml.
checked: 2026-10-25

classes:
  - { id: c8, label: "Class 8" }
  - { id: c9, label: "Class 9" }
  - { id: c10, label: "Class 10" }
  - { id: c11, label: "Class 11" }
  - { id: c12, label: "Class 12" }
  - { id: ug, label: "In college" }
  - { id: grad, label: "Graduated" }
  - { id: work, label: "Working / switching career" }

boards:
  - id: gseb
    label: "GSEB — Gujarat State Board"
    state: gujarat
    state_name: "Gujarat"
    exams: "Your board exams are the <strong>SSC</strong> (Std 10) and the <strong>HSC</strong> (Std 12). Wherever a notice says Matriculation, SSLC or Class 10, your SSC marksheet and certificate are what count."
  - id: cbse-gj
    label: "CBSE — studying in Gujarat"
    state: gujarat
    state_name: "Gujarat"
    exams: "Your board exams are the CBSE <strong>Class X</strong> and <strong>Class XII</strong> exams. Gujarat-only rules below (domicile seats, state schemes) set their own definition of a Gujarat student — read that rule in the official notice before you count on it."
  - id: upmsp
    label: "UPMSP — Uttar Pradesh Board"
    state: uttar-pradesh
    state_name: "Uttar Pradesh"
    exams: "Your board exams are the UPMSP <strong>High School</strong> (Class 10) and <strong>Intermediate</strong> (Class 12) exams. Wherever a notice says Matriculation or Class 10, your High School certificate is what counts; Intermediate is your Class 12."
  - id: msbshse
    label: "MSBSHSE — Maharashtra State Board"
    state: maharashtra
    state_name: "Maharashtra"
    exams: "Your board exams are the <strong>SSC</strong> (Class 10) and the <strong>HSC</strong> (Class 12). Maharashtra's admission rules check where you passed both, so keep both marksheets and your leaving certificate safe."
  - id: wb
    label: "WBBSE / WBCHSE — West Bengal boards"
    state: west-bengal
    state_name: "West Bengal"
    exams: "Your board exams are the <strong>Madhyamik</strong> (Class 10, WBBSE) and the <strong>Higher Secondary</strong> (Class 12, WBCHSE). Wherever a notice says Matriculation or Class 10, your Madhyamik certificate is what counts."
  - id: cbse
    label: "CBSE — any other state"
    exams: "Your board exams are the CBSE <strong>Class X</strong> and <strong>Class XII</strong> exams. National exams treat every board the same; state quotas follow your own state's rules."
  - id: other
    label: "Other state board"
    exams: "Your Class 10 and Class 12 board certificates count exactly like CBSE ones for every national exam on this page. State quotas and state scholarships follow your own state's rules."

