  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What is Graphic Design?"
    parts:
      - overview:
          points:
            - "Graphic Design is the craft of visual communication — using typography, colour theory, layout and imagery to convey a message clearly and attractively."
            - "It spans brand identity and logo design, print and packaging, marketing and advertising visuals, editorial/publication design, and social media content — essentially any visual output a business or organisation needs."
            - "There are multiple entry routes: a formal <strong>B.Des degree</strong> at institutes like <strong>National Institute of Design (NID), National Institute of Fashion Technology (NIFT) or MIT Institute of Design</strong>; a shorter <strong>diploma or certificate course</strong> at design schools; or a largely <strong>self-taught path</strong> using online courses and consistent practice, backed by a strong portfolio."
          more:
            - "All three are genuinely viable, though a recognised degree can open doors at larger, more established companies more easily."
  - id: "who"
    hid: "who-heading"
    alt: true
    eyebrow: "Fit check"
    heading: "Who should choose Graphic Design"
    parts:
      - fit:
          match:
            - "Enjoy visual problem-solving — communicating an idea clearly through layout, colour and type."
            - "Are self-motivated enough to build a genuine portfolio, whether through a degree or independent practice."
            - "Are comfortable taking client/manager feedback and revising your creative work repeatedly."
          mismatch:
            - "Want a career with one single fixed qualifying path — this field genuinely rewards self-directed skill-building."
            - "Dislike frequent revisions — client and stakeholder feedback loops are a constant part of the job."
            - "Expect entry-level pay to be high immediately — early salaries can be modest until your portfolio and reputation grow."
