  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What is BA Psychology?"
    parts:
      - overview:
          points:
            - "BA Psychology is a 3-year undergraduate degree (4 years for Honours with Research under National Education Policy (NEP) 2020) that studies the scientific basis of human thought, emotion, development and behaviour — covering areas like cognitive psychology, developmental psychology, social psychology, abnormal psychology and research methods, including statistics."
            - "It's taught as a BA at most universities, though some offer it as a B.Sc — the core content is broadly similar either way."
            - "Crucially, this is an undergraduate foundation, not a licence to practise."
          more:
            - "Becoming a clinical psychologist in India requires an MA/M.Sc followed by an M.Phil in Clinical Psychology recognised by the <strong>Rehabilitation Council of India (RCI)</strong>."
            - "It's offered widely across Indian universities — <strong>Lady Shri Ram College, Jesus and Mary College and Delhi University's other colleges</strong> are highly competitive destinations, alongside Christ University Bengaluru, Fergusson College Pune, and Presidency University Kolkata."
  - id: "who"
    hid: "who-heading"
    alt: true
    eyebrow: "Fit check"
    heading: "Who should choose BA Psychology"
    parts:
      - fit:
          match:
            - "Are genuinely interested in why people think and behave the way they do, not just curious about \"reading\" people."
            - "Are willing to commit to further postgraduate study (Master of Arts (MA) + M.Phil) if you want to practise clinically."
            - "Are comfortable with statistics and research methods — Psychology is more quantitative than most Arts subjects."
          mismatch:
            - "Expect to become a \"psychologist\" straight after this one degree — the real qualification is several years further out."
            - "Dislike statistics and data analysis — research methods form a real, assessed part of the coursework."
            - "Aren't emotionally prepared to study difficult topics like trauma, abuse and mental illness in depth."
  - id: "eligibility"
    hid: "elig-heading"
    eyebrow: "Eligibility"
    heading: "Who can apply for BA Psychology"
    parts:
      - elig_list:
          - "Class 12 pass (10+2) from a recognised board, typically <strong>45-60% aggregate</strong>, though top colleges effectively demand much higher CUET/merit scores given heavy demand."
          - "Open to students from any stream — Arts, Commerce or Science — since no specific Class 12 subject is compulsory."
          - "Having studied Psychology at Class 11-12 helps, but Psychology is a genuinely high-demand subject at top colleges, so competition is intense regardless of background."
