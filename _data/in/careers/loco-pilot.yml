    - "Every train driver in Indian Railways starts as an Assistant Loco Pilot (ALP), recruited by the Railway Recruitment Boards (RRBs) through a computer-based exam and a psychometric aptitude test. From there, promotions lead to driving goods trains, then passenger and Mail/Express trains. The entry gate is a trade qualification — ITI or an engineering diploma — not a degree."
