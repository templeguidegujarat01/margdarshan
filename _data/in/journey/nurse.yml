  - { id: up-get, name: "ABVMU Uttar Pradesh — Information Bulletin, UP GNM Entrance Test (UPGET) 2026", url: "https://cet26.blr1.cdn.digitaloceanspaces.com/docs/ENGLISH%20GNM%20Information%20Bulletin.pdf", covers: "GNM eligibility 10+2 with English and 40%, 5% SC/ST relaxation, fee", checked: 2026-10-25 }
