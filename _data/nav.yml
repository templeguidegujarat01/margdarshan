      - { label: High-Paying Careers, href: high-paying-careers.html, mega: high-paying }
      - { label: Fast-Track Jobs, href: fast-track-jobs.html, mega: fast-track }
      - { label: Professional Courses, href: professional-courses.html, mega: professional }
