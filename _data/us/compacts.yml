        - { name: "Wisconsin" }
        - { name: "Wyoming" }
    - status: non_spl
      label: "Member state, not a State of Principal License"
      meaning: "Issuing licenses through the compact, but cannot serve as a physician's State of Principal License."
      states:
        - { name: "Hawaii" }
        - { name: "Vermont" }
