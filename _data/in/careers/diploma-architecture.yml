          - myth: "You can use lateral entry to convert this diploma directly into a B.Arch degree."
            fact: "Unlike engineering diplomas, there's no standard, universal lateral entry pathway from this diploma into B.Arch — you would generally need to apply for B.Arch separately through NATA or Joint Entrance Examination (JEE) Paper 2."
