  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Is Maths compulsory for B.A. Economics?"
            a: "At most top colleges, yes. Delhi University and similarly ranked institutions require Mathematics or Applied Mathematics as a CUET domain subject for B.A. (Hons) Economics, and the first-year syllabus itself assumes calculus and statistics. Some other universities admit without a Maths requirement, but the analytical workload is still significant."
          - q: "Do I need CUET for B.A. Economics?"
            a: "For Delhi University and most central universities, yes — CUET (UG) is mandatory, with your college and course preferences submitted through the DU CSAS portal or the respective university's counselling system. Some state and private universities instead use their own entrance test, an interview, or admit directly on Class 12 merit."
          - q: "Is B.A. Economics only useful for a career in economics?"
            a: "No. Most graduates end up in banking, finance, data analytics, consulting or government services rather than pure economics research. The degree is valued mainly for the quantitative and analytical thinking it builds, which transfers well into a wide range of white-collar careers."
          - q: "Can I do an MBA or a data science career after B.A. Economics?"
            a: "Yes. B.A. Economics is a strong, widely accepted feeder degree into an MBA via CAT/XAT, into MA/MSc Economics programmes such as the Delhi School of Economics, and into data analytics or data science roles or courses, given the statistics and econometrics already covered in the undergraduate syllabus."
          - q: "Should I choose B.A. Economics, B.Com or BBA?"
            a: "Choose B.A. Economics if you enjoy quantitative, theory-driven analysis and are targeting UPSC, banking, research or data-focused careers. Choose B.Com if you want to specialise in accounting, taxation and finance, often as a base for CA, CS or Cost and Management Accountant (CMA). Choose BBA if you want a broader, less mathematical, management-focused degree aimed at corporate roles."
      - note: "*Fee, cutoff and salary figures are indicative, based on publicly available information as of 2026, and vary significantly by institution and admission cycle — always verify current figures on the official college or university website."
        class: "table-note mt-lg"
