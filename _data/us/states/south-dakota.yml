  law: { body: "South Dakota Board of Bar Examiners", url: "https://ujs.sd.gov/", stat: "State exam", exam: "South Dakota's own bar exam with the MBE, MEE and MPT.", note: "MPRE required (passing score 85). NextGen UBE from July 2027.", src: ncbe_sd }
