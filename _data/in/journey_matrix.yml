    kind: fee
    name: "No NDA exam fee"
    by: "Union Public Service Commission"
    amount: "₹0 instead of ₹100"
    who: "SC and ST candidates, women, and wards of serving or ex JCOs / NCOs / ORs studying in a Military School or a Sainik School (with the principal's certificate, shown at SSB). OBC and EWS candidates pay the full fee."
    apply: "Choose the category in the online form on upsconline.nic.in."
    stages: [c11, c12]
    source: nda226
