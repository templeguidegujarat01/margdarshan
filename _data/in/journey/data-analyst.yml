# Journey Blueprint — Data Analyst. Printed on journey-data-analyst.html (_includes/journey-doubts.html).
# Rules, classes and the money items / sources several careers share: _data/in/journey_common.yml.
# `money_defs` / `sources` below are used only by this career. Check: node scripts/check-journey-matrix.mjs
id: data-analyst
v: 2
name: "Data Analyst"
search: ["data analyst", "business data analyst", "data analytics", "mis analyst", "reporting analyst", "statistical analyst"]
search_not: ["machine learning", "data scientist"]
page: "datascience.html"
doubts_page: "journey-data-analyst.html"
gate: "Keep Mathematics → a degree such as B.Sc (Statistics / Maths / Data Science), BCA, B.Com or B.Tech — or IIT Madras' BS in Data Science, open from any Class 12 stream (Class 10 Maths and English expected). Government data posts: SSC CGL's Statistical Investigator and Junior Statistical Officer (Pay Level 6)."
gate_source: [iitm-adm, cgl26]
core:
  what:
    text: "A data analyst turns raw data — sales, surveys, app usage — into tables, charts and answers people can act on. In government, SSC's Combined Graduate Level exam fills Statistical Investigator and Junior Statistical Officer posts that do this work."
    source: cgl26
  day:
    - "Pull data from spreadsheets and databases, and clean it."
    - "Build charts and dashboards, and spot trends."
    - "Explain what the numbers mean to managers in plain words."
  pay:
    - { level: "Statistical Investigator Grade-II / Junior Statistical Officer (SSC CGL 2026)", value: "Pay Level 6 · ₹35,400 – ₹1,12,400", source: cgl26 }
  pay_note: "Private analyst salaries are not officially published, so we print only the government level."
  routes:
    - { title: "IIT Madras BS in Data Science and Applications", text: "Apply after your Class 11 final exams, from any stream or board. The qualifier is 4 weeks of online coursework and a 4-hour in-person exam; pass with 40% in each course and 50% on average (General).", source: iitm-adm }
    - { title: "B.Sc / BCA / B.Com through CUET (UG)", text: "Central universities admit through CUET (UG); NTA runs the test and each university makes its own merit list.", source: cuet26 }
    - { title: "ISI B.SDS (Statistical Data Science)", text: "ISI's 4-year B.SDS (Hons), taught in hybrid mode, needs 75% in Class 12 (passed 2025 or 2026) and charges ₹1,00,000 tuition a semester, fully waived for SC / ST / PwBD.", source: isi26 }
    - { title: "Government: SSC CGL", text: "Statistical Investigator Grade-II takes degrees in Statistics, Maths, Economics, Computer Science, Data Science, AI and more (48 tentative vacancies in 2026); JSO takes any degree with 60% in Class 12 Maths (158).", source: [cgl26, cgl26-vac] }
  cost_time:
    - { label: "IIT Madras BS application", value: "₹4,000 General / OBC · ₹2,000 SC / ST / PwD · ₹1,000 SC / ST + PwD", source: iitm-adm }
    - { label: "IIT Madras BS full fee", value: "₹3,86,000 – ₹4,50,000 for the BS degree (from the Jan 2026 term)", source: iitm-fee }
    - { label: "SSC CGL fee", value: "₹100 · women, SC, ST, PwBD and eligible ex-servicemen pay nothing", source: cgl26 }
  cost_note: "Other college fees vary by state and college, so we print no national figure."
  challenges:
    - text: "Government data posts are few: 48 Statistical Investigator and 158 JSO vacancies in CGL 2026's tentative list, out of 10,731."
      source: cgl26-vac
    - text: "CGL Tier-II has a qualifying Computer Knowledge Test and a Data Entry Speed Test, and 1 mark is cut per wrong answer in Paper-I Sections I–III."
      source: cgl26
    - text: "The IIT Madras qualifier needs 40% in each course and 50% on average just to enter the BS."
      source: iitm-adm
  not_for:
    - "You dislike spreadsheets, detail and checking numbers twice."
    - "You want to avoid Maths and statistics altogether."
    - "You do not like explaining results to other people."
journey:
  - stages: [c8, c9]
    title: "Maths, data and curiosity"
    do:
      - text: "IIT Madras' BS starts with four foundation courses: <strong>English I, Mathematics for Data Science I, Statistics for Data Science I and Computational Thinking</strong>."
        source: iitm-adm
      - text: "Practise graphs, percentages and probability, and try a spreadsheet — data work is mostly cleaning and reading numbers."
    doubts:
      - q: "Is Maths needed to become a data analyst?"
        a: "The main routes need it: IIT Madras' BS in Data Science expects Mathematics and English in Class 10, and SSC's JSO post with a non-Statistics degree needs 60% in Class 12 Maths."
        next: "Keep Maths strong now."
        source: [iitm-adm, cgl26]
      - q: "What will I study in a data science degree?"
        a: "At IIT Madras the BS begins with English, Mathematics for Data Science, Statistics for Data Science and Computational Thinking."
        next: "Start with school statistics and a spreadsheet."
        source: iitm-adm
  - stages: [c10]
    title: "Keep Mathematics, any stream"
    do:
      - text: "The IIT Madras BS expects <strong>Mathematics and English in Class 10</strong>; any Class 12 stream may apply."
        source: iitm-adm
    stream: "Any stream with Mathematics if you can — Science, Commerce or Arts."
    mistakes:
      - "Dropping Maths in Class 11 — it closes the JSO 60% route and narrows your degree choices."
    doubts:
      - q: "Can an Arts or Commerce student become a data analyst?"
        a: "Yes. IIT Madras' BS takes any Class 12 stream (with Class 10 Maths and English), and SSC's Statistical Investigator accepts degrees such as Economics, Statistics and Mathematics."
        next: "Keep Maths in Class 11 if your school allows."
        source: [iitm-adm, cgl26]
      - q: "Do I need Computer Science in school for data analytics?"
        a: "No. IIT Madras' BS accepts any Class 12 stream and teaches Computational Thinking from the foundation level."
        next: "Learn basic spreadsheets on your own."
        source: iitm-adm
  - stages: [c11, c12]
    title: "Two doors in Class 11–12"
    do:
      - text: "IIT Madras BS: apply after your Class 11 final exams. The qualifier result stays valid for 2 years if you have not yet sat Class 12."
        source: iitm-adm
      - text: "Students eligible for the current year's JEE Advanced can join the IIT Madras BS foundation level directly, without the qualifier."
        source: iitm-adm
    exams:
      - { name: "CUET (UG) 2026", when: "11–31 May 2026 (bulletin schedule)", source: cuet26 }
    money: [csss, iitm-fee-support]
    doubts:
      - q: "Can I join IIT Madras' data science BS while in Class 12?"
        a: "You can apply after your Class 11 final exams. You clear a qualifier — 4 weeks of online coursework and a 4-hour in-person exam — and the result stays valid for 2 years if you have not yet sat Class 12."
        next: "Apply in the term after your Class 11 exams."
        source: iitm-adm
      - q: "Can I skip the IIT Madras qualifier?"
        a: "Yes, if you are eligible for that year's JEE Advanced — you can join the foundation level directly."
        next: "Check your JEE Advanced eligibility."
        source: iitm-adm
      - q: "What is ISI's B.SDS?"
        a: "A 4-year B.SDS (Hons) in Statistical Data Science, taught in hybrid mode across Kolkata, Delhi and Bengaluru. It needs 75% in Class 12 (passed 2025 or 2026) and charges ₹1,00,000 tuition a semester, waived for SC / ST / PwBD."
        next: "Watch ISI's admission notice in spring."
        source: isi26
  - stages: [ug]
    title: "During the degree"
    do:
      - text: "Anyone who has passed Class 12 may apply to the IIT Madras BS, <strong>whatever their age or background</strong>; you pay course by course, each term."
        source: [iitm-adm, iitm-fee]
      - text: "GATE has a Data Science and AI (DA) paper, open from the 3rd year of any degree."
        source: [gate27-elig, certin-scb]
    doubts:
      - q: "How much does the IIT Madras BS cost?"
        a: "₹3,86,000 – ₹4,50,000 for the full BS degree (from the January 2026 term), paid course by course. Fee support of 50% or 75% is given by family income and category."
        next: "Read the Money help section for the fee support rules."
        source: iitm-fee
      - q: "Does a Data Science or AI degree count for government jobs?"
        a: "Yes. SSC's Statistical Investigator Grade-II lists Data Science and Artificial Intelligence degrees, and CERT-In's 2026 Scientist-B advert had 25 Data Science and AI posts picked on the GATE DA paper."
        next: "Keep both doors open: CGL and GATE."
        source: [cgl26, certin-scb]
      - q: "When can I write GATE in Data Science?"
        a: "From the 3rd year of any undergraduate degree (or after it). GATE 2027 runs on six days in February 2027."
        next: "Register in your 3rd year."
        source: [gate27-elig, gate27]
  - stages: [grad]
    title: "Industry jobs or SSC CGL"
    do:
      - text: "CGL 2026: Tier-I was held 30 Sep – 30 Oct 2026; Tier-II is scheduled for December 2026."
        source: [cgl26-t1, cgl26]
      - text: "Statistical Investigator and JSO candidates also write a Statistics paper (100 questions, 200 marks, 2 hours) in Tier-II."
        source: cgl26
    exams:
      - { name: "SSC CGL 2026 Tier-I", when: "30 Sep – 30 Oct 2026", source: cgl26-t1 }
    money: [ssc-fee]
    doubts:
      - q: "What does a government data job pay?"
        a: "Statistical Investigator Grade-II and Junior Statistical Officer are Pay Level 6 (₹35,400 – ₹1,12,400), Group B posts."
        next: "Read the next CGL notice for current posts."
        source: cgl26
      - q: "How many Statistical Investigator posts are there?"
        a: "SSC's tentative list of 24 September 2026 shows 48 Statistical Investigator Grade-II vacancies in the Registrar General and Census Commissioner's office."
        next: "Vacancies can change until the final result."
        source: cgl26-vac
      - q: "Is there negative marking in the CGL Statistics paper?"
        a: "Yes, 0.50 mark per wrong answer in Paper-II (Statistics); Paper-I cuts 1 mark in Sections I–III."
        next: "Practise accuracy."
        source: cgl26
      - q: "Which GATE paper suits a data analyst?"
        a: "DA — Data Science and Artificial Intelligence. CERT-In shortlisted its 25 Data Science and AI Scientist-B posts in 2026 on this paper."
        next: "Pick DA if you want GATE-based data jobs."
        source: certin-scb
  - stages: [work]
    title: "Switching later"
    do:
      - text: "The IIT Madras BS has no age bar: anyone who has passed Class 12 may apply."
        source: iitm-adm
    doubts:
      - q: "I am already working. Can I still study data science?"
        a: "Yes. IIT Madras' BS takes anyone who has passed Class 12, whatever their age, and you pay course by course each term."
        next: "Check the next term's application dates on study.iitm.ac.in."
        source: [iitm-adm, iitm-fee]
board_note: "Every board counts. IIT Madras' BS looks at Class 10 Maths and English; ISI's B.SDS needs 75% in Class 12."
board_source: [iitm-adm, isi26]
exam:
  name: "IIT Madras BS qualifier · SSC CGL (data posts)"
  body: "IIT Madras · Staff Selection Commission"
  href: "datascience.html"
  facts:
    - { label: "IITM qualifier", value: "4 weeks online + 4-hour in-person exam", source: iitm-adm }
    - { label: "IITM pass mark", value: "40% each course · 50% average (General)", source: iitm-adm }
    - { label: "CGL Statistics paper", value: "100 questions · 200 marks · 2 hours", source: cgl26 }
    - { label: "CGL 2026 data posts", value: "SI-II 48 · JSO 158 (tentative)", source: cgl26-vac }
  stages:
    head: ["Route", "Step", "Rule"]
    rows:
      - ["IIT Madras BS", "Qualifier → foundation → diploma → degree", "Any stream; pay per course"]
      - ["SSC CGL", "Tier-I → Tier-II (Paper-I + Statistics)", "Merit from Tier-II"]
      - ["ISI B.SDS", "ISI admission process", "75% in Class 12"]
    source: [iitm-adm, cgl26, isi26]
state_rules:
  - { text: "National route: IIT Madras' BS, CUET and SSC CGL follow the same rules in every state.", source: [iitm-adm, cuet26, cgl26] }
multiverse:
  - { title: "Data scientist", text: "Building models on top of analysis.", href: "journey-data-scientist.html" }
  - { title: "Statistical officer", text: "SSC JSO and UPSC ISS.", href: "journey-statistical-officer.html" }
  - { title: "Actuary", text: "Statistics applied to insurance risk.", href: "journey-actuary.html" }
  - { title: "BCA", text: "A computer degree after any stream with Maths.", href: "bca.html" }
money: [nmmss, csss, pms-sc, iitm-fee-support, ssc-fee]
