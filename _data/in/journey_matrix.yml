    apply: "In the CLAT application (closes 31 Oct for the December exam)."
    stages: [c11, c12]
    source: clat-ins
  - id: icai-need-inter
    kind: scholarship
    name: "ICAI need-based scholarship — Intermediate"
    by: "ICAI Board of Studies"
    amount: "₹1,500 a month for 9 months (+3 months for finishing the orientation and IT courses within 9 months, +3 more for passing one Intermediate group within 12 months)"
    who: "Students registered for Intermediate (Foundation or Direct Entry route) whose parents earn up to ₹3,00,000 a year."
    apply: "Any time on the ICAI Self Service Portal (eservices.icai.org); grants are processed every quarter."
    stages: [c12, ug, grad]
    source: icai-sch
