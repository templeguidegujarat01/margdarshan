  meta:
    - "Registered with the Indian Patent Office"
    - "Science, engineering or technology degree"
  read_time: "8 min read"
  intro:
    - "A registered patent agent drafts and files patent applications and argues them before the Indian Patent Office. Anyone with a science, engineering or technology degree can qualify by passing the Patent Agent Examination run by the Controller General of Patents, Designs and Trade Marks (CGPDTM). A “patent attorney” in India usually means an advocate who is also a registered patent agent — so a law degree adds courtroom work on top."
