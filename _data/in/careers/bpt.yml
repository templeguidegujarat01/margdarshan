  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What is BPT?"
    parts:
      - overview:
          points:
            - "BPT is a professional degree focused on physical rehabilitation — helping patients recover movement and function after injuries, surgeries, paralysis, sports injuries and physical disabilities, using exercise therapy, manual therapy and electrotherapy."
            - "India's demographic trends genuinely favour this field: an ageing population, rising chronic disease, and growing awareness of sports injury management and rehabilitation are all real, ongoing drivers of demand."
            - "What's genuinely worth understanding honestly before enrolling: physiotherapy in India has historically lacked the kind of single, long-established national regulatory council that Nursing (Indian Nursing Council) or Pharmacy (Pharmacy Council of India (PCI)) have had for decades."
          more:
            - "The <strong>NCAHP Act 2021</strong> is progressively closing this gap, with a national physiotherapy register expected to be operational by 2026-27."
