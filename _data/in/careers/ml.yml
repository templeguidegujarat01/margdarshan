          - label: "Application ML Engineer"
            text: "Integrates ML into product features; closer to general software engineering with ML on top; common at consumer product companies."
  - id: "fees"
    hid: "fees-heading"
    eyebrow: "Cost varies by route and credential level"
    heading: "Cost of each route"
    parts:
      - prose:
          - "A B.Tech in CSE commonly costs <strong>₹2-8 lakh</strong> at government institutes and <strong>₹5-20 lakh</strong> at private colleges (see the <a href=\"cse.html\">CSE page</a>). An M.Tech via Graduate Aptitude Test in Engineering (GATE) at a government IIT/NIT is generally affordable, often under <strong>₹2 lakh</strong> total, with a monthly stipend for many students, while an MS abroad can run considerably higher depending on the country and university. Since research-oriented roles specifically value a Master's or PhD, factor in this additional time and cost if you're deliberately targeting the Research ML Engineer sub-type."
