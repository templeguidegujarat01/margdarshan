# UK Edition navigation — same shape as _data/nav_us.yml, rendered by _includes/sidebar.html when the
# page's region is `uk` (see _data/regions.yml → uk.nav). Group ids start with "uk-" so they never clash
# with India or USA group ids (all editions render together on region-neutral pages).
# Only link to pages that exist.

sidebar:
  - id: uk-start
    label: Plan Your Path
    items:
      - label: UK Home
        short: Home
        href: uk/
        icon: '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>'
        children:
          - { label: "GCSEs to career", href: "uk/#ladder" }
          - { label: "UCAS points", href: "uk/#ucas" }
  - id: uk-careers
    label: Careers
    items:
      - label: Career Pathways
        short: Careers
        href: uk/careers/
        icon: '<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18"/>'
        children:
          - { label: "Law: solicitor or barrister", href: "uk/careers/law/" }
          - { label: "Chartered accountant", href: "uk/careers/accountancy/" }
          - { label: "Software engineer", href: "uk/careers/software-engineering/" }
          - { label: "Doctor (hospital or GP)", href: "uk/careers/medicine/" }
          - { label: "Nurse", href: "uk/careers/nursing/" }
          - { label: "Pharmacist", href: "uk/careers/pharmacy/" }
          - { label: "Physiotherapist", href: "uk/careers/physiotherapy/" }
          - { label: "Paramedic", href: "uk/careers/paramedic/" }
          - { label: "Vet", href: "uk/careers/veterinary/" }
          - { label: "Civil engineer", href: "uk/careers/civil-engineering/" }
          - { label: "Mechanical engineer", href: "uk/careers/mechanical-engineering/" }
          - { label: "Architect", href: "uk/careers/architecture/" }
          - { label: "Secondary teacher", href: "uk/careers/teaching/" }
          - { label: "Investment banking", href: "uk/careers/investment-banking/" }
          - { label: "Social worker", href: "uk/careers/social-work/" }

# UK top menu (2026-10-31): UK pages have NO sidebar any more. Every uk/** page draws this row
# (_includes/in-header-hubs.html with edition "uk", same shape as _data/nav.yml topnav). `sidebar` above is kept
# for scripts/check-uk-data.mjs only; no page renders it now. Only link to pages that exist.
