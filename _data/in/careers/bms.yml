  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Is BMS only available in Mumbai?"
            a: "BMS is heavily concentrated at University of Mumbai and its 200+ affiliated colleges, making it the dominant management degree name in Maharashtra. A small number of colleges outside Maharashtra, including one under Delhi University, also offer BMS, but if you're outside Maharashtra you'll far more commonly encounter the same degree under the name BBA or, in Karnataka, BBM."
          - q: "What is the real difference between BMS and BBA?"
            a: "In practice, very little. Multiple education sources describe BMS and BBA as differing mainly in name and university affiliation rather than in substance — the core syllabus (marketing, finance, HR, operations, business law) overlaps heavily, and both lead to the same kinds of entry-level management roles and both qualify you for MBA admissions."
          - q: "How do I get admission into a Mumbai University BMS college?"
            a: "Most Mumbai University BMS admissions run through the DTE Maharashtra Centralised Admission Process (CAP), based on your Class 12 merit. A number of well-known autonomous colleges instead hold their own entrance test or interview, so always check your target college's specific process rather than assuming CAP applies everywhere."
          - q: "Can I do an MBA after BMS?"
            a: "Yes. BMS is a common feeder degree into an MBA, and Mumbai-based students often prepare for the MAH-MBA-CET, which is the entrance route into well-known Mumbai business schools like JBIMS, Sydenham and SIMSREE, alongside national exams like CAT and XAT for institutes elsewhere."
          - q: "Should I choose BMS, BBA or B.Com?"
            a: "Choose BMS if you're based in Maharashtra, especially Mumbai, and want a well-regarded local management degree. Choose BBA if you're elsewhere in India and want the same kind of management-focused education under its more nationally recognised name. Choose B.Com if you want to specialise in accounting, taxation and finance rather than broad business management."
      - note: "*Fee and salary figures are indicative, based on publicly available information as of 2026, and vary significantly by institution — always verify current figures on the official college or university website."
        class: "table-note mt-lg"
