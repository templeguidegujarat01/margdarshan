      - { label: "Kalakshetra Diploma in Bharatanatyam", value: "<strong>4 years</strong> full-time · Class XII · <strong>max age 25</strong>", source: kala-prosp }
      - { label: "Pratama (part-time, children)", value: "<strong>Age 7–17</strong> · 6 years · 2 classes a week", source: kala-pratama }
      - { label: "Doordarshan dance grades", value: "<strong>B · B-High · A · Top</strong> — minimum age 18 / 25 / 35 / 40", source: dd-dance }
