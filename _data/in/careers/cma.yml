    hid: "difficulty-heading"
    alt: true
    eyebrow: "Set expectations correctly"
    heading: "Difficulty level, time required & approximate pass %"
    parts:
      - prose:
          - "CMA is a genuinely demanding course, though generally considered a shade less punishing than CA in total time investment — mainly because of the shorter practical training period. End-to-end, most students take roughly <strong>3–4 years</strong> from Foundation registration to becoming a member, depending on how many attempts each level takes."
          - "Approximate recent pass percentages (these move every session, so treat them as a rough sense of difficulty rather than a fixed number): Intermediate has typically seen roughly <strong>22–30%</strong> of appearing candidates clear a given attempt, and Final has typically seen roughly <strong>25–45%</strong>, varying noticeably by term. Always check the latest session's official result statistics on icmai.in rather than relying on any single number as a benchmark."
