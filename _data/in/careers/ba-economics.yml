  - id: "fees"
    hid: "fees-heading"
    eyebrow: "Very affordable at top government colleges"
    heading: "Fees & scholarships"
    parts:
      - prose:
          - "This is one of the most affordable Honours degrees in India at government-funded colleges. SRCC's full 3-year B.A. (Hons) Economics course, for example, costs roughly <strong>₹97,000 in total</strong> for the General category — a fraction of what a private management or engineering degree costs. Other DU and central university colleges are similarly priced. Private and deemed universities such as Christ University, Symbiosis School of Economics or Ashoka University charge considerably more, often in the range of ₹2–6 lakh per year. Merit-based, SC/ST and income-linked scholarships are available at most government institutions. Always confirm current fees directly on your target college's official admission page."
