      - note: "All-in, official fees (evaluation + application + 4 sections with international surcharge + ethics + license) for an Indian candidate typically total roughly <strong>₹3.5–4.5 lakh</strong>, rising to <strong>₹4–7.5 lakh</strong> with a structured review course. India's international testing surcharge is among the higher rates NASBA charges globally, so testing costs here run noticeably above what a US-based candidate pays for the identical exam. All fees are billed in USD, so your INR outlay moves with the exchange rate — always verify current published fees on nasba.org and your chosen state board's website before paying."
      - source_link:
