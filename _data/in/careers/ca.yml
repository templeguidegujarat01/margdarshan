          - label: "Top recruiters"
            text: "Big 4 firms (Deloitte, EY, KPMG, PwC), Indian corporates, banks, NBFCs, IT majors, consulting firms"
          - label: "Government routes"
            text: "PSUs (via recruitment drives), RBI, SEBI, C&amp;AG, Income Tax Department (via separate exams)"
          - label: "Industries"
