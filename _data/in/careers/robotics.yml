  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Should I do a dedicated Robotics degree or Mechanical/ECE with a robotics specialisation?"
            a: "For most students, going to a stronger Mechanical, Electronics or Computer Science college and specialising in robotics through electives, projects and certifications is the safer route, since dedicated Robotics degrees are still newer and less standardised in India, with fewer colleges offering them and less established recruiter familiarity. A dedicated Robotics degree can make sense at a genuinely strong, well-established programme with real industry tie-ups — check placement records carefully rather than assuming the specific degree name matters most."
          - q: "What is a realistic Robotics Engineering salary in India?"
            a: "Reported figures vary widely by source, college and role. The median robotics engineer salary in India is commonly reported around ₹6-8 LPA, with a broader range of roughly ₹3-19 LPA depending on the college and placement record. Experienced professionals with genuine AI/ML specialisation are reported to earn ₹20-25 LPA — a meaningfully higher, skills-dependent outcome, not a fresher's starting point."
          - q: "Which entrance exam do I need for Robotics Engineering?"
            a: "It depends on the college. Some institutes admit through Joint Entrance Examination Main (JEE Main), others through a state-level CET, and several private universities run their own entrance test, such as CUCET for Chandigarh University. There isn't a single dedicated national entrance exam specifically for Robotics the way JEE Advanced exists for core Indian Institute of Technology (IIT) branches."
          - q: "Do IITs offer a dedicated Robotics Engineering degree?"
            a: "Most IITs don't offer a standalone undergraduate Robotics branch — students interested in robotics typically join Mechanical or Electronics Engineering and specialise through electives, minors, and research projects. A small number of newer institutes, including some interdisciplinary programmes, have begun offering more dedicated robotics-focused tracks."
          - q: "What skills matter most for a robotics engineering career?"
            a: "Beyond the core coursework, hands-on skills reported as most valued by recruiters include Python and C++ programming, ROS (Robot Operating System), MATLAB, PLC programming, CAD/mechanical design, sensor integration (LiDAR, computer vision, ultrasonic), embedded systems work with Arduino or Raspberry Pi, and foundational AI/machine learning for robotic perception. A genuine project portfolio matters more here than in most engineering branches."
      - note: "Figures are indicative (2026) — confirm on the official college or authority website."
        class: "table-note mt-lg"
