sections:
  - id: "quick"
    hid: "quick-heading"
    alt: true
    eyebrow: "Quick answers"
    heading: "Aircraft Maintenance Engineer at a glance"
    intro: "Check whether your Class 12 background qualifies. Duration and pay are in the summary at the top of the page."
    parts:
      - subhead: "Can I apply from my stream?"
      - streams:
          - label: "Science"
            fit: "Eligible"
            tone: "y"
            icon: "science"
          - label: "Commerce"
            fit: "Not eligible"
            tone: "n"
            icon: "commerce"
          - label: "Arts / Humanities"
            fit: "Not eligible"
            tone: "n"
            icon: "arts"
      - note: "Physics, Chemistry and Mathematics at Class 12 are the standard entry requirement."
  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What does an Aircraft Maintenance Engineer do?"
    parts:
      - overview:
          points:
            - "AMEs inspect, troubleshoot and repair airframes, engines, systems and avionics, and sign the certificate of release to service that says an aircraft is fit to fly."
            - "Category <strong>B1</strong> covers structures, powerplant, mechanical and electrical systems; <strong>B2</strong> covers avionics and electrical systems."
            - "Work happens in hangars and on the airport apron, often in shifts, including nights."
  - id: "who"
    hid: "who-heading"
    alt: true
    eyebrow: "Fit check"
    heading: "Who should become an Aircraft Maintenance Engineer"
    parts:
      - fit:
          match:
            - "Enjoy hands-on technical work and careful, checklist-driven tasks."
            - "Want an aviation career without the cost of pilot training."
            - "Are comfortable with shift work and responsibility for safety."
          mismatch:
            - "Want a desk job."
            - "Find detailed manuals and repeated exams tiring."
            - "Are not willing to keep updating skills for new aircraft types."
  - id: "eligibility"
    hid: "elig-heading"
    eyebrow: "Eligibility"
    heading: "What you need, stage by stage"
    parts:
      - elig_list:
          - "Class 12 with <strong>Physics, Chemistry and Mathematics</strong> for CAR-147 basic training courses (or a relevant engineering diploma/degree)."
          - "Minimum age <strong>18</strong> to be issued an AME licence."
          - "Pass the DGCA <strong>CAR-66 module examinations</strong> for your category."
          - "Complete the practical maintenance experience DGCA requires for your category before applying."
  - id: "roadmap"
    hid: "roadmap-heading"
    alt: true
    eyebrow: "Step-by-step"
    heading: "Your full path to becoming an Aircraft Maintenance Engineer"
    parts:
      - steps:
          - title: "Class 12 PCM"
            text: "The standard academic base."
          - title: "DGCA-approved CAR-147 training"
            text: "Check the approval on dgca.gov.in before paying fees."
          - title: "CAR-66 module exams"
            text: "Booked on eGCA; modules depend on B1 or B2."
          - title: "Practical experience"
            text: "Hands-on work at an airline or approved maintenance organisation (MRO)."
          - title: "AME licence"
            text: "Apply to DGCA once modules and experience are complete."
          - title: "Type ratings and growth"
            text: "Add aircraft types; move to certifying and supervisory roles."
  - id: "exams"
    hid: "exams-heading"
    eyebrow: "Exams & licences"
    heading: "DGCA modules, licence and ratings"
    parts:
      - chips:
          - label: "CAR-66 modules"
            text: "Subject modules (maths, physics, electrical, aerodynamics, systems, regulations and more) set by DGCA."
            source: "dgca"
          - label: "Exam booking"
            text: "DGCA exams are applied for and results tracked on the eGCA / Pariksha portals."
            source: "egca"
          - label: "Licence categories"
            text: "B1 (mechanical) and B2 (avionics); the current CAR-66 replaced the old separate airframe/engine/radio licences."
            source: "dgca"
          - label: "Type rating"
            text: "Training on a specific aircraft lets you certify that type."
            source: "dgca"
      - note_box: "Many institutes advertise “AME courses”. Only DGCA-approved CAR-147 organisations count — the list is on the DGCA website."
  - id: "salary"
    hid: "salary-heading"
    alt: true
    eyebrow: "Indicative figures"
    heading: "Aircraft Maintenance Engineer pay in India"
    intro: "Private-sector pay varies a lot by employer and city; these are broad, commonly reported ranges, not guarantees."
    parts:
      - salary:
          - label: "Trainee / technician"
            value: "Entry level"
            text: "Pay before the licence is modest."
          - label: "Licensed AME"
            value: "Big jump"
            text: "A licence with type ratings is what employers pay for."
          - label: "Senior certifying engineer"
            value: "High"
            text: "Experience on wide-body or popular types is valued in India and abroad."
  - id: "jobs"
    hid: "jobs-heading"
    eyebrow: "Where they work"
    heading: "Employers & growth path"
    parts:
      - chips:
          - label: "Employers"
            text: "Airlines, maintenance-repair-overhaul (MRO) companies, helicopter and charter operators, flying schools"
          - label: "Growth path"
            text: "Trainee → licensed AME → certifying engineer → shift/quality manager"
          - label: "Abroad"
            text: "Licence conversion may be needed to work in other countries"
  - id: "proscons"
    hid: "pc-heading"
    alt: true
    eyebrow: "Honest take"
    heading: "Advantages and disadvantages"
    parts:
      - proscons:
          pros:
            - "Aviation career with lower training cost than flying."
            - "Licensed, in-demand skill."
            - "Clear growth with type ratings."
          cons:
            - "Many module exams and years of experience before the licence."
            - "Shift work, nights and pressure to turn aircraft around safely."
            - "Low pay until licensed."
  - hid: "myth-heading"
    eyebrow: "Common myths"
    heading: "Myths vs facts"
    parts:
      - myths:
          - myth: "An AME diploma from any institute gives you a licence."
            fact: "Only DGCA issues the licence, after modules and experience."
  - hid: "related-heading"
    alt: true
    eyebrow: "Related careers"
    heading: "If you're considering Aircraft Maintenance Engineer, also look at"
    parts:
      - related:
          - name: "Commercial Pilot"
            sub: "DGCA CPL & airline flying"
            href: "commercial-pilot.html"
          - name: "Aerospace Engineering"
            sub: "Aircraft design"
            href: "aerospace.html"
          - name: "Mechanical Engineering"
            sub: "Machines & manufacturing"
            href: "mechanical.html"
          - name: "Electronics Engineering"
            sub: "Avionics-related skills"
            href: "electronics.html"
  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Is AME a degree?"
            a: "No. AME is a DGCA licence. Some institutes pair training with a degree, but the licence comes from DGCA exams and experience."
          - q: "What is the difference between B1 and B2?"
            a: "B1 covers mechanical systems, structures and engines; B2 covers avionics and electrical systems."
          - q: "How do I check if an AME institute is genuine?"
            a: "Look for it on DGCA's list of approved CAR-147 training organisations."
          - q: "Can I do AME after Class 12 Commerce?"
            a: "Training organisations and airlines ask for Physics, Chemistry and Maths, so Commerce alone is not enough."
      - note: "*Pay figures are indicative unless they quote an official pay level, and rules change: confirm eligibility, dates and fees on the official websites listed under Sources before you act."
        class: "table-note mt-lg"
