        nav: "Coach &amp; PE teacher"
        eyebrow: "Path 2"
        heading: "Coach or physical education teacher"
        parts:
          - table:
              caption: "SAI NSNIS Patiala — Diploma in Sports Coaching (2026-27, 64th batch)"
              head: ["Item", "Rule"]
              rows:
                - ["Length", "<strong>1 year</strong> (2 semesters)"]
                - ["Seats", "<strong>785 + 104 supernumerary</strong> in 26 sports, at Patiala, Bengaluru, Kolkata and Thiruvananthapuram"]
                - ["Category A", "<strong>Class 12 pass</strong> + an international record (Olympics, World or Asian Championship, Asian or Commonwealth Games, junior world events and more)"]
                - ["Category B", "<strong>Graduation</strong> + played Senior Nationals, Khelo India University Games or All India Inter-University; or played Junior/Youth Nationals, Khelo India Youth Games or Services/Railways/Police championships <strong>twice</strong>"]
                - ["Category C", "Graduation + North East Games record (only for North-East candidates)"]
