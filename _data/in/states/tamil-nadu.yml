# Tamil Nadu State Exam & Career Hub — one data sheet for the cockpit (state/tamil-nadu/index.html) and
# every exam page under state/tamil-nadu/. Rendered by _includes/state-cockpit.html and _includes/state-exam.html;
# checked by scripts/check-in-data.mjs (state sheets block).
#
# Rules for this sheet (same as the other state sheets):
#   - Every fact part carries `source: <id>`; the id must be listed under that exam's `sources`.
#   - Sources are the official files themselves (read 2026-10-19): the TNPSC notification for the Combined Civil
#     Services Examination-IV (Group IV Services), Notification No. 11/2026; and the TNUSRB notification for the
#     Common Recruitment 2025 of Grade II Police Constables, Grade II Jail Warders and Firemen (Notification
#     02/2025, Tamil — read page by page from rendered images) with its provisional list for CV / PMT / ET / PET.
#     Nothing comes from coaching or news sites.
#   - TNEA (engineering admission on Class 12 marks) was added on 2026-10-19 from the DoTE's own files: the TNEA
#     2026 Information Brochure and the SCA-to-SC conversion counselling schedule on static.tneaonline.org
#     (tneaonline.org answers a browser user-agent; plain bots get HTTP 403). TNEA has no entrance test, so it
#     has no negative-marking rule; college-wise closing cut-offs are not copied here because they change
#     every round.
#   - Section ids are the same on every exam page: overview, eligibility, scheme, fees, reservation,
#     documents, pay, posting (+ sources, drawn automatically).
state:
  id: tamil-nadu
  name: Tamil Nadu
  checked: 2026-10-19

cockpit:
  eyebrow: "State Exam &amp; Career Hub · Tamil Nadu"
  title: "Tamil Nadu Exam &amp; Career Hub"
  intro:
    - "Every major Tamil Nadu recruitment route we could verify on one screen: the Combined Civil Services Examination-IV (Group IV) of the Tamil Nadu Public Service Commission (TNPSC) — 6,574 posts in the 2026 notification — and the Common Recruitment of the Tamil Nadu Uniformed Services Recruitment Board (TNUSRB) for Grade II Police Constables, Jail Warders and Firemen. Each page is built only from the official notification, and every fact links back to that file."
    - "Tamil is the gate in both: Group IV opens with a 150-mark Tamil eligibility-cum-scoring part that you must clear before the rest of your paper is even marked, and TNUSRB has a qualifying Tamil test. 20% of posts go to Persons Studied in Tamil Medium (PSTM), and only Tamil Nadu's own communities count as SC / ST / BC / MBC. For engineering, TNEA has no entrance test at all: the rank comes from a Class 12 cut-off out of 200, and 7.5% of seats are kept for government-school students."
  facts:
    - { label: "Recruitment nodes", value: "TNPSC Group IV · TNUSRB CR" }
    - { label: "Admission nodes", value: "TNEA (cut-off out of 200) · MBBS/BDS on NEET" }
    - { label: "Watch", value: "Group IV exam 10 Jan 2027 · Tamil test + 20% PSTM" }
    - { label: "Last checked", value: "19 Oct 2026" }
  groups:
    - id: civil
      eyebrow: "Civil recruitment &amp; uniformed services"
      heading: "Government recruitment exams"
      intro: "Village Administrative Officer, Junior Assistant, Typist and other Group IV posts through TNPSC, and Grade II Police Constable, Jail Warder and Fireman posts through TNUSRB."
      exams: [tnpsc-group4, tnusrb]
    - id: academic
      eyebrow: "Academic admissions"
      heading: "Admission routes after Class 12"
      intro: "TNEA 2026: the Directorate of Technical Education's single-window B.E. / B.Tech admission, ranked on Class 12 Maths, Physics and Chemistry; and MBBS / BDS through the Selection Committee of the Directorate of Medical Education &amp; Research, on NEET UG score."
      exams: [tnea, neet-ug]
  compare_note: "Fees, age limits and dates are from the latest notice of each body. They change every cycle, so always open the current notice before applying."
  portals_note: "TNPSC notifications are on tnpsc.gov.in (applications at tnpscexams.in); TNUSRB on tnusrb.tn.gov.in; TNEA on tneaonline.org and dte.tn.gov.in. Only use these official addresses."
  portals:
    - { label: "Tamil Nadu Public Service Commission (TNPSC)", url: "https://www.tnpsc.gov.in/" }
    - { label: "TNPSC online applications", url: "https://www.tnpscexams.in/" }
    - { label: "Tamil Nadu Uniformed Services Recruitment Board (TNUSRB)", url: "https://tnusrb.tn.gov.in/" }
    - { label: "Tamil Nadu Engineering Admissions (TNEA)", url: "https://www.tneaonline.org/" }

# State engineering counselling at a glance (rendered by _includes/state-cockpit.html, block id "counselling").
# counseling_body = body, seat_allocation_rule = seat_rule, top_three_college_anchors = anchors (exactly 3,
# government institutions only). TNEA publishes no closing-rank table we could open (cutoff.tneaonline.org
# returned 503), so each closing rank is the last Open Competition (OC) allotment for that college and branch
# in DoTE's own TNEA 2026 Round 1 General Academic provisional allotment list (read 2026-10-23).
counselling:
  eyebrow: "B.E. / B.Tech counselling"
  heading: "Who allots engineering seats in Tamil Nadu"
  intro: "TNEA is Tamil Nadu's single-window engineering counselling. There is no entrance test: rank comes from Class 12 marks. Below: who runs it, how seats are reserved, and the last Open Competition seat at three government institutions in round 1."
  body:
    name: "Directorate of Technical Education (DoTE), Chennai — Tamil Nadu Engineering Admissions (TNEA 2026)"
    portal: "tneaonline.org"
    url: "https://www.tneaonline.org/"
    merit: "Class 12 cut-off out of 200 (Maths 100 + Physics 50 + Chemistry 50)"
    source: tn-ib
  seat_rule:
    - { text: "Rank comes only from Class 12 marks: Maths out of 100 plus Physics and Chemistry out of 50 each, a cut-off out of 200. Seats are then allotted in online counselling rounds.", source: tn-ib }
    - { text: "69% communal reservation for Tamil Nadu natives: BC 26.5%, BC Muslim 3.5%, MBC &amp; DNC 20%, SC 15%, SC Arunthathiyar 3%, ST 1%. The remaining 31% is Open Competition, where reserved candidates also compete.", source: tn-ib }
    - { text: "7.5% of the seats in every community share, General included, go to students who studied Classes 6–12 in state government schools.", source: tn-ib }
    - { text: "Communal reservation needs a permanent community certificate issued in Tamil Nadu. Students who studied Classes VIII–XII in Tamil Nadu need no nativity certificate. Children of central-government employees serving in the state apply under Open Competition only.", source: tn-ib }
  anchors_caption: "Three government institutions: B.E. Computer Science and Engineering, TNEA 2026 round 1"
  anchors:
    - { institute: "College of Engineering, Guindy (CEG) — Anna University, Chennai", seat: "CSE (college code 1) · OC seat", closing: "2,912 (cut-off 193.5)", source: tn-r1 }
    - { institute: "Madras Institute of Technology (MIT) — Anna University, Chromepet", seat: "CSE (college code 4) · OC seat", closing: "3,027 (cut-off 193.5)", source: tn-r1 }
    - { institute: "Government College of Technology (GCT), Coimbatore", seat: "CSE (college code 2005) · OC seat", closing: "13,882 (cut-off 184.0)", source: tn-r1 }
  anchors_note: "TNEA general rank and Class 12 cut-off of the last candidate given an Open Competition seat in that branch in round 1. Margdarshan worked these out from DoTE's allotment list; DoTE does not print them as a closing rank. Community seats close further out and are listed in the same file."
  sources:
    - { id: tn-ib, name: "DoTE Tamil Nadu — TNEA 2026 Information Brochure", url: "https://static.tneaonline.org/docs/2_Information_Brochure_2026.pdf", covers: "cut-off formula, reservation, 7.5% government-school quota, nativity", checked: 2026-10-19 }
    - { id: tn-r1, name: "DoTE Tamil Nadu — TNEA 2026 Round 1 General Academic Provisional Allotment List", url: "https://static.tneaonline.org/docs/TNEA-2026-ROUND-1-GENERAL-ACADEMIC-PROVISIONAL-ALLOTMENT-LIST.pdf", covers: "rank, cut-off mark, community, college code, branch and allotted category of every round-1 allotment", checked: 2026-10-23 }

exams:
  # ------------------------------------------------------------------ SELECTION COMMITTEE — MBBS / BDS (read 31 Oct 2026)
  - slug: neet-ug
    group: academic
    short: "MBBS &amp; BDS Admission — Selection Committee (NEET UG)"
    body: "Selection Committee, Directorate of Medical Education &amp; Research, Chennai"
    card: "The Selection Committee fills 85% of government MBBS / BDS seats, government quota seats in self-financing colleges and management quota seats on NEET UG score, with Tamil Nadu's 69% reservation and a 7.5% preferential quota for government-school students. Government college MBBS costs ₹18,073 a year."
    card_facts: ["Tamil Nadu natives", "7.5% govt-school quota", "Govt MBBS ₹18,073 / yr"]
    eyebrow: "Selection Committee · MBBS &amp; BDS"
    title: "Tamil Nadu NEET UG Counselling 2026 — MBBS &amp; BDS Selection, 7.5% Quota, Reservation &amp; Fees"
    lede: "Tamil Nadu admits students to MBBS and BDS in government colleges, ESIC Medical College (K.K. Nagar), government quota seats in self-financing colleges and state private university colleges through the Selection Committee of the Directorate of Medical Education &amp; Research. This page follows the 2026-27 government quota prospectus (G.O.(D) No. 667, 5 June 2026) and the stray round notice."
    facts:
      - { label: "Merit", value: "NEET UG 2026 score (state rank list)", source: tn-pros }
      - { label: "Reservation", value: "OC 31 · BC 30 · MBC 20 · SC 18 · ST 1", source: tn-pros }
      - { label: "Govt college fee", value: "MBBS ₹18,073 · BDS ₹16,073 a year", source: tn-pros }
      - { label: "Discontinuation fee", value: "₹10,00,000 after Round 2", source: tn-pros }
    official:
      - { label: "Tamil Nadu Medical Selection Committee", url: "https://tnmedicalselection.net/" }
      - { label: "MBBS / BDS prospectus 2026-27 (government quota, PDF)", url: "https://tnmedicalselection.net/news/30062026003157.pdf" }
    sections:
      - id: overview
        nav: "Overview"
        eyebrow: "Overview &amp; official source"
        heading: "Single-window MBBS and BDS counselling on NEET score"
        parts:
          - p: "Qualified candidates register online on the Selection Committee website; the Committee does not allot any general seat manually. Selection is made on the <strong>NEET-UG 2026 score</strong> by single-window counselling, following Tamil Nadu's rule of reservation. A separate prospectus covers management quota, minority and NRI seats in self-financing colleges."
            source: tn-pros
          - table:
              caption: "Seat categories"
              head: ["Category", "Seats"]
              rows:
                - ["A", "85% of seats in government medical colleges"]
                - ["A1", "ESIC Medical College, K.K. Nagar, Chennai"]
                - ["B", "Government quota seats in self-financing medical colleges"]
                - ["C", "85% of seats in government dental colleges"]
                - ["D", "Government quota seats in self-financing dental colleges"]
            source: tn-pros
          - p: "The other 15% of seats in government medical and dental colleges and ESIC K.K. Nagar is surrendered to the All India quota."
            source: tn-pros
      - id: eligibility
        nav: "Eligibility &amp; Nativity"
        eyebrow: "Who can apply"
        heading: "Native of Tamil Nadu, 17 years old, NEET percentile"
        parts:
          - list:
              - "Indian citizen (OCI / PIO registered under Section 7A may apply, but only as open category), at least <strong>17 years</strong> old by 31 December 2026."
              - "<strong>Native of Tamil Nadu</strong>, with a Nativity Certificate from the Tamil Nadu government. People from other states living in Tamil Nadu cannot claim nativity; a candidate who sat NEET as a native of another state cannot apply as a Tamil Nadu native; a permanent residence certificate is not accepted."
              - "NEET-UG 2026 at the <strong>50th percentile</strong> (40th for SC, ST, OBC; 45th for unreserved PwBD), unless the Government of India lowers it."
              - "Passed Physics, Chemistry, Biology / Biotechnology and English in Class 12."
            source: tn-pros
      - id: scheme
        nav: "Counselling Rounds"
        eyebrow: "Counselling rounds"
        heading: "Round 1, 2, 3 and a stray round, all online"
        parts:
          - list:
              - "Four rounds: Round 1, Round 2, Round 3 and the Stray Round. Register and lock choices within each round's schedule; locked choices cannot be changed."
              - "Special categories (PwBD, eminent sports persons, children of ex-servicemen) are counselled separately; the mode and venue are announced on the website."
              - "In Round 3 and the stray round, paying the fee and downloading the allotment order counts as joining."
            source: tn-pros
          - table:
              caption: "2026 stray vacancy round"
              head: ["Item", "Detail"]
              rows:
                - ["Registration &amp; choice locking", "18 – 21 Oct 2026"]
                - ["Result", "22 Oct 2026"]
                - ["Last date of reporting", "26 Oct 2026, 5 pm"]
                - ["Ranks called (government quota)", "General rank 1 – 35,926 (NEET 705 – 177)"]
                - ["Ranks called (management quota)", "General rank 1 – 26,956"]
            source: tn-stray
          - note: "Only candidates not holding any MBBS / BDS seat in All India or state quota could take part in the stray round."
            source: tn-stray
      - id: fees
        nav: "Fees &amp; Deposit"
        eyebrow: "Application fee, deposit &amp; tuition"
        heading: "₹500 to apply, ₹18,073 a year in a government college"
        parts:
          - table:
              caption: "Government medical and dental colleges (per year)"
              head: ["Course", "Total", "of which tuition"]
              rows:
                - ["MBBS", "₹18,073", "₹6,000"]
                - ["BDS", "₹16,073", "₹4,000"]
            source: tn-pros
          - list:
              - "Application fee ₹500 (SC / SCA / ST exempt); counselling registration fee ₹500; ₹100 extra per special category claimed."
              - "Security deposit: nil for government colleges; <strong>₹30,000</strong> for government quota seats in self-financing colleges (SC / SCA / ST with family income below ₹2.5 lakh exempt). It is forfeited if you do not join a Round 3 or later seat."
              - "Government quota seats in self-financing dental colleges: ₹2,50,000 a year; self-financing medical college fees are fixed by the Fee Committee. ESIC K.K. Nagar: ₹1 lakh (₹24,000 for wards of insured persons)."
            source: tn-pros
      - id: reservation
        nav: "Reservation"
        eyebrow: "Rule of reservation"
        heading: "69% communal reservation plus 7.5% for government-school students"
        parts:
          - table:
              head: ["Group", "Share"]
              rows:
                - ["Open Competition", "31%"]
                - ["Backward Class (incl. 3.5% for Muslims, BCM)", "30%"]
                - ["Most Backward Class / Denotified Communities", "20%"]
                - ["Scheduled Caste (16% of it for Arunthathiyars, SCA)", "18%"]
                - ["Scheduled Tribe", "1%"]
            source: tn-pros
          - list:
              - "<strong>7.5% special preferential quota:</strong> 7.5% of government seats in government and self-financing colleges go to students who studied Classes 6 to 12 in Tamil Nadu government schools and qualified NEET-UG 2026; unfilled seats go to private-school students."
              - "Children of ex-servicemen (MBBS 10, BDS 1) and eminent sports persons (MBBS 13, BDS 2) have reserved seats in government colleges."
              - "Reserved-category candidates also compete in Open Competition on rank. Unfilled SCA seats go to other SC and vice versa; unfilled ST seats go to SC."
            source: tn-pros
      - id: documents
        nav: "Documents"
        eyebrow: "Document checklist"
        heading: "Nativity and community certificates"
        parts:
          - list:
              - "Nativity Certificate (uploaded with the application only) and a Community Certificate of either parent from the Tamil Nadu revenue authority to claim reservation."
              - "Government-school quota: bonafide certificates from the schools for Classes 6 to 12."
              - "Special categories upload a separate form; sports candidates are verified in person."
              - "All originals go to the Dean / Principal at admission, or the selection is cancelled."
            source: tn-pros
      - id: pay
        nav: "Exit Rules"
        eyebrow: "Discontinuation"
        heading: "₹10 lakh if you leave late"
        parts:
          - list:
              - "Discontinuing after the permitted resignation date in Round 2, or later, costs a <strong>₹10,00,000</strong> discontinuation fee by demand draft to the Secretary, Selection Committee."
              - "Not joining a Round 3 or stray round seat also costs ₹10,00,000 plus forfeiture of the security deposit and tuition fee."
              - "MBBS lasts 5½ years and BDS 5 years, each including a one-year internship."
            source: tn-pros
      - id: posting
        nav: "After Allotment"
        eyebrow: "After allotment"
        heading: "Pay online, download the order, join"
        parts:
          - p: "An allotment gives no right to the seat until the tuition fee is paid online and the provisional allotment order is downloaded within the time limit; then the candidate joins the college with original documents and signs the discipline declaration."
            source: tn-pros
          - links:
              - { label: "NEET UG", url: "neet-ug.html" }
              - { label: "TNEA", url: "state/tamil-nadu/tnea.html" }
              - { label: "MBBS college finder", url: "colleges-mbbs.html" }
    sources:
      - { id: tn-pros, name: "Selection Committee, DME&amp;R Chennai — Prospectus for MBBS / BDS in government colleges, government quota in self-financing colleges, ESIC K.K. Nagar and state private universities, 2026-27 (G.O.(D) No. 667, 5 Jun 2026)", url: "https://tnmedicalselection.net/news/30062026003157.pdf", covers: "online-only allotment, seat categories, AIQ 15%, age, nativity, percentile, rounds, joining rule, fees, deposits, reservation shares, 7.5% quota, special categories, documents, discontinuation fee, course length", checked: 2026-10-31 }
      - { id: tn-stray, name: "Selection Committee — Tentative stray vacancy round schedule for MBBS &amp; BDS, 2026-27 (92.5%)", url: "https://tnmedicalselection.net/news/17102026232125.pdf", covers: "stray round dates, rank ranges called, who is eligible", checked: 2026-10-31 }
  # ------------------------------------------------------------------ TNPSC GROUP IV
  - slug: tnpsc-group4
    group: civil
    short: "TNPSC Group IV (CCSE-IV) 2026"
    body: "Tamil Nadu Public Service Commission"
    card: "TNPSC's biggest recruitment: 6,574 posts — Village Administrative Officer, Junior Assistant, Bill Collector, Typist, Steno-Typist, Forest Guard and more — through one SSLC-level OMR paper on 10 January 2027. Applications close on 5 November 2026."
    card_facts: ["6,574 posts", "Exam 10 Jan 2027", "Fee ₹100 (+ ₹150 OTR)"]
    eyebrow: "TNPSC · Group IV Services"
    title: "TNPSC Group IV 2026 (Notification 11/2026) — 6,574 Posts, Age, Tamil Test, Scheme, Reservation"
    lede: "The Tamil Nadu Public Service Commission fills Group IV posts — Village Administrative Officer, Junior Assistant, Typist, Steno-Typist and others — through the Combined Civil Services Examination-IV. This page follows Notification No. 11/2026 (Advertisement No. 747) of 6 October 2026."
    facts:
      - { label: "Posts", value: "6,574 (tentative)", source: g4-noti }
      - { label: "Apply by", value: "5 Nov 2026, 11:59 pm", source: g4-noti }
      - { label: "Exam", value: "10 Jan 2027 · OMR", source: g4-noti }
      - { label: "Tamil part", value: "40% needed to be marked", source: g4-noti }
    official:
      - { label: "TNPSC website", url: "https://www.tnpsc.gov.in/" }
      - { label: "Notification 11/2026 (English)", url: "https://tnpsc.gov.in/document/english/group_english.pdf" }
    sections:
      - id: overview
        nav: "Overview"
        eyebrow: "Overview &amp; official source"
        heading: "6,574 posts in one exam"
        parts:
          - table:
              caption: "Group IV 2026 timeline"
              head: ["Stage", "Date"]
              rows:
                - ["Notification and start of applications", "6 Oct 2026"]
                - ["Last date (online)", "5 Nov 2026, 11:59 pm"]
                - ["Application correction window", "9 – 11 Nov 2026"]
                - ["Written exam (9:30 am – 12:30 pm)", "10 Jan 2027"]
            source: g4-noti
          - list:
              - "The 6,574 vacancies are tentative and may change before counselling; their department / unit-wise distribution will be announced later."
              - "Among them: Village Administrative Officer 291 (Level 8); Junior Administrative Assistant in the Tamil Nadu Power Distribution Corporation 422; Typist and Steno-Typist posts in the Ministerial, Judicial and Secretariat services; Junior Assistant, Bill Collector and Tax Collector posts in many services and corporations; and Forest Guard with Driving Licence and Forest Watcher."
              - "Applicants choose whether to be considered for the Forest Guard / Forest Watcher posts as well, or only for the other posts."
            source: g4-noti
      - id: eligibility
        nav: "Eligibility &amp; Age"
        eyebrow: "Eligibility &amp; age limits"
        heading: "SSLC, knowledge of Tamil, age 18 (VAO 21) to 30 or more"
        parts:
          - table:
              caption: "Age on 1 July 2026 — main posts"
              head: ["Post", "Others", "SC / SC(A) / ST", "BC / BCM / MBC / DC"]
              rows:
                - ["Village Administrative Officer", "21 – 30", "21 – 40", "21 – 40"]
                - ["Junior Assistant, Bill Collector, Typist, Steno-Typist (most units)", "18 – 30", "18 – 35", "18 – 32"]
                - ["Executive Officer Grade IV", "25 – 35", "25 – 40", "25 – 37"]
            source: g4-noti
          - list:
              - "Forest Guard with Driving Licence and Forest Watcher: 21 – 30 for 'Others'; persons with disabilities cannot apply for these posts."
              - "Persons with benchmark disability: up to 40 for 'Others' (reserved categories 42–45, VAO 50); ex-servicemen up to 48 ('Others') or 53; destitute widows have their own limits. For several corporation posts reserved-category candidates have no maximum age (meaning under 60)."
              - "Reserved-category candidates with a general qualification higher than the minimum have no maximum age for the posts marked so in the notification."
              - "<strong>Qualification:</strong> SSLC pass (VAO: the minimum general educational qualification). Typist and Steno-Typist also need the Government Technical Examinations in typewriting / shorthand and a computer office automation certificate."
              - "<strong>Knowledge of Tamil:</strong> SSLC / HSC / degree with Tamil as a language, or high-school study in Tamil medium, or the Second Class Language Test (Full Test) in Tamil conducted by TNPSC."
            source: g4-noti
      - id: scheme
        nav: "Exam Scheme"
        eyebrow: "Exam scheme &amp; marking"
        heading: "One 300-mark OMR paper; the Tamil part decides whether the rest is marked"
        parts:
          - table:
              caption: "Single paper, SSLC standard, 3 hours, OMR"
              head: ["Part", "Subject", "Questions", "Marks"]
              rows:
                - ["A", "Tamil Eligibility-cum-Scoring Test", "100", "150"]
                - ["B", "General Studies", "75", "150 (B + C)"]
                - ["C", "Aptitude and Mental Ability", "25", "(with B)"]
                - ["", "Total", "200", "300"]
            source: g4-noti
          - list:
              - "Parts B and C are evaluated <strong>only if you score at least 60 marks (40%) in Part A</strong>. The rank is on the total of Parts A, B and C, and the minimum qualifying mark is 90 for all communities."
              - "Part A is set in Tamil only; Parts B and C in Tamil and English. Differently abled candidates who studied only English may take General English (SSLC) in place of Part A, with the same 40% minimum."
              - "Shortlisting for on-screen certificate verification is 1:3 (General) and 1:2 (reserved) for VAO, Junior Assistant, Typist and Steno-Typist; 1:6 for the forest posts, which also have a physical standards test and an endurance walk (25 km for men, 16 km for women and third gender, in four hours) in Chennai."
            source: g4-noti
      - id: fees
        nav: "Fees"
        eyebrow: "Fee structure"
        heading: "₹100 exam fee, ₹150 one-time registration"
        parts:
          - table:
              head: ["Item / candidate", "Amount"]
              rows:
                - ["One Time Registration (valid 5 years)", "₹150"]
                - ["Examination fee", "₹100"]
                - ["SC, SC(A), ST; persons with benchmark disability; destitute widows", "Full exemption"]
                - ["BC, BCM, MBC / DC", "Three free chances"]
                - ["Ex-servicemen", "Two free chances"]
            source: g4-noti
          - note: "Each application that claims a concession uses up one free chance, whatever the post; a false claim leads to rejection and a one-year debarment."
            source: g4-noti
      - id: reservation
        nav: "Reservation &amp; Local Status"
        eyebrow: "Reservation &amp; local status"
        heading: "Tamil Nadu communities, women 30%, PSTM 20%"
        parts:
          - table:
              caption: "Communal reservation"
              head: ["Category", "Share"]
              rows:
                - ["Backward Classes (other than Muslims)", "26.5%"]
                - ["Backward Class Muslims", "3.5%"]
                - ["Most Backward Classes / Denotified Communities", "20%"]
                - ["Scheduled Castes", "15%"]
                - ["Scheduled Castes (Arunthathiyars)", "3%"]
                - ["Scheduled Tribes", "1%"]
            source: g4-noti
          - list:
              - "Only persons belonging to Tamil Nadu and to a community on the state's lists are treated as SC / ST / BC / MBC; others compete as General."
              - "30% of direct-recruitment vacancies are for women, and 10% of those for destitute widows. 4% of identified posts are for persons with benchmark disabilities."
              - "<strong>PSTM:</strong> 20% priority for Persons Studied in Tamil Medium — through Tamil medium up to the qualification prescribed (from Class 1 if a degree is required), under the PSTM Act 2010 as amended in 2026. Passing as a private candidate without attending school does not count."
            source: g4-noti
      - id: documents
        nav: "Documents"
        eyebrow: "Document checklist"
        heading: "Community certificates must name a parent, not a spouse"
        parts:
          - list:
              - "Date of birth: SSLC or HSC mark sheet of the Tamil Nadu boards; otherwise a birth certificate, transfer certificate or degree mark sheet."
              - "SC / SC(A): community certificate from the Taluk Tahsildar; ST: from the RDO / Sub-Collector / Assistant Collector or as listed; BC / BCM / MBC / DC: from a Tahsildar or the deputy tahsildars named — all citing the father's or mother's name. A certificate citing the spouse is rejected, and certificates based only on SSLC or TC entries are not accepted."
              - "Proof of Tamil knowledge (SSLC / HSC / degree mark sheets or the language-test pass) and PSTM proof covering every year of study."
              - "Disability certificate (Annexure V), sports or experience certificates where claimed."
            source: g4-noti
      - id: pay
        nav: "Pay &amp; Salary"
        eyebrow: "Salary"
        heading: "Level 8 for most posts, Level 10 for Steno-Typist"
        parts:
          - p: "Village Administrative Officer, Junior Assistant, Typist and most posts are at pay Level 8, and Steno-Typist Grade III mostly at Level 10; corporation posts carry their own scales, such as Level 3 (₹19,500 – 62,000) for the Junior Administrative Assistant in the power-distribution corporation."
            source: g4-noti
          - note: "The notification prints levels, not rupee figures, for the government posts, so no in-hand pay is shown."
      - id: posting
        nav: "Job &amp; Posting"
        eyebrow: "Job profile &amp; posting"
        heading: "Rank, counselling, then posting"
        parts:
          - p: "Candidates are called to physical certificate verification and counselling in merit order — 1:3 for General and 1:1.5 for reserved categories for VAO, Junior Assistant and Steno-Typist; 1:3 and 1:2 for Typist — and choose posts by rank. Equal marks go to the older candidate, then to the earlier application number."
            source: g4-noti
    sources:
      - { id: g4-noti, name: "TNPSC — Notification No. 11/2026 (Advt. No. 747), Combined Civil Services Examination-IV (Group IV Services) (6 Oct 2026)", url: "https://tnpsc.gov.in/document/english/group_english.pdf", covers: "dates, posts and vacancies, pay levels, age limits and concessions, qualifications, Tamil knowledge, scheme, evaluation rule, shortlisting ratios, fees and concessions, communal reservation, women and PSTM quotas, certificates, tie rules", checked: 2026-10-19 }

  # ------------------------------------------------------------------ TNUSRB — COMMON RECRUITMENT
  - slug: tnusrb
    group: civil
    short: "TNUSRB Common Recruitment 2025 — Police Constable, Jail Warder, Fireman"
    body: "Tamil Nadu Uniformed Services Recruitment Board"
    card: "TNUSRB's combined exam for 2,833 Grade II Police Constables, 180 Grade II Jail Warders and 631 Firemen (plus 21 ST shortfall posts). The written exam was held on 9 November 2025; 18,689 candidates were shortlisted for certificate verification and physical tests."
    card_facts: ["3,644 + 21 posts", "Class 10 · ₹18,200 – 67,100", "Fee ₹250"]
    eyebrow: "TNUSRB · Common Recruitment"
    title: "TNUSRB Common Recruitment 2025 — Grade II Police Constable, Jail Warder, Fireman: Age, Tamil Test, PMT, Scheme"
    lede: "The Tamil Nadu Uniformed Services Recruitment Board recruits Grade II Police Constables, Grade II Jail Warders and Firemen through one Common Recruitment. This page follows Notification No. 02/2025 (21 August 2025, in Tamil) and the Board's provisional list for certificate verification and physical tests."
    facts:
      - { label: "Posts", value: "3,644 + 21 ST shortfall", source: cr-noti }
      - { label: "Status", value: "18,689 called for CV / PMT / ET / PET", source: cr-cv }
      - { label: "Age (1 Jul 2025)", value: "18 – 26 (OC)", source: cr-noti }
      - { label: "Merit", value: "100 marks (written 70)", source: cr-noti }
    official:
      - { label: "TNUSRB website", url: "https://tnusrb.tn.gov.in/" }
      - { label: "Common Recruitment page", url: "https://tnusrb.tn.gov.in/commonrecruitment-tnusrb.php" }
    sections:
      - id: overview
        nav: "Overview"
        eyebrow: "Overview &amp; official source"
        heading: "Three uniformed posts in one recruitment"
        parts:
          - table:
              caption: "Posts in Common Recruitment 2025"
              head: ["Department", "Post", "Men", "Women", "Total"]
              rows:
                - ["Police", "Grade II Police Constable", "2,833 (common)", "", "2,833"]
                - ["Prisons &amp; Correctional Services", "Grade II Jail Warder", "142", "38", "180"]
                - ["Fire &amp; Rescue Services", "Fireman", "631", "—", "631"]
                - ["Police (ST shortfall)", "Grade II Police Constable", "", "", "21"]
            source: cr-noti
          - table:
              caption: "Timeline"
              head: ["Stage", "Date"]
              rows:
                - ["Notification", "21 Aug 2025"]
                - ["Online applications", "22 Aug – 21 Sep 2025"]
                - ["Correction of applications", "Till 25 Sep 2025"]
                - ["Written exam", "9 Nov 2025"]
            source: cr-noti
          - p: "The Board has published a provisional list of 18,689 candidates (including 649 tied at the cut-off) for certificate verification, physical measurement, endurance and physical efficiency tests, drawn at five times the vacancies under the rule of reservation. Certificate verification had not yet been held when the list was made."
            source: cr-cv
      - id: eligibility
        nav: "Eligibility &amp; Age"
        eyebrow: "Eligibility &amp; age limits"
        heading: "Class 10 pass; age 18 to 26 for OC"
        parts:
          - table:
              caption: "Age on 1 July 2025 (minimum 18)"
              head: ["Category", "Maximum age"]
              rows:
                - ["General (OC)", "26"]
                - ["BC, BC (Muslim), MBC / DNC", "28"]
                - ["SC, SC (Arunthathiyar), ST", "31"]
                - ["Transgender", "31"]
                - ["Destitute widow", "37"]
                - ["Ex-servicemen / ex-CAPF personnel", "47"]
            source: cr-noti
          - list:
              - "<strong>Qualification:</strong> at least a pass in Class 10 or equivalent."
              - "Women may opt only for Police Constable and Jail Warder (Fireman is not open to women); transgender candidates only for Police Constable."
            source: cr-noti
      - id: scheme
        nav: "Exam Scheme"
        eyebrow: "Exam scheme &amp; marking"
        heading: "A qualifying Tamil test, a 70-mark written exam, physical tests and special marks"
        parts:
          - table:
              caption: "Stages and marks"
              head: ["Stage", "Marks", "Nature"]
              rows:
                - ["Tamil language eligibility test — 80 Q, 80 min", "80", "Qualifying: 32 marks (40%); not counted"]
                - ["Main written exam — GK 45 + Psychology 25, 80 min", "70", "Minimum 25 marks (35%)"]
                - ["Certificate verification", "—", "—"]
                - ["Physical measurement test", "—", "Qualifying"]
                - ["Endurance test", "—", "Qualifying"]
                - ["Physical efficiency tests", "24", "Counted"]
                - ["Special marks — NCC 2, NSS 2, sports 2", "6", "Counted"]
            source: cr-noti
          - list:
              - "The main written paper is marked only for those who pass the Tamil test. Candidates are called to the next stages at 1:5 by category."
              - "<strong>PMT:</strong> height 170 cm for men and 159 cm for women (SC / SC(A) / ST: 167 cm and 157 cm); men's chest 81 cm with 5 cm expansion. Ex-servicemen and ex-CAPF candidates are exempt from PMT. <strong>Endurance:</strong> men run 1,500 m in 7 minutes."
            source: cr-noti
      - id: fees
        nav: "Fees"
        eyebrow: "Fee structure"
        heading: "₹250, online only"
        parts:
          - p: "The examination fee is ₹250, paid online by net banking, credit / debit card (RuPay) or UPI."
            source: cr-noti
      - id: reservation
        nav: "Reservation &amp; Local Status"
        eyebrow: "Reservation &amp; local status"
        heading: "Communal reservation plus special quotas"
        parts:
          - table:
              caption: "Communal reservation"
              head: ["Category", "Share"]
              rows:
                - ["General (OC)", "31%"]
                - ["BC", "26.5%"]
                - ["BC (Muslim)", "3.5%"]
                - ["MBC / DNC", "20%"]
                - ["SC", "15%"]
                - ["SC (Arunthathiyar)", "3%"]
                - ["ST", "1%"]
            source: cr-noti
          - table:
              caption: "Special quotas"
              head: ["Quota", "Police Constable", "Jail Warder", "Fireman"]
              rows:
                - ["Wards-cum-dependants", "10% (9+1)", "10% (9+1)", "10% (9+1)"]
                - ["Sportspersons", "7%", "10%", "10%"]
                - ["Meritorious sportspersons (through SDAT)", "3%", "—", "—"]
                - ["Ex-servicemen", "5%", "5%", "5%"]
                - ["Destitute widows", "3%", "3%", "—"]
                - ["Persons Studied in Tamil Medium (priority)", "20%", "20%", "20%"]
            source: cr-noti
      - id: documents
        nav: "Documents"
        eyebrow: "Document checklist"
        heading: "Only certificates uploaded online are accepted"
        parts:
          - list:
              - "At certificate verification you must show the originals of every certificate uploaded online; no new certificate is accepted then."
              - "Failing to produce a certificate costs you the claim it supports — qualification, age relaxation, communal reservation, priority, special quota or special marks."
              - "Height and chest certificates from hospitals or other agencies are not accepted; measurement is done only by the Board."
            source: cr-noti
      - id: pay
        nav: "Pay &amp; Salary"
        eyebrow: "Salary"
        heading: "₹18,200 – 67,100"
        parts:
          - p: "All three posts are in the pay scale ₹18,200 – 67,100."
            source: cr-noti
      - id: posting
        nav: "Job &amp; Posting"
        eyebrow: "Job profile &amp; posting"
        heading: "Post preference decides where you land"
        parts:
          - p: "Applicants list one or more posts in order of preference in the online form; if they qualify for more than one, they are selected for the higher preference only, and preference cannot be changed later. Wards-cum-dependants are considered only under their parent's department. Police Constables are posted as laid down in G.O. (Ms) No. 388 Home (Police-IX) of 4 August 2025."
            source: cr-noti
    sources:
      - { id: cr-noti, name: "TNUSRB — Notification No. 02/2025, Common Recruitment 2025 for Grade II Police Constable, Grade II Jail Warder and Fireman (21 Aug 2025, Tamil)", url: "https://tnusrb.tn.gov.in/pdfs/Notification_CR_2025.pdf", covers: "dates, vacancies, special quotas, pay, qualification, age, communal reservation, women and transgender rules, post preference, exam stages and marks, Tamil test, PMT, endurance test, fee, certificate rules", checked: 2026-10-19 }
      - { id: cr-cv, name: "TNUSRB — Provisional list of candidates eligible for CV, PMT, ET and PET, Common Recruitment 2025", url: "https://tnusrb.tn.gov.in/pdfs/CR2025_Candidates_Eligible_for_CV-PMT-ET-PET_en.pdf", covers: "1:5 shortlisting, 18,689 candidates including 649 tied", checked: 2026-10-19 }

  # ------------------------------------------------------------------ TNEA
  - slug: tnea
    group: academic
    short: "TNEA 2026 — Engineering Admission on Class 12 Marks"
    body: "Directorate of Technical Education, Tamil Nadu"
    card: "Tamil Nadu's single-window B.E. / B.Tech admission. There is no entrance test: your rank comes from Class 12 Maths (100) + Physics (50) + Chemistry (50) = a cut-off out of 200, then online counselling in rounds. 7.5% of seats go to government-school students, whose fees the government pays."
    card_facts: ["No entrance test", "Cut-off = M + P/2 + C/2 (out of 200)", "Fee ₹500 · SC/SCA/ST ₹250"]
    eyebrow: "DoTE Tamil Nadu · TNEA 2026"
    title: "TNEA 2026 — Cut-off Formula, Tie-break Order, 69% Reservation, 7.5% Government School Quota, Counselling Rounds"
    lede: "The Directorate of Technical Education, Chennai runs Tamil Nadu Engineering Admissions (TNEA) — one online application for government, aided, Anna University, Annamalai University and surrendered self-financing engineering seats. This page follows the TNEA 2026 Information Brochure and the DoTE schedule for the 2026 SCA-to-SC conversion counselling."
    facts:
      - { label: "Entrance test", value: "None — Class 12 marks", source: tn-ib }
      - { label: "Cut-off", value: "Maths 100 + Phy 50 + Chem 50 = 200", source: tn-ib }
      - { label: "Govt-school quota", value: "7.5% · fees paid by govt", source: tn-ib }
      - { label: "Registration fee", value: "₹500 · SC/SCA/ST ₹250", source: tn-ib }
    official:
      - { label: "TNEA portal", url: "https://www.tneaonline.org/" }
      - { label: "Directorate of Technical Education", url: "https://www.dte.tn.gov.in/" }
      - { label: "TNEA 2026 Information Brochure", url: "https://static.tneaonline.org/docs/2_Information_Brochure_2026.pdf" }
    sections:
      - id: overview
        nav: "Overview"
        eyebrow: "Overview &amp; official source"
        heading: "One application, no entrance test"
        parts:
          - list:
              - "One online application covers seats in Government engineering colleges; aided and self-supporting courses in Government-aided colleges; seats surrendered by CECRI Karaikudi, CIPET Chennai and IIHT Salem; Anna University departments and constituent colleges (including Tamil-medium Mechanical and Civil); Annamalai University; and seats surrendered by self-financing colleges."
              - "Register only one application. Special-reservation claims (ex-servicemen's wards, disability, sports, 7.5% government school) are chosen inside the same application."
              - "Courses: B.E. / B.Tech (4 years, 8 semesters), B.E. Sandwich (5 years, 10 semesters) and integrated M.Tech Computer Science and Engineering (5 years)."
            source: tn-ib
          - table:
              caption: "2026 SCA-to-SC conversion counselling (Academic, 7.5% government school and Vocational)"
              head: ["Stage", "Date"]
              rows:
                - ["Choice filling", "10 Sep 2026, 10 am – 5 pm"]
                - ["Tentative allotment", "11 Sep 2026, 10 am"]
                - ["Confirmation of tentative allotment", "11 Sep 2026, 10 am – 5 pm"]
                - ["Provisional allotment", "12 Sep 2026"]
            source: tn-sca
          - note: "In October 2026 the TNEA portal showed registration, certificate verification, the rank list and three general counselling rounds as completed. The 2027 cycle has not been announced yet."
      - id: eligibility
        nav: "Eligibility"
        eyebrow: "Eligibility &amp; nativity"
        heading: "Class 12 with Maths, Physics and Chemistry — 45% (40% reserved)"
        parts:
          - table:
              caption: "Minimum average of Maths, Physics and Chemistry in Class 12 (academic stream)"
              head: ["Community", "Minimum"]
              rows:
                - ["General category", "45%"]
                - ["BC, including BC Muslim", "40%"]
                - ["MBC &amp; DNC", "40%"]
                - ["SC / SCA / ST", "40%"]
            source: tn-ib
          - list:
              - "You must pass both +1 and +2. The vocational stream also qualifies: one of Maths, Physics or Chemistry plus a listed vocational subject (Basic Mechanical, Electrical, Electronics, Civil or Automobile Engineering, or Textile Technology), theory and practicals together — 45% general, 40% for others."
              - "For the minimum, marks are not rounded and normalised marks are not used. Improvement-exam marks are not counted."
              - "<strong>Nativity:</strong> anyone who studied Classes VIII–XII in Tamil Nadu may apply without a nativity certificate. Tamil Nadu natives who studied outside the state need an electronic / digitally signed nativity certificate. Children of central government, PSU or recognised-institution employees serving in Tamil Nadu for the past five years, and of Tamil Nadu-cadre All India Service officers, may also apply — but only under Open Competition."
              - "Sri Lankan Tamil refugees who studied in Tamil Nadu, and OCI / PIO cardholders who are Tamil Nadu natives, are considered under Open Competition."
              - "<strong>Marine Engineering</strong> needs 60% in PCM, 50% in English (Class 10 or 12), the IMU Common Entrance Test, age 25 or under, height 157 cm and weight 48 kg."
            source: tn-ib
      - id: scheme
        nav: "Cut-off &amp; Rank"
        eyebrow: "Cut-off &amp; ranking"
        heading: "Your cut-off out of 200 decides everything"
        parts:
          - formula:
              caption: "How the cut-off and the rank are built"
              build_label: "Cut-off out of 200"
              terms:
                - { name: "Mathematics", rule: "100 as is", value: "100" }
                - { name: "Physics", rule: "100 ÷ 2", value: "50" }
                - { name: "Chemistry", rule: "100 ÷ 2", value: "50" }
              total: { name: "Cut-off", value: "200" }
              example: "Maths 95, Physics 88, Chemistry 90 → 95 + 44 + 45 = <strong>184 / 200</strong>"
              chain_label: "Same cut-off? Compare in this order"
              chain:
                - "Maths percentage"
                - "Physics percentage"
                - "Optional-subject percentage"
                - "Total Class 12 percentage"
                - "Date of birth — older candidate first"
                - "Random number assigned to you — higher first"
            source: tn-ib
          - list:
              - "Marks from other boards are normalised to the Tamil Nadu State Board: each board's subject topper is set equal to the State Board topper. The brochure's example: if another board's Physics topper has 90, a student with 60 there is counted as 66.66."
              - "For CBSE and CISCE, the national-level highest mark in the subject is used for normalisation."
              - "Vocational candidates have their own rank list: Maths / Physics / Chemistry (100) + vocational theory and practicals (100) = 200. They compete for 2% of the government seats."
              - "Overall and community ranks are published on tneaonline.org and dte.tn.gov.in (no newspaper notice). Grievances about the rank list go to the nearest TNEA Facilitation Centre within 5 days."
            source: tn-ib
          - note: "College-wise closing cut-offs change every year and every round. Use the cut-offs published on tneaonline.org for the current year; this page does not predict them."
      - id: fees
        nav: "Fees"
        eyebrow: "Fee structure"
        heading: "₹500 registration; ₹250 for SC / SCA / ST"
        parts:
          - table:
              head: ["Community", "Registration fee"]
              rows:
                - ["OC / BC / BCM / MBC &amp; DNC", "₹500"]
                - ["SC / SCA / ST", "₹250"]
            source: tn-ib
          - p: "Candidates who choose 'Accept and Upward' pay the tuition fee at a TNEA Facilitation Centre to hold their seat. If they later decide not to join, 75% of the fee paid at the centre is refunded after approval."
            source: tn-ib
      - id: reservation
        nav: "Reservation"
        eyebrow: "Reservation &amp; special quotas"
        heading: "69% communal reservation for Tamil Nadu natives"
        parts:
          - table:
              caption: "Rule of reservation"
              head: ["Category", "Share"]
              rows:
                - ["Open Competition", "31%"]
                - ["Backward Class", "26.5%"]
                - ["Backward Class Muslim", "3.5%"]
                - ["Most Backward Class &amp; Denotified Communities", "20%"]
                - ["Scheduled Caste", "15%"]
                - ["Scheduled Caste Arunthathiyar", "3%"]
                - ["Scheduled Tribe", "1%"]
            source: tn-ib
          - list:
              - "<strong>7.5% for government-school students</strong> who studied Classes 6–12 in state government schools (government, corporation, municipal, Adi Dravidar &amp; Tribal Welfare, Kallar Reclamation, forest-department and other department-run schools), taken out of every community share including General (G.O. (Ms) No. 167, 31.08.2021)."
              - "Only Tamil Nadu natives get communal reservation, and only with a permanent community certificate (card, electronic or digitally signed) issued in Tamil Nadu before the last date. Other states' certificates are not accepted; without a valid certificate you are treated as OC."
              - "Reserved-category candidates are also considered under Open Competition."
            source: tn-ib
          - table:
              caption: "Special reservation (Tamil Nadu natives only)"
              head: ["Category", "Seats"]
              rows:
                - ["Sons / daughters of ex-servicemen", "150 (University 8 · Govt / aided 34 · self-financing 108)"]
                - ["Persons with benchmark disabilities", "5%"]
                - ["Eminent sportspersons", "500 (University 12 · other colleges 488)"]
            source: tn-ib
      - id: documents
        nav: "Documents"
        eyebrow: "Document checklist"
        heading: "Upload copies of the originals"
        parts:
          - list:
              - "Class 10 mark sheet; +1 and +2 (or equivalent) mark sheets; transfer certificate."
              - "Government-school study details for Classes 6–12 (for the 7.5% quota)."
              - "Permanent community certificate (ST, SC, SCA, MBC &amp; DNC, BC, BCM); nativity certificate if you studied outside Tamil Nadu (electronic only)."
              - "Income certificate and first-graduate certificate with joint declaration, if you claim those concessions; Sri Lankan Tamil refugee certificate if applicable."
              - "Special reservation: ex-servicemen's dependency certificate with the parent's discharge certificate and ID card; disability certificate from a District Medical Board of three doctors; sports certificates with the prescribed forms."
            source: tn-ib
      - id: pay
        nav: "Costs &amp; Concessions"
        eyebrow: "Fee concessions"
        heading: "Four ways the fee can come down"
        parts:
          - list:
              - "<strong>7.5% government-school quota:</strong> the government pays tuition, hostel and development fees (G.O. 221, 15.11.2021)."
              - "<strong>First Graduate concession:</strong> tuition fee concession if you will be the first graduate in the family and were admitted through counselling; not available if a brother or sister has already used it for a professional course."
              - "<strong>AICTE Tuition Fee Waiver:</strong> up to 5% of intake per course in self-financing colleges and self-supporting courses, for family income below ₹8 lakh a year; you cannot change college or course afterwards."
              - "<strong>Post-Matric Scholarship:</strong> SC / SCA / ST and SC / SCA converted Christians with parental income below ₹2.5 lakh a year."
            source: tn-ib
      - id: posting
        nav: "Counselling"
        eyebrow: "Online counselling"
        heading: "Rounds by rank, four stages each"
        parts:
          - list:
              - "Candidates are grouped by rank and called round by round. Each round has four stages: choice filling (three days, any number of choices, order matters), tentative allotment, confirmation (within two days) and reporting."
              - "<strong>Accept and Join</strong> — download the allotment order and report to the college within 5 days, or lose the seat and all later rounds."
              - "<strong>Accept and Upward</strong> — keep the seat but wait for a higher choice; report to a facilitation centre, pay the fee and deposit originals."
              - "<strong>Decline and Upward</strong>, <strong>Decline and move to next round</strong>, <strong>Decline and Quit</strong>, and — when no seat is allotted — <strong>Upward or move to next round</strong>."
              - "Counselling for sports, disability, ex-servicemen's wards, vocational candidates, supplementary rounds and vacant SCA seats is also online only."
            source: tn-ib
          - links:
              - { label: "JEE Main console", url: "jee-main.html" }
    sources:
      - { id: tn-ib, name: "DoTE Tamil Nadu — TNEA 2026 Information Brochure (Information and Instructions to Candidates)", url: "https://static.tneaonline.org/docs/2_Information_Brochure_2026.pdf", covers: "seat types, eligibility and minimum marks, nativity, marine engineering norms, reservation, 7.5% quota, special reservation, cut-off out of 200, normalisation, tie-break, vocational stream, fee concessions, registration fee, documents, counselling stages and options", checked: 2026-10-19 }
      - { id: tn-sca, name: "DoTE Tamil Nadu — TNEA 2026 SCA to SC Conversion Counselling Schedule", url: "https://static.tneaonline.org/docs/TNEA-2026-Supplementary-Schedule.pdf", covers: "choice filling, tentative and provisional allotment dates (10–12 Sep 2026)", checked: 2026-10-19 }
