# USA Edition — interstate licensing compacts and transferable exams: state-by-state status
# (global-platform Phase 12). Only lists published by the compact or exam owner are used; each list
# is copied as published on `checked` and must be re-checked by `review_by` (the checker fails after
# that date because memberships change). Compacts never replace the state license itself: they make
# it easier to practise in, or get licensed by, other member states.
#
#   license      id in licenses.yml this applies to
#   what         one or two sentences, from the compact's own description
#   groups       status groups exactly as the source defines them; states as published
#   source       id in sources.yml

nlc:
  license: nursing
  name: "Nurse Licensure Compact (NLC)"
  what: "Nurses who live in a compact state can apply for a multistate license if they meet the licensure requirements. Nurses moving from one compact state to another must apply for licensure in their new primary state of residence within 60 days."
  source: nlc_map
  checked: 2026-10-07
  review_by: 2027-01-05
  groups:
    - status: implemented
      label: "Implemented"
      meaning: "Nurses with an active multistate license may practice here, and residents may apply for one. Date implemented as listed by the NLC."
      states:
        - { name: "Alabama", since: "Jan. 1, 2020" }
