  - id: "faq"
    hid: "faq-heading"
    alt: true
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Is BFA only for students who want to become painters?"
            a: "No. BFA includes specialisations like Applied Art, which leads directly into illustration, animation and design careers, alongside Painting, Sculpture and Printmaking. Graduates work as fine artists, art teachers, illustrators, gallery curators and in several design-adjacent roles, not just as painters."
          - q: "Can I make a stable living as a fine artist in India?"
            a: "It's possible but genuinely difficult and takes years to build a reputation and collector base — most BFA graduates who want financial stability early on combine fine art practice with teaching, illustration, design work or a gallery/curatorial role, rather than relying solely on selling original artwork."
          - q: "What is the difference between BFA and a Graphic/Fashion Design degree?"
            a: "BFA (outside its Applied Art specialisation) is primarily fine art-focused — painting, sculpture, printmaking — emphasising personal artistic expression. Graphic and Fashion Design are applied, commercially-focused disciplines aimed at solving client or brand problems. BFA's Applied Art specialisation sits closer to the design world."
          - q: "Which are the top BFA colleges in India?"
            a: "The College of Art, Delhi; Faculty of Fine Arts, MS University Baroda; Kala Bhavana at Visva-Bharati, Santiniketan; and Sir J.J. School of Art, Mumbai are among the most respected and long-established fine arts institutions in India."
          - q: "How much do BFA graduates earn in India?"
            a: "It varies enormously by path. Art teachers and illustrators have more predictable, moderate salaries, while independent fine artists' income depends heavily on gallery representation, exhibitions and collector interest — genuinely successful artists can earn very well, but this isn't guaranteed or quick to achieve."
      - note: "*Fee and salary figures are indicative, based on publicly available information as of 2026, and vary significantly by institution and career path — always verify current figures on the official institute website."
        class: "table-note mt-lg"
