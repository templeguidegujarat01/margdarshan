  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Can I become an Agriculture Officer with just a diploma?"
            a: "Generally no. Most state Agriculture Officer and similar gazetted government posts require a B.Sc Agriculture degree. A Diploma in Agriculture typically qualifies you for extension worker, technical assistant and field-level roles, which are genuinely useful entry points but sit below the Agriculture Officer level in most state recruitment structures."
          - q: "What is the difference between Diploma in Agriculture and B.Sc Agriculture?"
            a: "The diploma is typically a 2-3 year, practical, field-focused course. B.Sc Agriculture is a 4-year degree with deeper agricultural science, research exposure and access to Agriculture Officer-level and higher government/private roles. Lateral entry from diploma to B.Sc varies by state and institute rather than being uniformly standardised."
          - q: "Can I open an agri-input shop after this diploma?"
            a: "In many states, a Diploma in Agriculture is accepted as one of the qualifying routes for a seed, fertilizer or pesticide dealer license, alongside B.Sc Agriculture. Exact licensing rules and required qualifications vary by state, so confirm current requirements with your state's agriculture department before assuming eligibility."
          - q: "Is an entrance exam required for Diploma in Agriculture admission?"
            a: "It varies by state and institute. Many state agricultural polytechnics admit through their own state-level entrance exam or Class 10/12 merit; there is no single national entrance exam that every diploma college requires. Always check your target state agricultural university's or institute's current admission process."
          - q: "Can I use this diploma to start my own farming business?"
            a: "Yes, and this is one of the diploma's genuine strengths. The practical training in agronomy, soil science, horticulture and farm management directly supports running your own farm, agri-input business, or agripreneurship venture, without requiring further formal qualification."
      - note: "*Fee and salary figures are indicative, based on publicly available information as of 2026, and vary significantly by state, institute and employer — always verify current figures directly with your target institute."
        class: "table-note mt-lg"
