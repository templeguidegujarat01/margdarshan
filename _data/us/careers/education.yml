  # 1,530,500 jobs
  - slug: elementary-school-teacher
    short: "Kindergarten & Elementary Teacher"
    title: "Kindergarten or elementary school teacher: bachelor's, student teaching, state tests and certification"
    eyebrow: "Education · Teaching, Training & Facilitation"
    lede: "Public school teachers need at least a bachelor's degree, usually in elementary education, plus a state certificate or license. Every state also has an alternative route for people with a degree in another subject."
    for: "Patient, cheerful people who like young children and can explain things simply."
    soc: ["25-2012", "25-2021"]
    does: { text: "Kindergarten and elementary school teachers instruct young students in basic subjects in order to prepare them for future schooling.", source: ooh_qf_elemteach }
    work: { text: "Kindergarten and elementary school teachers work in public and private schools. They generally work during school hours when students are present and use nights and weekends to prepare lessons and grade papers. Most kindergarten and elementary school teachers do not work during the summer.", source: ooh_qf_elemteach }
    become: { text: "Kindergarten and elementary school teachers usually must have at least a bachelor’s degree. In addition, public school teachers must have a state-issued certification or license.", source: ooh_qf_elemteach }
    metrics: { pay: 63820, pay_hour: null, pay_by: "Kindergarten and elementary school teachers", jobs: 1530500, outlook: 0, outlook_words: "Little or no change", change: -6100, entry: "Bachelor's degree", training: "None", source: ooh_qf_elemteach }
    license: teaching
    exams:
      - { name: "Teacher tests", href: "us/professional-licenses/teaching/#exams" }
    routes:
      - id: education
        title: "Bachelor's in elementary education → state tests → certificate"
        tag: "Typical"
        who: "In some states, public schools also require a content-area major, such as mathematics. Private schools typically have the same degree requirement."
        steps:
          - { tag: "Start", title: "High school diploma", text: "", kind: start, source: ooh_elemteach }
          - { tag: "About 4 years", title: "Bachelor's in elementary education", text: "The teacher education program includes student teaching with a mentor teacher; states ask for a minimum grade point average.", kind: stage, source: ooh_elemteach }
          - { tag: "Exam", title: "General teaching test + subject test", text: "Which tests depends on the state.", kind: exam, source: ooh_elemteach, href: "us/professional-licenses/teaching/#exams", link: "Teacher tests" }
          - { tag: "License", title: "State certificate or license for the grade level", text: "Including a background check.", kind: licence, source: ooh_elemteach, href: "us/professional-licenses/teaching/", link: "Certification steps" }
          - { tag: "Goal", title: "Kindergarten or elementary teacher", text: "Professional development keeps the license; some states require a master's after you are certified and hired.", kind: goal, source: ooh_elemteach }
      - id: alternative
        title: "Degree in another subject → alternative certification"
        tag: "Every state"
        who: "All states offer an alternative route for people who already have a bachelor's degree but lack the education courses."
        steps:
          - { tag: "Start", title: "Bachelor's in any subject", text: "", kind: start, source: ooh_elemteach }
          - { tag: "Program", title: "Alternative certification program", text: "Some let you start teaching right away under an experienced teacher; others require education classes first. Teaching methods and child development.", kind: stage, source: ooh_elemteach }
          - { tag: "License", title: "Full certification after the program", text: "", kind: licence, source: ooh_elemteach, href: "us/professional-licenses/teaching/", link: "Certification steps" }
          - { tag: "Goal", title: "Elementary teacher", text: "", kind: goal, source: ooh_elemteach }
    states_note: "All states require public school teachers to be licensed or certified for the grade level they teach; private school teachers typically do not need a license. What five state education departments publish:"
    states_source: ooh_elemteach
    states_from: teaching

  # 1,378,200 jobs
  - slug: postsecondary-teacher
    short: "Professor & Postsecondary Teacher"
    title: "Professor or postsecondary teacher: Ph.D. route, master's for community colleges"
    eyebrow: "Education · Teaching, Training & Facilitation"
    lede: "Four-year colleges and universities typically hire professors with a Ph.D. in their field; a master's may be enough at some community colleges, and some fields value work experience instead."
    for: "People who love one subject deeply, enjoy research and want to teach adults."
    soc: ["25-1011", "25-1021", "25-1022", "25-1031", "25-1032", "25-1041", "25-1042", "25-1043", "25-1051", "25-1052", "25-1053", "25-1054", "25-1061", "25-1062", "25-1063", "25-1064", "25-1065", "25-1066", "25-1067", "25-1069", "25-1071", "25-1072", "25-1081", "25-1082", "25-1111", "25-1112", "25-1113", "25-1121", "25-1122", "25-1123", "25-1124", "25-1125", "25-1126", "25-1192", "25-1193"]
    does: { text: "Postsecondary teachers instruct students in a variety of academic subjects beyond the high school level.", source: ooh_qf_postsec }
    work: { text: "Most postsecondary teachers work in public and private colleges and universities, professional schools, and junior or community colleges. Most work full time, although part-time work is common.", source: ooh_qf_postsec }
    become: { text: "Educational requirements vary by subject and the type of educational institution. Typically, postsecondary teachers must have a Ph.D. However, a master's degree may be enough for some postsecondary teachers at community colleges, and others may need work experience in their field of expertise.", source: ooh_qf_postsec }
    metrics: { pay: 85330, pay_hour: null, pay_by: "Postsecondary teachers", jobs: 1378200, outlook: 7, outlook_words: "Much faster than average", change: 98200, entry: "Ph.D. for most 4-year colleges; a master's at some community colleges", experience: "Teaching or field experience preferred by some institutions", training: "None", source: ooh_qf_postsec }
    license_text: "None (a field license in some subjects)"
    routes:
      - id: phd
        title: "Bachelor's → Ph.D. → (post-doc) → assistant professor → tenure"
        tag: "4-year colleges"
        who: "Postsecondary teachers at 4-year colleges and universities typically need a Ph.D. or other doctorate in their field."
        steps:
          - { tag: "Start", title: "Bachelor's (or master's) degree", text: "", kind: start, source: ooh_postsec }
          - { tag: "Several years", title: "Ph.D. with a dissertation", text: "Original research defended before experts; many students teach classes as graduate teaching assistants.", kind: stage, source: ooh_postsec }
          - { tag: "2 to 3 years", title: "Post-doc, in some fields", text: "Common in biological science, physics and chemistry.", kind: stage, source: ooh_postsec }
          - { tag: "Up to 7 years", title: "Assistant professor → associate professor", text: "Tenure is decided on research, teaching and contribution to the institution.", kind: stage, source: ooh_postsec }
          - { tag: "Goal", title: "Professor with tenure", text: "Some go on to dean or president.", kind: goal, source: ooh_postsec }
      - id: masters
        title: "Master's → community college teaching"
        tag: "Some colleges"
        who: "Community colleges may hire those with a master's degree, though some prefer a Ph.D."
        steps:
          - { tag: "Start", title: "Bachelor's degree", text: "", kind: start, source: ooh_postsec }
          - { tag: "1 to 2 years", title: "Master's in the subject", text: "", kind: stage, source: ooh_postsec }
          - { tag: "Goal", title: "Community college instructor", text: "", kind: goal, source: ooh_postsec }
      - id: field
        title: "Work in the field → teach it"
        tag: "Health, art, law, education"
        who: "In some fields hands-on work experience is especially important, and a teacher may need the same license as the job, for example a nursing license to teach nursing."
        steps:
          - { tag: "Start", title: "Degree and license in the field", text: "", kind: start, source: ooh_postsec }
          - { tag: "Years", title: "Work in the occupation", text: "", kind: stage, source: ooh_postsec }
          - { tag: "Goal", title: "Postsecondary teacher, full or part time", text: "", kind: goal, source: ooh_postsec }

