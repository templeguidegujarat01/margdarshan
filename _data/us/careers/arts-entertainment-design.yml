# Arts, Entertainment, & Design careers (USA Master Plan Phase 8). Schema: comment at the top of _includes/us-career-overview.html.
# Every fact is copied from the page its `source` names, opened 2026-10-21: BLS Occupational Outlook Handbook (pay May
# 2025, jobs 2025, outlook 2025–35; pages last modified 27 Aug or 14 Sep 2026), the DOL RAPIDS spreadsheet, CIDQ,
# eCFR, and the schools' own admission pages named below (_data/us/sources.yml).
# Portfolio and audition admission: only what a school publishes for itself is shown (`states` rows renamed
# "What schools publish"); no general rule is invented. BLS publishes ONLY an hourly median for actors, musicians and
# dancers, so their `pay` is null and the pages show the hourly figure.
# UX / digital interface designers share one BLS profile with web developers: see web-developer in digital-technology.yml.
# Architects have their page in Construction (crosswalk: Construction only); this hub links it from its credentials table.
# Batch notes: docs/us-edition/PHASE-8-ARTS-HOSPITALITY.md.
checked: 2026-10-21
