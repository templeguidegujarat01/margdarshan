  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Can I call myself an architect with just this diploma?"
            a: "No. Only professionals registered with the Council of Architecture (CoA), which requires a CoA-recognised B.Arch degree, can legally use the title \"Architect\" and sign off on building plans in India. This diploma qualifies you for architectural assistant and drafting support roles, not the licensed architect designation."
          - q: "Can I become a licensed architect after starting with this diploma?"
            a: "You would generally need to pursue a full 5-year B.Arch degree from a Council of Architecture-recognised institution afterward to become a licensed architect — this diploma itself doesn't automatically convert into that qualification through lateral entry the way engineering diplomas typically do."
          - q: "What is the difference between this diploma and Diploma in Interior Design?"
            a: "Diploma in Architecture covers building design and construction assistance broadly, including exterior structure. Diploma in Interior Design focuses specifically on interior spaces, materials and finishes within an existing structure. They overlap in drafting and design software skills but serve genuinely different purposes."
          - q: "What software should I learn alongside this diploma?"
            a: "AutoCAD is the baseline expectation for architectural drafting, and increasingly, SketchUp and Revit (for Building Information Modelling/BIM) are valued additions that strengthen job prospects for architectural assistant and drafting roles."
          - q: "What jobs can I get with just this diploma, without a further degree?"
            a: "Common roles include architectural draughtsman, architectural assistant, and CAD technician, working under licensed architects at architecture firms, construction companies and real estate developers."
      - note: "*Fee and salary figures are indicative, based on publicly available information as of 2026, and vary significantly by state, institute and employer — always verify current figures directly with your target institute, and confirm current Council of Architecture regulations on the official CoA website."
        class: "table-note mt-lg"
