# investment-banking — UK career data sheet, read by _includes/uk-career.html (page: uk/careers/investment-banking/).
# Rules: see the header of _data/uk/careers/law.yml (checked by scripts/check-uk-data.mjs).
# The National Careers Service has no "investment banker" profile; its closest profile is investment analyst
# (which names investment banks as employers), so every fact here comes from that profile and the FCA.
slug: investment-banking
title: "Investment banking and investment analysis"
eyebrow: "UK · Finance · Investment"
lede: "You can start as a <strong>graduate trainee</strong> at an investment bank or stockbroking firm, usually after a <strong>2:1 degree</strong>. Trainees must pass an <strong>exam recognised by the FCA</strong>, which regulates the firms and holds their staff to account."
checked: 2026-10-23
us_pathway: investment-banking
licensure_body: { short: "FCA", name: "Financial Conduct Authority", note: "Regulates firms and the people in them", source: fca_smcr }
pay:
  - { soc: "2422", label: "Finance and investment analysts and advisers" }
ncs:
  - { label: "Investment analyst", starter: 28000, experienced: 75000, source: ncs_investment_analyst }
school:
  - { k: "GCSEs", v: "<strong>4 or 5 GCSEs at grades 9 to 4</strong>, including English and maths.", source: ncs_investment_analyst }
  - { k: "A levels", v: "<strong>2 to 3 A levels</strong>, or equivalent, for a degree.", source: ncs_investment_analyst }
  - { k: "UCAS points", v: "An <strong>A* = 56 points</strong>. Many courses ask for grades instead of points.", source: ucas_tariff }
tracks:
  - id: graduate
    title: "Graduate trainee"
    tag: "FCA"
    who: "Any degree subject can work; economics, maths, business, accountancy and finance help."
    steps:
      - { tag: "School", title: "GCSEs + 2 to 3 A levels", text: "", kind: stage, source: ncs_investment_analyst }
      - { tag: "Degree", title: "Degree at 2:1 or higher", text: "A placement year or summer internship gives you an advantage.", kind: stage, source: ncs_investment_analyst }
      - { tag: "Job", title: "Graduate trainee at an investment bank or stockbroking firm", text: "", kind: stage, source: ncs_investment_analyst }
      - { tag: "Exam", title: "An FCA-recognised exam", text: "For example the Investment Management Certificate (CFA Society UK) or the Investment Advice Diploma (CISI).", kind: gate, source: ncs_investment_analyst }
      - { tag: "Goal", title: "Investment analyst or banker", text: "Your firm must be able to show who does what and hold you to the FCA Conduct Rules.", kind: license, source: fca_smcr }
  - id: apprenticeship
    title: "Apprenticeship"
    tag: "Level 4 / 7"
    who: "With a bank, regulator or investment company."
    steps:
      - { tag: "Level 4", title: "Investment Operations Specialist Higher Apprenticeship", text: "Up to 2 years, with professional exams.", kind: stage, source: ncs_investment_analyst }
      - { tag: "Level 7", title: "Senior Investment and Commercial Banking Professional", text: "For people with more experience; equal to a postgraduate award.", kind: stage, source: ncs_investment_analyst }
      - { tag: "Goal", title: "Professional body membership", text: "You can apply at the end of the apprenticeship.", kind: license, source: ncs_investment_analyst }
    facts:
      - { k: "Degree not in finance?", v: "A postgraduate qualification like an <strong>MBA</strong> can help.", source: ncs_investment_analyst }
