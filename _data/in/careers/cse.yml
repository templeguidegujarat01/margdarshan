  - id: "fees"
    hid: "fees-heading"
    eyebrow: "Wide range by college type"
    heading: "Fees & scholarships"
    parts:
      - prose:
          - "Government-funded institutes are by far the most economical route: total fees for the full 4-year CSE programme at IITs and NITs commonly fall in the <strong>₹2-12 lakh</strong> range, with fee waivers and remissions available based on family income and category. Private colleges are considerably more expensive — <strong>₹5-20 lakh</strong> total is typical, and premium private institutes can exceed ₹20 lakh for the full course. Merit-based scholarships, need-based financial aid, and category-based fee concessions are available at most institutes; always check your target college's current fee structure and scholarship policy directly, since these are revised periodically."
  - id: "salary"
