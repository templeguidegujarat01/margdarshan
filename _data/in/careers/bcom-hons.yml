  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What is B.Com Honours?"
    parts:
      - overview:
          points:
            - "B.Com Honours (often written B.Com (H)) is a 3-year undergraduate degree that covers the same broad territory as regular B.Com — accounting, finance, taxation, economics and business law — but goes noticeably deeper into the core commerce subjects, with fewer general-studies electives diluting the syllabus."
            - "At universities that offer both, B.Com Honours is consistently the more competitive, more sought-after option, especially at large central universities like Delhi University."
            - "It is not a separate professional qualification like Chartered Accountant (CA) or CS — it's still a conventional university degree, assessed through regular semester exams, just with a narrower and more intensive focus than the standard \"Programme\" version of B.Com."
