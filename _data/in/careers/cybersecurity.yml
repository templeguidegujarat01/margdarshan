  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Do I need an engineering degree for a cyber security career?"
            a: "No, not necessarily. A B.Tech in Cyber Security is one valid route, but many entry-level SOC (Security Operations Centre) and security analyst roles accept graduates from any stream — BCA, B.Sc, even Commerce or Arts — provided they hold a recognised certification like CompTIA Security+ or CEH. The certification and demonstrated hands-on skill often matter more to employers than the specific degree."
          - q: "Which certification should I get first — CEH or CompTIA Security+?"
            a: "CompTIA Security+ is generally recommended as the foundational first certification, since it requires no prior experience and takes roughly 2-4 months to prepare for. CEH is the natural next step, especially if you're aiming at ethical hacking, penetration testing or government/defence contract roles, which often specifically ask for it."
          - q: "What is a realistic cyber security fresher salary in India?"
            a: "It depends heavily on certifications. A fresher with just a degree and no certification commonly starts around ₹3.5-5 LPA. The same graduate with a certification like CEH or CompTIA Security+ is reported to start noticeably higher, often ₹6-10 LPA, since certifications are treated as concrete proof of practical skill by employers."
          - q: "Is ethical hacking or penetration testing a good career path?"
            a: "Yes, and it's reported as one of the highest-paying tracks within cyber security, with junior penetration testers earning roughly ₹7-15 LPA and senior/lead pentesters at top consultancies going considerably higher. It's also described as the most technically demanding entry point, typically requiring serious self-study through platforms like TryHackMe and HackTheBox, CTF (Capture The Flag) participation, and eventually the OSCP certification."
          - q: "Is the cyber security talent gap in India actually real?"
            a: "Yes. NASSCOM estimates India needs approximately 1.5 million cybersecurity professionals against roughly 80,000 currently qualified — a substantial, well-documented skills gap rather than a marketing claim. This is a meaningful part of why cyber security is considered a genuinely strong long-term career choice, not just a trending keyword."
      - note: "Figures are indicative (2026) — confirm on the official college or authority website."
        class: "table-note mt-lg"
