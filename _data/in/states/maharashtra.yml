      - { id: pc-rules, name: "Maharashtra Police Constables (Recruitment) Rules, 2011 (Marathi gazette, 16 Jun 2011)", url: "https://policerecruitment2025.mahait.org/PDF/16-6-2011_PC_RECT_RULE.pdf", covers: "age, HSC qualification, height and chest, Naxal-area relaxations", checked: 2026-10-14 }
      - { id: pc-2018, name: "Maharashtra Police Constables (Recruitment) (Amendment) Rules, 2018 (Home Department order, 23 Mar 2018)", url: "https://policerecruitment2025.mahait.org/PDF/%E0%A4%AE%E0%A4%B9%E0%A4%BE%E0%A4%B0%E0%A4%BE%E0%A4%B7%E0%A5%8D%E0%A4%9F%E0%A5%8D%E0%A4%B0%20%E0%A4%AA%E0%A5%8B%E0%A4%B2%E0%A5%80%E0%A4%B8%20%E0%A4%B6%E0%A4%BF%E0%A4%AA%E0%A4%BE%E0%A4%88%20(%E0%A4%B8%E0%A5%87%E0%A4%B5%E0%A4%BE%E0%A4%AA%E0%A5%8D%E0%A4%B0%E0%A4%B5%E0%A5%87%E0%A4%B6)%20(2%20%E0%A4%B0%E0%A5%80%20%E0%A4%B8%E0%A5%81%E0%A4%A7%E0%A4%BE%E0%A4%B0%E0%A4%A3%E0%A4%BE)%E0%A4%A8%E0%A4%BF%E0%A4%AF%E0%A4%AE%202018.pdf", covers: "Gadchiroli residence rule and Gondi/Madia language test", checked: 2026-10-14 }
      - { id: pc-2022, name: "Maharashtra Police Constables (Recruitment) (First Amendment) Rules, 2022 (gazette, 23 Jun 2022)", url: "https://policerecruitment2025.mahait.org/PDF/%E0%A4%AE%E0%A4%B9%E0%A4%BE%E0%A4%B0%E0%A4%BE%E0%A4%B7%E0%A5%8D%E0%A4%9F%E0%A5%8D%E0%A4%B0%20%E0%A4%AA%E0%A5%8B%E0%A4%B2%E0%A5%80%E0%A4%B8%20%E0%A4%B6%E0%A4%BF%E0%A4%AA%E0%A4%BE%E0%A4%88%20(%E0%A4%B8%E0%A5%87%E0%A4%B5%E0%A4%BE%E0%A4%AA%E0%A5%8D%E0%A4%B0%E0%A4%B5%E0%A5%87%E0%A4%B6)(%E0%A4%AA%E0%A4%B9%E0%A4%BF%E0%A4%B2%E0%A5%80%20%E0%A4%B8%E0%A5%81%E0%A4%A7%E0%A4%BE%E0%A4%B0%E0%A4%A3%E0%A4%BE)%20%E0%A4%A8%E0%A4%BF%E0%A4%AF%E0%A4%AE%202022.pdf", covers: "physical test events and marks, written test, 1:10 call ratio, 40% minimum, merit", checked: 2026-10-14 }
