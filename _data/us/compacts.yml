# Licenses without a published state-by-state list we could read reliably: link the official source only.
links_only:
  psychology:
    name: "PSYPACT (Psychology Interjurisdictional Compact)"
    what: "An interstate compact for psychologists. Margdarshan does not copy its list of participating states, so check the current list on PSYPACT's own site."
    source: psypact_map
  cpa:
    name: "CPA mobility and licensure pathways"
    what: "Education and experience rules, and which states accept the 120-credit + 2-years pathway, differ by state board. NASBA tracks the rules for every board."
    source: nasba_pathways
  pe:
    name: "PE licensure by state board"
    what: "Each state engineering board sets its own application rules; NCEES links every board and offers a Records program for sending your verified exam and experience records to other boards."
    source: ncees_pe
