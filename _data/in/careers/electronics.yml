          - label: "Core ECE — embedded, telecom"
            value: "₹3–10 LPA"
            text: "Reported range for embedded systems, RF and telecom engineering roles."
          - label: "VLSI/semiconductor (Tier-1 companies)"
            value: "₹15–30 LPA"
            text: "Reported for skilled freshers at Intel, Qualcomm and similar Tier-1 semiconductor firms — a competitive, specialised outcome, not typical."
  - id: "jobs"
