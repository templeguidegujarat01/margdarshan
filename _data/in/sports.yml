    sections:
      - id: rules
        nav: "Scoring &amp; rules"
        eyebrow: "Core rules &amp; selection formats"
        heading: "The new scoring, the court and the racket"
        parts:
          - table:
              caption: "Laws of Badminton — scoring before and after 4 January 2027"
              head: ["Rule", "Until 3 Jan 2027", "<strong>From 4 Jan 2027</strong>"]
              rows:
                - ["Match", "Best of three games", "Best of three games"]
                - ["Game won at", "21 points", "<strong>15 points</strong>"]
                - ["Deuce", "At 20-all, two clear points", "At <strong>14-all</strong>, two clear points"]
                - ["Cap", "At 29-all, the 30th point wins", "At <strong>20-all, the 21st point wins</strong>"]
                - ["Mid-game interval (max 60 s)", "When the leader reaches 11", "When the leader reaches <strong>8</strong>"]
                - ["Ends change in game 3", "At 11", "At <strong>8</strong>"]
            source: "bwf-laws25,bwf-laws27"
          - note: "India switched early: by BAI's circular of <strong>30 June 2026</strong>, all main-draw and qualifying matches at BAI events are played as <strong>best of three games of 15 points</strong>, extendable to 21."
            source: bai-interstate
          - list:
              - "Up to <strong>120 seconds</strong> between games."
              - "The net top is <strong>1.524 m</strong> at the centre and 1.55 m over the doubles side lines."
              - "On serve, the whole shuttle must be <strong>below 1.15 m</strong> from the court surface when struck."
              - "A feathered shuttle has <strong>16 feathers</strong> and weighs <strong>4.74–5.50 g</strong>."
              - "The racket frame may be at most <strong>680 mm long and 230 mm wide</strong>."
            source: bwf-laws27
          - list:
              - "BWF junior events are <strong>Under 19</strong>: a player must remain under 19 throughout the calendar year of the tournament."
            source: bwf-junior
      - id: recognition
        nav: "Tour &amp; ranking"
        eyebrow: "Institutional &amp; global recognition"
        heading: "World Tour levels, ranking points and India's big events"
        parts:
