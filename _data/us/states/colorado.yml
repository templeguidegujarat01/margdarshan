# Colorado (USA 50-state licensure portal, 2026-10-22). Schema: _data/us/state_index.yml. Boards tier: the
# licensing boards for lawyers, physicians, CPAs and nurses, copied from the national directories of state boards (NCBE,
# FSMB, NASBA, NCSBN). Diploma, state test, tuition, aid, jobs and apprenticeship blocks are still in the Phase 11 queue;
# the page prints only the blocks that exist.
name: "Colorado"
abbr: CO
checked: 2026-10-22
review_by: 2027-04-22
lede: "In Colorado, the Colorado Supreme Court, Office of Attorney Admissions handles bar admission for lawyers, the Colorado Medical Board licenses physicians, the Colorado State Board of Accountancy licenses CPAs and the Colorado Board of Nursing licenses registered nurses."

boards:
  # 50-state portal (2026-10-22): bar admission agency (NCBE jurisdiction page), medical board(s) (FSMB directory),
  # board of accountancy (NASBA directory), board of nursing (NCSBN member page). Links checked 2026-10-22.
  law: { body: "Colorado Supreme Court, Office of Attorney Admissions", url: "https://coloradolegalregulation.com", stat: "UBE", exam: "Uniform Bar Exam (MBE, MEE and MPT).", note: "MPRE required (passing score 85). NextGen UBE from July 2028.", src: ncbe_co }
  medicine:
    src: fsmb_boards
    boards:
      - { body: "Colorado Medical Board", url: "https://dpo.colorado.gov/Medical" }
  cpa:
    src: nasba_boards
    boards:
      - { body: "Colorado State Board of Accountancy", url: "https://dpo.colorado.gov/Accountancy" }
  nursing:
    src: ncsbn_co
    boards:
      - { body: "Colorado Board of Nursing", url: "https://dpo.colorado.gov/Nursing" }
