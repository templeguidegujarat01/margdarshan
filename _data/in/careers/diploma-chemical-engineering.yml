  - id: "faq"
    hid: "faq-heading"
    alt: true
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Is safety training a significant part of this diploma?"
            a: "Yes, genuinely so. Chemical plants handle hazardous materials and high-pressure/temperature processes, so industrial safety, hazard identification and emergency response procedures form a real, important part of the curriculum and workplace practice."
          - q: "Can I join B.Tech Chemical Engineering after this diploma?"
            a: "Yes. Diploma holders can use lateral entry to join the second year of a B.Tech Chemical Engineering programme directly, through a state lateral entry exam or quota, skipping the first year entirely."
          - q: "What industries hire Diploma in Chemical Engineering graduates?"
            a: "Petrochemical and refinery companies, fertiliser plants, pharmaceutical manufacturing, paint and dye industries, and food processing companies are among the main employers, given India's substantial chemical and process manufacturing sector."
          - q: "Is this diploma physically demanding or dangerous?"
            a: "Working in chemical plants does involve genuine safety considerations — handling chemicals, operating under specific temperature/pressure conditions — but with proper training and safety protocols, which are a core, mandatory part of the field, risks are actively managed as standard practice."
          - q: "What jobs can I get with just this diploma, without a further degree?"
            a: "Common roles include plant operator, process technician, quality control technician, and production supervisor at chemical, petrochemical, pharmaceutical and food processing plants — genuine, established career options directly after the diploma."
      - note: "*Fee and salary figures are indicative, based on publicly available information as of 2026, and vary significantly by state, institute and employer — always verify current figures on your state technical education board's official website."
