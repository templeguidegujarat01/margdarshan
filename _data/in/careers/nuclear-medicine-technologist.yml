      value: "B.Sc Nuclear Medicine Technology"
    - label: "Radiation regulator"
      value: "AERB"
      source: "aerb"
    - label: "Profession law"
      value: "NCAHP Act, 2021"
      source: "ncahp"
    - label: "Work in"
      value: "PET-CT & nuclear medicine units"
