          - title: "MA/M.Sc Psychology (2 years)"
            text: "Deeper specialisation, often with a clinical or counselling elective."
          - title: "M.Phil Clinical Psychology (2 years)"
            text: "RCI-recognised, extremely competitive, includes supervised clinical training."
          - title: "RCI registration & practice"
