            text: "Many states conduct their own polytechnic entrance exam; names, patterns and cut-offs differ by state and year, so always check your state technical education board's current notification."
          - label: "Merit-based admission"
            text: "Several states instead admit directly based on Class 10 marks, without a separate entrance test."
          - label: "Government vs private institutes"
            text: "Government polytechnics are typically more affordable and often well-regarded for placements; private institutes offer more seats but usually cost more — always check AICTE/state board approval before enrolling."
          - label: "Typical process"
            text: "Register for your state's process → appear for the entrance exam (if applicable) → counselling/seat allotment based on rank or merit → document verification and fee payment."
  - id: "fees"
    hid: "fees-heading"
    eyebrow: "Very affordable at government polytechnics"
    heading: "Fees & scholarships"
    parts:
      - prose:
          - "Government polytechnic fees for the full 3-year diploma are typically in the range of <strong>₹15,000-60,000</strong>, making it one of the most affordable technical qualifications in India. Private polytechnic institutes charge considerably more, often ₹60,000-1.5 lakh per year. Merit-based, SC/ST and income-linked scholarships are available at most government institutions. Always confirm current fees directly on your target institute's official admission page."
