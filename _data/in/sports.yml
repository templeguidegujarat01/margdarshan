              head: ["Discipline", "Races (men and women)", "In simple words"]
              rows:
                - ["<strong>Road</strong>", "Road race · individual time trial", "Mass-start race over a long road course; or alone against the clock (time trial, max 35 riders)"]
                - ["<strong>Track</strong> (velodrome)", "Sprint · keirin · team sprint", "Short, explosive races: sprint and keirin (up to 2 riders per country each) and team sprint (teams of 3)"]
                - ["<strong>Track</strong> (velodrome)", "Team pursuit · Madison · omnium", "Endurance races: team pursuit (teams of 4), Madison (teams of 2) and omnium (1 rider per country)"]
                - ["<strong>Mountain bike</strong>", "Cross-country Olympic (XCO)", "Laps of an off-road course with climbs and rough descents"]
                - ["<strong>BMX</strong>", "BMX racing · BMX freestyle park", "Gate start and jumps on a short dirt track; or tricks in a park scored by judges"]
            source: "uci-la28,uci-track28,la28-oly"
          - list:
              - "A <strong>rigid safety helmet</strong> is compulsory in competition and official training."
              - "A racing bicycle may not weigh less than <strong>6.8 kg</strong>."
              - "Riders at international events need a <strong>UCI licence</strong> issued through their national federation."
            source: uci-p1
          - table:
              caption: "UCI age categories (age = competition year minus birth year)"
              head: ["Category", "Age"]
              rows:
                - ["Youth", "16 or under — run by national federations"]
                - ["Junior", "<strong>17 and 18</strong>"]
                - ["Under 23", "<strong>19 to 22</strong>"]
                - ["Elite", "23 and above (BMX and trials have their own rules)"]
                - ["Masters (women)", "30 and above, by choice"]
            source: uci-p1
      - id: recognition
        nav: "Recognition"
        eyebrow: "Institutional &amp; global recognition"
        heading: "Olympics, Commonwealth Games, Asian Games — and the cash that follows"
        parts:
          - table:
              caption: "LA28 Olympic cycling places"
              head: ["Discipline", "Places"]
              rows:
                - ["Road (road race + time trial)", "<strong>180</strong> (90 per gender)"]
                - ["Track (12 events)", "<strong>190</strong> (95 per gender); up to 8 riders per country per gender"]
                - ["Mountain bike", "<strong>72</strong> (36 per gender)"]
                - ["BMX racing", "<strong>48</strong> (24 per gender)"]
                - ["BMX freestyle", "24 (12 per gender)"]
            source: "uci-la28,uci-track28,la28-oly"
          - list:
              - "LA28 runs <strong>14–30 July 2028</strong>. Places are mainly won through <strong>UCI points</strong> collected over the qualification period, by nation and by rider."
              - "Track cycling is one of the 10 sports at the <strong>Glasgow 2026 Commonwealth Games</strong> (with para track cycling); road, track, MTB and BMX are all in the <strong>2026 Asian Games</strong>."
            source: "uci-la28,cwg26,ag26"
          - table:
              caption: "Government cash award for a senior medal (₹ lakh)"
              head: ["Event", "Gold", "Silver", "Bronze"]
              rows:
                - ["<strong>Olympic Games</strong>", "75", "50", "30"]
                - ["Asian Games / Commonwealth Games", "30", "20", "10"]
                - ["Senior/Elite World Championship (every year)", "10", "7", "4"]
                - ["Senior Asian Championship (every year)", "3.75", "2.5", "1.25"]
            source: myas-cash
          - note: "UCI Para-cycling World and Asian Championships are also on the Ministry's list."
            source: myas-cash
      - id: eligibility
        nav: "Ages &amp; testing"
        eyebrow: "Physical benchmarks &amp; anti-doping"
        heading: "Age rules, licences and anti-doping"
        parts:
          - list:
              - "Juniors (17–18) race their own international events; at 19 you move to Under 23 or Elite. In BMX racing and freestyle, trials, indoor and para-cycling, riders of 16 or younger may also race international events."
              - "Every rider needs a <strong>licence</strong> to race."
            source: uci-p1
          - list:
              - "Under the anti-doping code you must be <strong>available for testing</strong> and check every medicine against the <strong>Prohibited List</strong>; apply to NADA for a <strong>TUE</strong> if you need a banned medicine."
            source: nada-rr
          - list:
              - "<strong>Supplements</strong>: no supplement is 100% safe and <strong>strict liability</strong> applies — food first, with a certified nutritionist."
            source: nada-supp
      - id: roadmap
        nav: "Roadmap"
        eyebrow: "Grassroots-to-elite residential pipeline"
        heading: "From the district race to the national camp"
        parts:
          - table:
              caption: "The cycling ladder"
              head: ["Step", "Age", "What happens"]
              rows:
                - ["1. Club &amp; district races", "Youth (16 or under)", "Learn bike handling and race craft; your national federation runs youth categories"]
                - ["2. SAI Training Centre", "12–18", "Up to 8th at Sub-Junior/Junior Nationals, or top 3 in the state, then a battery of tests"]
                - ["3. Khelo India Youth Games", "Under 18", "Cycling is one of the 27 KIYG sports (2025 track events were held at the IG Stadium velodrome, Delhi)"]
                - ["4. National championships", "Junior 17–18 and up", "Railways treat the National Cycling Championship (all age groups) as the junior national"]
                - ["5. SAI NCOE / national camp", "Scouted", "Residential training with track, road and sports science"]
                - ["6. UCI races abroad", "U23 · Elite", "UCI points races build the ranking that decides Asian Games and LA28 places"]
            source: "uci-p1,sai-schemes,kiyg25,rrc-wr26,uci-la28"
      - id: academies
        nav: "Centres"
        eyebrow: "Top elite academies &amp; cities"
        heading: "Where India's cyclists train"
        parts:
          - table:
              caption: "SAI National Centres of Excellence with cycling"
              head: ["Centre", "Other sports there"]
              rows:
                - ["<strong>IG Stadium, New Delhi</strong> (velodrome)", "Gymnastics"]
                - ["<strong>Patiala</strong>, Punjab (NSNIS)", "Athletics, fencing, hockey, judo, weightlifting"]
                - ["<strong>Thiruvananthapuram</strong>, Kerala", "Athletics, football, taekwondo, volleyball"]
                - ["<strong>Guwahati</strong>, Assam", "Archery, athletics, boxing, fencing, football, taekwondo"]
                - ["<strong>Imphal</strong>, Manipur", "Archery, athletics, fencing, football, hockey, judo, weightlifting, wushu"]
            source: sai-schemes
          - note: "Cycling is one of SAI's <strong>13 priority sports</strong> and is taught at SAI Training Centres (ages 12–18)."
            source: sai-schemes
      - id: costs
        nav: "Bikes &amp; cost"
        eyebrow: "Equipment costs &amp; who pays"
        heading: "Bikes, travel and who pays the bills"
        parts:
          - list:
              - "Each discipline needs its own machine — a road bike, a fixed-gear track bike, a mountain bike or a BMX — plus helmet, shoes and spares. Bikes must meet UCI technical rules (including the 6.8 kg minimum) at UCI events. Education Margdarshan does not print shop prices — no governing body publishes them."
            source: uci-p1
          - table:
              caption: "Who pays — cycling ladder"
              head: ["Stage", "Paid by", "What you get"]
              rows:
                - ["SAI centre trainee", "Sports Authority of India", "Coaching, boarding, sports science, diet"]
                - ["Khelo India athlete", "Ministry of Youth Affairs &amp; Sports", "<strong>₹6.28 lakh a year</strong> incl. ₹1.20 lakh cash"]
                - ["Junior medal prospect", "TOPS Development Group", "₹25,000 a month"]
                - ["Olympic prospect", "TOPS Core Group", "<strong>₹50,000 a month</strong> + approved training plan"]
                - ["Athlete in hardship", "PDU National Welfare Fund", "Up to ₹2.50 lakh"]
            source: "sai-schemes,pib-support"
      - id: earnings
        nav: "Earnings &amp; jobs"
        eyebrow: "Earning channels &amp; central job quotas"
        heading: "Railways and other sports-quota jobs"
        parts:
          - list:
              - "<strong>Western Railway's 2026-27 sports quota</strong> had <strong>Level 1</strong> cycling posts for men in the <strong>individual time trial, criterium race and individual road race</strong>."
            source: rrc-wr26
          - list:
              - "Cycling is one of the <strong>65 sports</strong> in the central sports quota for <strong>Group C</strong> posts, with up to 5 years' age relaxation (10 for SC/ST); cycle polo is listed separately."
              - "Medals at the Olympics, Asian Games, Commonwealth Games or World Championships can bring up to <strong>three out-of-turn promotions</strong>."
            source: dopt-2022
          - list:
              - "<strong>Pension to Meritorious Sportspersons</strong>: ₹12,000–20,000 a month after retirement."
            source: pib-support
      - id: traps
        nav: "Red flags"
        eyebrow: "Disqualification traps"
        heading: "Mistakes that end a cyclist's race"
        parts:
          - list:
              - "<strong>Riding without a rigid helmet</strong> in a race or official training."
              - "<strong>An under-weight or non-compliant bike</strong> at a UCI event."
              - "<strong>Racing without a valid licence</strong>."
            source: uci-p1
          - list:
              - "<strong>Unchecked supplements or medicines</strong> — strict liability applies."
            source: nada-supp
      - id: doubts
        nav: "Player doubts"
        eyebrow: "Real-world player doubts"
        heading: "Which discipline, late start, jobs and money — straight answers"
        parts:
          - qa:
              q: "Track, road, mountain bike or BMX — which should I choose?"
              a: "Short, explosive riders suit <strong>track sprint, keirin and team sprint</strong>; riders with stamina suit the <strong>road</strong> and track endurance races (team pursuit, Madison, omnium); bike-handling skill suits <strong>mountain bike and BMX</strong>. All four are Olympic and Asian Games disciplines."
            source: "uci-la28,ag26"
          - qa:
              q: "I am 18 or 20. Is it too late to start cycling?"
              a: "Not for competing: Under 23 runs to 22 and Elite has no upper limit. It is late for the free pipelines — SAI Training Centres take ages <strong>12–18</strong> — so a late starter rides at a club and must post national results. The real clock is the job deadline: Railways sports quota stops at <strong>25</strong> and CRPF at <strong>23</strong> (28 for an unreserved sportsperson after relaxation)."
            source: "uci-p1,sai-schemes,rrc-wr26,crpf26"
          - qa:
              q: "Which government jobs can cycling get me?"
              a: "<strong>Western Railway's 2026-27 notice</strong> had Level 1 men's road cycling posts (time trial, criterium, road race). DoPT lists cycling for central <strong>Group C</strong> posts. CRPF's 2026 sports quota had <strong>no cycling posts</strong> — each recruiter advertises only the sports its teams need."
            source: "rrc-wr26,dopt-2022,crpf26"
          - table:
              caption: "Sports-quota job routes open in 2026 — age, qualifying results, pay"
              head: ["Route", "Age", "Main qualifying results", "Pay level"]
              rows:
                - ["Railways <strong>Level 5/4</strong> (graduates)", "18–25 on 1 Jan 2027", "Played the <strong>Olympics</strong>, or top 3 at a World Cup, World Championship, Asian Games, Commonwealth Games or Youth Olympics", "Level 5/4"]
                - ["Railways <strong>Level 3/2</strong> (12th, or 10th + apprenticeship)", "18–25 on 1 Jan 2027", "Top 3 at <strong>Senior, Youth or Junior Nationals</strong>, National Games or All India Inter-University; or Federation Cup gold", "Level 3/2"]
                - ["Railways <strong>Level 1</strong>", "18–25 on 1 Jan 2027", "Played for your state and finished <strong>at least 8th at Senior Nationals</strong>; or top 3 at the Federation Cup", "Level 1"]
                - ["CRPF <strong>Head Constable (GD)</strong> (10+2)", "18–23 on 1 Aug 2026; sportspersons get <strong>+5 years</strong> (OBC +8, SC/ST +10)", "Played for India; or top 3 for your state at Nationals or National Games; or <strong>gold/silver at Junior Nationals</strong>", "Level 4 · ₹25,500–81,100"]
                - ["CRPF <strong>Constable (GD)</strong> (10th pass)", "18–23 on 1 Aug 2026; sportspersons get <strong>+5 years</strong> (OBC +8, SC/ST +10)", "Played for your state at <strong>Senior or Junior Nationals</strong>; or top 3 at SGFI school nationals or Khelo India Games", "Level 3 · ₹21,700–69,100"]
            source: "rrc-wr26,crpf26"
          - note: "Railways count results from <strong>1 April 2024</strong>; CRPF counts the <strong>two years before 30 September 2026</strong>. Railways fee ₹500 (₹400 back if you attend the trial; ₹250, refunded in full on attending, for SC/ST, women, PwBD, minorities, ex-servicemen and EBC). CRPF fee ₹100 for UR/OBC/EWS men; free for women, SC, ST and ex-servicemen. CRPF picks sign a <strong>₹1 lakh bond to serve at least 3 years</strong>."
            source: "rrc-wr26,crpf26"
          - qa:
              q: "Bikes are expensive. How do we manage?"
              a: "Aim for the free seats: SAI Training Centres and the five cycling NCOEs give <strong>coaching, boarding, sports science and diet</strong>; a Khelo India athlete gets <strong>₹6.28 lakh a year</strong> for training, equipment and more, and TOPS pays ₹25,000–50,000 a month to medal prospects. A rider in hardship can apply to the PDU National Welfare Fund for up to ₹2.50 lakh."
            source: "sai-schemes,pib-support"
          - qa:
              q: "Does any 'national' certificate count for a job?"
              a: "No. Railways will <strong>not recruit on a certificate from a federation MoYAS did not recognise</strong> at the time of the championship, and CRPF counts only championships of MoYAS-recognised federations or the IOA's National Games."
            source: "rrc-wr26,crpf26"
