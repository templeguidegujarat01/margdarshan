  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "What is a realistic Microbiology salary in India?"
            a: "Freshers with a BSc commonly earn ₹2-3.5 LPA in roles like Lab Technician, Quality Control Analyst or Research Assistant. With an MSc or specialisation, this commonly rises to ₹3.5-8 LPA in roles like Microbiologist or Clinical Research Associate. With 5-10 years of experience, professionals commonly earn ₹8-15+ LPA, with senior Medical Microbiologists in pharma or research reported to reach up to ₹20 LPA."
          - q: "Is Microbiology more accessible than Biotechnology or Genetics?"
            a: "In one specific way, yes — Microbiology has genuinely more diverse, accessible non-research industry applications at the bachelor's level, particularly in food safety and quality control roles in the food and beverage industry. Biotechnology and Genetics both lean more heavily toward requiring further specialisation or postgraduate study for meaningful career outcomes, whereas food and industrial QC roles in Microbiology are a genuine, accessible entry point straight after a BSc."
          - q: "What is the difference between Clinical, Industrial and Environmental Microbiology?"
            a: "Clinical Microbiology involves diagnosing infections in hospital and diagnostic lab settings, working closely with pathology departments. Industrial Microbiology focuses on quality control and production in food, beverage and pharmaceutical manufacturing. Environmental Microbiology studies microorganisms in soil, water and ecosystems, often tied to environmental testing and conservation work. Each represents a genuinely different day-to-day career, though all build on the same core degree."
          - q: "Do I need a Master's degree to have a good Microbiology career?"
            a: "It genuinely helps, but isn't as strictly necessary as in Genetics. A BSc alone can lead to real entry-level roles in food safety, quality control and lab technician positions. An MSc meaningfully raises your pay ceiling and opens roles like Clinical Research Associate or Junior Scientist, and is close to necessary for medical or clinical microbiology roles specifically."
          - q: "Is NEET required for Microbiology?"
            a: "No. Admission is via CUET, university-specific entrance exams, state-level admissions, or direct Class 12 merit, depending on the institute — NEET is not required."
      - note: "Figures are indicative (2026) — confirm on the official college or authority website."
        class: "table-note mt-lg"
