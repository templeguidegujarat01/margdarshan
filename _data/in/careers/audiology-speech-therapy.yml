  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "What is the difference between an Audiologist and a Speech-Language Pathologist?"
            a: "Both qualifications come from the same BASLP degree in India, but they represent two distinct sub-specialisations. Audiologists focus on diagnosing and treating hearing disorders — hearing tests, hearing aid fitting, cochlear implant support. Speech-Language Pathologists focus on speech, language, communication and swallowing disorders — stuttering, developmental language delays, voice disorders, and post-stroke communication recovery. Many BASLP graduates lean toward one specialisation over the other as their career progresses."
          - q: "Is NEET required for BASLP?"
            a: "No. BASLP admission does not require NEET — colleges use their own entrance exams, state-level admissions, or direct Class 12 merit instead."
          - q: "Is there really a shortage of audiologists and speech therapists in India?"
            a: "Yes, and it's genuinely severe. The RCI estimates India needs hundreds of thousands of additional trained audiologists and speech-language pathologists to meet current demand. This is a combination of very few BASLP training programmes producing graduates each year and a large, growing patient population — driven by an ageing population, rising industrial noise-related hearing loss, growing awareness of childhood speech-language delays, and expanding cochlear implant programmes."
          - q: "What is a realistic BASLP salary in India?"
            a: "Freshers commonly earn ₹2.5-4 LPA, or roughly ₹15,000-30,000 per month, with an overall average commonly cited around ₹3-5 LPA. Experienced professionals earn ₹30,000-55,000 per month, and government roles — particularly for MSc-qualified professionals — are reported to start around ₹40,000-60,000 per month under standard pay commission structures, plus benefits. A well-managed private clinic is reported to generate ₹1.5-4 lakh per month in revenue, with profit margins of 30-45%."
          - q: "Can I work abroad as an audiologist or speech-language pathologist?"
            a: "Yes, and pay is reported to be considerably higher — sometimes ₹1-4 lakh per month equivalent, depending on the country and role. Australia and Canada are commonly cited as offering competitive packages, though licensing requirements must be cleared before practice in any specific country — research your target destination's requirements carefully."
      - note: "Figures are indicative (2026) — confirm on the official college or authority website."
        class: "table-note mt-lg"
