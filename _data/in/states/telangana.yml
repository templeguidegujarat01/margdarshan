  # ------------------------------------------------------------------ TELANGANA POLICE (TSLPRB)
  - slug: police
    group: civil
    short: "Telangana Police Constable &amp; SI 2026 (TSLPRB)"
    body: "Telangana State Level Police Recruitment Board"
    card: "7,437 posts notified on 29 July 2026 — 7,139 constable-level posts (Civil, AR, SPF, Fire Fighter, Warder) and 298 SI / ASI-level posts — with extra age relaxation of 7 to 10 years for this round."
    card_facts: ["7,437 posts · applications closed 16 Sep", "SI prelim 29 Nov · PC prelim 20 Dec 2026", "Age relaxation +10 (PC) / +7 (SI)"]
    eyebrow: "TSLPRB · Constable &amp; Sub-Inspector"
    title: "Telangana Police Recruitment 2026 — 7,437 Posts: Eligibility, Age Relaxation, PET, Scheme, Pay"
    lede: "The Telangana State Level Police Recruitment Board issued four notifications on 29 July 2026 for the Police, Special Protection Force, Fire and Prisons departments. This page follows the constable and Sub-Inspector notifications, the supplementary notifications of 15 August and 10 September 2026, and the press note of 17 September 2026."
    facts:
      - { label: "Posts", value: "7,437 (PC level 7,139 · SI level 298)", source: tg-pn }
      - { label: "Prelims", value: "SI 29 Nov · PC 20 Dec 2026 (tentative)", source: tg-pn }
      - { label: "Qualification", value: "PC: Intermediate · SI: degree", source: tg-pc }
      - { label: "Applications", value: "5,77,064 from about 4.29 lakh people", source: tg-pn }
    official:
      - { label: "TSLPRB website", url: "https://www.tgprb.in/" }
      - { label: "PC (Civil et al) notification 2026 (PDF)", url: "https://doc.tgprb.in/PC+(Civil+et+al)+2026+Notification+dated+29-07-2026.pdf" }
      - { label: "SI (Civil et al) notification 2026 (PDF)", url: "https://doc.tgprb.in/SI+(Civil+et+al)+2026+Notification+dated+29-07-2026.pdf" }
    sections:
      - id: overview
        nav: "Overview"
        eyebrow: "Overview &amp; official source"
        heading: "7,437 posts across four departments"
        parts:
          - table:
              caption: "Vacancies notified on 29 July 2026"
              head: ["Department", "SI / ASI level", "PC level", "Total"]
              rows:
                - ["Police", "200", "4,800", "5,000"]
                - ["Special Protection Force", "44", "1,380", "1,424"]
                - ["Fire, Disaster Response, Emergency &amp; Civil Defence", "39", "751", "790"]
                - ["Prisons &amp; Correctional Services", "15", "208", "223"]
                - ["Total", "298", "7,139", "7,437"]
            source: tg-pn
          - p: "Online applications ran from 19 August to 16 September 2026. The Board received 5,77,064 applications from about 4,29,000 candidates. The preliminary written tests are tentatively on <strong>29 November 2026 (SI)</strong> and <strong>20 December 2026 (PC)</strong>."
            source: tg-pn
          - table:
              caption: "Constable-level posts in the PC (Civil et al) notification"
              head: ["Post", "Posts", "Pay scale (₹)"]
              rows:
                - ["SCT Police Constable (Civil)", "3,697", "24,280 – 72,850"]
                - ["SCT Police Constable (AR)", "1,052", "24,280 – 72,850"]
                - ["SCT Police Constable (SAR CPL), men", "24", "24,280 – 72,850"]
                - ["SCT Constable, Special Protection Force", "1,380", "24,280 – 72,850"]
                - ["Fire Fighter", "751", "24,280 – 72,850"]
                - ["Warder (male / female)", "196 / 12", "24,280 – 72,850"]
                - ["Total", "7,112", ""]
            source: tg-pc
          - table:
              caption: "SI-level posts in the SI (Civil et al) notification"
              head: ["Post", "Posts", "Pay scale (₹)"]
              rows:
                - ["SCT Sub-Inspector of Police (Civil)", "148", "42,300 – 1,15,270"]
                - ["SCT Reserve SI (AR / SAR CPL / TGSP)", "14 / 3 / 12", "42,300 – 1,15,270"]
                - ["SCT Sub-Inspector, Special Protection Force", "44", "42,300 – 1,15,270"]
                - ["Station Fire Officer", "39", "38,890 – 1,12,510"]
                - ["Deputy Jailor (men / women)", "14 / 1", "38,890 – 1,12,510"]
                - ["Total", "275", ""]
            source: tg-si
          - note: "The other posts in the 7,437 are PC Driver / Mechanic and ASI (Finger Print Bureau), notified separately the same day."
            source: tg-pn
      - id: eligibility
        nav: "Eligibility &amp; Age"
        eyebrow: "Eligibility, age &amp; medical standards"
        heading: "Intermediate or degree, and a much higher age limit this year"
        parts:
          - list:
              - "<strong>Constable qualification:</strong> Intermediate or equivalent passed by 29 July 2026; Fire Fighters also need a valid LMV driving licence."
              - "<strong>Constable age:</strong> 18 to 22 on 1 July 2026 in the notification; Home Guards with 360 days' duty in two years up to 40; widowed / divorced women up to 40 (SC / ST) or 35 (others)."
              - "<strong>Category relaxation:</strong> 5 years for SC, ST, BC and EWS; Telangana government employees up to 5 years; ex-servicemen and NCC instructors 3 years plus service."
              - "<strong>Medical:</strong> 6/6 distant and 0/5 near vision in each eye; colour blindness, squint, knock-knees, flat feet, varicose veins and stammering disqualify."
            source: tg-pc
          - p: "<strong>Extra relaxation for this recruitment:</strong> the government raised the upper age limit for uniformed services by 5 years (G.O.Ms.No.87, 18 May 2026), then 2 more (G.O.Ms.No.122, 14 Aug 2026) and, for constable-level posts except PC Driver, 3 more (G.O.Ms.No.129, 9 Sep 2026) — 10 years in all for PC-level posts and 7 years for SI / ASI-level posts and PC Driver."
            source: tg-sup
          - list:
              - "<strong>Sub-Inspector:</strong> a degree from a recognised university; age 21 to 25 on 1 July 2026 before the extra 7-year relaxation."
            source: tg-si
      - id: scheme
        nav: "Exam Scheme &amp; PET"
        eyebrow: "Exam scheme &amp; physical tests"
        heading: "Prelim, run and measurements, final written exam"
        parts:
          - list:
              - "<strong>PC preliminary test:</strong> 200 questions, 200 marks, 3 hours, OMR, English-Telugu and English-Urdu. Pass marks 30% (OC, EWS), 25% (BC), 20% (SC, ST, ex-servicemen, Home Guards)."
              - "<strong>Negative marking:</strong> 20% of the question's marks for each wrong answer (more than one bubble or a wrong one); unanswered questions get zero."
              - "<strong>Run first:</strong> men 1,600 m in 7 min 15 s (ex-servicemen 9 min 30 s), women 800 m in 5 min 20 s — qualifying for Civil PC, Fire Fighter and Warders; marked (and gender-normalised) for AR, SAR CPL and SPF."
              - "<strong>Then measurements:</strong> height 167.6 cm (men) / 152.5 cm (women); 160 / 150 cm for STs and aboriginal tribes of the listed agency districts."
              - "<strong>Then long jump and shot put</strong> (qualifying): men 4 m and 6 m (7.26 kg shot), women 2.5 m and 4 m (4 kg)."
              - "<strong>Final written exam:</strong> one 3-hour paper — 200 marks for Civil PC, Fire Fighter and Warders, 100 marks for AR, SAR CPL and SPF (plus run marks). Pass marks 40% / 35% / 30%."
            source: tg-pc
          - list:
              - "<strong>SI preliminary test:</strong> 200 marks — Arithmetic &amp; Reasoning (100 questions) and General Studies (100 questions); same 30 / 25 / 20% pass marks and 20% negative marking."
              - "<strong>SI final written exam:</strong> four 3-hour papers — English and Telugu / Urdu (100 each, 25 objective + 75 descriptive, qualifying only), Arithmetic &amp; Reasoning and General Studies (200 each for SI Civil, SFO and Deputy Jailor; 100 each for AR, TGSP and SPF)."
            source: tg-si
      - id: fees
        nav: "Fees"
        eyebrow: "Fee structure"
        heading: "Fee shown in the online application"
        parts:
          - p: "The notification does not print rupee amounts: OC and BC candidates with Telangana local status pay the fee designated in the online application, SC and ST local candidates pay a concessional fee, and all others pay the full fee. It covers registration, processing, the tests and certificate verification."
            source: tg-pc
          - p: "Candidates who applied for more than one post were given a rebate, because a single PMT / PET is held for all their posts."
            source: tg-pn
      - id: reservation
        nav: "Reservation &amp; Local Status"
        eyebrow: "Reservation &amp; local status"
        heading: "95% local, SC sub-classification, special quotas"
        parts:
          - list:
              - "95% of PC (Civil) and PC (AR) vacancies in each police district / commissionerate go to local candidates under the Presidential Order 2018 (G.O.Ms.No.124); SAR CPL is outside that order but reservation still needs Telangana local status."
              - "Local status is proved by study certificates for Classes I to VII, or a Tahsildar's residence certificate for years not spent in a recognised school."
              - "<strong>SC</strong> candidates need a community certificate under Act No. 15 of 2025 (SC Group I, II, III); <strong>BC</strong> a Telangana non-creamy-layer certificate issued on or after 1 April 2026; <strong>EWS</strong> a certificate issued on or after 1 April 2026."
              - "<strong>Special quotas:</strong> PC Civil / AR — Home Guards 15%, children of police personnel 4%, NCC 3%, CDI 2%; SPF constable — Home Guards 25%, children of SPF personnel 5%, NCC 2%; Fire Fighter — Home Guards 5%, children of fire staff 5%."
            source: tg-pc
      - id: documents
        nav: "Documents"
        eyebrow: "Document checklist"
        heading: "What to keep ready"
        parts:
          - list:
              - "Latest SC community certificate with sub-classification (SC Group I, II or III) from Telangana authorities."
              - "EWS certificate and BC non-creamy-layer certificate issued on or after 1 April 2026."
              - "Bonafide certificates from Class I to VII, or residence certificate."
              - "Special-category certificates (Home Guard, children of police personnel and others)."
              - "Intermediate pass certificate (degree for SI) dated on or before 29 July 2026, produced at certificate verification."
            source: tg-pc
      - id: pay
        nav: "Pay &amp; Training"
        eyebrow: "Salary &amp; training"
        heading: "Stipendiary cadet training, then the scale"
        parts:
          - list:
              - "<strong>Constable-level posts</strong> (PC Civil, AR, SAR CPL, SPF, Fire Fighter, Warder): ₹24,280 – 72,850."
              - "Police posts are Stipendiary Cadet Trainee (SCT) posts: selected candidates are appointed to the regular posts only after completing induction training."
            source: tg-pc
          - list:
              - "<strong>SI (Civil, AR, SAR CPL, TGSP, SPF):</strong> ₹42,300 – 1,15,270. <strong>Station Fire Officer, Deputy Jailor:</strong> ₹38,890 – 1,12,510."
            source: tg-si
          - note: "The stipend during training and in-hand pay are not printed in the notifications, so they are not shown."
      - id: posting
        nav: "Job &amp; Posting"
        eyebrow: "Job profile &amp; posting"
        heading: "Selection by merit within each unit"
        parts:
          - p: "Civil constables are selected on final-exam merit within each police district or commissionerate; AR constables on final exam plus normalised run marks. Candidates rank their post preferences in the Part-II application. Selection is provisional until certificates and medical fitness are checked."
            source: tg-pc
    sources:
      - { id: tg-pc, name: "TSLPRB — Notification Rc No. 189/Rect./Rect.-2/2026, SCT PC (Civil) and equivalent posts (29 Jul 2026)", url: "https://doc.tgprb.in/PC+(Civil+et+al)+2026+Notification+dated+29-07-2026.pdf", covers: "PC vacancies, pay, fee rule, qualification, age, medical, PWT, negative marking, run, measurements, PET, FWE, local reservation, special quotas, documents, training", checked: 2026-10-18 }
      - { id: tg-si, name: "TSLPRB — Notification Rc No. 225/Rect./Rect.-1/2026, SCT SI (Civil) and equivalent posts (29 Jul 2026)", url: "https://doc.tgprb.in/SI+(Civil+et+al)+2026+Notification+dated+29-07-2026.pdf", covers: "SI vacancies, pay, qualification, age, prelim and final exam scheme", checked: 2026-10-18 }
      - { id: tg-sup, name: "TSLPRB — Supplementary notifications on age relaxation (15 Aug 2026 and 10 Sep 2026)", url: "https://www.tgprb.in/SI_PC_2026/Second%20Supplementary%20Notification%202026%20%20dated10%20Sep%202026.pdf", covers: "G.O.Ms.No.87, 122 and 129 — extra age relaxation", checked: 2026-10-18 }
      - { id: tg-pn, name: "TSLPRB — Press note: preliminary written tests and application statistics (17 Sep 2026)", url: "https://www.tgprb.in/SI_PC_2026/Press%20Note%20dated%2017-09-2026.pdf", covers: "7,437 posts by department, application window, applications received, prelim dates, multi-post rebate", checked: 2026-10-18 }

  # ------------------------------------------------------------------ TG EAPCET
  - slug: eapcet
    group: academic
    short: "TG EAPCET — Engineering, Agriculture &amp; Pharmacy"
    body: "JNTU Hyderabad for the Telangana Council of Higher Education"
    card: "Telangana's entrance test for B.E. / B.Tech, B.Pharmacy, Pharm-D, B.Sc. (Hons) Agriculture and Horticulture, B.V.Sc., B.F.Sc. and B.Sc. Nursing. Ranks come purely from normalised TG EAPCET marks."
    card_facts: ["160 questions · 3 hours · no negative", "Rank on normalised test marks only", "Fee ₹900 (₹500 SC/ST/PH)"]
    eyebrow: "TG EAPCET · State entrance"
    title: "TG EAPCET 2026 — Eligibility, Pattern, Normalised Ranking, Local Quota, Fees"
    lede: "The Telangana Engineering, Agriculture and Pharmacy Common Entrance Test (TG EAPCET) is conducted by JNTU Hyderabad on behalf of the Telangana Council of Higher Education. This page follows the TG EAPCET-2026 notification and the engineering instruction booklet."
    facts:
      - { label: "2026 exam", value: "AP stream 4–5 May · Engineering 9–11 May", source: tg-eap-dn }
      - { label: "Paper", value: "80 Maths + 40 Physics + 40 Chemistry", source: tg-eap-ib }
      - { label: "Rank", value: "Normalised EAPCET marks only", source: tg-eap-dn }
      - { label: "Fee", value: "₹900 · ₹500 SC/ST/PH (one stream)", source: tg-eap-dn }
    official:
      - { label: "TG EAPCET website", url: "https://eapcet.tgche.ac.in/" }
      - { label: "Detailed notification 2026 (PDF)", url: "https://eapcet.tgche.ac.in/TGEAPCET/Doc2026/Detailed%20Notification-2026.pdf" }
    sections:
      - id: overview
        nav: "Overview"
        eyebrow: "Overview &amp; official source"
        heading: "One CBT, two streams"
        parts:
          - p: "TG EAPCET-2026 admits students for 2026-27 to B.E. / B.Tech (including Biotechnology, Dairy, Agricultural Engineering, Food Technology, Biomedical and Pharmaceutical Engineering), B.Pharmacy, Pharm-D, B.Sc. (Hons) Agriculture and Horticulture, B.V.Sc. &amp; A.H., B.F.Sc. and B.Sc. (Nursing) in Telangana's universities and private colleges."
            source: tg-eap-dn
          - table:
              caption: "TG EAPCET-2026 calendar"
              head: ["Event", "Date"]
              rows:
                - ["Online applications open", "19 Feb 2026"]
                - ["Last date without late fee", "4 Apr 2026"]
                - ["Late fee ₹250 / ₹500 / ₹2,500 / ₹5,000", "10 / 15 / 20 / 24 Apr 2026"]
                - ["Late fee ₹10,000", "Till 2 May 2026"]
                - ["Agriculture &amp; Pharmacy (AP) exam", "4 – 5 May 2026"]
                - ["Engineering (E) exam", "9 – 11 May 2026"]
            source: tg-eap-dn
          - note: "Candidates for B.Arch in Telangana must take NATA instead; a separate counselling notification is issued for B.Arch."
            source: tg-eap-dn
      - id: eligibility
        nav: "Eligibility"
        eyebrow: "Academic eligibility"
        heading: "Intermediate MPC with 45%, or a diploma"
        parts:
          - list:
              - "Indian nationals, PIO or OCI card holders who meet Telangana's local / non-local status rules (Educational Institutions (Regulation of Admissions) Order, 1974)."
              - "<strong>Engineering:</strong> Intermediate (10+2) with Mathematics, Physics and Chemistry / Biotechnology / Biology, or a diploma in engineering from SBTET Telangana or equivalent; appearing candidates may apply."
              - "<strong>Marks:</strong> at least 45% (40% for reserved categories) in MPC / BiPC taken together."
              - "<strong>Age:</strong> engineering and pharmacy at least 16 on 31 Dec 2026, no upper limit; Dairy, Agricultural Engineering and Food Technology 17 to 22 (25 for SC / ST); agriculture-stream courses 17 to 22 (25 for SC / ST)."
              - "<strong>B.V.Sc.:</strong> 50% in English, Physics, Chemistry and Biology (10% less for SC / ST)."
            source: tg-eap-dn
      - id: scheme
        nav: "Exam Scheme &amp; Rank"
        eyebrow: "Exam scheme &amp; ranking"
        heading: "160 questions, no negative marks, normalised rank"
        parts:
          - list:
              - "<strong>Paper:</strong> 3 hours, 160 MCQs — 80 Mathematics, 40 Physics, 40 Chemistry (engineering stream), computer-based in multiple sessions."
              - "<strong>No negative marking</strong> for incorrect answers."
              - "<strong>Medium:</strong> questions on screen in English with Telugu, or English with Urdu — the candidate picks one."
              - "<strong>Qualifying:</strong> 25% of the maximum normalised marks; no minimum for SC / ST, whose admission is limited to their reserved seats."
            source: tg-eap-ib
          - p: "Because sessions have different papers, marks are <strong>normalised</strong> across sessions using session and global averages, standard deviations and top-0.1% averages. TG EAPCET-2026 ranks are allotted <strong>purely on normalised TG EAPCET marks</strong>."
            source: tg-eap-dn
      - id: fees
        nav: "Fees"
        eyebrow: "Registration fee"
        heading: "Fee by stream"
        parts:
          - table:
              head: ["Applying for", "SC / ST / PH", "Others"]
              rows:
                - ["One stream (E or AP)", "₹500", "₹900"]
                - ["Both streams (E and AP)", "₹1,000", "₹1,800"]
            source: tg-eap-dn
          - note: "Candidates who registered with the ₹2,500, ₹5,000 or ₹10,000 late fee were given a test centre in Hyderabad West zone. Fees are paid online or at TGOnline centres."
            source: tg-eap-dn
      - id: reservation
        nav: "Local Quota"
        eyebrow: "Reservation &amp; local quota"
        heading: "85% for local candidates of the OU area"
        parts:
          - list:
              - "85% of the seats in each course are reserved for local candidates of the Osmania University area; the remaining 15% are unreserved."
              - "Unreserved seats are open to OU-area locals and to candidates who have lived in the state for ten years (excluding study outside), or whose parent has, among other listed groups."
              - "Local status needs study or residence certificates for the last 12 years."
            source: tg-eap-ib
      - id: documents
        nav: "Documents"
        eyebrow: "Document checklist"
        heading: "Keep these ready for the application"
        parts:
          - list:
              - "Latest Intermediate 2nd-year / 10+2 hall ticket number, SSC hall ticket number and date of birth."
              - "Personal e-mail ID (compulsory) and mobile number."
              - "Caste for SC / ST / BC candidates (SC / ST: caste certificate application number); PH, CAP, NCC, sports and EWS details; family income band."
              - "Study or residence certificates for the last 12 years (local status) — the certificates themselves are submitted at counselling."
            source: tg-eap-ib
      - id: pay
        nav: "Costs"
        eyebrow: "Costs"
        heading: "What the test costs"
        parts:
          - p: "The notification sets only the registration fee (₹500 – ₹1,800) and late fees. College tuition and counselling fees come with the admission notification."
            source: tg-eap-dn
      - id: posting
        nav: "After the test"
        eyebrow: "After the test"
        heading: "Counselling"
        parts:
          - p: "Seat allocation by reservation is explained in the counselling information booklet released after the results. Candidates must meet the eligibility rules in the G.O.s in force at admission."
            source: tg-eap-ib
          - links:
              - { label: "B.Tech college finder", url: "colleges-btech.html" }
              - { label: "NATA console (B.Arch)", url: "nata.html" }
    sources:
      - { id: tg-eap-dn, name: "JNTU Hyderabad / TGCHE — TG EAPCET-2026 Detailed Notification", url: "https://eapcet.tgche.ac.in/TGEAPCET/Doc2026/Detailed%20Notification-2026.pdf", covers: "courses, eligibility, age, normalisation, ranking rule, streams, exam dates, fees, late fees, B.Arch note", checked: 2026-10-18 }
      - { id: tg-eap-ib, name: "JNTU Hyderabad / TGCHE — TG EAPCET-2026 Instruction Booklet, Engineering (E) stream", url: "https://eapcet.tgche.ac.in/TGEAPCET/Doc2026/05%20I%20Booklet%20-%20E%20-%202026.pdf", covers: "pattern, medium, no negative marking, qualifying marks, 85% local reservation, documents, counselling", checked: 2026-10-18 }

  # ------------------------------------------------------------------ TG ECET — LATERAL ENTRY B.TECH (read 31 Oct 2026)
  - slug: ecet
    group: academic
    short: "TG ECET — Lateral Entry B.Tech &amp; B.Pharm"
    body: "Osmania University, Hyderabad, for the Telangana Council of Higher Education"
    card: "Diploma holders and B.Sc (Maths) graduates join the 2nd year of B.E. / B.Tech (and diploma holders the 2nd year of B.Pharm) in Telangana through TG ECET. ECET-2026 was held on 15 May 2026: 200 one-mark questions in 3 hours."
    card_facts: ["200 Qs · 3 hours", "Qualify: 25% (none for SC/ST)", "Fee ₹900 · ₹500 SC/ST/PH"]
    eyebrow: "TG ECET · Lateral entry"
    title: "TG ECET 2026 — Lateral Entry to B.Tech, Pattern, Eligibility, Qualifying Marks & Local Seats"
    lede: "The Telangana Engineering Common Entrance Test for Diploma and B.Sc (Mathematics) candidates (TG ECET) is held by Osmania University for the Telangana Council of Higher Education. This page follows the TG ECET-2026 notification, instruction booklet and pattern of examination."
    facts:
      - { label: "2026 exam", value: "15 May 2026, 9 am – 12 noon", source: ec-ib }
      - { label: "Paper", value: "200 one-mark MCQs · 3 hours", source: ec-ib }
      - { label: "Qualifying", value: "25% (50 of 200) · none for SC/ST", source: ec-ib }
      - { label: "Fee", value: "₹900 · ₹500 SC/ST/PH", source: ec-not }
    official:
      - { label: "TG ECET website", url: "https://ecet.tgche.ac.in/" }
      - { label: "Instruction booklet (PDF)", url: "https://ecet.tgche.ac.in/UI/Documents/Instruction%20Booklet.pdf" }
    sections:
      - id: overview
        nav: "Overview"
        eyebrow: "Overview &amp; official source"
        heading: "Straight into the 2nd year of B.Tech"
        parts:
          - list:
              - "TG ECET-2026 is for lateral entry into the <strong>2nd year of regular B.E. / B.Tech</strong> in university and affiliated (minority and non-minority) engineering colleges of Telangana, and into the 2nd year of B.Pharm."
              - "B.Sc (Mathematics) graduates can use it for B.E. / B.Tech but not for B.Pharm."
              - "The test was on 15 May 2026, 9:00 am – 12 noon, in computer-based mode."
            source: ec-ib
          - p: "Online applications ran from 9 February to 18 April 2026 without late fee."
            source: ec-not
      - id: eligibility
        nav: "Eligibility"
        eyebrow: "Academic eligibility"
        heading: "Diploma or B.Sc (Maths) with 45%"
        parts:
          - list:
              - "Indian nationality, and the local / unreserved status rules (G.O.Ms.No.15, Higher Education, 27 Feb 2025)."
              - "A diploma in engineering / technology / pharmacy from SBTET Telangana or an equivalent recognised diploma, or a 3-year B.Sc with Mathematics, with at least 45% marks (40% for reserved categories)."
              - "Final-year students of 2025-26 may apply and show the marks at admission; sandwich-diploma students must finish their practical training before counselling ends."
              - "Your diploma branch decides which B.Tech branches you can enter (table in the booklet)."
            source: ec-ib
      - id: scheme
        nav: "Exam Scheme"
        eyebrow: "Exam scheme &amp; qualifying marks"
        heading: "200 marks in 3 hours"
        parts:
          - table:
              caption: "TG ECET-2026 paper for diploma holders (engineering)"
              head: ["Subject", "Marks"]
              rows:
                - ["Mathematics (common)", "50"]
                - ["Physics (common)", "25"]
                - ["Chemistry (common)", "25"]
                - ["Engineering paper of your diploma branch", "100"]
                - ["Total", "200"]
            source: ec-pat
          - list:
              - "B.Sc (Mathematics) paper: Mathematics 100, Analytical Ability 50, Communicative English 50."
              - "Pharmacy paper: Pharmaceutics, Pharmacology, Pharmacognosy and Pharmaceutical Chemistry, 50 each."
              - "Duration 180 minutes for every paper."
            source: ec-pat
          - list:
              - "All questions are multiple choice, one mark each."
              - "Qualifying mark: 25% of the aggregate (50 of 200); no minimum for SC / ST. A rank won through this relaxation is cancelled if the caste claim fails."
              - "Ranks are given separately for each engineering branch. Ties are broken by marks in the engineering subject, then Mathematics, then Physics; equal marks in all four are bracketed and the older candidate is preferred at admission."
              - "B.Tech IT seats go first to IT-diploma holders and B.Tech CSE seats first to CSE-diploma holders; leftovers go to any engineering diploma on the integrated merit rank."
            source: ec-ib
      - id: fees
        nav: "Fees"
        eyebrow: "Registration fee"
        heading: "₹900, or ₹500 for SC / ST / PH"
        parts:
          - table:
              head: ["Candidate", "Registration fee"]
              rows:
                - ["SC / ST / PH", "₹500"]
                - ["All others", "₹900"]
            source: ec-not
      - id: reservation
        nav: "Local Seats"
        eyebrow: "Local / unreserved seats"
        heading: "85% for local candidates of the OU area"
        parts:
          - p: "85% of the seats in each course are for local candidates of the Osmania University area; the other 15% are unreserved, open to local candidates, those who (or whose parents) lived in the state for ten years, and children or spouses of state / central government, PSU, local body and university employees working in the state."
            source: ec-ib
      - id: documents
        nav: "Documents"
        eyebrow: "Before admission"
        heading: "Meet the G.O. rules at admission"
        parts:
          - list:
              - "Sitting the test does not give a seat by itself; you must meet the eligibility rules in force at admission."
              - "Rank cards are downloaded from ecet.tgche.ac.in."
            source: ec-ib
      - id: pay
        nav: "Costs"
        eyebrow: "Costs"
        heading: "Test fee only"
        parts:
          - p: "The notification sets only the registration fee (₹900, or ₹500 for SC / ST / PH). College fees are set at admission."
            source: ec-not
      - id: posting
        nav: "After ECET"
        eyebrow: "After the test"
        heading: "Admission counselling"
        parts:
          - p: "Admission to the 2nd year follows the Telangana government's admission rules and counselling for 2026-27, using the ECET rank."
            source: ec-ib
          - links:
              - { label: "TG POLYCET (diploma)", url: "state/telangana/polycet.html" }
              - { label: "TG EAPCET", url: "state/telangana/eapcet.html" }
    sources:
      - { id: ec-ib, name: "Osmania University — TG ECET [FDH &amp; B.Sc. (Mathematics)]-2026 Instruction Booklet", url: "https://ecet.tgche.ac.in/UI/Documents/Instruction%20Booklet.pdf", covers: "purpose, test date and time, 200 one-mark questions, eligibility, branch mapping, qualifying marks, tie rules, 85/15 local seats", checked: 2026-10-31 }
      - { id: ec-pat, name: "Osmania University — TG ECET-2026 Pattern of Examination", url: "https://ecet.tgche.ac.in/UI/Documents/Pattern%20of%20Examination.pdf", covers: "subject marks for diploma, B.Sc (Maths) and pharmacy papers; 180 minutes", checked: 2026-10-31 }
      - { id: ec-not, name: "Osmania University — TG ECET-2026 Notification (5 Feb 2026)", url: "https://ecet.tgche.ac.in/UI/Documents/TG%20ECET%202026%20Notification.pdf", covers: "application window, test date, registration fee", checked: 2026-10-31 }
  # ------------------------------------------------------------------ TG PGECET — M.E. / M.TECH (read 31 Oct 2026)
  - slug: pgecet
    group: academic
    short: "TG PGECET — M.E. / M.Tech, M.Pharm &amp; M.Arch"
    body: "Jawaharlal Nehru Technological University Hyderabad, for the Telangana Council of Higher Education"
    card: "Telangana's entrance test for full-time M.E., M.Tech, M.Pharm, M.Arch and Pharm.D (Post Baccalaureate). GATE / GPAT holders are admitted first; PGECET ranks fill the rest. PGECET-2026 was held from 29 May to 1 June 2026."
    card_facts: ["120 Qs · 2 hours · no negative", "Qualify: 25% (none for SC/ST)", "Fee ₹1,100 · ₹600 SC/ST/PwD"]
    eyebrow: "TG PGECET · After B.Tech"
    title: "TG PGECET 2026 — M.E. / M.Tech Entrance, Pattern, Qualifying Marks, Eligibility & Fees"
    lede: "The Telangana Post Graduate Engineering Common Entrance Test (TG PGECET) is conducted by JNTU Hyderabad for the Telangana Council of Higher Education. This page follows the TG PGECET-2026 notification documents: important dates, test schedule, pattern, instructions, test papers and general information."
    facts:
      - { label: "2026 exam", value: "29 May – 1 Jun 2026 (CBT)", source: pg-sched }
      - { label: "Paper", value: "120 MCQs · 2 hours · no negative", source: pg-ins }
      - { label: "Qualifying", value: "25% (30 marks) · none for SC/ST", source: pg-ins }
      - { label: "Fee per test", value: "₹1,100 · ₹600 SC/ST/PwD", source: pg-ins }
    official:
      - { label: "TG PGECET website", url: "https://pgecet.tgche.ac.in/" }
      - { label: "TG PGECET admissions", url: "https://pgecetadm.tgche.ac.in/" }
    sections:
      - id: overview
        nav: "Overview"
        eyebrow: "Overview &amp; official source"
        heading: "GATE first, then PGECET rank"
        parts:
          - list:
              - "TG PGECET-2026 is for admission to <strong>full-time</strong> M.E., M.Tech, M.Pharm, M.Arch and Graduate-level Pharm.D (Post Baccalaureate) in Telangana's universities and affiliated engineering, pharmacy and architecture colleges for 2026-27. Part-time and sponsored PG courses are outside it."
              - "<strong>GATE-qualified candidates get preference.</strong> Seats left after them are filled from TG PGECET ranks in merit order. GATE / GPAT holders register under a separate notification."
              - "The test is held at two regional centres: Hyderabad and Warangal."
            source: pg-gi
          - table:
              caption: "TG PGECET-2026 calendar"
              head: ["Event", "Date"]
              rows:
                - ["Notification", "23 Feb 2026"]
                - ["Online applications from", "27 Feb 2026"]
                - ["Last date without late fee", "6 May 2026"]
                - ["Exams (10 am – 12 noon and 2 – 4 pm)", "29 May – 1 Jun 2026"]
            source: pg-dates
      - id: eligibility
        nav: "Eligibility"
        eyebrow: "Academic eligibility"
        heading: "50% in the qualifying degree (45% reserved)"
        parts:
          - list:
              - "Indian nationality, and the local / non-local status rules of G.O.Ms.No.153 (22 Aug 2007)."
              - "At least 50% marks in the qualifying examination (45% for reserved categories), as in the AICTE norms; a degree earned by distance mode must have AICTE / DEC approval."
              - "Pick the test paper that matches the course you want; the course-wise eligibility of each university is published with the notification."
            source: pg-gi
      - id: scheme
        nav: "Exam Scheme"
        eyebrow: "Exam scheme &amp; qualifying marks"
        heading: "120 questions, no negative marks, 25% to qualify"
        parts:
          - list:
              - "Computer-based test of 2 hours with 120 multiple-choice questions, 1 mark each, in English only."
              - "<strong>No negative marking.</strong>"
              - "Qualifying mark: 25% of the maximum (30 marks); no minimum for SC / ST candidates. Ranks are given on the final key."
            source: pg-ins
          - p: "19 test papers in 2026: Aerospace, Architecture &amp; Planning, Biomedical, Biotechnology, Chemical, Civil, Computer Science &amp; IT, Electrical, Electronics &amp; Communication, Environmental Management, Food Technology, Geo-Engineering &amp; Geo-Informatics, Instrumentation, Mechanical, Metallurgical, Mining, Nano Technology, Pharmacy and Textile Technology."
            source: pg-papers
      - id: fees
        nav: "Fees"
        eyebrow: "Application fee"
        heading: "₹1,100 per test paper"
        parts:
          - table:
              head: ["Candidate", "Fee per test"]
              rows:
                - ["All other candidates", "₹1,100"]
                - ["SC / ST / PwD", "₹600"]
            source: pg-ins
          - note: "A separate fee is paid for each extra test. Late applications cost ₹250 to ₹10,000 extra depending on the date."
            source: pg-dates
      - id: reservation
        nav: "Local Status"
        eyebrow: "Local / non-local status"
        heading: "Telangana's local-area rules apply"
        parts:
          - p: "Admission follows the local / non-local status rules of G.O.Ms.No.153 and the admission policy for PG professional courses, which the Telangana Council of Higher Education notifies separately."
            source: pg-gi
      - id: documents
        nav: "Documents"
        eyebrow: "Before the test"
        heading: "Hall ticket from the website"
        parts:
          - list:
              - "Apply online only; printed applications are not accepted."
              - "Download the hall ticket from pgecet.tgche.ac.in — you are not allowed in without it."
              - "Appearing in the test does not guarantee admission; you must meet every requirement at admission."
            source: pg-ins
      - id: pay
        nav: "Costs"
        eyebrow: "Costs"
        heading: "Test fee only"
        parts:
          - p: "The PGECET documents set only the application fee (₹1,100, or ₹600 for SC / ST / PwD, per test). College fees are announced at admission."
            source: pg-ins
      - id: posting
        nav: "After PGECET"
        eyebrow: "After the test"
        heading: "Online counselling"
        parts:
          - p: "Admissions are made through online counselling run from the PGRRCDE Online Counselling Centre, Osmania University, under a separate admission notification of the Council."
            source: pg-home
          - links:
              - { label: "GATE", url: "gate.html" }
              - { label: "TG EAPCET", url: "state/telangana/eapcet.html" }
    sources:
      - { id: pg-gi, name: "JNTU Hyderabad — TG PGECET-2026 General Information", url: "https://pgecet.tgche.ac.in/Docs2026/TG%20PGECET%20-%202026%20General%20Information.pdf", covers: "courses, GATE preference, AICTE 50/45% rule, eligibility, local status G.O.153, regional centres", checked: 2026-10-31 }
      - { id: pg-ins, name: "JNTU Hyderabad — TG PGECET-2026 Instructions to Candidates", url: "https://pgecet.tgche.ac.in/Docs2026/TG%20PGECET%20-%202026%20Instructions%20to%20Candidates.pdf", covers: "fee, CBT pattern, no negative marking, qualifying marks, hall ticket, GATE/GPAT notification", checked: 2026-10-31 }
      - { id: pg-dates, name: "JNTU Hyderabad — TG PGECET-2026 Important Dates", url: "https://pgecet.tgche.ac.in/Docs2026/TG%20PGECET-2026%20-%20Important%20Dates.pdf", covers: "notification, application window, late-fee slabs", checked: 2026-10-31 }
      - { id: pg-sched, name: "JNTU Hyderabad — TG PGECET-2026 revised test schedule", url: "https://pgecet.tgche.ac.in/Docs2026/Test%20Schedule-2026%20-%20Revised.pdf", covers: "exam dates 29 May – 1 Jun 2026 and sessions by paper", checked: 2026-10-31 }
      - { id: pg-papers, name: "JNTU Hyderabad — TG PGECET-2026 list of test papers", url: "https://pgecet.tgche.ac.in/Docs2026/TG%20PGECET%20-%202026%20List%20of%20Test%20Papers.pdf", covers: "19 papers and codes", checked: 2026-10-31 }
      - { id: pg-home, name: "TG PGECET-2026 website (home page)", url: "https://pgecet.tgche.ac.in/", covers: "conducting body, courses, admissions link, online counselling centre", checked: 2026-10-31 }
  # ------------------------------------------------------------------ TG POLYCET
  - slug: polycet
    group: academic
    short: "TG POLYCET — Polytechnic &amp; Agri / Vet Diplomas"
    body: "State Board of Technical Education and Training, Telangana"
    card: "One OMR test after Class 10 for engineering and non-engineering diplomas in Telangana's polytechnics and for agriculture, horticulture and veterinary diplomas of the state universities."
    card_facts: ["150 marks · 2½ hours · no negative", "Pass 36/120 (SC/ST: 1 mark)", "Fee ₹500 · ₹250 SC/ST"]
    eyebrow: "TG POLYCET · Diploma admission"
    title: "TG POLYCET 2026 — Eligibility, Pattern, Qualifying Marks, Reservation, Fees"
    lede: "The Polytechnic Common Entrance Test (POLYCET) of the State Board of Technical Education and Training, Telangana fills diploma seats in polytechnics and the agriculture, horticulture and veterinary diplomas of PJTAU, SKLTGHU and PVNRTVU. This page follows the POLYCET-2026 detailed notification and instruction booklet."
    facts:
      - { label: "2026 exam", value: "13 May 2026, 11 am – 1:30 pm", source: poly-dn }
      - { label: "Paper", value: "Maths 60 · Physics 30 · Chemistry 30 · Biology 30", source: poly-ib }
      - { label: "Eligibility", value: "SSC with 35% (appearing allowed)", source: poly-ib }
      - { label: "Fee", value: "₹500 · ₹250 SC/ST", source: poly-dn }
    official:
      - { label: "TG POLYCET website", url: "https://polycet.sbtet.telangana.gov.in/" }
      - { label: "POLYCET-2026 instruction booklet (PDF)", url: "https://polycet.sbtet.telangana.gov.in/Downloads/polycet2026.pdf" }
    sections:
      - id: overview
        nav: "Overview"
        eyebrow: "Overview &amp; official source"
        heading: "One test for polytechnic, agri and vet diplomas"
        parts:
          - p: "POLYCET-2026 admits SSC-passed (or 2026-appearing) students to engineering and non-engineering / technology diplomas in government, aided and private polytechnics in Telangana, to agriculture courses of Professor Jayashankar Telangana State Agricultural University, horticulture diplomas of Sri Konda Laxman Telangana State Horticultural University, and animal husbandry and fisheries courses of PV Narasimha Rao Telangana Veterinary University."
            source: poly-dn
          - table:
              caption: "POLYCET-2026 calendar"
              head: ["Event", "Date"]
              rows:
                - ["Online registration opens", "2 Feb 2026"]
                - ["Last date with normal fee", "20 Apr 2026"]
                - ["With late fee ₹100 / Tatkal ₹300", "21 Apr / 22 Apr 2026"]
                - ["Exam", "13 May 2026"]
                - ["Results", "12 days after the exam"]
            source: poly-dn
          - note: "D.Pharmacy and Hotel Management &amp; Catering Technology diplomas are not filled through POLYCET; they go through DOST with Intermediate as the entry qualification."
            source: poly-ib
      - id: eligibility
        nav: "Eligibility"
        eyebrow: "Academic eligibility"
        heading: "SSC with Maths and 35%"
        parts:
          - list:
              - "Indian nationals belonging to Telangana who meet the local / non-local rules of the 1974 admissions order."
              - "SSC of the Telangana Board, or CBSE, ICSE, NIOS, TOSS or another state board, with Mathematics and at least 35% marks; NIOS / TOSS / CBSE / ICSE / other boards must have passed all subjects including Maths, Physics and Chemistry with 35% in each."
              - "Students appearing for SSC in March / April 2026 may take POLYCET-2026."
              - "<strong>No age limit</strong> to sit the test; agriculture and veterinary diplomas need age 15 to 22 at admission."
            source: poly-ib
      - id: scheme
        nav: "Exam Scheme"
        eyebrow: "Exam scheme &amp; qualifying marks"
        heading: "150 marks, two ranks"
        parts:
          - table:
              caption: "One OMR paper, 2½ hours (11:00 am – 1:30 pm), SSC 2025-26 syllabus"
              head: ["Section", "Questions", "Marks"]
              rows:
                - ["Mathematics", "60", "60"]
                - ["Physics", "30", "30"]
                - ["Chemistry", "30", "30"]
                - ["Biology (for agri / vet diplomas)", "30", "30"]
                - ["Total", "150", "150"]
            source: poly-ib
          - list:
              - "Two ranks are made: <strong>MPC</strong> (out of 120) for polytechnics and <strong>MBiPC</strong> for agriculture and veterinary diplomas, with Maths scaled down to 30."
              - "<strong>Pass mark:</strong> 30% — 36 of 120. SC and ST candidates get a rank with a minimum of one mark and compete for their category seats."
              - "<strong>No negative marking.</strong> Ties (MPC) go to Maths, then Physics, then the older candidate."
              - "No revaluation or re-totalling."
            source: poly-ib
      - id: fees
        nav: "Fees"
        eyebrow: "Fee structure"
        heading: "₹500 exam fee"
        parts:
          - table:
              head: ["Candidate", "Fee"]
              rows:
                - ["General", "₹500"]
                - ["SC / ST", "₹250"]
                - ["Late fee / Tatkal fee", "+₹100 / +₹300"]
            source: poly-dn
          - note: "Applications are filed online through co-ordinating centres or the payment gateway on the POLYCET website."
            source: poly-dn
      - id: reservation
        nav: "Reservation"
        eyebrow: "Reservation &amp; local quota"
        heading: "85% local, SC sub-groups, 33% girls"
        parts:
          - list:
              - "85% of seats in each course are reserved for local candidates of the Osmania University area; 15% are unreserved (G.O.Ms.No.16, Higher Education (TE), 17 Mar 2025, effective 2026-27)."
              - "<strong>Category reservation</strong> in non-minority institutions: SC 15% (SC-I 1%, SC-II 9%, SC-III 5%), ST 10%, BC 29% (BC-A 7%, BC-B 10%, BC-C 1%, BC-D 7%, BC-E 4%); EWS as per G.O.Ms.No.244 of 2021."
              - "33.33% of seats in co-educational non-minority institutions are reserved for girls in each category."
              - "NCC 1% and sports 0.5%, plus quotas for physically challenged candidates and children of armed forces personnel; two seats for Anglo-Indians."
              - "Residential polytechnics at Gajwel, Karimnagar and Utnoor have their own SC / ST-heavy quotas."
            source: poly-ib
      - id: documents
        nav: "Documents"
        eyebrow: "Document checklist"
        heading: "For the exam and counselling"
        parts:
          - list:
              - "POLYCET hall ticket — keep it safe until admission."
              - "At the exam: black / blue ballpoint pen, writing pad, HB pencils, eraser, sharpener; no calculators or phones; no entry after 11 am."
            source: poly-dn
          - list:
              - "Study certificates from the heads of institutions (or residence certificates in the booklet's formats) for local status."
              - "Caste certificate in the specimen form, PH medical certificate, NCC, sports or CAP (armed forces) certificates if claiming a quota; non-municipal area certificate where asked."
            source: poly-ib
      - id: pay
        nav: "Costs &amp; support"
        eyebrow: "Costs &amp; support"
        heading: "Scholarship age rules"
        parts:
          - p: "There is no age limit for the test, but the instruction booklet notes that a maximum age applies for scholarships under the government's guidelines."
            source: poly-ib
          - note: "The booklet does not print polytechnic tuition fees, so none are shown here."
      - id: posting
        nav: "After POLYCET"
        eyebrow: "After POLYCET"
        heading: "Web counselling"
        parts:
          - p: "Admissions for 2026-27 are made through web counselling: candidates give options for courses and polytechnics in order of priority and are allotted their best choice by merit and the admission rules. The schedule is notified after the results."
            source: poly-dn
          - links:
              - { label: "Diploma after Class 10", url: "diploma.html" }
              - { label: "Diploma college finder", url: "colleges-diploma.html" }
    sources:
      - { id: poly-dn, name: "SBTET Telangana — POLYCET-2026 Detailed Notification", url: "https://polycet.sbtet.telangana.gov.in/Downloads/Notifications/DetailNotification.pdf", covers: "courses and universities, eligibility summary, fees, dates, counselling, exam-day rules", checked: 2026-10-18 }
      - { id: poly-ib, name: "SBTET Telangana — POLYCET-2026 Instruction Booklet", url: "https://polycet.sbtet.telangana.gov.in/Downloads/polycet2026.pdf", covers: "eligibility, age, pattern, qualifying marks, ranking, no negative marking, 85% local quota, category reservation, DOST note", checked: 2026-10-18 }
