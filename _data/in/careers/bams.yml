  - id: "fees"
    hid: "fees-heading"
    eyebrow: "Genuinely affordable at government institutes"
    heading: "Fees & scholarships"
    parts:
      - prose:
          - "Government BAMS colleges are among the most affordable medical-adjacent degrees available: annual fees commonly range from <strong>₹10,000-70,000</strong>, meaning a full 5-year total of roughly <strong>₹50,000-3.5 lakh</strong>. <strong>AIIA Delhi</strong> — described as the \"All India Institute of Medical Sciences (AIIMS) of Ayurveda\" — charges approximately <strong>₹35,000 per year</strong>. Private colleges are considerably more expensive, with annual fees commonly <strong>₹1-4.5 lakh</strong>, totalling roughly <strong>₹5-22 lakh</strong> over the full course. Always confirm current fees directly on your target college's official admission page."
