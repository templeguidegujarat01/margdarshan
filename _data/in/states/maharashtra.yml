# Maharashtra State Exam & Career Cockpit — one data sheet for the cockpit (state/maharashtra/index.html)
# and every exam page under state/maharashtra/. Rendered by _includes/state-cockpit.html and
# _includes/state-exam.html; checked by scripts/check-in-data.mjs (state sheets block).
#
# Rules for this sheet (same as gujarat.yml):
#   - Every fact part carries `source: <id>`; the id must be listed under that exam's `sources`.
#   - Sources are the official advertisement / notice / gazette files themselves (read 2026-10-14). Most
#     MPSC, police and board files are Marathi scans; they were read page by page from rendered images.
#     Nothing here comes from coaching or news sites. Where an official file did not state a value
#     (for example the Talathi or Police Constable pay scale), the text says so instead of guessing.
#   - MPSC serves its files through a script-driven listing, so MPSC sources point to the official
#     "Advertisements / Notifications / Corrigendums" page and name the advertisement number to open.
#   - Section ids are the same on every exam page: overview, eligibility, scheme, fees, reservation,
#     documents, pay, posting (+ sources, drawn automatically).
#   - Part kinds: p (paragraph), list (bullets), table {head, rows, caption?}, note (small print),
#     warn (callout box), links [{label, url}] (official buttons).
state:
  id: maharashtra
  name: Maharashtra
  checked: 2026-10-14

cockpit:
  eyebrow: "State Exam & Career Cockpit · Maharashtra"
  title: "Maharashtra Exam &amp; Career Cockpit"
  intro:
    - "Every major Maharashtra government recruitment and state admission route on one screen: who conducts it, who can apply, how the exam works, what it costs and where it leads. Each page is built only from the official advertisement, gazette rule or information brochure of the conducting body (most of them Marathi scans, read page by page), and every fact links back to that file."
  facts:
    - { label: "Recruitment nodes", value: "MPSC · Group-C (Talathi) · Police" }
    - { label: "Admission nodes", value: "MHT-CET · MBA CET · BBA/BMS CAP · Board" }
    - { label: "Applications", value: "mpsconline.gov.in · mahacet.org" }
    - { label: "Last checked", value: "14 Oct 2026" }
  groups:
    - id: civil
      eyebrow: "Administrative &amp; civil"
      heading: "Government recruitment exams"
      intro: "Group-A and Group-B officers through the MPSC State Services exam, village revenue officers (Talathi) through MPSC's Group-C exam, and police constables through district and commissionerate units (with PSI through MPSC)."
      exams: [mpsc, talathi, police]
    - id: academic
      eyebrow: "Academic &amp; professional admissions"
      heading: "State admission routes after Class 10, 12 and graduation"
      intro: "Engineering and pharmacy through MHT-CET, MBA/MMS through MAH-MBA/MMS CET, the newly CET-based BBA/BMS/BBM and BCA admissions through the State CET Cell's CAP, and the MSBSHSE board exams that every route starts from."
      exams: [mhtcet, mba-cet, bba-cap, msbshse]
  compare_note: "Fees, age limits and dates are from the latest notification of each body. They change every cycle, so always open the current notification before applying."
  portals_note: "MPSC applications are filled only on mpsconline.gov.in; police constable forms run on the Home Department's recruitment portal; every CET and CAP form runs on mahacet.org. Only use these official addresses."
  portals:
    - { label: "MPSC (notifications)", url: "https://mpsc.gov.in/adv_notification/8" }
    - { label: "MPSC online applications", url: "https://mpsconline.gov.in/candidate" }
    - { label: "Maharashtra Police recruitment portal", url: "https://policerecruitment2025.mahait.org/Forms/Home.aspx" }
    - { label: "State CET Cell", url: "https://cetcell.mahacet.org/" }
    - { label: "CAP portals 2026-27 (all courses)", url: "https://cetcell.mahacet.org/cap-_2026-27/" }
    - { label: "MSBSHSE (state board)", url: "https://www.mahahsscboard.in/" }

exams:
  # ------------------------------------------------------------------ MPSC RAJYASEVA
  - slug: mpsc
    group: civil
    short: "MPSC State Services (Rajyaseva)"
    body: "Maharashtra Public Service Commission"
    card: "Deputy Collector, DySP, BDO, Assistant Director (Finance) and other Group-A and Group-B posts through the Civil Services Gazetted Combined Prelim and the descriptive State Services Main exam."
    card_facts: ["Any graduate", "Age up to 38 (open)", "Prelim 400 → Mains 1,750 → Interview 275"]
    eyebrow: "MPSC · Group-A &amp; Group-B (Gazetted)"
    title: "MPSC State Services (Rajyaseva) 2026 — Group-A &amp; Group-B"
    lede: "Maharashtra's senior administrative posts are filled through two MPSC notifications: the Civil Services Gazetted Group-A and Group-B Combined Preliminary Exam 2026 (Advertisement 132/2025) and the State Services Main Exam 2026 (Notification 018/2026). This page follows both."
    facts:
      - { label: "Qualification", value: "Any bachelor's degree + Marathi", source: mpsc-132 }
      - { label: "Age limit", value: "Up to 38 (open) · 43 reserved · 45 disabled", source: mpsc-132 }
      - { label: "Stages", value: "Prelim → descriptive Mains → Interview", source: mpsc-018 }
      - { label: "Main exam 2026", value: "238 posts · 3 Oct – 1 Nov 2026", source: mpsc-018 }
    official:
      - { label: "MPSC notifications (open 132/2025 and 018/2026)", url: "https://mpsc.gov.in/adv_notification/8" }
      - { label: "Apply on MPSC online", url: "https://mpsconline.gov.in/candidate" }
    sections:
      - id: overview
        nav: "Overview"
        eyebrow: "Overview &amp; official source"
        heading: "How Rajyaseva is recruited now"
        parts:
          - p: "Advertisement 132/2025 (24 December 2025) announced the Maharashtra Civil Services Gazetted Group-A and Group-B Combined Preliminary Exam 2026 for 87 posts: 79 in the State Service exam and 8 Veterinary Officer posts in the Maharashtra Veterinary Service exam. Online applications ran from 31 December 2025 (2 pm) to 20 January 2026, and the Prelim was held on Sunday 31 May 2026 at 37 district centres."
            source: mpsc-132
          - p: "After a corrigendum on 17 June 2026 added posts sent later by government departments, the Prelim result (22 June 2026) was processed for 238 posts. The State Services Main Exam 2026 (Notification 018/2026, 25 August 2026) is being held for these 238 posts from 3 October to 1 November 2026 at Amravati, Chhatrapati Sambhajinagar, Nagpur, Nashik, Navi Mumbai and Pune."
            source: mpsc-018
          - table:
              caption: "Some of the cadres in the State Services Main Exam 2026 (Appendix-1 of Notification 018/2026)"
              head: ["Post", "Group"]
              rows:
                - ["Deputy Superintendent of Police / Assistant Commissioner of Police (unarmed)", "Group-A"]
                - ["Deputy Chief Executive Officer / Block Development Officer (Senior grade)", "Group-A"]
                - ["Assistant Director, Maharashtra Finance and Accounts Service", "Group-A"]
                - ["Assistant Commissioner of State Tax", "Group-A"]
                - ["Chief Officer / Assistant Commissioner (municipal)", "Group-A"]
                - ["Assistant Commissioner of Labour", "Group-A"]
                - ["Assistant Block Development Officer", "Group-B"]
                - ["Industry Officer (Technical)", "Group-B"]
                - ["Section Officer, Mantralaya departments", "Group-B"]
                - ["Deputy Superintendent, State Excise", "Group-B"]
                - ["Government Labour Officer", "Group-B"]
                - ["Skill Development, Employment and Entrepreneurship Guidance Officer", "Group-B"]
            source: mpsc-018
      - id: eligibility
        nav: "Eligibility &amp; Age"
        eyebrow: "Eligibility &amp; age limits"
        heading: "Who can apply, and the age limits by category"
        parts:
          - list:
              - "<strong>Citizenship:</strong> Indian citizen."
              - "<strong>Qualification:</strong> a degree from a recognised university, or a qualification the Maharashtra government has declared equivalent to a degree."
              - "<strong>Exceptions:</strong> Assistant Director, Maharashtra Finance and Accounts Service needs a commerce degree with at least 55%, or CA / ICWA final, or a commerce post-graduate degree, or an MBA (finance) from an AICTE-recognised institute. Industry Officer (Technical) needs an engineering or technology degree (not civil or architecture-type branches) or a science degree. Veterinary Officer needs a veterinary science degree and registration under the Maharashtra Veterinary Practitioners Act, 1971."
              - "<strong>Marathi:</strong> knowledge of Marathi is required."
              - "<strong>Final-year students</strong> may sit the Prelim, but must have passed the degree by the last date of the Main exam application."
              - "<strong>Age is counted on:</strong> 1 April 2026 for all cadres except Industry Officer (Technical) and Veterinary Officer, for whom it is counted on 20 January 2026."
            source: mpsc-132
          - table:
              caption: "Age limits printed in Advertisement 132/2025 (same table in Notification 018/2026)"
              head: ["Candidate", "Minimum", "Maximum"]
              rows:
                - ["Unreserved (open)", "18/19 years (as printed, for all cadres)", "38 years"]
                - ["Backward class, EWS or orphan", "18/19 years", "43 years"]
                - ["Meritorious sportsperson — open or backward class", "18/19 years", "43 years"]
                - ["Ex-serviceman / Emergency or Short Service Commissioned Officer — open or backward class", "18/19 years", "43 years"]
                - ["Candidate with a disability", "18/19 years", "45 years"]
            source: mpsc-132
          - note: "There is no separate age relaxation for women in this table. Women are helped through the 30% horizontal reservation instead (see Reservation). Where a candidate qualifies for more than one relaxation, only the single highest one is given; the limits are not relaxed in any other way."
            source: mpsc-132
          - table:
              caption: "Minimum physical standards (only these cadres)"
              head: ["Cadre", "Men", "Women"]
              rows:
                - ["Deputy Superintendent of Police / Assistant Commissioner of Police, Group-A", "Height 165 cm (barefoot); chest 84 cm unexpanded with at least 5 cm expansion", "Height 157 cm (barefoot)"]
                - ["Superintendent, State Excise, Group-A and Deputy Superintendent, State Excise, Group-B", "Height 165 cm; chest 79 cm unexpanded with at least 5 cm expansion", "Height 155 cm"]
            source: mpsc-018
      - id: scheme
        nav: "Exam Scheme"
        eyebrow: "Exam scheme"
        heading: "Prelim, descriptive Mains and interview"
        parts:
          - table:
              caption: "Stages and marks (Advertisement 132/2025, para 9)"
              head: ["Exam", "Combined Prelim", "Main exam", "Interview"]
              rows:
                - ["State Service exam", "400 marks", "1,750 marks", "275 marks"]
                - ["Maharashtra Veterinary Service exam", "400 marks", "400 marks", "50 marks"]
            source: mpsc-132
          - table:
              caption: "State Services Main Exam 2026 timetable (11 am – 2 pm each day)"
              head: ["Date", "Paper"]
              rows:
                - ["3 October 2026", "Paper 1 — Language"]
                - ["4 October 2026", "Paper 2 — Language"]
                - ["5 October 2026", "Paper 3 — Essay"]
                - ["10 October 2026", "Paper 4 — General Studies 1"]
                - ["11 October 2026", "Paper 5 — General Studies 2"]
                - ["17 October 2026", "Paper 6 — General Studies 3"]
                - ["18 October 2026", "Paper 7 — General Studies 4"]
                - ["31 October 2026", "Paper 8 — Optional subject"]
                - ["1 November 2026", "Paper 9 — Optional subject"]
            source: mpsc-018
          - list:
              - "The Main exam is written in the revised descriptive (essay-type) pattern."
              - "Language Papers 1 and 2 carry 300 marks each and are qualifying only: at least 25% is needed in each."
              - "Papers 3 to 9 are counted for merit — 1,750 marks — and the interview carries 275 marks."
              - "Papers 3 to 7 may be answered in Marathi or English, but one paper must be written in one language only. The optional subject and the medium chosen in the Prelim form cannot be changed later."
              - "About three candidates per post in each category are called for interview, provided they reach the minimum percentile in the written total: open 35, backward class 30, disabled 20, top-level sportsperson 20, orphan 30."
              - "Final merit = Main exam marks + interview marks; posts are then allotted by the cadre preference each candidate submits online."
            source: mpsc-018
      - id: fees
        nav: "Fees"
        eyebrow: "Fee structure"
        heading: "Exam fee by category"
        parts:
          - table:
              head: ["Candidate", "Prelim fee (132/2025)", "Main exam fee (018/2026)"]
              rows:
                - ["Unreserved (open)", "₹544", "₹544"]
                - ["Backward class, EWS, orphan or disabled", "₹344", "₹344"]
            source: mpsc-018
          - note: "Bank charges and tax are extra. The fee is not refundable. For the 2026 Main exam the challan option was withdrawn: the fee had to be paid online (debit card, credit card, net banking or UPI) by 13 September 2026."
            source: mpsc-018
      - id: reservation
        nav: "Reservation &amp; Certificates"
        eyebrow: "Reservation, cut-offs &amp; certificates"
        heading: "NCL, EWS, women's posts and domicile"
        parts:
          - list:
              - "<strong>Domicile:</strong> any reservation benefit is only for candidates who are ordinarily resident (domiciled) in Maharashtra, as defined under Section 20 of the Representation of the People Act, 1950."
              - "<strong>Non-Creamy Layer:</strong> backward-class candidates (other than SC and ST) must hold a valid NCL certificate for financial year 2025-26."
              - "<strong>EWS:</strong> the EWS claim needs an eligibility certificate for financial year 2025-26, issued before the last date of the Prelim application (20 January 2026)."
              - "<strong>Women's posts:</strong> under the Women and Child Development Department GR of 4 May 2023, open-category women and women of all backward classes no longer need an NCL certificate to claim posts reserved for open (unreserved) women. Women claiming women's posts within a backward category other than SC/ST still follow the NCL rules, and every woman claiming a women's post must state in the form that she is domiciled in Maharashtra."
              - "<strong>SEBC:</strong> reservation for the Socially and Educationally Backward Classes is applied subject to the final court decisions on the 2024 Act."
              - "<strong>Open posts:</strong> every candidate, including backward-class candidates, is considered for unreserved posts on merit, so the original category must be filled in correctly."
            source: mpsc-132
          - table:
              caption: "Example from Appendix-1 of Advertisement 132/2025: Deputy CEO / BDO (Senior grade), Group-A, 13 posts"
              head: ["Category", "SC", "ST", "VJ(A)", "NT(B)", "NT(C)", "NT(D)", "OBC", "SBC", "SEBC", "EWS", "Open", "Total"]
              rows:
                - ["Posts", "1", "—", "—", "—", "—", "1", "3", "—", "2", "4", "2", "13"]
            source: mpsc-132
          - note: "Cut-offs are not fixed in advance: the commission sets the Prelim and Main cut-off lines for each category and sub-category when it declares results."
            source: mpsc-018
      - id: documents
        nav: "Documents"
        eyebrow: "Document checklist"
        heading: "What you upload with the Main exam form"
        parts:
          - table:
              caption: "Uploads listed in Notification 018/2026 (PDF, 50–500 KB each, where applicable)"
              head: ["#", "Document"]
              rows:
                - ["1", "SSC certificate or equivalent (date of birth)"]
                - ["2", "Proof of age"]
                - ["3", "Proof of educational qualification"]
                - ["4", "Proof of belonging to a socially backward class (caste certificate)"]
                - ["5", "EWS eligibility certificate for 2025-26, dated before 20 January 2026"]
                - ["6", "Non-Creamy Layer certificate for 2025-26"]
                - ["7", "Disability certificate with UDID card, or the UDID enrolment number"]
                - ["8", "Ex-serviceman proof"]
                - ["9", "Sports certificate verification report (for sports reservation)"]
                - ["10", "Orphan certificate"]
                - ["11", "Maharashtra domicile certificate (for open women, sports, disabled, ex-serviceman or orphan claims)"]
                - ["12", "Proof of change of name (married women)"]
                - ["13", "Proof of Marathi knowledge, where applicable"]
                - ["14", "Small-family declaration (Maharashtra Civil Services rules)"]
            source: mpsc-018
          - note: "Bring all originals for verification at the interview; a candidate who cannot produce them is not interviewed. Candidates claiming disability must link their UDID card details on the MPSC profile; without that validation they cannot apply."
            source: mpsc-018
      - id: pay
        nav: "Pay &amp; Salary"
        eyebrow: "Salary"
        heading: "How pay is fixed"
        parts:
          - p: "Notification 018/2026 states only that Group-A and Group-B posts are paid at the levels of the revised (7th Pay Commission) pay matrix of the Maharashtra government. It does not print a basic pay figure for each cadre, so none is shown here."
            source: mpsc-018
          - list:
              - "Selected candidates must pass the departmental or professional exams of their department, the Hindi and Marathi language exams (unless exempt) and the computer-knowledge certificate set by the Information Technology GR of 4 February 2013."
              - "Candidates must sign the training bond fixed by the General Administration Department GR of 24 April 2015."
              - "Veterinary Officers must serve at least three years including probation, or repay the bond amount."
            source: mpsc-132
          - note: "Maharashtra uses its own S-levels (for example S-14 = ₹38,600 – ₹1,22,800 for Police Sub-Inspector, see the Police page) rather than the central government's level numbers."
      - id: posting
        nav: "Job &amp; Posting"
        eyebrow: "Job profile &amp; posting"
        heading: "Where these officers work"
        parts:
          - list:
              - "Seniority among officers appointed through the State Services exam is fixed by the Maharashtra Civil Services (seniority of direct recruits and promotees) Rules, 2015."
              - "Except Veterinary Officer (Group-A) and Desk Officer (Group-B), every cadre is allotted a Revenue division on direct appointment and on promotion, under the 2021 Revenue-division allotment rules for Group-A and Group-B posts."
              - "Duties of each cadre are published on MPSC's 'Duties and Responsibilities of various Posts' page."
            source: mpsc-132
          - links:
              - { label: "MPSC — duties of each post", url: "https://mpsc.gov.in/duties_responsibilities/10" }
    sources:
      - { id: mpsc-132, name: "MPSC — Advertisement 132/2025, Maharashtra Civil Services Gazetted Group-A & Group-B Combined Preliminary Exam 2026 (Marathi, 24 Dec 2025)", url: "https://mpsc.gov.in/adv_notification/8", covers: "posts, dates, age limits, qualification, reservation rules, NCL/EWS years, fee, exam stages, bond and post-entry conditions", checked: 2026-10-14 }
      - { id: mpsc-018, name: "MPSC — Notification 018/2026, State Services Main Examination 2026 (Marathi, 25 Aug 2026) and corrigendum of 2 Sep 2026", url: "https://mpsc.gov.in/adv_notification/8", covers: "238 posts, Main exam timetable and centres, physical standards, marks, qualifying rules, interview percentiles, fee, uploads, pay level wording", checked: 2026-10-14 }

  # ------------------------------------------------------------------ TALATHI (MPSC GROUP-C)
  - slug: talathi
    group: civil
    short: "Talathi (Gram Mahsul Adhikari)"
    body: "MPSC · Maharashtra Group-C Services Combined Exam"
    card: "Village revenue officer (Talathi, now titled Gram Mahsul Adhikari), Group-C — 1,539 posts added to MPSC's Group-C Combined Prelim 2026."
    card_facts: ["Any graduate", "1,539 posts", "Prelim on 3 Jan 2027"]
    eyebrow: "MPSC Group-C · Revenue &amp; Forest Department"
    title: "Maharashtra Talathi (Gram Mahsul Adhikari) Recruitment 2026"
    lede: "Talathi posts are no longer filled by a separate district-level Talathi Bharti. In 2026 the Revenue and Forest Department sent its 1,539 Gram Mahsul Adhikari (Talathi) vacancies to MPSC, which added them to the Maharashtra Group-C Services Combined Preliminary Exam 2026 (Advertisement 017/2026)."
    facts:
      - { label: "Qualification", value: "Degree in any discipline", source: mpsc-017-posts }
      - { label: "Talathi posts", value: "1,539 (of 5,707 in the exam)", source: mpsc-017-posts }
      - { label: "Prelim", value: "3 January 2027 · offline OMR", source: mpsc-017-date }
      - { label: "Marks", value: "Prelim 100 · Mains 400", source: mpsc-017 }
    official:
      - { label: "MPSC notifications (open 017/2026)", url: "https://mpsc.gov.in/adv_notification/8" }
      - { label: "Apply on MPSC online", url: "https://mpsconline.gov.in/candidate" }
    sections:
      - id: overview
        nav: "Overview"
        eyebrow: "Overview &amp; official source"
        heading: "How Talathi entered the MPSC Group-C exam"
        parts:
          - p: "Advertisement 017/2026 (25 June 2026) opened the Maharashtra Group-C Services Combined Preliminary Exam 2026 for 2,619 posts: Industry Inspector, Technical Assistant (Insurance), Tax Assistant, Assistant Motor Vehicle Inspector and Clerk-Typist."
            source: mpsc-017
          - p: "Under the General Administration Department GR of 5 May 2026 on streamlining recruitment, MPSC's corrigendum of 22 July 2026 added new cadres with similar qualifications. The largest is Gram Mahsul Adhikari (Talathi), Group-C, Revenue and Forest Department — 1,539 posts across the appointing authorities. With the other additions the exam now covers 5,707 posts."
            source: mpsc-017-posts
          - table:
              caption: "Cadres added on 22 July 2026"
              head: ["Department", "Post", "Posts", "Qualification"]
              rows:
                - ["Revenue and Forest", "Gram Mahsul Adhikari (Talathi), Group-C", "1,539", "Degree in any discipline from a statutory university"]
                - ["State Consumer Disputes Redressal Commission, Mumbai", "Senior Record Keeper / Senior Clerk / Record Keeper", "11", "Degree in any discipline"]
                - ["State Consumer Disputes Redressal Commission, Mumbai", "Assistant Superintendent", "11", "Degree in any discipline"]
                - ["Agriculture, Animal Husbandry, Dairy Development and Fisheries", "Assistant Fisheries Development Officer (Technical)", "254", "B.F.Sc. at least second class"]
                - ["Rationing / Food, Civil Supplies / Tribal Development / Revenue (incl. Registration and Stamps)", "Clerk-Typist", "1,273", "Any degree + typing qualification"]
            source: mpsc-017-posts
          - note: "The Prelim was first set for 25 October 2026 (offline OMR). MPSC's corrigendum of 9 September 2026 moved it to 3 January 2027 at all district centres."
            source: mpsc-017-date
      - id: eligibility
        nav: "Eligibility &amp; Age"
        eyebrow: "Eligibility &amp; age limits"
        heading: "Who can apply for Talathi"
        parts:
          - list:
              - "<strong>Citizenship:</strong> Indian citizen."
              - "<strong>Marathi:</strong> knowledge of Marathi is required."
            source: mpsc-017
          - list:
              - "<strong>Qualification:</strong> a degree in any discipline from a statutory university."
              - "<strong>Age rule:</strong> under the Talathi service-entry rules, counted on the last date of application."
            source: mpsc-017-posts
          - p: "After the extension, the age-counting date for Talathi is 10 August 2026."
            source: mpsc-017-pesa
          - table:
              caption: "Age limits printed in Advertisement 017/2026 for the original Group-C cadres (counted on 1 October 2026)"
              head: ["Candidate", "Minimum", "Maximum"]
              rows:
                - ["Open (unreserved)", "19 (18 for Tax Assistant)", "38"]
                - ["Backward class, orphan or EWS", "19", "43"]
                - ["Meritorious sportsperson (open or reserved)", "19", "43"]
                - ["Ex-serviceman — open", "19", "38 + length of service + 3 years"]
                - ["Ex-serviceman — backward class / orphan / EWS", "19", "43 + length of service + 3 years"]
                - ["Disabled (where the post is identified for disability)", "19", "45"]
            source: mpsc-017
          - note: "The Talathi corrigendum points to the Talathi service-entry rules for the age limit and does not print a separate Talathi table, so check the limits in your MPSC profile's eligibility check before paying the fee. There is no separate age relaxation for women; women get 30% horizontal reservation."
            source: mpsc-017-pesa
      - id: scheme
        nav: "Exam Scheme"
        eyebrow: "Exam scheme"
        heading: "Combined Prelim, then Combined Main"
        parts:
          - table:
              head: ["Stage", "Marks", "Notes"]
              rows:
                - ["Combined Preliminary Exam", "100", "Common for all Group-C cadres; now offline OMR-based"]
                - ["Combined Main Exam", "400", "Common for the cadres listed in the advertisement (AMVI has a separate 300-mark Main)"]
            source: mpsc-017
          - list:
              - "The advertisement planned the Prelim as a computer-based test in several sessions with normalised scores; the 16 July 2026 corrigendum switched it to the usual offline OMR mode on a single day."
              - "After the Prelim, MPSC publishes the answer key and each candidate's response sheet in the profile."
              - "Main exam admission is decided by category-wise cut-off lines; a separate Main exam form and fee follow."
            source: mpsc-017
          - p: "The Prelim date is now 3 January 2027, at all district centres."
            source: mpsc-017-date
      - id: fees
        nav: "Fees"
        eyebrow: "Fee structure"
        heading: "Exam fee by category"
        parts:
          - table:
              head: ["Exam", "Open", "Backward class / EWS / orphan", "Ex-serviceman (Group-C only)"]
              rows:
                - ["Combined Prelim", "₹394", "₹294", "₹44"]
                - ["Main exam", "₹544", "₹344", "₹44"]
            source: mpsc-017
          - note: "Bank charges and tax are extra; the fee is not refundable. After the extension, Talathi applications closed on 10 August 2026 and online fee payment on 13 August 2026; challan payment was withdrawn."
            source: mpsc-017-pesa
      - id: reservation
        nav: "Reservation &amp; PESA"
        eyebrow: "Reservation &amp; certificates"
        heading: "PESA-area Talathi posts and certificates"
        parts:
          - list:
              - "The government sent district-wise Talathi requisitions separately for <strong>PESA</strong> (Scheduled Area) and <strong>non-PESA</strong> areas, each with its own social reservation."
              - "PESA-area Talathi posts are filled only from local Scheduled Tribe candidates with the required qualification (GAD GR of 1 February 2023)."
              - "A candidate may apply for a PESA-area post only if he or she, or the spouse, parents or grandparents, have lived continuously in that district's Scheduled Area since 26 January 1950."
              - "Scheduled Tribe candidates applying for PESA-area posts must submit a Scheduled Area residence certificate issued by the Integrated Tribal Development Project office before 25 October 2026."
              - "Chandrapur district's PESA posts are for the Scheduled Tribe category."
            source: mpsc-017-pesa
          - list:
              - "Reservation is only for candidates domiciled in Maharashtra; NCL and EWS certificates must be valid for the year the advertisement asks for."
              - "Horizontal reservations in this exam include women, sportspersons, disabled, ex-servicemen, orphans, project-affected, earthquake-affected and part-time graduate employees (the last three only for Clerk-Typist posts outside Greater Mumbai)."
            source: mpsc-017
      - id: documents
        nav: "Documents"
        eyebrow: "Document checklist"
        heading: "What to upload with the Prelim form"
        parts:
          - list:
              - "Disability certificate (and UDID), ex-serviceman proof, sports certificate verification report or its acknowledgement, orphan certificate, part-time graduate employee proof, earthquake-affected and project-affected certificates — only if you claim them."
              - "Maharashtra domicile certificate if you claim open-women, sports, disability, ex-serviceman, orphan, part-time, earthquake-affected or project-affected reservation."
              - "Each file: PDF, 50–500 KB. MPSC also accepts certificates through DigiLocker under its circular of 7 May 2026."
            source: mpsc-017
          - list:
              - "For PESA-area Talathi posts: the Scheduled Area residence certificate from the Integrated Tribal Development Project office (before 25 October 2026)."
            source: mpsc-017-pesa
      - id: pay
        nav: "Pay &amp; Salary"
        eyebrow: "Salary"
        heading: "Pay of the Group-C cadres"
        parts:
          - table:
              caption: "Pay levels printed in Advertisement 017/2026 (plus DA and other allowances)"
              head: ["Post", "Pay matrix level"]
              rows:
                - ["Assistant Motor Vehicle Inspector", "S-14: ₹38,600 – ₹1,22,800"]
                - ["Industry Inspector", "S-13: ₹35,400 – ₹1,12,400"]
                - ["Technical Assistant (Insurance)", "S-10: ₹29,200 – ₹92,300"]
                - ["Tax Assistant", "S-8: ₹25,500 – ₹81,100"]
                - ["Clerk-Typist", "S-6: ₹19,900 – ₹63,200"]
            source: mpsc-017
          - note: "The Talathi corrigendum does not print the Gram Mahsul Adhikari pay level, so it is not shown here. None of these MPSC Group-C notifications mentions a fixed-pay (contract) period."
            source: mpsc-017-posts
      - id: posting
        nav: "Job &amp; Posting"
        eyebrow: "Job profile &amp; posting"
        heading: "Where a Talathi works"
        parts:
          - list:
              - "The Revenue and Forest Department sent district-wise Talathi requisitions for several appointing authorities, split into PESA and non-PESA areas."
              - "Candidates are asked for their option for PESA-area Talathi posts through the MPSC application."
            source: mpsc-017-pesa
          - list:
              - "Appointees must pass the departmental exams, the Hindi and Marathi language exams (unless exempt) and hold the computer-knowledge certificate."
            source: mpsc-017
