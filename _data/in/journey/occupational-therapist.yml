# Journey Blueprint — Occupational Therapist (BOT, NCAHP curriculum: 4 years + 1-year rotatory internship). Printed on journey-occupational-therapist.html.
# Rules, classes and the money items / sources several careers share: _data/in/journey_common.yml.
# `money_defs` / `sources` below are used only by this career. Check: node scripts/check-journey-matrix.mjs
id: occupational-therapist
v: 2
name: "Occupational Therapist (Bachelor of Occupational Therapy, NCAHP)"
search: ["occupational therapist", "occupational therapy", "bot", "bachelor of occupational therapy", "mot", "rehabilitation therapist"]
page: "occupational-therapy.html"
doubts_page: "journey-occupational-therapist.html"
gate: "Class 12 with 50% in Physics, Chemistry and Biology → appear in NEET → Bachelor of Occupational Therapy, 5 years (4 + 1-year rotatory internship) → register with NCAHP / State Council → optional 2-year MOT."
gate_source: ncahp-ot
core:
  what:
    text: "An occupational therapist helps people of all ages do everyday activities — self-care, school, work and play — after injury, illness, disability or developmental delay. Occupational therapy is regulated under the National Commission for Allied and Healthcare Professions (NCAHP) Act, 2021, whose curriculum sets the BOT course."
    source: ncahp-ot
  day:
    - "Assess how a person manages daily tasks and set therapy goals."
    - "Run therapy sessions for children with developmental needs, stroke survivors or injured workers."
    - "Recommend splints, aids and home or workplace changes."
  pay_note: "The NCAHP curriculum sets designations, not rupee pay, so no salary is printed."
  routes:
    - { title: "Class 12 → BOT", text: "Appear in NEET; 10+2 with 50% aggregate in Physics, Chemistry and Biology (Botany & Zoology); age 17 on the date of admission; medical fitness certificate.", source: ncahp-ot }
    - { title: "BOT → MOT", text: "Master of Occupational Therapy is a 2-year full-time, on-campus course; MOT is desirable for Superintendent and mandatory for Chief Occupational Therapist.", source: ncahp-ot }
    - { title: "Clinical ladder", text: "Clinical Occupational Therapist (fresh BOT) → Senior (3 years' clinical experience) → Superintendent (5 years) → Chief (8 years as Superintendent).", source: ncahp-ot }
  cost_time:
    - { label: "Course length", value: "5 years: 4 academic years + 1-year (52-week) rotatory internship of at least 2,016 hours", source: ncahp-ot }
    - { label: "Pass mark", value: "50% in theory and practical separately in every subject", source: ncahp-ot }
  cost_note: "Fees vary by college and state, so none is printed."
  challenges:
    - text: "You must pass every subject of every year before the internship starts."
      source: ncahp-ot
    - text: "Top clinical posts need an MOT and years of experience — Chief Occupational Therapist needs 8 years as Superintendent."
      source: ncahp-ot
    - text: "The internship cannot be counted as work experience."
      source: ncahp-ot
  not_for:
    - "You are impatient — progress in therapy is slow and gradual."
    - "You dislike Biology — anatomy and physiology are core."
    - "You want to prescribe medicines or operate — that is the doctor's road."
journey:
  - stages: [c8, c9]
    title: "Biology and people skills"
    do:
      - text: "BOT needs 50% in Physics, Chemistry and Biology in Class 12 — Biology is essential."
        source: ncahp-ot
    doubts:
      - q: "What does an occupational therapist do?"
        a: "Helps people manage everyday activities — self-care, school, work, play — after illness, injury or disability, or with developmental needs. The profession is regulated under the NCAHP Act, 2021."
        next: "Read the Routes list above."
        source: ncahp-ot
      - q: "Is occupational therapy the same as physiotherapy?"
        a: "No. They are separate allied health professions with separate NCAHP curricula; occupational therapy focuses on daily activities and participation."
        next: "Compare both roads below."
        source: [ncahp-ot, ncahp-bpt]
  - stages: [c10]
    title: "Pick PCB"
    do:
      - text: "Take Physics, Chemistry and Biology (Botany & Zoology) in Class 11–12."
        source: ncahp-ot
    stream: "Science with Physics, Chemistry and Biology (PCB)."
    doubts:
      - q: "Can a PCM student do BOT?"
        a: "No. The BOT rule asks for 50% in Physics, Chemistry and Biology (Botany & Zoology)."
        next: "Choose PCB."
        source: ncahp-ot
      - q: "Can I study through NIOS?"
        a: "Yes, if NIOS Senior Secondary includes English, Physics, Chemistry and Biology (Botany & Zoology) with 50% aggregate in the science subjects."
        next: "Check your subjects."
        source: ncahp-ot
  - stages: [c11, c12]
    title: "50% PCB and NEET"
    do:
      - text: "Admission to BOT is on the basis of having appeared for NEET, with 50% aggregate in Physics, Chemistry and Biology in Class 12."
        source: ncahp-ot
      - text: "You must be 17 on the date of admission and bring a medical fitness certificate."
        source: ncahp-ot
    exams:
      - { name: "NEET (UG) 2026", when: "3 May 2026 (re-exam 21 June 2026)", source: [neet-ib, neet-re] }
    money: [neet-fee]
    doubts:
      - q: "Do I need NEET for occupational therapy?"
        a: "NCAHP's BOT curriculum says admission is made on the basis of the candidate having appeared for NEET. Your state's counselling notice decides how ranks are used."
        next: "Register for NEET (UG)."
        source: ncahp-ot
      - q: "What is the minimum age?"
        a: "17 years as on the date of admission."
        next: "Check your date of birth."
        source: ncahp-ot
      - q: "I studied abroad. Am I eligible?"
        a: "Yes, if the Association of Indian Universities treats your qualification as equivalent and you passed Physics, Chemistry, Biology and English at Class 12 level."
        next: "Get an AIU equivalence certificate."
        source: ncahp-ot
  - stages: [ug]
    title: "BOT: 4 years + 1-year internship"
    do:
      - text: "Four academic years (40 weeks a year), then a 52-week full-time rotatory internship of at least 2,016 hours."
        source: ncahp-ot
      - text: "Pass every subject with 50% in theory and practical separately; only then can you start the internship."
        source: ncahp-ot
    doubts:
      - q: "How long is BOT?"
        a: "5 years — 4 academic years plus a 1-year compulsory rotatory internship."
        next: "Plan for five years."
        source: ncahp-ot
      - q: "Is the internship paid?"
        a: "NCAHP's curriculum says interns must receive a stipend of a fair amount; the amount is not fixed nationally."
        next: "Ask your college about its rate."
        source: ncahp-ot
      - q: "What if I fail a subject?"
        a: "You must clear all subjects of all years before starting the internship; the whole course must be finished within twice its prescribed duration."
        next: "Clear back papers quickly."
        source: ncahp-ot
  - stages: [grad]
    title: "Registration, MOT and the clinical ladder"
    do:
      - text: "Master of Occupational Therapy (MOT) is a full-time 2-year on-campus course."
        source: ncahp-ot
    doubts:
      - q: "Does my internship count as job experience?"
        a: "No. NCAHP says internships are part of the academic programme and cannot be counted as work experience."
        next: "Start counting experience from your first job."
        source: ncahp-ot
      - q: "Do I need an MOT?"
        a: "Not for entry. A fresh BOT graduate can be a Clinical Occupational Therapist; MOT is desirable for Superintendent and mandatory for Chief Occupational Therapist."
        next: "Plan an MOT after a few years of work."
        source: ncahp-ot
      - q: "Can I teach occupational therapy?"
        a: "Teaching posts look for at least 55% in the MOT (5% relaxation for SC / ST / PwD candidates)."
        next: "Keep 55% in your MOT."
        source: ncahp-ot
  - stages: [work]
    title: "Growing in the profession"
    do:
      - text: "Senior Occupational Therapist needs 3 years' clinical experience; Superintendent 5 years with MOT desirable; Chief 8 years as Superintendent with MOT."
        source: ncahp-ot
    doubts:
      - q: "How do I become a Chief Occupational Therapist?"
        a: "NCAHP's career map: eight years' experience as Superintendent Occupational Therapist, with an MOT."
        next: "Build experience and plan your MOT."
        source: ncahp-ot
      - q: "Can I work abroad as an occupational therapist?"
        a: "NCAHP's curriculum notes that BOT graduates are eligible for employment overseas, where their qualifications, training and experience are highly regarded."
        next: "Check the registration rules of the country you want."
        source: ncahp-ot
board_note: "Any board. You need 50% aggregate in Physics, Chemistry and Biology in Class 12."
board_source: ncahp-ot
