  - slug: table-tennis
    short: "Table Tennis"
    domain: solo
    checked: 2026-10-16
    body: "International Table Tennis Federation (ITTF) · Table Tennis Federation of India (TTFI)"
    card: "ITTF's 2026 table, net, ball and racket laws, racket control, TTFI's U11-to-senior ranking ladder and points-based selection policy, the 2026 suspension, UTT, SAI centres, awards and jobs."
    card_facts: ["Table 2.74 × 1.525 m, 76 cm high", "Net 15.25 cm · ball 40 mm, 2.7 g", "Games to 11"]
    eyebrow: "Sports Cockpit · Solo, Track &amp; Pool · ITTF Statutes 2026 · TTFI selection policy July 2026"
    title: "Table Tennis — equipment laws, ranking points &amp; national selection"
    lede: "Education Margdarshan's table tennis map for India: the table, net, ball and racket laws in the ITTF Statutes 2026, the service and scoring rules, racket control, TTFI's age-group ranking ladder and its points-based selection policy, what the August 2026 suspension of TTFI means for players, the SAI centres and the Ultimate Table Tennis league, who pays, and the awards and jobs after a medal."
    official:
      - { label: "ITTF Statutes 2026 — Laws of Table Tennis (PDF)", url: "https://documents.ittf.sport/sites/default/files/public/2026-02/2026_Statutes_v1_consolidated_clean.pdf" }
      - { label: "ttfi.org", url: "https://www.ttfi.org/" }
    facts:
      - { label: "Table", value: "<strong>2.74 m × 1.525 m</strong>, 76 cm above the floor", source: ittf-26 }
      - { label: "Net height", value: "<strong>15.25 cm</strong> along its whole length", source: ittf-26 }
      - { label: "Ball", value: "<strong>40 mm, 2.7 g</strong>, white or orange, matt", source: ittf-26 }
      - { label: "Senior selection weight", value: "<strong>50% national · 40% international</strong> · 10% selectors", source: ttfi-sel }
    sections:
      - id: rules
        nav: "Equipment laws"
        eyebrow: "Core rules &amp; equipment standards"
        heading: "Table, net, ball and racket — the 2026 Laws"
        parts:
          - table:
              caption: "Laws of Table Tennis (ITTF Statutes 2026, Chapter 2)"
              head: ["Item", "The law"]
              rows:
                - ["Table", "<strong>2.74 m long, 1.525 m wide</strong>, top <strong>76 cm</strong> above the floor; a standard ball dropped from 30 cm must bounce about <strong>23 cm</strong>"]
                - ["Net", "Top <strong>15.25 cm</strong> above the playing surface; posts 15.25 cm high, 15.25 cm outside the side line"]
                - ["Ball", "Spherical, <strong>40 mm</strong> diameter, <strong>2.7 g</strong>, plastic, white or orange and matt"]
                - ["Blade", "Any size, shape or weight, but flat and rigid; <strong>at least 85% natural wood</strong> by thickness; a carbon or glass-fibre layer may be no thicker than 7.5% of the blade or 0.35 mm, whichever is smaller"]
                - ["Rubber", "Pimpled rubber under <strong>2.05 mm</strong> or sandwich rubber under <strong>4.05 mm</strong> including adhesive; <strong>black on one side</strong>, a bright colour on the other; no physical or chemical treatment"]
                - ["Playing space", "At least <strong>14 m × 7 m × 5 m</strong> high at international events"]
            source: ittf-26
          - list:
              - "Serve: the ball rests on the open, still palm, is tossed <strong>near vertically at least 16 cm</strong> without spin, and is struck behind the end line and above the table, never hidden from the receiver."
              - "A game goes to <strong>11 points</strong> (at 10–10, first to lead by 2); a match is the <strong>best of an odd number of games</strong>."
              - "The <strong>expedite system</strong> starts after <strong>10 minutes</strong> of a game unless at least 18 points have been scored."
            source: ittf-26
          - list:
              - "Racket rubbers must be <strong>ITTF-authorised</strong>, glued so that the ITTF logo and brand are visible near the handle, with adhesives free of harmful volatile solvents."
              - "Rackets are tested at a <strong>racket control centre</strong> at ITTF world-title and Olympic events; a racket that fails before the match cannot be used. <strong>Four failures in four years</strong> bring a <strong>12-month suspension</strong>."
            source: ittf-26
      - id: recognition
        nav: "Recognition"
        eyebrow: "Institutional &amp; global recognition"
        heading: "Olympics, Asian Games, World Championships — and the UTT league"
        parts:
          - table:
              caption: "Government cash award for a senior table tennis medal (₹ lakh)"
              head: ["Event", "Gold", "Silver", "Bronze"]
              rows:
                - ["<strong>Olympic Games</strong>", "75", "50", "30"]
                - ["Asian Games / Commonwealth Games", "30", "20", "10"]
                - ["World Championships, open event (biennial)", "20", "14", "8"]
            source: myas-cash
          - note: "The World Championships team event and the Asian Cup are also on the Ministry's table tennis list. In a team event each member gets <strong>75%</strong> of the individual amount. Apply on the DBT-MIS portal within six months."
            source: myas-cash
          - p: "At the <strong>Asian Games 2026</strong>, <strong>Manush Shah and Diya Chitale</strong> won bronze in mixed doubles."
            source: air-ag26
          - p: "<strong>Ultimate Table Tennis (UTT) Season 7</strong> opened in Goa in July 2026 — the league's first edition in the state, with ITTF President Petra Sörling at the inauguration. The 87th Inter-State Junior and Youth Nationals (Dehradun, April 2026) were also held under the UTT name."
            source: "air-utt7,air-u17"
      - id: eligibility
        nav: "Age &amp; testing"
        eyebrow: "Physical benchmarks &amp; NADA clearance"
        heading: "Age groups, age tests and anti-doping"
        parts:
          - table:
              caption: "TTFI ranking categories (2026 ranking lists)"
              head: ["Group", "Categories"]
              rows:
                - ["Youth boys &amp; girls", "<strong>U11 · U13 · U15 · U17 · U19</strong>"]
                - ["Senior", "Men · Women"]
            source: ttfi-rank
          - list:
              - "SAI's <strong>Age Verification Test</strong> applies to boys up to 17 and girls up to 15: a doctor's physical examination, a dentist's examination and a TW3 X-ray. Appeals go to the <strong>Medical Appellate Board at AIIMS New Delhi</strong>."
            source: sai-avt
          - list:
              - "SAI centres admit trainees only after <strong>anthropometric, physiological and psychological tests</strong> and a battery of tests — no direct admission."
            source: sai-schemes
          - list:
              - "You must be available for testing in and out of competition and check every medicine against the <strong>Prohibited List</strong>; if no permitted treatment exists, apply to NADA for a <strong>TUE</strong>."
            source: nada-rr
      - id: roadmap
        nav: "Roadmap"
        eyebrow: "Grassroots-to-elite residential pipeline"
        heading: "From the U11 ranking event to the national team"
        parts:
          - table:
              caption: "How TTFI weighs players for national teams (policy of 14 July 2026)"
              head: ["Category", "National performance", "International performance", "Selection Committee"]
              rows:
                - ["U11 / U13", "<strong>80%</strong>", "0", "20%"]
                - ["U15 / U17 / U19", "<strong>60%</strong>", "30%", "10%"]
                - ["Senior", "<strong>50%</strong>", "40%", "10%"]
            source: ttfi-sel
          - list:
              - "National points (senior): national rank <strong>1 = 50</strong> points, falling by 5 to rank 10 = 5. Youth: rank 1 = 60, falling by 6 to rank 10 = 6."
              - "International points (senior): world rank 1–25 = <strong>40</strong>, down to 176–200 = 5; nothing beyond 200. Youth: world rank 1–30 = 30, down to 121–150 = 6."
              - "<strong>Direct selection</strong>: a senior singles player ranked <strong>30 or better</strong> in the world, or a doubles pair both ranked <strong>8 or better</strong>."
              - "A tie on points goes to the player with the higher world ranking. National rankings are updated after every ranking event."
            source: ttfi-sel
          - table:
              caption: "TTFI calendar 2026 — the national ladder"
              head: ["Event", "Dates"]
              rows:
                - ["National Ranking Championships (cadet- and senior-first rounds)", "Through August–November 2026"]
                - ["<strong>Senior National Championships 2026</strong>", "13–20 December 2026"]
                - ["<strong>Junior and Youth National Championships 2026</strong>", "22–30 December 2026"]
                - ["Sub-Junior and Cadet National Championships 2026", "16–24 January 2027"]
            source: ttfi-cal
          - warn: "On <strong>12 August 2026</strong> the Sports Ministry <strong>suspended its recognition of TTFI</strong> and asked the Indian Olympic Association to form an ad-hoc committee to run the sport. The order also cited the delay in holding the 2025 National Championships. Check with your State association that each 2026 event is still on before you travel."
            source: air-ttfi
          - list:
              - "You <strong>cannot apply</strong> to become a Khelo India athlete — scouts pick from recognised competitions; register on the <strong>National Sports Repository System</strong>."
            source: kia-guide
      - id: academies
        nav: "Centres"
        eyebrow: "Top elite academies &amp; cities"
        heading: "Where India's table tennis players train"
        parts:
          - table:
              caption: "SAI centres with table tennis"
              head: ["Centre", "What it is"]
              rows:
                - ["<strong>Kolkata</strong> NCOE, West Bengal", "Table tennis with archery, athletics, gymnastics and hockey"]
                - ["Gandhinagar NCOE, Gujarat", "Table tennis <strong>for para players</strong>, with handball, kabaddi, kho-kho, athletics, powerlifting, swimming"]
                - ["SAI Training Centres", "State-built halls with SAI coaches, ages 12–18"]
                - ["STC extension centres &amp; NSTC schools", "Non-residential training in schools and colleges that SAI adopts"]
            source: sai-schemes
          - note: "Table tennis is one of SAI's <strong>13 priority disciplines</strong>."
            source: sai-schemes
      - id: costs
        nav: "Gear &amp; cost"
        eyebrow: "Equipment costs &amp; who pays"
        heading: "Blades, rubbers and who pays the bills"
        parts:
          - list:
              - "A player's own kit is the racket: a blade that is at least 85% natural wood, two <strong>ITTF-authorised</strong> rubbers (one black), and solvent-free glue. Rubbers wear out and must be replaced — any physical or chemical treatment of the rubber is illegal."
              - "Tables, nets and balls at events must be brands currently approved by the ITTF."
            source: ittf-26
          - note: "Education Margdarshan does not print shop prices — no governing body publishes them."
          - table:
              caption: "Who pays — table tennis ladder"
              head: ["Stage", "Paid by", "What you get"]
              rows:
                - ["SAI school (NSTC/extension) trainee", "Sports Authority of India", "Coaching while you study"]
                - ["SAI centre trainee", "Sports Authority of India", "Coaching, boarding, sports science, diet"]
                - ["Khelo India athlete", "Ministry of Youth Affairs &amp; Sports", "<strong>₹6.28 lakh a year</strong> incl. ₹1.20 lakh cash"]
                - ["Junior medal prospect", "TOPS Development Group", "₹25,000 a month"]
                - ["Olympic prospect", "TOPS Core Group", "<strong>₹50,000 a month</strong> + approved training plan"]
                - ["Athlete in hardship", "PDU National Welfare Fund", "Up to ₹2.50 lakh"]
            source: "sai-schemes,pib-support"
          - list:
              - "No supplement is 100% safe and <strong>strict liability</strong> applies — food first, with a certified nutritionist."
            source: nada-supp
      - id: earnings
        nav: "Earnings &amp; jobs"
        eyebrow: "Earning channels &amp; central job quotas"
        heading: "Awards, the league and sports-quota jobs"
        parts:
          - list:
              - "Table tennis is one of the <strong>65 sports</strong> in the central sports quota for <strong>Group C</strong> posts, with up to 5 years' age relaxation (10 for SC/ST)."
              - "Medals at the Olympics, Asian Games, Commonwealth Games or World Championships can bring up to <strong>three out-of-turn promotions</strong>."
              - "These central instructions do not apply to Railways Services, the Department of Atomic Energy, the Department of Space and some DRDO technical services."
            source: dopt-2022
          - list:
              - "Medals at the <strong>Khelo India Youth Games (above-18 category)</strong>, Junior Nationals and SGFI school games now count for central sports-quota jobs."
            source: dopt-2024
          - list:
              - "<strong>Pension to Meritorious Sportspersons</strong>: ₹12,000–20,000 a month after retirement."
              - "National Sports Awards — Khel Ratna, Arjuna, Dronacharya (coaches)."
            source: pib-support
      - id: traps
        nav: "Red flags"
        eyebrow: "Disqualification traps"
        heading: "Mistakes that cost a player the match"
        parts:
          - list:
              - "<strong>A hidden or low toss</strong> — after one warning, every serve that is not clearly legal is a fault."
              - "<strong>Treated or unauthorised rubber</strong> — fail racket control before the match and the racket is out; four failures in four years means a 12-month ban."
              - "<strong>Wrong colours</strong> — one side must be black and the other a bright colour distinct from the ball."
            source: ittf-26
          - list:
              - "<strong>Skipping ranking events</strong> — up to 80% of a youth player's selection score comes from national performance."
            source: ttfi-sel
