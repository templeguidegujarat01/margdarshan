# France — study abroad sheet (shape: _data/in/abroad_common.yml header). Read 2026-10-29 (Campus France India, Campus France).
id: france
name: France
short: France
region: Europe
currency: EUR
checked: 2026-10-29
review_by: 2027-01-29
status: open
eyebrow: "Study abroad · Europe"
title: "Study in France from India"
seo_title: "Study in France from India: Etudes en France, €877.50 Rule"
description: "France from India: Etudes en France (₹20,000), new €877.50 a month funds rule from 1 Aug 2026, low public fees, 964 work hours a year and a 2-year post-study stay for Indians."
lede: "Indian students go through Campus France's mandatory 'Etudes en France' procedure before the visa. Public university fees are set nationally and are low; private business schools charge much more."
alert:
  text: "From 1 August 2026 the minimum funds for a French student visa rose to €877.50 a month (it was €615)."
  source: cf_funds
facts:
  - { label: "Funds", value: "€877.50 a month (from 1 Aug 2026)", source: cf_funds }
  - { label: "Etudes en France fee", value: "₹20,000 (from 1 Aug 2026)", source: cf_eef }
  - { label: "Work", value: "964 hours a year (60%)", source: cf_work }
  - { label: "After a master's (Indians)", value: "12 months, renewable once (24 total)", source: cf_alumni }
card:
  line: "Campus France procedure, low public fees, Indo-French post-study stay"
  psw: "Up to 2 years (Indian master's grads)"
  work: "964 hours a year"
  funds: "€877.50 a month"
tests:
  - { exam: ielts, need: "English-taught programmes set their own score; language skills are part of the Etudes en France file", source: cf_visa }
pillars:
  language_and_eligibility:
    heading: "Language and the Campus France file"
    parts:
      - points:
          - { t: "The Etudes en France file includes academic records, language skills, a CV and a statement of purpose; Campus France may hold an academic interview.", source: cf_visa }
          - { t: "Campus France does not issue any NOC; after the interview you get an automated email to go to VFS.", source: cf_visa }
  intakes_and_streams:
    heading: "When to apply"
    parts:
      - points:
          - { t: "Submit the Etudes en France file as soon as you have an unconditional acceptance letter and at least three months before the intake.", source: cf_visa }
          - { t: "A short-stay 'visa concours' lets you attend an interview or entrance test; if successful you can get a 1-year residence permit without going home.", source: cf_visa }
      - note: "Most programmes start in September; some master's and business-school programmes also start in January."
  tuition_and_living_costs:
    heading: "Fees and money"
    parts:
      - table:
          caption: "Public institution fees for non-EU students (differentiated fees)"
          head: ["Programme", "Fee per year"]
          rows:
            - ["Bachelor's (Licence)", "€2,902"]
            - ["Master's", "€3,950"]
            - ["Doctorate (PhD)", "€398"]
        source: cf_fees
      - money:
          - { item: "Minimum living funds for the visa", cur: EUR, amount: 877.5, shown: "€877.50", per: "month", source: cf_funds }
          - { item: "Bachelor's fee, public (non-EU rate)", cur: EUR, amount: 2902, per: "year", source: cf_fees }
          - { item: "Master's fee, public (non-EU rate)", cur: EUR, amount: 3950, per: "year", source: cf_fees }
          - { item: "Private schools (typical range, low end)", cur: EUR, amount: 6000, per: "year (up to €18,000+)", source: cf_fees }
      - points:
          - { t: "Etudes en France processing fee: ₹20,000 from 1 August 2026 (was ₹18,500); pay only via the official link after validation, not through an agency's link.", source: cf_eef }
          - { t: "EU students pay €178 (bachelor's), €255 (master's) and €397 (PhD). Some non-EU students pay that lower rate too — for example long-term residents, refugees, and all doctoral students. Schools under other ministries (some engineering, agriculture, culture schools) set their own fees.", source: cf_fees }
  global_scholarships:
    heading: "French government scholarships for Indians"
    parts:
      - awards:
          - { name: "France Excellence Charpak", by: "French Embassy in India", who: "Indian students admitted to a bachelor's or master's in France, plus summer-training and exchange strands", gives: "Master's award renewable once on first-year results", url: "https://www.inde.campusfrance.org/france-excellence-charpak-scholarship-program", source: cf_charpak }
          - { name: "France Excellence Eiffel", by: "French Ministry for Europe and Foreign Affairs", who: "Master's and PhD candidates nominated by a French institution", gives: "€1,181 a month (master's) or €1,800 (PhD), travel, insurance", url: "https://www.inde.campusfrance.org/eiffel_scholarship_2024", source: cf_eiffel }
          - { name: "Erasmus Mundus Joint Masters", by: "European Union", who: "Students from any country", gives: "Joint master's across EU universities; scholarships for top applicants", url: "https://www.eacea.ec.europa.eu/scholarships/erasmus-mundus-catalogue_en", source: erasmus }
      - points:
          - { t: "The Eiffel 2026 call is closed; institutions, not students, submit Eiffel applications.", source: cf_eiffel }
  application_funnel:
    heading: "The Etudes en France route"
    parts:
      - steps:
          - { title: "Create the EEF file", text: "On the Etudes en France portal: academic records, language skills, CV and SOP; fix any anomalies Campus France flags.", source: cf_visa }
          - { title: "Pay the Campus France fee", text: "After validation, through the official link.", source: cf_eef }
          - { title: "Academic interview", text: "In person with originals, if called.", source: cf_visa }
          - { title: "VFS visa application", text: "Fill the form on France-Visas and book VFS only after the automated email.", source: cf_visa }
          - { title: "Validate the VLS-TS online", text: "Within three months of arrival on the ANEF site; it is your residence permit for year one.", source: cf_visa }
  visa_chokepoints:
    heading: "The long-stay student visa (VLS-TS) in short"
    parts:
      - points:
          - { t: "Funds below €877.50 a month for applications from 1 August 2026.", source: cf_funds }
          - { t: "Not validating the VLS-TS online within three months of arrival.", source: cf_visa }
          - { t: "Renewal must be requested at the prefecture between four and two months before the visa expires.", source: cf_visa }
          - { t: "Check a private school's standing: in July 2026 the French Embassy reported the court-ordered liquidation of Collège de Paris International (2 June 2026).", source: cf_college }
  post_study_work:
    heading: "Work during and after your course"
    parts:
      - points:
          - { t: "With a valid residence permit (validated VLS-TS) you can work up to 964 hours a year (60% of the legal work year) without prior authorisation.", source: cf_work }
          - { t: "Indian students in France can extend their stay after studies for 24 months: a 12-month visa renewable once (India–France agreement of 2015).", source: cf_alumni }
          - { t: "Indian master's holders can apply for this post-study visa from a VFS centre in India within 4 years of the French master's.", source: cf_5y }
          - { t: "Indians with a master's or higher who studied at least one semester in France can get a 5-year multiple-entry short-stay Schengen visa (no work).", source: cf_5y }
