  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Is nuclear medicine technology safe as a career?"
            a: "Exposure is controlled by AERB rules, monitoring badges and safety procedures. Following them strictly is part of the job."
          - q: "Can a PCM student join B.Sc NMT?"
            a: "Most universities ask for Biology; check each university's rules."
          - q: "What is the difference between radiology and nuclear medicine?"
            a: "Radiology uses external X-rays, CT and MRI; nuclear medicine gives a small radioactive tracer and images how organs work."
