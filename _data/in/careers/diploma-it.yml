  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Is Diploma in IT the same as Diploma in Computer Engineering?"
            a: "They're closely related and overlap significantly. IT leans more toward networking, system administration and IT infrastructure support, while Computer Engineering leans more toward programming, hardware and databases — but course content varies by institute, and the distinction can be blurry in practice."
          - q: "Are networking certifications like CCNA useful alongside this diploma?"
            a: "Yes, genuinely useful. Industry-recognised certifications like CCNA (networking) or CompTIA A+/Network+ add real, demonstrable credibility to a diploma, and many employers specifically value these alongside the academic qualification."
          - q: "Can I work in cloud computing or cybersecurity with this diploma?"
            a: "It's possible as an entry point, particularly for support and junior technician roles, though specialised cloud or cybersecurity careers typically benefit from additional certifications (like AWS/Azure fundamentals or security certifications) on top of the base diploma."
          - q: "Can I join B.Tech IT after this diploma?"
            a: "Yes. Diploma holders can use lateral entry to join the second year of a B.Tech in Information Technology or Computer Science programme directly, through a state lateral entry exam or quota, skipping the first year entirely."
          - q: "What jobs can I get with just this diploma, without a further degree?"
            a: "Common roles include IT support technician, network administrator assistant, system administrator (junior), and helpdesk/technical support roles across companies with in-house IT infrastructure, plus various e-governance and Public Sector Undertaking (PSU) technical posts."
      - note: "*Fee and salary figures are indicative, based on publicly available information as of 2026, and vary significantly by state, institute and employer — always verify current figures on your state technical education board's official website."
        class: "table-note mt-lg"
