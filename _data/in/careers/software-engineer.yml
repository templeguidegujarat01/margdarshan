    heading: "Cost of each route"
    parts:
      - prose:
          - "A B.Tech CSE/IT degree commonly costs <strong>₹2-8 lakh</strong> at government institutes and <strong>₹5-20 lakh</strong> at private colleges over 4 years (see the <a href=\"cse.html\">CSE page</a> for details). A BCA is generally more affordable, often <strong>₹30,000-1,50,000 per year</strong> (see the <a href=\"bca.html\">BCA page</a>). Structured coding bootcamps, for students choosing the self-taught-plus-guided-programme route, commonly cost roughly <strong>₹50,000-3,00,000</strong> depending on the format and duration — always verify a bootcamp's actual placement outcomes and reviews carefully before enrolling, since quality varies widely across providers."
