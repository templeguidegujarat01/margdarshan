  - id: "higher"
    hid: "higher-heading"
    alt: true
    eyebrow: "Beyond the degree"
    heading: "Higher studies"
    parts:
      - prose:
          - "BAF's accounting-heavy syllabus makes CA preparation noticeably smoother, since several core concepts overlap directly with the Institute of Chartered Accountants of India (ICAI) curriculum. It's also a strong base for international qualifications like <strong>CPA (US)</strong> or <strong>ACCA (UK)</strong>, and for further study through M.Com, a Master of Business Administration (MBA) in Finance, or certifications like Chartered Financial Analyst (CFA) or Financial Risk Manager (FRM) for students who want to move toward financial analysis rather than pure accounting."
  - id: "proscons"
    hid: "pc-heading"
    eyebrow: "Honest take"
    heading: "Advantages and disadvantages"
    parts:
      - proscons:
          pros:
            - "One of the most direct undergraduate routes into CA, CPA and ACCA preparation."
            - "Genuinely available nationwide — DU, Mumbai University, Gujarat University and many more — unlike Maharashtra-concentrated BFM."
            - "Stable, evergreen demand — every company needs accounting, audit and tax compliance regardless of economic cycles."
          cons:
            - "Narrower than B.Com — less useful if you later want to pivot into general management or markets-focused finance."
            - "A lot of detail-heavy, rule-based compliance work, which doesn't suit everyone."
            - "On its own, doesn't replace CA/CPA/ACCA — the highest-paying accounting roles still need one of these added on."
  - hid: "myth-heading"
    eyebrow: "Common myths"
    heading: "Myths vs facts"
    parts:
      - myths:
          - myth: "BAF is just B.Com under a different name."
            fact: "BAF's syllabus front-loads accounting, cost accounting and taxation earlier and more intensively, making it a more direct CA-prep track than a general B.Com."
          - myth: "BAF is only available in Mumbai."
            fact: "BAF is offered nationally, including at Delhi University colleges like SRCC and Hindu College, Gujarat University, and many others — it's not confined to Maharashtra the way BFM largely is."
          - myth: "Completing BAF means you've effectively become a CA."
            fact: "BAF builds a strong foundation, but the CA Foundation, Intermediate and Final exams plus a mandatory articleship still need to be cleared separately through ICAI."
