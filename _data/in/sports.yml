  # ------------------------------------------------------------------------------------------------ Cricket
  - slug: cricket
    short: "Cricket"
    domain: ball
    body: "International Cricket Council (ICC) · Board of Control for Cricket in India (BCCI)"
    card: "ICC playing conditions, BCCI's U16-to-Ranji ladder, age-fraud bans, IPL rules 2025-27, central contracts and match fees."
    card_facts: ["U16 · U19 · U23 · Senior", "2-year ban for age fraud", "IPL fee ₹7.5 L/match"]
    eyebrow: "Sports Cockpit · Ball &amp; Team · ICC playing conditions 2025 · BCCI season 2026-27"
    title: "Cricket — formats, BCCI age groups, the IPL &amp; the road to India colours"
    lede: "Education Margdarshan's cricket map for India: the playing conditions the ICC uses for Tests, ODIs and T20Is, the BCCI's age-group ladder for 2026-27 and its age-fraud bans, the Centre of Excellence fitness system, IPL player rules, central-contract grades, match fees, and where cricket sits in government schemes and job quotas."
    official:
