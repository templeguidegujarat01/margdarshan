            - "Want a genuine low-code entry ramp — Excel, SQL and Power BI can get you started before deep Python/ML."
            - "Are comfortable with continuous upskilling, as the field's top salary tier shifts increasingly toward AI/GenAI-adjacent skills."
          mismatch:
            - "Already have strong programming skills and want to skip straight to deep ML/AI work — the <a href=\"ml.html\">ML Engineer</a> or <a href=\"ai-engineer.html\">AI Engineer</a> path may suit you better directly."
            - "Dislike translating technical findings into plain business language for stakeholders."
            - "Expect senior-level pay immediately as a fresher — the real growth here comes with climbing the ladder over a few years."
