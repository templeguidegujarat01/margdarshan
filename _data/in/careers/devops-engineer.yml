  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "What is the real difference between DevOps, SRE and Platform Engineering?"
            a: "By 2026, the DevOps role has genuinely split into three tracks. Traditional DevOps focuses on CI/CD pipeline ownership and infrastructure automation. SRE focuses on reliability ownership — SLOs, on-call rotations and incident response. Platform Engineering focuses on building internal developer platforms that other engineering teams rely on. Each needs a different skill emphasis and typically pays differently, with Platform Engineering commanding the biggest premium of the three."
          - q: "Is a Kubernetes (CKA) certification still worth getting in 2026?"
            a: "Yes, but its role has changed — it's reported to have become a baseline filter rather than a differentiator at mid-senior levels in 2026. That means it's still worth having (many roles expect it), but it alone won't set you apart the way it once did. Real, demonstrable Kubernetes project experience and pipeline work now matter more for standing out."
          - q: "What is a realistic DevOps Engineer salary in India in 2026?"
            a: "Freshers commonly earn ₹3.5-7 LPA, with service companies at the lower end and product companies at the higher end. Mid-level engineers with 3-6 years of experience typically earn ₹10-25 LPA, reaching ₹28-50 LPA at GCCs and product companies with strong cloud and Kubernetes depth. Senior SRE or Platform Engineers with 8+ years commonly earn ₹30-60+ LPA, with a very small number of Staff/Principal-level roles at global tech companies reported to go considerably higher."
          - q: "Can I move directly into DevOps as a fresher, or do I need prior experience?"
            a: "Both paths exist. Some companies do hire DevOps trainees or junior engineers directly out of college, but a genuinely common and valid route is starting as a Software Engineer, Cloud Engineer or System Administrator first, then transitioning into DevOps once you have hands-on production experience. Neither path is wrong — the direct route is faster, while the transition route often means a stronger foundation."
          - q: "Is DevOps a good career choice if I don't want on-call responsibility?"
            a: "Yes, if you choose your track deliberately. Traditional DevOps and Platform Engineering roles generally involve less direct on-call and incident-response responsibility than the SRE track specifically, which is built around reliability ownership including on-call rotations. If avoiding on-call work matters to you, steer your specialisation away from SRE and toward traditional DevOps or Platform Engineering instead."
      - note: "Figures are indicative (2026) — confirm on the official college or authority website."
        class: "table-note mt-lg"
