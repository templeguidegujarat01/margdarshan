sections:
  - id: "quick"
    hid: "quick-heading"
    alt: true
    eyebrow: "Quick answers"
    heading: "Prosthetist & Orthotist at a glance"
    intro: "Check whether your Class 12 background qualifies. Duration and pay are in the summary at the top of the page."
    parts:
      - subhead: "Can I apply from my stream?"
      - streams:
          - label: "Science"
            fit: "Eligible"
            tone: "y"
            icon: "science"
          - label: "Commerce"
            fit: "Not eligible"
            tone: "n"
            icon: "commerce"
          - label: "Arts / Humanities"
            fit: "Not eligible"
            tone: "n"
            icon: "arts"
      - note: "Class 12 Science with Physics, Chemistry and Biology or Mathematics, plus English."
  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What does a Prosthetist & Orthotist do?"
    parts:
      - overview:
          points:
            - "Prosthetists assess amputees, take measurements or scans, and build and fit artificial limbs; orthotists design braces, splints, calipers and special footwear."
            - "They work closely with doctors, physiotherapists and occupational therapists in rehabilitation teams."
            - "Modern practice uses CAD/CAM, 3D scanning, carbon-fibre and microprocessor components."
  - id: "who"
    hid: "who-heading"
    alt: true
    eyebrow: "Fit check"
    heading: "Who should become a Prosthetist & Orthotist"
    parts:
      - fit:
          match:
            - "Enjoy hands-on making, measuring and mechanics."
            - "Want direct, visible impact on patients' mobility."
            - "Are patient and good with people of all ages."
          mismatch:
            - "Want a desk-only career."
            - "Are uncomfortable with amputations or disability."
            - "Expect a large number of colleges to choose from — seats are limited."
  - id: "eligibility"
    hid: "elig-heading"
    eyebrow: "Eligibility"
    heading: "What you need, stage by stage"
    parts:
      - elig_list:
          - "Class 12 in Science with <strong>Physics, Chemistry and Biology or Mathematics</strong>, and <strong>English</strong>; minimum aggregate as the institute sets."
          - "Admission at an <strong>RCI-recognised institute</strong> — national institutes and some universities run entrance tests."
          - "Complete the course and internship, then register with <strong>RCI</strong>."
  - id: "roadmap"
    hid: "roadmap-heading"
    alt: true
    eyebrow: "Step-by-step"
    heading: "Your full path to becoming a Prosthetist & Orthotist"
    parts:
      - steps:
          - title: "Class 12 Science"
            text: "Keep English and science marks strong."
          - title: "Apply to RCI-recognised institutes"
            text: "National institutes under the Department of Empowerment of Persons with Disabilities and universities."
          - title: "BPO course"
            text: "Anatomy, biomechanics, materials and clinical P&O."
          - title: "Six-month internship"
            text: "Supervised clinical work."
          - title: "RCI registration"
            text: "Needed to practise legally."
          - title: "Practice or specialise"
            text: "Hospital, rehab centre, industry, or a master's degree."
  - id: "exams"
    hid: "exams-heading"
    eyebrow: "Registration"
    heading: "RCI recognition and registration"
    parts:
      - chips:
          - label: "RCI-recognised courses"
            text: "Only courses recognised by RCI lead to registration — check RCI's list."
            source: "rci"
          - label: "Central Rehabilitation Register"
            text: "Registration with RCI is required to practise as a rehabilitation professional."
            source: "rci"
          - label: "Diploma holders"
            text: "Some institutes allow diploma holders from RCI-approved programmes to join the BPO in a later year."
  - id: "salary"
    hid: "salary-heading"
    alt: true
    eyebrow: "Indicative figures"
    heading: "Prosthetist & Orthotist pay in India"
    intro: "Pay varies a lot by employer, city and experience; these are broad, commonly reported ranges, not guarantees."
    parts:
      - salary:
          - label: "Fresher"
            value: "Entry level"
            text: "Hospitals, NGOs and limb-fitting centres."
          - label: "Experienced"
            value: "Mid level"
            text: "Private clinics and industry pay more."
          - label: "Own practice"
            value: "Variable"
            text: "Established practitioners can earn well."
  - id: "jobs"
    hid: "jobs-heading"
    eyebrow: "Where they work"
    heading: "Employers & growth path"
    parts:
      - chips:
          - label: "Employers"
            text: "Government and private hospitals, national institutes, rehabilitation centres, NGOs, P&O companies"
          - label: "Growth path"
            text: "P&O → senior clinician → head of department / own clinic"
          - label: "Further study"
            text: "MPO (Master in Prosthetics and Orthotics) for teaching and research"
  - id: "proscons"
    hid: "pc-heading"
    alt: true
    eyebrow: "Honest take"
    heading: "Advantages and disadvantages"
    parts:
      - proscons:
          pros:
            - "Visible, life-changing patient outcomes."
            - "Mix of engineering and healthcare."
            - "Shortage of trained professionals in India."
          cons:
            - "Few institutes and seats."
            - "Physically hands-on workshop work."
            - "Government job numbers are limited."
