sections:
  - id: "quick"
    hid: "quick-heading"
    alt: true
    eyebrow: "Quick answers"
    heading: "Loco Pilot at a glance"
    intro: "Check whether your Class 12 background qualifies. Duration and pay are in the summary at the top of the page."
    parts:
      - subhead: "Can I apply from my stream?"
      - streams:
          - label: "Science"
            fit: "Eligible"
            tone: "y"
            icon: "science"
          - label: "Commerce"
            fit: "Eligible"
            tone: "y"
            icon: "commerce"
          - label: "Arts / Humanities"
            fit: "Eligible"
            tone: "y"
            icon: "arts"
      - note: "Any stream at Class 10–12; what counts is an ITI trade or engineering diploma from the notified list."
  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What does a Loco Pilot do?"
    parts:
      - overview:
          points:
            - "A Loco Pilot drives and is responsible for a train — checking the locomotive, obeying signals and speed limits, and handling faults and emergencies on the route."
            - "Assistant Loco Pilots work beside the Loco Pilot, learn routes and locomotives, and are promoted with experience and departmental tests."
            - "It is shift and roster-based work, including nights and long duties, with strict rest and safety rules."
  - id: "who"
    hid: "who-heading"
    alt: true
    eyebrow: "Fit check"
    heading: "Who should become a Loco Pilot"
    parts:
      - fit:
          match:
            - "Like machines and want a secure central government job without a degree."
            - "Stay alert and focused for long hours and follow rules exactly."
            - "Have the eyesight and health to meet medical standard A-1."
          mismatch:
            - "Wear glasses for distance or have colour-vision problems — A-1 is strict."
            - "Want fixed day-time hours and weekends off."
            - "Dislike working away from home on running duties."
  - id: "eligibility"
    hid: "elig-heading"
    eyebrow: "Eligibility"
    heading: "What you need, stage by stage"
    parts:
      - elig_list:
          - "Class 10 pass plus an <strong>ITI from NCVT/SCVT</strong> in a trade listed in the RRB notification (for example Electrician, Fitter, Mechanic Diesel), or a Course Completed Act Apprenticeship (CCAA) in those trades."
          - "Or a <strong>diploma or degree</strong> in Mechanical, Electrical, Electronics or Automobile Engineering (and other branches the notification lists) instead of ITI."
          - "Age limits and category relaxations are fixed in each RRB ALP notification — check the latest one."
          - "Medical standard <strong>A-1</strong>, including vision standards without glasses that rule out many candidates."
      - warn_box: "Check the medical standard before preparing. Candidates who fail A-1 cannot be appointed as ALP even after clearing every exam."
  - id: "roadmap"
    hid: "roadmap-heading"
    alt: true
    eyebrow: "Step-by-step"
    heading: "Your full path to becoming a Loco Pilot"
    parts:
      - steps:
          - title: "Class 10"
            text: "Any board; Maths and Science basics help in the exam."
          - title: "ITI or engineering diploma"
            text: "Pick a trade or branch named in the RRB ALP notification."
          - title: "RRB ALP CBT-1"
            text: "Screening test; marks do not count in the final merit."
          - title: "CBT-2"
            text: "Part A (maths, reasoning, science, awareness) and qualifying trade Part B."
          - title: "CBAT, documents and medical"
            text: "Psychometric aptitude test, document verification and A-1 medical."
          - title: "Training and promotions"
            text: "Initial training, then ALP; promotion to Loco Pilot goods, passenger and Mail/Express."
  - id: "exams"
    hid: "exams-heading"
    eyebrow: "Exams & licences"
    heading: "RRB ALP exam stages"
    parts:
      - chips:
          - label: "CBT-1"
            text: "Screening test of maths, reasoning, general science and general awareness; qualifying only."
            source: "rrb"
          - label: "CBT-2"
            text: "Part A counts for merit; Part B is a qualifying trade test for your ITI/diploma field."
            source: "rrb"
          - label: "CBAT"
            text: "Computer Based Aptitude Test: psychometric batteries that check suitability for train driving, with a minimum score in each battery."
            source: "rrb"
          - label: "Full exam guide"
            text: "Pattern, syllabus and vacancies are on our RRB ALP page."
  - id: "salary"
    hid: "salary-heading"
    alt: true
    eyebrow: "Official pay level"
    heading: "Loco Pilot pay in India"
    intro: "Railway pay follows the 7th Central Pay Commission matrix; running allowances and DA are added on top of basic pay."
    parts:
      - salary:
          - label: "Assistant Loco Pilot"
            value: "Level 2"
            text: "Basic pay at Level 2 of the 7th CPC matrix (₹19,900 entry basic), plus DA, HRA and running allowance."
          - label: "Loco Pilot (Goods)"
            value: "Higher level"
            text: "Promotion brings a higher pay level."
          - label: "Mail/Express Loco Pilot"
            value: "Senior running grade"
            text: "The top running grade, reached after years of service."
  - id: "jobs"
    hid: "jobs-heading"
    eyebrow: "Where they work"
    heading: "Employers & growth path"
    parts:
      - chips:
          - label: "Employer"
            text: "Indian Railways zonal railways (through RRBs); metro rail corporations hire train operators separately"
          - label: "Growth path"
            text: "ALP → Sr ALP → Loco Pilot (Shunter/Goods) → Passenger → Mail/Express → Loco Inspector"
          - label: "Related exams"
            text: "RRB Technician, RRB Group D and railway apprenticeships use similar ITI eligibility"
  - id: "proscons"
    hid: "pc-heading"
    alt: true
    eyebrow: "Honest take"
    heading: "Advantages and disadvantages"
    parts:
      - proscons:
          pros:
            - "Central government job with pension-linked benefits and running allowances."
            - "Open with ITI — no degree needed."
            - "A clear, seniority-based promotion ladder."
          cons:
            - "Very strict medical (A-1) and the CBAT knock out many candidates."
            - "Night duty, long hours and time away from home."
            - "High responsibility: safety mistakes have serious consequences."
  - hid: "myth-heading"
    eyebrow: "Common myths"
    heading: "Myths vs facts"
    parts:
      - myths:
          - myth: "Only Science-stream students can become loco pilots."
            fact: "Eligibility is Class 10 plus a notified ITI trade or engineering diploma."
          - myth: "Clearing CBT-2 is enough."
            fact: "You must also pass every CBAT battery and the A-1 medical."
  - hid: "related-heading"
    alt: true
    eyebrow: "Related careers"
    heading: "If you're considering Loco Pilot, also look at"
    parts:
      - related:
          - name: "RRB ALP Exam"
            sub: "Pattern, syllabus & dates"
            href: "rrb-alp.html"
          - name: "ITI Electrician"
            sub: "A qualifying ITI trade"
            href: "iti-electrician.html"
          - name: "ITI Fitter"
            sub: "A qualifying ITI trade"
            href: "iti-fitter.html"
          - name: "Diploma Mechanical"
            sub: "Polytechnic route"
            href: "diploma-mechanical-engineering.html"
  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "What qualification do I need to become a loco pilot?"
            a: "Class 10 plus an ITI in a trade the RRB ALP notification lists, or a diploma/degree in a listed engineering branch."
          - q: "What is the CBAT?"
            a: "The Computer Based Aptitude Test — psychometric tests of memory, concentration, perception and reaction used to check suitability for train driving. You must clear the minimum in each test."
          - q: "Can I wear glasses and become a loco pilot?"
            a: "The A-1 standard sets strict vision limits; read the medical section of the current notification and get tested before you prepare."
          - q: "How long until I drive Mail/Express trains?"
            a: "It is seniority-based and takes many years, moving through goods and passenger trains first."
      - note: "*Pay figures are indicative unless they quote an official pay level, and rules change: confirm eligibility, dates and fees on the official websites listed under Sources before you act."
        class: "table-note mt-lg"
