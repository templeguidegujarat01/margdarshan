  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What is Integrated MBA (IPM)?"
    parts:
      - overview:
          points:
            - "The IPM is a 5-year residential programme that combines an undergraduate phase with a full 2-year MBA (PGP), letting students join an IIM directly after Class 12 instead of first completing a bachelor's degree and then clearing CAT separately."
            - "<strong>IIM Indore</strong> launched it in 2011; <strong>IIM Rohtak, IIM Ranchi and IIM Shillong</strong>, among a few others, now run their own versions too."
            - "Structurally, the first three years award a Bachelor of Arts (BA) (Foundations of Management), followed by two years equivalent to the institute's regular MBA/PGP."
          more:
            - "A number of private universities — <strong>NMIMS, Symbiosis International University, Nirma University, Christ University and Amity University</strong> among them — also run their own 5-year \"integrated MBA\"-style programmes, typically structured as a Bachelor of Business Administration (BBA) followed by an MBA."
            - "These are more accessible and less expensive, but don't carry the same brand weight or placement strength as an IIM's IPM."
  - id: "who"
    hid: "who-heading"
    alt: true
    eyebrow: "Fit check"
    heading: "Who should choose Integrated MBA"
    parts:
      - fit:
          match:
            - "Already know, with real conviction, that you want a management and leadership career."
            - "Have strong quantitative and verbal aptitude and are willing to prepare seriously for Integrated Programme in Management Aptitude Test (IPMAT)."
            - "Can genuinely afford — or plan to finance via an education loan — the ₹35-45 lakh total cost at a top IIM."
          mismatch:
            - "Are still genuinely unsure between management, engineering, law or another field — a regular Undergraduate (UG) keeps that door open longer."
            - "Are considering a private university's \"integrated MBA\" mainly for the name — check its actual placement record carefully first."
            - "Would prefer to gain 2-3 years of work experience before an MBA — many recruiters and B-schools value that maturity, which IPM skips by design."
