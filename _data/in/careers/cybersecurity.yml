  - id: "fees"
    hid: "fees-heading"
    eyebrow: "Degree fees plus ongoing certification costs"
    heading: "Fees & certification costs"
    parts:
      - prose:
          - "For the B.Tech route, government-funded institutes remain the most economical: total fees for the full 4-year programme commonly fall in the <strong>₹2-8 lakh</strong> range, with private colleges typically costing <strong>₹5-15 lakh</strong> total. What's different about this field is the real, recurring cost of certifications on top of your degree — CompTIA Security+ is relatively affordable, while <strong>CEH training and exam costs commonly run ₹65,000-75,000</strong> through EC-Council approved centres, and advanced certifications like OSCP or CISSP add further cost. Budget for certifications as a genuine, ongoing part of this career, not a one-time expense."
