    heading: "What is the Draughtsman Civil trade?"
    parts:
      - overview:
          points:
            - "ITI Draughtsman Civil is a <strong>2-year</strong>, NCVT/DGT-affiliated trade under the Craftsman Training Scheme, training students to prepare building drawings, structural plans, site layouts and construction detail drawings — traditionally by hand, and increasingly using <strong>AutoCAD</strong> software, which is now a standard part of the modern syllabus."
            - "Draughtsmen work under the direction of civil engineers or architects, translating design concepts into precise technical drawings that guide actual construction."
            - "It's a genuinely useful bridge role between design and execution, though it's important to understand this trade doesn't grant the legally protected Architect or Engineer title (see the note below)."
