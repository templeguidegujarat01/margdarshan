sections:
  - id: "quick"
    hid: "quick-heading"
    alt: true
    eyebrow: "Quick answers"
    heading: "Indian Forest Service Officer at a glance"
    intro: "Check whether your Class 12 background qualifies. Duration and pay are in the summary at the top of the page."
    parts:
      - subhead: "Can I apply from my stream?"
      - streams:
          - label: "Science"
            fit: "Eligible"
            tone: "y"
            icon: "science"
          - label: "Commerce"
            fit: "Not eligible"
            tone: "n"
            icon: "commerce"
          - label: "Arts / Humanities"
            fit: "Not eligible"
            tone: "n"
            icon: "arts"
      - note: "Science at Class 12 leads to the eligible degrees (science subjects, agriculture, forestry, veterinary or engineering)."
  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What does an Indian Forest Service Officer do?"
    parts:
      - overview:
          points:
            - "IFoS officers protect forests and wildlife, manage tiger reserves and sanctuaries, run afforestation and plan forest working."
            - "They work with forest-dwelling communities, enforce forest and wildlife laws and handle human-wildlife conflict."
            - "Senior officers lead state forest departments and national environment bodies."
  - id: "who"
    hid: "who-heading"
    alt: true
    eyebrow: "Fit check"
    heading: "Who should become an Indian Forest Service Officer"
    parts:
      - fit:
          match:
            - "Love nature, wildlife and field work."
            - "Are physically fit and ready for remote postings."
            - "Want a respected All India Service career."
          mismatch:
            - "Want a city desk job."
            - "Are not prepared for a long, competitive UPSC preparation."
            - "Dislike conflict and law enforcement."
  - id: "eligibility"
    hid: "elig-heading"
    eyebrow: "Eligibility"
    heading: "What you need, stage by stage"
    parts:
      - elig_list:
          - "A bachelor's degree with at least one of <strong>Animal Husbandry & Veterinary Science, Botany, Chemistry, Geology, Mathematics, Physics, Statistics or Zoology</strong>, or a bachelor's in <strong>Agriculture, Forestry or Engineering</strong>."
          - "Age limits, attempts and relaxations as per the UPSC notice."
          - "Medical and physical standards, including the walking test specified by UPSC."
  - id: "roadmap"
    hid: "roadmap-heading"
    alt: true
    eyebrow: "Step-by-step"
    heading: "Your full path to becoming an Indian Forest Service Officer"
    parts:
      - steps:
          - title: "Class 12 Science"
            text: "PCM or PCB."
          - title: "Eligible degree"
            text: "Science subject from the list, agriculture, forestry or engineering."
          - title: "Civil Services Prelims"
            text: "Apply for IFoS in the same application; prelims screens candidates."
          - title: "IFoS Main Examination"
            text: "General English, General Knowledge and two optional subjects."
          - title: "Interview"
            text: "Personality test by UPSC."
          - title: "Training and posting"
            text: "Training, then state cadre postings."
  - id: "exams"
    hid: "exams-heading"
    eyebrow: "Exams & licences"
    heading: "UPSC exam stages"
    parts:
      - chips:
          - label: "Prelims"
            text: "Civil Services Preliminary Examination, used as the screening test."
            source: "upsc"
          - label: "IFoS Mains"
            text: "Written papers including General English, General Knowledge and two optionals."
            source: "upsc"
          - label: "Interview"
            text: "Personality test for those who qualify in the Mains."
            source: "upsc"
  - id: "salary"
    hid: "salary-heading"
    alt: true
    eyebrow: "Official pay level"
    heading: "Indian Forest Service Officer pay in India"
    intro: "IFoS is an All India Service on the 7th CPC pay matrix."
    parts:
      - salary:
          - label: "Entry"
            value: "Level 10"
            text: "Group A central services start at Level 10 of the 7th CPC pay matrix (₹56,100 entry basic), plus DA, HRA and other allowances."
          - label: "Mid career"
            value: "Higher levels"
            text: "Conservator and Chief Conservator grades."
          - label: "Senior"
            value: "Apex levels"
            text: "Principal Chief Conservator of Forests heads a state forest department."
  - id: "jobs"
    hid: "jobs-heading"
    eyebrow: "Where they work"
    heading: "Employers & growth path"
    parts:
      - chips:
          - label: "Employer"
            text: "State forest departments (state cadres) and central ministries"
          - label: "Growth path"
            text: "Assistant Conservator (training) → DCF → Conservator → CCF → PCCF"
          - label: "State services"
            text: "State forest services (ACF, Range Forest Officer) are recruited by state PSCs"
  - id: "proscons"
    hid: "pc-heading"
    alt: true
    eyebrow: "Honest take"
    heading: "Advantages and disadvantages"
    parts:
      - proscons:
          pros:
            - "Prestigious All India Service."
            - "Field-based, nature-centred work."
            - "Real conservation impact."
          cons:
            - "Very competitive UPSC process."
            - "Remote and sometimes risky postings."
            - "Long preparation time."
  - hid: "related-heading"
    alt: true
    eyebrow: "Related careers"
    heading: "If you're considering Indian Forest Service Officer, also look at"
    parts:
      - related:
          - name: "UPSC Civil Services"
            sub: "Shared prelims"
            href: "upsc-civil-services.html"
          - name: "Environmental Science"
            sub: "Climate & sustainability"
            href: "environmental-science.html"
          - name: "Agriculture Science"
            sub: "Farming & agri-tech"
            href: "agriculture-science.html"
          - name: "Geologist (UPSC)"
            sub: "Combined Geo-Scientist"
            href: "geologist.html"
  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Is the IFoS prelims separate from UPSC CSE?"
            a: "No. IFoS uses the Civil Services Preliminary Examination for screening; the Mains and interview are separate."
          - q: "Can an engineering graduate apply for IFoS?"
            a: "Yes, a bachelor's in engineering is one of the eligible degrees."
          - q: "Is there a physical test?"
            a: "Yes, candidates must meet medical and physical standards, including a walking test."
      - note: "*Pay figures are indicative unless they quote an official pay level, and rules change: confirm eligibility, dates and fees on the official websites listed under Sources before you act."
        class: "table-note mt-lg"
