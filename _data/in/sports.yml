    title: "Tennis — rules, the AITA junior circuit &amp; the road to LA28"
    lede: "Education Margdarshan's tennis map for India in simple words: the court and how a game, set and match are scored, the AITA junior ladder from Talent Series to the Nationals with its age rules, limits and entry fees, AITA's new ACE 2032 support policy, how LA28 places come from world rankings, who pays, and the awards and jobs."
