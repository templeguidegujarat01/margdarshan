    eyebrow: "Certification costs are a real, recurring line item"
    heading: "Cost of certifications"
    parts:
      - prose:
          - "A B.Tech in CSE commonly costs <strong>₹2-8 lakh</strong> at government institutes and <strong>₹5-20 lakh</strong> at private colleges (see the <a href=\"cse.html\">CSE page</a>), while a BCA is generally more affordable at <strong>₹30,000-1,50,000 per year</strong> (see the <a href=\"bca.html\">BCA page</a>). What's genuinely different about cloud engineering is the ongoing certification cost — AWS, Azure and GCP Associate-level exams commonly cost roughly <strong>₹15,000-25,000</strong> each, with Professional-level exams costing roughly double. Budget for certification renewal and upgrading as a real, recurring part of this career, similar to how cyber security professionals budget for their own certification ladder."
