  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Can I join B.Tech Mechanical Engineering after this diploma?"
            a: "Yes. Diploma holders can use lateral entry to join the second year of a B.Tech Mechanical Engineering programme directly, through a state lateral entry exam or quota, skipping the first year entirely — a well-established, common route."
          - q: "What is the difference between this diploma and a B.Tech in Mechanical Engineering?"
            a: "The diploma is a 3-year, post-Class 10 programme with a stronger practical/workshop focus, while B.Tech is a 4-year, post-Class 12 degree with deeper theoretical and design coverage. Diploma holders typically enter as technicians or junior engineers, while B.Tech graduates are eligible for a wider range of engineer-designated roles from the start."
          - q: "What is the entrance exam for this diploma?"
            a: "It varies by state — some states admit on Class 10 merit directly, while others conduct their own polytechnic entrance exam (names and patterns differ, such as JEXPO in West Bengal or DCECE in Bihar). Always check your specific state technical education board's current admission notification."
          - q: "What jobs can I get with just this diploma, without a further degree?"
            a: "Common roles include junior/diploma engineer, production supervisor, quality control technician, and maintenance engineer in manufacturing, automotive and core engineering industries, plus various government technical posts recruited through Staff Selection Commission (SSC) and railway exams."
          - q: "Is a Mechanical Engineering diploma a good choice given automation trends?"
            a: "Core mechanical skills — manufacturing, maintenance, quality control — remain in demand, though automation is changing some specific tasks. Diploma holders who add skills in CNC programming, CAD/CAM software or automation-adjacent areas tend to have stronger, more future-relevant prospects."
      - note: "*Fee and salary figures are indicative, based on publicly available information as of 2026, and vary significantly by state, institute and employer — always verify current figures on your state technical education board's official website."
