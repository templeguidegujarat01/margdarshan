            value: "₹7–14 LPA"
            text: "Reported starting range including allowances at PSUs like Non-Technical Popular Categories (NTPC), NHPC and NHAI; Maharatna companies like ONGC and IOCL are reported to go higher still."
          - label: "Specialised roles (BIM, structural, PM)"
            value: "₹12–25+ LPA"
            text: "Reported for BIM Managers, structural engineers on major projects, and construction project managers with experience — not typical for freshers."
