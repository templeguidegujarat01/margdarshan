  # ------------------------------------------------------------------------------------------------ Kabaddi
  - slug: kabaddi
    short: "Kabaddi"
    domain: ball
    body: "International Kabaddi Federation (IKF) · Amateur Kabaddi Federation of India (AKFI)"
    card: "AKFI weight and age limits for 2026, court sizes, raid rules, Nationals to PKL to Asian Games selection, PKL auction rules."
    card_facts: ["Men ≤ 85 kg · Women ≤ 75 kg", "Junior: under 20", "PKL purse ₹5 cr"]
    eyebrow: "Sports Cockpit · Ball &amp; Team · AKFI circulars 2026 · IKF rules"
    title: "Kabaddi — weight limits, raid rules, Nationals, the PKL &amp; Asian Games selection"
    lede: "Education Margdarshan's kabaddi map for India: the weight and age limits in AKFI's 2026 circulars, court sizes and raid rules, how state teams reach the Nationals and Federation Cup, how the Pro Kabaddi League feeds the India squad, the SAI centres for kabaddi, who pays, and the awards and jobs after a medal."
    official:
      - { label: "AKFI Rules of Kabaddi (PDF)", url: "https://www.indiankabaddi.org/administrator/components/com_rules/rules/d2fa88d827bea5fc12073bf9db1f10fb-Rulebook-Downloadedon08Nov2017-19MB.pdf" }
      - { label: "indiankabaddi.org", url: "https://www.indiankabaddi.org/" }
    facts:
      - { label: "Senior weight limit", value: "Men <strong>≤ 85 kg</strong> · Women <strong>≤ 75 kg</strong>; age open", source: akfi-fedcup26 }
      - { label: "Junior (2026)", value: "<strong>Under 20</strong>; boys ≤ 75 kg · girls ≤ 65 kg", source: "akfi-jr-boys26,akfi-jr-girls26" }
      - { label: "Men's match", value: "<strong>2 × 20 min</strong>, 7 on court, raid ≤ 30 s", source: akfi-rules }
      - { label: "Asian Games 2026", value: "<strong>Gold for men and women</strong>, both finals v Iran", source: air-kabaddi26 }
    sections:
      - id: rules
        nav: "Rules &amp; limits"
        eyebrow: "Core rules &amp; selection formats"
        heading: "Weight and age limits, court sizes and the raid"
        parts:
          - table:
              caption: "Weight and age limits for AKFI championships"
              head: ["Category", "Weight", "Age", "Rule source"]
              rows:
                - ["Senior men", "<strong>85 kg</strong> and below", "Open", "Senior Federation Cup circular, Feb 2026"]
                - ["Senior women", "<strong>75 kg</strong> and below", "Open", "Senior Federation Cup circular, Feb 2026"]
                - ["Junior boys", "<strong>75 kg</strong> and below", "<strong>Below 20</strong> on the last day of the event", "52nd Junior Nationals circular, Aug 2026"]
                - ["Junior girls", "<strong>65 kg</strong> and below", "<strong>Below 20</strong> on the last day of the event", "52nd Junior Nationals circular, Aug 2026"]
                - ["Sub-junior boys and girls", "<strong>55 kg</strong> and below", "16 or below on the last day of the event", "AKFI rule book"]
            source: "akfi-fedcup26,akfi-jr-boys26,akfi-jr-girls26,akfi-rules"
          - note: "The 2017 rule book printed a 70 kg junior-boys limit; the 2026 circular sets <strong>75 kg</strong>. The circular for each championship is what the weigh-in follows."
            source: "akfi-rules,akfi-jr-boys26"
          - table:
              caption: "Court and match (AKFI rule book, IKF rules)"
              head: ["Item", "Men &amp; junior boys", "Women, junior girls, sub-juniors"]
              rows:
                - ["Play field", "<strong>13 × 10 m</strong>", "12 × 8 m (sub-juniors 11 × 8 m)"]
                - ["Baulk line from mid-line", "3.75 m", "3 m"]
                - ["Bonus line", "1 m beyond the baulk line", "1 m beyond the baulk line"]
                - ["Match", "<strong>2 × 20 min</strong>, 5-min break", "2 × 15 min, 5-min break"]
            source: akfi-rules
          - list:
              - "Seven players of a team are on court at a time; the 2026 national circulars allow <strong>14 players per team</strong>."
              - "A raider must chant (the 'cant') and must <strong>cross the baulk line</strong> at least once, unless a defender is touched; a raid lasts at most <strong>30 seconds</strong>."
              - "The <strong>third raid after two empty raids</strong> is a 'do-or-die' raid."
              - "One point for every opponent put out; an <strong>All Out</strong> earns <strong>2 extra points</strong>. Catching a raider when <strong>3 or fewer</strong> defenders are left is a <strong>Super Catch</strong>."
              - "Each team gets <strong>two 30-second time-outs</strong> per half and up to <strong>five substitutions</strong>."
              - "Matches are played on mats (25–40 mm synthetic) and <strong>playing shoes are compulsory</strong>."
            source: "akfi-rules,akfi-fedcup26"
      - id: recognition
        nav: "Recognition"
        eyebrow: "Institutional &amp; global recognition"
        heading: "Asian Games, World Cups and the Pro Kabaddi League"
        parts:
          - table:
              caption: "India at the Asian Games"
              head: ["Games", "Men", "Women"]
              rows:
                - ["Incheon 2014", "Gold", "Gold"]
                - ["Jakarta 2018", "Bronze", "Silver"]
                - ["Hangzhou 2022", "Gold", "Gold"]
                - ["<strong>Aichi-Nagoya 2026</strong>", "<strong>Gold</strong> — beat Iran 40-34", "<strong>Gold</strong> — beat Iran 37-34"]
            source: "akfi-ag26,air-kabaddi26"
          - p: "AKFI also lists gold at the <strong>3rd Youth Asian Games 2025</strong> (boys and girls) and at the <strong>2nd Women's Kabaddi World Cup 2025</strong>."
            source: akfi-ag26
          - table:
              caption: "Government cash award for a senior kabaddi medal (₹ lakh, before the team-event rule)"
              head: ["Event", "Gold", "Silver", "Bronze"]
              rows:
                - ["Asian Games", "30", "20", "10"]
                - ["Asian Championship (every 2 years)", "7.5", "5", "2.5"]
            source: myas-cash
          - p: "The Kabaddi World Cup is also on the scheme's list. In team events each squad member, including reserves, gets <strong>75%</strong> of the individual amount."
            source: myas-cash
          - note: "Kabaddi is played at the Asian Games but is not an Olympic sport, so TOPS — the Olympic-podium scheme — is not its main source of money."
      - id: eligibility
        nav: "Weigh-in &amp; fitness"
        eyebrow: "Physical benchmarks &amp; anti-doping"
        heading: "Weigh-in, registration and how campers are scored"
        parts:
          - list:
              - "<strong>Online player registration on the AKFI website is mandatory</strong>; players without an online registration number or ID card cannot play."
              - "A <strong>physical Aadhaar card</strong> is compulsory for verification during the <strong>weighing</strong>."
              - "Junior entries must be uploaded with a <strong>date-of-birth proof</strong>."
            source: "akfi-fedcup26,akfi-jr-boys26"
          - table:
              caption: "How AKFI scored players for the Asian Games 2026 squad"
              head: ["Factor", "Indicative weight"]
              rows:
                - ["Exceptional performance (last 12 months)", "40%"]
                - ["Consistent performance (12–24 months)", "35%"]
                - ["Outstanding past performance (4–8 years)", "15%"]
                - ["Fitness &amp; discipline", "10%"]
            source: akfi-ag26
          - list:
              - "In the national coaching camp each player is scored on technical and tactical skill, <strong>physical fitness and endurance (agility tests, strength benchmarks)</strong>, performance in camp games, and discipline."
              - "All probables <strong>must comply with NADA and WADA anti-doping rules</strong>; an anti-doping violation is a listed reason for replacing a selected player."
            source: akfi-ag26
      - id: roadmap
        nav: "Roadmap"
        eyebrow: "Grassroots-to-elite roadmap"
        heading: "From the state team to the India jersey"
        parts:
          - table:
              caption: "The kabaddi ladder"
              head: ["Step", "Age / limit", "What happens"]
              rows:
                - ["1. SAI Training Centre", "10–18", "Team members finishing top 4 at Sub Junior/Junior Nationals, or top 2 at state level, can enter after tests"]
                - ["2. State team", "Sub-junior · junior · senior", "AKFI tells states to pick <strong>their own state's players only</strong>"]
                - ["3. Nationals", "—", "Sub Junior, Junior and Senior National Kabaddi Championships"]
                - ["4. Senior Federation Cup", "Open", "The top teams of the Senior Nationals plus the host state"]
                - ["5. Pro Kabaddi League", "Open (auction)", "Franchise contract; PKL is weighted highest for national selection"]
                - ["6. National probables and camp", "—", "Probables come from the Senior Nationals, Federation Cup and PKL; the camp is the final verification stage"]
            source: "sai-schemes,akfi-fedcup26,akfi-ag26"
          - p: "The Khelo India scheme also inducts kabaddi talent: on 23 April 2026 SAI inducted two young right raiders (born 2010 and 2011) as Khelo India Athletes on the recommendation of its Talent Identification and Development Committee, with support from 1 May 2026."
            source: akfi-kia26
      - id: academies
        nav: "Centres"
        eyebrow: "Top training academies &amp; cities"
        heading: "Where kabaddi players are trained"
        parts:
          - table:
              caption: "SAI National Centres of Excellence with kabaddi"
              head: ["Centre", "Note"]
              rows:
                - ["<strong>Kandivali (Mumbai)</strong>", "With hockey and wrestling"]
                - ["<strong>Sonepat</strong> (Haryana)", "With archery, athletics, hockey, wrestling"]
                - ["<strong>Gandhinagar</strong> (Gujarat)", "With handball, kho-kho, athletics and para sports"]
                - ["<strong>Dharamshala</strong> (Himachal)", "Kabaddi, athletics, kho-kho, volleyball — <strong>girls only</strong>"]
            source: sai-schemes
