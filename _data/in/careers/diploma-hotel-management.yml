  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Is Diploma in Hotel Management only about becoming a chef?"
            a: "No, this is a common myth. The course covers four core operational areas — Food Production (kitchen), Food & Beverage Service, Front Office, and Housekeeping — plus hotel accounting and management basics. Chef roles are one path among several, alongside front office, guest relations and hotel operations management."
          - q: "What is the difference between Diploma in Hotel Management and BHM?"
            a: "The diploma is typically a 1-3 year, practical, operations-focused course. BHM is a 3-4 year degree with deeper management theory, often accessed via the national NCHMCT JEE exam, and typically opens doors to faster progression into supervisory and management trainee roles at large hotel chains. Many diploma holders build strong careers directly in operations without a BHM."
          - q: "Do I need to clear NCHMCT JEE for a hotel management diploma?"
            a: "No. NCHMCT JEE is the national entrance exam primarily used for B.Sc in Hospitality & Hotel Administration (BHM) admissions at IHM-affiliated institutes. Most hotel management diplomas admit through their own institute-specific process or state-level entrance/merit, not NCHMCT JEE."
          - q: "Can I work on cruise ships or abroad after this diploma?"
            a: "Yes, this is a genuine and popular path, especially for students specialising in Food & Beverage Service or culinary skills. Cruise lines and international hotel chains do recruit diploma holders, though requirements (English proficiency, specific certifications, sometimes prior experience) vary by employer, so research your target cruise line or hotel group's specific requirements."
          - q: "Can I start my own restaurant or cafe after this diploma?"
            a: "Yes. The practical training in food production, costing, hygiene standards and basic hotel/restaurant accounting directly supports starting your own restaurant, cafe or catering business, which is a genuine and common path for diploma holders with an entrepreneurial interest."
      - note: "*Fee and salary figures are indicative, based on publicly available information as of 2026, and vary significantly by state, institute and employer — always verify current figures directly with your target institute."
