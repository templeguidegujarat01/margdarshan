  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What is Animation & VFX?"
    parts:
      - overview:
          points:
            - "<strong>Animation</strong> is the art of creating movement — characters, objects and environments — frame by frame, whether hand-drawn (2D) or built digitally in 3D software, used in films, TV shows, games and advertising."
            - "<strong>VFX (Visual Effects)</strong> typically means adding digital elements to real, filmed footage — creatures, explosions, environment extensions, digital doubles — to create effects that would be impossible or too costly to film practically."
            - "India has grown into a major global hub for both fields, with studios handling significant international outsourced work for Hollywood and other global productions, alongside a large domestic film, TV and gaming industry."
          more:
            - "Training is available through institutes like <strong>Whistling Woods International, MAAC (Maya Academy of Advanced Cinematics), and Arena Animation</strong>, ranging from short certificate courses to full degree programmes."
  - id: "who"
    hid: "who-heading"
    alt: true
    eyebrow: "Fit check"
    heading: "Who should choose Animation & VFX"
    parts:
      - fit:
          match:
            - "Are genuinely fascinated by how movement, effects and imagined worlds are built for screen."
            - "Are willing to invest serious time learning complex, technical software alongside creative skills."
            - "Are patient enough for detailed, often repetitive frame-by-frame or shot-by-shot work."
          mismatch:
            - "Dislike sitting through repetitive, technically detailed work — much of the job is precision-focused, not just creative bursts."
            - "Expect entry-level pay to match senior VFX artist salaries you may have read about — those come after years of specialisation."
            - "Aren't willing to constantly learn new software and techniques — tools and pipelines evolve quickly in this field."
  - id: "eligibility"
