          - label: "Freelance"
            text: "Bug-bounty research alongside a job"
  - id: "proscons"
    hid: "pc-heading"
    alt: true
    eyebrow: "Honest take"
    heading: "Advantages and disadvantages"
    parts:
      - proscons:
          pros:
            - "Fast-growing, skill-rewarding field."
            - "Open to strong self-learners."
            - "Global opportunities."
          cons:
            - "Constant learning; tools change fast."
            - "Legal risk if you cross the permission line."
            - "Entry roles can be repetitive monitoring work."
