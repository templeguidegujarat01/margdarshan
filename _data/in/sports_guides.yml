  # ------------------------------------------------------------------------------------------------ Sports bodies
  - slug: sports-bodies
    short: "Sports bodies &amp; schemes"
    eyebrow: "Sports Guide · How sport works · Who runs Indian sport"
    title: "Who runs sport in India — MYAS, SAI, IOA, federations, TOPS and NADA"
    lede: "Education Margdarshan's plain map of Indian sport: which office does what, where the money comes from, how TOPS and Khelo India pay players, what the new National Sports Governance Act changes, and the anti-doping rules every player — even a beginner — must follow, including the new world code from 1 January 2027."
    meta: "Government of India, IOA, NADA, WADA and Athletics Integrity Unit files only"
    official:
      - { label: "NADA India", url: "https://nadaindia.yas.gov.in/" }
      - { label: "Indian Olympic Association", url: "https://olympic.ind.in/" }
    facts:
      - { label: "Sports Ministry budget 2026-27", value: "<strong>₹4,479.88 crore</strong> (₹1,219 crore in 2013-14)", source: pib-cwg26 }
      - { label: "TOPS monthly allowance", value: "<strong>₹50,000</strong> core · ₹25,000 development", source: pib-cwg26 }
      - { label: "Khelo India Athlete support", value: "<strong>₹6.28 lakh a year</strong> (₹1.20 lakh as cash)", source: pib-support }
      - { label: "New world anti-doping code", value: "In force from <strong>1 January 2027</strong>", source: aiu-code27 }
    sections:
      - id: who
        nav: "Who does what"
        eyebrow: "The map"
        heading: "Who does what in Indian sport"
        parts:
          - table:
              caption: "The main bodies"
              head: ["Body", "What it does for a player"]
              rows:
                - ["<strong>Ministry of Youth Affairs &amp; Sports</strong> (MYAS, Department of Sports)", "Makes sports policy and pays for schemes like Khelo India and TOPS"]
                - ["<strong>Sports Authority of India</strong> (SAI)", "Runs National Centres of Excellence (NCOEs), SAI Training Centres and coaches"]
                - ["<strong>Indian Olympic Association</strong> (IOA)", "India's National Olympic Committee — sends India's team to the Olympics, Asian Games and Commonwealth Games"]
                - ["<strong>Paralympic Committee of India</strong>", "India's National Paralympic Committee — sends the para team"]
                - ["<strong>National Sports Federation</strong> of each sport", "Runs national championships, makes rules, picks the Indian team (example: Athletics Federation of India)"]
                - ["<strong>NADA India</strong>", "Runs anti-doping testing and education in India"]
                - ["<strong>National Sports Board</strong> and <strong>National Sports Tribunal</strong> (new)", "The Board recognises sports bodies; the Tribunal settles sports disputes"]
            source: "pib-cwg26,sai-schemes,pib-ag26fs,afi-ag26,nada-home,pib-nsga-rules"
          - note: "The Indian team for a big event is picked by the <strong>federation of that sport</strong>, and the IOA enters it. For example, the Athletics Federation of India selects India's athletics team for the Olympics, Asian Games and Commonwealth Games."
            source: afi-ag26
      - id: money
        nav: "Money &amp; schemes"
        eyebrow: "Where the money comes from"
        heading: "Government schemes that pay for players"
        parts:
          - table:
              caption: "Main schemes"
              head: ["Scheme", "Who it is for", "What you get"]
              rows:
                - ["<strong>KIRTI</strong> talent hunt", "Children aged <strong>9 to 18</strong>", "Tests at <strong>174 Talent Assessment Centres</strong> (1,87,921 tests done) to spot talent"]
                - ["<strong>Khelo India Centres</strong>", "Local players", "1,067 centres for grassroots training"]
                - ["<strong>Khelo India Athlete</strong>", "Scouted national talent", "<strong>₹6.28 lakh a year</strong> for training, coaching, education and kit — ₹1.20 lakh of it as cash"]
                - ["<strong>TOPS Development Group</strong>", "Junior medal hopes", "<strong>₹25,000 a month</strong>"]
                - ["<strong>TOPS Core Group</strong>", "Olympic and Paralympic medal hopes", "<strong>₹50,000 a month</strong> + foreign training, competitions, camps and equipment"]
                - ["<strong>PDU National Welfare Fund</strong>", "Players in money trouble", "Up to <strong>₹2.50 lakh</strong>"]
                - ["<strong>Pension</strong>", "Retired champions", "<strong>₹12,000 to ₹20,000 a month</strong>"]
            source: "pib-cwg26,pib-support"
          - list:
              - "<strong>TOPS</strong> began in September 2014 and was revamped in April 2018. As of April 2026 it supported <strong>51 Core</strong>, <strong>52 Para Core</strong> and <strong>130 Development</strong> athletes."
            source: pib-cwg26
          - list:
              - "<strong>ASMITA</strong> women's leagues: by Dec 2024, 766 competitions in 20 sports with <strong>83,763 women players</strong>."
              - "<strong>RESET</strong> (from 29 August 2024) trains <strong>retired players</strong> for new jobs."
            source: pib-ye24
          - links:
              - { label: "Cash awards for medals (sports hub)", url: "sports-hub.html" }
              - { label: "Sports-quota jobs guide", url: "niche-careers/sports.html" }
      - id: law
        nav: "New rules &amp; policy"
        eyebrow: "New law and policy"
        heading: "The National Sports Governance Act and the new sports policy"
        parts:
          - list:
              - "Parliament passed the <strong>National Sports Governance Bill</strong> and the <strong>National Anti-Doping (Amendment) Bill</strong> on <strong>12 August 2025</strong>."
            source: pib-nsga-pass
          - list:
              - "The <strong>National Sports Governance Act, 2025</strong> was notified on 18 August 2025. Its first parts came into force on <strong>1 January 2026</strong>: rules for the National Olympic Committee, National Paralympic Committee and the sports federations, the National Sports Board and the National Sports Tribunal."
            source: pib-nsga-start
          - list:
              - "The <strong>National Sports Board</strong> (a chairperson and two members) gives <strong>recognition</strong> to sports bodies and checks that they follow governance, money and ethics rules."
              - "The <strong>National Sports Tribunal</strong> settles sports disputes — faster and cheaper than ordinary courts — with an online portal and virtual hearings."
            source: pib-nsga-rules
          - list:
              - "The <strong>National Sports Policy 2025</strong> (Khelo Bharat Niti) replaced the 2001 policy. It aims at excellence up to the <strong>2036 Olympics</strong>, joins sport with school education under NEP 2020, and supports dual careers, women, tribal communities and persons with disabilities."
            source: pib-nsp25
          - warn: "Before you pay any academy or association, check that the federation of your sport is recognised. Railways and CRPF count results only from Ministry-recognised federations (or the IOA's National Games)."
            source: "rrc-wr26,crpf26"
      - id: doping
        nav: "Anti-doping"
        eyebrow: "Clean sport"
        heading: "Anti-doping — rules every player must know"
        parts:
          - list:
              - "<strong>NADA India</strong> is an autonomous body under the Sports Ministry. It runs testing, education and <strong>TUEs</strong>, and its rules apply to <strong>everyone</strong> — players and their coaches, doctors and support staff."
              - "Saw doping? Report it to <strong>speakup-nada@gov.in</strong> — your identity is protected."
            source: nada-home
          - list:
              - "<strong>Strict liability</strong>: if a banned substance is in your sample, you are responsible — even if it came from a supplement. <strong>No supplement is 100% safe</strong>; eat food first and talk to a qualified nutritionist."
            source: nada-supp
          - list:
              - "You must be <strong>available for testing</strong> and check every medicine against the <strong>Prohibited List</strong>. If you truly need a banned medicine, apply for a <strong>TUE</strong> (Therapeutic Use Exemption)."
            source: nada-rr
          - table:
              caption: "The 2027 World Anti-Doping Code — what changes for you"
              head: ["Change", "What it means"]
              rows:
                - ["In force", "<strong>1 January 2027</strong>; the Code is updated about every 6 years"]
                - ["Who it covers", "Players at <strong>every level</strong> — international, national and even recreational — plus coaches, trainers, doctors and <strong>parents</strong>"]
                - ["Protected Persons", "Players <strong>under 16</strong> (and 16–18-year-olds not in a testing pool) get extra protection"]
                - ["Faster TUEs", "A decision within <strong>21 days</strong> of a complete TUE application"]
                - ["TUEs carry over", "A national TUE is <strong>automatically recognised</strong> by your world federation when you go international"]
            source: aiu-code27
          - links:
              - { label: "World Anti-Doping Code (WADA)", url: "https://www.wada-ama.org/en/what-we-do/world-anti-doping-code" }
      - id: doubts
        nav: "Quick doubts"
        eyebrow: "Quick doubts"
        heading: "Straight answers"
        parts:
          - qa:
              q: "How do I get into TOPS?"
              a: "TOPS is for India's <strong>Olympic and Paralympic medal hopes</strong> (Core) and <strong>top juniors</strong> (Development). You cannot apply as a beginner — you are picked on results at the national and international level. The usual road is state and national medals, then a Khelo India Athlete place, then TOPS."
            source: "pib-cwg26,pib-ki-revamp"
          - qa:
              q: "Can a cough syrup or protein powder get me banned?"
              a: "It can. Under <strong>strict liability</strong> you are responsible for anything in your sample. Check every medicine against the Prohibited List, ask for a <strong>TUE</strong> if you need a banned medicine, and remember that <strong>no supplement is 100% safe</strong>."
            source: "nada-supp,nada-rr"
    sources:
