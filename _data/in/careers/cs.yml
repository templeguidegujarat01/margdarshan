            value: "₹3–8 LPA"
            text: "Better training placements (listed companies, law firms) push offers higher."
          - label: "Mid-career (4–8 yrs)"
            value: "₹10–20 LPA"
            text: "Faster growth with SEBI, FEMA, IBC or ESG specialisation."
          - label: "Senior / KMP"
            value: "₹30–60 LPA+"
            text: "Company Secretary & Compliance Officer roles in large listed companies pay the most, occasionally crossing ₹1 crore."
      - note: "CS professionals who add a Chartered Accountant (CA), Bachelor of Laws (LLB) or Master of Business Administration (MBA) qualification, or specialise in SEBI filings, FEMA advisory or insolvency resolution, typically command a noticeable premium over generalist compliance roles. ICSI also has mutual recognition arrangements with governance bodies in the UK, Singapore and elsewhere, opening international opportunities for experienced professionals."
