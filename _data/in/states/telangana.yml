# Telangana State Exam & Career Hub — one data sheet for the cockpit (state/telangana/index.html) and every
# exam page under state/telangana/. Rendered by _includes/state-cockpit.html and _includes/state-exam.html;
# checked by scripts/check-in-data.mjs (state sheets block).
#
# Rules for this sheet (same as the other state sheets):
#   - Every fact part carries `source: <id>`; the id must be listed under that exam's `sources`.
#   - TG ECET (read 2026-10-31): the ECET-2026 notification, instruction booklet and pattern of examination.
#   - TG PGECET (read 2026-10-31): the PGECET-2026 general information, instructions, dates, schedule and paper list.
#   - Sources are the official files themselves (read 2026-10-18): TGPSC Group-I Notification 02/2024 and Group-II
#     Notification 28/2022 with their provisional selection notifications of September 2025; the TSLPRB police
#     notifications of 29 Jul 2026, the supplementary notifications of 15 Aug and 10 Sep 2026 and the press note of
#     17 Sep 2026; the TG EAPCET-2026 notification and instruction booklet; and the POLYCET-2026 notification and
#     instruction booklet of SBTET Telangana. Nothing comes from coaching or news sites.
#   - The Commission still uses its old TSPSC file names; the body is now the Telangana Public Service Commission
#     (TGPSC). No new Group-I or Group-II notification had been issued when we checked.
#   - Section ids are the same on every exam page: overview, eligibility, scheme, fees, reservation,
#     documents, pay, posting (+ sources, drawn automatically).
state:
  id: telangana
  name: Telangana
  checked: 2026-10-18

cockpit:
  eyebrow: "State Exam &amp; Career Hub · Telangana"
  title: "Telangana Exam &amp; Career Hub"
  intro:
    - "Every major Telangana government recruitment and admission route on one screen: TGPSC Group-I and Group-II services, police constables and Sub-Inspectors through the Telangana State Level Police Recruitment Board (TSLPRB), TG EAPCET for engineering, agriculture and pharmacy, TG ECET for lateral entry, TG PGECET for M.E. / M.Tech, and TG POLYCET for diplomas after Class 10. Each page is built only from the official notification or instruction booklet, and every fact links back to that file."
    - "Telangana fills 95% of its zonal and multi-zonal posts with local candidates under the Presidential Order 2018 (G.O.Ms.No.124), where 'local' depends on where you studied from Class I to VII. In admissions, 85% of seats are for local candidates of the Osmania University area. SC candidates now need certificates under the 2025 sub-classification (SC Group I, II and III), and ST reservation in jobs is 10%."
  facts:
    - { label: "Recruitment nodes", value: "TGPSC Group-I &amp; II · TG Police" }
    - { label: "Admission nodes", value: "TG EAPCET · KNRUHS MBBS/BDS · ECET · PGECET · POLYCET" }
    - { label: "Next exam", value: "Police SI prelim 29 Nov · PC 20 Dec 2026" }
    - { label: "Last checked", value: "18 Oct 2026" }
  groups:
    - id: civil
      eyebrow: "Civil recruitment &amp; administrative"
      heading: "Government recruitment exams"
      intro: "Group-I and Group-II services through the Telangana Public Service Commission (TGPSC), and police constables, Sub-Inspectors, fire and prison staff through the Telangana State Level Police Recruitment Board (TSLPRB)."
      exams: [tspsc, police]
    - id: academic
      eyebrow: "Academic admissions"
      heading: "Admission routes after Class 10, 12 and B.Tech"
      intro: "MBBS and BDS on NEET UG rank through KNRUHS; B.Tech, B.Pharmacy, agriculture and allied degrees through TG EAPCET and M.E. / M.Tech, M.Pharm and M.Arch through TG PGECET (both run by JNTU Hyderabad), lateral entry to 2nd-year B.Tech for diploma holders through TG ECET (Osmania University) — all for the Telangana Council of Higher Education — and polytechnic, agriculture and veterinary diplomas through TG POLYCET (State Board of Technical Education and Training)."
      exams: [eapcet, ecet, pgecet, polycet, neet-ug]
  compare_note: "Fees, age limits and dates are from the latest notification of each body. They change every cycle, so always open the current notification before applying."
  portals_note: "TGPSC notifications are on websitenew.tgpsc.gov.in (One Time Registration at otr.tgpsc.gov.in); police recruitment on tgprb.in; TG EAPCET on eapcet.tgche.ac.in; TG PGECET on pgecet.tgche.ac.in; TG POLYCET on polycet.sbtet.telangana.gov.in. Only use these official addresses."
  portals:
    - { label: "Telangana Public Service Commission (TGPSC)", url: "https://websitenew.tgpsc.gov.in/" }
    - { label: "Telangana State Level Police Recruitment Board (TSLPRB)", url: "https://www.tgprb.in/" }
    - { label: "TG EAPCET (JNTU Hyderabad)", url: "https://eapcet.tgche.ac.in/" }
    - { label: "TG PGECET (JNTU Hyderabad)", url: "https://pgecet.tgche.ac.in/" }
    - { label: "TG POLYCET (SBTET Telangana)", url: "https://polycet.sbtet.telangana.gov.in/" }

exams:
  # ------------------------------------------------------------------ KNRUHS — MBBS / BDS CONVENOR QUOTA (read 31 Oct 2026)
  - slug: neet-ug
    group: academic
    short: "KNRUHS — MBBS &amp; BDS Competent Authority Quota (NEET UG)"
    body: "Kaloji Narayana Rao University of Health Sciences (KNRUHS), Warangal"
    card: "KNRUHS fills the Competent Authority quota — government college seats after the 15% All India quota, and Category A seats in private colleges — on NEET UG rank. Only Telangana local candidates (4 years of study or residence) may apply; joining needs a ₹20 lakh discontinuation bond."
    card_facts: ["Telangana local only", "Fee ₹4,000 / ₹3,200", "₹20 lakh bond"]
    eyebrow: "KNRUHS · MBBS &amp; BDS"
    title: "Telangana NEET UG Counselling 2026 — KNRUHS MBBS &amp; BDS Competent Authority Quota, Local Rule, Reservation &amp; Bond"
    lede: "Kaloji Narayana Rao University of Health Sciences admits students to MBBS and BDS under the Competent Authority (convenor) quota in all affiliated colleges, on NEET UG 2026 rank, under the 2017 admission rules (G.O.Ms.No. 114) as amended up to G.O.Ms.No. 150 of 2025. This page follows the KNRUHS prospectus for 2026-27 (notified 4 Aug 2026)."
    facts:
      - { label: "Merit", value: "NEET UG 2026 rank (+ NCC grace marks)", source: tg-pros }
      - { label: "Local rule", value: "4 consecutive years of study / residence in Telangana", source: tg-pros }
      - { label: "Registration fee", value: "₹4,000 OC/BC · ₹3,200 SC/ST", source: tg-pros }
      - { label: "Bond", value: "₹20 lakh discontinuation bond", source: tg-pros }
    official:
      - { label: "KNRUHS", url: "https://www.knruhs.telangana.gov.in/" }
      - { label: "MBBS / BDS CQ prospectus 2026-27 (PDF)", url: "https://www.knruhs.telangana.gov.in/wp-content/uploads/notifications/20260805140233_KNRUHS-MBBS-BDS-ADMISSIONS-UNDER-COMPETENT-AUTHORITY-QUOTA-FOR-THE-AY-2026-27-PROSPECTUS.pdf" }
    sections:
      - id: overview
        nav: "Overview"
        eyebrow: "Overview &amp; official source"
        heading: "The Competent Authority quota in every affiliated college"
        parts:
          - p: "The Competent Authority quota covers seats in government medical and dental colleges after the 15% All India quota, <strong>Category A</strong> seats in private unaided non-minority and minority medical colleges and private non-minority dental colleges, and the Army College of Dental Sciences, Secunderabad. The seat matrix is shown before web options; new seats join later phases."
            source: tg-pros
          - table:
              caption: "2026-27 registration"
              head: ["Step", "Date"]
              rows:
                - ["Notification", "4 Aug 2026"]
                - ["Online registration and certificate upload (tsmedadm.tsche.in)", "5 Aug 2026, 6 am – 12 Aug 2026, 6 pm"]
                - ["Merit lists, web options", "Notified later on the KNRUHS website"]
            source: tg-pros
      - id: eligibility
        nav: "Eligibility &amp; Local Rule"
        eyebrow: "Who can apply"
        heading: "NEET cut-off, PCB marks and the Telangana local rule"
        parts:
          - table:
              caption: "NEET UG 2026 cut-off for KNRUHS"
              head: ["Category", "Percentile", "Score"]
              rows:
                - ["General / UR / EWS", "50th", "213"]
                - ["UR / EWS with disability", "45th", "194"]
                - ["SC / ST / BC (incl. their PwD)", "40th", "177"]
            source: tg-pros
          - list:
              - "Intermediate (10+2) with Physics, Chemistry, Biology / Biotechnology and English: 50% in science subjects for OC / EWS, 40% for BC / SC / ST, 45% for OC / EWS with disability. At least 17 years old on 31 Dec 2026."
              - "Indian nationals, or PIO / OCI cardholders whose status was issued before 4 March 2021."
              - "<strong>Local rule:</strong> studied in Telangana for 4 consecutive academic years ending with the qualifying exam year, or — if not in school — lived in Telangana for 4 years before the exam and sat it in Telangana. Study outside the state is excused for children of Telangana government employees, Telangana-cadre All India Service officers, defence / CAPF personnel with a Telangana home town and Telangana PSU employees, for the matching years."
              - "Domiciles of other states are <strong>not eligible</strong>."
            source: tg-pros
      - id: scheme
        nav: "Counselling"
        eyebrow: "Counselling process"
        heading: "Upload once, then web options in phases"
        parts:
          - list:
              - "Register online and upload scans of original certificates; they are verified once for all phases. Incomplete forms are rejected."
              - "A provisional merit list on NEET UG 2026 rank, then a final list after grievances; web options are exercised separately for MBBS and for BDS."
              - "NCC cadets get grace marks added to their NEET score: 7% (Republic Day Camp), 5% (Thal / Vayu / Nau Sainik Camp), 3% (NCC 'B' certificate)."
              - "Download the provisional allotment order after paying the ₹12,000 university fee; originals are verified by the college's admission committee at joining."
            source: tg-pros
      - id: fees
        nav: "Fees"
        eyebrow: "Registration &amp; university fees"
        heading: "₹4,000 to register, ₹12,000 university fee"
        parts:
          - table:
              head: ["Item", "Amount"]
              rows:
                - ["Registration &amp; processing fee — OC / BC", "₹4,000 (non-refundable)"]
                - ["Registration &amp; processing fee — SC / ST", "₹3,200 (non-refundable)"]
                - ["University fee to download the allotment order", "₹12,000"]
            source: tg-pros
          - note: "Tuition fees for 2026-27 follow the Government of Telangana's orders."
            source: tg-pros
      - id: reservation
        nav: "Reservation"
        eyebrow: "Telangana reservation"
        heading: "BC 29%, SC 15%, ST 10%, women 33%"
        parts:
          - table:
              caption: "Vertical reservation"
              head: ["Group", "Share", "Sub-groups"]
              rows:
                - ["Backward Classes", "29%", "BC-A 7 · BC-B 10 · BC-C 1 · BC-D 7 · BC-E 4"]
                - ["Scheduled Castes", "15%", "Group 1 – 1 · Group 2 – 9 · Group 3 – 5"]
                - ["Scheduled Tribes", "10%", ""]
            source: tg-pros
          - list:
              - "<strong>Women:</strong> 33% of seats in each category are guaranteed for women unless they already win that many on merit."
              - "<strong>Horizontal:</strong> Children of Armed Personnel 1%, Persons with Disabilities 5%, Police Martyrs' Children 0.25%."
              - "<strong>EWS</strong> reservation applies only to the specially sanctioned EWS seats in 7 government colleges (Gandhi, Kakatiya, Siddipet, Mahabubnagar, Nizamabad, RIMS Adilabad, ESIC Hyderabad)."
              - "Competent Authority seats in private minority medical colleges are for Muslim minority candidates only; one BDS seat at Government Dental College, Hyderabad is for an Anglo-Indian candidate; 7 MBBS seats at GMC Ramagundam (Singareni) are for children of Singareni employees."
            source: tg-pros
      - id: documents
        nav: "Documents"
        eyebrow: "Document checklist"
        heading: "Integrated Community Certificate and the bonds"
        parts:
          - list:
              - "Reserved categories need the Integrated Community Certificate from the Telangana revenue authorities; EWS needs a 2026-27 certificate from the Tahsildar."
              - "PwD candidates appear before the university's Medical Board with the NEET score card, a permanent UDID card and the NMC affidavits."
              - "At joining: originals, a notarised genuineness affidavit, the discontinuation bond and an anti-drug undertaking."
            source: tg-pros
      - id: pay
        nav: "Bond &amp; Exit"
        eyebrow: "Discontinuation bond"
        heading: "₹20 lakh if you leave after the cut-off date"
        parts:
          - p: "You cannot discontinue after the notified cut-off date. Every selected candidate signs a <strong>₹20,00,000</strong> bond on ₹100 stamp paper with a parent; leaving after joining or after the second phase is announced forfeits the bond and debars the candidate for three years."
            source: tg-pros
      - id: posting
        nav: "After Allotment"
        eyebrow: "After allotment"
        heading: "Join within the date, or lose the seat"
        parts:
          - p: "Selected candidates join the allotted college by the set date with originals and bonds and pay the tuition fee; otherwise the admission is cancelled automatically."
            source: tg-pros
          - links:
              - { label: "NEET UG", url: "neet-ug.html" }
              - { label: "TG EAPCET", url: "state/telangana/eapcet.html" }
              - { label: "MBBS college finder", url: "colleges-mbbs.html" }
    sources:
      - { id: tg-pros, name: "KNRUHS — Prospectus for admission into MBBS and BDS under Competent Authority Quota, 2026-27 (notified 4 Aug 2026)", url: "https://www.knruhs.telangana.gov.in/wp-content/uploads/notifications/20260805140233_KNRUHS-MBBS-BDS-ADMISSIONS-UNDER-COMPETENT-AUTHORITY-QUOTA-FOR-THE-AY-2026-27-PROSPECTUS.pdf", covers: "seat scope, dates, PCB marks, age, NEET cut-off scores, local rule and exceptions, reservation shares, women, horizontal quotas, EWS colleges, minority / Anglo-Indian / Singareni seats, NCC grace marks, fees, documents, bonds", checked: 2026-10-31 }
  # ------------------------------------------------------------------ TGPSC GROUP-I & GROUP-II
  - slug: tspsc
    group: civil
    short: "TGPSC (TSPSC) Group-I &amp; Group-II Services"
    body: "Telangana Public Service Commission"
    card: "Telangana's state services: Deputy Collector, DSP, Commercial Tax Officer and fifteen other Group-I posts (Notification 02/2024, 563 posts), and Naib Tahsildar, ASO, Mandal Panchayat Officer and other Group-II posts (Notification 28/2022, 783 posts)."
    card_facts: ["Group-I 02/2024: 563 posts · selection Sep 2025", "Group-II 28/2022: 783 posts", "No new Group-I/II notice yet"]
    eyebrow: "TGPSC · Group-I &amp; Group-II"
    title: "TGPSC (TSPSC) Group-I 02/2024 &amp; Group-II 28/2022 — Posts, Age, Scheme, Local Zones, Status"
    lede: "The Telangana Public Service Commission (TGPSC, formerly TSPSC) fills its senior state services through Group-I and its middle-level posts through Group-II. This page follows the latest notifications of both — Group-I 02/2024 (563 posts) and Group-II 28/2022 (783 posts) — and their provisional selection notifications of September 2025."
    facts:
      - { label: "Group-I", value: "563 posts · mains 21–27 Oct 2024", source: tg1sel }
      - { label: "Group-II", value: "783 posts · exam 15–16 Dec 2024", source: tg2sel }
      - { label: "Group-I age", value: "18–46 (DSP, Jails, Excise 21/18–35)", source: tg1 }
      - { label: "Fee", value: "₹200 + ₹120 exam fee (unemployed exempt)", source: tg1 }
    official:
      - { label: "TGPSC website", url: "https://websitenew.tgpsc.gov.in/" }
      - { label: "All direct-recruitment notifications", url: "https://websitenew.tgpsc.gov.in/directRecruitment" }
    sections:
      - id: overview
        nav: "Overview"
        eyebrow: "Overview &amp; official source"
        heading: "Both cycles at provisional selection"
        parts:
          - table:
              caption: "Group-I Services — Notification 02/2024 (19 Feb 2024)"
              head: ["Post", "Posts", "Age (1 Jul 2024)", "Scale of pay (₹)"]
              rows:
                - ["Deputy Collector", "45", "18–46", "58,850 – 1,37,050"]
                - ["Deputy Superintendent of Police Cat-II", "115", "21–35", "58,850 – 1,37,050"]
                - ["Commercial Tax Officer", "48", "18–46", "58,850 – 1,37,050"]
                - ["Regional Transport Officer", "4", "21–46", "54,220 – 1,33,630"]
                - ["District Panchayat Officer", "7", "18–46", "54,220 – 1,33,630"]
                - ["District Registrar", "6", "18–46", "54,220 – 1,33,630"]
                - ["Deputy Superintendent of Jails (Men)", "5", "18–35", "54,220 – 1,33,630"]
                - ["Assistant Commissioner of Labour", "8", "18–46", "54,220 – 1,33,630"]
                - ["Assistant Excise Superintendent", "30", "21–35", "51,320 – 1,27,310"]
                - ["Municipal Commissioner Grade-II", "41", "18–46", "51,320 – 1,27,310"]
                - ["District Social / BC / Tribal Welfare Officers", "3 / 5 / 2", "18–46", "54,220 – 1,33,630"]
                - ["District Employment Officer", "5", "18–46", "51,320 – 1,27,310"]
                - ["Administrative Officer (Medical &amp; Health)", "20", "18–46", "51,320 – 1,27,310"]
                - ["Asst. Treasury Officer / Asst. Accounts Officer", "38", "18–46", "51,320 – 1,27,310"]
                - ["Assistant Audit Officer", "41", "18–46", "51,320 – 1,27,310"]
                - ["Mandal Parishad Development Officer", "140", "18–46", "51,320 – 1,27,310"]
                - ["Total", "563", "", ""]
            source: tg1
          - p: "Group-I 02/2024 replaced the cancelled Notification 04/2022. TGPSC issued the provisional selection list on the basis of the mains held 21–27 October 2024 and the General Ranking List of 30 March 2025."
            source: tg1sel
          - warn: "The Group-I selection list says it is subject to the outcome of Writ Appeal No. 1066 of 2025 and batch cases, and will be changed if court orders require it."
            source: tg1sel
          - p: "<strong>Group-II 28/2022</strong> (783 posts) was selected on the written exam of 15–16 December 2024 and the General Ranking List of 11 March 2025; TGPSC published the provisional selection notification in September 2025."
            source: tg2sel
          - note: "When we checked on 18 October 2026, TGPSC's list of direct-recruitment notifications showed 2026 notices for individual departments but no new Group-I or Group-II notification."
            source: tglist
      - id: eligibility
        nav: "Eligibility &amp; Age"
        eyebrow: "Eligibility &amp; age limits"
        heading: "A degree and age up to 46 (Group-I)"
        parts:
          - list:
              - "<strong>Qualification:</strong> a bachelor's degree for most Group-I posts (some need a specific degree as per the service rules), held on the date of notification."
              - "<strong>Group-I age (1 Jul 2024):</strong> minimum 18 (21 for DSP, RTO and Assistant Excise Superintendent); maximum 46, but 35 for DSP, Deputy Superintendent of Jails and Assistant Excise Superintendent. The general limit was raised from 44 to 46 by G.O.Ms.No.30 of 8 Feb 2024."
              - "<strong>Relaxation:</strong> 5 years for SC, ST, BC and EWS; 10 years for persons with disabilities; Telangana government employees up to 5 years of service; ex-servicemen and NCC instructors 3 years plus service."
            source: tg1
          - list:
              - "<strong>Group-II age (1 Jul 2022):</strong> 18 to 44 (raised from 34 by G.O.Ms.No.42 of 2022); Prohibition &amp; Excise Sub-Inspector 21 to 30. A degree is needed for the posts."
            source: tg2
      - id: scheme
        nav: "Exam Scheme"
        eyebrow: "Exam scheme &amp; marking"
        heading: "Group-I: 900-mark mains, no interview in the scheme"
        parts:
          - table:
              caption: "Group-I scheme (G.O.Ms.No.55 of 2022 as amended in 2024)"
              head: ["Stage / paper", "Time", "Marks"]
              rows:
                - ["Preliminary: General Studies &amp; Mental Ability, 150 MCQs", "2½ h", "150"]
                - ["Mains: General English (qualifying, SSC standard)", "3 h", "150"]
                - ["Paper I — General Essay", "3 h", "150"]
                - ["Paper II — History, Culture and Geography", "3 h", "150"]
                - ["Paper III — Indian Society, Constitution and Governance", "3 h", "150"]
                - ["Paper IV — Economy and Development", "3 h", "150"]
                - ["Paper V — Science &amp; Technology and Data Interpretation", "3 h", "150"]
                - ["Paper VI — Telangana Movement and State Formation", "3 h", "150"]
                - ["Total counted for merit", "", "900"]
            source: tg1
          - list:
              - "The prelim shortlists 50 times the vacancies in each multi-zone for the mains; it is in English, Telugu and Urdu (OMR or computer-based)."
              - "Mains papers (except General English) are answered wholly in English, Telugu or Urdu. General English needs 40% (OC, sportsmen, EWS), 35% (BC) or 30% (SC, ST, PH) and is not counted in the rank."
              - "Equal prelim marks are ranked by local status (Telangana candidates first), then age (older first)."
            source: tg1
          - p: "<strong>Group-II:</strong> four objective papers of 150 questions and 150 marks each (2½ hours) — General Studies &amp; General Abilities; History, Polity and Society; Economy and Development; Telangana Movement and State Formation — 600 marks in all, in English, Telugu and Urdu."
            source: tg2
      - id: fees
        nav: "Fees"
        eyebrow: "Fee structure"
        heading: "₹200 processing + ₹120 exam fee"
        parts:
          - table:
              head: ["Fee", "Amount", "Who pays"]
              rows:
                - ["Application processing fee", "₹200", "Every applicant"]
                - ["Examination fee", "₹120", "Employed candidates (government, PSU, corporations); unemployed candidates are exempt"]
            source: tg1
          - note: "Group-II 28/2022 charged the same ₹200 + ₹120 with the same unemployed exemption. Fees are not refunded."
            source: tg2
      - id: reservation
        nav: "Reservation &amp; Local Zones"
        eyebrow: "Reservation, local status &amp; multi-zones"
        heading: "95% local reservation in two multi-zones"
        parts:
          - list:
              - "<strong>Local reservation (95%)</strong> applies to all posts notified under Multi-Zone I and II (G.O.Ms.No.124, 30 Aug 2018). A local candidate studied for four consecutive years in the area up to the qualifying exam or Class VII (whichever is lower), or qualifies by the seven-year rule."
              - "<strong>Multi-Zone I:</strong> Asifabad, Mancherial, Peddapalli, Bhupalapalli, Mulugu, Adilabad, Nirmal, Nizamabad, Jagtial, Karimnagar, Sircilla, Siddipet, Medak, Kamareddy, Kothagudem, Khammam, Mahabubabad, Hanumakonda and Warangal. <strong>Multi-Zone II:</strong> Suryapet, Nalgonda, Bhongir, Jangaon, Medchal-Malkajgiri, Hyderabad, Ranga Reddy, Sangareddy, Vikarabad, Mahabubnagar, Narayanpet, Gadwal, Wanaparthy and Nagarkurnool."
              - "<strong>ST reservation</strong> is 10% (raised from 6% by G.O.Ms.No.130 of 2022); EWS as per G.O.Ms.No.243 and 244 of 2021; women and meritorious sportspersons (2%) horizontally."
              - "BC candidates need a non-creamy-layer certificate (Form VII-B) from a Telangana Tahsildar; otherwise they are considered under open competition."
              - "Applicants from other states get no reservation."
            source: tg1
      - id: documents
        nav: "Documents"
        eyebrow: "Document checklist"
        heading: "Keep these ready"
        parts:
          - list:
              - "Photo ID — Aadhaar, voter ID, passport, driving licence, service ID, bank passbook with photo or PAN card."
              - "SSC, Intermediate, degree and PG certificates."
              - "Study (bonafide) or residence certificates for Classes I to VII."
              - "SC / ST / BC community certificate and BC non-creamy-layer certificate from Telangana authorities; EWS income certificate for the previous financial year."
              - "Sports, disability and ex-servicemen certificates where claimed."
            source: tg2
      - id: pay
        nav: "Pay &amp; Salary"
        eyebrow: "Salary"
        heading: "Scales of pay"
        parts:
          - table:
              caption: "Group-I (Notification 02/2024)"
              head: ["Posts", "Scale of pay (₹)"]
              rows:
                - ["Deputy Collector, DSP, Commercial Tax Officer", "58,850 – 1,37,050"]
                - ["RTO, DPO, District Registrar, Dy. Supdt. of Jails, ACL, welfare officers", "54,220 – 1,33,630"]
                - ["Asst. Excise Supdt., Municipal Commissioner Gr-II, MPDO, AAO, ATO and others", "51,320 – 1,27,310"]
            source: tg1
          - table:
              caption: "Group-II (Notification 28/2022)"
              head: ["Posts", "Scale of pay (₹)"]
              rows:
                - ["Asst. BC / Tribal / Social Welfare Officers", "45,960 – 1,24,150"]
                - ["Municipal Commissioner Gr-III, Asst. Registrar, Mandal Panchayat Officer", "43,490 – 1,18,230"]
                - ["Asst. Commercial Tax Officer, Naib Tahsildar, Sub-Registrar Gr-II, Asst. Labour Officer", "42,300 – 1,15,270"]
                - ["Assistant Section Officer, Excise SI, Asst. Development Officer", "38,890 – 1,12,510"]
            source: tg2
          - note: "Notifications print pay scales only; in-hand pay adds dearness allowance and HRA and subtracts deductions, so no in-hand figure is shown."
      - id: posting
        nav: "Job &amp; Posting"
        eyebrow: "Job profile &amp; posting"
        heading: "Allotment by multi-zone"
        parts:
          - p: "Group-I selections are made post-wise and multi-zone-wise: the provisional list gives each selected candidate's post code and multi-zone. Selection does not confer a right to appointment until the appointing authority completes character, antecedent and medical checks."
            source: tg1sel
    sources:
