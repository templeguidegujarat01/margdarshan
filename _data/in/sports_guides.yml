    facts:
      - { label: "Teams at Milano Cortina 2026", value: "<strong>92 countries</strong> + neutral athletes", source: ioc-mc26 }
      - { label: "Players", value: "Around <strong>2,900</strong> (47% women)", source: ioc-mc26 }
      - { label: "India's team in 2026", value: "<strong>2 skiers</strong> — Arif Khan, Stanzin Lundup", source: pib-kiwg26 }
      - { label: "India's own winter games", value: "<strong>Khelo India Winter Games</strong> — Leh &amp; Gulmarg", source: "pib-kiwg26,kiwg26" }
    sections:
      - id: basics
        nav: "What it is"
        eyebrow: "The basics"
        heading: "What the Winter Olympics are"
        parts:
          - list:
              - "The Winter Olympics are the Olympic Games for <strong>snow and ice sports</strong>."
              - "The last one was <strong>Milano Cortina 2026</strong> in Italy: <strong>19 days</strong> of competition and <strong>16 sport disciplines</strong>. <strong>France</strong> hosts the next Winter Games."
              - "<strong>Ski mountaineering</strong> joined the Winter Olympics for the first time in 2026."
            source: ioc-mc26
      - id: numbers
        nav: "Who took part"
        eyebrow: "Who takes part, who wins"
        heading: "Milano Cortina 2026 in numbers"
        parts:
          - table:
              caption: "Milano Cortina 2026 — the real numbers"
              head: ["What", "Number"]
              rows:
                - ["Countries (NOCs)", "<strong>92</strong> + Individual Neutral Athletes"]
                - ["Players", "Around <strong>2,900</strong> (provisional)"]
                - ["Women", "<strong>47%</strong> of all players — the most balanced Winter Games ever"]
                - ["Women's events", "<strong>50</strong> (46 at Beijing 2022)"]
                - ["Countries at their first Winter Games", "3 — Benin, Guinea-Bissau, United Arab Emirates"]
                - ["Countries that won their first-ever Winter medal", "2 — Brazil (gold) and Georgia (silver)"]
                - ["Records", "13 Olympic records, 1 world record"]
            source: ioc-mc26
      - id: sports
        nav: "Snow &amp; ice sports"
        eyebrow: "The sports"
        heading: "Snow sports and ice sports"
        parts:
          - table:
              caption: "Winter sports named in these official files"
              head: ["Type", "Sports", "What you do"]
              rows:
                - ["<strong>Snow</strong>", "Alpine skiing (slalom, giant slalom)", "Ski fast down a slope through gates"]
                - ["<strong>Snow</strong>", "Cross-country (Nordic) skiing", "Ski long distances on flat and hilly tracks"]
                - ["<strong>Snow</strong>", "Ski jumping", "Fly as far as possible off a big ramp"]
                - ["<strong>Snow</strong>", "Freestyle skiing (moguls, dual moguls)", "Ski over bumps and do jumps"]
                - ["<strong>Snow</strong>", "Ski mountaineering (new in 2026)", "Climb up and ski down a mountain course"]
                - ["<strong>Snow</strong>", "Snowboard", "Ride a single board down the snow"]
                - ["<strong>Ice</strong>", "Ice hockey", "Team game on skates with sticks and a puck"]
                - ["<strong>Ice</strong>", "Figure skating", "Skate with jumps and spins to music; judges score"]
                - ["<strong>Ice</strong>", "Speed skating and short track", "Race on skates around an ice track"]
                - ["<strong>Ice</strong>", "Luge and skeleton", "Slide down an ice track on a small sled"]
            source: "ioc-mc26,kiwg26"
      - id: india
        nav: "India's path"
        eyebrow: "India and winter sport"
        heading: "Who went from India — and how Indian players start"
        parts:
          - list:
              - "At Milano Cortina 2026 India was represented by alpine skier <strong>Arif Khan</strong> and cross-country skier <strong>Stanzin Lundup</strong>."
              - "For years India sent <strong>one or no athletes</strong> to the Winter Olympics. The Sports Ministry says the Khelo India Winter Games are now building more players — figure skater <strong>Tara Prasad</strong> has won medals abroad and the women's ice hockey team has had historic results."
            source: pib-kiwg26
          - list:
              - "In 2022 the Sports Ministry added skier <strong>Arif Khan</strong> to <strong>TOPS</strong> (the Target Olympic Podium Scheme) before the Beijing Winter Olympics — winter players can get the same support as summer stars."
            source: pib-arif22
