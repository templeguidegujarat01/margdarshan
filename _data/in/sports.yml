      - { label: "Asian Games 2026 squad", value: "<strong>77 athletes</strong> — 34 men, 43 women", source: afi-ag26 }
    sections:
      - id: rules
        nav: "Rules &amp; ages"
        eyebrow: "Core rules &amp; selection formats"
        heading: "Age groups, the false-start rule and India's age-group Nationals"
        parts:
          - table:
              caption: "World Athletics age categories"
              head: ["Category", "Who", "Counted on"]
              rows:
                - ["<strong>Under-18 (U18)</strong>", "Aged 16 or 17", "31 December of the competition year"]
                - ["<strong>Under-20 (U20)</strong>", "Aged 18 or 19", "31 December of the competition year"]
                - ["Masters", "From the 35th birthday", "The birthday itself"]
            source: wa-rules
          - p: "Each competition's own regulations decide which age groups apply and the minimum age to enter."
            source: wa-rules
          - list:
              - "<strong>False start</strong>: except in combined events, the athlete responsible is <strong>disqualified</strong> and shown a red-and-black card. In combined events the first false start brings a warning and a second one disqualification."
            source: wa-rules
          - table:
              caption: "AFI national championships, October 2026"
              head: ["Championship", "Dates", "Venue", "Who"]
              rows:
                - ["65th National Open Athletics Championships", "8–11 Oct 2026", "Jawaharlal Nehru Stadium, New Delhi", "Senior"]
                - ["6th Indian Open U23 Athletics Competition", "From 16 Oct 2026", "Jaipur", "Under 23"]
                - ["41st National Junior Athletics Championships", "23–27 Oct 2026", "Jawaharlal Nehru Stadium, Chennai", "<strong>U14 · U16 · U18 · U20</strong> — 98 finals"]
            source: "afi-open26,afi-home,afi-jr26"
          - p: "At the Junior Nationals the combined events step up with age: <strong>Triathlon</strong> (U14), <strong>Pentathlon</strong> (U16), <strong>Heptathlon</strong> (U18 men and women, U20 women) and <strong>Decathlon</strong> (U20 men)."
            source: afi-jr26
      - id: recognition
        nav: "Recognition"
        eyebrow: "Institutional &amp; global recognition"
        heading: "Olympics, World Championships, Asian Games — and the cash that follows"
        parts:
          - p: "AFI named a <strong>77-member squad</strong> (34 men, 43 women) for the <strong>Asian Games 2026</strong> in Aichi-Nagoya, including Avinash Sable (3000m steeplechase), Gulveer Singh (1500m/5000m/10000m), Annu Rani (javelin) and Jyothi Yarraji (100m hurdles)."
            source: afi-ag26
          - table:
              caption: "Government cash award for a senior athletics medal (₹ lakh)"
              head: ["Event", "Gold", "Silver", "Bronze"]
              rows:
                - ["<strong>Olympic Games</strong>", "75", "50", "30"]
                - ["Asian Games / Commonwealth Games", "30", "20", "10"]
                - ["World Athletics Championships (every 2 years)", "20", "14", "8"]
                - ["Asian Athletics Championships (every 2 years)", "7.5", "5", "2.5"]
            source: myas-cash
          - note: "Relays are team events: each member gets 75% of the individual amount. The coach also gets a share of the award."
            source: myas-cash
      - id: eligibility
        nav: "Shoes, ages &amp; testing"
        eyebrow: "Physical benchmarks &amp; anti-doping"
        heading: "Shoe limits, age checks and whereabouts"
        parts:
          - table:
              caption: "Maximum sole thickness — World Athletics shoe regulations (from 1 Jan 2026)"
              head: ["Events", "Maximum sole"]
              rows:
                - ["<strong>Track and field</strong> (spike or non-spike shoe), except track race walks", "<strong>20 mm</strong>; in jumps the forefoot sole may not be higher than the heel"]
                - ["Road running and race walks (road and track)", "<strong>40 mm</strong>"]
                - ["Cross-country", "Any thickness from 1 April 2026"]
            source: wa-shoes
          - list:
              - "Since <strong>1 November 2024</strong>, any shoe thicker than the table above is no longer approved for World Rankings competitions."
              - "A shoe must be on World Athletics' approved list; <strong>development shoes</strong> are approved for at most 12 months and can never be worn at the Olympic Games."
            source: wa-shoes
          - list:
              - "SAI runs an <strong>Age Verification Test</strong> on new NCOE inductees (boys under 17, girls under 15) before they join; an athlete who does not join within <strong>7 days</strong> loses the place."
            source: sai-ath-patiala
          - list:
              - "AFI publishes <strong>overage lists</strong> after age-verification checks at events such as the National Inter-District Junior Athletics Meet (NIDJAM)."
            source: afi-overage
          - list:
              - "Filing your <strong>whereabouts</strong> with NADA, WADA or the Athletics Integrity Unit in ADAMS is <strong>mandatory to compete</strong> in India or abroad; missed tests and late filings lead to filing failures, for which the athlete alone is responsible."
            source: afi-whereabouts
      - id: roadmap
        nav: "Roadmap"
        eyebrow: "Grassroots-to-elite roadmap"
        heading: "From the district meet to the national camp"
        parts:
          - table:
              caption: "The athletics ladder"
              head: ["Step", "Age", "What happens"]
              rows:
                - ["1. District &amp; inter-district", "U14 · U16", "District meets and NIDJAM — with age checks"]
                - ["2. SAI Training Centre", "12–18", "Up to 8th at Sub-Junior/Junior Nationals, or top 3 at state level, can enter after tests"]
                - ["3. Junior Nationals", "U14–U20", "Zonal meets, then the National Junior Championships"]
                - ["4. SAI NCOE", "Scouted athletes", "Inducted by SAI's KITD division after the age test"]
                - ["5. Senior qualification", "Senior", "Qualify at the <strong>Indian Open or Indian Grand Prix</strong> meets for the Federation Senior Nationals"]
                - ["6. National camp &amp; team", "—", "AFI selection for Asian, Commonwealth, World and Olympic events"]
            source: "afi-overage,sai-schemes,afi-home,afi-jr26,sai-ath-patiala,afi-mandatory25"
          - p: "In 2025 AFI made it compulsory to reach the qualification standard <strong>at an Indian Open meet or Indian Grand Prix</strong> in the same year to be accepted for the National Federation Senior Championships — without it, the entry is refused."
            source: afi-mandatory25
      - id: academies
        nav: "Centres"
        eyebrow: "Top training academies &amp; cities"
        heading: "Where India's athletes are trained"
        parts:
          - table:
              caption: "SAI athletics inductions of 17 December 2024"
              head: ["Centre", "City", "Athletes inducted"]
              rows:
                - ["<strong>NSNIS Patiala</strong>", "Patiala, Punjab", "29 (including javelin thrower Neeraj Chopra)"]
                - ["<strong>NCOE Bengaluru</strong> (NSSC)", "Bengaluru, Karnataka", "40"]
                - ["<strong>LNCPE</strong>", "Thiruvananthapuram, Kerala", "26"]
            source: "sai-ath-patiala,sai-ath-blr,sai-ath-tvm"
          - p: "Athletics is also trained at SAI NCOEs in <strong>Bhopal, Lucknow, Sonepat, Hamirpur, Guwahati, Imphal, Kolkata, Dharamshala (girls) and Gandhinagar</strong>."
            source: sai-schemes
      - id: costs
        nav: "Shoes &amp; cost"
        eyebrow: "Equipment costs &amp; who pays"
        heading: "Who pays an athlete at each level"
        parts:
          - table:
              caption: "Who pays — athletics"
              head: ["Stage", "Paid by", "What you get"]
              rows:
                - ["Adopted school (age 8–14)", "SAI National Sports Talent Contest", "Kit, competition exposure and a stipend each year"]
                - ["SAI centre trainee", "SAI", "Coaching, boarding and sports science at an STC or NCOE"]
                - ["Khelo India athlete", "Ministry of Youth Affairs &amp; Sports", "<strong>₹6.28 lakh a year</strong> incl. ₹1.20 lakh cash"]
                - ["Junior medal prospect", "TOPS Development Group", "₹25,000 a month"]
                - ["Olympic prospect", "TOPS Core Group", "<strong>₹50,000 a month</strong> + approved training plan"]
                - ["Athlete in need", "PDU National Welfare Fund", "Up to ₹2.50 lakh"]
            source: "sai-schemes,pib-support"
          - list:
              - "Spikes and racing shoes must be on the <strong>approved list</strong> and within the sole limits above — buy approved models, not just any 'spikes'."
              - "Education Margdarshan does not print shop prices: no governing body publishes them, and models change every season."
            source: wa-shoes
          - list:
              - "<strong>Food first</strong>, with a certified nutritionist; no supplement is 100% safe and <strong>strict liability</strong> applies."
            source: nada-supp
      - id: earnings
        nav: "Earnings &amp; jobs"
        eyebrow: "Earning channels &amp; central job quotas"
        heading: "Awards, pensions, coaching and sports-quota jobs"
        parts:
          - list:
              - "Athletics is one of the <strong>65 sports</strong> in the central sports quota for <strong>Group C</strong> posts, with up to 5 years' age relaxation (10 for SC/ST)."
              - "Medals at the Olympics, Asian Games, Commonwealth Games or World Championships can bring up to <strong>three out-of-turn promotions</strong>."
            source: dopt-2022
          - p: "Retired champions can receive the <strong>Pension to Meritorious Sportspersons</strong> of ₹12,000–20,000 a month."
            source: pib-support
          - p: "Coaching route: AFI runs <strong>Pre Level 1</strong> courses and World Athletics <strong>CECS Level 1–3</strong> coach courses, and publishes the results and certified-coach lists on its website."
            source: afi-home
      - id: traps
        nav: "Red flags"
        eyebrow: "Disqualification traps"
        heading: "Mistakes that cost athletes their season"
        parts:
          - list:
              - "<strong>Skipping the Indian Open / Grand Prix</strong> meets — AFI refuses Senior Nationals entries without a qualifying mark from them."
            source: afi-mandatory25
          - list:
              - "<strong>Not filing whereabouts</strong> — filing failures and missed tests are your responsibility alone."
            source: afi-whereabouts
          - list:
              - "<strong>Racing in an unapproved or over-thick shoe</strong> at a World Rankings competition."
            source: wa-shoes
          - list:
              - "<strong>Age fraud</strong> — overage athletes are listed publicly; SAI weeds out athletes for age fraud and dope abuse."
            source: "afi-overage,sai-schemes"
