# Journey Blueprint — Psychiatrist (MBBS → NEET-PG → MD Psychiatry). Printed on journey-psychiatrist.html (_includes/journey-doubts.html).
# Rules, classes and the money items / sources several careers share: _data/in/journey_common.yml.
# NEET-PG (npg26), PGMER 2023 (pgmer23) and their money items live in journey/gynaecologist.yml — reused here.
id: psychiatrist
v: 2
name: "Psychiatrist (MBBS → NEET-PG → MD Psychiatry)"
search: ["psychiatrist", "psychiatry", "md psychiatry", "mental health doctor", "child psychiatrist", "addiction psychiatrist"]
search_not: ["psychologist", "counselling psychologist", "clinical psychologist"]
page: "neet-pg.html"
doubts_page: "journey-psychiatrist.html"
gate: "Class 12 with Physics, Chemistry and Biology → NEET (UG) → MBBS with a 12-month internship → NEET-PG → a 3-year M.D. (Psychiatry). NIMHANS Bengaluru and the AIIMS admit outside NEET-PG. After M.D., D.M. courses such as Child and Adolescent Psychiatry or Geriatric Mental Health take 3 more years."
gate_source: [neet-ib, npg26, pgmer23]
core:
  what:
    text: "A psychiatrist is a medical doctor who has specialised in mental illness — M.D. (Psychiatry) is one of the broad-speciality degrees recognised under the National Medical Commission's PG regulations. A psychologist is a different profession: no MBBS, and registered with the Rehabilitation Council of India."
    source: [pgmer23, rci-act]
  day:
    - "See patients in out-patient clinics and on wards, and diagnose mental illness."
    - "Prescribe and review medicines, and plan therapy with psychologists and social workers."
    - "Handle emergencies, addiction cases and consultations from other departments."
  pay_note: "No 2026 central notice for a psychiatry specialist post was found, so no pay figure is printed. PG residents are paid a stipend (see Money help)."
  routes:
    - { title: "MBBS → NEET-PG → M.D. (Psychiatry)", text: "NEET-PG is the single entrance for M.D. / M.S. / PG Diploma seats: All India 50% quota, state quota, private and deemed universities and Armed Forces medical institutions.", source: npg26 }
    - { title: "Institutes outside NEET-PG", text: "AIIMS New Delhi and the other AIIMS, PGIMER Chandigarh, JIPMER Puducherry, NIMHANS Bengaluru and SCTIMST Thiruvananthapuram are not filled through NEET-PG.", source: npg26 }
    - { title: "Diploma (D.P.M.)", text: "Psychiatry (D.P.M.) is still on NMC's list of recognised PG diplomas, but colleges may convert diploma seats to degree seats and no new diploma programmes are being permitted.", source: pgmer23 }
    - { title: "Super-speciality", text: "M.D. / DNB (Psychiatry) is the feeder for D.M. (Child and Adolescent Psychiatry) and D.M. (Geriatric Mental Health), each 3 years.", source: pgmer23 }
  cost_time:
    - { label: "Time after Class 12", value: "MBBS with internship, then 3 years of M.D.; a D.M. adds 3 years", source: pgmer23 }
    - { label: "NEET-PG 2026 fee", value: "₹3,500 General / OBC / EWS · ₹2,500 SC / ST / PwBD", source: npg26 }
  cost_note: "College fees for MBBS and M.D. differ by college and state, so none are printed."
  challenges:
    - text: "Two national tests stand between Class 12 and the specialty — NEET (UG) for MBBS and NEET-PG for M.D."
      source: [neet-ib, npg26]
    - text: "Every M.D. student does a compulsory 3-month District Residency in a district hospital, in the 3rd, 4th or 5th semester."
      source: pgmer23
    - text: "NEET-PG has negative marking: +4 for a correct answer and −1 for a wrong one."
      source: npg26
  not_for:
    - "You want to become a therapist without studying medicine — that is the psychologist route."
    - "You cannot commit to MBBS plus 3 more years of residency."
    - "You find long, emotionally heavy conversations draining."
journey:
  - stages: [c8, c9]
    title: "Science and people skills"
    do:
      - text: "NEET (UG) tests Physics, Chemistry and Biology (Botany & Zoology) — 180 compulsory questions in 180 minutes."
        source: neet-ib
    doubts:
      - q: "Is a psychiatrist a doctor?"
        a: "Yes. A psychiatrist first completes MBBS and then a postgraduate M.D. (Psychiatry), a broad speciality recognised under NMC's PG regulations."
        next: "Plan for the medical route: Biology in Class 11–12, then NEET (UG)."
        source: pgmer23
      - q: "What is the difference between a psychiatrist and a psychologist?"
        a: "A psychiatrist is an MBBS doctor with an M.D. in Psychiatry who can prescribe medicines. A clinical psychologist studies psychology, not medicine, and is registered with the Rehabilitation Council of India."
        next: "If you do not want MBBS, read the clinical psychologist blueprint."
        source: [pgmer23, rci-act]
  - stages: [c10]
    title: "Choose PCB in Class 11"
    do:
      - text: "NEET (UG) needs Physics, Chemistry and Biology in Class 12."
        source: neet-ib
    stream: "Science with Physics, Chemistry, Biology (PCB)."
    doubts:
      - q: "Which stream should I take to become a psychiatrist?"
        a: "Science with Physics, Chemistry and Biology, because MBBS admission is only through NEET (UG), which tests those three subjects."
        next: "Pick PCB after Class 10."
        source: neet-ib
  - stages: [c11, c12]
    title: "Prepare for NEET (UG)"
    do:
      - text: "NEET (UG) 2026: 180 questions, 720 marks, +4 for correct, −1 for wrong."
        source: neet-ib
    money: [neet-fee]
    doubts:
      - q: "Is there an age limit for NEET (UG)?"
        a: "You must be 17 by 31 December of the admission year. There is no upper age limit, as per the NMC letter quoted in the NEET (UG) 2026 bulletin."
        next: "Check your date of birth against the 31 December rule."
        source: neet-ib
      - q: "How is NEET (UG) marked?"
        a: "Four marks for each correct answer and minus one for each wrong answer, across 180 questions for 720 marks in 3 hours."
        next: "Practise full mock tests and avoid blind guesses."
        source: neet-ib
  - stages: [ug]
    title: "MBBS and internship"
    do:
      - text: "NEET-PG 2026 counted internship finished on or before 30 September 2026 for eligibility."
        source: npg26
    money: [mbbs-intern]
    doubts:
      - q: "Can I do psychiatry without MBBS?"
        a: "Not as a psychiatrist. M.D. (Psychiatry) is a postgraduate medical degree, and NEET-PG is open to MBBS graduates."
        next: "Finish MBBS and your internship first."
        source: [npg26, pgmer23]
      - q: "When must my internship be over to sit NEET-PG?"
        a: "For NEET-PG 2026 the cut-off date for completing the internship was 30 September 2026."
        next: "Check the cut-off date in each year's NEET-PG bulletin."
        source: npg26
  - stages: [grad]
    title: "NEET-PG and M.D. (Psychiatry)"
    do:
      - text: "NEET-PG 2026: 180 MCQs in 3 hours 30 minutes, English only, +4 / −1; exam on 30 August 2026, result by 30 September 2026."
        source: npg26
      - text: "M.D. / M.S. courses run 3 years and include a compulsory 3-month District Residency."
        source: pgmer23
    exams:
      - { name: "NEET-PG 2026", when: "30 Aug 2026 · result by 30 Sep 2026", source: npg26, href: "neet-pg.html" }
    money: [npg-fee, pg-stipend]
    doubts:
      - q: "What score do I need to qualify NEET-PG?"
        a: "The qualifying cut-off is the 50th percentile for General and EWS, the 45th percentile for UR PwBD, and the 40th percentile for SC, ST and OBC candidates."
        next: "Qualifying is only the first step; seats go by rank in counselling."
        source: npg26
      - q: "Is NEET-PG negative marking?"
        a: "Yes. Each correct answer gets 4 marks and each wrong answer loses 1 mark; unattempted questions get zero."
        next: "Answer only when you can eliminate options."
        source: npg26
      - q: "Does NIMHANS take admission through NEET-PG?"
        a: "No. NIMHANS Bengaluru, AIIMS New Delhi and the other AIIMS, PGIMER Chandigarh, JIPMER Puducherry and SCTIMST are not covered by NEET-PG admissions."
        next: "Read the INI-CET page if you want these institutes."
        source: npg26
      - q: "How long is M.D. Psychiatry?"
        a: "Three years for M.D. / M.S. broad-speciality courses under NMC's PGMER 2023, including a 3-month District Residency Programme."
        next: "Plan for three years of residency after NEET-PG."
        source: pgmer23
      - q: "Do PG residents get paid?"
        a: "Yes. PGMER 2023 says PG students in all institutions are paid a stipend at par with PG students of government medical colleges in that state, and it continues during the District Residency."
        next: "Ask your college for the current rate."
        source: pgmer23
      - q: "Is DPM still a good option?"
        a: "Psychiatry (D.P.M.) is still on NMC's list of PG diplomas, but colleges may convert diploma seats into degree seats and no new diploma programmes are being permitted."
        next: "Aim for M.D. (Psychiatry) seats in counselling."
        source: pgmer23
  - stages: [work]
    title: "Super-specialise"
    do:
      - text: "D.M. (Child and Adolescent Psychiatry) and D.M. (Geriatric Mental Health) take M.D. / DNB (Psychiatry) as the feeder degree."
        source: pgmer23
    doubts:
      - q: "Can I become a child psychiatrist?"
        a: "Yes. After M.D. or DNB (Psychiatry) you can take D.M. (Child and Adolescent Psychiatry), a 3-year super-speciality course."
        next: "Finish M.D. first, then sit the super-speciality entrance."
        source: pgmer23
      - q: "I already have MBBS and work as a medical officer. Can I still specialise in psychiatry?"
        a: "Yes, if you meet NEET-PG eligibility — an MBBS degree and completed internship by the cut-off date in that year's bulletin."
        next: "Register for the next NEET-PG."
        source: npg26
board_note: "Any board. NEET (UG) needs Physics, Chemistry and Biology in Class 12."
board_source: neet-ib
