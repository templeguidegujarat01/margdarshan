    - { label: "2026 posts", value: "276 (Advt 01/2026)", source: cil-a01 }
    - { label: "Next cycle", value: "GATE 2027 MN score", source: cil-a06 }
  stages:
    head: ["Stage", "What it is", "Rule"]
    rows:
