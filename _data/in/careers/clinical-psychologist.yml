  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What does a Clinical Psychologist do?"
    parts:
      - overview:
          points:
            - "A Clinical Psychologist assesses and treats mental health and behavioural conditions — anxiety, depression, trauma, relationship difficulties, developmental disorders and more — using talk therapy, structured psychological tests and evidence-based treatment approaches like Cognitive Behavioural Therapy (CBT)."
            - "They work in hospitals, private clinics, schools, rehabilitation centres and increasingly, independent private practice, often as part of a larger care team alongside psychiatrists."
            - "Unlike a psychiatrist, a clinical psychologist's qualification is non-medical and does not include prescribing medication in most Indian states."
          more:
            - "The role instead centres on assessment, therapy and psychological support — a distinct but complementary form of mental health care."
  - id: "who"
    hid: "who-heading"
    alt: true
    eyebrow: "Fit check"
    heading: "Who should pursue Clinical Psychology"
    parts:
      - fit:
          match:
            - "Are genuinely committed to a long study path — this isn't a quick or shortcut career."
            - "Have strong emotional resilience and can support others through difficult, sometimes distressing experiences without burning out."
            - "Are comfortable with both the science (research, testing, statistics) and the human, empathetic side of the work."
          mismatch:
            - "Want to prescribe medication or take a more medical route — that's Psychiatry (Bachelor of Medicine and Bachelor of Surgery (MBBS) + MD), a different and separate path."
            - "Need a faster route into a paying career — this path realistically takes 7-8 years before independent, licensed practice."
            - "Are not prepared for intense competition at the M.Phil stage, where recognised seats are extremely limited nationally."
