        steps:
          - { tag: "Start", title: "Bachelor's degree", text: "", kind: start, source: ooh_swdev }
          - { tag: "Graduate", title: "Master's degree", text: "", kind: stage, source: ooh_swdev }
          - { tag: "Goal", title: "Software developer", text: "", kind: goal, source: ooh_swdev }
