  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What does an App Developer actually do?"
    parts:
      - overview:
          points:
            - "An App Developer builds mobile applications for Android and/or iOS."
            - "The field splits into two genuinely different approaches: <strong>Native development</strong> (platform-specific — Kotlin for Android, Swift for iOS) and <strong>Cross-platform development</strong> (one codebase for both — Flutter or React Native)."
            - "It's distinct from Web Development, though the two overlap in skills, especially for React Native developers coming from a web background."
          more:
            - "Mobile apps remain the most-used digital platform globally, and India's fintech, e-commerce and quick-commerce boom means genuine, durable demand for skilled app developers."
            - "What matters most for your career, though, is understanding early that native and cross-platform aren't just two ways to reach the same outcome — they're a real strategic trade-off with different pay curves."
  - id: "who"
    hid: "who-heading"
    alt: true
    eyebrow: "Fit check"
    heading: "Who should aim for an App Developer career"
    parts:
      - fit:
          match:
            - "Enjoy mobile-specific design constraints and performance considerations, not just general programming."
            - "Want to work on apps used by millions of people daily — the scale here is genuinely large in India."
            - "Are comfortable making a real strategic choice between native depth and cross-platform breadth early on."
          mismatch:
            - "Want the broadest possible skill applicability — <a href=\"web-developer.html\">Web Development</a> skills transfer more broadly across devices."
            - "Dislike app-store-specific constraints — review processes, platform guidelines and update cycles are a real part of this job."
            - "Assume cross-platform skills alone will always match native pay — at pure-play product companies building performance-critical apps, native still commands a premium."
  - id: "eligibility"
    hid: "elig-heading"
    eyebrow: "Genuinely open to any background"
    heading: "Routes into an App Development career"
    parts:
