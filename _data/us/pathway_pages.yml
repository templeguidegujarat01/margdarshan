law:
  intro: "Law trains lawyers who advise clients, draft documents and represent people, businesses and governments. In the U.S. law is a graduate degree: a bachelor's in any field, three years of law school (J.D.), then a state bar admission."
  study: "In law school: contracts, torts, property, civil procedure, criminal law, constitutional law and legal writing in the first year, then electives, clinics and journals."
  hs: ["English and writing-heavy courses", "History, government and economics", "Debate, mock trial or Model UN", "Reading complex texts and building arguments"]
  majors: ["Any major — law schools do not require a specific one", "Common choices: political science, history, English, economics, philosophy"]
  route:
    - "High school|Read, write, argue|Writing-heavy classes and debate or mock trial."
    - "College|Bachelor's + LSAT/GRE|Strong grades in any major; most schools require a test."
    - "Law school|J.D.|Usually 3 years full time at an ABA-accredited school."
    - "Exams|MPRE + bar exam|Ethics exam plus the bar in your jurisdiction (NextGen UBE rolling out)."
    - "Goal|Admission to the bar|Character and fitness review, then you can practice in that state."
  key_numbers:
    - { label: "First-time bar exam pass rate (2025)", value: "76%", note: "All takers: 63%", source: ncbe_2025_stats }
    - { label: "Lawyers working in legal services", value: "52%", note: "11% self-employed; government also employs many", source: bls_ooh }
    - { label: "Federal loans for professional students from July 2026", value: "$50,000 a year", note: "$200,000 total; Grad PLUS ends for new borrowers", source: ed_obbba_loans }
  tips:
    - "Pick the state early: bar admission is state by state, and exam formats are changing (legacy UBE ends February 2028)."
    - "Expect long weeks — 66% of lawyers told O*NET they work more than 40 hours."
    - "Pay is very spread out: the lowest 10% earned under $78,360 and the highest 10% over $351,600 (BLS, May 2025)."
  faqs:
    - { q: "Is there an undergraduate law degree in the U.S.?", a: "No. Unlike many countries, the U.S. law degree (J.D.) comes after a bachelor's degree in any field." }
    - { q: "Do I have to take the LSAT?", a: "Most law schools still require the LSAT or GRE under ABA Standard 503, though some schools have ABA permission (variances) to admit some students without a test." }
    - { q: "Can I practice in any state after passing the bar?", a: "Only in the jurisdiction that admits you. Score transfer and admission rules differ by state." }
  last_reviewed: 2026-10-07

