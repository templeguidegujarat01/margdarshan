status: open
eyebrow: "Study abroad · Europe"
title: "Study in the UK from India"
seo_title: "Study in the UK from India: Visa, £ Funds and Graduate Route"
description: "UK Student visa from India: £558 fee, £776 a year health surcharge, £1,171–£1,529 a month funds, 20 work hours, and the Graduate visa cut to 18 months from 2027."
lede: "UK bachelor's degrees usually take three years (four in Scotland) and most taught master's take one year. The visa is points-based: an offer from a licensed sponsor (your CAS), English at the right level, and money held for 28 days."
alert:
  text: "Graduate visa change: apply on or before 31 December 2026 and it lasts 2 years; apply on or after 1 January 2027 and it lasts 18 months (PhD stays 3 years)."
  source: gv
facts:
  - { label: "Student visa fee", value: "£558 from outside the UK", source: sv }
  - { label: "Health surcharge", value: "£776 per year of visa", source: ihs }
  - { label: "Work in term", value: "20 hours a week (degree level)", source: cw_guide }
  - { label: "After the course", value: "Graduate visa: 18 months from 2027 (PhD 3 years)", source: gv }
card:
  line: "One-year master's, points-based visa, Graduate route"
  psw: "18 months from 2027 (PhD 3 yr)"
  work: "20 h/week in term"
  funds: "£1,171–£1,529 a month"
tests:
  - { exam: ielts, need: "IELTS for UKVI (a SELT) at CEFR B1 below degree level; at degree level the university may assess English (must equal B2)", source: english }
  - { exam: pte-academic, need: "PTE Academic UKVI is a SELT for UK visas", source: english }
  - { exam: duolingo, need: "Only if your university accepts it for a degree-level course it assesses itself", source: english }
# Official course searches / institution lists (rendered under "Intakes & courses"). Read 2026-10-29.
find:
  - { label: "UCAS", by: "UCAS (UK admissions service)", url: "https://www.ucas.com/", what: "Find UK universities and courses and apply for undergraduate study." }
  - { label: "Register of licensed sponsors: students", by: "Home Office (GOV.UK)", url: "https://www.gov.uk/government/publications/register-of-licensed-sponsors-students", what: "The government list of institutions licensed to sponsor Student visa holders. Check your university is on it before you pay a deposit." }
pillars:
  language_and_eligibility:
    heading: "English level and who needs to prove it"
    parts:
      - points:
          - { t: "Degree level or above: CEFR B2. Below degree level: CEFR B1, through a Secure English Language Test (SELT) from an approved provider.", source: english }
          - { t: "At degree level a Higher Education Provider can assess your English itself and may use a different test, but it must still be equivalent to B2.", source: english }
          - { t: "You are exempt if you have a degree taught in English that Ecctis confirms is equal to a UK bachelor's or higher, among other routes listed by GOV.UK. Indian nationals are not on the exempt-nationality list.", source: english }
  intakes_and_streams:
    heading: "When courses start and what Indians study"
    parts:
      - points:
          - { t: "You can apply for the visa up to 6 months before the course starts (from outside the UK). Decisions usually take 3 weeks from outside the UK.", source: sv }
          - { t: "You may arrive up to 1 month before a course longer than 6 months.", source: sv }
          - { t: "Degree-level study on a Student visa is capped at 5 years in total (with exceptions); below degree level the cap is 2 years.", source: cw_guide }
      - note: "Most universities start in September or October; some taught master's also start in January. Each university publishes its own deadlines on the course page."
  tuition_and_living_costs:
    heading: "What the UK costs"
    parts:
      - money:
          - { item: "Living money to show (London)", cur: GBP, amount: 1529, per: "month (up to 9)", source: money }
          - { item: "Living money to show (outside London)", cur: GBP, amount: 1171, per: "month (up to 9)", source: money }
          - { item: "Student visa fee", cur: GBP, amount: 558, per: "application", source: sv }
          - { item: "Immigration Health Surcharge", cur: GBP, amount: 776, per: "year of visa", source: ihs }
          - { item: "Dependant's living money (London)", cur: GBP, amount: 845, per: "month (up to 9)", source: family }
          - { item: "Graduate visa fee", cur: GBP, amount: 937, per: "application", source: gv }
      - points:
          - { t: "Show one academic year of course fees (up to 9 months) as stated on your CAS, plus living money held for 28 days in a row ending within 31 days of the application.", source: money }
          - { t: "The surcharge follows the visa length, not the course: a visa of over 1 year up to 18 months costs £1,164; over 18 months up to 2 years costs £1,552.", source: ihs }
      - note: "Tuition is set by each university for international students; read it on the course page and on your CAS."
  global_scholarships:
    heading: "UK scholarships open to Indian students"
    parts:
      - awards:
          - { name: "Chevening Scholarships", by: "UK government (FCDO)", who: "Graduates with 2 years' (2,800 hours') work experience who commit to return home for 2 years", gives: "Funding for a one-year UK master's", url: "https://www.chevening.org/scholarships/eligibility/", source: chevening }
          - { name: "Commonwealth Master's Scholarships", by: "Commonwealth Scholarship Commission (FCDO)", who: "Candidates from eligible Commonwealth countries — India is on the list — who could not otherwise afford UK study", gives: "Full-time taught master's; scholars must return home", url: "https://cscuk.fcdo.gov.uk/scholarships/commonwealth-masters-scholarships/", source: csc }
          - { name: "GREAT Scholarships", by: "GREAT Britain Campaign, British Council and universities", who: "Students from 18 countries including India", gives: "£10,000 towards tuition for a one-year taught postgraduate course", url: "https://study-uk.britishcouncil.org/scholarships-funding/great-scholarships", source: great }
      - points:
          - { t: "Chevening's 2027/28 round opened in August 2026 and closed in October 2026 (11:00 UTC on the closing day).", source: chevening_dates }
          - { t: "Commonwealth Master's applications for 2027/28 closed on 20 October (16:00 BST). Scholars cannot switch to the Graduate visa.", source: csc }
  application_funnel:
    heading: "From application to CAS"
    parts:
      - steps:
          - { title: "Get an offer from a licensed student sponsor", text: "The university must hold a student sponsor licence; your offer becomes a Confirmation of Acceptance for Studies (CAS).", source: sv }
          - { title: "Check English and the TB test", text: "Book a SELT if your level or course needs it. Indian residents coming for 6 months or more need a TB test at an approved clinic; the certificate is valid 6 months from the x-ray.", source: tb }
          - { title: "Hold the money for 28 days", text: "Course fees for the first year (up to 9 months) plus monthly living money, held 28 days in a row, ending within 31 days of applying.", source: money }
          - { title: "Apply and pay", text: "Pay £558 and the health surcharge online; apply up to 6 months before the course starts.", source: sv }
          - { title: "Travel", text: "Arrive up to 1 month before a course longer than 6 months.", source: sv }
  visa_chokepoints:
    heading: "The Student visa in short"
    parts:
      - points:
          - { t: "Money is checked strictly: it must sit in the account for 28 consecutive days, and the 28 days must end within 31 days of the application date.", source: money }
          - { t: "Most students on taught master's courses can no longer bring family: for courses starting on or after 1 January 2024 only PhD or research-based higher degrees (or government-sponsored students) qualify.", source: family }
          - { t: "No self-employment and no work as a professional sportsperson or sports coach.", source: sv_can }
  post_study_work:
    heading: "Work during and after your course"
    parts:
      - points:
          - { t: "Degree level at a university with a track record of compliance: up to 20 hours a week in term time, full time in vacations (including before the course starts).", source: cw_guide }
          - { t: "Below degree level: up to 10 hours a week in term time.", source: cw_guide }
          - { t: "Graduate visa: 2 years if you apply on or before 31 December 2026, 18 months if you apply on or after 1 January 2027; 3 years after a PhD.", source: gv }
          - { t: "You apply from inside the UK before your Student visa expires, once the university has told the Home Office you completed the course. Fee £937 plus the health surcharge.", source: gv }
visa:
  slug: uk-student-visa
  name: "UK Student visa"
  short: "UK Student visa"
  seo_title: "UK Student Visa from India: Fee, CAS, Money and TB Test"
  description: "UK Student visa step by step for Indians: CAS, SELT, TB test, £1,171–£1,529 a month held 28 days, £558 fee, health surcharge and dependants rules."
  lede: "The Student visa is for courses at a licensed student sponsor. Most refusals and delays come from three places: the money, the CAS details and the English evidence."
  facts:
    - { label: "Fee", value: "£558 (outside the UK)", source: sv }
    - { label: "Decision time", value: "Usually 3 weeks from outside the UK", source: sv }
    - { label: "Money held", value: "28 consecutive days", source: money }
    - { label: "TB test", value: "Needed for India; valid 6 months", source: tb }
  official:
    - { label: "GOV.UK — Student visa", url: "https://www.gov.uk/student-visa" }
    - { label: "Student route caseworker guidance", url: "https://www.gov.uk/government/publications/student-route-caseworker-guidance" }
  sections:
    - id: steps
      nav: Steps
      eyebrow: "Order of work"
      heading: "Step by step"
      parts:
        - steps:
            - { title: "Offer and CAS", text: "Accept an offer from a licensed student sponsor and get your CAS. Check that fees paid and course dates on the CAS are right.", source: sv }
            - { title: "TB certificate", text: "You need it if you come for 6 months or more and have lived in India in the last 6 months. Use an approved clinic; the certificate is valid 6 months from the x-ray.", source: tb }
            - { title: "English proof", text: "SELT at B1 below degree level; at degree level the university may assess you (equal to B2).", source: english }
            - { title: "Funds", text: "First-year fees on the CAS plus £1,529 a month in London or £1,171 elsewhere, for up to 9 months, held 28 days.", source: money }
            - { title: "Apply online", text: "Up to 6 months before the course; pay £558 and the health surcharge.", source: sv }
    - id: money
      nav: Money
      eyebrow: "The financial requirement"
      heading: "Money you must show"
      parts:
        - money:
            - { item: "Living money, London", cur: GBP, amount: 1529, per: "month (max 9)", source: money }
            - { item: "Living money, outside London", cur: GBP, amount: 1171, per: "month (max 9)", source: money }
            - { item: "Each dependant, London", cur: GBP, amount: 845, per: "month (max 9)", source: family }
            - { item: "Each dependant, outside London", cur: GBP, amount: 680, per: "month (max 9)", source: family }
        - points:
            - { t: "Example from GOV.UK: for an application on 1 January, the money must be held for the 28 days ending 1 December or later.", source: money }
            - { t: "If you have lived in the UK on a valid visa for at least 12 months, you do not need to show maintenance or course fees.", source: money }
            - { t: "If a loan or sponsor pays, give evidence from the lender or sponsor.", source: money }
    - id: health
      nav: "Health surcharge"
      eyebrow: "IHS"
      heading: "Immigration Health Surcharge"
      parts:
        - points:
            - { t: "Students pay £776 per year; it is worked out on the visa's length, which can be longer than the course.", source: ihs }
            - { t: "Over 6 months and under 1 year: one full year. Over 1 year up to 18 months: £1,164. Over 18 months up to 2 years: £1,552.", source: ihs }
    - id: family
      nav: Family
      eyebrow: "Dependants"
      heading: "Bringing a partner or children"
      parts:
        - points:
            - { t: "Only government-sponsored students on courses over 6 months, or full-time postgraduate students on a course of at least 9 months that is a PhD or research-based higher degree (for courses from 1 January 2024).", source: family }
            - { t: "Each dependant pays the visa fee and needs £845 a month in London or £680 elsewhere for up to 9 months.", source: family }
    - id: chokepoints
      nav: "Common problems"
      eyebrow: "Where files go wrong"
      heading: "Choke points to check twice"
      parts:
        - points:
            - { t: "Money that dipped below the level during the 28 days, or a 28-day period ending more than 31 days before the application.", source: money }
            - { t: "A TB certificate older than 6 months from the x-ray date.", source: tb }
            - { t: "The wrong English test: below degree level you need a SELT such as IELTS for UKVI, not plain IELTS Academic.", source: english }
            - { t: "Planning to work more than 20 hours in term, or self-employment, which the visa does not allow.", source: cw_guide }
doubts:
  - { q: "Is IELTS compulsory for a UK Student visa?", a: "Not always. At degree level a licensed university can assess your English itself, but it must be equal to CEFR B2. Below degree level you need a Secure English Language Test at B1.", source: english }
  - { q: "How much bank balance is needed for a UK student visa?", a: "First-year course fees (up to 9 months) plus £1,529 a month in London or £1,171 a month elsewhere, for up to 9 months, held for 28 days in a row.", source: money }
  - { q: "Can I take my wife or husband on a UK master's?", a: "For courses starting on or after 1 January 2024, only PhD or research-based postgraduate students (or government-sponsored students) can bring dependants.", source: family }
  - { q: "How long is the UK Graduate visa now?", a: "Two years if you apply on or before 31 December 2026 and 18 months if you apply on or after 1 January 2027. PhD graduates get 3 years.", source: gv }
  - { q: "How many hours can Indian students work in the UK?", a: "Up to 20 hours a week in term time on a degree-level course at a university, and full time in vacations. Below degree level the limit is 10 hours.", source: cw_guide }
  - { q: "Do I need a TB test for a UK student visa from India?", a: "Yes, if you are coming for 6 months or more and have lived in India in the last 6 months. The certificate is valid for 6 months from the x-ray.", source: tb }
