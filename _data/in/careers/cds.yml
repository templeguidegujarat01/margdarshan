  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "What is the difference between NDA and CDS?"
            a: "NDA is for students right after Class 12, combining a 3-year academic degree with military training before commissioning as an officer. CDS is for graduates who have already completed a bachelor's degree, offering a more direct, shorter route into officer training through IMA, INA, AFA or OTA."
          - q: "Can Arts graduates apply for CDS?"
            a: "Yes. Any bachelor's degree in any discipline is eligible for the IMA (Army) and OTA (Officers Training Academy) entries. Air Force and Naval entries through AFA and INA have specific stream requirements, typically needing Physics and Mathematics at Class 12 level, so Arts graduates should check the exact entry they're applying for."
          - q: "What is the SSB interview and why does it matter?"
            a: "The SSB interview is a rigorous 5-day assessment of personality, leadership, physical fitness and psychological suitability for officer roles, conducted after clearing the written CDS exam. It's often considered the more decisive and challenging stage, since many candidates who clear the written exam don't clear the SSB."
          - q: "Can women apply for CDS?"
            a: "Yes, women can apply through the OTA (Officers Training Academy) entry for a Short Service Commission, and eligibility has also expanded over recent years for other entries — always check the current CDS notification for the latest entry-specific eligibility for women."
          - q: "How many times a year is CDS conducted?"
            a: "CDS is conducted twice a year by UPSC, typically around February and September/November, giving graduates two opportunities annually to apply, subject to meeting the age and eligibility criteria for that specific notification."
      - note: "*Salary figures follow the 7th Central Pay Commission structure and are indicative, based on publicly available information as of 2026 — always verify current eligibility, exam pattern and pay figures on the official UPSC and Indian Armed Forces websites."
        class: "table-note mt-lg"
