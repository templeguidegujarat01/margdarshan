  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What is Electrical Engineering?"
    parts:
      - overview:
          points:
            - "Electrical Engineering is a 4-year engineering degree focused on electricity — how it's generated, transmitted, distributed and controlled."
            - "Its core rests on electrical machines, power systems, control systems and power electronics, covering everything from a city's power grid to the motor inside a washing machine."
            - "The branch has genuinely broadened in scope in recent years."
          more:
            - "Alongside traditional power-plant and grid work, electrical engineers today increasingly work on <strong>renewable energy grid integration, EV power electronics, battery management systems and industrial automation (PLC/SCADA)</strong> — segments reported among the fastest-growing in salary terms for the field."
  - id: "who"
    hid: "who-heading"
    alt: true
    eyebrow: "Fit check"
    heading: "Who should choose Electrical Engineering"
    parts:
      - fit:
          match:
            - "Enjoy Physics and circuits, and want to understand how electricity actually powers everything around you."
            - "Want a strong, stable PSU/power-sector pathway through GATE, with room to specialise later."
            - "Are genuinely interested in renewable energy, EVs or industrial automation as growth areas worth specialising in."
          mismatch:
            - "Actually want a communication/semiconductor/embedded-systems career — Electronics (ECE) is the closer match."
            - "Expect the headline ₹15-35 lakh per annum (LPA) renewable/EV figures without adding any specialised skill — those apply to experienced, specialised professionals, not fresh graduates."
            - "Dislike safety-heavy, sometimes shift-based work — plant and grid roles involve real electrical safety protocols."
