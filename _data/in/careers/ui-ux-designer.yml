  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "What is the real difference between UI Designer, UX Designer and Product Designer?"
            a: "These three titles get used almost interchangeably in job postings, but they carry genuinely different responsibilities and pay differently. UI Designer roles focus mainly on visual design — colors, layout, components. UX Designer roles focus more on research and usability — user flow, testing, information structure. Product Designer roles typically own the full pipeline, combining research, UI and business-impact thinking, and are often the highest-paid of the three at senior levels."
          - q: "Do I need a design degree to become a UI/UX designer?"
            a: "No, not strictly. Many startups and product companies now prioritise portfolio quality over college degrees — self-taught designers with a strong, documented portfolio are hired directly and freelance successfully. A formal design education from institutes like NID or Srishti generally offers the strongest campus placement starting point, but it isn't the only viable route into the field."
          - q: "What is a realistic UI/UX Designer salary in India in 2026?"
            a: "Freshers commonly earn ₹3-6 LPA, with strong-portfolio candidates in cities like Bangalore and Mumbai reported to reach ₹5-7 LPA. Mid-level designers with 3-5 years of experience typically earn ₹8-20 LPA, with UX research and Product Designer roles earning 15-25% more than UI-only roles at the same level. Senior designers and those specialising in design systems commonly earn ₹15-32 LPA, with design-systems expertise reported to add a further 25-40% premium."
          - q: "What should my portfolio actually include to get interview callbacks?"
            a: "Detailed case studies, not just visual screenshots. Three well-documented case studies following a problem → research → iteration → outcome format are reported to beat five years of experience without a documented portfolio. Show your wireframes, your research notes, and clearly explain the changes you made and why — that documentation is what separates a portfolio that gets callbacks from one that gets ignored."
          - q: "Will AI tools replace UI/UX designers?"
            a: "It doesn't look like it. AI-assisted design tools like Figma AI, Galileo and Uizard are reported to be accelerating designer productivity rather than replacing the role — they speed up wireframing and visual exploration, but product thinking, user empathy and strategic design judgment remain fundamentally human skills. Designers who use AI tools as a productivity multiplier, rather than resisting them, are reported to be the most in demand."
      - note: "Figures are indicative (2026) — confirm on the official college or authority website."
        class: "table-note mt-lg"
