  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Is Maths compulsory for Computer Science Engineering?"
            a: "Yes. Almost every CSE programme in India requires Physics, Chemistry and Mathematics (PCM) at Class 12, since JEE Main and most state engineering entrance exams are built entirely around these three subjects. There is no realistic route into a recognised CSE degree without Class 12 Maths."
          - q: "What is the real difference between CSE and IT?"
            a: "Very little in practice. CSE tends to go slightly deeper into core computer science theory — algorithms, computer architecture, compiler design — while Information Technology leans a bit more toward applied software and networks. Recruiters and salaries treat the two as largely interchangeable at most colleges."
          - q: "Can I get into a CSE programme without JEE?"
            a: "Yes. Many private universities admit through their own entrance tests — BITSAT for BITS Pilani, VITEEE for VIT, SRMJEE for SRM — or directly on Class 12 merit. JEE Main remains the primary route for IITs, NITs, IIITs and most government-funded colleges, but it isn't the only path into a CSE degree."
          - q: "Is CSE oversaturated in 2026?"
            a: "The number of CSE graduates has grown sharply, and entry-level hiring has become more selective than it was a decade ago, but genuine demand for well-trained software, AI and data professionals remains strong. The real shift is that a plain degree is no longer enough — projects, internships and demonstrable coding skill now matter far more than they used to."
          - q: "What is a realistic starting salary after CSE?"
            a: "It depends heavily on your college. Reported median packages at top IITs and IIITs for CSE are often ₹15-21 LPA, but this reflects a small, highly competitive slice of graduates. Across most engineering colleges in India, a starting CSE salary in the ₹3-8 LPA range is far more typical and realistic."
      - note: "Figures are indicative (2026) — confirm on the official college or authority website."
        class: "table-note mt-lg"
