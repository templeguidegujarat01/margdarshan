  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Is BJMC only useful for TV news reporting?"
            a: "No. While TV/news reporting is the most visible career, BJMC graduates also work in print and digital journalism, public relations, corporate communications, advertising, social media management and content strategy — reporting is one path among several."
          - q: "Do I need to have studied Arts in Class 11-12 to take BJMC?"
            a: "No. BJMC is open to students from any Class 12 stream — Arts, Commerce or Science — since strong writing, communication skills and curiosity about current affairs matter more than a specific prior subject background."
          - q: "What is the difference between BJMC and Content Writer as a career?"
            a: "BJMC is a formal degree covering journalism, media production and communication broadly. Content Writer is a specific job role that BJMC graduates (and graduates from many other disciplines) can move into, focused on writing for digital platforms, brands or publications — you don't need a BJMC degree specifically to become a content writer."
          - q: "Are entrance exams required for BJMC admission?"
            a: "Many reputed institutes conduct their own entrance exams and interviews, testing English, current affairs, general knowledge and sometimes writing ability. Other colleges admit directly on Class 12 merit, or through CUET at central universities offering the programme."
          - q: "How much do fresh BJMC graduates earn in India?"
            a: "Starting salaries vary widely by role and organisation. Entry-level roles at regional media houses tend to pay modestly, while roles at larger national media companies, digital-first newsrooms or corporate communications teams can start considerably higher — building a strong portfolio and network matters a great deal in this field."
      - note: "*Fee and salary figures are indicative, based on publicly available information as of 2026, and vary significantly by institution and role — always verify current figures on the official college or institute website."
        class: "table-note mt-lg"
