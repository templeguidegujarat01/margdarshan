            value: "₹15–21 LPA"
            text: "Reported median CSE packages at a small number of elite institutes — genuinely achievable there, but not representative of CSE graduates overall."
          - label: "Experienced (4-8 years)"
            value: "₹15–40+ LPA"
            text: "Achievable with strong skills and experience, regardless of which college you started at — track record matters more than the degree after a few years."
  - id: "jobs"
    hid: "jobs-heading"
    eyebrow: "Where CSE graduates work"
    heading: "Job profiles, recruiters & industries"
    parts:
      - chips:
          - label: "Job profiles"
            text: "Software Engineer, Full-Stack Developer, Data Scientist, DevOps Engineer, Cybersecurity Analyst, AI/ML Engineer, Cloud Engineer, QA/Test Engineer"
          - label: "Top recruiters"
            text: "Global technology companies (Google, Microsoft, Amazon), Indian IT services firms (TCS, Infosys, Wipro), product startups, fintech companies, and consulting firms"
          - label: "Government routes"
            text: "PSU technical roles via GATE, DRDO and ISRO scientist/engineer positions, and government IT department roles via various state and central exams"
          - label: "Industries"
            text: "Software & IT services, fintech, e-commerce, healthcare technology, gaming, cybersecurity, and increasingly every traditional industry undergoing digital transformation"
  - id: "higher"
    hid: "higher-heading"
    alt: true
    eyebrow: "Beyond the degree"
    heading: "Higher studies"
    parts:
      - prose:
          - "An <strong>M.Tech</strong> via Graduate Aptitude Test in Engineering (GATE) is the standard route for students aiming at Public Sector Undertaking (PSU) jobs, research roles, or a shot at the IITs/IISc for postgraduate study. Others pursue an <strong>MS abroad</strong> (commonly in the US, Germany or Canada) for research or specialised technical roles, an <strong>Master of Business Administration (MBA)</strong> for a move into tech management or product roles, or industry certifications — Amazon Web Services (AWS), Azure, Google Cloud, or specialised AI/ML credentials — which are often more directly valued by employers than a further academic degree."
  - id: "proscons"
    hid: "pc-heading"
    eyebrow: "Honest take"
    heading: "Advantages and disadvantages"
    parts:
      - proscons:
          pros:
            - "The highest overall demand of any engineering branch, with genuinely global opportunities and strong remote-work options."
            - "Wide range of exit options — corporate roles, freelancing, startups, research, or further specialisation in Artificial Intelligence (AI), cloud or security."
            - "Skills gained (logic, problem-solving, systems thinking) transfer well beyond software into almost any tech-adjacent career."
          cons:
            - "JEE cutoffs for CSE at top colleges are the most competitive in the entire engineering entrance system."
            - "Without a strong college or demonstrable skills, starting salaries can be well below the headline figures people expect."
            - "Requires genuine, ongoing self-learning — tools and frameworks that matter shift every few years."
  - hid: "myth-heading"
    eyebrow: "Common myths"
    heading: "Myths vs facts"
    parts:
      - myths:
          - myth: "Every CSE graduate gets a ₹20+ LPA package."
            fact: "Those figures are median packages at a small number of top IITs and IIITs. Across most engineering colleges in India, a starting CSE salary in the ₹3.5-8 LPA range is far more typical."
          - myth: "You need to be a childhood coding prodigy to succeed in CSE."
            fact: "Most successful CSE students start programming from scratch in college. Consistent practice and genuine curiosity matter far more than any head start."
          - myth: "A CSE degree alone guarantees a good job."
            fact: "Recruiters increasingly weigh projects, internships and demonstrable coding skill over the degree itself — a plain, inactive CSE degree with no portfolio is a genuinely weak candidate profile in 2026."
