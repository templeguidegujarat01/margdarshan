          - label: "Where D.Pharm holders work"
            text: "Retail medical stores, hospital and clinic pharmacies, pharmaceutical distribution companies, diagnostic centres"
          - label: "Government routes"
            text: "Government hospital pharmacist posts, PSU/public sector healthcare units, various state health department vacancies (via relevant recruitment exams)"
          - label: "Self-employment"
            text: "Opening and running your own retail or wholesale medical store after PCI registration and obtaining a drug license"
  - id: "higher"
    hid: "higher-heading"
    alt: true
    eyebrow: "Beyond the diploma"
    heading: "Higher studies & degree progression"
    parts:
      - prose:
          - "<strong>Lateral entry to B.Pharm</strong> is a well-established path — many states and AICTE/PCI-approved colleges allow D.Pharm holders to join the second year of a B.Pharm programme directly. A B.Pharm opens up roles that specifically require it, such as <strong>Drug Inspector</strong> positions (in most states), pharmaceutical R&amp;D, quality assurance in manufacturing, and further study toward <strong>M.Pharm</strong> or <strong>Pharm.D</strong>. D.Pharm alone is sufficient for Registered Pharmacist status and most retail/hospital pharmacy roles, so upgrading is a matter of career ambition rather than a legal requirement to practise as a pharmacist."
  - id: "proscons"
    hid: "pc-heading"
    eyebrow: "Honest take"
    heading: "Advantages and disadvantages"
    parts:
      - proscons:
          pros:
            - "A genuine, regulated professional license (Registered Pharmacist) achievable in just 2 years."
            - "Strong, stable demand — every hospital, clinic and medical store needs registered pharmacists."
            - "Genuine self-employment route via opening your own medical store."
          cons:
            - "Salaried retail/hospital roles can plateau relatively early without upgrading to B.Pharm or starting your own store."
            - "Higher-responsibility roles like Drug Inspector or pharma R&amp;D typically require a B.Pharm instead."
            - "Opening your own store requires capital investment and separate drug licensing, not automatic with registration alone."
  - hid: "myth-heading"
    eyebrow: "Common myths"
    heading: "Myths vs facts"
    parts:
      - myths:
          - myth: "A D.Pharm holder cannot legally dispense medicines like a \"real\" pharmacist."
            fact: "Once registered with your State Pharmacy Council under the Pharmacy Act, 1948, a D.Pharm holder is a fully Registered Pharmacist, legally qualified to dispense medicines and run a licensed medical store."
          - myth: "You automatically become a Registered Pharmacist the moment you finish D.Pharm."
            fact: "You need to complete any required internship/practical training and formally register with your State Pharmacy Council — the diploma alone doesn't automatically confer registered status."
          - myth: "D.Pharm and B.Pharm lead to identical careers, so the shorter one is always better."
            fact: "Both qualify you as a Registered Pharmacist, but B.Pharm opens additional roles like Drug Inspector and pharmaceutical R&amp;D that D.Pharm alone does not."
