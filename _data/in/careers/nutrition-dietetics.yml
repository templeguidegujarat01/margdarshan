  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "What is the real difference between a Dietitian and a Nutritionist in India?"
            a: "It's a genuinely important distinction. In India, \"Dietitian\" — especially with Registered Dietitian (RD) status through the Indian Dietetic Association — reflects a structured, credentialed qualification typically requiring a BSc/MSc in Nutrition & Dietetics. \"Nutritionist\" is a largely unregulated title that almost anyone can adopt after a short course, with no legal requirement for a specific degree. Always check specific credentials before assuming equivalent expertise between the two."
          - q: "Is NEET required for Nutrition & Dietetics?"
            a: "No. Admission is via CUET, university-specific entrance exams, state-level admissions, or direct Class 12 merit, depending on the institute — NEET is not required."
          - q: "What is a realistic Dietitian salary in India?"
            a: "Freshers in clinical, employed roles commonly earn ₹2.5-4 LPA. Experienced hospital dietitians in private hospitals are reported to earn ₹4.2-9 LPA (roughly ₹35,000-75,000/month), with senior roles at top-tier hospitals sometimes exceeding ₹1 lakh/month. Registered Dietitians (RD) and certified clinical dietitians commonly earn ₹5-12 LPA. Nutritionists and wellness coaches building a private practice or online following have a genuinely variable, potentially higher income ceiling, but it depends heavily on their own client base and brand."
          - q: "Should I become a clinical dietitian or a wellness/online nutrition coach?"
            a: "It depends on your priorities. Clinical dietitian roles offer predictable, structured salary growth within hospitals and healthcare settings, and require formal credentials including ideally RD status. Wellness or online nutrition coaching is more entrepreneurial — often lower-paying at entry while you build a client base, but with a real, higher ceiling for those who successfully build a strong private practice or online brand. Neither path is universally better; it comes down to whether you prefer structured employment or are willing to build your own business."
          - q: "Do I need Registered Dietitian (RD) status?"
            a: "For clinical and hospital-based roles specifically, yes — RD status via the Indian Dietetic Association (IDA) is genuinely important for credibility and is often required by hospitals for dietitian positions. For wellness coaching or online nutrition consulting roles, RD status isn't strictly required, though it does strengthen your credibility and can help differentiate you in a field where the \"nutritionist\" title itself is largely unregulated."
      - note: "Figures are indicative (2026) — confirm on the official college or authority website."
        class: "table-note mt-lg"
