lede: "In Nebraska, the Nebraska State Bar Commission (Nebraska Supreme Court, Attorney Services Division) handles bar admission for lawyers, the Nebraska Board of Medicine and Surgery licenses physicians, the Nebraska State Board of Public Accountancy licenses CPAs and the Nebraska Board of Nursing licenses registered nurses."

