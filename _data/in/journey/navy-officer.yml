# Journey Blueprint — Indian Navy Executive Officer (NDA / INA 10+2 Cadet Entry via UPSC NDA & NA, or SSC Executive after B.E. / B.Tech). Printed on journey-navy-officer.html (_includes/journey-doubts.html).
# Rules, classes and the money items / sources several careers share: _data/in/journey_common.yml.
# `money_defs` / `sources` below are used only by this career; NDA money items come from nda-officer.yml.
# Check: node scripts/check-journey-matrix.mjs
id: navy-officer
v: 2
name: "Indian Navy Executive Officer (NDA · INA · SSC)"
search: ["indian navy executive officer", "navy officer", "naval officer", "indian navy officer", "join indian navy", "ssc executive navy", "naval academy"]
page: "nda.html"
roadmap: "roadmaps/nda.html"
doubts_page: "journey-navy-officer.html"
gate: "Class 12 with Physics, Chemistry and Maths → UPSC NDA & NA exam → SSB → NDA (Naval wing) or the Indian Naval Academy's 10+2 Cadet Entry → Executive Branch officer. Or: B.E. / B.Tech with 60% → Short Service Commission (Executive) → SSB → 44-week Naval Orientation Course at INA Ezhimala → Sub Lieutenant."
gate_source: [nda226, navy-ssc27, navy-gs]
core:
  what:
    text: "Executive Branch officers run the Navy's ships at sea — navigation, weapons, communications and command. Only Executive officers can aspire to command a warship. Entry is through UPSC's NDA & NA exam after Class 12, or through Short Service Commission after an engineering degree."
    source: [navy-gs, nda226, navy-ssc27]
  day:
    - "Keep watch on the bridge and navigate the ship."
    - "Lead sailors and run drills for weapons, damage control and boarding."
    - "Plan operations and take specialist courses such as navigation, gunnery or anti-submarine warfare."
  pay:
    - { level: "Sub Lieutenant, SSC entry (Jan 2027 course advertisement)", value: "Initial gross about ₹1,25,000 a month, plus allowances", source: navy-ssc27 }
  pay_note: "Pilot / Naval Air Operations Officer and submarine allowances of ₹31,250 a month are paid after training in those cadres."
  routes:
    - { title: "NDA (Naval wing)", text: "NDA (II) 2026 had 42 Navy vacancies (37 men, 5 women), all Executive branch. Class 12 with Physics, Chemistry and Maths; unmarried; born 1 Jan 2008 – 1 Jan 2011.", source: nda226 }
    - { title: "INA 10+2 Cadet Entry (through the NDA & NA exam)", text: "24 vacancies (21 men, 3 women) in NDA & NA (II) 2026, all Executive branch, for the course at the Indian Naval Academy from 1 July 2027.", source: nda226 }
    - { title: "SSC Executive (GS(X) / Hydro) after B.E. / B.Tech", text: "B.E. / B.Tech in any discipline with 60%; 76 vacancies for the Jan 2027 course; born 2 Jan 2002 – 1 Jul 2007. Commission for 12 years, extendable by up to 2.", source: navy-ssc27 }
  cost_time:
    - { label: "NDA & NA exam fee", value: "₹100 · SC, ST, women and some wards exempt", source: nda226 }
    - { label: "SSC Executive training", value: "44-week Naval Orientation Course at INA Ezhimala, then professional training", source: navy-gs }
    - { label: "10+2 B.Tech Cadet Entry", value: "Whole 4-year B.Tech training cost borne by the Navy", source: navy-btech27 }
  cost_note: "College fees for the B.E. / B.Tech before SSC differ by college, so they are not printed."
  challenges:
    - text: "Only unmarried candidates can train; marrying during training leads to discharge and a refund of pay and costs."
      source: navy-ssc27
    - text: "SSC Executive shortlisting is on normalised degree marks, and you need 60% in the degree to join."
      source: navy-ssc27
    - text: "NDA's Navy wing had only 42 seats in NDA (II) 2026."
      source: nda226
  not_for:
    - "You get seasick easily or cannot stay away from home for long voyages."
    - "You cannot meet strict medical and fitness standards."
    - "You do not want a disciplined, rank-based life."
journey:
  - stages: [c8, c9]
    title: "Maths, Physics and fitness"
    do:
      - text: "The Navy and Air Force wings of NDA, and the INA 10+2 Cadet Entry, need Class 12 with Physics, Chemistry and Mathematics."
        source: nda226
    doubts:
      - q: "What does an Executive officer in the Navy do?"
        a: "Executive (Surface Warfare) officers run the ship — navigation, weapons and command — and only Executive officers can aspire to command a warship. They later take specialist courses such as anti-submarine warfare, navigation, gunnery or diving."
        next: "Read the Routes list above."
        source: navy-gs
      - q: "Can girls join the Navy as officers?"
        a: "Yes. NDA (II) 2026 had 5 Navy seats and 3 INA 10+2 Cadet Entry seats for women, and SSC entries are open to men and women."
        next: "Check the women's vacancies in each notice."
        source: [nda226, navy-ssc27]
  - stages: [c10]
    title: "Choose PCM"
    do:
      - text: "Pick Physics, Chemistry and Maths in Class 11 — without them you cannot apply for the Naval wing or the INA 10+2 Cadet Entry."
        source: nda226
    stream: "Science with Physics, Chemistry and Maths."
    doubts:
      - q: "Can a Commerce student join the Navy through NDA?"
        a: "Not for the Navy. Only the Army wing of NDA takes Class 12 in any stream; the Naval and Air Force wings and the INA 10+2 Cadet Entry need Physics, Chemistry and Mathematics."
        next: "Take PCM if the Navy is your goal."
        source: nda226
  - stages: [c11, c12]
    title: "UPSC NDA & NA exam"
    do:
      - text: "You can apply while you are in Class 12."
        source: nda226
      - text: "The written exam has Mathematics (300) and the General Ability Test (600), with one-third of a mark cut for each wrong answer; SSB follows."
        source: nda226
    exams:
      - { name: "NDA & NA (II) 2026", when: "13 Sep 2026 · courses from 1 Jul 2027", source: nda226 }
    money: [nda-fee, nda-free, nda-aid]
    doubts:
      - q: "How many Navy seats were in NDA (II) 2026?"
        a: "42 at NDA (37 men, 5 women) and 24 in the INA 10+2 Cadet Entry (21 men, 3 women) — all for the Executive branch — out of 394 in total."
        next: "Put both Navy options in your preferences."
        source: nda226
      - q: "What is the age limit for NDA (II) 2026?"
        a: "Unmarried candidates born between 1 January 2008 and 1 January 2011."
        next: "Check the window in each new notice."
        source: nda226
      - q: "Is the NDA exam fee charged to everyone?"
        a: "No. SC and ST candidates, women and some wards of serving or ex JCOs / NCOs / ORs at Military or Sainik Schools are exempt; others pay ₹100."
        next: "Choose your category correctly in the form."
        source: nda226
      - q: "How many marks are the NDA written exam and SSB worth?"
        a: "Mathematics 300 and the General Ability Test 600 make 900 written marks; the SSB test and interview carry another 900."
        next: "Prepare for SSB as seriously as for the written exam."
        source: nda226
  - stages: [ug]
    title: "In college: aim for 60%"
    do:
      - text: "SSC Executive needs a B.E. / B.Tech in any discipline with at least 60%; for final-year students, marks up to the 5th semester are used for shortlisting."
        source: navy-ssc27
    doubts:
      - q: "Can I apply for Navy SSC in my final year of B.Tech?"
        a: "Yes. Final-year students with 60% can apply; marks up to the 5th semester are used for SSB shortlisting, and you must prove 60% in the final degree before joining INA."
        next: "Keep your aggregate above 60% every semester."
        source: navy-ssc27
      - q: "Does NCC help for Navy SSC?"
        a: "Yes. NCC 'C' certificate holders (at least 'B' grade, two years in the Senior Division, certificate not older than 1 January 2024) get a 5% relaxation in the shortlisting cut-off."
        next: "Complete your NCC 'C' certificate in college."
        source: navy-ssc27
      - q: "Is there a written exam for Navy SSC Executive?"
        a: "Not in the Jan 2027 advertisement: applications are shortlisted on normalised degree marks, then candidates attend the SSB interview, and the merit list is based on SSB marks."
        next: "Prepare for the SSB interview."
        source: navy-ssc27
  - stages: [grad]
    title: "SSC Executive after your degree"
    do:
      - text: "Selected candidates join as Sub Lieutenants and train for 44 weeks in the Naval Orientation Course at INA Ezhimala."
        source: [navy-ssc27, navy-gs]
    doubts:
      - q: "What is the age limit for Navy SSC Executive?"
        a: "For the Jan 2027 course: born between 2 January 2002 and 1 July 2007 for the Executive (GS(X) / Hydro) cadre."
        next: "Check each new advertisement's window."
        source: navy-ssc27
      - q: "How long is a Short Service Commission?"
        a: "12 years at first, extendable by up to 2 years subject to service needs, performance, medical fitness and willingness."
        next: "Plan your second career early."
        source: navy-ssc27
      - q: "What is the salary of a Navy Sub Lieutenant?"
        a: "The Jan 2027 SSC advertisement gives an initial gross salary of about ₹1,25,000 a month with other allowances as applicable."
        next: "See joinindiannavy.gov.in for the full pay details."
        source: navy-ssc27
  - stages: [work]
    title: "Training and probation"
    do:
      - text: "Probation is two years from the grant of the Sub Lieutenant rank, or until initial training ends, whichever is later."
        source: navy-ssc27
    doubts:
      - q: "What happens if I leave during training?"
        a: "An officer who withdraws from initial training or resigns during probation must refund the training cost in whole or part and the pay and allowances received, with interest."
        next: "Be sure before you join."
        source: navy-ssc27
      - q: "Is the 10+2 B.Tech Cadet Entry an Executive entry?"
        a: "No. It is a permanent-commission entry for the technical branches (Mechanical and Electronics & Communication), selected on the JEE (Main) rank and SSB; it needs 70% in PCM and 50% in English. The Navy pays the whole 4-year B.Tech training."
        next: "Choose NDA or SSC if you want the Executive branch."
        source: navy-btech27
board_note: "Any board, as long as Class 12 has Physics, Chemistry and Mathematics (for NDA's Naval wing and the INA 10+2 Cadet Entry)."
board_source: nda226
