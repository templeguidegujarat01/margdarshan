      - faq:
          - q: "How long is the ITI Wireman course?"
            a: "Wireman is typically a shorter trade, around 1 year under the NCVT-affiliated Craftsman Training Scheme, focused specifically on domestic and building wiring installation."
          - q: "What is the difference between Wireman and Electrician trades?"
            a: "Wireman is a shorter, more focused trade centred on domestic and building wiring installation. Electrician is a longer, broader 2-year trade also covering motors, electrical machines and industrial control systems. Wireman offers a faster entry point; Electrician offers wider long-term job scope."
          - q: "Can I upgrade from Wireman to Electrician later?"
            a: "There isn't a single standardised national bridge course between the two, though some states and institutes offer relevant progression options or allow experienced Wiremen to pursue the Electrician trade separately. Many Wiremen also build broader skills through work experience and apprenticeship instead."
          - q: "Can I legally work as an independent wiring contractor after this trade?"
            a: "Not fully independently. Most states require a separate Electrical Supervisor/Contractor License for independent electrical contracting work, typically needing relevant experience and a state licensing exam beyond the ITI certificate itself."
          - q: "What jobs can I get after ITI Wireman?"
            a: "Common roles include Wireman/Wiring Technician at construction sites and electrical contracting firms, assistant electrician roles in industries, and various state electricity board/DISCOM technical posts via relevant recruitment exams."
