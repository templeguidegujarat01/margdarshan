# Journey Blueprint — Government Computer Engineer (B.Tech CSE → ISRO / CERT-In / GATE). Printed on journey-computer-engineer.html.
# Rules, classes and the money items / sources several careers share: _data/in/journey_common.yml.
# This career reuses shared ids only (ISRO 2026 adverts live in journey_common.yml). Check: node scripts/check-journey-matrix.mjs
id: computer-engineer
v: 2
name: "Government Computer Engineer (ISRO · CERT-In · GATE CS)"
search: ["government computer engineer", "computer engineer", "computer science engineer", "cse engineer", "isro scientist computer science", "government software engineer"]
page: "cse.html"
roadmap: "roadmaps/cse.html"
doubts_page: "journey-computer-engineer.html"
gate: "Class 12 with Physics and Mathematics → JEE Main or your state CET → B.E. / B.Tech in Computer Science (65% for ISRO) → ISRO's written test or GATE CS score, or CERT-In's Scientist-B through GATE."
gate_source: [jm-ib, isro-cbt26, isro-gate26, certin-scb]
core:
  what:
    text: "A government computer engineer builds and runs the software, networks and security systems of national agencies — for example as an ISRO Scientist / Engineer 'SC' (Computer Science) or a CERT-In Scientist-B working on India's cyber security."
    source: [isro-cbt26, certin-scb]
  day:
    - "Write, test and maintain software for satellites, ground stations or government systems."
    - "Manage networks, data and servers securely."
    - "Investigate and fix security problems with other teams."
  pay:
    - { level: "Scientist / Engineer 'SC', ISRO (2026 adverts)", value: "Pay Level 10 · minimum basic ₹56,100 a month + DA, HRA, transport allowance", source: isro-gate26 }
    - { level: "CERT-In Scientist-B, Group A (2026 advert)", value: "Pay Level 10 · ₹56,100 – ₹1,77,500", source: certin-scb }
  pay_note: "Private-sector software salaries are not officially published."
  routes:
    - { title: "ISRO written test (CBT)", text: "Advt ISRO:ICRB:03(EMC):2026 had 21 Computer Science posts (BE003). B.E. / B.Tech in Computer Science Engineering with 65% or CGPA 6.84/10; age up to 28.", source: isro-cbt26 }
    - { title: "ISRO through GATE", text: "Advt ISRO:ICRB:02(EMC-CEPO):2026 had 13 Computer Science posts, shortlisted on a GATE 2025 or 2026 score in Computer Science & Information Technology.", source: isro-gate26 }
    - { title: "CERT-In Scientist-B", text: "2026 advert: 133 posts — 83 Computer Science and IT, 25 Data Science and AI, 25 Electronics and Communication — shortlisted on a GATE 2024 / 2025 / 2026 score.", source: certin-scb }
  cost_time:
    - { label: "ISRO application", value: "₹250 application fee; everyone first pays ₹750 processing fee, refunded after the written test (in full for women, SC, ST, PwBD, ex-servicemen)", source: isro-cbt26 }
    - { label: "GATE 2027 fee (one paper)", value: "₹2,000 · ₹1,000 for women, SC, ST, PwD (regular period)", source: gate27-fee }
  cost_note: "College fees depend on the institute and state, so they are not printed here."
  challenges:
    - text: "Computer Science had ISRO's highest 2026 GATE cut-off: a score of 827 (UR), against 690 for Electronics."
      source: isro-cut26
    - text: "Few posts: 21 + 13 Computer Science posts across ISRO's two 2026 adverts."
      source: [isro-cbt26, isro-gate26]
    - text: "CERT-In's final merit is 60% GATE score + 40% interview, and you need 50% (40% reserved) in the interview."
      source: certin-scb
  not_for:
    - "You want to skip Mathematics — JEE, GATE and ISRO's test all lean on it."
    - "You want a quick job without a national test — central posts select on GATE or a written test."
    - "You dislike strict rules on security and data — government systems follow them closely."
journey:
  - stages: [c8, c9]
    title: "Maths first, coding alongside"
    do:
      - text: "JEE Main for B.E. / B.Tech needs Physics and Mathematics in Class 12 — keep Maths strong now."
        source: jm-ib
    doubts:
      - q: "What does a government computer engineer do?"
        a: "Builds and runs software, networks and security systems for national agencies — for example ISRO's Scientist / Engineer 'SC' (Computer Science) or CERT-In's Scientist-B in cyber security."
        next: "Read the Routes list above."
        source: [isro-cbt26, certin-scb]
      - q: "Which central bodies recruit computer science engineers?"
        a: "ISRO (written test or GATE route) and CERT-In (GATE route) both had 2026 adverts for Computer Science graduates at Pay Level 10."
        next: "Keep Maths strong and start learning to code."
        source: [isro-cbt26, certin-scb]
  - stages: [c10]
    title: "Choose PCM"
    do:
      - text: "Take Physics, Chemistry and Mathematics in Class 11 — JEE Main's B.E. / B.Tech paper tests these subjects."
        source: jm-ib
    stream: "Science with Physics, Chemistry and Mathematics (PCM)."
    doubts:
      - q: "Can I do Computer Science without Maths in Class 12?"
        a: "Not through the B.E. / B.Tech route: JEE Main needs Physics and Mathematics in Class 12."
        next: "Choose PCM."
        source: jm-ib
      - q: "Does CERT-In accept an MCA or M.Sc instead of B.Tech?"
        a: "Yes. CERT-In's Scientist-B accepts a 4-year B.E. / B.Tech, a master's in science disciplines or an MCA in listed subjects such as Computer Science, IT and Cyber Security."
        next: "Keep the B.Sc / BCA → MCA route in mind."
        source: certin-scb
  - stages: [c11, c12]
    title: "JEE Main and your state CET"
    do:
      - text: "Write JEE Main (and your state engineering CET) for a B.E. / B.Tech in Computer Science."
        source: jm-ib
    doubts:
      - q: "Is IT the same as Computer Science for ISRO?"
        a: "ISRO's 2026 Computer Science posts asked for B.E. / B.Tech or equivalent in Computer Science Engineering with 65%; check the equivalence table in each advert before applying with another branch."
        next: "Prefer CSE in your choices."
        source: isro-cbt26
      - q: "Do board marks matter for ISRO?"
        a: "ISRO checks your degree marks (65% or CGPA 6.84/10), not your Class 12 percentage."
        next: "Focus on a strong degree record."
        source: isro-cbt26
  - stages: [ug]
    title: "B.Tech CSE: 65% and GATE CS"
    do:
      - text: "Keep <strong>65% aggregate (CGPA 6.84/10)</strong>; ISRO does not convert CGPA to percentage."
        source: isro-cbt26
      - text: "Write GATE from the third year of your degree."
        source: gate27-elig
    exams:
      - { name: "GATE 2027", when: "6–7, 13–14, 20–21 Feb 2027 · result 19 Mar 2027", source: gate27 }
    money: [gate-fee]
    doubts:
      - q: "What GATE score did ISRO need for Computer Science?"
        a: "ISRO's 2026 cut-off for Computer Science (BE003) was a GATE score of 827 for UR and 307 for PwBD."
        next: "Aim well above it."
        source: isro-cut26
      - q: "How old can my GATE score be?"
        a: "ISRO's 2026 GATE advert took GATE 2025 or 2026 scores; CERT-In's 2026 advert took GATE 2024, 2025 or 2026."
        next: "Plan GATE close to your final year."
        source: [isro-gate26, certin-scb]
      - q: "Which GATE paper do I need?"
        a: "Computer Science & Information Technology for ISRO's Computer Science posts. CERT-In also accepted the Data Science & AI and Electronics papers for its matching disciplines."
        next: "Register for the CS paper."
        source: [isro-gate26, certin-scb]
  - stages: [grad]
    title: "ISRO test, GATE posts, interviews"
    do:
      - text: "ISRO test: Part A — 80 discipline MCQs (90 minutes, +1, −1/3); Part B — 15 aptitude MCQs (30 minutes, no negative). Qualify with 50% in each part (40% reserved)."
        source: isro-cbt26
    exams:
      - { name: "ISRO Scientist / Engineer 'SC' CBT", when: "Postponed to 29 Oct 2026", source: isro-icrb13 }
    money: [isro-fee]
    doubts:
      - q: "What is the age limit for ISRO?"
        a: "28 years (as on 16 September 2026 for the CBT advert), with relaxation only as per Government of India orders."
        next: "Apply early."
        source: isro-cbt26
      - q: "How does ISRO pick candidates after the test?"
        a: "It calls 1:5 for interview (minimum 10). The final panel gives 50% weight to the written test and 50% to the interview."
        next: "Prepare your projects for the interview."
        source: isro-cbt26
      - q: "What does ISRO's interview check?"
        a: "Technical knowledge (40 marks), general awareness in your field (20), presentation and communication (20), comprehension (10) and academic achievements (10)."
        next: "Revise core CS subjects and practise explaining your projects."
        source: isro-cbt26
      - q: "How does CERT-In select?"
        a: "Shortlisting on GATE score, then an interview; final merit = 60% GATE score + 40% interview, with at least 50% (40% reserved) in the interview."
        next: "Score well in GATE first."
        source: certin-scb
      - q: "Does CERT-In charge a fee?"
        a: "No — CERT-In's 2026 Scientist-B advert had no application fee."
        next: "Apply when the next advert opens."
        source: certin-scb
  - stages: [work]
    title: "Switching from a private job"
    do:
      - text: "Serving employees need a no-objection certificate from their employer at ISRO's interview."
        source: isro-cbt26
    doubts:
      - q: "I am a software developer with 3 years' experience. Can I join ISRO?"
        a: "Yes, if you are within the age limit (28) and meet the 65% degree rule; selection is the same test (or GATE) and interview."
        next: "Watch isro.gov.in careers."
        source: [isro-cbt26, isro-gate26]
board_note: "Any board. JEE Main needs Physics and Mathematics in Class 12; ISRO judges your degree marks, not your board marks."
board_source: [jm-ib, isro-cbt26]
