# Ireland — study abroad sheet (shape: _data/in/abroad_common.yml header). Read 2026-10-29 (Immigration Service Delivery, Citizens Information, HEA).
id: ireland
name: Ireland
short: Ireland
region: Europe
currency: EUR
checked: 2026-10-29
review_by: 2027-01-29
status: open
eyebrow: "Study abroad · Europe"
title: "Study in Ireland from India"
seo_title: "Study in Ireland from India: Stamp 2, €10,000 and Stamp 1G"
description: "Ireland study visa from India: €10,000 a year funds, €60 visa fee, €300 IRP registration, 20/40 work hours on Stamp 2 and a 12 or 24-month Stamp 1G after graduating."
lede: "Ireland gives students on courses listed on the Interim List of Eligible Programmes (ILEP) a Stamp 2 permission with part-time work rights, and graduates of level 8 and level 9 degrees a Stamp 1G to look for graduate work."
facts:
  - { label: "Funds", value: "€10,000 for a one-year course", source: ci_visa }
  - { label: "Visa fee", value: "€60 single / €100 multiple", source: ci_visa }
  - { label: "Work", value: "20 h/week in term, 40 h in holidays", source: ci_rules }
  - { label: "After graduating", value: "Stamp 1G: 12 months (level 8), up to 24 (level 9+)", source: tlgp }
card:
  line: "English-speaking EU country; ILEP courses only for work rights"
  psw: "12–24 months (Stamp 1G)"
  work: "20 h/week; 40 in holidays"
  funds: "€10,000 a year + fees"
tests:
  - { exam: ielts, need: "Evidence of English ability with the visa; minimum for visas is set in the English language requirements document", source: isd_apply }
pillars:
  language_and_eligibility:
    heading: "English and course eligibility"
    parts:
      - points:
          - { t: "Send a certificate from the test provider with your visa application showing that you can do the course in English (or Irish).", source: isd_apply }
          - { t: "Only courses on the Interim List of Eligible Programmes (ILEP) give Stamp 2 and work rights; others get Stamp 2A with no right to work.", source: ci_rules }
  intakes_and_streams:
    heading: "Courses and limits"
    parts:
      - points:
          - { t: "Time on Stamp 2 and Stamp 1G together cannot exceed seven years (eight years if you go on to level 9 or above).", source: tlgp }
          - { t: "Non-EEA students coming for the first time may not get permission if they bring children or plan for them to join.", source: ci_visa }
      - note: "Most degree courses start in September; some postgraduate courses also start in January. Check each institution."
  tuition_and_living_costs:
    heading: "Money and fees"
    parts:
      - money:
          - { item: "Funds for a one-year course", cur: EUR, amount: 10000, per: "year (each later year too)", source: ci_visa }
          - { item: "Funds for a 6–8 month stay", cur: EUR, amount: 833, per: "month", source: ci_visa }
          - { item: "Study visa (single journey)", cur: EUR, amount: 60, per: "application", source: ci_visa }
          - { item: "Study visa (multiple journey)", cur: EUR, amount: 100, per: "application", source: ci_visa }
          - { item: "IRP registration fee", cur: EUR, amount: 300, per: "registration", source: ci_visa }
          - { item: "Minimum fees paid before the visa (if fees exceed €6,000)", cur: EUR, amount: 6000, per: "before applying", source: isd_apply }
      - points:
          - { t: "If course fees are under €6,000, pay them in full before the visa; if more, pay at least €6,000.", source: isd_apply }
          - { t: "Private medical insurance is required; the college may arrange it.", source: isd_apply }
  global_scholarships:
    heading: "Government of Ireland scholarship"
    parts:
      - awards:
          - { name: "Government of Ireland International Education Scholarship (GOI-IES)", by: "Higher Education Authority", who: "Students from outside the EU/EEA, Switzerland and UK with an offer for a master's, postgraduate diploma or PhD", gives: "€10,000 stipend for one year plus a full fee waiver from the host institution; 60 awards a year", url: "https://hea.ie/policy/internationalisation/goi-ies/", source: goi }
      - points:
          - { t: "The 2026 call closed at 5 pm Irish time on 12 March 2026; you need a conditional or final offer when you apply.", source: goi }
  application_funnel:
    heading: "From offer to IRP"
    parts:
      - steps:
          - { title: "Offer on an ILEP course", text: "Check the course is on the ILEP list if you want to work.", source: ci_rules }
          - { title: "Pay fees and insurance", text: "Pay at least €6,000 (or the full fee if lower) through an approved payment service; arrange private medical insurance.", source: isd_apply }
          - { title: "Apply online (AVATS)", text: "Submit the summary form, fee and documents: acceptance letter, fee receipt, English evidence, funds.", source: isd_apply }
          - { title: "Register on arrival", text: "Book an immigration registration appointment after arrival and pay €300 for the IRP card.", source: ci_visa }
  visa_chokepoints:
    heading: "The study visa in short"
    parts:
      - points:
          - { t: "Funds must be immediately accessible: €10,000 for a one-year course, plus ready access to the same for each later year.", source: ci_visa }
          - { t: "Bank statements must cover the last six months; explain large or irregular deposits.", source: isd_finance }
          - { t: "Documents not in English or Irish need a full certified translation.", source: isd_apply }
  post_study_work:
    heading: "Work during and after your course"
    parts:
      - points:
          - { t: "On Stamp 2 (ILEP course): casual work up to 20 hours a week in term and up to 40 hours a week from June to September and from 15 December to 15 January.", source: ci_rules }
          - { t: "Third Level Graduate Programme (Stamp 1G): 12 months after a level 8 award; after level 9 or above, 12 months renewable for another 12 if you show steps to find graduate work.", source: tlgp }
          - { t: "Apply within six months of being told you achieved the award, while holding Stamp 2 and a current IRP card; you can use the programme at most twice.", source: tlgp }
visa:
  slug: ireland-study-visa
  name: "Irish study visa (Stamp 2)"
  short: "Study visa"
  seo_title: "Ireland Study Visa from India: €10,000, Fees, IRP Steps"
  description: "Irish long-term study visa from India: AVATS form, €60 fee, €10,000 accessible funds, fees of €6,000 paid upfront, insurance, and €300 IRP registration on arrival."
  lede: "Indian students apply online through AVATS before travel, then register with immigration in Ireland. Money and paid fees are checked closely."
  facts:
    - { label: "Visa fee", value: "€60 single, €100 multiple", source: ci_visa }
    - { label: "Funds", value: "€10,000 a year", source: ci_visa }
    - { label: "Fees paid first", value: "At least €6,000 (or all, if lower)", source: isd_apply }
    - { label: "IRP card", value: "€300 on arrival", source: ci_visa }
  official:
    - { label: "ISD — How to apply for a long-term study visa", url: "https://www.irishimmigration.ie/coming-to-study-in-ireland/what-are-my-study-visa-options/how-to-apply-for-long-term-study-visa/" }
    - { label: "ISD — Third level graduate programme", url: "https://www.irishimmigration.ie/my-situation-has-changed-since-i-arrived-in-ireland/third-level-graduate-programme/" }
  sections:
    - id: steps
      nav: Steps
      eyebrow: "Order of work"
      heading: "Step by step"
      parts:
        - steps:
            - { title: "Letter of acceptance", text: "It must state fees payable, fees paid and whether the college took out insurance for you.", source: isd_apply }
            - { title: "Fees and money", text: "Fee receipt (approved payment service) and six months of statements showing €10,000 accessible.", source: isd_apply }
            - { title: "AVATS application", text: "Complete online, then send the signed summary form, fee and documents as told.", source: isd_apply }
            - { title: "IRP after arrival", text: "Book the registration appointment once you are in Ireland.", source: isd_reg }
    - id: chokepoints
      nav: "Common problems"
      eyebrow: "Where files go wrong"
      heading: "Choke points to check twice"
      parts:
        - points:
            - { t: "Credit-card limits are not accepted as funds.", source: isd_finance }
            - { t: "A course that is not on ILEP: no right to work (Stamp 2A).", source: ci_rules }
            - { t: "Fees below €6,000 not paid in full before applying.", source: isd_apply }
doubts:
  - { q: "How much bank balance is needed for an Irish study visa?", a: "Immediate access to at least 10,000 euros for a one-year course, and ready access to the same amount for each later year, on top of course fees.", source: ci_visa }
  - { q: "How many hours can students work in Ireland?", a: "On Stamp 2 for an ILEP course, up to 20 hours a week in term and up to 40 hours a week from June to September and from 15 December to 15 January.", source: ci_rules }
  - { q: "How long can I stay in Ireland after my master's?", a: "A level 9 graduate gets Stamp 1G for 12 months, renewable for another 12 months if you show you are looking for graduate work. Level 8 graduates get 12 months.", source: tlgp }
  - { q: "What is the IRP fee in Ireland?", a: "The standard registration fee for the Irish Residence Permit is 300 euros.", source: ci_visa }
