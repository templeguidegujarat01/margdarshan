    kind: stipend
    name: "MBBS internship stipend"
    by: "Your medical college / state, under NMC's internship regulations"
    who: "Every MBBS intern, for the 12-month internship. It is not paid during extensions, except approved medical, maternity or paternity leave. The rate is fixed by the authority that runs your college, so it differs between states and colleges."
    apply: "Nothing to apply for — ask your college for the current rate."
    stages: [grad]
    source: crmi
