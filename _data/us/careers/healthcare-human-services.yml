# Healthcare & Human Services careers (USA Master Plan Phase 2). Schema: comment at the top of
# _includes/us-career-overview.html. Every fact is copied from the page its `source` names, opened 2026-10-20:
# BLS Occupational Outlook Handbook (pay May 2025, jobs 2025, outlook 2025–35; the BLS pages were last modified
# 27 Aug 2026), the exam owners, federal rules and the state boards in _data/us/sources.yml.
# Batch 1 = the 16 largest BLS occupations placed in this cluster (by 2025 employment); the queue for later batches is
# in docs/us-edition/PHASE-2-HEALTHCARE.md. A `pathway:` entry keeps its existing us/careers/<pathway>/ page and only
# gets a roadmap here. `states_from: <license id>` draws the roadmap's state matrix from that license's `boards`.
checked: 2026-10-20
review_by: 2027-04-20
list:

  # 1 — 4,677,100 jobs
  - slug: home-health-aide
    short: "Home Health & Personal Care Aide"
    title: "Home health or personal care aide: training to first job"
    eyebrow: "Healthcare & Human Services · Personal Care Services"
    lede: "Most aides start with a high school diploma (some jobs need none) and learn on the job. Aides in home health or hospice agencies paid by Medicare must finish at least 75 hours of training and a competency evaluation."
    for: "People who want to start working in care quickly, are patient and dependable, and are comfortable with physical work such as lifting or turning clients."
    soc: ["31-1120"]
    does: { text: "Home health and personal care aides monitor the condition of people with disabilities or chronic illnesses and help them with daily living activities.", source: ooh_qf_hha }
    work: { text: "Home health and personal care aides work in a variety of settings, including clients’ homes, group homes, and day services programs. Most aides work full time, although part-time work is common. Work schedules may vary.", source: ooh_qf_hha }
    become: { text: "Home health and personal care aides typically need a high school diploma or equivalent, but some positions do not require it. Those working in certified home health or hospice agencies may need to complete formal training or pass a standardized test.", source: ooh_qf_hha }
    metrics: { pay: 35800, pay_hour: "17.21", pay_by: "Home health and personal care aides", jobs: 4677100, outlook: 18, outlook_words: "Much faster than average", change: 847300, entry: "High school diploma or equivalent", training: "Short-term on-the-job training", source: ooh_qf_hha }
    license_text: "Some states"
    routes:
      - id: agency
        title: "Certified home health or hospice agency"
        tag: "Federal training rule"
        who: "For aides hired by home health agencies that take Medicare or other federal payments."
        steps:
          - { tag: "Start", title: "High school diploma or equivalent", text: "Typical, though some positions do not require it.", kind: start, source: ooh_hha }
          - { tag: "75+ hours", title: "Home health aide training", text: "Classroom and supervised practical training of at least 75 hours; at least 16 hours of classroom training come before at least 16 hours of supervised practical training.", kind: stage, source: cfr_484_80 }
          - { tag: "Evaluation", title: "Competency evaluation", text: "A qualified home health aide has completed a training and competency evaluation program, a competency evaluation program, or a state-approved nurse aide program and is listed on the state nurse aide registry.", kind: exam, source: cfr_484_80 }
          - { tag: "State rules", title: "State license or certification, where required", text: "Some states require home health aides to have a license or certification, which may involve training, a background check and a competency exam. Check with your state board of health.", kind: licence, source: ooh_hha }
          - { tag: "Goal", title: "Home health aide", text: "", kind: goal, source: ooh_qf_hha }
      - id: private
        title: "Personal care aide with a private agency or family"
        tag: "Fastest start"
        who: "For private care agencies that do not receive federal funds; their requirements vary by state."
        steps:
          - { tag: "Start", title: "High school diploma (often)", text: "Some positions do not require a formal educational credential.", kind: start, source: ooh_hha }
          - { tag: "On the job", title: "Training on the job or in a program", text: "Personal hygiene, reading and recording vital signs, infection control and basic nutrition.", kind: stage, source: ooh_hha }
          - { tag: "Often asked", title: "First aid and CPR certification", text: "Aides also may be required to get first aid and CPR certification.", kind: stage, source: ooh_hha }
          - { tag: "Goal", title: "Personal care aide", text: "", kind: goal, source: ooh_qf_hha }
    states_note: "Home health aide rules vary by state: some states license or certify aides. Ask your state board of health, and ask the agency whether it is Medicare-certified (then the federal 75-hour rule applies)."
    states_source: ooh_hha

  # 2 — 3,465,400 jobs (existing pathway page us/careers/nursing/)
  - slug: registered-nurse
    pathway: nursing
    short: "Registered Nurse"
    title: "Registered nurse (RN): every route to the RN license"
    eyebrow: "Healthcare & Human Services · Physical Health"
    lede: "Three education paths lead to the same NCLEX-RN and state license: a bachelor's in nursing (BSN), an associate's degree (ADN/ASN) or a hospital diploma. Many nurses also climb the ladder from nursing assistant or LPN."
    for: "Students who like science and want direct patient care, can handle stress and long shifts, and may later want advanced practice (NP, midwife, anesthetist)."
    routes:
      - id: bsn
        title: "Bachelor of Science in Nursing (BSN)"
        tag: "Hospitals may require it"
        who: "Straight from high school; employers, particularly hospitals, may require a bachelor's degree."
        steps:
          - { tag: "Start", title: "High school diploma", text: "", kind: start, source: ooh_rn }
          - { tag: "About 4 years", title: "BSN program", text: "Courses in anatomy, physiology, microbiology, psychology and social sciences, plus supervised clinical experience.", kind: stage, source: ooh_rn }
          - { tag: "Exam", title: "NCLEX-RN", text: "The national licensure exam used by U.S. boards of nursing.", kind: exam, source: ncsbn_nclex, href: "us/professional-licenses/nursing/#exams", link: "NCLEX-RN details" }
          - { tag: "License", title: "State RN license", text: "Issued by the state where you work; other rules, such as a criminal background check, vary by state.", kind: licence, source: ooh_rn, href: "us/professional-licenses/nursing/", link: "RN license steps" }
          - { tag: "Goal", title: "Registered nurse", text: "", kind: goal, source: ooh_qf_rn }
      - id: adn
        title: "Associate's degree (ADN/ASN) or hospital diploma"
        tag: "Also qualifies"
        who: "Licensed graduates of any of the three program types qualify for entry-level staff nurse jobs."
        steps:
          - { tag: "Start", title: "High school diploma", text: "", kind: start, source: ooh_rn }
          - { tag: "Program", title: "ADN, ASN or diploma program", text: "Diploma programs, usually offered by hospitals or medical centers, typically take 2 to 3 years; there are far fewer of them than BSN and ADN programs.", kind: stage, source: ooh_rn }
          - { tag: "Exam", title: "NCLEX-RN", text: "", kind: exam, source: ncsbn_nclex, href: "us/professional-licenses/nursing/#exams", link: "NCLEX-RN details" }
          - { tag: "License", title: "State RN license", text: "", kind: licence, source: ooh_rn, href: "us/professional-licenses/nursing/", link: "RN license steps" }
          - { tag: "Optional", title: "RN-to-BSN program", text: "Nurses with an ADN, ASN or diploma may go back to school for a bachelor's degree; some employers offer tuition reimbursement.", kind: stage, source: ooh_rn }
          - { tag: "Goal", title: "Registered nurse", text: "", kind: goal, source: ooh_qf_rn }
      - id: ladder
        title: "The nursing ladder: CNA → LPN → RN → NP"
        tag: "Earn while you climb"
        who: "Start working in a few months, then add one license at a time."
        steps:
          - { tag: "Start", title: "Nursing assistant (CNA)", text: "A state-approved program and the state competency exam put you on the nurse aide registry.", kind: start, source: ooh_cna, href: "us/careers/nursing-assistant/", link: "Nursing assistant" }
          - { tag: "About 1 year", title: "Practical nursing program", text: "", kind: stage, source: ooh_lpn }
          - { tag: "Exam", title: "NCLEX-PN", text: "", kind: exam, source: ncsbn_exams, href: "us/professional-licenses/practical-nursing/#exams", link: "NCLEX-PN details" }
          - { tag: "License", title: "LPN or LVN license", text: "", kind: licence, source: ooh_lpn, href: "us/professional-licenses/practical-nursing/", link: "LPN license steps" }
          - { tag: "Bridge", title: "LPN-to-RN program", text: "", kind: stage, source: ooh_lpn }
          - { tag: "Exam", title: "NCLEX-RN", text: "", kind: exam, source: ncsbn_nclex, href: "us/professional-licenses/nursing/#exams", link: "NCLEX-RN details" }
          - { tag: "License", title: "RN license", text: "", kind: licence, source: ooh_rn, href: "us/professional-licenses/nursing/", link: "RN license steps" }
          - { tag: "Master's", title: "APRN graduate program", text: "An RN license comes first; most APRN programs prefer a BSN, and some offer bridge programs for nurses with an associate's degree or diploma.", kind: stage, source: ooh_aprn }
          - { tag: "Goal", title: "Nurse practitioner, midwife or anesthetist", text: "National certification exam and a state APRN license.", kind: goal, source: ooh_aprn, href: "us/careers/nurse-practitioner/", link: "APRN career page" }
    states_note: "Each state's board of nursing sets the RN licensing rules. Other requirements, such as a criminal background check, vary by state. The RN license page lists the Nurse Licensure Compact states."
    states_source: ooh_rn
    certs:
      - { name: "Specialty certification", who: "Professional associations", text: "Usually voluntary, in areas such as ambulatory care, gerontology or pediatrics; some employers require it. Jobs may also ask for CPR, BLS or ACLS certification.", source: ooh_rn }

  # 3 — 1,558,700 jobs
  - slug: nursing-assistant
    short: "Nursing Assistant (CNA) & Orderly"
    title: "Nursing assistant (CNA): program, competency exam and state registry"
    eyebrow: "Healthcare & Human Services · Physical Health"
    lede: "Nursing assistants usually finish a state-approved program (at least 75 hours under federal rules for nursing homes), pass the state competency exam and go on the state registry. Orderlies typically need a high school diploma and short on-the-job training."
    for: "People who want a fast start in patient care and a first step on the nursing ladder; the work is physical and needs patience."
    soc: ["31-1131", "31-1132"]
    does: { text: "Nursing assistants provide basic care and help patients with activities of daily living. Orderlies transport patients and clean treatment areas.", source: ooh_qf_cna }
    work: { text: "Most nursing assistants and orderlies work in nursing and residential care facilities and in hospitals. They are physically active and may need to help lift or move patients.", source: ooh_qf_cna }
    become: { text: "Nursing assistants often need to complete a state-approved education program and pass their state’s competency exam to become licensed or certified. Orderlies typically have at least a high school diploma.", source: ooh_qf_cna }
    metrics: { pay: 41870, pay_hour: "20.13", pay_by: "Nursing assistants and orderlies", jobs: 1558700, outlook: 3, outlook_words: "As fast as average", change: 41100, entry: "State-approved program (nursing assistants); high school diploma (orderlies)", training: "Brief on-the-job training", source: ooh_qf_cna }
    license_text: "State certification and registry"
    routes:
      - id: cna
        title: "Certified nursing assistant (CNA)"
        tag: "Most common"
        who: "Programs are offered in high schools, community colleges, vocational and technical schools, hospitals and nursing homes."
        steps:
          - { tag: "Start", title: "Find a state-approved program", text: "", kind: start, source: ooh_cna }
          - { tag: "75+ hours", title: "Nurse aide training", text: "A state-approved program has at least 75 clock hours of training, including at least 16 hours of supervised practical training.", kind: stage, source: cfr_483_152 }
          - { tag: "Exam", title: "State competency exam", text: "Passing it lets you use state-specific titles; in some states the title is Certified Nursing Assistant (CNA).", kind: exam, source: ooh_cna }
          - { tag: "Registry", title: "State nurse aide registry", text: "Nursing assistants who pass are placed on the state registry; you must be on it to work in a nursing home. Some states add continuing education or a background check.", kind: licence, source: ooh_cna }
          - { tag: "Goal", title: "Nursing assistant", text: "Some states offer extra credentials, such as Certified Medication Assistant (CMA).", kind: goal, source: ooh_cna }
      - id: ladder
        title: "Keep climbing: CNA → LPN → RN"
        tag: "Next steps"
        who: "Many nurses start as nursing assistants."
        steps:
          - { tag: "Start", title: "Working as a CNA", text: "", kind: start, source: ooh_cna }
          - { tag: "About 1 year", title: "Practical nursing program", text: "", kind: stage, source: ooh_lpn }
          - { tag: "Exam", title: "NCLEX-PN", text: "", kind: exam, source: ncsbn_exams, href: "us/professional-licenses/practical-nursing/#exams", link: "NCLEX-PN details" }
          - { tag: "License", title: "LPN or LVN license", text: "", kind: licence, source: ooh_lpn, href: "us/professional-licenses/practical-nursing/", link: "LPN license steps" }
          - { tag: "Goal", title: "Licensed practical nurse, then RN", text: "An LPN may complete an LPN-to-RN program to become a registered nurse.", kind: goal, source: ooh_lpn, href: "us/roadmaps/registered-nurse.html", link: "RN roadmap" }
      - id: orderly
        title: "Orderly"
        tag: "No license"
        who: "Orderlies do not need a license."
        steps:
          - { tag: "Start", title: "High school diploma or equivalent", text: "", kind: start, source: ooh_cna }
          - { tag: "On the job", title: "Short on-the-job training", text: "", kind: stage, source: ooh_cna }
          - { tag: "Often asked", title: "CPR or basic life support certification", text: "Jobs might require it.", kind: stage, source: ooh_cna }
          - { tag: "Goal", title: "Orderly", text: "", kind: goal, source: ooh_qf_cna }
    states_note: "Specific requirements for nursing assistants vary by state, including the title, continuing education and background checks. Check with your state's certifying agency."
    states_source: ooh_cna

  # 4 — 862,800 jobs (existing pathway page us/careers/medicine/)
  - slug: physician
    pathway: medicine
    short: "Physician"
    title: "Physician (M.D. or D.O.): pre-med to residency and license"
    eyebrow: "Healthcare & Human Services · Physical Health"
    lede: "A bachelor's degree with science courses, the MCAT, 4 years of medical school (M.D. or D.O.), national licensing exams, 3 to 9 years of residency and a state medical license."
    for: "Students ready for a long route of study and residency after high school, who like science and want to diagnose and treat patients."
    routes:
      - id: md
        title: "Pre-med → MCAT → M.D. → USMLE → residency"
        tag: "M.D."
        who: "No specific undergraduate major is required; applicants usually studied biology, physical science or a health field."
        steps:
          - { tag: "Start", title: "High school diploma", text: "", kind: start, source: ooh_physicians }
          - { tag: "4 years", title: "Bachelor's degree with pre-med courses", text: "", kind: stage, source: ooh_physicians }
          - { tag: "Exam", title: "MCAT", text: "Medical schools ask for transcripts, MCAT scores and letters of recommendation; most also interview.", kind: exam, source: ooh_physicians, href: "us/tests/#grad-tests", link: "MCAT on the tests page" }
          - { tag: "4 years", title: "Medical school (M.D.)", text: "Classroom and lab study first, then clinical rotations in areas such as internal medicine, pediatrics and surgery.", kind: stage, source: ooh_physicians }
          - { tag: "Exam", title: "USMLE Step 1, Step 2 CK, Step 3", text: "Taken at different points of M.D. education and training; results go to state medical boards.", kind: exam, source: usmle, href: "us/professional-licenses/medicine/#exams", link: "USMLE details" }
          - { tag: "3–9 years", title: "Residency", text: "Almost all graduates enter a residency in their specialty; a fellowship adds 1 to 3 years.", kind: stage, source: ooh_physicians }
          - { tag: "License", title: "State medical license", text: "All states require physicians to be licensed; requirements vary by state.", kind: licence, source: ooh_physicians, href: "us/professional-licenses/medicine/", link: "Medical license steps" }
          - { tag: "Goal", title: "Physician", text: "Board certification is not required but may increase job opportunities.", kind: goal, source: ooh_physicians }
      - id: do
        title: "Pre-med → MCAT → D.O. → COMLEX-USA → residency"
        tag: "D.O."
        who: "Osteopathic medical schools award the D.O.; the licensing exam is COMLEX-USA."
        steps:
          - { tag: "Start", title: "High school diploma", text: "", kind: start, source: ooh_physicians }
          - { tag: "4 years", title: "Bachelor's degree with pre-med courses", text: "", kind: stage, source: ooh_physicians }
          - { tag: "Exam", title: "MCAT", text: "", kind: exam, source: ooh_physicians, href: "us/tests/#grad-tests", link: "MCAT on the tests page" }
          - { tag: "4 years", title: "Medical school (D.O.)", text: "", kind: stage, source: ooh_physicians }
          - { tag: "Exam", title: "COMLEX-USA Level 1, Level 2-CE, Level 3", text: "Levels 1 and 2-CE are required to graduate from accredited D.O. programs.", kind: exam, source: nbome_comlex, href: "us/professional-licenses/medicine/#exams", link: "COMLEX details" }
          - { tag: "3–9 years", title: "Residency", text: "", kind: stage, source: ooh_physicians }
          - { tag: "License", title: "State medical license", text: "", kind: licence, source: ooh_physicians, href: "us/professional-licenses/medicine/", link: "Medical license steps" }
          - { tag: "Goal", title: "Physician (D.O.)", text: "", kind: goal, source: ooh_physicians }
      - id: combined
        title: "Combined bachelor's + M.D. program"
        tag: "6–8 years"
        who: "Some medical schools offer combined undergraduate and medical school programs; schools may also offer M.D.-Ph.D., M.D.-MBA or M.D.-MPH."
        steps:
          - { tag: "Start", title: "High school diploma", text: "", kind: start, source: ooh_physicians }
          - { tag: "6–8 years", title: "Combined undergraduate and medical school program", text: "", kind: stage, source: ooh_physicians }
          - { tag: "Exam", title: "USMLE or COMLEX-USA", text: "", kind: exam, source: usmle, href: "us/professional-licenses/medicine/#exams", link: "Licensing exams" }
          - { tag: "3–9 years", title: "Residency", text: "", kind: stage, source: ooh_physicians }
          - { tag: "License", title: "State medical license", text: "", kind: licence, source: ooh_physicians, href: "us/professional-licenses/medicine/", link: "Medical license steps" }
          - { tag: "Goal", title: "Physician", text: "", kind: goal, source: ooh_physicians }
    states_note: "Each state medical board sets its own licensing rules; passing USMLE or COMLEX-USA alone does not grant a license. The Interstate Medical Licensure Compact list is on the medical license page."
    states_source: ooh_physicians

  # 5 — 833,900 jobs
  - slug: medical-assistant
    short: "Medical Assistant"
    title: "Medical assistant: certificate or on-the-job route"
    eyebrow: "Healthcare & Human Services · Health Data & Administration"
    lede: "Most medical assistants finish a 1- to 2-year certificate or associate's program with a practicum; some start with a high school diploma and learn on the job. Most states do not require certification, but employers may prefer it."
    for: "People who like both office work and patient contact: scheduling, records and taking vital signs."
    soc: ["31-9092"]
    does: { text: "Medical assistants complete administrative and clinical tasks, such as scheduling appointments and taking patients’ vital signs.", source: ooh_qf_medasst }
    work: { text: "Most medical assistants work full time. They are employed in physicians’ offices, hospitals, outpatient clinics, and other healthcare facilities.", source: ooh_qf_medasst }
    become: { text: "Medical assistants typically need postsecondary education, such as a certificate. Some enter the occupation with a high school diploma and learn through on-the-job training.", source: ooh_qf_medasst }
    metrics: { pay: 45690, pay_hour: "21.97", pay_by: "Medical assistants", jobs: 833900, outlook: 13, outlook_words: "Much faster than average", change: 107600, entry: "Postsecondary nondegree award", training: "None", source: ooh_qf_medasst }
    license_text: "Some states"
    routes:
      - id: program
        title: "Certificate or associate's program"
        tag: "Most common"
        who: "Programs at community colleges, vocational and technical schools and universities."
        steps:
          - { tag: "Start", title: "High school diploma (biology, chemistry)", text: "", kind: start, source: ooh_medasst }
          - { tag: "1–2 years", title: "Medical assistant program", text: "Medical terminology, anatomy and pharmacology, with supervised experience such as a practicum or internship.", kind: stage, source: ooh_medasst }
          - { tag: "Optional exam", title: "Certification exam", text: "Most states do not require it, but employers may prefer or require certification; it is available from a number of organizations.", kind: exam, source: ooh_medasst }
          - { tag: "State rules", title: "State requirements, where they exist", text: "Some states require graduation from an accredited program, a license or certification.", kind: licence, source: ooh_medasst }
          - { tag: "Goal", title: "Medical assistant", text: "", kind: goal, source: ooh_qf_medasst }
      - id: ojt
        title: "On-the-job training or apprenticeship"
        tag: "Earn while you learn"
        who: "Some employers hire high school graduates and train them."
        steps:
          - { tag: "Start", title: "High school diploma", text: "", kind: start, source: ooh_medasst }
          - { tag: "Several months", title: "On-the-job training or apprenticeship", text: "Physicians or other medical assistants teach tasks such as taking vital signs.", kind: stage, source: ooh_medasst }
          - { tag: "Often asked", title: "Basic Life Support (BLS) certification", text: "", kind: stage, source: ooh_medasst }
          - { tag: "Goal", title: "Medical assistant", text: "", kind: goal, source: ooh_qf_medasst }
    certs:
      - { name: "CMA (AAMA)", who: "American Association of Medical Assistants", text: "One of the medical assisting certifications employers may ask for.", source: aama_cma }
    states_note: "Some states require medical assistants to graduate from an accredited program, be licensed or certified, or meet other prerequisites. Contact your state licensing agency."
    states_source: ooh_medasst

  # 6 — 816,100 jobs
  - slug: social-worker
    short: "Social Worker"
    title: "Social worker: BSW, MSW, ASWB exams and the clinical license"
    eyebrow: "Healthcare & Human Services · Community & Social Services"
    lede: "A bachelor's in social work (BSW) is the usual entry for nonclinical jobs. Clinical social workers need a master's (MSW), supervised clinical experience, the ASWB Clinical exam and a state license."
