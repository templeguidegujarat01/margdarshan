# District of Columbia (USA 50-state licensure portal, 2026-10-22). Schema: _data/us/state_index.yml. Boards tier: the
# licensing boards for lawyers, physicians, CPAs and nurses, copied from the national directories of state boards (NCBE,
# FSMB, NASBA, NCSBN). Diploma, state test, tuition, aid, jobs and apprenticeship blocks are still in the Phase 11 queue;
# the page prints only the blocks that exist.
name: "District of Columbia"
abbr: DC
checked: 2026-10-22
review_by: 2027-04-22
lede: "In District of Columbia, the Committee on Admissions, D.C. Court of Appeals handles bar admission for lawyers, the District of Columbia Board of Medicine licenses physicians, the District of Columbia Board of Accountancy licenses CPAs and the District of Columbia Board of Nursing licenses registered nurses."

boards:
  # 50-state portal (2026-10-22): bar admission agency (NCBE jurisdiction page), medical board(s) (FSMB directory),
  # board of accountancy (NASBA directory), board of nursing (NCSBN member page). Links checked 2026-10-22.
  law: { body: "Committee on Admissions, D.C. Court of Appeals", url: "https://admissions.dcappeals.gov", stat: "UBE", exam: "Uniform Bar Exam (MBE, MEE and MPT).", note: "MPRE required (passing score 75). NextGen UBE from February 2028.", src: ncbe_dc }
  medicine:
    src: fsmb_boards
    boards:
      - { body: "District of Columbia Board of Medicine", url: "https://dchealth.dc.gov/bomed" }
  cpa:
    src: nasba_boards
    boards:
      - { body: "District of Columbia Board of Accountancy", url: "https://dlcp.dc.gov/page/board-accountancy" }
  nursing:
    src: ncsbn_dc
    boards:
      - { body: "District of Columbia Board of Nursing", url: "https://dchealth.dc.gov/bon" }
