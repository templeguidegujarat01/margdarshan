  # ------------------------------------------------------------------------------------------------ Judo
  - slug: judo
    short: "Judo"
    domain: combat
    checked: 2026-10-17
    body: "International Judo Federation (IJF) · Judo Federation of India (JFI)"
    card: "IJF 2026 scoring (yuko, waza-ari, ippon), 7 + 7 Olympic weight classes, the day-before weigh-in, JFI sub-junior to senior nationals, SAI centres and jobs."
    card_facts: ["7 + 7 Olympic weight classes", "4-minute contest", "+5% random weigh-in"]
    eyebrow: "Sports Cockpit · Combat &amp; Mat · IJF rules 2026 · LA28 qualification"
    title: "Judo — scores, weight classes, weigh-in &amp; the road to LA28"
    lede: "Education Margdarshan's judo map for India in simple words: how a judo contest is won (yuko, waza-ari, ippon), the weight classes for cadets, juniors and seniors, the two weigh-ins, how LA28 places are won on the world ranking, JFI's ladder from sub-junior nationals, the SAI centres, who pays, and the jobs and awards after a medal."
    official:
      - { label: "IJF LA28 qualification system (PDF)", url: "https://78884ca60822a34fb0e6-082b8fd5551e97bc65e327988b444396.ssl.cf3.rackcdn.com/up/2026/06/JUD-LA28-Qualification-System--1781162989.pdf" }
      - { label: "onlinejfi.org", url: "https://onlinejfi.org/" }
    facts:
      - { label: "Olympic weight classes (LA28)", value: "<strong>7 men · 7 women</strong> + mixed team", source: ijf-la28 }
      - { label: "Contest time", value: "<strong>4 minutes</strong> (sub-juniors in India: 3)", source: "ijf-ref,jfi-subjr26" }
      - { label: "Youngest age at IJF events", value: "<strong>15</strong> (calendar year)", source: ijf-sor }
      - { label: "Random weigh-in on the day", value: "Max <strong>5% over</strong> your category", source: ijf-sor }
    sections:
      - id: rules
        nav: "Scores &amp; classes"
        eyebrow: "Core rules &amp; selection formats"
        heading: "How a judo contest is won, and the weight classes"
        parts:
          - p: "Judo is a Japanese sport made by Jigoro Kano from jujutsu. You must <strong>hold the opponent's jacket (judogi)</strong> to fight. You win by throwing the opponent flat on the back, by holding them down on the mat, or when they give up to an arm-lock or a choke."
            source: ijf-ref
          - table:
              caption: "IJF scores — what each one means"
              head: ["Score", "How you get it", "Hold-down time"]
              rows:
                - ["<strong>Ippon</strong> — wins the contest at once", "A clean, fast throw that lands the opponent on the back with control; or the opponent gives up", "<strong>20 seconds</strong>"]
                - ["<strong>Waza-ari</strong>", "A throw that is not quite ippon. <strong>Two waza-ari = ippon</strong>", "10–19 seconds"]
                - ["<strong>Yuko</strong>", "A smaller score, for example the opponent lands on both buttocks", "5–9 seconds"]
            source: ijf-ref
          - list:
              - "A senior, junior or cadet contest lasts <strong>4 minutes</strong> of real fighting time."
              - "If the scores are level at 4 minutes, the contest goes to <strong>golden score</strong>: the first score wins."
              - "Penalties are called <strong>shido</strong>. A penalty is <strong>never a score</strong> — you cannot win just because the other judoka has more shidos. The <strong>third shido is hansoku-make</strong>, and you lose the contest."
              - "The judoka on top of the draw sheet wears a <strong>white judogi</strong>, the one below wears <strong>blue</strong>."
            source: "ijf-ref,ijf-sor"
          - table:
              caption: "IJF weight classes (kg) — senior and junior are the same"
              head: ["Group", "Women", "Men"]
              rows:
                - ["<strong>Senior &amp; junior (U21)</strong>", "48 · 52 · 57 · 63 · 70 · 78 · +78", "60 · 66 · 73 · 81 · 90 · 100 · +100"]
                - ["<strong>Cadet (U18)</strong>", "40 · 44 · 48 · 52 · 57 · 63 · 70 · +70", "50 · 55 · 60 · 66 · 73 · 81 · 90 · +90"]
            source: ijf-sor
          - table:
              caption: "IJF age groups (age in the calendar year)"
              head: ["Group", "Ages"]
              rows:
                - ["Cadet (U18)", "15, 16 and 17"]
                - ["Junior (U21)", "15 to 20"]
                - ["Senior", "15 and over — no upper limit"]
            source: ijf-sor
          - note: "No one <strong>under 15</strong> (calendar year) may fight in any IJF event. Younger groups (9 to 14) are only IJF suggestions; each country sets its own rules."
            source: ijf-sor
      - id: recognition
        nav: "Recognition"
        eyebrow: "Institutional &amp; global recognition"
        heading: "Olympics, Asian Games, Commonwealth Games — and India's results"
        parts:
          - table:
              caption: "LA28 Olympic judo — the hard numbers"
              head: ["Rule", "What it says"]
              rows:
                - ["Events", "7 men + 7 women + <strong>1 mixed team</strong>"]
                - ["Places", "<strong>372</strong> judoka; at most <strong>one per weight class per country</strong>"]
                - ["How you qualify", "On the <strong>IJF World Ranking List</strong>: the top 17 in each class get in, then 104 places by continent (Asia gets 12 men + 12 women)"]
                - ["Ranking window", "<strong>15 June 2026 to 12 June 2028</strong>"]
                - ["Age", "Born on or before <strong>31 December 2013</strong>"]
                - ["Games", "14–30 July 2028, Los Angeles"]
            source: ijf-la28
          - p: "India has two <strong>Commonwealth Games 2026 champions</strong> in judo: <strong>Asmita Dey</strong> (women's 48 kg) and <strong>Harsh Singh</strong> (men's 60 kg). Only judoka ranked in the world <strong>top 100 (senior) or top 16 (junior)</strong> could enter the 2026 World Championships."
            source: jfi-lausanne26
          - p: "At the <strong>Aichi-Nagoya Asian Games 2026</strong>, Asmita Dey (48 kg) and Inunganbi Takhellambam (70 kg) reached the bronze-medal bouts but missed the podium. India sent a <strong>nine-member team</strong> to the World Championships in Baku (October 2026) to earn LA28 ranking points."
            source: jfi-baku26
          - table:
              caption: "Government cash award for a senior medal (₹ lakh)"
              head: ["Event", "Gold", "Silver", "Bronze"]
              rows:
                - ["<strong>Olympic Games</strong>", "75", "50", "30"]
                - ["Asian Games / Commonwealth Games", "30", "20", "10"]
            source: myas-cash
          - note: "The judo <strong>World Championship</strong> and <strong>Asian Championship</strong> are also on the Ministry's list; the amount depends on how often the event is held. The coach of an individual medallist gets 50%. Apply on the DBT-MIS portal within six months."
            source: myas-cash
          - p: "Judo Federation of India: on <strong>13 July 2026</strong> the Sports Ministry recognised JFI's interim executive committee (elected 8 June 2026 under a Delhi High Court order) as the National Sports Federation. The recognition is <strong>conditional</strong> — it depends on pending court cases and on JFI bringing its rules in line with the <strong>National Sports Governance Act, 2025</strong>. JFI runs the national championships and enters India's teams abroad."
            source: myas-jfi26
      - id: eligibility
        nav: "Weigh-in &amp; testing"
        eyebrow: "Physical benchmarks &amp; anti-doping"
        heading: "The two weigh-ins, age proof and medical papers"
        parts:
          - list:
              - "<strong>Official weigh-in</strong>: the day <strong>before</strong> you fight, at 16:00 local time at IJF events. Seniors and juniors must be <strong>inside the limit</strong> — there is <strong>no tolerance</strong>."
              - "Cadets weigh in wearing underwear, so they get <strong>0.2 kg</strong> extra (for 44 kg, the limit is 44.2 kg)."
              - "<strong>Random weigh-in</strong>: on fight day, four judoka per class are drawn and weighed. You may be at most <strong>5% over</strong> your category limit; fail and you <strong>cannot fight</strong>."
            source: ijf-sor
          - list:
              - "At JFI's Sub-Junior Nationals: <strong>no tolerance</strong> at all, one try on the scale, and a judoka over or under the limit is <strong>disqualified with no certificate</strong>."
              - "Bring <strong>three original age proofs</strong>: a birth certificate issued <strong>at least 3 years before</strong>, a school certificate with photo and affiliation number, and Aadhaar or JFI ID. JFI can order a <strong>medical age test</strong>; if 4 or more players of a state are found over-age, the whole team is disqualified."
              - "Bring <strong>two judogis — one blue, one white</strong>; a judogi that fails the measurement check means you lose that bout."
            source: jfi-subjr26
          - list:
              - "Under the anti-doping code you must be <strong>available for testing</strong> and check every medicine against the <strong>Prohibited List</strong>. JFI also asks for <strong>whereabouts</strong> to be filed with JFI and NADA before it enters you abroad."
            source: "nada-rr,jfi-selpol26"
      - id: roadmap
        nav: "Roadmap"
        eyebrow: "Grassroots-to-elite residential pipeline"
        heading: "From sub-junior nationals to the Indian team"
        parts:
          - table:
              caption: "The judo ladder in India"
              head: ["Step", "Age", "What happens"]
              rows:
                - ["1. Club &amp; state", "Under 12+", "Join a club of your <strong>state judo association</strong> and register with JFI (₹1,000 for 2 years)"]
                - ["2. Sub-Junior Nationals", "Born 2012–2014 (12 to 14)", "3-minute bouts, <strong>no arm-locks or chokes</strong>; 2026-27 edition in <strong>Lucknow, 12–16 Dec 2026</strong>"]
                - ["3. Cadet Nationals", "15 to 17", "2026 edition in Chandigarh (10–13 June); India's teams for the Asian and World Cadet Championships are picked here"]
                - ["4. SAI Training Centre", "12–18", "Up to 8th at Sub-Junior or Junior Nationals can apply; then a battery of tests"]
                - ["5. Junior &amp; Senior Nationals", "U21 · Senior", "Gold and silver medallists (or the top two at national trials) are first in line for India's team"]
                - ["6. World ranking", "Senior", "Grand Prix, Grand Slam and Continental Open points build your <strong>IJF ranking</strong> — the only road to LA28"]
            source: "jfi-subjr26,jfi-cadet26,sai-schemes,jfi-selpol26,ijf-la28"
          - list:
              - "To fight a Grand Prix, Grand Slam or Continental Open <strong>at your own cost</strong>, JFI wants a world ranking within the top <strong>100 (senior) or 50 (junior)</strong>, or a first or second place at the latest nationals or trials; apply <strong>two months before</strong> the entry deadline and pay a <strong>₹15,000</strong> non-refundable processing fee."
              - "No club, academy or state can enter you abroad on its own — <strong>all entries go through JFI</strong>."
            source: jfi-selpol26
          - p: "Medals at the <strong>Khelo India Youth Games</strong> (judo is one of its 27 sports), Junior Nationals and SGFI school games now count for central sports-quota jobs."
            source: "dopt-2024,kiyg25"
      - id: academies
        nav: "Centres"
        eyebrow: "Top elite academies &amp; cities"
        heading: "Where India's judoka train"
        parts:
          - table:
              caption: "SAI National Centres of Excellence with judo"
              head: ["Centre", "Other sports there"]
              rows:
                - ["<strong>Bhopal</strong>, Madhya Pradesh", "Athletics, boxing, hockey, wushu, kayaking &amp; canoeing"]
                - ["<strong>Hamirpur</strong>, Himachal Pradesh", "Athletics, badminton, boxing, hockey, wrestling"]
                - ["<strong>Imphal</strong>, Manipur", "Archery, athletics, cycling, fencing, football, hockey, weightlifting, wushu"]
                - ["<strong>Patiala</strong>, Punjab (NSNIS)", "Athletics, cycling, fencing, hockey, weightlifting"]
            source: sai-schemes
          - note: "Judo is one of SAI's <strong>13 priority sports</strong>. It is also taught at SAI Training Centres and in SAI's school and college extension centres."
            source: sai-schemes
          - p: "<strong>Inspire Institute of Sport (IIS), Vijayanagar, Karnataka</strong> trains judo and runs the <strong>Kotak Mahindra Bank Girls Judo Programme</strong>, which pays for full-time residential training, coaching and international exposure for girls."
            source: "iis-sports,iis-programmes"
      - id: costs
        nav: "Gear &amp; cost"
        eyebrow: "Equipment costs &amp; who pays"
        heading: "Judogis, travel and who pays the bills"
        parts:
          - list:
              - "Your kit is simple: <strong>one blue and one white judogi</strong> that pass the IJF size check, and a belt. Education Margdarshan does not print shop prices — no governing body publishes them."
              - "At national championships, <strong>boarding, lodging, travel and insurance</strong> are paid by the judoka, the state association or the department — not by JFI."
              - "Fees at the 2026-27 Sub-Junior Nationals: <strong>₹200</strong> per player, <strong>₹2,500</strong> per state team; JFI registration <strong>₹1,000</strong> for two years."
            source: "jfi-subjr26,jfi-cadet26"
          - table:
              caption: "Who pays — judo ladder"
              head: ["Stage", "Paid by", "What you get"]
              rows:
                - ["SAI centre trainee", "Sports Authority of India", "Coaching, boarding, sports science, diet"]
                - ["Khelo India athlete", "Ministry of Youth Affairs &amp; Sports", "<strong>₹6.28 lakh a year</strong> incl. ₹1.20 lakh cash"]
                - ["Indian team abroad", "SAI / Sports Ministry (ANSF scheme)", "Events and camps at government cost — e.g. the 2026 pre-Asian Games camp in Japan"]
                - ["Olympic prospect", "TOPS Core Group", "<strong>₹50,000 a month</strong> + approved training plan"]
                - ["Athlete in hardship", "PDU National Welfare Fund", "Up to ₹2.50 lakh"]
            source: "sai-schemes,pib-support,jfi-baku26"
          - list:
              - "<strong>Weight-cutting with pills or powders</strong> is a doping risk: no supplement is 100% safe and <strong>strict liability</strong> applies — food first, with a certified nutritionist."
            source: nada-supp
      - id: earnings
        nav: "Earnings &amp; jobs"
        eyebrow: "Earning channels &amp; central job quotas"
        heading: "Awards, pension and sports-quota jobs"
        parts:
          - list:
              - "Judo is one of the <strong>65 sports</strong> in the central sports quota for <strong>Group C</strong> posts, with up to 5 years' age relaxation (10 for SC/ST)."
              - "Medals at the Olympics, Asian Games, Commonwealth Games or World Championships can bring up to <strong>three out-of-turn promotions</strong>."
            source: dopt-2022
          - list:
              - "<strong>CRPF's 2026 sports quota</strong> has judo posts for women in 48, 52, 57, 63 and 70 kg and men in 60, 66, 73 and 81 kg."
            source: crpf26
          - list:
              - "<strong>Pension to Meritorious Sportspersons</strong>: ₹12,000–20,000 a month after retirement."
              - "Coaching and refereeing: JFI holds <strong>black-belt gradation</strong> camps and exams zone by zone (for example North Zone, Jalandhar, September 2026)."
            source: "pib-support,jfi-home"
      - id: traps
        nav: "Red flags"
        eyebrow: "Disqualification traps"
        heading: "Mistakes that end a judoka's tournament"
        parts:
          - list:
              - "<strong>Missing weight by even 100 g</strong> at the official weigh-in — no tolerance for seniors and juniors."
              - "<strong>Cutting too hard</strong> for the day-before weigh-in and then failing the <strong>5% random weigh-in</strong> on fight day."
            source: ijf-sor
          - list:
              - "<strong>Fake or late birth papers</strong> — a birth certificate issued less than 3 years before, or failing the medical age test, means disqualification (and 4 over-age players sink the whole state team)."
              - "<strong>A wrong-size judogi</strong> — you lose the bout at the judogi check."
            source: jfi-subjr26
          - list:
              - "<strong>Entering an event abroad on your own</strong> — entries without JFI and SAI clearance break JFI rules."
            source: jfi-selpol26
      - id: doubts
        nav: "Player doubts"
        eyebrow: "Real-world player doubts"
        heading: "Late start, weight, jobs, money and certificates — straight answers"
        parts:
          - qa:
              q: "I am 16, 18 or 20. Is it too late to start judo?"
              a: "Not for competing: IJF seniors have <strong>no upper age limit</strong>, and juniors run up to 20. It is late for the free pipelines — SAI Training Centres take ages <strong>12–18</strong> — so a late starter trains at a state-association club and must win at Junior or Senior Nationals to be noticed. The real clock is the job deadline: Railways sports quota stops at <strong>25</strong> and CRPF at <strong>23</strong> (28 for an unreserved sportsperson after relaxation)."
            source: "ijf-sor,sai-schemes,rrc-wr26,crpf26"
          - qa:
              q: "Which weight class should I choose?"
              a: "Fight in the class your body sits in on a normal day, not after a crash diet. You must pass a weigh-in the day before with <strong>no tolerance</strong>, and you may be weighed again on fight day and must be within <strong>5%</strong> of the limit. In India you may enter <strong>only one class</strong> per championship."
            source: "ijf-sor,jfi-subjr26"
          - qa:
              q: "Which government jobs can judo get me?"
              a: "<strong>Central Group C posts</strong> under DoPT rules list judo among 65 sports. <strong>CRPF's 2026 sports quota</strong> (521 Head Constable and Constable posts) has judo posts in nine weight classes. Railways recruit zone by zone — Western Railway's 2026-27 notice had <strong>no judo posts</strong>, so read every zone's notice."
            source: "dopt-2022,crpf26,rrc-wr26"
          - table:
              caption: "Sports-quota job routes open in 2026 — age, qualifying results, pay"
              head: ["Route", "Age", "Main qualifying results", "Pay level"]
              rows:
                - ["Railways <strong>Level 5/4</strong> (graduates)", "18–25 on 1 Jan 2027", "Played the <strong>Olympics</strong>, or top 3 at a World Cup, World Championship, Asian Games, Commonwealth Games or Youth Olympics", "Level 5/4"]
                - ["Railways <strong>Level 3/2</strong> (12th, or 10th + apprenticeship)", "18–25 on 1 Jan 2027", "Top 3 at <strong>Senior, Youth or Junior Nationals</strong>, National Games or All India Inter-University; or Federation Cup gold", "Level 3/2"]
                - ["Railways <strong>Level 1</strong>", "18–25 on 1 Jan 2027", "Played for your state and finished <strong>at least 8th at Senior Nationals</strong>; or top 3 at the Federation Cup", "Level 1"]
                - ["CRPF <strong>Head Constable (GD)</strong> (10+2)", "18–23 on 1 Aug 2026; sportspersons get <strong>+5 years</strong> (OBC +8, SC/ST +10)", "Played for India; or top 3 for your state at Nationals or National Games; or <strong>gold/silver at Junior Nationals</strong>", "Level 4 · ₹25,500–81,100"]
                - ["CRPF <strong>Constable (GD)</strong> (10th pass)", "18–23 on 1 Aug 2026; sportspersons get <strong>+5 years</strong> (OBC +8, SC/ST +10)", "Played for your state at <strong>Senior or Junior Nationals</strong>; or top 3 at SGFI school nationals or Khelo India Games", "Level 3 · ₹21,700–69,100"]
            source: "rrc-wr26,crpf26"
          - note: "Railways count results from <strong>1 April 2024</strong>; CRPF counts the <strong>two years before 30 September 2026</strong>. Railways fee ₹500 (₹400 back if you attend the trial; ₹250, refunded in full on attending, for SC/ST, women, PwBD, minorities, ex-servicemen and EBC). CRPF fee ₹100 for UR/OBC/EWS men; free for women, SC, ST and ex-servicemen. CRPF picks sign a <strong>₹1 lakh bond to serve at least 3 years</strong>."
            source: "rrc-wr26,crpf26"
          - qa:
              q: "We are a lower-middle-class family. How do we keep costs down?"
              a: "Aim for the free seats: SAI centres give <strong>coaching, boarding, sports science and diet</strong>, and a Khelo India athlete gets <strong>₹6.28 lakh a year</strong>. Girls can look at IIS's <strong>Kotak Girls Judo Programme</strong>, which funds residential training and foreign exposure. Until then, nationals travel and stay are paid by you, your state association or your department."
            source: "sai-schemes,pib-support,iis-programmes,jfi-cadet26"
          - qa:
              q: "Does any 'national' certificate count for a job?"
              a: "No. Railways will <strong>not recruit on a certificate from a federation MoYAS did not recognise</strong> at the time of the championship, and CRPF counts only championships of MoYAS-recognised federations or the IOA's National Games. Only <strong>JFI-registered</strong> judoka may enter JFI's nationals, so register through your state association first."
            source: "rrc-wr26,crpf26,jfi-subjr26"
