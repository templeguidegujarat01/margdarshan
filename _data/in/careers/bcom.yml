  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Can Science or Arts students take admission in B.Com?"
            a: "Yes. Most universities, including Delhi University, accept students from any stream for B.Com. Commerce background students have an advantage since they already know basic accounting and business concepts, but it is not a strict requirement."
          - q: "Is CUET compulsory for B.Com admission?"
            a: "CUET-UG is compulsory for B.Com admission at central universities such as Delhi University, Banaras Hindu University and Aligarh Muslim University. Many state and private universities admit directly based on Class 12 marks, or conduct their own entrance test instead."
          - q: "What is the difference between B.Com and B.Com Honours?"
            a: "B.Com (General) gives a broad overview of accounting, finance, economics and business subjects. B.Com Honours goes deeper into a specialised track with more advanced and research-oriented coursework in the same broad subject areas. Honours can also take an extra year at some universities offering the 4-year National Education Policy (NEP) format."
          - q: "Can I prepare for CA while doing B.Com?"
            a: "Yes. Many students pursue CA Intermediate and Final alongside their B.Com degree, since CA is largely self-study with periodic exams rather than full-time classes. B.Com's accounting and taxation subjects also overlap usefully with the CA syllabus."
          - q: "Is B.Com a good choice if I just want a stable job, not a professional qualification?"
            a: "Yes, B.Com alone (without adding CA, CS, CMA or an MBA) is a genuinely viable path into banking, accounting, taxation and general business roles. It won't usually match the ceiling of a professional qualification, but it's a real, employable degree on its own, especially combined with practical skills like Excel, Tally or basic data analysis."
      - note: "*Fee and salary figures are indicative, based on publicly available information as of 2026, and vary significantly by institution — always verify current figures on the official university website."
        class: "table-note mt-lg"
