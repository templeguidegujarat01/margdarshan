  - slug: hockey
    short: "Hockey"
    domain: ball
    body: "International Hockey Federation (FIH) · Hockey India"
    card: "FIH Rules of Hockey from 1 Nov 2026, Hockey India nationals and national-camp selection, SAI centres, HIL auction rules, LA28 qualification."
    card_facts: ["4 × 15 min · 11 a side", "Stick ≤ 737 g", "HIL cap ₹4 cr (men)"]
    eyebrow: "Sports Cockpit · Ball &amp; Team · FIH Rules of Hockey (from 1 Nov 2026)"
    title: "Hockey — FIH rules, Hockey India selection, SAI camps &amp; the Hockey India League"
    lede: "Education Margdarshan's hockey map for India: the FIH Rules of Hockey in force internationally from 1 November 2026, Hockey India's national championships and how core probables are picked for national camps, the SAI centres that train hockey, who pays, the HIL auction rules and the medals, awards and jobs that follow."
    official:
      - { label: "FIH Rules of Hockey (PDF)", url: "https://www.fih.hockey/static-assets/pdf/2026_09_14_fih_rules_of_hockey_2027_clean.pdf" }
      - { label: "hockeyindia.org", url: "https://www.hockeyindia.org/" }
    facts:
      - { label: "Match", value: "<strong>4 quarters of 15 min</strong>; 10-min half-time", source: fih-rules }
      - { label: "Team", value: "<strong>11</strong> on the field + up to <strong>5</strong> substitutes", source: fih-rules }
      - { label: "Asian Games 2026", value: "<strong>Gold for men and women</strong> → direct LA28 places", source: "fih-ag-men,fih-ag-women" }
      - { label: "HIL salary cap", value: "<strong>₹4 crore</strong> (men) · ₹2 crore (women) per team", source: hi-hil26 }
    sections:
      - id: rules
        nav: "Rules &amp; ages"
        eyebrow: "Core rules &amp; selection formats"
        heading: "The Rules of Hockey in force from 1 November 2026"
        parts:
          - list:
              - "A match is <strong>four quarters of 15 minutes</strong>, with 2-minute breaks after quarters 1 and 3 and a <strong>10-minute half-time</strong>."
              - "A team is at most <strong>16 people</strong>: <strong>11 players</strong> on the field and up to <strong>5 substitutes</strong>. A team may play with a goalkeeper (in headgear, leg guards and kickers) or with field players only."
              - "The field is <strong>91.40 m × 55.00 m</strong>."
              - "Personal penalties: <strong>green card</strong> = 2 minutes off, <strong>yellow card</strong> = 5 or 10 minutes, <strong>red card</strong> = out of the match."
            source: fih-rules
          - table:
              caption: "What changed on 1 November 2026"
              head: ["Rule", "Change"]
              rows:
                - ["2.3 Goalkeeper substitution", "Time no longer has to be stopped; the goalkeeper may be replaced during play, even by a field player"]
                - ["4.6 Devices", "<strong>No device to send or receive communication</strong> may be worn or used by players"]
                - ["13.3 Penalty corner", "As a guideline, no more than <strong>40 seconds</strong> from award to start; the injector must play the ball immediately"]
                - ["14 Personal penalties", "The same player or team official should not get <strong>two green or two yellow cards</strong> in one match — the next card must be a higher one"]
                - ["1.9 Flag-posts", "No longer compulsory under the Rules"]
            source: fih-rules
          - note: "National associations may choose their own start date for these rules at national level, and FIH has promised no major rule changes before the LA 2028 Olympics."
            source: fih-rules
          - table:
              caption: "Hockey India national championships in the 2026 calendar"
              head: ["Championship", "Dates", "Venue"]
              rows:
                - ["16th Sub Junior Women National Championship", "1–12 Apr 2026", "Ranchi, Jharkhand"]
                - ["16th Sub Junior Men National Championship", "1–12 Apr 2026", "—"]
                - ["16th Junior Men National Championship", "28 Jul – 8 Aug 2026", "Coimbatore, Tamil Nadu"]
                - ["16th Senior Men National Championship", "2026", "Division 'A' at Jhansi, Uttar Pradesh"]
            source: "hi-nat,hi-jr-nat26,hi-home"
          - p: "Nationals are played in <strong>three divisions</strong>. At the 2026 Junior Men's event 30 teams played: <strong>12 in Division 'A'</strong> for the title, 10 in 'B' and 8 in 'C'. The bottom two of 'A' drop to 'B'; the top two of 'B' move up and the bottom two drop to 'C'; the top two of 'C' move up."
            source: hi-jr-nat26
          - note: "The age cut-off for each Sub Junior and Junior championship is set in that championship's circular — check it with your state hockey unit before trials."
            source: hi-nat
      - id: recognition
        nav: "Recognition"
        eyebrow: "Institutional &amp; global recognition"
        heading: "Olympics, Asian Games, World Cup and the HIL"
        parts:
          - table:
              caption: "India's latest major results"
              head: ["Event", "Result"]
              rows:
                - ["Paris 2024 Olympics (men)", "<strong>Bronze</strong> — beat Spain 2-1; second Olympic medal in a row"]
                - ["Asian Games 2026 (men)", "<strong>Gold</strong> — beat Malaysia 5-1; direct place at the LA 2028 Olympics"]
                - ["Asian Games 2026 (women)", "<strong>Gold</strong> — beat China 1-0; direct place at the LA 2028 Olympics"]
            source: "hi-paris-cash,fih-ag-men,fih-ag-women"
          - table:
              caption: "Government cash award for a senior hockey medal (₹ lakh, before the team-event rule)"
              head: ["Event", "Gold", "Silver", "Bronze"]
              rows:
                - ["<strong>Olympic Games</strong>", "75", "50", "30"]
                - ["Asian Games / Commonwealth Games", "30", "20", "10"]
                - ["FIH Hockey World Cup (every 4 years)", "40", "25", "15"]
                - ["Asian Championship, senior (every 4 years)", "15", "10", "5"]
            source: myas-cash
          - p: "In team events each squad member, <strong>including bench and reserve players</strong>, gets <strong>75%</strong> of the individual amount above."
            source: myas-cash
          - p: "The men's and women's hockey teams were part of the <strong>TOPS core group</strong> (August 2024), the government's Olympic-podium scheme."
            source: pib-support
      - id: eligibility
        nav: "Physical &amp; selection"
        eyebrow: "Physical benchmarks &amp; anti-doping"
        heading: "Equipment limits, selection criteria and anti-doping"
        parts:
          - table:
              caption: "Stick and ball limits (FIH)"
              head: ["Item", "Limit"]
              rows:
                - ["Stick weight", "Not more than <strong>737 g</strong>"]
                - ["Stick length", "Not more than <strong>105 cm</strong>"]
                - ["Stick width", "Must pass through a ring of <strong>51 mm</strong> inside diameter"]
                - ["Bow of the stick", "Up to <strong>25 mm</strong> deep"]
                - ["Ball", "<strong>156–163 g</strong>"]
            source: fih-rules
          - list:
              - "The selection committee judges campers on position balance, <strong>physical ability</strong>, the ability to carry out the team's tactical plan, contribution to team dynamics and experience."
              - "The Chief Coach reports each camper's progress and can recommend <strong>dropping</strong> under-performers or adding new probables."
              - "Final trials are held <strong>60–45 days</strong> before the team leaves for an overseas event (45–30 days for events in India); SAI is told at least a week ahead and gets the minutes within 48 hours."
            source: hi-selection
          - list:
              - "Team-game entry to SAI Training Centres is for ages <strong>10–18</strong>, after a battery of motor-quality and skill tests; a player who misses the motor-quality level can be taken provisionally for six months."
            source: sai-schemes
          - list:
              - "Anti-doping: be available for testing, check every medicine against the <strong>Prohibited List</strong> and apply for a <strong>TUE</strong> when no permitted treatment exists."
            source: nada-rr
