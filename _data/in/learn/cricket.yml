# "Where to learn" finder: Cricket (learn/cricket.html and its state/city pages).
# Listings live in assets/data/learn/cricket.json, written by scripts/learn-src/cricket.mjs from the state associations'
# own lists (scripts/learn-src/cricket/assoc.mjs → cricket/data/assoc.json); pages by scripts/build-learn-finders.mjs.
# Hand-edit this file (meta, sources, subjects); never the JSON.
id: cricket
family: sports
search_cat: guides
name: "Cricket clubs, district associations & academies"
short: "Cricket clubs"
# Words people search, used in titles: "<phrase> in Gujarat", "<phrase_short> in Pune".
phrase: "Cricket Clubs & Associations"
phrase_short: "Cricket Clubs"
lead: "Cricket in India runs through the BCCI's state associations, not SAI or Khelo India centres. This list holds the district associations, league clubs and association academies that ten state associations publish on their own websites, plus the BCCI Centre of Excellence and the MRF Pace Foundation."
checked: "2026-10-30"
# Subject pages that link here ("Where to learn" button) and that this finder links back to.
subjects:
  - { id: cricket, label: "Cricket career guide", href: "cricket.html" }
keys: {}
types: ["High-performance centre", "State association", "Association academy", "District association", "Cricket club"]
sources:
  - id: bca
    name: "Bihar Cricket Association — Districts"
    url: "https://biharcricketassociation.com/districts"
    note: "38 district cricket associations with office address and number of affiliated clubs, read 2026-10-30."
  - id: gca
    name: "Gujarat Cricket Association — Associated Districts"
    url: "https://gujaratcricketassociation.com/about-gca/associated-districts/"
    note: "10 district associations (incl. Daman) with location and address; the Dadra and Nagar Haveli page was empty."
  - id: kca
    name: "Kerala Cricket Association — District Associations"
    url: "https://www.keralacricketassociation.com/district-associations"
    note: "The 14 district associations; KCA lists their office bearers, not their addresses."
  - id: tnca
    name: "Tamil Nadu Cricket Association — District Associations"
    url: "https://www.tnca.in/district-associations"
    note: "37 district associations, from the list file TNCA's site loads (assets/js/district-associate.json)."
  - id: cab
    name: "Cricket Association of Bengal — Affiliated clubs and districts"
    url: "https://www.cricketassociationofbengal.com/affiliated_clubs.php"
    note: "94 first-division clubs and 18 district units (Districts.php), read 2026-10-30. CAB's site says it is under construction; its universities and other associations lists are not used."
  - id: mca
    name: "Mumbai Cricket Association — Ordinary Maidan clubs"
    url: "https://www.mumbaicricket.com/ordinary-maidan"
    note: "211 ordinary maidan clubs (voting members). Office clubs, schools/colleges and associate members are left out: they are workplace or institution teams, not open clubs."
  - id: mpca
    name: "Madhya Pradesh Cricket Association — MPCA Academy and Regional Academy"
    url: "https://www.mpcaonline.com/page/mpca-academy"
    note: "Sanjay Jagdale Cricket Academy at Holkar Stadium, Indore, and the Regional Academy camp scheme."
  - id: hca
    name: "Hyderabad Cricket Association — press release on regional coaching camps (10 Oct 2026)"
    url: "https://www.hycricket.org/data-2026-27/press-2026-27/27-press-district-coaching_camps-10-10-2026.pdf"
    note: "Year-round camps at Karimnagar (North Telangana hub) and Mahabubnagar (South Telangana hub)."
  - id: hpca
    name: "Himachal Pradesh Cricket Association — website"
    url: "https://www.hpcricket.org/"
    note: "Sub-centres at Jogindernagar (Mandi), Tissa (Chamba) and Sarash (Kullu), as named in HPCA's own photo posts."
  - id: bcci-coe
    name: "BCCI — How the BCCI Centre of Excellence is shaping India's high-performance system"
    url: "https://www.bcci.tv/news/article/how-the-bcci-centre-of-excellence-is-shaping-indias-high-performance-system"
  - id: mrf-pace
    name: "MRF Tyres — 'Ace of Pace' fast-bowler hunt by the MRF Pace Foundation"
    url: "https://www.mrftyres.com/news/more-than-1000-aspiring-bowlers-showcase-their-skill-in-the-inaugural-ace-of-pace-fast-bowler-hunt-by-the-mrf-pace-foundation"
  - id: kic
    name: "Khelo India — List of Khelo India Centres (Aug 2026)"
    url: "https://dashboard.kheloindia.gov.in/public/front/assets/List_of_KICs_08_2026.pdf"
    note: "Checked for cricket: no Khelo India Centre teaches it, so none are listed here."
gaps:
  - "Lists come from 10 state associations so far. Not yet listed: Delhi (DDCA), UP (UPCA) and Punjab (PCA) sites refuse scripted reads; Andhra and Assam sites load no district list; Rajasthan's 2026 district list is an unreadable PDF; Karnataka, Haryana, Jharkhand, Odisha, Vidarbha, Saurashtra, Baroda, Goa, Chhattisgarh, Uttarakhand and J&K sites did not answer on 30 Oct 2026; the north-east associations, Maharashtra's districts and Hyderabad's member clubs are still to be read."
  - "Private cricket academies are not listed: no official register of them exists, and the BCCI does not accredit academies."
  - "Most district associations and clubs have no address on the source list: use the association's list or call the district office."
  - "Club lists are a club's league membership, not proof that it runs a coaching programme: ask the club about nets and junior teams."
