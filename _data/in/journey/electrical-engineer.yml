# Journey Blueprint — Government Electrical Engineer (diploma / B.Tech → RRB JE, GATE PSU, UPSC ESE). Printed on journey-electrical-engineer.html (_includes/journey-doubts.html).
# Rules, classes and the money items / sources several careers share: _data/in/journey_common.yml.
# This career has no money_defs / sources of its own: everything it cites is shared with the mechanical engineer.
# Check: node scripts/check-journey-matrix.mjs
id: electrical-engineer
v: 2
name: "Government Electrical Engineer (RRB JE · GATE PSU · UPSC ESE)"
search: ["government electrical engineer", "electrical engineer", "electrical engineering", "junior engineer electrical", "rrb je electrical", "ese electrical", "power engineer"]
page: "electrical.html"
roadmap: "roadmaps/electrical.html"
doubts_page: "journey-electrical-engineer.html"
gate: "Class 10 → a 3-year polytechnic diploma, or Class 12 with Physics and Maths → JEE Main / state CET → B.E. / B.Tech Electrical. Central jobs then come through Railway Junior Engineer posts (diploma or degree), PSU trainee posts through GATE (degree) and UPSC's Engineering Services (degree, Group A)."
gate_source: [jee-ib, jm-ib, rrb-je25, ntpc-eet27, ese27]
core:
  what:
    text: "Government electrical engineers plan, run and maintain power plants, traction and signalling supply, electric locomotives and defence electrical systems. The Railways recruit Junior Engineers (Electrical), PSUs such as NTPC hire graduate trainees through GATE, and UPSC's Engineering Services fill Group A and B electrical posts."
    source: [rrb-je25, ntpc-eet27, ese27]
  day:
    - "Inspect and maintain substations, motors, traction and power equipment."
    - "Find and fix faults safely, and plan shutdowns."
    - "Supervise technicians and keep test and safety records."
  pay:
    - { level: "Junior Engineer, Indian Railways (RRB CEN 05/2025)", value: "Pay Level 6 · ₹35,400 starting pay", source: rrb-je25 }
    - { level: "Group A officer through UPSC ESE (example: ITS, ESE 2024)", value: "Pay Level 10 · ₹56,100 – ₹1,77,500", source: dot-its }
  pay_note: "NTPC's GATE-2027 notice does not print pay, and private-sector pay is not officially published, so neither is printed."
  routes:
    - { title: "Polytechnic diploma → Railway JE (Electrical)", text: "JE Electrical posts accept a 3-year diploma in Mechanical, Electrical or Electronics Engineering (or a combination of their sub-streams); a B.E. / B.Tech in the same discipline is also accepted. Age 18–33.", source: rrb-je25 }
    - { title: "B.E. / B.Tech → GATE → PSU", text: "NTPC recruits Engineering Executive Trainees 2027 in Electrical and five other branches only through GATE-2027 scores.", source: ntpc-eet27 }
    - { title: "B.E. / B.Tech → UPSC ESE", text: "Category III (Electrical Engineering) of ESE fills posts such as the Central Electrical & Mechanical Engineering Service, Central Power Engineering Service, Indian Railway Management Service (Electrical) and Indian Naval Armament Service. Age 21–30.", source: ese27 }
  cost_time:
    - { label: "Diploma → JE", value: "3-year diploma after Class 10, then the RRB JE exam (two CBTs)", source: [jee-ib, rrb-je25] }
    - { label: "UPSC ESE fee", value: "₹200 · women, SC, ST and PwBD exempt", source: ese27 }
    - { label: "RRB JE fee", value: "₹500 (₹400 back if you sit CBT 1) · ₹250 for SC, ST, women and other listed groups (all back if you sit CBT 1)", source: rrb-je25 }
    - { label: "GATE 2027 fee (one paper)", value: "₹2,000 · ₹1,000 for women, SC, ST, PwD (regular period)", source: gate27-fee }
  cost_note: "College fees differ by state and college, so they are not printed here."
  challenges:
    - text: "UPSC ESE 2027 has about 480 vacancies across all four engineering categories together."
      source: ese27
    - text: "Railway JE candidates who are still awaiting their final diploma or degree result must not apply."
      source: rrb-je25
    - text: "PSU hiring through GATE uses only that year's GATE score."
      source: ntpc-eet27
  not_for:
    - "You are careless around safety rules — electrical work punishes shortcuts."
    - "You dislike Physics and Maths."
    - "You want fixed office hours — breakdowns and shift duty are part of the job."
journey:
  - stages: [c8, c9]
    title: "Physics and Maths first"
    do:
      - text: "Engineering degrees need Class 12 with Physics and Maths, and the polytechnic route starts right after Class 10."
        source: [jm-ib, jee-ib]
    doubts:
      - q: "What does a government electrical engineer do?"
        a: "They run and maintain power plants, traction supply, electric locomotives and defence electrical systems. The Railways hire Junior Engineers (Electrical), PSUs such as NTPC hire graduate trainees through GATE, and UPSC's Engineering Services fill Group A electrical posts."
        next: "Read the Routes list above."
        source: [rrb-je25, ntpc-eet27, ese27]
      - q: "Is electrical engineering possible without a B.Tech?"
        a: "Yes, for Junior Engineer posts. Railway JE (Electrical) posts accept a 3-year diploma in Mechanical, Electrical or Electronics Engineering."
        next: "Consider a polytechnic after Class 10."
        source: rrb-je25
  - stages: [c10]
    title: "Diploma or Class 11 Science?"
    do:
      - text: "Polytechnic entrance tests open after Class 10 — UP's JEECUP, for example, needs Class 10 with 35%."
        source: jee-ib
      - text: "For B.E. / B.Tech, choose Physics, Chemistry and Maths in Class 11."
        source: jm-ib
    stream: "Science with Maths (PCM), or an electrical diploma after Class 10."
    money: [apprentice-dip]
    doubts:
      - q: "Which diplomas count for Railway JE (Electrical)?"
        a: "RRB's 2025 notice lists a 3-year diploma in Mechanical, Electrical or Electronics Engineering, or a combination of their sub-streams, from a recognised institute. A B.E. / B.Tech in the same discipline is also accepted."
        next: "Choose a recognised polytechnic and an eligible branch."
        source: rrb-je25
      - q: "Is ITI the same as a diploma for JE posts?"
        a: "No. The JE notice asks for a 3-year diploma (or a degree); an ITI certificate is not listed for JE."
        next: "Pick a diploma if you want JE posts; ITI leads to technician posts."
        source: rrb-je25
  - stages: [c11, c12]
    title: "JEE Main for a B.Tech seat"
    do:
      - text: "NIT seats through JoSAA need 75% in Class 12 (65% for SC / ST / PwD) or a place in your board's top 20 percentile."
        source: jm-ib
    exams:
      - { name: "JEE Main 2026", when: "Session 1: 21–30 Jan · Session 2: 2–9 Apr 2026", source: jm-ib }
    doubts:
      - q: "Which subjects do I need in Class 12 for B.Tech Electrical?"
        a: "Physics and Mathematics with Chemistry — the JEE Main subjects. NIT seats also need 75% in Class 12 (65% for SC, ST and PwD) or your board's top 20 percentile."
        next: "Take PCM and keep board marks strong."
        source: jm-ib
      - q: "How much is the JEE Main fee?"
        a: "Per session in 2026: ₹1,000 for General male candidates, ₹800 for female candidates and ₹500 for SC, ST and PwD."
        next: "Budget for both sessions."
        source: jm-ib
  - stages: [ug]
    title: "In college: GATE for PSUs"
    do:
      - text: "You can write GATE from the 3rd year of your degree."
        source: gate27-elig
      - text: "NTPC's Engineering Executive Trainees-2027 drive in Electrical uses only GATE-2027 scores."
        source: ntpc-eet27
    exams:
      - { name: "GATE 2027", when: "6–7, 13–14, 20–21 Feb 2027 · result 19 Mar 2027", source: gate27 }
    money: [gate-fee]
    doubts:
      - q: "Do power PSUs hire through GATE?"
        a: "Yes. NTPC has announced Engineering Executive Trainees-2027 in Civil, Mechanical, Electrical, Electronics, Instrumentation and Computer Science only through GATE-2027; it will publish a detailed advertisement for applications after the exam."
        next: "Write GATE 2027 if you graduate in 2027."
        source: ntpc-eet27
      - q: "When can I write GATE?"
        a: "From the 3rd year of any undergraduate degree, or after completing it."
        next: "Plan GATE for your 3rd or 4th year."
        source: gate27-elig
      - q: "What is the GATE fee?"
        a: "₹2,000 per paper in the regular period; women, SC, ST and PwD candidates pay ₹1,000."
        next: "Apply in the regular period to avoid the higher fee."
        source: gate27-fee
  - stages: [grad]
    title: "UPSC ESE and Railway JE"
    do:
      - text: "ESE has three stages: Prelims (500 marks), Mains (600 marks, two conventional Electrical papers) and a 200-mark Personality Test."
        source: ese27
    exams:
      - { name: "UPSC ESE 2027 prelims", when: "31 Jan 2027", source: ese27 }
      - { name: "UPSC ESE 2027 mains", when: "18 Jun 2027", source: ese27 }
    money: [ese-fee]
    doubts:
      - q: "Which services can an electrical engineer get through ESE?"
        a: "Category III (Electrical) covers the Central Electrical & Mechanical Engineering Service, Indian Naval Material Management Service, Central Power Engineering Service, Defence Aeronautical Quality Assurance Service, Indian Skill Development Service, Indian Railway Management Service (Electrical and Stores), Indian Defence Service of Engineers and Indian Naval Armament Service."
        next: "Rank your service preferences carefully."
        source: ese27
      - q: "What is the age limit for UPSC ESE 2027?"
        a: "21 to 30 years on 1 January 2027 — born between 2 January 1997 and 1 January 2006 — with relaxation for some government servants up to 35."
        next: "Plan your attempts within this window."
        source: ese27
      - q: "Can I apply to ESE in more than one category?"
        a: "No. You apply in one category only — Civil, Mechanical, Electrical or Electronics & Telecommunication."
        next: "Apply in Electrical if your degree is in Electrical."
        source: ese27
      - q: "Do women pay the ESE fee?"
        a: "No. Women, SC, ST and PwBD candidates are exempt; others pay ₹200."
        next: "Choose your category correctly in the form."
        source: ese27
      - q: "Is there negative marking in ESE?"
        a: "Yes. One-third of a question's marks is cut for each wrong answer in the objective Prelims papers; a blank answer costs nothing."
        next: "Practise with timed papers."
        source: ese27
  - stages: [work]
    title: "Already working?"
    do:
      - text: "RRB JE has two CBTs: CBT 1 (100 questions, 90 minutes) screens; CBT 2 (150 questions, 120 minutes) includes technical questions for the post. Both cut one-third of a mark per wrong answer."
        source: rrb-je25
    doubts:
      - q: "What is the pay of a Railway Junior Engineer?"
        a: "Pay Level 6 of the 7th CPC, starting at ₹35,400, in the 2025 notice (CEN 05/2025)."
        next: "Read the Pay list above for higher levels."
        source: rrb-je25
      - q: "How many candidates go from RRB JE CBT 1 to CBT 2?"
        a: "About 15 times the community-wise vacancies of each RRB, by merit in CBT 1 — the Railways may change this limit."
        next: "Aim well above the cut-off in CBT 1."
        source: rrb-je25
board_note: "Any board. Engineering degrees need Physics and Maths in Class 12; the polytechnic route starts after Class 10."
board_source: [jm-ib, jee-ib]
