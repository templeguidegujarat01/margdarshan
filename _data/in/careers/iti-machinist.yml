  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "What is the difference between Machinist and Turner trades?"
            a: "Machinist is a broader trade covering multiple machine tools — lathes, milling machines, grinders and shapers — for a range of precision manufacturing tasks. Turner is a narrower, lathe-specific trade focused specifically on turning operations. Machinist offers wider machine-shop versatility; Turner offers deeper specialisation in one machine type."
          - q: "How long is the ITI Machinist course?"
            a: "Machinist is typically a 2-year NCVT-affiliated trade, combining trade theory, engineering drawing, workshop calculation and substantial hands-on machine operation practice."
          - q: "Does ITI Machinist include CNC machine training?"
            a: "Many institutes now include CNC basics as part of the modernised syllabus, though depth of CNC exposure varies significantly by institute and available equipment. Dedicated CNC operator certifications are also commonly pursued afterward to strengthen employability."
          - q: "What industries hire ITI Machinists?"
            a: "Precision manufacturing, automobile component makers, tool and die companies, heavy engineering firms, and machine shops across manufacturing hubs all hire trained machinists, alongside government/PSU and defence technical recruitment routes."
          - q: "What government jobs can I get after ITI Machinist?"
            a: "Machinist trade-qualified candidates can apply for various Railways (Railway Recruitment Board (RRB) Technician), defence technical trades, and Public Sector Undertaking (PSU) manufacturing/maintenance posts, each through its own separate recruitment exam."
      - note: "*Fee and salary figures are indicative, based on publicly available information as of 2026, and vary significantly by state, institute and employer — always verify current figures directly with your target ITI."
