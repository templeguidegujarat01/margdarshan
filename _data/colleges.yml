  aslp:         { label: "BASLP",            entrance: "Institute entrance or Class 12 merit", page: "colleges-aslp" }
  nutrition:    { label: "Nutrition & Dietetics", entrance: "CUET-UG / university test / Class 12 merit", page: "colleges-nutrition" }
  biotech:      { label: "Biotechnology",    entrance: "JEE Main (B.Tech) / CUET-UG (B.Sc) / Class 12 merit", page: "colleges-biotech" }
  genetics:     { label: "Genetics",         entrance: "IISER IAT / CUET-UG / Class 12 merit", page: "colleges-genetics" }
