# Journey Blueprint — Police Constable / Sub-Inspector (State Police). Printed on journey-police.html (_includes/journey-doubts.html).
# Rules, classes and the money items / sources several careers share: _data/in/journey_common.yml.
# `money_defs` / `sources` below are used only by this career. Check: node scripts/check-journey-matrix.mjs
id: police
v: 2
name: "Police Constable / Sub-Inspector (State Police)"
search: ["police constable", "police head constable", "police sub-inspector", "assistant police sub-inspector", "police inspector"]
search_not: ["superintendent", "inspector general", "director general", "commissioner", "service officer", "railway protection force"]
page: "state-pathways.html"
doubts_page: "journey-police.html"
gate: "Constable: Class 12 in most states (Class 10 in Madhya Pradesh) → state police recruitment board's written test → physical measurement and running test → documents and medical. Sub-Inspector: a bachelor's degree → the state board's or State PSC's SI exam (SSC for Delhi Police). Every state runs its own recruitment."
gate_source: [up-pc, up-si, mp-pc, dl-si]
core:
  what:
    text: "Police constables and Sub-Inspectors keep law and order: patrol, register complaints (FIRs), investigate crimes, manage traffic and crowds, and guard people and property. Each state recruits its own police; in Delhi the Staff Selection Commission runs the written exams and Delhi Police holds the physical tests."
    source: dl-pc
  day:
    - "Shift duty at a police station, beat patrol, traffic point or VIP duty — nights and holidays included."
    - "Sub-Inspectors register FIRs, lead investigations, collect evidence and appear in court."
    - "Training, drills and physical fitness never stop after joining."
  pay:
    - { level: "Delhi Police Constable", value: "Pay Level 3", source: dl-si }
    - { level: "Delhi Police / CAPF Sub-Inspector", value: "Pay Level 6", source: dl-si }
    - { level: "Karnataka Civil Police Constable (2026)", value: "₹37,500 – ₹76,100 pay scale", source: ka-pc }
    - { level: "Maharashtra PSI (MPSC 011/2026)", value: "S-14: ₹38,600 – ₹1,22,800", source: mh-psi }
  pay_note: "Every state has its own pay rules; Gujarat's PSI gets a fixed ₹49,600 during the contract period."
  routes:
    - { title: "Constable (state police)", text: "Class 12 (Class 10 in MP) → state recruitment board's written test and physical tests.", source: [up-pc, mp-pc] }
    - { title: "Sub-Inspector", text: "Any degree → the state board's SI exam, or the State PSC in some states (Rajasthan, Chhattisgarh, Maharashtra).", source: [up-si, rj-si, cg-si, mh-psi] }
    - { title: "Delhi Police and CAPF", text: "SSC runs the Delhi Police Constable exam and the 'SI in Delhi Police and CAPFs' exam for the whole country.", source: [dl-pc, dl-si] }
    - { title: "DSP and IPS", text: "Deputy Superintendent posts come through State PSC exams such as GPSC Class 1–2; IPS comes through the UPSC Civil Services exam.", source: [gj-gpsc, rj-pc] }
  cost_time:
    - { label: "UP Constable fee 2025", value: "₹500 · SC / ST ₹400", source: up-pc }
    - { label: "Assam / Kerala constable fee", value: "No application fee", source: [as-pc, kl-pc] }
    - { label: "West Bengal Constable fee 2024", value: "₹170 · WB SC / ST ₹20", source: wb-pc-info }
  cost_note: "There is no course fee — training is given after selection. Coaching is optional."
  challenges:
    - text: "Competition is huge: Telangana's 2026 drive got <strong>5,77,064 applications</strong> from about 4.29 lakh people for 7,437 posts."
      source: tg-pn
    - text: "Physical standards are strict and differ by state — for example 168 cm for a Rajasthan General constable and for Chhattisgarh's male SI candidates."
      source: [rj-pc, cg-si]
    - text: "Age windows are narrow: UP took male constables only from 18 to 22 in the 2025 drive."
      source: up-pc
  not_for:
    - "You cannot work nights, holidays and long shifts."
    - "You are not ready to keep fit and pass running and physical tests."
    - "You dislike rules, uniforms and a strict chain of command."
journey:
  - stages: [c8, c9]
    title: "Fitness and a clean record start now"
    do:
      - text: "Start running and sports now — every state has a running test. Gujarat's: men 5 km in 25 minutes, women 1.6 km in 9 minutes 30 seconds."
        source: gj-gprb
      - text: "Stay away from fights and cases — police verification checks your character before appointment."
    doubts:
      - q: "Can girls join the police?"
        a: "Yes. States recruit women constables and Sub-Inspectors — West Bengal's 2024 drive had 3,537 posts for women, and UP took women constables up to age 25."
        next: "Start your fitness training early — women have their own running standard."
        source: [wb-pc-vac, up-pc]
      - q: "Is police a state job or a central job?"
        a: "Mostly state. Each state recruits its own police through its own board. Delhi Police and the central armed police forces recruit through the Staff Selection Commission."
        next: "Find your state's police recruitment board in the State rules section of this page."
        source: [dl-pc, dl-si]
  - stages: [c10]
    title: "Any stream — pass Class 12"
    do:
      - text: "Most states need <strong>Class 12</strong> for constables — UP, Gujarat, Karnataka, Maharashtra, Telangana, Delhi. Madhya Pradesh asks only Class 10 (Class 8 for ST)."
        source: [gj-gprb, ka-pc, mh-pc, tg-pc, dl-pc, mp-pc]
    stream: "Any stream. Keep your Class 10 certificate — your date of birth is checked from it."
    doubts:
      - q: "Can I become a police constable after Class 10?"
        a: "In Madhya Pradesh, yes — its 2026 constable test asks for Class 10 (Class 8 for ST candidates). Most other states, such as UP, Gujarat and Karnataka, need Class 12."
        next: "Plan to finish Class 12 to keep every state open."
        source: [mp-pc, gj-gprb, ka-pc]
      - q: "Which stream is best for police?"
        a: "Any stream. The constable rules ask for a Class 12 pass, and the SI rules ask for a bachelor's degree in any subject."
        next: "Choose the stream you can score well in."
        source: [ka-pc, dl-si]
  - stages: [c11, c12]
    title: "Class 12, height and the constable age window"
    do:
      - text: "Watch the age windows: UP constable 2025 — men 18–22, women 18–25; Karnataka 18–33; Assam 18–26 (unreserved, this cycle)."
        source: [up-pc, ka-pc, as-pc-corr]
      - text: "Check the height rule of your state early — Rajasthan's General male constable needs 168 cm."
        source: rj-pc
      - text: "In Tamil Nadu you must clear a <strong>Tamil language test</strong> (40%) before your written paper is even marked."
        source: tn-pc
    exams:
      - { name: "Telangana PC prelims", when: "20 Dec 2026 (tentative)", source: tg-pn }
      - { name: "MP Constable (GD) test", when: "From 19 Nov 2026", source: mp-pc }
    money: [csss, pms-sc]
    mistakes:
      - "Ignoring the physical test until the written result — there is no time to build stamina then."
      - "Missing the narrow age window by waiting for 'the next drive'."
    late: "Crossed the constable age? Sub-Inspector exams take older candidates — UP's SI 2025 went up to 28 (+3 one-time)."
    doubts:
      - q: "What is the age limit for police constable?"
        a: "It depends on the state and the drive. UP 2025: men 18–22, women 18–25. Karnataka 2026: 18–33. Kerala PSC: 18–26. Reserved categories get extra years."
        next: "Read your state's latest notice in the State rules section of this page."
        source: [up-pc, ka-pc, kl-pc]
      - q: "Is there a physical test in police recruitment?"
        a: "Yes, in every state: body measurement and a running test. Gujarat's: men run 5 km in 25 minutes and women 1.6 km in 9 minutes 30 seconds."
        next: "Train for your state's running standard months before the exam."
        source: [gj-gprb, up-pc]
      - q: "Do I need to know the state language?"
        a: "Some states test it. Tamil Nadu's constable recruitment has a qualifying Tamil test (40%), and only those who pass it get their main paper marked."
        next: "Check your state's notice for a language test."
        source: tn-pc
      - q: "How much is the police exam fee?"
        a: "It varies: UP constable 2025 was ₹500 (₹400 SC / ST); West Bengal ₹170 (₹20 for WB SC / ST); Assam and Kerala PSC charged no fee."
        next: "Keep a little money aside for each state form you fill."
        source: [up-pc, wb-pc-info, as-pc, kl-pc]
      - q: "How tough is the competition for police jobs?"
        a: "Very tough. Telangana's 2026 police drive received 5,77,064 applications from about 4.29 lakh people for 7,437 posts."
        next: "Prepare for the written test and the running test together, and apply in more than one drive."
        source: tg-pn
  - stages: [ug]
    title: "In college: aim for Sub-Inspector"
    do:
      - text: "Sub-Inspector exams ask for <strong>a bachelor's degree</strong> — Delhi Police / CAPF SI, Telangana and Gujarat PSI all do."
        source: [dl-si, tg-pc, gj-gprb]
      - text: "Keep training: SI selection also has physical tests."
    doubts:
      - q: "What qualification do I need for Sub-Inspector?"
        a: "A bachelor's degree in any subject. Delhi Police and CAPF SI 2026 took graduates aged 20 to 25; UP's SI 2025 took 21 to 28 (+3 years one time)."
        next: "Apply in your final year if the notice allows appearing graduates."
        source: [dl-si, up-si]
      - q: "Who conducts the SI exam in my state?"
        a: "Usually the state police recruitment board. In some states the State PSC runs it — RPSC in Rajasthan, CGPSC in Chhattisgarh and MPSC (through its Group-B combined exam) in Maharashtra."
        next: "Check the State rules section of this page for your state."
        source: [rj-si, cg-si, mh-psi]
  - stages: [grad]
    title: "Graduated: SI, CAPF SI or a State PSC officer post"
    do:
      - text: "<strong>SSC 'SI in Delhi Police and CAPFs' 2026</strong>: any degree, age 20–25 on 1 Aug 2026, Pay Level 6. CBT on 20–28 Nov 2026."
        source: dl-si
      - text: "Officer entry: Deputy Superintendent of Police through State PSC (e.g. GPSC Class 1–2), IPS through UPSC."
        source: [gj-gpsc, rj-pc]
    exams:
      - { name: "SSC SI in Delhi Police &amp; CAPFs 2026", when: "CBT 20–28 Nov 2026", source: dl-si }
      - { name: "Telangana SI prelims", when: "29 Nov 2026 (tentative)", source: tg-pn }
    doubts:
      - q: "How do I join Delhi Police as a Sub-Inspector?"
        a: "Through the SSC exam 'Sub-Inspector in Delhi Police and CAPFs'. The 2026 notice asked for any degree and age 20–25 on 1 August 2026; the pay is Level 6."
        next: "Watch ssc.gov.in for the next notice."
        source: dl-si
      - q: "Can I become a DSP directly?"
        a: "Yes, through your State PSC's civil services exam where DSP is one of the posts — Gujarat's GPSC Class 1–2 exam includes it. IPS comes through UPSC."
        next: "See the Civil Services blueprint for UPSC."
        source: [gj-gpsc, rj-pc]
      - q: "What is the pay of a Sub-Inspector?"
        a: "It depends on the state: Delhi Police / CAPF SI is Pay Level 6, Maharashtra PSI is S-14 (₹38,600–₹1,22,800), Rajasthan SI is Level 11, and Gujarat's PSI gets ₹49,600 fixed during the contract period."
        next: "Read your state's SI notice for the exact pay."
        source: [dl-si, mh-psi, rj-si, gj-gprb]
  - stages: [work]
    title: "Joining police later"
    do:
      - text: "Upper age limits are the main barrier — SI windows are higher than constable ones, and reserved categories get extra years."
        source: [up-si, gj-gprb]
    doubts:
      - q: "I am 27. Is it too late for police?"
        a: "For constable in many states, yes — but not everywhere: Karnataka 2026 took constables up to 33 and Gujarat's Lokrakshak up to 33; Gujarat's PSI went up to 35."
        next: "Check states with higher limits and your category relaxation."
        source: [ka-pc, gj-gprb]
board_note: "Any board's Class 10 and Class 12 count. Your date of birth on the Class 10 certificate is what recruitment boards check."
board_source: mp-pc
