    parts:
      - prose:
          - "B.Ed fees at government and state university colleges are typically in the range of <strong>₹20,000-60,000 per year</strong>, while private B.Ed colleges can charge considerably more, often ₹50,000-1.5 lakh per year depending on the state and institute. Merit-based, SC/ST and income-linked scholarships are available at most government institutions. Always confirm current fees directly on your target college's official admission page."
