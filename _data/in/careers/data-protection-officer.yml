    eyebrow: "Honest take"
    heading: "Advantages and disadvantages"
    parts:
      - proscons:
          pros:
            - "New, fast-growing field in India."
            - "Open to law, tech and commerce graduates."
            - "Board-level visibility."
          cons:
            - "Senior roles need years of experience."
            - "Rules are new and still being interpreted."
            - "High responsibility when breaches happen."
