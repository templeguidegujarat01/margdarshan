          - "Minimum aggregate typically <strong>50-60%</strong> at most colleges offering a dedicated Robotics programme — generally more flexible than IIT/NIT cutoffs for core branches."
          - "Alternatively, standard PCM eligibility for <strong>Mechanical, Electronics or Computer Science</strong> if you choose the specialise-later route instead."
