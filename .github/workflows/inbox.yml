# Inbox build — turns state-fill files uploaded to inbox/ into live pages (docs/free-claude/README.md).
#
# 1. The owner uploads <topic>--<state>.yml (made by any Claude chat from docs/free-claude/PROMPT.md) into inbox/
#    on github.com and commits to main.
# 2. This job: scripts/inbox-ingest.mjs (checks every row and link, files them under scripts/learn-src/local/,
#    moves the upload to inbox/done/, writes inbox/REPORT.md) → scripts/rebuild-learn.mjs (finder JSON, learn/
#    pages, old-page redirects, topic list, menu, asset version) → one commit back to main.
# 3. GitHub Pages then rebuilds the site from main (the last step asks for that build in case the bot's own push
#    does not start one).
# "Run workflow" on the Actions tab runs the same rebuild by hand (e.g. after editing a local file on github.com).
name: Inbox build

on:
  push:
    branches: [main]
    paths:
      - 'inbox/*.yml'
      - 'inbox/*.yaml'
      - 'inbox/*.txt'
      # an extracted ZIP dragged in anywhere (repo root or the ZIP's own folder): <topic>--<state>.yml
      - '**--*.yml'
      - '**--*.yaml'
      - 'scripts/learn-src/local/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: inbox-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install js-yaml + liquidjs (the only packages the scripts use)
        run: npm install --prefix "$RUNNER_TEMP/deps" --no-save --no-audit --no-fund js-yaml@4 liquidjs@10
      - name: Read the inbox
        env:
          VERIFY_DEPS: ${{ runner.temp }}/deps
        run: node scripts/inbox-ingest.mjs
      - name: Rebuild finders, pages, menu
        env:
          VERIFY_DEPS: ${{ runner.temp }}/deps
        run: node scripts/rebuild-learn.mjs
      # Safety net: the site is published only if every check passes. If anything above or here fails, the next
      # step throws all changes away and only parks the uploads in inbox/rejected/ (with the reason in REPORT.md).
      - name: Safety checks (nothing is published if one fails)
        env:
          VERIFY_DEPS: ${{ runner.temp }}/deps
        run: |
          node scripts/build-learn-finders.mjs --check
          node scripts/build-seo-landings.mjs --check
          node scripts/build-nav-mega.mjs --check
          node scripts/check-in-data.mjs
          node scripts/verify-site.mjs --only=learn/
      - name: Failed — publish nothing, park the uploads in inbox/rejected
        if: failure()
        env:
          VERIFY_DEPS: ${{ runner.temp }}/deps
        run: |
          git reset -q --hard HEAD
          git clean -qfd
          node scripts/inbox-ingest.mjs --reject-all="the build or a site check failed (run ${{ github.run_id }} on the Actions tab)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Inbox build FAILED: uploads moved to inbox/rejected, site unchanged"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          added=$(git diff --cached -U0 docs/learn-finder/LOG.md | grep "^+- " | grep -o "[a-z0-9-]*/[a-z-]* · +[0-9]*" | tr '\n' ';' || true)
          git commit -m "Inbox build: ${added:-rebuild learn finders}"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Ask GitHub Pages to rebuild
        continue-on-error: true
        run: |
          curl -fsS -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/pages/builds"
