  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What is BA Political Science?"
    parts:
      - overview:
          points:
            - "BA Political Science is a 3-year undergraduate degree (4 years for Honours with Research under National Education Policy (NEP) 2020) that studies political theory, the structure and working of the Indian government and Constitution, comparative politics across countries, public administration, and international relations."
            - "It trains students to analyse institutions, ideologies and current affairs critically, rather than simply describing how governments are supposed to work on paper."
            - "It's offered widely across Indian universities."
          more:
            - "Delhi University colleges — <strong>Hindu College, Lady Shri Ram College, Hansraj College and Kirori Mal College</strong> — are among the most competitive destinations, alongside Jawaharlal Nehru University's undergraduate programmes, Presidency University Kolkata, and Jamia Millia Islamia, under the University Grants Commission (UGC) framework."
  - id: "who"
    hid: "who-heading"
    alt: true
    eyebrow: "Fit check"
    heading: "Who should choose BA Political Science"
    parts:
      - fit:
          match:
            - "Follow current affairs, government policy and news with genuine curiosity, not just for exams."
            - "Are seriously considering UPSC Civil Services, law, journalism, policy research or diplomacy."
            - "Enjoy debate and argument, and are comfortable engaging with contested, sometimes politically sensitive topics objectively."
          mismatch:
            - "Have no interest in reading political theory or current governance issues regularly."
            - "Want a degree with a fixed, direct pipeline into campus placements straight after graduation."
            - "Are only choosing it as a \"safe\" degree without genuinely wanting a career it leads toward — the payoff usually comes from what you build on top of it."
  - id: "eligibility"
    hid: "elig-heading"
    eyebrow: "Eligibility"
    heading: "Who can apply for BA Political Science"
    parts:
      - elig_list:
          - "Class 12 pass (10+2) from a recognised board, typically <strong>45-50% aggregate</strong> for General/EWS/OBC and slightly relaxed for SC/ST/PwD categories, varying by university."
          - "Open to students from any stream — Arts, Commerce or Science — since no specific Class 12 subject is compulsory."
          - "Having studied Political Science or Civics at Class 11-12 helps with familiarity but is not a strict requirement at most colleges."
