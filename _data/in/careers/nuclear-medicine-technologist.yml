sections:
  - id: "quick"
    hid: "quick-heading"
    alt: true
    eyebrow: "Quick answers"
    heading: "Nuclear Medicine Technologist at a glance"
    intro: "Check whether your Class 12 background qualifies. Duration and pay are in the summary at the top of the page."
    parts:
      - subhead: "Can I apply from my stream?"
      - streams:
          - label: "Science"
            fit: "Eligible"
            tone: "y"
            icon: "science"
          - label: "Commerce"
            fit: "Not eligible"
            tone: "n"
            icon: "commerce"
          - label: "Arts / Humanities"
            fit: "Not eligible"
            tone: "n"
            icon: "arts"
      - note: "Class 12 Science with Physics, Chemistry and Biology is the standard requirement."
  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What does a Nuclear Medicine Technologist do?"
    parts:
      - overview:
          points:
            - "Technologists prepare radiopharmaceuticals, position patients, operate gamma cameras, SPECT and PET-CT scanners, and process the images for the nuclear medicine doctor."
            - "They follow strict radiation-protection rules: handling radioactive material, waste and dose records."
            - "Some also assist in radionuclide therapy, for example thyroid treatment."
  - id: "who"
    hid: "who-heading"
    alt: true
    eyebrow: "Fit check"
    heading: "Who should become a Nuclear Medicine Technologist"
    parts:
      - fit:
          match:
            - "Like physics, technology and patient care together."
            - "Are careful and comfortable following safety protocols exactly."
            - "Want a specialised, in-demand allied health career."
          mismatch:
            - "Are anxious about working near radiation (it is controlled, but constant care is needed)."
            - "Want a career that does not involve patients."
            - "Want to work in small towns — units are mostly in larger hospitals."
  - id: "eligibility"
    hid: "elig-heading"
    eyebrow: "Eligibility"
    heading: "What you need, stage by stage"
    parts:
      - elig_list:
          - "Class 12 with <strong>Physics, Chemistry and Biology</strong>; minimum marks and age set by each university."
          - "Admission by merit or the university's own entrance test."
          - "Choose a programme attached to an AERB-licensed facility, so your clinical training counts."
  - id: "roadmap"
    hid: "roadmap-heading"
    alt: true
    eyebrow: "Step-by-step"
    heading: "Your full path to becoming a Nuclear Medicine Technologist"
    parts:
      - steps:
          - title: "Class 12 PCB"
            text: "Physics is as important as Biology here."
          - title: "B.Sc Nuclear Medicine Technology"
            text: "Course length and internship differ by university."
          - title: "Or B.Sc + PG diploma"
            text: "A science graduate can take a postgraduate NMT diploma."
          - title: "Internship"
            text: "In a hospital nuclear medicine department."
          - title: "Technologist job"
            text: "PET-CT centres, cancer hospitals, research institutes."
  - id: "exams"
    hid: "exams-heading"
    eyebrow: "Regulation"
    heading: "Who regulates the work"
    parts:
      - chips:
          - label: "AERB"
            text: "Licenses nuclear medicine facilities and enforces radiation-safety rules, including qualified staff."
            source: "aerb"
          - label: "NCAHP Act, 2021"
            text: "The law that regulates allied and healthcare professions, including imaging technologists."
            source: "ncahp"
          - label: "University admission"
            text: "Merit or institute entrance tests; there is no single national exam."
