  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What does a Software Engineer actually do?"
    parts:
      - overview:
          points:
            - "A Software Engineer designs, builds, tests and maintains software — websites, mobile apps, backend systems and the large-scale platforms behind products used by millions."
            - "It's a role, not a single fixed degree: engineers reach it through a B.Tech in CSE/IT, a BCA, or increasingly through self-taught skill-building with a strong project portfolio, since many companies now hire primarily on demonstrated ability."
            - "India's software engineering job market in 2026 is the largest it has ever been by headcount, and the layoffs of 2022-23 at global tech companies have largely been absorbed, with hiring resuming across most segments."
          more:
            - "What's changed is how differentiated the outcomes are — company type now predicts your salary more than almost anything else."
