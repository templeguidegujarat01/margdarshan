            value: "Entry level"
            text: "Common first role."
          - label: "Penetration tester"
            value: "Mid level"
            text: "Skill and reputation drive pay."
          - label: "Senior / red-team lead"
            value: "High"
            text: "Experienced testers are in short supply."
  - id: "jobs"
