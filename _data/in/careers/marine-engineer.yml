hero:
  eyebrow: "Science · Maritime Engineering"
  title: "Marine Engineer — Running a Ship's Engine Room"
  meta:
    - "Certificates by DG Shipping"
    - "Class 12 with Physics, Chemistry & Maths"
  read_time: "8 min read"
  intro:
    - "Marine engineers operate and maintain the engines, generators, pumps and every machine that keeps a ship moving. The usual route is a 4-year B.Tech/B.E. Marine Engineering at a DG Shipping-approved institute (admission mostly through IMU CET), sea time as an engine cadet, and then the Marine Engineer Officer (MEO) certificate exams up to Chief Engineer."
