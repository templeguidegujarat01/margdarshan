  # ------------------------------------------------------------------ AP PGECET — M.TECH (read 31 Oct 2026)
  - slug: pgecet
    group: academic
    short: "AP PGECET — M.Tech, M.Pharm &amp; Pharm.D (PB)"
    body: "Andhra University, Visakhapatnam, for the Andhra Pradesh State Council of Higher Education (APSCHE)"
    card: "Andhra Pradesh's entrance test for M.Tech, M.Pharm and Pharm.D (Post Baccalaureate). GATE / GPAT holders are admitted first; PGECET ranks fill the rest. APPGECET-2026 was held on 28–30 April 2026 and results came on 14 May 2026."
    card_facts: ["120 Qs · no negative marking", "Qualify: 25% (none for SC/ST)", "85% local · 15% unreserved"]
    eyebrow: "AP PGECET · After B.Tech"
    title: "AP PGECET 2026 — M.Tech Entrance, Pattern, Qualifying Marks, Eligibility & Local Quota"
    lede: "The Andhra Pradesh Post Graduate Engineering Common Entrance Test (APPGECET) is conducted by Andhra University for APSCHE. This page follows the APPGECET-2026 instruction booklet (version 2) and the official examination schedule."
    facts:
      - { label: "2026 exam", value: "28 – 30 Apr 2026 (CBT)", source: ap-sched }
      - { label: "Paper", value: "120 MCQs · 120 marks · no negative", source: ap-ib }
      - { label: "Qualifying", value: "25% (30 marks) · none for SC/ST", source: ap-ib }
      - { label: "Seats", value: "85% local · 15% unreserved", source: ap-ib }
    official:
      - { label: "APPGECET website", url: "https://cets.apsche.ap.gov.in/PGECET/PGECET/PGECET_HomePage.aspx" }
      - { label: "Instruction booklet 2026 (PDF)", url: "https://cets.apsche.ap.gov.in/PGECET/PDF/APPGECET2026_InstructionBooklet_V2.pdf" }
    sections:
      - id: overview
        nav: "Overview"
        eyebrow: "Overview &amp; official source"
        heading: "GATE / GPAT first, then PGECET rank"
        parts:
          - p: "APPGECET-2026 admits students to M.Tech, M.Pharm and Pharm.D (PB) in university engineering and pharmacy colleges of Andhra Pradesh and their AICTE-approved affiliated colleges for 2026-27. <strong>GATE / GPAT-qualified candidates are given first preference</strong> on their scores; remaining seats go to APPGECET-2026 ranks."
            source: ap-ib
          - table:
              caption: "APPGECET-2026 calendar"
              head: ["Event", "Date"]
              rows:
                - ["Notification", "4 Feb 2026"]
                - ["Online applications", "6 Feb – 20 Mar 2026 (late fee up to 1 Apr)"]
                - ["Hall tickets", "15 Apr 2026"]
                - ["Exam", "28, 29 &amp; 30 Apr 2026"]
                - ["Preliminary key · objections till", "6 May · 8 May 2026"]
                - ["Result", "14 May 2026"]
            source: ap-ib
      - id: eligibility
        nav: "Eligibility"
        eyebrow: "Academic eligibility"
        heading: "Relevant degree with 50% (45% reserved)"
        parts:
          - list:
              - "Indian nationality, and the local / non-local status rules of the Government of Andhra Pradesh for 2026-27."
              - "A relevant bachelor's degree with at least 50% marks (45% for reserved categories) from an AICTE / UGC-approved institution."
              - "Final-year B.Tech / B.Pharm students may sit the test if they pass all subjects before counselling."
              - "You can only be admitted to courses linked to the test paper you qualified in; the course-wise table is in the booklet."
            source: ap-ib
      - id: scheme
        nav: "Exam Scheme"
        eyebrow: "Exam scheme &amp; qualifying marks"
        heading: "120 questions, no negative marks, 25% to qualify"
        parts:
          - list:
              - "Computer-based test in English: 120 multiple-choice questions for 120 marks, <strong>no negative marking</strong>."
              - "Qualifying mark: 25% (30 of 120); no minimum for SC / ST. A rank won through this relaxation is cancelled if the caste claim fails at admission."
              - "Objections to the preliminary key cost ₹300 per question, refunded only for valid objections."
              - "Test centres are held in 17 cities in Andhra Pradesh, from Srikakulam to Anantapur."
            source: ap-ib
          - p: "13 test papers in 2026: Biotechnology, Chemical, Civil, Computer Science &amp; IT, Electrical, Electronics &amp; Communication, Food Technology, Geo-Engineering &amp; Geo-Informatics, Instrumentation, Mechanical, Metallurgical, Nano Technology and Pharmacy."
            source: ap-ib
      - id: fees
        nav: "Fees"
        eyebrow: "Application fee"
        heading: "Pay online; late fees up to ₹10,000"
        parts:
          - list:
              - "The registration fee is paid online (AP Online or payment gateway). To sit more than one paper, register for all of them in the same application and pay the amount shown."
              - "Late fees: ₹1,000 (till 23 Mar), ₹2,000 (26 Mar), ₹4,000 (28 Mar), ₹10,000 (1 Apr 2026)."
            source: ap-ib
      - id: reservation
        nav: "Local Quota"
        eyebrow: "Local / non-local seats"
        heading: "85% of seats for local candidates"
        parts:
          - p: "In each course 85% of seats are reserved for local candidates and 15% are unreserved, under the orders of the Government of Andhra Pradesh for 2026-27."
            source: ap-ib
      - id: documents
        nav: "Documents"
        eyebrow: "Application details"
        heading: "Aadhaar and Mee Seva numbers"
        parts:
          - list:
              - "Aadhaar number is mandatory."
              - "Enter the qualifying-degree and Class 10 hall ticket numbers, places of study from Class 9, and Mee Seva numbers of the caste and income certificates; upload a photo (50 KB) and signature (30 KB)."
              - "A chosen test paper cannot be changed later."
            source: ap-ib
      - id: pay
        nav: "Costs"
        eyebrow: "Costs"
        heading: "Test fee only"
        parts:
          - p: "The booklet covers only the application, late and objection fees. College fees are set at admission."
            source: ap-ib
      - id: posting
        nav: "After PGECET"
        eyebrow: "After the test"
        heading: "Admission under APSCHE rules"
        parts:
          - p: "Appearing in the test does not by itself give a seat; admission follows the eligibility and rules of APSCHE and the Government of Andhra Pradesh, with GATE / GPAT holders placed first."
            source: ap-ib
          - links:
              - { label: "GATE", url: "gate.html" }
              - { label: "AP EAPCET", url: "state/andhra-pradesh/eapcet.html" }
