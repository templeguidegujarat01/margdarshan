  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "How long is the BPO course?"
            a: "Four academic years followed by a six-month internship, as per the RCI framework."
          - q: "Is RCI registration compulsory?"
            a: "Yes. Rehabilitation professionals must be registered with RCI to practise."
          - q: "Can a PCM student do BPO?"
            a: "Yes. Institutes accept Physics and Chemistry with either Biology or Mathematics, plus English."
      - note: "*Pay figures are indicative unless they quote an official pay level, and rules change: confirm eligibility, dates and fees on the official websites listed under Sources before you act."
        class: "table-note mt-lg"
