title: "Study in Indonesia from India"
seo_title: "Study in Indonesia from India: KNB Scholarship and e-Visa"
description: "Indonesia for Indian students: the government KNB scholarship (47 universities, embassy recommendation), the study e-visa (IDR 6–12 million) with US$2,000 funds, and no work rights."
lede: "Indonesia is a smaller study destination for Indians, reached mostly through the Government of Indonesia's KNB scholarship for students from developing countries. Students enter on a limited-stay study visa and may not work."
facts:
  - { label: "Government scholarship", value: "KNB, at 47 partner universities", source: knb }
  - { label: "Study e-visa", value: "IDR 6,000,000 (1 yr) to 12,000,000 (4 yr)", source: evisa_study }
  - { label: "Money to show", value: "At least US$2,000", source: evisa_study }
  - { label: "Work", value: "Not allowed on a study visa", source: evisa_study }
card:
  line: "KNB government scholarship; limited-stay study visa"
