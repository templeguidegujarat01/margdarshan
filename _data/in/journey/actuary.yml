# Journey Blueprint — Actuary (IAI: ACET → Associate → Fellow). Printed on journey-actuary.html (_includes/journey-doubts.html).
# Rules, classes and the money items / sources several careers share: _data/in/journey_common.yml.
# `money_defs` / `sources` below are used only by this career. Check: node scripts/check-journey-matrix.mjs
id: actuary
v: 2
name: "Actuary (IAI: ACET → Associate → Fellow)"
search: ["actuary", "actuarial analyst", "actuarial valuation analyst", "actuarial modelling analyst", "actuarial science"]
page: "actuarial-science.html"
roadmap: "roadmaps/actuarial-science.html"
doubts_page: "journey-actuary.html"
gate: "Class 12 in any stream, with a love for Maths → the Institute of Actuaries of India's entrance test (ACET) → student member → pass the core subjects (Associate) → specialist subjects, the India Fellowship Seminar and 3 years' work (Fellow). Some qualifications — CA, CMA, CS, IIT graduates, ISI B.Stat and more — enter without ACET."
gate_source: [iai-acet, iai-ep26, iai-direct]
core:
  what:
    text: "Actuaries measure and price long-term financial risk — in life and health insurance, pensions, general insurance and investment. In India the profession is regulated by the Institute of Actuaries of India (IAI), a statutory body under the Actuaries Act 2006."
    source: [iai-acet, iai-fees]
  day:
    - "Build models of risk, claims and cash flows."
    - "Price insurance products and check that reserves are enough."
    - "Explain results to managers and regulators."
  pay:
    - { level: "Administrative Officer (Actuarial), New India Assurance 2025", value: "Basic ₹50,925 · gross about ₹90,000 a month in metros", source: niacl-ao25 }
  pay_note: "Private actuarial salaries are not officially published."
  routes:
    - { title: "ACET (Actuarial Common Entrance Test)", text: "Open once you have appeared for Class 12 — any stream. The result stays valid for 3 years for taking IAI student membership.", source: iai-acet }
    - { title: "Direct entry without ACET", text: "Qualified members of ICAI, ICMAI and ICSI; MBA Finance with 60%; IIM graduates; B.E. with 60%; IIT graduates; B.Sc / M.Sc Actuarial Science; ISI's B.Stat, B.Math, M.Stat and other listed degrees; Fellows of the Insurance Institute of India.", source: iai-direct }
    - { title: "Associate → Fellow", text: "Fellow (FIAI): pass all 10 Core Principles and Core Practices subjects, 3 more (at least 2 Specialist Principles and 1 Specialist Advanced), the India Fellowship Seminar and 3 years of relevant actuarial work.", source: iai-ep26 }
    - { title: "Public sector insurer", text: "New India Assurance's 2025 notice had 5 Actuarial Specialist officer posts, needing a qualifying degree with 60% (55% SC / ST / PwBD) and at least four actuarial papers passed from IAI.", source: niacl-ao25 }
  cost_time:
    - { label: "Core Principles exam fees", value: "₹5,000 each for CS1, CS2, CM1, CM2 · ₹3,000 each for CB1, CB2, CB3 (India / SAARC)", source: iai-fees }
    - { label: "Core Practices", value: "₹8,000 CP1 · ₹10,000 CP2 · ₹8,000 CP3", source: iai-fees }
    - { label: "Specialist subjects", value: "₹6,000 each SP · ₹7,500 each SA", source: iai-fees }
  cost_note: "We did not find ACET's own fee on IAI's public pages, so it is not printed."
  challenges:
    - text: "Fellowship takes years: 13 subjects, a seminar and 3 years of relevant work."
      source: iai-ep26
    - text: "The syllabus is changing: students entering from the May 2027 exam diet follow a revised structure with a new CS3 – Data Science paper, and CB3 and CP3 merge into one CP3 from November 2027."
      source: iai-ep26
    - text: "Exam fees add up — ₹3,000 to ₹10,000 per paper, paid again on every attempt."
      source: iai-fees
  not_for:
    - "You dislike Maths and Statistics — the core papers are built on them."
    - "You want a job in two years — qualifying takes much longer."
    - "You give up after one failed exam — most students resit papers."
journey:
  - stages: [c8, c9]
    title: "Maths, statistics and patience"
    do:
      - text: "ACET tests Mathematics (30 marks), Statistics (30), Data Interpretation (15), English (15) and Logical Reasoning (10)."
        source: iai-acet-st
    doubts:
      - q: "What does an actuary do?"
        a: "Actuaries measure and price long-term financial risk in insurance, pensions and investment. In India the Institute of Actuaries of India regulates the profession under the Actuaries Act 2006."
        next: "Read the Routes list above."
        source: [iai-acet, iai-fees]
      - q: "Which subjects does ACET test?"
        a: "Mathematics and Statistics (30 marks each), Data Interpretation and English (15 each) and Logical Reasoning (10) — 100 marks in all."
        next: "Make Maths and statistics your strongest subjects."
        source: iai-acet-st
  - stages: [c10]
    title: "Any stream — keep your Maths"
    do:
      - text: "IAI's ACET page welcomes Finance or any other stream, as long as you love Mathematics and have numeracy skills."
        source: iai-acet
    stream: "Any stream; Mathematics in Class 11–12 helps a lot."
    doubts:
      - q: "Can a Commerce or Arts student become an actuary?"
        a: "Yes. ACET is open to students from any stream who have appeared for or passed Class 12; it tests Maths, Statistics, Data Interpretation, English and Reasoning."
        next: "Keep Maths in Class 11 if you can."
        source: [iai-acet, iai-acet-st]
  - stages: [c11, c12]
    title: "Write ACET after your Class 12 exams"
    do:
      - text: "You can sit ACET once you have appeared for Class 12 — waiting for the result is allowed."
        source: iai-acet
      - text: "ACET: 3 hours, 70 MCQs, 100 marks, no negative marking, pass mark 50%."
        source: iai-acet-st
    exams:
      - { name: "ACET December 2026", when: "5 Dec 2026, 10 am – 1 pm · register by 4 Nov 2026 · result 16 Dec 2026", source: iai-dates }
    doubts:
      - q: "Can I write ACET in Class 12?"
        a: "Yes, after your Class 12 board exams: students who have appeared for 10+2 and are waiting for the result are eligible."
        next: "Register for the session right after your boards."
        source: iai-acet
      - q: "Is there negative marking in ACET?"
        a: "No. ACET has 70 questions for 100 marks in 3 hours, and the pass mark is 50%."
        next: "Attempt every question."
        source: iai-acet-st
      - q: "How long is my ACET result valid?"
        a: "Three years from the result date, for taking IAI student membership."
        next: "Join as a student member within that window."
        source: iai-acet
      - q: "When is the next ACET?"
        a: "5 December 2026, 10 am to 1 pm. Registration closes on 4 November 2026 and results come on 16 December 2026."
        next: "Register before the closing date."
        source: iai-dates
  - stages: [ug]
    title: "In college: start the core papers"
    do:
      - text: "As a student member you start the Core Principles papers — CS1, CS2, CM1, CM2, CB1, CB2, CB3."
        source: [iai-fees, iai-sss]
    money: [iai-sss]
    doubts:
      - q: "Which degree is best for an actuary?"
        a: "IAI does not fix one degree. Several qualifications give direct entry without ACET — B.Sc / M.Sc Actuarial Science, ISI's B.Stat or B.Math, a B.E. with 60%, IIT graduates and more."
        next: "Choose a degree with strong Maths and Statistics."
        source: iai-direct
      - q: "Who can get IAI's Student Support Scheme?"
        a: "Indian student members whose family income is up to ₹8 lakh a year, who are not employed and are pursuing IAI exams as their core study. It funds membership fees, IAI study material and exam fees for up to two attempts per subject (CS1–CB3)."
        next: "Apply when IAI invites applications; keep your income certificate ready."
        source: iai-sss
      - q: "How much do actuarial exams cost?"
        a: "₹5,000 each for CS1, CS2, CM1 and CM2, and ₹3,000 each for CB1, CB2 and CB3 (India / SAARC rates); later papers cost ₹6,000 to ₹10,000."
        next: "Budget for resits too."
        source: iai-fees
  - stages: [grad]
    title: "Work, specialist papers and Fellowship"
    do:
      - text: "Fellowship needs all 10 core subjects, 2 Specialist Principles + 1 Specialist Advanced, the India Fellowship Seminar and 3 years' relevant work."
        source: iai-ep26
    doubts:
      - q: "What do I need to become a Fellow of IAI?"
        a: "Pass all 10 Core Principles and Core Practices subjects, three more subjects (at least two Specialist Principles and one Specialist Advanced), complete the India Fellowship Seminar and 3 years of relevant actuarial work."
        next: "Track your papers and work experience together."
        source: iai-ep26
      - q: "Do government insurance companies hire actuarial students?"
        a: "Yes. New India Assurance's 2025 notice had 5 Actuarial Specialist officer posts for candidates with a qualifying degree at 60% and at least four IAI papers passed, at a basic pay of ₹50,925."
        next: "Pass four papers to become eligible."
        source: niacl-ao25
      - q: "What is changing in actuarial exams from 2027?"
        a: "New students from the May 2027 exam diet follow a revised structure that includes CS3 – Data Science, and CB3 and CP3 merge into a single CP3 from November 2027."
        next: "Check which structure applies to you."
        source: iai-ep26
  - stages: [work]
    title: "Coming from CA, CMA or CS"
    do:
      - text: "Fully qualified CA, CMA and CS members join IAI as students on application, without ACET."
        source: iai-direct
    doubts:
      - q: "I am a CA. Do I need ACET?"
        a: "No. Fully qualified members of ICAI, the Institute of Cost Accountants of India and ICSI are admitted to student membership on application with documents."
        next: "Apply under IAI's Non-ACET (Direct Entry) route."
        source: iai-direct
      - q: "Can an MBA Finance graduate skip ACET?"
        a: "Yes, with at least 60% (or an equivalent grade). IAI also admits IIM graduates, IIT graduates and B.E. graduates with 60% to student membership without ACET."
        next: "Apply with your degree documents."
        source: iai-direct
board_note: "Any board and stream. ACET needs only that you have appeared for or passed Class 12."
board_source: iai-acet
