            - "Nutrition & Dietetics is the science of food, nutrition, health and disease prevention."
            - "Professionals in this field help people maintain healthy lifestyles through evidence-based dietary planning, working with patients in hospitals, athletes, schools, corporations and wider communities to improve health outcomes."
            - "Here's the honest, important context most guides skip: \"Dietitian\" and \"Nutritionist\" are not interchangeable terms in India, whatever casual usage suggests."
          more:
            - "A Dietitian, particularly with <strong>Registered Dietitian (RD) status through the Indian Dietetic Association (IDA)</strong>, holds a structured, credentialed qualification."
            - "\"Nutritionist,\" by contrast, is a largely unregulated title — almost anyone can adopt it after a short course, with no legal requirement for a specific degree."
            - "This matters both for your own career credibility and for anyone evaluating who to hire."
