    sections:
      - id: rules
        nav: "Form &amp; method"
        eyebrow: "Core rules, lineages &amp; style frameworks"
        heading: "How Bharatanatyam is taught at Kalakshetra"
        parts:
          - p: "Kalakshetra was founded in <strong>1936 by Rukmini Devi Arundale</strong>; Parliament's <strong>Kalakshetra Foundation Act, 1994</strong> declared it an institution of national importance, and it is an autonomous body under the Ministry of Culture on a nearly 100-acre seaside campus in Chennai."
            source: "kala-prosp,kala-pratama"
          - list:
              - "<strong>Years 1–2</strong>: the <strong>adavus</strong> (basic units of movement), taught by Rukmini Devi's systematised method, with exercises and yoga to widen the range of movement."
              - "<strong>From year 2</strong>: items (repertoire pieces) are introduced step by step."
              - "<strong>From year 3</strong>: <strong>abhinaya</strong> (expressive) pieces."
              - "Graduates leave with a theory, music and language base to learn new items on their own."
            source: kala-prosp
          - table:
              caption: "Subjects in the Kalakshetra Diploma in Bharatanatyam"
              head: ["Group", "Subjects"]
              rows:
                - ["Main", "Bharatanatyam"]
                - ["Allied music", "Vocal music · Mridangam · <strong>Nattuvangam</strong> (conducting with cymbals and recited syllables)"]
                - ["Theory", "Theory of dance · History of dance · Heritage · Dissertation"]
                - ["Languages", "Tamil, Sanskrit, English"]
                - ["Body", "Yoga, Kalari, fitness"]
                - ["Final year", "Kutcheri (public recital)"]
            source: kala-prosp
          - table:
              caption: "The two halves every Doordarshan dance audition tests"
              head: ["Segment", "Minimum time", "Rule"]
              rows:
                - ["<strong>Abhinaya</strong> (expressive dance)", "7 min 30 s", "Recorded in a single take, no editing"]
                - ["<strong>Nritta</strong> (technical dance)", "7 min 30 s", "Black cyclorama / black background; live or pre-recorded music"]
            source: dd-dance
          - warn: "Bharatanatyam has several teaching lineages (banis). Margdarshan found no Sangeet Natak Akademi or Ministry of Culture file that defines or ranks them, so this page describes only Kalakshetra's own published method. Judge any guru by their training, their students' Doordarshan grades and Akademi recognition."
      - id: recognition
        nav: "Awards &amp; grades"
        eyebrow: "Institutional &amp; national recognition"
        heading: "The recognitions that count for a Bharatanatyam dancer"
        parts:
          - table:
              caption: "Sangeet Natak Akademi honours (Bharatanatyam is a named dance category)"
              head: ["Honour", "Who is considered", "What it carries"]
              rows:
                - ["<strong>Akademi Ratna</strong> (Fellow)", "Ordinarily <strong>age 50+</strong>; at most 40 living Fellows", "₹3 lakh, citation, angavastram, tamrapatra; medical cover up to ₹1.5 lakh a year"]
                - ["<strong>Akademi Puraskar</strong> (Award)", "Ordinarily <strong>age 35+</strong>; 12 awards a year in the dance field", "₹1 lakh, citation, angavastram, tamrapatra; medical cover up to ₹1 lakh a year"]
                - ["<strong>Ustad Bismillah Khan Yuva Puraskar</strong>", "<strong>Up to age 40</strong>; at most 33 a year, 8 of them in dance", "₹25,000 and a tamrapatra; invitation to perform at the Akademi's festival"]
            source: "sna-awards,sna-yuva"
          - p: "These honours are by nomination only — Yuva Puraskar names come from Akademi Fellows and awardees, General Council members, State Akademi chairpersons, State/UT culture secretaries, heads of university performing-arts departments and eminent experts."
            source: sna-yuva
          - table:
              caption: "Doordarshan dance grades (guidelines of 27 Feb 2025)"
              head: ["Grade", "Minimum age", "Who awards it", "Processing fee"]
              rows:
                - ["<strong>B</strong>", "18", "Local Dance Audition Committee at the Doordarshan Kendra", "₹2,000"]
                - ["<strong>B-High</strong>", "25", "Central Dance Audition Board, DG Doordarshan, New Delhi", "₹3,000 (B → B-High)"]
                - ["<strong>A</strong>", "35", "Central Dance Audition Board", "₹4,000 (B-High → A)"]
                - ["<strong>Top</strong>", "40", "Central Dance Audition Board", "₹5,000 (A → Top)"]
            source: dd-dance
          - list:
              - "Applications are invited <strong>1–30 April and/or 1–30 November</strong>, one application per dance form, with proof of age, guru/institution certificates and press reviews."
              - "Anyone not found suitable can <strong>reappear only after one year</strong>."
              - "Award winners, gharana/tradition stake-holders and renowned performers may seek <strong>exemption</strong> with a 15-minute recording (not older than 6 months) and a ₹10,000 fee."
            source: dd-dance
          - list:
              - "ICCR empanels artists <strong>aged 18 and above</strong>, with applications open <strong>all year</strong> and expert committees meeting annually."
              - "Its genre-wise list (updated 25 Nov 2025) opens with Bharatanatyam dancers and shows each one's <strong>current category — Outstanding, Established or Proficient</strong> — and the countries ICCR sent them to."
            source: "iccr-intro,iccr-list"
          - note: "ICCR does not publish what separates its three categories, and being empanelled is not a promise of a tour."
      - id: eligibility
        nav: "Ages &amp; scholarships"
        eyebrow: "Professional portfolios &amp; scholarship age benchmarks"
        heading: "Age limits for Kalakshetra and every scholarship"
        parts:
          - table:
              caption: "Kalakshetra (Rukmini Devi College of Fine Arts) admissions, 2026-27"
              head: ["Course", "Age", "Qualification", "Selection"]
              rows:
                - ["<strong>Diploma in Bharatanatyam</strong> (4 years, full-time)", "<strong>Maximum 25</strong> on 1 July 2026", "Higher Secondary pass (those writing it in April/May 2026 may apply)", "Interview → aptitude test → fitness-cum-medical test"]
                - ["<strong>Pratama</strong> (6 years, part-time)", "<strong>7 to 17</strong> on 1 July 2026", "School students", "Interaction with the child"]
            source: "kala-prosp,kala-pratama"
          - list:
              - "Diploma applications are online only, with a <strong>₹500</strong> fee; applicants bring a physical-fitness certificate from a registered medical practitioner, and dance applicants also undergo Kalakshetra's own medical examination."
              - "ICCR candidates living outside India send a video of their performance and are interviewed online."
              - "Pratama applications for 2026-27 closed on <strong>5 June 2026</strong>; seats are limited and the form stops accepting entries once a course fills."
            source: "kala-prosp,kala-pratama"
          - table:
              caption: "Central scholarships and fellowships open to dancers"
              head: ["Scheme", "Age", "Amount", "Term"]
              rows:
                - ["<strong>CCRT Cultural Talent Search Scholarship</strong>", "10–14", "₹3,600 a year + guru/institution tuition reimbursed up to ₹9,000 a year", "2 years at a time, renewable up to the first degree or age 20; 650 new awards a year"]
                - ["<strong>Scholarship to Young Artistes</strong>", "18–25, with at least 5 years under a guru or institution", "₹5,000 a month", "2 years; up to 400 a batch"]
                - ["<strong>Junior Fellowship</strong>", "25–40", "₹10,000 a month", "2 years, research project; 200 a batch"]
                - ["<strong>Senior Fellowship</strong>", "Above 40", "₹20,000 a month", "2 years; 200 a batch"]
            source: "ccrt-ctss,pib-sya,pib-ksvy"
          - warn: "BVA and BFA are visual / fine-arts degrees, not dance degrees. A Bharatanatyam dancer's routes are an institute diploma (such as Kalakshetra's) or a performing-arts degree (BPA / MPA) from a recognised university — check recognition before paying."
      - id: roadmap
        nav: "Guru to stage"
        eyebrow: "Grassroots-to-maestro residential pipeline"
        heading: "From the first adavu to a national stage"
        parts:
          - table:
              caption: "The Bharatanatyam ladder, step by step"
              head: ["Stage", "Typical age", "What happens", "Who pays"]
              rows:
                - ["<strong>Guru–shishya start</strong>", "From about 7", "A local guru, or Kalakshetra's Pratama course in Chennai (7–17)", "Family (Pratama ₹17,200 in year 1)"]
                - ["<strong>Talent scholarship</strong>", "10–14", "CCRT Cultural Talent Search Scholarship", "Govt: ₹3,600 a year + tuition up to ₹9,000"]
                - ["<strong>Full-time diploma</strong>", "After Class XII, up to 25", "Kalakshetra's 4-year diploma, residential (hostel)", "Family ₹26,800–30,000 a year + hostel; Top Class / CSR scholarships for some"]
                - ["<strong>First grade</strong>", "18 +", "Doordarshan B grade; Young-artiste scholarship (18–25)", "Govt ₹5,000 a month (scholars)"]
                - ["<strong>Early career</strong>", "25–40", "B-High (25+), ICCR empanelment, SNA Yuva Puraskar, Junior Fellowship", "Fees, fellowships, award money"]
                - ["<strong>Senior artiste / guru</strong>", "35 +", "A (35+) and Top (40+) grades; Akademi Puraskar (35+); a guru's Repertory grant", "Ministry of Culture, SNA"]
            source: "kala-pratama,kala-prosp,ccrt-ctss,dd-dance,pib-ksvy,sna-yuva,sna-awards"
          - p: "The Ministry of Culture's <strong>Repertory grant (Guru–Shishya Parampara)</strong> supports one guru and up to 18 shishyas: <strong>₹15,000 a month for the guru</strong> and <strong>₹2,000–10,000 a month per shishya</strong>, depending on age. The Sangeet Natak Akademi also runs its own 'Kala Deeksha' Guru Shishya Parampara programmes."
            source: "pib-ksvy,pib-kd"
      - id: academies
        nav: "Academies"
        eyebrow: "Top elite academies &amp; universities"
        heading: "Kalakshetra in detail — and where else to look"
        parts:
          - table:
              caption: "Kalakshetra fees, 2026-27"
              head: ["Course / year", "Fee for the year", "How it is paid"]
              rows:
                - ["Diploma in Bharatanatyam — 1st year", "<strong>₹30,000</strong>", "₹15,500 by 30 June (incl. ₹400 admission, ₹600 calendar &amp; book fee) + ₹14,500 by 31 October"]
                - ["Diploma — 2nd to 4th year", "<strong>₹26,800</strong>", "₹13,700 + ₹13,100"]
                - ["Pratama — 1st year", "<strong>₹17,200</strong>", "₹8,900 before classes (incl. ₹400 admission) + ₹8,300 by 31 October 2026"]
            source: "kala-prosp,kala-pratama"
          - list:
              - "Teacher–student ratio <strong>1 : 8</strong>; a library of over 10,000 books on dance and music."
              - "Vegetarian hostels — two for girls, one for boys — with two or three students to a room; boarding is paid in two instalments."
              - "The Ministry of Social Justice's <strong>Top Class Scholarship</strong> has been extended to the college, and a few CSR-funded scholarships go to very talented students whose families cannot pay."
              - "During the course students may <strong>not learn privately under another teacher</strong>, take tuition classes, or perform publicly without the institution's permission."
              - "75% attendance is needed to sit semester exams; mobile phones are not allowed in class."
            source: kala-prosp
          - p: "Pratama classes run twice a week, 4.30–5.30 pm, at the Thiruvanmiyur campus and (for Bharatanatyam) at Alwarpet in Chennai; a group with fewer than five students may be cancelled."
            source: kala-pratama
          - p: "Gandharva Mahavidyalaya, New Delhi lists Bharatanatyam among the dances it teaches, but its 2026 admission forms were open only for Odissi and Kathak."
            source: gmv-prosp
      - id: costs
        nav: "Costs"
        eyebrow: "Costume overheads &amp; who bears the cost"
        heading: "What Bharatanatyam training costs — and who pays"
        parts:
          - list:
              - "Kalakshetra students must <strong>equip themselves</strong> with textbooks, notebooks, <strong>practice costumes</strong> and musical instruments; practice costumes are of Kalakshetra's own design and must be followed strictly."
              - "Damage to an institution instrument is <strong>recovered at market price</strong>; Pratama parents pay too."
              - "Dress code on campus: girls in sarees or half-sarees, boys in pyjama or dhoti with kurta; expensive jewellery is discouraged."
            source: "kala-prosp,kala-pratama"
          - list:
              - "<strong>Ages 10–14</strong>: the CCRT scholarship reimburses actual tuition paid to the guru up to ₹9,000 a year."
              - "<strong>Ages 18–25</strong>: the young-artiste scholarship pays ₹5,000 a month for advanced training."
              - "<strong>Touring abroad</strong>: for a 'Festival of India' under the Global Engagement Scheme, the Government bears all expenditure on deputing the artist."
              - "<strong>Institutions</strong>: SNA grants-in-aid (₹30,000–₹1,00,000) do not pay for instruments or other capital items."
            source: "ccrt-ctss,pib-sya,pib-foi,sna-grants"
          - warn: "Stage costumes (often silk), temple jewellery, ankle bells and make-up are bought by the family, and no Government file publishes their prices — so Margdarshan prints none. Ask the guru for an itemised list, buy the institute's practice costume first, and order stage sets only when a performance or arangetram date is fixed."
