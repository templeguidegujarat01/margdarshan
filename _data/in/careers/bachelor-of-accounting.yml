  intro:
    - "When Indian students search \"Bachelor of Accounting,\" what they usually find is <strong>Bachelor of Accounting and Finance (BAF) — Bachelor of Accounting and Finance</strong>, a specialised 3-year degree offered at colleges like SRCC and Hindu College in Delhi, across University of Mumbai-affiliated colleges, at Gujarat University, and at many others nationally. It goes deeper and earlier into accounting, cost accounting, taxation and auditing than a general B.Com — making it one of the most direct routes into a Chartered Accountant (CA), Certified Public Accountant (CPA) or Association of Chartered Certified Accountants (ACCA) career. This guide explains exactly what BAF involves."
