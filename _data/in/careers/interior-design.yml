    eyebrow: "Common myths"
    heading: "Myths vs facts"
    parts:
      - myths:
          - myth: "Interior Designers just pick colours and furniture."
            fact: "The role involves technical space planning, budget management, vendor coordination, lighting design and understanding building codes — far more than aesthetic choices alone."
          - myth: "Interior Design and Architecture are basically the same career."
            fact: "They're genuinely distinct — Architecture is a licensed profession dealing with building structure and engineering, while Interior Design shapes the interior of existing spaces without the same licensing requirement."
          - myth: "You need an engineering background to study Interior Design."
            fact: "It's open to students from any Class 12 stream — it's a creative design discipline, not a core engineering one, though basic spatial reasoning genuinely helps."
