      - { label: "Deaflympics — hearing rule", url: "https://deaflympics.com/icsd/audiogram-regulations" }
    facts:
      - { label: "Paris 2024 Paralympics", value: "Around <strong>4,400 players</strong>, 549 events", source: ipc-paris }
      - { label: "India at Paris 2024", value: "<strong>29 medals</strong> — 7 gold (best ever)", source: pib-ye24 }
      - { label: "Paralympic gold cash award", value: "<strong>₹75 lakh</strong> — same as Olympic gold", source: myas-cash }
      - { label: "LA28 Paralympics", value: "<strong>23 sports</strong>, 15–27 Aug 2028", source: "ipc-la28,la28-para" }
    sections:
      - id: three
        nav: "Which event is for whom"
        eyebrow: "Three different events"
        heading: "Paralympics, Special Olympics and Deaflympics are not the same"
        parts:
          - table:
              caption: "Who each event is for"
              head: ["Event", "For players with", "Run by"]
              rows:
                - ["<strong>Paralympic Games</strong>", "A physical impairment, a vision impairment or an intellectual impairment that fits the sport's rules", "International Paralympic Committee (IPC); in India, the Paralympic Committee of India"]
                - ["<strong>Special Olympics</strong>", "An <strong>intellectual disability</strong> — year-round training and games for children and adults", "Special Olympics (founded 1968)"]
                - ["<strong>Deaflympics</strong>", "Hearing loss of <strong>at least 55 dB</strong> in the better ear", "International Committee of Sports for the Deaf (ICSD)"]
            source: "ipc-class,pib-ag26fs,so-faq,icsd-aud"
          - p: "The Paralympics began on <strong>29 July 1948</strong>, when Dr Ludwig Guttmann held the Stoke Mandeville Games for 16 injured servicemen and women in wheelchairs — in archery."
            source: pib-para24
      - id: paralympics
        nav: "Paralympics"
        eyebrow: "The Paralympic Games"
        heading: "How big the Paralympics are"
        parts:
          - table:
              caption: "Paris 2024 Paralympic Games"
              head: ["What", "Number"]
              rows:
                - ["Players", "Around <strong>4,400</strong> (a record)"]
                - ["Teams", "<strong>169</strong> — 168 national committees, a Refugee Paralympic Team and neutral athletes"]
                - ["Medal events", "<strong>549</strong> in 22 sports"]
                - ["Women", "<strong>1,983</strong> (45%), and 235 women's events"]
            source: ipc-paris
          - list:
              - "LA28 Paralympics: <strong>23 sports</strong> and <strong>560 medal events</strong>, from <strong>15 to 27 August 2028</strong>. <strong>Para climbing</strong> is new."
            source: "ipc-la28,la28-para"
          - list:
              - "The <strong>Asian Para Games 2026</strong> are on right now in Aichi-Nagoya, Japan (<strong>18–24 October 2026</strong>): around 3,000 players from 45 countries in 18 para sports. India won a record <strong>111 medals (29 gold)</strong> at the last edition in Hangzhou."
              - "At the <strong>Glasgow 2026 Commonwealth Games</strong>, six para sports were fully part of the programme."
            source: "pib-ag26fs,pib-cwg26"
      - id: classification
        nav: "Classification"
        eyebrow: "Fair groups"
        heading: "Classification — how players are put into fair groups"
        parts:
          - p: "Classification groups players whose impairment affects the sport in a similar way, so that <strong>skill and training</strong> decide the winner — not the impairment. It works like weight classes in judo or age groups in a marathon."
            source: ipc-class
          - table:
              caption: "The seven eligible impairments (IPC)"
              head: ["Type", "Simple meaning"]
              rows:
                - ["Impaired muscle power", "Muscles cannot push or pull with full force (for example after a spinal cord injury)"]
                - ["Impaired passive range of movement", "A joint cannot move through its full range"]
                - ["Limb deficiency or limb length difference", "Part or all of a limb is missing, or limbs are of different lengths"]
                - ["Short stature", "Shorter body length because the bones of the arms and legs are shorter"]
                - ["Coordination impairment", "Movements are hard to control smoothly"]
                - ["Vision impairment", "Reduced or no sight, even with the best glasses"]
                - ["Intellectual impairment", "Limits in thinking and understanding skills"]
            source: ipc-class
          - list:
              - "The impairment must be <strong>permanent</strong> and caused by a health condition. You will be asked for <strong>medical (diagnostic) papers</strong>."
              - "Each sport sets its own <strong>minimum impairment criteria</strong> — so you may be eligible in one sport and not in another."
              - "Trained <strong>classifiers</strong> test you, usually in the days before an international event. You can bring one support person, and each sport has a protest process if you disagree."
              - "<strong>First step:</strong> contact your National Paralympic Committee or the national federation of your sport."
            source: ipc-class
      - id: special
        nav: "Special Olympics"
        eyebrow: "Special Olympics"
        heading: "Special Olympics — for players with an intellectual disability"
        parts:
          - list:
              - "Special Olympics runs <strong>year-round sports training and competition</strong> for children and adults with intellectual disabilities in <strong>193 countries</strong>."
              - "About <strong>5.5 million athletes</strong> take part, helped by over <strong>1.1 million coaches and volunteers</strong>, in more than 30 Olympic-type sports."
            source: so-faq
          - p: "At the <strong>Special Olympics World Winter Games 2025</strong> in Turin, Italy, India won <strong>33 medals</strong> — 8 gold, 18 silver and 7 bronze."
            source: air-sowg
      - id: deaf
        nav: "Deaflympics"
        eyebrow: "Deaflympics"
        heading: "Deaflympics — for deaf players"
        parts:
          - list:
              - "To play, your hearing loss must be <strong>at least 55 dB</strong> (average in the better ear). Levels between 55 and 65 dB are checked carefully."
              - "<strong>Hearing aids and outer cochlear-implant parts are not allowed</strong> during warm-up and competition — using sound amplification would be an unfair advantage."
              - "A player who does not meet the 55 dB rule is declared ineligible and <strong>cannot send a new hearing test for two years</strong>."
            source: icsd-aud
          - p: "At the <strong>25th Summer Deaflympics</strong> in Tokyo (2025), India won a record <strong>20 medals</strong> — 9 gold, 7 silver, 4 bronze — and finished <strong>6th</strong>."
            source: air-deaf
      - id: support
        nav: "Money &amp; jobs"
        eyebrow: "Support, awards and jobs"
        heading: "The same respect — and the same money"
        parts:
          - table:
              caption: "Government cash award for a medal (₹ lakh)"
              head: ["Event", "Gold", "Silver", "Bronze"]
              rows:
                - ["Paralympic Games (Summer &amp; Winter)", "75", "50", "30"]
                - ["Para Asian Games", "30", "20", "10"]
                - ["Commonwealth Games (para events)", "30", "20", "10"]
                - ["Deaflympics", "20", "14", "8"]
                - ["Special Olympics World Games", "20", "14", "8"]
            source: myas-cash
          - list:
              - "India's Paralympic medals went from <strong>4 at Rio 2016</strong> to <strong>19 at Tokyo 2020</strong> and <strong>29 at Paris 2024</strong>."
              - "TOPS supports para athletes too: as of April 2026 it had <strong>52 Para Core athletes</strong>. The <strong>Khelo India Para Games</strong> began in 2023."
            source: pib-cwg26
          - list:
              - "For central government <strong>sports-quota jobs</strong>, the DoPT list of 65 sports includes <strong>para sports</strong> (those in the Paralympics and Para Asian Games) and <strong>deaf sports</strong>."
            source: dopt-2022
          - links:
              - { label: "Sports-quota jobs guide", url: "niche-careers/sports.html" }
              - { label: "TOPS, Khelo India and who pays", url: "sports-bodies.html" }
      - id: doubts
        nav: "Quick doubts"
        eyebrow: "Quick doubts"
        heading: "Straight answers"
        parts:
          - qa:
              q: "My child has an intellectual disability. Paralympics or Special Olympics?"
              a: "Both can be possible. <strong>Special Olympics</strong> is built for people with intellectual disabilities and runs year-round training. The <strong>Paralympics</strong> include intellectual impairment only in sports whose rules allow it, after classification — ask the national federation of the sport."
            source: "so-faq,ipc-class"
          - qa:
              q: "Can I wear my hearing aid at the Deaflympics?"
              a: "No. Hearing aids and outer cochlear-implant parts must come off before warm-up and stay off during competition."
            source: icsd-aud
