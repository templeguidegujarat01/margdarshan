      - overview:
          points:
            - "Library Science (formally, Library and Information Science) trains professionals to organise, catalogue, preserve and provide access to information, whether in a traditional library setting or increasingly, in digital archives, databases and knowledge management systems."
            - "Typically pursued as a 1-year <strong>B.Lib (Bachelor of Library Science)</strong> or <strong>B.LISc</strong> after completing any bachelor's degree, it covers cataloguing systems, information retrieval, digital library technologies and user services."
            - "It's offered at universities like <strong>Delhi University, Jamia Millia Islamia, and Banaras Hindu University</strong>, among many others, under the University Grants Commission (UGC) framework, typically as a postgraduate-adjacent professional qualification requiring a prior bachelor's degree."
