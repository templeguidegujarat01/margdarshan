  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Can I join B.Tech Electrical Engineering after this diploma?"
            a: "Yes. Diploma holders can use lateral entry to join the second year of a B.Tech Electrical Engineering programme directly, through a state lateral entry exam or quota, skipping the first year entirely."
          - q: "What is the difference between Electrical and Electronics diplomas?"
            a: "Diploma in Electrical Engineering focuses on power generation, transmission, distribution and heavy electrical machinery. Diploma in Electronics & Communication Engineering focuses on circuits, signal processing and communication systems — related fields with genuinely different focus areas and typical employers."
          - q: "Can diploma electrical engineers get a government job with the state electricity board?"
            a: "Yes, this is one of the most sought-after outcomes for diploma electrical engineers — state electricity boards and power distribution companies regularly recruit for technician and Junior Engineer posts through dedicated exams."
          - q: "Is a wireman/electrician license the same as this diploma?"
            a: "No. A wireman or electrician license is typically obtained through a shorter ITI course and a separate licensing exam, focused on practical wiring and installation work. This diploma is a broader, 3-year polytechnic qualification covering electrical systems more comprehensively, including design and technical planning aspects."
          - q: "What jobs can I get with just this diploma, without a further degree?"
            a: "Common roles include electrical technician, junior engineer, maintenance engineer, and substation/power plant operator, in both government electricity boards and private manufacturing, construction and infrastructure companies."
      - note: "*Fee and salary figures are indicative, based on publicly available information as of 2026, and vary significantly by state, institute and employer — always verify current figures on your state technical education board's official website."
