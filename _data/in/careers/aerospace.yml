  - id: "fees"
    hid: "fees-heading"
    eyebrow: "Wide range by institute type"
    heading: "Fees & scholarships"
    parts:
      - prose:
          - "Government-funded institutes remain the most economical route: total fees for the full 4-year Aerospace Engineering programme at IITs commonly fall in the <strong>₹2-10 lakh</strong> range, with fee waivers available based on family income and category. <strong>IIST Thiruvananthapuram</strong> is a distinctive case — its scholarship-cum-service bond scheme covers most fees in exchange for a service commitment to ISRO after graduation. Private colleges are considerably more expensive — total costs of roughly <strong>₹8-20 lakh</strong> are typical. Always confirm current fees and bond terms directly on your target institute's official admission page."
