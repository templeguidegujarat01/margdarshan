# USA Edition — source registry. Every figure in _data/us/*.yml points here by id.
# Pages render "Source: <name>" with the url and the date it was last checked.
# Only official / primary sources. accessed = date the page was read and the
# values copied (YYYY-MM-DD). When refreshing data, update `accessed` here and
# `last_verified` on the records you re-checked.

# BLS data vintage for every occupation record (Occupational Outlook Handbook,
# 2025–35 edition). Change these three lines when BLS publishes a new edition.
bls_vintage:
  wage_ref: "May 2025"
  wage_year: 2025
  projection_period: "2025–35"
  all_occupations_growth_pct: 3.5   # total U.S. employment growth, same period (EP news release)

