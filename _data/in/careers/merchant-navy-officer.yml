sections:
  - id: "quick"
    hid: "quick-heading"
    alt: true
    eyebrow: "Quick answers"
    heading: "Merchant Navy Deck Officer at a glance"
    intro: "Check whether your Class 12 background qualifies. Duration and pay are in the summary at the top of the page."
    parts:
      - subhead: "Can I apply from my stream?"
      - streams:
          - label: "Science"
            fit: "Eligible"
            tone: "y"
            icon: "science"
          - label: "Commerce"
            fit: "Not eligible"
            tone: "n"
            icon: "commerce"
          - label: "Arts / Humanities"
            fit: "Not eligible"
            tone: "n"
            icon: "arts"
      - note: "Physics, Chemistry and Mathematics at Class 12 are required, plus the English marks the institute asks for."
  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What does a Merchant Navy Deck Officer do?"
    parts:
      - overview:
          points:
            - "Deck officers keep navigational watches, plan voyages, handle cargo operations, maintain safety equipment and lead deck crew."
            - "The ladder is <strong>Deck Cadet → Third Officer → Second Officer → Chief Officer → Master</strong>, with each step needing sea time and a DG Shipping Certificate of Competency."
            - "Contracts usually mean several months at sea followed by leave at home."
  - id: "who"
    hid: "who-heading"
    alt: true
    eyebrow: "Fit check"
    heading: "Who should become a Merchant Navy Deck Officer"
    parts:
      - fit:
          match:
            - "Are physically fit, disciplined and comfortable with long months away from home."
            - "Enjoy navigation, weather, maths and leadership."
            - "Want tax-efficient pay and fast responsibility early in your career."
          mismatch:
            - "Get seasick easily or cannot handle isolation at sea."
            - "Want a regular home life every week."
            - "Cannot meet the eyesight and medical standards for sea service."
  - id: "eligibility"
    hid: "elig-heading"
    eyebrow: "Eligibility"
    heading: "What you need, stage by stage"
    parts:
      - elig_list:
          - "Class 12 with <strong>Physics, Chemistry and Mathematics — 60% PCM average</strong> — and at least <strong>50% in English</strong> in Class 10 or 12 (IMU rule for B.Sc Nautical Science)."
          - "A valid <strong>IMU CET</strong> rank for IMU and most DG Shipping-approved institutes."
          - "DNS route: Class 12 PCM (60%), or a B.Sc in a listed science subject, or a B.E./B.Tech, as the IMU notification lists."
          - "Age limit, unmarried status, passport and DG Shipping medical/eyesight standards apply — check the current IMU notice."
  - id: "roadmap"
    hid: "roadmap-heading"
    alt: true
    eyebrow: "Step-by-step"
    heading: "Your full path to becoming a Merchant Navy Deck Officer"
    parts:
      - steps:
          - title: "Class 12 PCM"
            text: "Keep PCM average above 60% and English above 50%."
          - title: "IMU CET"
            text: "Online entrance test; rank decides institute and course."
          - title: "Pre-sea training"
            text: "B.Sc Nautical Science (3 years) or DNS (1 year) at a DG Shipping-approved institute."
          - title: "Deck Cadet"
            text: "Onboard training with a training record book; the sea time required is set by DG Shipping."
          - title: "Second Mate CoC"
            text: "Post-sea courses and DG Shipping written and oral exams, then Third/Second Officer."
          - title: "Chief Mate and Master CoC"
            text: "More sea time and exams lead to Chief Officer and Master."
      - roadmap_card: "Merchant Navy Deck Officer"
  - id: "exams"
    hid: "exams-heading"
    eyebrow: "Exams & licences"
    heading: "IMU CET and DG Shipping certificates"
    parts:
      - chips:
          - label: "IMU CET"
            text: "The Indian Maritime University common entrance test for nautical and marine engineering programmes."
            source: "imu"
          - label: "Sponsorship"
            text: "Many cadets join through a shipping company sponsorship, which helps secure the onboard cadet berth."
          - label: "Certificates of Competency"
            text: "Second Mate, Chief Mate and Master certificates, each after sea time, post-sea courses and DG Shipping exams."
            source: "dgs"
          - label: "INDoS and CDC"
            text: "Seafarers register for an INDoS number and need a Continuous Discharge Certificate to sail."
            source: "dgs"
      - note_box: "Only train at institutes listed as approved on the DG Shipping website — unapproved courses do not count for certificates."
  - id: "salary"
    hid: "salary-heading"
    alt: true
    eyebrow: "Indicative figures"
    heading: "Merchant Navy Deck Officer pay in India"
    intro: "Private-sector pay varies a lot by employer and city; these are broad, commonly reported ranges, not guarantees."
    parts:
      - salary:
          - label: "Deck Cadet"
            value: "Stipend"
            text: "Cadets are paid a training stipend at sea."
          - label: "Junior officer"
            value: "Strong for the age"
            text: "Pay rises sharply once you hold a Certificate of Competency."
          - label: "Chief Officer / Master"
            value: "Very high"
            text: "Senior officers on foreign-going ships are among the highest earners of their age group."
  - id: "jobs"
    hid: "jobs-heading"
    eyebrow: "Where they work"
    heading: "Employers & growth path"
    parts:
      - chips:
          - label: "Employers"
            text: "Indian and foreign shipping companies, tanker, container and bulk carriers, ship-management firms"
          - label: "Growth path"
            text: "Deck Cadet → 3rd Officer → 2nd Officer → Chief Officer → Master"
          - label: "Ashore later"
            text: "Port operations, marine surveying, ship management, maritime training, DG Shipping roles"
  - id: "proscons"
    hid: "pc-heading"
    alt: true
    eyebrow: "Honest take"
    heading: "Advantages and disadvantages"
    parts:
      - proscons:
          pros:
            - "Early responsibility and high pay with certificates."
            - "Global career with time off between contracts."
            - "Clear, exam-based promotion ladder."
          cons:
            - "Months away from family; isolation at sea."
            - "Getting the first cadet berth can be hard without sponsorship."
            - "Strict medical and eyesight standards throughout."
  - hid: "myth-heading"
    eyebrow: "Common myths"
    heading: "Myths vs facts"
    parts:
      - myths:
          - myth: "Merchant Navy is the same as the Indian Navy."
            fact: "Merchant Navy is commercial shipping; the Indian Navy is the armed force."
          - myth: "Any maritime institute will do."
            fact: "Only DG Shipping-approved institutes lead to valid certificates."
  - hid: "related-heading"
    alt: true
    eyebrow: "Related careers"
    heading: "If you're considering Merchant Navy Deck Officer, also look at"
    parts:
      - related:
          - name: "Marine Engineer"
            sub: "Engine room officer"
            href: "marine-engineer.html"
          - name: "Merchant Navy hub"
            sub: "IMU CET & DG Shipping basics"
            href: "niche-careers/maritime.html"
          - name: "Commercial Pilot"
            sub: "DGCA CPL & airline flying"
            href: "commercial-pilot.html"
          - name: "NDA"
            sub: "Indian Navy officer entry"
            href: "nda.html"
  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "What marks do I need for B.Sc Nautical Science?"
            a: "IMU asks for Class 12 PCM with a 60% average and at least 50% in English in Class 10 or 12, plus a valid IMU CET rank."
          - q: "What is the difference between B.Sc Nautical Science and DNS?"
            a: "B.Sc is a 3-year degree; DNS is a 1-year diploma before going to sea as a cadet. Both are deck-officer routes."
          - q: "Is IMU CET compulsory?"
            a: "For IMU and most DG Shipping-approved institutes, yes. Check each institute's admission notice."
          - q: "How long to become a ship captain?"
            a: "Many years: Master needs a series of certificates, each after its own sea time."
      - note: "*Pay figures are indicative unless they quote an official pay level, and rules change: confirm eligibility, dates and fees on the official websites listed under Sources before you act."
        class: "table-note mt-lg"
