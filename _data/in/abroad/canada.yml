# Canada — study abroad sheet (shape: _data/in/abroad_common.yml header). Read 2026-10-29 from IRCC (canada.ca).
id: canada
name: Canada
short: Canada
region: "North America"
currency: CAD
checked: 2026-10-29
review_by: 2027-01-29
status: caution
eyebrow: "Study abroad · North America"
title: "Study in Canada from India"
seo_title: "Study in Canada from India: Permit, Funds, PAL and PGWP"
description: "Canada study permit from India: CAD 23,448 living funds from 1 Sep 2026, PAL/TAL caps, CAD 150 fee, 24 work hours a week and PGWP language and field rules."
lede: "Canada caps new study permits and has tightened work rules since 2024. A college or university offer is only the first step: most students also need a provincial attestation letter, proof of money, and a programme that keeps post-graduation work open."
alert:
  text: "The Student Direct Stream (SDS) closed on 8 November 2024. Indian students now apply in the regular stream; a GIC is still accepted as proof of money."
  source: sds_end
facts:
  - { label: "Study permit fee", value: "CAD 150 + CAD 85 biometrics", source: fees }
  - { label: "Living money (1 student)", value: "CAD 23,448 a year, from 1 Sep 2026", source: funds }
  - { label: "Work in term", value: "Up to 24 hours a week off campus", source: work }
  - { label: "After the course", value: "PGWP up to 3 years", source: pgwp_about }
card:
  line: "Colleges and universities, provincial caps, PGWP"
  psw: "PGWP up to 3 years"
  work: "24 h/week in term"
  funds: "CAD 23,448 a year + tuition"
tests:
  - { exam: ielts, need: "For the PGWP later: CLB 7 in all four skills (university degree) or CLB 5 (college); admission scores are set by each institution", source: pgwp_elig }
  - { exam: pte-academic, need: "PTE Core is IRCC's version for economic programmes; check what your institution accepts for admission", source: pgwp_elig }
  - { exam: toefl-ibt, need: "Accepted by many institutions for admission; check the programme page", source: pgwp_elig }
# Official course searches / institution lists (rendered under "Intakes & courses"). Read 2026-10-29.
find:
  - { label: "Designated learning institutions list", by: "IRCC (Government of Canada)", url: "https://www.canada.ca/en/immigration-refugees-citizenship/services/study-canada/study-permit/prepare/designated-learning-institutions-list.html", what: "For a study permit your school must be a designated learning institution (DLI). Search the official list by province and name." }
  - { label: "EduCanada", by: "Government of Canada", url: "https://www.educanada.ca/", what: "The Government of Canada site for international students: programmes, institutions and scholarships." }
pillars:
  language_and_eligibility:
    heading: "English for admission, and the language rule for the PGWP"
    parts:
      - points:
          - { t: "Admission scores are set by each designated learning institution (DLI). IRCC's own language rule bites later, at the Post-Graduation Work Permit (PGWP).", source: pgwp_elig }
          - { t: "For a PGWP, bachelor's, master's and doctoral graduates need CLB/NCLC 7 in all four skills; college, polytechnic and other non-university graduates need CLB/NCLC 5.", source: pgwp_elig }
          - { t: "So plan your English test score for the PGWP level from the start, not just for admission.", source: pgwp_elig }
  intakes_and_streams:
    heading: "Programme choice decides your work rights"
    parts:
      - points:
          - { t: "Non-degree college and polytechnic graduates must have studied in an eligible field of study for a PGWP if they applied for the study permit on or after 1 November 2024. Bachelor's, master's and doctoral graduates have no field rule.", source: pgwp_elig }
          - { t: "The programme must be at least 8 months long for a PGWP; a 9-month programme gives a PGWP of up to 9 months.", source: pgwp_about }
          - { t: "A master's of at least 8 months can give a 3-year PGWP (not certificate or diploma programmes).", source: pgwp_about }
          - { t: "Since 8 November 2024 you cannot change schools on the same study permit.", source: sp_account }
      - note: "Colleges often run January, May and September intakes; universities mostly start in September. Each institution publishes its own dates."
  tuition_and_living_costs:
    heading: "Money you must show and what fees cost"
    parts:
      - money:
          - { item: "Living expenses, 1 student (on or after 1 Sep 2026)", cur: CAD, amount: 23448, per: "year, plus tuition and travel", source: funds }
          - { item: "Living expenses, student + 1 family member", cur: CAD, amount: 29192, per: "year", source: funds }
          - { item: "Study permit fee", cur: CAD, amount: 150, per: "application", source: fees }
          - { item: "Biometrics", cur: CAD, amount: 85, per: "person", source: fees }
          - { item: "Work permit fee (e.g. PGWP)", cur: CAD, amount: 155, per: "application", source: fees }
          - { item: "Open work permit holder fee", cur: CAD, amount: 100, per: "application", source: fees }
      - points:
          - { t: "Accepted proof includes a Guaranteed Investment Certificate (GIC) from a Canadian bank, 6 months of bank statements, an education loan, paid tuition and housing receipts, or a scholarship letter.", source: funds }
          - { t: "If the programme is longer than one year, explain how you will pay for the whole programme.", source: funds }
          - { t: "Quebec sets its own amounts (published by the Quebec ministry) and needs a CAQ.", source: funds }
      - note: "Tuition is set by each institution; it is on your letter of acceptance."
  global_scholarships:
    heading: "Funding for Indian students in Canada"
    parts:
      - points:
          - { t: "Global Affairs Canada's scholarship list for international students lists short-term study and research awards for named regions (Latin America and the Caribbean, select countries in Asia, Europe, the Middle East and Africa, ASEAN) and development scholarships for select countries; check each programme's country list before planning around it.", source: educanada }
          - { t: "Global Affairs Canada scholarship recipients do not need a PAL/TAL.", source: pal }
      - note: "Most funding for Indian students comes from the university itself (entrance awards, graduate assistantships). Read the institution's own awards page."
  application_funnel:
    heading: "From offer to study permit"
    parts:
      - steps:
          - { title: "Pick a DLI and a PGWP-safe programme", text: "Check the field-of-study rule if it is a college diploma or certificate.", source: pgwp_elig }
          - { title: "Letter of acceptance and PAL/TAL", text: "The school gets you a provincial or territorial attestation letter. From 1 January 2026, master's and doctoral students at public DLIs are exempt.", source: pal }
          - { title: "Money proof", text: "CAD 23,448 a year for living (one person, from 1 Sep 2026) plus first-year tuition and travel.", source: funds }
          - { title: "Apply online", text: "Fee CAD 150 plus CAD 85 biometrics; give biometrics and a medical exam if asked.", source: fees }
          - { title: "Arrive and keep status", text: "You cannot change schools on the same permit; get a new permit if you switch.", source: sp_account }
  visa_chokepoints:
    heading: "The study permit in short"
    parts:
      - points:
          - { t: "Caps: for 2026 IRCC plans up to 408,000 study permits, including 155,000 for new arrivals. PAL/TAL-cohort allocations are split by province.", source: cap_2026 }
          - { t: "A PAL/TAL issued in 2026 is valid until 31 December 2026 and cannot be reused in a later cap year; you need a new one after a refusal or a change of school.", source: pal }
          - { t: "The Student Direct Stream ended on 8 November 2024; applications now go through the regular stream.", source: sds_end }
  post_study_work:
    heading: "Work during and after your course"
    parts:
      - points:
          - { t: "Off campus: up to 24 hours a week during regular terms; unlimited during scheduled breaks such as summer and winter holidays.", source: work }
          - { t: "You must be a full-time student at a DLI in a programme of at least 6 months leading to a degree, diploma or certificate, with work conditions printed on the permit and a SIN.", source: work }
          - { t: "PGWP: apply within 180 days of confirmation that you completed the programme. A 2-year or longer programme can give a PGWP of up to 3 years; you can get only one PGWP in your life.", source: pgwp_about }
          - { t: "The PGWP is issued only up to your passport's expiry date, so renew the passport early.", source: pgwp_about }
visa:
  slug: canada-study-permit
  name: "Canada study permit"
  short: "Study permit"
  seo_title: "Canada Study Permit from India: PAL, Funds, Fees, Steps"
  description: "Canada study permit after SDS: letter of acceptance, PAL/TAL, CAD 23,448 a year living funds, GIC and other proof, CAD 150 + 85 fees and 2026 cap rules."
  lede: "The study permit is decided on your acceptance letter, your PAL/TAL, and proof that you can pay. The regular stream is now the only stream for Indian applicants."
  facts:
    - { label: "Fee", value: "CAD 150 + CAD 85 biometrics", source: fees }
    - { label: "Living money", value: "CAD 23,448 / year (1 person)", source: funds }
    - { label: "PAL/TAL", value: "Needed by most; master's/PhD at public DLIs exempt from 2026", source: pal }
    - { label: "2026 cap", value: "408,000 permits (155,000 new arrivals)", source: cap_2026 }
  official:
    - { label: "IRCC — Study permit", url: "https://www.canada.ca/en/immigration-refugees-citizenship/services/study-canada/study-permit.html" }
    - { label: "Proof of financial support", url: "https://www.canada.ca/en/immigration-refugees-citizenship/services/study-canada/study-permit/get-documents/financial-support.html" }
  sections:
    - id: steps
      nav: Steps
      eyebrow: "Order of work"
      heading: "Step by step"
      parts:
        - steps:
            - { title: "Letter of acceptance from a DLI", text: "The school must be a designated learning institution.", source: pal }
            - { title: "PAL or TAL", text: "One per applicant, valid when you apply (not when you start). Exempt: master's and doctoral students at public DLIs from 1 January 2026, exchange students who pay no tuition, Global Affairs Canada scholars and a few others.", source: pal }
            - { title: "Proof of money", text: "Living expenses plus tuition and travel, with documents IRCC lists (GIC, statements, loan, paid fees).", source: funds }
            - { title: "Pay and apply online", text: "CAD 150 permit fee plus CAD 85 biometrics.", source: fees }
    - id: money
      nav: Money
      eyebrow: "Financial support"
      heading: "Living-expense amounts outside Quebec"
      parts:
        - table:
            caption: "Living expenses per year (excluding tuition and travel)"
            head: ["Family size", "Applying on or after 1 Sep 2026", "1 Jan 2025 to 31 Aug 2026"]
            rows:
              - ["1 (you alone)", "CAD 23,448", "CAD 22,895"]
              - ["2", "CAD 29,192", "CAD 28,502"]
              - ["3", "CAD 35,888", "CAD 35,040"]
              - ["4", "CAD 43,572", "CAD 42,543"]
              - ["Each extra person above 7", "CAD 6,318", "CAD 6,170"]
          source: funds
        - points:
            - { t: "Bank statements must cover the past 6 months, including the application month or the month before, and show where the money came from.", source: funds }
            - { t: "If a person gives you money, they write a letter with their job, relationship to you, dependants and the amount, plus ID.", source: funds }
            - { t: "If your country restricts foreign exchange, you must show you can transfer the money for all expenses.", source: funds }
    - id: chokepoints
      nav: "Common problems"
      eyebrow: "Where files go wrong"
      heading: "Choke points to check twice"
      parts:
        - points:
            - { t: "A PAL/TAL from a previous cap year, or an expired one: not accepted.", source: pal }
            - { t: "Funds without a clear source, or statements shorter than 6 months.", source: funds }
            - { t: "A college programme outside the PGWP fields list: the permit may be granted, but work after the course will not be.", source: pgwp_elig }
            - { t: "Changing school after arrival on the same permit: not allowed since 8 November 2024.", source: sp_account }
doubts:
  - { q: "Is SDS still open for Indian students?", a: "No. The Student Direct Stream closed on 8 November 2024. Indian students apply in the regular stream, which still accepts a GIC as proof of money.", source: sds_end }
  - { q: "How much money is needed for a Canada study permit in 2026?", a: "For one student applying on or after 1 September 2026, CAD 23,448 a year for living, plus tuition and travel. Quebec sets its own amounts.", source: funds }
  - { q: "Do master's students need a PAL for Canada?", a: "From 1 January 2026, students in degree-granting master's or doctoral programmes at a public designated learning institution do not need a PAL or TAL. Quebec still needs a CAQ.", source: pal }
  - { q: "How many hours can international students work in Canada?", a: "Up to 24 hours a week off campus during regular terms, and without a limit during scheduled breaks.", source: work }
  - { q: "Will every Canadian college course give a PGWP?", a: "No. Non-degree college programmes need an eligible field of study if you applied for the study permit on or after 1 November 2024, and the programme must last at least 8 months.", source: pgwp_elig }
  - { q: "What IELTS score is needed for a PGWP?", a: "The PGWP asks for CLB 7 in all four skills after a bachelor's, master's or doctorate, and CLB 5 after a college or other non-university programme.", source: pgwp_elig }
