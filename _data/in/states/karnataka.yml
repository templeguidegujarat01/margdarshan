  # ------------------------------------------------------------------ KCET (UGCET)
  - slug: kcet
    group: academic
    short: "KCET / UGCET (Engineering, Farm Science, Pharmacy)"
    body: "Karnataka Examinations Authority"
    card: "Karnataka's common entrance test for government-quota seats in B.E. / B.Tech, farm science, B.V.Sc, B.Sc Nursing, BNYS and B.Pharm / Pharm-D; one KEA application also covers NEET and NATA counselling."
    card_facts: ["4 papers · 60 marks each", "No negative marking", "Engg rank: 50% CET + 50% PUC"]
    eyebrow: "KEA · Undergraduate admissions"
    title: "KCET (UGCET) 2026 — Eligibility, Clauses, Exam Pattern, Rural &amp; Kannada Quotas, Fees"
    lede: "The Karnataka Common Entrance Test decides government-quota seats in Karnataka's professional colleges. This page follows KEA's UGCET-2026 Information Bulletin-1 (17 January 2026) and the provisional 2026-27 fee structure (10 July 2026)."
    facts:
      - { label: "Papers", value: "Physics, Chemistry, Maths, Biology — 60 marks each", source: kcet-ib }
      - { label: "Engineering rank", value: "PCM in CET and PUC, equal weight", source: kcet-ib }
      - { label: "Engineering minimum", value: "45% in PCM (40% reserved)", source: kcet-ib }
      - { label: "Govt college fee 2026-27", value: "₹47,100 (GM)", source: kcet-fee }
    official:
      - { label: "KEA UGCET-2026 page", url: "https://cetonline.karnataka.gov.in/kea/ugcet2026" }
      - { label: "Information Bulletin-1 (PDF)", url: "https://cetonline.karnataka.gov.in/keawebentry456/ugcet2026/information_bulletin_1_ugcet_2026_17012026english.pdf" }
      - { label: "Fee structure 2026-27 (PDF)", url: "https://cetonline.karnataka.gov.in/keawebentry456/ugcet2026/ugcet_2026_feesbreakupenglish.pdf" }
    sections:
      - id: overview
        nav: "Overview"
        eyebrow: "Overview &amp; official source"
        heading: "What KCET covers and the 2026 calendar"
        parts:
          - p: "KCET 2026 determined merit for the government share of seats in engineering, technology, architecture (on NATA), BNYS, B.Sc Nursing, B.V.Sc &amp; A.H., farm science courses (B.Sc Agriculture, Horticulture, Sericulture, Forestry and others), B.Pharm, Pharm-D and 2nd-year B.Pharm lateral entry, in government, university, aided and unaided colleges for 2026-27. Admissions follow the CET-2006 Admission Rules."
            source: kcet-ib
          - table:
              caption: "CET-2026 calendar"
              head: ["Event", "Date"]
              rows:
                - ["Registration and online application", "From 17 Jan 2026"]
                - ["Last date to apply / pay fee", "16 Feb 2026 / 18 Feb 2026"]
                - ["Kannada language test (Horanadu &amp; Gadinadu only)", "22 Apr 2026"]
                - ["CET — Physics and Chemistry", "23 Apr 2026"]
                - ["CET — Mathematics and Biology", "24 Apr 2026"]
            source: kcet-ib
          - table:
              caption: "Which CET papers to take"
              head: ["Course", "CET subjects"]
              rows:
                - ["Engineering / Technology", "PCM"]
                - ["Farm science courses", "PCMB"]
                - ["B.V.Sc &amp; A.H., BNYS, B.Sc Nursing", "PCB"]
                - ["B.Pharm, 2nd-year B.Pharm, Pharm-D", "PCM or PCB"]
                - ["Medical, dental, AYUSH", "NEET (register with KEA too)"]
                - ["Architecture", "NATA (register with KEA too)"]
                - ["BPT, B.Sc Allied Health, BPO, D.Pharm", "No exam — PU marks (register with KEA)"]
            source: kcet-ib
      - id: eligibility
        nav: "Eligibility &amp; Age"
        eyebrow: "Eligibility &amp; clauses"
        heading: "Academic eligibility and the 'Karnataka candidate' clauses"
        parts:
          - table:
              caption: "Academic eligibility (Rule 3 of the CET-2006 Admission Rules)"
              head: ["Course", "Qualifying exam requirement"]
              rows:
                - ["B.E. / B.Tech", "II PUC / Class 12 with English; Physics and Maths with Chemistry / Biotechnology / Biology / Electronics / Computer — 45% aggregate (40% for SC, ST, Cat-1, 2A, 2B, 3A, 3B)"]
                - ["Farm science", "II PUC / Class 12 with Physics, Chemistry, Maths and Biology"]
                - ["B.V.Sc &amp; A.H.", "50% in Physics, Chemistry, Biology and English (40% reserved)"]
                - ["B.Pharm", "PCB or PCM with 45% (40% reserved), or D.Pharm with 45%"]
                - ["B.Sc Nursing", "PCB and English passed, 45% in PCB (40% SC / ST / OBC)"]
            source: kcet-ib
          - list:
              - "<strong>Clause (a), the common route:</strong> studied in Karnataka for at least seven academic years between Class 1 and II PUC / Class 12, and passed SSLC / Class 10 or II PUC / Class 12 from Karnataka, with a study certificate countersigned by the BEO / DDPU."
              - "<strong>Clause (b):</strong> passed both I and II PUC (or Classes 11 and 12) in Karnataka and one parent studied in Karnataka for at least seven years."
              - "<strong>Reservation is for Karnataka candidates only:</strong> SC, ST, Category 1, 2A, 2B, 3A, 3B, rural and Kannada-medium benefits apply only to candidates eligible under clauses (a), (b), (f), (h), (j), (k), (l) and (o), not under (c), (d), (e), (g), (i), (m), (n) or (y)."
              - "Candidates from KSOU or from boards not on the VTU-notified list are not eligible; candidates awaiting results may apply."
            source: kcet-ib
          - note: "Horanadu and Gadinadu Kannadiga candidates must pass a 4th-standard-level Kannada test (12 of 50 marks) unless they studied ten years in Kannada medium outside Karnataka."
            source: kcet-ib
      - id: scheme
        nav: "Exam Scheme"
        eyebrow: "Exam scheme &amp; ranking"
        heading: "Four 60-mark papers, no negative marking"
        parts:
          - list:
              - "Four papers over two days — Physics and Chemistry on day 1, Mathematics and Biology on day 2 — each 60 one-mark MCQs in 80 minutes (10 minutes to fill OMR details, 70 to answer)."
              - "Syllabus: Karnataka I and II PUC syllabus of the Department of School Education (Pre-University)."
              - "No negative marking, but no marks for more than one answer."
              - "You keep a carbon replica of each OMR sheet; preserve it for a year after admission."
            source: kcet-ib
          - table:
              caption: "How ranks are made (Rule 4)"
              head: ["Course", "Merit basis"]
              rows:
                - ["Engineering / Technology", "PCM marks in CET and in the qualifying exam, equal proportions"]
                - ["Farm science", "PCMB in CET and qualifying exam, equal proportions"]
                - ["B.V.Sc &amp; A.H.", "PCB in CET"]
                - ["B.Pharm, Pharm-D", "PCM or PCB in CET, whichever is higher"]
                - ["Architecture", "NATA-2026 norms"]
            source: kcet-ib
          - note: "Agriculturist quota: a 200-mark practical test (50% minimum); merit = 25% PUC PCMB + 25% CET + 50% practical (B.V.Sc: 50% CET + 50% practical). Practical-test fee ₹500 (₹250 SC, ST, Cat-1)."
            source: kcet-ib
      - id: fees
        nav: "Fees"
        eyebrow: "Fee structure"
        heading: "Provisional 2026-27 engineering fees"
        parts:
          - table:
              caption: "Annual fee for government-quota engineering seats (KEA, 10 Jul 2026)"
              head: ["College type", "GM / 2A–3B", "SC / ST up to ₹10 lakh income", "Cat-1 up to ₹2.5 lakh"]
              rows:
                - ["Government colleges (most courses)", "₹47,100", "₹0", "₹22,950"]
                - ["Government — Mechanical, Textile, Silk Tech, Civil, Automobile", "₹29,985", "₹0", "₹17,910"]
                - ["UVCE", "₹56,500", "₹0", "₹22,900"]
                - ["VTU constituent colleges (lower limit)", "₹1,10,910", "₹0", "₹86,760"]
                - ["Type-1 unaided colleges", "₹1,20,320", "₹0", "₹96,170"]
                - ["Type-2 unaided colleges", "₹1,30,320", "₹0", "₹1,06,170"]
                - ["Private / deemed universities", "₹1,20,320", "₹0", "₹96,170"]
            source: kcet-fee
          - note: "Architecture costs ₹750 more. The bulletin itself does not print the CET application fee amount, so none is shown here — check the KEA application page."
            source: kcet-fee
          - list:
              - "<strong>SNQ (tuition fee waiver) quota:</strong> supernumerary engineering seats (not architecture) for meritorious students whose family income is below ₹8 lakh a year; the tuition fee is waived and only other fees are paid."
              - "<strong>SC / ST fee exemption:</strong> 100% exemption for family income up to ₹10 lakh."
            source: kcet-ib
      - id: reservation
        nav: "Reservation &amp; Certificates"
        eyebrow: "Reservation &amp; certificates"
        heading: "Category, rural, Kannada medium and Kalyana-Karnataka"
        parts:
          - table:
              caption: "Reservations under Rule 9 of the CET-2006 Admission Rules"
              head: ["Reservation", "Who qualifies", "Certificate"]
              rows:
                - ["SC, ST, Category 1, 2A, 2B, 3A, 3B", "Karnataka candidates; 2A–3B only if family income is below ₹8 lakh", "Tahsildar: Form D (SC / ST), Form E (Cat-1), Form F (2A–3B), with RD number"]
                - ["Rural (15%, horizontal)", "Class 1 to 10 in a non-urban area of Karnataka, parents not creamy layer", "Rural study certificate countersigned by the BEO; general merit also need a non-creamy-layer certificate"]
                - ["Kannada medium (5%, horizontal)", "Class 1 to 10 in Kannada medium", "Kannada-medium study certificate countersigned by the BEO"]
                - ["Kalyana-Karnataka (Article 371(J))", "Local candidates of Bidar, Kalaburagi, Yadgir, Raichur, Koppal, Ballari-Vijayanagara: 70% of seats in that region's institutions, 8% in state-wide ones", "Annexure-A from the Assistant Commissioner"]
            source: kcet-ib
          - note: "Special categories (NCC, sports, defence, ex-defence, CAPF, scouts &amp; guides, persons with disabilities) need separate certificates checked at KEA. Caste, income and Article 371(J) certificates must be in the candidate's own name, and category and income entered in the form cannot be changed later."
            source: kcet-ib
      - id: documents
        nav: "Documents"
        eyebrow: "Document checklist"
        heading: "What to keep ready"
        parts:
          - list:
              - "SSLC / Class 10 and II PUC / Class 12 marks cards."
              - "Study certificate for the clause claimed (for clause (a): seven years in Karnataka, countersigned by the BEO / DDPU)."
              - "RD numbers of caste, income, NCLC and Article 371(J) certificates — KEA checks them online through the Revenue Department."
              - "Rural and Kannada-medium study certificates for Class 1 to 10, if claimed."
              - "Your name must match the SSLC marks card exactly in every certificate."
            source: kcet-ib
      - id: pay
        nav: "Pay &amp; Salary"
        eyebrow: "Costs &amp; support"
        heading: "Education loans"
        parts:
          - p: "Students admitted through KEA to engineering, architecture, medical, dental, AYUSH, B.Sc (Agri), B.V.Sc and similar courses can take an education loan of up to ₹5 lakh at 6% interest from nationalised banks in the state."
            source: kcet-ib
      - id: posting
        nav: "After KCET"
        eyebrow: "After the test"
        heading: "Seat allotment"
        parts:
          - p: "Seats are allotted online round by round in order of CET / NEET / NATA rank against the government seat matrix; only candidates holding a verification slip can enter options. Surrendering or not reporting after a later round can forfeit the fee and attract a penalty of five times the annual course fee."
            source: kcet-ib
          - links:
              - { label: "Engineering colleges in Karnataka (verified list)", url: "colleges/karnataka/btech.html" }
              - { label: "B.Pharm colleges in Karnataka", url: "colleges/karnataka/bpharm.html" }
    sources:
      - { id: kcet-ib, name: "KEA — UGCET-2026 e-Information Bulletin-1 (17 Jan 2026, English)", url: "https://cetonline.karnataka.gov.in/keawebentry456/ugcet2026/information_bulletin_1_ugcet_2026_17012026english.pdf", covers: "calendar, courses, CET papers, Kannada test, eligibility clauses, academic eligibility, method of CET, ranking, reservation, fee exemption, SNQ, loans, documents", checked: 2026-10-14 }
      - { id: kcet-fee, name: "KEA — Provisional fee structure UGCET 2026-27, Engineering / Architecture (10 Jul 2026)", url: "https://cetonline.karnataka.gov.in/keawebentry456/ugcet2026/ugcet_2026_feesbreakupenglish.pdf", covers: "engineering fees by college type and category", checked: 2026-10-14 }

  # ------------------------------------------------------------------ PGCET
  - slug: pgcet
    group: academic
    short: "Karnataka PGCET (MBA, MCA, M.E. / M.Tech)"
    body: "Karnataka Examinations Authority"
    card: "KEA's entrance test for government-quota MBA, MCA and M.E. / M.Tech seats in Karnataka; M.Arch uses PGETA and GATE holders get priority for M.Tech."
    card_facts: ["100 questions · 100 marks · 2 h", "No negative marking", "50% in degree (45% reserved)"]
    eyebrow: "KEA · Postgraduate admissions"
    title: "Karnataka PGCET 2026 — MBA, MCA and M.Tech Eligibility, Exam Pattern and Counselling"
    lede: "The Post Graduate Common Entrance Test fills government seats in MBA, MCA and M.E. / M.Tech courses in Karnataka. This page follows KEA's PGCET-2026 Information Bulletin (26 March 2026)."
    facts:
      - { label: "Exam", value: "100 MCQs · 100 marks · 2 hours", source: pg-ib }
      - { label: "Degree marks", value: "50% aggregate (45% SC / ST / Cat-1)", source: pg-ib }
      - { label: "2026 dates", value: "M.Tech 23 May · MCA &amp; MBA 24 May", source: pg-ib }
      - { label: "Merit", value: "PGCET marks only", source: pg-ib }
    official:
      - { label: "KEA PGCET-2026 page", url: "https://cetonline.karnataka.gov.in/kea/pgcet2026" }
      - { label: "Information Bulletin (PDF)", url: "https://cetonline.karnataka.gov.in/keawebentry456/pgcet2026/PGCET_2026_Information_Bulletin26032026english.pdf" }
    sections:
      - id: overview
        nav: "Overview"
        eyebrow: "Overview &amp; official source"
        heading: "Courses and the 2026 calendar"
        parts:
          - p: "PGCET-2026 decided merit for full-time and part-time MBA, MCA and M.E. / M.Tech seats in government, university, aided and unaided institutions in Karnataka for 2026-27. Non-Karnataka candidates can take only MBA / MCA seats surrendered by managements."
            source: pg-ib
          - table:
              caption: "PGCET-2026 calendar"
              head: ["Event", "Date"]
              rows:
                - ["Notification", "20 Mar 2026"]
                - ["Online application", "23 Mar – 8 Apr 2026 (fee by 10 Apr)"]
                - ["M.E. / M.Tech test", "23 May 2026, 2.30–4.30 pm"]
                - ["MCA test", "24 May 2026, 10.30 am–12.30 pm"]
                - ["MBA test", "24 May 2026, 2.30–4.30 pm"]
            source: pg-ib
          - p: "Provisional PGCET 2026 results for MBA, MCA and M.Tech were linked on 19 August 2026, and first-round seat allotment followed in September 2026."
            source: pg-portal
      - id: eligibility
        nav: "Eligibility &amp; Age"
        eyebrow: "Eligibility"
        heading: "Who can apply"
        parts:
          - table:
              head: ["Course", "Eligibility"]
              rows:
                - ["MBA (full time)", "Recognised 3-year bachelor's degree with 50% aggregate in all subjects including languages (45% SC-A / SC-B / SC-C, ST, Cat-1)"]
                - ["MBA / M.Tech (part time)", "Same degree marks + 3 years' work after the degree by 31 Jul 2026, working within 40 km of the institution"]
                - ["MCA", "BCA / B.E. CSE or equivalent, or B.Sc / B.Com / B.A. with Maths at 10+2 or degree level (bridge courses as per university), 50% aggregate (45% reserved)"]
                - ["M.E. / M.Tech / M.Arch", "Valid GATE score, or the prescribed degree with 50% aggregate (45% reserved)"]
            source: pg-ib
          - list:
              - "Rounding off the aggregate is not allowed; the aggregate counts all subjects of all years / semesters."
              - "Final-year students may apply."
              - "There is no lateral entry to MCA."
              - "The M.E. / M.Tech test is held only in Civil, Computer Science, Mechanical Sciences and Electrical Sciences; Biotechnology, Chemical, Environmental, Polymer Science and Textile Technology admit on degree marks."
            source: pg-ib
      - id: scheme
        nav: "Exam Scheme"
        eyebrow: "Exam scheme"
        heading: "One 100-mark OMR paper"
        parts:
          - list:
              - "Each test: 100 objective questions, 100 marks, 2 hours, OMR sheet."
              - "Non-programmable calculators are allowed only in the M.E. / M.Tech test."
              - "No negative marking; more than one answer gets no marks."
              - "Merit lists are made separately for MBA, MCA and M.E. / M.Tech / M.Arch on PGCET marks alone; degree marks only decide eligibility."
              - "M.Arch needs PGETA-2026 of the Council of Architecture plus KEA registration."
            source: pg-ib
      - id: fees
        nav: "Fees"
        eyebrow: "Fees"
        heading: "Fee exemption for reserved categories"
        parts:
          - table:
              head: ["Candidate", "Fee rule"]
              rows:
                - ["SC / ST, income below ₹2.5 lakh", "100% exempt in government seats, and up to the government-college fee in private seats"]
                - ["SC / ST, income ₹2.5–10 lakh", "50% exempt"]
                - ["Category-1, income below ₹2.5 lakh", "Exempt in government colleges; in private colleges pay the balance over the government-college fee"]
            source: pg-ib
          - note: "The bulletin we read does not print the PGCET registration fee amount, so none is shown here."
      - id: reservation
        nav: "Reservation &amp; Certificates"
        eyebrow: "Reservation &amp; certificates"
        heading: "SC internal reservation and Karnataka-only benefits"
        parts:
          - list:
              - "From 2026 the bulletin applies internal reservation for Scheduled Castes in three groups — SC-A, SC-B and SC-C — following the government order of 25 August 2025."
              - "SC-A / SC-B / SC-C, ST and Category-I benefits apply only to Karnataka-origin candidates claiming government seats under the eligibility clauses."
              - "2A, 2B, 3A and 3B reservation needs parents' gross annual income below ₹8 lakh (spouse's income included if married)."
              - "Caste, income and Article 371(J) certificates are verified online through their RD numbers."
            source: pg-ib
      - id: documents
        nav: "Documents"
        eyebrow: "Document checklist"
        heading: "What to keep ready"
        parts:
          - list:
              - "Study certificates from the institutions where SSLC, PUC and the degree were passed."
              - "Degree marks cards for all years / semesters (CGPA holders must check the converted percentage)."
              - "GATE scorecard (M.Tech) or PGETA result (M.Arch), if applicable."
              - "Employer NOC and experience proof for part-time courses."
              - "RD numbers of caste and income certificates; name exactly as on the SSLC marks card."
            source: pg-ib
      - id: pay
        nav: "Pay &amp; Salary"
        eyebrow: "Costs"
        heading: "Course fees"
        parts:
          - note: "Course fees are notified each year by the government with the seat matrix; the PGCET bulletin gives only the fee-exemption rules above."
      - id: posting
        nav: "After PGCET"
        eyebrow: "After the test"
        heading: "Counselling"
        parts:
          - p: "KEA publishes the answer key for objections, then rank lists; eligible candidates verify documents and enter options for online seat allotment. A candidate who surrenders a first-round seat before second-round option entry gets the fee back minus ₹5,000; surrendering after the second round forfeits the entire fee."
            source: pg-ib
    sources:
      - { id: pg-ib, name: "KEA — PGCET-2026 Information Bulletin, MBA / MCA / M.E. / M.Tech / M.Arch (26 Mar 2026, English)", url: "https://cetonline.karnataka.gov.in/keawebentry456/pgcet2026/PGCET_2026_Information_Bulletin26032026english.pdf", covers: "calendar, courses, eligibility, test pattern, merit, SC internal reservation, fee exemption, documents, counselling", checked: 2026-10-14 }
      - { id: pg-portal, name: "KEA — PGCET-2026 page (result and seat allotment notices)", url: "https://cetonline.karnataka.gov.in/kea/pgcet2026", covers: "provisional result link of 19 Aug 2026 and first-round schedule", checked: 2026-10-14 }

