# North Dakota (USA 50-state licensure portal, 2026-10-22). Schema: _data/us/state_index.yml. Boards tier: the
# licensing boards for lawyers, physicians, CPAs and nurses, copied from the national directories of state boards (NCBE,
# FSMB, NASBA, NCSBN). Diploma, state test, tuition, aid, jobs and apprenticeship blocks are still in the Phase 11 queue;
# the page prints only the blocks that exist.
name: "North Dakota"
abbr: ND
checked: 2026-10-22
review_by: 2027-04-22
lede: "In North Dakota, the North Dakota State Board of Law Examiners handles bar admission for lawyers, the North Dakota Board of Medicine licenses physicians, the North Dakota State Board of Accountancy licenses CPAs and the North Dakota Board of Nursing licenses registered nurses."

boards:
  # 50-state portal (2026-10-22): bar admission agency (NCBE jurisdiction page), medical board(s) (FSMB directory),
  # board of accountancy (NASBA directory), board of nursing (NCSBN member page). Links checked 2026-10-22.
  law: { body: "North Dakota State Board of Law Examiners", url: "https://www.ndcourts.gov/supreme-court/committees/board-of-law-examiners", stat: "UBE", exam: "Uniform Bar Exam (MBE, MEE and MPT).", note: "MPRE required (passing score 85). NextGen UBE from July 2027.", src: ncbe_nd }
  medicine:
    src: fsmb_boards
    boards:
      - { body: "North Dakota Board of Medicine", url: "http://www.ndbom.org/" }
  cpa:
    src: nasba_boards
    boards:
      - { body: "North Dakota State Board of Accountancy", url: "https://www.ndsba.nd.gov/" }
  nursing:
    src: ncsbn_nd
    boards:
      - { body: "North Dakota Board of Nursing", url: "https://www.ndbon.org/" }
