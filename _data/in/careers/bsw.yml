  - id: "faq"
    hid: "faq-heading"
    alt: true
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Is BSW the same as BA Sociology?"
            a: "No. BA Sociology is a theory-driven degree studying how societies and institutions function. BSW is a more applied, practice-based degree centred on fieldwork, case work and directly intervening to help individuals, families and communities — with mandatory supervised fieldwork built into the coursework."
          - q: "Is fieldwork really compulsory in BSW?"
            a: "Yes, and it's one of the degree's defining features. Students complete supervised placements at NGOs, hospitals, schools or community organisations throughout the programme, gaining hands-on experience working directly with people facing real social challenges, not just classroom theory."
          - q: "What jobs can I get with a BSW degree?"
            a: "Graduates commonly work as NGO programme officers, community development workers, medical/psychiatric social workers in hospitals, child welfare officers, and corporate CSR (Corporate Social Responsibility) coordinators. Specialised clinical or senior roles often benefit from a follow-on MSW (Master of Social Work)."
          - q: "Is the pay in the development/NGO sector genuinely low?"
            a: "Entry-level NGO and development-sector pay is often more modest than corporate roles, reflecting the sector's funding realities, though it varies by organisation size and funding source. Corporate CSR roles and larger, well-funded international NGOs tend to pay more competitively than smaller grassroots organisations."
          - q: "Should I do BSW or an MSW directly after a different bachelor's degree?"
            a: "If you're certain about a social work career right after Class 12, BSW gives you a full, fieldwork-integrated foundation over 3 years. If you decide on social work later, after completing a different bachelor's degree, an MSW (Master of Social Work) is the standard entry route instead, without needing a BSW first."
      - note: "*Fee and salary figures are indicative, based on publicly available information as of 2026, and vary significantly by institution and organisation — always verify current figures on the official college or university website."
        class: "table-note mt-lg"
