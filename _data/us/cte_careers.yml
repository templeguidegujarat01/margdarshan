          - { tag: "Find a program", title: "A Registered Apprenticeship", text: "Validated by the U.S. Department of Labor or a State Apprenticeship Agency.", kind: stage, source: dol_rap }
          - { tag: "3–4 years", title: "Operating Engineer (RAPIDS 0365)", text: "Time-based term: <strong>6,000 hours</strong> (hybrid 4,000–6,000). Apprentices learn operating procedures, safety, first aid, grading plans and GPS.", kind: stage, source: dol_occupations }
          - { tag: "Goal", title: "Journey worker", text: "Performs tasks with less guidance.", kind: goal, source: ooh_equipops }
      - id: onthejob
        title: "On the job, or vocational school first"
        tag: "Common"
        who: "Many workers start on light equipment, such as a trench roller, under an experienced operator, then move to heavier machines such as bulldozers."
        steps:
          - { tag: "Start", title: "High school diploma or equivalent", text: "", kind: start, source: ooh_equipops }
          - { tag: "Optional", title: "Vocational school", text: "Schools may specialize in a brand or type of equipment; some use simulators.", kind: stage, source: ooh_equipops }
          - { tag: "Often required", title: "Commercial driver's license (CDL)", text: "To haul equipment to jobsites; state CDL laws vary.", kind: licence, source: ooh_equipops }
          - { tag: "Goal", title: "Construction equipment operator", text: "", kind: goal, source: ooh_qf_equipops }
    certs:
      - { name: "Crane operator certification (federal)", who: "OSHA 29 CFR 1926.1427 · cranes in construction", text: "The employer must ensure each crane operator is trained, certified or licensed, and evaluated before operating. Routes: an accredited testing organization (valid 5 years), an audited employer program, U.S. military qualification, or a state or local license.", source: osha_1926_1427 }
    states_note: "A few states license operators of backhoes, loaders and bulldozers, and some states and cities require pile driver operators to hold a crane license. One state's rule, from its own page:"
    states:
      - { place: "Massachusetts", body: "Office of Public Safety and Inspections (OPSI)", rule: "Anyone operating hoisting equipment needs a <strong>Hoisting Engineer License</strong>: at least 18, an application ($75 per restriction), a medical certificate and an exam on the machinery, safety, hand signals and inspection. Apprentice licenses also need a Division of Apprentice Standards ID. Renew every 2 years.", sources: [ma_hoisting] }
    tools:
      - { text: "Operators often do basic maintenance on their equipment, so they should know hand and power tools; some machines have computerized controls and GPS.", source: ooh_equipops }

  - slug: elevator-installer
    home_trade: "Elevator and escalator installer"
    title: "Elevator installer: 4-year apprenticeship, then a state license"
    short: "Elevator and escalator installer"
    does: { text: "Elevator and escalator installers and repairers install, maintain, and fix elevators, escalators, moving walkways, and other lifts.", source: ooh_qf_elevator }
    eyebrow: "USA · Trades & CTE · Construction"
    lede: "Nearly all elevator installers learn through a <strong>4-year apprenticeship</strong> after a high school diploma, and <strong>most states</strong> require them to be licensed."
    for: "Mechanically minded students who like electronics and physics and don't mind heights or tight spaces."
    checked: 2026-10-21
    review_by: 2027-04-21
    metrics: { pay: 109910, pay_hour: "52.84", jobs: 24700, outlook: 6, outlook_words: "Faster than average", change: 1400, entry: "High school diploma or equivalent", training: "Apprenticeship", source: ooh_qf_elevator }
    routes:
      - id: apprenticeship
        title: "Registered Apprenticeship, then the state license"
        tag: "Nearly all"
        who: "Programs are sponsored by a union, an industry association or an employer. Workers with documented experience may qualify for a shorter apprenticeship."
        steps:
          - { tag: "Start", title: "High school diploma or equivalent", text: "Math, mechanical drawing and physics classes may help.", kind: start, source: ooh_elevator }
          - { tag: "Find a program", title: "A Registered Apprenticeship", text: "Validated by the U.S. Department of Labor or a State Apprenticeship Agency.", kind: stage, source: dol_rap }
          - { tag: "4 years", title: "Elevator Constructor (RAPIDS 0173)", text: "Time-based term: <strong>8,000 hours</strong> (a newer version 6,800). Safety, blueprints, math, applied physics, electrical and digital theory, electronics.", kind: stage, source: dol_occupations }
          - { tag: "License", title: "State license or certification", text: "Most states require it (examples below).", kind: licence, source: ooh_elevator }
          - { tag: "Goal", title: "Elevator mechanic", text: "Later: mechanic-in-charge, adjuster or supervisor.", kind: goal, source: ooh_elevator }
        facts:
          - { k: "Apprentice pay", v: "Usually about 50 percent of what fully trained installers make, rising as they progress.", source: ooh_elevator }
          - { k: "Keep learning", v: "Ongoing training is needed to keep up with technology.", source: ooh_elevator }
    certs:
      - { name: "Industry certification", who: "Optional", text: "Not required, but certification shows competence and proficiency.", source: ooh_elevator }
    states_note: "Most states license elevator mechanics, each in its own way. Three examples from the state's own pages:"
    states:
      - { place: "California", body: "Department of Industrial Relations, Cal/OSHA Elevator Unit", rule: "Anyone employed by a C-11 licensed elevator company who works <strong>without direct supervision</strong> must be a Certified Competent Conveyance Mechanic (CCCM). Continuing education must come from a Division-approved provider within 12 months before renewal.", sources: [ca_dir_elevator] }
      - { place: "Washington", body: "Department of Labor & Industries (L&I)", rule: "General (Category 01) license: typically <strong>3 years</strong> of verified conveyance work plus education, and either a registered apprenticeship, the NEIEP (or equivalent) exam, or the state exam (open book, 160 questions, 80% to pass, $296.50).", sources: [wa_lni_elevator] }
      - { place: "Florida", body: "Division of Hotels and Restaurants (Fla. Stat. s. 399.01)", rule: "<strong>Elevator certificate of competency</strong>: 4 years of work experience on conveyances plus a state-approved written exam, a registered elevator apprenticeship, or a substantially equal license from another state. $50, valid 1 year, 8 hours of continuing education to renew.", sources: [fl_399_01] }
    tools:
      - { text: "Installers use power tools and hand tools and may lift parts weighing up to 200 pounds.", source: ooh_elevator }

  - slug: industrial-maintenance-mechanic
    home_trade: "Industrial machinery mechanic and millwright"
    title: "Industrial maintenance mechanic: diploma, a year of training or an apprenticeship"
    short: "Industrial machinery mechanic"
    does: { text: "Industrial machinery mechanics, machinery maintenance workers, and millwrights install, maintain, and repair factory equipment and other industrial machinery.", source: ooh_qf_indmech }
    eyebrow: "USA · Trades & CTE · Advanced Manufacturing"
    lede: "Industrial machinery mechanics typically need a <strong>high school diploma</strong> and usually <strong>a year or more</strong> of training; millwrights mostly go through an apprenticeship of about <strong>4 years</strong>. Some take a 2-year associate degree in industrial maintenance. BLS names no license for this work."
    for: "Problem-solvers who like fixing machines, reading manuals and working with welding, hydraulics and electronics."
    checked: 2026-10-21
    review_by: 2027-04-21
    metrics: { pay: 64100, pay_hour: "30.82", jobs: 547300, outlook: 14, outlook_words: "Much faster than average", change: 78900, entry: "High school diploma or equivalent", training: "A year or more on the job (mechanics); about 4-year apprenticeship (millwrights)", source: ooh_qf_indmech }
    routes:
      - id: onthejob
        title: "Diploma, then a year or more of training"
        tag: "Mechanics"
        who: "Training may be given by trainers the employer hires or by equipment manufacturers' representatives."
        steps:
          - { tag: "Start", title: "High school diploma or equivalent", text: "", kind: start, source: ooh_indmech }
          - { tag: "Optional", title: "Associate degree in industrial maintenance", text: "About 2 years: welding, mathematics, hydraulics and pneumatics.", kind: stage, source: ooh_indmech }
          - { tag: "1+ year", title: "On-the-job training", text: "Setting up, cleaning, lubricating and starting machinery; shop math, blueprints, welding, electronics and computer programming.", kind: stage, source: ooh_indmech }
          - { tag: "Goal", title: "Industrial machinery mechanic", text: "", kind: goal, source: ooh_qf_indmech }
      - id: apprenticeship
        title: "Registered Apprenticeship"
        tag: "Millwrights, and some mechanics"
        who: "Employers, local unions, contractor associations and the state labor department sponsor programs. Basic qualifications: at least 18, a high school diploma, physically able to do the work."
        steps:
          - { tag: "Start", title: "Age 18 + high school diploma", text: "", kind: start, source: ooh_indmech }
          - { tag: "Find a program", title: "A Registered Apprenticeship", text: "Validated by the U.S. Department of Labor or a State Apprenticeship Agency.", kind: stage, source: dol_rap }
          - { tag: "3–4 years", title: "Millwright (RAPIDS 0335) or Industrial Maintenance Mechanic (RAPIDS 0308)", text: "Millwright: time-based <strong>8,000 hours</strong> (newer version 7,328). Industrial Maintenance Mechanic: 6,000 hours (time-based).", kind: stage, source: dol_occupations }
          - { tag: "Each year", title: "144 hours of instruction + up to 2,000 hours paid", text: "", kind: stage, source: ooh_indmech }
          - { tag: "Goal", title: "Millwright", text: "Fully qualified; can usually work with less guidance.", kind: goal, source: ooh_indmech }
    states_note: "BLS names no state license for industrial machinery mechanics or millwrights; requirements come from the employer and the apprenticeship."
    states_source: ooh_indmech
    tools:
      - { text: "Workers use technical manuals and sophisticated diagnostic equipment to figure out why machines are not working.", source: ooh_indmech }
      - { text: "They must follow safety precautions and use protective equipment, such as hardhats, safety glasses and hearing protectors.", source: ooh_qf_indmech }
