  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What is Nursing?"
    parts:
      - overview:
          points:
            - "Nursing is a healthcare profession providing direct, continuous patient care — medication administration, monitoring, wound care, patient education, and supporting doctors and treatment plans."
            - "It's regulated in India by the <strong>Indian Nursing Council (INC)</strong>, a long-established national body — unlike some newer allied-health fields, nursing's regulatory framework is mature and well-defined."
            - "The field's demand story is genuinely backed by hard numbers: the <strong>WHO projects a global nursing shortage of 45-60 lakh professionals by 2030</strong>, and countries including the UK, Canada, Australia, Germany, New Zealand and the UAE are actively recruiting internationally to fill that gap."
          more:
            - "This creates a real, well-documented pathway to significantly higher pay abroad — but reaching it requires additional licensing steps beyond the Indian degree itself."
  - id: "who"
    hid: "who-heading"
    alt: true
    eyebrow: "Fit check"
    heading: "Who should choose Nursing"
    parts:
      - fit:
          match:
            - "Genuinely enjoy direct, hands-on patient care and can handle emotionally and physically demanding work."
            - "Want one of the clearest, most well-documented global mobility paths of any Indian healthcare degree."
            - "Are comfortable investing in additional licensing exams (NCLEX, Computer-Based Test (CBT), IELTS) if targeting international roles."
          mismatch:
            - "Want to skip the additional international licensing steps and still expect abroad-level pay while working in India — India salaries are meaningfully more modest."
            - "Dislike shift work, night duty, or emotionally taxing patient-care situations."
            - "Are considering a non-INC-approved college — this can block government jobs, Postgraduate (PG) nursing admission, and international licensing entirely."
  - id: "eligibility"
    hid: "elig-heading"
    eyebrow: "Eligibility"
    heading: "Who can apply for Nursing"
    parts:
      - elig_list:
          - "Class 12 pass with <strong>Physics, Chemistry, Biology and English</strong>, with a minimum aggregate of 45% for General/EWS (40% for SC/ST/OBC/PwD)."
          - "Minimum age is generally <strong>17 years</strong> as of 31 December of the admission year, with no upper age limit."
          - "<strong>National Eligibility cum Entrance Test – Undergraduate (NEET-UG)</strong> is required for AIIMS and most government nursing colleges; many state and private colleges instead run their own entrance exams — verify your target college's specific requirement."
