# FSMB, NASBA, NCSBN). Diploma, state test, tuition, aid, jobs and apprenticeship blocks are still in the Phase 11 queue;
# the page prints only the blocks that exist.
name: "South Carolina"
abbr: SC
checked: 2026-10-22
review_by: 2027-04-22
lede: "In South Carolina, the South Carolina Supreme Court, Board of Law Examiners handles bar admission for lawyers, the South Carolina Board of Medical Examiners licenses physicians, the South Carolina Board of Accountancy licenses CPAs and the South Carolina Board of Nursing licenses registered nurses."

boards:
  # 50-state portal (2026-10-22): bar admission agency (NCBE jurisdiction page), medical board(s) (FSMB directory),
