  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Can I join B.Tech Civil Engineering after this diploma?"
            a: "Yes. Diploma holders can use lateral entry to join the second year of a B.Tech Civil Engineering programme directly, through a state lateral entry exam or quota, skipping the first year entirely."
          - q: "Can diploma civil engineers work as site supervisors on construction projects?"
            a: "Yes, this is one of the most common roles for diploma civil engineers — supervising day-to-day construction activity, coordinating with contractors and workers, and ensuring work follows approved plans, typically under a senior engineer's overall direction."
          - q: "What government job opportunities exist after this diploma?"
            a: "Diploma civil engineers can apply for JE posts in state Public Works Departments (PWD), municipal corporations, irrigation departments, railways, and through the SSC JE exam — these are commonly pursued, stable government routes."
          - q: "Is surveying an important part of this diploma?"
            a: "Yes. Surveying — measuring and mapping land using instruments and increasingly, digital tools like total stations and GPS — is a core, practical skill taught throughout the diploma, essential for construction planning and site work."
          - q: "What jobs can I get with just this diploma, without a further degree?"
            a: "Common roles include site supervisor, junior engineer, surveyor, quantity estimator and quality control technician at construction companies, government PWDs and infrastructure firms — genuine, established career options without needing to complete a B.Tech."
      - note: "*Fee and salary figures are indicative, based on publicly available information as of 2026, and vary significantly by state, institute and employer — always verify current figures on your state technical education board's official website."
