hero:
  eyebrow: "Science (PCM) · Licensed Profession"
  title: "Architect (B.Arch) — Licensed by the Council of Architecture"
  meta:
    - "Registered with the Council of Architecture"
    - "Class 12 with Physics & Maths"
  read_time: "8 min read"
  intro:
    - "Architects design buildings and spaces that are safe, useful and beautiful — and in India only people registered with the Council of Architecture (CoA) may call themselves “architect”, under the Architects Act, 1972. The route is a 5-year Bachelor of Architecture (B.Arch) at a CoA-approved college, entered through NATA (run by CoA) or JEE Main Paper 2 (run by NTA)."
