  - id: "admission"
    hid: "admission-heading"
    alt: true
    eyebrow: "Mostly CUET-based, competitive"
    heading: "Admission process"
    parts:
      - chips:
          - label: "Delhi University & most central universities"
            text: "Admission is entirely through CUET (UG) scores, submitted via the DU CSAS portal — English Honours is typically among the higher-cutoff BA subjects."
          - label: "Subject combination"
            text: "DU requires one Language (List A) plus three other domain subjects from the CUET list; the English domain paper itself carries significant weight for this course."
          - label: "State & private universities"
            text: "Many admit on Class 12 merit directly, or run their own entrance test and interview — check your target university's specific process."
          - label: "Typical process"
            text: "Register for CUET → appear for the exam → fill CSAS/university college preferences → seat allotment → document verification and fee payment."
  - id: "fees"
    hid: "fees-heading"
    eyebrow: "Very affordable at government colleges"
    heading: "Fees & scholarships"
    parts:
      - prose:
          - "BA English is one of the most affordable degrees in India at government-funded colleges — total fees for the full 3-year course at a DU or central university college are typically in the range of <strong>₹15,000-60,000</strong>, well below professional or private-college courses. Private and deemed universities charge considerably more, often ₹1-3 lakh per year given consistently high demand for the subject. Merit-based, SC/ST and income-linked scholarships are available at most government institutions. Always confirm current fees directly on your target college's official admission page."
