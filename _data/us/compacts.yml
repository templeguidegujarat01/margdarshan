imlc:
  license: medicine
  name: "Interstate Medical Licensure Compact (IMLC)"
  what: "The Interstate Medical Licensure Compact offers a voluntary, expedited pathway to licensure for qualified physicians who wish to practice in multiple states."
  source: imlc_states
  checked: 2026-10-07
  review_by: 2027-01-05
  note: "Read from the IMLC participating-states map. The IMLC says questions about the current status and extent of a state's participation should go to that state's board."
  groups:
    - status: spl
      label: "Member state, can serve as State of Principal License"
      meaning: "Processing applications and issuing licenses; a physician can use this state as their State of Principal License."
      states:
        - { name: "Alabama" }
        - { name: "Arizona" }
