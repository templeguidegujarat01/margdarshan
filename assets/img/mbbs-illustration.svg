<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-hidden="true">
  <rect width="640" height="320" fill="url(#g2)"/>
  <defs>
    <linearGradient id="g2" x1="0" y1="0" x2="640" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#166B6E"/>
      <stop offset="1" stop-color="#0F5E63"/>
    </linearGradient>
  </defs>
  <!-- medical cross badge -->
  <g transform="translate(280,60)">
    <circle cx="80" cy="80" r="80" fill="#F4F6F4"/>
    <rect x="66" y="40" width="28" height="80" rx="6" fill="#2A9D8F"/>
    <rect x="40" y="66" width="80" height="28" rx="6" fill="#2A9D8F"/>
  </g>
  <!-- heartbeat line -->
  <g transform="translate(60,220)" stroke="#F4F6F4" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".85">
    <path d="M0 20 H60 L80 -20 L100 60 L120 20 H180"/>
  </g>
  <!-- stethoscope -->
  <g transform="translate(430,150)" stroke="#F4F6F4" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".9">
    <path d="M0 0 C0 40, 40 55, 60 40"/>
    <path d="M100 0 C100 40, 60 55, 60 40"/>
    <circle cx="0" cy="-6" r="7" fill="#F4F6F4" stroke="none"/>
    <circle cx="100" cy="-6" r="7" fill="#F4F6F4" stroke="none"/>
    <circle cx="60" cy="78" r="16" fill="none"/>
  </g>
  <circle cx="120" cy="70" r="10" fill="#F4F6F4" opacity=".5"/>
  <circle cx="560" cy="60" r="14" fill="#F4F6F4" opacity=".4"/>
</svg>
