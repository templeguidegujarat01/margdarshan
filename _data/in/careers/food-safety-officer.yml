  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What does a Food Safety Officer do?"
    parts:
      - overview:
          points:
            - "FSOs inspect food businesses, check licences and hygiene, collect samples for testing and take action on unsafe or adulterated food."
            - "They handle consumer complaints, run awareness drives and support prosecutions under the FSS Act."
            - "The job mixes field inspections with legal paperwork."
  - id: "who"
    hid: "who-heading"
    alt: true
    eyebrow: "Fit check"
    heading: "Who should become a Food Safety Officer"
    parts:
      - fit:
          match:
            - "Care about public health and food quality."
            - "Are comfortable with inspections and enforcement."
            - "Have (or plan) a food tech, microbiology or chemistry degree."
          mismatch:
            - "Dislike confrontation and field visits."
            - "Want a lab-only job."
            - "Don't hold one of the listed degrees."
  - id: "eligibility"
    hid: "elig-heading"
    eyebrow: "Eligibility"
    heading: "What you need, stage by stage"
    parts:
      - elig_list:
          - "A degree listed in the <strong>Food Safety and Standards Rules, 2011</strong> — for example in food technology, dairy technology, biotechnology, oil technology, agricultural science, veterinary science, biochemistry, microbiology, a master's in chemistry, or medicine."
          - "Age, domicile and other conditions as set in each state's recruitment notice."
          - "Training as specified by the Food Authority after appointment."
