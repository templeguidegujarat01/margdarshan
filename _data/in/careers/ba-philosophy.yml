    hid: "higher-heading"
    alt: true
    eyebrow: "Beyond the degree"
    heading: "Higher studies"
    parts:
      - prose:
          - "An MA in Philosophy — at institutions like <strong>Delhi University, JNU or the University of Hyderabad</strong> — is the natural next step for students aiming at research or teaching (via UGC-NET/PhD). Many graduates instead follow up with a 3-year LLB, since Philosophy's grounding in logic and ethics complements legal reasoning closely, or move into UPSC preparation, using Philosophy as their optional subject."
