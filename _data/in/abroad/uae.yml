# United Arab Emirates — study abroad sheet (shape: _data/in/abroad_common.yml header). Read 2026-10-29 (u.ae, ICP, MOHRE).
id: uae
name: "United Arab Emirates"
short: UAE
region: "Middle East"
currency: AED
checked: 2026-10-29
review_by: 2027-01-29
status: open
eyebrow: "Study abroad · Middle East"
title: "Study in the UAE from India"
seo_title: "Study in the UAE from India: Student Visa and Golden Visa"
description: "UAE study route for Indians: university-sponsored or parent-sponsored student residence visas, MOHRE student and part-time work permits (AED 50 fee) and the Golden Visa for top graduates."
lede: "In the UAE your university (or a parent who lives in the UAE) sponsors your student residence visa. There is no separate post-study work visa; top students and graduates can qualify for the long-term Golden Visa."
facts:
  - { label: "Visa sponsor", value: "Your accredited university, or a UAE-resident parent", source: uae_study }
  - { label: "Student work permit", value: "MOHRE training/employment permit; AED 50 federal fee", source: mohre_student }
  - { label: "Golden Visa (graduates abroad)", value: "Top-100 university, GPA 3.5+, within 2 years", source: icp_golden }
  - { label: "Golden Visa length", value: "10 years for top graduates", source: icp_golden }
card:
  line: "University-sponsored visa; Golden Visa for top graduates"
  psw: "No PSW visa; job visa or Golden Visa"
  work: "With a MOHRE permit"
  funds: "Set by the university"
tests:
  - { exam: ielts, need: "Set by each university for admission", source: uae_he }
# Official course searches / institution lists (rendered under "Intakes & courses"). Read 2026-10-29.
find:
  - { label: "Higher education in the UAE", by: "UAE Government portal (u.ae)", url: "https://u.ae/en/information-and-services/education/higher-education", what: "The UAE Government page on universities and higher education in the country." }
pillars:
  language_and_eligibility:
    heading: "Admission and accreditation"
    parts:
      - points:
          - { t: "Study at an accredited university or college; the institution issues a certificate stating the length of study for the visa.", source: uae_study }
          - { t: "The Ministry of Higher Education and Scientific Research lists licensed institutions and handles qualification recognition.", source: uae_he }
  intakes_and_streams:
    heading: "Courses"
    parts:
      - points:
          - { t: "The UAE has federal universities and licensed private and branch campuses; check the institution is licensed and the programme accredited before you pay.", source: uae_he }
      - note: "Most universities start in September, with some January intakes. Each university publishes its own dates."
  tuition_and_living_costs:
    heading: "Fees and permits"
    parts:
      - money:
          - { item: "MOHRE student training/employment permit (federal fee)", cur: AED, amount: 50, per: "permit", source: mohre_student }
      - points:
          - { t: "Families of university students may stay in the UAE if they can afford suitable housing.", source: uae_study }
      - note: "Tuition and visa costs are set by each university and emirate; read the university's fee schedule."
  global_scholarships:
    heading: "Funding and the Golden Visa"
    parts:
      - points:
          - { t: "The UAE offers a Golden Visa to outstanding students: high-school achievers with at least 95% (certificate attested by the Ministry of Education) and top university graduates.", source: icp_golden }
          - { t: "Golden Visa holders get a long-term renewable residence without a sponsor and can sponsor family.", source: uae_golden }
      - note: "Scholarships for international students are offered by universities themselves; there is no general government scholarship for Indian students listed on u.ae."
  application_funnel:
    heading: "From admission to residence"
    parts:
      - steps:
          - { title: "Admission at an accredited institution", text: "Get the admission and the certificate showing study duration.", source: uae_study }
          - { title: "University applies for your visa", text: "Universities facilitate the student visa process (ICP federally, or the Dubai authority).", source: uae_study }
          - { title: "Documents", text: "Ask the university whether it wants your Indian certificates apostilled or attested; the documents guide on this site explains both." }
  visa_chokepoints:
    heading: "The student visa in short"
    parts:
      - points:
          - { t: "Parents resident in the UAE can sponsor sons up to 25 (older if still in higher education) and daughters until marriage.", source: uae_study }
          - { t: "Non-national students need a valid residence visa before a MOHRE student work permit.", source: mohre_student }
  post_study_work:
    heading: "Work during and after your course"
    parts:
      - points:
          - { t: "Registered establishments can train or employ students aged 15+ with a MOHRE student training and employment permit (proof of student status, medical fitness, an approved contract).", source: mohre_student }
          - { t: "University students can apply for a free private-tutor licence from MOHRE.", source: mohre_tutor }
          - { t: "Golden Visa for graduates of universities abroad: top 100 worldwide (ranking recognised by the Ministry), GPA at least 3.5 in the bachelor's, applying within two years of graduating, degree attested.", source: icp_golden }
          - { t: "UAE graduates: Category A licensed university with GPA 3.5, or Category B with 3.8.", source: icp_golden }
