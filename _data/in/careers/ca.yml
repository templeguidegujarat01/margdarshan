  - id: "faq"
    hid: "faq-heading"
    alt: true
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Can I become a CA without Maths?"
            a: "Yes. CA Foundation does include a paper on Maths and Statistics, but it is at a basic level and is manageable even if you didn't take Maths in Class 11-12. Many practising CAs come from a non-Maths Commerce background."
          - q: "Is CA harder than engineering or medicine?"
            a: "It's difficult in a different way. CA has a low pass percentage at each level and requires years of consistent self-study alongside articleship, whereas engineering and medicine are demanding primarily at the entrance-exam and coursework stage. Both require serious commitment."
          - q: "Can Science or Arts students become a CA?"
            a: "Yes. CA Foundation is open to students from any stream after Class 12. Commerce graduates and postgraduates can also skip Foundation and enter directly at the Intermediate level through the Direct Entry route."
          - q: "Do CAs only work in accounting and taxation?"
            a: "No. While auditing, taxation and accounting are core areas, qualified CAs also work in investment banking, financial planning, risk management, corporate strategy, consulting and as CFOs, and many eventually start their own practice."
          - q: "How many attempts does it usually take to clear CA?"
            a: "It varies a great deal by individual. Some clear every level in their first attempt; many others take two or more attempts at Intermediate or Final. Multiple attempts are common and do not meaningfully limit long-term career outcomes."
