# ---------------------------------------------------------------------------
# App sidebar (_includes/sidebar.html). Groups -> items -> optional children.
# An item is "current" when its href is the page, the page's breadcrumb
# parent, or its `key` equals the page's header.active_stream.
# icon (home and tile only) is the inner SVG markup for a 24x24, stroke-based icon.
# ---------------------------------------------------------------------------
sidebar:
  - id: tools
    label: Overview & Tools
    items:
      - label: India Home
        short: Home
        href: india.html
        icon: '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>'
