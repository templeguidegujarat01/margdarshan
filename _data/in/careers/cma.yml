  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What is a Cost & Management Accountant?"
    parts:
      - overview:
          points:
            - "A Cost and Management Accountant is certified by the <strong>ICMAI</strong> — a statutory body set up by an Act of Parliament — to specialise in cost control, budgeting, performance management and strategic financial decision-making."
            - "Where a Chartered Accountant (CA)'s core identity is built around audit and statutory compliance, a CMA's core identity is built around helping a business understand its own costs and spend more intelligently."
            - "CMAs are the people manufacturing, Fast-Moving Consumer Goods (FMCG) and infrastructure companies turn to when they need to know the real cost of producing a unit, where budgets are leaking, and how pricing decisions affect profitability."
          more:
            - "In recent years the role has expanded well beyond factories: CMAs are now heavily recruited into FP&amp;A (Financial Planning & Analysis), business finance and Global Capability Centre (GCC) roles at large multinational companies."
            - "<strong>Important distinction:</strong> this guide covers the <strong>Indian CMA</strong> qualification (ICMAI)."
            - "There is a separate, shorter <strong>US CMA</strong> credential issued by the Institute of Management Accountants (IMA) in the United States — different regulator, different syllabus, different fee structure."
            - "Don't confuse salary or fee figures between the two; we call this out again in the FAQs."
  - id: "who"
    hid: "who-heading"
    alt: true
    eyebrow: "Fit check"
    heading: "Who should choose CMA — and who should think twice"
    parts:
      - fit:
          match:
            - "Enjoy numbers, budgeting and figuring out \"why did this cost so much?\""
            - "Want a professional qualification completed faster than CA, without university-style attendance."
            - "Are drawn to strategy and internal decision-making rather than external audit."
          mismatch:
            - "Specifically want to sign statutory audits — that legal right currently belongs to CAs only."
            - "Want maximum brand recognition with non-finance family members — CMA is still less widely known than CA in India."
            - "Dislike numerical, calculation-heavy papers — CMA leans even more numerical than CS."
