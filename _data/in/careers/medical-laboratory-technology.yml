  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Should I choose BMLT or DMLT?"
            a: "It depends on your priorities. DMLT (2-year diploma) gets you into the workforce faster and at lower cost, and is the minimum qualification accepted for most entry-level lab technician roles. BMLT (3-year degree) is generally recommended for long-term growth, since it offers better starting salaries, a clearer path to supervisory and laboratory management roles, and easier eligibility for postgraduate study (MSc MLT) later."
          - q: "What is a realistic Medical Lab Technologist salary in India?"
            a: "Freshers commonly earn ₹2-4 LPA at DMLT level and ₹3-5 LPA at BMLT level, with a median figure around ₹2.85 lakh per year (roughly ₹23,800/month) commonly cited. Diagnostic chains and larger hospitals generally pay more than small independent labs for the same role. Mid-level roles like clinical laboratory supervisor or senior medical technologist commonly reach ₹5-8 LPA, and experienced professionals in urban centres or research institutions can earn considerably more."
          - q: "Is the diagnostic industry actually growing in India?"
            a: "Yes, genuinely and measurably. Major diagnostic chains — Dr. Lal PathLabs, SRL Diagnostics, Metropolis and Thyrocare among them — are actively opening new labs across Tier 2 and Tier 3 cities, not just metros. This is driven by real factors: rising preventive health checkups, corporate hospitals upgrading pathology departments, continued testing infrastructure expansion since COVID, and the growth of home sample collection services run by e-diagnostics companies."
          - q: "Can I work abroad as a medical lab technologist after BMLT/DMLT?"
            a: "Some graduates do, though this route is generally less well-documented than nursing or physiotherapy's international pathways. Many countries hire laboratory technicians, but typically require additional licensing exams, English proficiency tests, and often further certification or experience — research your specific target country's requirements carefully before planning around this."
          - q: "Is medical lab technology a stable career choice?"
            a: "Yes, it's commonly described as a recession-resistant healthcare career, since diagnostic testing remains essential regardless of broader economic conditions. It's also a genuinely accessible entry point into healthcare for students who want to work in medicine and diagnostics without the long duration and intense competition of degrees like MBBS."
      - note: "Figures are indicative (2026) — confirm on the official college or authority website."
        class: "table-note mt-lg"
