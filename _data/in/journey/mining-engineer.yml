# Journey Blueprint — Mining Engineer (B.Tech Mining → GATE MN → Coal India Management Trainee). Printed on journey-mining-engineer.html.
# Rules, classes and the money items / sources several careers share: _data/in/journey_common.yml.
# `money_defs` / `sources` below are used only by this career. Check: node scripts/check-journey-matrix.mjs
id: mining-engineer
v: 2
name: "Mining Engineer (Coal India Management Trainee via GATE)"
search: ["mining engineer", "mining engineering", "coal india management trainee", "cil mt mining", "mine manager", "gate mining"]
page: "colleges-btech.html"
doubts_page: "journey-mining-engineer.html"
gate: "Class 12 with Physics and Mathematics → JEE Main or your state CET → B.E. / B.Tech in Mining Engineering with 60% (55% SC / ST) → GATE in Mining Engineering (MN) → Coal India's Management Trainee merit list → 1-year training-cum-probation in E-1 grade."
gate_source: [jm-ib, cil-a01, cil-a06]
core:
  what:
    text: "Mining engineers plan and run safe extraction of coal and minerals. Coal India Limited — a Maharatna PSU under the Ministry of Coal that produces around 75% of India's coal — hires Mining Engineering graduates as Management Trainees on their GATE score."
    source: [cil-a06, cil-a01]
  day:
    - "Plan mine layouts, blasting and haulage."
    - "Supervise shifts and enforce safety rules underground or in open-cast mines."
    - "Track production, machines and environmental limits."
  pay:
    - { level: "Management Trainee (Mining), Coal India — E-1 grade", value: "₹60,000 – ₹1,80,000 scale · initial basic ₹60,000 a month during training + DA, HRA, perks, PRP", source: cil-a01 }
  pay_note: "Private mining salaries are not officially published."
  routes:
    - { title: "Coal India MT through GATE", text: "Advt 01/2026 (GATE 2025 score): 276 Mining Management Trainee posts; degree in Mining Engineering with 60% (55% SC / ST); shortlist 1:3 on GATE score.", source: cil-a01 }
    - { title: "Next cycle: GATE 2027", text: "Advt 06/2026 (17 Aug 2026): Coal India will recruit Mining MTs on the GATE 2027 Mining Engineering paper; the detailed advert comes in 2027.", source: cil-a06 }
  cost_time:
    - { label: "CIL application fee", value: "₹1,000 + ₹180 GST = ₹1,180 · SC / ST and CIL employees exempt", source: cil-a01 }
    - { label: "GATE 2027 fee (one paper)", value: "₹2,000 · ₹1,000 for women, SC, ST, PwD (regular period)", source: gate27-fee }
    - { label: "Service bond", value: "Serve 60 months; ₹3 lakh + GST bond, recovered ₹5,000 a month and refunded without interest after 60 months", source: cil-a01 }
  cost_note: "College fees depend on the institute and state, so they are not printed here."
  challenges:
    - text: "Coal India's bond: 60 months of service and a ₹3 lakh bond, recovered from salary."
      source: cil-a01
    - text: "Only one GATE year counts per advert — Advt 01/2026 took GATE 2025 scores alone."
      source: cil-a01
    - text: "Upper age 30 for General / EWS (OBC-NCL 3 years more) on the advert's cut-off date."
      source: cil-a01
  not_for:
    - "You want an office job in a big city — mines are in coalfields and remote areas."
    - "You dislike shift work and strict safety discipline."
    - "You want to avoid a long service bond."
journey:
  - stages: [c8, c9]
    title: "Maths, Physics and the outdoors"
    do:
      - text: "B.E. / B.Tech admission through JEE Main needs Physics and Mathematics in Class 12."
        source: jm-ib
    doubts:
      - q: "What does a mining engineer do?"
        a: "Plans and runs safe extraction of coal and minerals. Coal India, which produces around 75% of India's coal, hires Mining Engineering graduates as Management Trainees."
        next: "Read the Routes list above."
        source: [cil-a06, cil-a01]
      - q: "How big is Coal India as an employer?"
        a: "Coal India's Advt 06/2026 describes a workforce of about 2.09 lakh and calls the company the world's single largest coal producer."
        next: "Look at its Management Trainee route."
        source: cil-a06
  - stages: [c10]
    title: "Pick PCM"
    do:
      - text: "Take Physics, Chemistry and Mathematics for Class 11–12 to sit JEE Main."
        source: jm-ib
    stream: "Science with Physics, Chemistry and Mathematics (PCM)."
    doubts:
      - q: "Is Mining a branch I can choose after JEE?"
        a: "Yes — B.E. / B.Tech in Mining Engineering is offered by engineering institutes; Coal India's MT posts ask for that degree with 60%."
        next: "Look for Mining in your counselling choices."
        source: [jm-ib, cil-a01]
  - stages: [c11, c12]
    title: "JEE Main and state CETs"
    do:
      - text: "Write JEE Main and your state engineering CET for a Mining Engineering seat."
        source: jm-ib
    doubts:
      - q: "Does Coal India hire on GATE score alone?"
        a: "For Mining Management Trainees, yes in Advt 01/2026: shortlisting and the final merit list were on the GATE score of one named year, followed by document checks and a medical."
        next: "Plan to write GATE in your final year."
        source: cil-a01
      - q: "Do Class 12 marks matter for Coal India?"
        a: "No. Coal India checks your Mining degree (60%, or 55% SC / ST) and your GATE score."
        next: "Aim for a strong degree record."
        source: cil-a01
  - stages: [ug]
    title: "B.Tech Mining: 60% and GATE MN"
    do:
      - text: "Keep <strong>60% in your Mining degree</strong> (55% SC / ST); if you have CGPA, attach your university's conversion certificate."
        source: cil-a01
      - text: "Write the GATE Mining Engineering (MN) paper — Coal India's next recruitment uses GATE 2027 scores."
        source: cil-a06
    exams:
      - { name: "GATE 2027", when: "6–7, 13–14, 20–21 Feb 2027 · result 19 Mar 2027", source: gate27 }
    money: [gate-fee]
    doubts:
      - q: "Which GATE paper does Coal India use?"
        a: "Mining Engineering (paper code MN)."
        next: "Register for MN."
        source: [cil-a01, cil-a06]
      - q: "Can a final-year student apply?"
        a: "Candidates who have the degree, or have passed their final semester exam by the advert's cut-off date, are eligible."
        next: "Check the cut-off date in the 2027 advert."
        source: cil-a01
      - q: "When could I register for GATE 2027?"
        a: "Coal India's Advt 06/2026 noted that the GATE 2027 portal was open from 14 Aug to 21 Sep 2026."
        next: "Register early for GATE 2028 if you missed it."
        source: cil-a06
      - q: "My university gives CGPA. What does Coal India do?"
        a: "Attach the percentage-conversion certificate issued by your university or institute."
        next: "Get it before you apply."
        source: cil-a01
  - stages: [grad]
    title: "Coal India MT selection and training"
    do:
      - text: "Candidates are shortlisted category-wise on GATE score in the ratio 1:3; the final merit list is on GATE score, and selected candidates go through document verification and an initial medical examination before the offer."
        source: cil-a01
    money: [cil-fee]
    doubts:
      - q: "How many Mining MT posts did Coal India advertise?"
        a: "Advt 01/2026 (on GATE 2025 scores) had 276 tentative Mining posts — 114 UR, with the rest split across reserved categories."
        next: "Watch the GATE 2027-based advert in 2027."
        source: cil-a01
      - q: "Is there an interview?"
        a: "Advt 01/2026 does not mention an interview: it shortlisted 1:3 on GATE score, made the final merit list on GATE scores, and called selected candidates for document verification and an initial medical examination."
        next: "Your GATE score is the main key."
        source: cil-a01
      - q: "What is the starting salary?"
        a: "Management Trainee in E-1 grade, scale ₹60,000 – ₹1,80,000, initial basic ₹60,000 a month during training, plus DA, HRA and other allowances."
        next: "See the pay line above."
        source: cil-a01
      - q: "How does the service bond work?"
        a: "You agree to serve 60 months and sign a ₹3 lakh (+ GST) bond. ₹5,000 a month is deducted from salary and refunded without interest after 60 months."
        next: "Read the bond clause before joining."
        source: cil-a01
      - q: "What if two candidates have the same GATE score?"
        a: "The higher percentage / CGPA in the qualifying degree ranks higher, then the older candidate."
        next: "Your degree marks can break a tie."
        source: cil-a01
  - stages: [work]
    title: "Already working in mining"
    do:
      - text: "Candidates in government, PSUs or autonomous bodies apply through proper channel or bring an NOC to document verification; Coal India and subsidiary employees pay no fee."
        source: cil-a01
    doubts:
      - q: "I am 29 and working in a private mine. Can I apply?"
        a: "Yes, if you are under the upper age limit (30 for General / EWS on the advert's cut-off date; more for reserved categories) and have a valid GATE MN score of the year the advert names."
        next: "Write GATE in the year Coal India announces."
        source: [cil-a01, cil-a06]
board_note: "Any board. JEE Main needs Physics and Mathematics in Class 12; Coal India checks your Mining degree and GATE score."
board_source: [jm-ib, cil-a01]
