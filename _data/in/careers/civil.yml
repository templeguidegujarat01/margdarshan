  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What is Civil Engineering?"
    parts:
      - overview:
          points:
            - "Civil Engineering is a 4-year engineering degree focused on planning, designing, constructing and maintaining the physical infrastructure society depends on — buildings, roads, bridges, dams, airports, metro systems and water networks."
            - "Its core rests on structural engineering, geotechnical engineering (soil and foundations), transportation engineering and construction management."
            - "It's the branch literally building modern India — and with the country's infrastructure spending at record levels, that's translating into real, growing demand, not just a slogan."
          more:
            - "Joint Entrance Examination (JEE) cutoffs for civil engineering at several top Indian Institutes of Technology (IITs) have tightened meaningfully in recent admission cycles, a direct signal of renewed interest tracking the sector's genuine momentum."
  - id: "who"
    hid: "who-heading"
    alt: true
    eyebrow: "Fit check"
    heading: "Who should choose Civil Engineering"
    parts:
      - fit:
          match:
            - "Are genuinely interested in how buildings, roads and cities actually get built, not just designed on paper."
            - "Want one of the strongest PSU/GATE pay tracks among engineering branches."
            - "Don't mind site visits and field presence alongside office-based design work."
          mismatch:
            - "Want a fully desk-based, remote-friendly career — most civil roles involve real site presence, especially early on."
            - "Expect a large private-sector fresher salary immediately — small-contractor site roles can start modestly."
            - "Aren't willing to add a skill like BIM or structural specialisation — generic civil work is increasingly commoditised."
