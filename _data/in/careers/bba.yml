  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What is BBA?"
    parts:
      - overview:
          points:
            - "BBA is a 3-year undergraduate degree that teaches how a business actually functions end to end — marketing, human resources, operations, finance and strategy — rather than specialising narrowly in one area from day one."
            - "Most programmes let you pick a specialisation (Finance, Marketing, HR, International Business, Business Analytics and others) in the later semesters."
            - "It's offered at everything from large private universities to a handful of well-known government colleges like Shaheed Sukhdev College of Business Studies (Delhi University)."
          more:
            - "Many students treat it as a direct pipeline into an MBA — a strong BBA plus a good MBA is one of the most common combinations for management careers in India."
  - id: "who"
    hid: "who-heading"
    alt: true
    eyebrow: "Fit check"
    heading: "Who should choose BBA — and who should think twice"
    parts:
      - fit:
          match:
            - "Want broad exposure to how businesses work, not just the accounting/finance side."
            - "Are already thinking about an MBA down the line and want a head start."
            - "Enjoy case studies, presentations and group projects more than heavy number-crunching."
          mismatch:
            - "Already know you want deep accounting/taxation expertise — B.Com or a professional course fits better."
            - "Expect BBA alone (without an MBA or strong college) to guarantee a management-level salary immediately."
            - "Are choosing a college mainly on marketing rather than checking its actual placement record and faculty."
  - id: "eligibility"
    hid: "elig-heading"
    eyebrow: "Eligibility"
    heading: "Who can apply for BBA"
    parts:
      - elig_list:
          - "Class 12 pass (10+2) from a recognised board, <strong>any stream</strong> — Science, Commerce and Arts are all equally accepted."
          - "Minimum aggregate typically <strong>45-60%</strong>, though premier institutes like Delhi University's SSCBS or NMIMS can expect cutoffs of 85-90%+ once combined with entrance scores."
          - "Maths in Class 11-12 is <strong>not compulsory</strong> at most universities, though basic quantitative aptitude is tested in entrance exams."
