  - id: "faq"
    hid: "faq-heading"
    alt: true
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Is Interior Design the same as Architecture?"
            a: "No. Architecture deals with a building's overall structure, engineering and exterior form, and requires a licensed Council of Architecture-recognised degree (B.Arch). Interior Design focuses specifically on a space's interior — layout, materials, furniture, lighting and finishes — within an existing structure, and doesn't require the same licensing."
          - q: "Do I need a Science background to study Interior Design?"
            a: "No. Interior Design is open to students from any Class 12 stream, since it's a design and creative discipline rather than a core engineering one, though comfort with basic measurements and spatial reasoning genuinely helps."
          - q: "What software do Interior Designers use?"
            a: "AutoCAD for technical drawings, SketchUp and 3ds Max for 3D visualisation, and increasingly, rendering tools like V-Ray or Lumion to create realistic client presentations — most design courses teach these directly."
          - q: "Can I freelance as an Interior Designer?"
            a: "Yes, and many designers do once they've built experience and a client network, taking on residential and small commercial projects independently. Larger commercial or hospitality projects typically involve working with an established firm."
          - q: "How much do Interior Designers earn in India?"
            a: "It varies by experience, project scale and location. Entry-level roles at design firms typically start modestly, while experienced designers with a strong portfolio, especially those working on larger residential or commercial projects, can earn considerably more, particularly as independent consultants."
      - note: "*Fee and salary figures are indicative, based on publicly available information as of 2026, and vary significantly by institution and project scale — always verify current figures on the official institute website."
        class: "table-note mt-lg"
