          - "<strong>4-year Integrated B.A/B.Sc B.Ed:</strong> Class 12 pass (10+2) from any stream, admitted through entrance exams like the National Common Entrance Test (NCET) for select institutes."
          - "Most states also conduct their own B.Ed entrance exams for admission to state-affiliated colleges."
