# Journey Blueprint — Yoga Instructor (Yoga Certification Board levels, Ministry of Ayush; MDNIY courses). Printed on journey-yoga-instructor.html.
# Rules, classes and the money items / sources several careers share: _data/in/journey_common.yml.
# `sources` below are used only by this career. Check: node scripts/check-journey-matrix.mjs
id: yoga-instructor
v: 2
name: "Yoga Instructor (Yoga Certification Board: Protocol → Wellness → Teacher & Evaluator)"
search: ["yoga instructor", "yoga teacher", "yoga trainer", "yoga coach", "yoga certification board", "ycb", "yoga protocol instructor", "yoga wellness instructor", "b.sc yoga", "yoga therapist"]
page: "journey-yoga-instructor.html"
doubts_page: "journey-yoga-instructor.html"
gate: "Practise yoga regularly → train at a Yoga Certification Board (YCB)–accredited institution (or appear directly through a YCB certification body) → Yoga Protocol Instructor (about 200 hours) → Yoga Wellness Instructor (400 hours) → Yoga Teacher & Evaluator (800 hours). A 3-year B.Sc (Yoga) at MDNIY is a degree route after Class 12 Science."
gate_source: [ycb-gyp, mdniy-bsc]
core:
  what:
    text: "A yoga instructor teaches yoga postures, breathing and relaxation to groups and individuals. The Yoga Certification Board under the Ministry of Ayush runs a voluntary certification scheme with set levels, syllabi and exams."
    source: ycb-gyp
  day:
    - "Lead classes in parks, schools, studios and workplaces."
    - "Demonstrate and correct postures, breathing and relaxation."
    - "Plan sessions for beginners, children and older people."
  pay_note: "No official pay scale for yoga instructors was found in a central notice, so pay is not printed."
  routes:
    - { title: "Yoga Protocol Instructor", text: "Training of at least 200 hours (or 3 months part-time / 1 month full-time). Class 10 is suggested; no age limit. Teaches the Common Yoga Protocol in parks, societies and similar classes.", source: ycb-gyp }
    - { title: "Yoga Wellness Instructor", text: "At least 400 hours (or 6 months part-time / 3 months full-time); Class 12 suggested; no age limit. Teaches yoga for wellness in schools, studios and workplaces.", source: ycb-gyp }
    - { title: "Yoga Teacher & Evaluator → Yoga Master", text: "Teacher & Evaluator: at least 800 hours, graduation suggested; can train others and act as an evaluator. Yoga Master: 1,600 hours.", source: ycb-gyp }
    - { title: "Degree route: B.Sc (Yoga), MDNIY", text: "Morarji Desai National Institute of Yoga runs a 3-year B.Sc (Yoga) under GGSIPU norms: Class 12 Science with 50% in four subjects including English; intake 30.", source: mdniy-bsc }
  cost_time:
    - { label: "Protocol Instructor training", value: "At least 200 hours", source: ycb-gyp }
    - { label: "Wellness Instructor training", value: "At least 400 hours", source: ycb-gyp }
    - { label: "B.Sc (Yoga), MDNIY", value: "3 years (6 semesters)", source: mdniy-bsc }
  cost_note: "YCB exam and course fees are not printed in the guideline we read, so no amounts are shown."
  challenges:
    - text: "You must pass both the theory and the practical — the guideline sets 70% in each."
      source: ycb-gyp
    - text: "Higher levels need much more training: 800 hours for Teacher & Evaluator and 1,600 for Yoga Master."
      source: ycb-gyp
    - text: "YCB certification is voluntary, so employers decide which certificate they ask for."
      source: ycb-gyp
  not_for:
    - "You do not practise yoga yourself."
    - "You dislike early mornings — many classes start at sunrise."
    - "You want a fixed government pay scale from day one."
journey:
  - stages: [c8, c9]
    title: "Practise every day"
    do:
      - text: "YCB's lowest level, Yoga Volunteer, is open to everyone and is assessed by a theory test only."
        source: ycb-gyp
    doubts:
      - q: "What does a yoga instructor do?"
        a: "Teaches yoga postures, breathing and relaxation to groups and individuals. The Yoga Certification Board (Ministry of Ayush) certifies yoga professionals at set levels — Protocol Instructor, Wellness Instructor, Teacher & Evaluator and Yoga Master."
        next: "Read the Routes list above."
        source: ycb-gyp
      - q: "Can a school student get a yoga certificate?"
        a: "Yes. The Yoga Volunteer certification is open to all and is assessed by theory only. Protocol Instructor suggests Class 10 as the minimum."
        next: "Build a daily practice first."
        source: ycb-gyp
  - stages: [c10]
    title: "Protocol Instructor after Class 10"
    do:
      - text: "For Yoga Protocol Instructor, Class 10 is the suggested minimum and there is no age limit; institutions may set their own entry rules."
        source: ycb-gyp
    stream: "Any stream; Science (with 50%) if you want MDNIY's B.Sc (Yoga)."
    doubts:
      - q: "Can I become a yoga protocol instructor after Class 10?"
        a: "Yes. YCB suggests Class 10 for Protocol Instructor training, with no age limit; the course needs at least 200 hours (or 3 months part-time / 1 month full-time). Training institutions may set their own eligibility."
        next: "Pick a YCB-accredited institution."
        source: ycb-gyp
  - stages: [c11, c12]
    title: "Wellness Instructor or B.Sc (Yoga)"
    do:
      - text: "Yoga Wellness Instructor: Class 12 suggested, at least 400 hours of training."
        source: ycb-gyp
      - text: "MDNIY's B.Sc (Yoga) needs Class 12 Science with 50% in four subjects including English."
        source: mdniy-bsc
    doubts:
      - q: "Is there a yoga degree after Class 12?"
        a: "Yes. MDNIY (Ministry of Ayush) runs a 3-year B.Sc (Yoga) under GGSIPU norms for Class 12 Science students with 50% in four subjects including English; the intake is 30."
        next: "Watch MDNIY's admission notices."
        source: mdniy-bsc
      - q: "Do I need a degree to teach yoga?"
        a: "No. YCB certification is voluntary and level-based; a Wellness Instructor needs about 400 hours of training (Class 12 suggested). A degree helps for teaching jobs in colleges."
        next: "Start with a certificate and add a degree if you want."
        source: [ycb-gyp, mdniy-bsc]
      - q: "Is there an age limit for YCB yoga certification?"
        a: "No. The guideline lists no age limit for Protocol Instructor, Wellness Instructor, Teacher & Evaluator or Yoga Master."
        next: "Start whenever your practice is ready."
        source: ycb-gyp
  - stages: [ug]
    title: "Get certified"
    do:
      - text: "Two ways to certification: train at a YCB-accredited institution and sit the YCB exam, or, if you already have the skills, appear directly through a YCB-approved Personnel Certification Body (PrCB)."
        source: ycb-gyp
      - text: "MDNIY's Certificate Course for Protocol Instructor runs 3 months, after its 50-hour foundation course (or 5 years' documented teaching)."
        source: mdniy-ccypi
    doubts:
      - q: "Can I take the YCB exam without joining a course?"
        a: "Yes. Yoga professionals who already have the knowledge and skill can appear directly through a YCB-approved Personnel Certification Body; there are no eligibility criteria for such open candidates."
        next: "Check the syllabus for your level on yogacertificationboard.nic.in."
        source: ycb-gyp
      - q: "What is the YCB exam pattern?"
        a: "A theory paper of objective MCQs (1 mark each, no negative marking, in English and Hindi, on OMR) and a practical with demonstration, teaching skill and field experience. Both together are out of 200 marks."
        next: "Prepare a record of classes you have conducted."
        source: ycb-gyp
      - q: "What marks do I need to pass YCB certification?"
        a: "70% in the theory and 70% in the practical, as the YCB guideline's assessment table sets."
        next: "Practise teaching, not just your own postures."
        source: ycb-gyp
      - q: "What happens in the YCB practical test?"
        a: "An assessor checks demonstration, teaching skill, application of knowledge and field experience for up to one hour. You show a report with photographs and feedback of the training programmes you have conducted."
        next: "Keep records of every class you lead."
        source: ycb-gyp
      - q: "Can I write the YCB theory paper in Hindi?"
        a: "Yes. The theory paper is bilingual — English and Hindi. For other languages the paper is in English plus that language, and the English version counts if there is an error."
        next: "Choose your exam language when you register."
        source: ycb-gyp
      - q: "What does MDNIY ask for its Protocol Instructor course?"
        a: "Its 50-hour Foundation Course in Yoga Science for Wellness (or an equivalent from a university or YCB-accredited institution), or 5 years' documented yoga teaching. Candidates must be medically fit; the course runs 3 months with 120 seats (60 online, 60 offline)."
        next: "Do the foundation course first."
        source: mdniy-ccypi
  - stages: [grad]
    title: "Teacher & Evaluator level"
    do:
      - text: "Yoga Teacher & Evaluator: at least 800 hours (15 months part-time / 9 months full-time); graduation suggested; can teach in institutions, colleges and universities and assess other yoga professionals."
        source: ycb-gyp
    doubts:
      - q: "Which yoga certificate lets me train other teachers?"
        a: "Yoga Teacher & Evaluator (at least 800 hours, graduation suggested) can act as a master trainer and evaluator. Yoga Master (1,600 hours) works as a master educator for training programmes."
        next: "Climb the levels as you gain teaching hours."
        source: ycb-gyp
      - q: "Is there a separate yoga therapy track?"
        a: "Yes. YCB's therapy category has Assistant Yoga Therapist (10+2, 400 hours), Yoga Therapist (any degree, 800 hours) and Therapeutic Yoga Consultant (1,600 hours). Assistant Yoga Therapists and Yoga Therapists work with certified physicians or senior yoga therapists."
        next: "Choose therapy only if you want to work with patients."
        source: ycb-gyp
  - stages: [work]
    title: "Keep learning"
    do:
      - text: "YCB runs Continuing Yoga Education Programmes and publishes syllabi for each level, including primary and secondary school yoga teachers."
        source: ycb-home
    doubts:
      - q: "Where can a certified yoga instructor work?"
        a: "YCB's guideline lists parks and housing societies (Protocol Instructor), schools, studios and workplaces (Wellness Instructor), and colleges, universities and training programmes (Teacher & Evaluator)."
        next: "Pick the setting that matches your level."
        source: ycb-gyp
board_note: "Any board. MDNIY's B.Sc (Yoga) needs Class 12 Science with 50% in four subjects including English."
board_source: mdniy-bsc
