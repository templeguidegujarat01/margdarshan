hero:
  eyebrow: "Science (PCB) · Animal Health"
  title: "Veterinarian (BVSc & AH) — Doctor for Animals"
  meta:
    - "Regulated by the Veterinary Council of India"
    - "Class 12 PCB + NEET-UG"
  read_time: "8 min read"
  intro:
    - "Veterinarians diagnose and treat animals — pets, livestock and wildlife — and protect public health through food safety and disease control. The degree is the Bachelor of Veterinary Science & Animal Husbandry (BVSc & AH), which includes a compulsory internship. The Veterinary Council of India (VCI) fills 15% of seats in recognised veterinary colleges from the NEET-UG merit list; states fill the rest through their own process."
