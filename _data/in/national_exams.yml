        heading: "One CBT for four VIT campuses"
        parts:
          - p: "The <strong>VIT Engineering Entrance Examination (VITEEE)</strong> is conducted by Vellore Institute of Technology for undergraduate engineering admission to the VIT group of institutions — VIT-Vellore, VIT-Chennai, VIT-AP and VIT-Bhopal. It is a computer-based test held at designated centres across India and abroad."
            source: vit-page
          - table:
              caption: "VITEEE-2026 timeline"
              head: ["Event", "Date"]
              rows:
                - ["Last date for online application", "12 Apr 2026"]
                - ["Test window (tentative; days vary by city)", "28 Apr – 3 May 2026"]
                - ["Result (tentative)", "2nd week of May 2026"]
                - ["Online counselling", "Starts 2nd week of May 2026"]
            source: vit-page
          - p: "<strong>VITEEE is mandatory</strong> for Indian nationals: Class 12 marks, JEE Main or SAT scores are not used for B.Tech admission. There is no lateral entry to B.Tech for diploma holders."
            source: vit-page
          - warn: "VIT had not published VITEEE-2027 details on 15 October 2026. Check viteee.vit.ac.in before applying."
      - id: eligibility
        nav: "Eligibility"
        eyebrow: "Strict academic eligibility"
        heading: "60% in PCM (or PCB), with 50% in the key subject"
        parts:
          - table:
              caption: "Class 12 marks needed for B.Tech admission"
              head: ["Applicant", "Minimum in qualifying exam"]
              rows:
                - ["PCM / PCMB (MPCEA paper)", "60% aggregate in Maths, Physics, Chemistry and at least 50% in Maths"]
                - ["PCB / PCMB (BPCEA paper)", "60% aggregate in Biology, Physics, Chemistry and at least 50% in Biology"]
                - ["SC / ST; applicants from J&amp;K, Ladakh and the North-Eastern states", "50% aggregate in Physics, Chemistry and Maths / Biology"]
            source: vit-page
          - list:
              - "<strong>Age:</strong> born on or after 1 July 2004 (as in the Class 10 certificate)."
              - "<strong>Nationality:</strong> resident or non-resident Indian, OCI or PIO; NRI and foreign applicants use separate forms."
              - "Only regular, full-time, formal education counts. Candidates who sat multiple board exams in the same academic year are not eligible."
              - "<strong>Attempts:</strong> you may appear only <strong>once</strong> for VITEEE-2026; a violation cancels the application and admission."
              - "PCB students are eligible only for six bio-oriented branches, such as B.Tech Biotechnology, Bioengineering, CSE (Bioinformatics) and CSE (Health Informatics)."
            source: vit-page
      - id: scheme
        nav: "Exam scheme"
        eyebrow: "Exam scheme &amp; marking matrix"
        heading: "125 questions, +4 / −1"
        parts:
          - table:
              caption: "VITEEE-2026 question split (2 hours 30 minutes, English only)"
              head: ["Section", "MPCEA (PCM)", "BPCEA (PCB)"]
              rows:
                - ["Mathematics / Biology", "40", "40"]
                - ["Physics", "35", "35"]
                - ["Chemistry", "35", "35"]
                - ["Aptitude", "10", "10"]
                - ["English", "5", "5"]
                - ["Total", "125", "125"]
            source: vit-page
          - list:
              - "<strong>Marking:</strong> +4 for each correct answer, −1 for each wrong answer, 0 for unanswered or marked-for-review questions. All questions are MCQs."
              - "You book your test city, date and slot yourself on VIT's Online Test Booking System (first come, first served); a booked slot or city cannot be changed."
              - "Selection is on the VITEEE rank; in counselling you choose campus, programme and fee category."
            source: vit-page
      - id: reservation
        nav: "Quotas"
        eyebrow: "Reservation &amp; quotas"
        heading: "Relaxed marks, not reserved seats"
        parts:
          - p: "VIT's admission page lists no caste-based seat reservation. What it gives is a <strong>lower eligibility bar of 50%</strong> for SC/ST candidates and for applicants from Jammu &amp; Kashmir, Ladakh and the North-Eastern states (Arunachal Pradesh, Assam, Manipur, Meghalaya, Mizoram, Nagaland, Sikkim, Tripura) — with a community or nativity certificate at counselling."
            source: vit-page
          - list:
              - "<strong>STARS scheme:</strong> district toppers (boys and girls) from rural government schools of Tamil Nadu and Andhra Pradesh get a 100% waiver of tuition, hostel and basic medical expenses."
              - "Once allotted, there is no change of branch, campus or fee category."
            source: vit-page
      - id: fees
        nav: "Application &amp; fees"
        eyebrow: "Application steps &amp; fees"
        heading: "One fee for everyone: ₹1,350"
        parts:
          - list:
              - "<strong>Step 1</strong> — register with a valid e-mail and mobile number (OTP verification)."
              - "<strong>Step 2</strong> — fill the online form; an application number is generated."
              - "<strong>Step 3</strong> — pay <strong>₹1,350</strong> by net banking, card or Paytm (the equivalent of USD 90 for centres abroad). The fee is the same for all categories and genders and is non-refundable."
              - "<strong>Step 4</strong> — upload photo and signature, then download the filled form; no hard copy is sent to VIT."
              - "<strong>Step 5</strong> — book your slot on OTBS and download the admit card. Missing the slot booking forfeits the fee."
            source: vit-page
      - id: horizons
        nav: "Courses &amp; colleges"
        eyebrow: "Career horizons &amp; mapped institutions"
        heading: "Four campuses, transfer and semester-abroad options"
        parts:
          - list:
              - "<strong>International Transfer Program</strong>: two years at VIT, two years at a partner university abroad."
              - "<strong>Semester Abroad Program</strong>: the final semester at a partner university abroad."
              - "Freshers must live on campus unless a parent or guardian lives in the city."
            source: vit-page
          - links:
              - { label: "BITSAT", url: "bitsat.html" }
              - { label: "COMEDK UGET", url: "comedk.html" }
              - { label: "B.Tech college finder", url: "colleges-btech.html" }
              - { label: "JEE Main", url: "jee-main.html" }
    sources:
      - { id: vit-page, name: "VIT — VITEEE-2026 admission page (eligibility, exam pattern, dates, application process, FAQs)", url: "https://viteee.vit.ac.in/", covers: "campuses, eligibility, age, single attempt, pattern, marking, fee, OTBS slot booking, STARS, ITP/SAP", checked: 2026-10-15 }

  # ---------------------------------------------------------------- WBJEE
  - slug: wbjee
    short: "WBJEE (West Bengal)"
    stream: engineering
    checked: 2026-10-15
    body: "West Bengal Joint Entrance Examinations Board (WBJEEB)"
    eyebrow: "State Entrance · Engineering &amp; Pharmacy · 2026 cycle"
    title: "WBJEE — eligibility, marking, domicile &amp; reservation, fees"
    lede: "West Bengal's OMR-based common entrance for B.E./B.Tech, B.Pharm and B.Arch in the state's universities and colleges, run by the West Bengal Joint Entrance Examinations Board. This page follows the WBJEE-2026 Information Bulletin and the Board's 2026 counselling notices."
    coaching_href: "coaching-jee.html"
    colleges_href: "colleges-btech.html"
    facts:
      - { label: "Conducted by", value: "WBJEEB, Salt Lake, Kolkata", source: wb-ib }
      - { label: "Class 12", value: "45% in three subjects (40% reserved) · English 30%", source: wb-ib }
      - { label: "Papers", value: "Maths 75 Q · Physics &amp; Chemistry 80 Q · 2 h each", source: wb-ib }
      - { label: "Application fee", value: "₹500 General male · ₹200–₹400 others", source: wb-ib }
    official:
      - { label: "wbjeeb.nic.in", url: "https://wbjeeb.nic.in/wbjee/" }
      - { label: "Information Bulletin 2026 (PDF)", url: "https://cdnbbsr.s3waas.gov.in/s3d2a27e83d429f0dcae6b937cf440aeb1/uploads/2026/03/202603101506582412.pdf" }
    sections:
      - id: overview
        nav: "Overview"
        eyebrow: "Overview &amp; governing body"
        heading: "One pen-and-paper test, two merit ranks"
        parts:
          - p: "The <strong>West Bengal Joint Entrance Examinations Board (WBJEEB)</strong>, set up by the state government in 1962 and empowered by West Bengal Act XIV of 2014, conducts WBJEE for undergraduate Engineering, Technology, Pharmacy and Architecture admissions for 2026-27 and runs the online counselling. Unlike most entrances, WBJEE is still an <strong>offline OMR test</strong> with two papers."
            source: wb-ib
          - table:
              caption: "WBJEE-2026 timetable (Sunday 24 May 2026)"
              head: ["Paper", "Time"]
              rows:
                - ["Paper I — Mathematics", "11:00 am – 1:00 pm"]
                - ["Paper II — Physics &amp; Chemistry", "2:00 pm – 4:00 pm"]
            source: wb-ib
          - list:
              - "<strong>Both papers</strong> → a General Merit Rank (GMR) and a Pharmacy Merit Rank (PMR): eligible for all engineering and pharmacy courses."
              - "<strong>Paper II only</strong> → PMR only: pharmacy courses (except at Jadavpur University)."
              - "<strong>Paper I only</strong> → no rank at all."
            source: wb-ib
          - p: "Results were published on 18 June 2026. After centralised e-counselling, the Board ran a new <strong>common online decentralised counselling</strong> for the seats left vacant, open to WBJEE-2026 rank holders, JEE (Main)-2026 rank holders and, where permitted, candidates on Class 12 merit."
            source: wb-dec
          - warn: "The WBJEE-2027 bulletin was not published on 15 October 2026. Earlier sites quoting a computer-based WBJEE are wrong — the 2026 bulletin describes an OMR (pen-and-paper) test."
            source: wb-ib
      - id: eligibility
        nav: "Eligibility"
        eyebrow: "Strict academic eligibility"
        heading: "45% in three subjects, a pass in English, age 17"
        parts:
          - list:
              - "<strong>Citizenship:</strong> Indian, or OCI (OCI candidates compete only for unreserved All-India-quota seats)."
              - "<strong>Class 12:</strong> passed before 2026 or appearing in 2026."
              - "<strong>Age:</strong> at least 17 on 31 Dec 2026 (born on or before 31 Dec 2009); no upper limit, except 25 years for degree-level Marine Engineering."
            source: wb-ib
          - table:
              caption: "Minimum marks in 10+2"
              head: ["Course", "Rule"]
              rows:
                - ["Engineering / Technology (general rule)", "45% (40% for SC, ST, OBC-A, OBC-B, PwD) in three subjects from AICTE Table 8.4 (or a D.Voc. in the same or allied sector); pass in English with 30%"]
                - ["Pharmacy", "Physics, Chemistry and Mathematics/Biology with 45% (40% reserved) taken together; English 30%"]
                - ["Architecture", "50% in PCM and 50% aggregate in 10+2, and a NATA qualification (Council of Architecture norms)"]
                - ["Jadavpur University — Engineering", "60% PCM and 60% Maths (General/EWS); 54% OBC-A/B; 45% SC/ST/PwD"]
                - ["University of Calcutta — B.Tech", "60% in the three subjects (55% reserved)"]
            source: wb-ib
          - note: "The bulletin lists separate, stricter rules for several universities (Calcutta, Jadavpur, WBUAFS, Aliah, JIS, Techno India, Adamas, Sister Nivedita, Neotia). The bulletin sets no limit on the number of attempts."
            source: wb-ib
      - id: scheme
        nav: "Exam scheme"
        eyebrow: "Exam scheme &amp; marking matrix"
        heading: "Three question types, three different negatives"
        parts:
          - table:
              caption: "WBJEE-2026 question paper (all MCQs, four options)"
              head: ["Subject", "Category 1 (1 mark)", "Category 2 (2 marks)", "Category 3 (2 marks)", "Total questions", "Marks"]
              rows:
                - ["Mathematics", "50", "15", "10", "75", "100"]
                - ["Physics", "30", "5", "5", "40", "50"]
                - ["Chemistry", "30", "5", "5", "40", "50"]
            source: wb-ib
          - table:
              caption: "Marking matrix"
              head: ["Type", "Correct options", "Correct", "Wrong"]
              rows:
                - ["Category 1", "One", "+1", "−¼"]
                - ["Category 2", "One", "+2", "−½"]
                - ["Category 3", "One or more", "+2 (partial credit: 2 × marked correct ÷ total correct, if no wrong option is marked)", "0 — no negative marking"]
            source: wb-ib
          - list:
              - "Answers are marked on an OMR sheet with a blue/black ball pen supplied by the Board; marks cannot be changed once made."
              - "Marking more than one option in Category 1 or 2 counts as wrong."
              - "GMR = total of Paper I and Paper II; PMR = Paper II only. Ties are broken first by fewer negative marks in all three subjects together, then more positive marks in Maths + Physics, and so on."
              - "Admission to Engineering, Technology and Architecture — and to Jadavpur University pharmacy — uses the GMR alone; category ranks only show your position within your category."
            source: wb-ib
      - id: reservation
        nav: "Domicile &amp; quotas"
        eyebrow: "Reservation &amp; home-state quotas"
        heading: "West Bengal domicile decides most seats"
        parts:
          - list:
              - "<strong>Domicile needed</strong> for: any seat (including General) in a Government or Government-aided engineering, technology or pharmacy college; any seat in B.Tech Dairy Technology at WBUAFS; <strong>90% of the General seats at Jadavpur University</strong>; any reserved seat (SC, ST, OBC-A, OBC-B, PwD, TFW, EWS) in any institute; and admission to Aliah University."
              - "<strong>Who is a domicile:</strong> lived in West Bengal continuously for at least 10 years as of 31 Dec 2025, or a parent is a permanent resident of West Bengal (certificate in proforma A1, A2 or B, or two of the parent's Voter ID, Aadhaar, passport or ration card)."
            source: wb-ib
          - table:
              caption: "Special seats under WBJEE-2026"
              head: ["Quota", "Rule"]
              rows:
                - ["SC / ST / OBC-A / OBC-B / EWS / PwD", "As per West Bengal rules; numbers declared before counselling. Only WB-domiciled Indian citizens; OBC must be non-creamy layer"]
                - ["Tuition Fee Waiver (TFW)", "WB domicile and family income under ₹2.5 lakh a year; waives tuition only"]
                - ["Defence quota", "13 supernumerary seats for wards of defence personnel, through the Rajya Sainik Board; a GMR is compulsory"]
                - ["JEE (Main) seats", "Up to 10% of approved seats in all self-financed engineering colleges"]
            source: wb-ib
          - note: "OBC-A / OBC-B reservation is subject to the Supreme Court case arising from the Calcutta High Court's 22 May 2024 judgment (SLP (C) 17751-17755 of 2024)."
            source: wb-ib
      - id: fees
        nav: "Application &amp; fees"
        eyebrow: "Application steps &amp; fees"
        heading: "Fees by category and gender"
        parts:
          - table:
              caption: "WBJEE-2026 application fee (no bank service charge)"
              head: ["Category", "Male", "Female", "Third gender"]
              rows:
                - ["General", "₹500", "₹400", "₹300"]
                - ["SC / ST / OBC-A / OBC-B / EWS / PwD / TFW", "₹400", "₹300", "₹200"]
            source: wb-ib
          - list:
              - "Pay online only — net banking, debit or credit card, UPI or QR code. The fee is never refunded."
              - "Name, parents' names, domicile and date of birth cannot be changed after registration; other fields only in the correction period."
              - "PwD candidates get a 40% fee concession on a written request to the Chairman, WBJEEB, plus 20 minutes per hour of compensatory time and a scribe if needed."
            source: wb-ib
          - note: "Decentralised counselling for vacant seats needs a one-time ₹250 registration fee (non-refundable)."
            source: wb-dec
      - id: horizons
        nav: "Courses &amp; colleges"
        eyebrow: "Career horizons &amp; mapped institutions"
        heading: "Jadavpur, Calcutta and the state's engineering colleges"
        parts:
          - p: "WBJEE ranks are used by state universities such as Jadavpur University, the University of Calcutta, WBUAFS and Aliah University, and by government, government-aided and private engineering and pharmacy colleges; the seat matrix is set by the Director of Technical Education and published before counselling."
            source: wb-ib
          - links:
              - { label: "West Bengal state guide", url: "state-pathways/west-bengal.html" }
              - { label: "B.Tech college finder", url: "colleges-btech.html" }
              - { label: "JEE Main", url: "jee-main.html" }
              - { label: "West Bengal polytechnic admission (JEXPO)", url: "jexpo.html" }
    sources:
      - { id: wb-ib, name: "WBJEEB — Information Bulletin, WBJEE-2026", url: "https://cdnbbsr.s3waas.gov.in/s3d2a27e83d429f0dcae6b937cf440aeb1/uploads/2026/03/202603101506582412.pdf", covers: "Board, timetable, papers and ranks, pattern, marking, ties, eligibility, university rules, domicile, reservation, TFW, defence quota, JEE seats, fees, PwD", checked: 2026-10-15 }
      - { id: wb-dec, name: "WBJEEB — Revised Notification, Common Online Decentralised Counselling 2026 (WBE/EX-56/2026, 1 Sep 2026) and result notice (18 Jun 2026)", url: "https://cdnbbsr.s3waas.gov.in/s3d2a27e83d429f0dcae6b937cf440aeb1/uploads/2026/09/202609011701958807.pdf", covers: "result date, decentralised counselling, eligible rank sources, ₹250 fee", checked: 2026-10-15 }

  # ---------------------------------------------------------------- GUJCET
  - slug: gujcet
    short: "GUJCET (Gujarat)"
    stream: engineering
    checked: 2026-10-15
    body: "Gujarat Secondary and Higher Secondary Education Board (GSEB), Gandhinagar"
    eyebrow: "State Entrance · Engineering &amp; Pharmacy · 2026 cycle"
    title: "GUJCET — eligibility, marking, ACPC merit &amp; quotas, fees"
    lede: "The Gujarat Common Entrance Test, held by GSEB for Class 12 Science students. Half of your ACPC merit for Gujarat's degree engineering and pharmacy seats comes from it. This page follows the GUJCET-2026 information booklet, GSEB notices and ACPC's 2026-27 files."
    coaching_href: "coaching-jee.html"
    colleges_href: "colleges-btech.html"
    facts:
      - { label: "Conducted by", value: "GSEB, Gandhinagar", source: gj-book }
      - { label: "Papers", value: "40 MCQs per subject · 1 mark each", source: gj-book }
      - { label: "Negative marking", value: "−0.25 per wrong answer", source: gj-book }
      - { label: "Fee", value: "₹350 for everyone", source: gj-book }
    official:
      - { label: "gseb.org", url: "https://www.gseb.org/" }
      - { label: "GUJCET-2026 booklet (PDF)", url: "https://gseb.org/GUJCETBooklet(English).pdf" }
      - { label: "ACPC B.E./B.Tech", url: "https://acpc.gujarat.gov.in/be-b-tech" }
    sections:
      - id: overview
        nav: "Overview"
        eyebrow: "Overview &amp; governing bodies"
        heading: "GSEB sets the test, ACPC uses the score"
        parts:
          - p: "GUJCET is conducted by the <strong>Gujarat Secondary and Higher Secondary Education Board (GSEB)</strong> under the state Education Department's resolution of 19 November 2016, for Class 12 Science students of Group A (Maths), Group B (Biology) and Group AB who seek <strong>degree engineering and degree / diploma pharmacy</strong>. It is not used for medical admission."
            source: gj-book
          - p: "The merit list itself is made by the <strong>Admission Committee for Professional Courses (ACPC)</strong> at L. D. College of Engineering, Ahmedabad."
            source: gj-book
          - p: "For 2026 the online form was open from <strong>16 to 30 December 2025</strong> on gseb.org and gujcet.gseb.org."
            source: gj-reg
          - p: "The test was held on <strong>29 March 2026</strong> in three sessions: Physics/Chemistry, then Biology, then Mathematics."
            source: gj-press
          - table:
              caption: "GUJCET-2026 in numbers"
              head: ["Group", "Registered", "Appeared"]
              rows:
                - ["A (Mathematics)", "58,507", "56,865"]
                - ["B (Biology)", "77,182", "75,188"]
                - ["AB (both)", "382", "266"]
                - ["Total", "1,36,071", "1,32,319"]
            source: gj-rb
          - warn: "GSEB had not announced GUJCET-2027 on 15 October 2026. The 2026 registration opened in mid-December, so watch gseb.org from December 2026."
            source: gj-reg
      - id: eligibility
        nav: "Eligibility"
        eyebrow: "Academic eligibility"
        heading: "Who can sit GUJCET — and who needs it"
        parts:
          - list:
              - "Students who passed, or are appearing for, Class 12 Science in a GSEB school, or in a <strong>CBSE or CISCE school located in Gujarat</strong>."
              - "Children of Gujarat-origin central/state government, military or PSU employees posted in other states, who study Class 12 Science there."
              - "Others eligible under ACPC's admission rules."
              - "Every year a fresh application is needed; only one form per candidate; no documents are attached."
            source: gj-book
          - list:
              - "<strong>Minimum marks for any engineering seat:</strong> Class 12 with at least 45% (40% for reserved categories) in the subjects AICTE prescribes."
              - "<strong>Gujarat-quota seats</strong> (95% of Government / Grant-in-Aid intake and 50% of unaided intake) need schooling from a valid board located in Gujarat <strong>and</strong> a GUJCET-2026 attempt."
            source: acpc-advt
      - id: scheme
        nav: "Exam scheme"
        eyebrow: "Exam scheme &amp; marking matrix"
        heading: "Three OMR papers, −¼ for a wrong answer"
        parts:
          - table:
              caption: "GUJCET-2026 scheme (OMR, multiple-choice, one correct option of four)"
              head: ["Paper", "Questions", "Marks", "Time"]
              rows:
                - ["Physics + Chemistry (one combined paper)", "40 + 40", "80", "120 minutes"]
                - ["Biology", "40", "40", "60 minutes"]
                - ["Mathematics", "40", "40", "60 minutes"]
            source: gj-book
          - list:
              - "<strong>Marking:</strong> +1 for a correct answer; <strong>−0.25</strong> for a wrong answer; −1 if two or more options are marked for one question."
              - "<strong>Medium:</strong> Gujarati, Hindi or English, chosen in the form."
              - "<strong>Syllabus:</strong> the NCERT-based (reduced) Class 12 Science syllabus adopted by GSEB for 2025-26."
              - "Question booklets come in types 1 to 20; GSEB publishes a provisional answer key and takes objections before the final key."
            source: gj-book
          - p: "On 29 March 2026 the three sessions were Physics/Chemistry (1,32,450 present), Biology (75,514) and Mathematics (57,158)."
            source: gj-press
      - id: reservation
        nav: "Merit &amp; quotas"
        eyebrow: "Reservation &amp; home-state quotas"
        heading: "50% board + 50% GUJCET, then category seats"
        parts:
          - table:
              caption: "ACPC degree engineering seats, 2026-27"
              head: ["Seats", "Who is eligible", "Merit"]
              rows:
                - ["95% of Govt / Grant-in-Aid intake; 50% of unaided intake", "Gujarat-located schooling + GUJCET-2026", "50% board theory percentile (Maths, Physics, Chemistry — or Biology for eligible branches) + 50% GUJCET percentile"]
                - ["5% of Govt / Grant-in-Aid intake", "Any board in India (including Gujarat) + JEE (Main) 2026", "JEE (Main) All India Rank"]
            source: acpc-advt
          - p: "ACPC's GUJCET seat matrix splits every course's seats into <strong>SC, ST, SEBC, EWS, DS and Open</strong>, each with a PH sub-quota, plus a TFWS column. For example, Civil Engineering at the Government Engineering College, Surat has 143 GUJCET seats: SC 10, ST 22, SEBC 39, EWS 14, DS 1 and Open 57."
            source: acpc-sm
          - note: "The same seat matrix lists tuition fees (for example ₹1,500 for boys and nil for girls at government colleges) and hostel facilities, institute by institute."
            source: acpc-sm
      - id: fees
        nav: "Application &amp; fees"
        eyebrow: "Application steps &amp; fees"
        heading: "₹350 to GSEB, ₹350 to ACPC"
        parts:
          - list:
              - "<strong>GUJCET fee: ₹350</strong>, online through SBIePay (credit/debit card, net banking) or by the 'SBI Branch Payment' option at any SBI branch. After paying, completing the full form is compulsory."
              - "Copy of your OMR sheet after the result: ₹200 per OMR, applied for online."
            source: gj-book
          - list:
              - "<strong>ACPC registration: ₹350</strong>, non-refundable, online only — with all documents uploaded. There is no physical document verification."
              - "You can register with ACPC before the board and GUJCET results are out (2026-27: 30 Mar – 31 May 2026)."
            source: acpc-advt
      - id: horizons
        nav: "Courses &amp; colleges"
        eyebrow: "Career horizons &amp; mapped institutions"
        heading: "Degree engineering and pharmacy across Gujarat"
        parts:
          - p: "GUJCET results open ACPC admissions to degree engineering in government, grant-in-aid and self-financed colleges and to degree / diploma pharmacy."
            source: gj-book
          - links:
              - { label: "ACPC (B.E. / B.Tech) — Gujarat hub", url: "state/gujarat/acpc.html" }
              - { label: "GSEB board &amp; GUJCET — Gujarat hub", url: "state/gujarat/gseb.html" }
              - { label: "B.Tech college finder", url: "colleges-btech.html" }
              - { label: "B.Pharm college finder", url: "colleges-bpharm.html" }
    sources:
      - { id: gj-book, name: "GSEB — GUJCET-2026 Information Booklet (English)", url: "https://gseb.org/GUJCETBooklet(English).pdf", covers: "purpose, eligibility, exam scheme, marking, medium, fee, OMR copy, merit rule", checked: 2026-10-15 }
      - { id: gj-reg, name: "GSEB — Press note, GUJCET-2026 registration (15 Dec 2025, Gujarati)", url: "https://www.gsebeservice.com/assets/news/Press%20Note%20for%20GUJCET%20Registration-2026.pdf", covers: "registration window and fee", checked: 2026-10-15 }
      - { id: gj-press, name: "GSEB — Press note on GUJCET-2026 exam day (29 Mar 2026, Gujarati)", url: "https://www.gsebeservice.com/assets/news/Press%20For%20Gujcet-2026.pdf", covers: "three sessions and attendance", checked: 2026-10-15 }
