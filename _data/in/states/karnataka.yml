        parts:
          - list:
              - "Regular II PUC students are registered by their college principal on the board portal, using each student's SATS number; any correction to name or details must be made in SATS first."
              - "Repeater and private candidates register separately through the board's registration links (circulars of 13 October 2026)."
              - "The student photograph must be a .jpg file of 20–80 KB."
            source: pu-reg
      - id: scheme
        nav: "Exam Scheme"
        eyebrow: "Exam scheme"
        heading: "Exam-1 and Exam-2"
        parts:
          - list:
              - "SSLC first-language papers carry 100 marks (3 hours 15 minutes); core subjects and second language 80 marks; third language 80 marks (2 hours 45 minutes); NSQF vocational subjects 60 marks."
              - "Candidates with disabilities get extra time: 60 minutes on a 3-hour paper, 50 minutes on 2½ hours, 40 minutes on 2 hours, 30 minutes on 1½ hours."
              - "Each paper starts with 15 minutes to read the question paper."
            source: sslc-tt
          - p: "SSLC Exam-2 in May 2027 repeats the pattern: first language on 24 May, Science / Political Science on 25 May, second language on 26 May, Mathematics / Sociology on 27 May and third language / NSQF on 28 May 2027 (tentative)."
            source: sslc-tt2
          - note: "Most II PUC theory papers are 80 marks (Physics, Chemistry, Biology, Computer Science and some others 70) and 3 hours; NSQF subjects are 60 marks in 2 hours 15 minutes."
            source: pu-tt
      - id: fees
        nav: "Fees"
        eyebrow: "Fee structure"
        heading: "SSLC exam fee 2026-27"
        parts:
          - table:
              caption: "SSLC fee, revised by 5% under the government order of 11 Jun 2020 (memo of 10 Sep 2026)"
              head: ["Item", "2025-26", "2026-27"]
              rows:
                - ["SSLC exam fee — first-time school / private candidates", "₹710", "₹746"]
                - ["New private-candidate registration + application", "₹248", "₹260"]
                - ["Renewal for earlier-registered private candidates", "₹72", "₹76"]
                - ["Repeater — one subject", "₹448", "₹470"]
                - ["Repeater — two subjects", "₹559", "₹587"]
                - ["Repeater — three or more subjects", "₹752", "₹790"]
            source: sslc-fee
          - note: "II PUC fees (marks-card, exam and practical fee) are entered by the college on the registration portal; the manual does not print the amounts."
            source: pu-reg
      - id: reservation
        nav: "Concessions"
        eyebrow: "Concessions"
        heading: "Extra time for candidates with disabilities"
        parts:
          - p: "Candidates with disabilities get extra writing time on every SSLC paper (see the exam scheme above). Other concessions and exemptions are notified separately by the board."
            source: sslc-tt
      - id: documents
        nav: "Documents"
        eyebrow: "Registration checklist"
        heading: "What the college needs"
        parts:
          - list:
              - "SATS number and correct SATS details of the student."
              - "Mobile number of the student."
              - "Photograph (.jpg, 20–80 KB)."
              - "Fee details (marks-card fee, exam fee, practical fee) as shown on the portal; print the registration slip after submission."
            source: pu-reg
      - id: pay
        nav: "Next Steps"
        eyebrow: "After the board"
        heading: "Where II PUC marks count"
        parts:
          - p: "II PUC marks count in KCET ranking: engineering ranks use PCM marks of the qualifying exam and CET in equal proportion, and KCET uses results of KSEAB's annual and improvement exams."
            source: kcet-link
      - id: posting
        nav: "Official Links"
        eyebrow: "Official links"
        heading: "Where to check updates"
        parts:
          - note: "All time tables here are tentative. Final time tables, hall tickets and results are published only on kseab.karnataka.gov.in."
          - links:
              - { label: "KSEAB website", url: "https://kseab.karnataka.gov.in/" }
              - { label: "KCET (UGCET) on this site", url: "state/karnataka/kcet.html" }
