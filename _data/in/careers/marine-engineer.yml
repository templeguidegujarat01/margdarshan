sections:
  - id: "quick"
    hid: "quick-heading"
    alt: true
    eyebrow: "Quick answers"
    heading: "Marine Engineer at a glance"
    intro: "Check whether your Class 12 background qualifies. Duration and pay are in the summary at the top of the page."
    parts:
      - subhead: "Can I apply from my stream?"
      - streams:
          - label: "Science"
            fit: "Eligible"
            tone: "y"
            icon: "science"
          - label: "Commerce"
            fit: "Not eligible"
            tone: "n"
            icon: "commerce"
          - label: "Arts / Humanities"
            fit: "Not eligible"
            tone: "n"
            icon: "arts"
      - note: "Class 12 with Physics, Chemistry and Mathematics is required."
  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What does a Marine Engineer do?"
    parts:
      - overview:
          points:
            - "Marine engineers run and repair the main engine, generators, boilers, purifiers, refrigeration and steering gear, and keep engine-room watches."
            - "The ladder is <strong>Engine Cadet → Fourth Engineer → Third Engineer → Second Engineer → Chief Engineer</strong>."
            - "Shore careers later include ship superintendent, marine surveyor and engine-maker service engineer."
  - id: "who"
    hid: "who-heading"
    alt: true
    eyebrow: "Fit check"
    heading: "Who should become a Marine Engineer"
    parts:
      - fit:
          match:
            - "Enjoy hands-on mechanical work and solving breakdowns."
            - "Can handle heat, noise and long contracts at sea."
            - "Want a high-paying engineering career that rewards certificates."
          mismatch:
            - "Want a desk job ashore from day one."
            - "Cannot be away from family for months."
            - "Cannot meet DG Shipping medical standards."
  - id: "eligibility"
    hid: "elig-heading"
    eyebrow: "Eligibility"
    heading: "What you need, stage by stage"
    parts:
      - elig_list:
          - "Class 12 with <strong>Physics, Chemistry and Mathematics (60% average)</strong> and <strong>50% in English</strong> in Class 10 or 12, for IMU programmes."
          - "A valid <strong>IMU CET</strong> rank for B.Tech Marine Engineering at IMU and DG Shipping-approved institutes."
          - "Age limits, medical fitness and eyesight standards as per the IMU notice and DG Shipping rules."
          - "Mechanical/electrical graduates can enter through DG Shipping-approved graduate marine engineering (GME) courses."
  - id: "roadmap"
    hid: "roadmap-heading"
    alt: true
    eyebrow: "Step-by-step"
    heading: "Your full path to becoming a Marine Engineer"
    parts:
      - steps:
          - title: "Class 12 PCM"
            text: "Keep PCM and English marks above the IMU minimums."
          - title: "IMU CET"
            text: "Rank decides your institute."
          - title: "B.Tech Marine Engineering"
            text: "4 years with workshop and ship-in-campus training."
          - title: "Engine Cadet sea time"
            text: "Onboard training to complete the sea time for the first certificate."
          - title: "MEO Class IV"
            text: "DG Shipping exams; sail as Fourth Engineer."
          - title: "MEO Class II and Class I"
            text: "More sea time and exams lead to Second and Chief Engineer."
  - id: "exams"
    hid: "exams-heading"
    eyebrow: "Exams & licences"
    heading: "IMU CET and MEO certificates"
    parts:
      - chips:
          - label: "IMU CET"
            text: "Entrance for IMU and DG Shipping-approved marine engineering programmes."
            source: "imu"
          - label: "MEO certificates"
            text: "Marine Engineer Officer Class IV, III, II and I, each with sea time and DG Shipping written/oral exams."
            source: "dgs"
          - label: "Approved institutes only"
            text: "DG Shipping publishes the list of approved maritime training institutes."
            source: "dgs"
  - id: "salary"
    hid: "salary-heading"
    alt: true
    eyebrow: "Indicative figures"
    heading: "Marine Engineer pay in India"
    intro: "Private-sector pay varies a lot by employer and city; these are broad, commonly reported ranges, not guarantees."
    parts:
      - salary:
          - label: "Engine Cadet"
            value: "Stipend"
            text: "A training stipend while at sea."
          - label: "Fourth / Third Engineer"
            value: "Strong for the age"
            text: "Rises once you hold MEO certificates."
          - label: "Chief Engineer"
            value: "Very high"
            text: "Among the highest-paid seafarers on foreign-going ships."
  - id: "jobs"
    hid: "jobs-heading"
    eyebrow: "Where they work"
    heading: "Employers & growth path"
    parts:
      - chips:
          - label: "Employers"
            text: "Shipping and ship-management companies, offshore vessels, shipyards, engine makers"
          - label: "Growth path"
            text: "Engine Cadet → 4th → 3rd → 2nd → Chief Engineer → Technical Superintendent"
          - label: "Ashore"
            text: "Marine surveyor, classification society, ship repair, maritime training"
  - id: "proscons"
    hid: "pc-heading"
    alt: true
    eyebrow: "Honest take"
    heading: "Advantages and disadvantages"
    parts:
      - proscons:
          pros:
            - "High pay with certificates; global demand."
            - "Strong engineering skills that also work ashore."
            - "Exam-based, transparent promotions."
          cons:
            - "Months at sea, hot and noisy work."
            - "Cadet berths can be hard to find."
            - "Strict ongoing medical checks."
  - hid: "related-heading"
    alt: true
    eyebrow: "Related careers"
    heading: "If you're considering Marine Engineer, also look at"
    parts:
      - related:
          - name: "Merchant Navy Deck Officer"
            sub: "Ship navigation & command"
            href: "merchant-navy-officer.html"
          - name: "Mechanical Engineering"
            sub: "Machines & manufacturing"
            href: "mechanical.html"
          - name: "Merchant Navy hub"
            sub: "IMU CET basics"
            href: "niche-careers/maritime.html"
          - name: "Aircraft Maintenance Engineer"
            sub: "DGCA-licensed engineering"
            href: "aircraft-maintenance-engineer.html"
  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Can I become a marine engineer after B.Tech Mechanical?"
            a: "Yes, through a DG Shipping-approved graduate marine engineering course and then the MEO certificate route."
          - q: "Is IMU CET compulsory for marine engineering?"
            a: "It is the main admission route for IMU and DG Shipping-approved institutes; check each institute's notice."
          - q: "What is MEO Class IV?"
            a: "The first Certificate of Competency for engine officers, issued by DG Shipping after sea time and exams."
          - q: "Is marine engineering only a sea job?"
            a: "Most start at sea; with experience many move ashore as superintendents or surveyors."
      - note: "*Pay figures are indicative unless they quote an official pay level, and rules change: confirm eligibility, dates and fees on the official websites listed under Sources before you act."
        class: "table-note mt-lg"
