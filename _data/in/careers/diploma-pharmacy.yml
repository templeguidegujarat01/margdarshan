  - id: "fees"
    hid: "fees-heading"
    eyebrow: "Relatively affordable overall"
    heading: "Fees & scholarships"
    parts:
      - prose:
          - "Government-run and government-aided D.Pharm colleges are generally the most affordable option, often in the range of <strong>₹20,000-70,000</strong> for the full 2-year course. Private pharmacy colleges typically charge more, often <strong>₹60,000-1.5 lakh per year</strong>, varying by state and college reputation. Merit-based and income-linked scholarships are available at most government institutions. Always confirm current fees directly with your target institute's admission office."
