sections:
  - id: "quick"
    hid: "quick-heading"
    alt: true
    eyebrow: "Quick answers"
    heading: "Geologist at a glance"
    intro: "Check whether your Class 12 background qualifies. Duration and pay are in the summary at the top of the page."
    parts:
      - subhead: "Can I apply from my stream?"
      - streams:
          - label: "Science"
            fit: "Eligible"
            tone: "y"
            icon: "science"
          - label: "Commerce"
            fit: "Not eligible"
            tone: "n"
            icon: "commerce"
          - label: "Arts / Humanities"
            fit: "Not eligible"
            tone: "n"
            icon: "arts"
      - note: "Class 12 Science leads to B.Sc Geology (PCM is the most common background)."
  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What does a Geologist do?"
    parts:
      - overview:
          points:
            - "Geologists map rocks, explore for minerals, coal, oil and gas, study groundwater and assess sites for dams, tunnels and buildings."
            - "They study natural hazards like landslides and earthquakes, and advise on environmental impacts."
            - "Field work, lab analysis and GIS/remote sensing are all part of the job."
  - id: "who"
    hid: "who-heading"
    alt: true
    eyebrow: "Fit check"
    heading: "Who should become a Geologist"
    parts:
      - fit:
          match:
            - "Love the outdoors, maps and natural science."
            - "Are comfortable with long field trips."
            - "Want a science career with government and industry routes."
          mismatch:
            - "Dislike travel and rough field conditions."
            - "Want a quick job after B.Sc — most good roles need an M.Sc."
            - "Prefer office-only work."
  - id: "eligibility"
    hid: "elig-heading"
    eyebrow: "Eligibility"
    heading: "What you need, stage by stage"
    parts:
      - elig_list:
          - "For UPSC geologist posts: a <strong>master's degree in Geology, Applied Geology</strong> or another earth-science subject listed in the notice."
          - "Age limits and relaxations as per the current UPSC notice."
          - "Private-sector roles usually ask for an M.Sc or M.Tech in geology or applied geology."
  - id: "roadmap"
    hid: "roadmap-heading"
    alt: true
    eyebrow: "Step-by-step"
    heading: "Your full path to becoming a Geologist"
    parts:
      - steps:
          - title: "Class 12 Science"
            text: "PCM or PCB."
          - title: "B.Sc Geology"
            text: "Or a science degree with geology."
          - title: "M.Sc Geology / Applied Geology"
            text: "Needed for most professional roles."
          - title: "UPSC Combined Geo-Scientist"
            text: "Prelims, mains and personality test."
          - title: "Join GSI / CGWB"
            text: "Or mining, petroleum, consulting or research."
      - roadmap_card: "Geologist"
  - id: "exams"
    hid: "exams-heading"
    eyebrow: "Exams & licences"
    heading: "UPSC Combined Geo-Scientist Examination"
    parts:
      - chips:
          - label: "Stage I"
            text: "Preliminary examination (objective)."
            source: "upsc"
          - label: "Stage II"
            text: "Main examination (descriptive)."
            source: "upsc"
          - label: "Stage III"
            text: "Personality test."
            source: "upsc"
          - label: "Posts"
            text: "Geologist, Geophysicist, Chemist and Hydrogeologist in central bodies."
            source: "upsc"
  - id: "salary"
    hid: "salary-heading"
    alt: true
    eyebrow: "Official pay level"
    heading: "Geologist pay in India"
    intro: "UPSC geoscientist posts are Group A central posts on the 7th CPC pay matrix; private pay varies widely."
    parts:
      - salary:
          - label: "Government entry"
            value: "Level 10"
            text: "Group A central services start at Level 10 of the 7th CPC pay matrix (₹56,100 entry basic), plus DA, HRA and other allowances."
          - label: "Private sector"
            value: "Varies"
            text: "Mining, oil & gas and consulting firms; field allowances add up."
          - label: "Senior"
            value: "Higher levels"
            text: "Director-level posts in GSI and other bodies."
  - id: "jobs"
    hid: "jobs-heading"
    eyebrow: "Where they work"
    heading: "Employers & growth path"
    parts:
      - chips:
          - label: "Government"
            text: "Geological Survey of India, Central Ground Water Board, state mining and groundwater departments"
          - label: "Private"
            text: "Mining companies, oil & gas, geotechnical consultancies, environmental firms"
          - label: "Research"
            text: "Universities, IITs and national geoscience institutes (often via NET/PhD)"
  - id: "proscons"
    hid: "pc-heading"
    alt: true
    eyebrow: "Honest take"
    heading: "Advantages and disadvantages"
    parts:
      - proscons:
          pros:
            - "Clear UPSC route into Group A posts."
            - "Field-based, science-rich work."
            - "Demand in mining, water and infrastructure."
          cons:
            - "Few UPSC vacancies each year."
            - "Remote field postings."
            - "M.Sc usually needed."
  - hid: "related-heading"
    alt: true
    eyebrow: "Related careers"
    heading: "If you're considering Geologist, also look at"
    parts:
