  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What is BCA?"
    parts:
      - overview:
          points:
            - "BCA is a 3-year undergraduate degree focused on computer applications, programming, software development, database management and web technologies."
            - "Redefined under <strong>National Education Policy (NEP) 2020</strong>, most modern BCA programmes now build in real specialisation tracks — cybersecurity, data analytics and cloud computing — alongside the core programming curriculum."
            - "Its defining feature is accessibility: unlike a B.Tech in Computer Science, BCA needs no JEE and no PCM background, making it a genuinely open door into IT for students from any Class 12 stream."
          more:
            - "What it trades off is the deeper engineering theory and stronger top-end brand recognition of a 4-year CSE degree, especially from Indian Institutes of Technology (IITs) and National Institutes of Technology (NITs)."
  - id: "who"
    hid: "who-heading"
    alt: true
    eyebrow: "Fit check"
    heading: "Who should choose BCA"
    parts:
      - fit:
          match:
            - "Want a software/IT career but didn't take PCM, or don't want to go through JEE."
            - "Want a shorter, generally more affordable route into technology than a 4-year engineering degree."
            - "Are willing to add real projects and certifications to compete with CSE graduates for the same roles."
          mismatch:
            - "Specifically want IIT/NIT-tier brand recognition and the highest starting packages — CSE at top colleges wins here."
            - "Want the deepest engineering-level theory — computer architecture, VLSI-adjacent hardware — which BCA covers more lightly than a B.Tech."
            - "Expect the degree alone, without any added skills, to close the salary gap with CSE — it generally doesn't on its own."
