              rows:
                - ["Ball (new)", "<strong>155.9–163 g</strong>; circumference 22.4–22.9 cm"]
                - ["Bat length", "Not more than <strong>96.52 cm (38 in)</strong>; the handle no more than 52% of it"]
                - ["Blade", "<strong>Wood only</strong>; width ≤ 10.8 cm, depth ≤ 6.7 cm, edges ≤ 4.0 cm, and it must pass the bat gauge"]
            source: icc-test
          - table:
