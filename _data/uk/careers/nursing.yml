lede: "A <strong>3-year nursing degree</strong> approved by the NMC, or a <strong>nursing degree apprenticeship</strong>. Then you join the <strong>NMC register</strong>."
checked: 2026-10-23
in_page: nursing.html
us_pathway: nursing
