    heading: "Lateral entry & higher studies"
    parts:
      - prose:
          - "<strong>Lateral entry</strong> is the standard upgrade path — diploma holders can join the second year of a <strong>B.Tech/B.E. in Computer Science or Computer Engineering</strong> directly, through a state lateral entry exam or quota, at AICTE-approved engineering colleges. Many diploma holders also strengthen their profile through independent coding practice, competitive programming platforms, or short certifications in specific technologies (web frameworks, cloud basics), since a strong personal portfolio genuinely helps compete for better roles."
