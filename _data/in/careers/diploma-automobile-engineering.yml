  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Is Automobile Engineering different from Mechanical Engineering?"
            a: "Automobile Engineering is a specialised branch focused specifically on vehicles — engines, transmission, chassis and increasingly, electric vehicle systems. Mechanical Engineering is broader, covering machines and manufacturing generally. Automobile diploma holders get deeper, vehicle-specific training, while Mechanical offers wider industry flexibility."
          - q: "Is this diploma still relevant given the shift to electric vehicles?"
            a: "Yes, and increasingly so. While traditional engine/transmission knowledge remains useful for the large existing fleet of petrol/diesel vehicles, EV-specific skills — battery systems, electric motors and vehicle electronics — are becoming a genuinely valuable addition, and many diploma programmes are updating curricula to include EV content."
          - q: "Can I work at a car manufacturing company with this diploma?"
            a: "Yes, this is one of the most common outcomes — automobile diploma holders work in production, quality control and assembly-line roles at car and two-wheeler manufacturing plants, alongside service and maintenance roles at dealerships and service centres."
          - q: "Do I need to learn about electric vehicles separately, or is it part of the diploma?"
            a: "This varies by institute — some updated curricula now include EV-specific modules, while others still focus primarily on conventional vehicles. It's worth checking your target institute's current syllabus, and considering a short add-on EV certification course if it's not covered in depth."
          - q: "What jobs can I get with just this diploma, without a further degree?"
            a: "Common roles include service/maintenance technician, quality control inspector, production supervisor, and service advisor at vehicle manufacturers, dealerships and service centres — genuine, established career options directly after the diploma."
      - note: "*Fee and salary figures are indicative, based on publicly available information as of 2026, and vary significantly by state, institute and employer — always verify current figures on your state technical education board's official website."
