# Journey Blueprint — Ophthalmologist (MBBS → NEET-PG → M.S. Ophthalmology). Printed on journey-ophthalmologist.html.
# Rules, classes and the money items / sources several careers share: _data/in/journey_common.yml.
# NEET-PG (npg26), PGMER 2023 (pgmer23) and their money items live in journey/gynaecologist.yml — reused here.
id: ophthalmologist
v: 2
name: "Ophthalmologist / Eye Surgeon (MBBS → NEET-PG → M.S. Ophthalmology)"
search: ["ophthalmologist", "ophthalmology", "eye surgeon", "eye doctor", "ms ophthalmology", "cataract surgeon"]
search_not: ["optometrist", "optician"]
page: "neet-pg.html"
doubts_page: "journey-ophthalmologist.html"
gate: "Class 12 with Physics, Chemistry and Biology → NEET (UG) → MBBS with a 12-month internship → NEET-PG → a 3-year M.S. (Ophthalmology). An optometrist is a different, non-MBBS profession."
gate_source: [neet-ib, npg26, pgmer23]
core:
  what:
    text: "An ophthalmologist is a medical doctor who diagnoses eye disease and performs eye surgery. M.S. (Ophthalmology) is one of the six M.S. degrees recognised under the National Medical Commission's PG regulations."
    source: pgmer23
  day:
    - "Examine eyes, diagnose disease and prescribe treatment."
    - "Operate — cataract, glaucoma, retina and other eye surgery."
    - "Work with optometrists who test vision and fit lenses."
  pay_note: "No 2026 central notice for an ophthalmology specialist post was found, so no pay figure is printed. PG residents are paid a stipend (see Money help)."
  routes:
    - { title: "MBBS → NEET-PG → M.S. (Ophthalmology)", text: "NEET-PG is the single entrance for M.D. / M.S. / PG Diploma seats: All India 50% quota, state quota, private and deemed universities and Armed Forces medical institutions.", source: npg26 }
    - { title: "Institutes outside NEET-PG", text: "AIIMS New Delhi and the other AIIMS, PGIMER Chandigarh, JIPMER Puducherry, NIMHANS and SCTIMST are not filled through NEET-PG.", source: npg26 }
    - { title: "Diploma (D.O.)", text: "Ophthalmology (D.O.) is still on NMC's list of PG diplomas, but colleges may convert diploma seats to degree seats and no new diploma programmes are being permitted.", source: pgmer23 }
  cost_time:
    - { label: "Time after Class 12", value: "MBBS with internship, then 3 years of M.S.", source: pgmer23 }
    - { label: "NEET-PG 2026 fee", value: "₹3,500 General / OBC / EWS · ₹2,500 SC / ST / PwBD", source: npg26 }
  cost_note: "College fees for MBBS and M.S. differ by college and state, so none are printed."
  challenges:
    - text: "Two national tests stand between Class 12 and the specialty — NEET (UG) for MBBS and NEET-PG for M.S."
      source: [neet-ib, npg26]
    - text: "Every M.S. student does a compulsory 3-month District Residency in a district hospital."
      source: pgmer23
    - text: "NEET-PG has negative marking: +4 for a correct answer and −1 for a wrong one."
      source: npg26
  not_for:
    - "You want to test eyes and fit glasses without MBBS — that is optometry."
    - "You are uncomfortable with fine, precise surgery."
    - "You cannot commit to MBBS plus 3 more years of residency."
journey:
  - stages: [c8, c9]
    title: "Science first"
    do:
      - text: "NEET (UG) tests Physics, Chemistry and Biology (Botany & Zoology) — 180 compulsory questions in 180 minutes."
        source: neet-ib
    doubts:
      - q: "What is the difference between an ophthalmologist and an optometrist?"
        a: "An ophthalmologist is an MBBS doctor with M.S. (Ophthalmology) who treats eye disease and operates. An optometrist studies a separate allied-health degree and does not take the MBBS and NEET-PG route."
        next: "Read the optometrist blueprint if you do not want MBBS."
        source: [pgmer23, ncahp-opt]
      - q: "Is ophthalmology a surgical branch?"
        a: "Yes. NMC lists it under M.S. (Master of Surgery) degrees, along with General Surgery, Obstetrics and Gynaecology, Orthopaedics, Otorhinolaryngology and Traumatology and Surgery."
        next: "Expect both clinic work and operating."
        source: pgmer23
  - stages: [c10]
    title: "Choose PCB in Class 11"
    do:
      - text: "NEET (UG) needs Physics, Chemistry and Biology in Class 12."
        source: neet-ib
    stream: "Science with Physics, Chemistry, Biology (PCB)."
    doubts:
      - q: "Which stream do I need to become an eye surgeon?"
        a: "Science with Physics, Chemistry and Biology, because MBBS admission is through NEET (UG)."
        next: "Pick PCB after Class 10."
        source: neet-ib
  - stages: [c11, c12]
    title: "Prepare for NEET (UG)"
    do:
      - text: "NEET (UG) 2026: 180 questions, 720 marks, +4 for correct, −1 for wrong."
        source: neet-ib
    money: [neet-fee]
    doubts:
      - q: "What is the minimum age for NEET (UG)?"
        a: "17 years on or before 31 December of the admission year. The NEET (UG) 2026 bulletin says there is no upper age limit."
        next: "Check your date of birth against the rule."
        source: neet-ib
      - q: "Does NEET (UG) have negative marking?"
        a: "Yes — +4 for each correct answer and −1 for each wrong answer, across 180 questions for 720 marks."
        next: "Practise with timed mock tests."
        source: neet-ib
  - stages: [ug]
    title: "MBBS and internship"
    do:
      - text: "NEET-PG 2026 counted internship finished on or before 30 September 2026 for eligibility."
        source: npg26
    money: [mbbs-intern]
    doubts:
      - q: "When do I choose ophthalmology?"
        a: "After MBBS. You pick an M.S. (Ophthalmology) seat in NEET-PG counselling, according to your rank."
        next: "Finish MBBS and the internship first."
        source: [npg26, pgmer23]
      - q: "What is the internship cut-off for NEET-PG?"
        a: "For NEET-PG 2026, the internship had to be completed on or before 30 September 2026."
        next: "Check the cut-off in each year's bulletin."
        source: npg26
  - stages: [grad]
    title: "NEET-PG and M.S. (Ophthalmology)"
    do:
      - text: "NEET-PG 2026: 180 MCQs in 3 hours 30 minutes, English only, +4 / −1; exam on 30 August 2026, result by 30 September 2026."
        source: npg26
      - text: "M.S. courses run 3 years and include a compulsory 3-month District Residency."
        source: pgmer23
    exams:
      - { name: "NEET-PG 2026", when: "30 Aug 2026 · result by 30 Sep 2026", source: npg26, href: "neet-pg.html" }
    money: [npg-fee, pg-stipend]
    doubts:
      - q: "What percentile do I need in NEET-PG?"
        a: "50th percentile for General and EWS, 45th for UR PwBD, and 40th for SC, ST and OBC to qualify."
        next: "Your rank then decides which branch and college you get."
        source: npg26
      - q: "How long is NEET-PG?"
        a: "3 hours 30 minutes for 180 multiple-choice questions in English."
        next: "Build speed with timed full-length mocks."
        source: npg26
      - q: "Which institutes are not part of NEET-PG?"
        a: "AIIMS New Delhi and the other AIIMS, PGIMER Chandigarh, JIPMER Puducherry, NIMHANS Bengaluru and SCTIMST Thiruvananthapuram."
        next: "Read the INI-CET page for these institutes."
        source: npg26
      - q: "Does my state hold its own PG entrance?"
        a: "No. For 2026-27, the NEET-PG bulletin says no state government, private college or university may hold a separate entrance for M.D. / M.S. / PG Diploma seats; states run counselling for their quota using NEET-PG results."
        next: "Register for your state's counselling as well as the All India quota."
        source: npg26
      - q: "How long is M.S. Ophthalmology?"
        a: "Three years under NMC's PGMER 2023, including a 3-month District Residency Programme."
        next: "Plan for three years of residency."
        source: pgmer23
      - q: "Should I take a D.O. diploma seat?"
        a: "Ophthalmology (D.O.) is still a recognised 2-year diploma, but colleges may convert diploma seats to degree seats and no new diploma programmes are being permitted. Diploma holders who later join M.S. in the same subject train for 2 years."
        next: "Compare D.O. and M.S. seats carefully in counselling."
        source: pgmer23
      - q: "Do PG residents get a stipend?"
        a: "Yes, at par with PG students of government medical colleges in that state, as PGMER 2023 requires, including during the District Residency."
        next: "Ask your college for the current rate."
        source: pgmer23
  - stages: [work]
    title: "Already a doctor?"
    do:
      - text: "MBBS doctors with a completed internship can sit NEET-PG in any year they meet the bulletin's cut-off date."
        source: npg26
    doubts:
      - q: "I am a medical officer with MBBS. Can I still become an ophthalmologist?"
        a: "Yes, through NEET-PG, as long as you have MBBS and finished the internship by that year's cut-off date."
        next: "Register for the next NEET-PG on the NBEMS portal."
        source: npg26
board_note: "Any board. NEET (UG) needs Physics, Chemistry and Biology in Class 12."
board_source: neet-ib
