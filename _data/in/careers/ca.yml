  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What is a Chartered Accountant?"
    parts:
      - overview:
          points:
            - "A Chartered Accountant is a finance professional certified by the <strong>ICAI</strong> to practise accounting, auditing, taxation and financial advisory in India."
            - "Unlike <a href=\"bcom.html\">B.Com</a> or <a href=\"bba.html\">BBA</a>, CA is not a university degree — it's a professional qualification earned by clearing three levels of ICAI exams and completing supervised practical training called <strong>articleship</strong>."
            - "CAs are the people companies rely on to prepare and audit financial statements, file taxes correctly, manage financial risk, and advise on everything from mergers to compliance."
          more:
            - "Many go on to become CFOs, start their own practice, or move into strategy and consulting roles."
  - id: "eligibility"
    hid: "elig-heading"
    alt: true
    eyebrow: "Eligibility"
    heading: "Who should choose CA, and when to start"
    intro: "CA suits students who are comfortable with numbers, don't mind years of disciplined self-study, and want a professional qualification rather than a conventional degree."
    parts:
      - elig_cards:
          - icon: "cap"
            title: "After Class 10"
            points:
              - "You can register for CA Foundation provisionally after Class 10, though you can only sit the exam after Class 12."
              - "Choosing Commerce with Accountancy & Maths in Class 11-12 makes the transition smoother, but is not mandatory."
          - icon: "calendar"
            title: "After Class 12"
            points:
              - "Register for CA Foundation — open to students from Commerce, Science or Arts, with no minimum percentage requirement."
              - "Graduates can skip Foundation via the <strong>Direct Entry route</strong> (Commerce graduates need 55%, others typically 60%) and register straight for Intermediate."
  - id: "admission"
    hid: "admission-heading"
    eyebrow: "No entrance exam needed"
    heading: "How CA admission actually works"
    intro: "There's no single \"entrance exam\" for CA — you register directly with ICAI and clear each level in sequence."
    parts:
      - subhead: "How CA admission actually works"
      - table:
          head:
            - "Step"
            - "What happens"
          rows:
            -
              - "1. Register"
              - "Register online with ICAI for CA Foundation (after Class 12) or Intermediate (Direct Entry, for graduates)."
            -
              - "2. Foundation"
              - "Study 4 papers covering Accounting, Law, Maths & Stats, and Economics; appear for the ICAI exam."
            -
              - "3. Intermediate"
              - "Clear both groups (advanced Accounting, Law, Costing, Tax, Auditing) and complete mandatory ICITSS training."
            -
              - "4. Articleship"
              - "Register for practical training under a practising CA — typically spans about 2 years under the current scheme."
            -
              - "5. Final"
              - "Clear both groups of CA Final (usually attempted during or after articleship) plus AICITSS training."
            -
              - "6. Membership"
              - "Apply to ICAI for membership and officially become a Chartered Accountant."
      - note: "ICAI has updated its scheme of education and training in recent years, so exact durations and paper counts can shift — always confirm current details on the official ICAI website before registering."
  - id: "papers"
    hid: "papers-heading"
    alt: true
    eyebrow: "Know what you're up against"
    heading: "Papers, levels & passing criteria"
    intro: "Every paper is out of 100 marks. The same passing rule applies at all three levels — it's the consistency across years that makes CA genuinely hard, not any one difficult paper."
    parts:
      - subhead: "Papers, levels &amp; passing criteria"
      - table:
          head:
            - "Level"
            - "Papers"
          rows:
            -
              - "Foundation (4 papers, single attempt — no groups)"
              - "1. Accounting · 2. Business Laws · 3. Quantitative Aptitude · 4. Business Economics"
            -
              - "Intermediate — Group 1"
              - "1. Advanced Accounting · 2. Corporate & Other Laws · 3. Taxation (Direct & Indirect)"
            -
              - "Intermediate — Group 2"
              - "4. Cost & Management Accounting · 5. Auditing & Ethics · 6. Financial Management & Strategic Management"
            -
              - "Final — Group 1"
              - "1. Financial Reporting · 2. Advanced Financial Management · 3. Advanced Auditing, Assurance & Professional Ethics"
            -
              - "Final — Group 2"
              - "4. Direct Tax Laws & International Taxation · 5. Indirect Tax Laws · 6. Integrated Business Solutions (multi-disciplinary case study)"
      - prose:
          - "<strong>Passing criteria (same rule at every level):</strong> you must score at least 40% in each individual paper <em>and</em> at least 50% in aggregate across that level or group, in the same sitting. Falling short on either condition — even scoring well over 50% overall while dipping below 40% in just one paper — means that level or group is not cleared."
          - list:
              - "Foundation has no groups — all 4 papers count together in one sitting, with no partial carry-forward."
              - "Intermediate and Final are each split into two groups of three papers; you can attempt one group or both together."
              - "Score 60%+ in a paper but still miss your group's overall pass mark, and ICAI typically grants an exemption in that paper for your next attempt (subject to current guidelines)."
              - "Foundation Papers 3 and 4 are objective (MCQ) with a 0.25-mark negative marking penalty per wrong answer."
            ticks: true
        class: "prose reveal mt-lg"
      - note: "ICAI operates under a \"new scheme\" introduced from July 2023 and periodically revises exact paper names and syllabus content — always cross-check the current scheme on icai.org before you register."
