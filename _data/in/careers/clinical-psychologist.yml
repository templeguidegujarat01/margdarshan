          - "An <strong>MA/M.Sc in Psychology</strong> (2 years), typically requiring a strong undergraduate result, often 55-60%+ depending on the university."
          - "An <strong>M.Phil in Clinical Psychology</strong> (2 years) at an RCI-recognised institute — this is the qualifying step for licensed independent practice."
