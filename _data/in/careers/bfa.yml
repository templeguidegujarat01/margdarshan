          - label: "Portfolio submission"
            text: "Many institutes require or strongly consider a portfolio of existing artwork alongside the entrance exam."
          - label: "Interview round"
            text: "Shortlisted candidates are often interviewed about their artistic interests and direction."
          - label: "Typical process"
            text: "Apply to specific institutes individually → appear for each entrance test → interview if shortlisted → seat offer and admission."
  - id: "fees"
    hid: "fees-heading"
    eyebrow: "Very affordable at government institutes"
    heading: "Fees & scholarships"
    parts:
      - prose:
          - "Government-run fine arts institutes like the College of Art, Delhi, or MS University Baroda are notably affordable, with total fees for the 4-year course often in the range of <strong>₹20,000-1 lakh</strong>. Private art schools can charge considerably more, often ₹1-3 lakh per year. Merit-based and need-based scholarships are available at several government institutions. Always confirm current fees directly on your target institute's official admission page."
