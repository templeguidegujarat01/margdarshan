  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What is the CFA charter?"
    parts:
      - overview:
          points:
            - "The CFA charter is a global investment-management credential awarded by the <strong>CFA Institute</strong>, a US-based professional body with over 200,000 charterholders worldwide."
            - "Unlike India's Institute of Chartered Accountants of India (ICAI), Institute of Company Secretaries of India (ICSI) or Institute of Cost Accountants of India (ICMAI), the CFA Institute isn't tied to Indian company law — it's an international standard, recognised the same way in Mumbai, London, New York or Singapore."
            - "CFA charterholders are trained to value companies and other assets, build and manage investment portfolios, and apply the CFA Institute's Code of Ethics and Standards of Professional Conduct."
          more:
            - "The charter is especially valued in equity research, asset management, investment banking and portfolio management, where employers often explicitly prefer or require it."
  - id: "who"
    hid: "who-heading"
    alt: true
    eyebrow: "Fit check"
    heading: "Who should choose CFA — and who should think twice"
    parts:
      - fit:
          match:
            - "Are specifically drawn to investing, valuation and financial markets, not accounting or compliance."
            - "Want a globally portable credential rather than one specific to Indian regulation."
            - "Are comfortable self-studying in English from dense, internationally-set curriculum material."
          mismatch:
            - "Want to start a professional qualification immediately after Class 12 — CFA needs a bachelor's degree in progress or equivalent."
            - "Want an India-specific qualification for statutory audit, tax practice or company law — that's CA or CS territory."
            - "Are put off by exam fees paid in US dollars, which move with the exchange rate."
  - id: "eligibility"
    hid: "elig-heading"
    eyebrow: "Eligibility"
    heading: "Who can register for CFA Level I"
    parts:
      - prose:
          - "CFA eligibility is based on education/work experience, not school stream — but it doesn't open up right after Class 12 the way CA, CS or CMA do. You need <strong>one</strong> of the following:"
          - elig:
              - "A bachelor's (or equivalent) degree, <em>or</em>"
              - "Being enrolled in a bachelor's programme and within 23 months (or fewer) of graduating, <em>or</em>"
              - "A combination of professional work experience and/or higher education totalling 4,000 hours over at least 3 sequential years (work and education can't overlap)."
          - "If you pass Level I as an undergraduate, you must be within 11 months of graduation to sit Level II, and must complete your degree before Level III. You'll also need a valid international passport and solid English proficiency, since the exam and curriculum are in English."
      - note_box: "Practical takeaway for Indian students: the realistic starting point is during your second or third year of a bachelor's degree (B.Com, Bachelor of Business Administration (BBA), economics, engineering — any discipline is fine), not straight after Class 12."
        class: "note reveal mt-sm"
