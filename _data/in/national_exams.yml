  # ---------------------------------------------------------------- CMI
  - slug: cmi
    short: "CMI B.S. (Hons) entrance"
    stream: science
    checked: 2026-10-15
    body: "Chennai Mathematical Institute (CMI)"
    eyebrow: "Entrance Exam · Pure Science · 2027 date announced"
    title: "CMI entrance — B.S. (Hons) in Mathematics, CS &amp; Physics"
    lede: "Chennai Mathematical Institute, a university under Section 3 of the UGC Act, admits to its 4-year B.S. (Honours) programmes through its own written test. CMI has announced the 2027 test date; the rest of this page follows its 2026 brochure and admission pages."
    colleges_href: "colleges-science.html"
    facts:
      - { label: "Conducted by", value: "Chennai Mathematical Institute", source: cmi-adm }
      - { label: "2027 entrance exam", value: "Saturday 15 May 2027, 2 pm", source: cmi-adm }
      - { label: "Eligibility", value: "Class 12 or equivalent", source: cmi-adm }
      - { label: "Tuition", value: "₹1,25,000 a semester · 30–35 full waivers", source: cmi-br }
    official:
      - { label: "cmi.ac.in/admissions", url: "https://www.cmi.ac.in/admissions/" }
      - { label: "CMI brochure 2026 (PDF)", url: "https://www.cmi.ac.in/admissions/brochure/2026/cmi-brochure-2026.pdf" }
    sections:
      - id: overview
        nav: "Overview"
        eyebrow: "Overview &amp; governing body"
        heading: "A small research institute with a famous maths degree"
        parts:
          - p: "CMI started a 3-year B.Sc. (Honours) in Mathematics and Computer Science in 1998. <strong>From 2026 it is a 4-year B.S. (Honours)</strong>, with an exit option after three years with a B.Sc. There are three B.S. programmes: Mathematics, Mathematics &amp; Computer Science, and Mathematics &amp; Physics."
            source: cmi-br
          - list:
              - "One common entrance for all B.S. programmes — you do not choose your course when you apply; the choice is made after admission."
              - "A Data Science minor can be added to any of the 4-year programmes."
            source: cmi-adm
          - table:
              caption: "CMI admissions 2027-28"
              head: ["Event", "Date"]
              rows:
                - ["Applications open", "Around 1 Mar 2027 (details by February 2027)"]
                - ["Entrance exam", "Saturday 15 May 2027, 2:00 pm"]
            source: cmi-adm
          - note: "The 2026-27 test was held in 37 cities, from Agartala to Visakhapatnam."
            source: cmi-adm
      - id: eligibility
        nav: "Eligibility"
        eyebrow: "Academic eligibility"
        heading: "Class 12 — and olympiad medallists skip the test"
        parts:
          - list:
              - "Students who have passed, or expect to pass, Class 12 (or equivalent) from a recognised board in the admission year."
              - "No minimum percentage is stated on the admissions page or in the brochure."
            source: cmi-br
          - list:
              - "<strong>Direct admission</strong> without the test for students who, in Class 11 or 12, qualified for the IMO Training Camp or EGMO Training Camp, the Physics Orientation-cum-Selection Camp, or the IOI Training Camp — or were shortlisted for EGOI team selection, or won gold or silver at INOI."
            source: cmi-adm
      - id: scheme
        nav: "Exam scheme"
        eyebrow: "Exam scheme"
        heading: "Objective questions plus long problems"
        parts:
          - p: "The B.S. entrance is a <strong>test of aptitude for Mathematics</strong>, with both objective questions and longer problems, based mostly on material up to the 12th standard. CMI publishes past papers and solutions from 2010 onwards on its syllabus page."
            source: cmi-syl
          - p: "For some programmes the written test may be followed by an interview at the Admissions Committee's discretion, depending on prior academic record."
            source: cmi-adm
          - note: "CMI does not publish a fixed question count or a negative-marking rule on its admission pages — read the instructions on the question paper."
            source: cmi-syl
      - id: reservation
        nav: "Reservation"
        eyebrow: "Reservation policy"
        heading: "Government of India categories, relaxed qualifying score"
        parts:
          - list:
              - "CMI follows Government of India policy for <strong>SC, ST, OBC-NCL, physically challenged (PC) and EWS</strong> candidates."
              - "At each stage (written test, and interview where held) the pass list has proportional representation as per GoI rules, and the <strong>qualifying score is relaxed</strong> for reserved categories."
              - "PC benefit needs at least 40% permanent impairment; EWS covers families under ₹8 lakh gross income that are not SC, ST or OBC-NCL."
              - "Original caste / disability / EWS certificates are needed at admission."
            source: cmi-res
      - id: fees
        nav: "Fees &amp; scholarships"
        eyebrow: "Fees &amp; scholarships"
        heading: "Expensive on paper, free for many"
        parts:
          - table:
              caption: "B.S. (Hons) fees, 2026 brochure"
              head: ["Item", "Amount"]
              rows:
                - ["Tuition", "₹1,25,000 per semester (two a year)"]
                - ["Hostel, mess and establishment", "₹31,310 per semester"]
                - ["Merit scholarships", "About 30-35 full tuition waivers for four years; a limited number of ₹5,000 a month fellowships"]
                - ["Need-based waiver", "100% if family income is ₹8 lakh or less; 50% if ₹12 lakh or less"]
            source: cmi-br
          - note: "The application fee for 2027 will be announced when applications open (around 1 March 2027)."
            source: cmi-adm
      - id: horizons
        nav: "Where it leads"
        eyebrow: "Career horizons &amp; mapped institutions"
        heading: "From CMI to PhDs and quant jobs"
        parts:
          - p: "CMI alumni have gone on to graduate study at leading institutions abroad and in India (IISc, IITs, IMSc, ISI, TIFR) and many are now faculty; those who take campus placement go into software, semiconductors, investment banking, analytics and healthcare, with average packages of ₹18-20 lakh a year in recent years."
            source: cmi-br
          - links:
              - { label: "ISI B.Stat / B.Math", url: "isi.html" }
              - { label: "IISER Aptitude Test (IAT)", url: "iiser-iat.html" }
              - { label: "NEST (NISER &amp; CEBS)", url: "nest.html" }
              - { label: "Science college finder", url: "colleges-science.html" }
    sources:
      - { id: cmi-adm, name: "CMI — Admissions page (2027-28 dates, eligibility, olympiad direct admission, 2026 centres)", url: "https://www.cmi.ac.in/admissions/", covers: "2027 exam date, application timing, programmes, eligibility, direct admission, interviews", checked: 2026-10-15 }
      - { id: cmi-br, name: "CMI — Information Brochure 2026", url: "https://www.cmi.ac.in/admissions/brochure/2026/cmi-brochure-2026.pdf", covers: "4-year B.S. structure, eligibility, 2026 exam date, tuition, hostel, scholarships, waivers, placements", checked: 2026-10-15 }
      - { id: cmi-syl, name: "CMI — Entrance exam syllabus and past papers", url: "https://www.cmi.ac.in/admissions/syllabus.php", covers: "nature of the B.S. entrance, past papers", checked: 2026-10-15 }
      - { id: cmi-res, name: "CMI — Reservation Policy", url: "https://www.cmi.ac.in/admissions/reservation-policy.php", covers: "reserved categories, relaxed qualifying score, certificates", checked: 2026-10-15 }

  # ---------------------------------------------------------------- ISI (B.Stat / B.Math)
  - slug: isi
    short: "ISI B.Stat / B.Math"
    stream: science
    checked: 2026-10-15
    body: "Indian Statistical Institute (ISI), Kolkata"
    eyebrow: "Entrance Exam · Pure Science · 2026 cycle"
    title: "ISI Admission Test — B.Stat (Hons) &amp; B.Math (Hons): eligibility, seats &amp; fees"
    lede: "The Indian Statistical Institute, an Institution of National Importance, admits to its tuition-free B.Stat (Hons) at Kolkata and B.Math (Hons) at Bengaluru through two written tests. This page follows ISI's 2026-27 admission notice, prospectus, selection and reservation policies."
    colleges_href: "colleges-science.html"
    facts:
      - { label: "Conducted by", value: "Indian Statistical Institute", source: isi-pros }
      - { label: "Eligibility", value: "Class 12 with Mathematics and English", source: isi-notice }
      - { label: "Tuition &amp; stipend", value: "No tuition · ₹5,000 a month stipend", source: isi-pros }
      - { label: "Application fee", value: "₹1,500 men · ₹1,000 women · ₹750 reserved", source: isi-notice }
    official:
      - { label: "admission.isical.ac.in", url: "https://admission.isical.ac.in/" }
      - { label: "Prospectus 2026-27 (PDF)", url: "https://admission.isical.ac.in/Documents/IsiAdmission2026/ISI-Prospectus-2026-27.pdf" }
    sections:
      - id: overview
        nav: "Overview"
        eyebrow: "Overview &amp; governing body"
        heading: "Two of India's most selective science degrees"
        parts:
          - list:
              - "<strong>B.Stat (Hons)</strong> — 3 years, Kolkata: theory, methods and applications of Statistics with Mathematics and basic Computer Science."
              - "<strong>B.Math (Hons)</strong> — 3 years, Bengaluru."
              - "Graduates of either can get direct admission to ISI's M.Stat / M.Math."
            source: isi-pros
          - p: "The 2026 admission notice (24 April 2026) also listed a 4-year <strong>B.SDS (Hons)</strong> in Statistical Data Science, taught in hybrid mode across Kolkata, Delhi and Bengaluru — this one needs 75% in Class 12 (passed 2025 or 2026) and charges ₹1,00,000 tuition a semester, with full waiver for SC/ST/PwBD."
            source: isi-notice
          - warn: "ISI's 2027 notice was not out on 15 October 2026. The 2026 admission test was held on 10 May 2026."
            source: isi-pros
      - id: eligibility
        nav: "Eligibility"
        eyebrow: "Academic eligibility"
        heading: "Mathematics and English in 10+2 — and an olympiad route"
        parts:
          - list:
              - "<strong>B.Stat / B.Math:</strong> successful completion of 10+2 (or equivalent) with <strong>Mathematics and English</strong>. Candidates finishing the qualifying exam before 20 July of the admission year can apply."
              - "Indian citizens and OCI holders can apply (OCI students get no stipend)."
            source: isi-notice
          - p: "<strong>INMO channel:</strong> students selected as INMO awardees for the International Mathematical Olympiad Training Camp in 2025 or 2026 are admitted without a written test, on interview, to up to 5 supernumerary seats."
            source: isi-pros
      - id: scheme
        nav: "Exam scheme"
        eyebrow: "Exam scheme &amp; selection"
        heading: "Two written tests, weighted toward the second"
        parts:
          - p: "All other applicants sit <strong>two written tests</strong> with multiple-choice and descriptive questions in Mathematics at the 10+2 level. B.Stat and B.Math have <strong>no interview</strong>."
            source: isi-pros
          - table:
              caption: "Selection parameters 2026-27"
              head: ["Programme", "Seats", "Test I (max)", "Test II (max)", "Shortlist after Test I", "Final score"]
              rows:
                - ["B.Stat (Hons)", "63 + 16 female", "120", "80", "Top 550", "Test I + 3.5 × Test II"]
                - ["B.Math (Hons)", "63 + 16 female", "120", "80", "Top 500", "Test I + 4 × Test II"]
            source: isi-sel
          - list:
              - "Only candidates shortlisted on Test I have their Test II graded."
              - "If a pass mark is set, OBC-NCL candidates need 90% of it and SC/ST/PwBD candidates 70%; the same ratios apply to each stage's qualifying score."
            source: isi-sel
      - id: reservation
        nav: "Reservation &amp; seats"
        eyebrow: "Reservation &amp; seats"
        heading: "Central reservation plus female-only seats"
        parts:
          - table:
              caption: "ISI reservation, non-JRF programmes 2026-27"
              head: ["Category", "Share", "Relaxation on qualifying score"]
              rows:
                - ["SC", "15%", "30%"]
                - ["ST", "7.5%", "30%"]
                - ["OBC-NCL", "27%", "10%"]
                - ["GEN-EWS", "10%", "None"]
                - ["PwBD (40%+)", "5% horizontal", "30%"]
            source: isi-res
          - list:
              - "Each programme has a <strong>Gender-Neutral pool</strong> (63 seats) and a <strong>Female-Only pool</strong> (16 seats, supernumerary). Women are considered for both pools; others for the gender-neutral pool only."
              - "Seats are allotted by category tag, gender tag and merit-list position, starting with the general merit lists."
            source: isi-rules
          - note: "Unfilled SC and ST seats can pass to each other; unfilled OBC-NCL seats are de-reserved; unfilled EWS seats stay vacant."
            source: isi-res
      - id: fees
        nav: "Fees &amp; stipend"
        eyebrow: "Application fee &amp; stipend"
        heading: "Pay to apply — then study free"
        parts:
          - table:
              caption: "ISI application fee 2026 (all programmes)"
              head: ["Applicant", "Fee"]
              rows:
                - ["Male, unreserved (Indian)", "₹1,500"]
                - ["Female, unreserved (Indian)", "₹1,000"]
                - ["OBC-NCL / SC / ST / PwBD / GEN-EWS (Indian)", "₹750"]
                - ["Overseas Citizens of India", "₹1,500"]
            source: isi-notice
          - list:
              - "Apply only online at admission.isical.ac.in, after reading the prospectus."
              - "B.Stat and B.Math students pay <strong>no tuition fee</strong> and receive a <strong>₹5,000 a month</strong> stipend (plus a ₹5,000 yearly contingency grant), renewed each semester on satisfactory progress."
              - "Limited hostel places are available."
            source: isi-pros
      - id: horizons
        nav: "Where it leads"
        eyebrow: "Career horizons &amp; mapped institutions"
        heading: "Statistics and mathematics, all the way to research"
        parts:
          - p: "B.Stat prepares students for higher study in Statistics, Mathematics, Computer Science, Economics and allied fields, or careers as statisticians in research, government and industry; B.Stat and B.Math graduates are offered direct admission to ISI's M.Stat and M.Math."
            source: isi-pros
          - links:
              - { label: "CMI B.S. (Hons) entrance", url: "cmi.html" }
              - { label: "IISER Aptitude Test (IAT)", url: "iiser-iat.html" }
              - { label: "NEST (NISER &amp; CEBS)", url: "nest.html" }
              - { label: "Science college finder", url: "colleges-science.html" }
    sources:
      - { id: isi-notice, name: "ISI — Admission Notice 2026-27 (24 Apr 2026) and admission portal", url: "https://admission.isical.ac.in/Documents/IsiAdmission2026/Admission-Notice-2026.pdf", covers: "programmes, eligibility, B.SDS terms, application fee, test date, cut-off date for qualifying exam", checked: 2026-10-15 }
      - { id: isi-pros, name: "ISI — Prospectus 2026-27", url: "https://admission.isical.ac.in/Documents/IsiAdmission2026/ISI-Prospectus-2026-27.pdf", covers: "B.Stat / B.Math scope, written tests, INMO channel, stipend, tuition, hostel, direct admission to M.Stat / M.Math", checked: 2026-10-15 }
      - { id: isi-sel, name: "ISI — Selection Policy, non-JRF programmes 2026-27", url: "https://admission.isical.ac.in/Documents/IsiAdmission2026/Selection-Policy-Non-JRF-2026.pdf", covers: "stage-wise shortlisting, test maxima, weights, category pass-mark ratios", checked: 2026-10-15 }
      - { id: isi-res, name: "ISI — Policy for Reservation in Admission 2026-27", url: "https://admission.isical.ac.in/Documents/IsiAdmission2026/Reservation-Policy-2026.pdf", covers: "seats per programme, SC/ST/OBC-NCL/EWS/PwBD shares and relaxations", checked: 2026-10-15 }
      - { id: isi-rules, name: "ISI — Business Rules for Admission 2026-27 (B.Stat and B.Math)", url: "https://admission.isical.ac.in/Documents/IsiAdmission2026/Business-Rules-for-BStat-BMath-Admission-2026.pdf", covers: "category and gender tags, gender-neutral and female-only pools, allocation order", checked: 2026-10-15 }
  # ---------------------------------------------------------------- NEET PG (NBEMS)
  - slug: neet-pg
    short: "NEET PG"
    stream: medical
    checked: 2026-10-15
    body: "National Board of Examinations in Medical Sciences (NBEMS)"
    eyebrow: "Entrance Exam · Postgraduate Medical · 2026 cycle"
    title: "NEET PG — eligibility, marking, quotas &amp; fees"
    lede: "The single entrance and ranking test for MD, MS and PG Diploma seats after MBBS — All India Quota, state quota, private and deemed universities, armed forces institutions and NBEMS's own DNB and DrNB courses. This page follows the NEET-PG 2026 Information Bulletin."
    colleges_href: "colleges-mbbs.html"
    facts:
      - { label: "Conducted by", value: "NBEMS, New Delhi", source: npg-ib }
      - { label: "Exam date (2026)", value: "30 Aug 2026 · result by 30 Sep 2026", source: npg-ib }
      - { label: "Paper", value: "180 MCQs · 3 h 30 min · computer-based", source: npg-ib }
      - { label: "Marking", value: "+4 correct · −1 wrong · 0 unattempted", source: npg-ib }
    official:
      - { label: "NEET-PG page (natboard.edu.in)", url: "https://natboard.edu.in/viewnbeexam?exam=neetpg" }
      - { label: "Information Bulletin 2026", url: "https://drive.google.com/file/d/1WmFcaFZhEAaRFrBBgTGUENX81cQwQkVT/view" }
    sections:
      - id: overview
        nav: "Overview"
        eyebrow: "Overview &amp; governing bodies"
        heading: "One test for almost every MD / MS seat in India"
        parts:
          - p: "NEET-PG is the eligibility-cum-ranking examination prescribed as the <strong>single entrance examination</strong> for MD, MS and PG Diploma courses under Section 61(2) of the National Medical Commission Act, 2019 and Chapter IV of the Post Graduate Medical Education Regulations, 2023. No state or institution-level entrance test is valid for these courses."
            source: npg-ib
          - list:
              - "<strong>All India 50% quota</strong> seats of every state and union territory."
              - "<strong>State quota</strong> seats of every state and union territory."
              - "All <strong>private</strong> medical colleges, institutions and universities, and <strong>deemed universities</strong>."
              - "<strong>Armed Forces Medical Services</strong> institutions."
              - "NBEMS's <strong>post-MBBS DNB</strong>, <strong>direct 6-year DrNB</strong> and <strong>post-MBBS NBEMS Diploma</strong> courses."
            source: npg-ib
          - p: "Four institutions are <strong>not</strong> filled through NEET-PG: AIIMS New Delhi and the other AIIMS, PGIMER Chandigarh, JIPMER Puducherry and NIMHANS Bengaluru — they admit through INI-CET."
            source: npg-ib
          - p: "NBEMS only conducts the test, declares the result and hands it to the counselling authorities. It has <strong>no role in counselling or seat allotment</strong>; documents and eligibility are verified at counselling."
            source: npg-ib
          - table:
              caption: "NEET-PG 2026 calendar"
              head: ["Step", "Date"]
              rows:
                - ["Online application", "1 Jul 2026 (5 pm) – 21 Jul 2026 (11:55 pm)"]
                - ["Edit window", "25 – 28 Jul 2026"]
                - ["Selective edit window (deficient images)", "31 Jul – 10 Aug 2026"]
                - ["Test city intimation", "11 Aug 2026"]
                - ["Admit cards", "27 Aug 2026"]
                - ["Examination", "30 Aug 2026"]
                - ["Result", "By 30 Sep 2026"]
                - ["Internship completion cut-off", "30 Sep 2026"]
            source: npg-ib
          - warn: "The NEET-PG 2027 bulletin was not out on 15 October 2026, so this page describes the 2026 cycle. NBEMS can change the date, pattern and fees in the next bulletin."
      - id: eligibility
        nav: "Eligibility"
        eyebrow: "Strict academic eligibility"
        heading: "MBBS, registration — and the internship cut-off"
        parts:
          - list:
              - "An <strong>MBBS degree or provisional MBBS pass certificate</strong> recognised under the NMC Act, 2019 and the PG Medical Education Regulations, 2023."
              - "A <strong>permanent or provisional registration</strong> certificate from the NMC / erstwhile MCI or a State Medical Council, shown on exam day and at counselling."
              - "<strong>One year of internship completed</strong>, or due to be completed, on or before <strong>30 September 2026</strong>."
            source: npg-ib
          - p: "Applications from candidates finishing internship after 30 September 2026 are summarily rejected. The 12-month Compulsory Rotating Resident Internship dates entered in the form are final, and the original internship completion certificate must be shown at counselling or admission."
            source: npg-ib
          - p: "<strong>Foreign medical graduates</strong> (Indian citizens or OCI holders) must have passed the FMGE screening test, be registered with the NMC / MCI or a State Medical Council, and finish internship by 30 September 2026."
            source: npg-ib
          - note: "Some universities do not admit a candidate who is already doing a PG course until that course is finished. NBEMS, MoHFW and the counselling authority are not responsible if such a candidate is refused."
            source: npg-ib
      - id: scheme
        nav: "Exam scheme"
        eyebrow: "Exam scheme &amp; marking matrix"
        heading: "180 questions in five locked, timed sections"
        parts:
          - list:
              - "<strong>180 multiple-choice questions</strong>, each with 4 options, in <strong>English only</strong>."
              - "<strong>3 hours 30 minutes</strong>, computer-based."
              - "Syllabus: the subjects and knowledge areas of the MBBS curriculum issued by the NMC / erstwhile MCI."
            source: npg-ib
          - table:
              caption: "NEET-PG 2026 marking scheme"
              head: ["Response", "Marks"]
              rows:
                - ["Correct", "+4"]
                - ["Incorrect", "−1"]
                - ["Unattempted", "0"]
            source: npg-ib
          - p: "The paper is split into <strong>five time-bound sections (Groups A to E) of 36 questions and 42 minutes each</strong>. A section closes when its time runs out — you cannot go back to review or change answers — and the next one opens automatically. NBEMS says the number of such sections may vary with the size of the paper."
            source: npg-ib
          - note: "The 2026 bulletin does not publish a subject-wise or clinical-case question split; it only fixes the MBBS-curriculum syllabus."
            source: npg-ib
          - table:
              caption: "Qualifying percentile, NEET-PG 2026"
              head: ["Category", "Minimum percentile"]
              rows:
                - ["General / EWS", "50th"]
                - ["UR PwBD", "45th"]
                - ["SC / ST / OBC (including their PwBD)", "40th"]
            source: npg-ib
      - id: reservation
        nav: "Quotas &amp; reservation"
        eyebrow: "Reservation &amp; institutional quotas"
        heading: "50% All India Quota, the rest with the states"
        parts:
          - table:
              caption: "Who counsels which NEET-PG seats"
              head: ["Seats", "Counselling authority"]
              rows:
                - ["50% All India Quota", "Medical Counselling Committee (MCC), DGHS — mcc.nic.in"]
                - ["100% of deemed and central university seats", "MCC, DGHS"]
                - ["100% all-India open DNB seats", "MCC, DGHS"]
                - ["State quota seats", "Each state / UT's counselling authority"]
                - ["In-service seats", "The state government's counselling authority"]
            source: npg-ib
          - p: "For <strong>state quota</strong> seats, NBEMS passes only candidate data and scores to the states through DGHS — without applying any state's eligibility or reservation rules. Each state builds its own state rank, category rank, in-service and rural-posting benefits under its own policy. Qualifying NEET-PG does not by itself make you eligible for a state's quota seats."
            source: npg-ib
          - list:
              - "AIQ reservation follows the MCC information bulletin; PG seat reservation follows Government of India and state norms."
              - "<strong>5% PwBD</strong> reservation applies in 50% AIQ and central university seats; 33 designated centres issue the disability certificate."
              - "PwBD candidates need at least the 45th percentile (General) or 40th percentile (SC / ST / OBC)."
              - "OCI cardholders' rights follow the Supreme Court order of 3 February 2023 (Anushka Rengunthwar v. Union of India)."
            source: npg-ib
          - note: "A candidate can pass NEET-PG yet not be eligible for AIQ counselling under MCC's criteria — such a candidate can still be considered for state quota seats."
            source: npg-ib
      - id: fees
        nav: "Fees"
        eyebrow: "Application steps &amp; registration fees"
        heading: "One fee, paid online"
        parts:
          - table:
              caption: "NEET-PG 2026 examination fee"
              head: ["Category", "Fee"]
              rows:
                - ["General, OBC, EWS", "₹3,500"]
                - ["SC, ST, PwBD", "₹2,500"]
            source: npg-ib
          - list:
              - "Apply online on the NBEMS portal: register, fill the form, upload photograph, signature and thumb impression, then pay through the payment gateway (gateway charges extra)."
              - "A submitted form cannot be withdrawn; the fee is never refunded or carried forward."
              - "If an edit changes your category to one with a higher fee, you must pay the balance; a lower fee is not refunded."
            source: npg-ib
      - id: horizons
        nav: "Where it leads"
        eyebrow: "Career horizons &amp; mapped institutions"
        heading: "From NEET-PG rank to residency"
        parts:
          - p: "A NEET-PG rank leads to MD / MS / PG Diploma seats in government, private and deemed colleges, to post-MBBS DNB and direct 6-year DrNB super-specialty training, and to NBEMS's 2-year post-MBBS Diploma courses. Clearing the qualifying percentile does not by itself give a seat."
            source: npg-ib
          - links:
              - { label: "INI-CET (AIIMS, JIPMER, PGIMER, NIMHANS)", url: "ini-cet.html" }
              - { label: "FMGE screening test", url: "fmge.html" }
              - { label: "UPSC CMS (government doctors)", url: "upsc-cms.html" }
              - { label: "MBBS career guide", url: "mbbs.html" }
    sources:
      - { id: npg-ib, name: "NBEMS — NEET-PG 2026 Information Bulletin (linked from natboard.edu.in)", url: "https://drive.google.com/file/d/1WmFcaFZhEAaRFrBBgTGUENX81cQwQkVT/view", covers: "scope, excluded institutes, calendar, eligibility, internship cut-off, pattern, sections, marking, qualifying percentiles, counselling authorities, state quota data, PwBD, fees", checked: 2026-10-15 }
  # ---------------------------------------------------------------- INI-CET (AIIMS New Delhi)
  - slug: ini-cet
    short: "INI-CET"
    stream: medical
    checked: 2026-10-15
    body: "AIIMS New Delhi (Examination Section)"
    eyebrow: "Entrance Exam · Postgraduate Medical · January 2027 session"
    title: "INI-CET — eligibility, marking, institutional preference &amp; fees"
    lede: "The combined entrance test for MD, MS, MDS, 6-year DM and M.Ch. seats at the Institutes of National Importance — AIIMS New Delhi and 18 other AIIMS, JIPMER, NIMHANS, PGIMER and SCTIMST — which do not admit through NEET-PG. This page follows the January 2027 session prospectus."
    colleges_href: "colleges-mbbs.html"
    facts:
      - { label: "Conducted by", value: "AIIMS New Delhi for 23 INIs", source: ini-a }
      - { label: "Exam date", value: "1 Nov 2026 (Sunday) · CBT", source: ini-notice }
      - { label: "Paper", value: "200 questions · 3 hours", source: ini-a }
      - { label: "Marking", value: "+1 correct · −1/3 wrong", source: ini-a }
    official:
      - { label: "aiimsexams.ac.in", url: "https://www.aiimsexams.ac.in/" }
      - { label: "Prospectus Jan 2027 (Part A &amp; B)", url: "https://www.aiimsexams.ac.in/prospectus/6aaab710c7a01ed08da4242d" }
    sections:
      - id: overview
        nav: "Overview"
        eyebrow: "Overview &amp; governing bodies"
        heading: "One test, 23 Institutes of National Importance"
        parts:
          - p: "INI-CET is held by the <strong>Examination Section of AIIMS New Delhi</strong> for the January 2027 session of MD, MS, DM (6 years), M.Ch. (6 years), MDS and MD (Hospital Administration) at the participating Institutes of National Importance."
            source: ini-a
          - list:
              - "<strong>19 AIIMS</strong> — New Delhi, Bhopal, Bhubaneswar, Jodhpur, Nagpur, Patna, Raipur, Rishikesh, Bibinagar, Bathinda, Deoghar, Mangalagiri, Raebareli, Kalyani, Bilaspur, Gorakhpur, Guwahati, Rajkot and Jammu."
              - "<strong>JIPMER</strong> Puducherry, <strong>NIMHANS</strong> Bengaluru, <strong>PGIMER</strong> Chandigarh and <strong>SCTIMST</strong> Thiruvananthapuram."
            source: ini-a
          - table:
              caption: "INI-CET January 2027 calendar"
              head: ["Step", "Date"]
              rows:
                - ["Admission Notice No. 148/2026", "2 Sep 2026"]
                - ["Prospectus Part A &amp; Part B uploaded", "16 Sep 2026"]
                - ["Online registration", "16 Sep – 13 Oct 2026 (5 pm)"]
                - ["Status of registration", "17 – 19 Oct 2026"]
                - ["Final status &amp; admit card", "26 Oct 2026"]
                - ["Examination", "1 Nov 2026 (Sunday)"]
            source: ini-notice
          - warn: "Registration for the January 2027 session closed on 13 October 2026. The AIIMS portal lists INI-CET for both a January and a July session each year — watch it for the July 2027 notice."
            source: ini-portal
      - id: eligibility
        nav: "Eligibility"
        eyebrow: "Strict academic eligibility"
        heading: "MBBS or BDS, internship by 31 January 2027, and 55% aggregate"
        parts:
          - list:
              - "<strong>MBBS</strong> for MD, MS, DM (6 yrs), M.Ch. (6 yrs) and MD (Hospital Administration); <strong>BDS</strong> for MDS — from a university recognised by the NMC / MCI or the Dental Council of India."
              - "The <strong>12-month compulsory rotating internship</strong> must be complete on or before <strong>31 January 2027</strong>; anyone finishing later cannot register."
            source: ini-a
          - table:
              caption: "Minimum aggregate of all professional MBBS / BDS exams"
              head: ["Category", "Minimum aggregate"]
              rows:
                - ["SC / ST", "50%"]
                - ["All others, including OBC and EWS", "55%"]
                - ["PwBD", "Same as the candidate's own category"]
            source: ini-a
          - list:
              - "Enter the aggregate of <strong>all</strong> professional exams, not just one year's marks."
              - "Indian nationals who graduated abroad: <strong>FMGE marks</strong> are used in place of the MBBS aggregate."
              - "Sponsored candidates must have worked 3 years for the sponsor — by 31 Jan 2027 (AIIMS, SCTIMST, NIMHANS) or 31 Dec 2026 (JIPMER, PGIMER)."
            source: ini-a
          - note: "Each INI can add its own admission conditions in its Part B prospectus, so a candidate may be eligible for some INIs and not others."
            source: ini-a
      - id: scheme
        nav: "Exam scheme"
        eyebrow: "Exam scheme &amp; marking matrix"
        heading: "200 questions in four locked 45-minute parts"
        parts:
          - list:
              - "Computer-based, <strong>3 hours (180 minutes)</strong>, <strong>200 questions</strong>."
              - "Objective questions of varying types, including <strong>single-correct and multiple-correct</strong> choice."
              - "Four parts of 50 questions and 45 minutes each, shown one at a time; a part locks when its 45 minutes end."
            source: ini-a
          - table:
              caption: "INI-CET January 2027 marking"
              head: ["Response", "Marks"]
              rows:
                - ["Correct", "+1"]
                - ["Incorrect", "−1/3"]
                - ["Unanswered / marked for review", "0"]
            source: ini-a
          - table:
              caption: "Minimum percentile for admission"
              head: ["Seats", "Cut-off"]
              rows:
                - ["Unreserved (incl. OCI), EWS, sponsored, foreign nationals", "50th percentile"]
                - ["OBC, SC, ST, PwBD (and Bhutanese nationals at PGIMER)", "45th percentile"]
            source: ini-a
          - p: "Ties are broken by fewer negative marks, then a higher percentage in the qualifying degree, then age (older first), then name in alphabetical order."
            source: ini-a
      - id: reservation
        nav: "Reservation &amp; preference"
        eyebrow: "Reservation &amp; institutional quotas"
        heading: "Central reservation plus AIIMS institutional preference"
        parts:
          - p: "Seats are allotted online in at least two rounds and an open round, in merit order and by each INI's own policies on institutional preference, community reservation and PwBD, through Institute-wise Synchronised Allocation of Seats (InSAS)."
            source: ini-a
          - table:
              caption: "Reservation at the AIIMS (Part B, January 2027)"
              head: ["Category", "Share"]
              rows:
                - ["SC", "15%"]
                - ["ST", "7.5%"]
                - ["OBC", "27%"]
                - ["EWS", "10%"]
                - ["PwBD", "5%, horizontal"]
            source: ini-b
          - list:
              - "<strong>AIIMS New Delhi graduates</strong> get institutional preference for open general seats equal to 50% of AIIMS's total MBBS seats, with no discipline-wise preference (Supreme Court, Saurabh Chaudhary v. Union of India, 2004)."
              - "Graduates of <strong>other AIIMS</strong> get preferential allotment at their own AIIMS only."
              - "Any preferential or reserved seat left vacant goes to open general candidates in merit order."
              - "Reservation does not apply to sponsored and foreign national seats."
            source: ini-b
          - note: "JIPMER, NIMHANS, PGIMER and SCTIMST publish their own Part B prospectus with their own seat and preference rules."
            source: ini-a
      - id: fees
        nav: "Fees"
        eyebrow: "Application steps &amp; registration fees"
        heading: "Fee by category, PwBD exempt"
        parts:
          - table:
              caption: "INI-CET January 2027 application fee"
              head: ["Applicant", "Fee"]
              rows:
                - ["General / OBC (NCL) / foreign national / OCI / sponsored", "₹4,000"]
                - ["SC / ST / EWS", "₹3,200"]
                - ["Persons with Benchmark Disabilities", "Nil (exempted)"]
            source: ini-a
          - list:
              - "Apply only online at aiimsexams.ac.in: basic information, qualification details, images, then the fee by debit card, credit card or net banking."
              - "Bank transaction charges are extra; the fee is not refunded under any circumstances."
              - "Applications without the fee are rejected."
            source: ini-a
      - id: horizons
        nav: "Where it leads"
        eyebrow: "Career horizons &amp; mapped institutions"
        heading: "Junior Residency at an Institute of National Importance"
        parts:
          - list:
              - "MD / MS / MDS students at AIIMS are <strong>Junior Residents</strong> (clinical) or Junior Demonstrators (basic subjects) on a <strong>3-year contract</strong>."
              - "Pay: entry pay <strong>₹56,100 a month plus NPA</strong> and allowances in the first year (pay scale ₹15,600 + ₹5,400 grade pay, 7th CPC)."
              - "Leaving the course: ₹3,00,000 within six months of joining, ₹5,00,000 after six months; original certificates stay with AIIMS unless ₹3,00,000 is deposited."
            source: ini-b
          - links:
              - { label: "NEET PG (all other MD / MS seats)", url: "neet-pg.html" }
              - { label: "FMGE screening test", url: "fmge.html" }
              - { label: "UPSC CMS", url: "upsc-cms.html" }
              - { label: "MBBS career guide", url: "mbbs.html" }
    sources:
      - { id: ini-notice, name: "AIIMS New Delhi — Admission Notice No. 148/2026, INI-CET January 2027 (2 Sep 2026)", url: "https://www.aiimsexams.ac.in/advertisement/6aaab710c7a01ed08da4242d", covers: "courses, participating INIs, registration and exam dates", checked: 2026-10-15 }
      - { id: ini-a, name: "AIIMS New Delhi — INI-CET January 2027 Prospectus Part A", url: "https://www.aiimsexams.ac.in/prospectus/6aaab710c7a01ed08da4242d", covers: "participating institutes, eligibility, minimum aggregate, sponsored rules, fees, CBT scheme, marking, percentile cut-offs, tie rules, seat allocation", checked: 2026-10-15 }
      - { id: ini-b, name: "AIIMS New Delhi — INI-CET January 2027 Prospectus Part B (AIIMS)", url: "https://www.aiimsexams.ac.in/prospectus/6aaab710c7a01ed08da4242d", covers: "AIIMS reservation, PwBD, institutional preference, contract, bond amounts, Junior Resident pay", checked: 2026-10-15 }
      - { id: ini-portal, name: "AIIMS examination portal — INI-CET sessions and Part B prospectus list", url: "https://www.aiimsexams.ac.in/landingpage/courses/advertisement/68dbf0b6d6fe8f55c65468aa", covers: "INI-CET notices for the January and July sessions", checked: 2026-10-15 }
  # ---------------------------------------------------------------- FMGE (NBEMS)
  - slug: fmge
    short: "FMGE"
    stream: medical
    checked: 2026-10-15
    body: "National Board of Examinations in Medical Sciences (NBEMS)"
    eyebrow: "Screening Test · Foreign Medical Graduates · October 2026 session"
    title: "FMGE — eligibility, pass mark, blueprint &amp; fee"
    lede: "The screening test that Indian citizens and OCI holders with a foreign primary medical degree must pass before the NMC or a State Medical Council will register them. NBEMS now holds it three times a year; this page follows the October 2026 Information Bulletin."
    facts:
      - { label: "Conducted by", value: "NBEMS (Screening Test Regulations, 2002)", source: fm-ib }
      - { label: "Next test", value: "31 Oct 2026 · result by 30 Nov 2026", source: fm-ib }
      - { label: "Paper", value: "300 MCQs in 2 parts, one day", source: fm-ib }
      - { label: "To pass", value: "150 of 300 · no negative marking", source: fm-ib }
    official:
      - { label: "FMGE page (natboard.edu.in)", url: "https://natboard.edu.in/viewnbeexam?exam=fmge" }
      - { label: "Information Bulletin Oct 2026 (PDF)", url: "https://nbe.edu.in/IB/FMGE%20october%202026%20information%20bulletin%20v2.2.pdf" }
    sections:
      - id: overview
        nav: "Overview"
        eyebrow: "Overview &amp; governing bodies"
        heading: "The licence gate for foreign MBBS graduates"
        parts:
          - p: "Under the <strong>Screening Test Regulations, 2002</strong>, an Indian citizen or Overseas Citizen of India with a primary medical qualification from an institution outside India must pass a screening test to get provisional or permanent registration with the NMC (earlier MCI) or a State Medical Council. <strong>NBEMS</strong> conducts it, publishes the result and hands it to the NMC and all State Medical Councils."
            source: fm-ib
          - p: "The June 2026 session was held on 28 June 2026. NBEMS has moved to <strong>three tests a year</strong>; the next is on <strong>31 October 2026</strong>."
            source: fm-ib
          - table:
              caption: "FMGE October 2026 calendar"
              head: ["Step", "Date"]
              rows:
                - ["Online application", "11 Sep 2026 (5 pm) – 25 Sep 2026 (11:55 pm)"]
                - ["Admit cards", "27 Oct 2026"]
                - ["Examination", "31 Oct 2026"]
                - ["Result", "By 30 Nov 2026"]
            source: fm-ib
          - warn: "Applications for the October 2026 test closed on 25 September 2026. The bulletin for the following session was not on the NBEMS FMGE page on 15 October 2026."
            source: fm-page
      - id: eligibility
        nav: "Eligibility"
        eyebrow: "Primary degree constraints"
        heading: "A recognised foreign degree, passed by the cut-off date"
        parts:
          - list:
              - "You are a <strong>citizen of India or an OCI</strong> holder."
              - "Your <strong>primary medical qualification</strong> is confirmed by the Indian Embassy concerned as recognised for enrolment as a medical practitioner in the country that awarded it."
              - "The result of its final examination was declared <strong>on or before 31 August 2026</strong> — with documents that clearly show you passed every required course."
            source: fm-ib
          - p: "<strong>NEET-UG rule:</strong> anyone who went abroad for a primary medical qualification on or after May 2018 must have qualified NEET-UG (Gazette notification of 1 March 2018); the NEET result counts as the Eligibility Certificate, and is valid for three years from its declaration (notification of 14 March 2019). The candidate must also meet the MBBS admission criteria of the Graduate Medical Education Regulations, 1997."
            source: fm-ib
          - note: "Exempt from the screening test: holders of an undergraduate medical degree from Australia, Canada, New Zealand, the UK or the USA who also hold a postgraduate medical degree from one of those countries and are recognised to practise there."
            source: fm-ib
      - id: scheme
        nav: "Exam scheme"
        eyebrow: "Exam scheme &amp; marking matrix"
        heading: "300 questions over two sittings, no negative marks"
        parts:
          - list:
              - "One paper of <strong>300 multiple-choice questions</strong>, 4 options each, in English, computer-based."
              - "Two parts on the same day, <strong>150 questions each</strong>, with a break between them: Part I 9:00 – 11:30 am, Part II 2:00 – 4:30 pm, plus up to 3 extra minutes per part for attendance checks (153 minutes each)."
              - "Each part is split into time-bound sections that lock when their time ends."
              - "<strong>No negative marking.</strong>"
            source: fm-ib
          - table:
              caption: "FMGE blueprint — pre &amp; para-clinical (100 marks)"
              head: ["Subject", "Marks"]
              rows:
                - ["Anatomy", "17"]
                - ["Physiology", "17"]
                - ["Biochemistry", "17"]
                - ["Pathology", "13"]
                - ["Microbiology", "13"]
                - ["Pharmacology", "13"]
                - ["Forensic Medicine", "10"]
            source: fm-ib
          - table:
              caption: "FMGE blueprint — clinical (200 marks)"
              head: ["Subject", "Marks"]
              rows:
                - ["Medicine (33), Psychiatry (5), Dermatology &amp; STD (5), Radiotherapy (5)", "48"]
                - ["General Surgery (32), Anaesthesiology (5), Orthopaedics (5), Radiodiagnosis (5)", "47"]
                - ["Obstetrics &amp; Gynaecology", "30"]
                - ["Community Medicine", "30"]
                - ["Paediatrics", "15"]
                - ["Ophthalmology", "15"]
                - ["Otorhinolaryngology (ENT)", "15"]
            source: fm-ib
      - id: reservation
        nav: "Pass rule"
        eyebrow: "Qualifying rule &amp; what it unlocks"
        heading: "One pass mark for everyone"
        parts:
          - list:
              - "FMGE is a qualifying test: you pass with <strong>at least 150 marks out of 300</strong>. Only Pass / Fail is shown; Part I and Part II marks are not published."
              - "No re-totalling, re-evaluation or grace marks."
              - "<strong>No limit on attempts</strong> — but once you pass, you cannot sit FMGE again."
            source: fm-ib
          - p: "Passing FMGE, registering with the NMC / a State Medical Council and finishing internship makes a foreign graduate eligible for NEET-PG; for INI-CET, FMGE marks are used in place of the MBBS aggregate."
            source: npg-ib
      - id: fees
        nav: "Fee"
        eyebrow: "Application steps &amp; registration fee"
        heading: "₹4,650 including GST"
        parts:
          - table:
              caption: "FMGE October 2026 examination fee"
              head: ["Part", "Amount"]
              rows:
                - ["Examination fee", "₹3,940.68"]
                - ["GST at 18%", "₹709.32"]
                - ["Total payable", "₹4,650"]
            source: fm-ib
          - list:
              - "Apply online on the NBEMS portal and upload the primary medical qualification certificate (apostilled or attested by the Indian Embassy), the Eligibility Certificate or NEET result as applicable, and proof of citizenship."
              - "The fee is paid only through the payment gateway (gateway charges extra)."
            source: fm-ib
      - id: horizons
        nav: "Where it leads"
        eyebrow: "Career horizons &amp; mapped institutions"
        heading: "Registration, then the PG race"
        parts:
          - p: "An FMGE pass is what NBEMS hands to the NMC and the State Medical Councils for registration. From there the routes are the same as for Indian MBBS graduates: NEET-PG or INI-CET for postgraduate seats, and UPSC CMS for central government doctor posts."
            source: fm-ib
          - links:
              - { label: "NEET PG", url: "neet-pg.html" }
              - { label: "INI-CET", url: "ini-cet.html" }
              - { label: "UPSC CMS", url: "upsc-cms.html" }
              - { label: "NEET UG", url: "neet-ug.html" }
    sources:
      - { id: fm-ib, name: "NBEMS — FMGE October 2026 Information Bulletin (v2.2)", url: "https://nbe.edu.in/IB/FMGE%20october%202026%20information%20bulletin%20v2.2.pdf", covers: "Screening Test Regulations, three sessions a year, calendar, eligibility, NEET-UG rule, exemptions, pattern, timing, blueprint, pass mark, attempts, fee", checked: 2026-10-15 }
      - { id: fm-page, name: "NBEMS — FMGE examination page", url: "https://natboard.edu.in/viewnbeexam?exam=fmge", covers: "sessions and bulletins published (June 2026, October 2026)", checked: 2026-10-15 }
      - { id: npg-ib, name: "NBEMS — NEET-PG 2026 Information Bulletin", url: "https://drive.google.com/file/d/1WmFcaFZhEAaRFrBBgTGUENX81cQwQkVT/view", covers: "NEET-PG eligibility for foreign medical graduates", checked: 2026-10-15 }
  # ---------------------------------------------------------------- AIIMS NORCET (Nursing Officer)
  - slug: aiims-norcet
    short: "AIIMS NORCET"
    stream: nursing
    checked: 2026-10-15
    body: "AIIMS New Delhi (Examination Section)"
    eyebrow: "Recruitment Test · Nursing · NORCET-11 (2026)"
    title: "AIIMS NORCET — eligibility, two-stage scheme, quotas &amp; fees"
    lede: "The Nursing Officer Recruitment Common Eligibility Test, run by AIIMS New Delhi twice a year, fills Nursing Officer (Group B) posts at AIIMS New Delhi, the other AIIMS and several central hospitals. This page follows the NORCET-11 advertisement, Notice No. 103/2026."
    colleges_href: "colleges-nursing.html"
    facts:
      - { label: "Conducted by", value: "AIIMS New Delhi", source: nc-adv }
      - { label: "Post", value: "Nursing Officer · Group B · Pay Level 7", source: nc-adv }
      - { label: "Stages (NORCET-11)", value: "Prelims 12 Sep 2026 · Mains 30 Sep 2026", source: nc-adv }
      - { label: "Fee", value: "₹3,000 · ₹2,400 SC/ST/EWS · PwBD nil", source: nc-adv }
    official:
      - { label: "aiimsexams.ac.in", url: "https://www.aiimsexams.ac.in/" }
      - { label: "NORCET-11 advertisement", url: "https://www.aiimsexams.ac.in/advertisement/6a6350f7e5a81c4267f4ff04" }
    sections:
      - id: overview
        nav: "Overview"
        eyebrow: "Overview &amp; governing bodies"
        heading: "One test for Nursing Officer posts across the AIIMS"
        parts:
          - p: "AIIMS New Delhi invites applications for NORCET to recruit <strong>Nursing Officers at Level 7</strong> of the pay matrix (pre-revised Pay Band-2, ₹9,300 – 34,800 with ₹4,600 grade pay), <strong>Group B</strong>, for AIIMS New Delhi and the other AIIMS against the vacancies each institute reports. The Examination Section only conducts the test — appointment is decided by each participating institute."
            source: nc-adv
          - p: "NORCET-11 carries separate advertisements for AIIMS New Delhi and other AIIMS, JIPMER, ESIC, CIP Ranchi, other central government hospitals in Delhi, and NITRD."
            source: nc-portal
          - table:
              caption: "NORCET-11 calendar"
              head: ["Step", "Date"]
              rows:
                - ["Online registration", "24 Jul – 13 Aug 2026 (5 pm)"]
                - ["NOC upload (government employees)", "By 18 Aug 2026 (5 pm)"]
                - ["Application status", "24 Aug 2026"]
                - ["Exam city intimation", "3 Sep 2026"]
                - ["Admit card", "9 Sep 2026"]
                - ["Stage I — NORCET Preliminary (CBT)", "12 Sep 2026 (Saturday)"]
                - ["Stage II — NORCET Mains (CBT)", "30 Sep 2026 (Wednesday)"]
            source: nc-adv
          - warn: "NORCET-11 is over — AIIMS published the Stage II result on 10 October 2026. The advertisement says NORCET is planned twice a year, so watch the portal for NORCET-12."
            source: nc-portal
      - id: eligibility
        nav: "Eligibility"
        eyebrow: "Primary degree constraints"
        heading: "B.Sc. Nursing — or GNM plus two years' experience"
        parts:
          - list:
              - "<strong>Route I:</strong> B.Sc. (Hons) Nursing / B.Sc. Nursing, or B.Sc. (Post-Certificate) / Post-Basic B.Sc. Nursing, from an INC / State Nursing Council recognised institute or university, <strong>and</strong> registration as Nurse &amp; Midwife with a State / Indian Nursing Council."
              - "<strong>Route II:</strong> Diploma in General Nursing Midwifery (GNM) from a recognised institute, registration as Nurse &amp; Midwife, <strong>and two years' experience</strong> in a hospital of at least 50 beds, gained after the qualification and registration."
              - "Qualification, registration and experience must all be complete by the closing date of registration."
            source: nc-adv
          - table:
              caption: "Age limit 18 – 30 years on the closing date, with relaxation"
              head: ["Category", "Extra years"]
              rows:
                - ["SC / ST", "5"]
                - ["OBC", "3"]
                - ["PwBD", "10 (13 for OBC, 15 for SC / ST), up to age 56"]
                - ["Ex-servicemen", "Military service + 3 years"]
                - ["Central Govt. civilian employees (3 years' service)", "5 (8 OBC, 10 SC / ST)"]
            source: nc-adv
      - id: scheme
        nav: "Exam scheme"
        eyebrow: "Exam scheme &amp; marking matrix"
        heading: "A qualifying prelim, then a case-based main"
        parts:
          - table:
              caption: "NORCET-11 two-stage scheme"
              head: ["", "Stage I — Preliminary", "Stage II — Mains"]
              rows:
                - ["Questions", "100 MCQs, 100 marks", "160 MCQs, 160 marks"]
                - ["Content", "20 general knowledge &amp; aptitude + 80 nursing", "Whole nursing syllabus, case-scenario based"]
                - ["Duration", "90 min — 5 sections of 20 Q, 18 min each", "180 min — 4 sections of 40 Q, 45 min each"]
                - ["Negative marking", "−1/3 per wrong answer", "−1/3 per wrong answer"]
                - ["Qualifying", "50 / 45 / 40 percentile (UR-EWS / OBC / SC-ST)", "50% / 45% / 40% (UR-EWS / OBC / SC-ST)"]
                - ["Role", "Shortlist only, not used for merit", "Final merit list"]
            source: nc-adv
          - list:
              - "PwBD candidates get a further 5 percentile (Stage I) or 5% (Stage II) relaxation in every category."
              - "Stage II calls 5 times the seats in each category from Stage I qualifiers, plus all qualified PwBD candidates and ties at the cut-off."
              - "Sections open one at a time and lock when their time ends. Multi-shift papers are normalised under AIIMS Notice No. 35/2023."
              - "Mains ties: fewer wrong answers in Stage II, then Stage I score, then fewer wrong answers in Stage I, then age (older first)."
            source: nc-adv
      - id: reservation
        nav: "Quotas &amp; allocation"
        eyebrow: "Reservation &amp; institutional quotas"
        heading: "80% of AIIMS seats for women, one allocation round"
        parts:
          - list:
              - "At the participating AIIMS, <strong>80% of seats are reserved for women and 20% for men</strong> (decision of the 4th CIB meeting, 27 July 2019)."
              - "PwBD reservation applies horizontally across categories; the post is identified for OL, AAV, Dw and LC candidates with 40% or more benchmark disability."
              - "SC / ST / OBC candidates who use age relaxation are considered only for their category's reserved seats."
              - "OBC-NCL certificates must be in the central format, valid for 2026-27 and issued between 1 Apr 2026 and 13 Aug 2026."
            source: nc-adv
          - p: "After Stage II, qualified and eligible candidates fill choices of institutes. There is generally <strong>one allocation round</strong>, in merit order; a candidate who does not join an allotted seat loses the candidature, and there is <strong>no waiting list</strong> because NORCET is held twice a year."
            source: nc-adv
      - id: fees
        nav: "Fees"
        eyebrow: "Application steps &amp; registration fees"
        heading: "Fee by category, SC / ST refunded after the result"
        parts:
