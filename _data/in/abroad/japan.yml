title: "Study in Japan from India"
seo_title: "Study in Japan from India: COE, MEXT and 28-Hour Rule"
description: "Japan from India: Certificate of Eligibility, 'Student' status up to 4 years 3 months, ¥535,800 national-university tuition, MEXT scholarships, 28 work hours and 1-year job hunting."
lede: "Japan's student route runs through a Certificate of Eligibility (COE) that your school applies for in Japan, then a visa from the Embassy. The MEXT government scholarship is applied for through the Embassy of Japan in India."
facts:
  - { label: "National university tuition", value: "¥535,800 a year (average)", source: jp_fees_guide }
  - { label: "Average living cost", value: "¥105,000 a month", source: jasso_cost }
  - { label: "Part-time work", value: "28 hours a week (with permission)", source: jasso_pt }
  - { label: "After graduating", value: "Up to 1 year to job-hunt", source: jasso_change }
card:
  line: "COE via your school; MEXT scholarship via the Embassy"
  psw: "1 year job hunting, then work status"
  work: "28 h/week (permission needed)"
  funds: "Shown for the COE"
tests:
  - { exam: jlpt, need: "Japanese-taught courses and language schools ask for Japanese ability; JLPT is the usual proof", source: jasso_imm }
  - { exam: ielts, need: "English-taught degree programmes set their own score", source: jasso_imm }
# Official course searches / institution lists (rendered under "Intakes & courses"). Read 2026-10-29.
find:
  - { label: "Study in Japan", by: "JASSO (Government-approved)", url: "https://www.studyinjapan.go.jp/en/", what: "Schools, entrance exams, scholarships and immigration steps for studying in Japan." }
  - { label: "JASSO", by: "Japan Student Services Organization", url: "https://www.jasso.go.jp/en/", what: "The government body behind the EJU entrance exam and many scholarships for international students." }
pillars:
  language_and_eligibility:
    heading: "Language and status of residence"
    parts:
      - points:
          - { t: "Study at universities, colleges of technology, specialised training colleges or Japanese language schools is under the 'Student' status of residence, for up to 4 years and 3 months as set by the Minister of Justice.", source: jasso_imm }
          - { t: "Japanese-taught programmes ask for Japanese ability; English-taught degree programmes set their own English requirement.", source: jasso_imm }
  intakes_and_streams:
    heading: "When the year starts"
    parts:
      - points:
          - { t: "The Japanese academic year starts in April; some universities also admit in September or October.", source: jasso_univ }
          - { t: "MEXT 2027 scholarships: research students applied 20 April–15 May 2026; undergraduate, KOSEN and specialised training college students 23 April–25 May 2026. These rounds are closed.", source: emb_mext }
  tuition_and_living_costs:
    heading: "What Japan costs"
    parts:
      - money:
          - { item: "Tuition, national university (average)", cur: JPY, amount: 535800, per: "year", source: jp_fees_guide }
          - { item: "Admission fee, national university (first year)", cur: JPY, amount: 282000, per: "one time", source: jp_fees_pdf }
          - { item: "Average monthly living cost (excluding study)", cur: JPY, amount: 105000, per: "month", source: jasso_cost }
          - { item: "Average monthly part-time earnings", cur: JPY, amount: 81000, per: "month", source: jasso_pt }
          - { item: "MEXT undergraduate allowance", cur: JPY, amount: 117000, per: "month", source: mext_guide }
      - points:
          - { t: "Rent averages ¥41,000 a month nationally and ¥57,000 in Tokyo.", source: jasso_cost }
          - { t: "Part-time work cannot cover all costs: JASSO's survey average is about ¥81,000 a month, and claims of ¥200,000–300,000 a month are false.", source: jasso_pt }
  global_scholarships:
    heading: "MEXT and other funding"
    parts:
      - awards:
          - { name: "Japanese Government (MEXT) Scholarship", by: "MEXT, through the Embassy of Japan in India", who: "Research (master's/PhD), undergraduate, college of technology (KOSEN) and specialised training college applicants", gives: "Monthly allowance (¥117,000 for undergraduates) and tuition; no application fee", url: "https://www.in.emb-japan.go.jp/Education/japanese_government_scholarships.html", source: emb_mext }
      - points:
          - { t: "No application fee is charged; anyone who asks for a fee or deposit for MEXT has no link with the Japanese government.", source: emb_mext }
          - { t: "The Embassy lists 12 undergraduate, 12 KOSEN and 12 specialised training college places for India in the 2027 round.", source: emb_mext }
  application_funnel:
    heading: "From admission to landing"
    parts:
      - steps:
          - { title: "Admission", text: "Apply to the school; it usually acts as your proxy." }
          - { title: "Certificate of Eligibility", text: "The school (or your proxy) applies at a regional immigration bureau in Japan; you may need savings, income and source-of-funds documents.", source: jasso_imm }
          - { title: "Visa in India", text: "Apply through VFS with the COE; applications are accepted up to 3 months before travel.", source: emb_visa }
          - { title: "Landing", text: "Get your residence card at major airports and register your address within 14 days.", source: jasso_imm }
  visa_chokepoints:
    heading: "The student visa in short"
    parts:
      - points:
          - { t: "The Embassy never asks for payments by phone or e-mail to verify documents or speed up a visa; processing cannot be expedited.", source: emb_visa }
          - { t: "Students who neglect attendance because of part-time work can be refused an extension and have to leave Japan.", source: jasso_pt }
  post_study_work:
    heading: "Work during and after your course"
    parts:
      - points:
          - { t: "Part-time work needs 'permission to engage in activity other than that permitted'; it can be granted at the airport on first entry. Limit: 28 hours a week (up to 8 hours a day in long holidays).", source: jasso_pt }
          - { t: "To work full time you change status, for example to Engineer/Specialist in Humanities/International Services.", source: jasso_change }
          - { t: "If you have no job at graduation, you can change to 'Designated Activities' to keep job-hunting: 6 months, extendable once, up to 1 year.", source: jasso_change }
visa:
  slug: japan-student-visa
  name: "Japanese student visa (COE route)"
  short: "Student visa"
  seo_title: "Japan Student Visa from India: COE, VFS and Landing Steps"
  description: "Japan student visa for Indians: Certificate of Eligibility via your school, proof of funds, VFS application up to 3 months before travel, residence card and the 28-hour work rule."
  lede: "The visa follows the Certificate of Eligibility. Once the COE is issued in Japan, you apply for the visa in India through VFS."
  facts:
    - { label: "First document", value: "Certificate of Eligibility (COE)", source: jasso_imm }
    - { label: "Where to apply", value: "VFS in India, no appointment needed", source: emb_visa }
    - { label: "Max stay per grant", value: "4 years 3 months", source: jasso_imm }
    - { label: "Register address", value: "Within 14 days of moving in", source: jasso_imm }
  official:
    - { label: "Embassy of Japan in India — Visa", url: "https://www.in.emb-japan.go.jp/itpr_en/Visa.html" }
    - { label: "Study in Japan — Immigration", url: "https://www.studyinjapan.go.jp/en/planning/immigration-procedures/" }
  sections:
    - id: steps
      nav: Steps
      eyebrow: "Order of work"
      heading: "Step by step"
      parts:
        - steps:
            - { title: "COE application in Japan", text: "Usually by your school as proxy, with your funding documents.", source: jasso_imm }
            - { title: "Visa at VFS", text: "Submit up to 3 months before travel; pay only the visa fee and VFS service charge.", source: emb_visa }
            - { title: "Arrival", text: "Landing permission and residence card; apply for part-time work permission at the airport if you want it.", source: jasso_pt }
    - id: chokepoints
      nav: "Common problems"
      eyebrow: "Where files go wrong"
      heading: "Choke points to check twice"
      parts:
        - points:
            - { t: "Weak proof of funds for the COE (savings certificate, income for the past year, source of funds).", source: jasso_imm }
            - { t: "Paying 'agents' who promise faster visas.", source: emb_visa }
doubts:
  - { q: "How many hours can students work in Japan?", a: "Up to 28 hours a week, and up to 8 hours a day during long school holidays, after getting permission for activities outside your status.", source: jasso_pt }
  - { q: "Is there a fee for the MEXT scholarship?", a: "No. MEXT applications are free; anyone charging a fee or deposit has no link with the Japanese government.", source: emb_mext }
  - { q: "What is the tuition at a Japanese national university?", a: "The average annual tuition at national universities is 535,800 yen, with an admission fee of 282,000 yen in the first year at most of them.", source: jp_fees_pdf }
  - { q: "Can I stay in Japan after graduation to look for a job?", a: "Yes. You can change to Designated Activities for job hunting, granted for 6 months with one extension, up to 1 year.", source: jasso_change }
