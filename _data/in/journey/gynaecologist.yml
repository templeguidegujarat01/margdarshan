# Journey Blueprint — Gynaecologist (MBBS → NEET-PG → MD / MS / DNB Obstetrics & Gynaecology). Printed on journey-gynaecologist.html (_includes/journey-doubts.html).
# Rules, classes and the money items / sources several careers share: _data/in/journey_common.yml.
# `money_defs` / `sources` below are used only by this career. The MBBS part cites the doctor blueprint's sources.
# Check: node scripts/check-journey-matrix.mjs
id: gynaecologist
v: 2
name: "Gynaecologist (MBBS → NEET-PG → MD / MS / DNB OBG)"
search: ["gynaecologist", "gynecologist", "obstetrician", "obstetrics and gynaecology", "obg", "specialist doctor", "neet pg", "md ms"]
page: "neet-pg.html"
doubts_page: "journey-gynaecologist.html"
gate: "Class 12 with Physics, Chemistry, Biology and English → NEET (UG) → MBBS with a 12-month internship → NEET-PG → a 3-year MD / MS or DNB in Obstetrics & Gynaecology (with a 3-month District Residency) → specialist. M.Ch. Gynaecological Oncology or Reproductive Medicine can follow."
gate_source: [neet-ib, crmi, npg26, pgmer23]
core:
  what:
    text: "A gynaecologist (obstetrician and gynaecologist) is a specialist doctor for pregnancy, childbirth and women's reproductive health. In India the specialist degree is an MD / MS or DNB in Obstetrics & Gynaecology, entered through NEET-PG after MBBS."
    source: [npg26, pgmer23]
  day:
    - "Run antenatal clinics and manage labour and deliveries."
    - "Operate — caesarean sections and gynaecological surgery."
    - "Treat infertility, menstrual and menopausal problems and screen for cancers."
  pay:
    - { level: "Specialist Grade III (Obstetrics and Gynaecology), Central Health Service (UPSC Advt 06/2026)", value: "Pay Level 11 plus non-practising allowance", source: upsc-adv06 }
    - { level: "Government doctor after MBBS (UPSC CMS 2026)", value: "Pay Level 10 · ₹56,100 – ₹1,77,500 plus NPA", source: cms }
  pay_note: "PG residents get a stipend at par with state or central government medical colleges in that state; private-practice income is not officially published."
  routes:
    - { title: "MBBS → NEET-PG → MD / MS OBG", text: "NEET-PG is the single entrance for MD, MS and PG Diploma seats in government, private and deemed colleges. A broad-speciality MD / MS takes 3 years.", source: [npg26, pgmer23] }
    - { title: "DNB Obstetrics & Gynaecology", text: "NBEMS's post-MBBS DNB seats are also filled through the NEET-PG rank.", source: npg26 }
    - { title: "INI-CET for AIIMS, JIPMER, PGIMER, NIMHANS", text: "These institutes do not admit through NEET-PG — they hold INI-CET.", source: npg26 }
    - { title: "Super-speciality", text: "M.Ch. Gynaecological Oncology and M.Ch. Reproductive Medicine and Surgery take an MD / MS / DNB in Obstetrics and Gynaecology as the feeder degree.", source: pgmer23 }
  cost_time:
    - { label: "Time after Class 12", value: "MBBS with 12-month internship, then a 3-year MD / MS", source: [crmi, pgmer23] }
    - { label: "NEET-PG 2026 fee", value: "₹3,500 General / OBC / EWS · ₹2,500 SC / ST / PwBD", source: npg26 }
    - { label: "NEET (UG) fee (India centre)", value: "₹1,700 General · ₹1,600 EWS / OBC-NCL · ₹1,000 SC / ST / PwBD / third gender", source: neet-ib }
  cost_note: "MBBS and PG tuition fees differ by state and college, so they are not printed here."
  challenges:
    - text: "NEET-PG needs the 50th percentile (General / EWS) just to qualify, and qualifying does not by itself give a seat."
      source: npg26
    - text: "You cannot sit NEET-PG until your 12-month internship ends by the bulletin's cut-off date (30 September 2026 for NEET-PG 2026)."
      source: npg26
    - text: "Central specialist posts ask for 3 years' experience after the PG degree (5 after a PG diploma)."
      source: upsc-adv06
  not_for:
    - "You cannot handle night calls and emergencies — labour does not keep office hours."
    - "You faint at blood or surgery."
    - "You want to start earning early — the road is MBBS plus at least 3 more years."
journey:
  - stages: [c8, c9]
    title: "Biology, Chemistry and grit"
    do:
      - text: "NEET (UG) has Physics 45, Chemistry 45 and Biology 90 questions — 180 in all, 720 marks."
        source: neet-ib
    doubts:
      - q: "What does a gynaecologist do?"
        a: "A gynaecologist (obstetrician and gynaecologist) looks after pregnancy, childbirth and women's reproductive health. The specialist degree is an MD / MS or DNB in Obstetrics & Gynaecology after MBBS."
        next: "Read the Routes list above."
        source: [npg26, pgmer23]
      - q: "How many years does it take to become a gynaecologist?"
        a: "MBBS with a compulsory rotating internship of at least 12 months, then a 3-year MD / MS in Obstetrics & Gynaecology after clearing NEET-PG."
        next: "Plan for a long road and pace yourself."
        source: [crmi, pgmer23]
  - stages: [c10]
    title: "Choose PCB with English"
    do:
      - text: "NMC allows NEET (UG) only after 10+2 with Physics, Chemistry, Biology / Biotechnology and English."
        source: neet-ib
    stream: "Science with Biology (PCB) and English."
    doubts:
      - q: "Which subjects do I need in Class 11 and 12?"
        a: "Physics, Chemistry, Biology or Biotechnology, and English — the subjects NMC requires for NEET (UG)."
        next: "Take PCB with English in Class 11."
        source: neet-ib
  - stages: [c11, c12]
    title: "NEET (UG) for MBBS"
    do:
      - text: "NEET (UG) is 180 questions for 720 marks in 3 hours, with +4 for a correct answer and −1 for a wrong one."
        source: neet-ib
      - text: "Minimum age is 17 on or before 31 December of the exam year; there is no upper age limit."
        source: neet-ib
    exams:
      - { name: "NEET (UG) 2026", when: "3 May 2026 (re-exam 21 June 2026)", source: [neet-ib, neet-re] }
    money: [neet-fee]
    doubts:
      - q: "Is there an age limit for NEET (UG)?"
        a: "You must be 17 on or before 31 December of the exam year. There is no upper age limit."
        next: "Prepare without worrying about an age cap."
        source: neet-ib
      - q: "What percentile do I need in NEET (UG)?"
        a: "The 50th percentile for General / EWS, the 40th for SC, ST and OBC and the 45th for PwBD (General) to be eligible for admission."
        next: "Aim far above the cut-off — seats go by rank."
        source: neet-ib
      - q: "Is there negative marking in NEET (UG)?"
        a: "Yes. A correct answer gets +4, a wrong one −1 and an unanswered question 0, across 180 questions for 720 marks."
        next: "Skip questions you cannot narrow down."
        source: neet-ib
  - stages: [ug]
    title: "MBBS and internship"
    do:
      - text: "After the final MBBS exam you do a rotating internship of at least 12 months; interns get a stipend fixed by the authority that runs the college."
        source: crmi
      - text: "Your State Medical Council registers you provisionally for the internship."
        source: nmc-reg
    money: [mbbs-intern]
    doubts:
      - q: "When can I write NEET-PG?"
        a: "Only after MBBS with your 12-month internship completed by the bulletin's cut-off — 30 September 2026 for NEET-PG 2026. Applications from candidates finishing later are rejected."
        next: "Track your internship end date against the bulletin."
        source: npg26
      - q: "Is NEET-PG the only way into MD / MS?"
        a: "For almost all seats, yes — All India Quota, state quota, private and deemed colleges, armed forces institutions and DNB. AIIMS, JIPMER, PGIMER and NIMHANS admit through INI-CET instead."
        next: "Prepare for both NEET-PG and INI-CET to widen your options."
        source: npg26
  - stages: [grad]
    title: "NEET-PG and MD / MS OBG"
    do:
      - text: "NEET-PG: 180 MCQs in 3 hours 30 minutes, in English, computer-based; +4 correct, −1 wrong. The paper runs in five timed sections you cannot revisit."
        source: npg26
      - text: "Every MD / MS student does a compulsory 3-month District Residency Programme in district hospitals in the 3rd, 4th or 5th semester."
        source: pgmer23
    exams:
      - { name: "NEET-PG 2026", when: "30 Aug 2026 · result by 30 Sep 2026", source: npg26 }
    money: [npg-fee, pg-stipend]
    doubts:
      - q: "What is the NEET-PG cut-off percentile?"
        a: "50th percentile for General / EWS, 45th for UR PwBD and 40th for SC, ST and OBC (including their PwBD) in NEET-PG 2026."
        next: "Remember seats go by rank, not just by qualifying."
        source: npg26
      - q: "Who fills the All India Quota PG seats?"
        a: "The Medical Counselling Committee (MCC, DGHS) fills the 50% All India Quota, all deemed and central university seats and all-India open DNB seats. State quota seats go through each state's counselling authority under its own rules."
        next: "Register for both MCC and your state's counselling."
        source: npg26
      - q: "Are PG residents paid?"
        a: "Yes. PGMER 2023 says PG students in all institutions get a stipend at par with PG students of state or central government medical colleges in that state, with at least 20 days of paid leave a year and one weekly holiday."
        next: "Ask your college for the current stipend."
        source: pgmer23
      - q: "What is the District Residency Programme?"
        a: "A compulsory 3-month residential rotation in district hospitals for every MD / MS student, in the 3rd, 4th or 5th semester, while drawing the full stipend."
        next: "Expect to spend three months away from your college."
        source: pgmer23
      - q: "Is a PG Diploma in Gynaecology still available?"
        a: "PGMER 2023 still lists the 2-year Diploma in Obstetrics and Gynaecology (D.G.O.), but colleges may now convert diploma seats to degree seats and no new applications to start or increase them are taken."
        next: "Aim for MD / MS or DNB."
        source: pgmer23
  - stages: [work]
    title: "Specialist jobs and super-speciality"
    do:
      - text: "UPSC's Advertisement 06/2026 sought 22 Specialist Grade III (Obstetrics and Gynaecology) doctors for the Central Health Service, at Pay Level 11 plus NPA."
        source: upsc-adv06
    doubts:
      - q: "What do central government gynaecologist posts ask for?"
        a: "UPSC's 2026 Specialist Grade III (Obstetrics and Gynaecology) post needs MBBS plus MD / MS / DNB in Obstetrics and Gynaecology or a PG Diploma, and 3 years' experience after the PG degree (5 after the diploma). The age limit is 40 for UR / EWS, 43 for OBC and 45 for SC / ST."
        next: "Build your post-PG experience in a recognised hospital."
        source: upsc-adv06
      - q: "Can a gynaecologist super-specialise?"
        a: "Yes. M.Ch. Gynaecological Oncology and M.Ch. Reproductive Medicine and Surgery take an MD / MS / DNB in Obstetrics and Gynaecology as the feeder qualification; super-speciality courses take 3 years."
        next: "Prepare for NEET-SS after your MD / MS."
        source: pgmer23
board_note: "Any board, as long as Class 12 has Physics, Chemistry, Biology / Biotechnology and English."
board_source: neet-ib
