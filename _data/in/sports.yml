    facts:
      - { label: "Court (singles)", value: "<strong>23.77 m × 8.23 m</strong> · doubles 10.97 m wide", source: itf-rot }
      - { label: "Net height at centre", value: "<strong>0.914 m</strong> (3 ft)", source: itf-rot }
      - { label: "LA28 singles draw", value: "<strong>64</strong> per event — 56 by world ranking", source: itf-la28 }
      - { label: "AITA registration", value: "<strong>Compulsory</strong> for every AITA event", source: aita-jr26 }
    sections:
      - id: rules
        nav: "Court &amp; scoring"
        eyebrow: "Core rules &amp; selection formats"
        heading: "The court, and how a game, set and match are won"
        parts:
          - list:
              - "The court is <strong>23.77 m long</strong> and <strong>8.23 m wide</strong> for singles (<strong>10.97 m</strong> for doubles). The net is <strong>0.914 m</strong> high at the centre and 1.07 m at the posts."
            source: itf-rot
          - table:
              caption: "Tennis scoring in simple words"
              head: ["Unit", "How you win it"]
              rows:
                - ["<strong>Point</strong>", "The opponent fails to return the ball into your court, or serves two faults"]
                - ["<strong>Game</strong>", "Points are called Love, 15, 30, 40, Game. At 40–40 it is <strong>Deuce</strong>: you must then win <strong>two points in a row</strong>"]
                - ["<strong>Set</strong>", "First to <strong>6 games</strong> with a 2-game lead. In a tie-break set, at <strong>6–6</strong> a <strong>tie-break</strong> is played"]
                - ["<strong>Tie-break</strong>", "Points counted 1, 2, 3 …; first to <strong>7</strong> with a 2-point lead wins the game and the set"]
                - ["<strong>Match</strong>", "<strong>Best of 3 sets</strong> (win 2) or best of 5 (win 3)"]
            source: itf-rot
          - list:
              - "The server gets <strong>two serves</strong> per point; a <strong>foot fault</strong> — touching the baseline or the court with a foot during the serve — counts as a fault."
              - "In a tie-break, players change ends <strong>every six points</strong>."
              - "2026 changes: a clarification on where a doubles server may stand, and that a fault does not stand if players are found at the wrong ends during a tie-break."
            source: "itf-rot,itf-amend26"
      - id: recognition
        nav: "Recognition"
        eyebrow: "Institutional &amp; global recognition"
        heading: "Olympics, Asian Games, Grand Slams — and the cash that follows"
        parts:
          - table:
              caption: "LA28 Olympic tennis — the hard numbers"
              head: ["Rule", "What it says"]
              rows:
                - ["Events", "Men's and women's singles and doubles, <strong>mixed doubles</strong>"]
                - ["Places", "<strong>172</strong>; at most <strong>6 per country per gender</strong>, 4 in each singles draw"]
                - ["Singles", "64-player draws: <strong>56 by the ATP/WTA ranking of 12 June 2028</strong>, 1 host, 6 ITF places, 1 universality"]
                - ["Asian route", "The <strong>2026 Asian Games singles champion</strong> gets an ITF place if ranked in the world top 500"]
                - ["Doubles", "32 teams; the world top 10 in doubles first, then by combined ranking"]
                - ["Must also", "Your national association must be an ITF member in good standing since at least 31 Dec 2027"]
            source: itf-la28
          - table:
              caption: "Government cash award for a senior tennis medal or title (₹ lakh)"
              head: ["Event", "Gold / winner", "Silver / runner-up", "Bronze"]
              rows:
                - ["<strong>Olympic Games</strong>", "75", "50", "30"]
                - ["Asian Games / Commonwealth Games", "30", "20", "10"]
                - ["Australian Open, French Open, Wimbledon, US Open (every year)", "10", "7", "4"]
            source: myas-cash
          - note: "The Ministry's tennis list also includes the senior World Championships, the <strong>Davis Cup</strong> and the <strong>Billie Jean King Cup</strong>. Tennis is also a Khelo India Youth Games sport."
            source: "myas-cash,kiyg25"
      - id: eligibility
        nav: "Ages &amp; limits"
        eyebrow: "Physical benchmarks &amp; anti-doping"
        heading: "Age groups, tournament limits and anti-doping"
        parts:
          - table:
              caption: "AITA junior age groups and the yearly tournament limit (2026)"
              head: ["Age group", "Max AITA tournaments in a year"]
              rows:
                - ["Under 12 (born 2014–2019 for 2026)", "<strong>18</strong>"]
                - ["Under 14", "<strong>25</strong>"]
                - ["Under 16", "<strong>30</strong>"]
                - ["Under 18", "No limit"]
            source: aita-jr26
          - list:
              - "A younger player may play older age groups, but <strong>every</strong> tournament counts towards the yearly limit (singles and doubles of one event count as one). ITF and Asian Tennis Federation events do not count."
              - "Breaking the limit brings penalties, which may include heavy penalty points."
              - "Every player needs a <strong>valid AITA registration</strong>; without it you cannot enter any AITA event."
            source: aita-jr26
          - list:
              - "Under the anti-doping code you must be <strong>available for testing</strong> and check every medicine against the <strong>Prohibited List</strong>; apply to NADA for a <strong>TUE</strong> if you need a banned medicine."
