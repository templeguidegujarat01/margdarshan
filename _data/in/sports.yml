  # ------------------------------------------------------------------------------------------------ Cricket
  - slug: cricket
    short: "Cricket"
    domain: ball
    body: "International Cricket Council (ICC) · Board of Control for Cricket in India (BCCI)"
    card: "ICC playing conditions, BCCI's U16-to-Ranji ladder, age-fraud bans, IPL rules 2025-27, central contracts and match fees."
