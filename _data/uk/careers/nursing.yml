    title: "Registered Nurse Degree Apprenticeship"
    tag: "Level 6"
    who: "For people working in a healthcare setting, like a hospital."
    steps:
      - { tag: "Work", title: "Job in healthcare", text: "You need your employer's support.", kind: stage, source: ncs_nurse }
