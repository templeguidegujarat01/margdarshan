# USA Edition — the U.S. education ladder. Definitions follow NCES/IPEDS.
# There is no national Grade 10 or Grade 12 board exam in the U.S.; diploma
# requirements are set by states and local districts.

high_school:
  grades: ["9", "10", "11", "12"]
  credential: "High school diploma (or a state-recognized equivalent)"
  requirements_note: "Each state, and often each district, sets its own graduation requirements. NCES's 2018 state table shows state-required course credits from 11 (Maine) to 24 (in a dozen-plus states and DC), with Colorado, Massachusetts and Pennsylvania leaving them to local districts; some states also use end-of-course or exit exams."
  admissions_factors:
    - "GPA and grades in core subjects"
    - "Course rigor — honors, AP, IB, dual enrollment"
    - "Standardized tests where the college uses them"
    - "Essays / personal statement"
    - "Recommendations"
    - "Activities, work, service and internships"
  admissions_note: "How much each factor counts is decided by each college."
  sources: [nces_hs_credits]
  last_verified: 2026-10-07

levels:
  associate:
    name: "Associate degree"
    examples: ["A.A.", "A.S.", "A.A.S."]
    definition: "Normally requires at least 2 but less than 4 years of full-time-equivalent college work (IPEDS)."
    where: "Mostly community colleges and technical colleges"
    leads_to: "A job directly (some fields) or transfer into a bachelor's program"
    source: nces_ipeds_glossary
  bachelor:
    name: "Bachelor's degree"
    examples: ["B.A.", "B.S.", "B.S.E.", "B.S.N.", "B.B.A."]
    definition: "Normally requires at least 4 but not more than 5 years of full-time-equivalent college-level work, including 5-year co-op programs (IPEDS)."
    where: "Colleges and universities"
    source: nces_ipeds_glossary
  master:
    name: "Master's degree"
    examples: ["M.S.", "M.A.", "M.B.A.", "M.S.N."]
    where: "Graduate schools"
    source: nces_ipeds_glossary
  doctor_research:
    name: "Doctor's degree — research/scholarship"
    examples: ["Ph.D.", "Ed.D."]
    definition: "The highest award for graduate study (IPEDS)."
    source: nces_ipeds_glossary
  doctor_professional:
    name: "Doctor's degree — professional practice"
    examples: ["M.D.", "D.O.", "J.D.", "D.D.S.", "D.M.D.", "Pharm.D.", "D.P.T."]
    definition: "Awarded on completing a program for the credential or license needed for professional practice; total time including pre-professional study is at least 6 full-time-equivalent academic years (IPEDS)."
    note: "Most of these programs admit students after (or deep into) a bachelor's degree — e.g. medical and law school — not straight from high school."
    source: nces_ipeds_glossary

transfer:
  summary: "Many students start at a community college, earn an associate degree or credits, and transfer to a four-year college to finish a bachelor's."
  note: "Which credits transfer depends on the receiving college and any state transfer agreement; check before enrolling."
