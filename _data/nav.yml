# ---------------------------------------------------------------------------
# Edition switch (_includes/sidebar.html): a plain item at the end of the scrollable nav list
# that flips between the National India edition and the Global & State edition.
# `global_pages` = pages that belong to the Global & State edition; on those
# the button offers the way back to the National edition, elsewhere it
# offers the Global edition. Icons are inline SVG (flag emoji do not render
# on Windows, and the label is hidden in the collapsed icon rail).
# ---------------------------------------------------------------------------
editions:
  global_pages:
    - global-regional-hub.html
    - state-pathways.html
    - study-abroad.html
    - niche-careers.html
    - study-abroad/
    - state-pathways/
    - niche-careers/
  to_global:
    href: global-regional-hub.html
    label: Switch to Global & State Edition
    icon: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"/>'
  to_national:
    href: index.html
    label: Switch to National India Edition
    icon: '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>'
