sections:
  - id: "quick"
    hid: "quick-heading"
    alt: true
    eyebrow: "Quick answers"
    heading: "Architect at a glance"
    intro: "Check whether your Class 12 background qualifies. Duration and pay are in the summary at the top of the page."
    parts:
      - subhead: "Can I apply from my stream?"
      - streams:
          - label: "Science"
            fit: "Eligible"
            tone: "y"
            icon: "science"
          - label: "Commerce"
            fit: "Not eligible"
            tone: "n"
            icon: "commerce"
          - label: "Arts / Humanities"
            fit: "Not eligible"
            tone: "n"
            icon: "arts"
      - note: "Physics and Mathematics at Class 12 are compulsory for B.Arch admission; diploma holders with Maths have a separate route."
  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What does an Architect do?"
    parts:
      - overview:
          points:
            - "Architects turn a client's needs into designs, drawings and specifications, get approvals, and supervise construction."
            - "They balance structure, cost, climate, building codes and aesthetics, working with engineers and contractors."
            - "Specialisations include urban design, landscape, conservation, sustainable design and interiors."
  - id: "who"
    hid: "who-heading"
    alt: true
    eyebrow: "Fit check"
    heading: "Who should become an Architect"
    parts:
      - fit:
          match:
            - "Love drawing, design and how buildings work."
            - "Can handle long studio hours and criticism of your work."
            - "Want a creative career with technical depth."
          mismatch:
            - "Want quick earnings — early years are low-paid."
            - "Dislike maths and technical detail."
            - "Expect only creative work — paperwork and site visits are big parts of the job."
  - id: "eligibility"
    hid: "elig-heading"
    eyebrow: "Eligibility"
    heading: "What you need, stage by stage"
    parts:
      - elig_list:
          - "Class 12 with <strong>Physics and Mathematics</strong> as compulsory subjects, with the aggregate marks that CoA sets in its admission rules — or a 10+3 diploma with Mathematics."
          - "A valid score in <strong>NATA</strong> or <strong>JEE Main Paper 2</strong> (B.Arch)."
          - "Admission through the state, JoSAA or institute counselling that accepts your score."
  - id: "roadmap"
    hid: "roadmap-heading"
    alt: true
    eyebrow: "Step-by-step"
    heading: "Your full path to becoming an Architect"
    parts:
      - steps:
          - title: "Class 12 with Physics & Maths"
            text: "Practise drawing and sketching early."
          - title: "NATA or JEE Main Paper 2"
            text: "Aptitude, drawing and maths."
          - title: "B.Arch (5 years)"
            text: "Design studios, construction, history, services."
          - title: "Practical training"
            text: "Built into the B.Arch programme."
          - title: "Register with CoA"
            text: "Required to practise as an architect."
          - title: "Practice or specialise"
            text: "Firm, government, own studio, or M.Arch/M.Plan."
  - id: "exams"
    hid: "exams-heading"
    eyebrow: "Exams & licences"
    heading: "Entrance exams and registration"
    parts:
      - chips:
          - label: "NATA"
            text: "National Aptitude Test in Architecture, conducted by the Council of Architecture."
            source: "nata"
          - label: "JEE Main Paper 2"
            text: "B.Arch paper of JEE Main, used for NITs and many other colleges."
            source: "jee"
          - label: "CoA registration"
            text: "Only registered architects may use the title under the Architects Act, 1972."
            source: "coa"
  - id: "salary"
    hid: "salary-heading"
    alt: true
    eyebrow: "Indicative figures"
    heading: "Architect pay in India"
    intro: "Pay varies a lot by employer, city and experience; these are broad, commonly reported ranges, not guarantees."
    parts:
      - salary:
          - label: "Junior architect"
            value: "Modest"
            text: "Early-career pay in design firms is often low."
          - label: "Project architect"
            value: "Mid level"
            text: "Grows with project experience and responsibility."
          - label: "Principal / own practice"
            value: "High, variable"
            text: "Successful practices earn well; income depends on projects."
  - id: "jobs"
    hid: "jobs-heading"
    eyebrow: "Where they work"
    heading: "Employers & growth path"
    parts:
      - chips:
          - label: "Employers"
            text: "Architecture and design firms, real-estate developers, CPWD/PWD and urban bodies, consultancies"
          - label: "Growth path"
            text: "Junior → project architect → associate → principal / own practice"
          - label: "Government"
            text: "Architect posts in central and state public works departments through UPSC/state PSC recruitment"
  - id: "proscons"
    hid: "pc-heading"
    alt: true
    eyebrow: "Honest take"
    heading: "Advantages and disadvantages"
    parts:
      - proscons:
          pros:
            - "Protected, respected profession."
            - "Creative and technical work combined."
            - "Own practice possible."
          cons:
            - "Long 5-year degree and studio hours."
            - "Low early pay."
            - "Income tied to the construction cycle."
  - hid: "related-heading"
    alt: true
    eyebrow: "Related careers"
    heading: "If you're considering Architect, also look at"
    parts:
      - related:
          - name: "Civil Engineering"
            sub: "Infrastructure & construction"
            href: "civil.html"
          - name: "Interior Design"
            sub: "Spaces & interiors"
            href: "interior-design.html"
          - name: "Diploma in Architecture"
            sub: "Polytechnic route"
            href: "diploma-architecture.html"
          - name: "B.Arch Colleges"
            sub: "College finder"
            href: "colleges-barch.html"
  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Can I use the title “architect” without registering?"
            a: "No. Under the Architects Act, 1972 only people registered with the Council of Architecture may use it."
          - q: "NATA or JEE Main Paper 2 — which should I take?"
            a: "Both are accepted for B.Arch; JEE Paper 2 is used for NITs and some centrally funded institutes, NATA by many other colleges. Many students take both."
          - q: "Is Chemistry compulsory for B.Arch?"
            a: "Physics and Mathematics are compulsory; check the current CoA admission rules for the third subject and marks."
      - note: "*Pay figures are indicative unless they quote an official pay level, and rules change: confirm eligibility, dates and fees on the official websites listed under Sources before you act."
        class: "table-note mt-lg"
