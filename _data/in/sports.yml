  # ------------------------------------------------------------------------------------------------ Weightlifting
  - slug: weightlifting
    short: "Weightlifting"
    domain: combat
    checked: 2026-10-16
    body: "International Weightlifting Federation (IWF) · Indian Weightlifting Federation (IWLF)"
    card: "The new 8 + 8 IWF bodyweight categories from 1 Aug 2026, the 6 + 6 that go to LA28, weigh-in and 20 kg rules, IWLF Nationals entry rules, anti-doping papers, SAI centres, awards and jobs."
    card_facts: ["New 8 + 8 categories from 1 Aug 2026", "6 + 6 at LA28", "Weigh-in 2 h before, lasts 1 h"]
    eyebrow: "Sports Cockpit · Combat &amp; Mat · IWF categories 1 Aug 2026 · LA28 qualification"
    title: "Weightlifting — new bodyweight categories, the 20 kg rule &amp; the road to LA28"
    lede: "Education Margdarshan's weightlifting map for India: the eight bodyweight categories per gender that every competition must use from 1 August 2026, the six that will be lifted at the 2028 Olympics, how the snatch, clean &amp; jerk and Total work, weigh-in and costume rules, the IWLF Nationals entry papers, the anti-doping rules that decide selection, the SAI centres, who pays, and the awards and jobs after a medal."
    official:
      - { label: "IWLF circular 273 — new categories from 1 Aug 2026 (PDF)", url: "https://iwlf.in/wp-content/uploads/2026/05/Circular-no-273-dated-22-5-2026.pdf" }
      - { label: "iwlf.in", url: "https://iwlf.in/" }
    facts:
      - { label: "Categories from 1 Aug 2026", value: "<strong>8 men · 8 women</strong> (senior &amp; junior)", source: iwlf-273 }
      - { label: "LA28 Olympic categories", value: "<strong>6 + 6</strong> — 120 lifters in all", source: iwlf-sel }
      - { label: "Attempts", value: "<strong>3 snatch + 3 clean &amp; jerk</strong>", source: iwf-tcrr }
      - { label: "Weigh-in", value: "<strong>Starts 2 h before</strong> the group, lasts 1 h", source: iwf-tcrr }
    sections:
      - id: rules
        nav: "Categories"
        eyebrow: "Core rules &amp; equipment standards"
        heading: "Bodyweight categories, the two lifts and the costume"
        parts:
          - p: "The IWF has changed its categories three times since 2024. The set in force <strong>from 1 August 2026</strong> is the only one valid in India too — for State and UT championships, school, university and Khelo India events, the National Games and selection trials."
            source: iwlf-273
          - table:
              caption: "IWF bodyweight categories from 1 August 2026 (kg)"
              head: ["Group", "Women / Girls", "Men / Boys"]
              rows:
                - ["<strong>Senior</strong> (15+) &amp; <strong>Junior</strong> (15–20)", "49 · 53 · 57 · 61 · 69 · 77 · 86 · +86", "60 · 65 · 70 · 75 · 85 · 95 · 110 · +110"]
                - ["<strong>Youth</strong> (13–17)", "45 · 49 · 53 · 57 · 61 · 69 · 77 · +77", "55 · 60 · 65 · 70 · 75 · 85 · 95 · +95"]
                - ["<strong>LA28 Olympics</strong>", "<strong>53 · 61 · 69 · 77 · 86 · +86</strong>", "<strong>65 · 75 · 85 · 95 · 110 · +110</strong>"]
            source: "iwlf-273,iwlf-sel"
          - list:
              - "Two lifts, in this order: <strong>the snatch, then the clean &amp; jerk</strong>, both with two hands, with a <strong>maximum of three attempts</strong> each."
              - "The <strong>Total</strong> is your best snatch plus your best clean &amp; jerk — you get a Total only with at least one good lift in each."
              - "Bar weights must be multiples of <strong>1 kg</strong>; after a good lift the bar goes up at least 1 kg, after a miss it stays. Once the clock starts, the weight cannot be reduced."
              - "You have <strong>one minute</strong> from your name being called to start the lift (warning at 30 seconds)."
              - "The <strong>20 kg rule</strong>: your opening snatch plus opening clean &amp; jerk must be at least your entry Total minus 20 kg — or the Jury excludes you."
            source: iwf-tcrr
          - list:
              - "Costume: <strong>one piece, collarless</strong>, any colour, not covering the elbows or knees."
              - "<strong>Sport footwear</strong> is compulsory; a belt may be worn <strong>outside</strong> the costume, maximum <strong>12 cm</strong> wide."
              - "Weigh-in begins <strong>two hours</strong> before the group starts and lasts <strong>one hour</strong> — weigh in without shoes or socks."
            source: iwf-tcrr
      - id: recognition
        nav: "Recognition"
        eyebrow: "Institutional &amp; global recognition"
        heading: "Olympics, Asian Games, Commonwealth Games — and the 2026 medals"
        parts:
          - table:
              caption: "LA28 Olympic weightlifting — the hard numbers"
              head: ["Rule", "What it says"]
              rows:
                - ["Places", "<strong>120 lifters</strong> (60 men, 60 women): 108 quota + 6 host + 6 universality"]
                - ["Per country", "<strong>3 per gender</strong>, max 1 per category (+1 if your lifter wins Best Lifter)"]
                - ["Age", "Born on or before <strong>31 December 2013</strong>"]
                - ["Ranking window", "<strong>27 July 2026 to 7 May 2028</strong>, in two periods"]
                - ["Ranking points", "Best <strong>3 Totals</strong> in Period 1 + best <strong>2</strong> in Period 2, in the same Olympic category; top 8 per category qualify"]
                - ["Period 1 events", "2026 Worlds (Ningbo, 27 Oct–8 Nov 2026), Qualifiers I–III, 2027 Asian Championships, 2027 Worlds"]
            source: iwlf-sel
          - p: "<strong>Mirabai Chanu</strong> won India's first gold of the <strong>Glasgow 2026 Commonwealth Games</strong> in the women's 48 kg (Total 190 kg, Games records of 85 kg snatch and 105 kg clean &amp; jerk) — her third straight Commonwealth gold. At the <strong>Asian Games 2026</strong>, lifting under the new categories, she took <strong>silver in the 49 kg</strong> — India's first Asian Games weightlifting medal in 28 years."
            source: "air-cwg26,air-ag26"
          - p: "At the <strong>Asian Championships 2026</strong> in Gandhinagar India won 10 medals (one silver, nine bronze) — Asian Championships give medals for the snatch and clean &amp; jerk as well as the Total."
            source: air-awc26
          - table:
              caption: "Government cash award for a senior weightlifting medal (₹ lakh)"
              head: ["Event", "Gold", "Silver", "Bronze"]
              rows:
                - ["<strong>Olympic Games</strong>", "75", "50", "30"]
                - ["Asian Games / Commonwealth Games", "30", "20", "10"]
                - ["World Championship (annual)", "10", "7", "4"]
                - ["Asian Championship (annual)", "3.75", "2.5", "1.25"]
            source: myas-cash
      - id: eligibility
        nav: "Doping &amp; age"
        eyebrow: "Physical benchmarks &amp; NADA clearance"
        heading: "Whereabouts, ADEL and age tests — the papers that decide selection"
        parts:
          - p: "IWLF has a <strong>zero-tolerance</strong> doping policy. No lifter is considered for selection unless fully compliant with WADA, ITA, NADA and IWF rules, holding a valid <strong>ADEL</strong> anti-doping education certificate, available for testing and meeting all <strong>whereabouts</strong> duties, and free of any doping ban."
            source: iwlf-sel
          - list:
              - "For international entries you must have been <strong>ADAMS whereabouts-compliant for at least two quarters</strong> before the championship, with a valid passport."
              - "Every domestic event (Nationals, Khelo India, National Games, women's league) needs a signed <strong>dope declaration form</strong> at body-weight time and an <strong>ADEL form</strong> (valid 2 years)."
              - "Whereabouts must be filed within <strong>30 days</strong> of the event notice; <strong>three whereabouts failures</strong> can lead to suspension."
            source: "iwlf-sel,iwlf-adp"
          - list:
              - "LA28 rule: lifters must stay <strong>continuously available for testing</strong> through the whole qualification period. If a country's lifters commit <strong>three or more doping violations</strong> between 26 July 2024 and 13 July 2028, it can lose some or all of its Olympic places."
            source: iwlf-sel
          - list:
              - "SAI's <strong>Age Verification Test</strong> for boys up to 17 and girls up to 15: doctor's examination, dental examination and a TW3 X-ray; appeals go to the Medical Appellate Board at AIIMS New Delhi."
            source: sai-avt
          - list:
              - "Check every medicine against the <strong>Prohibited List</strong>; if no permitted treatment exists, apply to NADA for a <strong>TUE</strong>."
            source: nada-rr
      - id: roadmap
        nav: "Roadmap"
        eyebrow: "Grassroots-to-elite residential pipeline"
        heading: "From the youth platform to the national camp"
        parts:
          - table:
              caption: "IWLF Nationals 2025-26 (Modinagar, 3–14 Feb 2026) — the entry rules"
              head: ["Rule", "What it says"]
              rows:
                - ["Age (2025-26)", "Youth born 2008–2012 · Junior born 2005–2010 · Senior born on or before 31 Dec 2010"]
                - ["Entries per State", "<strong>8 lifters + 2 reserves</strong> per section, no more than <strong>2 in a category</strong>"]
                - ["Minimum standard", "A qualifying Total for each category; States without a qualifier may send one <strong>wild card</strong> per section"]
                - ["Fees", "₹1,500 per athlete for States/UTs (₹2,500 for departmental boards) + <strong>₹500 anti-doping fee</strong>"]
                - ["Must have", "Athlete ID card, <strong>Khelo India portal registration</strong> (KID number), ADEL certificate of 2024 or later, whereabouts filed by the deadline"]
                - ["Medals", "For the Total only — one good snatch and one good clean &amp; jerk needed"]
            source: iwlf-nwlc
          - table:
              caption: "Senior qualifying Totals at the 2025-26 Nationals (old categories, kg)"
              head: ["Section", "Category → minimum Total"]
              rows:
                - ["Senior men", "60 → 220 · 65 → 244 · 71 → 251 · 79 → 262 · 88 → 281 · 94 → 285 · 110 → 291 · +110 → 296"]
                - ["Senior women", "48 → 138 · 53 → 145 · 58 → 156 · 63 → 160 · 69 → 166 · 77 → 175 · 86 → 175 · +86 → 177"]
            source: iwlf-nwlc
          - note: "These standards were set for the categories used until July 2026; new standards for the August 2026 categories come with the next Nationals circular. The 2026-27 Junior and Senior Nationals are proposed for <strong>Himachal Pradesh in February 2027</strong>."
            source: "iwlf-nwlc,iwlf-sel"
          - list:
              - "Road to the national team for LA28: a panel of <strong>32 probables</strong> for the 2026 Worlds; <strong>Open Selection Trials in August–September 2026</strong> for Qualifiers I and II; the 2026-27 Nationals for the 2027 events; then the <strong>top 16</strong> stay in the national camp for Period 2."
              - "Final teams: up to <strong>16 lifters</strong>, no more than <strong>two in a category</strong>, picked by the Selection Committee from the preliminary list of 32."
            source: iwlf-sel
          - list:
              - "You <strong>cannot apply</strong> to become a Khelo India athlete — scouts pick from recognised competitions; register on the <strong>National Sports Repository System</strong>."
            source: kia-guide
      - id: academies
        nav: "Centres"
        eyebrow: "Top elite academies &amp; cities"
        heading: "Where India's weightlifters train"
        parts:
          - table:
              caption: "SAI National Centres of Excellence with weightlifting"
              head: ["Centre", "Other sports there"]
              rows:
                - ["<strong>Patiala</strong> (NSNIS), Punjab", "Athletics, cycling, fencing, hockey, judo"]
                - ["Bengaluru, Karnataka", "Athletics, hockey, taekwondo"]
                - ["Aurangabad (Chhatrapati Sambhajinagar), Maharashtra", "Boxing, fencing, hockey, gymnastics"]
                - ["Lucknow, Uttar Pradesh", "Athletics, hockey, taekwondo, wrestling"]
                - ["Imphal, Manipur", "Archery, athletics, cycling, fencing, football, hockey, judo, wushu"]
                - ["Itanagar, Arunachal Pradesh", "Boxing, wushu"]
            source: sai-schemes
          - note: "Weightlifting is one of SAI's <strong>13 priority disciplines</strong>. Only coaches already working in the national camp or an NCOE camp, holding an <strong>IWF International Coaching Licence</strong>, travel with Indian teams."
            source: "sai-schemes,iwlf-sel"
          - warn: "Education Margdarshan could not find an official Government file listing the Army Sports Institute's current disciplines or entry route, so it is not listed here. Ask the Army recruiting office directly."
      - id: costs
        nav: "Gear &amp; cost"
        eyebrow: "Equipment costs &amp; who pays"
        heading: "Costume, shoes, belt — and who pays"
        parts:
          - list:
              - "Your own kit: a one-piece collarless costume, sport (lifting) shoes, an optional belt up to 12 cm, and bandages or tape as the rules allow."
            source: iwf-tcrr
          - note: "Education Margdarshan does not print shop prices — no governing body publishes them. Nationals fees (₹1,500 + ₹500 anti-doping fee per lifter) are charged on the State's entry, and the organisers at Modinagar gave <strong>no boarding or lodging</strong>."
            source: iwlf-nwlc
          - table:
              caption: "Who pays — weightlifting ladder"
              head: ["Stage", "Paid by", "What you get"]
              rows:
                - ["SAI centre trainee", "Sports Authority of India", "Coaching, boarding, sports science, diet"]
                - ["Khelo India athlete", "Ministry of Youth Affairs &amp; Sports", "<strong>₹6.28 lakh a year</strong> incl. ₹1.20 lakh cash"]
                - ["Junior medal prospect", "TOPS Development Group", "₹25,000 a month"]
                - ["Olympic prospect", "TOPS Core Group", "<strong>₹50,000 a month</strong> + approved training plan"]
                - ["Athlete in hardship", "PDU National Welfare Fund", "Up to ₹2.50 lakh"]
            source: "sai-schemes,pib-support"
          - list:
              - "Powders and pills for weight-making or muscle are the biggest doping risk in this sport: no supplement is 100% safe and <strong>strict liability</strong> applies — food first, with a certified nutritionist."
            source: nada-supp
      - id: earnings
        nav: "Earnings &amp; jobs"
        eyebrow: "Earning channels &amp; central job quotas"
        heading: "Awards, pension and sports-quota jobs"
        parts:
          - list:
              - "Weightlifting is one of the <strong>65 sports</strong> in the central sports quota for <strong>Group C</strong> posts, with up to 5 years' age relaxation (10 for SC/ST)."
              - "Medals at the Olympics, Asian Games, Commonwealth Games or World Championships can bring up to <strong>three out-of-turn promotions</strong>."
              - "These central instructions do not apply to Railways Services, the Department of Atomic Energy, the Department of Space and some DRDO technical services."
            source: dopt-2022
          - list:
              - "Glasgow 2026 Commonwealth Games medallists were handed <strong>₹30 lakh for gold, ₹20 lakh for silver and ₹10 lakh for bronze</strong> by the Sports Minister in August 2026."
            source: air-cwgcash
          - list:
              - "<strong>Pension to Meritorious Sportspersons</strong>: ₹12,000–20,000 a month after retirement."
              - "National Sports Awards — Khel Ratna, Arjuna, Dronacharya (coaches)."
            source: pib-support
      - id: traps
        nav: "Red flags"
        eyebrow: "Disqualification traps"
        heading: "Mistakes that end a lifter's competition"
        parts:
          - list:
              - "<strong>Training for an old category</strong> — only the August 2026 categories are valid now, at every level."
            source: iwlf-273
          - list:
              - "<strong>Low openers</strong> — break the 20 kg rule and the Jury excludes you before you lift."
              - "<strong>Missing all three snatches</strong> — no Total, no medal; at the Nationals you could not go on to the clean &amp; jerk."
            source: "iwf-tcrr,iwlf-nwlc"
          - list:
              - "<strong>Missed whereabouts or no ADEL certificate</strong> — your entry is rejected and you can be removed from the camp without notice."
            source: "iwlf-sel,iwlf-nwlc"
          - list:
              - "<strong>A positive test hurts your whole State</strong> — IWLF can cut a State's Nationals entries after reported doping cases."
            source: iwlf-adp
