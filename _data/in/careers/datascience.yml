            text: "Business Analyst, Data Analyst and BI Developer positions need minimal coding — Excel, SQL and Power BI/Tableau are genuinely enough for many entry and mid-level roles."
          - label: "Data Scientist interviews"
            text: "Typically include SQL and statistics fundamentals, a business case-study round, a Python/ML coding round, and a portfolio review."
          - label: "Portfolio matters more than certificates"
            text: "A real GitHub project — even a simple one you can explain thoroughly — is reported to carry more weight than a generic bootcamp certificate."
          - label: "Company type changes the bar"
            text: "IT services and analytics firms hire more generalist analysts; product companies and FAANG-equivalent firms test for deeper ML and systems understanding."
  - id: "fees"
    hid: "fees-heading"
    eyebrow: "You can start almost for free"
    heading: "Cost of each route"
    parts:
      - prose:
          - "A B.Tech in CSE commonly costs <strong>₹2-8 lakh</strong> at government institutes and <strong>₹5-20 lakh</strong> at private colleges (see the <a href=\"cse.html\">CSE page</a>), while a Bachelor of Computer Applications (BCA) is generally more affordable at <strong>₹30,000-1,50,000 per year</strong> (see the <a href=\"bca.html\">BCA page</a>). What's genuinely different about data science is that you don't need a paid course to start — Excel, SQL and even Power BI can be learned through free resources and practice datasets. Structured data science bootcamps or certification programmes, for students who want a guided path, commonly cost <strong>₹30,000-3,00,000</strong> depending on depth and format — always verify a programme's actual placement outcomes before enrolling."
