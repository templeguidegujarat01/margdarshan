          - q: "What does a perfusionist do?"
            a: "Runs the heart-lung machine during open-heart surgery and manages ECMO life support."
          - q: "How long is B.Sc Perfusion Technology?"
            a: "Usually three years plus an internship, though some universities run 3.5–4-year programmes."
          - q: "Is perfusion a regulated profession?"
            a: "It is one of the allied health professions covered by the NCAHP Act, 2021."
