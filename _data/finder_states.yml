# States for the Coaching & College Finder (_includes/finder.html).
# Order here = order in the state dropdown. A state only becomes selectable
# in a given finder once _data/coaching.yml or _data/colleges.yml has at
# least one verified listing for it there; otherwise it is shown as a
# disabled "No verified listings yet" option. Pages pick their opening state with the
# include's `default` param.
#
#   id      slug used in data files, URLs (?state=) and state page names
#   name    display name
#   region  addressRegion for JSON-LD when it differs from `name`
#           (a listing can override it, e.g. Noida in Delhi NCR -> Uttar Pradesh)

