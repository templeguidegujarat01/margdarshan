# Haryana State Exam & Career Hub — one data sheet for the cockpit (state/haryana/index.html) and every
# exam page under state/haryana/. Rendered by _includes/state-cockpit.html and _includes/state-exam.html;
# checked by scripts/check-in-data.mjs (state sheets block).
#
# Rules for this sheet (same as the other state sheets):
#   - Every fact part carries `source: <id>`; the id must be listed under that exam's `sources`.
#   - B.E. / B.Tech (read 2026-10-31): the HSTES admission brochure for B.E./B.Tech/B.Arch 2026-27 and the portal notices.
#   - Sources are the official files themselves (read 2026-10-19): the HPSC advertisement for the HCS (Executive
#     Branch) & Other Allied Services Examination-2025 (Advt. 22/2026), its corrigendum and the final result of
#     17 October 2026; the HSSC advertisement for CET Phase-II Group-C posts (Advt. 06/2026), which carries the
#     CET Policy of 31 December 2024; and the HSTES Diploma Prospectus 2026. Nothing comes from coaching or
#     news sites.
#   - The HCS advertisement prints no pay scale, so the HCS pay block says so instead of quoting one.
#   - Section ids are the same on every exam page: overview, eligibility, scheme, fees, reservation,
#     documents, pay, posting (+ sources, drawn automatically).
state:
  id: haryana
  name: Haryana
  checked: 2026-10-19

cockpit:
  eyebrow: "State Exam &amp; Career Hub · Haryana"
  title: "Haryana Exam &amp; Career Hub"
  intro:
    - "Every major Haryana recruitment and admission route we could verify on one screen: the HCS (Executive Branch) &amp; Allied Services exam of the Haryana Public Service Commission (HPSC), the two-stage Common Eligibility Test (CET) route of the Haryana Staff Selection Commission (HSSC) for Group-C posts, and B.Tech and polytechnic diploma admission through the Haryana State Technical Education Society (HSTES). Each page is built only from the official advertisement or prospectus, and every fact links back to that file."
    - "Haryana splits its Scheduled Castes into Deprived SC (DSC) and Other SC (OSC), and its Backward Classes into BC-A and BC-B — each with its own certificate format and date window. A central OBC or EWS certificate is not accepted, and women must take the caste certificate from the father's side. Most Group-C and D jobs also need Hindi or Sanskrit in Matric."
  facts:
    - { label: "Recruitment nodes", value: "HPSC HCS · HSSC CET Group-C" }
    - { label: "Admission nodes", value: "HSTES B.Tech · polytechnic diploma · MBBS/BDS (UHS Rohtak)" }
    - { label: "Watch", value: "HCS 2025 final result out (17 Oct 2026)" }
    - { label: "Last checked", value: "19 Oct 2026" }
  groups:
    - id: civil
      eyebrow: "Civil recruitment &amp; administrative"
      heading: "Government recruitment exams"
      intro: "HCS (Executive), DSP, ETO and other state officers through the Haryana Public Service Commission (HPSC), and Group-C posts through the Haryana Staff Selection Commission's CET route."
      exams: [hpsc, hssc]
    - id: academic
      eyebrow: "Academic admissions"
      heading: "Admission routes after Class 10 and 12"
      intro: "MBBS and BDS on NEET UG merit through Pt. B.D. Sharma UHS, Rohtak; B.E. / B.Tech on JEE (Main) rank, and three-year engineering diplomas in Haryana's government, aided and private polytechnics on Class 10 marks — both through HSTES online counselling, with no state entrance test."
      exams: [btech, diploma, neet-ug]
  compare_note: "Fees, age limits and dates are from the latest notice of each body. They change every cycle, so always open the current notice before applying."
  portals_note: "HPSC notices are on hpsc.gov.in; HSSC on hssc.gov.in; polytechnic admissions on hstes.org.in and techadmissionshry.gov.in. Only use these official addresses."
  portals:
    - { label: "Haryana Public Service Commission (HPSC)", url: "https://www.hpsc.gov.in/" }
    - { label: "Haryana Staff Selection Commission (HSSC)", url: "https://hssc.gov.in/" }
    - { label: "Haryana State Technical Education Society (HSTES)", url: "https://hstes.org.in/" }

exams:
  # ------------------------------------------------------------------ UHSR ROHTAK — MBBS / BDS (read 31 Oct 2026)
  - slug: neet-ug
    group: academic
    short: "MBBS &amp; BDS Counselling — Pt. B.D. Sharma UHS, Rohtak (NEET UG)"
    body: "Pt. Bhagwat Dayal Sharma University of Health Sciences, Rohtak, under the Medical Education and Research Department, Haryana"
    card: "UHS Rohtak runs one online combined counselling on NEET UG merit for MBBS and BDS in Haryana's government, aided and private colleges, including private-university colleges. 85% of government seats are Haryana state quota; private colleges split 50% state, 50% management (15% NRI). Government MBBS: ₹80,000 a year plus a service incentive bond."
    card_facts: ["85% state quota (govt)", "Fee ₹2,500 / ₹1,250", "Govt MBBS ₹80,000 / yr"]
    eyebrow: "UHS Rohtak · MBBS &amp; BDS"
    title: "Haryana NEET UG Counselling 2026 — MBBS &amp; BDS Quotas, Fees, Security Deposit &amp; Bonds"
    lede: "The Government of Haryana's notification of 27 August 2026 sets the procedure for MBBS and BDS admission in all government, government-aided and private medical and dental institutions, including those under private universities, and authorises Pt. B.D. Sharma University of Health Sciences, Rohtak to run the online combined centralized counselling on NEET UG-2026 merit."
    facts:
      - { label: "Merit", value: "NEET UG-2026", source: hr-notif }
      - { label: "Govt colleges", value: "85% Haryana state · 15% All India", source: hr-notif }
      - { label: "Registration fee", value: "₹2,500 · ₹1,250 reserved · ₹10,000 NRI", source: hr-notif }
      - { label: "Govt MBBS tuition", value: "₹80,000 a year (2026-27)", source: hr-fee }
    official:
      - { label: "UHSR UG counselling portal", url: "https://uhsrugcounselling.com/" }
      - { label: "Haryana notification, MBBS / BDS 2026-27 (PDF)", url: "https://uhsrugcounselling.com/Images/Notifications/5.PDF" }
    sections:
      - id: overview
        nav: "Overview"
        eyebrow: "Overview &amp; official source"
        heading: "One counselling for government, private and private-university colleges"
        parts:
          - p: "UHS Rohtak conducts the online combined centralized counselling on NEET UG-2026 merit for every government, government-aided and private medical and dental institute in Haryana, including those under SGT University, Maharishi Markandeshwar University, Al-Falah University and Sanskaram University. Document verification is in person before the Admission Committee at UHS Rohtak."
            source: hr-notif
          - table:
              caption: "Colleges in the 2026-27 notification"
              head: ["Type", "Colleges"]
              rows:
                - ["Government medical (8)", "PGIMS Rohtak, BPS GMC (W) Khanpur Kalan, SHKM GMC Nalhar, KCGMC Karnal, SABV GMC Chhainsa, ESIC Faridabad, Pt. Neki Ram Sharma GMC Bhiwani, Maharishi Chyawan MC Koriawas"]
                - ["Government-aided medical (1)", "Maharaja Agrasen MC, Agroha"]
                - ["Private medical", "NC MC Israna, Adesh MC Shahabad, World MC Jhajjar; private-university colleges SGT, Al-Falah, MM Sadhopur, Sanskaram"]
                - ["Dental", "PGIDS Rohtak (government); Swami Devi Dayal, J.N. Kapoor DAV, Sudha Rustagi, Jan Nayak Ch. Devi Lal, Yamuna Institute, SGT Dental"]
            source: hr-notif
          - list:
              - "In 2026-27 the counselling ran Round 1, Round 2, Round 3 and a stray round."
            source: hr-portal
      - id: eligibility
        nav: "Eligibility"
        eyebrow: "Who can apply"
        heading: "Haryana residents for state seats; anyone for management seats"
        parts:
          - list:
              - "<strong>State quota</strong> (government / aided seats and the open-merit state quota in private colleges): a citizen of India who is a bona fide resident of Haryana, with the Haryana Residence Certificate of the candidate or parents."
              - "<strong>Management category:</strong> candidates from all over India, whatever their domicile or place of study."
              - "Every candidate must meet the NEET UG-2026 qualifying criteria and NMC / NDC rules."
            source: hr-notif
      - id: scheme
        nav: "Rounds &amp; Deposits"
        eyebrow: "Rounds and security deposits"
        heading: "Fresh registration allowed in later rounds; deposits from Round 2"
        parts:
          - list:
              - "Vacant seats after Round 1 go to Round 2; fresh registration is allowed in later rounds, and Round 1 registrants only give their willingness online."
              - "From Round 2, choosing only government / aided state quota seats needs a <strong>₹10,000</strong> deposit (₹5,000 SC / BC / PwD / EWS); adding private state or management seats needs <strong>₹1,00,000</strong>, adjusted in the first-year fee."
              - "A candidate allotted in Round 2 who does not join forfeits the deposit but can still take part in the 3rd round."
              - "For the stray round, the deposit for private MBBS seats is <strong>₹5,00,000</strong>, forfeited if you are allotted and do not pay, report or join."
              - "Seats added after the 3rd-round registration deadline are not counselled that year."
            source: hr-notif
      - id: fees
        nav: "Fees"
        eyebrow: "Registration and tuition fees"
        heading: "₹2,500 to register, ₹80,000 a year in government colleges"
        parts:
          - table:
              caption: "Registration-cum-counselling fee (non-refundable)"
              head: ["Category", "Fee"]
              rows:
                - ["Unreserved", "₹2,500"]
                - ["SC / BC / EWS / PwD of Haryana", "₹1,250"]
                - ["NRI", "₹10,000"]
            source: hr-notif
          - table:
              caption: "Provisional first-year tuition 2026-27 (selected colleges)"
              head: ["College", "Fee"]
              rows:
                - ["PGIMS Rohtak and the 6 newer government medical colleges", "₹80,000"]
                - ["Maharaja Agrasen MC, Agroha (aided)", "₹1,80,000"]
                - ["ESIC MC, Faridabad", "₹1,00,000"]
                - ["Adesh, NC Israna, World MC (private)", "₹6,00,000"]
                - ["SGT, Al-Falah, MM Sadhopur, Sanskaram (private universities)", "₹8,18,750 – ₹11,25,000"]
                - ["PGIDS Rohtak (BDS)", "₹52,090"]
                - ["Private dental colleges (BDS)", "₹1,40,000 (SGT Dental ₹2,62,500)"]
            source: hr-fee
          - note: "Private college candidates may pay 50% of the tuition at admission and the rest before the last date of admissions."
            source: hr-notif
      - id: reservation
        nav: "Quotas &amp; Reservation"
        eyebrow: "Seat split &amp; reservation"
        heading: "85/15 in government colleges, 50/50 in private"
        parts:
          - list:
              - "Government institutions: <strong>15%</strong> All India merit, <strong>85%</strong> Haryana state merit."
              - "Private colleges affiliated to UHS Rohtak: <strong>50%</strong> state quota, <strong>50%</strong> management; the NRI quota is 15% of total intake, carved out of management."
              - "Private-university colleges follow Section 35 of the Haryana Private Universities Act, 2006."
              - "The state reservation policy applies to all state quota seats; 5% of state quota seats are for persons with benchmark disabilities, certified by the NTA-designated board (sitting at PGIMS Rohtak)."
              - "EWS reservation applies only on the extra EWS seats sanctioned for a course; EWS families must earn below ₹6 lakh a year."
            source: hr-notif
          - list:
              - "BC-A / BC-B candidates need a creamy / non-creamy layer certificate, and EWS candidates an income &amp; asset certificate, issued after 1 April 2026; Other SC / Deprived SC candidates need the certificate under the 2020 notification."
            source: hr-faq
      - id: documents
        nav: "Documents"
        eyebrow: "Document checklist"
        heading: "Originals only"
        parts:
          - list:
              - "Bring all relevant certificates in original to document verification; attested photocopies are not accepted and the seat is cancelled."
              - "Haryana Residence Certificate (candidate or parents) for state quota seats."
            source: hr-notif
          - list:
              - "Upload marksheets, caste, PwD and domicile certificates; the full list appears in your login."
            source: hr-faq
      - id: pay
        nav: "Bonds"
        eyebrow: "Bonds"
        heading: "₹10 lakh exit bond and a service incentive bond"
        parts:
          - list:
              - "Every admitted student signs a bond with two sureties not to leave the course; leaving midway costs <strong>₹10 lakh</strong> and a three-year bar from MBBS / BDS admission in Haryana. Leaving after 15 Dec 2026 (three days before the last admission date) brings the same penalties."
              - "In private colleges, a student who leaves also pays that year's fee plus 50% of the next year's fee."
              - "<strong>Service Incentive Bond</strong> (government and aided MBBS): ₹30 lakh minus total fees, as a collateral-free bank loan — ₹25,77,090 for men and ₹23,19,381 for women in government colleges; ₹21,90,000 / ₹19,71,000 at MAMC Agroha. On finishing MBBS the graduate either consents to government service or repays the bond in a lump sum or monthly instalments."
            source: hr-notif
      - id: posting
        nav: "After Allotment"
        eyebrow: "After allotment"
        heading: "Pay the provisional tuition, then verify in person"
        parts:
          - p: "Allotted candidates deposit the provisional tuition fee online before document verification by the Admission Committee; without the fee, no admission is given."
            source: hr-faq
          - links:
              - { label: "NEET UG", url: "neet-ug.html" }
              - { label: "HSTES B.Tech", url: "state/haryana/btech.html" }
              - { label: "MBBS college finder", url: "colleges-mbbs.html" }
    sources:
      - { id: hr-notif, name: "Haryana Government Gazette — Medical Education and Research Department notification No. 16/10/2024-6HBIV, MBBS / BDS admission procedure 2026-27 (27 Aug 2026)", url: "https://uhsrugcounselling.com/Images/Notifications/5.PDF", covers: "colleges, 85/15 and 50/50 splits, NRI 15%, PwD 5%, EWS, residence, management eligibility, rounds, deposits, registration fee, bonds, service incentive bond, part payment", checked: 2026-10-31 }
      - { id: hr-fee, name: "Pt. B.D. Sharma UHS Rohtak — Provisional tuition fee for MBBS / BDS, 2026-27 (2 Sep 2026)", url: "https://uhsrugcounselling.com/Images/Notifications/163.PDF", covers: "college-wise provisional tuition fees", checked: 2026-10-31 }
      - { id: hr-faq, name: "DMER Haryana — FAQ, online MBBS / BDS counselling 2026-27", url: "https://uhsrugcounselling.com/Images/FAQ_2026.pdf", covers: "category certificate dates, documents, provisional tuition before verification", checked: 2026-10-31 }
      - { id: hr-portal, name: "UHSR UG counselling — notifications page (2026-27 rounds)", url: "https://uhsrugcounselling.com/Notice", covers: "Round 1–3 and stray round notices", checked: 2026-10-31 }
  # ------------------------------------------------------------------ HSTES — B.E. / B.TECH (read 31 Oct 2026)
  - slug: btech
    group: academic
    short: "HSTES B.E. / B.Tech Admission 2026-27"
    body: "Haryana State Technical Education Society (Department of Technical Education)"
    card: "Haryana fills B.E. / B.Tech seats on JEE (Main) Paper-I rank through two online counselling rounds by HSTES; there is no state entrance test. 15% of seats are for candidates from outside Haryana, 85% are the state quota."
    card_facts: ["JEE (Main) rank · no state test", "85% state · 15% rest of India", "Fee ₹1,000 · ₹700 reserved"]
    eyebrow: "HSTES · B.Tech admission"
    title: "Haryana B.E. / B.Tech Admission 2026-27 — JEE Main Merit, Eligibility, Quotas & Fees"
    lede: "The Haryana State Technical Education Society (HSTES) runs online counselling for B.E. / B.Tech in Haryana's university departments, government colleges and private institutes. This page follows the HSTES admission brochure for B.E. / B.Tech / B.Arch, session 2026-27."
    facts:
      - { label: "Merit", value: "JEE (Main)-2026 Paper-I rank", source: bt-pros }
      - { label: "Eligibility", value: "Class 12 · 45% (40% reserved)", source: bt-pros }
      - { label: "Seat split", value: "85% Haryana · 15% rest of India", source: bt-pros }
      - { label: "Registration fee", value: "₹1,000 · ₹700 reserved &amp; girls", source: bt-pros }
    official:
      - { label: "HSTES website", url: "https://hstes.org.in/" }
      - { label: "Online admission portal", url: "https://techadmissionshry.gov.in/" }
      - { label: "B.E./B.Tech/B.Arch brochure 2026 (PDF)", url: "https://hstes.org.in/Documents/2026/Prospectus/BE-BTech-BArch-Prospectus-2026.pdf" }
    sections:
      - id: overview
        nav: "Overview"
        eyebrow: "Overview &amp; official source"
        heading: "JEE (Main) rank, two online rounds"
        parts:
          - list:
              - "Admission to B.E. / B.Tech — including the Tuition Fee Waiver (TFW), EWS, Kashmiri Migrant (KM) and Haryana Govt. School Topper (HGST) seats — is on the <strong>JEE (Main)-2026 Paper-I</strong> merit, through <strong>two online off-campus counselling rounds</strong> on techadmissionshry.gov.in."
              - "The two rounds cover all seats of government university departments and engineering colleges and 75% of the seats of self-financing institutes. Private unaided institutes fill the other 25% (including up to 15% for NRI wards) at their own level."
              - "After the 2nd round there is no more online counselling; leftover seats are filled at institute level, first on entrance-exam merit and then on qualifying-exam marks."
              - "There is no printed application form; everything is online."
            source: bt-pros
          - note: "The 2026-27 rounds are over: B.E. / B.Tech registration started on 15 May 2026 and choice filling for the 1st round began on 19 June 2026 as per the revised key dates. Use this page for the 2027-28 cycle only after checking the new brochure."
            source: bt-portal
      - id: eligibility
        nav: "Eligibility"
        eyebrow: "Academic eligibility"
        heading: "Class 12 with 45% in the relevant subjects"
        parts:
          - list:
              - "Pass 10+2 with 45% (40% for reserved categories) in the three relevant subjects taken together, as set branch by branch in the AICTE table printed in the brochure."
              - "Most core branches (Civil, Mechanical, Chemical, Mining, Metallurgy and others) need Physics, Chemistry and Maths. Computer Science, Electrical and Electronics need Physics and Maths plus one more listed subject (such as Chemistry, Computer Science, IT, Biology or a technical vocational subject)."
              - "Also eligible: D.Voc in the same or an allied sector, or a 3-year diploma with 45% (40% reserved) — the diploma route only against first-year vacancies once lateral-entry seats are used up."
              - "Equal JEE (Main) ranks after NTA's tie-break go to the older candidate, then by name."
            source: bt-pros
      - id: scheme
        nav: "Merit &amp; Rounds"
        eyebrow: "How seats are allotted"
        heading: "No state test: JEE (Main) rank is the merit"
        parts:
          - table:
              caption: "Online counselling rounds"
              head: ["Round", "Categories"]
              rows:
                - ["1st", "RoHC, HOGC, HGST, SC, SC-D, BC-A, BC-B, PH, ESM (all priorities) and FF, with 25% horizontal reservation for women"]
                - ["2nd", "The same, with SC and SC-D merged into SC, BC-A and BC-B into BC, and ESM priorities merged"]
                - ["Parallel", "Supernumerary TFW, KM and EWS seats, also on JEE (Main) rank"]
            source: bt-pros
          - list:
              - "Haryana candidates register with their Parivar Pehchan Patra (PPP) ID; name, date of birth, category and income are fetched from PPP and cannot be edited, so fix them on the PPP portal first."
              - "Candidates from other states register with Aadhaar; anyone whose Aadhaar is already in the PPP database cannot register as an other-state candidate."
            source: bt-pros
      - id: fees
        nav: "Fees"
        eyebrow: "Registration fee"
        heading: "₹1,000, or ₹700 for reserved categories and girls"
        parts:
          - table:
              head: ["Candidate", "Online registration fee (non-refundable)"]
              rows:
                - ["General", "₹1,000"]
                - ["SC / SCD / BC / PH / FF / ESM / KM / girls / EWS", "₹700"]
            source: bt-pros
          - note: "Only candidates who paid the registration fee can fill choices. Tuition fees of self-financing institutes are fixed by the Admission and Fee Regulatory Committee and listed on afrchry.techeduhry.gov.in; hostel rent is capped at ₹2,000 a month (₹2,500 for an AC room)."
            source: bt-pros
      - id: reservation
        nav: "Reservation &amp; Quotas"
        eyebrow: "Reservation &amp; quotas"
        heading: "85% state quota, 15% Rest of Haryana"
        parts:
          - table:
              caption: "Seat distribution in government and self-financing institutes"
              head: ["Category", "Share"]
              rows:
                - ["Rest of Haryana (RoHC) — candidates from outside Haryana", "15% of intake (merged into General after the 2nd round)"]
                - ["State quota", "85% of intake"]
                - ["Haryana Open General (HOGC)", "50% of the state quota"]
                - ["Scheduled Castes (half for Deprived SC in government institutions)", "20% of the state quota"]
                - ["Backward Classes A / B", "16% / 11% of the state quota"]
                - ["Physically handicapped", "3% of the state quota"]
            source: bt-pros
          - list:
              - "3% horizontal reservation for ex-servicemen and freedom fighters' dependents (1% each out of General, SC and BC) and 25% horizontal reservation for women."
              - "<strong>Kashmiri Migrants:</strong> 5% supernumerary seats per course, with up to 10% relaxation in the cut-off percentage."
              - "<strong>HGST:</strong> seats for the topper (minimum 50%) of each Haryana government senior secondary school with at least 5 science students, passed in 2026."
              - "<strong>TFW:</strong> supernumerary tuition-fee-waiver seats under the AICTE scheme, counselled alongside the general rounds."
            source: bt-pros
      - id: documents
        nav: "Documents"
        eyebrow: "Document checklist"
        heading: "PPP data online, originals at the institute"
        parts:
          - list:
              - "Haryana candidates need not upload category, income or date-of-birth proof — it comes from PPP. Sub-category and special-category proof (ESM, FF, EWS and others) must be uploaded as PDFs."
              - "At physical reporting the allotted institute checks the originals, including the JEE (Main)-2026 rank card and admit card."
              - "Haryana-resident proof for children of employees uses the employer's certificate (Annexure-II)."
            source: bt-pros
      - id: pay
        nav: "Costs"
        eyebrow: "Costs &amp; support"
        heading: "Fee caps and waivers"
        parts:
          - p: "Tuition-free TFW seats are counselled in parallel with the general rounds. Prospectus charges are capped at ₹1,000 once, placement brochure at ₹750 once, and uniform at ₹6,000 where an institute prescribes one."
            source: bt-pros
      - id: posting
        nav: "After Allotment"
        eyebrow: "After allotment"
        heading: "Report to the allotted institute"
        parts:
          - p: "Allotted candidates report physically to the institute with original documents and pay the fee. Seats left after the 2nd round are filled by institutes with sub-categories merged into their main category, before the AICTE final cut-off date."
            source: bt-pros
          - links:
              - { label: "JEE Main", url: "jee-main.html" }
              - { label: "B.Tech college finder", url: "colleges-btech.html" }
              - { label: "Haryana polytechnic diploma", url: "state/haryana/diploma.html" }
    sources:
      - { id: bt-pros, name: "HSTES — Admission Brochure for B.E. / B.Tech / B.Arch, session 2026-27", url: "https://hstes.org.in/Documents/2026/Prospectus/BE-BTech-BArch-Prospectus-2026.pdf", covers: "JEE (Main) basis, two rounds, 75/25 split, eligibility table, tie rule, PPP rules, registration fee, seat distribution, KM, HGST, TFW, horizontal reservation, fee caps, documents, key dates", checked: 2026-10-31 }
      - { id: bt-portal, name: "HSTES — Online admission portal notice board", url: "https://techadmissionshry.gov.in/", covers: "B.E./B.Tech registration from 15 May 2026 and choice filling from 19 June 2026", checked: 2026-10-31 }
  # ------------------------------------------------------------------ HPSC — HCS & ALLIED
  - slug: hpsc
    group: civil
    short: "HPSC HCS (Executive Branch) &amp; Allied Services Exam 2025"
    body: "Haryana Public Service Commission"
    card: "Haryana's HCS (Executive), DSP, ETO, AETO and six other services. The 2025 exam (Advt. 22/2026) had 102 posts; interviews ran 3–8 October 2026 and the final result of 17 October 2026 recommends 101 candidates."
    card_facts: ["102 posts · 101 recommended", "−0.25 per wrong in prelim", "Fee ₹1,000 · ₹250 reserved / women"]
    eyebrow: "HPSC · HCS &amp; Allied Services"
    title: "HPSC HCS 2025 (Advt. 22/2026) — 102 Posts, Age, Prelim Negative Marking, Mains, Result"
    lede: "The Haryana Public Service Commission recruits Haryana Civil Services (Executive Branch) officers, DSPs and other Group-A and B officers through one combined exam. This page follows Advertisement No. 22/2026 (30 January 2026), its corrigendum of 5 February 2026 and the final result of 17 October 2026."
    facts:
      - { label: "Posts", value: "102 (ETO 27 · HCS 24 · AETO 22)", source: hc-advt }
      - { label: "Status", value: "Final result 17 Oct 2026", source: hc-res }
      - { label: "Age (1 Jan 2026)", value: "18 – 42 · DSP 18 – 27", source: hc-advt }
      - { label: "Prelims", value: "−0.25 per wrong answer", source: hc-advt }
    official:
      - { label: "HPSC website", url: "https://www.hpsc.gov.in/" }
      - { label: "HPSC advertisements", url: "https://www.hpsc.gov.in/en-us/Instructions" }
    sections:
      - id: overview
        nav: "Overview"
        eyebrow: "Overview &amp; official source"
        heading: "102 posts across ten services"
        parts:
          - table:
              caption: "Posts in the 2025 exam"
              head: ["Post", "Posts"]
              rows:
                - ["HCS (Executive Branch) — Group A", "24"]
                - ["Deputy Superintendent of Police", "8"]
                - ["Excise &amp; Taxation Officer", "27"]
                - ["District Food &amp; Supplies Controller", "2"]
                - ["Assistant Registrar, Co-operative Societies", "3"]
                - ["District Food &amp; Supplies Officer", "1"]
                - ["Assistant Excise &amp; Taxation Officer", "22"]
                - ["Traffic Manager", "7"]
                - ["'A' Class Tehsildar (Apprentice)", "3"]
                - ["'A' Class Naib Tehsildar (Apprentice)", "5"]
                - ["Total", "102"]
            source: hc-advt
          - table:
              caption: "2025 exam timeline"
              head: ["Stage", "Date"]
              rows:
                - ["Advertisement", "30 Jan 2026"]
                - ["Online applications", "6 – 26 Feb 2026"]
                - ["Preliminary exam (tentative schedule)", "26 Apr 2026"]
                - ["Main written exam (tentative schedule)", "27 – 29 Jun 2026"]
            source: hc-advt
          - p: "The personality test was held from 3 to 8 October 2026, and the final result with allocation of services was declared on 17 October 2026: 101 candidates were recommended against the 102 posts."
            source: hc-res
      - id: eligibility
        nav: "Eligibility &amp; Age"
        eyebrow: "Eligibility &amp; age limits"
        heading: "A BA, BSc or BCom; age 18 to 42"
        parts:
          - list:
              - "<strong>Qualification:</strong> a degree of Bachelor of Arts, Science or Commerce (or equivalent) from a recognised university (rule 12(2)(b), HCS (Executive Branch) Rules 2008), held by the closing date. No certificate issued after the closing date is accepted."
              - "<strong>Age on 1 January 2026:</strong> 18 to 42; for DSP 18 to 27. Only the Matriculation certificate proves age."
              - "<strong>DSP physical standard:</strong> men 5 ft 7 in (170.19 cm), chest 33 in with 1.5 in expansion compulsory; women 5 ft 2 in (157.50 cm)."
            source: hc-advt
          - table:
              caption: "Upper-age relaxation (instructions of 25 March 2022)"
              head: ["Category", "Relaxation"]
              rows:
                - ["SC and BC of Haryana (only where a post is reserved for them)", "5 years"]
                - ["Persons with benchmark disabilities", "5 years (+5 more if SC / BC / EWS), up to 52"]
                - ["Widowed, divorced, judicially separated or unmarried women", "5 years"]
                - ["Ex-servicemen", "Military service + 3 years"]
                - ["Ad-hoc / contract / daily-wage staff of the Haryana Government", "Years served, up to 52"]
            source: hc-advt
          - p: "The corrigendum of 5 February 2026 adds one more: employees of the Haryana Government or the High Court and its subordinate courts with at least 4 years' service by 1 January 2026 may apply up to age 45, subject to 3 chances, through their head of office."
            source: hc-corr
          - note: "No one other than an ex-serviceman can go above 52 by stacking relaxations."
            source: hc-advt
      - id: scheme
        nav: "Exam Scheme"
        eyebrow: "Exam scheme &amp; marking"
        heading: "Negative-marked prelim; six essay papers; interview of 75"
        parts:
          - list:
              - "<strong>Prelim:</strong> Paper I General Studies (100 marks) and Paper II CSAT (100 marks, qualifying at 33%), 2 hours each, in English and Hindi. Prelim merit is on Paper I only; about 12 times the vacancies go to the mains."
              - "<strong>Negative marking:</strong> 0.25 mark is cut for every wrong answer. Each question has five circles — A to D, and E for 'not attempting'. Leaving all five blank also costs 0.25, and anyone who leaves all five blank in more than 10% of questions is disqualified."
            source: hc-advt
          - table:
              caption: "Main written exam (3 hours each) and personality test"
              head: ["Paper", "Marks"]
              rows:
                - ["English (including English essay)", "100"]
                - ["Hindi (including Hindi essay), Devanagari", "100"]
                - ["General Studies I", "100"]
                - ["General Studies II", "100"]
                - ["General Studies III", "100"]
                - ["General Studies IV", "100"]
                - ["Personality test / viva-voce (3× posts)", "75"]
                - ["Total for merit", "675"]
            source: hc-advt
          - p: "To reach the interview you need 45% of the written aggregate and at least 33% in both English and Hindi. GS papers can be answered in Hindi or English, but not mixed in one paper. Equal totals go to higher written marks, then the older candidate."
            source: hc-advt
      - id: fees
        nav: "Fees"
        eyebrow: "Fee structure"
        heading: "₹1,000, or ₹250 for Haryana's reserved categories and women"
        parts:
          - table:
              head: ["Candidate", "Fee"]
              rows:
                - ["Persons with benchmark disabilities of Haryana (40%+)", "Nil"]
                - ["DSC, OSC, BC-A (NCL), BC-B (NCL), ESM, EWS and women of Haryana", "₹250"]
                - ["Dependants of ESM of Haryana in a reserved vertical category", "₹250"]
                - ["Dependants of ESM of Haryana, unreserved", "₹1,000"]
                - ["All other candidates", "₹1,000"]
            source: hc-advt
          - note: "Fees are paid online and never refunded or carried over to another exam."
            source: hc-advt
      - id: reservation
        nav: "Reservation &amp; Local Status"
        eyebrow: "Reservation &amp; local status"
        heading: "Only Haryana domiciles, on Haryana's own certificates"
        parts:
          - table:
              caption: "Category split of the 102 posts"
              head: ["Category", "Posts"]
              rows:
                - ["General / Unreserved", "46"]
                - ["Deprived Scheduled Castes (DSC) of Haryana", "13"]
                - ["Other Scheduled Castes (OSC) of Haryana", "10"]
                - ["Backward Classes (A) of Haryana", "15"]
                - ["Backward Classes (B) of Haryana", "7"]
                - ["EWS of Haryana", "11"]
                - ["Ex-servicemen (horizontal)", "5"]
                - ["Persons with benchmark disabilities (horizontal)", "7"]
            source: hc-advt
          - list:
              - "Reservation is only for DSC / OSC / BC-A / BC-B (non-creamy layer) / EWS / PwBD candidates who are residents or domiciles of Haryana. Reserved candidates of other states compete as General."
              - "SC candidates must upload the latest DSC or OSC certificate under the notification of 13 November 2024."
              - "BC-A / BC-B certificates must be issued in 2025-26 (April 2025 – March 2026) under the creamy-layer notification of 16 July 2024. An OBC certificate is accepted only if it names BC-A or BC-B."
              - "Women must use a caste certificate from the father's side; one from the husband's side is not accepted."
            source: hc-advt
          - p: "EWS candidates of Haryana must attach the certificate under the Government instructions of 25 February 2019 / 14 January 2026."
            source: hc-corr
      - id: documents
        nav: "Documents"
        eyebrow: "Document checklist"
        heading: "Upload with the online form"
        parts:
          - list:
              - "Photo, signature, degrees and mark sheets."
              - "DSC / OSC certificate (13 November 2024 format); BC-A / BC-B non-creamy-layer certificate for 2025-26; EWS certificate for 2025-26; dependant-of-ESM certificate for 2025-26."
              - "Haryana resident / domicile certificate if claiming reservation; Aadhaar."
              - "PwBD certificate; ESM / freedom-fighter dependant certificate; experience certificate for age relaxation; NOC for Haryana Government employees under bond."
            source: hc-advt
      - id: pay
        nav: "Pay &amp; Salary"
        eyebrow: "Salary"
        heading: "Group A and Group B posts"
        parts:
          - p: "HCS (Executive Branch) is a Group-A post; the other nine allied services are Group-B."
            source: hc-advt
          - note: "The advertisement does not print a pay level or pay scale for any of the posts, so none is shown here."
      - id: posting
        nav: "Job &amp; Posting"
        eyebrow: "Job profile &amp; posting"
        heading: "Allocation of service by merit and preference"
        parts:
          - p: "Candidates submit their preference of services online with the application, and it cannot be changed. A candidate who opts for only one service is considered only for that service. The final list is out of 675 marks, and services are allotted in merit order against those preferences."
            source: hc-advt
    sources:
      - { id: hc-advt, name: "HPSC — Advertisement No. 22/2026, HCS (Ex. Br.) &amp; Other Allied Services Examination-2025 (30 Jan 2026)", url: "https://www.hpsc.gov.in/Portals/0/Advt_22_2026_HCS_Ex_Br_30_01_2026_1.pdf", covers: "posts, category split, qualification, DSP physical standard, closing-date rules, fee, age and relaxations, prelim and mains scheme, negative marking, qualifying marks, tentative schedule, preferences, reservation and certificate rules, documents", checked: 2026-10-19 }
      - { id: hc-corr, name: "HPSC — Corrigendum to Advt. No. 22/2026 (5 Feb 2026)", url: "https://www.hpsc.gov.in/Portals/0/Corr_HCS_Ex_Br_2025_05_02_2026.pdf", covers: "age relaxation to 45 for Haryana Government / court employees, EWS certificate instructions", checked: 2026-10-19 }
      - { id: hc-res, name: "HPSC — Final result (allocation of service), HCS (Ex. Br.) &amp; Other Allied Services Exam-2025 (17 Oct 2026)", url: "https://www.hpsc.gov.in/Portals/0/HCS_ALLOCATION_17_10_26.pdf", covers: "interview dates, 101 candidates recommended, category break-up", checked: 2026-10-19 }

  # ------------------------------------------------------------------ HSSC — CET GROUP C
  - slug: hssc
    group: civil
    short: "HSSC CET Group-C Route (Phase-II, Advt. 06/2026)"
    body: "Haryana Staff Selection Commission"
    card: "Haryana fills Group-C posts in two steps: a Common Eligibility Test (CET) whose marks stay valid for three years, then a post-wise Phase-II exam. Advt. 06/2026 used this route for 1,205 Jail Warders and 33 Assistant Superintendents of Jail."
    card_facts: ["CET marks valid 3 years", "No fee for Phase-II", "Blank answer = −1"]
    eyebrow: "HSSC · CET &amp; Group-C"
    title: "HSSC CET Group-C 2026 — CET Validity, Phase-II Scheme, Jail Warder Posts, Reservation Rules"
    lede: "The Haryana Staff Selection Commission recruits Group-C staff through the Common Eligibility Test (CET) and a second, post-specific exam. This page follows Advertisement No. 06/2026 (22 June 2026) for CET Phase-II Group-C posts in the Prisons Department, which reprints the CET Policy of 31 December 2024 and its amendment of 11 July 2025."
    facts:
      - { label: "Posts", value: "1,238 (Warder 1,205)", source: hs-advt }
      - { label: "Who can apply", value: "CET 01/2025 Group-C qualified", source: hs-advt }
      - { label: "CET marks", value: "Valid 3 years", source: hs-advt }
      - { label: "Fee", value: "Nil for Phase-II", source: hs-advt }
    official:
      - { label: "HSSC website", url: "https://hssc.gov.in/" }
      - { label: "HSSC advertisements", url: "https://hssc.gov.in/advertisement" }
    sections:
      - id: overview
        nav: "Overview"
        eyebrow: "Overview &amp; official source"
        heading: "CET first, then a Phase-II exam for each group of posts"
        parts:
          - p: "Only candidates who qualified the Common Eligibility Test (CET) Advt. No. 01/2025 Group-C could apply for Advt. 06/2026, online at adv062026.hryssc.com from 24 to 30 June 2026, with corrections on 1–2 July 2026. The exam date was to be announced separately."
            source: hs-advt
          - table:
              caption: "Posts in Advt. 06/2026 (Prisons Department)"
              head: ["Post", "Pay level", "Posts", "Age"]
              rows:
                - ["Assistant Superintendent Jail", "FPL-6", "33", "21 – 27"]
                - ["Warder (Female)", "FPL-2", "112", "18 – 25"]
                - ["Warder (Male)", "FPL-2", "1,093", "18 – 25"]
            source: hs-advt
          - note: "HSSC also advertised Group-D posts under its CET Group-D route (Advt. 05/2026, 18 June 2026)."
            source: hs-advt
      - id: eligibility
        nav: "Eligibility &amp; Age"
        eyebrow: "Eligibility &amp; age limits"
        heading: "CET-qualified, Class 12, Hindi or Sanskrit"
        parts:
          - list:
              - "<strong>CET:</strong> Group-C CET needs at least Class 12 (or Matric with an additional qualification); Group-D CET needs Matric with Hindi or Sanskrit. You must score 50% in CET (40% reserved) to be eligible for Phase-II. Attempts are unlimited, and a better score replaces the old one."
              - "<strong>Warder:</strong> Class 12 and Hindi or Sanskrit as a subject in Matric or higher. Height 170 cm for men (168 reserved) with chest 83 / 87 cm (81 / 85 reserved); 158 cm for women (156 reserved). Men run 2.5 km in 12 min (ex-servicemen 1 km in 5 min); women 1 km in 6 min."
              - "<strong>Age:</strong> Warder 18–25 and Assistant Superintendent Jail 21–27, with 5 years' relaxation for DSC / OSC, BC-A / BC-B and EWS; other relaxations follow the instructions of 25 March 2022."
            source: hs-advt
      - id: scheme
        nav: "Exam Scheme"
        eyebrow: "Exam scheme &amp; marking"
        heading: "100 MCQs, no penalty for a wrong answer — but −1 for leaving a question blank"
        parts:
          - list:
              - "Phase-II written exam: 100 multiple-choice questions, 100 marks, 1 hour 45 minutes, offline on OMR, in English and Hindi."
              - "<strong>Marking:</strong> no negative mark for a wrong option, but if you leave a question you must fill the fifth bubble; failing to do so costs one mark."
              - "<strong>Qualifying:</strong> 50% for general and 40% for reserved candidates (vertical or horizontal)."
              - "At most 10 times the posts are called to the written / skill exam (police and teaching posts excepted). Merit is on the Phase-II marks (plus any score such as NCC for police posts). Equal marks go to the older candidate, then to higher CET marks."
            source: hs-advt
      - id: fees
        nav: "Fees"
        eyebrow: "Fee structure"
        heading: "No fee for Phase-II"
        parts:
          - p: "No fee is required from any candidate for applying against any post in Advt. 06/2026."
            source: hs-advt
      - id: reservation
        nav: "Reservation &amp; Local Status"
        eyebrow: "Reservation &amp; local status"
        heading: "Bona fide residents of Haryana, with fresh certificates"
        parts:
          - list:
              - "Reservation is only for DSC / OSC / BC-A / BC-B / EWS and ESM candidates who are bona fide residents of Haryana; reserved candidates of other states compete as General."
              - "BC-A / BC-B (non-creamy layer) and EWS certificates must be issued on or after 1 April 2026 and by the closing date; DSC / OSC certificates after 13 November 2024; ESM family eligibility certificates renewed after 25 June 2025."
              - "Central-government OBC and EWS certificates, and BC certificates made for Panchayat elections, are not accepted."
              - "Not having Hindi or Sanskrit as prescribed is listed as a ground for rejection."
            source: hs-advt
      - id: documents
        nav: "Documents"
        eyebrow: "Document checklist"
        heading: "Only what you upload is checked"
        parts:
          - list:
              - "Signed application with every document uploaded; documents not uploaded are not considered later."
              - "BC-A / BC-B certificate (Annexure I), EWS certificate (Annexure II A or II B), ESM family eligibility certificate (Annexure III), ESM undertaking, twins undertaking where relevant."
              - "Qualification certificates; Hindi / Sanskrit proof; Parivar Pehchan Patra details where asked."
            source: hs-advt
      - id: pay
        nav: "Pay &amp; Salary"
        eyebrow: "Salary"
        heading: "Pay levels FPL-2 and FPL-6"
        parts:
          - p: "Warder (male and female) is placed at FPL-2 and Assistant Superintendent Jail at FPL-6 in Appendix A of the advertisement."
            source: hs-advt
          - note: "Appendix A names only the level; it does not print a rupee figure, so none is shown."
      - id: posting
        nav: "Job &amp; Posting"
        eyebrow: "Job profile &amp; posting"
        heading: "Department preference decides the posting"
        parts:
          - p: "Because one exam covers several posts and departments, you fill detailed post and department preferences online; they cannot be changed later, and you are not considered for a post you did not choose. Documents are verified by the indenting department before appointment."
            source: hs-advt
    sources:
      - { id: hs-advt, name: "HSSC — Advertisement No. 06/2026, CET Phase-II for Group-C posts, with CET Policy of 31 Dec 2024 and amendment of 11 Jul 2025 (22 Jun 2026)", url: "https://hssc.gov.in/file/ac1f23cd-9d9c-1328-819e-ef25fa0a0061/advertisements", covers: "eligibility to apply, dates, posts, pay levels, ages, physical standards, Phase-II scheme and marking, CET rules and validity, fee, reservation and certificate dates, documents, preferences, tie rules", checked: 2026-10-19 }

  # ------------------------------------------------------------------ HSTES — DIPLOMA
  - slug: diploma
    group: academic
    short: "HSTES Polytechnic Diploma Admission 2026-27"
    body: "Haryana State Technical Education Society"
    card: "Three-year engineering diplomas in Haryana's polytechnics after Class 10 — merit on Class 10 marks, two online counsellings and then institute-level rounds. Girls pay no tuition in government polytechnics."
    card_facts: ["Merit on Class 10 %", "85% Haryana state quota", "Registration ₹1,000 · ₹700 reserved"]
    eyebrow: "HSTES · Diploma admission"
    title: "Haryana Polytechnic Diploma Admission 2026-27 — Class 10 Merit, Reservation, PPP ID, Key Dates"
    lede: "The Haryana State Technical Education Society runs online admission to diploma courses in Haryana's government, aided and private polytechnics. This page follows the HSTES Diploma Prospectus 2026 for the 2026-27 session."
    facts:
      - { label: "Basis", value: "Class 10 aggregate %", source: dp-pros }
      - { label: "Seats", value: "85% state · 15% All India", source: dp-pros }
      - { label: "Fee", value: "₹1,000 · ₹700 reserved", source: dp-pros }
      - { label: "Last admission date", value: "17 Aug 2026", source: dp-pros }
    official:
      - { label: "HSTES website", url: "https://hstes.org.in/" }
      - { label: "Online admission portal", url: "https://techadmissionshry.gov.in/" }
    sections:
      - id: overview
        nav: "Overview"
        eyebrow: "Overview &amp; official source"
        heading: "Two online counsellings, then institute level"
        parts:
          - table:
              caption: "Diploma Engineering 2026-27 (all seats of govt / aided polytechnics, 75% of private seats)"
              head: ["Event", "Date"]
              rows:
                - ["Online registration and fee", "From 13 Apr 2026"]
                - ["Online verification of marks and details", "21 Apr – 10 Jun 2026"]
                - ["Choice filling and locking", "Till 15 Jun 2026, 5 pm"]
                - ["1st counselling seat allotment", "16 Jun 2026"]
                - ["2nd counselling seat allotment", "26 Jun 2026"]
                - ["Final cut-off for all admissions", "17 Aug 2026"]
            source: dp-pros
          - note: "The schedule is tentative; HSTES asks candidates to watch hstes.org.in and techadmissionshry.gov.in."
            source: dp-pros
      - id: eligibility
        nav: "Eligibility"
        eyebrow: "Academic eligibility"
        heading: "Class 10 pass"
        parts:
          - list:
              - "<strong>Diploma Engineering:</strong> passed Class 10 / SSC from a recognised board."
              - "Lateral entry and Diploma Pharmacy have their own qualifying exams; their merit is on the percentage of that exam."
              - "Mark sheets in a language other than English or Hindi need a board-issued transcript in English or Hindi."
            source: dp-pros
      - id: scheme
        nav: "Admission Basis"
        eyebrow: "How merit is made"
        heading: "Class 10 percentage — no entrance test"
        parts:
          - list:
              - "Merit is on the <strong>percentage of aggregate marks in Class 10</strong>, rounded to four decimals; where a board gives only CGPA, its conversion factor is used."
              - "Ties are broken by higher Mathematics marks, then higher Science marks."
              - "Merit is prepared only for candidates whose online form was verified by the chosen designated centre."
            source: dp-pros
      - id: fees
        nav: "Fees"
        eyebrow: "Fee structure"
        heading: "₹1,000 registration, ₹700 for reserved categories of Haryana"
        parts:
          - table:
              head: ["Candidate", "Registration fee (non-refundable)"]
              rows:
                - ["General category", "₹1,000"]
                - ["Reserved categories of Haryana (SC / DSC / BC / PH / FF / ESM / EWS / KM / HGST / girls)", "₹700"]
            source: dp-pros
          - list:
              - "An admission data-management fee of ₹200 is charged once per admission."
              - "Girls pay no tuition fee in government and government-aided polytechnics, and SC students' tuition fees are reimbursed."
              - "The last date to withdraw an admission for a fee refund is 31 July 2026."
            source: dp-pros
      - id: reservation
        nav: "Reservation &amp; Local Status"
        eyebrow: "Reservation &amp; state quota"
        heading: "85% state quota with Haryana's own categories"
        parts:
          - table:
              caption: "Reservation of seats, 2026-27"
              head: ["Category", "Share"]
              rows:
                - ["All India category", "15% of intake"]
                - ["Haryana state quota", "85% of intake"]
                - ["— Haryana open general", "50% of state quota"]
                - ["— Scheduled Castes (half OSC, half DSC in govt / aided)", "20% of state quota"]
                - ["— Backward Classes (A)", "16% of state quota"]
                - ["— Backward Classes (B)", "11% of state quota"]
                - ["— Physically handicapped", "3% of state quota"]
            source: dp-pros
          - list:
              - "Girls get 25% horizontal reservation in every category; ESM / freedom fighters' dependants 3% horizontal."
              - "Supernumerary seats: EWS up to 10%, Tuition Fee Waiver up to 5%, Kashmiri migrants up to 5%; one seat per branch per polytechnic for Haryana Government school toppers."
              - "Special quotas: 50% at Govt. Polytechnic Uttawar for Mewat residents, 50% at Govt. Polytechnic Morni for Shivalik areas, and 2 seats per branch for villages that gave land for six polytechnics."
              - "In private unaided polytechnics, 25% of seats are filled by the institute and 75% through HSTES."
            source: dp-pros
      - id: documents
        nav: "Documents"
        eyebrow: "Document checklist"
        heading: "PPP ID is compulsory for Haryana residents"
        parts:
          - list:
              - "The Parivar Pehchan Patra (PPP ID) is mandatory for Haryana residents; category, domicile and income are fetched from it, so keep it updated and verified."
              - "Anyone who passed the qualifying exam from a school in Haryana is treated as a Haryana resident; those who studied outside but have parental address in Haryana use the PPP ID."
              - "At reporting: original Class 10 / 12 mark sheet, character certificate (from the school, or a First-Class Magistrate for private candidates), employer certificate for wards of Haryana employees posted outside, and category certificates."
            source: dp-pros
      - id: pay
        nav: "Costs"
        eyebrow: "Costs"
        heading: "One semester's fee at reporting"
        parts:
          - p: "At the allotted institute you deposit one semester's fee; fee structures of the private institutions are in the prospectus appendix and on techeduhry.gov.in."
            source: dp-pros
      - id: posting
        nav: "After counselling"
        eyebrow: "After counselling"
        heading: "Report or lose the seat"
        parts:
          - p: "After each allotment you print the provisional seat-allotment letter and report at the institute with originals and the fee. A seat not reported in time is cancelled, though you may join the next round."
            source: dp-pros
          - links:
              - { label: "Diploma after Class 10", url: "diploma.html" }
    sources:
      - { id: dp-pros, name: "HSTES — Diploma Prospectus 2026 (session 2026-27)", url: "https://hstes.org.in/Documents/2026/Prospectus/Diploma-Prospectus-2026.pdf", covers: "admission basis, eligibility, merit and tie rules, registration fee, reservation and special quotas, PPP ID and resident rule, key dates, reporting documents, refunds", checked: 2026-10-19 }
