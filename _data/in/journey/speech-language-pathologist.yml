# Journey Blueprint — Speech-Language Pathologist (B.ASLP → M.Sc SLP; RCI-recognised). Printed on journey-speech-language-pathologist.html.
# Rules, classes and the money items / sources several careers share: _data/in/journey_common.yml.
id: speech-language-pathologist
v: 2
name: "Speech-Language Pathologist (B.ASLP → M.Sc Speech-Language Pathology)"
search: ["speech-language pathologist", "speech language pathologist", "speech therapist", "slp", "baslp", "b.aslp", "audiologist and speech language pathologist"]
page: "audiology-speech-therapy.html"
roadmap: "roadmaps/audiology-speech-therapy.html"
doubts_page: "journey-speech-language-pathologist.html"
gate: "Class 12 with 50% in a science group (PCMB or listed combinations) → national entrance at AIISH Mysuru or another RCI-recognised college → B.ASLP, 4 years including a 1-year internship → M.Sc (Speech-Language Pathology), 2 years. Professionals in this field register with the Rehabilitation Council of India."
gate_source: [aiish-pros26, rci-act]
core:
  what:
    text: "A speech-language pathologist assesses and treats problems with speech, language, voice, fluency and swallowing, in children and adults. The B.ASLP degree trains graduates to work as both audiologists and speech-language pathologists."
    source: aiish-pros26
  day:
    - "Assess speech, language, voice and swallowing problems."
    - "Run therapy for stuttering, delayed speech, aphasia after stroke and voice disorders."
    - "Counsel families and work with doctors, teachers and special educators."
  pay_note: "No central pay scale for speech-language pathologists was read, so none is printed. AIISH pays its B.ASLP students a stipend (see Money help)."
  routes:
    - { title: "B.ASLP at AIISH Mysuru", text: "80 seats (40 regular + 40 self-finance), filled by merit in AIISH's national-level entrance on the NCERT / CBSE syllabus: Physics and Chemistry compulsory, plus Biology or Mathematics.", source: aiish-pros26 }
    - { title: "M.Sc (Speech-Language Pathology)", text: "2 years, 44 seats at AIISH; needs a B.ASLP or B.Sc (Speech & Hearing) recognised by the RCI; criteria are prescribed by the RCI and the University of Mysore.", source: aiish-pros26 }
    - { title: "Diploma first", text: "AIISH keeps 2 B.ASLP seats for holders of the RCI-recognised Diploma in Hearing Language and Speech (DHLS) or Diploma in Hearing Aid and Ear Mould Technology, still on entrance merit.", source: aiish-pros26 }
    - { title: "Registration", text: "The Rehabilitation Council of India keeps the Central Rehabilitation Register; only enrolled rehabilitation professionals may hold posts, practise or certify.", source: rci-act }
  cost_time:
    - { label: "B.ASLP length", value: "4 years: 6 semesters + 1-year internship", source: aiish-pros26 }
    - { label: "AIISH fee (General / OBC / EWS)", value: "₹29,500 first year · ₹23,600 in years 2–3 · ₹24,370 internship year", source: aiish-pros26 }
    - { label: "AIISH fee (SC / ST / PwD)", value: "₹26,000 · ₹20,100 · ₹20,870", source: aiish-pros26 }
  cost_note: "Self-finance (SFS) seats at AIISH cost more — see the fee table in the prospectus. University of Mysore fees are extra."
  challenges:
    - text: "Few seats at the national institute: 80 B.ASLP seats at AIISH, half of them self-finance."
      source: aiish-pros26
    - text: "You need 50% (45% SC / ST) in the science group just to apply for the entrance."
      source: aiish-pros26
    - text: "Practice is tied to the RCI register — working without enrolment is an offence under the RCI Act."
      source: rci-act
  not_for:
    - "You want to prescribe medicines or operate — that is ENT medicine via MBBS."
    - "You lack patience for slow, step-by-step therapy."
    - "You dislike talking with children and families every day."
journey:
  - stages: [c8, c9]
    title: "Science and listening"
    do:
      - text: "AIISH's entrance tests Physics and Chemistry plus Biology or Mathematics, on the NCERT / CBSE syllabus."
        source: aiish-pros26
    doubts:
      - q: "What does a speech-language pathologist do?"
        a: "They assess and treat disorders of speech, language, voice, fluency and swallowing. AIISH says B.ASLP graduates are qualified to work as both audiologists and speech-language pathologists in hospitals, rehabilitation centres, clinics, schools and academic institutions."
        next: "Read the Routes list above."
        source: aiish-pros26
      - q: "Is a speech therapist a doctor?"
        a: "No. It is a rehabilitation profession with its own degree (B.ASLP), not MBBS. Professionals register with the Rehabilitation Council of India."
        next: "Plan for a science stream and the B.ASLP entrance."
        source: [aiish-pros26, rci-act]
  - stages: [c10]
    title: "Choose science — PCB or PCM"
    do:
      - text: "B.ASLP needs at least three subjects from Physics, Chemistry and Biology / Mathematics / Computer Science / Statistics / Electronics / Psychology."
        source: aiish-pros26
    stream: "Science: Physics, Chemistry and Biology or Mathematics."
    doubts:
      - q: "Can a PCM student do B.ASLP?"
        a: "Yes. AIISH's entrance has Physics and Chemistry as compulsory subjects and either Biology or Mathematics as the optional one."
        next: "Keep Maths or Biology strong for the optional paper."
        source: aiish-pros26
      - q: "Can I do B.ASLP with Psychology in Class 12?"
        a: "AIISH asks for at least three subjects from Physics, Chemistry and Biology / Mathematics / Computer Science / Statistics / Electronics / Psychology — but the entrance itself tests Physics, Chemistry and Biology or Mathematics."
        next: "Keep Physics and Chemistry in Class 11–12."
        source: aiish-pros26
  - stages: [c11, c12]
    title: "Score 50% and write the AIISH entrance"
    do:
      - text: "50% (45% SC / ST) in the PCMB group or combinations in Class 12 to apply."
        source: aiish-pros26
    doubts:
      - q: "What marks do I need in Class 12 for B.ASLP?"
        a: "At least 50% (45% for SC / ST) in the PCMB group or combinations thereof, to apply for AIISH's entrance."
        next: "Keep your science-group average above 50%."
        source: aiish-pros26
      - q: "How are B.ASLP seats filled at AIISH?"
        a: "By merit in AIISH's national-level entrance on the NCERT / CBSE syllabus. Only foreign-quota students are selected on Class 12 science marks."
        next: "Prepare from NCERT Physics, Chemistry and Biology or Maths."
        source: aiish-pros26
      - q: "How many B.ASLP seats does AIISH have?"
        a: "80 — 40 regular and 40 self-finance, with seats for SC (12), ST (6), OBC (22), EWS (8), North-Eastern candidates, diploma holders, PwD and foreign students."
        next: "Apply to other RCI-recognised colleges too."
        source: aiish-pros26
  - stages: [ug]
    title: "B.ASLP: 3 years + internship"
    do:
      - text: "Six semesters of study and a fourth-year internship."
        source: aiish-pros26
    money: [aiish-stipend]
    doubts:
      - q: "How long is B.ASLP?"
        a: "Four years — six semesters plus a one-year internship."
        next: "Plan for four years before you start work."
        source: aiish-pros26
      - q: "Do B.ASLP students get a stipend at AIISH?"
        a: "Yes. ₹800 a month for 10 months in each of the first three years, and in the internship year ₹6,000 a month in North-Eastern states or ₹5,000 a month elsewhere."
        next: "Ask other colleges whether they pay a stipend."
        source: aiish-pros26
      - q: "What are AIISH's B.ASLP fees?"
        a: "For General / OBC / EWS: ₹29,500 in year 1, ₹23,600 in years 2 and 3 and ₹24,370 in the internship year. For SC / ST / PwD: ₹26,000, ₹20,100 and ₹20,870. University fees are extra."
        next: "Budget for University of Mysore fees on top."
        source: aiish-pros26
      - q: "Is there a bond at AIISH?"
        a: "B.ASLP students must sign an indemnity bond at admission, in the format in AIISH's prospectus."
        next: "Read the bond format before admission."
        source: aiish-pros26
  - stages: [grad]
    title: "M.Sc (Speech-Language Pathology) and RCI registration"
    do:
      - text: "M.Sc (SLP) at AIISH: 2 years, 44 seats, for B.ASLP / B.Sc (Speech & Hearing) graduates of RCI-recognised programmes."
        source: aiish-pros26
    doubts:
      - q: "Do I need an M.Sc to work as a speech-language pathologist?"
        a: "AIISH says B.ASLP graduates are qualified to work as audiologists and speech-language pathologists. The 2-year M.Sc (Speech-Language Pathology) trains you as a specialist in differential diagnosis, management and research."
        next: "Take the M.Sc if you want specialist, teaching or research jobs."
        source: aiish-pros26
      - q: "Do I need to register with RCI?"
        a: "Yes. Under section 13 of the RCI Act, only professionals enrolled on the Central Rehabilitation Register may hold rehabilitation posts, practise or certify; breaking this can bring up to a year in jail and / or a ₹1,000 fine."
        next: "Apply for RCI registration as soon as you graduate."
        source: rci-act
      - q: "Can I specialise in audiology instead?"
        a: "Yes. After B.ASLP you can take the 2-year M.Sc (Audiology) — AIISH has 44 seats — which focuses on hearing disorders, while M.Sc (Speech-Language Pathology) focuses on speech, language and swallowing."
        next: "Choose the M.Sc that matches the work you enjoyed in internship."
        source: aiish-pros26
  - stages: [work]
    title: "Specialise or teach"
    do:
      - text: "AIISH also runs Ph.D. programmes in Speech-Language Pathology, with JRF seats and external candidates."
        source: aiish-pros26
    doubts:
      - q: "Can I do a Ph.D. in speech-language pathology?"
        a: "Yes. AIISH's 2026-27 prospectus lists a Ph.D. in Speech-Language Pathology with 9 JRF seats plus external candidates."
        next: "Finish your M.Sc and look for a guide."
        source: aiish-pros26
board_note: "Any board. Class 12 needs 50% (45% SC / ST) in the science group; AIISH treats the Karnataka PUC and its equivalents as the qualifying exam."
board_source: aiish-pros26
