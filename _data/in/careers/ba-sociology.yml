  - id: "higher"
    hid: "higher-heading"
    alt: true
    eyebrow: "Beyond the degree"
    heading: "Higher studies"
    parts:
      - prose:
          - "An MA in Sociology — at institutions like <strong>Delhi School of Economics, JNU or Tata Institute of Social Sciences (TISS)</strong> — is the natural next step for students aiming at research, teaching (via UGC-NET) or specialised policy work. Others pursue an MBA in HR, a Master's in Social Work for a more applied development-sector career, or move directly into UPSC or state PSC preparation, all of which build on Sociology's grounding in group behaviour and social structures."
  - id: "proscons"
    hid: "pc-heading"
    eyebrow: "Honest take"
    heading: "Advantages and disadvantages"
    parts:
