            - { title: "Fees", text: "Receipt for one year or one course, or a confirmed education-loan application with the provider's letter.", source: fpsv }
            - { title: "Living money", text: "NZD 20,000 a year (NZD 1,667 a month if under a year).", source: fpsv }
