  read_time: "8 min read"
  intro:
    - "Biomedical engineers design, test, install and maintain medical equipment — from ECG machines and ventilators to imaging systems and implants. The main route is a 4-year B.Tech/B.E. in Biomedical Engineering after Class 12 PCM, admitted through JEE Main or state engineering entrance tests. The medical devices they work on are regulated in India by the Central Drugs Standard Control Organisation (CDSCO)."
