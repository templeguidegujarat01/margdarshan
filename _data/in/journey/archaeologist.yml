# Journey Blueprint — Archaeologist (Master's in Archaeology / Ancient History → PG Diploma in Archaeology or Ph.D. → ASI through UPSC). Printed on journey-archaeologist.html.
# Rules, classes and the money items / sources several careers share: _data/in/journey_common.yml.
# `sources` below are used only by this career. Check: node scripts/check-journey-matrix.mjs
id: archaeologist
v: 2
name: "Archaeologist (Master's → PG Diploma in Archaeology / Ph.D. → ASI via UPSC)"
search: ["archaeologist", "archeologist", "archaeology", "asi", "archaeological survey of india", "excavation", "ancient history", "deputy superintending archaeologist", "epigraphist"]
page: "journey-archaeologist.html"
doubts_page: "journey-archaeologist.html"
gate: "History and Geography in school → B.A. (History or related) → Master's in Archaeology or Ancient / Medieval Indian History (or Anthropology / Geology with the right papers) → a Ph.D., or a 1-year PG Diploma in Archaeology plus 3 years' excavation experience → UPSC recruitment for Deputy Superintending Archaeologist in the Archaeological Survey of India."
gate_source: upsc-adv07
core:
  what:
    text: "An archaeologist finds, records, excavates and protects the remains of the past — sites, monuments and antiquities. In central government, the Archaeological Survey of India (Ministry of Culture) recruits Deputy Superintending Archaeologists through UPSC."
    source: upsc-adv07
  day:
    - "Survey villages and sites for antiquarian remains."
    - "Plan and run excavations, and document finds."
    - "Protect monuments from encroachment and damage, and check conservation work."
  pay:
    - { level: "Deputy Superintending Archaeologist, ASI (UPSC Advt 07/2026)", value: "Pay Level 10 (Group A gazetted)", source: upsc-adv07 }
  pay_note: "The UPSC advert prints the pay level, not a rupee figure. University and museum pay is not printed here."
  routes:
    - { title: "Master's + Ph.D.", text: "Master's in Archaeology, or in Indian History with Ancient / Medieval Indian History, or in Anthropology with stone-age archaeology, or in Geology with Pleistocene geology — plus a doctorate in Archaeology, Indian History, Anthropology or Geology.", source: upsc-adv07 }
    - { title: "Master's + PG Diploma + fieldwork", text: "The same Master's options, plus a Post Graduate Diploma in Archaeology of at least one year and 3 years' field experience in archaeology including excavation.", source: upsc-adv07 }
    - { title: "ASI's own institute", text: "The Pt. Deen Dayal Upadhyaya Institute of Archaeology is ASI's academic campus at Greater Noida; its admission process starts in July–August each year.", source: asi-ioa }
    - { title: "University teaching", text: "UGC NET is held in Archaeology (subject code 67) for Assistant Professor and JRF.", source: net-dec26 }
  cost_time:
    - { label: "PG Diploma in Archaeology (UPSC route)", value: "At least 1 year", source: upsc-adv07 }
    - { label: "Field experience (UPSC route B)", value: "3 years, including excavation", source: upsc-adv07 }
  cost_note: "Degree and diploma fees differ by university and were not printed in the files we read."
  challenges:
    - text: "Posts are few: UPSC Advt 07/2026 had only 2 Deputy Superintending Archaeologist posts."
      source: upsc-adv07
    - text: "You need either a doctorate, or a PG Diploma plus 3 years' excavation experience — after a Master's."
      source: upsc-adv07
    - text: "The job carries an all-India transfer liability."
      source: upsc-adv07
  not_for:
    - "You dislike outdoor work in heat, dust and remote villages."
    - "You want quick results — excavation and research take years."
    - "You do not enjoy history, reading and careful recording."
journey:
  - stages: [c8, c9]
    title: "Fall in love with the past"
    do:
      - text: "ASI archaeologists document antiquities and survey villages for antiquarian remains — the habit starts with noticing old things around you."
        source: upsc-adv07
    doubts:
      - q: "What does an archaeologist do?"
        a: "Finds and studies the remains of the past. In ASI, a Deputy Superintending Archaeologist documents antiquities, surveys villages for remains, conducts exploration and excavation and protects monuments from encroachment and damage."
        next: "Read the Routes list above."
        source: upsc-adv07
      - q: "Which department hires archaeologists in India?"
        a: "The Archaeological Survey of India, Ministry of Culture, recruits Deputy Superintending Archaeologists (Group A, Level 10) through UPSC."
        next: "Visit an ASI-protected monument near you."
        source: upsc-adv07
  - stages: [c10]
    title: "Humanities is the natural route"
    do:
      - text: "The ASI post accepts a Master's in Archaeology or Indian History — and also Anthropology or Geology with the right papers."
        source: upsc-adv07
    stream: "Humanities with History (Science works for the Geology / Anthropology route)."
    doubts:
      - q: "Which stream should I take to become an archaeologist?"
        a: "Humanities with History is the usual route to a Master's in Archaeology or Ancient Indian History. UPSC also accepts a Master's in Anthropology (with stone-age archaeology) or Geology (with Pleistocene geology), so Science students have a way in too."
        next: "Choose the stream that leads to one of these Master's degrees."
        source: upsc-adv07
  - stages: [c11, c12]
    title: "Plan a History degree"
    do:
      - text: "A Master's in Indian History counts for ASI only if Ancient or Medieval Indian History was a subject or paper."
        source: upsc-adv07
    doubts:
      - q: "Can a Science student become an archaeologist?"
        a: "Yes. UPSC accepts a Master's in Geology with Pleistocene geology as a subject or paper, or in Anthropology with stone-age archaeology, for the ASI post."
        next: "Pick those papers in your Master's."
        source: upsc-adv07
      - q: "Does any History degree work for ASI?"
        a: "A Master's in Indian History works only with Ancient or Medieval Indian History as a subject or paper. A Master's in Archaeology works directly."
        next: "Check the papers before you choose your Master's."
        source: upsc-adv07
      - q: "Is an ASI archaeologist's job only digging?"
        a: "No. The duties also include drawing inspection notes, measuring and checking conservation work, using delegated financial and administrative powers, and stopping encroachment and vandalism at monuments."
        next: "Learn record-keeping and basic administration too."
        source: upsc-adv07
  - stages: [ug]
    title: "B.A., then a Master's"
    do:
      - text: "After the Master's, add either a doctorate or a one-year PG Diploma in Archaeology with field experience."
        source: upsc-adv07
    doubts:
      - q: "Is a PG Diploma in Archaeology enough for ASI?"
        a: "Only with a Master's and 3 years' field experience in archaeology including excavation. The other route is a Master's plus a doctorate."
        next: "Join excavations during and after your studies."
        source: upsc-adv07
      - q: "Does ASI run its own archaeology institute?"
        a: "Yes. The Pt. Deen Dayal Upadhyaya Institute of Archaeology is ASI's administrative and academic campus at Greater Noida. Its admission process starts in July–August each year."
        next: "Watch asi.nic.in in July–August."
        source: asi-ioa
      - q: "Is UGC NET held in Archaeology?"
        a: "Yes. Archaeology is a UGC NET subject (code 67). NET qualifies you for Assistant Professor and, in the JRF category, a fellowship for a Ph.D."
        next: "Plan NET in the last year of your Master's."
        source: net-dec26
  - stages: [grad]
    title: "Ph.D. or fieldwork, then UPSC"
    do:
      - text: "UPSC's Deputy Superintending Archaeologist: age up to 35 (UR) / 40 (ST), Pay Level 10, two years' probation."
        source: upsc-adv07
    exams:
      - { name: "UGC NET December 2026", when: "14–18 and 21 Dec 2026", source: net-dec26 }
    money: [ugc-jrf]
    doubts:
      - q: "What is the age limit for the ASI archaeologist post?"
        a: "35 for UR and 40 for ST in UPSC Advt 07/2026, with up to 10 more years for PwBD."
        next: "Check the age rule in each new advert."
        source: upsc-adv07
      - q: "How many ASI archaeologist posts does UPSC advertise?"
        a: "UPSC Advt 07/2026 had 2 posts of Deputy Superintending Archaeologist (one UR, one ST; one reserved for PwBD). Applications closed on 17 July 2026."
        next: "Watch UPSC's recruitment adverts every month."
        source: upsc-adv07
      - q: "Can I get paid while doing a Ph.D. in archaeology?"
        a: "Yes, if you qualify UGC NET with JRF and join a Ph.D. — the fellowship is ₹37,000 a month for 2 years, then ₹42,000 as SRF."
        next: "Aim for the JRF category in NET."
        source: [net-dec26, msje-jrf]
  - stages: [work]
    title: "Field years count"
    do:
      - text: "The ASI post is permanent, General Central Service Group A gazetted, headquartered in New Delhi with liability to serve anywhere in India."
        source: upsc-adv07
    doubts:
      - q: "What kind of field experience does UPSC accept?"
        a: "Three years' field experience in archaeology that must include excavation — needed if you apply with a PG Diploma instead of a doctorate."
        next: "Keep certificates from every excavation you join."
        source: upsc-adv07
      - q: "Can UPSC relax the experience rule?"
        a: "UPSC may relax qualifications for otherwise well-qualified candidates, and may relax the experience rule for ST candidates if not enough experienced ST candidates are available."
        next: "Apply even if you are close — the decision is UPSC's."
        source: upsc-adv07
      - q: "What pension scheme covers the ASI archaeologist post?"
        a: "The advert says the National Pension System (NPS) applies, for appointments from 1 January 2004 onwards."
        next: "Read the service conditions in the advert before you join."
        source: upsc-adv07
board_note: "Any board. History in Classes 11–12 helps, but the Master's degree decides eligibility."
board_source: upsc-adv07
