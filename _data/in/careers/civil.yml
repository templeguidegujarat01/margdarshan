          - "For IITs and National Institutes of Technology (NITs) via JEE, a minimum of <strong>75% aggregate in Class 12</strong> (65% for SC/ST) is required for counselling eligibility."
          - "<strong>Diploma holders</strong> in Civil Engineering can join directly in the second year through most states' lateral entry route."
