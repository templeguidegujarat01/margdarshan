# journey_matrix — data for journey-blueprint.html (the Student Journey Blueprint).
# The page prints this file as JSON and a small script renders the four blocks + the money block for the
# chosen career × class × board. Edit this file, not the page.
#
# Rules (same as every India sheet):
#   - Never type a number you did not read on the official document. Every fact line carries `source:`
#     (an id from `sources` at the bottom). Lines without `source:` are Margdarshan guidance, not facts.
#   - `stages` lists the class ids a step / scheme applies to. The page shows only what is still ahead
#     of the student: an item is hidden once every stage in it is behind the chosen class.
#   - `state:` limits an item to the boards whose `state` matches (gujarat, uttar-pradesh, maharashtra,
#     west-bengal). CBSE students outside Gujarat pick "CBSE — any other state" and see only national rules.
#   - `source:` may be one id or a list of ids. A board_notes value may be plain text (cited to the career's
#     `board_source`) or { text, source } when that board's note comes from a different file.
#   - scripts/check-journey-matrix.mjs validates ids, stages and source links. Run it after editing.
# Written 2026-10-24 from the official files listed under `sources`. Batch 2 (software engineer, merchant
# navy, commercial pilot, bank PO, civil services) and the UP / Maharashtra / West Bengal boards added 2026-10-25.
checked: 2026-10-25

classes:
  - { id: c8, label: "Class 8" }
  - { id: c9, label: "Class 9" }
  - { id: c10, label: "Class 10" }
  - { id: c11, label: "Class 11" }
  - { id: c12, label: "Class 12" }
  - { id: grad, label: "College / graduate" }

boards:
  - id: gseb
    label: "GSEB — Gujarat State Board"
    state: gujarat
    state_name: "Gujarat"
    exams: "Your board exams are the <strong>SSC</strong> (Std 10) and the <strong>HSC</strong> (Std 12). Wherever a notice says Matriculation, SSLC or Class 10, your SSC marksheet and certificate are what count."
  - id: cbse-gj
    label: "CBSE — studying in Gujarat"
    state: gujarat
    state_name: "Gujarat"
    exams: "Your board exams are the CBSE <strong>Class X</strong> and <strong>Class XII</strong> exams. Gujarat-only rules below (domicile seats, state schemes) set their own definition of a Gujarat student — read that rule in the official notice before you count on it."
  - id: upmsp
    label: "UPMSP — Uttar Pradesh Board"
    state: uttar-pradesh
    state_name: "Uttar Pradesh"
    exams: "Your board exams are the UPMSP <strong>High School</strong> (Class 10) and <strong>Intermediate</strong> (Class 12) exams. Wherever a notice says Matriculation or Class 10, your High School certificate is what counts; Intermediate is your Class 12."
  - id: msbshse
    label: "MSBSHSE — Maharashtra State Board"
    state: maharashtra
    state_name: "Maharashtra"
    exams: "Your board exams are the <strong>SSC</strong> (Class 10) and the <strong>HSC</strong> (Class 12). Maharashtra's admission rules check where you passed both, so keep both marksheets and your leaving certificate safe."
  - id: wb
    label: "WBBSE / WBCHSE — West Bengal boards"
    state: west-bengal
    state_name: "West Bengal"
    exams: "Your board exams are the <strong>Madhyamik</strong> (Class 10, WBBSE) and the <strong>Higher Secondary</strong> (Class 12, WBCHSE). Wherever a notice says Matriculation or Class 10, your Madhyamik certificate is what counts."
  - id: cbse
    label: "CBSE — any other state"
    exams: "Your board exams are the CBSE <strong>Class X</strong> and <strong>Class XII</strong> exams. National exams treat every board the same; state quotas follow your own state's rules."
  - id: other
    label: "Other state board"
    exams: "Your Class 10 and Class 12 board certificates count exactly like CBSE ones for every national exam on this page. State quotas and state scholarships follow your own state's rules."

careers:
  # ------------------------------------------------------------------ LOCO PILOT
  - id: loco-pilot
    name: "Loco Pilot (Indian Railways)"
    page: "loco-pilot.html"
    roadmap: "roadmaps/loco-pilot.html"
    gate: "Class 10 + ITI in a listed trade (or a 3-year engineering diploma), then RRB ALP: CBT-1 → CBT-2 → CBAT, and the A-1 medical."
    gate_source: rrb-cen
    foundation:
      - stages: [c8, c9]
        title: "Build the maths the CBT actually asks"
        points:
          - text: "The CBT maths syllabus is school maths: number system, BODMAS, fractions, LCM/HCF, ratio, percentages, mensuration, time and work, time and distance, interest, profit and loss, algebra, geometry, trigonometry and elementary statistics."
            source: rrb-cen
          - text: "Learn these from your own board's maths textbook (NCERT for CBSE). Coaching is not needed at this stage."
      - stages: [c10]
        title: "Pass Class 10 — and get your certificate details right"
        points:
          - text: "Class 10 (Matriculation / SSLC) is the school base for ALP. The CEN 01/2025 qualification table sets <strong>no minimum percentage</strong> for it."
            source: rrb-cen
          - text: "Your name, date of birth and Class 10 roll number, certificate number and date entered in the RRB form <strong>cannot be changed later</strong>. Check spelling on your Class 10 certificate now."
            source: rrb-cen
      - stages: [c10, c11, c12]
        title: "Pick the technical route: ITI or a 3-year diploma"
        points:
          - text: "<strong>ITI (NCVT/SCVT)</strong> in one of the listed trades — Fitter, Electrician, Instrument Mechanic, Millwright/Maintenance Mechanic, Mechanic (Radio &amp; TV), Electronics Mechanic, Mechanic (Motor Vehicle), Wireman, Tractor Mechanic, Armature &amp; Coil Winder, Mechanic (Diesel), Heat Engine, Turner, Machinist, Refrigeration &amp; AC Mechanic — or a Course Completed Act Apprenticeship in those trades."
            source: rrb-cen
          - text: "Or a <strong>3-year diploma</strong> in Mechanical, Electrical, Electronics or Automobile Engineering (or a combination of these)."
            source: rrb-cen
          - text: "Class 11–12 is not required. If you are already in Class 11 or 12, you can still join an ITI or polytechnic after it — check each admission notice for its own rules."
      - stages: [grad]
        title: "Already in engineering? Your degree counts"
        points:
          - text: "A degree in Mechanical, Electrical, Electronics or Automobile Engineering is accepted in place of the diploma."
            source: rrb-cen
          - text: "Watch the age limit: <strong>18–30 years</strong> (as on 1 July 2025 for CEN 01/2025), with relaxations by category. The corrigendum that extended the 2025 application dates kept this age date unchanged."
            source: rrb-cor
    board_notes:
      gseb: "The CBT-1 and CBT-2 papers are offered in <strong>Gujarati</strong>, but the CBAT is only in English and Hindi — practise aptitude tests in one of those two."
      cbse-gj: "You may take CBT-1 and CBT-2 in English, Hindi or Gujarati; the CBAT is only in English and Hindi."
      upmsp: "Your High School certificate is the Class 10 base for ALP. CBT-1 and CBT-2 come in Hindi as well as English; the CBAT is only in English and Hindi."
      msbshse: "Your SSC is the Class 10 base for ALP. CBT-1 and CBT-2 are offered in <strong>Marathi</strong>, but the CBAT is only in English and Hindi — practise aptitude tests in one of those two."
      wb: "Your Madhyamik is the Class 10 base for ALP. CBT-1 and CBT-2 are offered in <strong>Bengali</strong>, but the CBAT is only in English and Hindi — practise aptitude tests in one of those two."
      cbse: "CBT-1 and CBT-2 come in English, Hindi and 13 regional languages; the CBAT is only in English and Hindi."
      other: "CBT-1 and CBT-2 come in English, Hindi and 13 regional languages; the CBAT is only in English and Hindi."
    board_source: rrb-cen
    exam:
      name: "RRB Assistant Loco Pilot — CEN 01/2025"
      body: "Railway Recruitment Boards"
      href: "rrb-alp.html"
      facts:
        - { label: "Posts (all RRBs)", value: "9,970", source: rrb-cen }
        - { label: "Pay at entry", value: "Level 2 · ₹19,900 initial pay", source: rrb-cen }
        - { label: "Age", value: "18–30 years (as on 1 Jul 2025)", source: rrb-cen }
        - { label: "Medical", value: "A-1", source: rrb-cen }
      stages:
        head: ["Stage", "Paper", "Marking", "Pass rule"]
        rows:
          - ["CBT-1 (screening)", "75 questions · 75 marks · 60 min", "−1/3 per wrong answer", "UR/EWS 40%, OBC-NCL 30%, SC 30%, ST 25%; marks not used in the final list"]
          - ["CBT-2 Part A", "100 questions · 90 min", "−1/3 per wrong answer", "Same minimums as CBT-1; these marks decide merit"]
          - ["CBT-2 Part B (trade)", "75 questions · 60 min", "−1/3 per wrong answer", "35% for every category; qualifying only"]
          - ["CBAT (aptitude)", "Psychometric test batteries, English/Hindi", "No negative marking", "T-score of 42 in every battery"]
        source: rrb-cen
      notes:
        - text: "Final merit = <strong>70% CBT-2 Part A + 30% CBAT</strong>. Up to 15 times the vacancies of each RRB are called to CBT-2."
          source: rrb-cen
        - text: "Exam fee: ₹500, of which ₹400 comes back after you sit CBT-1. ₹250 for SC, ST, ex-servicemen, women, transgender, minority and EBC candidates — refunded in full after CBT-1."
          source: rrb-cen
        - text: "The RRBs do not publish pass or fail percentages in the notice, so we do not print one."
    state_rules:
      - state: gujarat
        text: "In CEN 01/2025, RRB Ahmedabad listed <strong>497 ALP posts for Western Railway</strong>."
        source: rrb-cen
      - text: "You apply to <strong>one RRB only</strong>, and CBT-2 shortlisting is done among candidates who chose the same RRB — so your choice of RRB decides whom you compete with."
        source: rrb-cen
      - text: "A-1 medical includes near vision Sn 0.6 without glasses plus colour, binocular, field, night and mesopic vision tests. Fail it and you cannot be appointed, whatever your marks."
        source: rrb-cen
    multiverse:
      - { title: "Running line", text: "Assistant Loco Pilot → Senior ALP → Loco Pilot (Shunter / Goods) → Passenger → Mail/Express → Loco Inspector, by seniority and departmental tests.", href: "loco-pilot.html" }
      - { title: "Same ITI, other railway jobs", text: "RRB Technician and Group D posts take the same ITI trades.", href: "rrb-group-d.html" }
      - { title: "Apprenticeship first", text: "A Course Completed Act Apprenticeship in a listed trade also qualifies you for ALP — and pays a stipend while you train.", href: "railway-apprentice.html" }
      - { title: "Upskill", text: "Diploma holders can move to a B.Tech through lateral entry and aim for railway or PSU engineer jobs later.", href: "diploma.html" }
    money: [nmmss, pms-sc, apprentice-iti, apprentice-dip, rrb-fee, mysy]

  # ------------------------------------------------------------------ LAWYER
  - id: lawyer
    name: "Lawyer (Advocate)"
    page: "llb.html"
    roadmap: "roadmaps/llb.html"
    gate: "Class 12 with 45% (40% for SC/ST/PwD) → CLAT → 5-year LL.B. at an NLU (or a 3-year LL.B. after any degree) → enrol with a State Bar Council → pass the AIBE."
    gate_source: clat-elig
    foundation:
      - stages: [c8, c9, c10]
        title: "Read every day — CLAT is a reading test"
        points:
          - text: "CLAT is about 20% English, 25% current affairs, 25% legal reasoning, 20% logical reasoning and 10% quantitative techniques — all from passages."
            source: clat-fmt
          - text: "Build the habit now: a newspaper editorial a day, and your board's English and Social Science textbooks (NCERT for CBSE) read properly, not memorised."
      - stages: [c11, c12]
        title: "Any stream works — protect your Class 12 percentage"
        points:
          - text: "CLAT UG needs Class 12 with at least <strong>45%</strong> (<strong>40%</strong> for SC, ST and PwD). Students writing Class 12 in March/April can apply; there is no upper age limit."
            source: clat-elig
          - text: "CLAT is written in December of your Class 12 year: CLAT 2027 is on <strong>6 December 2026</strong>, for seats starting in 2027-28."
            source: clat-pr
      - stages: [grad]
        title: "Already in college? Take the 3-year LL.B."
        points:
          - text: "After any bachelor's degree you can do a 3-year LL.B. instead of the 5-year integrated course; both lead to the same right to practise."
            source: bci
          - text: "Final-year LL.B. students can register for the All India Bar Examination (AIBE). AIBE XXI was held on 7 June 2026."
            source: aibe
    board_notes:
      gseb: "Your HSC marks are your Class 12 marks for the 45% rule — every stream (Science, Commerce, Arts) is accepted."
      cbse-gj: "Your CBSE Class XII marks are used for the 45% rule; every stream is accepted."
      upmsp: "Your Intermediate marks are your Class 12 marks for the 45% rule — every stream is accepted."
      msbshse: "Your HSC marks are your Class 12 marks for the 45% rule — every stream (Science, Commerce, Arts) is accepted."
      wb: "Your Higher Secondary (WBCHSE) marks are your Class 12 marks for the 45% rule — every stream is accepted."
      cbse: "Your CBSE Class XII marks are used for the 45% rule; every stream is accepted."
      other: "Your state board Class 12 marks are used for the 45% rule; every stream is accepted."
    board_source: clat-elig
    exam:
      name: "CLAT UG 2027"
      body: "Consortium of National Law Universities"
      href: "clat.html"
      facts:
        - { label: "Exam date", value: "Sun 6 Dec 2026, 2–4 PM", source: clat-pr }
        - { label: "Paper", value: "120 MCQs · 120 marks · 2 hours, offline", source: clat-fmt }
        - { label: "Fee", value: "₹4,000 · ₹3,500 SC/ST/BPL/PwD", source: clat-ins }
        - { label: "Seats (examples)", value: "NLSIU 310 · GNLU 176 · NALSAR 132", source: clat-ins }
      stages:
        head: ["Stage", "What it is", "Marking", "Rule"]
        rows:
          - ["CLAT UG", "One offline paper of 120 one-mark MCQs", "+1 right · −0.25 wrong", "Rank decides NLU seats; ties go to higher Legal Reasoning marks, then the older candidate"]
          - ["NLU counselling", "Seat allotment by rank, category and domicile", "—", "Each NLU applies its own seat matrix"]
          - ["5-year LL.B.", "BA / BBA / B.Com / B.Sc / BSW LL.B. (Hons.) at the NLU", "—", "University exams"]
          - ["AIBE", "All India Bar Examination after enrolment", "—", "Needed to practise as an advocate"]
        source: clat-fmt
      notes:
        - text: "CLAT 2027 applications close on 31 October 2026, 11:59 PM. Fees are paid online only and are non-refundable."
          source: clat-ins
        - text: "Pass or rank-cut-off percentages are not part of the official CLAT notice, so we do not print one."
    state_rules:
      - state: gujarat
        text: "<strong>GNLU Gandhinagar</strong> keeps 25% of its 176 all-India UG seats (40 seats) for <strong>Gujarat domicile</strong> candidates, across every category except EWS."
        source: gnlu
      - state: gujarat
        text: "After your LL.B., you enrol as an advocate with the <strong>Bar Council of Gujarat</strong> before you can practise in the state."
        source: bci
      - text: "Most NLUs keep a home-state quota with their own definition — for example 25% for Karnataka Students at NLSIU Bengaluru and 25% for Telangana residents at NALSAR."
        source: nlsiu
    multiverse:
      - { title: "Litigation", text: "Practise in courts; income grows slowly in the first years while you build clients.", href: "llb.html" }
      - { title: "Corporate law", text: "Law firms and in-house legal teams; NLU graduates are hired most here." }
      - { title: "Judicial services", text: "State judicial service exams for civil judge posts.", href: "judicial-services.html" }
      - { title: "Niche legal careers", text: "Patent agent, trademark agent, insolvency professional and data protection roles.", href: "patent-agent.html" }
    money: [nmmss, csss, pms-sc, clat-fee, mysy]

  # ------------------------------------------------------------------ CHARTERED ACCOUNTANT
  - id: ca
    name: "Chartered Accountant (CA)"
    page: "ca.html"
    roadmap: "roadmaps/ca.html"
    gate: "Register with ICAI → Foundation (after Class 12) → Intermediate → articleship → Final. Direct Entry skips Foundation for eligible graduates."
    gate_source: icai
    foundation:
      - stages: [c8, c9]
        title: "Get comfortable with numbers and English"
        points:
          - text: "The four Foundation papers are Accounting, Business Laws, Quantitative Aptitude and Business Economics — school maths and clear English are the base for all four."
            source: icai
      - stages: [c10]
        title: "You can register early"
        points:
          - text: "You can register for CA Foundation provisionally after Class 10, but you sit the exam only after Class 12."
            source: icai
      - stages: [c11, c12]
        title: "Any stream is allowed — Commerce makes Foundation easier"
        points:
          - text: "Foundation is open to Commerce, Science and Arts students, with <strong>no minimum Class 12 percentage</strong>."
            source: icai
          - text: "Commerce with Accountancy gives you a head start on Paper 1; Maths helps in Quantitative Aptitude."
      - stages: [grad]
        title: "Graduate? Use Direct Entry"
        points:
          - text: "Graduates can skip Foundation and register straight for Intermediate: Commerce graduates need 55%, others 60%."
            source: icai
    board_notes:
      gseb: "If you are in the HSC Commerce stream, your Accountancy and Economics books overlap with Foundation Papers 1 and 4."
      cbse-gj: "CBSE Accountancy and Economics in Class XI–XII overlap with Foundation Papers 1 and 4."
      upmsp: "Accountancy and Economics in Intermediate Commerce overlap with Foundation Papers 1 and 4."
      msbshse: "If you are in the HSC Commerce stream, your Accountancy and Economics books overlap with Foundation Papers 1 and 4."
      wb: "Accountancy and Economics in Higher Secondary Commerce overlap with Foundation Papers 1 and 4."
      cbse: "CBSE Accountancy and Economics in Class XI–XII overlap with Foundation Papers 1 and 4."
      other: "Accountancy and Economics in Class 11–12 overlap with Foundation Papers 1 and 4."
    exam:
      name: "CA Foundation → Intermediate → Final"
      body: "Institute of Chartered Accountants of India (ICAI)"
      href: "ca.html"
      facts:
        - { label: "Levels", value: "Foundation · Intermediate · Final", source: icai }
        - { label: "Foundation", value: "4 papers · 100 marks each", source: icai }
        - { label: "Training", value: "Articleship under a practising CA", source: icai }
        - { label: "Seats", value: "No cap — one national registration", source: icai }
      stages:
        head: ["Level", "Papers", "Marking", "Pass rule"]
        rows:
          - ["Foundation", "Accounting · Business Laws · Quantitative Aptitude · Business Economics", "Papers 3 and 4 are MCQ with −0.25 per wrong answer", "40% in each paper and 50% aggregate, in one sitting"]
          - ["Intermediate", "Two groups of 3 papers", "Written papers", "40% each paper + 50% aggregate per group"]
          - ["Articleship", "Practical training under a practising CA", "—", "About 2 years under the current scheme"]
          - ["Final", "Two groups of 3 papers", "Written papers", "40% each paper + 50% aggregate per group"]
        source: icai
      notes:
        - text: "Score 60% or more in a paper but miss the group pass, and ICAI usually exempts that paper next time."
          source: icai
        - text: "ICAI publishes a pass percentage after every attempt in its result press release on icai.org — read the latest one there; we do not copy old numbers."
          source: icai
    state_rules:
      - text: "There is <strong>no state quota</strong> in CA: one registration with ICAI, and the same exam for every state and board."
        source: icai
      - state: gujarat
        text: "Gujarat comes under ICAI's <strong>Western India Regional Council</strong>, which runs branches, classes and student activities in the region."
        source: icai
    multiverse:
      - { title: "Audit and practice", text: "Statutory audit is reserved for practising CAs — your own firm, or partner in one.", href: "ca.html" }
      - { title: "Corporate finance", text: "Accounts, tax and finance roles in companies, leading up to CFO." }
      - { title: "Specialist licences", text: "Insolvency professional and registered valuer are open to CAs after their own exams.", href: "insolvency-professional.html" }
      - { title: "Add a second badge", text: "CA + CFA for investment roles, or CA vs CMA vs CS if you are still choosing.", href: "ca-vs-cma-vs-cs.html" }
    money: [nmmss, icai-need-inter, icai-need-final, icai-merit-need, icai-merit, articleship, pms-sc, csss, mysy]

  # ------------------------------------------------------------------ FINANCIAL ANALYST
  - id: financial-analyst
    name: "Financial Analyst (Equity Research / CFA)"
    page: "research-analyst.html"
    roadmap: "roadmaps/research-analyst.html"
    gate: "Any bachelor's degree (Commerce, Economics, Maths or Engineering are common) → NISM Series XV for SEBI research roles → CFA Program levels for investment careers."
    gate_source: sebi
    foundation:
      - stages: [c8, c9, c10]
        title: "Maths, data and reading company news"
        points:
          - text: "Percentages, ratios, simple statistics and clear English are the daily tools of an analyst. Learn them well from your board's maths and English books."
      - stages: [c11, c12]
        title: "Choose a stream with Maths if you can"
        points:
          - text: "No exam in this path asks for a particular Class 12 stream. Commerce with Maths, or Science with Maths, makes a B.Com, BBA, Economics or Statistics degree easier."
      - stages: [grad]
        title: "Degree + NISM + CFA"
        points:
          - text: "To publish research as a SEBI-registered Research Analyst (or work for one), you need a graduate degree and the <strong>NISM Series XV</strong> Research Analyst certification."
            source: sebi
          - text: "You can usually start the CFA Program while your bachelor's degree is still in progress — confirm the current eligibility rule on cfainstitute.org."
    board_notes:
      gseb: "HSC Commerce with Statistics or Maths, or HSC Science, both lead to the usual degrees for this career."
      cbse-gj: "Applied or core Mathematics in Class XI–XII keeps every finance degree open."
      upmsp: "Taking Mathematics in Intermediate keeps every finance degree open."
      msbshse: "HSC Commerce with Mathematics, or HSC Science, both lead to the usual degrees for this career."
      wb: "Taking Mathematics in Higher Secondary keeps every finance degree open."
      cbse: "Applied or core Mathematics in Class XI–XII keeps every finance degree open."
      other: "Taking Maths in Class 11–12 keeps every finance degree open."
    exam:
      name: "NISM Series XV + CFA Program"
      body: "NISM (for SEBI) · CFA Institute"
      href: "cfa.html"
      facts:
        - { label: "SEBI research role", value: "Graduate + NISM Series XV", source: sebi }
        - { label: "CFA Level I", value: "180 MCQs · two 135-min sessions", source: cfa-l1 }
        - { label: "Negative marking", value: "None in CFA Level I", source: cfa-l1 }
        - { label: "Seats", value: "No cap — certification exams", source: cfa-l1 }
      stages:
        head: ["Step", "What it is", "Marking", "Rule"]
        rows:
          - ["Bachelor's degree", "Any recognised degree", "—", "Needed for SEBI registration"]
          - ["NISM Series XV", "Research Analyst certification by NISM", "—", "Required for SEBI research analysts"]
          - ["CFA Level I", "180 three-option MCQs in two 135-minute sessions", "No penalty for wrong answers", "Pass mark set by CFA Institute after each exam"]
          - ["CFA Level II and III", "Further levels of the CFA Program", "—", "Then work experience for the charter"]
        source: cfa-l1
      notes:
        - text: "CFA Institute bills fees in US dollars; check the current fee on cfainstitute.org before you register."
          source: cfa-l1
    state_rules:
      - text: "There is no state quota or domicile rule: NISM and CFA are national and global certifications, the same for every board."
        source: sebi
    multiverse:
      - { title: "Equity research", text: "Brokerages and fund houses; SEBI rules apply to anyone giving buy/sell research.", href: "research-analyst.html" }
      - { title: "Investment adviser", text: "Advising clients for a fee needs its own SEBI registration.", href: "investment-adviser.html" }
      - { title: "Risk", text: "FRM for risk-management roles in banks.", href: "frm.html" }
      - { title: "CFA charter", text: "Portfolio management and investment banking roles value it most.", href: "cfa.html" }
    money: [nmmss, csss, pms-sc, cfa-sch, mysy]

  # ------------------------------------------------------------------ SOFTWARE ENGINEER (batch 2)
  - id: software-engineer
    name: "Software Engineer (B.Tech CSE / BCA → MCA)"
    page: "software-engineer.html"
    roadmap: "roadmaps/software-engineer.html"
    gate: "Class 12 with Physics and Mathematics → JEE Main (or your state's own merit route) → 4-year B.E./B.Tech in Computer Science or IT → campus or off-campus hiring. Or a BCA / B.Sc followed by an MCA."
    gate_source: [jm-ib, tac-ib]
    foundation:
      - stages: [c8, c9]
        title: "Mathematics is the real filter"
        points:
          - text: "JEE Main Paper 1 is <strong>Mathematics, Physics and Chemistry — 100 marks each</strong>, 75 questions in 3 hours. Strong school algebra, geometry and arithmetic now make Class 11–12 far easier."
            source: jm-ib
          - text: "Try a beginner coding course or your school's computer lab projects — it tells you early whether you enjoy building software. No exam on this path tests coding before college."
      - stages: [c10]
        title: "Choose Science with Mathematics for Class 11"
        points:
          - text: "For B.E./B.Tech at NITs, IIITs and other NIT+ institutes, Class 12 must include <strong>Physics and Mathematics</strong>, a language, one of Chemistry / Biotechnology / Biology / a technical vocational subject, and one more subject."
            source: jm-ib
          - text: "Without Mathematics in Class 12, the B.Tech door closes; a BCA → MCA route may still be open — check each college's rule."
      - stages: [c11, c12]
        title: "JEE Main year — and protect your board percentage"
        points:
          - text: "For NIT+ seats through JoSAA you also need <strong>75% in Class 12</strong> (65% for SC, ST, PwD) — or a place in the top 20 percentile of your own board, category-wise."
            source: jm-ib
          - text: "You can sit JEE Main in your Class 12 year and the two years after it, with two sessions each year. The bulletin sets <strong>no age limit</strong>."
            source: jm-ib
          - text: "Your <strong>state code of eligibility</strong> is the state where you pass Class 12 — not your home town. It decides your Home State quota at NITs."
            source: [jm-ib, josaa-br]
      - stages: [grad]
        title: "Already in college? BCA / B.Sc → MCA"
        points:
          - text: "In Uttar Pradesh's 2026-27 counselling, MCA admits BCA, B.Sc (CS/IT) or B.Tech (CSE/IT) graduates — or any graduate who had Mathematics at 10+2 or in the degree — with 50% (45% for SC/ST). Other states set similar rules; read your state's brochure."
            source: tac-ib
          - text: "Whatever the degree, employers test data structures, algorithms and problem solving in their own hiring rounds. Build projects and practise those from year one."
    board_notes:
      gseb:
        text: "For Gujarat state-quota B.E. seats, ACPC merit is <strong>50% your HSC theory percentile</strong> in Mathematics, Physics and Chemistry + <strong>50% your GUJCET percentile</strong> — your board theory marks count directly. HSC needs 45% (40% reserved)."
        source: acpc-advt
      cbse-gj:
        text: "Schooling at a Gujarat-located school plus a GUJCET attempt opens ACPC's state-quota seats; your CBSE Class XII theory percentile goes into the same 50:50 merit formula."
        source: acpc-advt
      upmsp:
        text: "UPTAC fills B.Tech seats on your <strong>JEE Main</strong> rank. Passing Intermediate from an institution in UP makes you eligible for the regular rounds; you need 45% (40% SC/ST) in the required subjects taken together."
        source: tac-ib
      msbshse:
        text: "Passing SSC and HSC from Maharashtra (and being domiciled or born there) makes you a <strong>Type A</strong> Maharashtra candidate. MHT-CET is compulsory for Maharashtra-candidature B.E./B.Tech seats; its paper comes in English, Marathi or Urdu."
        source: mht-ib
      wb:
        text: "West Bengal domicile — 10 years' continuous residence as of 31.12.2025, or a parent who is a permanent resident — is needed for government-aided college seats and every reserved seat in WBJEEB counselling."
        source: wb-ib
      cbse: "JEE Main is the same paper for every board. Your board's own top-20-percentile list is the backup to the 75% rule for NIT+ seats."
      other: "JEE Main is offered in 13 languages, including Hindi, Bengali, Gujarati, Marathi, Tamil and Telugu. Your board's top-20-percentile list is the backup to the 75% rule."
    board_source: jm-ib
    exam:
      name: "JEE Main 2026 (Paper 1) → JoSAA / state counselling"
      body: "National Testing Agency (NTA) · JoSAA · state admission bodies"
      href: "jee-main.html"
      facts:
        - { label: "Paper 1", value: "75 questions · 300 marks · 3 hours", source: jm-ib }
        - { label: "Marking", value: "+4 correct · −1 wrong (MCQ and numerical)", source: jm-ib }
        - { label: "Fee per session", value: "₹1,000 General male · ₹800 female · ₹500 SC/ST/PwD", source: jm-ib }
        - { label: "Sessions (2026)", value: "21–30 Jan and 2–9 Apr 2026", source: jm-ib }
      stages:
        head: ["Stage", "What it is", "Marking", "Rule"]
        rows:
          - ["JEE Main Paper 1", "Maths, Physics, Chemistry: 20 MCQs + 5 numerical questions each", "+4 / −1 in both sections", "Ties go to Maths, then Physics, then Chemistry NTA score"]
          - ["JEE Advanced (for IITs)", "Separate exam by the IITs", "—", "Top 2,50,000 Paper 1 candidates become eligible"]
          - ["JoSAA / CSAB", "Seat allotment at NITs, IIITs, IIEST and other GFTIs", "—", "75% in Class 12 (65% SC/ST/PwD) or top 20 percentile of your board"]
          - ["State counselling", "ACPC (Gujarat), UPTAC (UP), CAP (Maharashtra), WBJEEB (West Bengal)", "—", "Each state's own merit and domicile rules — see block 03"]
        source: jm-ib
      notes:
        - text: "Central reservation on JEE Main seats: SC 15%, ST 7.5%, OBC-NCL 27%, Gen-EWS 10%, and 5% horizontal for PwD inside each."
          source: jm-ib
        - text: "JoSAA seat acceptance fee: ₹15,000 for SC, ST and PwD, ₹30,000 for everyone else — it includes ₹5,000 processing charges and the rest goes towards the institute fee."
          source: josaa-br
        - text: "These are the 2026 rules. NTA publishes the JEE Main 2027 bulletin on jeemain.nta.nic.in — check dates, fees and pattern there the day it is out."
    state_rules:
      - state: gujarat
        text: "ACPC fills <strong>95% of Govt / Grant-in-Aid and 50% of unaided seats</strong> with Gujarat-schooled GUJCET candidates; <strong>5% of Govt / GIA seats</strong> go on JEE Main rank to candidates from any board in India."
        source: acpc-advt
      - state: uttar-pradesh
        text: "Government and aided institutes fill 100% of first-year seats through UPTAC; private colleges fill 85% through UPTAC and 15% through management / NRI quota. Without a UP qualifying exam or a UP-domiciled parent, you are considered only in the special round."
        source: tac-ib
      - state: maharashtra
        text: "CAP reserves 60% of seats vertically for Maharashtra candidates — SC 13%, ST 7%, VJ/NT 11%, OBC 19%, SEBC 10% — plus 10% EWS over the intake and 30% for women. Candidature Types A–E decide who counts as a Maharashtra candidate."
        source: [cap-ib, mht-ib]
      - state: west-bengal
        text: "Reservation for SC, ST, OBC-A, OBC-B, PwD, TFW and EWS in WBJEEB counselling is only for candidates domiciled in West Bengal. Domicile also decides 90% of Jadavpur University's general seats."
        source: wb-ib
      - text: "NIT, IIEST Shibpur and PEC Chandigarh seats are split into a <strong>Home State</strong> and an <strong>Other States</strong> quota; Home State is where you passed Class 12. Extra supernumerary seats lift female enrolment at NITs to at least 20%."
        source: josaa-br
    multiverse:
      - { title: "B.Tech CSE / IT", text: "The most common route into product and service companies.", href: "cse.html" }
      - { title: "BCA → MCA", text: "A cheaper, shorter degree route; many software jobs accept it.", href: "bca.html" }
      - { title: "AI / ML engineering", text: "Building and integrating machine-learning systems.", href: "ai-engineer.html" }
      - { title: "Cloud and DevOps", text: "Running the systems that software lives on.", href: "cloud-engineer.html" }
      - { title: "Diploma first", text: "A 3-year computer engineering diploma after Class 10, then B.Tech through lateral entry.", href: "diploma-computer-engineering.html" }
    money: [nmmss, csss, pms-sc, tfw-up, wbscc, mysy]

  # ------------------------------------------------------------------ MERCHANT NAVY OFFICER (batch 2)
  - id: merchant-navy
    name: "Merchant Navy Deck Officer (B.Sc Nautical Science / DNS)"
    page: "merchant-navy-officer.html"
    roadmap: "roadmaps/merchant-navy-officer.html"
    gate: "Class 12 PCM with a 60% PCM average and 50% in English → IMU CET rank → 3-year B.Sc Nautical Science or 1-year DNS → sea time as Deck Cadet → DG Shipping Certificates of Competency."
    gate_source: imu-cc
    foundation:
      - stages: [c8, c9]
        title: "English and Mathematics both carry a hard minimum"
        points:
          - text: "IMU wants at least <strong>50% in English</strong> in Class 10 or Class 12 — on top of the PCM rule. Treat English as a main subject, not a pass subject."
            source: imu-cc
          - text: "Get your eyes tested now. If you already wear glasses, ask the doctor about the sea-going standard below before you plan on this career."
      - stages: [c10]
        title: "Eyesight and colour vision decide early"
        points:
          - text: "For B.Sc Nautical Science and DNS: distance vision <strong>6/6 unaided in the better eye and 6/9 in the other</strong>, good binocular vision, and normal colour vision on the Ishihara chart, under the Merchant Shipping (Medical Examination) Rules, 2000."
            source: imu-cc
          - text: "Choose Science with Physics, Chemistry and Mathematics for Class 11 — all three count in the 60% average."
            source: imu-cc
      - stages: [c11, c12]
        title: "60% PCM average, 50% English, and the age cap"
        points:
          - text: "Class 12 with a <strong>PCM average of at least 60%</strong> and 50% in English in Class 10 or 12. SC/ST candidates get 5% relaxation in the PCM marks, not in English."
            source: imu-cc
          - text: "Only <strong>unmarried</strong> candidates are admitted. Maximum age (male): General 25, OBC-NCL 28, SC/ST 30; (female): 27, 30, 32 — counted on the day the academic session starts."
            source: imu-cc
      - stages: [grad]
        title: "Already in college? Take the 1-year DNS"
        points:
          - text: "DNS also admits a B.Sc in Physics, Mathematics, Chemistry or Electronics (with Physics in one year) with 55% in the final year, or a B.E./B.Tech with 50% in the final year — plus 50% English and the same age caps."
            source: imu-cc
    board_notes:
      gseb: "IMU averages your HSC Physics, Chemistry and Mathematics marks — take the Science stream with Mathematics, not Biology alone."
      cbse-gj: "IMU averages your CBSE Class XII Physics, Chemistry and Mathematics marks; English can come from Class X or XII."
      upmsp: "IMU averages your Intermediate Physics, Chemistry and Mathematics marks; your English can come from High School or Intermediate."
      msbshse: "IMU averages your HSC Physics, Chemistry and Mathematics marks; your English can come from SSC or HSC."
      wb: "IMU averages your Higher Secondary Physics, Chemistry and Mathematics marks; your English can come from Madhyamik or Higher Secondary."
      cbse: "IMU averages your Class XII Physics, Chemistry and Mathematics marks; English can come from Class X or XII."
      other: "IMU averages your Class 12 Physics, Chemistry and Mathematics marks; English can come from Class 10 or 12."
    board_source: imu-cc
    exam:
      name: "IMU CET 2026 → pre-sea course"
      body: "Indian Maritime University (a central university)"
      href: "merchant-navy-officer.html"
      facts:
        - { label: "Exam date (2026)", value: "24 May 2026, online, two shifts", source: imu-norm }
        - { label: "UG cut-off percentile", value: "General 60 · EWS / OBC-NCL 54 · SC / ST 45", source: imu-cut }
        - { label: "Result (2026)", value: "14 June 2026, rank list on imu.edu.in", source: imu-res }
        - { label: "Max age (male, General)", value: "25 years", source: imu-cc }
      stages:
        head: ["Stage", "What it is", "Marking", "Rule"]
        rows:
          - ["IMU CET", "Online common entrance test for UG programmes (DNS, B.Sc, B.Tech)", "Raw scores turned into shift-wise percentiles (7 decimals)", "Category cut-off percentile; then rank"]
          - ["Allotment", "Seats at IMU campuses and affiliated institutes, by CET rank", "—", "Category-wise rank list and allotment lists"]
          - ["Medical", "Fitness certificate from a DG Shipping-approved doctor at admission", "—", "Eyesight 6/6 + 6/9 unaided, normal colour vision, hearing"]
          - ["Pre-sea course", "B.Sc Nautical Science (3 years) or DNS (1 year), residential", "University exams", "Unmarried candidates only"]
        source: [imu-norm, imu-cut, imu-cc]
      notes:
        - text: "After the pre-sea course you sail as a <strong>Deck Cadet</strong>, then take DG Shipping exams for the Second Mate, Chief Mate and Master Certificates of Competency, each after its own sea time."
          source: dgs
        - text: "Train only at institutes DG Shipping lists as approved — sea time from unapproved courses does not count for certificates."
          source: dgs
        - text: "IMU's 2026 files we read print no application fee table and no seat total, so we print neither. Check the IMU CET 2027 notice on imu.edu.in."
    state_rules:
      - text: "IMU is a central university with <strong>All-India jurisdiction</strong>: the CET, the cut-offs and the age rules are the same in every state."
        source: imu-cc
      - text: "The only regional relaxation printed: 5% in English marks for Scheduled Tribe natives of Lakshadweep and the Andaman &amp; Nicobar Islands whose parents were both born there."
        source: imu-cc
      - state: west-bengal
        text: "West Bengal students can fund a professional degree through the <strong>Student Credit Card</strong> loan (see Money help)."
        source: wbscc
    multiverse:
      - { title: "Deck to Master", text: "Deck Cadet → Third Officer → Second Officer → Chief Officer → Master (Captain), by sea time and DG Shipping certificates.", href: "merchant-navy-officer.html" }
      - { title: "Engine side", text: "Prefer machines? Marine engineers run the engine room.", href: "marine-engineer.html" }
      - { title: "Ashore later", text: "Port operations, marine surveying and ship management value sea experience." }
      - { title: "Step-by-step", text: "The full path from Class 12 to Master.", href: "roadmaps/merchant-navy-officer.html" }
    money: [nmmss, csss, wbscc]

  # ------------------------------------------------------------------ COMMERCIAL PILOT (batch 2)
  - id: commercial-pilot
    name: "Commercial Pilot (DGCA CPL)"
    page: "commercial-pilot.html"
    roadmap: "roadmaps/commercial-pilot.html"
    gate: "Class 12 with Physics and Mathematics → medical from an approved Medical Board → 200 hours of flying at a DGCA-approved flying school + DGCA written exams + radio telephony licence → Commercial Pilot's Licence at 18 or older."
    gate_source: air-rules
    foundation:
      - stages: [c8, c9]
        title: "Physics, Mathematics — and spoken English"
        points:
          - text: "A CPL holder must <strong>speak and understand radiotelephony English</strong> to the level DGCA sets, and the level is written on the licence. Whatever your school medium, build spoken English now."
            source: air-rules
          - text: "Physics and Mathematics are the only school subjects the rule names. Navigation and meteorology papers later build on both."
            source: air-rules
      - stages: [c10]
        title: "Take Physics and Mathematics in Class 11"
        points:
          - text: "The CPL rule needs <strong>Class 10+2 passed with Physics and Mathematics</strong>. It sets <strong>no minimum percentage</strong> — a pass is enough."
            source: air-rules
          - text: "Without Physics and Mathematics in Class 12 you can clear them later through an equivalent board exam (for example the open school); plan this before you pay a flying school."
      - stages: [c11, c12]
        title: "Get the medical before you pay any fee"
        points:
          - text: "You must hold a certificate of fitness from an <strong>approved Medical Board</strong> under DGCA's medical standards before the licence is issued."
            source: air-rules
          - text: "Do the DGCA medical before signing up with a flying school — eyesight or other conditions can stop you, and school fees are rarely refunded."
          - text: "You must be <strong>at least 18</strong> on the day you apply for the CPL."
            source: air-rules
      - stages: [grad]
        title: "Graduating first? Your degree is optional"
        points:
          - text: "No degree is needed for a CPL; the rule asks only for Class 12 with Physics and Mathematics. Some airlines set their own extra criteria in cadet and hiring notices."
            source: air-rules
    board_notes:
      gseb: "Your HSC must include <strong>Physics and Mathematics</strong> — HSC Science with Mathematics meets the rule."
      cbse-gj: "Your CBSE Class XII must include Physics and Mathematics."
      upmsp: "Your Intermediate must include Physics and Mathematics."
      msbshse: "Your HSC must include Physics and Mathematics — HSC Science with Mathematics meets the rule."
      wb: "Your Higher Secondary must include Physics and Mathematics."
      cbse: "Your CBSE Class XII must include Physics and Mathematics."
      other: "Your Class 12 must include Physics and Mathematics; any recognised board counts."
    board_source: air-rules
    exam:
      name: "DGCA Commercial Pilot's Licence (Aeroplanes)"
      body: "Directorate General of Civil Aviation (DGCA)"
      href: "commercial-pilot.html"
      facts:
        - { label: "Minimum age", value: "18 on the date of application", source: air-rules }
        - { label: "School base", value: "Class 10+2 with Physics and Mathematics", source: air-rules }
        - { label: "Flight time", value: "200 hours within the 5 years before applying", source: air-rules }
        - { label: "Written exams", value: "Air Regulations · Air Navigation · Meteorology · Aircraft and Engines", source: air-rules }
      stages:
        head: ["Stage", "What it is", "How it is judged", "Rule"]
        rows:
          - ["Medical", "Certificate from an approved Medical Board", "DGCA medical standards", "Needed before the licence is issued"]
          - ["Ground exams", "Air Regulations, Air Navigation, Meteorology, Aircraft and Engines + a practical Signals exam", "DGCA syllabus", "All passed within the 5 years before the CPL application"]
          - ["Flying hours", "200 hours: 100 as pilot-in-command (15 in the last 6 months), 20 cross-country as PIC incl. one 300 NM flight with landings at two aerodromes, 10 instrument (up to 5 on a simulator), 5 by night with 10 take-offs and landings", "Logged and certified at a DGCA-approved flying school", "Within the 5 years before applying"]
          - ["Skill test + RTR", "General flying tests by day and night, a 250 NM day and a 120 NM night cross-country test, and a current Flight Radio Telephone Operator's Licence", "Examiner on the aeroplane type", "Skill test within 6 months before applying"]
        source: air-rules
      notes:
        - text: "Holders of a helicopter CPL with 1,000 hours as pilot-in-command need only 100 aeroplane hours."
          source: air-rules
        - text: "Pilot licence rules are being rewritten under the Bharatiya Vayuyan Adhiniyam, 2024. Check dgca.gov.in for the current version before you join a flying school."
        - text: "Flying schools quote very different totals for the CPL, and type rating is usually extra. Get the full written fee schedule before you pay anything."
    state_rules:
      - text: "There is <strong>no state quota</strong>: one DGCA licence, the same rules in every state and for every board."
      - text: "The language filter is national, not regional: radiotelephony English is a licence requirement whatever your school's medium."
        source: air-rules
    multiverse:
      - { title: "Airline first officer", text: "Airlines hire CPL holders through their own tests, then fund or ask for a type rating.", href: "commercial-pilot.html" }
      - { title: "Aircraft maintenance", text: "A licensed AME keeps aircraft flying — a ground route into aviation.", href: "aircraft-maintenance-engineer.html" }
      - { title: "Air traffic control", text: "AAI recruits Junior Executives (ATC) by exam.", href: "air-traffic-controller.html" }
      - { title: "Step-by-step", text: "The full path from Class 12 to the right-hand seat.", href: "roadmaps/commercial-pilot.html" }
    money: [nmmss]

  # ------------------------------------------------------------------ BANK PO (batch 2)
  - id: bank-po
    name: "Bank Probationary Officer (IBPS PO)"
    page: "ibps-po.html"
    gate: "Any graduate aged 20–30 → IBPS PO Preliminary → Main → Personality Test → Interview → provisional allotment to one of 11 public sector banks."
    gate_source: ibps16
    foundation:
      - stages: [c8, c9, c10]
        title: "Arithmetic speed, reasoning and English reading"
        points:
          - text: "The Preliminary exam is English Language, Quantitative Aptitude and Reasoning Ability — each with its own <strong>20-minute</strong> clock. Fast, accurate school arithmetic is the base."
            source: ibps16
          - text: "Read an English newspaper daily; the English test is only in English, whatever your school medium."
            source: ibps16
      - stages: [c11, c12]
        title: "Any stream works — a degree is the gate"
        points:
          - text: "IBPS asks for a <strong>degree in any discipline</strong>. It sets no Class 10 or 12 percentage and no stream."
            source: ibps16
          - text: "Commerce, Economics or Mathematics help with the Banking Awareness and Data Analysis tests later, but are not required."
      - stages: [grad]
        title: "Age, degree result and the yearly cycle"
        points:
          - text: "Age <strong>20–30</strong> on 1 July 2026, and your degree result must be declared by the cut-off date in the notice (21 July 2026 in this cycle)."
            source: ibps16
          - text: "You must write your graduation percentage (to two decimals) in the form; CGPA must be converted using your university's rule."
            source: ibps16
    board_notes:
      gseb: "The tests are in <strong>English and Hindi only</strong> — there is no Gujarati paper. The English test is in English alone."
      cbse-gj: "The tests are in English and Hindi only; the English test is in English alone."
      upmsp: "You can take Quantitative Aptitude, Reasoning and Data Analysis in <strong>Hindi</strong>; the English test is in English alone."
      msbshse: "The tests are in <strong>English and Hindi only</strong> — there is no Marathi paper. The English test is in English alone."
      wb: "The tests are in <strong>English and Hindi only</strong> — there is no Bengali paper. The English test is in English alone."
      cbse: "The tests are in English and Hindi only; the English test is in English alone."
      other: "The tests are in English and Hindi only; the English test is in English alone."
    board_source: ibps16
    exam:
      name: "IBPS CRP PO/MT-XVI (vacancies of 2027-28)"
      body: "Institute of Banking Personnel Selection (IBPS)"
      href: "ibps-po.html"
      facts:
        - { label: "Vacancies (indicative)", value: "6,715 in 11 public sector banks", source: ibps16 }
        - { label: "Age", value: "20–30 years (as on 1 Jul 2026)", source: ibps16 }
        - { label: "Fee", value: "₹850 · ₹175 SC/ST/PwBD (incl. GST)", source: ibps16 }
        - { label: "Negative marking", value: "−0.25 of the question's marks, Prelims and Main", source: ibps16 }
      stages:
        head: ["Stage", "Paper", "Marking", "Pass rule"]
        rows:
          - ["Preliminary", "100 questions · 100 marks · 60 min: English 30, Quant 35, Reasoning 35 (20 min each)", "−0.25 per wrong answer", "Minimum in each test, set by IBPS; screening only"]
          - ["Main — objective", "170 questions · 200 marks · 160 min: Reasoning, General / Economy / Banking Awareness, English, Data Analysis", "−0.25 per wrong answer", "Minimum in each test and in total"]
          - ["Main — descriptive", "Essay and comprehension · 2 questions · 25 marks · 30 min, in English", "May be scored by an automated system", "Part of the Main score"]
          - ["Personality Test", "Self-report test placed before the interview panel", "Not qualifying", "Must be taken to reach the interview"]
          - ["Interview", "100 marks, by the participating banks", "—", "40% minimum (35% SC/ST/OBC/PwBD); final merit = Main 80 : Interview 20"]
        source: ibps16
      notes:
        - text: "Only Main exam marks (not Prelims) count for shortlisting and the final merit list. Scores across sessions are normalised by the equi-percentile method."
          source: ibps16
        - text: "This is an <strong>All India cadre</strong>: allotted officers may be posted anywhere in India or abroad, at the bank's discretion."
          source: ibps16
        - text: "State Bank of India runs its own PO exam separately; read its notice on the SBI careers site."
    state_rules:
      - text: "The PO notice sets <strong>no state-language test</strong> and no domicile rule — you compete on one national merit list and can be posted anywhere."
        source: ibps16
      - text: "Interviews are run by the participating banks and coordinated by a <strong>Nodal Bank in each State / UT</strong>; the venue comes in your call letter and cannot be changed."
        source: ibps16
      - state: maharashtra
        text: "Bank of Maharashtra is one of the 11 participating banks in CRP PO/MT-XVI."
        source: ibps16
    multiverse:
      - { title: "SBI PO", text: "India's largest bank recruits officers through its own exam.", href: "sbi-po.html" }
      - { title: "Clerk first", text: "IBPS and SBI clerk posts, with internal promotion to officer.", href: "ibps-clerk.html" }
      - { title: "RBI Grade B", text: "Regulator-side officer roles at the Reserve Bank.", href: "rbi-grade-b.html" }
      - { title: "Coaching", text: "Banking coaching centres near you.", href: "coaching-banking.html" }
    money: [nmmss, csss, pms-sc, ibps-pet, ibps-fee, mysy]

  # ------------------------------------------------------------------ CIVIL SERVICES (batch 2)
  - id: civil-services
    name: "Civil Servant (UPSC Civil Services — IAS, IPS, IFS)"
    page: "upsc-civil-services.html"
    roadmap: "roadmaps/upsc-civil-services.html"
    gate: "Any graduate aged 21–32 (more for SC, ST, OBC and others) → Preliminary (screening) → Main (9 written papers) → Personality Test → service by rank and preference."
    gate_source: cse26
    foundation:
      - stages: [c8, c9]
        title: "Read widely and write every week"
        points:
          - text: "Prelims General Studies and the Main Essay and GS papers cover heritage, history, geography, polity, economy, environment, technology and ethics — your school Social Science and Science books are the first layer."
            source: cse26
          - text: "Read a newspaper daily and write short answers on what you read. Writing speed matters: every Main paper is a 3-hour essay-type paper."
            source: cse26
      - stages: [c10]
        title: "Any stream is fine — choose what you can score in"
        points:
          - text: "The exam asks only for a <strong>graduate degree in any subject</strong> from a recognised university. No Class 10 or 12 stream or percentage is checked."
            source: cse26
          - text: "Pick a Class 11 stream you enjoy; a degree subject you like often becomes your Optional paper later."
      - stages: [c11, c12]
        title: "Plan your language — you may write Main in it"
        points:
          - text: "You may answer every Main paper except the two qualifying language papers in <strong>any language of the Eighth Schedule</strong> (including Hindi, Gujarati, Marathi and Bengali) or in English. Prelims papers are set in Hindi and English."
            source: cse26
          - text: "Main Paper A (an Indian language) and Paper B (English) are of Matriculation standard and only need <strong>25% each</strong>; they do not count for rank."
            source: cse26
      - stages: [grad]
        title: "Final-year students can apply"
        points:
          - text: "You can sit Prelims while your final degree exam is pending; proof of passing is needed only if you reach the interview."
            source: cse26
          - text: "Age <strong>21–32</strong> on 1 August of the exam year (CSE 2026); upper limit +5 years for SC/ST and +3 for OBC. Attempts: 6 (General / EWS), 9 (OBC and PwBD), unlimited for SC/ST."
            source: cse26
    board_notes:
      gseb: "<strong>Gujarati</strong> is an Eighth Schedule language: you may choose it for Main Paper A and write the GS, Essay and Optional papers in it."
