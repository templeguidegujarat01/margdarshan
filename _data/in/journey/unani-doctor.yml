# Journey Blueprint — Unani Physician (NEET-UG → BUMS → NCISM registration). Printed on journey-unani-doctor.html.
# Rules, classes and the money items / sources several careers share: _data/in/journey_common.yml.
id: unani-doctor
v: 2
name: "Unani Physician (NEET-UG → BUMS)"
search: ["unani physician", "unani doctor", "bums", "hakeem", "hakim", "unani medicine", "kamil-e-tib"]
page: "neet-ug.html"
doubts_page: "journey-unani-doctor.html"
gate: "Class 12 with Physics, Chemistry and Biology (or Biotechnology) → NEET (UG) → BUMS (Kamile Tib o Jarahat), 5½ years with a 12-month internship → registration in the Central or a State Register of Indian Medicine. MD / MS (Unani) is through AIAPGET."
gate_source: [ncism-umse, neet-ib, aiap26]
core:
  what:
    text: "A Unani physician practises the Unani system of medicine after the degree Kamile Tib o Jarahat (Bachelor of Unani Medicine and Surgery, BUMS). The course is regulated by the National Commission for Indian System of Medicine (NCISM)."
    source: ncism-umse
  day:
    - "Examine patients and treat them with Unani medicines and regimens."
    - "Work in Unani hospitals, CGHS wellness centres, dispensaries or your own clinic."
    - "Do research in Unani research institutes."
  pay:
    - { level: "Medical Officer / Research Officer (Unani), Ministry of Ayush — UPSC 2026", value: "Level 10 of the Pay Matrix plus NPA", source: upsc-adv09 }
  pay_note: "Private and state pay is not officially published."
  routes:
    - { title: "NEET (UG) → BUMS", text: "All BAMS, BSMS, BUMS and BHMS seats are filled through NEET (UG), with 10+2 in Physics, Chemistry and Biology or Biotechnology.", source: neet-ib }
    - { title: "Pre-Tib route", text: "Up to 10% of BUMS seats may be filled through a one-year Pre-Tib programme for students with oriental qualifications in Arabic / Persian equivalent to 10+2; NEET does not apply to Pre-Tib candidates.", source: ncism-umse }
    - { title: "MD / MS (Unani)", text: "AIAPGET, run by NTA, is the entrance for MD / MS in Ayurveda, Siddha, Unani and Homoeopathy; the Unani paper is in Urdu and English.", source: aiap26 }
    - { title: "Central government", text: "UPSC Advt 09/2026 had 4 Medical Officer / Research Officer (Unani) posts in the Ministry of Ayush, needing a Unani degree and enrolment on the Central or a State Register of Indian Medicine.", source: upsc-adv09 }
  cost_time:
    - { label: "BUMS length", value: "5½ years: three 18-month professional years + 12-month internship", source: ncism-umse }
    - { label: "AIAPGET 2026 fee", value: "₹2,700 General · ₹2,450 EWS / OBC-NCL · ₹1,800 SC / ST / PwBD / third gender", source: aiap26 }
  cost_note: "BUMS college fees differ by college and state, so none are printed."
  challenges:
    - text: "Urdu matters: students who did not pass Urdu, Arabic or Persian in Class 10 or 12 must study Urdu along with Arabic and Mantiq wa Falsafa in the First Professional year."
      source: ncism-umse
    - text: "Admission is only through NEET (UG) and counselling — there is no separate BUMS entrance."
      source: neet-ib
    - text: "Rules have changed recently: NCISM's 14 July 2025 letter dropped the 50% PCB condition, so check the current year's NEET (UG) bulletin."
      source: [jh-bums, neet-ib]
  not_for:
    - "You want to prescribe modern (allopathic) medicine — that is MBBS."
    - "You do not want to learn Urdu and classical Unani texts."
    - "You want a short course — BUMS takes 5½ years."
journey:
  - stages: [c8, c9]
    title: "Biology and languages"
    do:
      - text: "Passing Urdu, Arabic or Persian in Class 10 or 12 saves you an extra Urdu subject in BUMS."
        source: ncism-umse
    doubts:
      - q: "What degree does a Unani doctor get?"
        a: "Kamile Tib o Jarahat — Bachelor of Unani Medicine and Surgery (BUMS), awarded after the course and a 12-month compulsory rotatory internship."
        next: "Plan for NEET (UG) after Class 12."
        source: ncism-umse
      - q: "Do I need to know Urdu for BUMS?"
        a: "It helps. If you did not pass Urdu, Arabic or Persian in Class 10 or 12, you must study Urdu along with Arabic and Mantiq wa Falsafa (logic and philosophy) in the First Professional BUMS year."
        next: "Take Urdu as a subject in school if you can."
        source: ncism-umse
  - stages: [c10]
    title: "Choose PCB in Class 11"
    do:
      - text: "BUMS needs 10+2 with Physics, Chemistry and Biology or Biotechnology."
        source: neet-ib
    stream: "Science with Physics, Chemistry and Biology (or Biotechnology)."
    doubts:
      - q: "Can I take Biotechnology instead of Biology for BUMS?"
        a: "Yes. The NEET (UG) 2026 bulletin's AYUSH chapter accepts 10+2 with Physics, Chemistry and Biology or Biotechnology, and NCISM's July 2025 amendment says the same."
        next: "Make sure your school offers PCB or PC-Biotech."
        source: [neet-ib, jh-bums]
  - stages: [c11, c12]
    title: "Prepare for NEET (UG)"
    do:
      - text: "NEET (UG) 2026: 180 questions, 720 marks, +4 for correct, −1 for wrong, 3 hours."
        source: neet-ib
    money: [neet-fee]
    doubts:
      - q: "Is NEET compulsory for BUMS?"
        a: "Yes. All BAMS, BSMS, BUMS and BHMS seats are filled through NEET (UG). Only the Pre-Tib route for oriental-qualification students is outside NEET."
        next: "Register for NEET (UG) in your Class 12 year."
        source: [neet-ib, ncism-umse]
      - q: "Do I need 50% in PCB for BUMS?"
        a: "Not any more. NCISM's 2022 regulations asked for 50% (40% reserved), but NCISM's letter of 14 July 2025 changed the rule to a pass in 10+2 with Physics, Chemistry and Biology or Biotechnology, and the NEET (UG) 2026 bulletin prints no percentage."
        next: "Still check the bulletin of your admission year."
        source: [ncism-umse, jh-bums, neet-ib]
      - q: "Is there an upper age limit for BUMS?"
        a: "NCISM's 2022 regulations printed an upper limit of 25 (30 for SC / ST / OBC / disabled), but the NEET (UG) 2026 bulletin's AYUSH chapter asks only that you are 17 by 31 December of the admission year."
        next: "Follow the bulletin of your admission year and confirm with the counselling body."
        source: [ncism-umse, neet-ib]
      - q: "What NEET percentile do I need for BUMS?"
        a: "NCISM's regulations ask for the 50th percentile (40th for SC, ST and OBC; 45th for General PwBD)."
        next: "Qualifying is the minimum — counselling goes by rank."
        source: ncism-umse
  - stages: [ug]
    title: "BUMS: 5½ years"
    do:
      - text: "Three professional years of 18 months each, then a 12-month compulsory rotatory internship."
        source: ncism-umse
    doubts:
      - q: "How long is BUMS?"
        a: "Five years and six months: First, Second and Third Professional BUMS of 18 months each and a 12-month compulsory rotatory internship."
        next: "Plan for 5½ years before you can practise."
        source: ncism-umse
      - q: "Do BUMS interns get a stipend?"
        a: "In central, state and union territory institutions, NCISM says interns get a stipend at par with other medical systems under that government."
        next: "Ask your college about the current rate."
        source: ncism-umse
      - q: "In which language is BUMS taught?"
        a: "Urdu, Hindi, any recognised regional language or English."
        next: "Ask each college which medium it uses."
        source: ncism-umse
      - q: "What do I need before starting the BUMS internship?"
        a: "You must pass all subjects of the First to Third (Final) Professional exams, including nine electives, and get a provisional degree certificate from your university and a provisional registration certificate from your State Board or Council."
        next: "Apply for provisional registration as soon as results are out."
        source: ncism-umse
  - stages: [grad]
    title: "Register, practise or study further"
    do:
      - text: "AIAPGET 2026 was held on 22 August 2026 for MD / MS in Ayurveda, Siddha, Unani and Homoeopathy."
        source: aiap26
    exams:
      - { name: "AIAPGET 2026", when: "22 Aug 2026", source: aiap26 }
    doubts:
      - q: "How do I do MD in Unani?"
        a: "Through AIAPGET, the NTA entrance for MD / MS seats in Ayurveda, Siddha, Unani and Homoeopathy. The Unani paper is set in Urdu and English."
        next: "Finish the internship and register before applying."
        source: aiap26
      - q: "Can a BUMS graduate get a central government job?"
        a: "Yes. UPSC Advt 09/2026 had 4 Medical Officer / Research Officer (Unani) posts in the Ministry of Ayush at Level 10 plus NPA, for candidates with a Unani degree enrolled on the Central or a State Register of Indian Medicine."
        next: "Get registered, then watch UPSC advertisements."
        source: upsc-adv09
      - q: "What is the age limit for UPSC Unani Medical Officer posts?"
        a: "In Advt 09/2026 it was 35 for UR and EWS, 38 for OBC and 40 for SC, with up to 10 more years for PwBD."
        next: "Apply early in your career."
        source: upsc-adv09
  - stages: [work]
    title: "Medical Officer work"
    do:
      - text: "UPSC's Unani Medical Officers work in CGHS dispensaries / wellness centres or as Research Officers."
        source: upsc-adv09
    doubts:
      - q: "What does a Unani Medical Officer do in CGHS?"
        a: "UPSC's 2026 advertisement lists the duties as working as Medical Officer at CGHS dispensaries / wellness centres and as Research Officer."
        next: "Read the full duties in each UPSC advertisement."
        source: upsc-adv09
board_note: "Any board. BUMS needs Physics, Chemistry and Biology (or Biotechnology) in Class 12; Urdu, Arabic or Persian in Class 10 or 12 helps."
board_source: [neet-ib, ncism-umse]
