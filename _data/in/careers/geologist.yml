    - "M.Sc Geology or listed earth sciences"
  read_time: "8 min read"
  intro:
    - "Geologists study rocks, minerals, groundwater and earth processes — finding minerals and oil, assessing landslide and earthquake risk, and managing water. The main government route is the UPSC Combined Geo-Scientist Examination, which recruits geologists, geophysicists, chemists and hydrogeologists for bodies such as the Geological Survey of India (GSI) and the Central Ground Water Board (CGWB)."
