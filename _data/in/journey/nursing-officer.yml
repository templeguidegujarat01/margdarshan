# Journey Blueprint — Nursing Officer (B.Sc Nursing or GNM → registration → AIIMS NORCET). Printed on journey-nursing-officer.html (_includes/journey-doubts.html).
# Rules, classes and the money items / sources several careers share: _data/in/journey_common.yml.
# `money_defs` / `sources` below are used only by this career; INC sources come from nurse.yml.
# Check: node scripts/check-journey-matrix.mjs
id: nursing-officer
v: 2
name: "Nursing Officer (AIIMS NORCET)"
search: ["nursing officer", "aiims nursing officer", "norcet", "staff nurse government", "central government nurse"]
page: "aiims-norcet.html"
roadmap: "roadmaps/nursing.html"
doubts_page: "journey-nursing-officer.html"
gate: "Class 12 (Science with PCB and English for B.Sc Nursing; any stream with English for GNM) → B.Sc Nursing (4 years) or GNM + 2 years' hospital experience → registration as Nurse & Midwife → AIIMS NORCET (Prelims + Mains) → Nursing Officer, Group B, Pay Level 7 at AIIMS and other central hospitals."
gate_source: [inc-bsc, inc-elig, norcet11]
core:
  what:
    text: "A Nursing Officer is a registered nurse in a central government hospital. AIIMS New Delhi runs NORCET, the common test that fills Nursing Officer (Group B) posts at AIIMS New Delhi, the other AIIMS and several central hospitals."
    source: norcet11
  day:
    - "Give and record patient care on wards, ICUs and operation theatres."
    - "Give medicines, monitor patients and respond to emergencies."
    - "Teach patients and supervise nursing students."
  pay:
    - { level: "Nursing Officer, AIIMS (NORCET-11, 2026)", value: "Pay Level 7 · Group B, with the allowances of central government staff", source: norcet11 }
  pay_note: "The NORCET advertisement prints the pay level, not a rupee figure, so no amount is printed."
  routes:
    - { title: "B.Sc Nursing → registration → NORCET", text: "B.Sc (Hons) / B.Sc Nursing or Post-Basic B.Sc Nursing from an INC / State Council recognised institute, plus registration as Nurse & Midwife.", source: norcet11 }
    - { title: "GNM + 2 years → NORCET", text: "A GNM diploma, registration as Nurse & Midwife and two years' experience in a hospital of at least 50 beds after qualifying.", source: norcet11 }
    - { title: "Other central hospitals", text: "NORCET-11 also had separate advertisements for JIPMER, ESIC, CIP Ranchi, central government hospitals in Delhi and NITRD.", source: norcet11 }
  cost_time:
    - { label: "B.Sc Nursing", value: "8 semesters; the last is a 22-week internship", source: inc-bsc }
    - { label: "NORCET fee", value: "₹3,000 General / OBC · ₹2,400 SC / ST / EWS · PwBD exempt", source: norcet11 }
  cost_note: "Nursing college fees differ by state and college, so they are not printed here."
  challenges:
    - text: "NORCET has negative marking in both stages: one-third of a mark is cut for every wrong answer."
      source: norcet11
    - text: "There is generally one allocation round and no waiting list — a candidate who does not join loses the seat."
      source: norcet11
    - text: "At the participating AIIMS, 80% of seats are reserved for women and 20% for men."
      source: norcet11
  not_for:
    - "You cannot do night shifts or long hours on your feet."
    - "You are uneasy with blood, injections or very sick patients."
    - "You dislike strict hospital rules and record-keeping."
journey:
  - stages: [c8, c9]
    title: "Science and English"
    do:
      - text: "B.Sc Nursing needs Class 12 Science with Physics, Chemistry and Biology and a pass in English."
        source: inc-bsc
    doubts:
      - q: "What does a Nursing Officer do?"
        a: "A Nursing Officer is a registered nurse in a central government hospital. AIIMS New Delhi's NORCET fills Nursing Officer (Group B) posts at AIIMS New Delhi, the other AIIMS and several central hospitals."
        next: "Read the Routes list above."
        source: norcet11
      - q: "Can boys become Nursing Officers?"
        a: "Yes. At the participating AIIMS, 80% of seats are reserved for women and 20% for men, so men compete for fewer seats."
        next: "Prepare harder if you are a male candidate."
        source: norcet11
  - stages: [c10]
    title: "PCB for B.Sc Nursing, any stream for GNM"
    do:
      - text: "GNM needs Class 12 with English and 40% in the qualifying exam and in English; Science is preferred, not compulsory."
        source: inc-elig
    stream: "Science with Biology (PCB) and English; GNM accepts other streams with English."
    doubts:
      - q: "Which stream do I need to become a Nursing Officer?"
        a: "For B.Sc Nursing, Science with Physics, Chemistry, Biology and English. GNM accepts Class 12 with English and 40% from any stream, but GNM holders need 2 years' hospital experience before NORCET."
        next: "Choose PCB if you can — it saves two years later."
        source: [inc-bsc, inc-elig, norcet11]
  - stages: [c11, c12]
    title: "Get into B.Sc Nursing"
    do:
      - text: "B.Sc Nursing needs 45% in Physics, Chemistry and Biology together (40% for SC, ST and OBC) and a pass in English; minimum age 17 by 31 December of the admission year."
        source: inc-bsc
    doubts:
      - q: "What marks do I need in Class 12 for B.Sc Nursing?"
        a: "45% in Physics, Chemistry and Biology taken together (40% for SC, ST and OBC) and a pass in English."
        next: "Keep PCB marks above 45%."
        source: inc-bsc
      - q: "What is the minimum age for B.Sc Nursing?"
        a: "17 years on or before 31 December of the year of admission."
        next: "Check your date of birth."
        source: inc-bsc
  - stages: [ug]
    title: "Nursing degree and registration"
    do:
      - text: "B.Sc Nursing runs 8 semesters; the last semester is a 22-week internship."
        source: inc-bsc
      - text: "NORCET needs registration as Nurse & Midwife with a State or the Indian Nursing Council before the closing date."
        source: norcet11
    doubts:
      - q: "Do I need nursing registration before NORCET?"
        a: "Yes. Registration as Nurse & Midwife with a State / Indian Nursing Council — along with the qualification and any experience — must be complete by the closing date of registration."
        next: "Register with your State Nursing Council as soon as you qualify."
        source: norcet11
      - q: "Can a GNM nurse apply for NORCET?"
        a: "Yes, with registration as Nurse & Midwife and two years' experience in a hospital of at least 50 beds, gained after the qualification and registration."
        next: "Count your experience from the registration date."
        source: norcet11
      - q: "Is a Post-Basic B.Sc Nursing accepted for NORCET?"
        a: "Yes. B.Sc (Post-Certificate) or Post-Basic B.Sc Nursing from an INC / State Nursing Council recognised institute counts, with registration as Nurse & Midwife."
        next: "Keep your council registration current."
        source: norcet11
  - stages: [grad]
    title: "NORCET: Prelims and Mains"
    do:
      - text: "Stage I (Prelims): 100 MCQs in 90 minutes — 20 general knowledge and aptitude + 80 nursing — only for shortlisting. Stage II (Mains): 160 case-based MCQs in 180 minutes decides the merit list."
        source: norcet11
    exams:
      - { name: "NORCET-11", when: "Prelims 12 Sep 2026 · Mains 30 Sep 2026", source: norcet11 }
    money: [norcet-fee]
    doubts:
      - q: "What is the age limit for NORCET?"
        a: "18 to 30 years on the closing date, with 5 more years for SC / ST, 3 for OBC and 10 for PwBD (13 for OBC, 15 for SC / ST)."
        next: "Apply while you are within the limit."
        source: norcet11
      - q: "What are the qualifying marks in NORCET?"
        a: "Prelims: the 50th, 45th and 40th percentile for UR-EWS, OBC and SC-ST. Mains: 50%, 45% and 40%. PwBD candidates get a further 5 points."
        next: "Treat the Mains as the real competition."
        source: norcet11
      - q: "How many candidates reach NORCET Mains?"
        a: "Five times the seats in each category from among Prelims qualifiers, plus all qualified PwBD candidates and anyone tied at the cut-off."
        next: "Score well above the Prelims cut-off."
        source: norcet11
      - q: "How often is NORCET held?"
        a: "AIIMS plans NORCET twice a year; NORCET-11 was held in September 2026."
        next: "Watch aiimsexams.ac.in for NORCET-12."
        source: norcet11
      - q: "Is the NORCET fee refunded?"
        a: "Only for SC and ST candidates who sit the exam — they get it back after the result. Others' fees are not refunded; PwBD candidates pay nothing."
        next: "Keep your category certificate ready for verification."
        source: norcet11
  - stages: [work]
    title: "Allocation and joining"
    do:
      - text: "After Mains, qualified candidates fill choices of institutes and are allotted in merit order — generally in one round, with no waiting list."
        source: norcet11
    doubts:
      - q: "How are AIIMS chosen after NORCET?"
        a: "Qualified candidates fill choices of institutes after Stage II and are allotted in merit order, usually in one round. Not joining an allotted seat ends the candidature."
        next: "List only institutes you will really join."
        source: norcet11
      - q: "Can a nurse already working in a government hospital apply?"
        a: "Yes, with a No Objection Certificate uploaded by the notified date; central government civilian employees with 3 years' service also get age relaxation."
        next: "Ask your office for the NOC early."
        source: norcet11
board_note: "Any board. B.Sc Nursing needs PCB and English in Class 12; GNM accepts Class 12 with English and 40%."
board_source: [inc-bsc, inc-elig]
