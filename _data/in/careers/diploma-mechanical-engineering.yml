      - overview:
          points:
            - "Diploma in Mechanical Engineering is a 3-year polytechnic programme covering the fundamentals of machine design, manufacturing processes, thermodynamics, fluid mechanics, and workshop practice."
            - "It's heavily weighted toward hands-on, practical training — students spend substantial time in workshops and labs learning to operate machinery, read engineering drawings, and understand manufacturing processes directly, alongside classroom theory."
            - "It's offered at government polytechnics run by each state's technical education board, as well as private AICTE-approved polytechnic institutes, across virtually every state in India, making it one of the most widely available diploma programmes nationally."
