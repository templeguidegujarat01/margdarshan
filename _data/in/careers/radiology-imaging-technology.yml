            - "Want a genuinely accessible healthcare career beyond Bachelor of Medicine and Bachelor of Surgery (MBBS), with no NEET required."
            - "Are comfortable with fast-paced, high-stakes work, including emergency imaging situations."
          mismatch:
            - "Want to diagnose and interpret images yourself — that's Radiology as a medical specialty (MBBS + MD), a much longer path."
            - "Are worried AI will make this role obsolete — the hands-on operational work isn't something AI performs."
            - "Dislike working around radiation-adjacent equipment, even with standard safety protocols in place."
