  - id: "higher"
    hid: "higher-heading"
    alt: true
    eyebrow: "Skills over further degrees, for most"
    heading: "Career growth paths"
    parts:
      - prose:
          - "Further formal education isn't the typical growth lever if you already have a strong portfolio — deepening <strong>UX research</strong> skills, mastering <strong>design systems</strong>, or moving into full <strong>Product Design</strong> or <strong>Design Leadership</strong> roles are reported as the clearest paths to higher pay. The mid-to-senior level is reported to be significantly undersupplied relative to demand, since the pool of designers who can do proper UX research, build design systems, and present data-backed decisions to stakeholders is much smaller than the pool of entry-level UI designers. A postgraduate design programme at NID or Srishti remains a valid option for those wanting formal credentials specifically."
  - id: "proscons"
    hid: "pc-heading"
    eyebrow: "Honest take"
    heading: "Advantages and disadvantages"
    parts:
      - proscons:
          pros:
            - "Genuinely accessible via a strong self-built portfolio, competing meaningfully with formal design-school credentials."
            - "India needs a reported 80,000+ additional UI/UX designers by 2027, with AI tools increasing rather than reducing demand."
            - "Flexible career path opening into product management, UX research, or design leadership over time."
          cons:
            - "Entry-level \"UI Designer\" roles at most non-product companies pay meaningfully less than the higher senior/product-design numbers you'll see quoted online — manage expectations at the fresher stage."
            - "A portfolio of just visuals without documented case studies (research/iteration/outcome) is a real, common mistake that limits interview callbacks."
            - "The mid-to-senior skill bar (UX research, design systems, data-driven presentation) is genuinely higher than many beginners expect."
  - hid: "myth-heading"
    eyebrow: "Common myths"
    heading: "Myths vs facts"
    parts:
      - myths:
          - myth: "UI, UX and Product Designer are basically the same job, just different names."
            fact: "These titles get used interchangeably in job postings, but they carry genuinely different responsibilities and pay differently — UX and Product Designer roles typically pay 15-25% more than a plain UI-only role at the same experience level."
          - myth: "A design degree from NID or a top design school is required to become a UI/UX designer."
            fact: "Many startups and product companies now prioritise portfolio quality over college degrees — self-taught designers with a strong, documented portfolio are hired directly and freelance successfully."
          - myth: "AI design tools like Figma AI or Galileo are going to replace UI/UX designers."
            fact: "These tools are reported to be accelerating designer productivity, not replacing the role — product thinking, user empathy and strategic design judgment remain fundamentally human skills that AI tools don't replicate."
