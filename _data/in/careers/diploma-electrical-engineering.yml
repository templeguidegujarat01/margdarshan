    eyebrow: "Overview"
    heading: "What is Diploma in Electrical Engineering?"
    parts:
      - overview:
          points:
            - "Diploma in Electrical Engineering is a 3-year polytechnic programme covering electrical circuits, power generation and transmission, electrical machines (motors, generators, transformers), and electrical installation and maintenance."
            - "It trains students to work with the systems that generate, move and deliver electricity — from power plants and substations to factory machinery and building electrical systems."
            - "It's offered at government polytechnics run by each state's technical education board, as well as private AICTE-approved polytechnic institutes, across virtually every state in India."
          more:
            - "It's a particularly stable field given India's consistent, ongoing demand for skilled electrical technicians across power, manufacturing and infrastructure sectors."
