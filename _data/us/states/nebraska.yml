  law: { body: "Nebraska State Bar Commission (Nebraska Supreme Court, Attorney Services Division)", url: "https://nebraskajudicial.gov/", stat: "UBE", exam: "Uniform Bar Exam (MBE, MEE and MPT).", note: "MPRE required (passing score 85). NextGen UBE from July 2027.", src: ncbe_ne }
