  # ------------------------------------------------------------------------------------------------ Fencing
  - slug: fencing
    short: "Fencing"
    domain: combat
    checked: 2026-10-17
    body: "International Fencing Federation (FIE) · Fencing Association of India (FAI)"
    card: "Foil, épée and sabre under FIE August 2026 rules — the target for each sword, 5-touch pools and 15-touch knockouts, kit safety, LA28's 12 events, SAI fencing centres and India's first home Asian Championships."
    card_facts: ["3 weapons · 12 Olympic events", "Knockout bout = 15 touches", "FIE licence from age 13"]
    eyebrow: "Sports Cockpit · Combat &amp; Mat · FIE rules August 2026 · LA28 qualification"
    title: "Fencing — foil, épée, sabre, scoring &amp; the road to LA28"
    lede: "Education Margdarshan's fencing map for India in simple words: the three swords and the part of the body each may hit, how pool and knockout bouts are scored, the 'right of way' in foil and sabre, the age groups and safety kit, how LA28 places are won through team and individual rankings, the SAI fencing centres, who pays and the jobs and awards after a medal."
    official:
      - { label: "FIE Technical Rules, August 2026 (PDF)", url: "https://static.fie.org/uploads/40/204126-Technical%20rules%20August%202026%20ang.pdf" }
      - { label: "FIE LA28 qualification system (PDF)", url: "https://cdn.nocnsf.nl/media/3xyjpnpr/fen-la28-qualification-system.pdf" }
    facts:
      - { label: "Olympic events (LA28)", value: "<strong>12</strong> — 3 weapons × individual &amp; team × men &amp; women", source: fie-la28 }
      - { label: "Knockout bout", value: "<strong>15 touches</strong> or 3 × 3 min", source: fie-tech }
      - { label: "Pool bout", value: "<strong>5 touches</strong> or 3 min", source: fie-tech }
      - { label: "Youngest FIE licence", value: "<strong>13th birthday</strong> · cadet U17 · junior U20", source: fie-org }
    sections:
      - id: rules
        nav: "Weapons &amp; scoring"
        eyebrow: "Core rules &amp; selection formats"
        heading: "Three swords, three targets — and how a bout is won"
        parts:
          - p: "Fencing is sword fighting with electric scoring. Two fencers face each other on a <strong>14-metre strip (piste)</strong>; when a sword touches the opponent, a light comes on. There are <strong>three weapons</strong>, and each has its own target and rules."
            source: fie-tech
          - table:
              caption: "The three weapons"
              head: ["Weapon", "How you hit", "Valid target", "Weapon weight"]
              rows:
                - ["<strong>Foil</strong>", "Point only (thrust)", "<strong>The trunk only</strong> — no arms, legs or head", "Under 500 g · blade up to 90 cm"]
                - ["<strong>Épée</strong>", "Point only (thrust)", "<strong>The whole body</strong>, including clothing", "Under 770 g · blade up to 90 cm"]
                - ["<strong>Sabre</strong>", "Point, cutting edge and back of the blade (thrust and cut)", "<strong>Everything above the hips</strong>, including arms and head", "Under 500 g · blade up to 88 cm"]
            source: "fie-tech,fie-mat"
          - list:
              - "<strong>Pool bouts</strong> (first round, everyone fences everyone in a group): first to <strong>5 touches</strong>, or the leader after <strong>3 minutes</strong>."
              - "<strong>Knockout (direct elimination) bouts</strong>: first to <strong>15 touches</strong>, or the leader after <strong>three periods of 3 minutes</strong> with 1-minute breaks. In sabre the first period also ends when someone reaches <strong>8</strong>."
              - "If the score is level at the end, fencers go for <strong>one deciding touch</strong> in an extra minute; the referee first draws lots to decide who wins if that minute also ends level."
              - "<strong>Team events</strong> are relays: each leg is fenced to the next multiple of five touches (5, 10, 15, 20 …), with up to 3 minutes per leg."
            source: fie-tech
          - list:
              - "In <strong>foil and sabre</strong>, when both lights come on, the referee gives the point by <strong>priority ('right of way')</strong>: the fencer who started a correct attack first, with the arm straightening and the point threatening, wins the touch. In <strong>épée</strong> there is no priority — if both hit at the same time, both score."
            source: fie-tech
      - id: recognition
        nav: "Recognition"
        eyebrow: "Institutional &amp; global recognition"
        heading: "Olympics, Asian Games, World Championships — and India's fencing"
        parts:
          - table:
              caption: "LA28 Olympic fencing — the hard numbers"
              head: ["Rule", "What it says"]
              rows:
                - ["Places", "<strong>212</strong> (incl. host and universality); at most <strong>9 fencers per country</strong> per gender"]
                - ["Team route", "<strong>8 teams</strong> per event from the FIE senior team ranking of <strong>1 April 2028</strong> (top 4, then the best team from each zone, including Asia-Oceania); team members also fence the individual event"]
                - ["Individual route", "<strong>10 extra places per event</strong>: the 2 best on the adjusted world ranking, the best from each zone, then the winners of 4 zonal qualifying events"]
                - ["Ranking window", "<strong>1 April 2027 to 1 April 2028</strong> — Grand Prix, World Cups, Satellites, World and continental championships"]
            source: fie-la28
          - list:
              - "India hosted its first-ever <strong>Senior Asian Fencing Championships</strong> in Delhi (19–24 June 2026), with a 24-member Indian team led by <strong>C.A. Bhavani Devi</strong>, India's first and only fencing Olympian."
            source: air-asian26
          - table:
              caption: "Government cash award for a senior medal (₹ lakh)"
              head: ["Event", "Gold", "Silver", "Bronze"]
              rows:
                - ["<strong>Olympic Games</strong>", "75", "50", "30"]
                - ["Asian Games / Commonwealth Games", "30", "20", "10"]
                - ["World Championship (every year)", "10", "7", "4"]
                - ["Asian Championship (every year)", "3.75", "2.5", "1.25"]
            source: myas-cash
      - id: eligibility
        nav: "Ages &amp; safety"
        eyebrow: "Physical benchmarks &amp; anti-doping"
        heading: "Age groups, the safety kit and anti-doping"
        parts:
          - table:
              caption: "FIE age groups (age at midnight on 31 December of the season)"
              head: ["Group", "Who"]
              rows:
                - ["FIE licence", "From your <strong>13th birthday</strong>"]
                - ["Cadet", "Under 17"]
                - ["Junior", "Under 20"]
                - ["Senior", "No upper age limit"]
                - ["Veterans", "40–49, 50–59, 60–69, 70+"]
            source: fie-org
          - list:
              - "Fencing clothing must resist <strong>800 newtons</strong> of force (jacket, breeches, under-plastron); the bib of the mask <strong>1,600 newtons</strong>. Fencing in a jacket that does not fully cover the target is penalised."
              - "One minute before a bout the referee hands each fencer a weapon to check; weapons and body wires are checked against FIE specifications."
            source: "fie-mat,fie-tech"
          - list:
              - "Under the anti-doping code you must be <strong>available for testing</strong> and check every medicine against the <strong>Prohibited List</strong>; apply to NADA for a <strong>TUE</strong> if you need a banned medicine."
            source: nada-rr
      - id: roadmap
        nav: "Roadmap"
        eyebrow: "Grassroots-to-elite residential pipeline"
        heading: "From the school club to the national camp"
        parts:
          - table:
              caption: "The fencing ladder"
              head: ["Step", "Age", "What happens"]
              rows:
                - ["1. Club &amp; state association", "From school age", "Learn the basics and pick one weapon — foil, épée or sabre"]
                - ["2. SAI Training Centre", "12–18", "Up to 8th at Sub-Junior/Junior Nationals, or top 3 in the state, plus a battery of tests"]
                - ["3. Khelo India Youth Games", "Under 18", "Fencing is one of the 27 KIYG sports; medals now count for central jobs"]
                - ["4. FIE licence &amp; cadet/junior circuit", "13+", "Cadet (U17) and junior (U20) World Cups and Asian Championships"]
                - ["5. SAI NCOE / national camp", "Scouted", "Residential training; national trials pick India's teams"]
                - ["6. Senior ranking events", "Senior", "Satellites, World Cups and Grand Prix build the ranking that decides LA28"]
            source: "sai-schemes,kiyg25,dopt-2024,fie-org,fie-la28,air-asian26"
      - id: academies
        nav: "Centres"
        eyebrow: "Top elite academies &amp; cities"
        heading: "Where India's fencers train"
        parts:
          - table:
              caption: "SAI National Centres of Excellence with fencing"
              head: ["Centre", "Other sports there"]
              rows:
                - ["<strong>Aurangabad</strong> (Chhatrapati Sambhajinagar), Maharashtra", "Boxing, hockey, weightlifting, gymnastics"]
                - ["<strong>Guwahati</strong>, Assam", "Archery, athletics, boxing, cycling, football, taekwondo"]
                - ["<strong>Imphal</strong>, Manipur", "Archery, athletics, cycling, football, hockey, judo, weightlifting, wushu"]
                - ["<strong>Patiala</strong>, Punjab (NSNIS)", "Athletics, cycling, hockey, judo, weightlifting"]
            source: sai-schemes
          - note: "Fencing is one of SAI's <strong>13 priority sports</strong> and is also taught at SAI Training Centres (ages 12–18)."
            source: sai-schemes
      - id: costs
        nav: "Gear &amp; cost"
        eyebrow: "Equipment costs &amp; who pays"
        heading: "Swords, safety kit and who pays the bills"
        parts:
          - list:
              - "Fencing is kit-heavy: mask, jacket, breeches, under-plastron, glove, weapons and body wires (plus a conductive jacket for foil and sabre). All must meet FIE ratings for international events. Education Margdarshan does not print shop prices — no governing body publishes them."
            source: fie-mat
          - table:
              caption: "Who pays — fencing ladder"
              head: ["Stage", "Paid by", "What you get"]
              rows:
                - ["SAI centre trainee", "Sports Authority of India", "Coaching, boarding, sports science, diet"]
                - ["Khelo India athlete", "Ministry of Youth Affairs &amp; Sports", "<strong>₹6.28 lakh a year</strong> incl. ₹1.20 lakh cash"]
                - ["Junior medal prospect", "TOPS Development Group", "₹25,000 a month"]
                - ["Olympic prospect", "TOPS Core Group", "<strong>₹50,000 a month</strong> + approved training plan"]
                - ["Athlete in hardship", "PDU National Welfare Fund", "Up to ₹2.50 lakh"]
            source: "sai-schemes,pib-support"
      - id: earnings
        nav: "Earnings &amp; jobs"
        eyebrow: "Earning channels &amp; central job quotas"
        heading: "Awards, pension and sports-quota jobs"
        parts:
          - list:
              - "Fencing is one of the <strong>65 sports</strong> in the central sports quota for <strong>Group C</strong> posts, with up to 5 years' age relaxation (10 for SC/ST)."
              - "Medals at the Olympics, Asian Games, Commonwealth Games or World Championships can bring up to <strong>three out-of-turn promotions</strong>."
            source: dopt-2022
          - list:
              - "<strong>Pension to Meritorious Sportspersons</strong>: ₹12,000–20,000 a month after retirement."
            source: pib-support
      - id: traps
        nav: "Red flags"
        eyebrow: "Disqualification traps"
        heading: "Mistakes that cost fencers touches and bouts"
        parts:
          - list:
              - "<strong>Covering the target</strong> with your free hand or arm in foil or sabre — the touch you score is cancelled and you are penalised."
              - "<strong>Old or under-rated kit</strong> — clothing below the 800 N / 1,600 N ratings, or a jacket that does not cover the target, is penalised."
              - "<strong>Hitting with the guard</strong> in sabre — the touch is annulled and penalised."
            source: "fie-tech,fie-mat"
          - list:
              - "<strong>Fencing only at home</strong> — LA28 places come from <strong>international rankings</strong> in 2027-28; without World Cup and Satellite points there is no Olympic route."
            source: fie-la28
      - id: doubts
        nav: "Player doubts"
        eyebrow: "Real-world player doubts"
        heading: "Which weapon, late start, jobs and money — straight answers"
        parts:
          - qa:
              q: "Which weapon should I start with?"
              a: "Pick by the style that suits you. <strong>Foil</strong> targets only the trunk and uses right of way, so it rewards control. <strong>Épée</strong> suits patient fencers — the whole body is a target and there is no right of way. <strong>Sabre</strong> is the fastest, with cuts allowed above the hips. All three have individual and team events at the Olympics."
            source: "fie-tech,fie-la28"
          - qa:
              q: "I am 16, 18 or 20. Is it too late to start fencing?"
              a: "Not for competing: seniors have <strong>no upper age limit</strong>, juniors run to under 20. It is late for the free pipelines — SAI Training Centres take ages <strong>12–18</strong> — so a late starter trains at a club and must win at nationals to be noticed. The real clock is the job deadline: Railways sports quota stops at <strong>25</strong> and CRPF at <strong>23</strong> (28 for an unreserved sportsperson after relaxation)."
            source: "fie-org,sai-schemes,rrc-wr26,crpf26"
          - qa:
              q: "Which government jobs can fencing get me?"
              a: "<strong>Central Group C posts</strong> under DoPT rules list fencing among 65 sports. Neither Western Railway's 2026-27 notice nor CRPF's 2026 sports quota had fencing posts — each recruiter advertises only the sports its teams need, so read every notice."
            source: "dopt-2022,rrc-wr26,crpf26"
          - table:
              caption: "Sports-quota job routes open in 2026 — age, qualifying results, pay"
              head: ["Route", "Age", "Main qualifying results", "Pay level"]
              rows:
                - ["Railways <strong>Level 5/4</strong> (graduates)", "18–25 on 1 Jan 2027", "Played the <strong>Olympics</strong>, or top 3 at a World Cup, World Championship, Asian Games, Commonwealth Games or Youth Olympics", "Level 5/4"]
                - ["Railways <strong>Level 3/2</strong> (12th, or 10th + apprenticeship)", "18–25 on 1 Jan 2027", "Top 3 at <strong>Senior, Youth or Junior Nationals</strong>, National Games or All India Inter-University; or Federation Cup gold", "Level 3/2"]
                - ["Railways <strong>Level 1</strong>", "18–25 on 1 Jan 2027", "Played for your state and finished <strong>at least 8th at Senior Nationals</strong>; or top 3 at the Federation Cup", "Level 1"]
                - ["CRPF <strong>Head Constable (GD)</strong> (10+2)", "18–23 on 1 Aug 2026; sportspersons get <strong>+5 years</strong> (OBC +8, SC/ST +10)", "Played for India; or top 3 for your state at Nationals or National Games; or <strong>gold/silver at Junior Nationals</strong>", "Level 4 · ₹25,500–81,100"]
                - ["CRPF <strong>Constable (GD)</strong> (10th pass)", "18–23 on 1 Aug 2026; sportspersons get <strong>+5 years</strong> (OBC +8, SC/ST +10)", "Played for your state at <strong>Senior or Junior Nationals</strong>; or top 3 at SGFI school nationals or Khelo India Games", "Level 3 · ₹21,700–69,100"]
            source: "rrc-wr26,crpf26"
          - note: "Railways count results from <strong>1 April 2024</strong>; CRPF counts the <strong>two years before 30 September 2026</strong>. Railways fee ₹500 (₹400 back if you attend the trial; ₹250, refunded in full on attending, for SC/ST, women, PwBD, minorities, ex-servicemen and EBC). CRPF fee ₹100 for UR/OBC/EWS men; free for women, SC, ST and ex-servicemen. CRPF picks sign a <strong>₹1 lakh bond to serve at least 3 years</strong>."
            source: "rrc-wr26,crpf26"
          - qa:
              q: "Fencing kit is costly. How do we manage?"
              a: "Aim for the free seats: SAI Training Centres and the four fencing NCOEs give <strong>coaching, boarding, sports science and diet</strong>; a Khelo India athlete gets <strong>₹6.28 lakh a year</strong> (₹1.20 lakh cash), and TOPS pays ₹25,000–50,000 a month to medal prospects. A fencer in hardship can apply to the PDU National Welfare Fund for up to ₹2.50 lakh."
            source: "sai-schemes,pib-support"
          - qa:
              q: "Does any 'national' certificate count for a job?"
              a: "No. Railways will <strong>not recruit on a certificate from a federation MoYAS did not recognise</strong> at the time of the championship, and CRPF counts only championships of MoYAS-recognised federations or the IOA's National Games."
            source: "rrc-wr26,crpf26"
