            text: "Biology is key."
          - title: "CUET-UG or state exam"
            text: "ICAR national quota or state seats."
          - title: "B.F.Sc (4 years)"
            text: "Aquaculture, fish biology, processing, economics."
          - title: "M.F.Sc (optional)"
            text: "Through ICAR's postgraduate entrance."
          - title: "Career"
            text: "State fisheries department, industry, banks, research via ASRB."
  - id: "exams"
    hid: "exams-heading"
    eyebrow: "Exams & licences"
    heading: "Admission and recruitment"
    parts:
