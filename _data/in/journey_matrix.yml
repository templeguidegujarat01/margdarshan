  # ------------------------------------------------------------------ COMPANY SECRETARY (batch 3)
  - id: company-secretary
    name: "Company Secretary (ICSI: CSEET → Executive → Professional)"
    search: ["company secretary"]
    page: "cs.html"
    roadmap: "roadmaps/cs.html"
    gate: "Class 12 in any stream → CSEET → CS Executive (7 papers in 2 groups) → 30-day EDP and 21 months' practical training → CS Professional → 30-day CLDP. Graduates skip CSEET."
    gate_source: [icsi-cseet, icsi-train, icsi-sm]
    foundation:
      - stages: [c8, c9]
        title: "Reading, writing and numbers"
        points:
          - text: "The CSEET papers are <strong>Business Communication, Fundamentals of Accounting, Economic and Business Environment</strong> (written, 3 hours each) and <strong>Business Laws and Management</strong> (OMR, 2 hours)."
            source: icsi-cseet
          - text: "Write letters, summaries and short essays often — three of the four CSEET papers are written answers."
      - stages: [c10]
        title: "Any stream works"
        points:
          - text: "CSEET is open to any Indian national who has passed or is appearing in Class 12 — <strong>no stream or percentage rule</strong>."
            source: icsi-cseet
          - text: "Commerce gives you a head start in Accounting and Economics, but Science and Arts students sit the same test."
      - stages: [c11, c12]
        title: "Register for CSEET in Class 12"
        points:
          - text: "Registration windows: <strong>1 Nov – 28/29 Feb</strong> for the June session, 1 Mar – 30 Jun for October, 1 Jul – 31 Oct for February."
            source: icsi-cseet
          - text: "Pass with <strong>40% in each paper and 50% overall</strong> in one sitting; no exemption or carry-forward of marks, and no negative marking in the OMR paper."
            source: icsi-cseet
          - text: "CSEET registration is valid 3 years; the result is valid 1 year, so join CS Executive within a year of passing."
            source: icsi-cseet
      - stages: [ug, grad]
        title: "Graduates go straight to Executive"
        points:
          - text: "Exempt from CSEET: graduates and postgraduates, CA Intermediate pass, CMA Final pass, final-year undergraduates (provisionally) and old CS Foundation passers."
            source: icsi-cseet
          - text: "After passing Executive: 15 days' online EDP (₹2,000) and 15 days' classroom EDP (₹8,000), then <strong>21 months' practical training</strong> with a practising Company Secretary or a company."
            source: icsi-train
    board_notes:
      gseb: "ICSI treats a GSEB HSC like any 10+2 — you can register for CSEET while still appearing in it."
      cbse-gj: "Any board's Class 12 counts; register for CSEET while appearing in Class XII."
      upmsp: "Your Intermediate counts like any 10+2 — register for CSEET while appearing in it."
      msbshse: "Your HSC counts like any 10+2 — register for CSEET while appearing in it."
      wb: "Your Higher Secondary counts like any 10+2 — register for CSEET while appearing in it."
      cbse: "No board, stream or percentage rule: passing or appearing in Class 12 is enough for CSEET."
      other: "No board, stream or percentage rule: passing or appearing in Class 12 is enough for CSEET."
    board_source: icsi-cseet
    exam:
      name: "CSEET (restructured from June 2026) → CS Executive → CS Professional"
      body: "Institute of Company Secretaries of India (ICSI)"
      href: "cs.html"
      facts:
        - { label: "CSEET papers", value: "4 papers × 100 marks — 3 written (3 h) + 1 OMR (2 h)", source: icsi-cseet }
        - { label: "Pass rule", value: "40% in each paper and 50% aggregate, in one sitting", source: icsi-cseet }
        - { label: "Fees", value: "₹7,500 CSEET registration + ₹1,500 exam fee per session", source: icsi-cseet }
        - { label: "Sessions", value: "February, June and October (first week)", source: icsi-cseet }
      stages:
        head: ["Stage", "Papers", "Who can enter", "Rule"]
        rows:
          - ["CSEET", "Business Communication · Fundamentals of Accounting · Economic and Business Environment · Business Laws (60) and Management (40, OMR)", "Class 12 passed or appearing", "Result valid 1 year"]
          - ["CS Executive", "Group 1: Jurisprudence, Interpretation and General Laws; Company Law; Setting Up of Business, Industrial and Labour Laws; Corporate Accounting and Financial Management · Group 2: Capital Market and Securities Laws; Economic, Commercial and IP Laws; Tax Laws", "CSEET pass, or graduate / CA Inter / CMA Final", "June and December sessions"]
          - ["Training", "30-day Executive Development Programme, then 21 months' long-term practical training", "CS Executive pass", "Minimum stipend ₹5,000 a month"]
          - ["CS Professional", "Group 1: ESG; Drafting, Pleadings and Appearances; Compliance Management, Audit and Due Diligence; Elective 1 · Group 2: Strategic Management and Corporate Finance; Corporate Restructuring, Valuation and Insolvency; Elective 2", "CS Executive pass", "Then the 30-day Corporate Leadership Development Programme"]
        source: [icsi-cseet, icsi-sm, icsi-train, icsi-flyer]
      notes:
        - text: "There is no Foundation stage now: CSEET is the entry test, and old CS Foundation passers are exempt from it."
          source: icsi-cseet
        - text: "Exam enrolment for CSEET costs ₹1,500 per session, with a ₹250 late fee in the late window."
          source: icsi-cseet
        - text: "The paper list is for the December 2026 Executive and Professional exams. Check icsi.edu for the study material applicable to your own session."
          source: icsi-sm
    state_rules:
      - text: "ICSI is one national body: <strong>no state quota or domicile rule</strong> at any stage. Fee concessions depend on category and region, not on your board."
        source: icsi-cseet
      - text: "Students from the North-Eastern states, Andaman &amp; Nicobar, Lakshadweep and Himachal Pradesh pay no CSEET registration fee."
        source: icsi-cseet
    multiverse:
      - { title: "Company Secretary", text: "The full CS career guide.", href: "cs.html" }
      - { title: "Chartered Accountant", text: "ICAI's audit and tax qualification.", href: "ca.html" }
      - { title: "Cost and Management Accountant", text: "ICMAI's costing and management route.", href: "cma.html" }
      - { title: "CA vs CMA vs CS", text: "The three professional courses side by side.", href: "ca-vs-cma-vs-cs.html" }
      - { title: "Law (LLB)", text: "Corporate law through a law degree.", href: "llb.html" }
      - { title: "Coaching", text: "CS coaching centres near you.", href: "coaching-cs.html" }
    money: [cs-fee, cs-stipend, pms-sc, nmmss]

  # ------------------------------------------------------------------ DATA SCIENTIST / AI SPECIALIST (batch 3)
  - id: data-scientist
    name: "Data Scientist / AI Specialist (B.Tech / B.Sc / BS Data Science)"
    search: ["data scientist", "machine learning engineer", "artificial intelligence engineer", "ai engineer"]
    page: "datascience.html"
    roadmap: "roadmaps/datascience.html"
    gate: "Class 12 with Mathematics → B.Tech (CSE, AI or Data Science) through JEE Main or your state's route — or a B.Sc / BCA, or IIT Madras's online BS in Data Science → statistics, programming and machine-learning projects → analyst and data-scientist roles."
    gate_source: [jm-ib, iitm-adm]
    foundation:
      - stages: [c8, c9]
        title: "Mathematics and statistics are the core"
        points:
          - text: "IIT Madras's BS starts with four foundation courses: <strong>English I, Mathematics for Data Science I, Statistics for Data Science I and Computational Thinking</strong>."
            source: iitm-adm
          - text: "Practise data handling, graphs and probability, and try a spreadsheet or beginner Python course — data work is mostly cleaning and reading numbers."
      - stages: [c10]
        title: "Keep Mathematics"
        points:
          - text: "The IIT Madras BS expects <strong>Mathematics and English in Class 10</strong>; any Class 12 stream may apply."
            source: iitm-adm
          - text: "For B.E. / B.Tech at NITs, IIITs and other NIT+ institutes, Class 12 must include <strong>Physics and Mathematics</strong>."
            source: jm-ib
      - stages: [c11, c12]
        title: "Two doors in Class 12"
        points:
          - text: "JEE Main: for NIT+ seats through JoSAA you also need <strong>75% in Class 12</strong> (65% SC, ST, PwD) or a place in your board's top 20 percentile."
            source: jm-ib
          - text: "IIT Madras BS: apply after your <strong>Class 11 final exams</strong>, from any stream or board. The qualifier is 4 weeks of online coursework and a 4-hour in-person exam; pass with 40% in each course and 50% on average (General). The result stays valid for 2 years if you have not yet sat Class 12."
            source: iitm-adm
          - text: "Students eligible for the current year's JEE Advanced can join the IIT Madras BS foundation level directly, without the qualifier."
            source: iitm-adm
      - stages: [ug, grad]
        title: "Already in college?"
        points:
          - text: "Anyone who has passed Class 12 may apply to the IIT Madras BS, <strong>whatever their age or background</strong>; you pay course by course, each term."
            source: [iitm-adm, iitm-fee]
          - text: "In Uttar Pradesh's 2026-27 counselling, MCA admits BCA, B.Sc (CS / IT) or B.Tech (CSE / IT) graduates — or any graduate who had Mathematics at 10+2 or in the degree — with 50% (45% SC / ST)."
            source: tac-ib
    board_notes:
      gseb:
        text: "For Gujarat state-quota B.E. seats, ACPC merit is <strong>50% your HSC theory percentile</strong> in Mathematics, Physics and Chemistry + <strong>50% your GUJCET percentile</strong>. HSC needs 45% (40% reserved)."
        source: acpc-advt
      cbse-gj:
        text: "Schooling in Gujarat plus a GUJCET attempt opens ACPC's state-quota B.E. seats; your CBSE Class XII theory percentile goes into the same 50:50 merit formula."
        source: acpc-advt
      upmsp:
        text: "UPTAC fills B.Tech seats on your <strong>JEE Main</strong> rank. Passing Intermediate in UP makes you eligible for the regular rounds; you need 45% (40% SC / ST) in the required subjects."
        source: tac-ib
      msbshse:
        text: "Passing SSC and HSC in Maharashtra (and being domiciled or born there) makes you a <strong>Type A</strong> Maharashtra candidate; MHT-CET is compulsory for Maharashtra-candidature B.E. / B.Tech seats."
        source: mht-ib
      wb:
        text: "West Bengal domicile — 10 years' residence as on 31.12.2025, or a permanent-resident parent — is needed for government-aided seats and every reserved seat in WBJEEB counselling."
        source: wb-ib
      cbse: "JEE Main is the same paper for every board; the IIT Madras BS accepts every recognised Class 12."
      other: "JEE Main is offered in 13 languages, and the IIT Madras BS site is available in Hindi, Tamil, Telugu, Malayalam, Kannada, Marathi, Gujarati and Bengali."
    board_source: jm-ib
    exam:
      name: "JEE Main 2026 (B.Tech) · IIT Madras BS qualifier (online degree)"
      body: "NTA · JoSAA / state counselling · IIT Madras"
      href: "jee-main.html"
      facts:
        - { label: "JEE Main Paper 1", value: "75 questions · 300 marks · 3 hours · +4 / −1", source: jm-ib }
        - { label: "JEE Main fee", value: "₹1,000 General male · ₹800 female · ₹500 SC / ST / PwD, per session", source: jm-ib }
        - { label: "IITM BS application", value: "₹4,000 General / OBC · ₹2,000 SC / ST / PwD · ₹1,000 SC / ST + PwD", source: iitm-adm }
        - { label: "IITM BS full fee", value: "₹3,86,000 – ₹4,50,000 for the BS degree (from the Jan 2026 term)", source: iitm-fee }
      stages:
        head: ["Route", "What it is", "Marking / pass", "Rule"]
        rows:
          - ["JEE Main → JoSAA / state", "B.Tech in CSE, AI or Data Science at NITs, IIITs, state and private colleges", "+4 / −1", "75% in Class 12 (65% SC / ST / PwD) or your board's top 20 percentile for NIT+ seats"]
          - ["IITM BS — qualifier", "4 weeks of online coursework in the 4 foundation courses, then a 4-hour in-person exam", "40% in each course and 50% average (General); lower bars for OBC-NCL / EWS, SC / ST, PwD", "Open after Class 12, or after Class 11 finals (join after Class 12)"]
          - ["IITM BS — levels", "Foundation → Diploma(s) → BSc (114 credits) → BS (142 credits)", "Pay per course, each term", "Exit with a certificate, diploma or degree at any level"]
        source: [jm-ib, iitm-adm, iitm-fee]
      notes:
        - text: "IIT Madras BS: applications for the January 2027 term close on 29 January 2027; three intakes a year (January, May, September)."
          source: iitm-adm
        - text: "Central reservation on JEE Main seats: SC 15%, ST 7.5%, OBC-NCL 27%, Gen-EWS 10%, and 5% horizontal for PwD inside each."
          source: jm-ib
        - text: "These are the 2026 rules. Check jeemain.nta.nic.in for the 2027 bulletin and study.iitm.ac.in for the current IIT Madras fee table."
    state_rules:
      - state: gujarat
        text: "ACPC fills <strong>95% of Govt / Grant-in-Aid and 50% of unaided seats</strong> with Gujarat-schooled GUJCET candidates; 5% of Govt / GIA seats go on JEE Main rank to candidates from any board."
        source: acpc-advt
      - state: uttar-pradesh
        text: "Government and aided institutes fill 100% of first-year seats through UPTAC; private colleges fill 85% through UPTAC and 15% through management / NRI quota. Up to 5% extra tuition-fee-waiver seats exist for economically weaker students (see Money help)."
        source: tac-ib
      - state: maharashtra
        text: "CAP reserves 60% of seats vertically for Maharashtra candidates — SC 13%, ST 7%, VJ/NT 11%, OBC 19%, SEBC 10% — plus 10% EWS over the intake and 30% for women."
        source: [cap-ib, mht-ib]
      - state: west-bengal
        text: "Reservation in WBJEEB counselling (SC, ST, OBC-A, OBC-B, PwD, TFW, EWS) is only for candidates domiciled in West Bengal."
        source: wb-ib
      - text: "NIT seats are split into a <strong>Home State</strong> and an <strong>Other States</strong> quota; Home State is where you passed Class 12. The IIT Madras BS has no state quota."
        source: [josaa-br, iitm-adm]
    multiverse:
      - { title: "Data Science", text: "The full data-science career guide.", href: "datascience.html" }
      - { title: "AI / ML engineer", text: "Building and deploying machine-learning systems.", href: "ai-engineer.html" }
      - { title: "Statistician", text: "The statistics-heavy side of data work.", href: "statistician.html" }
      - { title: "B.Tech CSE", text: "The engineering degree most data roles hire from.", href: "cse.html" }
      - { title: "BCA → MCA", text: "A computer-applications route into data jobs.", href: "bca.html" }
      - { title: "ISI admission", text: "Indian Statistical Institute's B.Stat and B.Math entrance.", href: "isi.html" }
    money: [nmmss, csss, pms-sc, iitm-fee-support, tfw-up, wbscc, mysy]

  # ------------------------------------------------------------------ ARCHITECT (batch 4)
  - id: architect
    name: "Architect (B.Arch through NATA / JEE Main Paper 2A)"
    search: ["=architect", "heritage conservation architect"]
    page: "architect.html"
    roadmap: "roadmaps/architect.html"
    gate: "Class 12 with Physics and Mathematics (plus one listed subject) and 45% aggregate → NATA or JEE Main Paper 2A → 5-year B.Arch → registration with the Council of Architecture before you call yourself an Architect."
    gate_source: [nata-br, jm-ib]
    foundation:
      - stages: [c8, c9]
        title: "Drawing, space and school maths"
        points:
          - text: "NATA's Part A is drawn on paper: <strong>composition and colour, sketching a scene with buildings and people to scale with shade and shadow, and a 3D composition</strong> built from a kit. Part B tests visual reasoning, design sensitivity, general knowledge of architecture and numerical ability."
            source: nata-br
          - text: "Sketch every day — buildings on your street, rooms from above, objects in light and shadow. Keep your board's maths strong; JEE Main Paper 2A has a 100-mark Mathematics part."
      - stages: [c10]
        title: "Pick Class 11 subjects that keep B.Arch open"
        points:
          - text: "B.Arch needs <strong>Physics and Mathematics compulsory</strong> in Class 12, plus any one of Chemistry, Biology, a technical vocational subject, Computer Science, IT, Informatics Practices, Engineering Graphics or Business Studies. Chemistry is not compulsory for the Council of Architecture rule."
            source: nata-br
          - text: "For B.Arch seats at NITs and SPAs through JoSAA, Class 12 must have <strong>Physics, Chemistry and Mathematics</strong> — so taking Chemistry too keeps every door open."
            source: jm-ib
      - stages: [c11, c12]
        title: "45% in Class 12 and an aptitude score"
        points:
          - text: "Admission to B.Arch needs at least <strong>45% aggregate</strong> in Class 12 (or a 10+3 diploma with Mathematics and 45%) and a valid NATA or JEE score."
            source: nata-br
          - text: "NATA: up to <strong>two attempts in Phase 1</strong> (April–June) or one in Phase 2 (August, for vacant seats only). Phase 1 gives the percentile used in counselling; there is no minimum qualifying raw score. Your NATA score is valid only for that year's admissions."
            source: nata-br
          - text: "NIT+ seats through JoSAA also need <strong>75% in Class 12</strong> (65% SC, ST, PwD) or a place in your board's top 20 percentile."
            source: jm-ib
      - stages: [ug, grad]
        title: "B.Arch, then registration"
        points:
          - text: "Only a person registered with the <strong>Council of Architecture</strong> may practise under the title “Architect”. Registration needs a recognised qualification under the CoA Minimum Standards of Architectural Education Regulations, 2020; misusing the title is a criminal offence under the Architects Act, 1972."
            source: nata-br
          - text: "Already in a 3-year diploma with Mathematics? A 10+3 diploma with 45% also qualifies you to sit NATA and to join B.Arch."
            source: nata-br
    board_notes:
      gseb:
        text: "ACPC's B.Arch merit for 2026 was <strong>50% your board (or diploma) aggregate percentage + 50% your NATA 2025 / 2026 or JEE (Main) 2026 Paper-2 percentile</strong> — so your HSC total matters as much as the test."
        source: acpc-barch-merit
      cbse-gj:
        text: "Your CBSE Class XII aggregate goes into the same ACPC formula: 50% board aggregate + 50% NATA or JEE Main Paper-2 percentile."
        source: acpc-barch-merit
      upmsp:
        text: "UPTAC fills B.Arch seats first on <strong>NATA</strong> (2025 or 2026 score), then on JEE (Main) 2026. Intermediate needs Physics, Mathematics and one listed subject with at least <strong>45% across those three</strong> (or a 10+3 diploma with 45%)."
        source: tac-ib
      msbshse:
        text: "Maharashtra CAP needs Physics and Mathematics plus one listed subject with 45% in HSC — 40% for reserved, EWS and PwD candidates <strong>of Maharashtra only</strong> — and a JEE or NATA aptitude score (2025-26 brochure)."
        source: cap-ib
      wb: "NATA is offered in English and Hindi only, and the Council of Architecture leaves seat quotas to each state's admission authority — check the B.Arch notice of the college you want."
      cbse: "NATA and JEE Main treat every board the same. NATA is offered in English and Hindi; quotas come from the state or institute that admits you."
      other: "Your board's Class 12 counts like CBSE's. Make sure Physics and Mathematics are in your subjects and that your aggregate is at least 45%."
    board_source: nata-br
    exam:
      name: "NATA 2026 · JEE Main 2026 Paper 2A (B.Arch)"
      body: "Council of Architecture · NTA · state CAP / JoSAA"
      href: "nata.html"
      facts:
        - { label: "NATA paper", value: "200 marks · 3 hours (drawing 80 + adaptive CBT 120)", source: nata-br }
        - { label: "NATA fee", value: "₹1,750 per test · ₹1,250 SC / ST / EWS / PwD", source: nata-fee }
        - { label: "JEE Paper 2A", value: "77 questions · 400 marks · 3 hours · +4 / −1", source: jm-ib }
        - { label: "Class 12 rule", value: "Physics + Maths + 1 listed subject · 45% aggregate", source: nata-br }
      stages:
        head: ["Route", "What it is", "Marking", "Used for"]
        rows:
          - ["NATA Part A", "3 drawing questions on paper (80 marks)", "Evaluated drawings", "State and institute B.Arch counselling"]
          - ["NATA Part B", "42 MCQ + 8 NCQ, computer-based adaptive (120 marks)", "No minimum qualifying raw score", "Best of two Phase 1 attempts gives your percentile"]
          - ["JEE Main Paper 2A", "Mathematics 100 + Aptitude 200 on screen, Drawing 100 on paper", "+4 / −1 on screen; drawing has no negative marking", "B.Arch at NITs and SPAs through JoSAA, and in many state counsellings"]
        source: [nata-br, jm-ib]
