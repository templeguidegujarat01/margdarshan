  # ------------------------------------------------------------------ POLICE
  - slug: police
    group: civil
    short: "Police Constable &amp; PSI"
    body: "Maharashtra Police (Home Department) · MPSC for PSI"
    card: "Police Shipai (constable) through unit-wise recruitment with a 50-mark physical and 100-mark written test; Police Sub-Inspector through MPSC's Group-B (Non-Gazetted) exam."
    card_facts: ["Constable: Class 12", "PSI: graduate", "Physical test 50 + written 100"]
    eyebrow: "Police Shipai · Police Sub-Inspector"
    title: "Maharashtra Police Constable (Shipai) &amp; PSI Recruitment"
    lede: "Police constables are recruited by each commissionerate or district superintendent under the Maharashtra Police Constables (Recruitment) Rules, 2011; the 2024-25 drive opened on 29 October 2025. Police Sub-Inspectors are recruited by MPSC through the Group-B (Non-Gazetted) Combined Exam (Advertisement 011/2026)."
    facts:
      - { label: "Constable qualification", value: "HSC (Class 12) pass", source: pc-rules }
      - { label: "Constable test", value: "Physical 50 + written 100", source: pc-2022 }
      - { label: "PSI posts (011/2026)", value: "310 · age 19–31 (open)", source: mpsc-011 }
      - { label: "PSI pay", value: "S-14: ₹38,600 – ₹1,22,800", source: mpsc-011 }
    official:
      - { label: "Police recruitment portal", url: "https://policerecruitment2025.mahait.org/Forms/Home.aspx" }
      - { label: "MPSC notifications (open 011/2026)", url: "https://mpsc.gov.in/adv_notification/8" }
    sections:
      - id: overview
        nav: "Overview"
        eyebrow: "Overview &amp; official source"
        heading: "Two different recruitments"
        parts:
          - p: "Police Shipai (constable) posts are advertised separately by every police unit — the police commissionerates, district superintendents and railway police units listed on the 2024-25 portal. Applications ran from 29 October 2025 (6 pm) to 7 December 2025, with online fee payment until 10 December 2025."
            source: pc-portal
          - p: "Example: the Pune City Police Commissionerate advertisement dated 29 October 2025 fills 1,733 posts — 1,700 Police Shipai and 33 Bandsmen."
            source: pc-pune
          - p: "Police Sub-Inspector (Group-B, Non-Gazetted) is an MPSC post. Advertisement 011/2026 (Maharashtra Group-B Non-Gazetted Services Combined Preliminary Exam 2026) offers 552 posts, of which 310 are PSI; the Prelim was held on Sunday 14 June 2026 at 37 district centres."
            source: mpsc-011
      - id: eligibility
        nav: "Eligibility &amp; Physical"
        eyebrow: "Eligibility, age &amp; physical standards"
        heading: "Who can apply, by gender and category"
        parts:
          - table:
              caption: "Police Shipai — Maharashtra Police Constables (Recruitment) Rules, 2011, rule 3"
              head: ["Requirement", "Men", "Women"]
              rows:
                - ["Age", "18 to 25 years; higher limit relaxed for backward classes as per government policy", "Same"]
                - ["Education", "HSC (Class 12) from a Maharashtra divisional board, or an exam declared equivalent", "Same"]
                - ["Height", "At least 165 cm", "At least 155 cm"]
                - ["Chest", "At least 79 cm unexpanded, with at least 5 cm expansion", "Not measured"]
            source: pc-rules
          - p: "<strong>Scheduled Tribe candidates:</strong> the required height is relaxed by 5 cm (2024 amendment)."
            source: pc-2024
          - p: "<strong>Notified Naxal-affected areas:</strong> Scheduled Tribe residents of those areas, and children of police informants, police patils or police staff killed or seriously injured in Naxal attacks, need only Class 7, get 2.5 cm off the height and have no chest requirement — but are not transferable outside the Naxal-affected area (rule 3(2))."
            source: pc-rules
          - note: "One-time age relief for the 2024 and 2025 vacancies: candidates of all categories who crossed the upper age limit between 1 January 2022 and 31 December 2025 may still apply (Amendment Rules, 2025)."
            source: pc-2025
          - table:
              caption: "Police Sub-Inspector — MPSC Advertisement 011/2026 (age counted on 1 August 2026)"
              head: ["Requirement", "Men / self-identified male transgender", "Women / self-identified female transgender"]
              rows:
                - ["Qualification", "Degree from a statutory university or equivalent, plus Marathi", "Same"]
                - ["Age — open", "19 to 31 years", "Same"]
                - ["Age — backward class / EWS / orphan", "19 to 34 years", "Same"]
                - ["Age — sportsperson or ex-serviceman", "Up to 36 years", "Same"]
                - ["Height", "At least 165 cm (barefoot)", "At least 157 cm (barefoot)"]
                - ["Chest", "79 cm unexpanded, at least 5 cm expansion", "Not measured"]
                - ["Candidates with a disability", "Not eligible for PSI", "Not eligible for PSI"]
            source: mpsc-011
      - id: scheme
        nav: "Exam Scheme"
        eyebrow: "Exam scheme"
        heading: "Physical test, written test and merit"
        parts:
          - table:
              caption: "Police Shipai physical fitness test — 50 marks (First Amendment Rules, 2022)"
              head: ["Event (men)", "Marks", "Event (women)", "Marks"]
              rows:
                - ["1,600 m run", "20", "800 m run", "20"]
                - ["100 m run", "15", "100 m run", "15"]
                - ["Shot put", "15", "Shot put", "15"]
            source: pc-2022
          - list:
              - "Candidates scoring at least 50% in the physical test are called for the written test in the ratio 1:10 of the vacancies in their category (ties at the cut-off rank are all called)."
              - "Written test: 100 marks, multiple choice, in Marathi, 90 minutes, on arithmetic, general knowledge and current affairs, intelligence test and Marathi grammar."
              - "At least 40% in the written test is required; below that the candidate is ineligible."
              - "Final merit adds physical and written marks, following the Home Department GR of 10 December 2020."
            source: pc-2022
          - table:
              caption: "Police Sub-Inspector (MPSC 011/2026)"
              head: ["Stage", "Marks", "Rule"]
              rows:
                - ["Combined Prelim", "100", "Screening for the Group-B Main"]
                - ["Group-B (Non-Gazetted) Main exam", "400", "Counted for merit"]
                - ["Physical test", "100", "Qualifying: at least 60 marks to reach the interview; not added to merit"]
                - ["Interview", "40", "Only for those with 60+ in the physical test"]
            source: mpsc-011
          - note: "PSI selection is made on the Main exam marks plus the interview marks."
            source: mpsc-011
      - id: fees
        nav: "Fees"
        eyebrow: "Fee structure"
        heading: "Application fees"
        parts:
          - table:
              caption: "MPSC Group-B Combined Prelim 2026 (includes PSI)"
              head: ["Candidate", "Fee"]
              rows:
                - ["Open", "₹394"]
                - ["Backward class / EWS / orphan / disabled", "₹294"]
                - ["Ex-serviceman — open", "₹394"]
                - ["Ex-serviceman — backward class / EWS / orphan / disabled", "₹294"]
            source: mpsc-011
          - note: "The Pune City constable advertisement does not print the application fee, so no constable fee is shown here. MPSC fees exclude bank charges and are not refundable."
            source: pc-pune
      - id: reservation
        nav: "Reservation"
        eyebrow: "Reservation &amp; certificates"
        heading: "Category and horizontal reservation in a police unit"
        parts:
          - table:
              caption: "Pune City Police Shipai 2024-25 — vacancies by category (1,733 total)"
              head: ["SC", "ST", "VJ-A", "NT-B", "NT-C", "NT-D", "SBC", "OBC", "SEBC", "EWS", "Open", "Total"]
              rows:
                - ["176", "48", "25", "24", "37", "22", "16", "450", "173", "173", "589", "1,733"]
            source: pc-pune
          - table:
              caption: "Horizontal (parallel) reservation inside those posts — Pune City example"
              head: ["Group", "Share", "Posts"]
              rows:
                - ["Women", "30%", "521"]
                - ["Ex-servicemen", "15%", "260"]
                - ["Sportspersons", "5%", "87"]
                - ["Project-affected", "5%", "87"]
                - ["Part-time graduates", "5%", "87"]
                - ["Home Guards", "5%", "87"]
                - ["Police wards (children of police staff)", "3%", "52"]
                - ["Earthquake-affected", "2%", "34"]
                - ["Orphans", "1% of all vacancies", "17"]
            source: pc-pune
          - list:
              - "PSI posts in 011/2026 (310): SC 30, ST 26, VJ-A 13, NT-B 9, NT-C 15, NT-D 8, OBC 82, SBC 7, SEBC 31, EWS 31 and 58 open; of these 93 are for women and 16 for sportspersons."
              - "NCL and EWS certificates for the PSI claim must be for 2025-26 or 2026-27."
            source: mpsc-011
      - id: documents
        nav: "Documents"
        eyebrow: "Document checklist"
        heading: "Papers that decide your claim"
        parts:
          - p: "The unit advertisement does not carry a document list. The rules and GRs the portal publishes for the 2024-25 drive tell you which papers each claim rests on:"
            source: pc-pune
          - list:
              - "HSC (Class 12), or an exam declared equivalent by the School Education Department GR of 14 June 1999."
              - "EWS — the General Administration Department GR for the open-category Economically Weaker Section; SEBC — the Maratha reservation Act."
              - "Horizontal claims — GRs for women (30%), meritorious sportspersons (5%), project-affected and earthquake-affected persons, ex-servicemen (with age and physical-standard concessions), part-time graduate employees, children of police staff, and orphans (1%)."
              - "A small-family declaration under the Maharashtra Civil Services (Declaration of Small Family) Rules, 2005."
              - "Character verification before appointment, under the Home Department GR."
            source: pc-portal
          - list:
              - "For PSI (MPSC): caste proof, EWS certificate and NCL for 2025-26 or 2026-27, disability, ex-serviceman, sports and orphan proofs, and the Maharashtra domicile certificate for open-women, sports, ex-serviceman or orphan claims — PDF, 50–500 KB each."
            source: mpsc-011
      - id: pay
        nav: "Pay &amp; Salary"
        eyebrow: "Salary"
        heading: "Pay scales"
        parts:
          - table:
              head: ["Post", "Pay matrix level"]
              rows:
                - ["Police Sub-Inspector (Group-B)", "S-14: ₹38,600 – ₹1,22,800 + DA and allowances"]
                - ["Assistant Section Officer (same exam)", "S-16: ₹44,900 – ₹1,42,400 + DA and allowances"]
            source: mpsc-011
          - note: "The unit advertisements for Police Shipai do not print the pay scale, so no constable pay figure is shown here. The police portal lists the Finance Department rules that put employees appointed on or after 1 November 2005 under the defined-contribution pension scheme (DCPS, now merged with the NPS)."
            source: pc-portal
      - id: posting
        nav: "Job &amp; Posting"
        eyebrow: "Job profile &amp; posting"
        heading: "Where you serve"
        parts:
          - list:
              - "A constable joins the unit (commissionerate, district or railway police) that advertised the post."
            source: pc-pune
          - p: "Gadchiroli district recruitment is open only to residents of Gadchiroli with a tahsildar's residence certificate; they also take an extra 100-mark written test in the Gondi and Madia languages and are not transferable outside the district (2018 amendment)."
            source: pc-2018
          - p: "PSI recruits are governed by the Police Sub-Inspector (Group-B Non-Gazetted) Recruitment Rules, 1995, and must pass the departmental and language exams and hold the computer-knowledge certificate after appointment."
            source: mpsc-011
    sources:
      - { id: pc-portal, name: "Maharashtra Police — Recruitment portal 2024-25 (rules, GRs, dates, unit advertisements)", url: "https://policerecruitment2025.mahait.org/Forms/Home.aspx", covers: "application dates, list of units, rules and GRs (equivalence, reservations, small family, character verification, pension)", checked: 2026-10-14 }
