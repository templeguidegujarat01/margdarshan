seo_title: "Study in the Netherlands from India: IND Permit and Zoekjaar"
description: "Netherlands from India: the university applies for your MVV and permit (€254), €1,130.77 a month funds in 2026, 16 work hours with a TWV, and a 1-year orientation permit."
lede: "In the Netherlands the university is your recognised sponsor and applies to the IND for your entry visa (MVV) and residence permit. After graduating, the orientation year lets you work freely while you look for a job."
facts:
  - { label: "Permit fee", value: "€254 (paid by the institution)", source: ind_study }
  - { label: "Funds (2026)", value: "€1,130.77 a month", source: ind_amounts }
  - { label: "Work", value: "16 h/week or full time Jun–Aug, with a TWV", source: ind_study }
  - { label: "After graduating", value: "Orientation year: 1 year, work freely", source: ind_orient }
card:
  line: "University applies for your permit; orientation year after"
  psw: "1-year orientation year"
  work: "16 h/week (with TWV) or full-time summer"
  funds: "€1,130.77 a month"
tests:
  - { exam: ielts, need: "Set by each institution for admission; the orientation year asks about IELTS 6.0 for some foreign-degree routes", source: ind_orient }
# Official course searches / institution lists (rendered under "Intakes & courses"). Read 2026-10-29.
find:
  - { label: "Study in NL", by: "Nuffic (Dutch Government)", url: "https://www.studyinnl.org/", what: "Search English-taught bachelor's and master's programmes in the Netherlands." }
  - { label: "Public register recognised sponsors", by: "IND", url: "https://ind.nl/en/public-register-recognised-sponsors", what: "Your institution must be a recognised sponsor to apply for your student residence permit. Check it here." }
pillars:
  language_and_eligibility:
    heading: "Admission first, then the IND"
    parts:
      - points:
          - { t: "Only your recognised sponsor (the university or university of applied sciences) can apply for your student residence permit.", source: ind_study }
      - note: "English requirements for admission are set on each programme page."
  intakes_and_streams:
    heading: "Courses and timing"
    parts:
      - points:
          - { t: "Book your MVV appointment at the Dutch representation within 3 months of the decision; the MVV is valid for 90 days and your passport needs 6 months' validity left.", source: ind_study }
          - { t: "The permit lasts for your study plus 3 months, up to 5 years, as long as you meet the study-progress rules.", source: ind_study }
      - note: "Most bachelor's and master's programmes start in September; some start in February. Deadlines for non-EU students are often earlier — check the programme page."
  tuition_and_living_costs:
    heading: "Money and fees"
    parts:
      - money:
          - { item: "Means of support for study (2026)", cur: EUR, amount: 1130.77, shown: "€1,130.77", per: "month", source: ind_amounts }
          - { item: "Student residence permit fee", cur: EUR, amount: 254, per: "application (institution pays)", source: ind_study }
          - { item: "Orientation year permit fee", cur: EUR, amount: 254, per: "application", source: ind_orient }
          - { item: "NL Scholarship (if awarded)", cur: EUR, amount: 5000, per: "first year, one time", source: studynl_sch }
      - note: "Tuition for non-EEA students (the 'institutional fee') is set by each institution; read it on the programme page."
  global_scholarships:
    heading: "Scholarships for Indian students"
    parts:
      - awards:
          - { name: "NL Scholarship (formerly Holland Scholarship)", by: "Dutch Ministry of Education with Dutch institutions", who: "Non-EEA students starting a full-time bachelor's or master's at a participating institution, without a Dutch degree", gives: "€5,000 in the first year (not full tuition)", url: "https://www.studyinnl.org/finances/holland-scholarship", source: studynl_sch }
          - { name: "Erasmus Mundus Joint Masters", by: "European Union", who: "Students from any country", gives: "Joint master's across EU universities; scholarships for top applicants", url: "https://www.eacea.ec.europa.eu/scholarships/erasmus-mundus-catalogue_en", source: erasmus }
      - points:
          - { t: "Applications for the 2026-27 NL Scholarship opened on 1 November 2025; deadlines are set by each institution.", source: studynl_sch }
  application_funnel:
    heading: "From admission to residence permit"
    parts:
      - steps:
          - { title: "Admission", text: "Get admitted to a programme at a recognised sponsor." }
          - { title: "Prove funds to the institution", text: "€1,130.77 a month for 2026 (the institution checks it for the IND).", source: ind_amounts }
          - { title: "Institution applies", text: "It files the MVV and residence permit together and pays €254.", source: ind_study }
          - { title: "MVV appointment", text: "At the Dutch representation within 3 months of the decision.", source: ind_study }
          - { title: "TB test if asked", text: "Book the GGD within 3 months of getting the permit, with form 7604.", source: ind_study }
  visa_chokepoints:
    heading: "The student permit in short"
    parts:
      - points:
          - { t: "If someone in the Netherlands finances you, they must earn set amounts (for example €2,766.67 a month without holiday allowance if single, from 1 July 2026).", source: ind_amounts }
          - { t: "Your permit can end if you do not meet the study-progress requirements.", source: ind_study }
  post_study_work:
    heading: "Work during and after your course"
    parts:
      - points:
          - { t: "As an employee you need a work permit (TWV) from your employer and must choose: up to 16 hours a week, or full time in June, July and August.", source: ind_study }
          - { t: "Self-employment needs no TWV but you must register with the Chamber of Commerce; a traineeship that is part of the programme needs no TWV.", source: ind_study }
          - { t: "Orientation year: 1 year, not extendable, apply within 3 years of graduating; work freely without a TWV.", source: ind_orient }
          - { t: "Afterwards, a highly skilled migrant job has a reduced salary floor for recent graduates: €3,122 gross a month in 2026.", source: ind_amounts }
visa:
  slug: netherlands-student-permit
  name: "Dutch student residence permit (MVV)"
  short: "Student permit"
  seo_title: "Netherlands Student Visa from India: MVV, IND Permit Steps"
  description: "Dutch MVV and student residence permit for Indians: the university applies, €254 fee, €1,130.77 a month funds, MVV appointment within 3 months, TB test and work rules."
  lede: "You do not apply to the IND yourself: your Dutch institution does it for you, after checking your money and documents."
  facts:
    - { label: "Who applies", value: "Your institution (recognised sponsor)", source: ind_study }
    - { label: "Fee", value: "€254", source: ind_study }
    - { label: "Funds", value: "€1,130.77 a month (2026)", source: ind_amounts }
    - { label: "Permit length", value: "Study + 3 months, max 5 years", source: ind_study }
  official:
    - { label: "IND — Student residence permit (university/HBO)", url: "https://ind.nl/en/residence-permits/study/student-residence-permit-for-university-or-higher-professional-education" }
    - { label: "IND — Required amounts", url: "https://ind.nl/en/required-amounts-income-requirements" }
  sections:
    - id: steps
      nav: Steps
      eyebrow: "Order of work"
      heading: "Step by step"
      parts:
        - steps:
            - { title: "Send documents and funds to the institution", text: "It checks the money (€1,130.77 a month) and your passport.", source: ind_amounts }
            - { title: "Institution files MVV + permit", text: "Fee €254, paid by the institution.", source: ind_study }
            - { title: "MVV at the embassy", text: "Book within 3 months of the decision; the MVV is valid 90 days.", source: ind_study }
            - { title: "Collect the permit and TB test", text: "TB test at the GGD within 3 months if your institution said you need one.", source: ind_study }
    - id: chokepoints
      nav: "Common problems"
      eyebrow: "Where files go wrong"
      heading: "Choke points to check twice"
      parts:
        - points:
            - { t: "Passport with less than 6 months' validity left for the MVV.", source: ind_study }
            - { t: "Taking a job without a TWV, or mixing 16 hours a week with full-time seasonal work.", source: ind_study }
doubts:
  - { q: "How much money do I need to study in the Netherlands?", a: "For 2026 the IND amount for study at a university or university of applied sciences is 1,130.77 euros a month.", source: ind_amounts }
  - { q: "Can international students work in the Netherlands?", a: "Yes, with a work permit (TWV) from the employer: either up to 16 hours a week or full time in June, July and August.", source: ind_study }
  - { q: "What is the orientation year (zoekjaar) in the Netherlands?", a: "A one-year residence permit after graduating, to look for work. It cannot be extended, and you can work freely without a TWV.", source: ind_orient }
  - { q: "Who applies for my Dutch student visa?", a: "Your institution, as recognised sponsor, applies for the MVV and residence permit together and pays the 254 euro fee.", source: ind_study }
