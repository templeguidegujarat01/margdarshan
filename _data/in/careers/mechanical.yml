    heading: "Higher studies"
    parts:
      - prose:
          - "An <strong>M.Tech via GATE</strong> is the standard route into IITs/NITs for research roles, teaching, or a stronger PSU application. Others pursue an <strong>MS abroad</strong> for advanced design or R&amp;D roles, an <strong>Master of Business Administration (MBA)</strong> for a move into operations or management, or focused certifications in areas like Robotics, Mechatronics, EV Technology or simulation software (ANSYS, CATIA) — increasingly the fastest way to stand out for private-sector roles."
