  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Is BA Political Science the same as BA Public Administration?"
            a: "No, though they overlap. Political Science covers political theory, comparative politics, international relations and Indian government broadly. Public Administration focuses more narrowly on how government departments, bureaucracy and administrative machinery actually function day to day."
          - q: "Do I need CUET to get into a good BA Political Science college?"
            a: "For Delhi University and most central universities, yes — CUET (UG) scores decide admission, submitted through the DU CSAS portal or the respective university's counselling system. Many state and private universities instead admit directly on Class 12 marks."
          - q: "Is BA Political Science useful only for UPSC?"
            a: "No. While it is one of the strongest degrees for civil services preparation, graduates also move into law (via a follow-on LLB), journalism, policy research, NGOs and international organisations, political consulting, and diplomacy-adjacent careers."
          - q: "Can I do law after BA Political Science?"
            a: "Yes. A 3-year LLB after any bachelor's degree, including BA Political Science, is a common route, and the subject's overlap with constitutional and legal concepts gives students a head start compared to unrelated degrees."
          - q: "Which is better for civil services — Political Science or History?"
            a: "Neither is objectively better — both are widely used and successful. Political Science suits students more interested in current governance, institutions and the Constitution; History suits those who enjoy tracing long-term change and causation. Choose based on genuine interest, since both are common UPSC optional subjects."
      - note: "*Fee and salary figures are indicative, based on publicly available information as of 2026, and vary significantly by institution and admission cycle — always verify current figures on the official college or university website."
