  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What is Occupational Therapy?"
    parts:
      - overview:
          points:
            - "Occupational Therapy (OT) is a healthcare profession that helps people regain independence in their daily lives after illness, injury, disability or developmental conditions."
            - "Occupational Therapists work with children, adults and elderly patients to improve their ability to perform everyday activities — eating, dressing, writing, studying, working and self-care — with the goal of restoring independence and quality of life."
            - "What's genuinely distinctive about this field's 2026 demand story is that it's driven by three separate, real forces simultaneously: rising awareness of <strong>autism, ADHD and developmental disorders</strong> (fuelling growth in paediatric OT, the field's fastest-growing segment), real need for <strong>stroke and neurological rehabilitation</strong>, and India's genuinely <strong>ageing population</strong> requiring geriatric functional support."
          more:
            - "Reported demand growth of 25% over the past three years reflects all three trends compounding together, not a single hype-driven cause."
