          - myth: "Automobile Engineering diploma holders only work as mechanics."
            fact: "Graduates also work in production, quality control, design assistance and increasingly, EV technology roles at manufacturers — mechanic/service work is one path among several."
          - myth: "This diploma and Mechanical Engineering diploma are basically identical."
            fact: "Automobile Engineering is a specialised, vehicle-focused branch with dedicated automotive subjects — Mechanical Engineering is broader and covers machines and manufacturing across many industries."
