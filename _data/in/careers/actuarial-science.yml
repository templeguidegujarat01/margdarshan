          - label: "Entry-level trainee"
            value: "₹4–6 LPA"
            text: "Even at ACET-plus-a-few-subjects stage, pay outpaces most fresher finance roles."
          - label: "Associate (AIAI)"
            value: "₹12–20 LPA"
            text: "Substantial jump once all 10 Associateship subjects are cleared."
          - label: "Fellow (FIAI)"
            value: "₹30 LPA+"
            text: "Appointed Actuaries and senior consulting roles can go well beyond this."
      - note: "Because IRDAI mandates a Fellow Actuary for the Appointed Actuary role at every registered insurer, and because so few candidates complete all 13 subjects, Fellows remain in persistent short supply — a structural reason salaries stay high at the senior end. Actual pay at every stage still varies by employer (insurer vs. consulting vs. reinsurance), city and company size, so treat these as broad, commonly reported ranges rather than guarantees."
