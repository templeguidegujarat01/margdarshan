  - id: "fees"
    hid: "fees-heading"
    eyebrow: "Wide range — and one genuine ROI warning"
    heading: "Fees & scholarships"
    parts:
      - prose:
          - "Government BDS colleges are genuinely affordable: total fees for the full 5-year programme commonly range from <strong>₹1.5-7 lakh</strong>, including annual fees of roughly ₹25,000-1,50,000. Private colleges vary considerably, with total costs commonly around <strong>₹25-50 lakh</strong>. Here's the honest warning: <strong>management and NRI quota seats can cost ₹50 lakh to over ₹1 crore total</strong> — at typical BDS-level starting salaries, this is genuinely poor return on investment unless paired with a strong MDS specialisation from a top college or plans to practise abroad. Research the specific seat cost carefully before committing."
