  - id: "fees"
    hid: "fees-heading"
    eyebrow: "Very affordable at government colleges"
    heading: "Fees & scholarships"
    parts:
      - prose:
          - "BA Sociology is one of the most affordable degrees in India at government-funded colleges — total fees for the full 3-year course at a DU or central university college are typically in the range of <strong>₹15,000-60,000</strong>, well below professional or private-college courses. Private and deemed universities charge considerably more, often ₹1-3 lakh per year. Merit-based, SC/ST and income-linked scholarships are available at most government institutions. Always confirm current fees directly on your target college's official admission page."
