    hid: "faq-heading"
    alt: true
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Do I need a photography degree to become a professional photographer?"
            a: "No. Photography doesn't have one fixed qualifying degree — many successful photographers are self-taught or diploma-trained, since clients and employers primarily judge your portfolio and technical skill, not a specific certificate."
          - q: "How much does it cost to start a photography career?"
            a: "A capable entry-level camera and lens setup can start from a moderate investment, though professional-grade equipment for specialisations like wedding or wildlife photography costs considerably more over time. Many photographers build their kit gradually as they earn from paid work, rather than buying everything upfront."
          - q: "Which photography specialisation pays the most in India?"
            a: "Wedding photography is often the highest-earning specialisation for independent photographers in India, given the country's large wedding industry, though commercial/product and fashion photography can also pay well, especially for photographers with an established brand client base."
          - q: "Is it possible to make a full-time living as a freelance photographer?"
            a: "Yes, many photographers do, particularly in wedding, commercial and event photography, though it typically takes a few years to build a stable client base and reputation. Income can be seasonal and inconsistent in the early stages, especially in specialisations tied to wedding/event seasons."
          - q: "How much do photographers earn in India?"
            a: "It varies enormously by specialisation, city and reputation. Entry-level assistant or in-house roles typically start modestly, while established independent wedding or commercial photographers with a strong portfolio and client base can earn considerably more, often per project rather than a fixed salary."
      - note: "*Income figures are indicative, based on publicly available information as of 2026, and vary significantly by specialisation, city and reputation."
