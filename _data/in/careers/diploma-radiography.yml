  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What is Diploma in Radiography?"
    parts:
      - overview:
          points:
            - "Diploma in Radiography (sometimes called Diploma in X-Ray Technology or Radio-Imaging Technology) is a paramedical diploma that trains students to operate diagnostic imaging equipment — primarily X-ray machines, with exposure to CT and Magnetic Resonance Imaging (MRI) basics — and to correctly position patients, take images, and follow radiation safety protocols."
            - "It's typically a <strong>2-year</strong> course, offered at government and private paramedical institutes."
            - "Operating X-ray and radiation-emitting equipment in India falls under the <strong>Atomic Energy Regulatory Board (AERB)</strong>, which sets certification requirements for radiation equipment operators."
          more:
            - "Recognised diploma programmes are generally structured around meeting these requirements, making proper institute selection genuinely important for this course."
