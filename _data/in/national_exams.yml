  # ---------------------------------------------------------------- NEET UG
  - slug: neet-ug
    short: "NEET UG"
    stream: medical
    body: "National Testing Agency (NTA)"
    eyebrow: "Entrance Exam · Medical · 2026 cycle"
    title: "NEET UG — eligibility, marking, reservation & fees"
    lede: "The single national entrance for MBBS, BDS, BAMS, BUMS, BSMS and BHMS in every medical institution in India, including AIIMS and JIPMER."
    coaching_href: "coaching-neet.html"
    colleges_href: "colleges-mbbs.html"
    facts:
      - { label: "Conducted by", value: "National Testing Agency (NTA)", source: neet-ib }
      - { label: "Mode", value: "Pen and paper, one shift", source: neet-ib }
      - { label: "Paper", value: "180 questions · 720 marks · 3 hours", source: neet-ib }
      - { label: "2026 exam", value: "Re-held on Sun 21 June 2026", source: neet-re }
    official:
      - { label: "neet.nta.nic.in", url: "https://neet.nta.nic.in/" }
      - { label: "Information Bulletin 2026 (PDF)", url: "https://cdnbbsr.s3waas.gov.in/s37bc1ec1d9c3426357e69acd5bf320061/uploads/2026/02/202602231394640855.pdf" }
    sections:
      - id: overview
        nav: "Overview"
        eyebrow: "Overview &amp; governing bodies"
        heading: "Who runs NEET UG, and what it decides"
        parts:
          - p: "NEET (UG) is required by <strong>Section 14 of the National Medical Commission Act, 2019</strong> (and the matching sections of the NCISM Act, 2020 and NCH Act, 2020) as the one uniform entrance for undergraduate medical courses in all medical institutions. <strong>NTA</strong> has conducted it since 2019. It has also been the entrance for MBBS at AIIMS and JIPMER since 2020."
            source: neet-ib
          - list:
              - "Courses: MBBS, BDS, BAMS, BUMS, BSMS and BHMS."
              - "NEET (UG) results are also used for B.Sc. (Hons) Nursing and for BVSc &amp; AH seats under the 15% VCI quota."
              - "NTA conducts the exam, declares the result and issues the All India Rank. Merit lists, domicile and counselling belong to the admitting and state authorities."
              - "Counselling: the <strong>Medical Counselling Committee (MCC)</strong> for the 15% All India Quota in MBBS/BDS; <strong>AACCC</strong> for the All India Quota in BAMS/BUMS/BSMS and BHMS; state authorities for state quotas."
            source: neet-res
          - table:
              caption: "NEET (UG) 2026 calendar"
              head: ["Event", "Date"]
              rows:
                - ["Online application", "8 Feb – 8 Mar 2026"]
                - ["Correction window", "10 – 12 Mar 2026"]
                - ["Exam as first scheduled", "Sun 3 May 2026, 2:00 – 5:00 PM"]
            source: neet-ib
          - p: "NTA then held a <strong>re-examination on Sunday 21 June 2026</strong> (2:00 – 5:15 PM including formalities), in pen-and-paper mode in 13 languages, with no fee charged to candidates (public notice of 15 May 2026)."
            source: neet-re
          - p: "The result came on <strong>16 July 2026</strong>: close to 20 lakh candidates appeared at 5,440 centres and 11.21 lakh qualified."
            source: neet-res
          - warn: "The NEET (UG) 2027 Information Bulletin was not yet published on 14 October 2026, so this page describes the 2026 cycle."
      - id: eligibility
        nav: "Eligibility"
        eyebrow: "Eligibility criteria"
        heading: "Age, subjects and the qualifying percentile"
        parts:
          - list:
              - "<strong>Minimum age:</strong> 17 years on or before 31 December of the exam year — for NEET 2026, born on or before 31 December 2009."
              - "<strong>No upper age limit</strong> (NMC letter of 9 March 2022), and the bulletin sets no cap on the number of attempts."
              - "<strong>Subjects:</strong> Physics, Chemistry, Biology/Biotechnology and English in Class 12 (or equivalent). Since NMC's November 2023 public notice, students who studied these as additional subjects after Class 12 from a recognised board may also sit."
              - "Students whose Class 12 result is awaited can sit, but cannot be admitted unless they have passed by the first counselling round."
              - "Indian citizens and OCI holders who want to study medicine abroad must also qualify NEET (UG)."
            source: neet-ib
          - table:
              caption: "Qualifying percentile for admission (marks at or above this percentile)"
              head: ["Category", "Minimum percentile"]
              rows:
                - ["General, Gen-EWS", "50th"]
                - ["SC, ST, OBC", "40th"]
                - ["PwBD — General / Gen-EWS", "45th"]
                - ["PwBD — SC / ST / OBC-NCL", "40th"]
            source: neet-ib
          - note: "The Central Government, with NMC and the other councils, may lower these percentiles for a year if too few candidates qualify."
            source: neet-ib
      - id: scheme
        nav: "Exam scheme"
        eyebrow: "Exam scheme &amp; marking matrix"
        heading: "180 compulsory MCQs, +4 / −1"
        parts:
          - table:
              caption: "NEET (UG) 2026 pattern — pen and paper, 3 hours"
              head: ["Subject", "Questions", "Marks"]
              rows:
                - ["Physics", "45", "180"]
                - ["Chemistry", "45", "180"]
                - ["Biology (Botany &amp; Zoology)", "90", "360"]
                - ["Total", "180", "720"]
            source: neet-ib
          - table:
              caption: "Marking matrix"
              head: ["Response", "Marks"]
              rows:
                - ["Correct or most appropriate answer", "+4"]
                - ["Incorrect option", "−1"]
                - ["Unanswered", "0"]
            source: neet-ib
          - list:
              - "All 180 questions are compulsory — there are no optional questions (NMC letter of 5 December 2025)."
              - "Every question is an MCQ with four options and one correct or best answer. There is no numerical-value section."
              - "If more than one option is correct, +4 goes to anyone who marked a correct one; if a question is wrong or dropped, all candidates get +4."
              - "13 mediums: Assamese, Bengali, English, Gujarati, Hindi, Kannada, Malayalam, Marathi, Odia, Punjabi, Tamil, Telugu and Urdu."
              - "PwD/PwBD candidates with a physical limitation to write get one extra hour, whether or not they use a scribe."
            source: neet-ib
      - id: reservation
        nav: "Reservation"
        eyebrow: "Reservation thresholds"
        heading: "Central reservation — and why state seats differ"
        parts:
          - table:
              caption: "15% All India Quota, central institutes and central universities"
              head: ["Category", "Share of seats"]
              rows:
                - ["SC", "15%"]
                - ["ST", "7.5%"]
                - ["OBC-NCL (central list)", "27%"]
                - ["Gen-EWS", "10%"]
                - ["PwBD", "5% (horizontal)"]
            source: neet-ib
          - list:
              - "This applies to the 15% All India Quota, central institutes (ABVIMS &amp; RML, VMMC &amp; Safdarjung, ESIC), DU, AMU, BHU, AIIMS and JIPMER."
              - "<strong>State quota seats</strong> (and private colleges under state governments) follow the state's own reservation policy and eligibility rules."
              - "Creamy-layer OBC candidates, and OBCs not in the central list, should choose General."
            source: neet-ib
      - id: fees
        nav: "Registration &amp; fees"
        eyebrow: "Step-by-step registration &amp; form costs"
        heading: "How to apply, and what it costs"
        parts:
          - list:
              - "<strong>Step 1 — Register:</strong> on neet.nta.nic.in; create a password and security question and note the application number."
              - "<strong>Step 2 — Complete the form:</strong> personal details, question-paper medium, exam cities and education; take a live photograph and upload a passport photo taken after 1 January 2026, signature, left- and right-hand finger and thumb impressions, Class 10 marksheet and certificate, and category / PwBD certificates if they apply."
              - "<strong>Step 3 — Pay:</strong> online by card, net banking or UPI, by the last date (8 March 2026, 11:50 PM, for 2026)."
            source: neet-ib
          - table:
              caption: "NEET (UG) 2026 application fee"
              head: ["Category", "Centre in India", "Centre outside India"]
              rows:
                - ["General", "₹1,700", "₹9,500"]
                - ["Gen-EWS / OBC-NCL", "₹1,600", "₹9,500"]
                - ["SC / ST / PwBD / PwD / Third gender", "₹1,000", "₹9,500"]
            source: neet-ib
          - note: "Unlike JEE Main, the NEET fee does not change with gender."
            source: neet-ib
          - note: "No fee was charged for the 21 June 2026 re-examination."
            source: neet-re
      - id: horizons
        nav: "Careers &amp; institutions"
        eyebrow: "In-hand career horizons &amp; mapped institutions"
        heading: "Where a NEET rank takes you — and a doctor's government pay"
        parts:
          - list:
              - "<strong>Through MCC:</strong> 15% All India Quota MBBS/BDS seats in government colleges of the states; 100% MBBS at AIIMS; JIPMER, AMU, BHU, DU and IP University seats; ESIC seats; Deemed Universities; and B.Sc. Nursing at selected central institutes. MCC only registers candidates for AFMC."
              - "<strong>Through state authorities:</strong> the remaining state quota seats in government and private colleges."
            source: neet-ib
          - table:
              caption: "Government pay for MBBS doctors — UPSC Combined Medical Services Examination 2026"
              head: ["Post (2026 vacancies)", "Pay Matrix level", "Basic pay range"]
              rows:
                - ["Medical Officer, General Duty, Central Health Service (864)", "Level 10", "₹56,100 – ₹1,77,500 + NPA"]
                - ["Assistant Divisional Medical Officer, Railways (450)", "Level 10, Group A Junior Scale", "₹56,100 – ₹1,77,500 + NPA"]
                - ["General Duty Medical Officer, NDMC (14)", "Level 10", "₹56,100 – ₹1,77,500 + restricted NPA"]
                - ["General Duty Medical Officer Grade-II, MCD (30)", "Level 10, first cell", "Starts at ₹56,100 + NPA and allowances"]
            source: cms
          - table:
              caption: "Promotion ladder for an NDMC General Duty Medical Officer"
              head: ["Grade", "Pay Matrix level", "Range"]
              rows:
                - ["Senior Medical Officer", "Level 11", "₹67,700 – ₹2,08,700"]
                - ["Chief Medical Officer", "Level 12", "₹78,800 – ₹2,09,200"]
                - ["CMO (Non-functional Selection Grade)", "Level 13", "₹1,18,500 – ₹2,14,100"]
                - ["Senior Administrative Grade", "Level 14", "₹1,44,200 – ₹2,18,200"]
            source: cms
          - note: "These are basic pay ranges. In-hand pay also depends on allowances (DA, HRA, NPA) that change over time and are not stated as amounts in the notice. Private practice is not allowed in these posts."
            source: cms
          - links:
              - { label: "MBBS (Doctor)", url: "mbbs.html" }
              - { label: "BDS (Dentist)", url: "bds.html" }
              - { label: "BAMS", url: "bams.html" }
              - { label: "BHMS", url: "bhms.html" }
              - { label: "MBBS college finder", url: "colleges-mbbs.html" }
              - { label: "NEET coaching finder", url: "coaching-neet.html" }
