    amount: "₹2,500 instead of ₹3,500"
    who: "SC, ST and PwBD candidates."
    apply: "Choose your category in the NEET-PG form on the NBEMS portal; the fee is not refunded or carried forward."
    stages: [grad]
    source: npg26
  - id: pg-stipend
    kind: stipend
    name: "PG resident stipend"
    by: "Your medical college, under NMC's PGMER 2023"
