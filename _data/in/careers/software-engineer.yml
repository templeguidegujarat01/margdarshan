  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "What is the real difference between service company and product company salaries?"
            a: "It's substantial and reported to be widening. At 5 years of experience, engineers at IT services companies like TCS or Infosys commonly earn ₹12-18 LPA, while engineers at Indian product companies earn ₹22-38 LPA, and those at FAANG India offices earn ₹45-70 LPA for the same experience level. Company type is reported as a bigger predictor of salary than college brand or years of experience alone."
          - q: "Do I need a Computer Science degree to become a software engineer?"
            a: "Not strictly. A B.Tech in CSE/IT or a BCA are the most common routes, but self-taught engineers with a strong project portfolio and demonstrated coding ability are increasingly hired directly, especially at startups and through skill-based hiring pipelines. Employers report that practical ability and interview performance matter more than the specific degree or college name."
          - q: "How important is DSA for getting a software engineering job?"
            a: "Extremely important, especially for product companies and FAANG-level roles. Data Structures & Algorithms (DSA) is reported as the primary technical filter in interviews — candidates aiming for ₹20+ LPA roles are commonly expected to have solved 300+ practice problems with strong performance on medium and hard-level questions, alongside System Design (HLD/LLD) knowledge for more senior roles."
          - q: "What is the fastest way to increase my salary as a software engineer?"
            a: "Switching from a service company to a product company early in your career — often around year 2 or 3 — is described as the single biggest salary lever in the Indian tech industry, letting engineers skip years of slower service-company salary growth. Building genuine skills in high-demand areas like AI/ML, distributed systems or cloud platforms while employed is what makes that switch possible."
          - q: "Is the software engineering job market oversaturated in 2026?"
            a: "The market has grown very large by headcount, and the mass layoffs of 2022-23 at global tech companies have largely been absorbed, with hiring resuming across most segments by 2026. What's changed is that the market has become more differentiated — a plain degree with no portfolio, no DSA practice and no specialisation faces more competition, while candidates with genuine skills, especially AI-adjacent ones, are reported to command a real salary premium."
      - note: "Figures are indicative (2026) — confirm on the official college or authority website."
        class: "table-note mt-lg"
