# Delaware (USA 50-state licensure portal, 2026-10-22). Schema: _data/us/state_index.yml. Boards tier: the
# licensing boards for lawyers, physicians, CPAs and nurses, copied from the national directories of state boards (NCBE,
# FSMB, NASBA, NCSBN). Diploma, state test, tuition, aid, jobs and apprenticeship blocks are still in the Phase 11 queue;
# the page prints only the blocks that exist.
name: "Delaware"
abbr: DE
checked: 2026-10-22
review_by: 2027-04-22
lede: "In Delaware, the Board of Bar Examiners of the Delaware Supreme Court handles bar admission for lawyers, the Delaware Board of Medical Licensure and Discipline licenses physicians, the Delaware State Board of Accountancy licenses CPAs and the Delaware Board of Nursing licenses registered nurses."

boards:
  # 50-state portal (2026-10-22): bar admission agency (NCBE jurisdiction page), medical board(s) (FSMB directory),
  # board of accountancy (NASBA directory), board of nursing (NCSBN member page). Links checked 2026-10-22.
  law: { body: "Board of Bar Examiners of the Delaware Supreme Court", url: "https://courts.delaware.gov/bbe/", stat: "State exam", exam: "Delaware's own bar exam with the MBE and MPT.", note: "MPRE required (passing score 85). NextGen UBE from February 2028.", src: ncbe_de }
  medicine:
    src: fsmb_boards
    boards:
      - { body: "Delaware Board of Medical Licensure and Discipline", url: "https://dpr.delaware.gov/boards/medicalpractice/" }
  cpa:
    src: nasba_boards
    boards:
      - { body: "Delaware State Board of Accountancy", url: "https://dpr.delaware.gov/boards/accountancy/" }
  nursing:
    src: ncsbn_de
    boards:
      - { body: "Delaware Board of Nursing", url: "https://dpr.delaware.gov/boards/nursing/" }
