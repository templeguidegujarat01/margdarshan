  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What is Mechanical Engineering?"
    parts:
      - overview:
          points:
            - "Mechanical Engineering is a 4-year engineering degree focused on designing, building, testing and maintaining machines, engines, tools and mechanical systems — everything from a car's engine to a factory's production line to a power plant's turbines."
            - "Its foundation rests on four pillars: engineering mechanics, thermodynamics, fluid mechanics and machine design."
            - "The field has genuinely modernised in the last decade."
          more:
            - "Mechanical engineers today increasingly work alongside software and electronics teams on <strong>Industry 4.0, automation, electric vehicles and robotics</strong> — the core physics hasn't changed, but the tools and the collaborations around it have."
  - id: "who"
    hid: "who-heading"
    alt: true
    eyebrow: "Fit check"
    heading: "Who should choose Mechanical Engineering"
    parts:
      - fit:
          match:
            - "Genuinely enjoy understanding how physical machines and systems work, not just how software behaves."
            - "Want a realistic shot at government/PSU stability through GATE, alongside a private-sector option."
            - "Are drawn to automobiles, manufacturing, energy, aerospace or defence rather than pure software."
          mismatch:
            - "Expect private-sector fresher salaries similar to CSE — the honest starting range is meaningfully lower at most colleges."
            - "Want a fully remote-friendly career — many core mechanical roles involve plant, site or shop-floor presence."
            - "Aren't willing to add skills like CAD/simulation software, automation or GATE prep — a plain degree alone increasingly limits your options."
  - id: "eligibility"
