# Journey Blueprint — Agricultural Officer (B.Sc Agriculture → Agricultural Field Officer). Printed on journey-agricultural-officer.html (_includes/journey-doubts.html).
# Rules, classes and the money items / sources several careers share: _data/in/journey_common.yml.
# `money_defs` / `sources` below are used only by this career. Check: node scripts/check-journey-matrix.mjs
id: agricultural-officer
v: 2
name: "Agricultural Officer (B.Sc Agriculture → Agricultural Field Officer)"
search: ["agricultural officer", "agriculture officer", "agricultural field officer", "agriculture field officer", "agricultural extension officer", "agronomist"]
page: "agriculture-science.html"
roadmap: "roadmaps/agriculture-science.html"
doubts_page: "journey-agricultural-officer.html"
gate: "Class 12 with at least three of Physics, Chemistry, Mathematics, Biology and Agriculture → CUET (UG) for ICAR's All India Quota seats in 13 agriculture and allied degrees → a 4-year degree such as B.Sc Agriculture → for example IBPS's Agricultural Field Officer (Scale I) in public sector banks, age 20–30."
gate_source: [icar-couns, icar-ug, ibps-so16]
core:
  what:
    text: "Agricultural officers bring farm science and farm finance to the field. Public sector banks, for example, recruit Agricultural Field Officers (Scale I) through IBPS from graduates of agriculture and allied 4-year degrees."
    source: ibps-so16
  day:
    - "Visit farms and villages; meet farmers and groups."
    - "Check crops, land and records for loans, insurance or schemes."
    - "Keep files, reports and follow-ups in the office."
  pay:
    - { level: "Agricultural Field Officer, Scale I (IBPS CRP SPL-XVI)", value: "Basic ₹48,480 – ₹85,920 + bank allowances", source: ibps-so16 }
  routes:
    - { title: "ICAR All India Quota through CUET (UG)", text: "13 UG programmes in agriculture and allied sciences at State and Central Agricultural Universities, ICAR deemed universities and central universities with agriculture faculties. Register for CUET (UG) on the NTA portal; counselling is on icarcounseling.com after the result.", source: [icar-ug, icar-couns] }
    - { title: "Bank Agricultural Field Officer", text: "A 4-year degree in Agriculture, Horticulture, Animal Husbandry, Veterinary Science, Dairy Science, Fishery Science, Agricultural Engineering, Food Technology, Agri-Business Management and other listed subjects. 370 posts in the 2027-28 indent (updated 20 Jul 2026).", source: [ibps-so16, ibps-so16-vac] }
  cost_time:
    - { label: "Degree for bank AFO", value: "A 4-year degree (graduation)", source: ibps-so16 }
    - { label: "IBPS SO fee", value: "₹850 · ₹175 for SC / ST / PwBD (both include GST)", source: ibps-so16 }
    - { label: "IBPS SO 2026 cycle", value: "Apply 1–21 Jul 2026 · prelims Aug · mains Nov · interview Nov / Dec 2026", source: ibps-so16 }
  cost_note: "Agricultural university fees differ by university; ICAR publishes them during counselling, so we print no national figure."
  challenges:
    - text: "Bank AFO needs a <strong>4-year</strong> degree in the listed subjects."
      source: ibps-so16
    - text: "IBPS SO cuts <strong>one-fourth of a question's marks</strong> for a wrong answer, and you must clear every prelims test separately."
      source: ibps-so16
    - text: "Only 370 AFO posts across 11 public sector banks in the latest indent."
      source: [ibps-so16, ibps-so16-vac]
  not_for:
    - "You want a city desk job — this work is in villages and fields."
    - "You dislike Biology and Chemistry."
    - "You do not want to talk with farmers every day."
journey:
  - stages: [c8, c9]
    title: "Science and the soil"
    do:
      - text: "Agriculture degrees under ICAR's quota need Class 12 with at least three core subjects among Physics, Chemistry, Mathematics, Biology and Agriculture."
        source: icar-couns
    doubts:
      - q: "What does an agricultural officer do?"
        a: "Takes farm science and farm finance to farmers. Public sector banks, for example, recruit Agricultural Field Officers (Scale I) through IBPS from graduates of agriculture and allied 4-year degrees."
        next: "Read the Routes list above."
        source: ibps-so16
      - q: "Can I study agriculture after Class 12 Biology?"
        a: "Yes. ICAR's quota needs at least three core subjects among Physics, Chemistry, Mathematics, Biology and Agriculture — so PCB qualifies."
        next: "Check each programme's subject rule in the CUET (ICAR-UG) bulletin."
        source: icar-couns
  - stages: [c10]
    title: "Choose Science"
    do:
      - text: "Take Science with Biology or Mathematics; Agriculture as a Class 12 subject also counts as a core subject."
        source: icar-couns
    stream: "Science — PCB, PCM or PCMB (Agriculture also counts)."
    doubts:
      - q: "Should I take PCB or PCM for agriculture?"
        a: "Either can work. ICAR needs at least three core subjects among Physics, Chemistry, Mathematics, Biology and Agriculture; each programme's exact subject rule is in the CUET (ICAR-UG) bulletin on icar.org.in."
        next: "Pick the group you score best in."
        source: icar-couns
  - stages: [c11, c12]
    title: "CUET (UG) for ICAR seats"
    do:
      - text: "ICAR's All India Quota seats in 13 UG programmes are filled through CUET (UG); 2026 registration ran 3–30 Jan 2026 on cuet.nta.nic.in."
        source: icar-ug
      - text: "ICAR counselling opens on icarcounseling.com after NTA declares the CUET (UG) result; the brochure and final seat matrix are posted there."
        source: icar-couns
    exams:
      - { name: "CUET (UG) 2026", when: "11–31 May 2026 (bulletin schedule)", source: cuet26 }
    money: [csss]
    doubts:
      - q: "Is there a separate ICAR entrance exam for agriculture?"
        a: "No. For 2026-27, admission to ICAR All India Quota seats in 13 UG programmes is through CUET (UG), conducted by NTA."
        next: "Register for CUET (UG) in January."
        source: icar-ug
      - q: "Where is ICAR counselling done?"
        a: "On icarcounseling.com, which opens after NTA declares the CUET (UG) result. Registration, rank, choice filling and seat allotment all happen there."
        next: "Keep checking the portal after the CUET result."
        source: icar-couns
      - q: "Which colleges come under ICAR's quota?"
        a: "State Agricultural Universities, Central Agricultural Universities, ICAR deemed-to-be universities and central universities with agriculture faculties."
        next: "See the seat matrix on icarcounseling.com."
        source: icar-couns
  - stages: [ug]
    title: "In the degree"
    do:
      - text: "Bank AFO accepts 4-year degrees in Agriculture, Horticulture, Animal Husbandry, Veterinary Science, Dairy Science, Fishery Science, Pisciculture, Agri. Marketing and Cooperation, Co-operation and Banking, Agro-Forestry, Forestry, Agricultural Biotechnology, B.Tech Biotechnology, Food Science, Agriculture Business Management, Food Technology, Dairy Technology, Agricultural Engineering, Sericulture and Fisheries Engineering."
        source: ibps-so16
    doubts:
      - q: "Which degrees qualify for bank Agricultural Field Officer?"
        a: "4-year degrees in Agriculture, Horticulture, Animal Husbandry, Veterinary Science, Dairy Science, Fishery Science, Food Technology, Agricultural Engineering, Agri-Business Management, Forestry and the other subjects listed by IBPS."
        next: "Check your degree title against the IBPS list."
        source: ibps-so16
      - q: "Can a B.Tech Biotechnology or Food Technology graduate become an AFO?"
        a: "Yes. B.Tech Biotechnology, Food Science and Food Technology are on IBPS's list of 4-year degrees for Agricultural Field Officer."
        next: "Prepare the Professional Knowledge paper in agriculture."
        source: ibps-so16
      - q: "Does a 3-year degree work for bank AFO?"
        a: "No. IBPS asks for a 4-year degree (graduation) in the listed agriculture and allied subjects."
        next: "Choose a 4-year programme."
        source: ibps-so16
  - stages: [grad]
    title: "IBPS Specialist Officer exam"
    do:
      - text: "Prelims: English, Reasoning, Quantitative Aptitude (25 marks each) and Professional Knowledge (50 marks) — 125 marks in 80 minutes; you must clear each test."
        source: ibps-so16
      - text: "Mains and interview count 80:20 in the final merit."
        source: ibps-so16
    exams:
      - { name: "IBPS SO (CRP SPL-XVI) Main", when: "November 2026 (tentative)", source: ibps-so16 }
    money: [ibps-so-fee]
    doubts:
      - q: "What is the age limit for bank Agricultural Field Officer?"
        a: "20 to 30 years on 1 July 2026 for CRP SPL-XVI, with category relaxations."
        next: "Count the cycles your age allows."
        source: ibps-so16
      - q: "Is there negative marking in IBPS SO?"
        a: "Yes. One-fourth of the marks of a question is deducted for each wrong answer."
        next: "Avoid wild guesses."
        source: ibps-so16
      - q: "How is the final AFO merit list made?"
        a: "From the Main exam and the interview in the ratio 80:20."
        next: "Prepare for the interview early."
        source: ibps-so16
      - q: "What does a bank AFO earn?"
        a: "Scale I basic pay ₹48,480 rising to ₹85,920, plus the allowances of the bank you join."
        next: "Compare banks' postings when you fill preferences."
        source: ibps-so16
      - q: "How many AFO vacancies are there?"
        a: "IBPS's updated list of 20 July 2026 shows 370 Agricultural Field Officer posts across the participating public sector banks for 2027-28."
        next: "Vacancies can change; check the latest list."
        source: ibps-so16-vac
  - stages: [work]
    title: "Already working?"
    do:
      - text: "IBPS SO uses an age limit, not a 'fresh graduate' rule: 20 to 30 on the cut-off date."
        source: ibps-so16
    doubts:
      - q: "I have a B.Sc Agriculture and a job. Can I still apply for AFO?"
        a: "Yes, if you are within the age limit (20 to 30, with category relaxations) on the cut-off date."
        next: "Watch for the next IBPS SO notice around July."
        source: ibps-so16
board_note: "Every board counts. What matters is having at least three core subjects among Physics, Chemistry, Mathematics, Biology and Agriculture."
board_source: icar-couns
