# USA Edition — occupations (labor-market destinations), one record per BLS
# Occupational Outlook Handbook (OOH) profile. Pathways (_data/us/pathways.yml)
# point at these ids; pages never invent a "pathway salary".
#
# Data vintage: see _data/us/sources.yml → bls_vintage (May 2025 wages,
# 2025–35 projections). All values copied from the OOH page in `ooh_url`
# on `last_verified`. Do not round, convert or compute new numbers from them.
#
# Fields
#   title           BLS occupation title (the one the pay figure belongs to)
#   soc             SOC code(s) used by BLS
#   onet            O*NET-SOC codes, each checked on onetonline.org. O*NET can
#                   differ from SOC (e.g. counselors: SOC 21-1018 → O*NET 21-1011 + 21-1014)
#   ooh_url         BLS OOH profile
#   pay             median annual wage (USD) for `title`
#   group           present when the OOH profile covers more than `title`;
#                   jobs / outlook / openings below then describe the GROUP,
#                   and pages must say so (e.g. "for software developers, QA
#                   analysts and testers combined")
#   group_pay       median annual wage for the whole group
#   sub_pay         extra published medians for detailed occupations in the group
#   education       BLS "typical entry-level education"
#   experience      BLS "work experience in a related occupation" (omitted when "None")
#   jobs            employment, 2025
#   outlook_pct     projected change 2025–35, percent
#   outlook_label   BLS wording for that change
#   change          projected numeric employment change 2025–35
#   openings        projected annual openings, average over the decade
#   notes           facts from the OOH page worth showing (licensing, clearances …)

