  nclex-rn:
    name: "NCLEX-RN"
    short: "NCLEX-RN"
    by: "National Council of State Boards of Nursing (NCSBN)"
    stage: licensing
    status: current
    grades: "Graduates of RN programs (bachelor's, associate degree or hospital diploma)"
    lede: "The NCLEX-RN is the national exam U.S. boards of nursing use to license registered nurses. It is computer adaptive: 85 to 150 items in up to five hours, scored pass/fail. The fee is $200, rising to $350 on February 1, 2027."
    facts:
      - { label: "Items", value: "85–150", note: "Computer adaptive" }
      - { label: "Time limit", value: "5 hours" }
      - { label: "Fee", value: "$200", note: "$350 from Feb 1, 2027" }
      - { label: "Retake wait", value: "45 days" }
    sections:
      who:
        points:
          - { t: "Each nursing regulatory body sets its own eligibility rules. Apply to the board where you want a license, then register and pay with Pearson.", src: nclex_faqs }
          - { t: "Once the board makes you eligible you get an Authorization to Test (ATT); test within its dates (about 90 days on average, never extended).", src: nclex_faqs }
          - { t: "A registration stays open 365 days waiting for the board; if you are not made eligible in that time, the fee is lost.", src: nclex_registration }
      format:
        intro: "The Next Generation NCLEX (since April 1, 2023) measures clinical judgment with newer item types. The 2026 RN Test Plan runs from April 1, 2026 to March 31, 2029."
        source: nclex_rn_plan
        points:
          - { t: "Every candidate answers at least 85 items and at most 150 in the five-hour limit; the minimum-length exam includes three clinical judgment case studies of six items each.", src: nclex_rn_plan }
          - { t: "Content follows four Client Needs categories (Safe and Effective Care Environment, Health Promotion and Maintenance, Psychosocial Integrity, Physiological Integrity), for example Management of Care 15–21% and Pharmacological and Parenteral Therapies 11–17%.", src: nclex_rn_plan }
          - { t: "You cannot skip items or go back: each answer is used to pick the next item.", src: nclex_faqs }
      scoring:
        points:
          - { t: "Pass or fail. The computer stops when it is 95% sure you are above or below the passing standard; if you stay close to it, you get the maximum number of items. Running out of time before the minimum number of items is a fail.", src: nclex_cat }
          - { t: "The RN passing standard is 0.00 logits, kept through March 31, 2029.", src: nclex_passing }
          - { t: "Official results come only from your board, within six weeks. Where the board takes part, unofficial Quick Results are available (for a fee) two business days after the exam.", src: nclex_results }
      fees:
        intro: "For candidates seeking a U.S. license:"
        source: nclex_fees
        table:
          head: ["Item", "Fee"]
          rows:
            - ["Registration, until January 31, 2027", "$200"]
            - ["Registration, from February 1, 2027", "$350"]
            - ["Change of nursing regulatory body after registering", "$50"]
            - ["Change of exam type (RN/PN) after registering", "$50"]
        points:
          - { t: "Fees are not refunded for any reason, including a missed appointment or a change made inside 24 business hours.", src: nclex_fees }
          - { t: "The NCLEX is on the VA's list of approved licensure exams, so eligible veterans and dependents can be reimbursed.", src: nclex_fees }
      dates:
        points:
          - { t: "No national dates: test all year at any Pearson Professional Testing center, whichever state you are applying to.", src: nclex_faqs }
          - { t: "If you do not pass, you can retake after 45 days, up to eight times a year where the board allows; some boards set stricter limits.", src: nclex_results }
      practice:
        points:
          - { t: "Free from NCSBN: a sample pack (three RN and two PN case studies), an exam preview, the 2026 Candidate Bulletin and the Pearson candidate tutorial.", src: nclex_prepare }
    license: nursing
    used_by:
      need: [registered-nurse, nurse-practitioner, licensed-practical-nurse]
      links:
        - { label: "NCLEX-PN", href: "us/exams/nclex-pn/", text: "The exam for licensed practical and vocational nurses" }
    page:
      title: "NCLEX-RN: 85–150 Items, 5 Hours, $200 Fee ($350 from Feb 2027), Pass/Fail Rules"
      description: "NCSBN's NCLEX-RN for registered nurses: computer adaptive, 85–150 items in 5 hours, 2026 test plan, passing standard 0.00 logits, $200 fee rising to $350 on February 1, 2027, 45-day retake wait."
