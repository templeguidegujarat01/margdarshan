# West Virginia (USA 50-state licensure portal, 2026-10-22). Schema: _data/us/state_index.yml. Boards tier: the
# licensing boards for lawyers, physicians, CPAs and nurses, copied from the national directories of state boards (NCBE,
# FSMB, NASBA, NCSBN). Diploma, state test, tuition, aid, jobs and apprenticeship blocks are still in the Phase 11 queue;
# the page prints only the blocks that exist.
name: "West Virginia"
abbr: WV
checked: 2026-10-22
review_by: 2027-04-22
lede: "In West Virginia, the West Virginia Board of Law Examiners handles bar admission for lawyers, the West Virginia Board of Medicine and West Virginia Board of Osteopathic Medicine license physicians, the West Virginia Board of Accountancy licenses CPAs and the West Virginia Board of Registered Nurses licenses registered nurses."

boards:
  # 50-state portal (2026-10-22): bar admission agency (NCBE jurisdiction page), medical board(s) (FSMB directory),
  # board of accountancy (NASBA directory), board of nursing (NCSBN member page). Links checked 2026-10-22.
  law: { body: "West Virginia Board of Law Examiners", url: "https://www.courtswv.gov/", stat: "UBE", exam: "Uniform Bar Exam (MBE, MEE and MPT).", note: "MPRE required (passing score 80). Moving to the NextGen UBE; NCBE’s page gives two different first dates, so check with the board.", src: ncbe_wv }
  medicine:
    src: fsmb_boards
    boards:
      - { body: "West Virginia Board of Medicine", url: "https://wvbom.wv.gov/" }
      - { body: "West Virginia Board of Osteopathic Medicine", url: "https://www.wvbdosteo.org/" }
  cpa:
    src: nasba_boards
    boards:
      - { body: "West Virginia Board of Accountancy", url: "https://www.boa.wv.gov/" }
  nursing:
    src: ncsbn_wv
    boards:
      - { body: "West Virginia Board of Registered Nurses", url: "https://wvrnboard.wv.gov/Pages/default.aspx" }
