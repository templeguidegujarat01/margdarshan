# Russia — study abroad sheet (shape: _data/in/abroad_common.yml header). Read 2026-10-29 (NMC, MEA, Russian universities, education-in-russia).
# No INR conversion for RUB: the ECB stopped its RUB reference rate in 2022 and FBIL's RUB/INR rate is subscription-only.
id: russia
name: Russia
short: Russia
region: Europe
