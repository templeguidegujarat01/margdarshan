  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What is Radiology & Imaging Technology?"
    parts:
      - overview:
          points:
            - "Radiology & Imaging Technology is a healthcare field focused on operating advanced imaging equipment — X-ray, CT, Magnetic Resonance Imaging (MRI), ultrasound and mammography — to create diagnostic images of the inside of the human body."
            - "Radiology Technologists (also called Radiographers) position patients, operate the scanning equipment, administer contrast where needed, and ensure image quality and patient safety, without which doctors couldn't diagnose diseases, injuries or tumours non-invasively."
            - "A typical day in a busy imaging department is genuinely fast-paced and technical: morning equipment quality checks, emergency stroke-protocol scans requiring rapid turnaround, and a steady stream of scheduled elective imaging — each involving patient positioning, parameter optimisation, contrast injection, and image processing before the scan reaches a radiologist for interpretation."
          more:
            - "Senior technologists take on protocol design and train junior staff."
