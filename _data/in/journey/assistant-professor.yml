# Journey Blueprint — Assistant Professor / College Lecturer (Master's + UGC NET). Printed on journey-assistant-professor.html (_includes/journey-doubts.html).
# Rules, classes and the money items / sources several careers share: _data/in/journey_common.yml.
# `money_defs` / `sources` below are used only by this career. Check: node scripts/check-journey-matrix.mjs
id: assistant-professor
v: 2
name: "Assistant Professor / College Lecturer (Master's + UGC NET)"
search: ["assistant professor", "college lecturer", "=professor", "associate professor", "university lecturer"]
search_not: ["school", "polytechnic"]
page: "journey-assistant-professor.html"
doubts_page: "journey-assistant-professor.html"
gate: "Any bachelor's degree → master's with 55% (50% for OBC-NCL / SC / ST / PwD) → UGC NET (or your state's SET for that state) — or a Ph.D. under the 2009 / 2016 UGC rules → apply to universities and colleges; Ph.D. and research lift you to higher academic levels."
gate_source: [net-dec26, ugc18]
core:
  what:
    text: "An Assistant Professor teaches undergraduate and postgraduate students in a college or university, guides projects and research, sets and checks exams, and does research of their own. It is the entry teaching post, at Academic Level 10."
    source: ugc18
  day:
    - "Teach lectures and tutorials, prepare notes and check assignments."
    - "Do research, write papers and guide student projects."
    - "Help run the department — exams, admissions, events and committees."
  pay:
    - { level: "Entry (Assistant Professor)", value: "Academic Level 10 (UGC 2018 regulations)", source: ugc18 }
    - { level: "Junior Research Fellowship (during Ph.D.)", value: "₹37,000 a month for 2 years (UGC rate from 1 Jan 2023)", source: msje-jrf }
    - { level: "Senior Research Fellowship", value: "₹42,000 a month for the remaining tenure", source: msje-jrf }
  pay_note: "Promotions under the Career Advancement Scheme move an Assistant Professor to Academic Levels 11 and 12; rupee figures differ with each state's adoption."
  routes:
    - { title: "NET route", text: "Master's with 55% (50% reserved) + UGC NET: eligible for Assistant Professor anywhere in India.", source: net-dec26 }
    - { title: "SET route", text: "A State Eligibility Test passed after 1 December 2002 makes you eligible only in that state's universities and colleges.", source: net-dec26 }
    - { title: "Ph.D. route", text: "A Ph.D. awarded under the UGC 2009 or 2016 Ph.D. regulations exempts you from NET / SET / SLET.", source: ugc18 }
    - { title: "JRF and research", text: "NET with JRF pays a fellowship during your Ph.D.", source: [net-dec26, msje-jrf] }
  cost_time:
    - { label: "UGC NET fee (Dec 2026)", value: "₹1,150 General · ₹600 EWS / OBC-NCL · ₹325 SC / ST / PwD / third gender", source: net-dec26 }
  cost_note: "University fees vary widely; JRF holders receive a monthly fellowship during the Ph.D."
  challenges:
    - text: "You need <strong>55% at master's level</strong> (50% for reserved categories) — a lower score blocks the NET route."
      source: [net-dec26, ugc18]
    - text: "JRF has an age limit: <strong>not more than 30</strong> on 1 December 2026 (relaxations for OBC-NCL, SC, ST, PwD, women and others)."
      source: net-dec26
    - text: "NET qualified through a 4-year bachelor's degree opens JRF and Ph.D. — <strong>not</strong> Assistant Professor."
      source: net-dec26
  not_for:
    - "You do not enjoy reading and writing for years beyond your degree."
    - "You want a quick job after graduation — this path needs a master's and NET or a Ph.D."
    - "You dislike public speaking in front of large classes."
journey:
  - stages: [c8, c9, c10]
    title: "Fall in love with one subject"
    do:
      - text: "Find the subject you enjoy explaining — you may teach and research it for 30 years."
      - text: "Read beyond the textbook: libraries, science or history magazines, debates and quizzes."
    doubts:
      - q: "What do I need to become a college professor?"
        a: "A master's degree with 55% (50% for OBC-NCL, SC, ST and PwD) plus UGC NET or your state's SET — or a Ph.D. under the UGC 2009 / 2016 rules. Higher posts need a Ph.D."
        next: "Pick a subject you love and plan for a master's."
        source: [net-dec26, ugc18]
      - q: "Which stream is best to become a professor?"
        a: "Any. UGC NET is held in 87 subjects — humanities, social sciences, languages, computer science and more — and you sit it in your master's subject."
        next: "Choose your Class 11 stream by the subject you want to teach."
        source: [net-dec26, net-open]
  - stages: [c11, c12]
    title: "Choose a degree that leads to your master's"
    do:
      - text: "Pick a bachelor's course in the subject you want to teach — UGC asks you to appear in NET in the subject of your post-graduation."
        source: net-dec26
    money: [csss, pms-sc]
    doubts:
      - q: "Can I do a 4-year bachelor's and then NET?"
        a: "Yes, with 75% (5% relaxation for reserved categories) in a 4-year / 8-semester degree you can sit NET — but it makes you eligible for JRF and Ph.D. admission, not for Assistant Professor."
        next: "For teaching posts, plan a master's anyway."
        source: net-dec26
  - stages: [ug]
    title: "Master's: protect your 55%"
    do:
      - text: "Score at least <strong>55% in your master's</strong> (50% for OBC-NCL / SC / ST / PwD) — without rounding off."
        source: net-dec26
      - text: "You may sit NET while in the final year of your master's; you must pass with the required marks within two years of the NET result."
        source: net-dec26
    exams:
      - { name: "UGC NET December 2026", when: "Apply 8–28 Oct 2026 · exam 14–18 and 21 Dec 2026", source: [net-open, net-dec26] }
    doubts:
      - q: "Can I appear in UGC NET before my master's result?"
        a: "Yes. Final-year master's students can apply, but they become eligible only after passing with 55% (50% reserved) — within two years of the NET result."
        next: "Sit NET in your final year to save time."
        source: net-dec26
      - q: "Is there negative marking in UGC NET?"
        a: "No. Paper 1 (50 questions, 100 marks) and Paper 2 (100 questions, 200 marks) are taken together in 3 hours, with no negative marking."
        next: "Answer every question."
        source: net-dec26
      - q: "In which language is UGC NET?"
        a: "English and Hindi, except language papers, which are in that language. If a translation is unclear, the English version is final."
        next: "Choose your medium carefully on the form."
        source: net-dec26
      - q: "In which subject should I take UGC NET?"
        a: "In the subject of your post-graduation. If your master's subject is not on the NET list, you may appear in a related subject."
        next: "Check the NET subject list before you choose your master's."
        source: net-dec26
      - q: "Do I need the 55% in graduation too?"
        a: "The UGC 2018 rules ask for 55% at the master's level for direct recruitment, with 5% relaxation at both bachelor's and master's level for reserved categories."
        next: "Check your university's advertisement for any bachelor's rule."
        source: ugc18
  - stages: [grad]
    title: "NET, JRF and the Ph.D."
    do:
      - text: "NET results fall into three categories: JRF + Assistant Professor + Ph.D.; Assistant Professor + Ph.D.; or Ph.D. only."
        source: net-dec26
      - text: "With JRF you receive <strong>₹37,000 a month</strong> for two years, then ₹42,000 as SRF (UGC rates from 1 January 2023)."
        source: msje-jrf
    money: [ugc-jrf]
    doubts:
      - q: "What is the age limit for UGC NET?"
        a: "For JRF: not more than 30 on 1 December 2026, with up to 5 years' relaxation for OBC-NCL, SC, ST, PwD, third gender and women. For Assistant Professor and Ph.D. admission there is no upper age limit."
        next: "If you are close to 30, aim for JRF in your next attempt."
        source: net-dec26
      - q: "What do the three NET result categories mean?"
        a: "Category 1 gives JRF, Assistant Professor eligibility and Ph.D. admission; Category 2 gives Assistant Professor eligibility and Ph.D. admission; Category 3 gives Ph.D. admission only."
        next: "Aim for Category 1 or 2 if you want to teach."
        source: net-dec26
      - q: "How much is the JRF fellowship?"
        a: "₹37,000 a month for two years, and ₹42,000 a month as Senior Research Fellow for the remaining tenure (UGC rates from 1 January 2023)."
        next: "Qualify JRF before you start your Ph.D. if you can."
        source: msje-jrf
      - q: "NET or SET — what is the difference?"
        a: "NET makes you eligible for Assistant Professor anywhere in India. A SET passed after 1 December 2002 makes you eligible only in the universities and colleges of the state where you passed it."
        next: "Take NET if you may move states."
        source: net-dec26
      - q: "Is a Ph.D. compulsory to become an Assistant Professor?"
        a: "NET / SET / SLET remains the minimum eligibility. A Ph.D. awarded under the UGC 2009 or 2016 Ph.D. rules can replace NET, and a Ph.D. is required for promotion to higher levels."
        next: "Plan a Ph.D. even after NET for long-term growth."
        source: [net-dec26, ugc18]
      - q: "What pay level does an Assistant Professor start at?"
        a: "Academic Level 10 under the UGC 2018 regulations, with promotion under the Career Advancement Scheme to Levels 11 and 12."
        next: "Check your state government's adoption of the UGC pay rules."
        source: ugc18
  - stages: [work]
    title: "Teaching after another career"
    do:
      - text: "UGC NET has no upper age limit for Assistant Professor eligibility — only JRF has an age limit."
        source: net-dec26
    doubts:
      - q: "I am 35 and working. Can I still become an Assistant Professor?"
        a: "Yes. There is no upper age limit to sit UGC NET for Assistant Professor eligibility; you need a master's with 55% (50% reserved). Colleges may set their own recruitment age rules."
        next: "Register for the next NET in your master's subject."
        source: net-dec26
board_note: "School boards do not matter here — your master's percentage (55%, or 50% for reserved categories) is the key mark."
board_source: net-dec26
exam:
  name: "UGC NET December 2026"
  body: "National Testing Agency for the University Grants Commission"
  href: "journey-assistant-professor.html"
  facts:
    - { label: "Papers", value: "Paper 1: 50 Qs · 100 marks · Paper 2: 100 Qs · 200 marks", source: net-dec26 }
    - { label: "Time", value: "3 hours, no break · no negative marking", source: net-dec26 }
    - { label: "Exam dates", value: "14–18 and 21 Dec 2026", source: net-dec26 }
    - { label: "Fee", value: "₹1,150 · ₹600 EWS / OBC-NCL · ₹325 SC / ST / PwD", source: net-dec26 }
  stages:
    head: ["Category", "JRF", "Assistant Professor", "Ph.D. admission"]
    rows:
      - ["Category 1", "Yes", "Yes", "Yes"]
      - ["Category 2", "No", "Yes", "Yes"]
      - ["Category 3", "No", "No", "Yes"]
    source: net-dec26
  notes:
    - text: "NET is held in 87 subjects in computer-based mode."
      source: net-open
state_uses: [psc, scholarship]
state_rules:
  - text: "UGC NET is national. A State Eligibility Test (SET) passed after 1 December 2002 makes you eligible only in your state's universities and colleges; government-college posts are usually filled through your state's commission (see your state's offices above)."
    source: net-dec26
multiverse:
  - { title: "School teacher", text: "D.El.Ed / B.Ed + TET for Classes 1–12.", href: "journey-blueprint.html?career=school-teacher" }
  - { title: "Research scientist", text: "Ph.D. and research careers in biotech.", href: "journey-blueprint.html?career=biotech-scientist" }
  - { title: "Economics", text: "One of the most popular NET subjects.", href: "ba-economics.html" }
  - { title: "Library science", text: "College librarian posts also follow UGC rules.", href: "library-science.html" }
money: [csss, pms-sc, ugc-jrf]

money_defs:
  - id: ugc-jrf
    kind: stipend
    name: "UGC Junior / Senior Research Fellowship (through UGC NET)"
    by: "University Grants Commission"
    amount: "₹37,000 a month for 2 years as JRF, then ₹42,000 a month as SRF (UGC rates from 1 January 2023)"
    who: "Candidates who qualify UGC NET in the 'JRF + Assistant Professor + Ph.D.' category and join a Ph.D. JRF age limit: 30 on the first day of the month the exam ends, with relaxations."
    apply: "Qualify NET with JRF, then join a Ph.D.; the fellowship starts from the date of joining as per UGC rules."
    stages: [grad]
    source: [msje-jrf, net-dec26]

sources:
  - { id: net-dec26, name: "NTA — UGC-NET December 2026 Information Bulletin (updated 16 Oct 2026)", url: "https://cdnbbsr.s3waas.gov.in/s301eee509ee2f68dc6014898c309e86bf/uploads/2026/10/20261016860019603.pdf", covers: "exam 14–18 and 21 Dec 2026, 3 hours, fees, three qualifying categories, 55% / 50% master's rule, final-year candidates, 4-year bachelor's rule (75%, JRF / Ph.D. only), NET / SET exemption rules, JRF age 30 and relaxations, no upper age for Assistant Professor, Paper 1 / Paper 2 pattern, no negative marking, English and Hindi, subject list (incl. Archaeology code 67)", checked: 2026-10-25 }
