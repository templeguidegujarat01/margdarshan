          - { tag: "Optional exam", title: "Security certification", text: "Many employers prefer it; some certifications are for entry level, others for experienced workers.", kind: exam, source: ooh_infosec }
          - { tag: "Goal", title: "Information security analyst", text: "", kind: goal, source: ooh_infosec }
      - id: certifications
        title: "High school diploma + industry training and certifications"
        tag: "Without a degree"
        who: "Some workers enter the occupation with a high school diploma and relevant industry training and certifications."
        steps:
          - { tag: "Start", title: "High school diploma", text: "", kind: start, source: ooh_infosec }
          - { tag: "Training", title: "Industry training", text: "", kind: stage, source: ooh_infosec }
          - { tag: "Optional exam", title: "Entry-level certification", text: "Examples: ISC2 Certified in Cybersecurity (no work experience required) or CompTIA Security+.", kind: exam, source: isc2_cc }
          - { tag: "Goal", title: "Information security analyst", text: "", kind: goal, source: ooh_infosec }
