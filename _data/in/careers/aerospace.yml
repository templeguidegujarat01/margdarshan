  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Do I need GATE to work at ISRO or DRDO after Aerospace Engineering?"
            a: "Effectively, yes for most routes. ISRO recruits primarily through its own ICRB written test and interview, DRDO through CEPTAM or the Scientist Entry Test (SET), and PSUs like HAL and NAL largely through GATE. A GATE score also strengthens ICRB and SET applications, so serious preparation for one of these exams is close to essential if you're targeting a government or PSU aerospace role."
          - q: "What is a realistic Aerospace Engineering salary in India?"
            a: "It varies enormously by route. Private-sector roles at an average college commonly start around ₹3-5 LPA, since India's private aerospace job market is still relatively small. Government/PSU roles at HAL or NAL via GATE typically start around ₹7-10 LPA equivalent, while ISRO and DRDO Scientist/Engineer posts (via ICRB or SET) are reported around ₹10-16 LPA including allowances."
          - q: "Is Aerospace Engineering better than Mechanical Engineering?"
            a: "Aerospace is more specialised and narrower in scope, while Mechanical is broader and has a much wider job market across automobiles, manufacturing and general PSU roles. Aerospace makes sense if you have a genuine, specific interest in aircraft or spacecraft; Mechanical is the safer choice if you want more flexibility in where you eventually work."
          - q: "Can I get an aerospace job without going through ISRO, DRDO or HAL?"
            a: "Yes. Commercial aviation and MRO (Maintenance, Repair and Overhaul) hubs from companies like Boeing and Airbus are expanding in India, and a new wave of private space startups — Skyroot Aerospace and Agnikul Cosmos among them — are hiring directly, often alongside equity (ESOPs) at funded companies. This private-sector opening is relatively recent and tied to India's updated space policy."
          - q: "Which colleges are best for Aerospace Engineering in India?"
            a: "IIT Bombay, IIT Kanpur, IIT Madras and IIT Kharagpur are consistently ranked among the strongest, alongside IIST Thiruvananthapuram — an autonomous institute under the Department of Space with a distinctive scholarship-linked admission route tied to future service with ISRO. In the private space, RVCE Bangalore and Amrita Coimbatore are commonly cited as strong options."
      - note: "Figures are indicative (2026) — confirm on the official college or authority website."
        class: "table-note mt-lg"
