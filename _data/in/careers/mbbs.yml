  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "How competitive is a government MBBS seat really?"
            a: "Extremely. NEET-UG 2026 had 22.8 lakh registrations and about 20 lakh candidates sat the exam. The NMC college list (October 2026) shows 1,40,314 MBBS seats in 834 colleges, of which 63,771 are in government colleges (AIIMS and JIPMER come on top). That is about 31 candidates for every government MBBS seat. Top central institutions like AIIMS Delhi generally require above the 99.9th percentile for general category, while state government colleges typically need 90-99 percentile depending on the state and category."
          - q: "What's the real fee difference between government, private and deemed MBBS colleges?"
            a: "It's the single biggest financial decision in this career. A realistic all-in budget for the full course at a government college, including hostel and living costs, commonly lands around ₹13-15 lakh. The same degree at a private college on a state-quota seat commonly costs ₹53-73 lakh, and at a deemed university or full management-quota seat, ₹1.2-1.5 crore. Private and deemed seats generally accept scores from the NMC's 50th-percentile minimum upward, but charge accordingly."
          - q: "Do private MBBS graduates earn less than government MBBS graduates?"
            a: "Not necessarily in the long run. Private and government college graduates are commonly reported to earn similarly after 5-7 years of practice, once experience, specialisation and reputation matter more than which college trained you. The bigger difference is the far higher upfront cost at private and deemed colleges, which affects loan burden and financial planning far more than long-term earning potential."
          - q: "Is NEET-PG necessary after MBBS?"
            a: "It isn't legally mandatory, but it has become close to necessary for meaningfully better salaries and career growth. Most MBBS graduates now prepare for NEET-PG immediately after their internship, since a specialisation (MD/MS) substantially increases both earning potential and the range of available roles. This typically adds another 3-5 years of preparation and study on top of the original MBBS timeline."
          - q: "What is a realistic doctor salary in India after MBBS?"
            a: "During the mandatory internship year, stipends commonly range from ₹15,000-35,000 per month depending on the college and state. A doctor with only an MBBS (no further specialisation) commonly earns ₹6-12 LPA. Specialists with an MD/MS commonly earn ₹12-40+ LPA, and senior consultants — highly variable by hospital, city and reputation — can earn ₹25 LPA to well over ₹1 crore, particularly in private practice."
      - note: "Figures are indicative (2026) — confirm on the official college or authority website."
        class: "table-note mt-lg"
      - source_link:
          href: "https://www.nmc.org.in/"
          label: "Official source: NMC (nmc.org.in)"
# MBBS abroad → licence in India (rendered by _includes/in-return-route.html, above the sources).
# Read 2026-10-29: NMC FMGL Regulations 2021 + NMC FAQs, NMC Act 2019 s.15, NBEMS FMGE Oct 2026 bulletin.
foreign_return_route:
  eyebrow: "MBBS abroad · Licence in India"
  heading: "Coming back to practise after MBBS abroad"
  intro: "A foreign MBBS lets you practise in India only if it meets the National Medical Commission's Foreign Medical Graduate Licentiate (FMGL) Regulations, 2021. These rules cover students who joined a foreign course on or after 18 November 2021."
  steps:
    - title: "Qualify NEET-UG before you leave"
      text: "Anyone who went abroad for a primary medical degree on or after May 2018 must have qualified NEET-UG; the result counts as the Eligibility Certificate and is valid for three years."
      source: fmge_ib
    - title: "Pick a course that meets FMGL"
      text: "At least 54 months long, taught in English, covering the subjects in the FMGL Schedule, done entirely at one foreign institution (no part in India or a third country) and finished within ten years of joining."
      source: nmc_fmgl
    - title: "12-month internship abroad + local licence"
      text: "Do at least 12 months of internship at the same foreign institution, and register with that country's medical regulator on the same terms as its own citizens."
      source: nmc_fmgl
    - title: "Pass the screening test: FMGE now, NExT later"
      text: "Today this is the FMGE, run by NBEMS: 300 MCQs, 150 to pass, no negative marking, no limit on attempts. The NMC Act, 2019 says foreign graduates will have to pass the National Exit Test (NExT) instead once the Central Government notifies the date it starts."
      source: nmc_act
    - title: "Provisional registration and an internship seat"
      text: "Get provisional registration from your State Medical Council, and apply for internship with the State Medical Council through the NMC."
      source: nmc_faq
    - title: "12 months' supervised internship in India"
      text: "On top of the internship abroad, you must do a supervised internship in India of at least 12 months, under the Compulsory Rotating Medical Internship Regulations, 2021."
      source: nmc_faq
    - title: "Permanent registration"
      text: "Only then does the NMC grant permanent registration, the licence to practise medicine in India. From here NEET-PG and INI-CET are open to you as to any Indian graduate."
      source: nmc_fmgl
  note:
    text: "FMGE was still the screening test on 29 October 2026: NBEMS held sessions in June 2026 and on 31 October 2026. Internship seats: an NMC circular of 10 March 2026 reserves 7.5% of the intern intake of established colleges for foreign medical graduates."
    source: nmc_crmi
  links:
    - { label: "MBBS abroad: NMC rules by country", href: "study-abroad/mbbs-abroad.html" }
    - { label: "FMGE exam page", href: "fmge.html" }
    - { label: "Study in Russia", href: "study-abroad/russia.html" }
