  - { state: uttar-pradesh, text: "UPPRPB Constable 2025: <strong>32,679 posts</strong>, Level 3; age men 18–22, women 18–25; fee ₹500 (SC / ST ₹400). SI 2025: age 21–28 (+3 one-time).", source: [up-pc, up-si], href: "state/uttar-pradesh/police.html" }
  - { state: bihar, text: "Constables through <strong>CSBC</strong> (Advt 01/2025: 19,838 posts, Level 3, age 18–25, more for BC / EBC / SC / ST); Sub-Inspectors through <strong>BPSSC</strong> (Advt 05/2025: 1,799 posts, Level 6).", source: [br-pc, br-si], href: "state/bihar/police.html" }
  - { state: gujarat, text: "<strong>GPRB</strong> recruits PSI (degree, max age 35) and Lokrakshak constables (Class 12, age 18–33) together. Run: men 5 km in 25 min, women 1.6 km in 9:30. PSI gets ₹49,600 fixed during the contract.", source: gj-gprb, href: "state/gujarat/police.html" }
  - { state: maharashtra, text: "Constables (Class 12) are recruited by each commissionerate / district under the 2011 Rules; <strong>PSI through MPSC</strong>'s Group-B combined exam (011/2026: 310 posts, age 19–31 open, S-14 pay).", source: [mh-pc, mh-psi], href: "state/maharashtra/police.html" }
  - { state: karnataka, text: "Civil Police Constable 2026: PUC (Class 12), age 18–33 (35 for reserved), pay ₹37,500–₹76,100. KEA runs the application and written test.", source: ka-pc, href: "state/karnataka/police.html" }
  - { state: madhya-pradesh, text: "Constable (GD) 2026 through <strong>MPESB</strong>: 7,500 posts, <strong>Class 10</strong> (ST Class 8), age 18–33 (38 for MP women and reserved), pay ₹19,500–62,000; test from 19 Nov 2026.", source: mp-pc, href: "state/madhya-pradesh/police.html" }
  - { state: rajasthan, text: "Constables are recruited district by district (Class 12, 168 cm, age 18–23 for General); <strong>SI through RPSC</strong> (2025: 1,076 posts, age 20–25, Level 11).", source: [rj-pc, rj-si], href: "state/rajasthan/police.html" }
  - { state: telangana, text: "TSLPRB 2026: 7,437 posts — constable needs Intermediate, SI a degree. Prelims: SI 29 Nov, PC 20 Dec 2026 (tentative).", source: [tg-pc, tg-pn], href: "state/telangana/police.html" }
  - { state: andhra-pradesh, text: "SLPRB AP notified 1,156 constable-level and 378 SI-level posts on 16 Sep 2026; constable age 18–24 on 1 Jul 2026 (+5 reserved). Application dates awaited.", source: [ap-pc, ap-si], href: "state/andhra-pradesh/police.html" }
  - { state: tamil-nadu, text: "<strong>TNUSRB</strong> Common Recruitment 2025: Grade II Police Constable, age 18–26 (OC), a qualifying <strong>Tamil test (40%)</strong>, merit out of 100 (written 70); 20% priority for Tamil-medium students.", source: tn-pc, href: "state/tamil-nadu/tnusrb.html" }
  - { state: west-bengal, text: "WBPRB Constable 2024: 11,749 posts (8,212 men, 3,537 women); fee ₹170 (WB SC / ST ₹20).", source: [wb-pc-vac, wb-pc-info], href: "state/west-bengal/police.html" }
  - { state: assam, text: "SLPRB Assam Constable (UB &amp; AB): 1,052 + 663 posts in the 2025-26 drive, age 18–26 (unreserved, this cycle), <strong>no application fee</strong>.", source: [as-pc, as-pc-corr], href: "state/assam/police.html" }
  - { state: chhattisgarh, text: "SI-cadre posts are filled by <strong>CGPSC</strong> (Advt 02/2024: 341 posts); height 168 cm men, 153 cm women.", source: cg-si, href: "state/chhattisgarh/police.html" }
  - { state: kerala, text: "Kerala PSC recruits Police Constables (Armed Police Battalion) — Plus Two, men only in that notification, age 18–26 (OBC 29, SC / ST 31), no fee.", source: kl-pc, href: "state/kerala/kerala-psc.html" }
  - { state: delhi, text: "Delhi Police does not hold its own written exam: <strong>SSC</strong> runs the Constable (Class 12, age 18–25) and SI (degree, age 20–25) exams, and Delhi Police holds the physical tests. Pay Level 3 and Level 6.", source: [dl-pc, dl-si], href: "state/delhi/delhi-police.html" }
