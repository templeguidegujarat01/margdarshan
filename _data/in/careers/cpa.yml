  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What is a US CPA?"
    parts:
      - overview:
          points:
            - "CPA is a license issued by individual <strong>US state boards of accountancy</strong>, with the Uniform CPA Examination itself developed by the <strong>American Institute of Certified Public Accountants (AICPA)</strong> and coordinated with the <strong>National Association of State Boards of Accountancy (NASBA)</strong>."
            - "It's the US equivalent of India's CA — the credential that authorises accounting practice under US rules."
            - "For Indian professionals, CPA isn't usually a replacement for CA — it doesn't grant Indian statutory audit rights."
          more:
            - "It's most valuable as a specialised addition: proof of deep US GAAP and SEC-reporting expertise, which is exactly what Big 4 US-practice teams and India-based Global Capability Centres of American multinationals are hiring for at scale."
  - id: "who"
    hid: "who-heading"
    alt: true
    eyebrow: "Fit check"
    heading: "Who should choose CPA — and who should think twice"
    parts:
      - fit:
          match:
            - "Are already a qualified CA, Cost and Management Accountant (CMA) or postgraduate and want a fast, focused addition (just 4 exam sections)."
            - "Want to work with US GAAP, SEC filings, or US-headquartered MNC finance teams."
            - "Want the shortest realistic timeline among major accounting qualifications (often 12-18 months of exams)."
          mismatch:
            - "Only have a standard 3-year B.Com — you'll likely need an extra qualification first to reach 120 credits."
            - "Want Indian statutory audit rights specifically — that's CA territory, not CPA."
            - "Are cost-sensitive — India's international testing surcharge makes CPA one of the pricier options per exam attempt."
  - id: "eligibility"
    hid: "elig-heading"
    eyebrow: "A credit-hour system, not a stream requirement"
    heading: "Eligibility — the 120/150 credit rule"
    intro: "US state boards use a US credit-hour system, not Indian degree titles directly. Your Indian qualifications are converted into equivalent US credits by an approved evaluation agency (NIES, WES or FACS)."
    parts:
      - subhead: "Eligibility — the 120/150 credit rule"
      - table:
          head:
            - "Your qualification"
            - "Approx. US credit value"
          rows:
            -
              - "B.Com / BBA / BA (Economics) / BMS (3-year degree)"
              - "~90 credits"
            -
              - "CA Inter / CMA Inter / a 1-year postgraduate diploma"
              - "+ ~30 credits"
            -
              - "M.Com / MBA / qualified CA / CS / CMA"
              - "+ ~60 credits"
      - note: "<strong>To sit the exam:</strong> you need 120 credits — most B.Com-only graduates need to add CA Inter, CMA Inter, or a postgraduate diploma to get there. <strong>To get licensed</strong> (not just pass the exam): you need 150 credits, which usually means a full postgraduate degree or a completed professional qualification like CA, CS or CMA. Exact credit conversions and accounting-specific credit minimums vary by state board and evaluation agency — always get your own transcripts formally evaluated before assuming eligibility."
