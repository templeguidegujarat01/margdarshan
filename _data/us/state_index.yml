# USA Edition, States hub (USA Master Plan Phase 11, 2026-10-21): the 50 states and the District of Columbia, A to Z.
# pop and rank are copied from the Census Bureau's Vintage 2025 estimates (POPESTIMATE2025 and NRANK_POPEST2025 columns of
# NST-EST2025-POPCHG2020-2025.csv, source id census_pop2025); nothing here is computed. Phase 11 builds state pages in
# population order, about 10 per run. A state has a page when _data/us/states/<slug>.yml exists; the hub links only those.
#
# State file schema (_data/us/states/<slug>.yml), every fact with a source id from sources.yml:
#   name, abbr, checked, review_by (re-check date), lede, links [{label, href, text}]
#   diploma    { intro, rows [[subject, requirement]], unit, tests, src, points [{t, src}] }   rows optional
#   k12_test   { name, full, intro, src, rows [[test, subject, grades]], rows_src, use [{t, src}] }
#   colleges   { systems [{ name, kind: university | community, url, line, src, src2 }] }
#   residency  { points [{t, src}] }
#   aid        { agency {name, url, src}, programs [{name, line, src}] }
#   jobs       { state { portal, url, by, steps [..], exam, src }, cities [{ name, body, url, line, src }] }
#   apprenticeship { office, url, kind: SAA | OA | both, line, src, oa_src }
#   licenses   (Phase 12) { <licenses.yml id or cte_careers.yml trade slug>: { body, req, exam, fee, renewal, sources [] } }
#              Rows already in licenses.yml boards / cte_careers.yml states for the same place are not repeated here.
# Pages: scripts/build-us-states.mjs [--check] writes us/states/index.html, us/states/<slug>/index.html and
# us/states/<slug>/licenses.html. scripts/check-us-data.mjs validates the files.
