  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What does an IT Consultant actually do?"
    parts:
      - overview:
          points:
            - "An IT Consultant is a bridge between business problems and technology solutions — analysing what a company actually needs, recommending software, cloud, data or digital solutions, and helping guide implementation."
            - "It's a genuinely different day-to-day from a Software Engineer: less hands-on coding, considerably more client communication, requirement analysis and business-facing problem solving."
            - "What most guides don't explain clearly is how much <strong>which firm hires you</strong> changes this career."
          more:
            - "An entry-level Analyst role at an IT services company like TCS pays and feels very different from a Technology Consultant role at Accenture, which differs again from a Big 4 or MBB-style strategy consulting arm."
            - "Firm tier is arguably the single biggest lever in this career — more than almost any specific technical skill."
