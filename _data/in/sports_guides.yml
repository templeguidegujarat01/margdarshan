              - "Admission is <strong>CUET-based</strong> — for 2026 the B.P.Ed. form closed on 18 June 2026 — followed by a <strong>physical fitness test</strong> and a <strong>sports skill test</strong>."
              - "Next step: <strong>M.P.Ed.</strong> after a B.P.Ed. (or B.Sc. Health &amp; Physical Education) with 50% marks."
            source: "lnipe-bped,lnipe-adm,lnipe-mped"
          - list:
