sections:
  - id: "quick"
    hid: "quick-heading"
    alt: true
    eyebrow: "Quick answers"
    heading: "Air Hostess / Cabin Crew at a glance"
    intro: "Check whether your Class 12 background qualifies. Duration and pay are in the summary at the top of the page."
    parts:
      - subhead: "Can I apply from my stream?"
      - streams:
          - label: "Science"
            fit: "Eligible"
            tone: "y"
            icon: "science"
          - label: "Commerce"
            fit: "Eligible"
            tone: "y"
            icon: "commerce"
          - label: "Arts / Humanities"
            fit: "Eligible"
            tone: "y"
            icon: "arts"
      - note: "Any stream. Good spoken English (and often Hindi or a regional/foreign language) matters more than subjects."
  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What does an Air Hostess / Cabin Crew do?"
    parts:
      - overview:
          points:
            - "Cabin crew run safety on board: pre-flight checks, safety demonstrations, handling emergencies, evacuations, first aid and fire-fighting in the cabin."
            - "They also deliver passenger service — boarding, meals, sales, special-assistance passengers — while keeping to the airline's procedures."
            - "Crew are trained and checked regularly on each aircraft type they fly, and must stay medically fit to keep flying."
  - id: "who"
    hid: "who-heading"
    alt: true
    eyebrow: "Fit check"
    heading: "Who should become an Air Hostess / Cabin Crew"
    parts:
      - fit:
          match:
            - "Stay calm and friendly with hundreds of strangers, even when things go wrong."
            - "Are physically fit and comfortable on your feet for long, irregular shifts."
            - "Speak clearly and confidently in English and at least one more language."
          mismatch:
            - "Want a regular 9-to-5 routine and weekends off."
            - "Expect a long-term career only from looks or grooming — airlines test safety aptitude and attitude."
            - "Plan to pay a large academy fee hoping it guarantees a job; it does not."
  - id: "eligibility"
    hid: "elig-heading"
    eyebrow: "Eligibility"
    heading: "What you need, stage by stage"
    parts:
      - elig_list:
          - "Class 12 pass from any stream is the usual minimum; some airlines prefer a degree or hospitality diploma."
          - "Each airline sets its own <strong>age, height, BMI and vision</strong> rules in its recruitment notice — read it before applying."
          - "Medical fitness as required by DGCA for cabin crew, checked before training and renewed through the career."
          - "Fluent spoken English; Hindi and foreign languages are an advantage for international airlines."
  - id: "roadmap"
    hid: "roadmap-heading"
    alt: true
    eyebrow: "Step-by-step"
    heading: "Your full path to becoming an Air Hostess / Cabin Crew"
    parts:
      - steps:
          - title: "Finish Class 12"
            text: "Any stream; build spoken English and customer-service experience."
          - title: "Apply to airlines directly"
            text: "Watch official airline career pages; beware of agents who charge for “placement”."
          - title: "Clear selection"
            text: "Group discussion, interview, grooming check and medical."
          - title: "Initial cabin crew training"
            text: "Safety, emergency, first-aid and service training at the airline, to DGCA requirements."
          - title: "Line flying"
            text: "Supervised flights, then full crew duties."
          - title: "Grow"
            text: "Senior crew, purser/cabin manager, trainer, or ground roles in airline service."
  - id: "exams"
    hid: "exams-heading"
    eyebrow: "Selection & training"
    heading: "How airlines select and train cabin crew"
    parts:
      - chips:
          - label: "Airline selection"
            text: "There is no national entrance exam; each airline runs its own recruitment rounds."
          - label: "DGCA-linked training"
            text: "Airlines train cabin crew to safety training requirements set by DGCA before line flying."
            source: "dgca"
          - label: "Private academies"
            text: "Optional. Useful for grooming, English and interview practice, but their certificate is not a DGCA licence."
          - label: "Recurrent checks"
            text: "Yearly safety refreshers and type-specific training keep you approved to fly."
  - id: "salary"
    hid: "salary-heading"
    alt: true
    eyebrow: "Indicative figures"
    heading: "Air Hostess / Cabin Crew pay in India"
    intro: "Private-sector pay varies a lot by employer and city; these are broad, commonly reported ranges, not guarantees."
    parts:
      - salary:
          - label: "Fresher crew"
            value: "Modest fixed pay + flying allowance"
            text: "Allowances per flying hour make up a large part of take-home pay."
          - label: "Experienced crew"
            value: "Rises with seniority"
            text: "International carriers usually pay more than domestic low-cost airlines."
          - label: "Senior / purser"
            value: "Higher grade"
            text: "Cabin manager and trainer roles add responsibility pay."
  - id: "jobs"
    hid: "jobs-heading"
    eyebrow: "Where they work"
    heading: "Employers & growth path"
    parts:
      - chips:
          - label: "Employers"
            text: "Indian domestic and international airlines, foreign airlines hiring in India, charter operators"
          - label: "Growth path"
            text: "Cabin crew → Senior crew → Purser / Cabin Manager → Trainer / In-flight service manager"
          - label: "After flying"
            text: "Airport services, airline training, hospitality and customer-experience roles"
  - id: "proscons"
    hid: "pc-heading"
    alt: true
    eyebrow: "Honest take"
    heading: "Advantages and disadvantages"
    parts:
      - proscons:
          pros:
            - "Open after Class 12 from any stream."
            - "Travel, allowances and airline staff benefits."
            - "Strong transferable customer-service and safety skills."
          cons:
            - "Irregular hours, night flights and time away from home."
            - "Airline-specific physical and age criteria limit who can apply."
            - "Hiring follows airline business cycles."
  - hid: "myth-heading"
    eyebrow: "Common myths"
    heading: "Myths vs facts"
    parts:
      - myths:
          - myth: "An academy diploma is required to become cabin crew."
            fact: "Airlines train their own crew; academies are optional preparation."
          - myth: "Cabin crew are only waiters in the sky."
            fact: "Their primary job is safety: evacuations, fire-fighting and first aid are core training."
  - hid: "related-heading"
    alt: true
    eyebrow: "Related careers"
    heading: "If you're considering Air Hostess / Cabin Crew, also look at"
    parts:
      - related:
          - name: "Commercial Pilot"
            sub: "DGCA CPL & airline flying"
            href: "commercial-pilot.html"
          - name: "Travel & Tourism"
            sub: "Airlines, agencies & tourism"
            href: "travel-tourism.html"
          - name: "Hotel Management (BHM)"
            sub: "Hospitality careers"
            href: "bhm.html"
          - name: "Air Traffic Controller"
            sub: "AAI Junior Executive (ATC)"
            href: "air-traffic-controller.html"
  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "What is the minimum qualification for cabin crew in India?"
            a: "Most airlines ask for Class 12 pass from any stream. The exact age, height and other limits are in each airline's recruitment notice."
          - q: "Is an air hostess course compulsory?"
            a: "No. Airlines give DGCA-required safety training after selecting you. A private course is optional."
          - q: "Do men work as cabin crew?"
            a: "Yes. Flight stewards and air hostesses do the same job; airlines recruit both."
          - q: "How do I avoid fake job offers?"
            a: "Apply only through the airline's official careers page. Genuine airlines do not ask for money to give you a job."
      - note: "*Pay figures are indicative unless they quote an official pay level, and rules change: confirm eligibility, dates and fees on the official websites listed under Sources before you act."
        class: "table-note mt-lg"
