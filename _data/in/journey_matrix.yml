  # ------------------------------------------------------------------ CLINICAL PSYCHOLOGIST (batch 4)
  - id: clinical-psychologist
    name: "Clinical Psychologist (RCI-registered)"
    search: ["clinical psychologist"]
    page: "clinical-psychologist.html"
    roadmap: "roadmaps/clinical-psychologist.html"
    gate: "A 4-year BA / B.Sc in Psychology with 55% (or a 3-year degree plus a bridge year) → 2-year RCI-regulated Master in Clinical Psychology (M.Clin.Psy, formerly M.Phil) through an institute entrance test and interview → registration on RCI's Central Rehabilitation Register."
    gate_source: [rci-ma, rci-act]
    foundation:
      - stages: [c8, c9, c10]
        title: "Read people, read research"
        points:
          - text: "Clinical psychologists assess and treat mental-health problems with psychological tests, interviews, psychotherapy and counselling — the M.Clin.Psy trains you in all of these, plus statistics and research methods."
            source: rci-ma
          - text: "Strong English, biology and basic statistics help most. Read about how the brain and behaviour work, and practise writing clearly — case reports are a big part of the training."
      - stages: [c11, c12]
        title: "Science opens the RCI bachelor's; any stream opens psychology"
        points:
          - text: "RCI's own 4-year <strong>B.Sc Clinical Psychology (Hons)</strong> — now called Bachelor in Clinical Psychology (B.Clin.Psy) — takes students who passed <strong>Class 12 in the science stream</strong>, through the university's entrance test."
            source: [rci-bsc, rci-name]
          - text: "That B.Sc is a regular 4-year course with no midway exit and no online or distance mode. Graduates are licensed by RCI as <strong>“Clinical Assistant (Clinical Psychology)”</strong> — a separate register category below Clinical Psychologist."
            source: rci-bsc
          - text: "Not in science? A regular BA or B.Sc in Psychology from any stream is the other road in — check each university's own entry rule."
      - stages: [ug, grad]
        title: "The master's that makes you a Clinical Psychologist"
        points:
          - text: "Entry to the M.A. Clinical Psychology (M.Clin.Psy): a <strong>4-year BA / B.Sc in Psychology with 55%</strong> (50% SC / ST). With a 3-year degree, first pass a fourth-year bridge course or the first year of a psychology master's with 55%."
            source: rci-ma
          - text: "Selection is by the institute's <strong>written entrance test (70%) and interview (30%)</strong>. It is a full-time clinical course of 2 years; you need 80% attendance and must finish within 4 years of enrolling."
            source: rci-ma
          - text: "UGC allowed M.Phil Clinical Psychology admissions only up to the <strong>2025-26</strong> session; from 2026-27 the master's in its place is the route."
            source: rci-mphil
    board_notes:
      gseb:
        text: "HSC Science (Group A or B) keeps RCI's B.Sc Clinical Psychology open; HSC Arts or Commerce still leads to a BA in Psychology."
        source: rci-bsc
      cbse-gj:
        text: "Science in Class XI–XII keeps RCI's B.Sc Clinical Psychology open; any stream can take a BA in Psychology."
        source: rci-bsc
      upmsp:
        text: "Intermediate Science keeps RCI's B.Sc Clinical Psychology open; Arts students can take a BA in Psychology."
        source: rci-bsc
      msbshse:
        text: "HSC Science keeps RCI's B.Sc Clinical Psychology open; HSC Arts or Commerce leads to a BA in Psychology."
        source: rci-bsc
      wb:
        text: "Higher Secondary Science keeps RCI's B.Sc Clinical Psychology open; Arts students can take a BA in Psychology."
        source: rci-bsc
      cbse: "RCI's rules are national: the same 55% four-year psychology degree rule applies whichever board you studied in."
      other: "RCI's rules are national: the same 55% four-year psychology degree rule applies whichever board you studied in."
    board_source: rci-ma
    exam:
      name: "RCI-regulated M.A. Clinical Psychology (M.Clin.Psy) — institute entrance"
      body: "Rehabilitation Council of India · each RCI-approved institute"
      href: "clinical-psychologist.html"
      facts:
        - { label: "Master's entry", value: "4-year BA / B.Sc Psychology · 55% (50% SC / ST)", source: rci-ma }
        - { label: "Selection", value: "Written test 70% + interview 30%", source: rci-ma }
        - { label: "Course", value: "2 years full-time · 80% attendance", source: rci-ma }
        - { label: "Practising unregistered", value: "Up to 1 year in jail and / or ₹1,000 fine", source: rci-act }
      stages:
        head: ["Step", "What it is", "Assessment", "Rule"]
        rows:
          - ["Bachelor's", "4-year BA / B.Sc Psychology, or RCI's B.Sc Clinical Psychology (Hons)", "University exams", "55% aggregate (50% SC / ST) for the master's"]
          - ["Entrance", "Written test and interview at the RCI-approved institute", "Test 70% · interview 30%", "Each institute advertises its seats and dates"]
          - ["Year 1", "3 papers + psychological assessment practical + 5 full diagnostic case reports", "70 final + 30 internal per paper", "80% attendance to sit exams"]
          - ["Year 2", "3 papers + therapy practical + 5 psychotherapy case reports + research thesis", "70 final + 30 internal per paper", "Finish within 4 years of enrolling"]
        source: rci-ma
      notes:
        - text: "Seat numbers are tied to faculty: at most 8 trainees per Professor, 6 per Associate Professor and 4 per Assistant Professor — so most centres take only a handful each year."
          source: rci-ma
        - text: "In an office memorandum of 3 May 2026, RCI renamed the courses: M.A. Clinical Psychology → <strong>Master in Clinical Psychology (M.Clin.Psy)</strong>; B.Sc Clinical Psychology → <strong>Bachelor in Clinical Psychology (B.Clin.Psy)</strong>."
          source: rci-name
        - text: "There is no single national entrance and RCI publishes no fee for it — each institute sets its own test fee."
    state_rules:
      - text: "RCI sets no state or domicile quota for this course. Only a person enrolled on RCI's <strong>Central Rehabilitation Register</strong> may hold a rehabilitation-professional post in government, practise anywhere in India, or sign the certificates the law requires."
        source: rci-act
      - text: "Check that the institute's programme is RCI-approved before you join — RCI says other institutions may not run its B.Sc Clinical Psychology without its approval."
        source: rci-bsc-n
    multiverse:
      - { title: "Clinical psychologist", text: "The full career guide.", href: "clinical-psychologist.html" }
      - { title: "BA Psychology", text: "The usual first degree on this road.", href: "ba-psychology.html" }
    money: [nmmss, csss, pms-sc, wbscc, mysy]

  # ------------------------------------------------------------------ HOTEL MANAGER (batch 4)
  - id: hotel-manager
    name: "Hotel Manager / Hospitality Executive (B.Sc HHA / BHMCT)"
    search: ["hotel manager", "hotel general manager", "front office manager", "hospitality manager", "hotel operations"]
    page: "bhm.html"
    roadmap: "roadmaps/bhm.html"
    gate: "Class 12 in any stream with English → NCHM JEE (or your state's route) → 3-year B.Sc Hospitality &amp; Hotel Administration at an IHM, or a state BHMCT / B.H.T.M. → management trainee in hotels, airlines, cruise lines and catering."
    gate_source: [nc-ib, nc-bsc]
    foundation:
      - stages: [c8, c9, c10]
        title: "English, numbers and service"
        points:
          - text: "NCHM JEE has <strong>45 English questions out of 120</strong>, plus numerical ability, reasoning, general knowledge and aptitude for the service sector."
            source: nc-ib
          - text: "Speak and write English every day, help at home in the kitchen and at family events, and notice how good hotels and restaurants treat guests."
      - stages: [c11, c12]
        title: "Any stream — just keep English"
        points:
          - text: "NCHM JEE needs Class 12 <strong>with English</strong> as a subject; no stream is required and there is <strong>no age limit</strong>. You may sit while still in Class 12."
            source: nc-ib
          - text: "After admission you must give a physical-fitness certificate, because the course has kitchen, bakery, restaurant service and housekeeping practicals."
            source: nc-ib
      - stages: [ug, grad]
        title: "The degree and the first job"
        points:
          - text: "The B.Sc (HHA) is a 3-year, 6-semester <strong>JNU degree</strong> with an optional fourth year for Honours. It covers food production, food &amp; beverage service, front office and housekeeping, with marketing, finance and HR."
            source: nc-bsc
          - text: "Graduates start as management trainees in hotels, flight kitchens and airline services, or in guest relations, railway catering, tourism corporations, cruise lines and retail chains."
            source: nc-bsc
    board_notes:
      gseb:
        text: "Gujarat's B.H.T.M. through ACPC takes Std 12 in <strong>any stream</strong> with 45% total marks (40% reserved) — Arts and Commerce students too."
        source: acpc-htm
      cbse-gj:
        text: "ACPC's B.H.T.M. accepts Std 12 from any recognised board, any stream, with 45% (40% reserved)."
        source: acpc-htm
      upmsp:
        text: "UPTAC fills BHMCT seats on your <strong>CUET (UG)</strong> score; Intermediate with 45% (40% SC / ST) is the rule in its 2026-27 brochure."
        source: tac-ib
      msbshse:
        text: "For Maharashtra-candidature BHMCT seats you need HSC with 45% (40% reserved) and a non-zero score in <strong>MAH-B.HMCT-CET</strong> (2025-26 brochure)."
        source: cap-ib
      wb: "NCHM JEE is offered in English and Hindi; the medium you choose cannot be changed later."
      cbse: "Any CBSE stream works, as long as English is one of your Class XII subjects."
      other: "NCHM JEE accepts every recognised board, NIOS and state open schools (five subjects including English)."
    board_source: nc-ib
    exam:
      name: "NCHM JEE 2026 (B.Sc Hospitality &amp; Hotel Administration)"
      body: "NTA for NCHMCT (Ministry of Tourism)"
      href: "nchmct-jee.html"
      facts:
        - { label: "Paper", value: "120 MCQs · 2 hours · English or Hindi", source: nc-ib }
        - { label: "Marking", value: "+4 correct · −1 wrong", source: nc-ib }
        - { label: "Fee", value: "₹1,000 · ₹700 EWS · ₹450 SC / ST / PwD", source: nc-ib }
        - { label: "Age limit", value: "None", source: nc-ib }
      stages:
        head: ["Section", "Questions", "Marking", "Note"]
        rows:
          - ["Numerical Ability and Analytical Aptitude", "15", "+4 / −1", "School maths"]
          - ["Reasoning and Logical Deduction", "15", "+4 / −1", "—"]
          - ["General Knowledge &amp; Current Affairs", "15", "+4 / −1", "—"]
          - ["English Language", "45", "+4 / −1", "The biggest section"]
          - ["Aptitude for Service Sector", "30", "+4 / −1", "—"]
        source: nc-ib
      notes:
        - text: "Seats are then allotted by NCHMCT's centralised online counselling on merit-cum-choice, at 21 Central IHMs and the State, PSU, PPP and private IHMs affiliated to it."
          source: [nc-ib, nc-bsc]
        - text: "NCHMCT's fixed charges for the B.Sc (HHA): ₹1,600 admission, ₹3,600 enrolment, ₹10,215 JNU fee, ₹3,000 exam fee a semester, ₹8,000 refundable caution money. Tuition is extra and varies by institute (NCHMCT says ₹3–5 lakh in total)."
          source: nc-bsc
        - text: "These are the 2026 rules; the NCHM JEE 2027 bulletin was not out when this was written. Check exams.nta.nic.in/nchm-jee."
    state_rules:
      - state: gujarat
        text: "ACPC ran B.H.T.M. admission offline for 2026-27: forms by post or in person by <strong>30 June 2026</strong> with a ₹350 non-refundable registration fee. The NCHM list also includes a Central IHM at Gandhinagar."
        source: [acpc-htm, nc-ib]
      - state: uttar-pradesh
        text: "UPTAC fills 100% of BHMCT seats in government and aided institutes and 85% in private ones; up to 5% extra tuition-fee-waiver seats exist for BHMCT (see Money help). The NCHM list includes a Central IHM at Lucknow."
        source: [tac-ib, nc-ib]
      - state: maharashtra
        text: "Maharashtra's BHMCT is a <strong>4-year</strong> course. All-India candidates may apply on NCHM JEE or MAH-B.HMCT-CET, and NCHM JEE scorers get preference (2025-26 brochure). The NCHM list includes a Central IHM at Mumbai."
        source: [cap-ib, nc-ib]
      - state: west-bengal
        text: "The NCHM list includes a Central IHM at Kolkata; State-run IHMs follow the state's own reservation policy."
        source: nc-ib
      - text: "At Central IHMs the quotas are SC 15%, ST 7.5%, OBC-NCL (Central list) 27%, Gen-EWS 10% and 5% PwD within each. Institutes run or aided by state governments follow their state's policy."
        source: nc-ib
    multiverse:
      - { title: "Hotel management (BHM)", text: "The full career guide.", href: "bhm.html" }
      - { title: "Diploma in hotel management", text: "A shorter, skills-first route into kitchens and front office.", href: "diploma-hotel-management.html" }
      - { title: "Travel &amp; tourism", text: "Tour operations, airlines and travel companies.", href: "travel-tourism.html" }
      - { title: "Hotel management coaching", text: "NCHM JEE coaching near you.", href: "coaching-hotel.html" }
    money: [nmmss, nchm-fee, tfw-up, csss, pms-sc, wbscc, mysy]

  # ------------------------------------------------------------------ BIOTECH RESEARCH SCIENTIST (batch 4)
  - id: biotech-scientist
    name: "Biotech Research Scientist (B.Sc / B.Tech → M.Sc / M.Tech → PhD)"
    search: ["biotechnologist", "biotech research scientist", "biotechnology scientist", "biotech scientist"]
    page: "biotechnology.html"
    roadmap: "roadmaps/biotechnology.html"
    gate: "Class 12 Science → B.Sc (Biotechnology / Life Sciences) or B.Tech Biotechnology → GAT-B (DBT-supported M.Sc / M.Tech, with a monthly stipend) or JAM Biotechnology (IIT master's) → BET for a DBT-JRF PhD fellowship → R&amp;D posts."
    gate_source: [gatb-ib, jam27]
    foundation:
      - stages: [c8, c9, c10]
        title: "Biology, chemistry and lab habits"
        points:
          - text: "GAT-B's first section is <strong>60 questions at Class 12 level in Physics, Chemistry, Mathematics and Biology</strong> — what you learn in school is literally on the test."
            source: gatb-ib
          - text: "Keep a lab notebook for every practical, read science news, and take Science and Mathematics seriously in Class 10."
      - stages: [c11, c12]
        title: "Choose the bachelor's route"
        points:
          - text: "For B.Tech Biotechnology at NITs and NIT+ institutes, Class 12 must include <strong>Physics and Mathematics</strong>, with 75% (65% SC / ST / PwD) or your board's top 20 percentile."
            source: jm-ib
          - text: "For B.Sc Biotechnology / Life Sciences, PCB or PCMB is the usual combination — check your university's own rule. Keeping Mathematics with Biology keeps both doors open."
      - stages: [ug, grad]
        title: "Master's through GAT-B or JAM, then a PhD"
        points:
          - text: "<strong>GAT-B</strong> admits to DBT-supported M.Sc / M.Tech / M.V.Sc programmes: 1,316 sanctioned seats in 79 programmes for 2026-28. Most list 55% or 60% in the bachelor's — each university sets its own rule. Final-year students may apply."
            source: [gatb-inst, gatb-ib]
          - text: "<strong>JAM Biotechnology</strong> (BT paper) admits to IIT master's programmes. You may sit in the final year of your degree, as long as it is completed before admission. No age limit."
            source: jam27
          - text: "For a PhD, <strong>BET</strong> decides the DBT-Junior Research Fellowship: a 4-year research bachelor's with 75%, or a B.Tech / B.E. or master's with 60% (55% SC / ST / PwD)."
            source: gatb-ib
    board_notes:
      gseb:
        text: "For Gujarat B.E. Biotechnology seats, ACPC merit is <strong>50% HSC theory percentile</strong> (Maths, Physics, Chemistry) + <strong>50% GUJCET percentile</strong>; HSC needs 45% (40% reserved)."
        source: acpc-advt
      cbse-gj:
        text: "Schooling in Gujarat plus GUJCET opens ACPC's state-quota B.E. seats, including Biotechnology; your Class XII theory percentile is half the merit."
        source: acpc-advt
      upmsp:
        text: "UPTAC fills B.Tech seats, Biotechnology included, on your <strong>JEE Main</strong> rank; Intermediate needs 45% (40% SC / ST) in the required subjects."
        source: tac-ib
      msbshse:
        text: "MHT-CET is compulsory for Maharashtra-candidature B.E. / B.Tech seats; passing SSC and HSC in Maharashtra makes you a Type A candidate."
        source: mht-ib
      wb:
        text: "West Bengal domicile is needed for government-aided seats and every reserved seat in WBJEEB counselling."
        source: wb-ib
      cbse: "GAT-B and JAM are national and English-only; every board's Class 12 counts the same for the bachelor's that comes first."
      other: "GAT-B and JAM are national and English-only; every board's Class 12 counts the same for the bachelor's that comes first."
    board_source: gatb-ib
    exam:
      name: "GAT-B 2026 · JAM 2027 Biotechnology (BT) · BET 2026"
      body: "NTA for DBT / RCB · IIT Kharagpur (JAM 2027)"
      href: "biotechnology.html"
      facts:
        - { label: "GAT-B paper", value: "Attempt 120 of 160 MCQs · 240 marks · 3 hours", source: gatb-ib }
        - { label: "GAT-B fee", value: "₹1,300 · ₹650 SC / ST / PwD", source: gatb-ib }
        - { label: "JAM 2027 (BT)", value: "14 Feb 2027, afternoon · 60 questions · 100 marks · 3 hours", source: jam27 }
        - { label: "JAM fee", value: "₹2,000 · ₹1,000 female / SC / ST / PwD (one paper)", source: jam27 }
      stages:
        head: ["Exam", "Paper", "Marking", "Leads to"]
        rows:
          - ["GAT-B Section A", "60 compulsory MCQs, Class 12 PCMB level", "+1 / −0.5", "DBT-supported M.Sc, M.Tech, M.V.Sc (score valid one year)"]
          - ["GAT-B Section B", "Attempt 60 of 100 bachelor's-level MCQs", "+3 / −1", "Same"]
          - ["JAM (BT)", "30 MCQ + 10 MSQ + 20 NAT", "MCQ −1/3 or −2/3; MSQ and NAT no negative", "M.Sc and other master's at IITs"]
          - ["BET", "50 compulsory + attempt 50 of 150 MCQs", "+3 / −1", "DBT-JRF PhD fellowship (Category I) or project posts (Category II)"]
        source: [gatb-ib, jam27]
      notes:
        - text: "GAT-B 2026 was held on 17 May 2026 (BET the same afternoon); applying for both cost ₹2,600 (₹1,300 SC / ST / PwD). Both papers are in English only."
          source: gatb-ib
        - text: "After GAT-B results, you apply to each university separately; DBT and RCB play no part in admission. The 2026 schedule had first admission lists by 17 July and closure by 31 August."
          source: gatb-guide
        - text: "JAM 2027: after qualifying, you apply through the JAM portal to programmes in 23 IITs with a ₹750 processing fee."
          source: jam27
    state_rules:
      - state: gujarat
        text: "Gujarat universities in the GAT-B 2026 list include <strong>Gujarat Technological University, the Institute of Advanced Research and MSU Baroda</strong>."
        source: gatb-inst
      - state: uttar-pradesh
        text: "Uttar Pradesh universities in the GAT-B 2026 list include <strong>Banaras Hindu University</strong> (two programmes) and <strong>Gautam Buddha University</strong>."
        source: gatb-inst
      - state: maharashtra
        text: "Maharashtra institutes in the GAT-B 2026 list include <strong>Savitribai Phule Pune University, ICT Mumbai</strong> and VNMKV's agricultural biotechnology college at Latur."
        source: gatb-inst
      - state: west-bengal
        text: "<strong>Visva-Bharati</strong> runs an M.Sc Biotechnology in the GAT-B 2026 list."
        source: gatb-inst
      - text: "GAT-B admissions follow the Government of India reservation policy; there is no state quota in the DBT programme. JAM is open to all nationals with no age limit."
        source: [gatb-ib, jam27]
    multiverse:
      - { title: "Biotechnology", text: "The full career guide.", href: "biotechnology.html" }
      - { title: "Biotech colleges", text: "B.Sc and B.Tech Biotechnology colleges by state.", href: "colleges-biotech.html" }
      - { title: "Microbiology", text: "A close life-science route into labs.", href: "microbiology.html" }
      - { title: "Biomedical engineer", text: "Engineering for medical devices and diagnostics.", href: "biomedical-engineer.html" }
      - { title: "IISER IAT", text: "BS-MS research degrees straight after Class 12.", href: "iiser-iat.html" }
      - { title: "NEST", text: "Integrated M.Sc at NISER and UM-DAE CEBS.", href: "nest.html" }
    money: [nmmss, csss, pms-sc, tfw-up, gatb-fee, jam-fee, gatb-stipend, dbt-jrf, wbscc, mysy]

  # ------------------------------------------------------------------ PHARMACIST (batch 5, three-layer schema)
  - id: pharmacist
    v: 2
    name: "Pharmacist (D.Pharm / B.Pharm / Pharm.D)"
    search: ["pharmacist", "hospital pharmacist", "community pharmacist", "clinical pharmacist", "industrial pharmacist", "railway pharmacist"]
    search_not: ["ayurvedic", "unani", "veterinary"]
    page: "bpharm.html"
    roadmap: "roadmaps/bpharm.html"
    doubts_page: "journey-pharmacist.html"
    gate: "Class 12 with Physics, Chemistry and Biology or Maths → a 2-year D.Pharm or a 4-year B.Pharm at a PCI-approved college → register with your State Pharmacy Council → hospital, medical store, industry or government job; GPAT for M.Pharm."
    gate_source: [pci-er20, pci-bph]
    core:
      what:
        text: "A pharmacist checks a doctor's prescription, gives out the right medicine in the right dose and tells the patient how to take it safely. Pharmacists also make and test medicines in factories and labs. By law, only a <strong>registered pharmacist</strong> may prepare or give out medicine on a doctor's prescription."
        source: pci-s42
      day:
        - "In a hospital or medical store: read prescriptions, pick and check medicines, explain doses and side effects, keep the stock and expiry dates in order."
        - "In a medicine factory: help make, pack or test batches, and keep the records that drug inspectors check."
        - "In government service: run the pharmacy of a hospital, dispensary or railway health unit."
      pay:
        - { level: "Government entry (Railways)", value: "Pay Level 5 · ₹29,200 initial pay — Pharmacist (Entry Grade), RRB CEN 03/2025", source: rrb-para }
      pay_note: "No official body publishes private-sector or mid- and senior-career pharmacist pay, so we print only the government entry pay."
      routes:
        - { title: "Medical store or hospital pharmacy", text: "Needs registration with your State Pharmacy Council. Only a registered pharmacist may dispense medicine on a prescription.", source: pci-s42 }
        - { title: "Government pharmacist", text: "Railway Recruitment Boards hire Pharmacist (Entry Grade) with a D.Pharm or B.Pharm and registration; states hire through their own boards.", source: rrb-para }
        - { title: "Industry and research", text: "A B.Pharm, then GPAT for M.Pharm and a Ph.D. A valid GPAT, GATE or NET score also opens NIPER JEE for the National Institutes of Pharmaceutical Education and Research.", source: [gp-ib, nj-br] }
        - { title: "Clinical pharmacy (Pharm.D)", text: "A 6-year Pharm.D: five years of study and one year of internship or residency in a hospital.", source: pci-pharmd }
      cost_time:
        - { label: "D.Pharm", value: "2 academic years + 500 hours of practical training (at least 3 months)", source: pci-er20 }
        - { label: "B.Pharm", value: "4 years full time; D.Pharm holders can join in the 2nd year", source: pci-bph }
        - { label: "Pharm.D", value: "6 years (5 years of study + 1 year internship)", source: pci-pharmd }
        - { label: "GPAT fee (2026)", value: "₹3,500 · ₹2,500 for SC / ST / PwD", source: gp-ib }
      cost_note: "College fees are set by each state's fee committee or the college itself, so we do not print one national figure."
      challenges:
        - text: "Your college must be approved by the Pharmacy Council of India (PCI). A D.Pharm from an institution that is not approved under section 12 of the Pharmacy Act does not lead to registration."
          source: pci-dpee
        - text: "Government posts are few: the 2025 railway notice had <strong>105</strong> Pharmacist (Entry Grade) posts across all RRBs."
          source: rrb-para
        - text: "GPAT qualifies only the top 10% of candidates who sit it, and they must also cross a minimum percentile."
          source: gp-ib
        - text: "The D.Pharm exit exam rules of 2022 are still on the books, but the exam has not been held. PCI's circular of 20 February 2026 told State Pharmacy Councils to register pass-outs under the Pharmacy Act — watch PCI for any change."
          source: [pci-dpee, pci-dpee26]
      not_for:
        - "You want to examine patients and decide the treatment — that is a doctor's job; a pharmacist works from the doctor's prescription."
        - "You dislike chemistry and careful checking — one wrong medicine or dose can harm a patient."
        - "You want a job with no rules and records — medicine stock, licences and registers are checked by inspectors."
    journey:
      - stages: [c8, c9]
        title: "Find out if medicines interest you"
        do:
          - text: "Learn your Science and Maths well — pharmacy courses after Class 12 need <strong>Physics and Chemistry</strong>, plus Biology or Maths."
            source: pci-er20
          - text: "Visit a medical store or a hospital pharmacy with a parent and watch what the pharmacist does in a day."
        mistakes:
          - "Thinking a pharmacist only sells medicines. Hospitals, factories, labs and government health services all hire pharmacists."
        doubts:
          - q: "Do I need NEET to become a pharmacist?"
            a: "No national rule asks for NEET. The PCI rules for D.Pharm and B.Pharm only ask for Class 12 with Physics, Chemistry and Biology or Maths. Each state picks its own admission test — for example KCET in Karnataka and the Kerala pharmacy entrance in Kerala."
            next: "Look up your state's admission route in the State rules block of your blueprint."
            source: [pci-bph, kcet-ib, ke-noti]
          - q: "Is a pharmacist just a medical shop job?"
            a: "No. Registered pharmacists work in hospitals, medicine factories, labs, government health services and the railways. Some go on to M.Pharm and research."
            next: "Read the Routes list in the first block."
            source: [rrb-para, gp-ib]
      - stages: [c10]
        title: "Choose Science with Physics and Chemistry"
        do:
          - text: "Take Science in Class 11 with <strong>Physics, Chemistry and either Biology or Mathematics</strong>. For B.Pharm, English must also be one of your Class 12 subjects."
            source: [pci-er20, pci-bph]
        stream: "PCB or PCM — both are accepted. PCMB keeps every pharmacy course open."
        mistakes:
          - "Taking Commerce or Arts and planning to switch later — pharmacy needs Physics and Chemistry in Class 12."
        late: "Already in Commerce or Arts in Class 11? There is no pharmacy route without Class 12 Science. You would have to pass Class 12 again with Physics, Chemistry and Biology or Maths."
        doubts:
          - q: "Can I study pharmacy straight after Class 10?"
            a: "No. Even the 2-year D.Pharm needs a pass in Class 12 Science with Physics, Chemistry and Biology or Mathematics."
            next: "Pick PCB or PCM for Class 11."
            source: pci-er20
          - q: "Can a Commerce or Arts student become a pharmacist?"
            a: "Not without Science. D.Pharm, B.Pharm and Pharm.D all need Physics and Chemistry in Class 12, with Biology or Mathematics."
            next: "If you are in Class 10 now, choose Science for Class 11."
            source: [pci-er20, pci-bph, pci-pharmd]
          - q: "Is Biology or Maths better for pharmacy?"
            a: "Both are accepted for D.Pharm, B.Pharm and Pharm.D. Some state tests let you write either group — Karnataka's KCET takes PCM or PCB for B.Pharm."
            next: "Pick the group you score better in."
            source: [pci-bph, kcet-ib]
      - stages: [c11, c12]
        title: "Class 12 + your state's admission test"
        do:
          - text: "Pass Class 12 with Physics, Chemistry and Biology or Maths. PCI's B.Pharm rules set no minimum percentage, but states do — Karnataka asks for 45% (40% for reserved categories)."
            source: [pci-bph, kcet-ib]
          - text: "You must be <strong>17 years old by 31 December</strong> of the year you join B.Pharm or Pharm.D."
            source: [pci-bph, pci-pharmd]
          - text: "Register for your state's entrance test early in your Class 12 year — the 2026 dates are below."
        exams:
          - { name: "KEAM pharmacy entrance (Kerala)", when: "Computer test 17–23 Apr 2026", source: ke-noti }
          - { name: "AP EAPCET — Agriculture &amp; Pharmacy", when: "Applications from 4 Feb 2026 · test 19–20 May 2026", source: eap-ib }
          - { name: "MHT-CET (Maharashtra)", when: "Compulsory for Maharashtra-candidature B.Pharm / Pharm.D seats", source: mht-ib }
        money: [csss, pms-sc]
        mistakes:
          - "Joining a college without checking that PCI has approved it for that year."
          - "Forgetting the state test, then finding that government-college seats are filled only through it."
        late: "Missed your state's B.Pharm test? Many states fill D.Pharm seats on Class 12 marks (Karnataka does), and a D.Pharm lets you join B.Pharm in the 2nd year later."
        doubts:
          - q: "What percentage do I need in Class 12 for B.Pharm?"
            a: "The PCI B.Pharm Regulations do not set a percentage — your state's rules do. Karnataka needs 45% in Physics, Chemistry and Biology or Maths (40% for reserved categories)."
            next: "Check your state's brochure for its own cut-off."
            source: [pci-bph, kcet-ib]
          - q: "What is the minimum age for pharmacy courses?"
            a: "For B.Pharm and Pharm.D you must be 17 by 31 December of your admission year. Kerala sets no upper age limit for B.Pharm."
            next: "Check your date of birth against 31 December of your joining year."
            source: [pci-bph, pci-pharmd, ke-noti]
          - q: "D.Pharm or B.Pharm — which should I choose?"
            a: "D.Pharm is 2 years plus 500 hours of training and is the minimum qualification to register as a pharmacist. B.Pharm is 4 years and opens GPAT, M.Pharm and industry roles. A D.Pharm holder can join B.Pharm in the second year."
            next: "Choose D.Pharm to start work sooner, B.Pharm for industry or higher study."
            source: [pci-er20, pci-bph]
          - q: "What is Pharm.D?"
            a: "A 6-year course — five years of study and one year of internship or residency — for clinical work in hospitals. You can join after Class 12 with Physics, Chemistry and Maths or Biology, or after a D.Pharm."
            next: "Pick Pharm.D if you want to work with doctors on hospital wards."
            source: pci-pharmd
          - q: "Can I do B.Pharm after NIOS or open school?"
            a: "The 2014 B.Pharm Regulations said students with Class 12 from open schools such as NIOS are not eligible. News reports in 2026 say PCI has since allowed open-school students, but we have not read that circular."
            next: "Before choosing NIOS, ask your state's pharmacy admission body in writing whether it accepts it."
            source: pci-bph
      - stages: [ug]
        title: "In D.Pharm or B.Pharm: year by year"
        do:
          - text: "<strong>D.Pharm:</strong> two academic years, then <strong>500 hours of practical training</strong> spread over at least three months under a registered pharmacist."
            source: pci-er20
          - text: "<strong>B.Pharm:</strong> after your 2nd year, do <strong>150 hours</strong> of practical training (at least one month) in a hospital, community pharmacy or medicine factory."
            source: pci-bph
          - text: "<strong>B.Pharm 3rd year:</strong> you may already sit GPAT, if your final-year result will come before the M.Pharm admission year you are aiming for. <strong>Final year:</strong> sit GPAT in the year of your result."
            source: gp-ib
        exams:
          - { name: "GPAT (for M.Pharm and the PCI scholarship)", when: "2026 cycle: form 23 Dec 2025 – 12 Jan 2026 · exam 7 Mar 2026", source: gp-ib }
        money: [pms-sc, csss, gpat-sch]
        mistakes:
          - "Losing your practical-training contract form — the training in-charge signs it when you finish, and your D.Pharm is not complete without it."
        doubts:
          - q: "Is there an exit exam after D.Pharm?"
            a: "PCI made rules for a D.Pharm exit exam in 2022 (three papers, 50% in each), but the exam has not been held. On 20 February 2026 PCI told State Pharmacy Councils to register D.Pharm pass-outs under the Pharmacy Act."
            next: "Keep checking pci.nic.in for any new exam notice before you finish."
            source: [pci-dpee, pci-dpee26]
          - q: "Does my college's PCI approval really matter?"
            a: "Yes. Registration needs a course from an institution approved by PCI under section 12 of the Pharmacy Act, and no one may start a B.Pharm course without PCI's approval."
            next: "Check the college on PCI's approved list every year you pay fees."
            source: [pci-dpee, pci-bph]
          - q: "When can I write GPAT?"
            a: "In your final (4th) year of B.Pharm, or even in your 3rd year if your final result comes before that M.Pharm admission year. GPAT 2026 had 125 questions for 500 marks, with −1 for a wrong answer."
            next: "Start GPAT practice in your 3rd year."
            source: gp-ib
      - stages: [grad]
        title: "Register, then pick your path"
        do:
          - text: "Apply to the <strong>State Pharmacy Council</strong> of the state where you live or work to enter your name in its register."
            source: pci-dpee
          - text: "For a railway job, watch for the RRB Paramedical notice: Pharmacist (Entry Grade) needs Class 12 Science with D.Pharm or a B.Pharm, plus registration. Age 20–35 in the 2025 notice."
            source: rrb-para
          - text: "For M.Pharm and Ph.D., use your GPAT score — it is valid for three years."
            source: gp-ib
        exams:
          - { name: "RRB Paramedical (Pharmacist Entry Grade)", when: "CEN 03/2025: applications 9 Aug – 8 Sep 2025", source: rrb-para }
          - { name: "NIPER JEE (Master's)", when: "Needs a valid GPAT, GATE or NET score", source: nj-br }
        money: [gpat-sch]
        doubts:
          - q: "Where do I register as a pharmacist?"
            a: "With the State Pharmacy Council of the state where you live or run your pharmacy work. A registered pharmacist is someone whose name is on that state's register."
            next: "Keep your marksheets, training certificate and ID ready for the council's online form."
            source: pci-dpee
          - q: "Can I work in a medical shop without registration?"
            a: "Not as the pharmacist. Section 42 of the Pharmacy Act lets only a registered pharmacist prepare or dispense medicine on a doctor's prescription; the Kerala High Court upheld this rule in 2017."
            next: "Register first, then apply for pharmacist jobs."
            source: pci-s42
          - q: "How do I get a government pharmacist job?"
            a: "Railways hire through the RRB Paramedical exam: one computer-based test with −1/3 mark for a wrong answer, then document check and medical. Pharmacist (Entry Grade) starts at Pay Level 5, ₹29,200."
            next: "Watch rrb websites for the next Paramedical notice."
            source: rrb-para
          - q: "Is GPAT compulsory for M.Pharm?"
            a: "PCI-approved institutions accept the GPAT score for M.Pharm and Ph.D. admission, but GPAT gives no automatic seat — each state or admission committee sets its rules. NIPER JEE needs GPAT, GATE or NET."
            next: "Read your state's M.Pharm counselling rules before you plan."
            source: [gp-ib, nj-br]
      - stages: [work]
        title: "Switching to pharmacy later"
        do:
          - text: "PCI's B.Pharm rules set a minimum age of 17 but no maximum, so you can start later if you have Class 12 Science."
            source: pci-bph
          - text: "Government jobs have upper age limits: 35 years for Pharmacist (Entry Grade) in the 2025 railway notice, with category relaxations."
            source: rrb-para
        doubts:
          - q: "I am 25 or older. Can I still study B.Pharm?"
            a: "Yes — PCI's B.Pharm rules have only a minimum age of 17. Kerala's KEAM also sets no upper age for B.Pharm. You still need Class 12 with Physics, Chemistry and Biology or Maths."
            next: "Check your state's brochure for its own age rule."
            source: [pci-bph, ke-noti]
    board_note: "Pharmacy courses need Physics and Chemistry in Class 12 with Biology or Maths; B.Pharm also needs English as a subject. Every board's Class 12 counts if your state's admission body accepts it."
    board_source: pci-bph
    exam:
      name: "GPAT 2026 (for M.Pharm) · RRB Pharmacist (for government jobs)"
      body: "NBEMS for the Pharmacy Council of India · Railway Recruitment Boards"
      href: "gpat.html"
      facts:
        - { label: "GPAT paper", value: "125 MCQs · 500 marks · 3 hours", source: gp-ib }
        - { label: "GPAT marking", value: "+4 correct · −1 wrong", source: gp-ib }
        - { label: "GPAT score", value: "Valid 3 years", source: gp-ib }
        - { label: "RRB Pharmacist pay", value: "Level 5 · ₹29,200", source: rrb-para }
      stages:
        head: ["Step", "What it is", "Rule"]
        rows:
          - ["D.Pharm or B.Pharm", "PCI-approved course after Class 12 Science", "Physics + Chemistry + Biology or Maths"]
          - ["Registration", "Name entered with your State Pharmacy Council", "Needed to dispense medicine"]
          - ["GPAT", "National test for M.Pharm and the PCI scholarship", "Top 10% who cross the category percentile qualify"]
          - ["RRB CBT", "Railway Pharmacist (Entry Grade) test", "One CBT, −1/3 per wrong answer, then documents and medical"]
        source: [pci-er20, gp-ib, rrb-para]
      notes:
        - text: "GPAT minimum percentile: 50th for General / EWS, 45th for OBC / SC / ST and PwBD."
          source: gp-ib
        - text: "NBEMS only conducts GPAT. Admission and scholarship payment follow each state's or admission committee's rules."
          source: gp-ib
    state_uses: [board, tech, scholarship, psc]
    state_rules:
      - state: karnataka
        text: "<strong>B.Pharm and Pharm.D</strong> government seats go through <strong>KCET</strong> — you may write PCM or PCB. B.Pharm needs 45% in PCB or PCM (40% reserved), or a D.Pharm with 45%. <strong>D.Pharm</strong> has no test: seats go on II PUC marks after registering with KEA."
        source: kcet-ib
        href: "state/karnataka/kcet.html"
      - state: kerala
        text: "B.Pharm is ranked only on the <strong>Kerala Pharmacy Entrance</strong> (Chemistry 45 + Physics 30 questions, 90 minutes, out of 300) inside KEAM. Fee ₹925 (₹400 SC, nil for ST). No upper age. Non-Keralite II candidates cannot get government pharmacy seats."
        source: [ke-noti, ke-pros]
        href: "state/kerala/keam.html"
      - state: maharashtra
        text: "<strong>MHT-CET</strong> is compulsory for Maharashtra-State and Minority candidature B.Pharm / Pharm.D seats. All-India-candidature seats prefer the <strong>NEET</strong> score."
        source: mht-ib
        href: "state/maharashtra/mhtcet.html"
      - state: andhra-pradesh
        text: "<strong>AP EAPCET</strong> admits to B.Pharmacy and Pharm.D. In 2026 the Agriculture &amp; Pharmacy test ran on 19–20 May; Pharm.D needs a minimum age of 17."
        source: eap-ib
        href: "state/andhra-pradesh/eapcet.html"
      - state: telangana
        text: "<strong>TG EAPCET</strong> admits to B.Pharmacy and Pharm-D, and ranks come only from normalised EAPCET marks. Fee ₹900 (₹500 SC / ST / PH) for one stream."
        source: tg-eap-dn
        href: "state/telangana/eapcet.html"
      - state: gujarat
        text: "<strong>GUJCET</strong> (run by GSEB) is used for degree and diploma pharmacy admissions, which <strong>ACPC</strong> conducts."
        source: [gujcet-reg, acpc-be]
        href: "state/gujarat/acpc.html"
      - state: bihar
        text: "<strong>D.Pharm</strong> seats come through <strong>DCECE (PM group)</strong>: Intermediate science with Physics, Chemistry, English and Maths or Biology; age 17–32 on 31 Dec 2026; a parent (or spouse) must be a permanent resident of Bihar or fit one of the other residence rules."
        source: dcece-pros
        href: "state/bihar/bceceb.html"
      - state: delhi
        text: "At <strong>GGSIPU</strong>, B.Pharm (programme 133) seats go first by <strong>IPU CET</strong> rank, then by CUET for seats left over."
        source: ipu-ib
        href: "state/delhi/ipu-cet.html"
      - text: "PCI's course rules are the same in every state. Registration is with the State Pharmacy Council of the state where you live or work."
        source: [pci-bph, pci-dpee]
    multiverse:
