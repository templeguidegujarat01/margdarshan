  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Do I need Biology or Maths for B.Pharm?"
            a: "Physics and Chemistry are generally compulsory, and universities typically also require either Biology or Mathematics at Class 12 — this makes B.Pharm genuinely more flexible than most other medical-adjacent degrees, which require PCB specifically. Check your target university's exact requirement, since it can vary."
          - q: "Why is there such a huge salary gap between pharmacy jobs?"
            a: "Because which sector you enter matters enormously. The salary gap between the highest and lowest-paying pharmacy sectors is reported to be as much as 8-10 times for the same qualification level. Retail and community pharmacy — the most common entry point — pays the least, while specialisations like regulatory affairs and pharmacovigilance are reported to most dramatically elevate pharmacy salaries over a career."
          - q: "What is a realistic B.Pharm salary in India?"
            a: "Freshers commonly earn ₹2.5-4.5 LPA overall, though this varies hugely by sector. Retail and hospital pharmacy roles commonly start at ₹2.5-4 LPA, while pharma industry roles (production, QC, R&amp;D) commonly start at ₹3-6 LPA. Government pharmacist roles at institutes like All India Institute of Medical Sciences (AIIMS) or ESIC are reported to pay ₹45,000-65,000 per month with allowances. With a regulatory affairs specialisation, professionals are reported to reach ₹20-25 LPA within 7-8 years at multinational companies."
          - q: "What is the difference between B.Pharm, D.Pharm and Pharm.D?"
            a: "B.Pharm is a 4-year undergraduate degree with the broadest scope, opening doors to industry, regulatory affairs, R&amp;D and further postgraduate study. D.Pharm is a 2-year diploma focused mainly on retail and community pharmacy dispensing, with a more limited career ceiling. Pharm.D is a 6-year doctoral-level programme (or 3 years after B.Pharm) focused on clinical, hospital-based patient care, and is particularly strong for hospital pharmacy leadership roles."
          - q: "Should I do GPAT/M.Pharm after B.Pharm?"
            a: "It's a strong option if you're targeting industry roles in Pharmaceutics, Pharmaceutical Quality Assurance, Pharmacology or Pharmaceutical Analysis, since M.Pharm specialisations are directly mapped to the industry's highest-demand roles. GPAT (Graduate Pharmacy Aptitude Test) is the entrance exam for M.Pharm programmes. It isn't mandatory, though — many graduates instead pursue certifications in regulatory affairs (IIRM, RAPS) or an MBA in Pharmaceutical Management to reach similarly high-paying roles without a full postgraduate science degree."
      - note: "Figures are indicative (2026) — confirm on the official college or authority website."
        class: "table-note mt-lg"
