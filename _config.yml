title: Margdarshan
description: "Free career guidance platform for Indian students after Class 10 and Class 12"
lang: en
locale: en_IN

# Absolute URLs (canonical, og:url, JSON-LD) are built from these two values.
# If the site moves to a custom domain, change them here and nothing else.
url: "https://emargdarshan.com"
baseurl: ""

# GitHub Pages runs Jekyll automatically for this repo — no extra setup needed.
# This file just keeps the build predictable and avoids Jekyll doing anything
# we don't want (like treating dotfiles or the README as pages).

# Old state/city sub-pages (removed) redirect to the unified finder with
# ?state= preselected — see redirects/*.html (redirect_to front matter).
plugins:
  - jekyll-redirect-from

exclude:
  - README.md
  - LICENSE
  - scripts
  - node_modules
  - docs

# Every page uses _layouts/default.html, which owns the shared <head>, header,
# breadcrumb, footer and scripts. A page only supplies front matter (title,
# description, stream, breadcrumb, footer links …) plus its own <main> content.
# See the comment at the top of _layouts/default.html for every supported key.
defaults:
  - scope:
      path: ""
    values:
      layout: default
  # Country editions (see _data/regions.yml). Every page under us/ is USA-edition
  # context; everything else stays India (the default) with no front matter change.
  - scope:
      path: "us"
    values:
      region: us
