          - label: "State CETs"
            text: "MHT-CET, KCET, AP/TS EAMCET and similar exams for state government and private colleges."
          - label: "Diploma lateral entry"
            text: "A state-level exam (often called LEET) lets Diploma in Electronics Engineering holders join directly into Year 2."
