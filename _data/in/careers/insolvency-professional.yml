sections:
  - id: "quick"
    hid: "quick-heading"
    alt: true
    eyebrow: "Quick answers"
    heading: "Insolvency Professional at a glance"
    intro: "Check whether your Class 12 background qualifies. Duration and pay are in the summary at the top of the page."
    parts:
      - subhead: "Can I apply from my stream?"
      - streams:
          - label: "Science"
            fit: "Eligible"
            tone: "y"
            icon: "science"
          - label: "Commerce"
            fit: "Eligible"
            tone: "y"
            icon: "commerce"
          - label: "Arts / Humanities"
            fit: "Eligible"
            tone: "y"
            icon: "arts"
      - note: "Any stream at Class 12; you qualify later through a professional qualification plus experience, or the GIP."
  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What does an Insolvency Professional do?"
    parts:
      - overview:
          points:
            - "IPs take control of a company in insolvency, invite and assess resolution plans, run the committee of creditors' process and report to the National Company Law Tribunal (NCLT)."
            - "As liquidators they sell assets and distribute proceeds as the Code requires."
            - "The work combines law, finance, negotiation and project management under strict timelines."
  - id: "who"
    hid: "who-heading"
    alt: true
    eyebrow: "Fit check"
    heading: "Who should become an Insolvency Professional"
    parts:
      - fit:
          match:
            - "Have (or plan) a CA, CS, CMA, law or management background."
            - "Handle pressure, deadlines and many stakeholders."
            - "Want a high-responsibility, independent practice."
          mismatch:
            - "Want an entry job straight after graduation without the GIP."
            - "Dislike legal and regulatory scrutiny."
            - "Prefer predictable 9-to-5 work."
  - id: "eligibility"
    hid: "elig-heading"
    eyebrow: "Eligibility"
    heading: "What you need, stage by stage"
    parts:
      - elig_list:
          - "<strong>Experience route:</strong> a professional membership (CA, CS, CMA, advocate) or degree plus the years of professional/managerial experience the IP Regulations list (for example 10 years for professionals)."
          - "<strong>Graduate route:</strong> complete IBBI's Graduate Insolvency Programme if you have less than 10 years' experience."
          - "Pass the <strong>Limited Insolvency Examination</strong> and enrol with an IPA within 12 months."
          - "Complete the IPA's pre-registration educational course, then apply to IBBI. Non-residents cannot practise as IPs."
  - id: "roadmap"
    hid: "roadmap-heading"
    alt: true
    eyebrow: "Step-by-step"
    heading: "Your full path to becoming an Insolvency Professional"
    parts:
      - steps:
          - title: "Graduate / professional qualification"
            text: "Law, CA, CS, CMA or management."
          - title: "Experience or GIP"
            text: "Build the required years, or join the Graduate Insolvency Programme."
          - title: "Limited Insolvency Examination"
            text: "Insolvency law, corporate law, finance and valuation basics."
          - title: "Enrol with an IPA"
            text: "Within 12 months of passing the exam."
          - title: "Pre-registration course"
            text: "Run by the IPA."
          - title: "IBBI registration"
            text: "Then an Authorisation for Assignment to take cases."
  - id: "exams"
    hid: "exams-heading"
    eyebrow: "Exams & licences"
    heading: "Exam and registration steps"
    parts:
      - chips:
          - label: "Limited Insolvency Examination"
            text: "The qualifying exam for IPs; the syllabus and format are published for IBBI."
            source: "ibbi"
          - label: "Graduate Insolvency Programme"
            text: "A two-year IBBI programme for young graduates and professionals."
            source: "ibbi"
          - label: "IPAs"
            text: "Insolvency Professional Agencies enrol and supervise IPs; IBBI lists them."
            source: "ibbi"
  - id: "salary"
    hid: "salary-heading"
    alt: true
    eyebrow: "Indicative figures"
    heading: "Insolvency Professional pay in India"
    intro: "Pay varies a lot by employer, city and whether you practise independently; these are broad, commonly reported ranges, not guarantees."
    parts:
      - salary:
          - label: "Associate in an IP firm"
            value: "Entry level"
            text: "Many start as associates supporting senior IPs."
          - label: "Registered IP"
            value: "Fee-based"
            text: "Fees for each assignment are approved by creditors under IBBI rules."
          - label: "Senior IP"
            value: "High"
            text: "Large resolution cases are well paid but demanding."
  - id: "jobs"
    hid: "jobs-heading"
    eyebrow: "Where they work"
    heading: "Employers & growth path"
    parts:
      - chips:
          - label: "Work comes from"
            text: "Creditors, NCLT appointments and banks"
          - label: "Employers"
            text: "Insolvency professional entities, consulting and law firms, banks' stressed-asset teams"
          - label: "Growth path"
            text: "Associate → IP → partner in an insolvency professional entity"
  - id: "proscons"
    hid: "pc-heading"
    alt: true
    eyebrow: "Honest take"
    heading: "Advantages and disadvantages"
    parts:
      - proscons:
          pros:
            - "High-responsibility, well-paid statutory role."
            - "Builds on a CA/CS/CMA/law career."
            - "Graduate route exists for younger aspirants."
          cons:
            - "Needs years of experience or the GIP first."
            - "Intense timelines and legal liability."
            - "Fee income depends on getting appointed."
