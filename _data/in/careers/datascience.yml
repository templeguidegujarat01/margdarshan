          cons:
            - "Company type explains much of the salary gap — Information Technology (IT) services and analytics firms pay meaningfully less than product/FAANG-equivalent companies for similar experience."
            - "Entry-level competition has grown as more students pursue \"data science\" as a buzzword without building real depth."
            - "Staying at Excel/SQL level alone caps your ceiling — real pay growth needs Python, ML and increasingly GenAI-adjacent skills."
  - hid: "myth-heading"
    eyebrow: "Common myths"
    heading: "Myths vs facts"
    parts:
