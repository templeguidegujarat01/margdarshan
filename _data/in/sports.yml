    domain: mind
    body: "FIDE · All India Chess Federation (AICF)"
    card: "FIDE rating and title rules, GM norms, AICF age-group nationals, arbiter route and the chess clause in sports-quota jobs."
    card_facts: ["GM = 2500 + norms", "Rating floor 1400", "GM/IM titles count for jobs"]
    eyebrow: "Sports Cockpit · Mind &amp; Strategy · FIDE regulations 2024–26"
    title: "Chess — FIDE ratings, GM norms &amp; India's age-group pathway"
    lede: "How a child in India goes from a first rated game to Grandmaster: the FIDE rating rules, every title threshold, what counts as a norm, the AICF national age-group ladder, the arbiter career, and how a title opens government jobs and cash awards."
    official:
      - { label: "FIDE Title Regulations", url: "https://handbook.fide.com/chapter/B012024" }
      - { label: "aicf.in", url: "https://aicf.in/" }
    facts:
      - { label: "Grandmaster", value: "Rating <strong>2500</strong> + norms over <strong>27 games</strong>", source: fide-titles }
      - { label: "First FIDE rating", value: "<strong>5 games</strong> vs rated players, at least <strong>1400</strong>", source: fide-rating }
      - { label: "Titles", value: "<strong>Valid for life</strong> (revocable for fair-play breach)", source: fide-titles }
      - { label: "Govt sports quota", value: "<strong>GM / IM title</strong> or Olympiad qualifies", source: dopt-2024 }
    sections:
      - id: rules
        nav: "Ratings &amp; titles"
        eyebrow: "Core rules &amp; category limits"
        heading: "How FIDE ratings and titles work"
        parts:
          - list:
              - "A first FIDE rating is published after <strong>at least 5 games against rated opponents</strong> (pooled over up to 26 months), and it must be <strong>at least 1400</strong>."
              - "A player whose rating <strong>drops below 1400 is shown as unrated</strong> on the next list."
              - "The K-factor is <strong>40</strong> for a new player until 30 games, and for every player <strong>until the end of the year of their 18th birthday</strong> while rated under 2300 — young players' ratings move fast."
            source: fide-rating
          - table:
              caption: "Minimum thinking time for a standard-rated game (each player)"
              head: ["Players' ratings", "Minimum time"]
              rows:
                - ["Either player 2400+", "<strong>120 minutes</strong>"]
                - ["Either player 1800+", "<strong>90 minutes</strong>"]
                - ["Both below 1800", "<strong>60 minutes</strong>"]
            source: fide-rating
          - table:
              caption: "FIDE titles and what they need"
              head: ["Title", "Rating needed", "Norm route"]
              rows:
                - ["<strong>Grandmaster (GM)</strong>", "2500 at some time", "Norms over at least 27 games; norm performance 2600 vs average 2380+"]
                - ["International Master (IM)", "2400", "Norm performance 2450 vs average 2230+"]
                - ["Woman Grandmaster (WGM)", "2300", "Norm performance 2400 vs average 2180+"]
                - ["Woman International Master (WIM)", "2200", "Norm performance 2250 vs average 2030+"]
                - ["FIDE Master (FM)", "2300", "Rating only (30 rated games)"]
                - ["Candidate Master (CM)", "2200", "Rating only"]
                - ["Woman FIDE Master (WFM)", "2100", "Rating only"]
                - ["Woman Candidate Master (WCM)", "2000", "Rating only"]
            source: fide-titles
          - list:
              - "A norm needs at least <strong>9 games</strong> in a FIDE-rated event, with an International or FIDE Arbiter in charge and at most 2 rounds a day."
              - "At least <strong>half the opponents must hold titles</strong>; for a GM norm at least <strong>one-third (minimum 3) must be GMs</strong>."
              - "Opponents must come from at least <strong>two federations other than the player's</strong> (national championships and some large Swiss opens are exempt), with at most 3/5 from the player's own federation."
              - "A GM or WGM application needs at least one norm from an event with only <strong>one round a day for at least 3 days</strong>, and — for norms after 30 June 2022 — at least one from a strong Swiss (40+ players averaging 2000+ every round), the Olympiad, a World Cup or Candidates qualifier, or a national championship final."
            source: fide-titles
      - id: recognition
        nav: "Recognition"
        eyebrow: "Institutional &amp; global recognition"
        heading: "The events that count — and the awards they bring"
        parts:
          - list:
              - "The Ministry's cash-award scheme covers the <strong>World Chess Championship</strong> (biennial), the <strong>Chess Olympiad</strong> (biennial), the <strong>FIDE Candidates</strong> (treated at par with the World Championship) and the Asian Continental Championship."
              - "Biennial world events pay <strong>₹20 lakh / ₹14 lakh / ₹8 lakh</strong> for gold / silver / bronze; in team events such as the Olympiad each member gets <strong>75%</strong> of that amount."
            source: myas-cash
          - table:
              caption: "International youth events on the AICF calendar, 2026"
              head: ["Event", "Where and when"]
              rows:
                - ["FIDE World Championships U7, U9, U11, U13, U15, U17", "Roquetas de Mar, Spain · 13–21 Oct 2026"]
                - ["Western Asian Youth Championships", "Ahmedabad, Gujarat · 22–31 Oct 2026"]
                - ["FIDE World Junior Rapid &amp; Blitz (U20)", "Al Ain, UAE · 1–7 Nov 2026"]
                - ["FIDE World Junior U20 Championships", "Greater Caracas, Venezuela · 17–28 Nov 2026"]
                - ["Asian Junior Open &amp; Girls Championships", "Mumbai · 16–26 Aug 2026 (held)"]
            source: aicf
      - id: eligibility
        nav: "Eligibility"
        eyebrow: "Physical, age &amp; gender eligibility"
        heading: "Who can play — and which titles are open to whom"
        parts:
          - list:
              - "FIDE titles are in two lists: <strong>Open</strong> (GM, IM, FM, CM) — open to every player, men and women — and <strong>Women's</strong> (WGM, WIM, WFM, WCM)."
              - "Titles are <strong>for life</strong>, but FIDE can remove a title if the player breached the <strong>Fair Play Regulations</strong> in a tournament used for it."
              - "There is no height, weight or upper age rule in the title regulations; the age at which a title is achieved is the date of the last result or the rating, whichever is later."
            source: fide-titles
          - p: "Age-group play in India runs through <strong>AICF national championships</strong> (for example the National Under-9 at Ranchi, 6–12 July 2026, and the National Under-11 at Mangaluru, 2–8 August 2026) and the FIDE world youth events from U7 to U17 and U20."
            source: aicf
      - id: roadmap
        nav: "Roadmap"
        eyebrow: "Grassroots-to-elite roadmap"
        heading: "From first rated game to Grandmaster"
        parts:
          - table:
              caption: "The chess ladder"
              head: ["Step", "What to do", "Target"]
              rows:
                - ["1. Register", "Create an AICF player ID on the AICF Player Registration System", "Needed for AICF events"]
                - ["2. District &amp; state", "State association tournaments and age-group selections", "Qualify for nationals"]
                - ["3. National age-group", "AICF U-7 to U-19 nationals, National School Team (U12 &amp; U18)", "Medals and selection for Asian/World youth events"]
                - ["4. FIDE rating", "5 games vs rated opponents in FIDE-rated events", "First rating of 1400+"]
                - ["5. Rating titles", "Climb the rating list", "CM 2200 · FM 2300 (WCM 2000 · WFM 2100)"]
                - ["6. Norm titles", "Norms in strong international events", "IM (2400) · GM (2500)"]
            source: "aicf,fide-rating,fide-titles"
          - links:
              - { label: "AICF Player Registration", url: "https://prs.aicf.in/new-register" }
              - { label: "AICF upcoming nationals", url: "https://aicf.in/upcoming-nationals/" }
              - { label: "FIDE Rating Regulations", url: "https://handbook.fide.com/chapter/B022024" }
            source: aicf
      - id: academies
        nav: "Training"
        eyebrow: "Training centres &amp; officiating"
        heading: "Where chess players train — and the arbiter route"
        parts:
          - p: "Chess is <strong>not among the disciplines of SAI's National Centres of Excellence or SAI Training Centres</strong> — training runs through state chess associations, school chess and private coaches, and progress is measured only by results and FIDE rating."
            source: sai-schemes
          - p: "The officiating career starts with AICF's <strong>Senior National Arbiter (SNA) seminar and examination</strong> — held in 2026 at Guwahati (2–3 Sept), Tarapith (2–3 Oct), Mohali (3–4 Oct) and Shimla (24–25 Oct). Norm events must be run by an <strong>International Arbiter or FIDE Arbiter</strong>."
            source: "aicf,fide-titles"
      - id: costs
        nav: "Cost"
        eyebrow: "Stamina &amp; financial cost breakdown"
        heading: "What it takes, and who pays"
        parts:
          - list:
              - "One standard-rated game gives each player <strong>60 to 120 minutes</strong> at minimum, so a single game can run <strong>2 to 4 hours</strong>; title events may have up to <strong>12 hours of play in one day</strong> — physical stamina matters."
            source: "fide-rating,fide-titles"
          - table:
              caption: "Who pays — chess"
              head: ["Need", "Paid by", "Amount"]
              rows:
                - ["Training and events, athlete in hardship", "PDU National Welfare Fund for Sportspersons", "Up to <strong>₹2.50 lakh</strong>"]
                - ["World / Olympiad medal", "Cash Incentive Scheme", "Up to ₹20 lakh (individual, biennial events)"]
                - ["After retirement", "Pension to Meritorious Sportspersons", "₹12,000–20,000 a month"]
            source: pib-support
          - note: "TOPS supports Olympic and Paralympic preparation; chess is not an Olympic sport."
            source: pib-support
      - id: earnings
        nav: "Earnings &amp; jobs"
        eyebrow: "Earning channels &amp; post-athletic horizons"
        heading: "Titles, jobs and the chess clause"
        parts:
          - list:
              - "For central sports-quota recruitment, chess players qualify through the <strong>Grandmaster or International Master title</strong> (open category, not WGM etc.) or the <strong>Chess Olympiad</strong>."
              - "The <strong>National Open Chess Championship</strong> counts as the national championship, and medals in the <strong>National Team Chess Championship</strong> also count."
            source: dopt-2024
          - list:
              - "Chess is on the list of <strong>65 sports</strong>; posts are <strong>Group C</strong>, with up to 5 years' age relaxation (10 for SC/ST)."
            source: dopt-2022
          - p: "Officiating is a career of its own: it starts at the AICF <strong>Senior National Arbiter</strong> seminar and exam (block 05), and FIDE norm events must be run by an International or FIDE Arbiter."
            source: "aicf,fide-titles"
      - id: traps
        nav: "Red flags"
        eyebrow: "Disqualification traps"
        heading: "Mistakes that cost ratings and titles"
        parts:
          - list:
              - "<strong>Fair-play breach</strong> — a title won with it can be removed; the federation has 30 days to appeal."
              - "<strong>Norms without the right opponent mix</strong> (too many from your own federation, too few titled players) do not count."
              - "Direct titles from ratings after 1 January 2024 need <strong>at least 30 rated games</strong> at that time."
            source: fide-titles
          - list:
              - "Falling <strong>below 1400</strong> makes you unrated again on the next list."
            source: fide-rating
