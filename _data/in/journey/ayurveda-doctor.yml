    by: "Central, state or UT government running the college"
    who: "BAMS interns in central, state and UT government institutions during the 12-month compulsory rotatory internship. NCISM's rule: the stipend is paid at par with interns of other medical systems in that government."
    apply: "Paid by your institution during the internship; the regulation prints no national amount, so ask your college what its government pays."
    stages: [ug]
    source: ncism-msr

