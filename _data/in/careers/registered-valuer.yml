sections:
  - id: "quick"
    hid: "quick-heading"
    alt: true
    eyebrow: "Quick answers"
    heading: "Registered Valuer at a glance"
    intro: "Check whether your Class 12 background qualifies. Duration and pay are in the summary at the top of the page."
    parts:
      - subhead: "Can I apply from my stream?"
      - streams:
          - label: "Science"
            fit: "Eligible"
            tone: "y"
            icon: "science"
          - label: "Commerce"
            fit: "Eligible"
            tone: "y"
            icon: "commerce"
          - label: "Arts / Humanities"
            fit: "Eligible"
            tone: "y"
            icon: "arts"
      - note: "Any stream at Class 12; the degree you need depends on the asset class (engineering for plant & machinery, finance for securities, civil/architecture for land & building)."
  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What does a Registered Valuer do?"
    parts:
      - overview:
          points:
            - "Registered Valuers value assets where the law requires an independent valuer — insolvency resolutions, mergers, share issues and other company transactions."
            - "There are three asset classes: <strong>Land and Building</strong>, <strong>Plant and Machinery</strong>, and <strong>Securities or Financial Assets</strong>."
            - "A valuation report must follow valuation standards and can be examined by regulators and courts."
  - id: "who"
    hid: "who-heading"
    alt: true
    eyebrow: "Fit check"
    heading: "Who should become a Registered Valuer"
    parts:
      - fit:
          match:
            - "Already have (or plan) a CA, CMA, engineering or architecture background."
            - "Like numbers, markets and careful judgement."
            - "Want an independent professional practice."
          mismatch:
            - "Want a job straight after Class 12 — this needs a degree and experience first."
            - "Dislike regulatory scrutiny of your work."
            - "Prefer purely creative or field work."
  - id: "eligibility"
    hid: "elig-heading"
    eyebrow: "Eligibility"
    heading: "What you need, stage by stage"
    parts:
      - elig_list:
          - "A degree or professional qualification <strong>relevant to the asset class</strong> (for example engineering for plant & machinery, CA/CS/CMA/MBA-finance for securities)."
          - "The minimum <strong>years of experience</strong> the Rules set for that qualification."
          - "Membership of an <strong>IBBI-recognised RVO</strong> and completion of its 50-hour educational course."
          - "Pass the <strong>IBBI valuation examination</strong> for that asset class, then apply for registration."
  - id: "roadmap"
    hid: "roadmap-heading"
    alt: true
    eyebrow: "Step-by-step"
    heading: "Your full path to becoming a Registered Valuer"
    parts:
      - steps:
          - title: "Get the right degree"
            text: "Matched to the asset class you want."
          - title: "Build experience"
            text: "In valuation, audit, engineering or finance, as the Rules require."
          - title: "Join an RVO"
            text: "IBBI publishes the list of recognised RVOs."
          - title: "50-hour educational course"
            text: "Run by the RVO; the certificate is needed to enrol for the exam."
          - title: "IBBI valuation exam"
            text: "Per asset class."
          - title: "Register with IBBI"
            text: "Then practise, with continuing education every year."
      - roadmap_card: "Registered Valuer"
  - id: "exams"
    hid: "exams-heading"
    eyebrow: "Exams & licences"
    heading: "IBBI valuation examination"
    parts:
      - chips:
          - label: "Per asset class"
            text: "Separate exams for land & building, plant & machinery and securities or financial assets."
            source: "ibbi"
          - label: "Course first"
            text: "The RVO's 50-hour course certificate is uploaded when enrolling for the exam."
            source: "ibbi"
          - label: "Curriculum"
            text: "IBBI publishes the curriculum for each asset class and reviews it regularly."
            source: "ibbi"
  - id: "salary"
    hid: "salary-heading"
    alt: true
    eyebrow: "Indicative figures"
    heading: "Registered Valuer pay in India"
    intro: "Pay varies a lot by employer, city and whether you practise independently; these are broad, commonly reported ranges, not guarantees."
    parts:
      - salary:
          - label: "Practice income"
            value: "Fee per assignment"
            text: "Most registered valuers earn per valuation report."
          - label: "Firms"
            value: "Salaried roles"
            text: "Valuation advisory teams in consulting firms."
          - label: "Senior valuers"
            value: "High"
            text: "Complex insolvency and M&A valuations pay well."
  - id: "jobs"
    hid: "jobs-heading"
    eyebrow: "Where they work"
    heading: "Employers & growth path"
    parts:
      - chips:
          - label: "Work comes from"
            text: "Insolvency professionals, companies, banks, courts and tribunals"
          - label: "Employers"
            text: "Valuation and advisory firms, Big 4 and mid-size consultancies, banks"
          - label: "Often combined with"
            text: "CA/CMA practice, engineering consultancy or real-estate advisory"
  - id: "proscons"
    hid: "pc-heading"
    alt: true
    eyebrow: "Honest take"
    heading: "Advantages and disadvantages"
    parts:
      - proscons:
          pros:
            - "Statutory role with steady demand."
            - "Builds on an existing CA/CMA/engineering career."
            - "Independent practice possible."
          cons:
            - "Needs prior degree and experience."
            - "Regulatory scrutiny and liability."
            - "Continuing education and RVO fees."
  - hid: "related-heading"
    alt: true
    eyebrow: "Related careers"
    heading: "If you're considering Registered Valuer, also look at"
    parts:
      - related:
          - name: "Insolvency Professional"
            sub: "IBBI-registered resolution work"
            href: "insolvency-professional.html"
          - name: "CMA"
            sub: "Cost & management accounting"
            href: "cma.html"
          - name: "Chartered Accountant (CA)"
            sub: "Audit, tax & valuation"
            href: "ca.html"
          - name: "Civil Engineering"
            sub: "Land & building valuation base"
            href: "civil.html"
  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "What are the asset classes for Registered Valuers?"
            a: "Land and Building, Plant and Machinery, and Securities or Financial Assets."
          - q: "Do I need to join an RVO?"
            a: "Yes. You enrol with an IBBI-recognised Registered Valuers Organisation and complete its 50-hour course before the exam."
          - q: "Can I register in more than one asset class?"
            a: "Yes, if you meet the eligibility and pass the exam for each class."
      - note: "*Pay figures are indicative unless they quote an official pay level, and rules change: confirm eligibility, dates and fees on the official websites listed under Sources before you act."
        class: "table-note mt-lg"
