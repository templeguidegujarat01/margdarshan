  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "What is the difference between ML Engineer and AI Engineer?"
            a: "They overlap but differ in emphasis. A classic Machine Learning Engineer role often centers on structured-data models — regression, classification, recommendation systems — and on training and deploying them reliably at scale. An AI Engineer role today is increasingly centered on building GenAI/LLM-powered applications specifically. Many companies use the titles loosely, so check the actual job responsibilities rather than assuming from the title alone."
          - q: "Do I need an M.Tech or PhD to become an ML Engineer?"
            a: "It depends on the sub-type. A PhD is generally preferred specifically for Research ML Engineer roles, common at deeptech startups and research labs. Production, Data Platform and Application ML Engineer roles — which make up most of the market — are commonly filled by B.Tech or M.Tech graduates in Computer Science or a quantitative field, and even strong self-taught candidates with real project experience."
          - q: "What are the different types of ML Engineer roles?"
            a: "Industry job descriptions commonly split the role into four genuinely different sub-types: Research ML Engineers focus on model innovation and often need a PhD; Production ML Engineers focus on deployment and reliability at scale; Data Platform ML Engineers are pipeline and infrastructure experts; and Application ML Engineers integrate ML into product features. Each needs a meaningfully different skill emphasis, so it's worth identifying which one a specific job posting actually means."
          - q: "What is a realistic ML Engineer salary in India in 2026?"
            a: "Freshers commonly earn ₹6-11 LPA. Mid-level engineers with 3-7 years of experience typically earn ₹10-20 LPA, and senior engineers at product companies commonly earn ₹25-50 LPA. Specialised production or data-platform roles at some GCCs and deeptech firms are reported to reach considerably higher figures, though this reflects a smaller, more specialised slice of the market rather than a typical outcome."
          - q: "Is machine learning a good career in 2026?"
            a: "Yes. Demand for ML talent in India continues to grow, driven by AI adoption across healthcare, banking, e-commerce and logistics, and salaries across all experience levels have been rising. The field does reward continuous learning and a clear specialisation choice — engineers who pick a sub-type deliberately and build genuine, demonstrable project experience tend to see the strongest outcomes."
      - note: "Figures are indicative (2026) — confirm on the official college or authority website."
        class: "table-note mt-lg"
