    lede: "Interior designers typically need a bachelor's degree, often in fine arts or interior design. Licensing depends on the state: some let only licensed designers do the work, some only protect the title, and some have no rule. Regulated jurisdictions require the NCIDQ exam (California uses its own)."
    for: "Visual thinkers who are precise with measurements and like working with clients, architects and builders."
    soc: ["27-1025"]
    does: { text: "Interior designers make indoor spaces functional, safe, and beautiful by determining space requirements and selecting essential and decorative items.", source: ooh_qf_interior }
    work: { text: "Many interior designers work in specialized design services or in architectural, engineering, and related services.", source: ooh_qf_interior }
    become: { text: "Interior designers typically need a bachelor’s degree to enter the occupation.", source: ooh_qf_interior }
    metrics: { pay: 67190, pay_hour: "32.31", pay_by: "Interior designers", jobs: 97100, outlook: 3, outlook_words: "As fast as average", change: 2600, entry: "Bachelor's degree", training: "None", source: ooh_qf_interior }
    license: interior-design
    routes:
      - id: degree-ncidq
        title: "Interior design degree → work experience → NCIDQ → state registration"
