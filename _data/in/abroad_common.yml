# Study Abroad engine (India edition, 2026-10-29) — shared data for study-abroad/**.
# Country sheets live in _data/in/abroad/<id>.yml (one file per destination, same 7-pillar shape).
# Pages are stubs written by scripts/build-abroad.mjs; templates are _includes/abroad-*.html.
# Rules (scripts/check-abroad-data.mjs enforces them):
#   - every fact carries a `source` id that exists in the same file's `sources` list;
#   - no number without an official page behind it (government, embassy, regulator, test owner, university);
#   - `review_by` passes -> the checker fails, because visa money, fees and work rules change several times a year.
# Rupee figures are never typed in by hand: abroad-inr.html converts a local amount with the `fx` table below.

checked: 2026-10-29
review_by: 2027-01-29

# INR for 1 unit of each currency. ECB euro reference rates of 28 Oct 2026 (INR 106.0095 per EUR) crossed
# through the euro; AED from the dollar rate and the dirham's fixed peg (3.6725 per USD). FBIL's own daily
# fixings are subscription-only, so they are not used. Banks and forex cards charge a margin on top.
fx:
  as_of: 2026-10-28
  label: "ECB euro reference rates, 28 Oct 2026"
  url: "https://www.ecb.europa.eu/stats/policy_and_exchange_rates/euro_reference_exchange_rates/html/index.en.html"
  note: "Rupee amounts are a guide only, at the ECB reference rate of 28 Oct 2026. Your bank or forex card adds a margin, and rates move every day."
  rates:
    USD: 95.2210
    GBP: 126.526
    EUR: 106.0095
    CAD: 67.7897
    AUD: 66.9675
    NZD: 53.4511
    SGD: 74.2675
    JPY: 0.602806
    IDR: 0.00523871
    AED: 25.9281

# The seven blocks every country sheet must have, in page order (checker: all present, none extra).
pillars:
  - { id: language_and_eligibility, nav: "English & eligibility", eyebrow: "Tests and entry rules" }
  - { id: intakes_and_streams, nav: "Intakes & courses", eyebrow: "When to start, what to study" }
  - { id: tuition_and_living_costs, nav: "Costs", eyebrow: "Tuition and living money" }
  - { id: global_scholarships, nav: "Scholarships", eyebrow: "Funding you can apply for" }
  - { id: application_funnel, nav: "How to apply", eyebrow: "The application funnel" }
  - { id: visa_chokepoints, nav: "Visa", eyebrow: "Visa rules and choke points" }
  - { id: post_study_work, nav: "Work", eyebrow: "Work while studying and after" }

hub:
  title: "Study Abroad from India: 15 Country Guides"
  seo_title: "Study Abroad from India: 15 Countries, Visas & Costs"
  description: "Visa money, English scores, work hours and post-study work for 15 countries, read from each government's own pages, with rupee costs."
  lede: "Pick a country to see what its government actually asks for: the English score, the money you must show, the visa fee, how many hours you may work and how long you can stay after the course. Every number links to the official page it came from."

# ---------------------------------------------------------------------------------------------
# Exam deep-dive pages (study-abroad/exams/<slug>.html). "Which countries ask for it" is built on the
# page from each country sheet's `tests` list, so a country's requirement is typed only once.
exams:
  ielts:
    short: IELTS
    name: "IELTS Academic (and IELTS for UKVI)"
    by: "British Council and IDP"
    seo_title: "IELTS for Study Abroad from India: Fees, Versions & Bands"
    description: "IELTS Academic vs IELTS for UKVI, the INR fee at an IDP centre, band rules and the score each of 15 countries asks Indian students for."
    lede: "IELTS is the English test most study-abroad routes accept. The version matters: UK visa routes that need a Secure English Language Test (SELT) want IELTS for UKVI, while most universities take IELTS Academic."
    facts:
      - { label: "Fee in India (computer)", value: "INR 19,000 (Academic); INR 19,250 (UKVI)", source: ielts_jaipur }
      - { label: "Sections", value: "Listening, Reading, Writing, Speaking", source: ielts_academic }
      - { label: "Score scale", value: "Bands 0–9; overall = average of four", source: ielts_scoring }
      - { label: "How long it counts", value: "IELTS suggests 2 years; each body sets its own rule", source: ielts_scoring }
    official:
      - { label: "IELTS (official site)", url: "https://ielts.org/" }
      - { label: "Find an Indian test centre", url: "https://ielts.org/test-centres" }
    sections:
      - id: versions
        nav: Versions
        eyebrow: "Pick the right version"
        heading: "Academic, General Training or UKVI?"
        parts:
          - points:
              - { t: "Choose IELTS Academic for undergraduate or graduate study and for professional registration (for example doctors and nurses).", source: ielts_academic }
              - { t: "Listening and Speaking are the same in Academic and General Training; Reading and Writing differ.", source: ielts_academic }
              - { t: "For a UK Student visa below degree level you need a Secure English Language Test (SELT) at CEFR B1; at degree level a licensed university may assess your English itself, but it must still be equivalent to B2.", source: ukvi_english }
              - { t: "Australia does not accept English tests taken fully online (\"at-home\" tests such as IELTS Online) for visas.", source: au_500 }
      - id: scores
        nav: Scores
        eyebrow: "How the band is worked out"
        heading: "Band scores and validity"
        parts:
          - points:
              - { t: "Each section gets a band from 0 to 9. The overall band is the average of the four, rounded to the nearest half band (.25 rounds up to the half band, .75 to the next whole band).", source: ielts_scoring }
              - { t: "IELTS recommends treating results as valid for two years; a university or visa office can set its own window.", source: ielts_scoring }
              - { t: "Australia accepts IELTS results with a One Skill Retake for the Temporary Graduate (485) visa, if the retake is done before you lodge.", source: au_485 }
      - id: fees
        nav: Fees
        eyebrow: "What it costs in India"
        heading: "IELTS fee at Indian centres"
        parts:
          - p: "An IDP centre in Jaipur lists computer-delivered IELTS Academic and General Training at INR 19,000 and the UKVI versions at INR 19,250. Prices can differ by centre and change during the year, so check your own centre when you book."
            source: ielts_jaipur
      - id: prep
        nav: Practice
        eyebrow: "Official practice only"
        heading: "Where to practise"
        parts:
          - p: "Start with the free sample test questions on the IELTS website, which come from the test owners. Material that promises a guaranteed band is not from IELTS."
            source: ielts_samples
    sources:
      - { id: ielts_academic, name: "IELTS — IELTS Academic test", url: "https://ielts.org/take-a-test/test-types/ielts-academic-test", covers: "Who should take Academic; sections" }
      - { id: ielts_scoring, name: "IELTS — How IELTS is scored", url: "https://ielts.org/take-a-test/your-results/ielts-scoring-in-detail", covers: "Bands, rounding, validity" }
      - { id: ielts_samples, name: "IELTS — Sample test questions", url: "https://ielts.org/take-a-test/preparation-resources/sample-test-questions", covers: "Free official practice" }
      - { id: ielts_jaipur, name: "IELTS — IDP Education India, Jaipur centre", url: "https://ielts.org/test-centres/idp-education-india-jaipur", covers: "INR fees, computer-delivered", checked: 2026-10-29 }
      - { id: ukvi_english, name: "GOV.UK — Student visa: knowledge of English", url: "https://www.gov.uk/student-visa/knowledge-of-english", covers: "SELT, B1/B2 levels", checked: 2026-10-29 }
      - { id: au_500, name: "Home Affairs (Australia) — Student visa (subclass 500)", url: "https://immi.homeaffairs.gov.au/visas/getting-a-visa/visa-listing/student-500", covers: "At-home tests not accepted", checked: 2026-10-29 }
      - { id: au_485, name: "Home Affairs (Australia) — Temporary Graduate visa, Post-Higher Education Work stream", url: "https://immi.homeaffairs.gov.au/visas/getting-a-visa/visa-listing/temporary-graduate-485/post-higher-education-work", covers: "One Skill Retake accepted", checked: 2026-10-29 }

