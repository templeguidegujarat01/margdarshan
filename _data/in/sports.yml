        heading: "How sepaktakraw is played"
        parts:
          - p: "Sepaktakraw is like volleyball played with the <strong>feet, knees, chest and head</strong>. Two <strong>regus</strong> (teams) of three players face each other across a net and try to land a small ball in the other court. One player stands at the back and serves; the other two play at the front."
            source: istaf-regu
          - list:
              - "Each side may touch the ball <strong>at most three times</strong> before it goes over the net."
              - "The ball must not touch a player's <strong>hand or arm</strong>, and a player may not use the hands or arms to support a kick."
              - "A point is scored on every fault by either side. A set is won by the first regu to <strong>21 points</strong> with a 2-point lead; at 20–20 play goes on until one side leads by 2 or reaches <strong>25</strong>."
              - "A match is the <strong>best of three sets</strong>, with 2-minute breaks; each regu has one 1-minute time-out per set. Service changes every three points."
            source: istaf-regu
          - table:
              caption: "Net and ball (ISTAF)"
              head: ["Item", "Men", "Women"]
              rows:
                - ["Net height at centre", "1.52 m", "1.42 m"]
                - ["Net height at the posts", "1.55 m", "1.45 m"]
                - ["Ball circumference (men)", "0.41–0.43 m", "—"]
                - ["Ball weight (men)", "170–180 g", "—"]
            source: istaf-regu
          - note: "ISTAF also publishes laws for <strong>doubles</strong> and <strong>quad</strong> (four-player) events."
            source: "istaf-doubles,istaf-quad"
      - id: recognition
        nav: "Recognition"
        eyebrow: "Institutional &amp; global recognition"
        heading: "Asian Games, Khelo India — and the cash that follows"
        parts:
          - list:
              - "Sepaktakraw is a medal sport at the <strong>2026 Asian Games</strong>; two players from Nagaland, <strong>Menenu Tsukru and Seyiekhrieno Tepa</strong>, were picked for India's women's team."
              - "It is one of the 27 sports of the <strong>Khelo India Youth Games</strong>."
              - "It is <strong>not</strong> an Olympic sport."
            source: "ag26,air-takraw,kiyg25,la28-oly"
          - table:
              caption: "Government cash award for a senior sepaktakraw medal (₹ lakh)"
              head: ["Event", "Gold", "Silver", "Bronze"]
              rows:
                - ["Asian Games", "30", "20", "10"]
                - ["ISTAF World Cup (every 4 years)", "40", "25", "15"]
                - ["ASTAF Asian Championship (every 4 years)", "15", "10", "5"]
            source: myas-cash
          - note: "In team events every squad member, reserves included, gets <strong>75%</strong> of the individual amount."
            source: myas-cash
      - id: eligibility
        nav: "Fitness &amp; testing"
        eyebrow: "Physical benchmarks &amp; anti-doping"
        heading: "What the game demands — and anti-doping"
        parts:
          - list:
              - "Every player must be able to play the ball with any part of the body except the hands and arms — the arms may not even be used to support a kick."
            source: istaf-regu
          - list:
              - "Under the anti-doping code you must be <strong>available for testing</strong> and check every medicine against the <strong>Prohibited List</strong>; apply to NADA for a <strong>TUE</strong> if you need a banned medicine."
            source: nada-rr
      - id: roadmap
        nav: "Roadmap"
        eyebrow: "Grassroots-to-elite residential pipeline"
        heading: "From the school court to the Asian Games"
        parts:
          - table:
              caption: "The sepaktakraw ladder"
              head: ["Step", "Age", "What happens"]
              rows:
                - ["1. School &amp; club", "From childhood", "Learn the kicks and headers; play regu and doubles"]
                - ["2. SAI Training Centre", "12–18", "Sepaktakraw is one of the 27 STC sports; entry by results and tests"]
                - ["3. Khelo India Youth Games", "Under 18", "Medals count for central sports-quota jobs"]
                - ["4. National championships", "Junior · senior", "Picked by your state association"]
                - ["5. India team", "Senior", "Asian Championships and the Asian Games"]
            source: "sai-schemes,kiyg25,dopt-2024,air-takraw"
      - id: academies
        nav: "Centres"
        eyebrow: "Training centres &amp; cities"
        heading: "Where players train"
        parts:
          - list:
              - "Sepaktakraw is taught at <strong>SAI Training Centres</strong> (ages 12–18) but has no SAI National Centre of Excellence; India's 2026 Asian Games women's squad included players and coaches from Nagaland."
            source: "sai-schemes,air-takraw"
      - id: costs
        nav: "Cost"
        eyebrow: "Equipment costs &amp; who pays"
        heading: "A low-cost sport — and who pays"
        parts:
          - list:
              - "You need only a ball, a net and a court, so sepaktakraw is cheap to start. Education Margdarshan does not print shop prices — no governing body publishes them."
            source: istaf-regu
          - table:
              caption: "Who pays — sepaktakraw ladder"
              head: ["Stage", "Paid by", "What you get"]
              rows:
                - ["SAI centre trainee", "Sports Authority of India", "Coaching, boarding, sports science, diet"]
                - ["Khelo India athlete", "Ministry of Youth Affairs &amp; Sports", "<strong>₹6.28 lakh a year</strong> incl. ₹1.20 lakh cash"]
                - ["Athlete in hardship", "PDU National Welfare Fund", "Up to ₹2.50 lakh"]
            source: "sai-schemes,pib-support"
      - id: earnings
        nav: "Earnings &amp; jobs"
        eyebrow: "Earning channels &amp; central job quotas"
        heading: "Awards and sports-quota jobs"
        parts:
          - list:
              - "Sepaktakraw is one of the <strong>65 sports</strong> in the central sports quota for <strong>Group C</strong> posts, with up to 5 years' age relaxation (10 for SC/ST)."
              - "Medals at the Asian Games can bring up to <strong>three out-of-turn promotions</strong>."
            source: dopt-2022
          - list:
              - "Khelo India Youth Games medals now count for central sports-quota jobs."
            source: dopt-2024
      - id: traps
        nav: "Red flags"
        eyebrow: "Disqualification traps"
        heading: "Faults that lose points"
        parts:
          - list:
              - "<strong>The ball touching a hand or arm</strong>, or using an arm to support a kick."
              - "<strong>Four touches</strong> on one side."
              - "<strong>Touching the net or post</strong> with any part of the body or kit, or crossing into the opponent's court (except a follow-through)."
              - "<strong>Distracting the opponents</strong> by shouting or gestures during the service."
            source: istaf-regu
      - id: doubts
        nav: "Player doubts"
        eyebrow: "Real-world player doubts"
        heading: "Future, jobs and certificates — straight answers"
        parts:
          - qa:
              q: "Sepaktakraw is not in the Olympics. Is it worth it?"
              a: "For India, the targets are the <strong>Asian Games</strong>, the <strong>Khelo India Youth Games</strong> and central <strong>sports-quota jobs</strong> — all of which include sepaktakraw. It is cheap to start and the Ministry pays cash awards for Asian Games, World Cup and Asian Championship medals."
            source: "ag26,kiyg25,dopt-2022,myas-cash"
          - qa:
              q: "Which government jobs can sepaktakraw get me?"
              a: "<strong>Central Group C posts</strong> under DoPT rules list sepaktakraw among 65 sports. Neither Western Railway's 2026-27 notice nor CRPF's 2026 sports quota had sepaktakraw posts — read each recruiter's notice."
            source: "dopt-2022,rrc-wr26,crpf26"
          - table:
              caption: "Sports-quota job routes open in 2026 — age, qualifying results, pay"
              head: ["Route", "Age", "Main qualifying results", "Pay level"]
              rows:
                - ["Railways <strong>Level 5/4</strong> (graduates)", "18–25 on 1 Jan 2027", "Played the <strong>Olympics</strong>, or top 3 at a World Cup, World Championship, Asian Games, Commonwealth Games or Youth Olympics", "Level 5/4"]
                - ["Railways <strong>Level 3/2</strong> (12th, or 10th + apprenticeship)", "18–25 on 1 Jan 2027", "Top 3 at <strong>Senior, Youth or Junior Nationals</strong>, National Games or All India Inter-University; or Federation Cup gold", "Level 3/2"]
                - ["Railways <strong>Level 1</strong>", "18–25 on 1 Jan 2027", "Played for your state and finished <strong>at least 8th at Senior Nationals</strong>; or top 3 at the Federation Cup", "Level 1"]
                - ["CRPF <strong>Head Constable (GD)</strong> (10+2)", "18–23 on 1 Aug 2026; sportspersons get <strong>+5 years</strong> (OBC +8, SC/ST +10)", "Played for India; or top 3 for your state at Nationals or National Games; or <strong>gold/silver at Junior Nationals</strong>", "Level 4 · ₹25,500–81,100"]
                - ["CRPF <strong>Constable (GD)</strong> (10th pass)", "18–23 on 1 Aug 2026; sportspersons get <strong>+5 years</strong> (OBC +8, SC/ST +10)", "Played for your state at <strong>Senior or Junior Nationals</strong>; or top 3 at SGFI school nationals or Khelo India Games", "Level 3 · ₹21,700–69,100"]
            source: "rrc-wr26,crpf26"
          - note: "Railways count results from <strong>1 April 2024</strong>; CRPF counts the <strong>two years before 30 September 2026</strong>. Railways fee ₹500 (₹400 back if you attend the trial; ₹250, refunded in full on attending, for SC/ST, women, PwBD, minorities, ex-servicemen and EBC). CRPF fee ₹100 for UR/OBC/EWS men; free for women, SC, ST and ex-servicemen. CRPF picks sign a <strong>₹1 lakh bond to serve at least 3 years</strong>."
            source: "rrc-wr26,crpf26"
          - qa:
              q: "Does any 'national' certificate count for a job?"
              a: "No. Railways will <strong>not recruit on a certificate from a federation MoYAS did not recognise</strong> at the time of the championship, and CRPF counts only championships of MoYAS-recognised federations or the IOA's National Games."
            source: "rrc-wr26,crpf26"
