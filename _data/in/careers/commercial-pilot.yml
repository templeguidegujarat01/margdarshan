hero:
  eyebrow: "Science · Aviation · Licensed Profession"
  title: "Commercial Pilot (CPL) — Flying for an Airline"
  meta:
    - "Licensed by DGCA"
    - "Class 12 with Physics & Maths"
  read_time: "8 min read"
  intro:
    - "A commercial pilot flies passengers or cargo for pay, under a Commercial Pilot Licence (CPL) issued by the Directorate General of Civil Aviation (DGCA). It is not a college degree: you earn the licence by passing DGCA medicals and theory exams and logging supervised flying hours at a DGCA-approved flying school — and the training is one of the most expensive in India."
