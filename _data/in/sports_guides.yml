                - ["Coach", "Class 12 or graduation", "SAI NSNIS Diploma in Sports Coaching · NSU B.Sc. Sports Coaching", "NSNIS admission test + skill test · NSUEE + fitness test"]
                - ["PE teacher", "Class 12", "LNIPE B.P.Ed. · NSU B.P.E.S.", "CUET (UG) + fitness test · NSUEE"]
                - ["Fitness &amp; sports science", "Graduation", "NSNIS PG Diplomas — Strength &amp; Conditioning, Exercise Physiology, Performance Analysis", "Written test + interview"]
                - ["Nutrition &amp; psychology", "Graduation", "NSNIS PG Diplomas · NSU M.Sc. Sports Psychology / Applied Sports Nutrition", "Written test + interview"]
