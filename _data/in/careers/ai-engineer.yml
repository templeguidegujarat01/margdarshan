          - "A B.Tech in CSE/AI commonly costs <strong>₹2-8 lakh</strong> at government institutes and <strong>₹5-20 lakh</strong> at private colleges over 4 years (see the <a href=\"cse.html\">CSE page</a>). A Bachelor of Computer Applications (BCA) is generally more affordable, often <strong>₹30,000-1,50,000 per year</strong> (see the <a href=\"bca.html\">BCA page</a>). For students adding AI/ML specialisation on top of a degree, or building skills independently, structured certifications and courses commonly cost roughly <strong>₹20,000-2,00,000</strong> depending on the depth and provider — always check a course's actual project outcomes and instructor credentials before enrolling."
