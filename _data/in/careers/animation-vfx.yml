          - label: "Nuke / After Effects"
            text: "Compositing tools for combining VFX elements with live footage seamlessly."
          - label: "Houdini"
            text: "Specialised, highly valued for complex simulations — fire, water, destruction and particle effects."
          - label: "Understanding of timing & physics"
            text: "Believable motion relies on understanding weight, momentum and real-world physics, not just software mastery."
          - label: "A focused demo reel"
            text: "The single most important hiring asset — a tight, high-quality 1-2 minute reel beats a long, inconsistent one."
          - label: "Pipeline collaboration skills"
            text: "Large productions involve many artists working in sequence — understanding your role within a bigger pipeline matters."
