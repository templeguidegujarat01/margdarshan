          - label: "Mid-level (3–5 years)"
            value: "₹8–20 LPA"
            text: "Reported range, reaching ₹18-32 LPA at product companies and GCCs. Backend is reported to pay 10-15% more than frontend at the same level."
          - label: "Freelance (real alternate path)"
            value: "₹15,000–1,00,000+/month"
