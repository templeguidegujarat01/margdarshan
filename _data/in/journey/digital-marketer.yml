    - { label: "IPMAT Indore", value: "3 sections × 40 minutes · +4 / −1", source: ipm26 }
    - { label: "NSQF course", value: "840 hours · Level 6", source: nqr-dmm }
  stages:
    head: ["Step", "What it is", "Rule"]
    rows:
      - ["CUET (UG) or IPMAT", "Entrance to a degree or IPM", "Any stream"]
      - ["Degree", "BBA, B.Com, BA or IPM", "Build a portfolio alongside"]
      - ["NSQF Level 6", "Digital Marketing Manager qualification", "Postgraduate, or graduate + 1–3 years"]
    source: [cuet26, ipm26, nqr-dmm]
