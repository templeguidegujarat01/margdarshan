lede: "In Hawaii, the Board of Examiners, Supreme Court of the State of Hawaii handles bar admission for lawyers, the Hawaii Medical Board licenses physicians, the Hawaii Board of Public Accountancy licenses CPAs and the Hawaii Board of Nursing licenses registered nurses."

