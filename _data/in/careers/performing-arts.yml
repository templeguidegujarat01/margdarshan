  - id: "faq"
    hid: "faq-heading"
    alt: true
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Do I need to start dance or music training as a young child to have a career in it?"
            a: "Starting young genuinely helps, especially for classical dance forms and instruments requiring years of physical and technical mastery, but it isn't an absolute requirement. Many performers, particularly in theatre and contemporary dance, begin serious training in their teens or even college years and go on to build strong careers."
          - q: "What is NSD and why is it significant?"
            a: "NSD (National School of Drama) in Delhi is India's most prestigious theatre training institute, offering a rigorous, highly competitive diploma programme. Many of India's leading theatre, film and television actors and directors are NSD graduates, making it the most recognised credential in Indian theatre training."
          - q: "Can performing arts be a stable full-time career, or is it mostly a side pursuit?"
            a: "It can be a genuine full-time career, but income is often irregular, especially early on, and many performers combine performance with teaching, choreography or related work for financial stability. A smaller number of highly successful performers achieve strong, consistent income through film, television or established touring careers."
          - q: "What are realistic career paths beyond performing on stage?"
            a: "Many performing arts graduates teach dance, music or theatre; choreograph for film, TV or events; work in arts administration and festival programming; or move into film/TV as actors, directors or music composers — performing live is one outcome among several genuine career paths."
          - q: "How much do performers earn in India?"
            a: "It varies enormously and is often project or performance-based rather than a fixed salary. Teaching and choreography tend to offer more predictable income, while performance and touring income depends heavily on reputation, genre and demand — a small number of highly successful performers earn very well."
      - note: "*Income figures are indicative, based on publicly available information as of 2026, and vary enormously by discipline, reputation and work arrangement."
        class: "table-note mt-lg"
