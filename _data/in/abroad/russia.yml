checked: 2026-10-29
review_by: 2027-01-29
status: caution
eyebrow: "Study abroad · Europe / Asia"
title: "Study in Russia from India (MBBS and More)"
seo_title: "MBBS in Russia from India: NMC Rules, Visa and Agents"
description: "Studying in Russia from India: NMC's 54-month, English-medium, same-university internship rules for MBBS, the MEA warning about contractors, the Russian Government quota and visa steps."
lede: "Most Indian students in Russia study medicine. The Indian rules matter as much as the Russian ones: an MBBS from Russia leads to an Indian licence only if it meets the NMC's FMGL Regulations, 2021."
alert:
  text: "Before paying any agent: the NMC requires English as the medium of instruction for the whole course, and the MEA has warned that many 'English-medium' Russian programmes switch to Russian in later years."
  source: mea_russia
facts:
  - { label: "MBBS (NMC rule)", value: "54+ months + 12-month internship, same university", source: nmc_fmgl }
  - { label: "Medium (NMC rule)", value: "English", source: nmc_fmgl }
  - { label: "Govt quota (2027/28)", value: "Apply by 15 Jan 2027 (non-CIS)", source: misis_quota }
  - { label: "Back in India", value: "FMGE, then 12 months' internship", source: nmc_fmgl }
card:
  line: "Mostly MBBS; check NMC FMGL rules first"
  psw: "No post-study route stated"
  work: "Ask the university in writing"
  funds: "Set by the university"
tests:
  - { label: "NEET-UG", need: "Needed by Indians who want an Indian licence after a foreign MBBS (see FMGE eligibility)", source: nmc_fmgl }
pillars:
  language_and_eligibility:
    heading: "NMC rules come first for MBBS"
    parts:
      - points:
          - { t: "The NMC's FMGL Regulations need: a course of at least 54 months, a 12-month internship in the same foreign institution, English as the medium, and a licence in Russia equal to that of Russian citizens.", source: nmc_fmgl }
          - { t: "The whole course and internship must be at the same institution; no part in India or a third country.", source: nmc_fmgl }
          - { t: "The MEA advisory says medicine in Russia is mostly taught in Russian and that institutions need a special licence to teach in English; ask to see the Russian Ministry of Education licence for English-medium teaching.", source: mea_russia }
      - links:
          - { label: "MBBS abroad: all NMC rules", url: "study-abroad/mbbs-abroad.html" }
          - { label: "FMGE", url: "fmge.html" }
  intakes_and_streams:
    heading: "Admission routes"
    parts:
      - points:
          - { t: "The official portal education-in-russia.com handles programme choice (up to 6 universities), selection in your country, the online application and the study invitation.", source: eir }
          - { t: "For the Russian Government quota (state-funded places) for 2027/28, applications close by 15 January 2027 for non-CIS countries; selection abroad is run by Rossotrudnichestvo and Russian missions.", source: misis_quota }
          - { t: "The quota covers bachelor's, specialist, master's, residency and postgraduate levels, preparatory Russian courses and a monthly stipend.", source: misis_quota }
  tuition_and_living_costs:
    heading: "Fees and how to pay them"
    parts:
      - money:
          - { item: "Dormitory fee for state-funded (quota) students at NUST MISIS", cur: RUB, amount: 2500, per: "month (to RUB 3,769)", source: misis_quota }
      - points:
          - { t: "The MEA advises paying fees directly to the university from the second semester and insisting on proper receipts; there were complaints of contractors collecting fees and not depositing them.", source: mea_russia }
          - { t: "Russian universities do not accept cheques or drafts; fees are deposited in local currency at a bank. Declare foreign cash at customs on arrival.", source: mea_russia }
      - note: "Tuition is set by each university. No rupee guide is shown for roubles: there is no free official RUB/INR reference rate."
  global_scholarships:
    heading: "Russian Government quota"
    parts:
      - awards:
          - { name: "Russian Government Quota", by: "Government of the Russian Federation (Rossotrudnichestvo)", who: "Foreign citizens, by competitive selection in their country", gives: "Tuition from the federal budget, preparatory course, monthly stipend, dormitory place", url: "https://education-in-russia.com/", source: misis_quota }
  application_funnel:
    heading: "From application to arrival"
    parts:
      - steps:
          - { title: "Check NMC compliance", text: "Course length, English medium throughout, internship at the same university, licence in Russia.", source: nmc_fmgl }
          - { title: "Apply on education-in-russia.com or to the university", text: "Choose up to 6 universities on the portal; MEA advises asking the university directly rather than relying on contractors.", source: eir }
          - { title: "Study invitation", text: "The university applies for your invitation, which the migration authority issues; it can take up to 5 weeks.", source: unecon }
          - { title: "Visa at the Russian mission", text: "The invitation gives a single-entry visa; the university then helps you get a multiple-entry visa.", source: unecon }
          - { title: "Registration", text: "Hand your passport and migration card to the international office for migration registration on arrival.", source: unecon }
  visa_chokepoints:
    heading: "The study visa in short"
    parts:
      - points:
          - { t: "Until the multiple-entry visa is issued (it may take 5–6 weeks), leaving Russia on the single-entry visa means you cannot return.", source: unecon }
          - { t: "Transfers between universities are hard: the visa invitation is tied to one university, and the Russian Ministry of Health must approve more than one transfer.", source: mea_russia }
          - { t: "Never hand your passport or original certificates to contractors for 'safe custody'.", source: mea_russia }
  post_study_work:
    heading: "Work and the Indian licence"
    parts:
      - points:
          - { t: "For an Indian licence you must be registered and licensed in Russia like a Russian citizen, pass India's licentiate exam (FMGE today) and complete a 12-month internship in India.", source: nmc_fmgl }
          - { t: "NMC's March 2026 circular asks State Medical Councils to give FMGs 7.5% of internship seats in established colleges and all seats in new colleges.", source: nmc_crmi }
      - note: "We found no official English-language source on part-time work rights for international students in Russia; ask the university's international office in writing."
visa:
  slug: russia-study-visa
  name: "Russian study visa"
  short: "Study visa"
  seo_title: "Russia Study Visa from India: Invitation and Registration"
  description: "Russian student visa for Indians: university invitation from the migration authority, single then multiple-entry visa, migration registration on arrival, and transfer limits."
  lede: "The Russian study visa starts with an invitation your university requests from the migration authorities. After you arrive, registration and the multiple-entry visa are the next deadlines."
  facts:
    - { label: "Invitation", value: "Up to 5 weeks to issue", source: unecon }
    - { label: "First visa", value: "Single entry", source: unecon }
    - { label: "Multiple-entry visa", value: "Takes 5–6 weeks after arrival", source: unecon }
    - { label: "Transfer", value: "Needs a fresh invitation; hard", source: mea_russia }
  official:
    - { label: "Education in Russia (official portal)", url: "https://education-in-russia.com/" }
    - { label: "MEA advisory for students going to Russia", url: "https://www.mea.gov.in/images/pdf/advisory-russian.pdf" }
  sections:
    - id: steps
      nav: Steps
      eyebrow: "Order of work"
      heading: "Step by step"
      parts:
        - steps:
            - { title: "University documents", text: "Send the documents the university asks for; it starts the invitation.", source: unecon }
            - { title: "Invitation", text: "Issued by the migration authority; a scan is e-mailed to you.", source: unecon }
            - { title: "Visa", text: "Apply at the Russian Embassy or Consulate with the invitation.", source: unecon }
            - { title: "Registration", text: "Give passport and migration card to the international office within 24 hours of arrival (working days).", source: unecon }
    - id: chokepoints
      nav: "Common problems"
      eyebrow: "Where files go wrong"
      heading: "Choke points to check twice"
      parts:
        - points:
            - { t: "Contractors' promises about English-medium teaching or postgraduate specialisations that the university does not offer.", source: mea_russia }
            - { t: "Fees paid to a contractor without a university receipt.", source: mea_russia }
            - { t: "A programme that does not meet NMC's 54-month/English/same-institution rules.", source: nmc_fmgl }
doubts:
  - { q: "Is MBBS from Russia valid in India?", a: "Only if it meets the NMC's FMGL Regulations 2021: at least 54 months, a 12-month internship in the same university, English medium, and a licence in Russia. Then you pass the licentiate exam and do 12 months' internship in India.", source: nmc_fmgl }
  - { q: "Is MBBS in Russia taught in English?", a: "The MEA advisory warns that medicine in Russia is mostly taught in Russian, that English-medium teaching needs a special licence, and that many programmes switch to Russian from the fourth year. Ask to see the licence.", source: mea_russia }
  - { q: "Should I pay MBBS fees to the agent?", a: "The MEA advises paying fees directly to the university after the first semester and insisting on receipts, because of complaints that contractors kept the money.", source: mea_russia }
  - { q: "Is there a Russian government scholarship for Indian students?", a: "Yes, the Russian Government quota. For 2027/28 applications close by 15 January 2027 for non-CIS countries, through education-in-russia.com.", source: misis_quota }
sources:
  - { id: nmc_fmgl, name: "NMC — Rules and regulations (FMGL Regulations 2021)", url: "https://nmc.org.in/page/rules-regulations-rules-regulations-nmc", covers: "54 months, internship, English, licence" }
  - { id: nmc_crmi, name: "NMC — Circular on CRMI slots for FMGs (10 Mar 2026)", url: "https://nmc.org.in/whats-new/download/955", covers: "7.5% / 100% internship seats", checked: 2026-10-29 }
  - { id: mea_russia, name: "MEA — Advisory for Indian students going abroad: Russian Federation", url: "https://www.mea.gov.in/images/pdf/advisory-russian.pdf", covers: "Medium, contractors, fees, transfers, passports" }
  - { id: eir, name: "Education in Russia — official admissions portal", url: "https://education-in-russia.com/", covers: "Up to 6 universities, invitation", checked: 2026-10-29 }
  - { id: misis_quota, name: "NUST MISIS — Russian Government Quota", url: "https://en.misis.ru/applicants/scholarships/quota/", covers: "Coverage, 2027/28 deadlines, dorm fee", checked: 2026-10-29 }
  - { id: unecon, name: "St Petersburg State University of Economics (UNECON) — Visa and migration", url: "https://en.unecon.ru/admissions/exchange/visa-and-migration-issues", covers: "Invitation, single/multiple entry, registration", checked: 2026-10-29 }
