doubts:
  - { q: "How much bank balance is needed for a France student visa?", a: "At least 877.50 euros a month for applications from 1 August 2026, replacing the earlier 615 euros a month.", source: cf_funds }
  - { q: "What is the Campus France fee in India?", a: "The Etudes en France fee is 20,000 rupees from 1 August 2026, paid only through the official link after your file is validated.", source: cf_eef }
  - { q: "Can Indian students stay in France after a master's?", a: "Yes. Indian graduates can get a 12-month post-study visa renewable once, 24 months in total, under the India–France agreement.", source: cf_alumni }
  - { q: "How many hours can students work in France?", a: "Up to 964 hours a year, which is 60% of the legal work year, with a validated residence permit.", source: cf_work }
  - { q: "What are public university fees in France for Indians?", a: "The non-EU rates are 2,902 euros a year for a bachelor's, 3,950 euros for a master's and 398 euros for a PhD.", source: cf_fees }
