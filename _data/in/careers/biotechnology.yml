    eyebrow: "Overview"
    heading: "What is Biotechnology?"
    parts:
      - overview:
          points:
            - "Biotechnology combines Biology and Technology to create useful products, medicines and solutions using living organisms, cells, DNA and biological systems."
            - "It's applied across healthcare (drug development, vaccines), agriculture (improved crops), industry (bioprocessing and manufacturing), and environmental science."
            - "Here's the honest, important context most guides skip: India's Bio-Economy is genuinely growing, targeted at a meaningful GDP contribution by 2030, with programmes like BIRAC creating real job openings in precision medicine and vaccine production."
          more:
            - "But the challenge for biotechnology graduates specifically is that the gap between a plain BSc and genuinely well-paying employment is wider than in some other disciplines."
            - "A BSc alone, without specialisation, frequently leads to lower-paying quality control or lab technician roles — the field genuinely rewards deliberate direction-setting more than most."
