    heading: "What is the Electronics Mechanic trade?"
    parts:
      - overview:
          points:
            - "ITI Electronics Mechanic is a <strong>2-year</strong>, NCVT/DGT-affiliated trade under the Craftsman Training Scheme, training students in electronic circuit theory, component identification, fault diagnosis and repair of consumer electronics — televisions, appliances, audio equipment, and basic circuit boards."
            - "It works with lower-voltage electronic circuits, distinct from the higher-current electrical systems covered in the <a href=\"iti-electrician.html\">Electrician</a> trade."
            - "Training is heavily hands-on, working directly with real devices and test equipment to diagnose and fix faults, combined with trade theory and circuit fundamentals, following the standard Craftsmen Training Scheme (CTS) structure."
          more:
            - "As electronics increasingly integrate into everyday products (smart appliances, IoT devices), this trade's relevance continues to grow, though specific niches like smartphone repair typically need additional specialised training."
