  - id: "faq"
    hid: "faq-heading"
    alt: true
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Can I do B.Ed right after Class 12?"
            a: "Not through the standard 2-year B.Ed route — that requires a bachelor's degree first. However, a 4-year Integrated B.A B.Ed or B.Sc B.Ed programme under NEP 2020 does let you start right after Class 12, combining a regular degree with teacher training in one course."
          - q: "Is a B.Ed enough to become a government school teacher?"
            a: "A B.Ed makes you eligible to appear for the required teaching test, but you also need to clear CTET (for central government/KVS schools) or the relevant state TET, plus the specific state or school recruitment exam, to actually be appointed as a government school teacher."
          - q: "What is the difference between CTET and a state TET?"
            a: "CTET (Central Teacher Eligibility Test) is conducted by CBSE and is required for teaching posts in central government schools like Kendriya Vidyalayas and Navodaya Vidyalayas, and is also accepted by many private schools. A state TET is conducted separately by each state and is required for teaching posts in that state's government schools."
          - q: "Do I need a specific subject background for B.Ed?"
            a: "You need a bachelor's degree in any discipline, but the subject you studied at graduation typically determines which subject you're qualified to teach at the school level — for example, a BA History graduate would generally teach Social Studies/History rather than Science."
          - q: "What is the earning potential for a school teacher in India?"
            a: "It varies by school type and location. Government school teachers, once appointed through a formal recruitment process, generally earn a stable, structured government salary with steady increments, while private school pay varies more widely by institution reputation and city."
      - note: "*Fee and salary figures are indicative, based on publicly available information as of 2026, and vary significantly by institution, state and school type — always verify current figures on the official college or recruitment board website."
        class: "table-note mt-lg"
