  - id: "faq"
    hid: "faq-heading"
    alt: true
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Can a qualified CA get all 13 ACCA papers exempted?"
            a: "No. A qualified ICAI Chartered Accountant typically gets the maximum 9 exemptions, covering all 3 Applied Knowledge and all 6 Applied Skills papers. The 4 Strategic Professional papers (SBL, SBR and two optional papers) cannot be exempted for anyone, regardless of prior qualification."
          - q: "Can ACCA members sign statutory audits in India?"
            a: "Not on their own. Signing statutory audit reports under Indian company law is currently reserved for ICAI-qualified Chartered Accountants. ACCA is a globally recognised qualification valued for advisory, reporting, taxation and finance roles in India, but it does not by itself grant Indian statutory audit signing rights."
          - q: "Is ACCA easier than CA?"
            a: "ACCA is often considered more flexible than CA because of its on-demand Applied Knowledge exams, exemption system, and multiple exam windows per year, which let candidates pace themselves. It isn't necessarily \"easier\" — Strategic Professional papers have pass rates similar to CA's harder papers — but the structure gives more control over timing."
          - q: "Do I need work experience to become a full ACCA member?"
            a: "Yes. Beyond passing all exams and completing the Ethics and Professional Skills Module, you need to complete the Practical Experience Requirement (PER) — 36 months of relevant work experience with performance objectives signed off by a workplace mentor — before you can become a full ACCA member rather than just an affiliate."
          - q: "Can Class 12 Science or Arts students do ACCA?"
            a: "Yes, ACCA's standard entry route is open to students from any stream, subject to meeting ACCA's minimum Class 12 marks requirement. Students who don't meet the standard entry criteria can start through the Foundation in Accountancy (FIA) route instead."
