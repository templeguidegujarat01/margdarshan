            source: ap-ec-ib
          - table:
              caption: "APECET-2026 calendar"
              head: ["Event", "Date"]
              rows:
                - ["Notification and applications open", "4 Feb 2026"]
                - ["Last date without late fee", "12 Mar 2026"]
                - ["Late fee slabs (₹1,000 → ₹10,000)", "16 – 28 Mar 2026"]
                - ["Hall tickets", "9 Apr 2026"]
                - ["Exam", "23 Apr 2026"]
                - ["Preliminary key · objections till", "27 Apr · 29 Apr 2026 (5 pm)"]
                - ["Result", "7 May 2026"]
            source: ap-ec-dates
      - id: eligibility
        nav: "Eligibility"
        eyebrow: "Academic eligibility"
        heading: "Diploma or B.Sc (Maths) with 45%"
        parts:
          - list:
              - "Indian nationality, belong to Andhra Pradesh, and meet the state's local / non-local rules for 2026-27."
              - "A diploma in engineering &amp; technology / pharmacy from SBTET Andhra Pradesh or an equivalent AICTE-approved diploma, or a 3-year B.Sc with Mathematics, with at least 45% marks (40% for BC / SC / ST)."
              - "Final-year diploma students can sit the test if they pass all subjects before admission."
            source: ap-ec-ib
      - id: scheme
        nav: "Exam Scheme"
        eyebrow: "Exam scheme &amp; qualifying marks"
        heading: "200 marks, ranked branch by branch"
        parts:
          - table:
              caption: "APECET-2026 engineering stream"
              head: ["Subject", "Marks"]
              rows:
                - ["Mathematics (common)", "50"]
                - ["Physics (common)", "25"]
                - ["Chemistry (common)", "25"]
                - ["Engineering paper of your diploma branch", "100"]
                - ["Total", "200"]
            source: ap-ec-ib
          - list:
              - "B.Sc (Maths) stream: Mathematics 100, Analytical Ability 50, Communicative English 50. Pharmacy stream: four sections of 50 marks."
              - "Qualifying mark: 25% (50 of 200); no minimum for SC / ST."
              - "Ranks are given separately for each engineering branch; any diploma holder who qualifies can enter B.Tech IT and CSE on the integrated merit rank."
              - "Ties: engineering subject marks, then Mathematics, then Physics; equal marks in all four are bracketed and the older candidate is preferred."
              - "Objections to the preliminary key cost ₹300 per question, refunded only for valid objections."
            source: ap-ec-ib
      - id: fees
        nav: "Fees"
        eyebrow: "Registration fee"
        heading: "₹700 to ₹800"
        parts:
          - table:
              head: ["Category", "Registration fee"]
              rows:
                - ["OC", "₹800"]
                - ["BC", "₹750"]
                - ["SC / ST", "₹700"]
            source: ap-ec-fee
      - id: reservation
        nav: "Local Status"
        eyebrow: "Local / non-local status"
        heading: "Andhra Pradesh's local rules apply"
        parts:
          - p: "Local and non-local status follows the Government of Andhra Pradesh's guidance for 2026-27; candidates must belong to the state."
            source: ap-ec-ib
      - id: documents
        nav: "Documents"
        eyebrow: "Application details"
        heading: "Aadhaar and Mee Seva numbers"
        parts:
          - list:
              - "Aadhaar number is mandatory."
              - "Enter the diploma / degree and Class 10 hall ticket numbers, places of study from Class 6, and Mee Seva numbers of the caste and income certificates; upload a photo (50 KB) and signature (30 KB)."
            source: ap-ec-ib
      - id: pay
        nav: "Costs"
        eyebrow: "Costs"
        heading: "Test fee only"
        parts:
          - p: "The booklet covers only the registration, late and objection fees. College fees are set at admission."
            source: ap-ec-ib
      - id: posting
        nav: "After ECET"
        eyebrow: "After the test"
        heading: "Admission under APSCHE rules"
        parts:
          - p: "Qualifying alone does not give a seat; admission follows the eligibility and admission rules of APSCHE and the Government of Andhra Pradesh."
            source: ap-ec-ib
          - links:
              - { label: "AP EAPCET", url: "state/andhra-pradesh/eapcet.html" }
              - { label: "AP PGECET", url: "state/andhra-pradesh/pgecet.html" }
