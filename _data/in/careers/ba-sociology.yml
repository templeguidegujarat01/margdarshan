  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What is BA Sociology?"
    parts:
      - overview:
          points:
            - "BA Sociology is a 3-year undergraduate degree (4 years for Honours with Research under National Education Policy (NEP) 2020) that studies how human societies are structured and how they change — covering family and kinship, caste and class, gender, religion, urbanisation, social movements and inequality."
            - "Unlike Psychology, which focuses on the individual mind, Sociology studies people as members of groups and institutions, looking for patterns that explain how societies actually function."
            - "It's offered widely across Indian universities."
          more:
            - "Delhi University colleges — <strong>Lady Shri Ram College, Hindu College and Miranda House</strong> — are among the most competitive destinations, alongside Jawaharlal Nehru University's undergraduate programmes, Presidency University Kolkata, and Tata Institute of Social Sciences-affiliated pathways, under the University Grants Commission (UGC) framework."
  - id: "who"
    hid: "who-heading"
    alt: true
    eyebrow: "Fit check"
    heading: "Who should choose BA Sociology"
    parts:
      - fit:
          match:
            - "Are curious about why social groups behave the way they do, beyond individual personality."
            - "Are considering UPSC, the development/NGO sector, HR, market research or social research."
            - "Are comfortable engaging critically with topics like caste, gender and inequality as academic subjects."
          mismatch:
            - "Want a directly applied, hands-on degree — BSW (Social Work) is closer to fieldwork than Sociology's theory focus."
            - "Want a degree with a fixed, direct pipeline into campus placements straight after graduation."
            - "Dislike reading academic texts and writing analytical essays — that is the bulk of the coursework."
  - id: "eligibility"
    hid: "elig-heading"
    eyebrow: "Eligibility"
    heading: "Who can apply for BA Sociology"
    parts:
      - elig_list:
          - "Class 12 pass (10+2) from a recognised board, typically <strong>45-50% aggregate</strong> for General/EWS/OBC and slightly relaxed for SC/ST/PwD categories, varying by university."
          - "Open to students from any stream — Arts, Commerce or Science — since no specific Class 12 subject is compulsory."
          - "Having studied Sociology at Class 11-12 helps with familiarity but is not offered in every school and is not a strict requirement."
