  - id: "fees"
    hid: "fees-heading"
    eyebrow: "The single biggest financial decision in this career"
    heading: "Fees & scholarships"
    parts:
      - prose:
          - "This is where MBBS differs most from almost every other career. A realistic <strong>5-year all-in budget at a government college</strong>, including hostel and living costs, commonly lands around <strong>₹13-15 lakh</strong> — genuinely affordable, and All India Institute of Medical Sciences (AIIMS) Delhi specifically charges as little as ₹6,280-7,000 in total tuition for the full course. The same degree at a <strong>private college on a state-quota seat</strong> commonly costs <strong>₹53-73 lakh</strong>, and at a <strong>deemed university or full management-quota seat</strong>, realistic budgets run <strong>₹1.2-1.47 crore or more</strong>. Merit-based fee concessions and state government scholarships exist at many government colleges; private and deemed institutions rarely offer comparable relief. This fee gap, not academic difficulty, is the real deciding factor for most families choosing between government and private admission."
