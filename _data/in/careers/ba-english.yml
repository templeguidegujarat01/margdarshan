          - title: "3-4 years of core English"
            text: "British, American and Indian literature, plus literary theory and criticism."
          - title: "Exam, master's or job"
            text: "UPSC prep, a Master of Arts (MA) in English, a B.Ed, or an entry-level content/publishing role."
