  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Can a fresh graduate become an insolvency professional?"
            a: "Not directly through the experience route; IBBI's Graduate Insolvency Programme is meant for young graduates and professionals with less than 10 years' experience."
          - q: "What is the Limited Insolvency Examination?"
            a: "The qualifying exam you must pass before enrolling with an Insolvency Professional Agency."
          - q: "What is an IPA?"
            a: "An Insolvency Professional Agency — a front-line regulator that enrols and supervises IPs under IBBI."
      - note: "*Pay figures are indicative unless they quote an official pay level, and rules change: confirm eligibility, dates and fees on the official websites listed under Sources before you act."
        class: "table-note mt-lg"
