  - id: "fees"
    hid: "fees-heading"
    eyebrow: "Wide range by institute type"
    heading: "Fees & scholarships"
    parts:
      - prose:
          - "Fees vary substantially by institute. National Law Universities typically charge <strong>₹2-3.5 lakh per year</strong>, while Delhi University's Faculty of Law and many state university law departments are far more affordable, often <strong>₹10,000-40,000 per year</strong>. Private law colleges can range widely, from moderate to over ₹2 lakh per year. Merit-based and need-based scholarships are available at most NLUs and state institutions. Always confirm current fees directly on the official institute website."
  - id: "salary"
    hid: "salary-heading"
    alt: true
    eyebrow: "Indicative figures — unusually wide range"
    heading: "LLB salary in India"
    intro: "Law has one of the widest pay ranges of any Arts career, depending heavily on your college, specialisation and chosen path — these are broad, commonly reported ranges, not guarantees."
    parts:
      - salary:
          - label: "Early litigation practice"
            value: "₹1.5–4 LPA"
            text: "Common starting range while building an independent practice or working under a senior advocate."
          - label: "Corporate law firms"
            value: "₹6–20+ LPA"
            text: "Reported for graduates of top NLUs joining large corporate law firms, varying significantly by firm tier."
          - label: "In-house / compliance roles"
            value: "₹5–15 LPA"
            text: "For legal counsel and compliance roles at corporates, rising with experience and seniority."
  - id: "jobs"
    hid: "jobs-heading"
    eyebrow: "Where graduates work"
    heading: "Job profiles, recruiters & industries"
    parts:
      - chips:
          - label: "Job profiles"
            text: "Litigating Advocate, Corporate Lawyer, Legal Associate, In-House Counsel, Compliance Officer, Legal Researcher, Judge (via judiciary exams)"
          - label: "Government routes"
            text: "State Judicial Services exams, Public Prosecutor roles, legislative drafting and legal affairs departments"
          - label: "Top employers"
            text: "Large corporate law firms, courts and chambers of senior advocates, corporate legal departments, government legal cells, NGOs working on legal aid and policy"
          - label: "Industries"
            text: "Law & litigation, corporate & compliance, government & judiciary, policy & legislative affairs"
  - id: "higher"
    hid: "higher-heading"
    alt: true
    eyebrow: "Beyond the degree"
    heading: "Higher studies"
    parts:
      - prose:
          - "A <strong>Master of Laws (LLM)</strong> — at NLUs, Delhi University or abroad — lets graduates specialise in areas like corporate law, criminal law, intellectual property, constitutional law or international law, and is often preferred for academic or highly specialised corporate roles. Some graduates instead prepare for <strong>Judicial Services exams</strong> to become a judge, while others pursue further certifications in arbitration, taxation or compliance to strengthen a specific practice area."
  - id: "proscons"
    hid: "pc-heading"
    eyebrow: "Honest take"
    heading: "Advantages and disadvantages"
    parts:
      - proscons:
          pros:
            - "A clearly defined, well-regulated professional qualification with strong long-term earning potential."
            - "Genuinely diverse — litigation, corporate law, judiciary, policy and academia are all real paths from the same degree."
            - "Top NLU graduates have strong campus placement outcomes into major corporate law firms."
          cons:
            - "Very wide, unpredictable income range — early litigation income especially can be modest for several years."
            - "CLAT and top NLU admission are highly competitive, requiring serious dedicated preparation."
            - "Outcomes vary sharply by college tier — placement quality at a top NLU versus a lesser-known law college differs significantly."
  - hid: "myth-heading"
    eyebrow: "Common myths"
    heading: "Myths vs facts"
    parts:
      - myths:
          - myth: "Only Arts students can study law."
            fact: "Law is open to students from any Class 12 stream — Commerce and Science-background students are common at top NLUs, and a Commerce background can even help with corporate law electives."
          - myth: "Every lawyer earns a very high salary."
            fact: "Income varies enormously — top-tier corporate law firm hires earn strongly, but many litigators build income gradually over years, especially early in independent practice."
          - myth: "A law degree only leads to court practice."
            fact: "Graduates also work in corporate law, in-house legal teams, compliance, judicial services, policy drafting and academia — litigation is one visible path among several."
  - hid: "comparison"
    alt: true
    eyebrow: "Choosing between options"
    heading: "Comparison Table"
    parts:
      - compare:
          title: "Compare LLB with Similar Fields"
          text: "See duration, eligibility, key exams, starting salary and work domain for LLB, Judicial Services and BA Political Science side by side."
          href: "career-comparison.html?c=llb,judicial-services,ba-political-science"
          label: "Compare now"
  - hid: "related-heading"
    alt: true
    eyebrow: "Related careers"
    heading: "If you're considering LLB, also look at"
    parts:
      - related:
          - name: "Judicial Services"
            sub: "Judge / magistrate in the district judiciary"
            href: "judicial-services.html"
          - name: "BA Political Science"
            sub: "Policy & public service"
            href: "ba-political-science.html"
          - name: "UPSC Civil Services"
            sub: "IAS / IPS / IFS administration"
            href: "upsc-civil-services.html"
          - name: "BA Philosophy"
            sub: "Research, teaching, writing & policy"
            href: "ba-philosophy.html"
  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Should I do a 5-year integrated law degree or a 3-year LLB after graduation?"
            a: "If you're sure about law right after Class 12, the 5-year integrated route (BA LLB, BBA LLB, etc.) via CLAT is faster and more common at top National Law Universities. The 3-year LLB after any bachelor's degree suits students who decide on law later, or want a different subject background first, like Political Science or Commerce."
          - q: "Do I need to be from the Arts stream to study law?"
            a: "No. Law is open to students from any Class 12 stream — Arts, Commerce or Science — since CLAT and similar law entrance exams don't require specific Class 12 subjects. A Commerce background can actually help for corporate law-focused electives later."
          - q: "What is CLAT and who conducts it?"
            a: "CLAT is a national-level entrance exam conducted by the Consortium of National Law Universities, used for admission to 5-year integrated law programmes at NLUs and many other law colleges. It tests English, current affairs and General Knowledge (GK), legal reasoning, logical reasoning and quantitative techniques."
          - q: "Is law a good career only for litigation and court practice?"
            a: "No. While litigation is the most visible path, many law graduates work in corporate law at law firms, in-house legal teams at companies, judicial services (via state judiciary exams), policy and legislative drafting, or compliance and regulatory roles — litigation is one path among several."
          - q: "How much do fresh law graduates earn in India?"
            a: "It varies enormously. Graduates from top National Law Universities joining large corporate law firms can start considerably higher, while those beginning independent litigation practice typically earn much less initially and build income gradually as their practice grows — the range across the profession is unusually wide."
          - q: "Can I become a criminal lawyer straight after Class 12?"
            a: "Not directly. You first complete an LLB (5-year integrated or 3-year), enrol with a State Bar Council and clear the AIBE. Criminal law is then a choice of practice area — through electives, internships with criminal lawyers, and optionally an LLM."
      - note: "*Fee and salary figures are indicative, based on publicly available information as of 2026, and vary significantly by institution and career path — always verify current figures on the official institute website."
        class: "table-note mt-lg"
      - source_link:
          href: "https://www.barcouncilofindia.org/"
          label: "Official source: Bar Council of India (barcouncilofindia.org)"
