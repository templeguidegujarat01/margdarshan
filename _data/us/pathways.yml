# USA Edition — career PATHWAYS (what a student chooses to study/aim for).
# A pathway is not an occupation: it lists several BLS occupations
# (_data/us/occupations.yml) and shows pay/outlook per occupation.
#
#   slug           URL: /us/careers/<slug>/
#   category       sidebar/hub grouping
#   lead           occupation id used for the "quick facts" headline
#   occupations    representative destinations, most typical first
#   route          typical education route (degree ids from degrees.yml)
#   admission      admission tests beyond high school (ids from tests.yml)
#   license        id in licenses.yml, or none
#   bls_note       honest caveat about how BLS classifies this field
#   license_stat   optional { value, note } for the License stat when the licence is not a state
#                  license in licenses.yml (e.g. FINRA exams that need a sponsoring firm)
#   related        other pathway slugs
#   in_page        existing India Edition page on the SAME FIELD, used only by
#                  the region switcher. Same subject, different system — never
#                  an equivalence of qualifications (MBBS ≠ M.D., LLB ≠ J.D.).
#   phase          build phase for the page (see docs/global-editions)

#   ap_tuition_hack  one-sentence AP tip: the AP exam that saves the most for this major. Dollar range =
#                  credits x per-credit sticker tuition from College Board 2025–26 averages (guides.yml
#                  money.sticker_prices, source cb_pricing_2025: $11,950 public in-state, $45,000 private
#                  nonprofit, at 30 credits a year). Credit rules belong to each college (cb_ap_credit).
#   sat_act_weight   one-line status note on how much the SAT/ACT matters on this route.
#   live           true once /us/careers/<slug>/ exists — only then do the
#                  region switcher and hubs link to it
#
# categories.badge reuses the existing .trend-badge colour classes.
categories:
  - { id: technology, label: "Technology", badge: t-science }
  - { id: engineering, label: "Engineering", badge: t-diploma }
  - { id: healthcare, label: "Healthcare", badge: t-govt }
  - { id: law, label: "Law", badge: t-arts }
  - { id: business, label: "Business & Finance", badge: t-commerce }
  - { id: social-science, label: "Psychology & Social Science", badge: t-arts }

