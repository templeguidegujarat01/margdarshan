        who: "A BSW is the most common requirement for entry-level nonclinical jobs."
        steps:
          - { tag: "Start", title: "High school diploma", text: "", kind: start, source: ooh_socialwork }
          - { tag: "4 years", title: "Bachelor of Social Work (BSW)", text: "Includes supervised fieldwork or an internship.", kind: stage, source: ooh_socialwork }
          - { tag: "Exam", title: "ASWB Bachelors exam, where the state licenses BSWs", text: "Texas, for example, requires it for the LBSW.", kind: exam, source: tx_bhec_lbsw, href: "us/professional-licenses/social-work/#exams", link: "ASWB exams" }
          - { tag: "License", title: "Bachelor's-level license (some states)", text: "Some states also require nonclinical social workers to have a license or credential.", kind: licence, source: ooh_socialwork, href: "us/professional-licenses/social-work/", link: "License steps" }
          - { tag: "Goal", title: "Social worker (nonclinical)", text: "", kind: goal, source: ooh_qf_socialwork }
      - id: clinical
