          - label: "SSB Interview (900 marks)"
            text: "A 5-day process: Officer Intelligence Rating and Picture Perception & Description Test on Day 1, then Psychology Tests, Group Testing Officer tasks, a Personal Interview, and a final Conference."
          - label: "CPSS (Air Force Flying Branch only)"
            text: "Candidates specifically applying for the Flying Branch must also clear the Computerised Pilot Selection System."
          - label: "Extremely limited seats"
