    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "How do I get admission to B.F.Sc?"
            a: "Through ICAR's national quota via CUET-UG, or through your state agricultural/fisheries university's admission process."
          - q: "Is B.F.Sc a professional degree?"
            a: "Yes, it is a 4-year professional degree in agriculture and allied sciences."
          - q: "Who recruits fisheries scientists?"
            a: "ICAR scientists are recruited by ASRB; states recruit fisheries officers through their PSCs."
