    eyebrow: "Overview"
    heading: "What is Diploma in Production Engineering?"
    parts:
      - overview:
          points:
            - "Diploma in Production Engineering is a 3-year polytechnic programme covering manufacturing processes, machine tool operations (including Computer Numerical Control (CNC) machining), production planning and control, and quality management."
            - "Unlike the broader Mechanical Engineering diploma, this programme concentrates specifically on how products move efficiently from raw material to finished, quality-checked output at scale."
            - "It's offered at government polytechnics run by each state's technical education board, as well as private AICTE-approved polytechnic institutes, though it's somewhat less universally offered than the more common Mechanical or Civil diplomas — check availability in your specific state."
