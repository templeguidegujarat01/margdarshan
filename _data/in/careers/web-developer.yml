          - label: "Full-time hiring"
            text: "A technical screening, a portfolio review, and a practical coding task — generally lighter on pure DSA than a broader Software Engineer interview."
          - label: "Freelance hiring"
            text: "Client reviews and ratings on Upwork or Fiverr, a personal portfolio site, and direct referrals from past clients."
          - label: "Company type changes pay significantly"
            text: "Product companies and MNCs typically pay 2-3x more than service companies for the same role and experience level."
  - id: "fees"
    hid: "fees-heading"
    eyebrow: "One of the most learnable-for-free fields in tech"
    heading: "Cost of each route"
    parts:
      - prose:
          - "A B.Tech in CSE commonly costs <strong>₹2-8 lakh</strong> at government institutes and <strong>₹5-20 lakh</strong> at private colleges (see the <a href=\"cse.html\">CSE page</a>), while a BCA is generally more affordable at <strong>₹30,000-1,50,000 per year</strong> (see the <a href=\"bca.html\">BCA page</a>). What's genuinely different about web development is that it's one of the most learnable-for-free fields in tech — resources like freeCodeCamp, MDN Web Docs, and countless free YouTube courses can take you from zero to a working portfolio at no cost. Paid bootcamps, for students who want a guided, structured path, commonly cost <strong>₹20,000-2,00,000</strong> depending on depth and format, but they're genuinely optional here rather than necessary."
