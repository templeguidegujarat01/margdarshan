  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Can Arts or Commerce students do BCA?"
            a: "Yes. BCA is explicitly open to students from Arts, Commerce and Science alike at most universities — there is no Physics, Chemistry, Maths (PCM) requirement the way there is for a B.Tech in Computer Science. A Maths or Computer Science background at Class 12 helps with the coursework but usually isn't mandatory for admission."
          - q: "What is the real salary difference between BCA and B.Tech CSE?"
            a: "At the entry level, BCA graduates commonly earn ₹2.5-6 LPA, while B.Tech CSE graduates commonly earn ₹4-10 LPA at most colleges — and considerably more at top IITs/NITs. That gap narrows with experience: by mid-career, professionals from both backgrounds can be earning ₹8-18 LPA depending on skills, certifications and employer, especially if the BCA graduate has added strong practical skills."
          - q: "Is BCA better than BSc IT?"
            a: "They're closely comparable. BCA tends to be slightly more focused on programming and software development, while BSc IT often leans toward applied IT systems and is commonly paired with industry certifications like AWS, Cisco or CompTIA. Neither is clearly superior — the better fit depends on your specific college's curriculum and placement record."
          - q: "What should I do after BCA — MCA or a job?"
            a: "Both are valid, and the choice depends on your goals. An MCA deepens your computer science theory and can meaningfully improve your salary and role level, especially if your BCA college wasn't highly ranked. Going straight into a job makes sense if you've already built strong practical skills and a project portfolio during your BCA, and want to start gaining work experience immediately."
          - q: "Do I need JEE for BCA?"
            a: "No. BCA admission is almost always based on Class 12 marks (merit) or a university-specific entrance test, not JEE. This is one of BCA's clearest advantages over a B.Tech in Computer Science Engineering, which requires JEE Main (and often JEE Advanced) for the strongest colleges."
      - note: "Figures are indicative (2026) — confirm on the official college or authority website."
        class: "table-note mt-lg"
