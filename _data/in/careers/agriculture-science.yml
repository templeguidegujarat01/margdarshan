  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "What is a realistic BSc Agriculture salary in India?"
            a: "Freshers in private agribusiness commonly earn ₹3-5.5 LPA, with multinational agrochemical companies like Syngenta or Bayer CropScience reported to offer ₹6-12 LPA at entry level. Government roles are genuinely competitive with, or better than, private entry pay: IBPS AFO starts around ₹48,000-55,000/month and NABARD Grade A around ₹85,000-1,00,000/month gross. Senior agritech and agribusiness roles with 5-10 years of experience are reported to reach ₹12-20 LPA or more, including ESOPs at high-growth startups."
          - q: "Is Agriculture Science a good field for government jobs?"
            a: "Yes, genuinely one of the strongest among the sciences. Central and state institutions — ICAR, NABARD, FCI, IBPS-affiliated banks, state agriculture departments, and cooperatives like IFFCO — actively recruit agriculture graduates year-round, and entry-level government pay is often equal to or better than private-sector starting salaries, unlike some other science fields where government roles pay less initially."
          - q: "Is the agritech industry actually a good career option?"
            a: "Yes — it's reported as a genuine, fast-growing option, with India's agritech startup ecosystem growing at roughly 25% annually according to NASSCOM. Companies like Ninjacart, DeHaat and AgriBazaar are becoming significant employers, with senior specialists reported to earn ₹12-20 LPA or more including ESOPs. It offers faster growth potential than traditional government roles, though with less job security in the early years."
          - q: "Is NEET required for BSc Agriculture?"
            a: "No. The national-level route for agriculture is CUET-UG, distinct from NEET: ICAR fills its all-India quota seats in agricultural universities through CUET-UG, which replaced the old ICAR AIEEA UG exam. Many colleges also admit via state-level entrance exams or direct Class 12 merit."
          - q: "Should I pursue an MSc after BSc Agriculture?"
            a: "It's a strong option if you're targeting research, academic, or ICAR Scientist roles specifically. The ICAR AIEEA PG exam grants entry to MSc Agriculture with a funded ICAR PG Scholarship (₹12,640/month), and a subsequent PhD via ICAR JRF/SRF is also funded (₹31,000-35,000/month). A BSc alone gets you in the door for most entry-level government and private roles; further study is what raises the ceiling toward research and scientist-track careers."
      - note: "Figures are indicative (2026) — confirm on the official college or authority website."
        class: "table-note mt-lg"
