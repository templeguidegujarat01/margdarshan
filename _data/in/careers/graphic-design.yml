  - id: "faq"
    hid: "faq-heading"
    alt: true
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Do I need a design degree to become a graphic designer?"
            a: "Not strictly. Many successful graphic designers hold a formal degree (like a B.Des from NID or a private design school), but others build careers through shorter diploma courses or self-taught skill-building combined with a strong portfolio — most employers and clients ultimately judge your portfolio, not just your qualification."
          - q: "What software do I need to learn for graphic design?"
            a: "The Adobe Creative Suite is the industry standard — primarily Photoshop, Illustrator and InDesign — alongside growing use of Figma for collaborative and UI-adjacent design work. Most design courses and self-taught paths teach these tools directly."
          - q: "What is the difference between Graphic Design and UI/UX Design?"
            a: "Graphic Design covers visual communication broadly — logos, branding, posters, packaging and print/digital media. UI/UX Design focuses specifically on designing digital product interfaces and user experience — apps and websites — and involves more user research and interaction design alongside visual skills."
          - q: "Is freelance graphic design a realistic career path?"
            a: "Yes, it's a common path once you've built a strong portfolio and client network, though income can be inconsistent in the early stages. Many designers start with an in-house or agency job to build experience and stability before transitioning to freelance work."
          - q: "How much do graphic designers earn in India?"
            a: "It varies by experience, specialisation and employer type. Entry-level in-house or agency roles typically start modestly, while experienced designers, art directors, or those with a strong freelance/branding niche can earn considerably more."
      - note: "*Salary figures are indicative, based on publicly available information as of 2026, and vary significantly by route, specialisation and employer type."
        class: "table-note mt-lg"
