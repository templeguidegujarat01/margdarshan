gate: Any Class 12 stream, then a law degree, then court practice (fresh graduates can apply in notices up to 31 March 2027; one year of practice is needed after that), then your state's exam, then one year at the State Judicial Academy and one year of Law Clerkship.
gate_source: sci-bhumika
core:
  what:
    text: A Civil Judge (Junior Division) is the entry-level judge in a state's courts. Each state recruits through its own High Court or State Public Service Commission, under rules made by the state government with the High Court.
    source: sci-bhumika
  day:
    - Hear cases in court and follow court procedure and decorum.
    - Look at the evidence given by both sides.
    - Write judicial orders and judgments.
    - Decide matters about life, liberty, property and personal rights of people.
    - Deal fairly with lawyers, people in the case and court staff.
  pay: []
  pay_note: No single national pay scale is printed, because each state fixes the pay. The Supreme Court order says a Trainee Judicial Officer gets half the pay of a Judicial Magistrate First Class in that state during training and Law Clerkship. After a good evaluation the officer gets the regular pay scale of the post.
  routes:
    - title: Law degree after Class 12
      text: Pass Class 12 or an equivalent exam with at least 45% marks (40% for SC, ST and PwD) and take CLAT (UG). The Bar Council of India rules also allow a five year integrated B.A., LL.B. course.
      source: clat-ug
    - title: Law degree after any degree
      text: A person who has graduated in any subject can apply for a three year law degree (LL.B.).
      source: du-llb
    - title: Fresh graduate window (notices up to 31 March 2027)
      text: For notices issued up to 31 March 2027, all law graduates can apply. They are treated as having one year of practice. They do not need a separate Certificate of Practice.
      source: sci-bhumika
    - title: One year of practice (notices from 1 April 2027)
      text: From 1 April 2027 a candidate needs at least one year of actual practice in the District Courts. A Certificate of Practice proves it.
      source: sci-bhumika
  cost_time:
    - label: Law degree after a degree
      value: Three years (LL.B.)
      source: du-llb
    - label: Law degree after Class 12
      value: Five year integrated B.A., LL.B.
      source: andaman-law
    - label: Practice needed (notices from 1 April 2027)
      value: At least one year of actual practice in the District Courts
      source: sci-bhumika
    - label: Training after selection
      value: One year at the State Judicial Academy, then one year of Law Clerkship
      source: sci-bhumika
    - label: Pay during training
      value: Half the pay of a Judicial Magistrate First Class in that state
      source: sci-bhumika
  cost_note: The Supreme Court order gives no exam fee. Check the notice of the state you apply to, because fees can change.
  challenges:
    - text: From 1 April 2027 the Certificate of Practice is not issued unless your presence and work in real court proceedings are recorded in the way the High Court sets.
      source: sci-bhumika
    - text: After selection you are a Trainee Judicial Officer for about two years, on half pay. You get the regular post only if a High Court Judge's report on you is satisfactory.
      source: sci-bhumika
    - text: Time spent on higher legal study does not count as practice. The Supreme Court refused to count it.
      source: sci-bhumika
    - text: The scheme stays in force for five years from 21 August 2026. After that the Supreme Court may look at it again, so rules can change.
      source: sci-bhumika
  not_for:
    - People who cannot manage about two years of training and clerkship on half pay after selection.
    - People who do not want to decide matters of life, liberty, property and reputation from the first day.
    - People who want one national exam. Civil Judges are recruited state by state.
journey:
  - stages:
      - c8
      - c9
    title: Learn what the job is and what road leads to it
    do:
      - text: Know that Civil Judges are appointed by each state, not through one national exam.
        source: ncrwc-ajs
      - text: Know that you can enter law from any Class 12 stream, if you pass Class 12 with the marks CLAT asks for.
        source: clat-ug
    money:
      - nmmss
    doubts:
      - q: Can I become a Civil Judge in Class 8 or 9 itself?
        a: No. You first need a law degree. After that comes court practice and a state exam, as the Supreme Court order says.
        next: Keep studying well and choose your Class 11 stream when the time comes.
        source: sci-bhumika
      - q: Is there one national exam to become a Civil Judge?
        a: No. The Governor of each state appoints these judges under state rules, after talking to the High Court and the State Public Service Commission.
        next: Note the state where you want to work and read its High Court website later.
        source: ncrwc-ajs
      - q: What does a Civil Judge do?
        a: A Civil Judge decides questions about the life, liberty, property and personal rights of people, using court procedure.
        next: If a teacher or parent can take you, watch a hearing in a district court.
        source: sci-bhumika
  - stages:
      - c10
    title: Choose the stream
    stream: Any stream (Science, Commerce or Arts). The CLAT rule names no stream.
    do:
      - text: Pick the stream you like and can score well in. CLAT asks only for 10+2 or an equivalent exam.
        source: clat-ug
      - text: Aim for at least 45% marks in Class 12 (40% for SC, ST and PwD).
        source: clat-ug
    doubts:
      - q: Can I become a Civil Judge after Commerce or Science?
        a: Yes. CLAT asks for 10+2 or an equivalent exam with at least 45% marks (40% for SC, ST and PwD). It does not name a stream.
        next: Choose the stream that suits you and work on your marks.
        source: clat-ug
      - q: Is there an age limit for the law entrance exam CLAT?
        a: For CLAT 2027 there is no upper age limit for the UG programme.
        next: Read the CLAT page again in your own year, because rules can change.
        source: clat-ug
      - q: Which law course can I join after Class 12?
        a: A five year integrated B.A., LL.B. under the Bar Council of India rules. It needs 10+2 with at least 45% marks (40% for SC and ST).
        next: Read the CLAT eligibility page every year before you apply.
        source: andaman-law
  - stages:
      - c11
      - c12
    title: Finish Class 12 and prepare for the law entrance
    do:
      - text: Pass Class 12 or an equivalent exam with at least 45% marks (40% for SC, ST and PwD).
        source: clat-ug
      - text: Apply for CLAT (UG). If you are still appearing for Class 12 in March or April 2027, you can apply, but you must show proof of passing at admission.
        source: clat-ug
    exams:
      - name: CLAT (UG)
        when: Students who appear in Class 12 in March or April 2027 can apply for CLAT 2027
        source: clat-ug
    money:
      - nmmss
      - csss
    mistakes:
      - Forgetting to show the Class 12 pass proof at admission. You then lose the right to be considered.
    late: If you miss CLAT, you can still do any degree first and then a three year law degree.
    doubts:
      - q: What if I get less than 45% in Class 12?
        a: CLAT UG asks for at least 45% marks (40% for SC, ST and PwD). Below that you would not meet its rule.
        next: Check the marks rule of the law faculty where you plan to apply after a degree.
        source: clat-ug
      - q: Can I apply for CLAT while my Class 12 exam is still on?
        a: Yes, if you appear in March or April 2027. You must show proof that you passed at the time of admission, or you lose the right to be considered.
        next: Keep your Class 12 result ready for admission.
        source: clat-ug
      - q: Can I become a Civil Judge right after the five year law course?
        a: For notices issued up to 31 March 2027, yes. All law graduates can apply and are treated as having one year of practice. From 1 April 2027 you need one year of actual practice in the District Courts first.
        next: Plan to work in court with a lawyer for a year after your degree.
        source: sci-bhumika
      - q: How long will it take to become a Civil Judge after Class 12?
        a: "You need the law degree first. Then, from 1 April 2027, one year of practice. After selection you spend about two years as a trainee: one year at the State Judicial Academy and one year of Law Clerkship."
        next: "Plan your years in this order: degree, practice, exam, training."
        source: sci-bhumika
  - stages:
      - ug
    title: "In college: the law degree years"
    do:
      - text: Join a law course whose university is recognised by the Bar Council of India. Only such a degree counts for enrolment.
        source: advocates-act
      - text: Do not plan to count higher legal study as practice. The Supreme Court did not allow it.
        source: sci-bhumika
      - text: Learn how courts work. The Supreme Court says a judge needs to know court procedure and how to write orders.
        source: sci-bhumika
    doubts:
      - q: Does my law degree need to come from a recognised university?
        a: Yes. The Advocates Act counts a law degree for enrolment only if the university is recognised by the Bar Council of India.
        next: Check that your law college and university are recognised before you join.
        source: advocates-act
      - q: When can I enrol as an advocate?
        a: You must be a citizen of India, at least 21 years old, and hold a law degree from a recognised university. You apply to the State Bar Council where you plan to practise.
        next: Keep your age proof and degree result ready.
        source: advocates-act
      - q: Can I count my LL.M. or other higher study as practice?
        a: No. The Supreme Court refused to count time spent on higher legal education as practice.
        next: Plan real court work, not more study, to meet the practice rule.
        source: sci-bhumika
      - q: Can I appear in court before I enrol?
        a: Usually no. Except where the Act or another law allows it, only a person enrolled as an advocate may practise in a court. A court can allow a person to appear in one particular case.
        next: Enrol with the State Bar Council as soon as you are eligible.
        source: advocates-act
  - stages:
      - grad
    title: "After the law degree: practice, the notice and the state exam"
    do:
      - text: Enrol with the State Bar Council. The 2025 order counts years of practice from the date of provisional enrolment.
        source: sci-bhumika
      - text: Watch for the notice from the High Court or Public Service Commission of your state.
        source: sci-bhumika
      - text: "Check which rule your notice follows: issued up to 31 March 2027, or on or after 1 April 2027."
        source: sci-bhumika
    exams:
      - name: State Civil Judge (Junior Division) examination
        when: "Set by your state's notice. Notices up to 31 March 2027: all law graduates can apply. From 1 April 2027: one year of practice is needed"
        source: sci-bhumika
    money:
      - trainee-emolument
    doubts:
      - q: Can I apply right after my law degree?
        a: For notices issued up to 31 March 2027, yes. All law graduates can apply and are treated as having one year of practice. They do not need a separate Certificate of Practice.
        next: Read your state's notice to see its date and last date to apply.
        source: sci-bhumika
      - q: What if the notice comes on or after 1 April 2027?
        a: You need at least one year of actual practice in the District Courts and a Certificate of Practice. It is issued only if your presence and work in court proceedings are recorded in the way the High Court sets.
        next: Find out your High Court's method as soon as it is published.
        source: sci-bhumika
      - q: Will I be a judge as soon as I pass?
        a: No. You first become a Trainee Judicial Officer. You spend one year at the State Judicial Academy and one year of Law Clerkship. Six months are with a District Judge and six months with a High Court Judge. You get the regular post if the evaluation is satisfactory.
        next: Plan for about two years of training after you are selected.
        source: sci-bhumika
      - q: How much will I be paid while training?
        a: The Supreme Court order gives half the pay of a Judicial Magistrate First Class in that state, during training and Law Clerkship. After a satisfactory evaluation you get the regular pay scale of the post.
        next: Look up the pay of a Judicial Magistrate First Class in your state's rules.
        source: sci-bhumika
  - stages:
      - work
    title: "Working or switching career: lawyers, law clerks and others"
    do:
      - text: A practising advocate can use court practice toward the rule of one year of actual practice (notices from 1 April 2027).
        source: sci-bhumika
      - text: A Law Clerk with a judge should ask the High Court how that work will be certified. The 2025 order counted it as practice.
        source: sci-bhumika
      - text: After joining, finish the trainee period. Later, Civil Judges can be promoted to the Higher Judicial Service.
        source: sci-bhumika
    doubts:
      - q: I am already a lawyer. Can I switch to the Civil Judge job?
        a: Yes, if you meet your state's rules. From 1 April 2027 you need at least one year of actual practice in the District Courts, shown by a Certificate of Practice.
        next: Start collecting proof of your court work now.
        source: sci-bhumika
      - q: I work as a Law Clerk. Does that count?
        a: The 2025 order said work as a Law Clerk with any Judge or Judicial Officer counts when years of practice are added up. The 2026 order keeps the 2025 rules for now.
        next: Ask the High Court how it will certify Law Clerk work.
        source: sci-bhumika
      - q: Can a person from another job, with no practice, become a Civil Judge?
        a: Not directly. You need a law degree first. For notices up to 31 March 2027 all law graduates can apply. After that you need one year of actual practice in the District Courts.
        next: Enrol as an advocate and start court work.
        source: sci-bhumika
      - q: What comes after Civil Judge (Junior Division)?
        a: Civil Judges can be promoted to the Higher Judicial Service. The Constitution also lets an advocate with seven years of practice be appointed a District Judge.
        next: Read Article 233 of the Constitution to see the District Judge rule.
        source: sci-bhumika
board_note: CLAT needs 10+2 or an equivalent exam, and it names no stream. Minimum marks are 45% (40% for SC, ST and PwD).
board_source: clat-ug
exam:
  name: Civil Judge (Junior Division) examination (held state by state)
  body: The High Court or State Public Service Commission of each state
  facts:
    - label: Qualification
      value: A law degree. In notices up to 31 March 2027 all law graduates can apply.
      source: sci-bhumika
    - label: Practice (notices from 1 April 2027)
      value: At least one year of actual practice in the District Courts, shown by a Certificate of Practice
      source: sci-bhumika
    - label: After selection
      value: "Trainee Judicial Officer: one year of training at the State Judicial Academy, then one year of Law Clerkship"
      source: sci-bhumika
    - label: Age limit
      value: The Supreme Court order gives none. State rules decide.
      source: sci-bhumika
    - label: How long the scheme runs
      value: Five years from 21 August 2026, then the Supreme Court may look at it again
      source: sci-bhumika
  stages:
    head:
      - Stage
      - What it is
      - Rule
    rows:
      - - Application
        - Apply to the state's notice for Civil Judge (Junior Division)
        - "Notices up to 31 March 2027: all law graduates. From 1 April 2027: one year of actual practice with a Certificate of Practice"
      - - Selection examination
        - The examination for the post, run under each state's rules
        - Details are in the state's notice and rules
      - - Judicial Academy training
        - Compulsory training as a Trainee Judicial Officer
        - One year at the State Judicial Academy, on half the pay of a Judicial Magistrate First Class
      - - Law Clerkship
        - Six months under a District or Sessions Judge or a Higher Judicial Service member, then six months under a sitting High Court Judge
        - One year, on the same pay as during training
      - - Evaluation and regular post
        - A High Court Judge gives a reasoned report on the trainee
        - If it is satisfactory, regular appointment with the regular pay scale
    source: sci-bhumika
state_rules:
  - text: Each state recruits through its own High Court or Public Service Commission. The Supreme Court rules on practice, training and Law Clerkship apply to all notices for this post.
    source: sci-bhumika
