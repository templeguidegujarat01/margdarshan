# accountancy — UK career data sheet, read by _includes/uk-career.html (page: uk/careers/accountancy/).
# Rules: see the header of _data/uk/careers/law.yml (checked by scripts/check-uk-data.mjs).
slug: accountancy
title: "Chartered accountant: ACA or ACCA"
eyebrow: "UK · Finance · Accountancy"
lede: "Two big UK routes. <strong>ACA</strong> from ICAEW is usually done while working at an accountancy firm. <strong>ACCA</strong> is flexible: you can start straight after A levels. Both take years of <strong>exams + paid work</strong> together."
checked: 2026-10-09
in_page: ca.html
us_pathway: accounting
licensure_body: { short: "ICAEW · ACCA", name: "The professional bodies that award ACA and ACCA", note: "Membership after exams + work", source: acca_structure }
pay:
  - { soc: "2421", label: "Chartered and certified accountants" }
school:
  - { k: "GCSEs", v: "<strong>English and maths</strong> count: ACCA asks for both.", source: acca_who }
  - { k: "A levels", v: "ACCA's minimum is <strong>2 A levels + 3 GCSEs</strong> (5 subjects).", source: acca_who }
  - { k: "No A levels?", v: "Start at ACCA's foundation level, then move up to the main exams.", source: acca_who }
badges:
  - { label: "ACA exams", value: "15", note: "plus 450 days of work experience", source: icaew_aca_employers }
  - { label: "ACCA exams", value: "13", note: "plus 36 months of work experience", source: acca_structure }
tracks:
  - id: aca
    title: "ACA (ICAEW)"
    tag: "ICAEW"
    who: "Awarded by <strong>ICAEW</strong>, the Institute of Chartered Accountants in England and Wales."
    steps:
      - { tag: "Start", title: "Join an ICAEW training employer", text: "You study while you work.", kind: stage, source: icaew_aca_employers }
      - { tag: "Exams", title: "15 exams", text: "Including financial management, law, assurance and business strategy.", kind: gate, source: icaew_aca_employers }
      - { tag: "Work", title: "450 days of practical work experience", text: "Normally takes 3 to 5 years.", kind: stage, source: icaew_pwe }
      - { tag: "Ethics", title: "Ethics and professional scepticism", text: "Part of the training.", kind: stage, source: icaew_aca_employers }
      - { tag: "Goal", title: "ICAEW Chartered Accountant (ACA)", text: "", kind: license, source: icaew_aca_employers }
  - id: acca
    title: "ACCA"
    tag: "ACCA"
    who: "Awarded by <strong>ACCA</strong>, the Association of Chartered Certified Accountants."
    steps:
      - { tag: "School", title: "2 A levels + 3 GCSEs", text: "Including English and maths.", kind: stage, source: acca_who }
      - { tag: "Exams", title: "Applied Knowledge: 3 exams", text: "Business and Technology, Financial Accounting, Management Accounting.", kind: gate, source: acca_structure }
      - { tag: "Exams", title: "Applied Skills: 6 exams", text: "Law, Tax, Financial Reporting, Performance Management, Financial Management, Audit.", kind: gate, source: acca_structure }
      - { tag: "Exams", title: "Strategic Professional: 4 exams", text: "2 required + 2 you choose.", kind: gate, source: acca_structure }
      - { tag: "Work", title: "36 months of work experience", text: "And 9 performance objectives, plus the Ethics and Professional Skills module.", kind: stage, source: acca_structure }
      - { tag: "Goal", title: "ACCA member", text: "", kind: license, source: acca_structure }

# Cross-border track (2026-10-19): standalone roadmap uk/roadmaps/<slug>.html; see the note above
# `crossborder` in _data/uk/careers/law.yml.
crossborder:
  - slug: icai-to-uk-accountant
    title: "Indian CA to ICAEW Chartered Accountant (ACA) or ACCA"
    eyebrow: "UK · Cross-border · Accountancy"
    lede: "ICAI members get <strong>12 of the 15</strong> ACA exams credited by ICAEW, and up to <strong>9</strong> ACCA exams can be exempted. Neither one gives UK audit signing rights on its own."
    for: "Members of the Institute of Chartered Accountants of India (ICAI)."
    checked: 2026-10-19
    review_by: 2027-04-19
    routes:
      - id: aca
        title: "ACA (ICAEW): MoU top-up"
        tag: "ICAEW"
        who: "For ICAI members with <strong>less than 5 years</strong> of membership."
        steps:
          - { tag: "Start", title: "ICAI member", text: "Credit for prior learning on 12 of the 15 ICAEW exam modules.", kind: start, source: icaew_icai_aca }
          - { tag: "Exams", title: "3 ICAEW exams", text: "Corporate Reporting, Strategic Business Management and the Case Study.", kind: exam, source: icaew_icai_aca }
          - { tag: "Ethics", title: "Ethics Learning Programme", text: "Online; ICAEW suggests finishing it before the Case Study.", kind: stage, source: icaew_icai_aca }
          - { tag: "Goal", title: "ICAEW Chartered Accountant (ACA)", text: "Membership does not by itself give practising rights.", kind: goal, source: icaew_icai_aca }
        facts:
          - { k: "5+ years an ICAI member?", v: "You can apply through ICAEW's <strong>Pathways to Membership</strong> based on experience instead. It gives no route to the Audit Qualification.", source: icaew_icai_join }
          - { k: "UK audit rights", v: "The ICAI qualification is <strong>not recognised</strong> by the Financial Reporting Council for the UK Audit Qualification: more exams and practical experience are needed.", source: icaew_icai_join }
      - id: acca
        title: "ACCA: exemptions"
        tag: "ACCA"
        who: "Exemptions depend on your exact qualification; ACCA's exemptions calculator gives the answer."
        steps:
          - { tag: "Start", title: "ICAI qualification", text: "Check it in ACCA's exemptions calculator.", kind: start, source: acca_exemptions }
          - { tag: "Exempt", title: "Up to 9 exams exempted", text: "The Applied Knowledge and Applied Skills exams. A fee is due for each exemption you claim.", kind: stage, source: acca_exemptions }
          - { tag: "Exams", title: "Strategic Professional: 4 exams", text: "ACCA gives no exemptions at this level.", kind: exam, source: acca_exemptions }
          - { tag: "Work", title: "36 months of work experience", text: "And 9 performance objectives, plus the Ethics and Professional Skills module.", kind: stage, source: acca_structure }
          - { tag: "Goal", title: "ACCA member", text: "", kind: goal, source: acca_structure }
    watch:
      - { text: "Exemption fees are on ACCA's price list and must be paid within 30 days of the award.", source: acca_exemptions }
