  intro:
    - "Economists analyse markets, policy and data to advise governments, central banks and companies. The Indian Economic Service (IES), recruited by UPSC through the combined IES/ISS examination, places economists in ministries to support policy-making. Other routes include the Reserve Bank of India, research institutes and private-sector economist roles — almost all of which expect a master's in economics."
