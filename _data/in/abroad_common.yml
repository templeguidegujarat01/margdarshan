        parts:
          - points:
              - { t: "There are five levels, N1 to N5. N4 and N5 test basic classroom Japanese; N1 and N2 test Japanese used across everyday and wider settings; N3 bridges them.", source: jlpt_levels }
              - { t: "The 2026 tests are on Sunday 5 July and Sunday 6 December.", source: jlpt_home }
              - { t: "In India the July and December tests run in cities including New Delhi, Pune, Kolkata, Chennai, Bengaluru, Mumbai and Karur; each city's host institution handles registration.", source: jlpt_sites }
    sources:
      - { id: jlpt_levels, name: "JLPT — N1–N5 summary of linguistic competence", url: "https://www.jlpt.jp/e/about/levelsummary.html", covers: "Levels" }
      - { id: jlpt_home, name: "JLPT — official site", url: "https://www.jlpt.jp/e/", covers: "2026 test dates" }
      - { id: jlpt_sites, name: "JLPT — overseas test site cities and host institutions", url: "https://www.jlpt.jp/e/application/overseas_list.html", covers: "Indian cities, host institutions" }

  dmat:
    short: APS and dMAT
    name: "APS certificate and the dMAT (Germany)"
    by: "APS India and g.a.s.t."
    seo_title: "APS and dMAT for Germany: Who Needs It From 2027"
    description: "APS India checks Indian marksheets for a German student visa. From summer semester 2027, B.Tech, B.Com, BBA and economics graduates also need the €150 dMAT for a master's."
    lede: "Germany asks Indian applicants for an APS certificate, which verifies your Indian documents before the visa. A new aptitude test, the dMAT, is now part of APS for many master's applicants."
    facts:
      - { label: "Who needs APS", value: "Indian-degree applicants for German study (visa document)", source: aps_home }
      - { label: "dMAT needed by", value: "B.Tech/B.Eng, Commerce, Economics, BBA/management graduates (master's)", source: aps_dmat }
      - { label: "dMAT fee", value: "€150, paid to g.a.s.t.", source: aps_dmat }
      - { label: "dMAT dates", value: "16 Jan 2027 and 13 Mar 2027", source: aps_dmat }
    official:
      - { label: "APS India", url: "https://aps-india.de/" }
      - { label: "dMAT requirements", url: "https://aps-india.de/dmat/" }
    sections:
      - id: aps
        nav: APS
        eyebrow: "Step zero for Germany"
        heading: "What APS India does"
        parts:
          - points:
              - { t: "APS India verifies academic documents from Indian institutions; the certificate is part of the German student-visa file.", source: aps_home }
              - { t: "The steps: check your procedure on the APS site, read the checklist, gather documents and translations, register online, pay the fee online, then courier the documents and track the status.", source: aps_home }
              - { t: "The fee is non-refundable whatever the result, and APS gives no fixed processing time — it depends on volume and on how fast your board or university replies.", source: aps_faq }
              - { t: "A three-year diploma after Class X alone is generally not enough, because 12 years of school are normally required.", source: aps_faq }
              - { t: "Exempt cases include degrees not issued in India, PhD/postdoc moves where the German institution does not ask for APS, and some scholarship holders funded by German or EU public money.", source: aps_faq }
      - id: dmat
        nav: dMAT
        eyebrow: "New from 2027"
        heading: "The dMAT for master's applicants"
        parts:
          - points:
              - { t: "The dMAT is a standardised academic aptitude test for master's applicants, run by g.a.s.t. as an extra part of the APS file.", source: aps_dmat }
              - { t: "It is needed by all B.Tech and B.Eng graduates, and by undergraduates in Commerce, Accounting, Finance, Economics, Business Administration or Management (including B.Sc/B.A/B.Com variants whose core is in these fields).", source: aps_dmat }
              - { t: "It applies to APS applications for intakes from summer semester 2027 onwards; people who completed APS online registration before 29 June 2026 are exempt.", source: aps_dmat }
              - { t: "The fee is €150. The 2027 test dates are 16 January and 13 March. You may send APS documents early; the final certificate comes after the dMAT score is verified.", source: aps_dmat }
    sources:
      - { id: aps_home, name: "APS India — home and process", url: "https://aps-india.de/", covers: "What APS does, steps", checked: 2026-10-29 }
      - { id: aps_dmat, name: "APS India — dMAT", url: "https://aps-india.de/dmat/", covers: "Fields, fee, dates, exemption", checked: 2026-10-29 }
      - { id: aps_faq, name: "APS India — FAQs", url: "https://aps-india.de/faqs/", covers: "Fees non-refundable, exemptions", checked: 2026-10-29 }

# ---------------------------------------------------------------------------------------------
# India-side guides (study-abroad/<slug>.html): what every student sorts out in India, whatever the country.
guides:
  money:
    short: "Money and loans"
    title: "Paying for Study Abroad from India: TCS, Loans and Tax"
    seo_title: "Study Abroad Money from India: TCS, Loans and 80E"
    description: "TCS on fees sent abroad (nil on a bank loan, 2% above ₹10 lakh from savings), education-loan interest deduction, PM-Vidyalaxmi limits and the National Overseas Scholarship."
    eyebrow: "India side · Money"
    lede: "Before any visa, the money has to leave India legally and in a way the visa office will accept. These are the Indian rules that apply whichever country you choose."
    facts:
      - { label: "TCS, loan-funded fees", value: "Nil, on remittances from an education loan", source: bs_tcs }
      - { label: "TCS, own money", value: "2% above ₹10 lakh a year (Budget 2026-27)", source: budget_speech }
      - { label: "Loan interest deduction", value: "Up to 8 years (Section 80E)", source: it_80e }
      - { label: "PM-Vidyalaxmi", value: "India institutions only, not foreign study", source: pib_vidyalaxmi }
    sections:
      - id: tcs
        nav: TCS
        eyebrow: "Tax collected at source"
        heading: "TCS when you send fees abroad"
        parts:
          - points:
              - { t: "Budget 2026-27 cut TCS on Liberalised Remittance Scheme (LRS) payments for education and medical treatment from 5% to 2%. It applies to the amount above ₹10 lakh in a year.", source: budget_speech }
              - { t: "From Budget 2025-26, money sent for education out of a loan from a specified financial institution has no TCS.", source: bs_tcs }
              - { t: "TCS is not an extra tax: it is credited against your (or your parent's) income tax and can be claimed back in the return.", source: it_tcs }
          - note: "Your bank's forex desk applies these rules when it sends the money. Keep the remittance advice: visa offices often want proof that fees were paid."
            source: budget_speech
      - id: loans
        nav: Loans
        eyebrow: "Education loans"
        heading: "Loans and the interest deduction"
        parts:
          - points:
              - { t: "Section 80E lets the person who repays an education loan deduct the interest for the first year of repayment and up to seven years after, or until the interest is paid, whichever is earlier.", source: it_80e }
              - { t: "The PM-Vidyalaxmi interest-subvention scheme covers loans for admission to designated Quality Higher Educational Institutions in India. Foreign institutions, Indian campuses of foreign universities and foreign campuses of Indian institutions are not covered.", source: pib_vidyalaxmi }
              - { t: "Most visa offices want the loan disbursed or sanctioned in writing. Australia, for example, says the best evidence for a loan is proof of disbursement.", source: au_500 }
      - id: govt
        nav: "Govt scholarship"
        eyebrow: "Government of India"
        heading: "National Overseas Scholarship (SC and others)"
        parts:
          - points:
              - { t: "The Ministry of Social Justice scheme gives up to 125 new awards a year for master's and PhD study abroad, with a cap of 10% per state.", source: nos_2026 }
              - { t: "Family income must not exceed ₹8 lakh a year; the applicant must be 35 or younger on 1 April of the selection year and have at least 60% in the qualifying exam.", source: nos_2026 }
              - { t: "Support runs for up to 3 years for a master's and up to 4 years for a PhD.", source: nos_2026 }
              - { t: "The Ministry of Tribal Affairs runs a separate National Overseas Scholarship for ST students (20 awards a year).", source: nos_st }
    sources:
      - { id: budget_speech, name: "Union Budget 2026-27 — Budget speech", url: "https://www.indiabudget.gov.in/doc/budget_speech.pdf", covers: "TCS on education 5% → 2%", checked: 2026-10-29 }
      - { id: bs_tcs, name: "Business Standard — Budget 2025: no TCS on education loan remittances", url: "https://www.business-standard.com/budget/news/tcs-on-foreign-remittances-up-to-rs-10-lakh-none-on-foreign-education-loan-125020100857_1.html", covers: "Nil TCS on loan-funded fees, ₹10 lakh threshold" }
      - { id: it_tcs, name: "Income Tax Department — Deductions and TCS credit", url: "https://www.incometaxindia.gov.in/w/deductions-allowable-to-tax-payer", covers: "TCS credited against tax" }
      - { id: it_80e, name: "Income Tax Department — Section 80E", url: "https://www.incometaxindia.gov.in/w/section-80e-18", covers: "8-year interest deduction" }
      - { id: pib_vidyalaxmi, name: "PIB — PM Vidyalaxmi Scheme (29 Jul 2026)", url: "https://static.pib.gov.in/WriteReadData/specificdocs/documents/2026/jul/doc2026729937501.pdf", covers: "Foreign institutions not covered" }
      - { id: nos_2026, name: "Ministry of Social Justice — National Overseas Scholarship for SC etc. candidates", url: "https://socialjustice.gov.in/writereaddata/UploadFile/68641776927848.pdf", covers: "125 awards, ₹8 lakh, age 35, 60%" }
      - { id: nos_st, name: "Ministry of Tribal Affairs — Scholarships", url: "https://tribal.nic.in/Scholarship.aspx", covers: "NOS for ST students" }
      - { id: au_500, name: "Home Affairs (Australia) — Student visa (subclass 500)", url: "https://immi.homeaffairs.gov.au/visas/getting-a-visa/visa-listing/student-500", covers: "Loan disbursement evidence", checked: 2026-10-29 }

  documents:
    short: "Documents and safety"
    title: "Documents, Apostille and Safety for Indian Students Abroad"
    seo_title: "Study Abroad Documents: Apostille, Attestation and Safety"
    description: "MEA apostille (₹50 a sticker) for marksheets and degrees, attestation for non-Hague countries, embassy warnings about agents and fees, and keeping your passport safe."
    eyebrow: "India side · Papers"
    lede: "Visa offices and foreign universities trust Indian papers only after they are verified. Here is how the Ministry of External Affairs (MEA) does that, and what Indian missions warn students about."
    facts:
      - { label: "MEA apostille fee", value: "₹50 per apostille sticker", source: mea_apostille }
      - { label: "Normal attestation", value: "Free at MEA", source: mea_apostille }
      - { label: "Education papers", value: "Board certificates and degrees must be apostilled in India", source: mea_apostille }
      - { label: "Germany", value: "APS certificate checks Indian papers first", source: aps_home }
    sections:
      - id: apostille
        nav: Apostille
        eyebrow: "Making papers valid abroad"
        heading: "Apostille and attestation"
        parts:
          - points:
              - { t: "MEA charges ₹50 per apostille sticker; normal attestation is free. Outsourced collection agencies charge their own service fee.", source: mea_apostille }
              - { t: "Documents must first be authenticated by the state or university that issued them. Some states are integrated with e-Sanad for online pre-authentication.", source: mea_apostille }
              - { t: "An apostille is accepted in all member countries of the Hague Apostille Convention without further attestation by their missions.", source: mea_apostille }
          - note: "An apostille works only in countries that are members of the Convention (MEA points to the HCCH status table). For a country that is not a member, papers go through attestation instead: MEA first, then that country's own mission. Ask the university which one it wants."
            source: mea_apostille
      - id: agents
        nav: Agents
        eyebrow: "What Indian missions warn about"
        heading: "Agents, contractors and fees"
        parts:
          - points:
              - { t: "The MEA advisory for Russia warns that many universities recruit through 'contractors' with sub-agents in India who earn commissions and may give false information, for example about English-medium teaching. Ask the university directly.", source: mea_russia }
              - { t: "The same advisory tells students to pay fees directly to the university after the first semester and to insist on a proper receipt; there were complaints of contractors collecting money and not depositing it.", source: mea_russia }
              - { t: "Do not hand your passport or original certificates to contractors or anyone else for 'safe custody'.", source: mea_russia }
              - { t: "The Embassy of Japan says it will never ask for payment by phone or e-mail to verify documents or speed up a visa; you pay only the visa fee and the listed service charge.", source: jp_visa }
              - { t: "Japan's MEXT scholarship has no application fee; anyone charging a fee or deposit for it has no link with the Japanese government.", source: jp_mext }
              - { t: "In July 2026 the French Embassy in India reported that a private school, Collège de Paris International, was put into liquidation by a court order of 2 June 2026, and opened a form for affected students. Check a private institution's standing before paying.", source: fr_college }
      - id: safety
        nav: Safety
        eyebrow: "Once you land"
        heading: "Register with the Indian embassy"
        parts:
          - points:
              - { t: "The Embassy of India in Kyiv runs a student registration module and an online registration for Indian nationals; most missions offer the same.", source: ua_embassy }
              - { t: "The India Centre for Migration's Student Handbook for Studying Abroad (MEA) covers choosing an institution, paperwork, housing, travel and safety.", source: icm_handbook }
    sources:
      - { id: mea_apostille, name: "MEA — Attestation / Apostille", url: "https://www.mea.gov.in/apostille-menu", covers: "₹50 sticker, process, e-Sanad", checked: 2026-10-29 }
      - { id: mea_russia, name: "MEA — Advisory for Indian students going abroad: Russian Federation", url: "https://www.mea.gov.in/images/pdf/advisory-russian.pdf", covers: "Contractors, fees, passports" }
      - { id: jp_visa, name: "Embassy of Japan in India — Visa", url: "https://www.in.emb-japan.go.jp/itpr_en/Visa.html", covers: "No payments by phone or e-mail", checked: 2026-10-29 }
      - { id: jp_mext, name: "Embassy of Japan in India — MEXT scholarships", url: "https://www.in.emb-japan.go.jp/Education/japanese_government_scholarships.html", covers: "No application fee", checked: 2026-10-29 }
      - { id: fr_college, name: "Campus France India — Important notice: Collège de Paris", url: "https://www.inde.campusfrance.org/important-notice-college-de-paris", covers: "Liquidation 2 June 2026", checked: 2026-10-29 }
      - { id: ua_embassy, name: "Embassy of India, Kyiv", url: "https://www.eoiukraine.gov.in/", covers: "Student registration module", checked: 2026-10-29 }
      - { id: icm_handbook, name: "India Centre for Migration (MEA) — Student Handbook for Studying Abroad", url: "https://www.eoiukraine.gov.in/pdf/Student%20Handbook.pdf", covers: "Planning, paperwork, safety" }
      - { id: aps_home, name: "APS India", url: "https://aps-india.de/", covers: "Document verification for Germany", checked: 2026-10-29 }

  mbbs-abroad:
    short: "MBBS abroad rules"
    title: "MBBS Abroad: NMC Rules Before You Choose a Country"
    seo_title: "MBBS Abroad Rules: NMC FMGL 2021, FMGE and Internship"
    description: "NMC rules for an Indian licence after MBBS abroad: 54 months, 12-month internship in the same university, English medium, a licence in that country, FMGE and a year's internship in India."
    eyebrow: "India side · Medicine"
    lede: "A foreign medical degree is useful in India only if it meets the National Medical Commission's Foreign Medical Graduate Licentiate (FMGL) Regulations, 2021. Check these before you pick Russia, Ukraine or any other country."
    facts:
      - { label: "Course length", value: "At least 54 months", source: nmc_fmgl }
      - { label: "Internship abroad", value: "At least 12 months, same institution", source: nmc_fmgl }
      - { label: "Medium", value: "English", source: nmc_fmgl }
      - { label: "Back in India", value: "Pass FMGE, then 12 months' internship", source: nmc_fmgl }
    sections:
      - id: fmgl
        nav: "NMC rules"
        eyebrow: "FMGL Regulations 2021"
        heading: "The conditions your degree must meet"
        parts:
          - points:
              - { t: "The course must last at least 54 months, followed by an internship of at least 12 months in the same foreign medical institution.", source: nmc_fmgl }
              - { t: "The whole course and internship must be at the same institution: no part of the training in India or in a third country.", source: nmc_fmgl }
              - { t: "The medium of instruction must be English.", source: nmc_fmgl }
              - { t: "You must be registered in the country that awarded the degree, with a licence equal to what that country gives its own citizens.", source: nmc_fmgl }
              - { t: "The course must be completed within ten years of joining.", source: nmc_fmgl }
              - { t: "After passing the licentiate exam (FMGE today), you do a supervised internship in India for at least 12 months.", source: nmc_fmgl }
              - { t: "These rules cover students whose foreign course began on or after 18 November 2021; earlier students follow the older rules.", source: nmc_fmgl }
          - links:
              - { label: "FMGE: the screening test", url: "fmge.html" }
              - { label: "NEET-UG (needed before you go)", url: "neet-ug.html" }
      - id: internship
        nav: Internship
        eyebrow: "Back in India"
        heading: "Internship seats for foreign medical graduates"
        parts:
          - points:
              - { t: "In a circular of 10 March 2026 the NMC told State Medical Councils to give foreign medical graduates 7.5% of the intern intake of established medical colleges, 100% of internship seats in new medical colleges, and 100% of seats added between 2022-23 and 2025-26 in existing colleges.", source: nmc_crmi }
              - { t: "The NMC said this followed a rise in court cases by foreign medical graduates over denial of internship.", source: nmc_crmi }
      - id: ukraine
        nav: Ukraine
        eyebrow: "Students who had to leave"
        heading: "Ukraine's academic mobility route"
        parts:
          - points:
              - { t: "In September 2022 the NMC accepted Ukraine's academic mobility programme: students could finish remaining semesters at universities in other countries, with the degree awarded by the parent Ukrainian university.", source: nmc_amp_news }
              - { t: "The Government told the Supreme Court that the notice was not a back door into Indian medical colleges.", source: nmc_amp_news }
    sources:
      - { id: nmc_fmgl, name: "NMC — Rules and regulations (FMGL Regulations 2021 and FAQs)", url: "https://nmc.org.in/page/rules-regulations-rules-regulations-nmc", covers: "54 months, internship, English, licence, 10 years" }
      - { id: nmc_crmi, name: "NMC — Circular on CRMI slots for FMGs (10 Mar 2026)", url: "https://nmc.org.in/whats-new/download/955", covers: "7.5% / 100% internship seats", checked: 2026-10-29 }
      - { id: nmc_amp_news, name: "Careers360 — NMC allows Ukraine-returned students to finish abroad", url: "https://news.careers360.com/nmc-allows-indian-students-from-ukrainian-universities-complete-medical-education-in-other-countries", covers: "Academic mobility notice of 6 Sep 2022" }
