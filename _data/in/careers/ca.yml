      - note: "International postings (Middle East, UK, US, Canada, Australia) can pay significantly more than domestic roles for experienced CAs. ICAI campus placement reports have shown average packages in the ₹8–11.5 LPA range in recent cycles, with select offers well above that."
  - id: "jobs"
    hid: "jobs-heading"
    eyebrow: "Where CAs work"
    heading: "Job profiles, recruiters & industries"
    parts:
