    eyebrow: "Overview"
    heading: "What do translators and interpreters do?"
    parts:
      - overview:
          points:
            - "A <strong>translator</strong> converts written text — documents, books, websites, subtitles, legal contracts — from one language into another, working with time to research terminology and refine wording for accuracy and tone."
            - "An <strong>interpreter</strong> converts spoken language in real time, at business meetings, international conferences, courtrooms or diplomatic events, requiring split-second decision-making and strong short-term memory alongside language skill."
            - "Both roles need far more than casual fluency — they demand certified, professional-level command of at least one language beyond your native tongue(s), deep cultural understanding, and often, subject-matter familiarity (legal, medical or technical vocabulary, for instance) to translate accurately in specialised fields."
