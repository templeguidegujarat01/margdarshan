            text: "Three detailed case studies (problem → research → iteration → outcome) are reported to beat five years of experience without a documented portfolio."
          - label: "Minimum bar is genuinely low"
            text: "\"Any degree + a design portfolio\" is enough at most companies — a design degree from NID/Srishti helps most specifically for campus placements, not every hiring path."
          - label: "Company type changes the bar significantly"
            text: "At product companies, UX and Product Designers are strategic contributors earning meaningfully more; at many other companies, the role stays closer to \"make things look good in Figma\" at a lower pay band."
          - label: "Business-impact framing matters"
            text: "Candidates who can say \"redesigned checkout flow, improved conversion by 23%\" instead of just describing visuals are reported to negotiate meaningfully higher offers."
