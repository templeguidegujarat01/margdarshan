# Journey Blueprint — Physical Education Teacher (graduation + B.P.Ed, or a 4-year integrated B.P.Ed → KVS / NVS TGT / PGT). Printed on journey-physical-education-teacher.html.
# Rules, classes and the money items / sources several careers share: _data/in/journey_common.yml.
# `sources` below are used only by this career. Check: node scripts/check-journey-matrix.mjs
id: physical-education-teacher
v: 2
name: "Physical Education Teacher (B.P.Ed → KVS / NVS PE teacher)"
search: ["physical education teacher", "pe teacher", "pet teacher", "sports teacher", "pti", "b.p.ed", "bped", "m.p.ed", "games teacher"]
page: "journey-physical-education-teacher.html"
doubts_page: "journey-physical-education-teacher.html"
gate: "Play sport at school, district or state level → graduation with 50% and sports participation (or a degree in physical education) → 2-year B.P.Ed from an NCTE-recognised institution (or a 4-year integrated B.P.Ed) → KVS / NVS TGT (Physical Education); M.P.Ed for PGT. CTET is not required for these posts."
gate_source: [ncte-bped, kvs-nvs25]
core:
  what:
    text: "A physical education teacher teaches games, fitness, health and sport in schools and coaches school teams. NCTE's B.P.Ed norms say the course prepares teachers for physical education in Classes VI–X and for sports activities in Classes XI–XII."
    source: ncte-bped
  day:
    - "Run PE periods, warm-ups, drills and fitness tests."
    - "Coach school teams and take them to inter-school meets."
    - "Teach health and safety, and look after sports equipment and grounds."
  pay:
    - { level: "TGT (Physical Education), KVS / NVS 2025", value: "Pay Level 7 · ₹44,900 – ₹1,42,400", source: kvs-nvs25 }
    - { level: "PGT (Physical Education), NVS 2025", value: "Pay Level 8 · ₹47,600 – ₹1,51,100", source: kvs-nvs25 }
  pay_note: "These are central school pay levels; state and private school pay is not printed here."
  routes:
    - { title: "Graduation + B.P.Ed", text: "B.P.Ed is a 2-year NCTE programme. Entry: a bachelor's degree with 50% and participation in inter-college / inter-zonal / district / school competition, or a degree in physical education with 45%, or other routes listed by NCTE.", source: ncte-bped }
    - { title: "4-year integrated B.P.Ed", text: "KVS and NVS also accept a four-year integrated B.P.Ed (or Bachelor of Physical Education and Sports) from an NCTE-recognised institution with 50%.", source: kvs-nvs25 }
    - { title: "KVS / NVS TGT (Physical Education)", text: "The 2025 notice had 144 TGT (Physical & Health Edn.) posts in KVS and 124 male + 128 female TGT (Physical Education) posts in NVS.", source: kvs-nvs25 }
    - { title: "M.P.Ed → PGT", text: "NVS PGT (Physical Education) needs a Master of Physical Education (M.P.Ed) from an NCTE-recognised institution with 50%; the 2025 notice had 63 posts.", source: kvs-nvs25 }
  cost_time:
    - { label: "B.P.Ed", value: "2 academic years (finish within 3)", source: ncte-bped }
    - { label: "KVS / NVS exam fee (2025)", value: "₹1,200 + ₹500 processing (TGT)", source: kvs-nvs25 }
  cost_note: "B.P.Ed fees are set by each affiliating university or state; NCTE bans donations and capitation fees, so no amount is printed."
  challenges:
    - text: "Entry to B.P.Ed is by written test, sports proficiency test and physical fitness test, so you must stay fit and keep sports certificates."
      source: ncte-bped
    - text: "KVS / NVS selection has two written tiers plus an interview, merit 85 : 15."
      source: kvs-nvs25
    - text: "TGT age limit is 35 and PGT 40 (2025 notice)."
      source: kvs-nvs25
  not_for:
    - "You dislike outdoor work in heat and rain."
    - "You never play any sport — B.P.Ed admission tests sports skill and fitness."
    - "You want a desk job — the day is on your feet."
journey:
  - stages: [c8, c9]
    title: "Play, compete, keep certificates"
    do:
      - text: "NCTE's B.P.Ed eligibility counts participation in school, district, inter-zonal or inter-college competitions recognised by AIU / IOA / SGFI / Government of India."
        source: ncte-bped
    doubts:
      - q: "What does a physical education teacher do?"
        a: "Teaches physical education in Classes VI–X and runs sports activities for Classes XI–XII, as NCTE describes the B.P.Ed programme."
        next: "Read the Routes list above."
        source: ncte-bped
      - q: "Do school sports certificates really matter?"
        a: "Yes. One B.P.Ed entry route needs a bachelor's degree with 50% plus participation in school, district, inter-zonal or inter-college competitions recognised by AIU / IOA / SGFI / Government of India; wins and national-level participation open other routes."
        next: "Keep every participation and merit certificate safely."
        source: ncte-bped
  - stages: [c10]
    title: "Any stream works"
    do:
      - text: "NCTE's B.P.Ed rules ask for a bachelor's degree in any discipline — no Class 11 stream is fixed."
        source: ncte-bped
    stream: "Any stream; Physical Education as a subject helps."
    doubts:
      - q: "Which stream should I take for B.P.Ed?"
        a: "Any. NCTE asks for a bachelor's degree in any discipline (with 50% and sports participation), or a degree with physical education as a subject (45%)."
        next: "Pick a stream you can score well in and keep playing."
        source: ncte-bped
      - q: "Are there separate PE teacher posts for women?"
        a: "Yes. NVS advertises TGT (Physical Education) separately for men and women — 124 male and 128 female posts in the 2025 notice — and PGT (Physical Education) is listed for male / female."
        next: "Apply under the post that matches you."
        source: kvs-nvs25
  - stages: [c11, c12]
    title: "Choose your degree route"
    do:
      - text: "Two roads: a 4-year integrated B.P.Ed / B.P.E.S. after Class 12, or any graduation followed by the 2-year B.P.Ed."
        source: [kvs-nvs25, ncte-bped]
    doubts:
      - q: "Can I do B.P.Ed straight after Class 12?"
        a: "The 2-year B.P.Ed needs a bachelor's degree first. After Class 12 you can join a four-year integrated B.P.Ed or a Bachelor of Physical Education and Sports, which KVS and NVS accept with 50%."
        next: "Look for NCTE-recognised integrated courses."
        source: [ncte-bped, kvs-nvs25]
      - q: "Is B.P.Ed the same as B.P.E.S.?"
        a: "No. B.P.Ed is NCTE's 2-year teacher programme after graduation; B.P.E.S. (Bachelor of Physical Education and Sports) is a degree. KVS accepts a B.P.E.S. from an NCTE-recognised institution with 50%, or graduation plus B.P.Ed with 50% in each."
        next: "Check NCTE recognition before you join."
        source: [ncte-bped, kvs-nvs25]
  - stages: [ug]
    title: "Degree, then B.P.Ed"
    do:
      - text: "B.P.Ed admission is on merit from a written test, sports proficiency test, physical fitness test and qualifying-exam marks, or another process set by the university or state."
        source: ncte-bped
      - text: "B.P.Ed lasts 2 academic years; you must finish within 3 years of admission."
        source: ncte-bped
    doubts:
      - q: "What percentage do I need for B.P.Ed?"
        a: "50% in any bachelor's degree with sports participation, or 45% with a degree in physical education, physical education as a subject, or national / inter-university participation. International participation or a national medal needs only a bachelor's degree. Reservation relaxations follow central or state rules."
        next: "Match your marks to one of these routes."
        source: ncte-bped
      - q: "How is B.P.Ed admission decided?"
        a: "On merit — written test, sports proficiency test, physical fitness test and qualifying-exam marks — or any other process set by the university or state."
        next: "Train for the fitness test, not just the written paper."
        source: ncte-bped
      - q: "How many seats does a B.P.Ed college have?"
        a: "NCTE's basic unit is 100 students in two sections of 50."
        next: "Check the college's NCTE recognition and intake."
        source: ncte-bped
  - stages: [grad]
    title: "KVS / NVS PE teacher posts"
    do:
      - text: "KVS / NVS TGT (Physical Education) needs B.P.Ed (or integrated B.P.Ed) with 50%; Hindi and English working knowledge is desirable."
        source: kvs-nvs25
    exams:
      - { name: "KVS & NVS Recruitment 01/2025", when: "Notification 13 Nov 2025 · two tiers + interview", source: kvs-nvs25 }
    money: [kvs-fee]
    doubts:
      - q: "Do I need CTET to become a PE teacher in KVS or NVS?"
        a: "No. The 2025 notice asks for a valid CTET for PRTs and TGTs except Music, Art, Work Experience, Librarian and Physical Education posts."
        next: "Focus on B.P.Ed marks and the KVS / NVS tiers."
        source: kvs-nvs25
      - q: "How many PE teacher posts did KVS and NVS advertise?"
        a: "In Notification 01/2025: 144 TGT (Physical & Health Edn.) in KVS, 124 male and 128 female TGT (Physical Education) in NVS, and 63 PGT (Physical Education) in NVS."
        next: "Watch cbse.gov.in for the next KVS–NVS notice."
        source: kvs-nvs25
      - q: "What is the age limit for KVS / NVS PE teachers?"
        a: "Up to 35 for TGT and up to 40 for PGT in the 2025 notice, with the usual relaxations."
        next: "Plan your B.P.Ed so you apply in time."
        source: kvs-nvs25
      - q: "What helps beyond the minimum qualification?"
        a: "KVS and NVS list as desirable: representing at least your state at national level in a SAI-recognised sport, a Diploma from the National Institute of Sports, working knowledge of Hindi and English, and school experience."
        next: "Keep competing during college."
        source: kvs-nvs25
  - stages: [work]
    title: "Grow to PGT"
    do:
      - text: "An M.P.Ed with 50% from an NCTE-recognised institution opens NVS PGT (Physical Education), Pay Level 8."
        source: kvs-nvs25
    doubts:
      - q: "How do I move from TGT to PGT in physical education?"
        a: "Complete an M.P.Ed with 50% from an NCTE-recognised institution; NVS PGT (Physical Education) is Pay Level 8 (₹47,600 – ₹1,51,100) with an age limit of 40 in the 2025 notice."
        next: "Do M.P.Ed while teaching if your employer allows it."
        source: kvs-nvs25
      - q: "Is there an exam fee waiver for KVS / NVS?"
        a: "SC, ST, PwBD and ex-servicemen pay only the ₹500 processing fee, not the ₹1,200 exam fee (2025 notice)."
        next: "Pick the right category in the online form."
        source: kvs-nvs25
board_note: "Any board and stream. Keep your school sports certificates — they count for B.P.Ed entry."
board_source: ncte-bped
