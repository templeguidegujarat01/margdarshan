      - overview:
          points:
            - "Diploma in Electronics & Communication Engineering is a 3-year polytechnic programme covering analog and digital electronics, signal processing, communication systems (wired and wireless), and microprocessors/embedded systems."
            - "It trains students to work with the circuits and devices behind everything from telecom infrastructure and consumer electronics to increasingly, connected IoT devices."
            - "It's offered at government polytechnics run by each state's technical education board, as well as private AICTE-approved polytechnic institutes, across virtually every state in India."
          more:
            - "It sits at a genuinely useful intersection between traditional electronics hardware and the growing embedded/IoT technology space."
