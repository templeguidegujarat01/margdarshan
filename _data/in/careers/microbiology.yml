  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What is Microbiology?"
    parts:
      - overview:
          points:
            - "Microbiology is the branch of science that studies microscopic living organisms — bacteria, viruses, fungi, algae and other microscopic life forms — that cannot usually be seen with the naked eye."
            - "Microbiologists study how these organisms live, grow, interact with humans, and affect health, agriculture, food production and the environment, contributing to medicines, vaccines, food safety and disease understanding."
            - "What genuinely sets Microbiology apart from the closely related Biotechnology and Genetics fields is the accessibility of its non-research career paths."
          more:
            - "Food and industrial quality control roles — testing products for microbial safety in food, beverage and pharmaceutical manufacturing — are a real, available entry point straight after a BSc, without requiring the heavy postgraduate dependency that Genetics in particular demands."
