  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What does a Web Developer actually do?"
    parts:
      - overview:
          points:
            - "A Web Developer builds websites and web applications that run in a browser — everything from a small business landing page to a full SaaS product."
            - "The field splits into <strong>Frontend</strong> (what users see and interact with), <strong>Backend</strong> (the server, database and application logic behind it) and <strong>Full-Stack</strong> (both together)."
            - "What makes this field genuinely distinctive is how it's hired for: unlike many software roles, employers here often prioritise a visible, shippable portfolio — live URLs, deployed projects, GitHub activity — over formal credentials or heavy algorithmic interviewing."
          more:
            - "It's also one of the few tech careers with a real, well-established freelance market running alongside traditional employment."
