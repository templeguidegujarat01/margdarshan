    lede: "Education Margdarshan's athletics map for India: every running, jumping and throwing event in simple words, the weight of the javelin, shot, discus and hammer at each age, how a throw or jump is judged, the World Championship standards, World Athletics age groups, the false-start rule and the 2026 shoe regulations, AFI's age-group Nationals and the meets you must run to qualify, whereabouts and age checks, the SAI centres where India's athletes train, who pays, and the awards and jobs after a medal."
    official:
      - { label: "World Athletics Shoe Regulations 2026 (PDF)", url: "https://worldathletics.org/download/download?filename=6bd4910c-4e10-4ac0-8b37-f75f5b5c601f.pdf&urlslug=C2.1A+%E2%80%93+Athletic+Shoe+Regulations+%28effective+from+01+January+2026%29" }
      - { label: "indianathletics.in", url: "https://indianathletics.in/" }
    facts:
      - { label: "Youth categories", value: "<strong>U18</strong> = 16–17 · <strong>U20</strong> = 18–19 on 31 Dec", source: wa-rules }
      - { label: "False start", value: "<strong>Disqualified</strong> at once (except combined events)", source: wa-rules }
      - { label: "Javelin weight (senior)", value: "<strong>800 g</strong> men · <strong>600 g</strong> women", source: wa-tech }
      - { label: "Asian Games 2026 squad", value: "<strong>77 athletes</strong> — 34 men, 43 women", source: afi-ag26 }
    sections:
      - id: rules
        nav: "Events &amp; rules"
        eyebrow: "Core rules &amp; selection formats"
        heading: "Every event, the throwing weights, age groups and India's Nationals"
        parts:
          - table:
              caption: "Every senior athletics event in simple words"
              head: ["Group", "Events", "What you do"]
              rows:
                - ["<strong>Sprints</strong>", "100m · 200m · 400m", "Run flat out. In every race up to 400m each runner has <strong>their own lane, 1.22 m wide</strong>, from start to finish."]
                - ["<strong>Middle distance</strong>", "800m · 1500m", "Speed plus stamina; tactics matter because runners share the track."]
                - ["<strong>Long distance &amp; road</strong>", "5000m · 10,000m · marathon", "Stamina races on the track or the road."]
                - ["<strong>Hurdles</strong>", "100m hurdles (women) · 110m hurdles (men) · 400m hurdles", "Sprint and clear 10 hurdles in your lane."]
                - ["<strong>Steeplechase</strong>", "3000m steeplechase", "Long race over heavy barriers and a water jump."]
                - ["<strong>Relays</strong>", "4x100m · 4x400m · mixed 4x100m · mixed 4x400m", "Four runners pass a baton inside a marked zone."]
                - ["<strong>Jumps</strong>", "High jump · pole vault · long jump · triple jump", "Jump over a bar (high jump, pole vault with a pole) or as far as you can from a take-off board (long jump; triple jump = hop, step and jump)."]
                - ["<strong>Throws</strong>", "Shot put · discus · hammer · javelin", "Throw a heavy ball (shot), a plate (discus), a ball on a wire (hammer) or a spear (javelin) as far as you can inside the sector."]
                - ["<strong>Combined events</strong>", "Decathlon (men, 10 events) · heptathlon (women, 7 events)", "Points from every event are added up. Decathlon day 1: 100m, long jump, shot put, high jump, 400m; day 2: 110m hurdles, discus, pole vault, javelin, 1500m. Heptathlon day 1: 100m hurdles, high jump, shot put, 200m; day 2: long jump, javelin, 800m."]
                - ["<strong>Race walking</strong>", "Half marathon race walk · marathon race walk", "Walk fast with no loss of contact with the ground that the eye can see, and the front leg straight from landing until it is upright. Judges watch by eye."]
            source: "wa-bj27,wa-tech"
          - table:
              caption: "Throwing implements by age — the weight you must throw"
              head: ["Implement", "Women U18", "Women U20 &amp; senior", "Men U18", "Men U20", "Men senior"]
              rows:
                - ["<strong>Shot</strong>", "3 kg", "4 kg", "5 kg", "6 kg", "<strong>7.26 kg</strong>"]
                - ["<strong>Discus</strong>", "1 kg", "1 kg", "1.5 kg", "1.75 kg", "<strong>2 kg</strong>"]
                - ["<strong>Hammer</strong>", "3 kg", "4 kg", "5 kg", "6 kg", "<strong>7.26 kg</strong>"]
                - ["<strong>Javelin</strong>", "500 g", "600 g", "700 g", "800 g", "<strong>800 g</strong>"]
            source: wa-tech
          - note: "Only <strong>World Athletics certified</strong> implements may be used in World Rankings competitions, and the organisers provide them; you may bring at most two of your own, and only if they are certified and checked before the event. At AFI's Junior Nationals, <strong>Under-14s throw a kids' javelin from a 5 m runway</strong>, and Under-16 combined events use a standing shot put."
            source: "wa-tech,afi-jr26"
          - list:
              - "<strong>Trials</strong>: in the throws, long jump and triple jump, if more than 8 athletes take part each gets <strong>3 trials</strong>, and the best 8 get <strong>3 more</strong>. With 8 or fewer, everyone gets 6."
              - "You have <strong>1 minute</strong> for each trial once your name is called (more time near the end of high jump and pole vault). Run out of time and it is a failure."
              - "<strong>Javelin</strong>: hold it at the cord grip with one hand and throw <strong>over the shoulder</strong> — no slinging. The <strong>metal head must land first</strong>, inside the 28.96° sector. Do not turn your back to the arc before the throw, and do not touch the runway lines or the ground beyond the arc."
              - "<strong>Shot, discus and hammer</strong>: you throw from a circle. It is a foul if you touch the top of the rim (or, in shot put, the top of the stop board) or the ground outside, or if you leave the circle <strong>before the implement lands</strong> or leave from the front half. The landing sector is 34.92°."
              - "<strong>Long and triple jump</strong>: a foul if your take-off foot crosses the take-off line, or you take off from outside the board's ends."
              - "<strong>High jump and pole vault</strong>: high jumpers take off from <strong>one foot</strong>. <strong>Three failures in a row</strong>, at any heights, and you are out. You may pass a height."
            source: wa-tech
          - table:
              caption: "World Athletics age categories"
              head: ["Category", "Who", "Counted on"]
              rows:
                - ["<strong>Under-18 (U18)</strong>", "Aged 16 or 17", "31 December of the competition year"]
                - ["<strong>Under-20 (U20)</strong>", "Aged 18 or 19", "31 December of the competition year"]
                - ["Masters", "From the 35th birthday", "The birthday itself"]
            source: wa-rules
          - p: "Each competition's own regulations decide which age groups apply and the minimum age to enter."
            source: wa-rules
          - list:
              - "<strong>False start</strong>: except in combined events, the athlete responsible is <strong>disqualified</strong> and shown a red-and-black card. In combined events the first false start brings a warning and a second one disqualification."
            source: wa-rules
          - table:
              caption: "AFI national championships, October 2026"
              head: ["Championship", "Dates", "Venue", "Who"]
              rows:
                - ["65th National Open Athletics Championships", "8–11 Oct 2026", "Jawaharlal Nehru Stadium, New Delhi", "Senior"]
                - ["6th Indian Open U23 Athletics Competition", "From 16 Oct 2026", "Jaipur", "Under 23"]
                - ["41st National Junior Athletics Championships", "23–27 Oct 2026", "Jawaharlal Nehru Stadium, Chennai", "<strong>U14 · U16 · U18 · U20</strong> — 98 finals"]
            source: "afi-open26,afi-home,afi-jr26"
          - p: "At the Junior Nationals the combined events step up with age: <strong>Triathlon</strong> (U14), <strong>Pentathlon</strong> (U16), <strong>Heptathlon</strong> (U18 men and women, U20 women) and <strong>Decathlon</strong> (U20 men)."
            source: afi-jr26
      - id: recognition
        nav: "Recognition"
        eyebrow: "Institutional &amp; global recognition"
        heading: "Olympics, World Championships, Asian Games — and the cash that follows"
        parts:
          - table:
              caption: "World Championships Beijing 2027 — entry standards (senior)"
              head: ["Event", "Men", "Women"]
              rows:
                - ["100m", "9.95", "10.96"]
                - ["200m", "20.07", "22.45"]
                - ["400m", "44.45", "50.00"]
                - ["800m", "1:43.00", "1:57.50"]
                - ["1500m", "3:30.00", "3:58.00"]
                - ["5000m", "12:50.00", "14:36.00"]
                - ["10,000m", "26:48.00", "30:40.00"]
                - ["Marathon", "2:06:00", "2:23:20"]
                - ["3000m steeplechase", "8:08.00", "9:06.50"]
                - ["110m / 100m hurdles", "13.18", "12.60"]
                - ["400m hurdles", "48.00", "54.00"]
                - ["High jump", "2.30 m", "1.96 m"]
                - ["Pole vault", "5.90 m", "4.75 m"]
                - ["Long jump", "8.25 m", "6.86 m"]
                - ["Triple jump", "17.35 m", "14.40 m"]
                - ["Shot put", "21.50 m", "19.30 m"]
                - ["Discus", "67.20 m", "64.50 m"]
                - ["Hammer", "78.30 m", "74.00 m"]
                - ["<strong>Javelin</strong>", "<strong>85.50 m</strong>", "<strong>63.40 m</strong>"]
                - ["Decathlon / heptathlon", "8620 points", "6550 points"]
                - ["Half marathon race walk", "1:23:00", "1:33:10"]
                - ["Marathon race walk", "3:01:00", "3:28:00"]
            source: wa-bj27
          - note: "These are the marks for the <strong>2027 World Championships in Beijing</strong>, the main step before LA28. About 40% of athletes get in by hitting a standard and about 60% by <strong>world ranking</strong>. For most events the marks count from <strong>23 August 2026 to 22 August 2027</strong>, and only at category C meets or higher. Area (Asian) champions also qualify if no one else from Asia is entered in that event."
            source: wa-bj27
          - p: "AFI named a <strong>77-member squad</strong> (34 men, 43 women) for the <strong>Asian Games 2026</strong> in Aichi-Nagoya, including Avinash Sable (3000m steeplechase), Gulveer Singh (1500m/5000m/10000m), Annu Rani (javelin) and Jyothi Yarraji (100m hurdles)."
            source: afi-ag26
          - table:
              caption: "Government cash award for a senior athletics medal (₹ lakh)"
              head: ["Event", "Gold", "Silver", "Bronze"]
              rows:
                - ["<strong>Olympic Games</strong>", "75", "50", "30"]
                - ["Asian Games / Commonwealth Games", "30", "20", "10"]
                - ["World Athletics Championships (every 2 years)", "20", "14", "8"]
                - ["Asian Athletics Championships (every 2 years)", "7.5", "5", "2.5"]
            source: myas-cash
          - note: "Relays are team events: each member gets 75% of the individual amount. The coach also gets a share of the award."
            source: myas-cash
      - id: eligibility
        nav: "Shoes, ages &amp; testing"
        eyebrow: "Physical benchmarks &amp; anti-doping"
        heading: "Shoe limits, age checks and whereabouts"
        parts:
          - table:
              caption: "Maximum sole thickness — World Athletics shoe regulations (from 20 April 2026)"
              head: ["Events", "Maximum sole"]
              rows:
                - ["<strong>Track events</strong> (not race walks), <strong>jumps</strong> and <strong>javelin</strong>", "<strong>20 mm</strong>, spike or non-spike shoe; in jumps the forefoot sole may not be higher than the heel"]
                - ["Road running and race walks (road and track)", "<strong>40 mm</strong>"]
                - ["Shot put, discus, hammer, cross-country, mountain and trail", "The sole rules do not apply, and the shoe need not be on the approved list"]
            source: wa-shoes
          - list:
              - "Every other shoe must be on World Athletics' <strong>approved list</strong>. A <strong>development shoe</strong> (a prototype not on sale) is allowed for at most 12 months and <strong>never at the Olympic Games</strong> or World Athletics Series events."
              - "Spikes may be at most <strong>9 mm</strong> long on most tracks (<strong>12 mm</strong> in high jump and javelin)."
            source: wa-shoes
          - list:
              - "SAI runs an <strong>Age Verification Test</strong> on new NCOE inductees (boys under 17, girls under 15) before they join; an athlete who does not join within <strong>7 days</strong> loses the place."
            source: sai-ath-patiala
          - list:
              - "AFI publishes <strong>overage lists</strong> after age-verification checks at events such as the National Inter-District Junior Athletics Meet (NIDJAM)."
            source: afi-overage
          - list:
              - "Filing your <strong>whereabouts</strong> with NADA, WADA or the Athletics Integrity Unit in ADAMS is <strong>mandatory to compete</strong> in India or abroad; missed tests and late filings lead to filing failures, for which the athlete alone is responsible."
            source: afi-whereabouts
      - id: roadmap
        nav: "Roadmap"
        eyebrow: "Grassroots-to-elite roadmap"
        heading: "From the district meet to the national camp"
        parts:
          - table:
              caption: "The athletics ladder"
              head: ["Step", "Age", "What happens"]
              rows:
                - ["1. District &amp; inter-district", "U14 · U16", "District meets and NIDJAM — with age checks"]
                - ["2. SAI Training Centre", "12–18", "Up to 8th at Sub-Junior/Junior Nationals, or top 3 at state level, can enter after tests"]
                - ["3. Junior Nationals", "U14–U20", "Zonal meets, then the National Junior Championships"]
                - ["4. SAI NCOE", "Scouted athletes", "Inducted by SAI's KITD division after the age test"]
                - ["5. Senior qualification", "Senior", "Qualify at the <strong>Indian Open or Indian Grand Prix</strong> meets for the Federation Senior Nationals"]
                - ["6. National camp &amp; team", "—", "AFI selection for Asian, Commonwealth, World and Olympic events"]
            source: "afi-overage,sai-schemes,afi-home,afi-jr26,sai-ath-patiala,afi-mandatory25"
          - p: "In 2025 AFI made it compulsory to reach the qualification standard <strong>at an Indian Open meet or Indian Grand Prix</strong> in the same year to be accepted for the National Federation Senior Championships — without it, the entry is refused."
            source: afi-mandatory25
      - id: academies
        nav: "Centres"
        eyebrow: "Top training academies &amp; cities"
        heading: "Where India's athletes are trained"
        parts:
          - table:
              caption: "SAI athletics inductions of 17 December 2024"
              head: ["Centre", "City", "Athletes inducted"]
              rows:
                - ["<strong>NSNIS Patiala</strong>", "Patiala, Punjab", "29 (including javelin thrower Neeraj Chopra)"]
                - ["<strong>NCOE Bengaluru</strong> (NSSC)", "Bengaluru, Karnataka", "40"]
                - ["<strong>LNCPE</strong>", "Thiruvananthapuram, Kerala", "26"]
            source: "sai-ath-patiala,sai-ath-blr,sai-ath-tvm"
          - p: "Athletics is also trained at SAI NCOEs in <strong>Bhopal, Lucknow, Sonepat, Hamirpur, Guwahati, Imphal, Kolkata, Dharamshala (girls) and Gandhinagar</strong>."
            source: sai-schemes
      - id: costs
        nav: "Shoes &amp; cost"
        eyebrow: "Equipment costs &amp; who pays"
        heading: "Who pays an athlete at each level"
        parts:
          - table:
              caption: "Who pays — athletics"
              head: ["Stage", "Paid by", "What you get"]
              rows:
                - ["Adopted school (age 8–14)", "SAI National Sports Talent Contest", "Kit, competition exposure and a stipend each year"]
                - ["SAI centre trainee", "SAI", "Coaching, boarding and sports science at an STC or NCOE"]
                - ["Khelo India athlete", "Ministry of Youth Affairs &amp; Sports", "<strong>₹6.28 lakh a year</strong> incl. ₹1.20 lakh cash"]
                - ["Junior medal prospect", "TOPS Development Group", "₹25,000 a month"]
                - ["Olympic prospect", "TOPS Core Group", "<strong>₹50,000 a month</strong> + approved training plan"]
                - ["Athlete in need", "PDU National Welfare Fund", "Up to ₹2.50 lakh"]
            source: "sai-schemes,pib-support"
          - list:
              - "Spikes and racing shoes must be on the <strong>approved list</strong> and within the sole limits above — buy approved models, not just any 'spikes'."
              - "Education Margdarshan does not print shop prices: no governing body publishes them, and models change every season."
            source: wa-shoes
          - list:
              - "<strong>Food first</strong>, with a certified nutritionist; no supplement is 100% safe and <strong>strict liability</strong> applies."
            source: nada-supp
      - id: earnings
        nav: "Earnings &amp; jobs"
        eyebrow: "Earning channels &amp; central job quotas"
        heading: "Awards, pensions, coaching and sports-quota jobs"
        parts:
          - list:
              - "Athletics is one of the <strong>65 sports</strong> in the central sports quota for <strong>Group C</strong> posts, with up to 5 years' age relaxation (10 for SC/ST)."
              - "Medals at the Olympics, Asian Games, Commonwealth Games or World Championships can bring up to <strong>three out-of-turn promotions</strong>."
            source: dopt-2022
          - p: "Retired champions can receive the <strong>Pension to Meritorious Sportspersons</strong> of ₹12,000–20,000 a month."
            source: pib-support
          - p: "Coaching route: AFI runs <strong>Pre Level 1</strong> courses and World Athletics <strong>CECS Level 1–3</strong> coach courses, and publishes the results and certified-coach lists on its website."
            source: afi-home
      - id: traps
        nav: "Red flags"
        eyebrow: "Disqualification traps"
        heading: "Mistakes that cost athletes their season"
        parts:
          - list:
              - "<strong>Skipping the Indian Open / Grand Prix</strong> meets — AFI refuses Senior Nationals entries without a qualifying mark from them."
            source: afi-mandatory25
          - list:
              - "<strong>Not filing whereabouts</strong> — filing failures and missed tests are your responsibility alone."
            source: afi-whereabouts
          - list:
              - "<strong>Racing in an unapproved or over-thick shoe</strong> at a World Rankings competition."
            source: wa-shoes
          - list:
              - "<strong>Age fraud</strong> — overage athletes are listed publicly; SAI weeds out athletes for age fraud and dope abuse."
            source: "afi-overage,sai-schemes"
      - id: doubts
        nav: "Player doubts"
        eyebrow: "Real-world player doubts"
        heading: "Javelin start, late start, jobs, money and certificates — straight answers"
        parts:
          - qa:
              q: "I want to throw javelin like Neeraj Chopra. Where do I start?"
              a: "Start with the right javelin for your age: <strong>700 g</strong> for boys in U18, <strong>800 g</strong> from U20; <strong>500 g</strong> for girls in U18 and <strong>600 g</strong> after that. Under-14s at AFI's Junior Nationals throw a kids' javelin from a 5 m runway. Throw at school, district and state meets; a top-3 state finish or a top-8 Junior Nationals finish can get you into a <strong>SAI Training Centre</strong> (ages 12–18). The senior target is high — <strong>85.50 m</strong> for men and <strong>63.40 m</strong> for women to enter the 2027 World Championships."
            source: "wa-tech,afi-jr26,sai-schemes,wa-bj27"
          - qa:
              q: "I am 18, 20 or 22. Is it too late for athletics?"
              a: "Not for competing: after Under-20 everyone is a senior, and AFI accepts senior entries on marks made at the <strong>Indian Open or Indian Grand Prix</strong> meets. It is late for the free pipelines — SAI Training Centres take ages <strong>12–18</strong> — so a late starter trains at a club or state centre and must post marks to be noticed. The real clock is the job deadline: Railways sports quota stops at <strong>25</strong> and CRPF at <strong>23</strong> (28 for an unreserved sportsperson after relaxation)."
            source: "wa-rules,afi-mandatory25,sai-schemes,rrc-wr26,crpf26"
          - qa:
              q: "Which government jobs can athletics get me?"
              a: "Athletics has more jobs than almost any sport. <strong>CRPF's 2026 sports quota</strong> has <strong>101 of its 521 posts</strong> for athletics — every track, jump and throw event (including javelin), the walks, marathon and cross-country. <strong>Western Railway's 2026-27 notice</strong> had athletics posts at all three levels: Level 5/4 and 3/2 for men's 100m, 200m, 800m, decathlon and shot put, women's 100m to 800m and steeplechase; Level 1 for men's 400m hurdles, high jump and 10,000m and women's 400m hurdles, pole vault and shot put. Central <strong>Group C</strong> posts under DoPT rules also list athletics."
            source: "crpf26,rrc-wr26,dopt-2022"
          - table:
              caption: "Sports-quota job routes open in 2026 — age, qualifying results, pay"
              head: ["Route", "Age", "Main qualifying results", "Pay level"]
              rows:
                - ["Railways <strong>Level 5/4</strong> (graduates)", "18–25 on 1 Jan 2027", "Played the <strong>Olympics</strong>, or top 3 at a World Cup, World Championship, Asian Games, Commonwealth Games or Youth Olympics", "Level 5/4"]
                - ["Railways <strong>Level 3/2</strong> (12th, or 10th + apprenticeship)", "18–25 on 1 Jan 2027", "Top 3 at <strong>Senior, Youth or Junior Nationals</strong>, National Games or All India Inter-University; or Federation Cup gold", "Level 3/2"]
                - ["Railways <strong>Level 1</strong>", "18–25 on 1 Jan 2027", "Played for your state and finished <strong>at least 8th at Senior Nationals</strong>; or top 3 at the Federation Cup", "Level 1"]
                - ["CRPF <strong>Head Constable (GD)</strong> (10+2)", "18–23 on 1 Aug 2026; sportspersons get <strong>+5 years</strong> (OBC +8, SC/ST +10)", "Played for India; or top 3 for your state at Nationals or National Games; or <strong>gold/silver at Junior Nationals</strong>", "Level 4 · ₹25,500–81,100"]
                - ["CRPF <strong>Constable (GD)</strong> (10th pass)", "18–23 on 1 Aug 2026; sportspersons get <strong>+5 years</strong> (OBC +8, SC/ST +10)", "Played for your state at <strong>Senior or Junior Nationals</strong>; or top 3 at SGFI school nationals or Khelo India Games", "Level 3 · ₹21,700–69,100"]
            source: "rrc-wr26,crpf26"
          - note: "Railways count results from <strong>1 April 2024</strong>; CRPF counts the <strong>two years before 30 September 2026</strong>. Railways fee ₹500 (₹400 back if you attend the trial; ₹250, refunded in full on attending, for SC/ST, women, PwBD, minorities, ex-servicemen and EBC). CRPF fee ₹100 for UR/OBC/EWS men; free for women, SC, ST and ex-servicemen. CRPF picks sign a <strong>₹1 lakh bond to serve at least 3 years</strong>."
            source: "rrc-wr26,crpf26"
          - qa:
              q: "We are a lower-middle-class family. How do we keep costs down?"
              a: "Aim for the free seats. SAI Training Centres and NCOEs give <strong>coaching, boarding and sports science</strong>; a Khelo India athlete gets <strong>₹6.28 lakh a year</strong> (₹1.20 lakh cash). At World Rankings meets the <strong>organisers provide the shot, discus, hammer and javelin</strong>, so you do not need your own set to compete. Shot put, discus and hammer shoes are outside the sole rules; for other events buy a shoe from the approved list."
            source: "sai-schemes,pib-support,wa-tech,wa-shoes"
          - qa:
              q: "Does any 'national' certificate count for a job?"
              a: "No. Railways will <strong>not recruit on a certificate from a federation MoYAS did not recognise</strong> at the time of the championship, and CRPF counts only championships of MoYAS-recognised federations or the IOA's National Games. For athletics, Railways treat the <strong>Under-20 Junior National Athletics Championship</strong> as the junior national, and a selected candidate signs a <strong>5-year service bond</strong>."
            source: "rrc-wr26,crpf26"
