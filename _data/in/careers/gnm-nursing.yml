  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Can I become a Registered Nurse with just GNM?"
            a: "Yes. After completing the GNM course (including the compulsory internship) and passing your State Nursing Council's registration exam, you become a Registered Nurse and Registered Midwife (RNRM), legally qualified to practise as a nurse in India."
          - q: "What is the difference between GNM and B.Sc Nursing?"
            a: "GNM is a shorter diploma (around 3.5 years including internship) with a strong practical/bedside focus. B.Sc Nursing is a 4-year degree with deeper theory, research exposure and typically better access to senior, teaching and abroad-migration roles. Both lead to Registered Nurse status; GNM holders can upgrade later via Post Basic B.Sc Nursing."
          - q: "Is GNM only for female students?"
            a: "No, this is an outdated myth. Male nursing students are now accepted at GNM institutes across almost all states, and male nurses work across hospitals, ICUs and community health settings."
          - q: "Can I work abroad after GNM?"
            a: "It's possible but requires extra steps — most countries require passing their own licensing/language exams (such as OET or IELTS, plus destination-country nursing council registration). GNM is a starting qualification for this path, not an automatic passport to an overseas nursing job."
          - q: "What is the government job scope after GNM?"
            a: "Significant. GNM-qualified nurses can apply for Staff Nurse posts in government hospitals, All India Institute of Medical Sciences (AIIMS), railways, ESIC, defence/armed forces nursing services, and various state health department recruitments, most conducted through their own separate entrance/recruitment exams."
      - note: "*Fee and salary figures are indicative, based on publicly available information as of 2026, and vary significantly by state, institute and employer — always verify current figures directly with your target institute and State Nursing Council."
        class: "table-note mt-lg"
