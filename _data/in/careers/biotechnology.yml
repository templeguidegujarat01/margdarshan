    heading: "Higher studies"
    parts:
      - prose:
          - "<strong>MSc Biotechnology</strong> genuinely raises your pay ceiling meaningfully over a BSc alone, in specialisations like Genetic Engineering, Bioinformatics, Biopharmaceuticals or Molecular Diagnostics. A <strong>PhD</strong> is essential for Drug Discovery and R&amp;D roles at top pharma companies, commonly starting above ₹10 lakh per annum (LPA) with research stipends, and <strong>DBT fellowships</strong> support this research track financially. For those who prefer not to pursue a PhD, <strong>Regulatory Affairs certification</strong> or <strong>GCP (Good Clinical Practice) training</strong> for a Clinical Research Associate role are genuine, well-compensated alternate paths."
