# Phase 7 (2026-10-21): veterinary medicine. ICVA writes the NAVLE, the AVMA Council on Education accredits colleges,
# and each state board grants the license (ICVA: the NAVLE is required in all U.S. and Canadian licensing jurisdictions).
veterinary:
  short: "Veterinary"
  name: "State veterinary license (DVM)"
  authority: "State veterinary medical boards"
  authority_lede: "state veterinary medical boards"
  national_bodies:
    - "ICVA (International Council for Veterinary Assessment): administers the North American Veterinary Licensing Examination (NAVLE); issues no licenses"
    - "AVMA Council on Education (COE): accredits colleges of veterinary medicine; publishes the only official list"
    - "AAVSB (American Association of Veterinary State Boards): transfers scores to boards (VIVA) and runs the vet tech exam (VTNE)"
  education: "A Doctor of Veterinary Medicine (DVM or VMD) from a college accredited by the AVMA Council on Education (graduates of other schools qualify through ECFVG or PAVE)"
  exams:
    - name: "North American Veterinary Licensing Examination (NAVLE)"
      by: "ICVA"
      what: "Required for licensure in all U.S. and Canadian licensing jurisdictions. About 7.5 hours, 360 multiple-choice clinical questions; from the October–November 2026 NAVLE, 12 blocks of 30 questions. Taken at Prometric centers in three testing windows a year."
      source: icva_navle_examday
    - name: "NAVLE fees and eligibility"
      by: "ICVA"
      what: "$825 in the U.S., its territories and Canada; $1,220 elsewhere. Open to students and graduates of AVMA COE-accredited colleges (in most U.S. states you must graduate within 10 months of the window) and to ECFVG or PAVE candidates."
      source: icva_navle_apply
    - name: "State exam on veterinary law"
      by: "The state board"
      what: "Most states require a state licensing exam on their laws and regulations in addition to the NAVLE."
      source: ooh_vets
  experience: "None after the DVM; its final year is clinical rotations"
  steps:
    - "Bachelor's degree (usual) with the required science courses"
    - "4-year DVM at an AVMA COE-accredited college"
    - "NAVLE (apply through the ICVA or your state board)"
    - "The state's own exam on veterinary law, where required"
    - "State license; a new license (and often new exams) for each state, because few states accept other states' licenses"
  jurisdiction_note: "Licensing requirements vary by state, but every state requires an accredited veterinary program and a qualifying exam. Few states accept licenses from other states, so veterinarians usually take exams for each state where they want a license."
  not_required_for:
    - "Veterinarians employed by state or federal government may not need a state license, because agencies differ in what they require (BLS)."
  watch:
    - "From the October–November 2026 window the NAVLE is split into twelve 30-question blocks (ICVA)."
    - "The AVMA COE expects at least 80% of each college's graduating seniors who sit the NAVLE to pass by graduation."
  boards:
    - place: "Texas"
      body: "Texas Board of Veterinary Medical Examiners (TBVME)"
      rule: "The online <strong>State Board Examination (SBE)</strong> is required for all license categories: approved applicants get a candidate ID, buy the exam and must finish it in one sitting within 10 days of purchase."
      sources: [tx_tbvme_sbe]
    - place: "California"
      body: "Veterinary Medical Board (VMB)"
      rule: "Three exams: the NAVLE, the <strong>California State Board Examination</strong> and the <strong>Veterinary Law Examination</strong> (open book, 32 questions, within 40 days of applying; not needed for UC Davis or Western University graduates). Fees: $350 application, $100 VLE, $500 license."
      sources: [ca_vmb_vle, ca_vmb_fees]
    - place: "New York"
      body: "NYSED Office of the Professions"
      rule: "At least 21 and of good moral character; a DVM from an AVMA-accredited (or Department-approved) program; the NAVLE (no New York approval needed to take it). Licensure fee $372; a limited permit ($105) lets you work under a New York veterinarian before passing the exam."
      sources: [ny_op_vet]
  sources: [icva_navle, icva_navle_apply, icva_navle_examday, avma_coe, ooh_vets]
