  # ------------------------------------------------------------------ MHT-CET
  - slug: mhtcet
    group: academic
    short: "MHT-CET (Engineering &amp; Pharmacy)"
    body: "State Common Entrance Test Cell, Maharashtra"
    card: "The state CET for B.E./B.Tech, B.Pharm, Pharm.D and B.Planning; its percentile feeds the CET Cell's centralised admission process (CAP)."
    card_facts: ["PCM or PCB", "No negative marking", "Fee ₹1,300 / ₹1,000"]
    eyebrow: "State CET Cell · MHT-CET 2026"
    title: "MHT-CET 2026 — Maharashtra Engineering &amp; Pharmacy Entrance"
    lede: "MHT-CET is conducted by the Maharashtra State Common Entrance Test Cell for first-year B.E./B.Tech, Pharmacy, Pharm.D and B.Planning admissions for 2026-27. Seats are then filled through the CET Cell's Centralised Admission Process (CAP)."
    facts:
      - { label: "Who can sit", value: "Class 12 passed or appearing; no age limit", source: mht-ib }
      - { label: "Paper", value: "CBT · 180 min · no negative marks", source: mht-ib }
      - { label: "Fee (one group)", value: "₹1,300 open · ₹1,000 reserved (MH)", source: mht-ib }
      - { label: "B.E. eligibility", value: "45% in PCM-type subjects (40% reserved)", source: cap-ib }
    official:
      - { label: "MHT-CET 2026 information brochure", url: "https://cetcell.mahacet.org/wp-content/uploads/2023/12/MHT-CET-2026-Information-Brochure-Updated-on-11.04.2026.pdf" }
      - { label: "CAP portals 2026-27", url: "https://cetcell.mahacet.org/cap-_2026-27/" }
    sections:
      - id: overview
        nav: "Overview"
        eyebrow: "Overview &amp; official source"
        heading: "What MHT-CET is for"
        parts:
          - p: "The Commissioner of the State CET Cell, set up under the Maharashtra Unaided Private Professional Educational Institutions (Regulation of Admissions and Fees) Act, 2015, conducts MHT-CET 2026 for first-year B.E./B.Tech, Planning, Pharmacy, M.E./M.Tech (Integrated), Pharm.D and M.Planning (Integrated) admissions in 2026-27. The same admission rules apply to government and aided colleges, including ICT Mumbai."
            source: mht-ib
          - p: "Online registration ran from 10 January to 12 February 2026, with fee payment until 13 February 2026. The test is computer-based at almost all district headquarters of Maharashtra."
            source: mht-ib
      - id: eligibility
        nav: "Eligibility"
        eyebrow: "Eligibility &amp; candidature"
        heading: "Who can appear, and which candidature type you are"
        parts:
          - list:
              - "Any Indian national who has passed or is appearing in HSC / Class 12 or its equivalent may appear. There is no age limit."
              - "MHT-CET is compulsory for Maharashtra State and Minority candidature candidates seeking B.E./B.Tech or B.Pharm/Pharm.D. All India candidates may skip it: JEE (Main) 2026 is preferred for B.E./B.Tech and NEET 2026 for B.Pharm/Pharm.D."
              - "NRI, Gulf-worker children, OCI/PIO and foreign national candidates are exempt from MHT-CET."
            source: mht-ib
          - table:
              caption: "Maharashtra State candidature types (claim only one)"
              head: ["Type", "Who"]
              rows:
                - ["A", "Passed SSC and HSC (or Diploma / D.Voc) from Maharashtra, and is domiciled in and/or born in Maharashtra"]
                - ["B", "Not Type A, but the candidate or father or mother is domiciled in Maharashtra with a domicile certificate"]
                - ["C", "Father or mother is a Government of India / GoI undertaking employee posted in Maharashtra before the CAP form deadline"]
                - ["D", "Father or mother is a serving or retired Maharashtra government / undertaking employee"]
                - ["E", "Studied in or lives in the Maharashtra–Karnataka border area and mother tongue is Marathi"]
            source: mht-ib
          - p: "For first-year B.E./B.Tech, a Maharashtra candidate needs 10+2 with Physics and Mathematics compulsory plus Chemistry or one of the listed vocational / technical subjects, with at least 45% in those subjects taken together (40% for reserved categories, EWS and disabled candidates of Maharashtra), and a non-zero score in all subjects of PCM MHT-CET. PCB candidates with 45% / 40% and a non-zero PCB score are eligible only for nine branches such as Biotechnology, Agricultural, Food and Pharmaceutical Engineering."
            source: cap-ib
          - note: "The 2026 brochure says eligibility follows the previous year's (2025-26) CAP brochure until the 2026-27 CAP rules are notified."
            source: mht-ib
      - id: scheme
        nav: "Exam Scheme"
        eyebrow: "Exam scheme"
        heading: "Paper pattern"
        parts:
          - table:
              head: ["Group", "Questions", "Marking", "Time"]
              rows:
                - ["PCM", "150", "Physics and Chemistry 1 mark each; Mathematics 2 marks each", "180 min: first 90 min Physics + Chemistry, next 90 min Mathematics"]
                - ["PCB", "200", "1 mark each", "180 min: first 90 min Physics + Chemistry, next 90 min Biology"]
            source: mht-ib
          - list:
              - "Multiple choice with four options; there is no negative marking."
              - "Question paper in English, Marathi or Urdu (the choice is final); the English version prevails in case of doubt."
              - "Candidates may take PCM, PCB or both, and may opt for two attempts of a group. With two attempts, the better total percentile counts for admission."
              - "Results are percentile scores calculated shift-wise from raw marks; a percentile is not a percentage."
            source: mht-ib
      - id: fees
        nav: "Fees"
        eyebrow: "Fee structure"
        heading: "Application fee"
        parts:
          - table:
              head: ["Option", "Open / OMS / J&amp;K migrant", "Reserved, EWS, PwD of Maharashtra; orphan; transgender"]
              rows:
                - ["PCM or PCB — first attempt", "₹1,300", "₹1,000"]
                - ["PCM or PCB — both attempts", "₹2,600", "₹2,000"]
            source: mht-ib
          - p: "In CAP, candidates admitted on the basis of MHT-CET do not pay a separate CAP application fee; those applying only on a national-level exam pay a CAP fee."
            source: cap-ib
      - id: reservation
        nav: "Reservation"
        eyebrow: "Reservation &amp; certificates"
        heading: "Seat reservation in CAP (Maharashtra candidates only)"
        parts:
          - table:
              caption: "Vertical reservation of Maharashtra CAP seats (2025-26 CAP brochure)"
              head: ["Category", "Share"]
              rows:
                - ["Scheduled Castes (incl. converts to Buddhism)", "13%"]
                - ["Scheduled Tribes", "7%"]
                - ["VJ / DT — NT(A)", "3%"]
                - ["NT(B)", "2.5%"]
                - ["NT(C)", "3.5%"]
                - ["NT(D)", "2%"]
                - ["OBC", "19%"]
                - ["SEBC (subject to the High Court's decision)", "10%"]
                - ["Total", "60%"]
            source: cap-ib
          - list:
              - "<strong>EWS:</strong> 10% seats, over and above the sanctioned intake."
              - "<strong>Women:</strong> 30% of seats (none under Defence, PwD or Orphan quotas)."
              - "<strong>Defence:</strong> 5% for children of ex- and serving defence personnel (DEF-1/2/3)."
              - "<strong>Persons with Disability:</strong> 5% for at least 40% benchmark disability."
              - "<strong>Orphans:</strong> 1% of CAP seats."
            source: cap-ib
          - note: "To be counted in a category you must upload the caste certificate, caste validity certificate, Non-Creamy Layer certificate and EWS certificate in the state format at the time of the CAP form."
            source: mht-ib
      - id: documents
        nav: "Documents"
        eyebrow: "Document checklist"
        heading: "What CAP asks for"
        parts:
          - list:
              - "All candidates: SSC and HSC mark sheets, CET score card, school leaving certificate if needed, proof of Indian nationality."
              - "Type A: domicile, birth or leaving certificate showing birth in Maharashtra. Type B: domicile certificate of the candidate or parent. Type C/D: employer certificate (Proforma A or B). Type E: border-area and Marathi mother-tongue certificates (Proforma G1, G2)."
              - "SC/ST: caste and caste validity certificates. VJ/NT/OBC/SBC/SEBC: caste, caste validity and a Non-Creamy Layer certificate valid up to 31 March of the admission year."
              - "EWS: eligibility certificate in Proforma V. Orphan: Proforma U. Defence: Proforma C (and D/E)."
              - "Originals are scanned and uploaded (JPG/GIF, 150 dpi, up to 1 MB each); facilitation centres scan them free."
            source: cap-ib
          - list:
              - "For MHT-CET registration itself: Aadhaar authentication and APAAR ID verification through DigiLocker, and a 2 × 2 inch colour photo (100 KB – 5 MB)."
            source: mht-ib
      - id: pay
        nav: "Where It Leads"
        eyebrow: "After admission"
        heading: "What an MHT-CET rank leads to"
        parts:
          - p: "CAP allots seats in B.E./B.Tech, B.Pharm, Pharm.D, B.Planning and the integrated M.E./M.Tech and M.Planning programmes in government, aided, university and unaided colleges across Maharashtra."
            source: mht-ib
          - links:
              - { label: "B.Tech colleges in Maharashtra (verified list)", url: "colleges/maharashtra/btech.html" }
              - { label: "B.Pharm colleges in Maharashtra (verified list)", url: "colleges/maharashtra/bpharm.html" }
      - id: posting
        nav: "Help"
        eyebrow: "Support"
        heading: "Help and grievances"
        parts:
          - list:
              - "Helpdesk email cethelpdesk-2026@maharashtracet.org, toll-free 1800-209-0191, helplines 079-6913-4401 / 4402 (10 am – 6 pm)."
              - "Objections to questions are raised only through the candidate login during the notified window."
              - "Candidates with a disability get 20 minutes per hour of compensatory time when using a scribe; the scribe must be two academic years below the candidate."
            source: mht-ib
    sources:
      - { id: mht-ib, name: "State CET Cell — MHT-CET 2026 Information Brochure (updated 11 Apr 2026)", url: "https://cetcell.mahacet.org/wp-content/uploads/2023/12/MHT-CET-2026-Information-Brochure-Updated-on-11.04.2026.pdf", covers: "dates, candidature types, exam pattern, fees, PwD rules, results, certificates", checked: 2026-10-14 }
      - { id: cap-ib, name: "State CET Cell — CAP Information Brochure for UG & PG Technical Courses 2025-26", url: "https://cetcell.mahacet.org/wp-content/uploads/2023/12/Information_Brochure_UG_PG_2025_26_Final_02_07_2025.pdf", covers: "B.E. eligibility, reservation percentages, CAP fee rule, CAP documents", checked: 2026-10-14 }

  # ------------------------------------------------------------------ MBA CET
  - slug: mba-cet
    group: academic
    short: "MAH-MBA/MMS CET"
    body: "State Common Entrance Test Cell, Maharashtra"
    card: "The state CET for two-year MBA and MMS admissions in government, university and unaided management institutes of Maharashtra."
    card_facts: ["Graduate, 50% (45% reserved)", "200 questions · 150 min", "Two attempts, best counts"]
    eyebrow: "State CET Cell · MAH-MBA/MMS CET 2026"
    title: "MAH-MBA/MMS CET 2026 — Maharashtra Management Entrance"
    lede: "MAH-MBA/MMS CET is the State CET Cell's online test for first-year admission to the two-year full-time MBA and MMS courses in Maharashtra for 2026-27; seats are then filled through CAP."
    facts:
      - { label: "Eligibility", value: "Bachelor's, 50% (45% reserved MH)", source: mba-ib }
      - { label: "Paper", value: "200 MCQs · 150 min · no negative", source: mba-ib }
      - { label: "Fee", value: "₹1,500 open · ₹1,300 reserved (MH)", source: mba-ib }
      - { label: "Attempts", value: "Up to two; better percentile counts", source: mba-ib }
    official:
      - { label: "MBA/MMS CET 2026 information brochure", url: "https://cetcell.mahacet.org/wp-content/uploads/2023/12/MAH-MBA-MMS-CET-2026-Information-Brochure.pdf" }
      - { label: "MBA CAP portal 2026", url: "https://mba2026.mahacet.org.in/mba_26/home" }
    sections:
      - id: overview
        nav: "Overview"
        eyebrow: "Overview &amp; official source"
        heading: "What MAH-MBA/MMS CET covers"
        parts:
          - p: "Admissions based on this CET cover all Government of Maharashtra management institutes, university departments, university-managed institutes and all unaided management institutes under the 2015 Act, provided they are approved and affiliated to a non-agricultural university in Maharashtra. Registration ran from 10 January to 12 February 2026 (fee until 13 February)."
            source: mba-ib
      - id: eligibility
        nav: "Eligibility"
        eyebrow: "Eligibility"
        heading: "Who can appear"
        parts:
          - list:
              - "A bachelor's degree of at least three years from a UGC / AIU-recognised university in any discipline, with at least 50% aggregate (45% for backward class categories, EWS and persons with disability belonging to Maharashtra)."
              - "Final-year degree students may also appear."
              - "Aggregate means the grand total of marks in the subjects on which the university declares the class; CGPA is converted by the university's own certified method; percentages are rounded to two decimals."
            source: mba-ib
      - id: scheme
        nav: "Exam Scheme"
        eyebrow: "Exam scheme"
        heading: "Sections and marks"
        parts:
          - table:
              head: ["Section", "Questions", "Marks"]
              rows:
                - ["Logical Reasoning", "75", "75"]
                - ["Abstract Reasoning", "25", "25"]
                - ["Quantitative Aptitude", "50", "50"]
                - ["Verbal Ability / Reading Comprehension", "50", "50"]
                - ["Total", "200", "200"]
            source: mba-ib
          - list:
              - "Online test, 150 minutes, English medium; five options per question; no negative marking."
              - "Two attempts are allowed, each in multiple shifts. Percentiles are computed from raw marks, and with two attempts the better percentile is used for 2026-27 admissions."
            source: mba-ib
      - id: fees
        nav: "Fees"
        eyebrow: "Fee structure"
        heading: "Application fee"
        parts:
          - table:
              head: ["Option", "Open / OMS / J&amp;K migrant", "Reserved, EWS, PwD of Maharashtra; orphan; transgender"]
              rows:
                - ["First attempt", "₹1,500", "₹1,300"]
                - ["Both attempts", "₹3,000", "₹2,600"]
            source: mba-ib
      - id: reservation
        nav: "Reservation"
        eyebrow: "Reservation &amp; certificates"
        heading: "Certificates you will need at CAP"
        parts:
          - list:
              - "Caste certificate, caste validity certificate and a Non-Creamy Layer certificate valid up to 31 March 2027, where applicable, at the time of the CAP form."
              - "EWS certificate and Persons with Disability certificate, where applicable, at the CAP form."
              - "SEBC reservation is subject to the High Court's decision in the pending writ petitions."
            source: mba-ib
          - note: "The CAP seat-reservation percentages for Maharashtra candidates are the same as on the MHT-CET page (60% vertical, plus EWS 10% over intake, 30% women, 5% defence, 5% PwD, 1% orphans)."
      - id: documents
        nav: "Documents"
        eyebrow: "Document checklist"
        heading: "On test day and at registration"
        parts:
          - list:
              - "Printed hall ticket plus an original photo ID with the same name (PAN, passport, permanent driving licence, voter card, bank passbook with photo, Aadhaar / e-Aadhaar, college ID and others listed). Ration cards and learner's licences are not accepted."
              - "Women whose name changed after marriage must bring the gazette notification, marriage certificate or affidavit."
              - "Registration uses Aadhaar authentication and APAAR ID verification through DigiLocker."
            source: mba-ib
      - id: pay
        nav: "Where It Leads"
        eyebrow: "After admission"
        heading: "What the CET leads to"
        parts:
          - p: "A two-year full-time MBA or MMS seat allotted through CAP in a government, university or unaided management institute of Maharashtra."
            source: mba-ib
          - links:
              - { label: "MBA CAP portal 2026", url: "https://mba2026.mahacet.org.in/mba_26/home" }
      - id: posting
        nav: "Help"
        eyebrow: "Support"
        heading: "Help"
        parts:
          - list:
              - "Helpdesk email cethelpdesk-2026@maharashtracet.org, toll-free 1800-209-0191, helplines 079-6913-4401 / 4402 (10 am – 6 pm)."
              - "Plan for about four hours at the venue although the test is 150 minutes."
            source: mba-ib
    sources:
      - { id: mba-ib, name: "State CET Cell — MAH-MBA/MMS CET 2026 Information Brochure", url: "https://cetcell.mahacet.org/wp-content/uploads/2023/12/MAH-MBA-MMS-CET-2026-Information-Brochure.pdf", covers: "institutes covered, dates, eligibility, sections and marks, attempts, fees, certificates, ID rules", checked: 2026-10-14 }

  # ------------------------------------------------------------------ BBA / BMS / BBM / BCA CAP
  - slug: bba-cap
    group: academic
    short: "BBA / BMS / BBM / BCA CET &amp; CAP"
    body: "State Common Entrance Test Cell, Maharashtra"
    card: "Undergraduate management and computer-application degrees are now regulated admissions: a state CET followed by the CET Cell's centralised CAP rounds."
    card_facts: ["Class 12 passed or appearing", "100 MCQs · 120 min", "CAP Rounds I–IV"]
    eyebrow: "State CET Cell · MAH-BHMCT/BCA/BBA/BMS/BBM CET 2026"
    title: "BBA, BMS, BBM &amp; BCA Admission in Maharashtra — CET and CAP"
    lede: "BBA, BMS, BBM, BCA and the integrated MBA/MCA courses are treated as professional technical courses in Maharashtra: candidates take the MAH-BHMCT/BCA/BBA/BMS/BBM CET and are then admitted through the State CET Cell's Centralised Admission Process."
    facts:
      - { label: "Who can sit", value: "Class 12 passed or appearing", source: bba-ib }
      - { label: "Paper", value: "100 MCQs · 120 min · English", source: bba-ib }
      - { label: "Fee", value: "₹1,300 open · ₹1,000 reserved (MH)", source: bba-ib }
      - { label: "CAP need", value: "Non-zero CET score (MH candidates)", source: cap-ib }
    official:
      - { label: "CET 2026 information brochure", url: "https://cetcell.mahacet.org/wp-content/uploads/2023/12/Information-brochure-for-MAH-BHMCT-BCA-BBA-BMS-BBM-CET-2026.pdf" }
      - { label: "BBA/BMS/BBM CAP portal 2026", url: "https://bba2026.mahacet.org.in/bba_26/home" }
      - { label: "BCA CAP portal 2026", url: "https://bca2026.mahacet.org/StaticPages/HomePage" }
    sections:
      - id: overview
        nav: "Overview"
        eyebrow: "Overview &amp; official source"
        heading: "One CET for five kinds of degree"
        parts:
          - p: "The 2026 CET covers first-year BHMCT (4 years), BCA, BBA, BMS and BBM (3 or 4 years), MBA (Integrated), MCA (Integrated) and M.HMCT (Integrated) for 2026-27. Online registration ran from 14 January to 16 February 2026, with payment until 17 February 2026."
            source: bba-ib
          - p: "In CAP, BBA/BMS/BBM and BCA are listed alongside engineering, pharmacy and architecture as full-time professional undergraduate technical courses, so the same CAP stages, reservations and document rules apply."
            source: cap-ib
      - id: eligibility
        nav: "Eligibility"
        eyebrow: "Eligibility"
        heading: "Who can appear and who gets a CAP seat"
        parts:
          - list:
              - "Indian citizen who has passed or is appearing in 10+2 or an equivalent exam."
              - "BCA / BBA / BMS / BBM: 10+2 pass with eligibility as per the admission policy of the affiliating university."
              - "BHMCT / M.HMCT (Integrated): 10+2 with at least 45% aggregate (40% for reserved categories, EWS and disabled candidates of Maharashtra)."
            source: bba-ib
          - table:
              caption: "CAP eligibility for BBA/BMS/BBM (2025-26 CAP brochure)"
              head: ["Candidature", "What is needed"]
              rows:
                - ["Maharashtra State", "10+2 as per the affiliating university's policy and a non-zero score in MAH-BCA/BBA/BMS/BBM CET"]
                - ["All India, J&amp;K and Ladakh migrant", "10+2 as above and a non-zero positive score in CUET-UG or a non-zero CET score; CUET-UG scorers are preferred"]
            source: cap-ib
      - id: scheme
        nav: "Exam &amp; CAP"
        eyebrow: "Exam scheme &amp; CAP rounds"
        heading: "Test pattern and the CAP process"
        parts:
          - table:
              head: ["Section", "Questions", "Marks"]
              rows:
                - ["English Language", "30", "30"]
                - ["Reasoning (verbal and arithmetic)", "30", "30"]
                - ["General Knowledge &amp; Awareness", "20", "20"]
                - ["Computer Basics", "20", "20"]
                - ["Total", "100", "100"]
            source: bba-ib
          - list:
              - "Online test, 120 minutes, English medium, four options per question, no negative marking."
              - "Expect to be at the venue for about 180 minutes for checks and log-in."
            source: bba-ib
          - list:
              - "CAP stages: information brochure → online CAP application → upload of scanned original documents → provisional and final merit lists → option forms and allotment for each round."
              - "Seats left after CAP and institutional-quota seats are filled by institutes under the CET Cell's notice."
            source: cap-ib
          - p: "The 2026 BBA/BMS/BBM CAP portal published separate merit lists for All India, Maharashtra and Defence candidates and vacancy positions for CAP Rounds II, III and IV; it now shows that all processes for 2026-27 are closed."
            source: bba-cap26
      - id: fees
        nav: "Fees"
        eyebrow: "Fee structure"
        heading: "CET fee and CAP fee"
        parts:
          - table:
              head: ["Candidate", "CET fee"]
              rows:
                - ["Open category (Maharashtra), OMS, J&amp;K migrant", "₹1,300"]
                - ["SC, ST, VJ/DT-NT(A), NT(B), NT(C), NT(D), OBC, SBC, SEBC, EWS and PwD of Maharashtra; orphans; transgender candidates", "₹1,000"]
            source: bba-ib
          - p: "Candidates seeking admission on the basis of the state CET do not pay a separate CAP application fee; those applying only through a national exam (such as CUET-UG) pay the CAP fee."
            source: cap-ib
      - id: reservation
        nav: "Reservation"
        eyebrow: "Reservation &amp; certificates"
        heading: "Category seats and certificates"
        parts:
          - list:
              - "Caste certificate, caste validity certificate and Non-Creamy Layer certificate (valid up to 31 March 2027), EWS certificate and PwD certificate, where applicable, at the CAP form."
              - "SEBC reservation is subject to the High Court's decision."
            source: bba-ib
          - list:
              - "Maharashtra CAP seats: SC 13%, ST 7%, NT(A) 3%, NT(B) 2.5%, NT(C) 3.5%, NT(D) 2%, OBC 19%, SEBC 10%."
              - "EWS 10% over intake; 30% for women; 5% defence; 5% PwD; 1% orphans."
            source: cap-ib
      - id: documents
        nav: "Documents"
        eyebrow: "Document checklist"
        heading: "Uploads for CAP"
        parts:
          - list:
              - "SSC and HSC mark sheets, CET (or CUET-UG) score card, leaving certificate if needed, proof of Indian nationality."
              - "Candidature proof (domicile / birth certificate for Type A, domicile certificate for Type B, employer Proforma A/B for Types C/D, Proforma G1/G2 for Type E)."
              - "Category documents as above; EWS Proforma V; orphan Proforma U; defence Proforma C/D/E."
            source: cap-ib
          - p: "The 2026 CAP portal's download section carries the proformas (A, B1, B2, C, D, G1 & G2, J&K, M, O, U, V, W2, S)."
            source: bba-cap26
      - id: pay
        nav: "Where It Leads"
        eyebrow: "After admission"
        heading: "What a CAP seat leads to"
        parts:
          - p: "A three- or four-year BBA, BMS, BBM or BCA (or an integrated MBA / MCA) in a college affiliated to a Maharashtra university, allotted through CAP."
            source: bba-ib
          - links:
              - { label: "BBA colleges in Maharashtra (verified list)", url: "colleges/maharashtra/bba.html" }
              - { label: "BCA colleges in Maharashtra (verified list)", url: "colleges/maharashtra/bca.html" }
      - id: posting
        nav: "Help"
        eyebrow: "Support"
        heading: "Help"
        parts:
          - list:
              - "CET helpdesk: cethelpdesk-2026@maharashtracet.org, toll-free 1800-209-0191."
            source: bba-ib
          - list:
              - "BBA/BMS/BBM CAP helpline: 1800-410-6363 and 76698-61010 (10 am – 6 pm)."
            source: bba-cap26
    sources:
      - { id: bba-ib, name: "State CET Cell — MAH-BHMCT/BCA/BBA/BMS/BBM CET 2026 Information Brochure", url: "https://cetcell.mahacet.org/wp-content/uploads/2023/12/Information-brochure-for-MAH-BHMCT-BCA-BBA-BMS-BBM-CET-2026.pdf", covers: "courses, dates, eligibility, test pattern, fees, certificates", checked: 2026-10-14 }
      - { id: cap-ib, name: "State CET Cell — CAP Information Brochure for UG & PG Technical Courses 2025-26", url: "https://cetcell.mahacet.org/wp-content/uploads/2023/12/Information_Brochure_UG_PG_2025_26_Final_02_07_2025.pdf", covers: "CAP eligibility for BBA/BMS/BBM, CAP stages, CAP fee rule, reservations, documents", checked: 2026-10-14 }
      - { id: bba-cap26, name: "State CET Cell — BBA/BMS/BBM/MBA (Integrated) CAP portal 2026-27", url: "https://bba2026.mahacet.org.in/bba_26/home", covers: "2026 merit lists, CAP rounds II–IV, proformas, helpline, process closed", checked: 2026-10-14 }

  # ------------------------------------------------------------------ MSBSHSE
  - slug: msbshse
    group: academic
    short: "MSBSHSE Board (SSC &amp; HSC)"
    body: "Maharashtra State Board of Secondary and Higher Secondary Education, Pune"
    card: "The state board behind the Class 10 (SSC) and Class 12 (HSC) exams, held through nine divisional boards. HSC is the qualifying exam for every CET route above."
    card_facts: ["9 divisional boards", "HSC from 8 Feb 2027", "SSC from 15 Feb 2027"]
    eyebrow: "MSBSHSE · SSC &amp; HSC 2027"
    title: "Maharashtra Board (MSBSHSE) SSC &amp; HSC 2027 — Dates and Forms"
    lede: "The Maharashtra State Board of Secondary and Higher Secondary Education, Pune conducts the SSC (Class 10) and HSC (Class 12) exams through nine divisional boards. This page follows the board's notices for the February–March 2027 exams."
    facts:
      - { label: "HSC written exam", value: "8 Feb – 16 Mar 2027", source: board-dates }
      - { label: "SSC written exam", value: "15 Feb – 11 Mar 2027", source: board-dates }
      - { label: "SSC forms (regular fee)", value: "19 Aug – 31 Oct 2026", source: board-ssc-form }
      - { label: "Divisional boards", value: "9", source: board-dates }
    official:
      - { label: "MSBSHSE website", url: "https://www.mahahsscboard.in/" }
      - { label: "Feb–Mar 2027 exam dates notice", url: "https://state-board-strapi-upload.blr1.digitaloceanspaces.com/6_3915_170926_9c8b56fe4f.pdf" }
    sections:
      - id: overview
        nav: "Overview"
        eyebrow: "Overview &amp; official source"
        heading: "What the board runs"
        parts:
          - p: "The board holds the SSC and HSC written, practical, grade, oral and internal-assessment exams through its nine divisional boards at Pune, Nagpur, Chhatrapati Sambhajinagar, Mumbai, Kolhapur, Amravati, Nashik, Latur and Konkan. Its notice of 17 September 2026 announced the probable dates for February–March 2027 early so that schools can plan and students face less stress; the subject-wise timetable is published separately."
            source: board-dates
      - id: eligibility
        nav: "Who Applies"
        eyebrow: "Eligibility &amp; forms"
        heading: "Who fills the exam form, and how"
        parts:
          - list:
              - "Regular students: forms are filled online by the school from the student's UDISE+ PEN-ID."
              - "Repeaters, private candidates holding an enrolment certificate, candidates under the class-improvement scheme, candidates with isolated subjects, and ITI students taking transfer of credit: forms are filled online through the school in the usual way, since their data is not on UDISE+."
              - "Students seeking transfer of credit under the Kaushalya Setu scheme also apply online and submit hard copies to the divisional board."
              - "The APAAR ID is recorded on the form where the student has one."
            source: board-ssc-form
      - id: scheme
        nav: "Exam Dates"
        eyebrow: "Exam schedule"
        heading: "February–March 2027 dates"
        parts:
          - table:
              head: ["Exam", "HSC (Class 12)", "SSC (Class 10)"]
              rows:
                - ["Written exam", "Mon 8 Feb – Tue 16 Mar 2027", "Mon 15 Feb – Thu 11 Mar 2027"]
                - ["Practical, grade, oral and internal assessment", "Wed 20 Jan – Sat 6 Feb 2027", "Thu 28 Jan – Sat 13 Feb 2027"]
            source: board-dates
      - id: fees
        nav: "Form Fees"
        eyebrow: "Fee windows"
        heading: "SSC 2027 form and fee dates"
        parts:
          - table:
              head: ["Fee type", "Forms by students / schools", "Schools pay the fee"]
              rows:
                - ["Regular fee", "Wed 19 Aug – Sat 31 Oct 2026", "Mon 31 Aug – Sat 31 Oct 2026"]
                - ["Late fee", "Sun 1 Nov – Sun 15 Nov 2026", "Sun 1 Nov – Sun 15 Nov 2026"]
                - ["Extra-late fee", "Mon 16 Nov – Mon 30 Nov 2026", "Mon 16 Nov – Mon 30 Nov 2026 (₹50 per student per day)"]
            source: board-ssc-form
          - list:
              - "Schools deposit the fee receipts and student pre-lists with the divisional board by Monday 7 December 2026."
              - "Fees are paid by the school through the SBI online gateway; old bank challans and cash are not accepted. Hall tickets are not issued until the fee is paid, and the dates will not be extended."
            source: board-ssc-form
          - note: "The circular gives the windows but not the per-subject fee amounts; schools see those in their login."
            source: board-ssc-form
      - id: reservation
        nav: "Category &amp; Later Use"
        eyebrow: "Category, certificates &amp; later use"
        heading: "Where your board certificates are used"
        parts:
          - p: "Your SSC and HSC mark sheets are the base documents for every Maharashtra CAP admission, and the HSC is the qualifying exam whose marks decide CET eligibility (for B.E./B.Tech: 45% in the relevant subjects, 40% for reserved, EWS and PwD candidates of Maharashtra)."
            source: cap-ib
      - id: documents
        nav: "Form Details"
        eyebrow: "Form checklist"
        heading: "Details schools must get right"
        parts:
          - list:
              - "Photo: a recent (within 6 months) professional colour passport photo, JPG only, 25–40 KB, plain white or light background, face fully visible, preferably in school uniform. The photo cannot be changed once the form is sent and hall tickets are generated."
              - "Students or parents sign the pre-list or form printout because name and date-of-birth errors are common."
              - "Schools must update their School Profile (institution, recognised subjects, teachers) before filling forms."
            source: board-ssc-form
      - id: pay
        nav: "Where It Leads"
        eyebrow: "After the board"
        heading: "What comes next"
        parts:
          - p: "After HSC, the State CET Cell's tests (MHT-CET, the BBA/BCA CET and others) and CAP decide most professional admissions in Maharashtra; see the other admission nodes in this cockpit."
            source: mht-ib
          - links:
              - { label: "MHT-CET page", url: "state/maharashtra/mhtcet.html" }
              - { label: "BBA / BMS / BCA CET &amp; CAP page", url: "state/maharashtra/bba-cap.html" }
      - id: posting
        nav: "Help"
        eyebrow: "Support"
        heading: "Help"
        parts:
          - list:
              - "The board runs a student counselling helpline, 91127-09112, and offers online verification of SSC and HSC mark sheets and certificates and duplicate mark sheets on its website."
            source: board-home
