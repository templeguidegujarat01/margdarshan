# New Zealand — study abroad sheet (shape: _data/in/abroad_common.yml header). Read 2026-10-29 from Immigration New Zealand.
id: new-zealand
name: "New Zealand"
short: "New Zealand"
region: Oceania
currency: NZD
checked: 2026-10-29
review_by: 2027-01-29
status: open
eyebrow: "Study abroad · Oceania"
title: "Study in New Zealand from India"
seo_title: "Study in New Zealand from India: Visa, NZD 20,000, PSWV"
description: "New Zealand Fee Paying Student Visa from India: NZD 850 fee, NZD 20,000 a year living funds, 25 work hours a week and a Post-Study Work Visa of up to 3 years."
lede: "New Zealand's Fee Paying Student Visa needs an offer from an approved provider, paid fees for the first year or course, and living money. A master's studied for at least 30 weeks in New Zealand leads to a 3-year Post-Study Work Visa."
facts:
  - { label: "Student visa fee", value: "From NZD 850", source: fpsv }
  - { label: "Living money", value: "NZD 20,000 a year", source: fpsv }
  - { label: "Work", value: "Up to 25 hours a week; full time in holidays", source: fpsv }
  - { label: "After a master's", value: "Post-Study Work Visa: 3 years", source: inz_length }
card:
  line: "Approved providers, paid first-year fees, 3-year PSWV after a master's"
  psw: "Up to 3 years (PSWV)"
  work: "25 h/week in term"
  funds: "NZD 20,000 a year + fees"
tests:
  - { exam: ielts, need: "Your provider confirms in the offer that your English is enough for the course", source: fpsv }
pillars:
  language_and_eligibility:
    heading: "Who decides your English"
    parts:
      - points:
          - { t: "Your offer of place must include the provider's signed declaration that you have the English and academic ability to pass the course.", source: fpsv }
          - { t: "The provider must be a signatory to the Education (Pastoral Care of Tertiary and International Learners) Code of Practice 2021.", source: fpsv }
  intakes_and_streams:
    heading: "Courses and what qualifies for post-study work"
    parts:
      - points:
          - { t: "A degree-level (level 7+) qualification must be studied full time for at least 30 weeks in New Zealand to count for a Post-Study Work Visa.", source: pswv }
          - { t: "Non-degree level 7 or lower qualifications count only if they are on the list of PSWV-eligible qualifications, and the job must relate to the study.", source: pswv }
          - { t: "From 16 November 2026, a full-time level 7 graduate diploma plus a bachelor's (from NZ or overseas) will also qualify.", source: pswv }
      - note: "Universities mainly start in February and July. The visa office says it is busiest from October to March, so apply at least 3 months before travel."
        source: fpsv
  tuition_and_living_costs:
    heading: "Money you must show"
    parts:
      - money:
          - { item: "Living money (study of 1 year or more)", cur: NZD, amount: 20000, per: "year", source: fpsv }
          - { item: "Living money (study under 1 year)", cur: NZD, amount: 1667, per: "month", source: fpsv }
          - { item: "Fee Paying Student Visa", cur: NZD, amount: 850, per: "application (from)", source: fpsv }
          - { item: "Post-Study Work Visa", cur: NZD, amount: 1670, per: "application (from)", source: pswv }
          - { item: "Funds for the PSWV", cur: NZD, amount: 5000, per: "total", source: pswv }
      - points:
          - { t: "Show tuition paid for one course or one year of study, whichever is shorter. If you apply from outside NZ you may pay after approval in principle.", source: fpsv }
  global_scholarships:
    heading: "Scholarships in New Zealand"
    parts:
      - points:
          - { t: "Education New Zealand says many providers offer scholarships to international students; check your provider's site.", source: enz_sch }
          - { t: "The government's Manaaki New Zealand Scholarships are for scholars from developing nations named in that programme.", source: enz_sch }
  application_funnel:
    heading: "From offer to visa"
    parts:
      - steps:
          - { title: "Offer of place", text: "Conditional offers are fine when applying from outside NZ; the visa is approved in principle and issued after an unconditional offer.", source: fpsv }
          - { title: "Fees and living money", text: "Paid first-year or course fees, plus NZD 20,000 a year or an acceptable sponsor.", source: fpsv }
          - { title: "Insurance and health", text: "Full medical and travel insurance; a chest X-ray if you stay over 6 months and the rules say so.", source: fpsv }
          - { title: "Apply online", text: "At least 3 months before travel; 80% are decided within 7 weeks.", source: fpsv }
  visa_chokepoints:
    heading: "The student visa in short"
    parts:
      - points:
          - { t: "Partners and children cannot be included in your application; they apply on their own based on their relationship to you.", source: fpsv }
          - { t: "Chest X-ray or medical certificates must be less than 3 months old when Immigration NZ receives them.", source: fpsv }
          - { t: "A credible plan for funding later years strengthens a multi-year application.", source: fpsv }
  post_study_work:
    heading: "Work during and after your course"
    parts:
      - points:
          - { t: "Up to 25 hours a week while studying and full time in the summer holidays or scheduled breaks, depending on your visa conditions.", source: fpsv }
          - { t: "Post-Study Work Visa: master's or doctoral graduates who studied at least 30 weeks in NZ get 3 years; level 8 or below gets a visa equal to the study time.", source: inz_length }
          - { t: "You can hold the PSWV only once; it can support visas for your partner and children.", source: pswv }
