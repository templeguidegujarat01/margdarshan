<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-hidden="true">
  <rect width="640" height="320" fill="#1D3557"/>
  <rect width="640" height="320" fill="url(#g)"/>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="640" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#254A75"/>
      <stop offset="1" stop-color="#16324F"/>
    </linearGradient>
  </defs>
  <!-- ledger sheet -->
  <g transform="translate(190,48)">
    <rect x="0" y="0" width="200" height="224" rx="10" fill="#F4F6F4"/>
    <rect x="0" y="0" width="200" height="224" rx="10" fill="none" stroke="#D97B21" stroke-width="0" opacity="0"/>
    <line x1="22" y1="40" x2="178" y2="40" stroke="#DCE3DF" stroke-width="3"/>
    <line x1="22" y1="70" x2="178" y2="70" stroke="#DCE3DF" stroke-width="3"/>
    <line x1="22" y1="100" x2="178" y2="100" stroke="#DCE3DF" stroke-width="3"/>
    <line x1="22" y1="130" x2="178" y2="130" stroke="#DCE3DF" stroke-width="3"/>
    <line x1="22" y1="160" x2="178" y2="160" stroke="#DCE3DF" stroke-width="3"/>
    <line x1="22" y1="190" x2="120" y2="190" stroke="#DCE3DF" stroke-width="3"/>
    <circle cx="34" cy="24" r="9" fill="#3B6EA5"/>
    <text x="34" y="29" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#fff">₹</text>
  </g>
  <!-- growth line + coin accents -->
  <g transform="translate(60,190)" stroke="#E8A33D" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 90 L40 55 L80 70 L120 20"/>
  </g>
  <circle cx="60" cy="240" r="14" fill="#E8A33D"/>
  <circle cx="100" cy="255" r="9" fill="#3B6EA5"/>
  <circle cx="470" cy="90" r="16" fill="#3B6EA5"/>
  <circle cx="500" cy="130" r="10" fill="#E8A33D"/>
  <circle cx="450" cy="220" r="8" fill="#F4F6F4" opacity=".5"/>
</svg>
