# College Finder data — single source for the colleges-<course>*.html finders
# (rendered by _includes/finder.html).
#
# Editorial rule (see "A note on rankings" on every finder page): list a
# college only with genuine course availability, recognised institutional
# status and an official website that was checked to load. Fees, seats and
# cutoffs change every year, so they are NOT stored here — each card links
# to the official counselling authority (`body`, a key in
# _data/counselling.yml) instead. If you ever add `fees`, `seats` or `cutoff`
# fields, add an `as_of` year with them; the card renders them only when present.
#
# course:      key in `courses` below
# ownership:   Government | Private | Deemed  (shown as the badge)
# type_detail: finer label next to the badge, e.g. "IIT", "Municipal"
# entrance:    overrides the course's default entrance exam
# counselling: how seats are filled — shown on the card
# body:        counselling authority key for the "Counselling & fees" button
# region:      JSON-LD addressRegion when the city sits outside the finder state

courses:
  mbbs:    { label: "MBBS",         entrance: "NEET-UG", page: "colleges-mbbs" }
  bds:     { label: "BDS",          entrance: "NEET-UG", page: "colleges-bds" }
  bams:    { label: "BAMS",         entrance: "NEET-UG", page: "colleges-bams" }
  bhms:    { label: "BHMS",         entrance: "NEET-UG", page: "colleges-bhms" }
  nursing: { label: "B.Sc Nursing", entrance: "NEET-UG or state / institute entrance", page: "colleges-nursing" }
  btech:   { label: "B.Tech",       entrance: "JEE Main", page: "colleges-btech" }

