hero:
  eyebrow: "Commerce · Regulated Finance"
  title: "SEBI Registered Investment Adviser (RIA)"
  meta:
    - "Registered with SEBI"
    - "Graduate + NISM certifications"
  read_time: "8 min read"
  intro:
    - "Only advisers registered with the Securities and Exchange Board of India (SEBI) may give paid investment advice. Under SEBI's amended Investment Adviser Regulations, an individual needs a graduate degree and two National Institute of Securities Markets (NISM) certifications — Series X-A (Level 1) and X-B (Level 2) — before applying for registration."
