          - list:
              - "India is split into <strong>four zones</strong> (North, West, South, East); Talent Series events are only for players registered in that zone. A zone change needs AITA's written approval and cannot be changed again for 6 months."
              - "AITA tournaments are held only at <strong>AITA-registered centres and academies</strong>, through your state association."
