  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What is Diploma in Pharmacy?"
    parts:
      - overview:
          points:
            - "Diploma in Pharmacy (D.Pharm) is a 2-year programme regulated by the <strong>PCI</strong>, covering how medicines are formulated, dispensed and used safely."
            - "Students study pharmaceutics, pharmacology, pharmaceutical chemistry and pharmacy practice, combined with substantial lab work each semester."
            - "What sets D.Pharm apart from most other diplomas is its regulatory status: it is itself a recognised qualification for registering as a <strong>Registered Pharmacist</strong> under the Pharmacy Act, 1948, once you complete any required internship/practical training set by your State Pharmacy Council."
          more:
            - "This means D.Pharm holders can legally dispense medicines and be the qualified person in charge of a retail or wholesale medical store — a genuine professional license, not just a technical certificate."
  - id: "who"
    hid: "who-heading"
    alt: true
    eyebrow: "Fit check"
    heading: "Who should choose this Diploma"
    parts:
      - fit:
          match:
            - "Want a genuine, regulated professional qualification in a shorter 2-year format."
            - "Are interested in medicines, healthcare and working directly with patients or customers."
            - "Would eventually like to run your own medical store or work in hospital/retail pharmacy."
          mismatch:
            - "Specifically want a pharmaceutical R&amp;D, drug regulatory or Drug Inspector career — these typically need a B.Pharm."
            - "Are not comfortable with strict regulatory/legal responsibility around dispensing medicines."
            - "Prefer a pure lab/research environment over patient- or customer-facing work."
  - id: "eligibility"
    hid: "elig-heading"
    eyebrow: "Eligibility"
    heading: "Who can apply"
    parts:
      - elig_list:
          - "Class 12 pass with <strong>Physics, Chemistry and Biology or Maths (PCB/PCM)</strong>, typically requiring around <strong>45-50% aggregate</strong>, varying by state and institute."
          - "Most states set a minimum age requirement (commonly 17 years) at the time of admission."
          - "Reservation norms, minimum marks and exact subject combinations vary by state — always confirm against your target institute's and State Pharmacy Council's current admission notification."
