        title: "High school diploma → company training → own territory"
        tag: "Nontechnical products"
        who: "New employees may ride along on experienced workers' sales calls and get more responsibility until they have their own territory."
        steps:
          - { tag: "Start", title: "High school diploma", text: "", kind: start, source: ooh_wholesale }
          - { tag: "Up to 1 year", title: "Company training program", text: "", kind: stage, source: ooh_wholesale }
          - { tag: "Goal", title: "Sales representative with a territory", text: "", kind: goal, source: ooh_wholesale }
      - id: technical
        title: "Bachelor's related to the product → technical sales"
        tag: "Scientific or technical products"
        who: "A field of degree related to the product sold, such as agriculture or biology, is sometimes required."
        steps:
          - { tag: "Start", title: "High school diploma", text: "", kind: start, source: ooh_wholesale }
          - { tag: "About 4 years", title: "Bachelor's degree related to the product", text: "", kind: stage, source: ooh_wholesale }
          - { tag: "Training", title: "Formal technical instruction, then field training", text: "", kind: stage, source: ooh_wholesale }
          - { tag: "Goal", title: "Technical and scientific products sales rep", text: "Good sales records and leadership may lead to sales manager, district manager or vice president of sales.", kind: goal, source: ooh_wholesale, href: "us/careers/sales-manager/", link: "Sales manager" }
