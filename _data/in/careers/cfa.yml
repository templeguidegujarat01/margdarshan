  - id: "difficulty"
    hid: "difficulty-heading"
    eyebrow: "Set expectations correctly"
    heading: "Difficulty, time required & approximate pass rates"
    parts:
      - prose:
          - "CFA Institute reports successful candidates typically spend <strong>over 300 hours preparing for each level</strong> — so roughly 900+ hours across all three, on top of a full-time degree or job. Most candidates complete the full charter, including work experience, in about <strong>2.5–4 years</strong> after starting Level I."
          - "Recent CFA Institute pass rates have averaged roughly <strong>41% at Level I, 45% at Level II, and 51% at Level III</strong> — first-time candidates typically pass at meaningfully higher rates than repeat/deferred candidates. These figures shift with each exam's difficulty, so check the latest results on cfainstitute.org rather than treating any single number as fixed."
