# Journey Blueprint — Exploration Geologist (B.Sc → M.Sc Geology → UPSC Combined Geo-Scientist Exam: GSI / CGWB). Printed on journey-geologist.html (_includes/journey-doubts.html).
# Rules, classes and the money items / sources several careers share: _data/in/journey_common.yml.
# `sources` below are used only by this career. Check: node scripts/check-journey-matrix.mjs
id: geologist
v: 2
name: "Exploration Geologist (M.Sc Geology → UPSC Geo-Scientist)"
search: ["exploration geologist", "geologist", "geology", "geological survey of india", "gsi geologist", "hydrogeologist", "geo-scientist", "geoscientist"]
page: "geologist.html"
roadmap: "roadmaps/geologist.html"
doubts_page: "journey-geologist.html"
gate: "Class 12 Science → B.Sc with Geology (CUET (UG) for central universities) → M.Sc / Integrated M.Sc in Geology or a listed earth-science subject → UPSC Combined Geo-Scientist Exam (Prelims, Mains, Interview; age 21–32) → Geologist (Group A) or Assistant Geologist (Group B) in the Geological Survey of India, or Scientist 'B' / Assistant Hydrogeologist in the Central Ground Water Board."
gate_source: [cuet26, geo27]
core:
  what:
    text: "Exploration geologists map rocks and minerals, search for ores and groundwater and study hazards such as landslides. The Geological Survey of India (Ministry of Mines) and the Central Ground Water Board (Ministry of Jal Shakti) recruit them through UPSC's Combined Geo-Scientist Examination."
    source: geo27
  day:
    - "Map rocks and collect samples in the field."
    - "Drill, log and analyse cores and groundwater data."
    - "Write survey reports and mineral or groundwater assessments."
  pay:
    - { level: "Assistant Mining Geologist, Indian Bureau of Mines (UPSC Advt 06/2026)", value: "Pay Level 7", source: upsc-adv06 }
  pay_note: "The Geo-Scientist 2027 notice does not print pay, so no Group A geologist pay is printed."
  routes:
    - { title: "Geologist, Group A (GSI)", text: "A master's in Geological Science, Geology, Applied Geology, Geo-Exploration, Mineral Exploration, Engineering Geology, Marine Geology, Earth Science and Resource Management, Oceanography and Coastal Areas Studies, Petroleum Geosciences or Geochemistry.", source: geo27 }
    - { title: "Assistant Geologist, Group B (GSI)", text: "A master's or integrated master's in Geology, Applied Geology, Mineral Exploration, Marine Geology or Earth Science.", source: geo27 }
    - { title: "Central Ground Water Board", text: "Scientist 'B' (Hydrogeology) and Assistant Hydrogeologist posts are filled through the same exam.", source: geo27 }
    - { title: "Indian Bureau of Mines", text: "Assistant Mining Geologist: master's in Geology or Applied Geology with two years' experience; selected by UPSC advertisement.", source: upsc-adv06 }
  cost_time:
    - { label: "UPSC Geo-Scientist fee", value: "₹200 · women, SC, ST and PwBD exempt", source: geo27 }
    - { label: "Degrees", value: "B.Sc, then an M.Sc (or integrated M.Sc) in a listed earth-science subject", source: geo27 }
  cost_note: "University fees differ by institution, so they are not printed here."
  challenges:
    - text: "Only 127 posts in all were notified for the 2027 exam, and there were no Geophysicist Group A vacancies."
      source: geo27
    - text: "Prelims has negative marking: one-third of a question's marks is cut for each wrong answer."
      source: geo27
    - text: "A bachelor's degree is not enough — every geologist post in the exam needs a master's."
      source: geo27
  not_for:
    - "You dislike outdoor fieldwork in remote areas and rough weather."
    - "You want to stop studying after a bachelor's degree."
    - "You dislike Chemistry and Physics — rocks and minerals need both."
journey:
  - stages: [c8, c9]
    title: "Curiosity about the Earth"
    do:
      - text: "Every geologist post in UPSC's Geo-Scientist exam needs a master's degree in Geology or a listed earth-science subject."
        source: geo27
    doubts:
      - q: "What does an exploration geologist do?"
        a: "They map rocks and minerals, search for ores and groundwater and study hazards. The Geological Survey of India and the Central Ground Water Board recruit them through UPSC's Combined Geo-Scientist Examination."
        next: "Read the Routes list above."
        source: geo27
      - q: "Is there a government exam for geologists?"
        a: "Yes. UPSC holds the Combined Geo-Scientist Examination; the 2027 Prelims is on 10 January 2027 and Mains on 19–20 June 2027."
        next: "Keep this exam as your target."
        source: geo27
  - stages: [c10]
    title: "Choose Science"
    do:
      - text: "Every post needs a master's in Geology or a listed earth-science subject, which builds on a science bachelor's — so take Science in Class 11."
        source: geo27
    stream: "Science (PCM or PCB); Chemistry and Physics help in geology."
    doubts:
      - q: "Which stream leads to geology?"
        a: "Science. The posts need a master's in Geology or another listed earth-science subject, which follows a science bachelor's degree."
        next: "Take Science in Class 11."
        source: geo27
  - stages: [c11, c12]
    title: "CUET (UG) for B.Sc Geology"
    do:
      - text: "Central universities admit to B.Sc through CUET (UG); each university makes its own merit list."
        source: cuet26
    exams:
      - { name: "CUET (UG) 2026", when: "11–31 May 2026 (bulletin schedule)", source: cuet26 }
    doubts:
      - q: "How do I get into B.Sc Geology?"
        a: "Central universities admit through CUET (UG): NTA runs the test and each university makes its own merit list. Other universities use their own admission rules."
        next: "List universities that teach Geology and check their CUET subjects."
        source: cuet26
      - q: "Is CUET (UG) marked negatively?"
        a: "Yes. Each test has 50 questions in 60 minutes, with +5 for a correct answer and −1 for a wrong one."
        next: "Practise accuracy, not only speed."
        source: cuet26
  - stages: [ug]
    title: "B.Sc, then the right M.Sc"
    do:
      - text: "Choose an M.Sc whose name is on UPSC's list — Geology, Applied Geology, Geo-Exploration, Mineral Exploration, Engineering Geology, Marine Geology, Earth Science and others."
        source: geo27
    doubts:
      - q: "Which M.Sc is accepted for Geologist Group A?"
        a: "Geological Science, Geology, Applied Geology, Geo-Exploration, Mineral Exploration, Engineering Geology, Marine Geology, Earth Science and Resource Management, Oceanography and Coastal Areas Studies, Petroleum Geosciences or Geochemistry."
        next: "Check your M.Sc title against this list before joining."
        source: geo27
      - q: "Does an integrated M.Sc count?"
        a: "Yes, for Assistant Geologist (Group B): a master's or integrated master's in Geology, Applied Geology, Mineral Exploration, Marine Geology or Earth Science."
        next: "An integrated M.Sc after Class 12 also works."
        source: geo27
  - stages: [grad]
    title: "UPSC Combined Geo-Scientist Exam"
    do:
      - text: "Prelims: General Studies (100) + Geology / Hydrogeology (300), 2 hours each. Mains: three Geology papers of 200 marks, 3 hours each. Interview: 200 marks."
        source: geo27
    exams:
      - { name: "UPSC Combined Geo-Scientist 2027", when: "Prelims 10 Jan 2027 · Mains 19–20 Jun 2027", source: geo27 }
    doubts:
      - q: "What is the age limit for the Geo-Scientist exam?"
        a: "21 to 32 years on 1 January 2027 — born between 2 January 1995 and 1 January 2006 — with relaxations by category."
        next: "Plan attempts within this window."
        source: geo27
      - q: "Can I apply in the final year of my M.Sc?"
        a: "Yes. Candidates who have appeared for, or will appear for, the qualifying exam may apply; they must show proof of passing if called for the interview."
        next: "Apply in your final year."
        source: geo27
      - q: "How many posts were in the 2027 exam?"
        a: "111 in the Geological Survey of India (including 29 Geologist Group A and 34 Assistant Geologist Group B) and 16 in the Central Ground Water Board."
        next: "Choose your stream (Geology / Hydrogeology) carefully."
        source: geo27
      - q: "Is there negative marking?"
        a: "Yes, in the objective Prelims papers: one-third of the marks of a question is deducted for each wrong answer."
        next: "Attempt only questions you are reasonably sure of."
        source: geo27
      - q: "Do women pay the exam fee?"
        a: "No. Women, SC, ST and PwBD candidates are exempt; others pay ₹200."
        next: "Choose your category correctly."
        source: geo27
      - q: "Can I write the Geo-Scientist exam in Hindi?"
        a: "No. Question papers are set in English only, Mains answers must be written in English, and calculators are not allowed in the objective papers."
        next: "Practise writing technical answers in English."
        source: geo27
  - stages: [work]
    title: "Other central geology posts"
    do:
      - text: "UPSC Advertisement 06/2026 had 5 posts of Assistant Mining Geologist in the Indian Bureau of Mines at Pay Level 7."
        source: upsc-adv06
    doubts:
      - q: "What does the Indian Bureau of Mines ask of an Assistant Mining Geologist?"
        a: "A master's in Geology or Applied Geology and two years' experience in geological appraisal of minerals or ore deposits, or research or teaching in geology. Age limit: 30 for UR and 33 for OBC, with relaxations."
        next: "Build field experience after your M.Sc."
        source: upsc-adv06
      - q: "Can a hydrogeologist get a central job?"
        a: "Yes. The Central Ground Water Board fills Scientist 'B' (Hydrogeology) and Assistant Hydrogeologist posts through the same Geo-Scientist exam — 5 and 7 posts in 2027."
        next: "Pick the Hydrogeology stream if your M.Sc fits."
        source: geo27
board_note: "Any board. Take Science in Class 11–12 to reach a B.Sc and M.Sc in Geology."
board_source: geo27
