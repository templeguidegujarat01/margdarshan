  - id: "difficulty"
    hid: "difficulty-heading"
    alt: true
    eyebrow: "Set expectations correctly"
    heading: "Difficulty & realistic duration"
    parts:
      - prose:
          - "Exam difficulty is generally considered high but manageable with structured preparation — FAR is consistently reported as the most content-heavy Core section, while ISC is often seen as the most approachable Discipline choice. Most well-prepared candidates cite roughly <strong>300-500 hours of study per section</strong>."
          - "The exams themselves are typically completed in <strong>12-18 months</strong> once you're eligible to sit them — but the total journey, including any extra degree needed to reach 120 credits, the 150-credit licensing requirement, and 1-2 years of work experience, is realistically a multi-year path for someone starting from a standard B.Com alone."
  - id: "salary"
    hid: "salary-heading"
    eyebrow: "Indicative figures"
    heading: "CPA salary in India"
    intro: "Actual pay depends heavily on employer, city and whether you hold the CPA alongside a CA — these are broad, commonly reported ranges, not guarantees."
    parts:
