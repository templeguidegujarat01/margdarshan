            sub: "UPSC IFoS"
            href: "forest-officer.html"
          - name: "Civil Engineering"
            sub: "Geotechnical work"
            href: "civil.html"
  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Which exam recruits geologists for GSI?"
            a: "The UPSC Combined Geo-Scientist Examination."
          - q: "Can I apply after B.Sc Geology?"
            a: "UPSC geologist posts need a master's degree in geology or a listed earth-science subject."
          - q: "Is there scope in the private sector?"
            a: "Yes — mining, oil and gas, groundwater and geotechnical consulting hire geologists."
      - note: "*Pay figures are indicative unless they quote an official pay level, and rules change: confirm eligibility, dates and fees on the official websites listed under Sources before you act."
        class: "table-note mt-lg"
