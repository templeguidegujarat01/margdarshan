          - label: "JEE Main → NITs, IIITs, GFTIs"
            text: "Counselling is conducted through JoSAA/CSAB based on your JEE Main rank; CSE is the highest-cutoff branch at almost every participating institute."
            source: "josaa"
          - label: "JEE Advanced → IITs"
            text: "Only candidates who qualify JEE Main can appear for JEE Advanced, which decides admission to the 23 IITs; CSE closing ranks here are the most competitive in the entire JEE system."
            source: "jeeadv"
          - label: "State CETs"
