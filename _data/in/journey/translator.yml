# Journey Blueprint — Translator (Hindi ↔ English, central government: SSC Combined Hindi Translators Examination). Printed on journey-translator.html.
# Rules, classes and the money items / sources several careers share: _data/in/journey_common.yml.
# `money_defs` / `sources` below are used only by this career. Check: node scripts/check-journey-matrix.mjs
id: translator
v: 2
name: "Translator (Master's + translation diploma → SSC Combined Hindi Translators Exam)"
search: ["technical translator", "translator", "hindi translator", "junior hindi translator", "jht", "junior translation officer", "senior hindi translator", "ssc jht", "official language officer", "interpreter"]
page: "translator-interpreter.html"
roadmap: "roadmaps/translator-interpreter.html"
doubts_page: "journey-translator.html"
gate: "Strong Hindi and English from school → a degree with Hindi and English (as subjects or medium) → a Master's degree → a recognised Hindi–English translation diploma or certificate (or 2 years' government translation work) → SSC Combined Hindi Translators Examination → Junior Hindi Translator / Junior Translation Officer (Level 6)."
gate_source: cht26
core:
  what:
    text: "Government translators turn official documents, rules, reports and letters from English into Hindi and back. The Staff Selection Commission recruits them for central ministries, departments and the armed forces headquarters through the Combined Hindi Translators Examination."
    source: cht26
  day:
    - "Translate notes, letters, reports and rules between Hindi and English."
    - "Check translations done by others and keep the official terms consistent."
    - "Help the office follow official-language rules."
  pay:
    - { level: "Junior Hindi Translator / Junior Translation Officer / Junior Translator (SSC CHT 2026)", value: "Pay Level 6 · ₹35,400 – ₹1,12,400", source: cht26 }
    - { level: "Senior Hindi Translator / Senior Translator (SSC CHT 2026)", value: "Pay Level 7 · ₹44,900 – ₹1,42,400", source: cht26 }
  pay_note: "Private and freelance translation rates are not officially published."
  routes:
    - { title: "Junior posts (Level 6)", text: "Master's in Hindi with English at degree level, or Master's in English with Hindi at degree level, or a Master's in any subject with Hindi and English as subjects / medium at degree level — plus a recognised Hindi–English translation diploma / certificate or 2 years' translation work in government.", source: cht26 }
    - { title: "Senior posts (Level 7)", text: "The same Master's options plus a recognised translation diploma / certificate or 3 years' government translation work.", source: cht26 }
    - { title: "Where the jobs are", text: "Junior Translation Officer in the Central Secretariat Official Language Service and Armed Forces Headquarters, and translator posts in other central ministries, departments and organisations.", source: cht26 }
  cost_time:
    - { label: "SSC CHT exam fee", value: "₹100 (women, SC, ST, PwBD and ex-servicemen exempt)", source: cht26 }
    - { label: "Time after Class 12", value: "Bachelor's + Master's degree + a translation diploma / certificate", source: cht26 }
  cost_note: "Degree and translation-course fees differ by university, so they are not printed."
  challenges:
    - text: "You need a Master's degree before you can even apply."
      source: cht26
    - text: "Paper I has 0.25 negative marking per wrong answer, and Paper II is a descriptive translation and essay paper in both languages."
      source: cht26
    - text: "Vacancies are few: the 2026 notice listed 84 tentative vacancies (SSC may update them)."
      source: cht26
  not_for:
    - "You are strong in only one of Hindi or English."
    - "You dislike careful, word-by-word checking."
    - "You want a job straight after Class 12 — a Master's is required."
journey:
  - stages: [c8, c9]
    title: "Read and write both languages daily"
    do:
      - text: "SSC's Paper I tests understanding of the languages and literature, correct use of words, phrases and idioms, and the ability to write precisely — at degree level."
        source: cht26
    doubts:
      - q: "What does a government translator do?"
        a: "Translates official papers between Hindi and English for central ministries and departments. SSC recruits Junior Hindi Translators, Junior Translation Officers, Junior Translators and Senior Hindi Translators through the Combined Hindi Translators Examination."
        next: "Read the Routes list above."
        source: cht26
      - q: "How can I start preparing in school?"
        a: "Read and write in both Hindi and English every day. SSC's exam tests correct use of words, phrases and idioms and the ability to write and translate precisely in both languages."
        next: "Translate one short news item each week."
        source: cht26
  - stages: [c10]
    title: "Keep Hindi and English as subjects"
    do:
      - text: "Every eligibility route needs Hindi and English at degree level — as subjects or as the medium of examination."
        source: cht26
    stream: "Any stream; keep Hindi and English."
    doubts:
      - q: "Which stream should I choose to become a Hindi translator?"
        a: "Any stream works, because SSC accepts a Master's in any subject — but your degree must have Hindi and English as compulsory / elective subjects or as the medium of examination."
        next: "Keep both languages in Class 11–12 and in your degree."
        source: cht26
  - stages: [c11, c12]
    title: "Plan your degree with both languages"
    do:
      - text: "A Master's in Hindi needs English at degree level; a Master's in English needs Hindi at degree level."
        source: cht26
    doubts:
      - q: "Can I apply for SSC translator posts after a B.A.?"
        a: "No. Every post in the Combined Hindi Translators Examination needs a Master's degree, plus a translation diploma / certificate or government translation experience."
        next: "Plan for a Master's after your bachelor's."
        source: cht26
      - q: "Does my degree have to be in Hindi or English?"
        a: "No. A Master's in any other subject also works if Hindi and English were compulsory or elective subjects, or one was the medium of examination and the other a subject, at degree level."
        next: "Check your degree's subject list early."
        source: cht26
  - stages: [ug]
    title: "Degree, Master's and a translation diploma"
    do:
      - text: "Alongside the Master's, finish a recognised Hindi–English translation diploma or certificate course."
        source: cht26
    doubts:
      - q: "Is a translation diploma compulsory?"
        a: "You need either a recognised diploma / certificate in Hindi–English translation, or 2 years' translation work in a central or state government office (3 years for senior posts)."
        next: "Do the diploma during your Master's."
        source: cht26
      - q: "Are distance-learning degrees accepted?"
        a: "Yes, if the university is recognised and the programme was approved by UGC's Distance Education Bureau for the period you studied, as SSC's notice explains."
        next: "Confirm DEB approval before you enrol."
        source: cht26
  - stages: [grad]
    title: "SSC Combined Hindi Translators Examination"
    do:
      - text: "Paper I (computer-based, objective): General Hindi 100 and General English 100. Paper II (descriptive): translation and essay, 200 marks."
        source: cht26
      - text: "Final merit gives 50% weight to Paper I and 100% to Paper II."
        source: cht26
    exams:
      - { name: "SSC CHT 2026", when: "Apply 23 Apr – 14 May 2026 · Paper I (CBE) Aug – Sep 2026", source: cht26 }
    money: [cht-fee]
    doubts:
      - q: "What is the age limit for SSC translator posts?"
        a: "18 to 30 years on 1 August 2026 (born between 2 August 1996 and 1 August 2008), with the usual category relaxations."
        next: "Check the crucial date in each year's notice."
        source: cht26
      - q: "Is there negative marking in SSC CHT?"
        a: "Yes, 0.25 marks for each wrong answer in Paper I. Paper II is descriptive."
        next: "Answer only what you are sure of in Paper I."
        source: cht26
      - q: "What is in Paper II of SSC CHT?"
        a: "Two passages to translate — one Hindi to English and one English to Hindi — and an essay each in Hindi and English, for 200 marks in 2 hours."
        next: "Practise timed translations both ways."
        source: cht26
      - q: "How much is the SSC CHT fee?"
        a: "₹100. Women, SC, ST, PwBD and ex-servicemen eligible for reservation pay nothing."
        next: "Pay online before the fee deadline."
        source: cht26
      - q: "How is the final SSC CHT merit list made?"
        a: "Paper I shortlists candidates category-wise for Paper II. Final merit gives 50% weight to the Paper I score and 100% to Paper II marks; posts and departments are then allotted by merit and your preferences."
        next: "Treat Paper II as the decider."
        source: cht26
      - q: "How long is Paper I of SSC CHT?"
        a: "2 hours, with a sectional timer of 1 hour each for General Hindi and General English (2 hours 40 minutes for candidates eligible for a scribe)."
        next: "Practise each section within its own hour."
        source: cht26
  - stages: [work]
    title: "From junior to senior translator"
    do:
      - text: "Senior Hindi Translator / Senior Translator posts are Pay Level 7 and accept 3 years' government translation work in place of the diploma."
        source: cht26
    doubts:
      - q: "Can I become a senior translator directly?"
        a: "Yes. The same exam recruits Senior Hindi Translators / Senior Translators (Level 7). The Master's options are the same, plus a translation diploma / certificate or 3 years' government translation work."
        next: "Apply for both levels if you are eligible."
        source: cht26
      - q: "Can I choose to work in my home state?"
        a: "SSC does not collect state-wise or zone-wise vacancies; it allots ministries and departments by merit and preference. Ask the user department about state-wise posting."
        next: "Rank departments carefully when you fill preferences."
        source: cht26
board_note: "Any board and stream. Keep Hindi and English through Class 12 and your degree."
board_source: cht26
