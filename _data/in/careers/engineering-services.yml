sections:
  - id: "quick"
    hid: "quick-heading"
    alt: true
    eyebrow: "Quick answers"
    heading: "Engineering Services Officer at a glance"
    intro: "Check whether your Class 12 background qualifies. Duration and pay are in the summary at the top of the page."
    parts:
      - subhead: "Can I apply from my stream?"
      - streams:
          - label: "Science"
            fit: "Eligible"
            tone: "y"
            icon: "science"
          - label: "Commerce"
            fit: "Not eligible"
            tone: "n"
            icon: "commerce"
          - label: "Arts / Humanities"
            fit: "Not eligible"
            tone: "n"
            icon: "arts"
      - note: "Class 12 PCM leads to the B.E./B.Tech degree ESE requires."
  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What does an Engineering Services Officer do?"
    parts:
      - overview:
          points:
            - "ESE officers plan, build and maintain public infrastructure and systems — rail, roads, buildings, power, defence and telecom."
            - "They manage projects, contracts and technical teams, and rise into senior management of their departments."
            - "Postings move across India, from field sites to headquarters."
  - id: "who"
    hid: "who-heading"
    alt: true
    eyebrow: "Fit check"
    heading: "Who should become an Engineering Services Officer"
    parts:
      - fit:
          match:
            - "Have strong engineering fundamentals."
            - "Want a secure Group A government career with responsibility."
            - "Can prepare consistently for a long exam."
          mismatch:
            - "Want a start-up or private-sector pace."
            - "Dislike transfers across India."
            - "Are not in one of the four ESE streams."
  - id: "eligibility"
    hid: "elig-heading"
    eyebrow: "Eligibility"
    heading: "What you need, stage by stage"
    parts:
      - elig_list:
          - "A <strong>degree in engineering</strong> from a recognised university, or an equivalent the notice accepts (some posts accept specific M.Sc degrees)."
          - "Age limits and relaxations as per the current UPSC notice."
          - "Medical and physical standards for the services you choose."
  - id: "roadmap"
    hid: "roadmap-heading"
    alt: true
    eyebrow: "Step-by-step"
    heading: "Your full path to becoming an Engineering Services Officer"
    parts:
      - steps:
          - title: "Class 12 PCM"
            text: "Engineering entrance exams."
          - title: "B.E./B.Tech"
            text: "Civil, Mechanical, Electrical or Electronics & Telecom."
          - title: "ESE Prelims"
            text: "General studies & engineering aptitude, plus your discipline paper."
          - title: "ESE Mains"
            text: "Two conventional discipline papers."
          - title: "Personality test"
            text: "Interview by UPSC."
          - title: "Training and posting"
            text: "Department training, then field posting."
      - roadmap_card: "Engineering Services Officer"
  - id: "exams"
    hid: "exams-heading"
    eyebrow: "Exams & licences"
    heading: "UPSC Engineering Services Examination"
    parts:
      - chips:
          - label: "Stage I — Prelims"
            text: "Objective papers: general studies & engineering aptitude, and your engineering discipline."
            source: "upsc"
          - label: "Stage II — Mains"
            text: "Conventional (descriptive) papers in your discipline."
            source: "upsc"
          - label: "Stage III — Personality test"
            text: "Interview for those who qualify in the Mains."
            source: "upsc"
  - id: "salary"
    hid: "salary-heading"
    alt: true
    eyebrow: "Official pay level"
    heading: "Engineering Services Officer pay in India"
    intro: "ESE recruits Group A officers on the 7th CPC pay matrix."
    parts:
      - salary:
          - label: "Entry"
            value: "Level 10"
            text: "Group A central services start at Level 10 of the 7th CPC pay matrix (₹56,100 entry basic), plus DA, HRA and other allowances."
          - label: "Mid career"
            value: "Higher levels"
            text: "Promotions to senior time scale and administrative grades."
          - label: "Senior"
            value: "Apex levels"
            text: "Heads of engineering departments."
  - id: "jobs"
    hid: "jobs-heading"
    eyebrow: "Where they work"
    heading: "Employers & growth path"
    parts:
      - chips:
          - label: "Employers"
            text: "Central engineering departments and services in civil, mechanical, electrical and telecom streams"
          - label: "Growth path"
            text: "Assistant Executive Engineer → Executive Engineer → Superintending → Chief Engineer"
          - label: "Related exams"
            text: "GATE-based PSU recruitment and state engineering services"
  - id: "proscons"
    hid: "pc-heading"
    alt: true
    eyebrow: "Honest take"
    heading: "Advantages and disadvantages"
    parts:
      - proscons:
          pros:
            - "Group A status and job security."
            - "Large-scale infrastructure work."
            - "Clear promotion path."
          cons:
            - "Tough, multi-stage exam."
            - "Frequent transfers."
            - "Slower pay growth than top private jobs."
  - hid: "related-heading"
    alt: true
    eyebrow: "Related careers"
    heading: "If you're considering Engineering Services Officer, also look at"
    parts:
      - related:
          - name: "Civil Engineering"
            sub: "Infrastructure & construction"
            href: "civil.html"
          - name: "Mechanical Engineering"
            sub: "Machines & manufacturing"
            href: "mechanical.html"
          - name: "Electrical Engineering"
            sub: "Power systems"
            href: "electrical.html"
          - name: "Electronics Engineering"
            sub: "Devices & communication"
            href: "electronics.html"
  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Which branches can apply for ESE?"
            a: "Civil, Mechanical, Electrical, and Electronics & Telecommunication engineering streams."
          - q: "Can final-year students apply?"
            a: "Usually yes, subject to producing the degree by the date in the notice — check the current UPSC notice."
          - q: "Is ESE the same as GATE?"
            a: "No. ESE is a UPSC exam for Group A services; GATE is for postgraduate admission and some PSU hiring."
      - note: "*Pay figures are indicative unless they quote an official pay level, and rules change: confirm eligibility, dates and fees on the official websites listed under Sources before you act."
        class: "table-note mt-lg"
