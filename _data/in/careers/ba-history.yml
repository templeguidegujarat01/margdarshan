  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Is BA History a good choice if I want to prepare for UPSC?"
            a: "Yes. History is one of the most popular optional subjects for the UPSC Civil Services Mains exam, and the general studies papers also draw heavily on Ancient, Medieval and Modern Indian History, so the degree gives you a genuine head start on that syllabus."
          - q: "Do I need CUET to get into a good BA History college?"
            a: "For Delhi University and most central universities, yes — CUET (UG) scores decide admission, submitted through the DU CSAS portal or the respective university's counselling system. Many state and private universities instead admit directly on Class 12 marks."
          - q: "What jobs can I get with just a BA History degree?"
            a: "A plain BA History alone mostly leads to teaching (with a B.Ed), content and research roles, or entry-level government jobs via SSC/state exams. The stronger, more specialised outcomes — archivist, museum curator, archaeologist, heritage consultant, professor — usually need a master's degree or a specific certification on top."
          - q: "Can I become an archaeologist after BA History?"
            a: "Yes, but not directly. You would typically follow BA History with an MA in Ancient History, Archaeology or a related discipline, and many archaeologists also complete additional fieldwork training or a course through the Archaeological Survey of India or a university archaeology department."
          - q: "Is BA History or BA Political Science better for civil services?"
            a: "Neither is objectively better — both are strong, popular choices for UPSC aspirants. History suits students who enjoy narrative, causation and analysing long-term change; Political Science suits students more interested in current governance, institutions and constitutional structures. Many successful candidates choose based on genuine interest rather than a perceived scoring advantage."
      - note: "*Fee and salary figures are indicative, based on publicly available information as of 2026, and vary significantly by institution and admission cycle — always verify current figures on the official college or university website."
        class: "table-note mt-lg"
