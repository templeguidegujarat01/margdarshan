  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What does a DevOps Engineer actually do?"
    parts:
      - overview:
          points:
            - "DevOps combines Development and Operations — the role exists to eliminate the friction between writing code and running it reliably in production."
            - "A DevOps Engineer automates build, test and deployment pipelines (CI/CD) so software ships fast without breaking, and keeps the underlying infrastructure stable as it scales."
            - "What most guides don't explain: this role has genuinely splintered into three distinguishable tracks by 2026 — <strong>traditional DevOps</strong> (CI/CD and infrastructure automation), <strong>SRE</strong> (reliability engineering, on-call, SLO ownership), and <strong>Platform Engineering</strong> (building internal developer platforms)."
          more:
            - "Each is called \"DevOps-adjacent\" but involves meaningfully different day-to-day work, and Platform Engineering in particular commands the biggest salary premium of the three, since relatively few engineers in India currently have that specific skill set."
  - id: "who"
    hid: "who-heading"
    alt: true
    eyebrow: "Fit check"
    heading: "Who should aim for a DevOps Engineer career"
    parts:
      - fit:
          match:
            - "Enjoy automation and systems thinking — making things run reliably at scale, not just writing features."
            - "Want real ownership over how software actually reaches users, not just how it's written."
            - "Are willing to build genuine CI/CD pipeline and Kubernetes project experience, since baseline certifications alone no longer differentiate candidates."
          mismatch:
            - "Want to avoid all on-call or production-incident responsibility — the SRE track specifically involves this directly."
            - "Expect a single certification like CKA to still be a strong differentiator on its own — it's increasingly just an expected baseline."
            - "Want pure software-writing without any infrastructure or ops involvement — the <a href=\"software-engineer.html\">Software Engineer</a> path is the closer match."
