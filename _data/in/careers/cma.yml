  - id: "pattern"
    hid: "pattern-heading"
    alt: true
    eyebrow: "Format"
    heading: "Exam pattern, frequency & validity"
    parts:
      - chips:
          - label: "Question mix"
            text: "Roughly 30% objective (MCQ) and 70% descriptive at Intermediate and Final; Foundation is a mix of objective and short-answer style questions."
          - label: "Exam mode"
            text: "Offline, centre-based examinations."
          - label: "Negative marking"
            text: "None at any level."
          - label: "Frequency"
            text: "Twice a year — June and December terms — for all three levels."
          - label: "Marks per paper"
            text: "100 marks each; each group total is out of 400."
          - label: "Registration validity"
            text: "Registration stays valid for a period set by ICMAI, with re-registration/revalidation options if you don't complete within that window — check the current prospectus for the exact duration."
  - id: "papers"
    hid: "papers-heading"
    eyebrow: "The rule that decides everything"
    heading: "Passing criteria"
    parts:
      - prose:
          - "<strong>The same rule applies at every level:</strong> you must score at least 40% in each individual paper <em>and</em> at least 50% in aggregate across that level or group."
          - list:
              - "Foundation: all 4 papers count together in one sitting. No exemption benefit is available at this level."
              - "Intermediate & Final: each group is passed or failed independently — you can clear Group 1 and re-attempt only Group 2 later."
              - "<strong>Exemption rule:</strong> score 60%+ in a paper but still miss your group's overall pass mark, and you're exempted from re-attempting that specific paper next time — but the exempted paper's marks are then counted as exactly 50 (not your original score) when your next attempt's aggregate is calculated."
            ticks: true
      - warn_box: "<strong>Common mistake:</strong> aiming for exactly 40% in every paper \"to be safe.\" A student scoring 55, 55, 55 and 35 across four papers fails the entire group despite a 50% aggregate — because one paper dipped below the 40% floor. Treat 40% as an absolute minimum, not a target."
        class: "warn reveal mt-lg"
      - note: "Exemption validity periods and exact conditions are detailed in the current ICMAI prospectus — verify before relying on carry-forward marks for attempt planning."
  - id: "training"
    hid: "training-heading"
    alt: true
    eyebrow: "Hands-on requirement"
    heading: "Practical training"
    parts:
      - prose:
          - "CMA requires a total of about <strong>15 months of practical training</strong>, typically completed after clearing Intermediate:"
          - list:
              - "At least 10 months must be completed before you can apply to register for the CMA Final exams."
              - "The remaining 5 months can be completed before your Final results are declared, or even during early employment."
              - "Training can be done under a practising Cost Accountant or firm, a government body, Public Sector Undertaking (PSU), bank, Non-Governmental Organisation (NGO), educational institution, or a management consultancy meeting ICMAI's criteria."
              - "Training doesn't have to be continuous with a single employer — students may change training organisations up to a permitted number of times."
            ticks: true
      - note: "This is notably shorter than CA's roughly 2-year articleship, and is one reason CMA is often completed faster end-to-end than CA."
