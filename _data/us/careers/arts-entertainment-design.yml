        steps:
          - { tag: "Start", title: "High school: art and drawing", text: "", kind: start, source: ooh_interior }
          - { tag: "About 4 years", title: "Bachelor's in interior design (CIDA-accredited is quickest to the exam)", text: "Courses in interior design, drawing and computer-aided design (CAD). CIDQ's routes need 60 semester (90 quarter) interior design credit hours.", kind: stage, source: cidq_handbook }
          - { tag: "Final year", title: "NCIDQ IDFX (optional early start)", text: "Route 2: students in the final year of an interior design degree may apply for the IDFX alone.", kind: exam, source: cidq_apply, href: "us/professional-licenses/interior-design/#exams", link: "NCIDQ details" }
          - { tag: "2 to 4 years", title: "Supervised work experience", text: "3,520 hours (2 years full-time) after a CIDA-accredited bachelor's or master's; more after other routes (up to 7,040 hours after an associate's, certificate or diploma).", kind: stage, source: cidq_handbook }
          - { tag: "Exam", title: "NCIDQ IDIX and IDPX", text: "All three sections must be passed within your eligibility period.", kind: exam, source: cidq_eligibility }
          - { tag: "Goal", title: "Registered or licensed interior designer", text: "In a regulated jurisdiction; elsewhere the NCIDQ certificate is voluntary.", kind: goal, source: cidq_jurisdictions, href: "us/professional-licenses/interior-design/", link: "Interior design license" }
