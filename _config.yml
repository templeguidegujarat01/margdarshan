title: Margdarshan
description: "Free career guidance platform for Indian students after Class 10 and Class 12"
lang: en

# GitHub Pages runs Jekyll automatically for this repo — no extra setup needed.
# This file just keeps the build predictable and avoids Jekyll doing anything
# we don't want (like treating dotfiles or the README as pages).

exclude:
  - README.md
  - LICENSE

# Every .html file in the repo root already has its own explicit <head>, meta
# tags, JSON-LD schema, breadcrumb and content — none of them use a Jekyll
# "layout", they just pull in the shared header/footer/breadcrumb/scripts via
# {% include %}. So no `layouts:` / `defaults:` section is needed here.
