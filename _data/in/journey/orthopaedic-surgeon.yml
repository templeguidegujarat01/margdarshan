# Journey Blueprint — Orthopaedic Surgeon (MBBS → NEET-PG → M.S. Orthopaedics). Printed on journey-orthopaedic-surgeon.html.
# Rules, classes and the money items / sources several careers share: _data/in/journey_common.yml.
# NEET-PG (npg26), PGMER 2023 (pgmer23) and their money items live in journey/gynaecologist.yml — reused here.
id: orthopaedic-surgeon
v: 2
name: "Orthopaedic Surgeon (MBBS → NEET-PG → M.S. Orthopaedics)"
search: ["orthopaedic surgeon", "orthopedic surgeon", "orthopaedics", "orthopedics", "bone doctor", "ms ortho", "sports injury doctor"]
search_not: ["orthotist", "prosthetist"]
page: "neet-pg.html"
doubts_page: "journey-orthopaedic-surgeon.html"
gate: "Class 12 with Physics, Chemistry and Biology → NEET (UG) → MBBS with a 12-month internship → NEET-PG → a 3-year M.S. (Orthopaedics). M.Ch. courses such as Hand Surgery or Paediatric Orthopaedics take M.S. (Orthopaedics) as the feeder."
gate_source: [neet-ib, npg26, pgmer23]
core:
  what:
    text: "An orthopaedic surgeon is a doctor who treats bones, joints, muscles and injuries, medically and by operation. M.S. (Orthopaedics) is a recognised broad-speciality degree under the National Medical Commission's PG regulations."
    source: pgmer23
  day:
    - "Treat fractures, sports injuries and joint disease in clinics and emergency."
    - "Operate — fixing fractures, replacing joints, repairing ligaments."
    - "Follow patients through plaster, physiotherapy and recovery."
  pay:
    - { level: "Specialist Grade III (Orthopaedics), Central Health Service — UPSC 2026", value: "Level 11 of the Pay Matrix plus NPA", source: upsc-adv07 }
  pay_note: "Private salaries are not officially published."
  routes:
    - { title: "MBBS → NEET-PG → M.S. (Orthopaedics)", text: "NEET-PG is the single entrance for M.D. / M.S. / PG Diploma seats: All India 50% quota, state quota, private and deemed universities and Armed Forces medical institutions.", source: npg26 }
    - { title: "Institutes outside NEET-PG", text: "AIIMS New Delhi and the other AIIMS, PGIMER Chandigarh, JIPMER Puducherry, NIMHANS and SCTIMST are not filled through NEET-PG.", source: npg26 }
    - { title: "Central Health Service", text: "UPSC Advt 07/2026: 4 Specialist Grade III (Orthopaedics) posts and 2 Assistant Professor (Orthopaedics) posts at the Sports Injury Centre, VMMC & Safdarjung Hospital — MBBS plus M.S. / DNB / diploma in Orthopaedics and 3 years' experience after the PG degree (5 after a diploma).", source: upsc-adv07 }
    - { title: "Super-speciality", text: "M.S. / DNB (Orthopaedics) is the feeder for M.Ch. (Hand Surgery) and M.Ch. (Paediatric Orthopaedics).", source: pgmer23 }
  cost_time:
    - { label: "Time after Class 12", value: "MBBS with internship, then 3 years of M.S.; an M.Ch. adds 3 years", source: pgmer23 }
    - { label: "NEET-PG 2026 fee", value: "₹3,500 General / OBC / EWS · ₹2,500 SC / ST / PwBD", source: npg26 }
  cost_note: "College fees for MBBS and M.S. differ by college and state, so none are printed."
  challenges:
    - text: "Central specialist posts ask for experience too: 3 years after the PG degree for Specialist Grade III."
      source: upsc-adv07
    - text: "Every M.S. student does a compulsory 3-month District Residency in a district hospital."
      source: pgmer23
    - text: "NEET-PG has negative marking: +4 for a correct answer and −1 for a wrong one."
      source: npg26
  not_for:
    - "You dislike long hours in operation theatres and emergency."
    - "You cannot commit to MBBS plus 3 more years of surgical residency."
    - "You want a job straight after Class 12."
journey:
  - stages: [c8, c9]
    title: "Science and stamina"
    do:
      - text: "NEET (UG) tests Physics, Chemistry and Biology (Botany & Zoology) — 180 compulsory questions in 180 minutes."
        source: neet-ib
    doubts:
      - q: "What does an orthopaedic surgeon treat?"
        a: "Bones, joints, muscles and injuries. It is a surgical speciality: after MBBS a doctor takes M.S. (Orthopaedics), a degree recognised under NMC's PG regulations."
        next: "Plan the medical route: Biology in Class 11–12, then NEET (UG)."
        source: pgmer23
  - stages: [c10]
    title: "Choose PCB in Class 11"
    do:
      - text: "NEET (UG) needs Physics, Chemistry and Biology in Class 12."
        source: neet-ib
    stream: "Science with Physics, Chemistry, Biology (PCB)."
    doubts:
      - q: "Which stream do I need to become an orthopaedic surgeon?"
        a: "Science with Physics, Chemistry and Biology. MBBS admission is through NEET (UG), which tests those subjects."
        next: "Pick PCB after Class 10."
        source: neet-ib
  - stages: [c11, c12]
    title: "Prepare for NEET (UG)"
    do:
      - text: "NEET (UG) 2026: 180 questions, 720 marks, +4 for correct, −1 for wrong."
        source: neet-ib
    money: [neet-fee]
    doubts:
      - q: "Is there an upper age limit for NEET (UG)?"
        a: "No. You must be 17 by 31 December of the admission year, and the NEET (UG) 2026 bulletin says there is no upper age limit."
        next: "Check the lower age rule against your date of birth."
        source: neet-ib
      - q: "How many questions are in NEET (UG)?"
        a: "180 compulsory questions in 180 minutes, for 720 marks, with +4 for a correct answer and −1 for a wrong one."
        next: "Take timed full-length mocks."
        source: neet-ib
  - stages: [ug]
    title: "MBBS and internship"
    do:
      - text: "NEET-PG 2026 counted internship finished on or before 30 September 2026 for eligibility."
        source: npg26
    money: [mbbs-intern]
    doubts:
      - q: "Can I choose orthopaedics during MBBS?"
        a: "No. You choose the speciality after MBBS, when you take an M.S. (Orthopaedics) seat through NEET-PG counselling."
        next: "Focus on finishing MBBS and the internship."
        source: [npg26, pgmer23]
      - q: "Do I need to finish internship before NEET-PG?"
        a: "Yes, by the cut-off date in that year's bulletin. For NEET-PG 2026 it was 30 September 2026."
        next: "Plan your internship dates around the NEET-PG cut-off."
        source: npg26
  - stages: [grad]
    title: "NEET-PG and M.S. (Orthopaedics)"
    do:
      - text: "NEET-PG 2026: 180 MCQs in 3 hours 30 minutes, English only, +4 / −1; exam on 30 August 2026, result by 30 September 2026."
        source: npg26
      - text: "M.S. courses run 3 years and include a compulsory 3-month District Residency."
        source: pgmer23
    exams:
      - { name: "NEET-PG 2026", when: "30 Aug 2026 · result by 30 Sep 2026", source: npg26, href: "neet-pg.html" }
    money: [npg-fee, pg-stipend]
    doubts:
      - q: "What is the NEET-PG qualifying percentile?"
        a: "50th percentile for General and EWS, 45th for UR PwBD, and 40th for SC, ST and OBC candidates."
        next: "A good rank, not just qualifying, decides an orthopaedics seat."
        source: npg26
      - q: "Can I write NEET-PG in Hindi?"
        a: "No. The NEET-PG 2026 questions were in English only — 180 multiple-choice questions with four options each."
        next: "Practise medical MCQs in English."
        source: npg26
      - q: "Can a state college hold its own entrance for M.S. Orthopaedics?"
        a: "No. The NEET-PG 2026 bulletin says no state government, private college or university may hold a separate entrance for its M.D. / M.S. / PG Diploma seats for 2026-27."
        next: "Prepare only for NEET-PG (or INI-CET for the AIIMS group)."
        source: npg26
      - q: "How long is M.S. Orthopaedics?"
        a: "Three years under NMC's PGMER 2023, including a 3-month District Residency Programme in the 3rd, 4th or 5th semester."
        next: "Plan for three years of residency."
        source: pgmer23
      - q: "Is a diploma in orthopaedics still available?"
        a: "Orthopaedics (D.Ortho.) is still on NMC's list of PG diplomas, but colleges may convert diploma seats to degree seats and no new diploma programmes are being permitted."
        next: "Aim for M.S. seats in counselling."
        source: pgmer23
      - q: "Are PG residents paid?"
        a: "Yes. PGMER 2023 says PG students are paid a stipend at par with PG students of government medical colleges in that state."
        next: "Ask your college for the current rate."
        source: pgmer23
  - stages: [work]
    title: "Government posts and super-speciality"
    do:
      - text: "UPSC's Specialist Grade III (Orthopaedics) posts in 2026 paid Level 11 plus NPA, with an upper age of 40 (UR), 43 (OBC) and 45 (ST)."
        source: upsc-adv07
    doubts:
      - q: "How do I get a central government orthopaedic surgeon job?"
        a: "Through UPSC selections for the Central Health Service. Advt 07/2026 had 4 Specialist Grade III (Orthopaedics) posts needing MBBS, M.S. / DNB / diploma in Orthopaedics and 3 years' experience after the PG degree."
        next: "Watch UPSC recruitment advertisements after you gain experience."
        source: upsc-adv07
      - q: "Is there a government post in sports injury?"
        a: "Yes. UPSC Advt 07/2026 had 2 Assistant Professor (Orthopaedics) posts at the Sports Injury Centre, VMMC & Safdarjung Hospital, needing M.S. or DNB (Orthopaedics)."
        next: "Build experience in sports injury or sports medicine."
        source: upsc-adv07
      - q: "What can I study after M.S. Orthopaedics?"
        a: "M.Ch. courses that take M.S. / DNB (Orthopaedics) as feeder, such as M.Ch. (Hand Surgery) and M.Ch. (Paediatric Orthopaedics)."
        next: "Sit the super-speciality entrance after M.S."
        source: pgmer23
board_note: "Any board. NEET (UG) needs Physics, Chemistry and Biology in Class 12."
board_source: neet-ib
