doubts:
  - { q: "Can Indian students get a scholarship in Indonesia?", a: "Yes, the Government of Indonesia's KNB scholarship is open to students from developing countries, with a recommendation from the Indonesian Embassy.", source: knb }
  - { q: "Can I work while studying in Indonesia?", a: "No. The study visa does not allow work in Indonesia.", source: evisa_study }
  - { q: "How much is the Indonesian study visa?", a: "On the official eVisa site, IDR 6,000,000 for 1 year, 8,500,000 for 2 years and 12,000,000 for 4 years.", source: evisa_study }
