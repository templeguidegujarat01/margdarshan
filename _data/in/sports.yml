  # ------------------------------------------------------------------------------------------------ Squash
  - slug: squash
    short: "Squash"
    domain: solo
    checked: 2026-10-17
    body: "World Squash Federation (WSF) · Squash Rackets Federation of India (SRFI)"
    card: "World Squash 2025 rules — 11-point games, lets and strokes, eyewear — the new LA28 Olympic event (16 per gender), the PSA top-50 rule, and India's five Asian Games 2026 medals."
    card_facts: ["Olympic debut at LA28", "Games to 11, best of 5", "PSA top 50 for LA28"]
    eyebrow: "Sports Cockpit · Solo, Track &amp; Pool · World Squash rules 2025 · LA28 qualification"
    title: "Squash — rules, the PSA ranking &amp; the first Olympic squash at LA28"
    lede: "Education Margdarshan's squash map for India in simple words: how a rally, game and match are scored, what a let and a stroke mean, the safety rules, how only 16 men and 16 women will reach squash's first Olympics at LA28, India's medals at the 2026 Asian Games, who pays and the awards and jobs."
    official:
      - { label: "World Squash Singles Rules 2025 (PDF)", url: "https://squash.nl/media/ot0ezdzh/250901_world-squash-rules-of-singles-squash-2025.pdf" }
      - { label: "LA28 squash qualification (PDF)", url: "https://olympic.org.na/uploads/documents/SQU-LA28-Qualification-System-170726-054235.pdf" }
    facts:
      - { label: "Olympic squash (LA28)", value: "<strong>16 men · 16 women</strong> — singles only", source: wsf-la28 }
      - { label: "Game", value: "<strong>11 points</strong>, win by 2 at 10-all", source: wsf-rules }
      - { label: "Match", value: "<strong>Best of 5 games</strong> (or best of 3)", source: wsf-rules }
      - { label: "Asian Games 2026", value: "<strong>2 silver, 3 bronze</strong> for India", source: "air-sq-silver,air-sq-team,air-sq-sf" }
    sections:
      - id: rules
        nav: "Rules &amp; scoring"
        eyebrow: "Core rules &amp; selection formats"
        heading: "How squash is scored — and what a let and a stroke are"
        parts:
          - p: "Squash is played by two players in a <strong>closed court</strong>. They take turns to hit the ball onto the <strong>front wall</strong>, above the <strong>tin</strong> (the low strip at the bottom) and below the out line, before it bounces twice."
            source: wsf-rules
          - list:
              - "<strong>Every rally scores a point</strong> — the winner of a rally scores 1 point and serves next."
              - "A game is played to <strong>11 points</strong>; at <strong>10-all</strong> you must win by 2."
              - "A match is normally <strong>best of 5 games</strong>, sometimes best of 3. There are <strong>2 minutes</strong> between games; at most 2 minutes to change broken equipment such as glasses."
            source: wsf-rules
          - table:
              caption: "Let or stroke — what happens when a player gets in the way"
              head: ["Call", "When", "Result"]
              rows:
                - ["<strong>No let</strong>", "No real interference, or the striker could not have reached the ball", "Rally lost by the striker"]
                - ["<strong>Let</strong>", "Interference, but the opponent was making every effort to get out of the way", "Rally is replayed"]
                - ["<strong>Stroke</strong>", "The opponent did not make every effort to clear, and the striker could have made a good return", "Point to the striker"]
            source: wsf-rules
          - list:
              - "Ask for it by saying <strong>'Let, please'</strong> without delay. The referee can also give a let or a stroke without a request."
              - "Protective <strong>eyewear</strong> is <strong>compulsory</strong> in all WSF junior and doubles events, and recommended for everyone."
            source: wsf-rules
      - id: recognition
        nav: "Recognition"
        eyebrow: "Institutional &amp; global recognition"
        heading: "First Olympics at LA28 — and India's Asian Games medals"
        parts:
          - table:
              caption: "LA28 Olympic squash — the hard numbers"
              head: ["Rule", "What it says"]
              rows:
                - ["Events", "Men's singles and women's singles"]
                - ["Places", "<strong>16 per gender</strong>; usually one per country, at most two"]
                - ["Basic rule", "Be in the <strong>PSA world top 50</strong> on <strong>22 May 2028</strong> (exceptions: universality, final qualifier)"]
                - ["Continental route", "The <strong>2026 Asian Games singles champion</strong> (and the other continental Games winners) gets a place, if eligible on 22 May 2028"]
                - ["Ranking route", "8 places per gender from the PSA ranking of 22 May 2028"]
                - ["Last chance", "One place per gender from a 24-player Final World Qualifying Tournament"]
            source: wsf-la28
          - list:
              - "<strong>Asian Games 2026</strong>: <strong>Abhay Singh</strong> (men) and <strong>Anahat Singh</strong> (women, aged 18) won singles <strong>silver</strong>, losing both finals to Malaysia; India's men's and women's teams won <strong>bronze</strong>, and <strong>Joshna Chinappa and Velavan Senthilkumar</strong> won mixed-doubles <strong>bronze</strong>."
            source: "air-sq-silver,air-sq-team,air-sq-sf"
          - table:
              caption: "Government cash award for a senior squash medal (₹ lakh)"
              head: ["Event", "Gold", "Silver", "Bronze"]
              rows:
                - ["<strong>Olympic Games</strong>", "75", "50", "30"]
                - ["Asian Games / Commonwealth Games", "30", "20", "10"]
                - ["World Individual Championship (every year)", "10", "7", "4"]
            source: myas-cash
          - note: "The Ministry also lists the World Team, Asian Team, Asian Individual and doubles championships for squash."
            source: myas-cash
      - id: eligibility
        nav: "Ranking &amp; safety"
        eyebrow: "Physical benchmarks &amp; anti-doping"
        heading: "Ranking, safety and anti-doping"
        parts:
          - list:
              - "For the Olympics the key number is the <strong>PSA world ranking</strong> — be inside the top 50 on <strong>22 May 2028</strong>. Universality places need a top-75 ranking."
            source: wsf-la28
          - list:
              - "Wear eyewear made to a proper national standard; it is <strong>mandatory</strong> in junior and doubles events."
            source: wsf-rules
          - list:
              - "Under the anti-doping code you must be <strong>available for testing</strong> and check every medicine against the <strong>Prohibited List</strong>; apply to NADA for a <strong>TUE</strong> if you need a banned medicine."
            source: nada-rr
      - id: roadmap
        nav: "Roadmap"
        eyebrow: "Grassroots-to-elite pipeline"
        heading: "From the club court to the PSA tour"
        parts:
          - table:
              caption: "The squash ladder"
              head: ["Step", "What happens"]
              rows:
                - ["1. Club &amp; state", "Learn at a club, academy or state-association court (SAI centres do not offer squash)"]
                - ["2. PSA events", "Play PSA tour events to earn world-ranking points — e.g. Velavan Senthilkumar won the PSA Budapest Open"]
                - ["3. India team", "Asian Games, Asian and World Championships"]
                - ["4. LA28", "PSA top 50 by 22 May 2028, or a continental title"]
            source: "sai-schemes,air-sq-psa,air-sq-silver,wsf-la28"
      - id: academies
        nav: "Where to train"
        eyebrow: "Training centres &amp; cities"
        heading: "Where squash players train"
        parts:
          - list:
              - "Squash is not among the sports at SAI's National Centres of Excellence or SAI Training Centres, so players train at clubs, academies and state-association courts."
            source: sai-schemes
      - id: costs
        nav: "Cost"
        eyebrow: "Equipment costs &amp; who pays"
        heading: "Courts, rackets and who pays"
        parts:
          - list:
              - "Costs come from court time, coaching, rackets, shoes, eyewear and travel to PSA events. Education Margdarshan does not print shop prices — no governing body publishes them."
            source: wsf-rules
          - table:
              caption: "Who pays — squash ladder"
              head: ["Stage", "Paid by", "What you get"]
              rows:
                - ["Khelo India athlete", "Ministry of Youth Affairs &amp; Sports", "<strong>₹6.28 lakh a year</strong> incl. ₹1.20 lakh cash"]
                - ["Olympic prospect (LA28 is squash's first Games)", "TOPS Core Group", "<strong>₹50,000 a month</strong> + approved training plan"]
                - ["Athlete in hardship", "PDU National Welfare Fund", "Up to ₹2.50 lakh"]
            source: pib-support
      - id: earnings
        nav: "Earnings &amp; jobs"
        eyebrow: "Earning channels &amp; central job quotas"
        heading: "Awards, pension and sports-quota jobs"
        parts:
          - list:
              - "Squash is one of the <strong>65 sports</strong> in the central sports quota for <strong>Group C</strong> posts, with up to 5 years' age relaxation (10 for SC/ST)."
              - "Medals at the Olympics, Asian Games, Commonwealth Games or World Championships can bring up to <strong>three out-of-turn promotions</strong>."
            source: dopt-2022
          - list:
              - "<strong>Pension to Meritorious Sportspersons</strong>: ₹12,000–20,000 a month after retirement."
            source: pib-support
      - id: traps
        nav: "Red flags"
        eyebrow: "Disqualification traps"
        heading: "Mistakes that cost squash players"
        parts:
          - list:
              - "<strong>Not clearing</strong> after your shot — the referee can give a <strong>stroke</strong> (a point) to your opponent."
              - "<strong>Playing juniors without eyewear</strong> — it is compulsory."
              - "<strong>Asking for a let late</strong>, or when you could not have reached the ball — no let."
            source: wsf-rules
          - list:
              - "<strong>Ignoring the PSA ranking</strong> — LA28 needs a world top-50 ranking on 22 May 2028."
            source: wsf-la28
      - id: doubts
        nav: "Player doubts"
        eyebrow: "Real-world player doubts"
        heading: "Olympics, money and jobs — straight answers"
        parts:
          - qa:
              q: "Squash is in the Olympics now. How do I get there?"
              a: "LA28 is squash's first Olympics, with only <strong>16 players per gender</strong>. You need a <strong>PSA world top-50</strong> ranking on 22 May 2028, or a continental title — the 2026 Asian Games singles titles went to Malaysia, with India's Abhay Singh and Anahat Singh taking silver. A last place per gender comes from a world qualifying tournament."
            source: "wsf-la28,air-sq-silver"
          - qa:
              q: "Which government jobs can squash get me?"
              a: "<strong>Central Group C posts</strong> under DoPT rules list squash among 65 sports. Neither Western Railway's 2026-27 notice nor CRPF's 2026 sports quota had squash posts — read every recruiter's notice."
            source: "dopt-2022,rrc-wr26,crpf26"
          - table:
              caption: "Sports-quota job routes open in 2026 — age, qualifying results, pay"
              head: ["Route", "Age", "Main qualifying results", "Pay level"]
              rows:
                - ["Railways <strong>Level 5/4</strong> (graduates)", "18–25 on 1 Jan 2027", "Played the <strong>Olympics</strong>, or top 3 at a World Cup, World Championship, Asian Games, Commonwealth Games or Youth Olympics", "Level 5/4"]
                - ["Railways <strong>Level 3/2</strong> (12th, or 10th + apprenticeship)", "18–25 on 1 Jan 2027", "Top 3 at <strong>Senior, Youth or Junior Nationals</strong>, National Games or All India Inter-University; or Federation Cup gold", "Level 3/2"]
                - ["Railways <strong>Level 1</strong>", "18–25 on 1 Jan 2027", "Played for your state and finished <strong>at least 8th at Senior Nationals</strong>; or top 3 at the Federation Cup", "Level 1"]
                - ["CRPF <strong>Head Constable (GD)</strong> (10+2)", "18–23 on 1 Aug 2026; sportspersons get <strong>+5 years</strong> (OBC +8, SC/ST +10)", "Played for India; or top 3 for your state at Nationals or National Games; or <strong>gold/silver at Junior Nationals</strong>", "Level 4 · ₹25,500–81,100"]
                - ["CRPF <strong>Constable (GD)</strong> (10th pass)", "18–23 on 1 Aug 2026; sportspersons get <strong>+5 years</strong> (OBC +8, SC/ST +10)", "Played for your state at <strong>Senior or Junior Nationals</strong>; or top 3 at SGFI school nationals or Khelo India Games", "Level 3 · ₹21,700–69,100"]
            source: "rrc-wr26,crpf26"
          - note: "Railways count results from <strong>1 April 2024</strong>; CRPF counts the <strong>two years before 30 September 2026</strong>. Railways fee ₹500 (₹400 back if you attend the trial; ₹250, refunded in full on attending, for SC/ST, women, PwBD, minorities, ex-servicemen and EBC). CRPF fee ₹100 for UR/OBC/EWS men; free for women, SC, ST and ex-servicemen. CRPF picks sign a <strong>₹1 lakh bond to serve at least 3 years</strong>."
            source: "rrc-wr26,crpf26"
