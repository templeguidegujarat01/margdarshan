  # ---------------------------------------------------------------- UCEED (2027 cycle)
  # Phase 9 (read 15 Oct 2026). UCEED 2027 Information Brochure v1.0 (released 1 Oct 2026). NAT carries NO negative
  # marking (MSQ −1, MCQ −0.71). Any stream may sit UCEED, but IIT Guwahati / IIT Roorkee need PCM and IIITDM Jabalpur
  # PCM or PCB for B.Des admission.
  - slug: uceed
    short: "UCEED"
    stream: design
    checked: 2026-10-15
    body: "IIT Bombay (UCEED-CEED Office)"
    eyebrow: "Entrance Exam · Design · 2027 cycle"
    title: "UCEED — B.Des eligibility, paper pattern, reservation &amp; fees"
    lede: "The Undergraduate Common Entrance Exam for Design, run by IIT Bombay, is the only route into the B.Des programmes at IIT Bombay, IIT Delhi, IIT Guwahati, IIT Hyderabad, IIT Indore, IIT Roorkee and IIITDM Jabalpur. UCEED 2027 is on Sunday, 17 January 2027, for the 2027-28 batch."
    coaching_href: "coaching-design.html"
    colleges_href: "colleges-design.html"
    facts:
      - { label: "Conducted by", value: "IIT Bombay · UCEED-CEED Office", source: uc-ib }
      - { label: "Exam date", value: "Sun 17 Jan 2027 · 9 AM–12 noon", source: uc-ib }
      - { label: "Paper", value: "300 marks · Part-A CBT 200 + Part-B drawing 100", source: uc-ib }
      - { label: "Registration", value: "1–31 Oct 2026 · late fee till 6 Nov", source: uc-ib }
    official:
      - { label: "uceed.iitb.ac.in", url: "https://www.uceed.iitb.ac.in/2027/" }
      - { label: "Information Brochure 2027 (PDF)", url: "https://www.uceed.iitb.ac.in/2027/assets/downloads/docs/UCEED2027_Information_Brochure.pdf" }
    sections:
      - id: overview
        nav: "Overview"
        eyebrow: "Overview &amp; governing body"
        heading: "One test, seven B.Des programmes, a joint seat allocation"
        parts:
          - p: "<strong>UCEED 2027</strong> is conducted by the <strong>Indian Institute of Technology Bombay</strong> under the guidance of the UCEED-CEED Implementation Committee 2027. It is open to Indian and foreign nationals, and qualifying it is compulsory for B.Des admission at IIT Bombay, IIT Delhi, IIT Guwahati, IIT Hyderabad, IIT Indore, IIT Roorkee and IIITDM Jabalpur."
            source: uc-ib
          - p: "UCEED and B.Des admission are two separate steps. A rank does not give a seat: qualified candidates must apply again through the joint seat allocation run by the UCEED office. The score is valid only for 2027-28 admissions. Many other institutes also accept the UCEED score card."
            source: uc-ib
          - table:
              caption: "UCEED 2027 calendar"
              head: ["Event", "Date"]
              rows:
                - ["Online registration (regular fee)", "1 October 2026 (1 PM) – 31 October 2026"]
                - ["Late registration (₹500 extra)", "Up to 6 November 2026, 5 PM"]
                - ["Admit card", "From 1 January 2027, 1 PM"]
                - ["Exam", "Sunday, 17 January 2027, 9 AM – 12 noon"]
                - ["Draft answer key (Part-A) · comments", "19 January 2027 · till 21 January, 5 PM"]
                - ["Part-A shortlist", "4 February 2027"]
                - ["Result", "6 March 2027"]
                - ["B.Des application", "15 March – 12 April 2027"]
                - ["Seat allotment rounds", "21 April, 19 May, 14 June, 25 June, 9 July 2027 (tentative)"]
            source: uc-ib
          - note: "The exam is held only in 30 cities; you must pick three in order of preference, and the city cannot be changed after registration."
            source: uc-ib
      - id: eligibility
        nav: "Eligibility"
        eyebrow: "Academic eligibility"
        heading: "Class 12 in any stream to sit — but two IITs need PCM for the seat"
        parts:
          - list:
              - "<strong>Age:</strong> born on or after <strong>1 October 2002</strong> (Open, EWS, OBC-NCL) or on or after <strong>1 October 1997</strong> (SC, ST, PwD)."
              - "<strong>Attempts:</strong> at most two, and only in consecutive years."
              - "<strong>Qualifying exam:</strong> you must have appeared in Class 12 (or equivalent) for the first time in <strong>2026 or 2027</strong>, in <strong>any stream</strong> — Science, Commerce, or Arts &amp; Humanities. First appearance in 2025 or earlier makes you ineligible."
              - "Accepted equivalents include NIOS Senior Secondary (five subjects), H.S.C. vocational, GCE A-level, IB and a 3-year AICTE / State Board diploma — though the admitting institutes may not accept a 3-year diploma for the B.Des seat."
            source: uc-ib
          - table:
              caption: "Class 12 subjects needed for the B.Des seat (2027-28)"
              head: ["Institute", "Subjects in 10+2"]
              rows:
                - ["IIT Bombay, IIT Delhi, IIT Hyderabad, IIT Indore", "Any stream"]
                - ["IIT Guwahati, IIT Roorkee", "Physics, Chemistry, Mathematics"]
                - ["IIITDM Jabalpur", "Physics, Chemistry and Mathematics or Biology"]
            source: uc-ib
          - note: "Students in Class 12 in 2027 must submit proof of passing to the admitting institute by 30 September 2027."
            source: uc-ib
      - id: scheme
        nav: "Exam scheme"
        eyebrow: "Exam scheme &amp; marking matrix"
        heading: "Part-A on computer, Part-B drawn by hand — 3 hours, 300 marks"
        parts:
          - table:
              caption: "Part-A (computer-based, 2 hours, 200 marks)"
              head: ["Section", "Questions", "Correct", "Wrong", "Marks"]
              rows:
                - ["NAT — numerical answer", "14", "+4", "0 (no negative)", "56"]
                - ["MSQ — one or more correct", "15", "+4 (partial +3 / +2 / +1)", "−1", "60"]
                - ["MCQ — one correct", "28", "+3", "−0.71", "84"]
                - ["Total", "57", "", "", "200"]
            source: uc-ib
          - list:
              - "<strong>Part-B</strong> (1 hour, 100 marks): two questions — <strong>Sketching</strong> (50) and <strong>Design Aptitude</strong> (50). The questions appear on screen; you answer in a paper booklet. Only pencils and shades of black are allowed — no colours."
              - "Part-B is marked by two examiners independently (double-blind); a third or more join if they differ by over 10 marks. There is no re-evaluation of either part."
              - "Part-A syllabus: visualisation and spatial reasoning, practical and scientific knowledge, observation and design sensitivity, environment and society, analytical and logical reasoning, English, creativity."
            source: uc-ib
          - list:
              - "<strong>Shortlisting:</strong> a Part-A cut-off is worked out from the mean and standard deviation of all candidates' Part-A marks; OBC-NCL / EWS need 0.9 times and SC / ST / PwD 0.5 times the Open cut-off. If more than 6,400 clear it, only the top 6,400 (plus ties) go forward. Part-B of others is not marked."
              - "<strong>Part-B cut-off</strong> to qualify: 15 (Open), 13.5 (OBC-NCL / EWS), 7.5 (SC / ST / PwD) out of 100."
              - "<strong>Rank</strong> = Part-A + Part-B marks. Ties go to higher Part-B, then Section 2 (MSQ), then Section 1 (NAT)."
            source: uc-ib
      - id: reservation
        nav: "Reservation"
        eyebrow: "Reservation &amp; category quotas"
        heading: "Central quotas in every B.Des course, PwD 5% horizontal"
        parts:
          - table:
              caption: "Reserved seats in each course (Indian nationals)"
              head: ["Category", "Share of seats"]
              rows:
                - ["SC", "15%"]
                - ["ST", "7.5%"]
                - ["OBC-NCL (Central list)", "27%"]
                - ["GEN-EWS", "10%"]
                - ["PwD (40% or more, incl. severe dyslexia)", "5% within each of Open, EWS, OBC-NCL, SC, ST"]
            source: uc-ib
          - list:
              - "OBC-NCL and EWS certificates for B.Des admission must be issued on or after 1 April 2027; for the exam itself, on or after 1 April 2026."
              - "Vacant SC, ST, EWS and OBC-NCL seats are <strong>not</strong> transferred to other categories; unfilled PwD seats go back to the same category."
              - "Foreign nationals get supernumerary seats capped at 10% of each course; OCI / PIO cards issued before 4 March 2021 compete for Open seats. There are no female supernumerary seats, as women already exceed 20% of B.Des admits."
              - "There are no domicile or state quotas. IITs hold no spot round after counselling; IIITDM Jabalpur may hold one."
            source: uc-ib
      - id: fees
        nav: "Application &amp; fees"
        eyebrow: "Registration steps &amp; fees"
        heading: "₹4,000, or ₹2,000 for women and SC / ST / PwD"
        parts:
          - list:
              - "<strong>Step 1</strong> — create a login on uceed.iitb.ac.in and fill the form, choosing three exam cities."
              - "<strong>Step 2</strong> — upload a photo and signature (.jpg), age proof, a Class 12 certificate (or the Appendix 1 certificate if appearing in 2027) and any category / PwD certificate in the Central Government format (.pdf)."
              - "<strong>Step 3</strong> — pay online by 31 October 2026, or by 6 November 2026 (5 PM) with the ₹500 late fee. The category entered cannot be changed later."
            source: uc-ib
          - table:
              caption: "UCEED 2027 registration fee (non-refundable)"
              head: ["Candidate", "Fee"]
              rows:
                - ["Indian · female (all categories)", "₹2,000"]
                - ["Indian · SC / ST / PwD", "₹2,000"]
                - ["Indian · all others", "₹4,000"]
                - ["Foreign national (SAARC)", "US$ 200 (₹19,200)"]
                - ["Foreign national (non-SAARC)", "US$ 250 (₹24,000)"]
            source: uc-ib
          - p: "At B.Des seat allotment you pay a seat acceptance fee of <strong>₹65,000</strong> (GEN / EWS / OBC-NCL) or <strong>₹20,000</strong> (SC / ST / PwD), including a ₹5,000 non-refundable processing fee. It is adjusted against the institute fee when you join; withdrawing by Round IV refunds ₹60,000 / ₹15,000."
            source: uc-ib
      - id: horizons
        nav: "Institutes &amp; seats"
        eyebrow: "Career horizons &amp; mapped institutions"
        heading: "245 B.Des seats across seven institutes (2026-27 matrix)"
        parts:
          - table:
              caption: "B.Des seats in the previous year (2026-27), all categories"
              head: ["Institute", "Seats"]
              rows:
                - ["IIITDM Jabalpur", "66"]
                - ["IIT Guwahati", "56"]
                - ["IIT Bombay (IDC School of Design)", "37"]
                - ["IIT Hyderabad", "30"]
                - ["IIT Delhi", "20"]
                - ["IIT Roorkee", "20"]
                - ["IIT Indore (School of Innovation)", "16"]
                - ["Total", "245"]
            source: uc-ib
          - p: "The 2027-28 seat matrix will be published on the UCEED website at application time. IIT Bombay offers a 4-year B.Des and a 5-year B.Des + M.Des dual degree; IIT Delhi also admits to a B.Tech in Design through JEE Advanced, but only for candidates who have qualified UCEED in the same year. Fees are set by each institute."
            source: uc-ib
          - p: "Beyond the seven, 47 institutes shared UCEED 2026 results for their own B.Des admissions — among them IIIT Delhi, DTU, NSUT, CEPT University, Nirma University, FDDI Noida, Tezpur University, GGSIPU and MAHE Manipal."
            source: uc-ib
          - links:
              - { label: "Design college finder", url: "colleges-design.html" }
              - { label: "Design coaching finder", url: "coaching-design.html" }
              - { label: "NID DAT", url: "nid-dat.html" }
              - { label: "CEED (M.Des)", url: "ceed.html" }
              - { label: "NIFT", url: "nift.html" }
    sources:
      - { id: uc-ib, name: "IIT Bombay — UCEED 2027 Information Brochure (v1.0, 1 Oct 2026)", url: "https://www.uceed.iitb.ac.in/2027/assets/downloads/docs/UCEED2027_Information_Brochure.pdf", covers: "Participating institutes, calendar, cities, reservation, age / attempts / qualifying exam, stream rules, fees, paper pattern, marking, cut-offs, ranking, 2026-27 seat matrix, seat acceptance fee, result-sharing institutes", checked: 2026-10-15 }

  # ---------------------------------------------------------------- CEED (2027 cycle)
  # Phase 9 (read 15 Oct 2026). CEED 2027 Information Brochure v1.0 (1 Oct 2026). Any 3-year degree / diploma / PG
  # (or 5-year GD Art) qualifies — not only engineering or fine-arts degrees. No age limit, no attempt cap. CEED has no
  # seat matrix of its own: reservation is applied by each admitting institute; the brochure only relaxes cut-offs.
  # No coaching / college finder keys exist for M.Des, so the page has no finder dropdowns.
  - slug: ceed
    short: "CEED"
    stream: design
    checked: 2026-10-15
    body: "IIT Bombay (UCEED-CEED Office)"
    eyebrow: "Entrance Exam · Design · 2027 cycle"
    title: "CEED — M.Des eligibility, paper pattern, cut-offs &amp; fees"
    lede: "The Common Entrance Exam for Design is the qualifying test for M.Des programmes at IISc Bangalore, eight IITs and two IIITDMs, and for design Ph.D.s at several institutes. CEED 2027 is on Sunday, 17 January 2027; each institute then runs its own admission."
    facts:
      - { label: "Conducted by", value: "IIT Bombay · UCEED-CEED Office", source: ce-ib }
      - { label: "Exam date", value: "Sun 17 Jan 2027 · 9 AM–12 noon", source: ce-ib }
      - { label: "Final score", value: "25% Part-A + 75% Part-B", source: ce-ib }
      - { label: "Fee", value: "₹4,000 · ₹2,000 women / SC / ST / PwD", source: ce-ib }
    official:
      - { label: "ceed.iitb.ac.in", url: "https://www.ceed.iitb.ac.in/2027/" }
      - { label: "Information Brochure 2027 (PDF)", url: "https://www.ceed.iitb.ac.in/2027/downloads/CEED2027_Brochure.pdf" }
    sections:
      - id: overview
        nav: "Overview"
        eyebrow: "Overview &amp; governing body"
        heading: "A qualifying test — the M.Des seat comes from each institute"
        parts:
          - p: "<strong>CEED</strong> is conducted by <strong>IIT Bombay</strong> under the UCEED-CEED Implementation Committee (UCIC 2027). It tests visual perception, drawing, logical reasoning, creativity, communication and problem solving."
            source: ce-ib
          - p: "A CEED score alone does not give admission: institutes announce their own M.Des admissions and may hold further tests or interviews, and they verify eligibility and category documents. The score is valid for one year from the result."
            source: ce-ib
          - table:
              caption: "CEED 2027 calendar"
              head: ["Event", "Date"]
              rows:
                - ["Online registration (regular fee)", "1 October 2026 (1 PM) – 31 October 2026"]
                - ["Late registration (₹500 extra)", "Up to 6 November 2026, 5 PM"]
                - ["Admit card", "From 1 January 2027, 1 PM"]
                - ["Exam", "Sunday, 17 January 2027, 9 AM – 12 noon"]
                - ["Draft answer key (Part-A) · comments", "19 January 2027 · till 21 January, 5 PM"]
                - ["Part-A cut-off announced", "4 February 2027"]
                - ["Result", "3 March 2027"]
                - ["Score card download", "10 March – 31 July 2027"]
            source: ce-ib
      - id: eligibility
        nav: "Eligibility"
        eyebrow: "Academic eligibility"
        heading: "Any three-year degree or diploma — no age limit, no attempt cap"
        parts:
          - list:
              - "A <strong>graduate degree, diploma or postgraduate degree of at least three years after Class 12</strong> — completed, or with the final exam by July 2027. The brochure does not restrict the discipline."
              - "Or the <strong>5-year Government Diploma in Art (G.D. Art)</strong> after Class 10, passed by July 2027."
              - "<strong>No age limit</strong>, and you may take CEED <strong>any number of times</strong>."
            source: ce-ib
          - warn: "Admitting institutes can set stricter eligibility for their M.Des (for example a particular degree or marks). Check each programme's rules before you register."
            source: ce-ib
      - id: scheme
        nav: "Exam scheme"
        eyebrow: "Exam scheme &amp; marking matrix"
        heading: "Part-A: 1 hour on computer. Part-B: 2 hours on paper"
        parts:
          - table:
              caption: "Part-A (computer-based, 9–10 AM, 150 marks)"
              head: ["Section", "Questions", "Correct", "Wrong", "Marks"]
              rows:
                - ["NAT — numerical answer", "8", "+4", "0 (no negative)", "32"]
                - ["MSQ — one or more correct", "10", "+4 (partial +3 / +2 / +1)", "−1", "40"]
                - ["MCQ — one correct", "26", "+3", "−0.5", "78"]
                - ["Total", "44", "", "", "150"]
            source: ce-ib
          - table:
              caption: "Part-B (answer booklet, 10 AM–12 noon, 100 marks)"
              head: ["Question", "Marks"]
              rows:
                - ["Sketching", "20"]
                - ["Creativity", "20"]
                - ["Form Sensitivity", "20"]
                - ["Visual Sensitivity", "20"]
                - ["Problem Identification", "20"]
            source: ce-ib
          - list:
              - "Part-B is marked (with partial marks, no negatives) only for candidates who clear the Part-A cut-off, which is worked out from the mean and standard deviation of all Part-A marks. OBC-NCL / EWS need 0.9 times and SC / ST / PwD 0.5 times the general cut-off."
              - "<strong>Final score = 0.25 × Part-A + 0.75 × Part-B.</strong> All shortlisted candidates get a rank. There is no re-evaluation."
              - "Bring your own pens, pencils, sketch pens, colours and a clean drawing board; water colours are not allowed."
            source: ce-ib
      - id: reservation
        nav: "Reservation"
        eyebrow: "Reservation &amp; category quotas"
        heading: "Relaxed cut-offs in CEED; seat quotas at each institute"
        parts:
          - p: "CEED itself has no seat matrix. The brochure gives reserved categories a <strong>relaxed Part-A cut-off</strong> (0.9× for OBC-NCL / EWS, 0.5× for SC / ST / PwD) and requires EWS / OBC-NCL certificates issued on or after 1 April 2026, in the Central formats in its appendices."
            source: ce-ib
          - list:
              - "PwD candidates need a UDID card or a medical certificate showing at least 40% disability; severe, permanent dyslexia also counts with a college certificate."
              - "PwD candidates may get 20 minutes per hour extra, and a scribe for Part-A only — Part-B must be drawn by the candidate."
              - "The merit list is drawn up by the category you register in, so upload the right certificate."
            source: ce-ib
          - note: "The SC, ST, OBC-NCL and EWS seat shares are applied by each admitting IIT / IISc / IIITDM in its own M.Des admission notice, not by the CEED office."
            source: ce-ib
      - id: fees
        nav: "Application &amp; fees"
        eyebrow: "Registration steps &amp; fees"
        heading: "Register on ceed.iitb.ac.in by 31 October 2026"
        parts:
          - list:
              - "Upload a recent colour photo and signature (.jpg) and your degree / diploma certificate — or the final-year mark list, provisional certificate or a Principal / HoD certificate (Appendix 1) if you are still studying."
              - "Add category and PwD certificates as PDFs; a gazette notification, marriage certificate or passport if your name differs from the degree."
              - "Choose three exam cities in order — the city cannot be changed later."
            source: ce-ib
          - table:
              caption: "CEED 2027 registration fee (non-refundable)"
              head: ["Candidate", "Fee"]
              rows:
                - ["All women candidates", "₹2,000"]
                - ["SC / ST / PwD", "₹2,000"]
                - ["All others", "₹4,000"]
                - ["Late fee (1–6 November 2026)", "+ ₹500"]
            source: ce-ib
          - note: "UPI, credit card, debit card and net banking are accepted; bank charges are extra."
            source: ce-ib
      - id: horizons
        nav: "Institutes &amp; programmes"
        eyebrow: "Career horizons &amp; mapped institutions"
        heading: "M.Des at IISc, eight IITs and two IIITDMs"
        parts:
          - table:
              caption: "M.Des programmes that use CEED (2027 brochure)"
              head: ["Institute", "M.Des specialisations"]
              rows:
                - ["IISc Bangalore (Design &amp; Manufacturing)", "Product Design, Development &amp; Management"]
                - ["IIT Bombay (IDC School of Design)", "Animation, Communication, Industrial, Interaction, Mobility &amp; Vehicle Design; M.Des by Research"]
                - ["IIT Delhi", "Industrial Design"]
                - ["IIT Gandhinagar", "Integrated Design &amp; Technology"]
                - ["IIT Guwahati", "Design"]
                - ["IIT Hyderabad", "Visual, Product, Interaction Design; Photography, Film and Animation"]
                - ["IIT Jodhpur", "XR Design, Smart Product Design"]
                - ["IIT Kanpur", "Master of Design"]
                - ["IIT Roorkee", "Industrial Design"]
                - ["IIITDM Jabalpur", "Design"]
                - ["IIITDM Kancheepuram", "Integrated Product Design"]
            source: ce-ib
          - p: "Most of these departments also take CEED-qualified candidates for a Ph.D. in Design. The UCEED-CEED office does not handle M.Des admission or scholarships — contact the department."
            source: ce-ib
          - links:
              - { label: "UCEED (B.Des)", url: "uceed.html" }
              - { label: "NID DAT", url: "nid-dat.html" }
              - { label: "NIFT", url: "nift.html" }
    sources:
      - { id: ce-ib, name: "IIT Bombay — CEED 2027 Information Brochure (v1.0, 1 Oct 2026)", url: "https://www.ceed.iitb.ac.in/2027/downloads/CEED2027_Brochure.pdf", covers: "About CEED, paper structure, marking, shortlisting, final score, dates, cities, programmes, eligibility, fees, uploads, PwD provisions", checked: 2026-10-15 }

  # ---------------------------------------------------------------- NID DAT (2027-28 admissions)
  # Phase 9 (read 15 Oct 2026). NID Admissions Handbook 2027-28 (B.Des / 5.5-year Integrated M.Des, published 10 Sep 2026,
  # amendments to 24 Sep 2026). NID Ahmedabad / Gandhinagar / Bengaluru now admit to the 5.5-year Professional Education
  # Master of Design (Integrated Pathway), not a 4-year B.Des. DAT Mains = Studio Sensitivity Test + In-Person Sensitivity
  # Test; its weightage, the Prelims duration and the tie-break are "to be announced", so the page gives no marks split.
  # The NID fee-structure PDFs are scans (no text) and are left out.
  - slug: nid-dat
    short: "NID DAT"
    stream: design
    checked: 2026-10-15
    body: "NID Admissions Cell, Ahmedabad"
    eyebrow: "Entrance Exam · Design · 2027-28 admissions"
    title: "NID DAT — eligibility, Prelims &amp; Mains, reservation &amp; fees"
    lede: "The Design Aptitude Test is the common entrance for the undergraduate design programmes at the National Institutes of Design — the 5.5-year Integrated M.Des at NID Ahmedabad and the B.Des / Integrated M.Des at NID Andhra Pradesh, Assam, Haryana and Madhya Pradesh. DAT Prelims for 2027-28 is on Sunday, 20 December 2026."
    coaching_href: "coaching-design.html"
    colleges_href: "colleges-design.html"
    facts:
      - { label: "Conducted by", value: "NID Admissions Cell · common for all NIDs", source: nid-hb }
      - { label: "Apply by", value: "30 Nov 2026, 11:59 PM", source: nid-hb }
      - { label: "DAT Prelims", value: "Sun 20 Dec 2026 · pen and paper", source: nid-hb }
      - { label: "DAT Mains", value: "Studio + In-Person Sensitivity Tests", source: nid-hb }
    official:
      - { label: "admissions.nid.edu", url: "https://admissions.nid.edu/NIDA2027/Default.aspx" }
      - { label: "Admissions Handbook 2027-28 (PDF)", url: "https://admissions.nid.edu/NIDA2027/download/BDES_IntegratedPathway_AdmissionsHandbook2027_28.pdf" }
    sections:
      - id: overview
        nav: "Overview"
        eyebrow: "Overview &amp; governing body"
        heading: "One application, two stages, five NIDs"
        parts:
          - p: "<strong>NID Ahmedabad</strong> (with campuses at Gandhinagar and Bengaluru) is an <strong>Institute of National Importance under the NID Act, 2014</strong>, run as an autonomous institute of the Department for Promotion of Industry and Internal Trade (DPIIT), Ministry of Commerce &amp; Industry. NID Andhra Pradesh, Haryana, Madhya Pradesh and Assam are also autonomous DPIIT institutes of national importance."
            source: nid-hb
          - p: "The <strong>NID Admissions Cell</strong> runs one application and one DAT for all of them. <strong>DAT Prelims</strong> only shortlists — its score carries no weight later. Shortlisted candidates (2.5 times the seats in each category) take the <strong>DAT Mains</strong>, and each NID admits on the Mains score."
            source: nid-hb
          - table:
              caption: "Admissions 2027-28 calendar"
              head: ["Event", "Date"]
              rows:
                - ["Online application with fee", "10 September – 30 November 2026 (11:59 PM)"]
                - ["Window to edit the form", "1 December (4 PM) – 3 December 2026"]
                - ["DAT Prelims admit card", "From 10 December 2026, 4 PM"]
                - ["DAT Prelims", "Sunday, 20 December 2026"]
                - ["One-time window to fix a category certificate", "16 – 28 February 2027"]
                - ["DAT Prelims result", "16 March 2027, 4 PM"]
                - ["DAT Mains, Mains result, counselling", "To be announced"]
            source: nid-hb
          - note: "Applicants to the B.Des / Integrated M.Des cannot also apply for NID's 2.5-year M.Des — both tests are on the same day."
            source: nid-hb
      - id: eligibility
        nav: "Eligibility"
        eyebrow: "Academic eligibility"
        heading: "Class 12 in any stream, passed in the first attempt"
        parts:
          - list:
              - "<strong>Education:</strong> passed, or appearing in 2026-27, a higher-secondary (10+2) exam in <strong>any stream</strong> — Science, Arts, Commerce, Humanities — from a recognised board. Equivalents include NIOS (five subjects), H.S.C. vocational, GCE A-level and a 3-year AICTE diploma after Class 10."
              - "Class 12 must be passed <strong>in the first attempt</strong>, with the mark sheet in by <strong>15 July 2027</strong>. Any backlog, compartment or supplementary cancels the admission and forfeits the fees."
            source: nid-hb
          - table:
              caption: "Age limit (born on or after)"
              head: ["Category", "Born on or after"]
              rows:
                - ["General, GEN-EWS", "1 July 2006"]
                - ["OBC-NCL, SC, ST", "1 July 2003"]
                - ["PwD", "1 July 2001"]
                - ["Overseas (supernumerary)", "1 July 2006"]
            source: nid-hb
          - note: "Foreign citizens, OCI and PIO card holders apply only in the Overseas category (15 extra seats at NID Ahmedabad, one per discipline). NRIs with an Indian passport apply as Indian nationals."
            source: nid-hb
      - id: scheme
        nav: "Exam scheme"
        eyebrow: "Exam scheme &amp; marking matrix"
        heading: "Prelims on paper to shortlist; Mains in the studio and in person"
        parts:
          - table:
              caption: "The two DAT stages"
              head: ["Stage", "Format", "What it is used for"]
              rows:
                - ["DAT Prelims", "Paper-and-pencil test, same time at every centre; text and visual questions; English only", "Shortlisting only — 2.5 × seats per category"]
                - ["DAT Mains", "Studio Sensitivity Test + In-Person Sensitivity Test", "Final merit for admission"]
            source: nid-hb
          - list:
              - "The Prelims duration is printed on the admit card; the Mains weightages, schedule and the tie-break rule are to be announced later."
              - "You must take <strong>both</strong> Mains tests to enter the merit list."
              - "Merit lists are category-wise (General, GEN-EWS, OBC-NCL, SC, ST, PwD), with a separate list for Overseas candidates."
              - "Prelims re-totalling (only checking that every answer was marked and totalled) costs ₹2,000; no re-evaluation is done."
            source: nid-hb
          - p: "DAT Prelims is held in Ahmedabad, Bengaluru, Bhopal, Bhubaneswar, Chandigarh, Chennai, Dehradun, Hyderabad, Jaipur, Jorhat, Kochi, Kolkata, Lucknow, Mumbai, Nagpur, New Delhi and Patna."
            source: nid-hb
          - warn: "NID can change the schedule and the nature of the tests, or move them online or offline, in unforeseen circumstances. Check the admissions website before each stage."
            source: nid-hb
      - id: reservation
        nav: "Reservation"
        eyebrow: "Reservation &amp; category quotas"
        heading: "Central quotas, PwD 5%, and only OBC seats de-reserve"
        parts:
          - table:
              caption: "Reserved seats per discipline"
              head: ["Category", "Share", "9-seat discipline", "13-seat discipline (NID MP, Haryana)"]
              rows:
                - ["GEN-EWS", "10%", "1", "1"]
                - ["OBC-NCL", "27%", "2", "4"]
                - ["SC", "15%", "1", "2"]
                - ["ST", "7.5%", "1", "1"]
            source: nid-hb
          - list:
              - "<strong>PwD:</strong> 5% of all seats across Open, GEN-EWS, OBC-NCL, SC and ST, for disabilities under the RPwD Act 2016, with a UDID card or CMO certificate."
              - "Unfilled <strong>OBC-NCL</strong> seats go to the Open category; unfilled <strong>GEN-EWS, SC and ST</strong> seats are <strong>not</strong> de-reserved."
              - "EWS and OBC-NCL certificates must be in the Central format, issued on or after 1 April 2026 in the candidate's own name (the EWS one with the candidate's photo)."
              - "A wrong certificate moves you to General — unless you used the age relaxation, in which case the candidature is cancelled."
            source: nid-hb
          - note: "Seat counts for NID Andhra Pradesh and Assam are published on their own websites; the handbook's amendment gives the NID MP and NID Haryana figures."
            source: nid-hb
      - id: fees
        nav: "Application &amp; fees"
        eyebrow: "Registration steps &amp; fees"
        heading: "₹3,000 · ₹2,000 women · ₹1,500 SC / ST · ₹500 PwD"
        parts:
          - list:
              - "<strong>Step 1</strong> — sign up on admissions.nid.edu with programme, nationality and category; verify by OTP. Name, programme, date of birth, email and mobile can never be changed."
              - "<strong>Step 2</strong> — fill the form and pick a Prelims test centre."
              - "<strong>Step 3</strong> — upload a studio photograph and signature (JPG, 50–200 KB) and any category / PwD certificate (PDF, up to 1 MB)."
              - "<strong>Step 4</strong> — pay online (card or net banking) and print the auto-generated form; only then is the application complete."
            source: nid-hb
          - table:
              caption: "Application fee 2027-28 (one fee covers all NIDs, non-refundable)"
              head: ["Applicant", "Fee"]
              rows:
                - ["General, GEN-EWS, OBC-NCL", "₹3,000"]
                - ["Female (except SC, ST, PwD)", "₹2,000"]
                - ["SC and ST", "₹1,500"]
                - ["PwD", "₹500"]
                - ["Third gender", "₹500"]
                - ["Overseas (supernumerary)", "US$ 125"]
            source: nid-hb
          - note: "Changing category or gender in the edit window means paying any extra fee; excess fees are not refunded."
            source: nid-hb
      - id: horizons
        nav: "Campuses &amp; disciplines"
        eyebrow: "Career horizons &amp; mapped institutions"
        heading: "15 disciplines at NID Ahmedabad, plus four newer NIDs"
        parts:
          - table:
              caption: "NID Ahmedabad — 5.5-year Integrated M.Des, 9 seats per discipline"
              head: ["Stream", "Disciplines (campus)"]
              rows:
                - ["Industrial Design", "Ceramic &amp; Glass, Product (Ahmedabad); Transportation &amp; Automobile (Gandhinagar)"]
                - ["Communication Design", "Animation Film, Film &amp; Video Communication, Graphic Design (Ahmedabad)"]
                - ["Spatial Experience Design", "Exhibition, Furniture &amp; Interior (Ahmedabad); Retail Experience (Bengaluru)"]
                - ["Textile and Apparel Design", "Textile (Ahmedabad); Apparel, Lifestyle Accessory (Gandhinagar)"]
                - ["Digital Design Futures", "Digital Game, Interaction, Information Design (Bengaluru)"]
            source: nid-hb
          - list:
              - "<strong>NID Madhya Pradesh</strong> (Bhopal): Integrated M.Des in Communication Design (9 seats per discipline), Industrial Design and Textile &amp; Apparel Design (13 each)."
              - "<strong>NID Haryana</strong>: Integrated M.Des, 13 seats each in six disciplines across Industrial, Communication and Textile &amp; Apparel Design."
              - "<strong>NID Assam</strong> (Jorhat): 4-year B.Des in Industrial, Communication and Textile &amp; Apparel Design; intake 75."
              - "<strong>NID Andhra Pradesh</strong>: programmes and seats on nid.ac.in."
            source: nid-hb
          - links:
              - { label: "Design college finder", url: "colleges-design.html" }
              - { label: "Design coaching finder", url: "coaching-design.html" }
              - { label: "UCEED", url: "uceed.html" }
              - { label: "NIFT", url: "nift.html" }
    sources:
      - { id: nid-hb, name: "NID — Admissions Handbook 2027-28: 5.5-Year Integrated M.Des and B.Des (published 10 Sep 2026)", url: "https://admissions.nid.edu/NIDA2027/download/BDES_IntegratedPathway_AdmissionsHandbook2027_28.pdf", covers: "NID status, calendar, disciplines and seats, amendments (NID MP / Haryana), age and education rules, reservation and de-reservation, overseas seats, application steps, fees, DAT Prelims / Mains, centres, results", checked: 2026-10-15 }

  # ---------------------------------------------------------------- NCHM JEE (2026 cycle)
  # Phase 9 (read 15 Oct 2026). No NCHM JEE 2027 bulletin on exams.nta.nic.in/nchm-jee/ yet, so this is the 2026 cycle
  # (exam 25 Apr 2026; final key and result posted May 2026). The fee has no gender split. The 15 / 7.5 / 27 / 10 split
  # applies only at Central Government IHMs; State IHMs follow state policy. Annexure-II's institute table is partly
  # garbled in the PDF, so only clearly readable names and the bulletin's own counts are used. The NTA extension /
  # result notices are scans (titles only).
  - slug: nchmct-jee
    short: "NCHM JEE"
    stream: hospitality
    checked: 2026-10-15
    body: "National Testing Agency (NTA) for NCHMCT"
    eyebrow: "Entrance Exam · Hospitality · 2026 cycle"
    title: "NCHM JEE — B.Sc. HHA eligibility, paper pattern, reservation &amp; fees"
    lede: "The National Council for Hotel Management Joint Entrance Examination admits to the three-year B.Sc. in Hospitality &amp; Hotel Administration at the Institutes of Hotel Management affiliated to NCHMCT. NCHM JEE 2026 was held on 25 April 2026; the 2027 bulletin had not been published when this page was checked."
    coaching_href: "coaching-hotel.html"
    colleges_href: "colleges.html?stream=arts&amp;course=hotel"
    facts:
      - { label: "Conducted by", value: "NTA for NCHMCT (Ministry of Tourism)", source: nc-ib }
      - { label: "Exam (2026)", value: "Sat 25 Apr 2026 · CBT, 11 AM–1 PM", source: nc-ib }
      - { label: "Paper", value: "120 MCQs · English or Hindi", source: nc-ib }
      - { label: "Marking", value: "+4 correct · −1 wrong", source: nc-ib }
    official:
      - { label: "exams.nta.nic.in/nchm-jee", url: "https://exams.nta.nic.in/nchm-jee/" }
      - { label: "nchm.gov.in", url: "https://nchm.gov.in/" }
    sections:
      - id: overview
        nav: "Overview"
        eyebrow: "Overview &amp; governing body"
        heading: "NCHMCT sets the course, NTA runs the test"
        parts:
          - p: "The <strong>National Council for Hotel Management &amp; Catering Technology</strong> was set up in 1982 as an autonomous body under the <strong>Ministry of Tourism</strong>. It runs and regulates the B.Sc. Hospitality &amp; Hotel Administration and ten other courses at <strong>21 Central IHMs, 33 State Government IHMs, one PSU institute, two PPP-run SIHMs and 25 private IHMs</strong>."
            source: nc-ib
          - p: "NCHMCT has entrusted the <strong>National Testing Agency</strong> with NCHM JEE since 2019. All affiliated institutes accept its score for B.Sc. (HHA); seats are then allotted through NCHMCT's centralised online counselling on merit-cum-choice."
            source: nc-bsc
          - table:
              caption: "NCHM JEE 2026 timeline"
              head: ["Event", "Date"]
              rows:
                - ["Online application (as first notified)", "26 December 2025 – 25 January 2026"]
                - ["Exam (CBT)", "Saturday, 25 April 2026, 11 AM – 1 PM"]
            source: nc-ib
          - note: "NTA later extended the registration window (notice of 30 March 2026), released admit cards in April and posted the final answer key and the result in May 2026."
            source: nc-nta
      - id: eligibility
        nav: "Eligibility"
        eyebrow: "Academic eligibility"
        heading: "Class 12 in any stream with English — no age limit"
        parts:
          - list:
              - "Passed 10+2 or equivalent from a recognised board <strong>with English</strong> as a subject (core, elective or functional). No particular stream is required."
              - "Students appearing in Class 12 may sit the exam provisionally; proof of passing is due at counselling or admission, and by 30 September 2026 at the latest."
              - "<strong>No age limit</strong>, in line with the National Education Policy."
              - "Admitted candidates must give a physical-fitness certificate from a registered medical practitioner, as the course involves practical kitchen and service work."
            source: nc-ib
          - list:
              - "Accepted equivalents include Intermediate / Pre-University, GCE A-level, Cambridge HSC, NIOS or State Open School (five subjects including English) and H.S.C. vocational approved by NCVT / SCVT."
            source: nc-ib
      - id: scheme
        nav: "Exam scheme"
        eyebrow: "Exam scheme &amp; marking matrix"
        heading: "120 questions in 2 hours, 4 marks each"
        parts:
          - table:
              caption: "NCHM JEE 2026 paper (computer-based, 120 minutes)"
              head: ["Section", "Questions"]
              rows:
                - ["Numerical Ability and Analytical Aptitude", "15"]
                - ["Reasoning and Logical Deduction", "15"]
                - ["General Knowledge &amp; Current Affairs", "15"]
                - ["English Language", "45"]
                - ["Aptitude for Service Sector", "30"]
                - ["Total", "120"]
            source: nc-ib
          - list:
              - "Every question is a multiple-choice question worth <strong>4 marks</strong>; a wrong answer costs <strong>1 mark</strong> and an unanswered one scores nothing."
              - "The paper is in English and Hindi — the medium you choose in the form cannot be changed; the English version is final if a translation is unclear."
              - "If a question is dropped, everyone gets full marks for it; if the key changes, only answers matching the revised key score."
            source: nc-ib
      - id: reservation
        nav: "Reservation"
        eyebrow: "Reservation &amp; category quotas"
        heading: "Central quotas at Central IHMs; state rules at State IHMs"
        parts:
          - table:
              caption: "Reservation at Institutes run by the Central Government"
              head: ["Category", "Share of seats"]
              rows:
                - ["SC", "15%"]
                - ["ST", "7.5%"]
                - ["OBC-NCL (Central list)", "27%"]
                - ["GEN-EWS", "10%"]
                - ["PwD (40% or more)", "5% within each category"]
            source: nc-ib
          - list:
              - "PwD candidates must be able to do all the course practicals — cutting and cooking, bulk Indian cooking, bakery, restaurant service, bed making, cleaning and machine work, and computer reservations."
              - "One <strong>supernumerary seat in each Central IHM</strong> is kept for wards of Kashmiri Migrants and Kashmiri Pandit / Hindu families living in the Valley, who must still qualify NCHM JEE."
              - "Institutes run, aided or recognised by <strong>State Governments follow their state's reservation policy</strong>."
              - "Only castes in the Central list get the benefit; state-list OBCs not in the Central list must not choose OBC-NCL."
            source: nc-ib
      - id: fees
        nav: "Application &amp; fees"
        eyebrow: "Registration steps &amp; fees"
        heading: "₹1,000 · ₹700 EWS · ₹450 SC / ST / PwD"
        parts:
          - list:
              - "<strong>Step 1</strong> — register on exams.nta.nic.in/nchm-jee with your own email and mobile, and fill the form."
              - "<strong>Step 2</strong> — upload a photo (10–200 KB), signature (10–100 KB) and any PwD / category certificate (PDF, 10–300 KB)."
              - "<strong>Step 3</strong> — pay online by debit / credit card, net banking, UPI or wallet, then download the confirmation page."
              - "Pick four exam cities; only one application per candidate is allowed."
            source: nc-ib
          - table:
              caption: "NCHM JEE 2026 exam fee (no gender difference)"
              head: ["Category", "Fee"]
              rows:
                - ["General (UR) / OBC-NCL (Central list)", "₹1,000"]
                - ["Gen-EWS", "₹700"]
                - ["SC / ST / PwD", "₹450"]
                - ["Third gender", "₹450"]
            source: nc-ib
          - table:
              caption: "B.Sc. HHA fixed charges listed by NCHMCT (tuition is extra)"
              head: ["Fee head", "Amount"]
              rows:
                - ["Admission fee (one-time)", "₹1,600"]
                - ["NCHMCT enrolment fee (one-time)", "₹3,600"]
                - ["JNU fee (one-time)", "₹10,215"]
                - ["Examination fee", "₹3,000 per semester"]
                - ["Caution money (refundable)", "₹8,000"]
            source: nc-bsc
          - note: "NCHMCT says tuition varies by institute and typically totals ₹3–5 lakh for the six semesters. That course page still showed the 2025 exam dates when checked, so confirm the fee with your institute."
            source: nc-bsc
      - id: horizons
        nav: "Institutes &amp; careers"
        eyebrow: "Career horizons &amp; mapped institutions"
        heading: "A JNU degree from 21 Central IHMs and 60-plus other institutes"
        parts:
          - p: "The B.Sc. (HHA) is a three-year, six-semester course awarded as a <strong>JNU degree</strong>, with an optional fourth year for an Honours degree under NEP 2020. It covers food production, food &amp; beverage service, front office and housekeeping, with management inputs in marketing, finance, HR, revenue and facility planning."
            source: nc-bsc
          - p: "The 2026 list of affiliated institutes includes Central IHMs at Bengaluru, Bhopal, Bhubaneswar, Chennai, Gandhinagar, Goa, Gurdaspur, Guwahati, Gwalior, Hajipur, Hyderabad, Jaipur, Kolkata, Lucknow and Mumbai, AIHM Chandigarh, the PSU-run IHM Pusa (Delhi), and State and private IHMs across the country."
            source: nc-ib
          - list:
              - "Management trainee in hotels, flight kitchens and on-board airline services."
              - "Guest relations, sales and marketing in hospitality and service companies."
              - "Railway catering, state tourism corporations, cruise lines, retail chains, and faculty posts in hotel-management or food-craft institutes."
            source: nc-bsc
          - links:
              - { label: "Hotel management (BHM) career guide", url: "bhm.html" }
              - { label: "Hotel management college finder", url: "colleges.html?stream=arts&amp;course=hotel" }
              - { label: "Hotel management coaching finder", url: "coaching-hotel.html" }
