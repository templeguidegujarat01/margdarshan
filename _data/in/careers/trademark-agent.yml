sections:
  - id: "quick"
    hid: "quick-heading"
    alt: true
    eyebrow: "Quick answers"
    heading: "Trademark Agent at a glance"
    intro: "Check whether your Class 12 background qualifies. Duration and pay are in the summary at the top of the page."
    parts:
      - subhead: "Can I apply from my stream?"
      - streams:
          - label: "Science"
            fit: "Eligible"
            tone: "y"
            icon: "science"
          - label: "Commerce"
            fit: "Eligible"
            tone: "y"
            icon: "commerce"
          - label: "Arts / Humanities"
            fit: "Eligible"
            tone: "y"
            icon: "arts"
      - note: "Any stream; you need a graduate degree before registering."
  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What does a Trademark Agent do?"
    parts:
      - overview:
          points:
            - "Trademark agents search existing marks, file applications, reply to examination reports, handle oppositions and attend hearings at the Trade Marks Registry."
            - "Clients range from start-ups naming a product to large brands managing portfolios across classes."
            - "Many combine trademark work with company law, copyright or patent practice."
  - id: "who"
    hid: "who-heading"
    alt: true
    eyebrow: "Fit check"
    heading: "Who should become a Trademark Agent"
    parts:
      - fit:
          match:
            - "Like language, brands and legal detail."
            - "Want a desk-based legal career without necessarily doing an LLB."
            - "Are organised with deadlines and documents."
          mismatch:
            - "Want courtroom litigation (that needs an LLB)."
            - "Dislike paperwork and procedure."
            - "Expect quick high pay — clients come with reputation."
  - id: "eligibility"
    hid: "elig-heading"
    eyebrow: "Eligibility"
    heading: "What you need, stage by stage"
    parts:
      - elig_list:
          - "<strong>Indian citizen</strong>, at least <strong>21 years</strong> old."
          - "<strong>Graduate</strong> of a recognised Indian university, or an equivalent qualification."
          - "Pass the <strong>Trade Marks Agent Examination</strong> — or be an advocate or an ICSI member, who are exempt."
          - "Not disqualified under the Trade Marks Rules (for example, an undischarged insolvent)."
  - id: "roadmap"
    hid: "roadmap-heading"
    alt: true
    eyebrow: "Step-by-step"
    heading: "Your full path to becoming a Trademark Agent"
    parts:
      - steps:
          - title: "Class 12, any stream"
            text: "No subject requirement."
          - title: "Graduate in any discipline"
            text: "Law, commerce and management help."
          - title: "Study trademark law"
            text: "The Trade Marks Act, 1999 and the Trade Marks Rules, 2017."
          - title: "Trade Marks Agent Examination"
            text: "As announced by IP India."
          - title: "Register and practise"
            text: "Firm, in-house brand team or own practice."
      - roadmap_card: "Trademark Agent"
  - id: "exams"
    hid: "exams-heading"
    eyebrow: "Exams & licences"
    heading: "The Trade Marks Agent Examination"
    parts:
      - chips:
          - label: "Who conducts it"
            text: "The Office of the CGPDTM (IP India), alongside the Patent Agent Examination."
            source: "ipindia"
          - label: "Pattern and pass marks"
            text: "Set in each year's official notice — read it before preparing."
            source: "ipindia"
          - label: "Exemptions"
            text: "Advocates and members of ICSI can register without the exam."
            source: "tmrules"
  - id: "salary"
    hid: "salary-heading"
    alt: true
    eyebrow: "Indicative figures"
    heading: "Trademark Agent pay in India"
    intro: "Pay varies a lot by employer, city and whether you practise independently; these are broad, commonly reported ranges, not guarantees."
    parts:
      - salary:
          - label: "Associate"
            value: "Entry level"
            text: "Junior roles in IP firms or brand teams."
          - label: "Registered agent"
            value: "Grows with clients"
            text: "Independent agents earn per filing and per matter."
          - label: "Senior / partner"
            value: "High"
            text: "Portfolio managers for large brands earn well."
  - id: "jobs"
    hid: "jobs-heading"
    eyebrow: "Where they work"
    heading: "Employers & growth path"
    parts:
      - chips:
          - label: "Employers"
            text: "IP and corporate law firms, consumer brands, media and FMCG companies, start-up advisory firms"
          - label: "Growth path"
            text: "Associate → registered agent → senior associate → partner / own practice"
          - label: "Combine with"
            text: "Company secretarial, copyright and design registration work"
  - id: "proscons"
    hid: "pc-heading"
    alt: true
    eyebrow: "Honest take"
    heading: "Advantages and disadvantages"
    parts:
      - proscons:
          pros:
            - "Open to graduates from any stream."
            - "Can build an independent practice."
            - "Steady demand as businesses register brands."
          cons:
            - "Niche field; clients take time to build."
            - "Procedural, document-heavy work."
            - "Litigation needs an LLB on top."
  - hid: "related-heading"
    alt: true
    eyebrow: "Related careers"
    heading: "If you're considering Trademark Agent, also look at"
    parts:
      - related:
          - name: "Patent Agent"
            sub: "Protecting inventions"
            href: "patent-agent.html"
          - name: "Company Secretary (CS)"
            sub: "Corporate law & compliance"
            href: "cs.html"
          - name: "LLB (Law)"
            sub: "Advocates are exempt from the exam"
            href: "llb.html"
          - name: "BBA"
            sub: "Business & brand management"
            href: "bba.html"
  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Can a B.Com or BA graduate become a trademark agent?"
            a: "Yes. Any graduate who is an Indian citizen aged 21+ can take the Trade Marks Agent Examination."
          - q: "Do advocates need to take the exam?"
            a: "No. Advocates and ICSI members can register as trademark agents without it."
          - q: "Is a trademark agent the same as a patent agent?"
            a: "No. They are separate registers and separate exams; patent agents need a science/tech degree."
      - note: "*Pay figures are indicative unless they quote an official pay level, and rules change: confirm eligibility, dates and fees on the official websites listed under Sources before you act."
        class: "table-note mt-lg"
