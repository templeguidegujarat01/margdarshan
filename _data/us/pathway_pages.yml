  study: "Financial and managerial accounting, auditing, taxation, accounting information systems, business law, finance and economics."
  hs: ["Algebra and statistics", "Business, economics or personal finance courses", "Spreadsheet skills (Excel)", "Writing — reports and client emails are daily work"]
