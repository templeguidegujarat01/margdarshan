  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What is BA Philosophy?"
    parts:
      - overview:
          points:
            - "BA Philosophy is a 3-year undergraduate degree (4 years for Honours with Research under National Education Policy (NEP) 2020) that studies logic and argumentation, ethics, metaphysics (questions about existence and reality), epistemology (questions about knowledge and truth), and the history of philosophical thought — both Indian and Western."
            - "The degree isn't about abstract speculation for its own sake; it's about learning to construct and evaluate arguments rigorously, a skill that transfers directly into law, competitive exams and any field requiring careful, structured reasoning."
            - "It's offered widely across Indian universities."
          more:
            - "Delhi University colleges — <strong>Hindu College, Hansraj College and Lady Shri Ram College</strong> — are strong destinations, alongside Jawaharlal Nehru University's undergraduate programmes, Presidency University Kolkata, and the University of Hyderabad, under the University Grants Commission (UGC) framework."
  - id: "who"
    hid: "who-heading"
    alt: true
    eyebrow: "Fit check"
    heading: "Who should choose BA Philosophy"
    parts:
      - fit:
          match:
            - "Enjoy questioning assumptions and following an argument through to its logical conclusion."
            - "Are considering UPSC, law, academic research, or writing/editorial roles that reward clear reasoning."
            - "Are comfortable with abstract, sometimes unresolved questions that don't have a single \"correct\" answer."
          mismatch:
            - "Prefer concrete, fact-based subjects with clear right answers over open-ended argument."
            - "Want a degree with a fixed, direct pipeline into campus placements straight after graduation."
            - "Are choosing it without a plan for what comes after — the degree pays off through what you build on top of it."
  - id: "eligibility"
    hid: "elig-heading"
    eyebrow: "Eligibility"
    heading: "Who can apply for BA Philosophy"
    parts:
      - elig_list:
          - "Class 12 pass (10+2) from a recognised board, typically <strong>45-50% aggregate</strong> for General/EWS/OBC and slightly relaxed for SC/ST/PwD categories, varying by university."
          - "Open to students from any stream — Arts, Commerce or Science — since no specific Class 12 subject is compulsory."
          - "Philosophy is rarely taught at the Class 11-12 level in India, so almost all students start the subject fresh at university."
