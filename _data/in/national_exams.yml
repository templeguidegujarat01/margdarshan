# wbjee.html, gujcet.html, comedk.html, nest.html, iiser-iat.html, cmi.html, isi.html, neet-pg.html, ini-cet.html,
# fmge.html, aiims-norcet.html, gpat.html, niper-jee.html, ipmat.html, jipmat.html, clat-pg.html, ailet.html,
# uceed.html, ceed.html, nid-dat.html, nchmct-jee.html, gate.html
# Rendered by _includes/national-exam.html; validated by scripts/check-in-data.mjs.
# Same part kinds as the state cockpit sheets (p, list, table, note, warn, links). Every p / list / table
# and every hero fact must carry `source:` naming an id from that exam's sources[].
# Six fixed blocks, in this order: overview, eligibility, scheme, reservation, fees, horizons.
# Facts come only from the official files listed under each exam, read on `checked`. On that date only the
# UPSC ESE 2027 notice and the CLAT 2027 pages were out, so ESE and CLAT are the 2027 cycle and every other
# exam is the 2026 cycle (NATA 2027 and NIFT 2027 bulletins were not out either). Phase 7 (read 15 Oct 2026):
# INI-CET is the January 2027 session, FMGE the October 2026 session, NORCET the NORCET-11 (2026) round.
# Phase 8 (read 15 Oct 2026): CLAT PG and AILET are the 2027 cycle; IPMAT Indore and JIPMAT are the 2026 cycle
# (no 2027 notice from IIM Indore or NTA yet). Phase 9 (read 15 Oct 2026): UCEED and CEED are the 2027 cycle, NID DAT
# the 2027-28 admissions; NCHM JEE is the 2026 cycle (no 2027 bulletin from NTA yet). GATE (read 31 Oct 2026) is the
# 2027 cycle from the IIT Madras brochure and website.
# stream: engineering | medical | govt | law | university | architecture | design | polytechnic | science | nursing | pharmacy | management | hospitality (labels the "More national exams" list).
# checked (optional, per exam): the day that exam's files were read; the page shows it instead of the sheet-wide `checked`.
checked: 2026-10-14

exams:
  # ---------------------------------------------------------------- JEE Main
  - slug: jee-main
    short: "JEE Main"
    stream: engineering
    body: "National Testing Agency (NTA)"
    eyebrow: "Entrance Exam · Engineering · 2026 cycle"
    title: "JEE Main — eligibility, marking, reservation & fees"
    lede: "The NTA exam for B.E./B.Tech, B.Arch and B.Planning seats at NITs, IIITs and other government-funded institutes — and the gate to JEE Advanced."
    coaching_href: "coaching-jee.html"
    colleges_href: "colleges-btech.html"
    facts:
      - { label: "Conducted by", value: "National Testing Agency (NTA)", source: jm-ib }
      - { label: "Sessions (2026)", value: "21–30 Jan &amp; 2–9 Apr 2026", source: jm-ib }
      - { label: "Paper 1 (B.E./B.Tech)", value: "75 questions · 300 marks · 3 hours", source: jm-ib }
      - { label: "Marking", value: "+4 correct · −1 wrong, both sections", source: jm-ib }
    official:
      - { label: "jeemain.nta.nic.in", url: "https://jeemain.nta.nic.in/" }
      - { label: "Information Bulletin 2026 (PDF)", url: "https://cdnbbsr.s3waas.gov.in/s3f8e59f4b2fe7c5705bf878bbd494ccdf/uploads/2025/11/202511021649722475.pdf" }
    sections:
      - id: overview
        nav: "Overview"
        eyebrow: "Overview &amp; governing bodies"
        heading: "Who runs JEE Main, and what it decides"
        parts:
          - p: "JEE Main is conducted by the <strong>National Testing Agency (NTA)</strong>, an autonomous body set up by the Ministry of Education under the Societies Registration Act. The Department of Higher Education has given NTA the job of conducting JEE Main since 2019."
            source: jm-ib
          - list:
              - "<strong>Paper 1 (B.E./B.Tech)</strong> — admission to undergraduate engineering at NITs, IIITs, other Centrally Funded Technical Institutions and institutions funded or recognised by participating state governments."
              - "<strong>Paper 1 is also the eligibility test for JEE Advanced</strong>, which is used for IIT admission."
              - "<strong>Paper 2A (B.Arch)</strong> and <strong>Paper 2B (B.Planning)</strong> — architecture and planning admissions."
            source: jm-ib
          - p: "Seats are not given by NTA. The <strong>Joint Seat Allocation Authority (JoSAA)</strong> allots seats at IITs and IISc (on JEE Advanced ranks) and at the <strong>NIT+ System</strong> — NITs, IIEST Shibpur, IIITs and Other-GFTIs, including Schools of Planning and Architecture — on JEE Main ranks, in one common process."
            source: josaa-br
          - p: "There are two sessions a year. A candidate may sit one or both; if both, the better of the two total NTA scores is used for the merit list."
            source: jm-ib
          - table:
              caption: "JEE Main 2026 calendar"
              head: ["Event", "Session 1 (January)", "Session 2 (April)"]
              rows:
                - ["Online application", "31 Oct – 27 Nov 2025", "From the last week of Jan 2026"]
                - ["Exam dates", "21 – 30 Jan 2026", "2 – 9 Apr 2026"]
                - ["Result", "By 12 Feb 2026", "By 20 Apr 2026"]
            source: jm-ib
          - warn: "The JEE Main 2027 Information Bulletin was not yet published on 14 October 2026, so this page describes the 2026 cycle. NTA can change dates, fees and the pattern in the 2027 bulletin — check it the day it comes out."
      - id: eligibility
        nav: "Eligibility"
        eyebrow: "Eligibility criteria"
        heading: "Who can sit JEE Main, and who can take a seat"
        parts:
          - list:
              - "<strong>No age limit</strong> for appearing. Institutes may still apply their own age rules at admission."
              - "<strong>Year of Class 12:</strong> passed in 2024 or 2025, or appearing in 2026. Those who passed Class 12 in 2023 or earlier cannot sit JEE Main 2026."
              - "The passing year is the year the board first declared you 'pass'. An improvement attempt does not count as a new first attempt."
              - "<strong>State code of eligibility</strong> is the state where you passed Class 12 — not your home town or address."
            source: jm-ib
          - p: "<strong>Attempts:</strong> the bulletin sets no count of attempts; the limit comes from the Class 12 year rule above. In practice a student can sit JEE Main in the year of Class 12 and in the two years after it, with two sessions each year."
            source: jm-ib
          - table:
              caption: "Class 12 rule for NIT+ seats through JoSAA / CSAB (the 75% rule)"
              head: ["Category", "Option 1 — aggregate of five subjects", "Option 2 — board percentile"]
              rows:
                - ["General, Gen-EWS, OBC-NCL", "At least 75%", "Within the category-wise top 20 percentile of your Class 12 board"]
                - ["SC, ST, PwD", "At least 65%", "Within the category-wise top 20 percentile of your Class 12 board"]
            source: jm-ib
          - table:
              caption: "Subjects you need in Class 12 for each NIT+ programme"
              head: ["Programme (rank used)", "Class 12 subjects required"]
              rows:
                - ["B.E./B.Tech (Paper 1)", "Physics, Mathematics, a language, one of Chemistry / Biotechnology / Biology / a technical vocational subject, and any one more subject"]
                - ["B.Arch (Paper 2A)", "Physics, Chemistry, Mathematics and two more subjects"]
                - ["B.Planning (Paper 2B)", "Mathematics and four other subjects"]
            source: jm-ib
          - p: "Outside the NIT+ System, the bulletin quotes the Council of Architecture rule for B.Arch (Physics and Mathematics compulsory plus one listed subject, with at least 45% aggregate, or a 10+3 diploma with Mathematics and 45%) and, for B.Planning, at least 50% in Mathematics and 50% aggregate."
            source: jm-ib
      - id: scheme
        nav: "Exam scheme"
        eyebrow: "Exam scheme &amp; marking matrix"
        heading: "Paper 1: two sections per subject, negative marking in both"
        parts:
          - table:
              caption: "Paper 1 (B.E./B.Tech) — computer-based test, 3 hours"
              head: ["Subject", "Section A (MCQ)", "Section B (numerical value)", "Marks"]
              rows:
                - ["Mathematics", "20", "5", "100"]
                - ["Physics", "20", "5", "100"]
                - ["Chemistry", "20", "5", "100"]
                - ["Total", "60", "15", "300 (75 questions)"]
            source: jm-ib
          - table:
              caption: "Marking matrix (Paper 1, and the Mathematics part of Papers 2A / 2B)"
              head: ["Response", "Section A — MCQ", "Section B — numerical value"]
              rows:
                - ["Correct or most appropriate answer", "+4", "+4"]
                - ["Incorrect answer", "−1", "−1"]
                - ["Unanswered / marked for review", "0", "0"]
            source: jm-ib
          - list:
              - "Section B answers are typed as an <strong>integer</strong> with the on-screen keypad; round your answer off to the nearest integer."
              - "If a question is dropped, or (in Section B) found incorrect, all candidates in that shift get +4. If more than one MCQ option is correct, +4 goes to anyone who marked a correct option."
              - "Time: 3 hours for Paper 1; 4 hours for PwD/PwBD candidates eligible for a scribe (20 minutes per hour)."
              - "13 languages: English, Hindi, Assamese, Bengali, Gujarati, Kannada, Malayalam, Marathi, Odia, Punjabi, Tamil, Telugu and Urdu. The language cannot be changed after the form is submitted."
              - "Ties are broken by NTA score in Mathematics, then Physics, then Chemistry, then by the lower ratio of wrong to right answers."
            source: jm-ib
          - table:
              caption: "Papers 2A (B.Arch) and 2B (B.Planning)"
              head: ["Paper", "Part I — Mathematics", "Part II — Aptitude", "Part III", "Total"]
              rows:
                - ["2A B.Arch", "25 questions · 100 marks", "50 questions · 200 marks", "Drawing: 2 questions · 100 marks (pen and paper, A4 sheet)", "77 questions · 400 marks"]
                - ["2B B.Planning", "25 questions · 100 marks", "50 questions · 200 marks", "Planning-based: 25 questions · 100 marks", "100 questions · 400 marks"]
            source: jm-ib
          - note: "Paper 2A or 2B alone takes 3 hours; both together take 3 hours 30 minutes."
            source: jm-ib
      - id: reservation
        nav: "Reservation"
        eyebrow: "Reservation thresholds"
        heading: "Seat shares for each category"
        parts:
          - table:
              caption: "Central reservation applied to JEE Main admissions"
              head: ["Category", "Share of seats", "Condition"]
              rows:
                - ["SC", "15%", "Castes in the central list for your state"]
                - ["ST", "7.5%", "Tribes in the central list for your state"]
                - ["OBC-NCL", "27%", "Non-creamy layer and in the central OBC list (ncbc.nic.in)"]
                - ["Gen-EWS", "10%", "As per the 17 January 2019 Ministry of Social Justice OM"]
                - ["PwD / PwBD", "5% (horizontal)", "5% inside each of GEN, Gen-EWS, OBC-NCL, SC and ST seats"]
            source: jm-ib
          - list:
              - "An OBC caste that is only in the state list (not the central list) cannot claim OBC-NCL reservation."
              - "OBC candidates in the creamy layer are treated as General and compete only for OPEN seats."
              - "Category certificates are checked at seat allocation; without the original in the required format, the reserved seat is not given."
            source: jm-ib
          - p: "<strong>Female supernumerary seats:</strong> extra seats are created for women in NITs, IIEST and some IIITs (as in IITs and IISc) to bring female enrolment to at least 20%."
            source: josaa-br
          - p: "<strong>Home State quota:</strong> NIT, IIEST Shibpur and PEC Chandigarh seats are split into Home State and Other States quotas. Home State means the state of your state code of eligibility — where you passed Class 12."
            source: josaa-br
      - id: fees
        nav: "Registration &amp; fees"
        eyebrow: "Step-by-step registration &amp; form costs"
        heading: "How to apply, and what it costs per session"
        parts:
          - list:
              - "<strong>Step 1 — Registration:</strong> register on jeemain.nta.nic.in, create a password and security question, and note the application number. The same number is used for both sessions."
              - "<strong>Step 2 — Application form:</strong> choose the paper and exam cities, enter your education details, take a live photograph and upload a photo (JPG, 10–200 kb), signature (JPG, 10–100 kb) and Class 10 certificate (PDF, 50–300 kb), plus a PwD/UDID certificate if it applies."
              - "<strong>Step 3 — Fee:</strong> pay online by net banking, debit/credit card or UPI. The confirmation page appears only after payment succeeds."
              - "Session 2 is applied for separately (same application number) with its own fee. Only one application per candidate — more than one is treated as unfair means."
            source: jm-ib
          - table:
              caption: "Fee for one paper (Paper 1, 2A or 2B), per session"
              head: ["Category", "Gender", "Centre in India", "Centre outside India"]
              rows:
                - ["General", "Male", "₹1,000", "₹5,000"]
                - ["General", "Female", "₹800", "₹4,000"]
                - ["Gen-EWS / OBC-NCL", "Male", "₹900", "₹4,500"]
                - ["Gen-EWS / OBC-NCL", "Female", "₹800", "₹4,000"]
                - ["SC / ST / PwD / PwBD", "Male", "₹500", "₹2,500"]
                - ["SC / ST / PwD / PwBD", "Female", "₹500", "₹2,500"]
                - ["Third gender", "—", "₹500", "₹3,000"]
            source: jm-ib
          - table:
              caption: "Fee for two papers (Paper 1 + 2A, 1 + 2B, all three, or 2A + 2B), per session"
              head: ["Category", "Gender", "Centre in India", "Centre outside India"]
              rows:
                - ["General / Gen-EWS / OBC-NCL", "Male", "₹2,000", "₹10,000"]
                - ["General / Gen-EWS / OBC-NCL", "Female", "₹1,600", "₹8,000"]
                - ["SC / ST / PwD / PwBD", "Male", "₹1,000", "₹5,000"]
                - ["SC / ST / PwD / PwBD", "Female", "₹1,000", "₹5,000"]
                - ["Third gender", "—", "₹1,000", "₹5,000"]
            source: jm-ib
          - note: "Bank processing charges and GST are extra."
            source: jm-ib
          - p: "<strong>After the result — JoSAA seat acceptance fee:</strong> ₹15,000 for SC, ST and PwD category tags, ₹30,000 for everyone else. It includes ₹5,000 JoSAA processing charges; the rest is adjusted against the institute's admission fee."
            source: josaa-br
      - id: horizons
        nav: "Careers &amp; institutions"
        eyebrow: "In-hand career horizons &amp; mapped institutions"
        heading: "Where a JEE Main rank takes you"
        parts:
          - list:
              - "<strong>NIT+ System through JoSAA / CSAB:</strong> NITs, IIEST Shibpur, IIITs and Other-GFTIs, including the Schools of Planning and Architecture."
              - "<strong>State engineering colleges:</strong> a state may prepare its own rank list from JEE Main for its colleges, on criteria it decides."
              - "<strong>JEE Advanced:</strong> the top 2,50,000 Paper 1 candidates (all categories together) become eligible for JEE Advanced and the IITs."
            source: jm-ib
          - p: "<strong>A government career benchmark:</strong> after an engineering degree, the UPSC Engineering Services Examination recruits engineers to Group A central services. The ESE 2026 notice expected about 474 vacancies and needs a degree in engineering."
            source: ese
          - warn: "NTA, JoSAA and the ESE 2026 notice publish no starting-salary or pay-level figure for engineering graduates, so this page gives none. Salary ranges for each branch are on the career pages below."
          - links:
              - { label: "Computer Science Engineering", url: "cse.html" }
              - { label: "Mechanical Engineering", url: "mechanical.html" }
              - { label: "Civil Engineering", url: "civil.html" }
              - { label: "Electrical Engineering", url: "electrical.html" }
              - { label: "Electronics Engineering", url: "electronics.html" }
              - { label: "B.Tech college finder", url: "colleges-btech.html" }
              - { label: "JEE Advanced", url: "jee-advanced.html" }
              - { label: "UPSC ESE (engineering services)", url: "upsc-ese.html" }
    sources:
      - { id: jm-ib, name: "NTA — JEE (Main) 2026 Information Bulletin", url: "https://cdnbbsr.s3waas.gov.in/s3f8e59f4b2fe7c5705bf878bbd494ccdf/uploads/2025/11/202511021649722475.pdf", covers: "Dates, scheme, marking, eligibility, 75% rule, reservation, steps and fees", checked: 2026-10-14 }
      - { id: josaa-br, name: "JoSAA — Business Rules for Joint Seat Allocation 2026-27 (1 June 2026)", url: "https://cdnbbsr.s3waas.gov.in/s313111c20aee51aeb480ecbd988cd8cc9/uploads/2026/06/20260601632081678.pdf", covers: "NIT+ System, Home State quota, female supernumerary seats, seat acceptance fee", checked: 2026-10-14 }
      - { id: ese, name: "UPSC — Engineering Services Examination 2026, Notice No. 02/2026-ENGG", url: "https://www.upsc.gov.in/sites/default/files/Notif-ESEP-26-Engl.pdf", covers: "ESE 2026 vacancies and degree requirement", checked: 2026-10-14 }

  # ---------------------------------------------------------------- JEE Advanced
  - slug: jee-advanced
    short: "JEE Advanced"
    stream: engineering
    body: "the seven Zonal Coordinating IITs (Joint Admission Board)"
    eyebrow: "Entrance Exam · IIT admission · 2026 cycle"
    title: "JEE Advanced — eligibility, attempts, papers & fees"
    lede: "The exam for B.Tech, BS, B.Arch and dual-degree seats at the 23 IITs, open only to the top 2,50,000 JEE Main Paper 1 candidates."
    coaching_href: "coaching-jee.html"
    colleges_href: "colleges-btech.html"
    facts:
      - { label: "Organising IIT (2026)", value: "IIT Roorkee", source: ja-ib }
      - { label: "Exam date (2026)", value: "Sun 17 May 2026 — two papers", source: ja-ib }
      - { label: "Who can sit", value: "Top 2,50,000 in JEE Main Paper 1", source: ja-ib }
      - { label: "Attempts", value: "Max 2, in two consecutive years", source: ja-ib }
    official:
      - { label: "jeeadv.ac.in", url: "https://jeeadv.ac.in/" }
      - { label: "Information Brochure 2026 (PDF)", url: "https://jeeadv.ac.in/documents/IBEnglish_2026.pdf" }
    sections:
      - id: overview
        nav: "Overview"
        eyebrow: "Overview &amp; governing bodies"
        heading: "Who runs JEE Advanced, and what it decides"
        parts:
          - p: "JEE Advanced 2026 was conducted by the <strong>seven Zonal Coordinating IITs</strong> under the <strong>Joint Admission Board (JAB) 2026</strong>, with <strong>IIT Roorkee</strong> as the organising institute. JAB's decisions are final on the exam and IIT admission."
            source: ja-ib
          - table:
              caption: "The 23 IITs by zone (* = zonal coordinating IIT)"
              head: ["Zone", "IITs"]
              rows:
                - ["East", "Bhubaneswar*, Kharagpur, (ISM) Dhanbad"]
                - ["Central", "Bhilai, Kanpur*, (BHU) Varanasi, Indore"]
                - ["North-Central", "Delhi*, Jammu, Jodhpur"]
                - ["North-East", "Guwahati*, Patna"]
                - ["North", "Roorkee* (organising IIT), Mandi, Ropar"]
                - ["South", "Madras*, Hyderabad, Palakkad, Tirupati"]
                - ["West", "Bombay*, Dharwad, Gandhinagar, Goa"]
            source: ja-ib
          - list:
              - "Programmes on JEE Advanced rank: B.Tech and BS (4 years), B.Arch (5 years), and 5-year dual degrees and integrated Masters (B.Tech-M.Tech, BS-MS, Integrated M.Tech, B.Tech-MBA and others)."
              - "B.Arch is offered only at IIT (BHU) Varanasi, IIT Kharagpur and IIT Roorkee, and needs the separate Architecture Aptitude Test (AAT)."
              - "Results were declared on 1 June 2026. Qualifying does not guarantee a seat — seats depend on rank and availability in each JoSAA round."
            source: ja-ib
          - p: "Seats at all IITs — and, in 2026, at IISc Bengaluru — are allotted on JEE Advanced ranks by <strong>JoSAA</strong>, under its Business Rules dated 1 June 2026."
            source: josaa-br
          - warn: "The JEE Advanced 2027 Information Brochure was not yet published on 14 October 2026, so this page describes the 2026 cycle."
      - id: eligibility
        nav: "Eligibility"
        eyebrow: "Eligibility criteria"
        heading: "Five criteria — you must meet all of them"
        parts:
          - list:
              - "<strong>A1 — JEE Main:</strong> be among the top 2,50,000 successful candidates (all categories) in JEE Main 2026 Paper 1."
              - "<strong>A2 — Age:</strong> born on or after 1 October 2001. SC, ST and PwD get five years' relaxation: born on or after 1 October 1996."
              - "<strong>A3 — Attempts:</strong> at most two attempts, in two consecutive years."
              - "<strong>A4 — Class 12:</strong> first appeared in Class 12 in 2025 or 2026, with Physics, Chemistry and Mathematics compulsory. First appearance in 2024 or earlier makes you ineligible (an exception applies to boards that declared 2023-24 results on or after 18 June 2024)."
              - "<strong>A5 — No earlier IIT admission:</strong> you must not have been admitted to an IIT programme before, even if you later left. Those who were allotted a seat but did not report, withdrew or had it cancelled before the last round may sit again."
            source: ja-ib
          - table:
              caption: "How the top 2,50,000 are split (Criterion A1)"
              head: ["Category", "Without PwD", "PwD (5% horizontal)", "Total"]
              rows:
                - ["OPEN (40.5%)", "96,187", "5,063", "1,01,250"]
                - ["Gen-EWS (10%)", "23,750", "1,250", "25,000"]
                - ["OBC-NCL (27%)", "64,125", "3,375", "67,500"]
                - ["SC (15%)", "35,625", "1,875", "37,500"]
                - ["ST (7.5%)", "17,812", "938", "18,750"]
            source: ja-ib
          - table:
              caption: "Class 12 performance needed for an IIT seat (the 75% rule)"
              head: ["Category", "Option 1 — aggregate of five subjects", "Option 2 — board percentile"]
              rows:
                - ["General, Gen-EWS, OBC-NCL", "At least 75%", "Within the category-wise top 20 percentile of your Class 12 board"]
                - ["SC, ST, PwD", "At least 65%", "Within the category-wise top 20 percentile of your Class 12 board"]
            source: ja-ib
          - note: "The five subjects counted are Physics, Chemistry, Mathematics, a language (the higher-scoring one if you took more than one) and your best other subject. Marks not out of 100 are scaled to 100, for a total out of 500."
            source: ja-ib
      - id: scheme
        nav: "Exam scheme"
        eyebrow: "Exam scheme &amp; marking matrix"
        heading: "Two compulsory 3-hour papers; marking shown only on the day"
        parts:
          - table:
              caption: "JEE Advanced 2026 schedule — computer-based test only"
              head: ["Paper", "Time (IST)", "Sections"]
              rows:
                - ["Paper 1", "09:00 – 12:00", "Physics, Chemistry, Mathematics"]
                - ["Paper 2", "14:30 – 17:30", "Physics, Chemistry, Mathematics"]
            source: ja-ib
          - list:
              - "Both papers are compulsory; only candidates who sit both are ranked."
              - "The question types and marking scheme are <strong>not fixed in advance</strong>: the brochure says negative marks may apply to some questions and the scheme is given in the 'Instructions to Candidates' at the time of the exam."
              - "Questions are in English and Hindi; you can switch language at any time during the exam."
              - "Subject marks = that subject's marks in Paper 1 + Paper 2. Ranks use the aggregate; ties go first to higher positive marks, then higher Mathematics, then higher Physics."
              - "PwD candidates (at least 40% impairment) and those with less than 40% disability who have difficulty writing get one extra hour per paper."
            source: ja-ib
          - table:
              caption: "Minimum marks to be included in a rank list"
              head: ["Rank list", "Minimum % in each subject", "Minimum % aggregate"]
              rows:
                - ["Common Rank List (CRL)", "10.0", "35.0"]
                - ["Gen-EWS", "9.0", "31.5"]
                - ["OBC-NCL", "9.0", "31.5"]
                - ["SC / ST", "5.0", "17.5"]
                - ["All PwD rank lists", "5.0", "17.5"]
                - ["Preparatory course lists", "2.5", "8.75"]
            source: ja-ib
          - warn: "There is no fixed Section A / Section B or integer-type structure in JEE Advanced, unlike JEE Main. Any 'official pattern' quoted before the exam day is a guess based on past papers."
      - id: reservation
        nav: "Reservation"
        eyebrow: "Reservation thresholds"
        heading: "Seat shares and special seats at the IITs"
        parts:
          - table:
              caption: "Reservation of IIT seats"
              head: ["Category", "Share of seats", "Condition"]
              rows:
                - ["SC", "15%", "Central list for your state (socialjustice.gov.in)"]
                - ["ST", "7.5%", "Central list for your state (ncst.nic.in)"]
                - ["OBC-NCL", "27%", "Non-creamy layer, central OBC list"]
                - ["Gen-EWS", "10%", "As per the 17 January 2019 OM"]
                - ["PwD", "5% (horizontal)", "At least 40% impairment; 5% inside each of OPEN, Gen-EWS, OBC-NCL, SC and ST"]
            source: ja-ib
          - list:
              - "Your category is the one recorded in JEE Main; it cannot be changed for JEE Advanced."
              - "<strong>Female supernumerary seats:</strong> each IIT creates extra seats so that female undergraduate enrolment is at least 20%; offered only on JEE Advanced performance."
              - "<strong>Defence Service candidates:</strong> two seats per IIT for children of defence/paramilitary personnel killed or permanently disabled in action."
              - "<strong>Foreign nationals:</strong> supernumerary seats capped at 10% of each course; they do not need JEE Main."
            source: ja-ib
      - id: fees
        nav: "Registration &amp; fees"
        eyebrow: "Step-by-step registration &amp; form costs"
        heading: "Registration window and fee"
        parts:
          - list:
              - "<strong>Step 1:</strong> qualify in the top 2,50,000 of JEE Main Paper 1."
              - "<strong>Step 2:</strong> register on jeeadv.ac.in — in 2026 from 23 April (10:00 IST) to 2 May 2026 (23:59 IST)."
              - "<strong>Step 3:</strong> pay the fee — last date 4 May 2026 (23:59 IST)."
              - "Foreign nationals and OCI/PIO (F) candidates register directly (2026: 6 April – 2 May)."
            source: ja-ib
          - table:
              caption: "JEE Advanced 2026 registration fee — exam centres in India"
              head: ["Candidate", "Fee"]
              rows:
                - ["Female candidates (all categories)", "₹1,600"]
                - ["SC, ST and PwD candidates", "₹1,600"]
                - ["All other Indian candidates", "₹3,200"]
                - ["OCI/PIO (I) — female, or OPEN (GEN-PwD)", "₹1,600"]
                - ["OCI/PIO (I) — OPEN (GEN)", "₹3,200"]
                - ["Foreign nationals &amp; OCI/PIO (F) — SAARC countries", "USD 100"]
                - ["Foreign nationals &amp; OCI/PIO (F) — non-SAARC countries", "USD 200"]
            source: ja-ib
          - note: "Centres abroad: USD 200 for Indian nationals and OCI/PIO (I); USD 200 (SAARC) or USD 300 (non-SAARC) for foreign nationals. Gateway charges are extra and the fee is non-refundable."
            source: ja-ib
          - p: "<strong>After the result — JoSAA seat acceptance fee:</strong> ₹15,000 for SC, ST and PwD category tags, ₹30,000 for everyone else (includes ₹5,000 JoSAA processing; the rest is adjusted against the admission fee)."
            source: josaa-br
      - id: horizons
        nav: "Careers &amp; institutions"
        eyebrow: "In-hand career horizons &amp; mapped institutions"
        heading: "Where a JEE Advanced rank takes you"
        parts:
          - list:
              - "<strong>The 23 IITs</strong> — B.Tech, BS, B.Arch, dual degrees and integrated Masters."
              - "Institutes that have used JEE Advanced ranks in the past: IISc Bengaluru; the IISERs at Berhampur, Bhopal, Kolkata, Mohali, Pune, Thiruvananthapuram and Tirupati; IIST Thiruvananthapuram; RGIPT Rae Bareli; and IIPE Visakhapatnam. Contact them directly for admission details."
            source: ja-ib
          - p: "<strong>A government career benchmark:</strong> after the degree, the UPSC Engineering Services Examination recruits engineers to Group A central services; the ESE 2026 notice expected about 474 vacancies."
            source: ese
          - warn: "The IITs, JoSAA and the ESE 2026 notice publish no starting-salary or pay-level figure for B.Tech graduates, so this page gives none. Branch-wise salary ranges are on the career pages below."
          - links:
              - { label: "Computer Science Engineering", url: "cse.html" }
              - { label: "AI Engineering", url: "ai-engineer.html" }
              - { label: "Aerospace Engineering", url: "aerospace.html" }
              - { label: "Electrical Engineering", url: "electrical.html" }
              - { label: "B.Tech college finder", url: "colleges-btech.html" }
              - { label: "JEE Main", url: "jee-main.html" }
    sources:
      - { id: ja-ib, name: "IIT Roorkee (JAB 2026) — JEE (Advanced) 2026 Information Brochure", url: "https://jeeadv.ac.in/documents/IBEnglish_2026.pdf", covers: "IITs, eligibility A1–A5, 2.5 lakh split, schedule, papers, rank lists, reservation, fees, 75% rule", checked: 2026-10-14 }
      - { id: josaa-br, name: "JoSAA — Business Rules for Joint Seat Allocation 2026-27 (1 June 2026)", url: "https://cdnbbsr.s3waas.gov.in/s313111c20aee51aeb480ecbd988cd8cc9/uploads/2026/06/20260601632081678.pdf", covers: "IIT and IISc seat allocation, seat acceptance fee", checked: 2026-10-14 }
      - { id: ese, name: "UPSC — Engineering Services Examination 2026, Notice No. 02/2026-ENGG", url: "https://www.upsc.gov.in/sites/default/files/Notif-ESEP-26-Engl.pdf", covers: "ESE 2026 vacancies", checked: 2026-10-14 }

  # ---------------------------------------------------------------- NEET UG
  - slug: neet-ug
    short: "NEET UG"
    stream: medical
    body: "National Testing Agency (NTA)"
    eyebrow: "Entrance Exam · Medical · 2026 cycle"
    title: "NEET UG — eligibility, marking, reservation & fees"
    lede: "The single national entrance for MBBS, BDS, BAMS, BUMS, BSMS and BHMS in every medical institution in India, including AIIMS and JIPMER."
    coaching_href: "coaching-neet.html"
    colleges_href: "colleges-mbbs.html"
    facts:
      - { label: "Conducted by", value: "National Testing Agency (NTA)", source: neet-ib }
      - { label: "Mode", value: "Pen and paper, one shift", source: neet-ib }
      - { label: "Paper", value: "180 questions · 720 marks · 3 hours", source: neet-ib }
      - { label: "2026 exam", value: "Re-held on Sun 21 June 2026", source: neet-re }
    official:
      - { label: "neet.nta.nic.in", url: "https://neet.nta.nic.in/" }
      - { label: "Information Bulletin 2026 (PDF)", url: "https://cdnbbsr.s3waas.gov.in/s37bc1ec1d9c3426357e69acd5bf320061/uploads/2026/02/202602231394640855.pdf" }
    sections:
      - id: overview
        nav: "Overview"
        eyebrow: "Overview &amp; governing bodies"
        heading: "Who runs NEET UG, and what it decides"
        parts:
          - p: "NEET (UG) is required by <strong>Section 14 of the National Medical Commission Act, 2019</strong> (and the matching sections of the NCISM Act, 2020 and NCH Act, 2020) as the one uniform entrance for undergraduate medical courses in all medical institutions. <strong>NTA</strong> has conducted it since 2019. It has also been the entrance for MBBS at AIIMS and JIPMER since 2020."
            source: neet-ib
          - list:
              - "Courses: MBBS, BDS, BAMS, BUMS, BSMS and BHMS."
              - "NEET (UG) results are also used for B.Sc. (Hons) Nursing and for BVSc &amp; AH seats under the 15% VCI quota."
              - "NTA conducts the exam, declares the result and issues the All India Rank. Merit lists, domicile and counselling belong to the admitting and state authorities."
              - "Counselling: the <strong>Medical Counselling Committee (MCC)</strong> for the 15% All India Quota in MBBS/BDS; <strong>AACCC</strong> for the All India Quota in BAMS/BUMS/BSMS and BHMS; state authorities for state quotas."
            source: neet-res
          - table:
              caption: "NEET (UG) 2026 calendar"
              head: ["Event", "Date"]
              rows:
                - ["Online application", "8 Feb – 8 Mar 2026"]
                - ["Correction window", "10 – 12 Mar 2026"]
                - ["Exam as first scheduled", "Sun 3 May 2026, 2:00 – 5:00 PM"]
            source: neet-ib
          - p: "NTA then held a <strong>re-examination on Sunday 21 June 2026</strong> (2:00 – 5:15 PM including formalities), in pen-and-paper mode in 13 languages, with no fee charged to candidates (public notice of 15 May 2026)."
            source: neet-re
          - p: "The result came on <strong>16 July 2026</strong>: close to 20 lakh candidates appeared at 5,440 centres and 11.21 lakh qualified."
            source: neet-res
          - warn: "The NEET (UG) 2027 Information Bulletin was not yet published on 14 October 2026, so this page describes the 2026 cycle."
      - id: eligibility
        nav: "Eligibility"
        eyebrow: "Eligibility criteria"
        heading: "Age, subjects and the qualifying percentile"
        parts:
          - list:
              - "<strong>Minimum age:</strong> 17 years on or before 31 December of the exam year — for NEET 2026, born on or before 31 December 2009."
              - "<strong>No upper age limit</strong> (NMC letter of 9 March 2022), and the bulletin sets no cap on the number of attempts."
              - "<strong>Subjects:</strong> Physics, Chemistry, Biology/Biotechnology and English in Class 12 (or equivalent). Since NMC's November 2023 public notice, students who studied these as additional subjects after Class 12 from a recognised board may also sit."
              - "Students whose Class 12 result is awaited can sit, but cannot be admitted unless they have passed by the first counselling round."
              - "Indian citizens and OCI holders who want to study medicine abroad must also qualify NEET (UG)."
            source: neet-ib
          - table:
              caption: "Qualifying percentile for admission (marks at or above this percentile)"
              head: ["Category", "Minimum percentile"]
              rows:
                - ["General, Gen-EWS", "50th"]
                - ["SC, ST, OBC", "40th"]
                - ["PwBD — General / Gen-EWS", "45th"]
                - ["PwBD — SC / ST / OBC-NCL", "40th"]
            source: neet-ib
          - note: "The Central Government, with NMC and the other councils, may lower these percentiles for a year if too few candidates qualify."
            source: neet-ib
      - id: scheme
        nav: "Exam scheme"
        eyebrow: "Exam scheme &amp; marking matrix"
        heading: "180 compulsory MCQs, +4 / −1"
        parts:
          - table:
              caption: "NEET (UG) 2026 pattern — pen and paper, 3 hours"
              head: ["Subject", "Questions", "Marks"]
              rows:
                - ["Physics", "45", "180"]
                - ["Chemistry", "45", "180"]
                - ["Biology (Botany &amp; Zoology)", "90", "360"]
                - ["Total", "180", "720"]
            source: neet-ib
          - table:
              caption: "Marking matrix"
              head: ["Response", "Marks"]
              rows:
                - ["Correct or most appropriate answer", "+4"]
                - ["Incorrect option", "−1"]
                - ["Unanswered", "0"]
            source: neet-ib
          - list:
              - "All 180 questions are compulsory — there are no optional questions (NMC letter of 5 December 2025)."
              - "Every question is an MCQ with four options and one correct or best answer. There is no numerical-value section."
              - "If more than one option is correct, +4 goes to anyone who marked a correct one; if a question is wrong or dropped, all candidates get +4."
              - "13 mediums: Assamese, Bengali, English, Gujarati, Hindi, Kannada, Malayalam, Marathi, Odia, Punjabi, Tamil, Telugu and Urdu."
              - "PwD/PwBD candidates with a physical limitation to write get one extra hour, whether or not they use a scribe."
            source: neet-ib
      - id: reservation
        nav: "Reservation"
        eyebrow: "Reservation thresholds"
        heading: "Central reservation — and why state seats differ"
        parts:
          - table:
              caption: "15% All India Quota, central institutes and central universities"
              head: ["Category", "Share of seats"]
              rows:
                - ["SC", "15%"]
                - ["ST", "7.5%"]
                - ["OBC-NCL (central list)", "27%"]
                - ["Gen-EWS", "10%"]
                - ["PwBD", "5% (horizontal)"]
            source: neet-ib
          - list:
              - "This applies to the 15% All India Quota, central institutes (ABVIMS &amp; RML, VMMC &amp; Safdarjung, ESIC), DU, AMU, BHU, AIIMS and JIPMER."
              - "<strong>State quota seats</strong> (and private colleges under state governments) follow the state's own reservation policy and eligibility rules."
              - "Creamy-layer OBC candidates, and OBCs not in the central list, should choose General."
            source: neet-ib
      - id: fees
        nav: "Registration &amp; fees"
        eyebrow: "Step-by-step registration &amp; form costs"
        heading: "How to apply, and what it costs"
        parts:
          - list:
              - "<strong>Step 1 — Register:</strong> on neet.nta.nic.in; create a password and security question and note the application number."
              - "<strong>Step 2 — Complete the form:</strong> personal details, question-paper medium, exam cities and education; take a live photograph and upload a passport photo taken after 1 January 2026, signature, left- and right-hand finger and thumb impressions, Class 10 marksheet and certificate, and category / PwBD certificates if they apply."
              - "<strong>Step 3 — Pay:</strong> online by card, net banking or UPI, by the last date (8 March 2026, 11:50 PM, for 2026)."
            source: neet-ib
          - table:
              caption: "NEET (UG) 2026 application fee"
              head: ["Category", "Centre in India", "Centre outside India"]
              rows:
                - ["General", "₹1,700", "₹9,500"]
                - ["Gen-EWS / OBC-NCL", "₹1,600", "₹9,500"]
                - ["SC / ST / PwBD / PwD / Third gender", "₹1,000", "₹9,500"]
            source: neet-ib
          - note: "Unlike JEE Main, the NEET fee does not change with gender."
            source: neet-ib
          - note: "No fee was charged for the 21 June 2026 re-examination."
            source: neet-re
      - id: horizons
        nav: "Careers &amp; institutions"
        eyebrow: "In-hand career horizons &amp; mapped institutions"
        heading: "Where a NEET rank takes you — and a doctor's government pay"
        parts:
          - list:
              - "<strong>Through MCC:</strong> 15% All India Quota MBBS/BDS seats in government colleges of the states; 100% MBBS at AIIMS; JIPMER, AMU, BHU, DU and IP University seats; ESIC seats; Deemed Universities; and B.Sc. Nursing at selected central institutes. MCC only registers candidates for AFMC."
              - "<strong>Through state authorities:</strong> the remaining state quota seats in government and private colleges."
            source: neet-ib
          - table:
              caption: "Government pay for MBBS doctors — UPSC Combined Medical Services Examination 2026"
              head: ["Post (2026 vacancies)", "Pay Matrix level", "Basic pay range"]
              rows:
                - ["Medical Officer, General Duty, Central Health Service (864)", "Level 10", "₹56,100 – ₹1,77,500 + NPA"]
                - ["Assistant Divisional Medical Officer, Railways (450)", "Level 10, Group A Junior Scale", "₹56,100 – ₹1,77,500 + NPA"]
                - ["General Duty Medical Officer, NDMC (14)", "Level 10", "₹56,100 – ₹1,77,500 + restricted NPA"]
                - ["General Duty Medical Officer Grade-II, MCD (30)", "Level 10, first cell", "Starts at ₹56,100 + NPA and allowances"]
            source: cms
          - table:
              caption: "Promotion ladder for an NDMC General Duty Medical Officer"
              head: ["Grade", "Pay Matrix level", "Range"]
              rows:
                - ["Senior Medical Officer", "Level 11", "₹67,700 – ₹2,08,700"]
                - ["Chief Medical Officer", "Level 12", "₹78,800 – ₹2,09,200"]
                - ["CMO (Non-functional Selection Grade)", "Level 13", "₹1,18,500 – ₹2,14,100"]
                - ["Senior Administrative Grade", "Level 14", "₹1,44,200 – ₹2,18,200"]
            source: cms
          - note: "These are basic pay ranges. In-hand pay also depends on allowances (DA, HRA, NPA) that change over time and are not stated as amounts in the notice. Private practice is not allowed in these posts."
            source: cms
          - links:
              - { label: "MBBS (Doctor)", url: "mbbs.html" }
              - { label: "BDS (Dentist)", url: "bds.html" }
              - { label: "BAMS", url: "bams.html" }
              - { label: "BHMS", url: "bhms.html" }
              - { label: "MBBS college finder", url: "colleges-mbbs.html" }
              - { label: "NEET coaching finder", url: "coaching-neet.html" }
              - { label: "UPSC CMS (government doctors)", url: "upsc-cms.html" }
    sources:
      - { id: neet-ib, name: "NTA — NEET (UG) 2026 Information Bulletin", url: "https://cdnbbsr.s3waas.gov.in/s37bc1ec1d9c3426357e69acd5bf320061/uploads/2026/02/202602231394640855.pdf", covers: "Legal basis, dates, pattern, marking, age, subjects, percentiles, reservation, steps, fees, MCC seats", checked: 2026-10-14 }
      - { id: neet-re, name: "NTA — Public notice: Conduct of re-examination for NEET (UG) 2026 (15 May 2026)", url: "https://cdnbbsr.s3waas.gov.in/s37bc1ec1d9c3426357e69acd5bf320061/uploads/2026/05/20260515960654684.pdf", covers: "21 June 2026 re-exam date, timing, mode, no fee", checked: 2026-10-14 }
      - { id: neet-res, name: "NTA — Press release: Result of NEET (UG) 2026 (16 July 2026)", url: "https://cdnbbsr.s3waas.gov.in/s37bc1ec1d9c3426357e69acd5bf320061/uploads/2026/07/20260716477215762.pdf", covers: "Result date, candidates appeared and qualified, counselling bodies, other courses using NEET", checked: 2026-10-14 }
      - { id: cms, name: "UPSC — Combined Medical Services Examination 2026, Notice No. 9/2026-CMS", url: "https://www.upsc.gov.in/sites/default/files/Notification-CMSE-2026-English-110326.pdf", covers: "2026 vacancies, Pay Matrix levels and promotion ladder for government doctors", checked: 2026-10-14 }

  # ---------------------------------------------------------------- UPSC ESE
  - slug: upsc-ese
    short: "UPSC ESE"
    stream: govt
    body: "Union Public Service Commission (UPSC)"
    eyebrow: "Recruitment Exam · Engineering Services · 2027 cycle"
    title: "UPSC ESE — eligibility, age limits, exam scheme & fees"
    lede: "The UPSC exam that recruits engineering graduates to Group A and Group B central services and posts — Railways, CPWD, telecom, defence engineering, water and power — in Civil, Mechanical, Electrical and Electronics &amp; Telecommunication."
    colleges_href: "colleges-btech.html"
    facts:
      - { label: "Conducted by", value: "UPSC · Rules by the Department of Telecommunications", source: ese27 }
      - { label: "Vacancies (2027)", value: "About 480, including 19 for PwBD", source: ese27 }
      - { label: "Exam dates", value: "Prelims 31 Jan 2027 · Mains 18 Jun 2027", source: ese27 }
      - { label: "Age on 1 Jan 2027", value: "21 to under 30 years (relaxations below)", source: ese27 }
    official:
      - { label: "ESE 2027 notice (PDF)", url: "https://www.upsc.gov.in/sites/default/files/Notif-ESEP-2027-Engl-160926.pdf" }
      - { label: "upsconline.nic.in", url: "https://upsconline.nic.in/" }
    sections:
      - id: overview
        nav: "Overview"
        eyebrow: "Overview &amp; governing authority"
        heading: "Who runs ESE, and which services it fills"
        parts:
          - p: "The Engineering Services Examination (ESE) is held by the <strong>Union Public Service Commission (UPSC)</strong> under the Rules of Engineering Services Examination, 2027, notified by the <strong>Department of Telecommunications, Ministry of Communications</strong> in the Gazette of India (Extraordinary) on 16 September 2026. The 2027 notice is Examination Notice No. 02/2027-ENGG."
            source: ese27
          - p: "Recruitment is in four engineering categories. A candidate applies for <strong>only one</strong> of them — Civil, Mechanical, Electrical, or Electronics &amp; Telecommunication."
            source: ese27
          - table:
              caption: "ESE 2027 calendar"
              head: ["Event", "Date"]
              rows:
                - ["Notification", "16 Sep 2026"]
                - ["Online application", "16 Sep – 6 Oct 2026 (till 6:00 PM)"]
                - ["Preliminary / Stage-I exam", "31 Jan 2027"]
                - ["Main / Stage-II exam", "18 Jun 2027"]
            source: ese27
          - list:
              - "<strong>Stage-I:</strong> Preliminary exam — two objective papers; it screens candidates for the Main exam."
              - "<strong>Stage-II:</strong> Main exam — two conventional (written-answer) papers in your engineering discipline."
              - "<strong>Stage-III:</strong> Personality Test / Interview."
              - "Marks from all three stages are added for the final rank."
            source: ese27
          - warn: "The ESE 2027 application window closed on 6 October 2026. If you missed it, the next window opens with the ESE 2028 notice on upsc.gov.in — UPSC can change dates, vacancies and the pattern in every notice."
      - id: eligibility
        nav: "Eligibility"
        eyebrow: "Academic eligibility"
        heading: "The degree you need to sit ESE"
        parts:
          - list:
              - "A <strong>degree in Engineering</strong> from a university set up by a Central or State Act, an institution set up by an Act of Parliament, or a deemed university under Section 3 of the UGC Act; or"
              - "Sections A and B of the Institution Examinations of the <strong>Institution of Engineers (India)</strong>; or"
              - "A degree/diploma in Engineering from a foreign university or institution recognised by the Government; or"
              - "Graduate Membership Examination of the IETE (India); Associate Membership Parts II and III / Sections A and B of the Aeronautical Society of India; or Graduate Membership of the Institution of Electronics and Radio Engineers, London (held after November 1959)."
            source: ese27
          - list:
              - "<strong>M.Sc. route (two services only):</strong> Indian Naval Armament Service (Electronics Engg. posts) and Indian Radio Regulatory Service Group A also accept an M.Sc. with Wireless Communication Electronics, Radio Physics or Radio Engineering (and, for IRRS, a Master's in Science with Physics and Radio Communication, Electronics or Telecommunication)."
              - "<strong>IETE / AeSI after 31 May 2013:</strong> degrees or certificates from these bodies taken by admission after 31.05.2013 are <strong>not</strong> admissible for ESE 2027. Institution of Engineers (India) admissions after that date are subject to a pending Government decision."
              - "<strong>Final-year students can apply.</strong> Proof of passing must be uploaded in a 10-day window after the Main result, or you cannot appear in the interview."
            source: ese27
          - p: "<strong>Nationality:</strong> a citizen of India, or a subject of Nepal or Bhutan, a Tibetan refugee who came before 1 January 1962, or a person of Indian origin who migrated from the listed countries to settle in India — the non-citizen groups need a Government eligibility certificate before an offer of appointment."
            source: ese27
          - note: "Physical and medical standards apply. Every finally recommended candidate has a medical examination, and its findings are binding for service allocation."
            source: ese27
      - id: scheme
        nav: "Exam scheme"
        eyebrow: "Exam scheme &amp; marking matrix"
        heading: "Three stages, 1,300 marks"
        parts:
          - table:
              caption: "ESE 2027 plan of examination (each discipline)"
              head: ["Stage", "Paper", "Type", "Duration", "Marks"]
              rows:
                - ["Stage-I Prelims", "Paper I — General Studies &amp; Engineering Aptitude", "Objective (MCQ)", "2 hours", "200"]
                - ["Stage-I Prelims", "Paper II — your engineering discipline", "Objective (MCQ)", "3 hours", "300"]
                - ["Stage-II Mains", "Paper I — your engineering discipline", "Conventional", "3 hours", "300"]
                - ["Stage-II Mains", "Paper II — your engineering discipline", "Conventional", "3 hours", "300"]
                - ["Stage-III", "Personality Test / Interview", "—", "—", "200"]
                - ["Total", "", "", "", "1,300"]
            source: ese27
          - table:
              caption: "Marking in the objective (Prelims) papers"
              head: ["Response", "Marks"]
              rows:
                - ["Correct answer", "Marks assigned to the question"]
                - ["Wrong answer", "One-third (0.33) of the question's marks deducted"]
                - ["More than one answer marked", "Treated as wrong — same penalty"]
                - ["Left blank", "0 (no penalty)"]
            source: ese27
          - list:
              - "About <strong>six to seven times</strong> the number of vacancies are called to the Main exam, on minimum qualifying marks in both Prelims papers."
              - "About <strong>twice</strong> the number of vacancies are called to the interview. The interview has <strong>no minimum qualifying marks</strong>."
              - "Conventional papers must be answered in English; question papers are set in English only."
            source: ese27
      - id: reservation
        nav: "Age &amp; relaxations"
        eyebrow: "Age limits &amp; category relaxations"
        heading: "21 to 30 on 1 January 2027, with fixed relaxations"
        parts:
          - p: "You must be at least <strong>21</strong> and must not have reached <strong>30</strong> on <strong>1 January 2027</strong> — born between <strong>2 January 1997 and 1 January 2006</strong>. Date of birth is taken only from the Matriculation / Secondary certificate or equivalent."
            source: ese27
          - table:
              caption: "Relaxation of the upper age limit (30 years)"
              head: ["Category", "Relaxation", "Highest upper limit"]
              rows:
                - ["SC / ST", "Up to 5 years", "35"]
                - ["OBC (eligible for reservation)", "Up to 3 years", "33"]
                - ["Defence personnel disabled in hostilities / disturbed areas and released", "Up to 3 years", "33"]
                - ["Ex-servicemen incl. Commissioned Officers and ECOs/SSCOs with 5 years' service by 1 Jan 2027", "Up to 5 years", "35"]
                - ["ECOs/SSCOs with extended assignment and an MoD certificate", "Up to 5 years", "35"]
                - ["PwBD (low vision, deaf and hard of hearing, locomotor, SLD, mental illness)", "Up to 10 years", "40"]
                - ["Government servants in the listed departments, applying for those departments' services", "Upper limit raised", "35"]
            source: ese27
          - list:
              - "SC, ST and OBC candidates who are also ex-servicemen or PwBD get the relaxations <strong>added together</strong>."
              - "Reservation for SC, ST, OBC, EWS and PwBD is as fixed by the Government. The caste must be on the Central list."
              - "OBC (Non-Creamy Layer) and EWS certificates must be issued on or after 1 April 2026 and by the closing date, 6 October 2026."
              - "The category cannot be changed after the application; a reserved candidate moves to unreserved only by qualifying every stage on the general standard."
            source: ese27
          - note: "Blindness: no ESE 2027 vacancy is identified for blind candidates, and UPSC advises them not to apply. Low-vision candidates may apply only for services that accept it."
            source: ese27
      - id: fees
        nav: "Application &amp; fees"
        eyebrow: "Application steps &amp; registration fee"
        heading: "Apply online at upsconline.nic.in — ₹200, many exempt"
        parts:
          - list:
              - "<strong>Step 1 — URN:</strong> create an account and the one-time Universal Registration Number (URN) profile, ideally with Aadhaar as ID."
              - "<strong>Step 2 — Common Application Form:</strong> upload a photograph and capture a live photograph; upload your signature signed three times on white paper in black ink."
              - "<strong>Step 3 — Exam-specific module:</strong> choose the engineering category and centre, pay the fee and submit. Each exam gives its own Application Number."
              - "No withdrawal and no change in any field after submission. Centre seats are first-apply-first-allot."
            source: ese27
          - table:
              caption: "ESE 2027 examination fee"
              head: ["Candidate", "Fee"]
              rows:
                - ["General, OBC and EWS (male)", "₹200"]
                - ["All female candidates", "Exempt (₹0)"]
                - ["SC / ST", "Exempt (₹0)"]
                - ["PwBD", "Exempt (₹0)"]
            source: ese27
          - note: "Pay by net banking, Visa / Master / RuPay credit or debit card, or UPI. OBC and EWS candidates get no fee exemption. The fee is not refunded or carried to another exam."
            source: ese27
      - id: horizons
        nav: "Pay &amp; cadre"
        eyebrow: "Pay scales &amp; cadre placement"
        heading: "Where an ESE rank places you"
        parts:
          - p: "Services are allotted strictly by <strong>merit rank, your preferences, the number of vacancies and medical fitness</strong>. Most services are Group A; a few posts (for example Junior Telecom Officer) are Group B."
            source: ese27
          - table:
              caption: "Some participating services in each ESE 2027 category"
              head: ["Category", "Services include"]
              rows:
                - ["Civil", "Central Engineering Service, CES (Roads), Central Water Engineering Service, Indian Railway Management Service (Civil), Indian Defence Service of Engineers, Survey of India"]
                - ["Mechanical", "IRMS (Mechanical), Indian Naval Armament Service, Defence Aeronautical Quality Assurance Service, Central Power Engineering Service, GSI Engineering Service"]
                - ["Electrical", "IRMS (Electrical), Central Electrical &amp; Mechanical Engineering Service, Central Power Engineering Service, Indian Naval Material Management Service"]
                - ["Electronics &amp; Telecom", "Indian Telecommunications Service Gr A, Indian Radio Regulatory Service Gr A, IRMS (Signal &amp; Telecommunication), Junior Telecom Officer Gr B"]
            source: ese27
          - p: "<strong>Pay benchmark (Indian Telecommunications Service):</strong> ESE 2024 candidates allotted to ITS were offered Assistant Divisional Engineer Telecom (Junior Time Scale, Group A) at <strong>Pay Matrix Level 10 — ₹56,100 to ₹1,77,500 plus allowances</strong> (7th CPC), with two years' probation and liability to serve anywhere in or outside India."
            source: dot-its
          - warn: "The ESE 2027 notice states no pay figure. The Level 10 figure above is from one service's official offer letter; other services set pay in their own rules, and Group B posts are not Group A scale. Non-Practising Allowance is a doctors' allowance, not part of ESE pay."
          - links:
              - { label: "Civil Engineering", url: "civil.html" }
              - { label: "Mechanical Engineering", url: "mechanical.html" }
              - { label: "Electrical Engineering", url: "electrical.html" }
              - { label: "Electronics Engineering", url: "electronics.html" }
              - { label: "JEE Main", url: "jee-main.html" }
    sources:
      - { id: ese27, name: "UPSC — Engineering Services Examination 2027, Notice No. 02/2027-ENGG (16 Sep 2026)", url: "https://www.upsc.gov.in/sites/default/files/Notif-ESEP-2027-Engl-160926.pdf", covers: "Dates, vacancies, services, nationality, degree, age and relaxations, fee, application, plan of exam, marking", checked: 2026-10-14 }
      - { id: dot-its, name: "Department of Telecommunications — Offer of appointment to ADET (JTS of ITS Group A) on ESE 2024 results (17 Jul 2025)", url: "https://www.dot.gov.in/static/uploads/2025/07/a172d7f416a217056bb02e226e68f82a.pdf", covers: "Pay Matrix Level 10 for an ESE-recruited ITS officer, probation", checked: 2026-10-14 }

  # ---------------------------------------------------------------- UPSC CMS
  - slug: upsc-cms
    short: "UPSC CMS"
    stream: govt
    body: "Union Public Service Commission (UPSC)"
    eyebrow: "Recruitment Exam · Government doctors · 2026 cycle"
    title: "UPSC CMS — eligibility, age limits, exam scheme & pay"
    lede: "The UPSC exam that recruits MBBS doctors as Medical Officers in the Central Health Service, Assistant Divisional Medical Officers in the Railways, and General Duty Medical Officers in NDMC and MCD."
    colleges_href: "colleges-mbbs.html"
    facts:
      - { label: "Conducted by", value: "Union Public Service Commission (UPSC)", source: cms26 }
      - { label: "Vacancies (2026)", value: "1,358 tentative across four services", source: cms26 }
      - { label: "Written exam", value: "2 papers × 250 marks · 2 hours each", source: cms26 }
      - { label: "Age on 1 Aug 2026", value: "Under 32 (CHS posts: up to 35)", source: cms26 }
    official:
      - { label: "CMS 2026 notice (PDF)", url: "https://www.upsc.gov.in/sites/default/files/Notification-CMSE-2026-English-110326.pdf" }
      - { label: "upsconline.nic.in", url: "https://upsconline.nic.in/" }
    sections:
      - id: overview
        nav: "Overview"
        eyebrow: "Overview &amp; governing authority"
        heading: "Who runs CMS, and which posts it fills"
        parts:
          - p: "The Combined Medical Services Examination (CMS) is held by the <strong>Union Public Service Commission (UPSC)</strong>. The 2026 notice is Examination Notice No. 9/2026-CMS, dated 11 March 2026. One application covers all the posts; you give your service preferences later."
            source: cms26
          - table:
              caption: "CMS 2026 tentative vacancies"
              head: ["Category", "Post", "Vacancies"]
              rows:
                - ["Category-I", "Medical Officers Grade, General Duty Medical Officers Sub-cadre, Central Health Service", "864"]
                - ["Category-II", "Assistant Divisional Medical Officer, Railways", "450"]
                - ["Category-II", "General Duty Medical Officer, New Delhi Municipal Council", "14"]
                - ["Category-II", "General Duty Medical Officer Grade-II, Municipal Corporation of Delhi", "30"]
            source: cms26
          - table:
              caption: "CMS 2026 calendar"
              head: ["Event", "Date"]
              rows:
                - ["Notification", "11 Mar 2026"]
                - ["Last date to apply", "31 Mar 2026"]
                - ["Written exam", "2 Aug 2026"]
            source: cms26
          - note: "On 2 August 2026, Paper I ran 9:30–11:30 AM and Paper II 2:00–4:00 PM."
            source: cms-tt
          - p: "The written result came out on <strong>1 September 2026</strong>, and Personality Tests for <strong>2,842 candidates</strong> began on <strong>12 October 2026</strong>."
            source: cms-pt
          - warn: "The CMS 2027 notice was not published on 14 October 2026 (the 2026 notice came out in March), so this page describes the 2026 cycle. Check upsc.gov.in for the 2027 dates, vacancies and rules."
      - id: eligibility
        nav: "Eligibility"
        eyebrow: "Academic eligibility"
        heading: "MBBS is the only qualifying degree"
        parts:
          - list:
              - "You must have passed the <strong>written and practical parts of the final M.B.B.S. examination</strong>."
              - "Students who have appeared, or are yet to appear, in final MBBS may apply provisionally; proof of passing must be uploaded in the 15-day window after the written result."
              - "<strong>Internship:</strong> a candidate still doing the compulsory rotating internship may sit the exam, but is appointed only after completing it."
              - "Only a degree certificate, final marksheet or provisional degree certificate issued by the competent authority is accepted as proof."
            source: cms26
          - note: "Physical and medical standards in Appendix III of the CMS Rules apply to every candidate."
            source: cms26
      - id: scheme
        nav: "Exam scheme"
        eyebrow: "Exam scheme &amp; marking matrix"
        heading: "A 500-mark written test, then a 100-mark interview"
        parts:
          - table:
              caption: "CMS 2026 plan of examination"
              head: ["Part", "Paper", "Questions", "Duration", "Marks"]
              rows:
                - ["Written", "Paper I — General Medicine (96) &amp; Paediatrics (24)", "120", "2 hours", "250"]
                - ["Written", "Paper II — Surgery, Gynaecology &amp; Obstetrics, Preventive &amp; Social Medicine (40 each)", "120", "2 hours", "250"]
                - ["Personality Test", "Interview", "—", "—", "100"]
                - ["Total", "", "", "", "600"]
            source: cms26
          - table:
              caption: "Marking in both papers (objective, multiple choice)"
              head: ["Response", "Marks"]
              rows:
                - ["Correct answer", "Marks assigned to the question"]
                - ["Wrong answer", "One-third (0.33) of the question's marks deducted"]
                - ["More than one answer marked", "Treated as wrong — same penalty"]
                - ["Left blank", "0 (no penalty)"]
            source: cms26
          - list:
              - "Both papers are of <strong>MBBS standard</strong>, set in English only. No calculators."
              - "UPSC may fix qualifying marks in either or both papers; only those who qualify are called to the interview."
              - "<strong>Tie-break:</strong> higher written total, then the older candidate, then the earlier internship completion date."
            source: cms26
      - id: reservation
        nav: "Age &amp; relaxations"
        eyebrow: "Age limits &amp; category relaxations"
        heading: "Under 32 on 1 August 2026, with fixed relaxations"
        parts:
          - p: "You must not have reached <strong>32 years on 1 August 2026</strong> — born on or after <strong>2 August 1994</strong>. For Medical Officers in the <strong>Central Health Service</strong>, the upper limit is <strong>35 years</strong> on the same date. The notice sets no lower age limit."
            source: cms26
          - table:
              caption: "Relaxation of the upper age limit"
              head: ["Category", "Relaxation", "Highest limit (32 base · CHS 35 base)"]
              rows:
                - ["SC / ST", "Up to 5 years", "37 · 40"]
                - ["OBC (eligible for reservation)", "Up to 3 years", "35 · 38"]
                - ["Defence personnel disabled in hostilities / disturbed areas and released", "Up to 3 years", "35 · 38"]
                - ["Ex-servicemen incl. Commissioned Officers and ECOs/SSCOs with 5 years' service by 1 Aug 2026", "Up to 5 years", "37 · 40"]
                - ["ECOs/SSCOs with extended assignment and an MoD certificate", "Up to 5 years", "37 · 40"]
                - ["PwBD (benchmark disabilities under Section 34, RPwD Act 2016)", "Up to 10 years", "42 · 45"]
            source: cms26
          - list:
              - "SC, ST and OBC candidates who are also ex-servicemen or PwBD get the relaxations <strong>added together</strong>."
              - "Reservation for SC, ST, OBC, EWS and PwBD is as fixed by the Government."
              - "PwBD vacancies in 2026: 34 in CHS, 18 in Railways (listed locomotor classes), 2 in MCD, none in NDMC."
            source: cms26
      - id: fees
        nav: "Application &amp; fees"
        eyebrow: "Application steps &amp; registration fee"
        heading: "Apply online at upsconline.nic.in — ₹200, many exempt"
        parts:
          - list:
              - "<strong>Step 1 — URN:</strong> create the one-time Universal Registration Number profile on upsconline.nic.in."
              - "<strong>Step 2 — Common Application Form:</strong> upload photograph, live photograph and signature, plus your date-of-birth, category and MBBS documents."
              - "<strong>Step 3 — Exam-specific form:</strong> choose the centre, pay the fee and submit. One application and one fee cover every CMS post."
              - "No addition, deletion or change after submission."
            source: cms26
          - table:
              caption: "CMS 2026 examination fee"
              head: ["Candidate", "Fee"]
              rows:
                - ["General, OBC and EWS (male)", "₹200"]
                - ["All female candidates", "Exempt (₹0)"]
                - ["SC / ST", "Exempt (₹0)"]
                - ["PwBD", "Exempt (₹0)"]
            source: cms26
          - note: "Pay by net banking, Visa / Master / RuPay credit or debit card, or UPI. OBC and EWS candidates get no fee exemption. The fee is not refunded or carried to another exam."
            source: cms26
      - id: horizons
        nav: "Pay &amp; cadre"
        eyebrow: "Pay scales &amp; cadre placement"
        heading: "Level 10 entry pay, plus Non-Practising Allowance"
        parts:
          - table:
              caption: "Entry pay and posting for each CMS post (7th CPC Pay Matrix)"
              head: ["Post", "Pay", "Allowance", "Posting &amp; probation"]
              rows:
                - ["Medical Officer, CHS (GDMO Sub-cadre)", "Level 10 · ₹56,100 – ₹1,77,500", "NPA as per Government orders", "Any CHS dispensary or hospital in India · 2 years"]
                - ["Assistant Divisional Medical Officer, Railways", "Level 10, Group A Junior Scale · ₹56,100 – ₹1,77,500", "NPA as per rules", "Railway health units; liable to transfer to any Railway · 1 year"]
                - ["General Duty Medical Officer, NDMC", "Level 10 · ₹56,100 – ₹1,77,500", "Restricted NPA", "NDMC hospitals, dispensaries and centres · 2 years"]
                - ["General Duty Medical Officer Gr-II, MCD", "Level 10, first cell · starts at ₹56,100", "NPA and admissible allowances", "MCD hospitals, dispensaries and PHCs · 2 years"]
            source: cms26
          - table:
              caption: "Promotion ladder for an NDMC General Duty Medical Officer"
              head: ["Grade", "Pay Matrix level", "Range"]
              rows:
                - ["Senior Medical Officer", "Level 11", "₹67,700 – ₹2,08,700"]
                - ["Chief Medical Officer", "Level 12", "₹78,800 – ₹2,09,200"]
                - ["CMO (Non-functional Selection Grade)", "Level 13", "₹1,18,500 – ₹2,14,100"]
                - ["Senior Administrative Grade", "Level 14", "₹1,44,200 – ₹2,18,200"]
            source: cms26
          - list:
              - "<strong>Private practice is prohibited</strong> in every CMS post, including lab and consultant practice in CHS."
              - "Railway ADMOs are under the Contributory Pension System (for entrants from 1 January 2004), get Railway passes, and must pass a Hindi exam during probation."
              - "Railway ADMOs may be required to serve up to four years in Defence-linked posts (not after ten years of service or, ordinarily, after age 45)."
            source: cms26
          - note: "These are basic pay ranges. In-hand pay adds DA, HRA, NPA and other allowances, which change over time and are not stated as amounts in the notice."
            source: cms26
          - links:
              - { label: "MBBS (Doctor)", url: "mbbs.html" }
              - { label: "NEET UG", url: "neet-ug.html" }
              - { label: "MBBS college finder", url: "colleges-mbbs.html" }
    sources:
      - { id: cms26, name: "UPSC — Combined Medical Services Examination 2026, Notice No. 9/2026-CMS (11 Mar 2026)", url: "https://www.upsc.gov.in/sites/default/files/Notification-CMSE-2026-English-110326.pdf", covers: "Vacancies, MBBS eligibility, age and relaxations, fee, application, plan of exam, marking, tie-break, pay and posting", checked: 2026-10-14 }
      - { id: cms-tt, name: "UPSC — CMS Examination 2026 Time Table", url: "https://www.upsc.gov.in/sites/default/files/TT-CMSE-2026-English-140526.pdf", covers: "2 August 2026 paper timings", checked: 2026-10-14 }
      - { id: cms-pt, name: "UPSC — CMS Examination 2026 Personality Test notice (25 Sep 2026)", url: "https://www.upsc.gov.in/sites/default/files/Intv-CMSE-2026-Engl-250926.pdf", covers: "Written result date, interview start date, number of candidates", checked: 2026-10-14 }

  # ---------------------------------------------------------------- CLAT UG (2027 cycle)
  - slug: clat
    short: "CLAT UG"
    stream: law
    body: "Consortium of National Law Universities"
    eyebrow: "Entrance Exam · Law · 2027 cycle"
    title: "CLAT UG — eligibility, paper format, NLU reservation & fees"
    lede: "The Common Law Admission Test for the five-year integrated LL.B. programmes at the National Law Universities. CLAT 2027 is on Sunday, 6 December 2026, and fills seats for the academic year 2027-28."
    coaching_href: "coaching-clat.html"
    colleges_href: "colleges-law.html"
    facts:
      - { label: "Conducted by", value: "Consortium of National Law Universities", source: clat-home }
      - { label: "Exam date", value: "Sun 6 Dec 2026 · 2:00–4:00 PM", source: clat-pr }
      - { label: "UG paper", value: "120 MCQs · 120 marks · 2 hours", source: clat-fmt }
      - { label: "Marking", value: "+1 correct · −0.25 wrong", source: clat-fmt }
    official:
      - { label: "consortiumofnlus.ac.in", url: "https://consortiumofnlus.ac.in/clat-2027/" }
      - { label: "UG instructions", url: "https://consortiumofnlus.ac.in/clat-2027/ug-instructions.html" }
    sections:
      - id: overview
        nav: "Overview"
        eyebrow: "Overview &amp; governing authority"
        heading: "Who runs CLAT, and what it decides"
        parts:
          - p: "CLAT is conducted by the <strong>Consortium of National Law Universities</strong>, set up on 19 August 2017 to raise standards of legal education. Twenty-six National Law Universities are members; the serving President is the Vice-Chancellor of MNLU Mumbai."
            source: clat-home
          - p: "CLAT 2027 covers admission to the <strong>five-year integrated LL.B.</strong> (UG) and LL.M. (PG) programmes at participating NLUs that start in the academic year <strong>2027-28</strong>. This page covers the UG test only."
            source: clat-faq
          - table:
              caption: "CLAT 2027 calendar"
              head: ["Event", "Date"]
              rows:
                - ["Applications open", "3 Aug 2026"]
                - ["Last date to apply and pay", "31 Oct 2026"]
                - ["CLAT 2027 exam", "Sun 6 Dec 2026, 2:00–4:00 PM"]
            source: clat-pr
          - note: "Counselling for admissions is expected in December 2026 / January 2027."
            source: clat-faq
          - note: "Hall tickets are downloaded from your CLAT login; the release date is announced on the website."
            source: clat-ins
      - id: eligibility
        nav: "Eligibility"
        eyebrow: "Academic eligibility"
        heading: "Class 12 with 45% — or 40% for SC, ST and PwD"
        parts:
          - list:
              - "You must have passed <strong>10+2 or an equivalent examination</strong> with at least <strong>45%</strong> marks (or the equivalent grade)."
              - "Candidates from the <strong>SC, ST and PwD</strong> categories need at least <strong>40%</strong>."
              - "Students appearing for Class 12 in <strong>March/April 2027</strong> can apply, but must show proof of passing at the time of admission, or lose the right to be considered."
              - "There is <strong>no upper age limit</strong> for the UG programme."
            source: clat-elig
          - list:
              - "Indian nationals, NRIs, PIO card holders and OCI card holders can sit CLAT 2027."
              - "Foreign nationals are not eligible for CLAT; they apply to the NLUs directly. NRI / NRI-sponsored seats are also filled by each NLU, not by the Consortium."
            source: clat-ins
      - id: scheme
        nav: "Exam scheme"
        eyebrow: "Exam scheme &amp; marking matrix"
        heading: "One 2-hour offline paper of 120 one-mark questions"
        parts:
          - table:
              caption: "CLAT 2027 UG question paper format"
              head: ["Item", "Rule"]
              rows:
                - ["Maximum marks", "120"]
                - ["Duration", "2 hours"]
                - ["Questions", "120 multiple-choice questions, one mark each"]
                - ["Negative marking", "0.25 mark for each wrong answer"]
            source: clat-fmt
          - table:
              caption: "Subject weightage (approximate number of questions)"
              head: ["Section", "Questions", "Share of paper"]
              rows:
                - ["English Language", "22–26", "about 20%"]
                - ["Current Affairs, including General Knowledge", "28–32", "about 25%"]
                - ["Legal Reasoning", "28–32", "about 25%"]
                - ["Logical Reasoning", "22–26", "about 20%"]
                - ["Quantitative Techniques", "10–14", "about 10%"]
            source: clat-fmt
          - list:
              - "CLAT 2027 is held in <strong>offline</strong> mode; only the application is online."
              - "Eligible PwD candidates write from 2:00 PM to <strong>4:40 PM</strong>."
              - "<strong>Tie-break:</strong> higher marks in Legal Aptitude, then the older candidate, then a computerised draw of lots."
            source: clat-ins
      - id: reservation
        nav: "Reservation"
        eyebrow: "Reservation &amp; domicile quotas"
        heading: "Every NLU applies its own seat matrix"
        parts:
          - p: "CLAT has no single national quota. Each NLU's intake, reservation policy and fee are set by that university and listed in its brochure on the Consortium website. To claim a reserved seat you must produce the certificate prescribed by the Government of India or the State Government at admission."
            source: clat-ins
          - list:
              - "<strong>NLSIU Bengaluru — 310 BA LLB seats (AY 2027-28).</strong> Vertical: SC 15% (45), ST 7.5% (22), OBC-NCL 27% (81), EWS 10% (30), General 122. Horizontal: women 30% (90), PwD 5% (15), Karnataka Students 25% (75, compartmentalised), plus 10 extra Karnataka Students seats on merit."
              - "<strong>Karnataka Students</strong> means at least 7 years of study in a recognised Karnataka institution, with set exceptions for children of defence, state-government, AIS (Karnataka cadre) and CAPF employees posted outside the state."
            source: nlsiu
          - list:
              - "<strong>NALSAR Hyderabad — 132 BA LLB seats.</strong> 99 seats (75%) for all-India candidates and 33 (25%) for Resident Students of Telangana."
              - "Category totals: Unreserved 66, SC 19, ST 8, OBC/BC (non-creamy layer) 26, EWS 13."
              - "Horizontal: 30% for women (39 seats) and 5% for persons with benchmark disabilities (6 seats)."
            source: nalsar
          - list:
              - "<strong>GNLU Gandhinagar — 176 all-India UG seats</strong> across BA, BBA, B.Com, B.Sc and BSW LL.B. (Hons.)."
              - "Vertical: General 50.5% (81), SC 15% (24), ST 7.5% (12), OBC-NCL 27% (43), EWS 10% (16)."
              - "Horizontal: women 30% (48), PwD 5% (8), and <strong>Gujarat domicile 25% (40)</strong> cutting across all categories except EWS."
            source: gnlu
          - note: "Changes notified on 5 September 2026: WBNUJS Kolkata dropped the OBC-A / OBC-B categories of West Bengal and added OBC of West Bengal (UG and PG). Applicants could update their category until 31 October 2026."
            source: clat-wb
          - note: "NLU Meghalaya added Khasi &amp; Jaintia, Garo, and Other Scheduled Castes / Scheduled Tribes of Meghalaya as domicile categories (UG and PG), also updatable until 31 October 2026."
            source: clat-meg
          - p: "Candidates with a disability under Section 2(s) of the RPwD Act, 2016 can ask for reasonable accommodation — compensatory time, a scribe or reader, screen-reading software, easier access to the centre — by marking it in the form and uploading a UDID card or disability certificate."
            source: clat-pwd
      - id: fees
        nav: "Application &amp; fees"
        eyebrow: "Registration steps &amp; fees"
        heading: "Apply online by 31 October 2026 — ₹4,000 or ₹3,500"
        parts:
          - list:
              - "<strong>Step 1 — Register</strong> on the CLAT 2027 website with your own mobile number and e-mail ID; validate the mobile with the OTP and log in."
              - "<strong>Step 2 — Fill the form</strong> with your name and parents' names exactly as on your certificates. Upload a passport-size photo, your signature, and SC / ST / OBC, PwD or BPL certificates if you claim them (PDF only)."
              - "<strong>Step 3 — Pay and submit</strong> by 31 October 2026, 11:59 PM. Incomplete forms are not considered."
              - "Once submitted and paid, the programme, category and BPL fields cannot be changed. If you submit more than one form, only the last one counts and earlier fees are not refunded."
            source: clat-ins
          - table:
              caption: "CLAT 2027 application fee"
              head: ["Category", "Fee"]
              rows:
                - ["General / OBC", "₹4,000"]
                - ["SC / ST / BPL / PwD", "₹3,500"]
                - ["Previous years' question papers (optional)", "₹500 extra"]
            source: clat-ins
          - note: "Fees are paid online only, are non-refundable and non-adjustable, and bank transaction charges are paid by the candidate."
            source: clat-ins
      - id: horizons
        nav: "Courses &amp; NLUs"
        eyebrow: "Career horizons &amp; mapped institutions"
        heading: "Five-year law degrees at the National Law Universities"
        parts:
          - p: "CLAT 2027 admits to the participating NLUs — 27 campuses on the Consortium's list, from NLSIU Bengaluru, NALSAR Hyderabad, WBNUJS Kolkata and NLU Jodhpur to the newer NLUs at Agartala, Prayagraj, Goa and Shillong, plus GNLU's Silvassa campus."
            source: clat-pu
          - list:
              - "NLSIU Bengaluru pioneered the five-year B.A., LL.B. (Hons.) in India — its first batch was admitted in 1988. Intake for AY 2026-27 is 310 seats."
              - "NLSIU's BA LLB (Hons) fee for AY 2027-28 is <strong>₹5,38,000</strong> for General and <strong>₹5,32,000</strong> for SC/ST candidates, including refundable deposits (subject to revision)."
            source: nlsiu
          - p: "Some NLUs offer more than the BA LLB. GNLU Gandhinagar's 176 all-India UG seats are split B.A. LL.B. 80, B.B.A. LL.B. 30, B.Com LL.B. 20, B.Sc. LL.B. 23 and B.S.W. LL.B. 23."
            source: gnlu
          - links:
              - { label: "Law (LLB) career guide", url: "llb.html" }
              - { label: "Law college finder", url: "colleges-law.html" }
              - { label: "CLAT coaching finder", url: "coaching-clat.html" }
              - { label: "CUET UG", url: "cuet-ug.html" }
    sources:
      - { id: clat-home, name: "Consortium of National Law Universities — home page", url: "https://consortiumofnlus.ac.in/", covers: "Founding date, 26 member NLUs, office-bearers", checked: 2026-10-14 }
      - { id: clat-pr, name: "Consortium of NLUs — CLAT 2027 Press Release (22 Jul 2026)", url: "https://consortiumofnlus.ac.in/clat-2027/notifications/Press_Release_CLAT_2027.pdf", covers: "Exam date and time, application window", checked: 2026-10-14 }
      - { id: clat-elig, name: "Consortium of NLUs — CLAT 2027 UG Eligibility", url: "https://consortiumofnlus.ac.in/clat-2027/ug-eligibility.html", covers: "45% / 40% Class 12 rule, appearing candidates, no age limit", checked: 2026-10-14 }
      - { id: clat-ins, name: "Consortium of NLUs — CLAT 2027 UG Instructions", url: "https://consortiumofnlus.ac.in/clat-2027/ug-instructions.html", covers: "Offline mode, PwD timing, who can appear, tie-break, application steps, documents, fees, hall ticket, reservation certificates", checked: 2026-10-14 }
      - { id: clat-fmt, name: "Consortium of NLUs — CLAT 2027 UG Question Paper Format", url: "https://consortiumofnlus.ac.in/clat-2027/ug-question-format.html", covers: "Marks, duration, questions, negative marking, section weightage", checked: 2026-10-14 }
      - { id: clat-faq, name: "Consortium of NLUs — CLAT 2027 FAQs", url: "https://consortiumofnlus.ac.in/clat-2027/FAQs.html", covers: "Programmes and academic year covered, counselling timing", checked: 2026-10-14 }
