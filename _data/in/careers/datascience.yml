  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "What is the real difference between Data Analyst and Data Scientist?"
            a: "Data Analysts primarily focus on collecting, cleaning and interpreting data to build reports and dashboards, using tools like Excel, SQL and Power BI or Tableau with minimal coding. Data Scientists go further — building predictive models and solving more complex business problems using statistics, Python and machine learning. This extra technical depth is also why Data Scientists generally earn meaningfully more."
          - q: "Do I need a coding background to start a career in data science?"
            a: "Not to start. Business Analyst, Data Analyst and BI Developer roles need minimal coding — Excel, SQL and Power BI/Tableau are genuinely enough for many entry-level and even mid-level roles. Deeper Python and machine learning skills matter more as you grow from Data Analyst into a full Data Scientist role and beyond."
          - q: "What is a realistic Data Scientist salary in India in 2026?"
            a: "Freshers commonly earn ₹5-10 LPA, with product companies and funded startups sometimes offering ₹10-12 LPA even at entry level. With 4-8 years of experience, salaries commonly reach ₹15-35 LPA. Company type explains much of the further spread — IT services and analytics firms commonly pay ₹5-28 LPA across experience levels, while product companies and FAANG-equivalent firms pay ₹14-80 LPA for comparable experience."
          - q: "Is it worth switching from Data Analyst to Data Scientist?"
            a: "For most experienced Data Analysts, yes — Data Scientists are reported to earn 40-80% more than Data Analysts at comparable experience levels. The switch typically requires 6-12 months of focused additional learning in statistics, Python and machine learning if you're already comfortable with SQL and data tools, or 12-18 months if you're starting from a more basic, Excel-only skill level."
          - q: "Is Data Science still worth pursuing in 2026, or is it oversaturated?"
            a: "It remains a strong long-term career choice — industry estimates point to a significant shortage of qualified data professionals in India, with demand growing across banking, healthcare, e-commerce and manufacturing. What has changed is that entry-level competition has increased as more students treat \"data science\" as a buzzword without building real depth — candidates with genuine SQL, statistics, Python and project experience continue to stand out clearly."
      - note: "Figures are indicative (2026) — confirm on the official college or authority website."
        class: "table-note mt-lg"
