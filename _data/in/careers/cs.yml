  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What is a Company Secretary?"
    parts:
      - overview:
          points:
            - "A Company Secretary is a governance and compliance professional certified by the <strong>ICSI</strong> to advise company boards, ensure compliance with the Companies Act, SEBI regulations and other corporate laws, and act as the legal bridge between a company, its board, and its shareholders."
            - "Like <a href=\"ca.html\">CA</a>, it's a professional qualification earned directly through ICSI, not a university degree."
            - "Every listed company and many large private companies in India are legally required to appoint a full-time Company Secretary, which keeps demand for the profession steady."
          more:
            - "CS professionals sign off on statutory filings, draft board resolutions and agreements, and are increasingly involved in Environmental, Social and Governance (ESG) reporting, M&amp;A and insolvency-related work."
            - "Many move into legal counsel, compliance leadership or independent practice."
  - id: "eligibility"
    hid: "elig-heading"
    alt: true
    eyebrow: "Eligibility"
    heading: "Who should choose CA, and when to start"
    intro: "CS suits students who enjoy reading and interpreting law, are meticulous about documentation and deadlines, and want a respected governance qualification without full-time university attendance."
    parts:
      - elig_cards:
          - icon: "cap"
            title: "After Class 10"
            points:
              - "There's no direct CS registration at this stage — focus on choosing a Class 11-12 stream first."
              - "Commerce with Business Studies helps, but Science and Arts students take up CS successfully too."
          - icon: "calendar"
            title: "After Class 12"
            points:
              - "Register for the <strong>CSEET</strong> (CS Executive Entrance Test) — open to students from any stream, with no minimum percentage requirement."
              - "Graduates (50%+) and postgraduates can skip CSEET via <strong>Direct Entry</strong> into the Executive Programme, after paying a CSEET exemption fee."
  - id: "admission"
    hid: "admission-heading"
    eyebrow: "One entrance test, then sequential levels"
    heading: "How CS admission actually works"
    intro: "You register directly with ICSI and progress through CSEET, Executive and Professional in sequence, alongside mandatory training."
    parts:
      - subhead: "How CS admission actually works"
      - table:
          head:
            - "Step"
            - "What happens"
          rows:
            -
              - "1. CSEET"
              - "Register and clear the CS Executive Entrance Test after Class 12 (graduates can use Direct Entry instead)."
            -
              - "2. Executive Programme"
              - "A roughly 9-month programme with two modules covering company law, tax and business laws."
            -
              - "3. Training programmes"
              - "Complete ICSI's mandatory orientation and skill-development programmes between levels."
            -
              - "4. Professional Programme"
              - "A roughly 15-month, more advanced programme covering governance, drafting, and specialised laws."
            -
              - "5. Practical Training"
              - "Complete ICSI's required practical/management training under a practising CS or company."
            -
              - "6. Membership"
              - "Apply to ICSI for membership and officially become a Company Secretary."
      - note: "ICSI has revised its syllabus and training structure in recent cycles (including a 2022 syllabus update and a further fee/training revision from 2026), so exact durations and requirements can shift — always confirm current details on the official ICSI website before registering."
  - id: "papers"
    hid: "papers-heading"
    alt: true
    eyebrow: "Know what you're up against"
    heading: "Papers, levels & passing criteria"
    intro: "Every paper is out of 100 marks (CSEET is out of 200 across its four parts). The same passing rule applies at every level."
    parts:
      - subhead: "Papers, levels &amp; passing criteria"
      - table:
          head:
            - "Level"
            - "Papers"
          rows:
            -
              - "CSEET (4 parts, single sitting)"
              - "1. Business Communication (50 marks) · 2. Legal Aptitude, Logical Reasoning & Quantitative Aptitude (70 marks) · 3. Economic & Business Environment (50 marks) · 4. Current Affairs (30 marks)"
            -
              - "Executive — Module 1"
              - "1. Jurisprudence, Interpretation & General Laws · 2. Company Law & Practice · 3. Setting Up of Business, Industrial & Labour Laws · 4. Corporate Accounting & Financial Management"
            -
              - "Executive — Module 2"
              - "5. Capital Market & Securities Laws · 6. Economic, Business & Commercial Laws · 7. Tax Laws & Practice"
            -
              - "Professional — Module 1"
              - "1. Environmental, Social & Governance (ESG) – Principles & Practice · 2. Drafting, Pleadings & Appearances · 3. Compliance Management, Audit & Due Diligence"
            -
              - "Professional — Module 2"
              - "4. Elective 1 (choose one, e.g. CSR & Social Governance, Intellectual Property Rights, or Artificial Intelligence (AI), Data Analytics & Cyber Security Laws) · 5. Strategic Management & Corporate Finance · 6. Corporate Restructuring, Valuation & Insolvency"
            -
              - "Professional — Elective 2"
              - "7. Elective 2 (choose one, e.g. Arbitration, Mediation & Conciliation, or Insolvency & Bankruptcy Law & Practice)"
      - prose:
          - "<strong>Passing criteria (same rule at every level):</strong> you must score at least 40% in each individual paper <em>and</em> at least 50% in aggregate across that level or module, in the same sitting. CSEET has no negative marking; falling short on either the per-paper or the aggregate condition means that level is not cleared."
          - list:
              - "Executive and Professional are each split into modules; you can attempt one module or all of them together, with a \"set-off\" allowed when taking modules together (surplus marks in one can cover a shortfall in the other's aggregate, as long as you still clear 40% in every paper)."
              - "Score 60%+ in a paper but still miss your module's overall pass mark, and ICSI grants an exemption in that paper for your next attempt."
              - "Professional's electives mean the exact paper you sit for slots 4 and 7 depends on which options you pick."
            ticks: true
        class: "prose reveal mt-lg"
      - note: "This reflects ICSI's New Syllabus (2022), the current scheme as of this writing. ICSI periodically revises paper names, elective options and module structure — always cross-check the latest scheme and requirements on icsi.edu before you register."
