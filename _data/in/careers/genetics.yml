  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What is Genetics?"
    parts:
      - overview:
          points:
            - "Genetics is the branch of biology that studies genes, DNA, heredity, and how traits pass from parents to offspring."
            - "It helps scientists understand life at the molecular level and develop solutions for inherited diseases, agriculture and biotechnology — genomics, genetic engineering, molecular genetics and population genetics are all major areas within the field."
            - "Genomic testing, precision medicine and biotechnology are all genuinely expanding, with industry outlooks citing over 20% projected job growth reflecting this demand."
          more:
            - "Here's the honest, important context though: Genetics as a standalone career is even more research and PhD-dependent than the closely related Biotechnology field."
            - "Most substantial roles — genomics research, gene therapy, academic positions — require advanced study, with one clear, genuine exception worth knowing about early: Genetic Counseling."
