  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Can Science and Arts students apply for BBA, or is it only for Commerce students?"
            a: "BBA is open to students from any stream — Science, Commerce and Arts alike. Unlike B.Com, it doesn't assume prior accounting knowledge, since it's a management-focused degree rather than a finance-focused one."
          - q: "Is Maths compulsory for BBA?"
            a: "No, not at most universities. Some quantitative aptitude is tested in entrance exams and covered in subjects like Business Statistics, but Maths in Class 11-12 is not a strict eligibility requirement at the majority of BBA programmes."
          - q: "What is the difference between BBA and Integrated MBA (IPM)?"
            a: "BBA is a standalone 3-year undergraduate degree. Integrated MBA (also called IPM, offered by a few IIMs and other institutes via IPMAT) is a 5-year combined undergraduate-plus-MBA programme taken directly after Class 12, leading straight to an MBA without a separate later application. They serve a similar long-term goal but are structured very differently — see our Integrated MBA guide for the full comparison."
          - q: "Is an MBA necessary after BBA?"
            a: "Not strictly necessary, but it's the most common next step for BBA graduates aiming at management and leadership roles, since an MBA (especially from a well-regarded institute) significantly widens both opportunities and starting salary compared to a BBA alone."
          - q: "Which is better, BBA or B.Com?"
            a: "Neither is universally better — they serve different goals. B.Com goes deeper into accounting, taxation and finance and suits students aiming at Chartered Accountant (CA), CS, Cost and Management Accountant (CMA) or an M.Com. BBA is broader and management-focused, covering marketing, HR and operations alongside finance, and suits students aiming at an MBA or a general business/management role."
      - note: "*Fee and salary figures are indicative, based on publicly available information as of 2026, and vary significantly by institution — always verify current figures on the official university website."
        class: "table-note mt-lg"
