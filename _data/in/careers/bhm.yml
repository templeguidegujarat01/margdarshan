  - id: "faq"
    hid: "faq-heading"
    alt: true
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "What is NCHM JEE?"
            a: "NCHM JEE (NCHM JEE) is the national entrance exam for admission to the 21 central Institutes of Hotel Management (IHMs) and several affiliated state/private institutes, testing English, general knowledge, quantitative and reasoning ability, and aptitude for service."
          - q: "Is BHM only useful for working in hotels?"
            a: "No. Graduates also work in airline cabin crew and ground services, cruise ships, event management, hospital administration (patient services), and corporate facility management — the degree's focus on service, operations and hospitality transfers to several client-facing industries."
          - q: "Do BHM graduates need to start with long working hours and shift work?"
            a: "Yes, typically. Entry-level hospitality roles usually involve rotational shifts, including nights, weekends and holidays, since hotels and hospitality operations run continuously — this is a genuine, common feature of early hospitality careers that improves with seniority."
          - q: "What is the difference between the central IHMs and private hotel management colleges?"
            a: "The central IHMs (like IHM Delhi/Pusa and IHM Mumbai) are government-run, affordable, and highly regarded for placements, admitted through NCHM JEE. Private hotel management colleges can offer good facilities and industry tie-ups too, but are generally costlier, so it's worth comparing specific placement records before choosing."
          - q: "How much do fresh BHM graduates earn in India?"
            a: "Starting salaries vary by hotel brand and role. Graduates joining large international hotel chains through campus placement tend to start on the higher end of the entry-level range, while smaller hotels and standalone properties typically pay less initially, with income growing meaningfully with experience and management responsibility."
      - note: "*Fee and salary figures are indicative, based on publicly available information as of 2026, and vary significantly by institution and employer — always verify current figures on the official NCHMCT or institute website."
        class: "table-note mt-lg"
