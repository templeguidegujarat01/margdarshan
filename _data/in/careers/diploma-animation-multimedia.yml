  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Can I do Diploma in Animation & Multimedia right after Class 10?"
            a: "Yes, many institutes offer a diploma directly after Class 10, while several also offer a shorter course specifically for Class 12 pass students from any stream. Duration and entry point vary by institute, so always check the specific programme structure."
          - q: "Do I need drawing skills to study animation?"
            a: "Traditional 2D animation benefits from drawing skills, but 3D animation, VFX and motion graphics rely more on software proficiency, spatial thinking and understanding of movement/timing than freehand drawing. Many students strengthen their drawing during the course itself."
          - q: "Which software should I learn for animation and multimedia?"
            a: "Adobe Photoshop, Illustrator, After Effects and Premiere Pro are widely used across the industry for design, motion graphics and editing. For 3D animation, Autodesk Maya and Blender are commonly taught, with Toon Boom for 2D animation. Depth of software training varies by institute."
          - q: "Can I freelance after this diploma?"
            a: "Yes, this is a genuine strength of the field. Many diploma holders freelance as video editors, motion graphics designers, or 2D/3D animators for studios, agencies and content creators, since animation/multimedia isn't a licensed profession and work is largely portfolio-driven."
          - q: "What is the difference between this diploma and a full animation degree?"
            a: "The diploma is typically a 1-3 year, practical, software-and-production-focused course. A B.Sc/B.Des in Animation or a dedicated VFX degree runs 3-4 years with deeper theory, storytelling and larger studio-scale project exposure, often giving stronger access to major studios and VFX houses."
      - note: "*Fee and salary figures are indicative, based on publicly available information as of 2026, and vary significantly by state, institute and employer — always verify current figures directly with your target institute."
