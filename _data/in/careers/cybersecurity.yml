    eyebrow: "The certification ladder"
    heading: "Certifications & higher studies"
    parts:
      - prose:
          - "Certifications function almost like a career ladder in this field: start with <strong>CompTIA Security+</strong> as your foundational credential, then move to <strong>CEH</strong> for offensive security or government/defence-linked roles. For advanced penetration testing, <strong>OSCP</strong> is the recognised gold standard, while <strong>CISSP</strong> and <strong>CISM</strong> mark the shift toward security management and governance roles. An <strong>M.Tech in Cyber Security via Graduate Aptitude Test in Engineering (GATE)</strong> or an <strong>MS abroad</strong> suits students aiming at research or global security leadership roles."
