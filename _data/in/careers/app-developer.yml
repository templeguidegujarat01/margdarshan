  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Should I learn native (Kotlin/Swift) or cross-platform (Flutter/React Native) first?"
            a: "If you want to work on consumer apps with millions of daily users at companies like Ola, Swiggy or PhonePe, native Android/iOS skills are generally preferred for core app teams and pay 10-20% more at the same experience level for performance-critical work. If you're more interested in startups, agencies, or building your own products quickly, Flutter or React Native let you build for both platforms with one codebase, at 30-40% lower development cost — and the salary gap with native narrows significantly at senior levels."
          - q: "What is a realistic App Developer salary in India in 2026?"
            a: "Freshers commonly earn ₹4-8 LPA. Mid-level developers with 3-5 years of experience typically earn ₹10-20 LPA. Senior developers commonly earn ₹25-50 LPA, with company type driving a large part of the spread — a senior native Android developer at an IT services company might earn ₹16-20 LPA, while the same seniority at a consumer tech startup can reach ₹28-40 LPA or more."
          - q: "Do I need a Mac to become an iOS developer?"
            a: "Yes, for building and testing real iOS apps you need a Mac, since Apple's development tools (Xcode) only run on macOS. Publishing an app to the App Store also requires an Apple Developer Program membership, which costs $99 per year. You can learn Swift fundamentals and experiment with a simulator before committing to either the hardware or the paid account."
          - q: "Can I freelance as an app developer in India?"
            a: "Yes, it's a genuinely established market. Freelance mobile developers commonly charge ₹500-3,000 per hour depending on experience and platform, though income depends heavily on client acquisition and workload management, similar to freelance web development. Many app developers combine full-time employment with occasional freelance projects rather than choosing one exclusively."
          - q: "Is native Android development still worth learning given Flutter's growth?"
            a: "Yes. Companies building consumer apps with millions of daily active users — Ola, Swiggy, PhonePe among them — strongly prefer native Android expertise for their core app teams, since performance and platform-specific capabilities matter more at that scale. Flutter has grown significantly and pays well, especially at senior levels, but native Android remains the preferred choice for performance-critical, high-scale consumer products specifically."
      - note: "Figures are indicative (2026) — confirm on the official college or authority website."
        class: "table-note mt-lg"
