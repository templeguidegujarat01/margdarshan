  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Do I need to be from the Arts stream to crack UPSC?"
            a: "No. UPSC is open to graduates of any discipline — Arts, Commerce, Science or Engineering. Arts subjects like History, Political Science, Sociology and Geography do overlap more directly with the General Studies syllabus, which is one reason many aspirants find an Arts background helpful, but it isn't a requirement."
          - q: "How many attempts do I get for UPSC Civil Services?"
            a: "General category candidates typically get 6 attempts up to age 32, OBC candidates get 9 attempts up to age 35, and SC/ST candidates have unlimited attempts up to age 37 — exact numbers and age limits are set each year in the official UPSC notification, so always check the current year's rules."
          - q: "What is the difference between IAS, IPS and IFS?"
            a: "IAS officers manage district and state administration and policy implementation. IPS officers lead police forces and law enforcement. IFS (Indian Foreign Service) officers represent India diplomatically abroad through embassies and international relations. All three, plus many other services, are allocated based on your UPSC rank and preference."
          - q: "How long does UPSC preparation typically take?"
            a: "Most successful candidates report roughly 1-2 years of serious, consistent preparation before their first attempt, though this varies significantly by individual background, prior subject knowledge and daily study hours. It's a marathon requiring sustained discipline, not a quick, short-term exam to prepare for."
          - q: "Is coaching necessary to clear UPSC?"
            a: "No, coaching isn't mandatory — many candidates clear UPSC through self-study using standard reference books, newspapers and online resources. Coaching can provide structure, peer accountability and exam strategy, which some aspirants find valuable, but it's a personal choice rather than a requirement."
      - note: "*Salary figures follow the 7th Central Pay Commission structure and are indicative, based on publicly available information as of 2026 — always verify current figures and exam rules on the official UPSC website (upsc.gov.in)."
        class: "table-note mt-lg"
      - source_link:
