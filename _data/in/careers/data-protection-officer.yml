      value: "DPDP Act, 2023 + DPDP Rules"
      source: "dpdp"
    - label: "Must appoint"
      value: "Significant Data Fiduciaries"
      source: "dpdp"
    - label: "Regulator"
      value: "Data Protection Board of India"
      source: "meity"
    - label: "Fixed degree"
      value: "None prescribed"
