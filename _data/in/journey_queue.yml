# journey_queue — which careers get a full Journey Blueprint next (journey-blueprint.html, _data/in/journey/<id>.yml).
# Each batch takes the 10 highest-ranked rows with status: todo, builds them, and marks them done with the
# blueprint id and batch number. Every title is copied exactly from assets/data/career-titles.json.
#
# How the ranking was made (written 2026-10-25, batch 5):
#   - We could not read search-volume data (Google Trends is not reachable from our build setup), so NO search
#     numbers are used or printed anywhere. The order is Margdarshan's editorial judgment.
#   - The judgment weighs (1) how many students sit the gateway exam or recruitment for the career — NEET (UG),
#     JEE Main, CTET and state police drives draw lakhs of candidates (Telangana's 2026 police drive alone received
#     5,77,064 applications, TSLPRB press note of 17 Sep 2026); (2) whether the career has a clear official route a
#     student can follow from Class 8; (3) spread across streams (science, commerce, arts, vocational, government).
#   - Careers already built stay in the list at the rank we would give them today, so the queue shows coverage.
#   - Specialist doctors (gynaecologist, cardiologist ...) sit low because they share the MBBS route already built;
#     one "specialist doctor (NEET-PG)" blueprint can later cover them all.
#
# Batch 6 re-rank (2026-10-26): the owner asked us to pick the next 10 by our own research instead of the queue
# order. Signals used (no numbers from them are printed on any page): (1) recruitment scale on official notices —
# RRB NTPC 2025 notified 3,058 + 5,810 posts, SSC CGL 2026 lists 10,731 tentative vacancies; (2) 2026 hiring
# reports — LinkedIn India "Jobs on the Rise 2026" (AI, cybersecurity, data roles) and Naukri JobSpeak 2026
# (insurance, AI / ML, BPO lead growth; banking and IT flat); (3) a clear official route from Class 8. Picked:
# Railway Ticket Clerk (RRB NTPC), Statistical Officer, IAF Fighter Pilot, Ethical Hacker, Data Analyst, Digital
# Marketing Manager, Actuary, Agricultural Officer, Air Traffic Controller, Insurance Underwriter. Forensic Science
# Officer was considered but skipped this batch: NFSU's 2026 admission rules sit behind portal logins and no current
# central recruitment notice was found. The previous 29–38 rows now start at rank 39, in the same order.
#
# Batch 7 re-rank (2026-10-26): same signals as batch 6. Central recruitment scale on official notices — RRB JE CEN
# 05/2025 (2,569 posts), UPSC ESE 2027 (about 480), NEET-PG and AIIMS NORCET (all-India tests), NDA & NA / Navy SSC,
# UPSC IES and Combined Geo-Scientist — plus a clear national route from Class 8. Picked: Government Mechanical
# Engineer, Government Electrical Engineer, Gynaecologist, Nursing Officer, Indian Navy Executive Officer, Homoeopathic
# Physician, Cost Accountant, Economist, Exploration Geologist, Medical Laboratory Technologist. Passed over this batch:
# Civil Judge (recruited only by state High Courts / PSCs — no central route the lean tier can print), Graphic
# Designer, Airline Cabin Crew Member and Investigative Journalist (no statutory body or central recruitment notice).
#
# Batch 8 re-rank (2026-10-28): same signals. Central recruitment notices — ISRO ICRB 2026 (99 + 34 Electronics,
# 21 + 13 Computer Science posts), Coast Guard Assistant Commandant 2027 batch (170), Coal India MT Advt 01/2026 (276
# Mining posts) — plus national statutory routes (DGCA CAR-66 AME licence, Patent Agent Examination 2027, NEET-PG,
# IMU CET / DG Shipping, NCAHP curricula for optometry and occupational therapy). Picked: Government Electronics
# Engineer, Government Computer Engineer, Indian Coast Guard Assistant Commandant, Aircraft Maintenance Engineer,
# Patent Attorney (built as Patent Agent — the registered title in India), Mining Engineer, Paediatrician, Marine
# Engineer, Optometrist, Occupational Therapist. Passed over: Defence Research Scientist (drdo.gov.in / rac.gov.in did
# not answer from our network and no 2026 RAC advertisement could be read), Food Safety Officer (FSOs are appointed by
# states; FSSAI's last direct CFSO drive was 2021), Forest Range Officer (state PSC recruitment only).
#
# Batch 9 re-rank (2026-10-28): same signals. Central recruitment and national entrances read on official files —
# NEET-PG 2026 (single entrance for M.D. / M.S.), UPSC Advt 07/2026 and 09/2026 (Specialist Grade III Orthopaedics,
# Unani Medical Officers, Library and Information Officer), KVS–NVS Notification 01/2025 (147 + 134 librarian posts),
# ONGC Advt 2/2026 (E1 engineers through CBT), IBBI's Limited Insolvency Examination (Phase 10 from 1 Oct 2026), NISM
# certification + SEBI Stock Brokers Regulations 2026, and AIISH Mysuru's 2026-27 prospectus. Picked (9): Psychiatrist,
# Orthopaedic Surgeon, Ophthalmologist, Unani Physician, Insolvency Resolution Professional, Stockbroker, Librarian,
# Speech-Language Pathologist, Petroleum Engineer. Passed over: Dialysis Technologist (RRB CEN 03/2025 had only 4
# posts and the NCAHP dialysis curriculum copy returned 403), Civil Judge / Judicial Magistrate / Sub-Divisional
# Magistrate / Forest Range Officer / Food Safety Officer (state recruitment only), Forensic Science Officer and
# Defence Research Scientist (no readable central notice again), design, media and creator careers (no statutory body).
#
# Batch 10 re-rank (2026-10-28): same signals. Central recruitment and statutory routes read on official files —
# KVS–NVS Notification 01/2025 (144 + 124 + 128 PE TGT, 63 PE PGT; 493 + 494 KVS and 495 NVS Special Educator posts),
# UPSC Advt 07/2026 (9 Cardiology and 21 Neurology Specialist Grade III posts, Deputy Superintending Archaeologist in
# ASI) and Advt 12/2026, NBEMS NEET-SS 2025 bulletin, NEET-PG 2026, SSC Combined Hindi Translators Examination 2026,
# NCTE B.P.Ed and DPSE norms, RCI / NBER Online Admission 2026, Yoga Certification Board guideline (Ministry of Ayush),
# and the Ministry of Tourism's IITF / IITG guidelines. Picked: Dermatologist, Cardiologist, Neurologist, Physical
# Education Teacher, Special Education Teacher, Technical Translator (built as the SSC Hindi–English translator road),
# Yoga Instructor, Tour Guide, Archaeologist, Preschool Teacher. Passed over: Town Planner (no central recruitment post
# or statutory council found in 2026 UPSC adverts), Audiologist (same AIISH / RCI degree as the speech-language
# pathologist already built), Operation Theatre / Anaesthesia Technologist (AIIMS CRE-5 notice and 2026 paramedical
# prospectus not readable on official hosts), Defence Research Scientist (drdo.gov.in and rac.gov.in timed out again).
# Re-rank freely when real search data is available; keep titles exact.
