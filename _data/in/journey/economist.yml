# Journey Blueprint — Economist (BA / B.Sc Economics → MA Economics → UPSC Indian Economic Service, central posts, UGC NET). Printed on journey-economist.html (_includes/journey-doubts.html).
# Rules, classes and the money items / sources several careers share: _data/in/journey_common.yml.
# This career cites the IES / ISS notice from statistical-officer.yml and UPSC Advertisement 06/2026 from the common file.
# Check: node scripts/check-journey-matrix.mjs
id: economist
v: 2
name: "Economist (MA Economics → UPSC Indian Economic Service)"
search: ["economist", "indian economic service", "ies officer", "ies economics", "economic advisor", "ma economics", "economic investigator"]
page: "economist.html"
roadmap: "roadmaps/economist.html"
doubts_page: "journey-economist.html"
gate: "Class 12 (Maths helps) → BA / B.Sc Economics (CUET (UG) for central universities) → MA in Economics, Applied Economics, Business Economics or Econometrics → UPSC Indian Economic Service (age 21–30), central posts such as MSME's Assistant Director (Economic Investigation), or UGC NET for teaching and research."
gate_source: [cuet26, iss26, upsc-adv06]
core:
  what:
    text: "Government economists analyse data and advise ministries on policy, prices, industry and growth. The Indian Economic Service (IES) is filled through a UPSC exam open to postgraduates in Economics, Applied Economics, Business Economics or Econometrics."
    source: iss26
  day:
    - "Collect and analyse economic data and surveys."
    - "Write policy notes, reports and forecasts for ministries."
    - "Study industries, prices and schemes, and suggest changes."
  pay:
    - { level: "Assistant Director Grade-II (Economic Investigation), Ministry of MSME (UPSC Advt 06/2026)", value: "Pay Level 7", source: upsc-adv06 }
  pay_note: "The 2026 IES / ISS notice does not print Indian Economic Service pay, and private economists' pay is not officially published, so neither is printed."
  routes:
    - { title: "UPSC Indian Economic Service", text: "A postgraduate degree in Economics, Applied Economics, Business Economics or Econometrics; age 21–30. The 2026 exam had 16 IES vacancies.", source: iss26 }
    - { title: "Central posts through UPSC selection", text: "MSME's Assistant Director Grade-II (Economic Investigation): Master's in Economics plus two years of survey or research experience; 50 vacancies in Advertisement 06/2026.", source: upsc-adv06 }
    - { title: "Teaching and research", text: "UGC NET in Economics with JRF leads to a funded Ph.D. and Assistant Professor posts.", source: [net-dec26, msje-jrf] }
  cost_time:
    - { label: "Degrees before IES", value: "A bachelor's, then a master's in Economics, Applied Economics, Business Economics or Econometrics", source: iss26 }
    - { label: "UPSC IES fee", value: "₹200 · women, SC, ST and PwBD exempt", source: iss26 }
  cost_note: "University fees differ by institution, so they are not printed here."
  challenges:
    - text: "IES is small: the 2026 exam had only 16 vacancies."
      source: iss26
    - text: "The written exam is 1,000 marks — four of its six papers are Economics papers of 200 marks each."
      source: iss26
    - text: "A candidate may compete for only one of the two services — IES or ISS — in a year."
      source: iss26
  not_for:
    - "You dislike reading, writing and arguing with data."
    - "You want to stop studying after a bachelor's degree — IES needs a master's."
    - "You fear Maths and Statistics — modern economics uses both."
journey:
  - stages: [c8, c9]
    title: "Read, question, count"
    do:
      - text: "IES needs a postgraduate degree in Economics or a related field, so plan for a bachelor's and a master's after Class 12."
        source: iss26
    doubts:
      - q: "What does a government economist do?"
        a: "They analyse data and advise ministries on policy, prices, industry and growth. The Indian Economic Service is recruited through UPSC from postgraduates in Economics and related subjects."
        next: "Read the Routes list above."
        source: iss26
      - q: "Is there an exam to become an economist in government?"
        a: "Yes. UPSC holds the Indian Economic Service / Indian Statistical Service Examination every year; the 2026 exam began on 19 June 2026."
        next: "Keep this exam in mind when you choose your degree."
        source: iss26
  - stages: [c10]
    title: "Pick a stream with Maths if you can"
    do:
      - text: "IES does not fix a Class 12 stream; it asks for a master's in Economics, Applied Economics, Business Economics or Econometrics."
        source: iss26
    stream: "Any stream; Maths or Economics in Class 11–12 helps."
    doubts:
      - q: "Which stream should I take for economics?"
        a: "Any stream can lead to a master's in Economics, which is what IES asks for. Maths or Economics in Class 11–12 makes the degree easier."
        next: "Take Maths if you can manage it."
        source: iss26
  - stages: [c11, c12]
    title: "CUET (UG) for a central university"
    do:
      - text: "Central universities admit to bachelor's programmes through CUET (UG); NTA runs the test and each university makes its own merit list."
        source: cuet26
    exams:
      - { name: "CUET (UG) 2026", when: "11–31 May 2026 (bulletin schedule)", source: cuet26 }
    doubts:
      - q: "How do I get into BA Economics at a central university?"
        a: "Through CUET (UG). NTA conducts the test, and each university prepares its own merit list and admission rules."
        next: "Check your chosen university's subject rules for CUET."
        source: cuet26
      - q: "How is CUET (UG) marked?"
        a: "Each test has 50 questions in 60 minutes, with +5 for a correct answer and −1 for a wrong one. You can take up to 5 of the 37 tests."
        next: "Pick tests your university asks for, such as Economics or Maths."
        source: cuet26
  - stages: [ug]
    title: "Bachelor's, then a master's"
    do:
      - text: "IES accepts only these master's degrees: Economics, Applied Economics, Business Economics or Econometrics."
        source: iss26
    doubts:
      - q: "Which master's degree is accepted for IES?"
        a: "A postgraduate degree in Economics, Applied Economics, Business Economics or Econometrics from a recognised university or an approved foreign university."
        next: "Choose one of these four for your master's."
        source: iss26
      - q: "Can an MBA graduate write IES?"
        a: "Not on the MBA alone. The 2026 notice accepts only a postgraduate degree in Economics, Applied Economics, Business Economics or Econometrics."
        next: "Check that your degree title matches."
        source: iss26
  - stages: [grad]
    title: "UPSC IES and central posts"
    do:
      - text: "IES written exam: General English 100, General Studies 100, General Economics I, II and III (200 each) and Indian Economics 200 — 1,000 marks — then a 200-mark viva."
        source: iss26
    exams:
      - { name: "UPSC IES / ISS 2026", when: "From 19 Jun 2026 (apply by 3 Mar 2026)", source: iss26 }
    money: [ugc-jrf]
    doubts:
      - q: "What is the age limit for IES?"
        a: "21 to 30 years on 1 August of the exam year — for 2026, born between 2 August 1996 and 1 August 2005 — with relaxation for some categories."
        next: "Plan your attempts within this window."
        source: iss26
      - q: "Can I write IES in the final year of my MA?"
        a: "Yes. Candidates who have appeared for, or will appear for, the qualifying exam may apply; they must show proof of passing if they are called for the interview."
        next: "Apply in your final year."
        source: iss26
      - q: "How many IES posts are there?"
        a: "The 2026 exam had 16 Indian Economic Service vacancies (one reserved for PwBD) and 28 Indian Statistical Service vacancies."
        next: "Prepare for a small, competitive exam."
        source: iss26
      - q: "Do women pay the IES fee?"
        a: "No. Women, SC, ST and PwBD candidates are exempt; others pay ₹200."
        next: "Choose your category correctly."
        source: iss26
      - q: "How are IES ties broken?"
        a: "The candidate with more marks in the Economics papers (General Economics I, II, III and Indian Economics) plus the personality test is ranked higher."
        next: "Put most of your effort into the Economics papers."
        source: iss26
      - q: "Can I apply for both IES and ISS in the same year?"
        a: "No. A candidate may compete for only one of the two services — the Indian Economic Service or the Indian Statistical Service."
        next: "Choose IES if your master's is in Economics."
        source: iss26
      - q: "Can I get a research fellowship in economics?"
        a: "Yes. Qualifying UGC NET in Economics in the JRF category gives ₹37,000 a month for 2 years, then ₹42,000 as SRF, when you join a Ph.D."
        next: "Write UGC NET during or after your MA."
        source: [msje-jrf, net-dec26]
  - stages: [work]
    title: "Other central economist posts"
    do:
      - text: "UPSC Advertisement 06/2026 had 50 posts of Assistant Director Grade-II (Economic Investigation) in the Ministry of MSME at Pay Level 7."
        source: upsc-adv06
    doubts:
      - q: "What does MSME's Assistant Director (Economic Investigation) post need?"
        a: "A Master's in Economics and two years' experience in investigations, surveys or research on small-scale industries. Age limit: 30 for UR / EWS, 33 for OBC and 35 for SC / ST."
        next: "Build survey or research experience after your MA."
        source: upsc-adv06
board_note: "Any board and any stream. IES only checks your master's degree."
board_source: iss26
