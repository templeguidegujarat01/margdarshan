title: "Studying in Ukraine: Advisory and NMC Rules"
seo_title: "Study in Ukraine from India: Embassy Advisory and NMC Rules"
description: "Ukraine for Indian students: the Embassy of India's advisory asking Indians to leave Ukraine (latest listed, 25 Oct 2022), NMC's academic-mobility route and FMGL rules for MBBS."
lede: "Before the war Ukraine was a major MBBS destination for Indians. The latest advisory listed on the Embassy of India in Kyiv's website still asks all Indian citizens to leave Ukraine. This page is for students already affected and for families asking whether to apply."
alert:
  text: "The Embassy of India in Kyiv's latest listed advisory (25 October 2022) advises all Indian citizens in Ukraine to leave immediately by available means. Do not plan a new admission while this advisory stands."
  source: emb_adv
facts:
  - { label: "Embassy advisory", value: "Leave Ukraine (25 Oct 2022, latest listed)", source: emb_adv }
  - { label: "Embassy services", value: "Kyiv embassy reopened 17 May 2022; visas from 30 May 2022", source: embassy }
  - { label: "Disrupted students", value: "NMC accepted Ukraine's academic mobility (Sep 2022)", source: nmc_amp_news }
  - { label: "MBBS rule", value: "NMC FMGL 2021 applies", source: nmc_fmgl }
card:
  line: "Embassy advises Indians to leave; mobility route for MBBS students"
  psw: "Not applicable"
  work: "Not applicable"
  funds: "Not applicable"
tests:
  - { label: "NEET-UG", need: "Needed for an Indian licence after any foreign MBBS (see FMGE eligibility)", source: nmc_fmgl }
pillars:
  language_and_eligibility:
    heading: "What the Indian rules say"
    parts:
      - points:
          - { t: "Any foreign MBBS must meet the NMC's FMGL Regulations 2021: at least 54 months, a 12-month internship in the same foreign institution, English medium, and a licence in that country.", source: nmc_fmgl }
      - links:
          - { label: "MBBS abroad: NMC rules", url: "study-abroad/mbbs-abroad.html" }
          - { label: "FMGE", url: "fmge.html" }
  intakes_and_streams:
    heading: "Admissions"
    parts:
      - warn: "We do not list Ukrainian intakes or courses while the Embassy of India's advisory to leave Ukraine stands."
        source: emb_adv
  tuition_and_living_costs:
    heading: "Costs"
    parts:
      - note: "No cost guide is given for Ukraine, for the same reason. There is also no free official UAH/INR reference rate."
  global_scholarships:
    heading: "Scholarships"
    parts:
      - note: "We list no scholarships for new study in Ukraine while the advisory stands."
  application_funnel:
    heading: "If your studies were interrupted"
    parts:
      - steps:
          - { title: "Register with the Embassy", text: "The Embassy of India in Kyiv runs a student registration module.", source: embassy }
          - { title: "Check the mobility route", text: "NMC accepted completing remaining semesters at universities in other countries with the parent Ukrainian university's approval, the degree still awarded by that university.", source: nmc_amp_news }
          - { title: "Check FMGL compliance", text: "Make sure the final degree meets the NMC rules before FMGE.", source: nmc_fmgl }
  visa_chokepoints:
    heading: "Travel and visas"
    parts:
      - points:
          - { t: "The Embassy's latest listed advisory asks Indians to leave Ukraine and lists border crossings via Romania, Poland, Hungary and Slovakia with the Indian missions' numbers.", source: emb_adv }
          - { t: "The Embassy resumed operations in Kyiv on 17 May 2022 and visa services on 30 May 2022.", source: embassy }
  post_study_work:
    heading: "Licence in India"
    parts:
      - points:
          - { t: "The Government told the Supreme Court that NMC's mobility notice was not a back door into Indian medical colleges.", source: nmc_amp_news }
          - { t: "After FMGE, a 12-month internship in India is needed; NMC's March 2026 circular sets FMG internship seat shares for State Medical Councils.", source: nmc_crmi }
