  - id: "fees"
    hid: "fees-heading"
    eyebrow: "Generally affordable"
    heading: "Fees & scholarships"
    parts:
      - prose:
          - "BCA is one of the more affordable routes into IT. Fees commonly range from roughly <strong>₹30,000 to ₹1,50,000 per year</strong> depending on the college — government colleges sit at the lower end, while private institutions charge more, sometimes going considerably higher at premium universities. Scholarships and fee concessions are available for eligible students at most institutions. Always confirm current fees directly on your target college's official admission page, since they vary significantly and are revised periodically."
