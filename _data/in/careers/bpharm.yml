    alt: true
    eyebrow: "The PCI stamp matters enormously"
    heading: "Admission process"
    parts:
      - chips:
          - label: "No single national exam"
            text: "Unlike MBBS's NEET, B.Pharm admission varies significantly by state — merit-based, state entrance exams, or university-specific tests."
          - label: "PCI approval is essential"
            text: "A B.Pharm degree from a PCI-approved institution gives you the right to register with your State Pharmacy Council and practise as a licensed pharmacist. Without that PCI stamp, the degree alone doesn't grant this."
          - label: "Verify current approval, not just affiliation"
            text: "Check whether your specific target college holds current PCI approval — university affiliation alone isn't the same thing."
          - label: "Mandatory internship fee"
            text: "PCI-approved colleges typically charge a separate fee for the final-year 6-month industrial training requirement."
  - id: "fees"
    hid: "fees-heading"
    eyebrow: "Wide range by college type"
    heading: "Fees & scholarships"
    parts:
      - prose:
          - "Government and more affordable colleges commonly charge <strong>₹40,000-1,00,000 per year</strong>, while private colleges range from <strong>₹1,00,000-2,50,000+ per year</strong> depending on the institute and city. Hostel accommodation, where needed, adds a further <strong>₹60,000-1,50,000 per year</strong>. Always confirm current fees directly on your target college's official admission page, and re-verify PCI approval status before paying any admission fees."
