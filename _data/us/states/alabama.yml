name: "Alabama"
abbr: AL
checked: 2026-10-22
review_by: 2027-04-22
lede: "In Alabama, the Alabama State Bar handles bar admission for lawyers, the Alabama Board of Medical Examiners and Medical Licensure Commission of Alabama license physicians, the Alabama State Board of Public Accountancy licenses CPAs and the Alabama Board of Nursing licenses registered nurses."

boards:
  # 50-state portal (2026-10-22): bar admission agency (NCBE jurisdiction page), medical board(s) (FSMB directory),
  # board of accountancy (NASBA directory), board of nursing (NCSBN member page). Links checked 2026-10-22.
  law: { body: "Alabama State Bar", url: "https://admissions.alabar.org/home", stat: "UBE", exam: "Uniform Bar Exam (MBE, MEE and MPT).", note: "MPRE required (passing score 75). NextGen UBE from July 2028.", src: ncbe_al }
