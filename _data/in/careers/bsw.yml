          - label: "How much time"
            text: "Fieldwork typically runs alongside coursework throughout the degree, often several hours per week or block placements during specific terms."
          - label: "What it prepares you for"
            text: "Direct entry into NGO, medical social work, or community development roles, since you graduate with genuine, demonstrable practical experience already."
