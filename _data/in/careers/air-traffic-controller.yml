  read_time: "8 min read"
  intro:
    - "Air traffic controllers keep aircraft safely separated on the ground and in the sky. In India civil air traffic control is run by the Airports Authority of India (AAI), which recruits Junior Executives (Air Traffic Control) through an online exam, a voice test and other checks, then trains them before they get an ATC licence and ratings."
