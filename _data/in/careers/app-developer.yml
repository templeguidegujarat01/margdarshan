  - id: "admission"
    hid: "admission-heading"
    alt: true
    eyebrow: "A shipped app speaks louder than a certificate"
    heading: "How hiring actually works"
    parts:
      - chips:
          - label: "A real, published app matters"
            text: "Even a small app live on the Play Store or App Store is reported to carry real weight in interviews — more than a certificate alone."
          - label: "Native vs cross-platform interviews differ"
            text: "Native roles at consumer-scale companies test deep platform knowledge and performance optimisation; cross-platform roles test framework depth and how well you handle the JS-to-native \"bridge.\""
          - label: "Company type changes pay substantially"
            text: "Product companies and funded startups pay 40-60% more than IT services firms and agencies for the same experience level."
          - label: "Freelance/agency route"
            text: "A genuinely established market, with rates commonly ₹500-3,000 per hour depending on experience and platform."
  - id: "fees"
    hid: "fees-heading"
    eyebrow: "Mostly free to learn — with one real iOS-specific cost"
    heading: "Cost of each route"
    parts:
      - prose:
          - "A B.Tech in CSE commonly costs <strong>₹2-8 lakh</strong> at government institutes and <strong>₹5-20 lakh</strong> at private colleges (see the <a href=\"cse.html\">CSE page</a>), while a BCA is generally more affordable at <strong>₹30,000-1,50,000 per year</strong> (see the <a href=\"bca.html\">BCA page</a>). App development itself is largely learnable for free, through official Android and Apple developer documentation and free Flutter/React Native tutorials. There is one genuine, unavoidable cost specific to iOS: an <strong>Apple Developer Program membership costs $99/year</strong> to publish apps to the App Store, plus you'll need a Mac to build and test iOS apps. Google Play, by contrast, has a one-time $25 registration fee."
