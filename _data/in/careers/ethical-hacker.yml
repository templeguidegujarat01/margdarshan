sections:
  - id: "quick"
    hid: "quick-heading"
    alt: true
    eyebrow: "Quick answers"
    heading: "Ethical Hacker at a glance"
    intro: "Check whether your Class 12 background qualifies. Duration and pay are in the summary at the top of the page."
    parts:
      - subhead: "Can I apply from my stream?"
      - streams:
          - label: "Science"
            fit: "Eligible"
            tone: "y"
            icon: "science"
          - label: "Commerce"
            fit: "Eligible with Maths"
            tone: "m"
            icon: "commerce"
          - label: "Arts / Humanities"
            fit: "Eligible with Maths"
            tone: "m"
            icon: "arts"
      - note: "PCM for B.Tech; BCA and B.Sc IT often accept any stream with Maths. Self-taught skills count heavily."
  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What does an Ethical Hacker do?"
    parts:
      - overview:
          points:
            - "Penetration testers scan, probe and exploit apps, networks, cloud setups and devices, then report risks and fixes."
            - "They run vulnerability assessments (VAPT), red-team exercises and bug-bounty research."
            - "Clear reporting matters as much as hacking skill — clients need to understand and fix the issues."
  - id: "who"
    hid: "who-heading"
    alt: true
    eyebrow: "Fit check"
    heading: "Who should become an Ethical Hacker"
    parts:
      - fit:
          match:
            - "Love figuring out how systems break."
            - "Learn constantly and practise in legal labs."
            - "Are ethical and discreet with sensitive data."
          mismatch:
            - "Want to “hack” without permission — that is illegal."
            - "Dislike writing reports."
            - "Expect a certificate alone to land a job."
  - id: "eligibility"
    hid: "elig-heading"
    eyebrow: "Eligibility"
    heading: "What you need, stage by stage"
    parts:
      - elig_list:
          - "Usually a degree in <strong>computer science, IT or BCA</strong>; strong self-learners from other backgrounds also break in."
          - "Hands-on skill in networking, Linux, web technologies and scripting."
          - "Private certifications (from international bodies) are valued but optional; none is a Government licence."
          - "Always work under a <strong>written authorisation</strong> from the system owner."
      - warn_box: "Testing a website or network without written permission is an offence under the IT Act, 2000 — even if you mean well."
  - id: "roadmap"
    hid: "roadmap-heading"
    alt: true
    eyebrow: "Step-by-step"
    heading: "Your full path to becoming an Ethical Hacker"
    parts:
      - steps:
          - title: "Class 12"
            text: "PCM keeps B.Tech open."
          - title: "Computer degree"
            text: "B.Tech CSE, BCA or B.Sc IT."
          - title: "Build skills"
            text: "Networks, Linux, web security, scripting; practise in legal labs and CTFs."
          - title: "Certifications"
            text: "Hands-on, reputable ones help in hiring."
          - title: "First job"
            text: "SOC analyst or junior VAPT tester."
          - title: "Grow"
            text: "Penetration tester, red-team lead, security consultant."
  - id: "exams"
    hid: "exams-heading"
