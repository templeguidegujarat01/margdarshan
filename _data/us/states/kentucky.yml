lede: "In Kentucky, the Kentucky Office of Bar Admissions handles bar admission for lawyers, the Kentucky Board of Medical Licensure licenses physicians, the Kentucky Board of Accountancy licenses CPAs and the Kentucky Board of Nursing licenses registered nurses."

