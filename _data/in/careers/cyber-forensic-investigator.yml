sections:
  - id: "quick"
    hid: "quick-heading"
    alt: true
    eyebrow: "Quick answers"
    heading: "Cyber Forensic Investigator at a glance"
    intro: "Check whether your Class 12 background qualifies. Duration and pay are in the summary at the top of the page."
    parts:
      - subhead: "Can I apply from my stream?"
      - streams:
          - label: "Science"
            fit: "Eligible"
            tone: "y"
            icon: "science"
          - label: "Commerce"
            fit: "Not eligible"
            tone: "n"
            icon: "commerce"
          - label: "Arts / Humanities"
            fit: "Not eligible"
            tone: "n"
            icon: "arts"
      - note: "Science is the usual route (PCM for computer science; PCM or PCB for forensic science). Some BCA programmes accept Commerce with Maths."
  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What does a Cyber Forensic Investigator do?"
    parts:
      - overview:
          points:
            - "Investigators seize and image devices correctly, recover deleted data, trace transactions and analyse logs, malware and communications."
            - "They write reports and may appear in court as expert witnesses, so chain-of-custody and method must be flawless."
            - "Work spans cybercrime (fraud, harassment), corporate investigations and incident response."
  - id: "who"
    hid: "who-heading"
    alt: true
    eyebrow: "Fit check"
    heading: "Who should become a Cyber Forensic Investigator"
    parts:
      - fit:
          match:
            - "Like computers, puzzles and investigation."
            - "Are patient, methodical and honest."
            - "Can write clear reports and explain them in court."
          mismatch:
            - "Want only coding work."
            - "Are disturbed by graphic or abusive content in evidence."
            - "Dislike documentation and procedure."
  - id: "eligibility"
    hid: "elig-heading"
    eyebrow: "Eligibility"
    heading: "What you need, stage by stage"
    parts:
      - elig_list:
          - "Class 12 Science for B.Sc Forensic Science (PCM/PCB) or B.Tech CSE (PCM); BCA may accept other streams with Maths."
          - "A specialised <strong>M.Sc in Digital/Cyber Forensics</strong> or equivalent training strengthens your profile."
          - "Government lab posts follow the qualifications in each UPSC or state recruitment notice."
  - id: "roadmap"
    hid: "roadmap-heading"
    alt: true
    eyebrow: "Step-by-step"
    heading: "Your full path to becoming a Cyber Forensic Investigator"
    parts:
      - steps:
          - title: "Class 12 Science"
            text: "PCM keeps both forensics and computer routes open."
          - title: "Degree"
            text: "B.Sc Forensic Science, B.Tech CSE or BCA."
          - title: "Specialise"
            text: "M.Sc Digital Forensics or hands-on certifications."
          - title: "First role"
            text: "Forensic analyst in a lab, police cyber cell, consulting firm or bank."
          - title: "Grow"
            text: "Senior examiner, incident-response lead, expert witness."
      - roadmap_card: "Cyber Forensic Investigator"
  - id: "exams"
    hid: "exams-heading"
    eyebrow: "Law & institutions"
    heading: "The legal and institutional framework"
    parts:
      - chips:
          - label: "IT Act, 2000"
            text: "Defines cyber offences and powers to investigate them."
            source: "itact"
          - label: "NFSU"
            text: "Central university specialising in forensic sciences, including digital forensics."
            source: "nfsu"
          - label: "I4C"
            text: "Indian Cyber Crime Coordination Centre under the Ministry of Home Affairs."
            source: "i4c"
          - label: "Government labs"
            text: "CFSL and state Forensic Science Laboratories recruit through UPSC and state PSCs."
  - id: "salary"
    hid: "salary-heading"
    alt: true
    eyebrow: "Indicative figures"
    heading: "Cyber Forensic Investigator pay in India"
    intro: "Pay varies a lot by employer, city and experience; these are broad, commonly reported ranges, not guarantees."
    parts:
      - salary:
          - label: "Analyst"
            value: "Entry level"
            text: "Labs, consultancies and banks hire trained graduates."
          - label: "Examiner / consultant"
            value: "Mid level"
            text: "Certified, experienced examiners earn more."
          - label: "Lead / expert"
            value: "High"
            text: "Incident-response and forensic leads in large firms."
  - id: "jobs"
    hid: "jobs-heading"
    eyebrow: "Where they work"
    heading: "Employers & growth path"
    parts:
      - chips:
          - label: "Employers"
            text: "Forensic labs, police cyber cells, Big 4 forensic teams, banks, cybersecurity firms"
          - label: "Government"
            text: "Scientific officer / assistant posts in CFSL and state FSLs through UPSC and state PSCs"
          - label: "Related"
            text: "Incident response, fraud investigation, e-discovery"
  - id: "proscons"
    hid: "pc-heading"
    alt: true
    eyebrow: "Honest take"
    heading: "Advantages and disadvantages"
    parts:
      - proscons:
          pros:
            - "Growing demand as cybercrime rises."
            - "Mix of tech and investigation."
            - "Government and private routes."
          cons:
            - "Disturbing content in some cases."
            - "Court appearances and strict procedures."
            - "Constant learning as technology changes."
  - hid: "related-heading"
    alt: true
    eyebrow: "Related careers"
    heading: "If you're considering Cyber Forensic Investigator, also look at"
    parts:
      - related:
          - name: "Forensic Science"
            sub: "Crime investigation science"
            href: "forensic-science.html"
          - name: "Cyber Security"
            sub: "Network & data protection"
            href: "cybersecurity.html"
          - name: "Ethical Hacker"
            sub: "Penetration testing"
            href: "ethical-hacker.html"
          - name: "Data Protection Officer"
            sub: "Privacy compliance"
            href: "data-protection-officer.html"
  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Which course is best for cyber forensics?"
            a: "A B.Sc/M.Sc in forensic science with digital forensics, or a computer-science degree followed by forensics training. NFSU is the specialist central university."
          - q: "Can I join a government forensic lab?"
            a: "Yes, through UPSC or state PSC recruitment for scientific posts; qualifications are in each notice."
          - q: "Is cyber forensics the same as ethical hacking?"
            a: "No. Forensics investigates after an incident; ethical hacking tests systems before attackers do."
      - note: "*Pay figures are indicative unless they quote an official pay level, and rules change: confirm eligibility, dates and fees on the official websites listed under Sources before you act."
        class: "table-note mt-lg"
