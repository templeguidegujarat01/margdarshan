  law: { body: "New Hampshire Supreme Court, Office of Bar Admissions", url: "https://www.courts.state.nh.us/nhbar", stat: "UBE", exam: "Uniform Bar Exam (MBE, MEE and MPT).", note: "MPRE required (passing score 79). NextGen UBE from July 2028.", src: ncbe_nh }
