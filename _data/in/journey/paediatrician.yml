  facts:
    - { label: "NEET-PG paper", value: "180 MCQs · 3 h 30 min · computer-based", source: npg26 }
    - { label: "Marking", value: "+4 correct · −1 wrong", source: npg26 }
    - { label: "MD duration", value: "3 years (2 after a PG diploma in the same subject)", source: pgmer23 }
    - { label: "District Residency", value: "3 months, compulsory", source: pgmer23 }
  stages:
    head: ["Stage", "What it is", "Rule"]
    rows:
      - ["NEET (UG)", "180 MCQs, 720 marks", "50th percentile (General)"]
      - ["MBBS", "Course + 12-month internship", "Internship done by NEET-PG cut-off"]
