            - "Diploma in Agriculture is a practical, field-focused course covering crop production, soil science, horticulture, plant protection, animal husbandry basics and farm management."
            - "It's offered at state agricultural universities' polytechnic wings and private agricultural institutes, typically running <strong>2-3 years</strong> depending on whether it's entered after Class 10 or Class 12."
            - "Unlike some diplomas, agriculture education in India isn't governed by a single uniform national diploma structure — duration, entry point and exact curriculum vary meaningfully by state and the affiliating state agricultural university, so always confirm the specifics for your target institute rather than assuming a single national format."
