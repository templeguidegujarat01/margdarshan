  - id: "faq"
    hid: "faq-heading"
    alt: true
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "What does COPA stand for?"
            a: "COPA stands for Computer Operator and Programming Assistant. It's a 1-year NCVT-affiliated trade covering computer fundamentals, office applications, basic programming concepts and typing/data entry skills."
          - q: "Does COPA make me a software programmer?"
            a: "No, not in the professional software developer sense. COPA introduces basic programming concepts (often in C language) as part of a broader computer literacy and office-skills course, but it isn't equivalent to a computer science degree or a dedicated programming diploma. It's a strong foundation, not a substitute for deeper technical study if you want a software development career."
          - q: "What is the difference between COPA and Diploma in Computer Engineering?"
            a: "COPA is a shorter, 1-year trade focused on office computer skills, basic programming exposure and data entry. Diploma in Computer Engineering is a longer, 3-year technical programme covering programming, networking, hardware and software development in much greater depth, opening doors to more technical IT roles."
          - q: "What jobs can I get after ITI COPA?"
            a: "Common roles include Computer Operator, Data Entry Operator, Office Assistant, DTP (Desktop Publishing) Operator, and various government clerical/computer operator posts, most accessed through separate recruitment exams."
          - q: "Can I start my own cyber cafe or DTP shop after COPA?"
            a: "Yes, this is a realistic and common path. Many COPA graduates start small cyber cafes, DTP/printing shops, or offer freelance data entry and typing services, particularly in smaller towns where such services remain in demand."
      - note: "*Fee and salary figures are indicative, based on publicly available information as of 2026, and vary significantly by state, institute and employer — always verify current figures directly with your target ITI."
