  # ------------------------------------------------------------------------------------------------ Taekwondo
  - slug: taekwondo
    short: "Taekwondo"
    domain: combat
    checked: 2026-10-17
    body: "World Taekwondo (WT) · national federation under dispute in India"
    card: "WT June 2026 scoring (turning kicks now double), 8 world and 4 Olympic weight classes, Kukkiwon Dan and WT licence, LA28 routes, SAI centres and CRPF posts."
    card_facts: ["Turning head kick = 6 points", "4 + 4 Olympic classes", "Senior from age 17"]
    eyebrow: "Sports Cockpit · Combat &amp; Mat · WT rules June 2026 · LA28 qualification"
    title: "Taekwondo — kicks, points, weight classes &amp; the road to LA28"
    lede: "Education Margdarshan's taekwondo map for India in simple words: how points are scored in a kyorugi (sparring) match under World Taekwondo's June 2026 rules, the weight classes for cadets, juniors, seniors and the Olympics, the papers every fighter needs, how LA28 places are won, the federation dispute in India, the SAI centres, who pays and the jobs after a medal."
    official:
      - { label: "WT LA28 qualification system (PDF)", url: "https://cdn.nocnsf.nl/media/nlqpjps2/tkw-la28-qualification-system.pdf" }
      - { label: "worldtaekwondo.org", url: "https://www.worldtaekwondo.org/" }
    facts:
      - { label: "Olympic weight classes (LA28)", value: "<strong>4 men · 4 women</strong> — 128 fighters", source: wt-la28 }
      - { label: "Match", value: "<strong>3 rounds × 2 min</strong>, best of three rounds", source: wt-rules }
      - { label: "Turning kick to the head", value: "<strong>6 points</strong> (straight head kick 3)", source: wt-rules }
      - { label: "Senior age", value: "<strong>17+</strong> in the year · junior 15–17 · cadet 12–14", source: wt-rules }
    sections:
      - id: rules
        nav: "Points &amp; classes"
        eyebrow: "Core rules &amp; selection formats"
        heading: "How a taekwondo match is scored, and the weight classes"
        parts:
          - p: "Taekwondo is a Korean kicking sport. In <strong>kyorugi</strong> (sparring) two fighters wear an electronic trunk protector and head guard; sensors decide most kicks, and judges score punches. The Olympics hold kyorugi only."
            source: "wt-rules,wt-la28"
          - table:
              caption: "Points under World Taekwondo rules (in force from 1 June 2026)"
              head: ["Technique", "Points"]
              rows:
                - ["Punch to the trunk protector", "<strong>1</strong>"]
                - ["Kick to the trunk protector", "<strong>2</strong>"]
                - ["Kick to the head", "<strong>3</strong>"]
                - ["<strong>Turning</strong> kick to the trunk", "<strong>4</strong> (double)"]
                - ["<strong>Turning</strong> kick to the head", "<strong>6</strong> (double)"]
                - ["Opponent gets a penalty (gam-jeom)", "<strong>1</strong> to you; <strong>2</strong> if it was for running away, falling or stepping out in the last 10 seconds of a round"]
            source: wt-rules
          - list:
              - "A match is <strong>3 rounds of 2 minutes</strong> with 1 minute's rest. In the <strong>best-of-three</strong> system you win by winning two rounds."
              - "A penalty (<strong>gam-jeom</strong>) is given for stepping over the boundary line, falling down, avoiding the fight, attacking after the referee stops play, and similar acts. <strong>Five gam-jeoms in one round</strong> lose you that round; <strong>ten in a match</strong> lose you the match."
              - "Points scored right after a prohibited act are cancelled."
            source: wt-rules
          - table:
              caption: "WT weight classes (kg)"
              head: ["Group", "Men", "Women"]
              rows:
                - ["<strong>Olympic</strong> (LA28)", "58 · 68 · 80 · +80", "49 · 57 · 67 · +67"]
                - ["<strong>Senior</strong> (World Championships)", "54 · 58 · 63 · 68 · 74 · 80 · 87 · +87", "46 · 49 · 53 · 57 · 62 · 67 · 73 · +73"]
                - ["<strong>Junior</strong> (15–17)", "45 · 48 · 51 · 55 · 59 · 63 · 68 · 73 · 78 · +78", "42 · 44 · 46 · 49 · 52 · 55 · 59 · 63 · 68 · +68"]
            source: wt-rules
          - note: "Ages count by <strong>year of birth</strong>, not the exact date: seniors are at least 17 in the year of the event, juniors 15–17 and cadets 12–14. Cadets have their own lighter classes, starting at 33 kg (boys) and 29 kg (girls)."
            source: wt-rules
      - id: recognition
        nav: "Recognition"
        eyebrow: "Institutional &amp; global recognition"
        heading: "Olympics, Asian Games, World Championships — and India's federation dispute"
        parts:
          - table:
              caption: "LA28 Olympic taekwondo — the hard numbers"
              head: ["Rule", "What it says"]
              rows:
                - ["Places", "<strong>128</strong> (64 men, 64 women); at most <strong>one per class per country</strong>, 16 per class"]
                - ["Route 1 — Olympic ranking", "The <strong>top 5</strong> in each class on the WT Olympic Ranking of <strong>January 2028</strong> (40 places)"]
                - ["Route 2 — Grand Slam", "The leader of each class in the WT Grand Slam Champions Series (8 places)"]
                - ["Route 3 — continental", "<strong>Asia's qualification tournament</strong>: the top 2 in each class (16 places for Asia)"]
                - ["Age", "Born on or before <strong>31 December 2011</strong> (at least 17)"]
                - ["Must also hold", "A <strong>Kukkiwon Dan certificate</strong> and a <strong>WT Global Athlete Licence</strong>"]
            source: wt-la28
          - list:
              - "To be entered through the continental tournament, a fighter must have at least one result such as a <strong>medal at any WT-calendar event</strong> (1 June 2026 – 31 May 2028), a world top-20 ranking, a last-16 finish at the 2025 or 2027 World Championships, or a <strong>national title</strong> in that period."
            source: wt-la28
          - table:
              caption: "Government cash award for a senior medal (₹ lakh)"
              head: ["Event", "Gold", "Silver", "Bronze"]
              rows:
                - ["<strong>Olympic Games</strong>", "75", "50", "30"]
                - ["Asian Games / Commonwealth Games", "30", "20", "10"]
                - ["World Championship (every 2 years)", "20", "14", "8"]
                - ["Asian Championship (every 2 years)", "7.5", "5", "2.5"]
            source: myas-cash
          - warn: "<strong>Who runs taekwondo in India is under dispute.</strong> In January 2026 the Delhi High Court ordered that <strong>neither</strong> the Taekwondo Federation of India nor India Taekwondo may act as the National Sports Federation until the Sports Ministry passes a reasoned decision. Education Margdarshan could not find that final Ministry order online. Before you pay for any 'national' event, check the Ministry's current list of recognised federations — a certificate from an unrecognised body does not count for jobs."
            source: "dhc-tkd26,rrc-wr26"
      - id: eligibility
        nav: "Papers &amp; weigh-in"
        eyebrow: "Physical benchmarks &amp; anti-doping"
        heading: "The papers, the two weigh-ins and anti-doping"
        parts:
          - list:
              - "At WT and continental championships and multi-sport Games you need: the nationality of your team, a recommendation from your national federation, a <strong>Kukkiwon Dan or Poom certificate</strong> (black-belt grade) and a <strong>WT Global Athlete Licence</strong>."
            source: wt-rules
          - list:
              - "<strong>General weigh-in</strong>: the day <strong>before</strong> you fight. If you miss the first time, you get <strong>one more try</strong> inside the time limit."
              - "<strong>Random weigh-in</strong>: on the morning of the fight, a share of each class is picked by computer (20% if more than 32 fighters). You may be up to <strong>5% over</strong> your class; miss it or skip it and you are <strong>disqualified</strong>. There is no second try."
              - "Cadets and juniors weigh in wearing underwear and get <strong>100 g</strong> extra."
            source: wt-rules
          - list:
              - "Under the anti-doping code you must be <strong>available for testing</strong> and check every medicine against the <strong>Prohibited List</strong>; if no permitted treatment exists, apply to NADA for a <strong>TUE</strong>."
            source: nada-rr
      - id: roadmap
        nav: "Roadmap"
        eyebrow: "Grassroots-to-elite residential pipeline"
        heading: "From the club mat to the national camp"
        parts:
          - table:
              caption: "The taekwondo ladder"
              head: ["Step", "Age", "What happens"]
              rows:
                - ["1. Club &amp; belts", "From childhood", "Learn at a club and earn your grades up to a <strong>Kukkiwon Dan or Poom</strong> (black-belt) certificate"]
                - ["2. Cadet events", "12–14", "Lighter cadet classes; state and national cadet championships"]
                - ["3. SAI Training Centre", "12–18", "Up to 8th at Sub-Junior/Junior Nationals, or top 3 in the state, plus a battery of tests"]
                - ["4. Junior", "15–17", "Junior classes; World Taekwondo Junior Championships"]
                - ["5. SAI NCOE / Khelo India", "Scouted", "Residential training; Khelo India athletes are picked from recognised competitions"]
                - ["6. Senior &amp; ranking events", "17+", "WT G1/G2 opens, Grand Prix and World Championships build your <strong>world and Olympic ranking</strong>"]
            source: "wt-rules,sai-schemes,kia-guide,wt-la28"
          - list:
              - "You <strong>cannot apply</strong> to become a Khelo India athlete — scouts pick from recognised competitions; create your profile on the <strong>National Sports Repository System</strong> with age proof."
            source: kia-guide
      - id: academies
        nav: "Centres"
        eyebrow: "Top elite academies &amp; cities"
        heading: "Where India's taekwondo fighters train"
        parts:
          - table:
              caption: "SAI National Centres of Excellence with taekwondo"
              head: ["Centre", "Other sports there"]
              rows:
                - ["<strong>Thiruvananthapuram</strong>, Kerala", "Athletics, cycling, football, volleyball"]
                - ["<strong>Bengaluru</strong>, Karnataka", "Athletics, hockey, weightlifting"]
                - ["<strong>Guwahati</strong>, Assam", "Archery, athletics, boxing, cycling, fencing, football"]
                - ["<strong>Lucknow</strong>, Uttar Pradesh", "Athletics, hockey, weightlifting, wrestling"]
            source: sai-schemes
          - note: "Taekwondo is also taught at SAI Training Centres (ages 12–18) and in SAI's school and college extension centres."
            source: sai-schemes
          - p: "<strong>Inspire Institute of Sport (IIS), Vijayanagar, Karnataka</strong> lists taekwondo among its sports, with athlete residences, recovery, physiotherapy and sports science on campus."
            source: iis-sports
      - id: costs
        nav: "Gear &amp; cost"
        eyebrow: "Equipment costs &amp; who pays"
        heading: "Protectors, belts and who pays the bills"
        parts:
          - list:
              - "At WT-calendar events a fighter wears a <strong>WT-approved</strong> dobok, electronic trunk and head protectors, groin guard, forearm and shin guards, gloves and <strong>sensing socks</strong>, plus a mouthguard. Fighters must bring their own approved protective gear, gloves and mouthguard. Education Margdarshan does not print shop prices — no governing body publishes them."
              - "Each Dan or Poom grading and the WT Global Athlete Licence are separate costs paid through your federation."
            source: wt-rules
          - table:
              caption: "Who pays — taekwondo ladder"
              head: ["Stage", "Paid by", "What you get"]
              rows:
                - ["SAI centre trainee", "Sports Authority of India", "Coaching, boarding, sports science, diet"]
                - ["Khelo India athlete", "Ministry of Youth Affairs &amp; Sports", "<strong>₹6.28 lakh a year</strong> incl. ₹1.20 lakh cash"]
                - ["Olympic prospect", "TOPS Core Group", "<strong>₹50,000 a month</strong> + approved training plan"]
                - ["Athlete in hardship", "PDU National Welfare Fund", "Up to ₹2.50 lakh"]
            source: "sai-schemes,pib-support"
          - list:
              - "<strong>Weight-cutting with pills or powders</strong> is a doping risk: no supplement is 100% safe and <strong>strict liability</strong> applies — food first, with a certified nutritionist."
            source: nada-supp
      - id: earnings
        nav: "Earnings &amp; jobs"
        eyebrow: "Earning channels &amp; central job quotas"
        heading: "Awards, pension and sports-quota jobs"
        parts:
          - list:
              - "Taekwondo is one of the <strong>65 sports</strong> in the central sports quota for <strong>Group C</strong> posts, with up to 5 years' age relaxation (10 for SC/ST)."
              - "Medals at the Olympics, Asian Games, Commonwealth Games or World Championships can bring up to <strong>three out-of-turn promotions</strong>."
            source: dopt-2022
          - list:
              - "<strong>CRPF's 2026 sports quota</strong> has <strong>14 taekwondo (kyorugi) posts</strong>: women 46, 49, 53, 57 and 62 kg; men 58, 63, 68 and 74 kg."
            source: crpf26
          - list:
              - "<strong>Pension to Meritorious Sportspersons</strong>: ₹12,000–20,000 a month after retirement."
            source: pib-support
      - id: traps
        nav: "Red flags"
        eyebrow: "Disqualification traps"
        heading: "Mistakes that end a fighter's tournament"
        parts:
          - list:
              - "<strong>Skipping or failing the random weigh-in</strong> on fight day — instant disqualification, no second try."
              - "<strong>No Kukkiwon certificate or WT licence</strong> when you are picked for a WT or Asian event."
              - "<strong>Running out of the ring or falling in the last 10 seconds</strong> — that penalty gives the opponent 2 points."
              - "<strong>Tampering with the electronic protector or sensors</strong> — disqualification."
            source: wt-rules
          - list:
              - "<strong>Paying for a 'national' event of an unrecognised body</strong> — the certificate may be worthless for jobs and selection."
            source: "dhc-tkd26,rrc-wr26"
      - id: doubts
        nav: "Player doubts"
        eyebrow: "Real-world player doubts"
        heading: "Late start, black belt, jobs, money and certificates — straight answers"
        parts:
          - qa:
              q: "I am 17, 19 or 21. Is it too late to start taekwondo?"
              a: "Not for competing: a senior is anyone <strong>17 or older</strong> in the year, with no upper limit. It is late for the free pipelines — SAI Training Centres take ages <strong>12–18</strong> — so you will train at a club and need national and WT-calendar results to be noticed. The real clock is the job deadline: Railways sports quota stops at <strong>25</strong> and CRPF at <strong>23</strong> (28 for an unreserved sportsperson after relaxation)."
            source: "wt-rules,sai-schemes,rrc-wr26,crpf26"
          - qa:
              q: "Do I need a black belt to compete?"
              a: "For World Taekwondo, Asian and multi-sport events, yes: you must hold a <strong>Kukkiwon Dan or Poom certificate</strong> and a <strong>WT Global Athlete Licence</strong>. LA28 also asks for a Kukkiwon Dan certificate. Get your grades through a recognised club so the certificate is issued by Kukkiwon."
            source: "wt-rules,wt-la28"
          - qa:
              q: "Which government jobs can taekwondo get me?"
              a: "<strong>Central Group C posts</strong> under DoPT rules list taekwondo among 65 sports. <strong>CRPF's 2026 sports quota</strong> had <strong>14 taekwondo posts</strong> across nine weight classes. Western Railway's 2026-27 notice had <strong>no taekwondo posts</strong> — each zone advertises only the events its team needs."
            source: "dopt-2022,crpf26,rrc-wr26"
          - table:
              caption: "Sports-quota job routes open in 2026 — age, qualifying results, pay"
              head: ["Route", "Age", "Main qualifying results", "Pay level"]
              rows:
                - ["Railways <strong>Level 5/4</strong> (graduates)", "18–25 on 1 Jan 2027", "Played the <strong>Olympics</strong>, or top 3 at a World Cup, World Championship, Asian Games, Commonwealth Games or Youth Olympics", "Level 5/4"]
                - ["Railways <strong>Level 3/2</strong> (12th, or 10th + apprenticeship)", "18–25 on 1 Jan 2027", "Top 3 at <strong>Senior, Youth or Junior Nationals</strong>, National Games or All India Inter-University; or Federation Cup gold", "Level 3/2"]
                - ["Railways <strong>Level 1</strong>", "18–25 on 1 Jan 2027", "Played for your state and finished <strong>at least 8th at Senior Nationals</strong>; or top 3 at the Federation Cup", "Level 1"]
                - ["CRPF <strong>Head Constable (GD)</strong> (10+2)", "18–23 on 1 Aug 2026; sportspersons get <strong>+5 years</strong> (OBC +8, SC/ST +10)", "Played for India; or top 3 for your state at Nationals or National Games; or <strong>gold/silver at Junior Nationals</strong>", "Level 4 · ₹25,500–81,100"]
                - ["CRPF <strong>Constable (GD)</strong> (10th pass)", "18–23 on 1 Aug 2026; sportspersons get <strong>+5 years</strong> (OBC +8, SC/ST +10)", "Played for your state at <strong>Senior or Junior Nationals</strong>; or top 3 at SGFI school nationals or Khelo India Games", "Level 3 · ₹21,700–69,100"]
            source: "rrc-wr26,crpf26"
          - note: "Railways count results from <strong>1 April 2024</strong>; CRPF counts the <strong>two years before 30 September 2026</strong>. Railways fee ₹500 (₹400 back if you attend the trial; ₹250, refunded in full on attending, for SC/ST, women, PwBD, minorities, ex-servicemen and EBC). CRPF fee ₹100 for UR/OBC/EWS men; free for women, SC, ST and ex-servicemen. CRPF picks sign a <strong>₹1 lakh bond to serve at least 3 years</strong>."
            source: "rrc-wr26,crpf26"
          - qa:
              q: "We are a lower-middle-class family. How do we keep costs down?"
              a: "Aim for the free seats: SAI Training Centres and the four taekwondo NCOEs give <strong>coaching, boarding, sports science and diet</strong>, and a Khelo India athlete gets <strong>₹6.28 lakh a year</strong>. A fighter in hardship can apply to the PDU National Welfare Fund for up to ₹2.50 lakh."
            source: "sai-schemes,pib-support"
          - qa:
              q: "Does any 'national' certificate count for a job?"
              a: "No. Railways will <strong>not recruit on a certificate from a federation MoYAS did not recognise</strong> at the time of the championship, and CRPF counts only championships of MoYAS-recognised federations or the IOA's National Games. In taekwondo this matters more than usual, because the High Court has said neither rival body may act as the national federation until the Ministry decides."
            source: "rrc-wr26,crpf26,dhc-tkd26"
