# USA Edition — program and institutional accreditors (global-platform Phase 11).
# Three different things are never merged on the site:
#   institutional accreditation  a recognized accreditor accredits the whole school (see ed_dapip)
#   program accreditation        a specialized body accredits one degree program (ABET, LCME, ABA …)
#   professional eligibility     licensing boards set their own rules (licenses.yml)
# College lists come from IPEDS, which shows which schools award a degree — NOT whether a program
# is accredited. Pages therefore link each accreditor's own directory instead of marking schools.
# Fields: name, scope (institutional | program), meaning (what it is; no claims beyond the sources),
#         source (id in sources.yml for the official directory).
institutional:
  name: "Institutional accreditation"
  scope: institutional
  meaning: "A recognized accreditor reviews the whole college. The U.S. Department of Education lists accredited institutions and their accreditors."
  source: ed_dapip
abet:
  name: "ABET"
  scope: program
  meaning: "Accredits college programs in engineering, computing, applied and natural science, and engineering technology. NCEES designs the FE exam for students finishing EAC/ABET-accredited engineering degrees."
  source: abet_find
lcme:
  name: "LCME (Liaison Committee on Medical Education)"
  scope: program
  meaning: "Accredits programs leading to the M.D. degree."
  source: lcme_directory
coca:
  name: "COCA (AOA Commission on Osteopathic College Accreditation)"
  scope: program
  meaning: "Accredits colleges of osteopathic medicine, which award the D.O. degree."
  source: coca_schools
coda:
  name: "CODA (Commission on Dental Accreditation)"
  scope: program
  meaning: "Accredits dental education programs, including D.D.S. and D.M.D. programs."
  source: coda_programs
acpe:
  name: "ACPE (Accreditation Council for Pharmacy Education)"
  scope: program
  meaning: "Accredits Doctor of Pharmacy (Pharm.D.) programs."
  source: acpe_programs
capte:
  name: "CAPTE (Commission on Accreditation in Physical Therapy Education)"
  scope: program
  meaning: "Accredits physical therapist (DPT) and physical therapist assistant programs."
  source: capte_directory
aba:
  name: "American Bar Association (Council of the Section of Legal Education)"
  scope: program
  meaning: "Approves law schools that award the J.D. Most jurisdictions require a J.D. from an ABA-approved school to take the bar exam."
  source: aba_approved
ccne:
  name: "CCNE (Commission on Collegiate Nursing Education)"
  scope: program
  meaning: "Accredits nursing degree programs."
  source: ccne_directory
acen:
  name: "ACEN (Accreditation Commission for Education in Nursing)"
  scope: program
  meaning: "Accredits nursing education programs."
  source: acen_directory
apa:
  name: "American Psychological Association (APA)"
  scope: program
  meaning: "Accredits doctoral programs, internships and postdoctoral residencies in health service psychology (for example clinical and counseling psychology)."
  source: apa_accredited
aacsb:
  name: "AACSB International"
  scope: program
  meaning: "Accredits business schools, including accounting programs. It is voluntary."
  source: aacsb_accredited
