name: "New Jersey"
abbr: NJ
checked: 2026-10-22
review_by: 2027-04-22
lede: "In New Jersey, the New Jersey Board of Bar Examiners handles bar admission for lawyers, the New Jersey State Board of Medical Examiners licenses physicians, the New Jersey State Board of Accountancy licenses CPAs and the New Jersey Board of Nursing licenses registered nurses."

boards:
