    alt: true
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "What does an Instrument Mechanic actually work on?"
            a: "Industrial measuring and control instruments — pressure gauges, temperature sensors, flow meters, control valves and process control panels — used in factories, power plants and process industries to monitor and control production processes."
          - q: "How long is the ITI Instrument Mechanic course?"
            a: "Instrument Mechanic is typically a 2-year NCVT-affiliated trade, combining instrumentation theory, calibration practice and substantial hands-on work with industrial measuring and control devices."
          - q: "Which industries hire Instrument Mechanics?"
            a: "Oil & gas, power plants (thermal, hydro), chemical and process industries, pharmaceutical manufacturing, and cement/steel plants are major employers, since these industries rely heavily on precise process monitoring and control instrumentation."
          - q: "What is the difference between Instrument Mechanic and Electronics Mechanic?"
            a: "Instrument Mechanic focuses on industrial measuring and control instruments used in factories and process plants. Electronics Mechanic focuses on consumer electronics repair — TVs, appliances, mobile devices. Instrument Mechanic is industrial/process-plant oriented; Electronics Mechanic is consumer-electronics oriented."
          - q: "Does this trade include PLC (Programmable Logic Controller) training?"
            a: "Basic exposure to PLC and automated control concepts is increasingly included in modernised syllabi, though depth varies significantly by institute. Many Instrument Mechanics pursue a separate, more advanced PLC/SCADA certification afterward to specialise in industrial automation, which can meaningfully boost pay."
      - note: "*Fee and salary figures are indicative, based on publicly available information as of 2026, and vary significantly by state, institute and employer — always verify current figures directly with your target ITI."
