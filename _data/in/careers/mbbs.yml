    eyebrow: "Almost the default next step"
    heading: "Higher studies"
    parts:
      - prose:
          - "<strong>NEET-PG</strong>, leading to an <strong>MD (Doctor of Medicine)</strong> or <strong>MS (Master of Surgery)</strong>, is not legally mandatory but has become close to a default next step for most MBBS graduates, since specialisation substantially raises both earning potential and the range of available roles. This typically adds another 3-5 years of preparation and study. Super-specialisation (DM/MCh) follows for those pursuing narrower fields like cardiology or neurosurgery, and some graduates pursue an <strong>Master of Business Administration (MBA) in Healthcare Management</strong> or move into medical research and public health policy instead of clinical practice."
