# Sports, Olympics & Performing Arts Cockpit (India edition) -> sports-hub.html (hub), football.html, wrestling.html,
# chess.html, cricket.html, hockey.html, kabaddi.html, athletics.html, boxing.html, badminton.html, shooting.html,
# swimming.html
# Rendered by _includes/sports-cockpit.html (hub) and _includes/sport-page.html (each sport); validated by
# scripts/check-in-data.mjs.
# Part kinds are the exam console's (p, list, table, note, warn, links). Every p / list / table and every hero
# fact must carry `source:` naming an id from that sport's (or the hub's) sources[]. Highlight the words a
# student must not miss with <strong>.
# Eight fixed blocks per sport, in this order (the numbered Sources block makes nine):
#   rules, recognition, eligibility, roadmap, academies, costs, earnings, traps
# Facts come only from the governing body's own rule book or notices (UWW, IFAB, FIDE, AIFF, ICC, BCCI/IPL, FIH,
# Hockey India, AKFI/PKL, World Athletics, AFI, World Boxing, BWF, BAI, ISSF, NRAI, World Aquatics, SFI) or Government
# of India files (MYAS, DoPT, SAI, NADA, PIB, All India Radio), read on `checked` (a sport's own `checked` overrides). An academy's own notice is used only for that academy. Coaching, fan sites and private
# news outlets are not used.
# domains[]: the five hub tiles. sports: slugs that have a deep page here; guides: existing Margdarshan pages that
# cover the domain; next: disciplines listed by name only (no page yet, so no link).
checked: 2026-10-15

hub:
  eyebrow: "Sports, Olympics &amp; Performing Arts Cockpit · India"
  title: "Sports &amp; Performing Arts Cockpit — grassroots to podium"
  lede: "Education Margdarshan's map of non-academic careers: the rule book, the age and weight limits, the selection ladder, the residential camps, who pays at each step and the government jobs at the end — one sport at a time, every fact tied to an official file."
  facts:
    - { label: "Sports in the central sports quota", value: "<strong>65 disciplines</strong>, Group C posts only", source: dopt-2022 }
    - { label: "Khelo India athlete support", value: "<strong>₹6.28 lakh a year</strong>, incl. ₹1.20 lakh cash", source: pib-support }
    - { label: "TOPS Core Group allowance", value: "<strong>₹50,000 a month</strong> + approved training plan", source: pib-support }
    - { label: "Olympic gold cash award", value: "<strong>₹75 lakh</strong> (silver ₹50 L · bronze ₹30 L)", source: myas-cash }
  ladder:
    caption: "Who pays at each level — the central government ladder"
    head: ["Level", "Scheme", "What the athlete gets"]
    rows:
      - ["Age 8–14, school", "SAI National Sports Talent Contest (adopted schools, akharas)", "Kit ₹2,000 · competition exposure ₹2,000 · stipend ₹3,000 for 10 months, each a year"]
      - ["Age 9–18, talent hunt", "KIRTI (Khelo India Rising Talent Identification)", "Talent Assessment Centres (174) test children for a place in the pipeline"]
      - ["Age 12–18, district/state medallist", "SAI Training Centre (STC)", "Training at state-built infrastructure with SAI coaches; entry after a battery of tests"]
      - ["Scouted elite junior", "SAI National Centre of Excellence (NCOE)", "Residential training, coaches, sports science and individual diets set by nutritionists"]
      - ["Scouted national talent", "Khelo India Athlete (KIA)", "₹6.28 lakh a year for training, coaching, education, equipment — ₹1.20 lakh of it paid to the athlete as cash"]
      - ["Junior medal prospect", "TOPS Development Group", "₹25,000 a month out-of-pocket allowance"]
      - ["Olympic / Paralympic prospect", "TOPS Core Group", "₹50,000 a month + the whole training plan approved by the Mission Olympic Cell"]
      - ["Athlete in need", "Pandit Deendayal Upadhyay National Welfare Fund", "Up to ₹2.50 lakh for training, equipment and competitions"]
      - ["Retired champion", "Pension to Meritorious Sportspersons", "₹12,000 to ₹20,000 a month"]
    source: "sai-schemes,pib-transform,pib-support"
  quota:
    - "Sports-quota appointments are allowed only to <strong>Group C (and erstwhile Group D)</strong> posts filled by direct recruitment outside UPSC — <strong>never to Group A or B</strong> by direct recruitment."
    - "Departments may hold back <strong>up to 5%</strong> of the vacancies they send to the Staff Selection Commission for sportspersons, as long as sports plus all other reservations stay within <strong>50%</strong>."
    - "Upper age limit is relaxed by <strong>up to 5 years (10 years for SC/ST)</strong> for qualifying sportspersons."
    - "Since 4 March 2024, medal winners of the <strong>Khelo India Youth Games (above-18 category), University, Para and Winter Games</strong>, Junior Nationals and SGFI school games also qualify; their certificate comes from the <strong>SAI</strong> officer in charge."
    - "First preference goes to those who <strong>represented India</strong>; then State/UT medallists (up to 3rd) at Senior or Junior Nationals or the National Games; then university, Khelo India and school-games medallists."
    - "A serving employee can earn up to <strong>three out-of-turn promotions</strong> in a career for medals at the Olympics, Commonwealth Games, Asian Games or World Championships."
  quota_source: dopt-2024
  sources:
    - id: dopt-2022
      name: "DoPT — Instructions on Recruitment/Promotion for Sportspersons (consolidated, 18 Nov 2022)"
      url: "https://yas.gov.in/sites/default/files/Compendium%20dated%2018.11.2022.pdf"
      covers: "List of 65 qualifying sports, Group C limit, 5% / 50% ceiling, age relaxation, out-of-turn promotion"
      checked: 2026-10-15
    - id: dopt-2024
      name: "DoPT Office Memorandum 14034/1/2020-Pers. Policy (D), 4 March 2024 — Incentive for Sportspersons"
      url: "https://dopt.gov.in/sites/default/files/Incentive%20for%20Sportpersons.pdf"
      covers: "Revised eligibility (Khelo India Games, Junior Nationals, SGFI, chess titles), certifying authorities, order of preference"
      checked: 2026-10-15
    - id: pib-support
      name: "PIB — Financial Support to Athletes (Lok Sabha reply, 5 Aug 2024)"
      url: "https://www.pib.gov.in/PressReleasePage.aspx?PRID=2041702"
      covers: "Khelo India ₹6.28 lakh, TOPS Core ₹50,000 and Development ₹25,000, welfare fund, pension, cash awards"
      checked: 2026-10-15
    - id: myas-cash
      name: "MYAS — Scheme of Cash Incentive to Medal Winners and their Coaches (amended 1 Feb 2025)"
      url: "https://yas.gov.in/sites/default/files/Scheme%20of%20Cash%20Incentive%20to%20Medal%20Winners%20in%20International%20Sports%20Events%20and%20their%20Coaches%20amended%20as%20on%2001.02.2025.pdf"
      covers: "Cash award amounts by event, coach share, six-month DBT-MIS deadline"
      checked: 2026-10-15
    - id: sai-schemes
      name: "SAI — Brief on Sports Promotional Schemes 2024-25 (NCOE, STC, NSTC)"
      url: "https://www.sportsauthorityofindia.gov.in/sai/public/assets/pdfs/schemes/NCOE_Brief.pdf"
      covers: "NCOE centres and disciplines, STC selection criteria, NSTC financial norms"
      checked: 2026-10-15
    - id: pib-transform
      name: "PIB — India's Sporting Transformation (backgrounder, 10 June 2025)"
      url: "https://static.pib.gov.in/WriteReadData/specificdocs/documents/2025/jun/doc2025610567401.pdf"
      covers: "KIRTI (ages 9–18, 174 Talent Assessment Centres), Khelo India Games, TOPS core group size"
      checked: 2026-10-15

