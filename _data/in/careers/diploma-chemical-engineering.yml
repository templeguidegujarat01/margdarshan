    parts:
      - overview:
          points:
            - "Diploma in Chemical Engineering is a 3-year polytechnic programme covering chemical process technology, plant equipment operation, industrial chemistry, and process instrumentation & control."
            - "It trains students to work in the plants that convert raw materials into chemicals, fuels, fertilisers, pharmaceuticals and processed food products — a genuinely technical, process-oriented field distinct from other engineering diplomas."
            - "It's offered at government polytechnics run by each state's technical education board, as well as private AICTE-approved polytechnic institutes, though availability is somewhat more concentrated in states with significant chemical/petrochemical industry presence, like Gujarat and Maharashtra."
  - id: "who"
