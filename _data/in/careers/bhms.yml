          - myth: "BHMS is only a fallback for students who can't get MBBS."
            fact: "BHMS is a legally recognised, licensed profession with genuine, growing government job opportunities through AYUSH — it's a real career path for students genuinely interested in homeopathy, though prospective students should weigh the scientific debate honestly first."
          - myth: "BHMS doctors earn very little compared to other AYUSH graduates."
            fact: "Reported fresher salaries (₹2.5-6.5 LPA) are broadly comparable to BAMS, and government AYUSH Medical Officer roles have been reported starting around ₹44,900/month plus benefits — a genuinely competitive entry-level government package."
