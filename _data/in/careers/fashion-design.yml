  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Do I need to be good at drawing to study Fashion Design?"
            a: "Basic sketching ability helps and is tested in entrance exams, but it isn't the only requirement — design thinking, understanding of fabric and construction, trend awareness and creativity matter just as much, and sketching skills do improve significantly with structured training."
          - q: "Is NIFT the only good option for Fashion Design in India?"
            a: "NIFT is the most recognised and sought-after, but it isn't the only option. Pearl Academy, NID's textile/apparel programmes, and several private design schools also offer respected Fashion Design courses, and some have their own entrance processes."
          - q: "What is the difference between Fashion Design and Fashion Merchandising?"
            a: "Fashion Design focuses on creating garments — sketching, pattern-making, draping and construction. Fashion Merchandising (or Fashion Management) focuses on the business side — buying, retail planning, brand strategy and supply chain — often studied as a separate specialisation at the same institutes."
          - q: "Can I start my own fashion label after this degree?"
            a: "Yes, and many designers do, though building a successful independent label typically takes significant time, capital and industry experience first. Most graduates work at an established brand or design house for several years before launching their own label."
          - q: "How much do fresh Fashion Design graduates earn in India?"
            a: "It varies by institute reputation and employer. NIFT graduates joining established fashion houses or export brands tend to start on the higher end of the entry-level range, while smaller studios and boutique labels typically pay less initially, with income growing significantly with experience and reputation."
      - note: "*Fee and salary figures are indicative, based on publicly available information as of 2026, and vary significantly by institution and employer — always verify current figures on the official institute website."
