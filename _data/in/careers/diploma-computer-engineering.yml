    heading: "What is Diploma in Computer Engineering?"
    parts:
      - overview:
          points:
            - "Diploma in Computer Engineering is a 3-year polytechnic programme covering programming fundamentals (typically starting with C, moving to Java/Python), computer hardware and organisation, operating systems, database management systems, and web development basics."
            - "It gives students a broad technical foundation spanning both software and hardware sides of computing."
            - "It's offered at government polytechnics run by each state's technical education board, as well as private AICTE-approved polytechnic institutes."
          more:
            - "Given India's large, ongoing IT industry demand, it's one of the more consistently popular diploma choices, though it's worth knowing that larger IT companies often prefer full B.Tech/BCA graduates for core development roles."
