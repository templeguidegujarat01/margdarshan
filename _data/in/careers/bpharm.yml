          - label: "Manufacturing & MNC recruiters"
            text: "Sun Pharma, Cipla, Dr. Reddy's, Lupin, Aurobindo and Biocon among domestic majors; MNCs like Pfizer, Novartis, Abbott and Sanofi reported to pay 20-40% more for comparable roles."
          - label: "Government routes"
