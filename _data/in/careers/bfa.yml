  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What is BFA?"
    parts:
      - overview:
          points:
            - "BFA is a 4-year undergraduate degree centred on studio-based art practice — painting, sculpture, printmaking, and applied art — combined with art history and theory."
            - "Unlike applied design degrees, BFA (outside its Applied Art specialisation) emphasises personal artistic expression and technical craft over solving a specific commercial or client problem, though many graduates do move into design-adjacent careers."
            - "It's offered at respected, long-established institutions like the <strong>College of Art, Delhi; the Faculty of Fine Arts at MS University Baroda; Kala Bhavana at Visva-Bharati, Santiniketan; and Sir J.J. School of Art, Mumbai</strong>, each with their own distinct entrance process and portfolio requirements."
  - id: "who"
    hid: "who-heading"
    alt: true
    eyebrow: "Fit check"
    heading: "Who should choose BFA"
    parts:
      - fit:
          match:
            - "Have a genuine, sustained practice of drawing, painting or making art, not just occasional interest."
            - "Want to develop a personal artistic voice through rigorous, sustained studio practice."
            - "Are comfortable with an uncertain financial path early on, willing to combine art practice with teaching or design work if needed."
          mismatch:
            - "Want a directly commercial, client-focused design career from day one — Graphic or Fashion Design may fit better."
            - "Need predictable, immediate income right after graduation — fine art income specifically can take years to stabilise."
            - "Aren't prepared for a genuinely competitive, portfolio-based entrance process at top institutes."
  - id: "eligibility"
    hid: "elig-heading"
    eyebrow: "Eligibility"
    heading: "Who can apply for BFA"
    parts:
      - elig_list:
          - "Class 12 pass (10+2) from any stream, typically with a minimum aggregate around <strong>45-50%</strong>, varying by institute."
          - "Most institutes conduct their own entrance test involving drawing/sketching tasks, alongside submission of an existing art portfolio."
          - "Prior formal art education isn't compulsory, but a genuine, demonstrable practice of drawing/making art strongly helps at the portfolio and entrance stage."
