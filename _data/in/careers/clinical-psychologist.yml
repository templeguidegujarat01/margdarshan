  - id: "admission"
    hid: "admission-heading"
    eyebrow: "The most competitive step"
    heading: "M.Phil Clinical Psychology admission"
    parts:
      - chips:
          - label: "Top recognised institutes"
            text: "NIMHANS Bengaluru, Institute of Human Behaviour and Allied Sciences (IHBAS) Delhi, and a small number of other RCI-recognised centres, each admitting only a handful of students per year."
          - label: "Entrance process"
            text: "Written entrance exam testing psychology fundamentals and research aptitude, typically followed by an interview, varying by institute."
          - label: "Why it's so competitive"
            text: "The number of MA Psychology graduates applying each year vastly outnumbers the limited, RCI-recognised M.Phil seats nationally, making this one of the toughest postgraduate entrances in the Arts stream."
          - label: "Alternative routes"
            text: "Some universities offer PsyD or other clinical training routes; always confirm RCI recognition before enrolling, since unrecognised programmes don't lead to legal registration to practise."
  - id: "fees"
    hid: "fees-heading"
    alt: true
    eyebrow: "Adds up across stages"
    heading: "Fees across the full path"
    parts:
      - prose:
          - "Government-college fees for Bachelor of Arts (BA) Psychology and MA Psychology are relatively affordable, typically <strong>₹15,000-80,000 per year</strong> combined, though private universities can charge significantly more given high demand for the subject. M.Phil Clinical Psychology fees at government-recognised institutes like NIMHANS are comparatively modest, often <strong>₹10,000-50,000 per year</strong>, reflecting their public-institute status — private-institute equivalents, where available, can be considerably higher. Always confirm current fees directly on the official institute website."
