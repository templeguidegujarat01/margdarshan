# College Finder data — single source for the colleges-<course>*.html finders
# (rendered by _includes/finder.html).
#
# Editorial rule (see "A note on rankings" on every finder page): list a
# college only with genuine course availability, recognised institutional
# status and an official website that was checked to load. Fees, seats and
# cutoffs change every year, so they are NOT stored here — each card links
# to the official counselling authority (`body`, a key in
# _data/counselling.yml) instead. If you ever add `fees`, `seats` or `cutoff`
# fields, add an `as_of` year with them; the card renders them only when present.
#
# courses:     list of keys in `courses` below; one entry can appear in
#              several finders (e.g. a health-sciences college with BPT and BOT)
# prog:        optional map course key -> exact programme name shown on the card
# entrance_by: optional map course key -> entrance, when it differs per course
# ownership:   Government | Private | Deemed  (shown as the badge)
# type_detail: finer label next to the badge, e.g. "IIT", "Municipal"
# entrance:    overrides the course's default entrance exam
# counselling: how seats are filled — shown on the card
# body:        counselling authority key for the "Counselling & fees" button
# region:      JSON-LD addressRegion when the city sits outside the finder state

courses:
  mbbs:    { label: "MBBS",         entrance: "NEET-UG", page: "colleges-mbbs" }
  bds:     { label: "BDS",          entrance: "NEET-UG", page: "colleges-bds" }
  bams:    { label: "BAMS",         entrance: "NEET-UG", page: "colleges-bams" }
  bhms:    { label: "BHMS",         entrance: "NEET-UG", page: "colleges-bhms" }
  nursing: { label: "B.Sc Nursing", entrance: "NEET-UG or state / institute entrance", page: "colleges-nursing" }
  btech:   { label: "B.Tech",       entrance: "JEE Main", page: "colleges-btech" }
  bca:          { label: "BCA",              entrance: "Class 12 merit / CUET-UG / university test", page: "colleges-bca" }
  bdes:         { label: "B.Des",            entrance: "UCEED / NID DAT / NIFT entrance", page: "colleges-design" }
  bpharm:       { label: "B.Pharm",          entrance: "State CET / university test / Class 12 merit", page: "colleges-bpharm" }
  bpt:          { label: "BPT",              entrance: "State / institute entrance or Class 12 merit", page: "colleges-bpt" }
  ot:           { label: "BOT",              entrance: "State / institute entrance or Class 12 merit", page: "colleges-ot" }
  optometry:    { label: "B.Optom",          entrance: "State / institute entrance or Class 12 merit", page: "colleges-optometry" }
  mlt:          { label: "B.Sc MLT",         entrance: "State / institute entrance or Class 12 merit", page: "colleges-mlt" }
  radiology:    { label: "B.Sc Radiology & Imaging", entrance: "State / institute entrance or Class 12 merit", page: "colleges-radiology" }
  aslp:         { label: "BASLP",            entrance: "Institute entrance or Class 12 merit", page: "colleges-aslp" }
  nutrition:    { label: "Nutrition & Dietetics", entrance: "CUET-UG / university test / Class 12 merit", page: "colleges-nutrition" }
  biotech:      { label: "Biotechnology",    entrance: "JEE Main (B.Tech) / CUET-UG (B.Sc) / Class 12 merit", page: "colleges-biotech" }
  genetics:     { label: "Genetics",         entrance: "IISER IAT / CUET-UG / Class 12 merit", page: "colleges-genetics" }
  microbiology: { label: "Microbiology",     entrance: "CUET-UG / Class 12 merit", page: "colleges-microbiology" }
  envsci:       { label: "Environmental Science", entrance: "University test / CUET-UG / Class 12 merit", page: "colleges-environmental-science" }
  forensic:     { label: "Forensic Science", entrance: "CUET-UG", page: "colleges-forensic" }
  agri:         { label: "B.Sc (Hons) Agriculture", entrance: "CUET-UG (ICAR seats) / state CET / Class 12 merit", page: "colleges-agriculture" }

  # ---- Commerce, Arts, Law, Architecture, Diploma, ITI ----
  bcom:     { label: "B.Com",              entrance: "CUET-UG (central universities) / Class 12 merit / university test", page: "colleges-bcom" }
  bba:      { label: "BBA / BMS",          entrance: "CUET-UG / institute test (NPAT, IPMAT, SET) / Class 12 merit", page: "colleges-bba" }
  economics: { label: "Economics & Data Analytics (UG)", entrance: "CUET-UG / institute test (NPAT, SET, ISI Admission Test) / Class 12 merit" }
  actuarial: { label: "Actuarial Science & Finance (UG)", entrance: "University / institute admission process (Class 12 Maths expected)" }
  ba:       { label: "BA (Humanities & Social Sciences)", entrance: "CUET-UG / Class 12 merit / university test", page: "colleges-ba" }
  bjmc:     { label: "BJMC / Journalism",  entrance: "CUET-UG / university test / Class 12 merit", page: "colleges-bjmc" }
  law:      { label: "Integrated Law (BA LLB)", entrance: "CLAT / AILET / university test", page: "colleges-law" }
  barch:    { label: "B.Arch",             entrance: "NATA or JEE Main Paper 2 (B.Arch)", page: "colleges-barch" }
  diploma:  { label: "Polytechnic Diploma", entrance: "State polytechnic admission after Class 10 (merit or entrance)", page: "colleges-diploma" }
  iti:      { label: "ITI (CTS trades)",   entrance: "Class 8 / Class 10 merit, trade-wise", page: "colleges-iti" }

