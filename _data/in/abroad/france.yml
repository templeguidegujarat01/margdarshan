            - { title: "Interview", text: "Academic interview with originals if scheduled.", source: cf_visa }
            - { title: "France-Visas + VFS", text: "Online form, then the VFS appointment after the automated email.", source: cf_visa }
            - { title: "Validate VLS-TS", text: "Online within three months of arrival.", source: cf_visa }
