    eyebrow: "Overview"
    heading: "What is MBBS?"
    parts:
      - overview:
          points:
            - "MBBS is the primary medical degree required to become a doctor in India."
            - "It covers human anatomy, physiology, pathology, pharmacology, and the diagnosis and treatment of disease, combining classroom study with hands-on clinical training in hospitals."
            - "It remains one of India's most respected and stable career paths — but the on-the-ground reality in 2026 is more complicated than most coaching advertisements suggest."
          more:
            - "Seats are extremely limited relative to demand, fees vary by more than ten times between government and private institutions for an identical degree, and most graduates now pursue further specialisation (NEET-PG) almost by default rather than by choice."
