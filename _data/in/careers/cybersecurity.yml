          - "<strong>BCA with a Cyber Security specialisation:</strong> Class 12 pass in any stream, generally admitted via Common University Entrance Test (CUET) or Class 12 merit — no PCM requirement."
          - "<strong>Any-degree + certification route:</strong> Many entry-level SOC/analyst roles accept graduates from any stream, provided you hold a recognised certification like CompTIA Security+ or CEH."
