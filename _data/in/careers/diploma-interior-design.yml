  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What is Diploma in Interior Design?"
    parts:
      - overview:
          points:
            - "Diploma in Interior Design trains students to plan and design the interiors of residential, commercial and institutional spaces — deciding layouts, choosing materials, finishes, furniture, lighting and colour schemes, while keeping structural, budget and client needs in mind."
            - "It sits in the same \"Architecture & Design\" diploma family as <a href=\"diploma-architecture.html\">Diploma in Architecture</a>, but focuses specifically on interior spaces rather than the building structure itself."
            - "The course is deliberately practical."
          more:
            - "Alongside classroom subjects, students spend substantial time on studio work, drawing, model-making and computer-aided design, building a portfolio of projects along the way — which matters just as much as the certificate itself when applying for jobs or freelance work in this field."
            - "It's offered at government polytechnics, private design institutes and a few specialised interior design schools across India."
  - id: "who"
    hid: "who-heading"
    alt: true
    eyebrow: "Fit check"
    heading: "Who should choose this Diploma"
    parts:
      - fit:
          match:
