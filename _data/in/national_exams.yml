  # ---------------------------------------------------------------- GPAT (NBEMS for PCI)
  - slug: gpat
    short: "GPAT"
    stream: pharmacy
    checked: 2026-10-15
    body: "NBEMS, for the Pharmacy Council of India (PCI)"
    eyebrow: "Entrance Exam · Pharmacy · 2026 cycle"
    title: "GPAT — eligibility, marking, qualifying rule &amp; fees"
    lede: "The Graduate Pharmacy Aptitude Test is the national test for M.Pharm admission and the PCI scholarship. NBEMS has run it for the Pharmacy Council of India since NTA's last edition in 2023; this page follows the GPAT 2026 Information Bulletin."
    colleges_href: "colleges-bpharm.html"
    facts:
      - { label: "Conducted by", value: "NBEMS under an MoU with PCI", source: gp-ib }
      - { label: "Exam date (2026)", value: "7 Mar 2026 · result by 7 Apr 2026", source: gp-ib }
      - { label: "Paper", value: "125 MCQs · 500 marks · 3 hours", source: gp-ib }
      - { label: "Marking", value: "+4 correct · −1 wrong · score valid 3 years", source: gp-ib }
    official:
      - { label: "GPAT page (natboard.edu.in)", url: "https://natboard.edu.in/viewnbeexam?exam=gpat" }
      - { label: "Information Bulletin 2026 (PDF)", url: "https://nbe.edu.in/IB/Information%20bulletin%20GPAT%202026.pdf" }
    sections:
      - id: overview
        nav: "Overview"
        eyebrow: "Overview &amp; governing bodies"
        heading: "From AICTE to NTA to NBEMS"
        parts:
          - p: "GPAT is a national-level examination for the <strong>award of scholarship</strong> to qualified candidates seeking entry into the <strong>Master of Pharmacy (M.Pharm)</strong> course. AICTE ran it from 2010 to 2018 and NTA from 2019 to 2023. After the Supreme Court's judgment of 5 March 2020 placed pharmacy education under the Pharmacy Act, 1948, the <strong>Pharmacy Council of India</strong> took over GPAT and signed an MoU with <strong>NBEMS</strong> to conduct it."
            source: gp-ib
          - p: "NBEMS only conducts the test, declares the result and hands it to PCI. It has no role in counselling or scholarship disbursement, and appearing in GPAT gives no automatic right to an M.Pharm seat or scholarship — admission follows the state government or admission committee's rules."
            source: gp-ib
          - table:
              caption: "GPAT 2026 calendar"
              head: ["Step", "Date"]
              rows:
                - ["Online application", "23 Dec 2025 (5 pm) – 12 Jan 2026"]
                - ["Edit window", "16 – 19 Jan 2026"]
                - ["Test city intimation", "24 Feb 2026"]
                - ["Admit cards", "2 Mar 2026"]
                - ["Examination", "7 Mar 2026"]
                - ["Result", "By 7 Apr 2026"]
            source: gp-ib
          - warn: "GPAT 2026 is over and no GPAT 2027 bulletin was on the NBEMS GPAT page on 15 October 2026 — the next cycle's date, pattern and fees can change."
            source: gp-page
      - id: eligibility
        nav: "Eligibility"
        eyebrow: "Primary degree constraints"
        heading: "Final-year — or third-year — B.Pharm"
        parts:
          - list:
              - "Students in the <strong>final (4th) year of B.Pharm</strong> whose result comes before M.Pharm admission for 2026-27."
              - "Students in the <strong>pre-final (3rd) year</strong> whose final-year result comes before M.Pharm admission for 2027-28."
              - "B.E. / B.Tech. (Pharmaceutical and Fine Chemical Technology) and equivalent candidates are <strong>not eligible</strong>."
              - "Your B.Pharm must be recognised under the Pharmacy Act, 1948."
            source: gp-ib
      - id: scheme
        nav: "Exam scheme"
        eyebrow: "Exam scheme &amp; marking matrix"
        heading: "125 questions, 500 marks, 25% negative"
        parts:
          - table:
              caption: "GPAT 2026 indicative blueprint"
              head: ["Subject area", "Questions", "Marks"]
              rows:
                - ["Pharmaceutical Chemistry &amp; allied subjects", "38", "152"]
                - ["Pharmaceutics &amp; allied subjects", "38", "152"]
                - ["Pharmacology &amp; allied subjects", "28", "112"]
                - ["Other B.Pharm subjects", "11", "44"]
                - ["Pharmacognosy &amp; allied subjects", "10", "40"]
                - ["Total", "125", "500"]
            source: gp-ib
          - table:
              caption: "GPAT 2026 marking scheme"
              head: ["Response", "Marks"]
              rows:
                - ["Correct", "+4"]
                - ["Incorrect", "−1 (25% negative)"]
                - ["Unattempted", "0"]
            source: gp-ib
          - p: "The computer-based paper (English, 4 options per question, 3 hours) is split into time-bound sections — for example five sections of 25 questions and 36 minutes — that lock when their time runs out. The syllabus follows the B.Pharm Course Regulations, 2024."
            source: gp-ib
      - id: reservation
        nav: "Qualifying &amp; quotas"
        eyebrow: "Reservation &amp; qualifying quotas"
        heading: "Top 10% of candidates, split by category"
        parts:
          - list:
              - "To be <strong>qualified</strong>, a candidate needs the category's minimum percentile <strong>and</strong> must fall within <strong>10% of all candidates who appeared</strong>, in GPAT merit order."
              - "Minimum percentile: <strong>50th</strong> for General / EWS, <strong>45th</strong> for OBC / SC / ST, and 45th for PwBD of any category."
            source: gp-ib
          - table:
              caption: "Share of the qualified 10%, by category"
              head: ["Category (each including its PwBD)", "Share"]
              rows:
                - ["Unreserved", "40.5%"]
                - ["OBC", "27%"]
                - ["SC", "15%"]
                - ["EWS", "10%"]
                - ["ST", "7.5%"]
            source: gp-ib
          - note: "Each category has 5% for candidates with 40% or more disability. NBEMS publishes one all-India rank and no category-wise or state-wise merit list."
            source: gp-ib
      - id: fees
        nav: "Fees"
        eyebrow: "Application steps &amp; registration fees"
        heading: "Two fee slabs"
        parts:
          - table:
              caption: "GPAT 2026 examination fee"
              head: ["Category", "Fee"]
              rows:
                - ["General, OBC, EWS", "₹3,500"]
                - ["SC, ST, PwD", "₹2,500"]
            source: gp-ib
          - list:
              - "Apply online on the NBEMS portal, upload photograph, signature and thumb impression, choose a test city and pay through the payment gateway (gateway charges extra)."
              - "A submitted form cannot be withdrawn, and the fee is neither refunded nor carried forward."
            source: gp-ib
      - id: horizons
        nav: "Where it leads"
        eyebrow: "Career horizons &amp; mapped institutions"
        heading: "M.Pharm, Ph.D. and the NIPERs"
        parts:
          - p: "The GPAT score is accepted by PCI-approved and affiliated university departments, constituent and affiliated colleges and institutions for <strong>M.Pharm and Ph.D.</strong> admission, and is <strong>valid for three years</strong>. Score cards can be downloaded for six months after the result."
            source: gp-ib
          - p: "A valid GPAT (or GATE / NET) score is also the entry ticket to NIPER JEE for the seven National Institutes of Pharmaceutical Education and Research."
            source: nj-br
          - links:
              - { label: "NIPER JEE", url: "niper-jee.html" }
              - { label: "B.Pharm career guide", url: "bpharm.html" }
              - { label: "B.Pharm college finder", url: "colleges-bpharm.html" }
    sources:
      - { id: gp-ib, name: "NBEMS — GPAT 2026 Information Bulletin", url: "https://nbe.edu.in/IB/Information%20bulletin%20GPAT%202026.pdf", covers: "history, NBEMS role, calendar, eligibility, blueprint, marking, sections, qualifying criteria, category shares, fees, score validity", checked: 2026-10-15 }
      - { id: gp-page, name: "NBEMS — GPAT examination page", url: "https://natboard.edu.in/viewnbeexam?exam=gpat", covers: "bulletins published (2024, 2025, 2026; none for 2027)", checked: 2026-10-15 }
      - { id: nj-br, name: "NIPER JEE 2026 — Revised Information Brochure, Master's (19 June 2026)", url: "https://www.niper.gov.in/niperjee2026/include/2026_Masters_Brochure_Revised_19June.pdf", covers: "GPAT / GATE / NET requirement for NIPER JEE", checked: 2026-10-15 }
  # ---------------------------------------------------------------- NIPER JEE (NIPER Mohali, 2026)
  - slug: niper-jee
    short: "NIPER JEE"
    stream: pharmacy
    checked: 2026-10-15
    body: "NIPER S.A.S. Nagar (Mohali), for the 7 NIPERs"
    eyebrow: "Entrance Exam · Pharmacy · 2026 cycle"
    title: "NIPER JEE — eligibility, marking, seats &amp; fees"
    lede: "The joint entrance exam of the seven National Institutes of Pharmaceutical Education and Research — Ahmedabad, Guwahati, Hajipur, Hyderabad, Kolkata, Mohali and Raebareli — for M.S.(Pharm.), M.Pharm., M.Tech., MBA (Pharm.) and Ph.D. This page follows NIPER Mohali's 2026 Master's brochure."
    colleges_href: "colleges-bpharm.html"
    facts:
      - { label: "Conducted by (2026)", value: "NIPER S.A.S. Nagar (Mohali)", source: nj-br }
      - { label: "Exam date (2026)", value: "13 Jun 2026 · CBT", source: nj-dates }
      - { label: "Paper", value: "200 MCQs · 150 minutes", source: nj-br }
      - { label: "Marking", value: "+0.5 correct · −0.125 wrong", source: nj-br }
    official:
      - { label: "NIPER JEE 2026 portal", url: "https://www.niper.gov.in/niperjee2026/" }
      - { label: "Master's brochure 2026 (PDF)", url: "https://www.niper.gov.in/niperjee2026/include/2026_Masters_Brochure_Revised_19June.pdf" }
    sections:
      - id: overview
        nav: "Overview"
        eyebrow: "Overview &amp; governing bodies"
        heading: "One exam for seven NIPERs"
        parts:
          - p: "NIPER JEE 2026 was organised by <strong>NIPER S.A.S. Nagar (Mohali)</strong> for all seven NIPERs. It is <strong>one common exam</strong> for M.S.(Pharm.), M.Pharm., M.Tech. and MBA (Pharm.); MBA aspirants tick a box in the form and are then called for group discussion and interview. Ph.D. admission has its own brochure and an interview after the test."
            source: nj-br
          - table:
              caption: "NIPER JEE 2026 calendar (revised 15 May 2026)"
              head: ["Step", "Date"]
              rows:
                - ["Online application opens", "16 Apr 2026"]
                - ["Last date (extended)", "23 May 2026"]
                - ["Form correction", "25 – 26 May 2026"]
                - ["Hall tickets", "From 8 Jun 2026"]
                - ["CBT", "13 Jun 2026 (Saturday)"]
            source: nj-dates
          - warn: "The 2026 cycle is over — results came out on 19 June 2026 and online counselling ran in four phases up to August 2026. No NIPER JEE 2027 notice was out on 15 October 2026; the organising NIPER can change."
            source: nj-portal
      - id: eligibility
        nav: "Eligibility"
        eyebrow: "Primary degree constraints"
        heading: "A national score plus 60% in the qualifying degree"
        parts:
          - list:
              - "A qualifying <strong>GPAT / GATE / NET</strong> or other national fellowship with a <strong>valid score card</strong>."
              - "The subject-wise qualifying degree with at least <strong>60% aggregate or CGPA 6.75</strong> on a 10-point scale."
              - "Final-semester students who finish exams by 31 July 2026 can apply; their seat lapses if the result is not out by 15 September 2026 or they fail."
            source: nj-br
          - table:
              caption: "Relaxations"
              head: ["Group", "Minimum"]
              rows:
                - ["SC / ST", "55% or CGPA 6.25"]
                - ["PwBD (any category)", "50% or CGPA 5.75"]
                - ["B.V.Sc. / MBBS / BAMS / BDS holders, foreign nationals, sponsored", "GPAT / GATE / NET requirement waived"]
            source: nj-br
          - note: "The qualifying degree depends on the programme — mostly B.Pharm, with M.Sc. (chemistry, life sciences), B.Tech., MBBS, BDS or B.V.Sc. accepted for some M.S.(Pharm.), M.Tech. and MBA (Pharm.) specialisations."
            source: nj-br
      - id: scheme
        nav: "Exam scheme"
        eyebrow: "Exam scheme &amp; marking matrix"
        heading: "200 questions, two sections, one sitting"
        parts:
          - table:
              caption: "NIPER JEE 2026 (Master's) paper"
              head: ["Section", "Questions", "Covers"]
              rows:
                - ["A", "80", "General English, aptitude, reasoning, general knowledge"]
                - ["B", "120", "Mainly the B.Pharm syllabus"]
            source: nj-br
          - table:
              caption: "Marking"
              head: ["Response", "Marks"]
              rows:
                - ["Correct", "+0.5"]
                - ["Incorrect", "−0.125"]
                - ["Unanswered", "0"]
            source: nj-br
          - p: "The paper is common to all Master's programmes and runs <strong>150 minutes without a break</strong>. A question dropped for a technical error gets full marks for everyone."
            source: nj-br
      - id: reservation
        nav: "Seats &amp; reservation"
        eyebrow: "Reservation &amp; institutional quotas"
        heading: "Government of India reservation plus supernumerary seats"
        parts:
          - p: "Reservation follows the Government of India rules in force. Each NIPER's seat matrix splits seats with fellowship by UR / SC / ST / OBC / EWS — for example NIPER Ahmedabad listed 150 seats with fellowship (76 UR, 22 SC, 7 ST, 37 OBC, 8 EWS)."
            source: nj-seat
          - list:
              - "<strong>5% supernumerary</strong> seats for candidates sponsored by government departments, R&amp;D organisations, PSUs or reputed private pharmaceutical firms."
              - "<strong>Not less than 3%</strong> supernumerary seats for PwBD candidates."
              - "<strong>5% supernumerary</strong> seats for foreign nationals and OCI / PIO holders (card on or after 4 March 2021)."
              - "Some programmes also run seats <strong>without fellowship</strong> (self-financing)."
            source: nj-br
      - id: fees
        nav: "Fees"
        eyebrow: "Application steps &amp; registration fees"
        heading: "₹4,000, or ₹2,000 for SC / ST"
        parts:
          - table:
              caption: "NIPER JEE 2026 application fee (Master's)"
              head: ["Category", "Fee"]
              rows:
                - ["General / OBC / PwBD / EWS", "₹4,000"]
                - ["SC / ST", "₹2,000"]
            source: nj-br
          - list:
              - "Register online, fill the form, upload caste / EWS / OBC-NCL / PwBD certificates where they apply, then pay online (bank charges may apply)."
              - "No application fee is refunded."
            source: nj-br
      - id: horizons
        nav: "Where it leads"
        eyebrow: "Career horizons &amp; mapped institutions"
        heading: "Funded Master's and Ph.D. at Institutes of National Importance"
        parts:
          - p: "Master's students admitted on seats with fellowship (not self-financing, sponsored or foreign national seats) get a <strong>stipend of ₹12,400 a month</strong> while they keep a CGPA of at least 6.00; the top three MBA (Pharm.) students get the same financial assistance in semesters 2 to 4. Graduates can go on to the NIPER Ph.D. programmes."
            source: nj-br
          - links:
              - { label: "GPAT", url: "gpat.html" }
              - { label: "B.Pharm career guide", url: "bpharm.html" }
              - { label: "B.Pharm college finder", url: "colleges-bpharm.html" }
    sources:
      - { id: nj-br, name: "NIPER JEE 2026 — Revised Information Brochure, Master's (19 June 2026)", url: "https://www.niper.gov.in/niperjee2026/include/2026_Masters_Brochure_Revised_19June.pdf", covers: "organiser, programmes, eligibility, relaxations, supernumerary seats, fees, paper pattern, marking, stipend", checked: 2026-10-15 }
      - { id: nj-dates, name: "NIPER JEE 2026 — Public notice: revised important dates (15 May 2026)", url: "https://www.niper.gov.in/niperjee2026/include/2026_public_notice_revised_important_dates_15May.pdf", covers: "application window, correction, hall tickets, CBT date", checked: 2026-10-15 }
      - { id: nj-seat, name: "NIPER JEE 2026 — Seat matrix, Master's programmes (updated 24 June 2026)", url: "https://www.niper.gov.in/niperjee2026/include/2026_Seat_Matrix_Masters_Reservation_24June.pdf", covers: "seats with fellowship by category at each NIPER", checked: 2026-10-15 }
      - { id: nj-portal, name: "NIPER JEE 2026 portal (NIPER Mohali)", url: "https://www.niper.gov.in/niperjee2026/", covers: "result notice of 19 June 2026, counselling phases I–IV", checked: 2026-10-15 }

  # ---------------------------------------------------------------- IPMAT Indore (2026 cycle)
  - slug: ipmat
    short: "IPMAT Indore"
    stream: management
    checked: 2026-10-15
    body: "Indian Institute of Management Indore"
    eyebrow: "Entrance Exam · Management · 2026 cycle"
    title: "IPMAT Indore — eligibility, test pattern, seats &amp; fees"
    lede: "IIM Indore's own Aptitude Test (IPM AT) for its five-year Integrated Programme in Management, taken straight after Class 12. This page follows IIM Indore's admission procedure for the IPM 2026-31 batch; the 2027 notice was not out on 15 October 2026."
    coaching_href: "coaching-ipmat.html"
    colleges_href: "colleges-bba.html"
    facts:
      - { label: "Conducted by", value: "IIM Indore (its own test)", source: ipm-proc }
      - { label: "Test date (2026)", value: "Mon 4 May 2026 · 2:00–4:00 PM", source: ipm-proc }
      - { label: "Paper", value: "QA (MCQ) · QA (short answer) · VA — 40 min each", source: ipm-proc }
      - { label: "Marking", value: "+4 correct · −1 wrong · no minus in QA short answer", source: ipm-proc }
    official:
      - { label: "IPM admissions — IIM Indore", url: "https://iimidr.ac.in/programmes/academic-programmes/five-year-integrated-programme-in-management-ipm/ipm-admissions-details/" }
      - { label: "Admission procedure 2026-31 (PDF)", url: "https://iimidr.ac.in/wp-content/uploads/2026/01/AdmissionProcedure_IPM-2026-31_-Domestic-Applicants.pdf" }
    sections:
      - id: overview
        nav: "Overview"
        eyebrow: "Overview &amp; governing body"
        heading: "IIM Indore sets, runs and scores its own test"
        parts:
          - p: "The IPM Aptitude Test (IPM AT, widely called IPMAT Indore) is conducted by the <strong>Indian Institute of Management Indore</strong> for its <strong>Five-Year Integrated Programme in Management (IPM)</strong>. Selection is on the Aptitude Test plus a Personal Interview; a candidate who misses either is not considered."
            source: ipm-proc
          - table:
              caption: "IPM 2026-31 admission calendar (tentative)"
              head: ["Step", "Date"]
              rows:
                - ["Notification", "2 Feb 2026"]
                - ["Online applications", "2 Feb – 14 Mar 2026"]
                - ["IPM Aptitude Test", "4 May 2026 (afternoon)"]
                - ["Interview shortlist", "25 May 2026"]
                - ["Personal Interviews", "15 – 18 Jun 2026"]
                - ["Provisional offers", "26 Jun 2026"]
                - ["Programme starts", "10 Aug 2026"]
            source: ipm-faq
          - p: "The 2026 test was held in 39 cities (tentative list), from Agra, Ahmedabad and Bengaluru to Udaipur, Ujjain, Varanasi and Visakhapatnam."
            source: ipm-proc
          - warn: "The 2026 cycle is over. IIM Indore had not published the IPM 2027-32 notice on 15 October 2026 — the 2026 notice came out on 2 February 2026 — so check the institute's site before you plan around these dates."
            source: ipm-adm
      - id: eligibility
        nav: "Eligibility"
        eyebrow: "Academic eligibility"
        heading: "An age limit and a Class 12 window — no minimum percentage"
        parts:
          - list:
              - "<strong>Age:</strong> born on or after <strong>1 August 2006</strong>; SC, ST and PwD candidates get 5 years' relaxation (born on or after 1 August 2001)."
              - "<strong>Class 12:</strong> passed in 2024 or 2025, or appearing in 2026. Students finishing Class 12 by 31 July 2026 could apply and were admitted provisionally."
              - "<strong>Class 10:</strong> passed."
              - "Students of international boards (IGCSE, and IB — IBDP and IBCP only) can apply, with the IB Indian Percentage Transcript."
            source: ipm-proc
          - warn: "The 60% (55% for SC/ST/PwD) Class 10 and 12 rule often quoted for IPMAT is <strong>not</strong> in IIM Indore's 2026-31 admission procedure for domestic applicants, which sets no minimum percentage. JIPMAT's IIM Jammu does ask for 60% / 55% — see the JIPMAT page."
            source: ipm-proc
      - id: scheme
        nav: "Exam scheme"
        eyebrow: "Exam scheme &amp; marking matrix"
        heading: "Three sections, each locked to 40 minutes"
        parts:
          - table:
              caption: "IPM Aptitude Test 2026"
              head: ["Section", "Question type", "Time", "Wrong answer"]
              rows:
                - ["Quantitative Ability", "Multiple choice (MCQ)", "40 min", "−1"]
                - ["Quantitative Ability", "Short answer (SA)", "40 min", "No negative marking"]
                - ["Verbal Ability", "Multiple choice (MCQ)", "40 min", "−1"]
            source: ipm-proc
          - list:
              - "Every question carries <strong>4 marks</strong>."
              - "Sections must be answered in a fixed order, the same for every candidate; the procedure does not say which order."
              - "The procedure does not state the number of questions in each section."
            source: ipm-proc
          - table:
              caption: "How the merit lists are built"
              head: ["Stage", "Rule"]
              rows:
                - ["Interview pool", "Positive raw score and a category-wise minimum in each of the 3 sections"]
                - ["Aptitude Test Score (ATS)", "Normalised section scores weighted QA-MCQ 25, QA-SA 25, VA 50"]
                - ["Interview shortlist", "By ATS, category by category (General, EWS, NC-OBC, SC, ST, PwD)"]
                - ["Composite Score (final)", "ATS 65 + Personal Interview 35"]
            source: ipm-proc
      - id: reservation
        nav: "Reservation"
        eyebrow: "Reservation &amp; quotas"
        heading: "Central reservation on 150 seats — no state or domicile quota"
        parts:
          - table:
              caption: "IPM 2026 reservation (Government of India norms)"
              head: ["Category", "Share of seats"]
              rows:
                - ["NC-OBC (non-creamy layer)", "27%"]
                - ["SC", "15%"]
                - ["ST", "7.5%"]
                - ["EWS", "up to 10%"]
                - ["PwD (benchmark disability, 40% or more)", "5%"]
            source: ipm-proc
          - list:
              - "Sanctioned intake for the IPM 2026 batch (domestic applicants): <strong>150</strong>."
              - "The Central Government list as on the last date of IPM AT registration decides category status; the category cannot be changed after you apply."
              - "Reserved-category candidates still have to clear the minimum performance levels to be considered."
            source: ipm-proc
          - p: "There is <strong>no NRI quota</strong>. IIM Indore keeps <strong>5 supernumerary seats</strong> for international / foreign applicants, outside the regular intake."
            source: ipm-faq
          - note: "Neither IIM Indore document lists any state, domicile or regional seat quota — selection is all-India merit within each category."
            source: ipm-proc
      - id: fees
        nav: "Application &amp; fees"
        eyebrow: "Application steps &amp; registration fees"
        heading: "₹4,130, or ₹2,065 for SC / ST / PwD"
        parts:
          - table:
              caption: "IPM AT 2026 application fee (includes 18% GST)"
              head: ["Category", "Fee"]
              rows:
                - ["General / EWS / NC-OBC", "₹4,130"]
                - ["SC / ST / PwD", "₹2,065"]
            source: ipm-proc
          - list:
              - "Apply online on iimidr.ac.in in the window (2 February – 14 March 2026 for the 2026 batch) and pay online; the fee is non-refundable and non-transferable."
              - "NC-OBC, SC, ST and PwD candidates need valid category certificates; EWS candidates need a valid EWS document."
              - "Several applications with small changes in details are rejected outright and the candidate is barred from selection."
            source: ipm-proc
      - id: horizons
        nav: "Where it leads"
        eyebrow: "Career horizons &amp; mapped institutions"
        heading: "A BA and an MBA from IIM Indore in five years"
        parts:
          - p: "Students who finish the IPM receive a <strong>Bachelor of Arts (Foundations of Management)</strong> and a <strong>Master of Business Administration (MBA)</strong> under the dual-degree programme, as allowed by the IIM Act, 2017."
            source: ipm-proc
          - list:
              - "<strong>Exit after three years:</strong> allowed; the BA (Foundations of Management) is awarded the following year."
              - "The top academic performer in IPM year 4 receives a ₹1.5 lakh scholarship; need-based financial assistance is also available."
            source: ipm-faq
          - table:
              caption: "IPM fees for domestic students (2026-31 batch)"
              head: ["Item", "Amount"]
              rows:
                - ["Course fee, years 1–3", "₹6,00,000 a year"]
                - ["Year 1 total with mess deposit, caution deposit and insurance", "₹7,04,679"]
                - ["Course fee, years 4–5", "Same as IIM Indore's PGP fee"]
            source: ipm-faq
          - links:
              - { label: "JIPMAT (IIM Jammu &amp; Bodh Gaya)", url: "jipmat.html" }
              - { label: "Integrated MBA career guide", url: "integrated-mba.html" }
              - { label: "BBA / IPM college finder", url: "colleges-bba.html" }
              - { label: "IPMAT coaching finder", url: "coaching-ipmat.html" }
    sources:
      - { id: ipm-proc, name: "IIM Indore — Admission Procedure for IPM 2026-31 Batch (Domestic Applicants)", url: "https://iimidr.ac.in/wp-content/uploads/2026/01/AdmissionProcedure_IPM-2026-31_-Domestic-Applicants.pdf", covers: "eligibility, application window and fee, test date, cities, sections, marking, merit stages, reservation, intake, degrees", checked: 2026-10-15 }
      - { id: ipm-faq, name: "IIM Indore — FAQs and details related to IPM", url: "https://iimidr.ac.in/wp-content/uploads/2026/01/FAQs-IPM.pdf", covers: "2026 timeline, exit option, scholarships, international seats, fee structure", checked: 2026-10-15 }
      - { id: ipm-adm, name: "IIM Indore — IPM Admissions page", url: "https://iimidr.ac.in/programmes/academic-programmes/five-year-integrated-programme-in-management-ipm/ipm-admissions-details/", covers: "latest documents posted (2026-31 batch; no 2027-32 notice on 15 Oct 2026)", checked: 2026-10-15 }

  # ---------------------------------------------------------------- JIPMAT (2026 cycle)
  - slug: jipmat
    short: "JIPMAT"
    stream: management
    checked: 2026-10-15
    body: "National Testing Agency, for IIM Bodh Gaya and IIM Jammu"
    eyebrow: "Entrance Exam · Management · 2026 cycle"
    title: "JIPMAT — eligibility, paper pattern, reservation &amp; fees"
    lede: "The Joint Integrated Programme in Management Admission Test, run by the NTA for the five-year IPM at IIM Bodh Gaya and IIM Jammu. This page follows the JIPMAT 2026 Information Bulletin and IIM Jammu's IPM 2026-31 admission policy."
    coaching_href: "coaching-ipmat.html"
    colleges_href: "colleges-bba.html"
    facts:
      - { label: "Conducted by", value: "NTA for IIM Bodh Gaya &amp; IIM Jammu", source: jp-ib }
      - { label: "Exam date (2026)", value: "Sun 7 Jun 2026 · 3:00–5:30 PM · CBT", source: jp-ib }
      - { label: "Paper", value: "100 MCQs · 400 marks · 150 minutes", source: jp-ib }
      - { label: "Marking", value: "+4 correct · −1 wrong", source: jp-ib }
    official:
      - { label: "exams.nta.nic.in/jipmat", url: "https://exams.nta.nic.in/jipmat/" }
      - { label: "IIM Jammu IPM admission policy", url: "https://iimj.ac.in/programs/ipm/ipm-admission-policy.php" }
    sections:
      - id: overview
        nav: "Overview"
        eyebrow: "Overview &amp; governing bodies"
        heading: "One NTA test for two IIMs"
        parts:
          - p: "IIM Bodh Gaya and IIM Jammu asked the <strong>National Testing Agency (NTA)</strong> to run a joint national test for their <strong>five-year Integrated Programme in Management (IPM)</strong>. NTA conducts the test, processes the result and hosts the score card; each IIM then admits on its own merit list."
            source: jp-ib
          - table:
              caption: "JIPMAT 2026 calendar"
              head: ["Step", "Date"]
              rows:
                - ["Online application", "16 Apr – 10 May 2026"]
                - ["Last date for fee payment", "11 May 2026"]
                - ["Form correction window", "12 – 14 May 2026"]
                - ["Exam", "7 Jun 2026, 3:00 – 5:30 PM"]
            source: jp-ib
          - warn: "The 2026 cycle is over — NTA posted the JIPMAT 2026 result notice on 24 June 2026. No JIPMAT 2027 bulletin was out on 15 October 2026."
            source: jp-portal
      - id: eligibility
        nav: "Eligibility"
        eyebrow: "Academic eligibility"
        heading: "Class 12 from 2024–2026, Class 10 from 2022 or later"
        parts:
          - list:
              - "Passed Class 12 / HSC (arts, commerce or science) or equivalent in <strong>2024 or 2025</strong>, or appearing in <strong>2026</strong>."
              - "Passed Class 10 in <strong>2022 or later</strong>."
              - "Equivalents include NIOS and State Open School senior secondary with at least five subjects including English."
              - "Each IIM may set different eligibility rules — check both before you apply."
            source: jp-ib
          - list:
              - "<strong>IIM Jammu</strong> asks for at least <strong>60%</strong> in both Class 10 and Class 12 (<strong>55%</strong> for SC / ST / PwD)."
              - "Students finishing Class 12 by 31 July 2026 could apply; IGCSE and IB students are eligible."
            source: jp-iimj
      - id: scheme
        nav: "Exam scheme"
        eyebrow: "Exam scheme &amp; marking matrix"
        heading: "100 questions in three sections, English only"
        parts:
          - table:
              caption: "JIPMAT 2026 paper (computer-based)"
              head: ["Section", "Questions", "Marks"]
              rows:
                - ["Quantitative Aptitude (up to Class 10 maths)", "33", "132"]
                - ["Data Interpretation &amp; Logical Reasoning", "33", "132"]
                - ["Verbal Ability &amp; Reading Comprehension", "34", "136"]
                - ["Total", "100", "400"]
            source: jp-ib
          - list:
              - "<strong>+4</strong> for a correct answer, <strong>−1</strong> for a wrong one, 0 if unanswered."
              - "A question dropped for a technical error gets full marks for everyone."
              - "Eligible PwD/PwBD candidates with a scribe get 20 minutes extra per hour."
            source: jp-ib
          - table:
              caption: "IIM Jammu: minimum sectional percentile and merit formula (IPM 2026-31)"
              head: ["Category", "Minimum percentile in each section"]
              rows:
                - ["General", "50"]
                - ["EWS / NC-OBC", "35"]
                - ["SC", "30"]
                - ["ST / PwD", "25"]
            source: jp-iimj
          - p: "IIM Jammu ranks candidates who clear every sectional cut-off on a composite of <strong>JIPMAT percentile 70%, Class 10 marks 15% and Class 12 marks 15%</strong>; ties go to the higher overall JIPMAT score, then Class 12, then Class 10 marks."
            source: jp-iimj
      - id: reservation
        nav: "Reservation"
        eyebrow: "Reservation &amp; quotas"
        heading: "Government of India reservation, no domicile quota"
        parts:
          - p: "Indian nationals in the OBC-NCL, Gen-EWS, SC, ST and PwD/PwBD categories are admitted on seats reserved under Government of India rules and must show original certificates at admission. OCI cardholders registered before 4 March 2021 compete for Indian-national seats in the General category only. Only OBCs on the central NCBC list count as OBC."
            source: jp-ib
          - table:
              caption: "IIM Jammu reservation (batch of about 140)"
              head: ["Category", "Reservation"]
              rows:
                - ["SC", "15%"]
                - ["ST", "7.5%"]
                - ["NC-OBC", "27%"]
                - ["EWS", "10%"]
                - ["PwD", "5%"]
            source: jp-iimj
          - note: "IIM Jammu's policy lists no Jammu &amp; Kashmir or other domicile quota. IIM Bodh Gaya's own policy page could not be reached on 15 October 2026, so its seat split is not shown here."
            source: jp-iimj
      - id: fees
        nav: "Application &amp; fees"
        eyebrow: "Application steps &amp; registration fees"
        heading: "₹2,200, or ₹1,100 for reserved groups"
        parts:
          - table:
              caption: "JIPMAT 2026 exam fee"
              head: ["Category", "Centre in India", "Centre outside India"]
              rows:
                - ["General / OBC-NCL", "₹2,200", "₹11,000"]
                - ["SC / ST / PwD / Gen-EWS / Transgender", "₹1,100", "₹11,000"]
            source: jp-ib
          - list:
              - "<strong>Step 1</strong> — register on exams.nta.nic.in/jipmat. <strong>Step 2</strong> — fill the form and upload photo, signature and any disability certificate. <strong>Step 3</strong> — pay online (card, net banking or UPI; bank charges and GST extra). <strong>Step 4</strong> — download the Confirmation Page."
              - "Only one application per candidate; the fee is not refunded."
            source: jp-ib
          - p: "An IIM Jammu offer needs an <strong>₹50,000 acceptance amount</strong>, adjusted against the Semester I fee; withdrawing by 9 August 2026 got it back minus ₹1,000."
            source: jp-iimj
      - id: horizons
        nav: "Where it leads"
        eyebrow: "Career horizons &amp; mapped institutions"
        heading: "Five-year IPM at two newer IIMs"
        parts:
          - p: "The IPM is meant for students with management and leadership aims straight after Class 12: a foundation in social sciences and language followed by management education."
            source: jp-ib
          - p: "IIM Jammu runs its IPM (BBA + MBA) as a five-year residential programme that mixes science, social science and management courses and lets students exit the programme to start a career at any point."
            source: jp-iimj-glance
          - links:
              - { label: "IPMAT Indore", url: "ipmat.html" }
              - { label: "Integrated MBA career guide", url: "integrated-mba.html" }
              - { label: "BBA / IPM college finder", url: "colleges-bba.html" }
              - { label: "IPMAT &amp; JIPMAT coaching finder", url: "coaching-ipmat.html" }
    sources:
      - { id: jp-ib, name: "NTA — JIPMAT-2026 Information Bulletin", url: "https://cdnbbsr.s3waas.gov.in/s388a839f2f6f1427879fc33ee4acf4f66/uploads/2026/04/20260416666062493.pdf", covers: "role of NTA, dates, fees, paper pattern, syllabus, marking, eligibility, reservation, application steps", checked: 2026-10-15 }
      - { id: jp-portal, name: "NTA — JIPMAT portal (notices)", url: "https://exams.nta.nic.in/jipmat/", covers: "result notice of 24 June 2026; no 2027 bulletin on 15 Oct 2026", checked: 2026-10-15 }
      - { id: jp-iimj, name: "IIM Jammu — IPM Admission Policy, Batch 2026-31", url: "https://iimj.ac.in/programs/ipm/ipm-admission-policy.php", covers: "60% / 55% rule, sectional cut-offs, merit weights, tie-break, reservation, batch size, offer acceptance amount", checked: 2026-10-15 }
      - { id: jp-iimj-glance, name: "IIM Jammu — IPM at a glance", url: "https://www.iimj.ac.in/programs/ipm/IPM_at_a_glance.php", covers: "programme design and exit points", checked: 2026-10-15 }

  # ---------------------------------------------------------------- CLAT PG (2027 cycle)
  - slug: clat-pg
    short: "CLAT PG"
    stream: law
    checked: 2026-10-15
    body: "Consortium of National Law Universities"
    eyebrow: "Entrance Exam · Law · 2027 cycle"
    title: "CLAT PG — LL.M. eligibility, paper format, NLU seats &amp; fees"
    lede: "The postgraduate CLAT for one-year LL.M. admission at the National Law Universities. CLAT 2027 PG is on Sunday, 6 December 2026, alongside the UG paper, and fills seats for the academic year 2027-28."
    colleges_href: "colleges-law.html"
    facts:
      - { label: "Conducted by", value: "Consortium of National Law Universities", source: cpg-ins }
      - { label: "Exam date", value: "Sun 6 Dec 2026 · 2:00–4:00 PM · offline", source: cpg-ins }
      - { label: "PG paper", value: "120 MCQs · 120 marks · 2 hours", source: cpg-fmt }
      - { label: "Marking", value: "+1 correct · −0.25 wrong", source: cpg-fmt }
    official:
      - { label: "consortiumofnlus.ac.in", url: "https://consortiumofnlus.ac.in/clat-2027/" }
      - { label: "PG instructions", url: "https://consortiumofnlus.ac.in/clat-2027/pg-instructions.html" }
    sections:
      - id: overview
        nav: "Overview"
        eyebrow: "Overview &amp; governing body"
        heading: "One test, LL.M. seats at the NLUs"
        parts:
          - p: "CLAT 2027 covers admission to the five-year integrated LL.B. and the <strong>LL.M.</strong> programmes at participating NLUs that start in the academic year <strong>2027-28</strong>. This page covers the PG (LL.M.) test; the UG test has its own page."
            source: cpg-faq
          - table:
              caption: "CLAT 2027 PG calendar"
              head: ["Event", "Date"]
              rows:
                - ["Online enrolment", "3 Aug – 31 Oct 2026"]
                - ["Last time to submit and pay", "31 Oct 2026, 11:59 PM"]
                - ["CLAT 2027 (PG)", "Sun 6 Dec 2026, 2:00–4:00 PM (PwD: to 4:40 PM)"]
            source: cpg-ins
          - list:
              - "The exam is <strong>offline</strong>; only the application is online."
              - "Indian nationals, NRIs, PIO and OCI card holders can sit CLAT PG. Foreign nationals cannot; they and NRI-sponsored applicants go to each NLU directly."
              - "Choose UG or PG carefully — the programme cannot be changed after you apply."
            source: cpg-ins
      - id: eligibility
        nav: "Eligibility"
        eyebrow: "Academic eligibility"
        heading: "An LL.B. with 50% — or 45% for SC, ST and PwD"
        parts:
          - list:
              - "Passed an <strong>LL.B. degree</strong> or equivalent with at least <strong>50%</strong> marks or the equivalent grade."
              - "<strong>45%</strong> for candidates from the SC, ST and PwD categories."
              - "Final-year LL.B. students sitting the exam in 2027 can apply, but must prove they passed at admission or lose the seat."
              - "There is <strong>no upper age limit</strong>."
            source: cpg-elig
      - id: scheme
        nav: "Exam scheme"
        eyebrow: "Exam scheme &amp; marking matrix"
        heading: "120 law questions in two hours — no essays"
        parts:
          - table:
              caption: "CLAT 2027 PG question paper format"
              head: ["Item", "Rule"]
              rows:
                - ["Maximum marks", "120"]
                - ["Duration", "2 hours"]
                - ["Questions", "120 multiple-choice questions, one mark each"]
                - ["Negative marking", "0.25 mark for each wrong answer"]
            source: cpg-fmt
          - list:
              - "<strong>Constitutional Law</strong>"
              - "Other areas of law: Jurisprudence, Administrative Law, Law of Contract, Torts, Family Law, Criminal Law, Property Law, Company Law, Public International Law, Tax Law, Environmental Law, and Labour &amp; Industrial Law."
            source: cpg-fmt
          - p: "<strong>Tie-break:</strong> the older candidate ranks higher, then a computerised draw of lots."
            source: cpg-ins
      - id: reservation
        nav: "Reservation"
        eyebrow: "Reservation &amp; domicile quotas"
        heading: "Each NLU applies its own LL.M. seat matrix"
        parts:
          - p: "Intake, reservation and fees are set by each NLU and printed in its brochure. To claim a reserved seat you must produce the certificate prescribed by the Government of India or the State Government, as the NLU requires, at admission. NLUs may change seat numbers before the final allotment."
            source: cpg-ins
          - table:
              caption: "NLSIU Bengaluru — 120 LL.M. seats (AY 2027-28)"
              head: ["Category", "Share", "Seats"]
              rows:
                - ["SC", "15%", "18"]
                - ["ST", "7.5%", "9"]
                - ["OBC-NCL", "27%", "33"]
                - ["EWS", "10%", "12"]
                - ["General", "—", "48"]
            source: nlsiu
          - note: "NLSIU also reserves horizontally 30% (36 seats) for women, 5% (6) for PwD and 25% (30, compartmentalised) for Karnataka Students."
            source: nlsiu
          - list:
              - "<strong>NALSAR Hyderabad — 66 LL.M. seats:</strong> 50 for all-India candidates and 16 for Resident Students of Telangana (four years' study or residence in Telangana plus an LL.B. from there). Horizontal: 19 seats for women, 3 for PwD."
              - "NALSAR also offers 13 LL.M. seats to foreign nationals outside CLAT (3 SAARC, 5 non-SAARC, 5 ICCR / Government of India nominees)."
            source: nalsar
          - p: "<strong>WBNUJS Kolkata — 100 LL.M. seats:</strong> 70 for all-India candidates and 30 for West Bengal domicile students, with SC, ST, OBC and PwD seats inside that total."
            source: wbnujs
          - note: "Notified on 5 September 2026 for both UG and PG: WBNUJS replaced OBC-A / OBC-B with OBC of West Bengal. Applicants could update their category until 31 October 2026."
            source: clat-wb
          - note: "Also on 5 September 2026 (UG and PG): NLU Meghalaya added Khasi &amp; Jaintia, Garo, and Other Scheduled Castes / Scheduled Tribes of Meghalaya as domicile categories."
            source: clat-meg
      - id: fees
        nav: "Application &amp; fees"
        eyebrow: "Registration steps &amp; fees"
        heading: "Apply online by 31 October 2026 — ₹4,000 or ₹3,500"
        parts:
          - list:
              - "<strong>Register</strong> on the CLAT 2027 website with your own mobile number and e-mail ID, validate the OTP and log in."
              - "<strong>Fill the form</strong> with names spelt exactly as on your certificates and upload a photo, your signature, and SC / ST / OBC, PwD or BPL certificates if you claim them (PDF only)."
              - "<strong>Pay and submit</strong> by 31 October 2026, 11:59 PM. Programme, category and BPL fields cannot be changed after payment; if you file more than one form, only the last counts."
            source: cpg-ins
          - table:
              caption: "CLAT 2027 application fee"
              head: ["Category", "Fee"]
              rows:
                - ["General / OBC / NRI", "₹4,000"]
                - ["SC / ST / BPL / PwD", "₹3,500"]
                - ["Previous years' question papers (optional)", "₹500 extra"]
            source: cpg-ins
          - note: "Fees are paid online only, are non-refundable and non-adjustable; bank charges are paid by the candidate."
            source: cpg-ins
      - id: horizons
        nav: "LL.M. tracks"
        eyebrow: "Career horizons &amp; mapped institutions"
        heading: "One-year LL.M. specialisations at the NLUs"
        parts:
          - list:
              - "<strong>NLSIU Bengaluru:</strong> one-year LL.M. over three trimesters with a dissertation; concentrations in Public Law, Criminal Law, Commercial Laws, and Law &amp; Technology (up to 30 students each), or a General stream. Fee for AY 2027-28: <strong>₹5,99,000</strong> General, <strong>₹5,93,000</strong> SC/ST, including refundable deposits."
            source: nlsiu
          - list:
              - "<strong>NALSAR Hyderabad:</strong> one-year LL.M. leaning towards teaching and research, with specialisations built during the year — Corporate &amp; Commercial, Criminal, IPR, International Trade &amp; Business, Public Law &amp; Legal Theory, or General."
              - "NALSAR and the Indian Institute of Corporate Affairs also run a <strong>two-year LL.M. in Insolvency and Bankruptcy Laws</strong>, started in 2023."
            source: nalsar
          - p: "<strong>GNLU Gandhinagar</strong> offers four LL.M. specialisations — Corporate &amp; Business Law, Constitutional &amp; Administrative Law, Criminal &amp; Security Law, and Intellectual Property Law — with 57 of the Gandhinagar campus's 68 PG seats for all-India candidates."
            source: gnlu
          - links:
              - { label: "CLAT UG", url: "clat.html" }
              - { label: "AILET (NLU Delhi)", url: "ailet.html" }
              - { label: "Law (LLB) career guide", url: "llb.html" }
              - { label: "Law college finder", url: "colleges-law.html" }
    sources:
      - { id: cpg-elig, name: "Consortium of NLUs — CLAT 2027 PG Eligibility", url: "https://consortiumofnlus.ac.in/clat-2027/pg-eligibility.html", covers: "LL.B. 50% / 45% rule, final-year candidates, no age limit", checked: 2026-10-15 }
      - { id: cpg-fmt, name: "Consortium of NLUs — CLAT 2027 PG Question Paper Format", url: "https://consortiumofnlus.ac.in/clat-2027/pg-question-format.html", covers: "marks, duration, questions, syllabus, negative marking", checked: 2026-10-15 }
      - { id: cpg-ins, name: "Consortium of NLUs — CLAT 2027 PG Instructions", url: "https://consortiumofnlus.ac.in/clat-2027/pg-instructions.html", covers: "offline mode, date and time, who can appear, tie-break, enrolment window, application steps, fees, reservation certificates", checked: 2026-10-15 }
      - { id: cpg-faq, name: "Consortium of NLUs — CLAT 2027 FAQs", url: "https://consortiumofnlus.ac.in/clat-2027/FAQs.html", covers: "programmes and academic year covered", checked: 2026-10-15 }
      - { id: nlsiu, name: "NLSIU Bengaluru — CLAT 2027 brochure", url: "https://consortiumofnlus.ac.in/clat-2027/nlus/brochure/NLSIU.pdf", covers: "LL.M. intake, reservation, concentrations, fee", checked: 2026-10-15 }
      - { id: nalsar, name: "NALSAR Hyderabad — CLAT 2027 brochure", url: "https://consortiumofnlus.ac.in/clat-2027/nlus/brochure/NALSAR.pdf", covers: "LL.M. seat matrix, Telangana resident rule, foreign national seats, specialisations, IBC LL.M.", checked: 2026-10-15 }
      - { id: wbnujs, name: "WBNUJS Kolkata — CLAT 2027 brochure", url: "https://consortiumofnlus.ac.in/clat-2027/nlus/brochure/WBNUJS.pdf", covers: "LL.M. intake and West Bengal domicile seats", checked: 2026-10-15 }
      - { id: gnlu, name: "GNLU Gandhinagar — CLAT 2027 brochure", url: "https://consortiumofnlus.ac.in/clat-2027/nlus/brochure/GNLU.pdf", covers: "LL.M. specialisations and PG seat allocation", checked: 2026-10-15 }
      - { id: clat-wb, name: "Consortium of NLUs — Change in reservation category, WBNUJS (5 Sep 2026)", url: "https://s3.ap-south-1.amazonaws.com/files2027.consortiumofnlus.ac.in/sites/consortiumofnlus.ac.in/entity-uploads/notification/attachment/Attachment_abb9404540464e6da450be350bfbd2fa_53836.pdf", covers: "West Bengal OBC change for UG and PG", checked: 2026-10-14 }
      - { id: clat-meg, name: "Consortium of NLUs — Change in reservation category, NLU Meghalaya (5 Sep 2026)", url: "https://s3.ap-south-1.amazonaws.com/files2027.consortiumofnlus.ac.in/sites/consortiumofnlus.ac.in/entity-uploads/notification/attachment/Attachment_8f031e47a4e54e909c4cb97c80015e59_48952.pdf", covers: "Meghalaya domicile categories added for UG and PG", checked: 2026-10-14 }

