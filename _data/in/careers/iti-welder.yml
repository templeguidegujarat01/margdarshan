          - q: "How long is the ITI Welder course?"
            a: "Welder is typically a 1-year NCVT-affiliated trade, combining trade theory, safety training and substantial hands-on welding practice across common welding processes."
          - q: "Is the ITI Welder certificate enough to work abroad, like in the Gulf?"
            a: "The ITI certificate is a useful starting qualification, but international employers — especially in the Gulf and shipbuilding/oil & gas sectors — often specifically require additional internationally recognised welding certifications (such as those following Amazon Web Services (AWS) or similar standards) and a practical skills test. Treat the ITI trade as your foundation, not a guaranteed passport to overseas work."
          - q: "What welding processes are covered in ITI Welder training?"
            a: "Common processes covered include arc welding (SMAW), gas welding, and increasingly, basics of MIG/TIG welding, though depth and exposure to advanced processes vary by institute and available equipment."
          - q: "What industries hire ITI Welders?"
            a: "Construction and infrastructure, automobile and heavy vehicle manufacturing, shipbuilding, pipeline and oil & gas companies, and general fabrication workshops all hire trained welders, alongside government/PSU and defence technical recruitment routes."
          - q: "Can I start my own welding/fabrication business after this trade?"
            a: "Yes, this is a realistic and common path. Many welders build independent fabrication or contracting businesses after gaining practical experience, though success depends on building a client base, equipment investment and often additional certifications for larger structural or pressure-vessel work."
