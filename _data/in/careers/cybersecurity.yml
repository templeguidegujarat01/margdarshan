            fact: "Entry salary depends heavily on certifications and hands-on proof of skill (CTFs, labs) — a plain degree without either starts modestly, around ₹3.5-5 LPA, while the same graduate with CEH or Security+ can start meaningfully higher."
          - myth: "You need an engineering degree to work in cyber security."
            fact: "Many entry-level SOC/security analyst roles accept graduates from any stream — BCA, B.Sc, even Commerce or Arts — provided they hold a recognised certification like CompTIA Security+ or CEH."
          - myth: "Cyber security demand in India is more hype than reality."
            fact: "NASSCOM estimates India needs about 1.5 million cybersecurity professionals against roughly 80,000 currently qualified — a documented, large skills gap, not a marketing claim."
