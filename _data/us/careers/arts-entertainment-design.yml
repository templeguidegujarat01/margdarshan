          - { tag: "About 4 years", title: "Bachelor's degree with interior design, drawing and CAD courses", text: "", kind: stage, source: ooh_interior }
          - { tag: "Goal", title: "Interior designer", text: "", kind: goal, source: ooh_qf_interior }
