hero:
  eyebrow: "Commerce / Law · Regulated Profession"
  title: "Insolvency Professional (IBBI) — Running Resolution Cases"
  meta:
    - "Registered with IBBI"
    - "Experience route or Graduate Insolvency Programme"
  read_time: "8 min read"
  intro:
    - "Insolvency Professionals (IPs) run companies and cases under the Insolvency and Bankruptcy Code — as interim resolution professionals, resolution professionals and liquidators. IBBI registers them after they pass the Limited Insolvency Examination, enrol with an Insolvency Professional Agency (IPA) and finish a pre-registration course. Experienced CAs, CSs, CMAs, advocates and managers qualify directly; younger graduates can enter through IBBI's Graduate Insolvency Programme (GIP)."
