          points:
            - "ITI Refrigeration & Air Conditioning (RAC) is a <strong>1-2 year</strong>, NCVT/DGT-affiliated trade under the Craftsman Training Scheme, training students in the refrigeration cycle, AC and refrigerator installation, servicing and repair, and basic commercial cooling systems."
            - "Given India's climate and rapidly growing AC ownership, this is one of the more consistently in-demand ITI trades, with pronounced seasonal demand spikes."
            - "Training is heavily hands-on — working on real units, diagnosing cooling faults, handling refrigerant systems safely — combined with trade theory, following the standard Craftsmen Training Scheme (CTS) structure."
          more:
            - "Beyond home AC repair, the trade also opens doors to commercial refrigeration and cold chain work, a growing sector given India's expanding food retail and logistics industries."
