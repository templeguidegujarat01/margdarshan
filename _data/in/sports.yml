  # ------------------------------------------------------------------------------------------------ Shooting
  - slug: shooting
    short: "Shooting"
    domain: solo
    checked: 2026-10-16
    body: "International Shooting Sport Federation (ISSF) · National Rifle Association of India (NRAI)"
    card: "ISSF rifle, pistol and shotgun events, NRAI's MQS and selection-trial ladder, arms licences for juniors, the 15,000-round import rule, Karni Singh ranges, SLI and jobs."
    card_facts: ["15 Olympic events", "Junior till the year you turn 21", "15,000 rounds a year import cap"]
    eyebrow: "Sports Cockpit · Solo, Track &amp; Pool · ISSF Rule Book (July 2026) · NRAI Selection Criteria 2026"
    title: "Shooting — ISSF events, NRAI trials, gun licences &amp; the cost of a shooter"
    lede: "Education Margdarshan's shooting map for India: the ISSF rifle, pistol and shotgun events and their shot counts, the scores (MQS) that open India's selection trials, how NRAI ranks shooters, what a junior's family must sign for an arms licence, how renowned shooters import guns and ammunition, the Karni Singh ranges, the Shooting League of India, who pays, and the awards and jobs after a medal."
    official:
      - { label: "ISSF Rule Book 2026 print, July 2026 (PDF)", url: "https://backoffice.issf-sports.org/getfile.aspx?mod=docf&pane=1&inst=455&file=ISSF-Rule-Book-2026-Edition-2025-Second-Print-07-2026-Effective-1-July-2026.pdf" }
      - { label: "thenrai.in", url: "https://www.thenrai.in/" }
    facts:
      - { label: "Olympic shooting events", value: "<strong>15</strong> — rifle, pistol, shotgun", source: issf-rules }
      - { label: "Junior (ISSF)", value: "Until <strong>31 Dec of the year you turn 21</strong>", source: issf-rules }
      - { label: "Rank for India's team", value: "<strong>Best 4 of latest 5</strong> scores in 180 days", source: nrai-sel26 }
      - { label: "Import cap (renowned shooter)", value: "<strong>15,000 rounds a year</strong> per calibre", source: nrai-import }
    sections:
      - id: rules
        nav: "Events &amp; guns"
        eyebrow: "Core rules &amp; selection formats"
        heading: "The Olympic rifle, pistol and shotgun events"
        parts:
          - table:
              caption: "ISSF Olympic individual events — qualification and final"
              head: ["Discipline", "Event", "Qualification", "Final"]
              rows:
                - ["Rifle", "<strong>10m Air Rifle</strong> (men, women)", "60 shots", "24 shots"]
                - ["Rifle", "<strong>50m Rifle 3 Positions</strong> — kneeling, prone, standing (men, women)", "3 × 20 shots", "35 shots"]
                - ["Pistol", "<strong>10m Air Pistol</strong> (men, women)", "60 shots", "24 shots"]
                - ["Pistol", "<strong>25m Rapid-Fire Pistol</strong> (men) — 8, 6 and 4-second series", "30 + 30 shots", "40 shots"]
                - ["Pistol", "<strong>25m Pistol</strong> (women) — precision and rapid fire", "30 + 30 shots", "50 shots"]
                - ["Shotgun", "<strong>Trap</strong> (men, women)", "125 targets", "Up to 30 targets"]
                - ["Shotgun", "<strong>Skeet</strong> (men, women)", "125 targets", "Up to 36 targets"]
            source: issf-rules
          - p: "With the <strong>mixed-team</strong> events (one man and one woman from the same country), shooting has <strong>15 Olympic events</strong>. Every Olympic event has a qualification round and a final."
            source: issf-rules
          - list:
              - "<strong>Air rifle and air pistol</strong>: 4.5 mm (.177\") calibre."
              - "<strong>25m pistol events</strong>: 5.6 mm (.22\") rimfire, long-rifle cartridges."
              - "<strong>Shotgun</strong>: any smoothbore up to <strong>12 gauge</strong> — but <strong>no semi-automatic or pump-action</strong> guns and no camouflage finish; the shot charge may not exceed <strong>24.0 g</strong> (+0.5 g tolerance)."
              - "In shotgun, everyone near the firing line must wear <strong>ear protection</strong> and every athlete must wear <strong>shatterproof shooting glasses</strong> — a shooter found on station without hearing protection loses the first target hit in that round."
            source: issf-rules
          - list:
              - "A shooter remains a <strong>Junior until 31 December of the year they turn 21</strong>, and juniors may shoot in all ISSF Championships and the Olympics as part of the national team."
              - "World Championships for <strong>all events</strong> are held every four years, two years after the Olympics; in other non-Olympic years shotgun and rifle-pistol have separate World Championships. Junior World Championships are held every year."
            source: issf-rules
      - id: recognition
        nav: "Recognition"
        eyebrow: "Institutional &amp; global recognition"
        heading: "Olympics, World Championships — and India's own league"
        parts:
          - table:
              caption: "Government cash award for a senior shooting medal (₹ lakh)"
              head: ["Event", "Gold", "Silver", "Bronze"]
              rows:
                - ["<strong>Olympic Games</strong>", "75", "50", "30"]
                - ["World Championships, all events (every 4 years)", "40", "25", "15"]
                - ["Asian Games / Commonwealth Games", "30", "20", "10"]
                - ["Asian Championships, all events (every 4 years)", "15", "10", "5"]
            source: myas-cash
          - note: "Team events pay each member 75% of the individual amount; the coach of an individual medallist gets 50%. Apply on the DBT-MIS portal within six months."
            source: myas-cash
          - list:
              - "The <strong>Shooting League of India (SLI)</strong> is NRAI's franchise league for Olympic events — 'India's first professional shooting league' — with ISSF support but <strong>not an ISSF competition</strong>."
              - "Format announced in April 2025: <strong>6–8 city franchises</strong>, 12 shooters a team (6 men, 6 women), up to 4 foreigners and at least 2 juniors (U21); players chosen at an <strong>auction</strong> and paid a tournament fee of <strong>€5,000–10,000</strong>, with franchises covering travel and stay."
              - "Indian shooters could apply as Olympic or World medallists, World Cup medallists, top-10 ISSF-ranked shooters, National Championship medallists, national-squad members or junior world medallists."
            source: "nrai-sli,nrai-sli-eoi"
          - note: "SLI dates have moved: the eligibility notice set it for the Karni Singh ranges, 20 Nov–2 Dec 2025, while NRAI's December 2025 tender points to an SLI 2026 event in Delhi/Bhopal. Check NRAI's notice board before planning around it."
            source: "nrai-sli-eoi,nrai-sli-rfq"
      - id: eligibility
        nav: "Licence &amp; age"
        eyebrow: "Physical benchmarks &amp; anti-doping"
        heading: "Arms licences, age checks, safety and clean sport"
        parts:
          - list:
              - "NRAI <strong>certifies</strong> shooters' applications for a <strong>new arms licence</strong>, an extra weapon or a higher ammunition quota (under MHA notification S.O. 665(E), 12 Feb 2020). Processing fee: <strong>₹1,770</strong> for a new licence or extra weapon, ₹1,180 for other recommendations."
              - "For a <strong>junior shooter</strong>, a parent signs an undertaking: the child <strong>may not carry the firearm alone until age 21</strong>; the gun stays locked in a steel almirah, and a parent (or an authorised coach or adult) carries it and hands it over only at the range."
            source: nrai-licence
          - list:
              - "Under the national code against age fraud, NRAI requires <strong>all age-category athletes to undergo a medical examination</strong> to verify age before tournaments or camps, and punishes intentional age fraud harshly."
            source: nrai-age
          - list:
              - "Pointing a gun at any person — even unloaded, even for a moment — can mean <strong>disqualification and debarment</strong>. All guns must be treated as loaded."
              - "Any WADA/NADA violation keeps a shooter out of selection and counts as a suspension pending appeal."
            source: nrai-sel26
          - list:
              - "Check every medicine against the <strong>Prohibited List</strong> and apply to NADA for a <strong>TUE</strong> if no permitted treatment exists."
            source: nada-rr
      - id: roadmap
        nav: "Roadmap"
        eyebrow: "Grassroots-to-elite residential pipeline"
        heading: "From the state championship to India colours"
        parts:
          - table:
              caption: "NRAI's selection ladder (Selection Criteria 2026)"
              head: ["Step", "What happens"]
              rows:
                - ["1. Ranking competitions", "Scores from NRAI ranking competitions (RCs) and the Nationals feed your average"]
                - ["2. National Shooting Championship Competitions (NSCC)", "Shoot the event's <strong>MQS</strong> at the 68th NSCC — this also makes you a 'renowned shooter' for imports"]
                - ["3. Group B selection trials", "Open to seniors, juniors and youth who shot the MQS at the NSCC, or whose best three scores of the year beat it"]
                - ["4. Group A selection trials", "Top-ranked <strong>seniors</strong> in Olympic events only; finals are shot only in Group A"]
                - ["5. National Squad", "Picked from Group A after the 2nd trial of 2026 and reviewed after the 4th"]
                - ["6. India team", "<strong>Three shooters per event</strong>; mixed teams pair the top-ranked man and woman"]
            source: nrai-sel26
          - table:
              caption: "Qualifying scores (MQS) for 2026 selection trials — Olympic events"
              head: ["Event", "Senior", "Junior", "Youth"]
              rows:
                - ["10m Air Rifle men", "615", "610", "605"]
                - ["10m Air Rifle women", "612", "607", "602"]
                - ["50m Rifle 3 Positions men / women", "565 / 560", "545 / 540", "—"]
                - ["10m Air Pistol men", "565", "560", "555"]
                - ["10m Air Pistol women", "550", "540", "530"]
                - ["25m Rapid-Fire Pistol men", "550", "535", "—"]
                - ["25m Pistol women", "545", "525", "—"]
            source: nrai-sel26
          - note: "Air rifle MQS are decimal scores. Ranking uses the <strong>Moving Average Method</strong>: the average of your <strong>best four of the latest five scores within 180 days</strong> — no score may be skipped. Shotgun ranking restarted from zero at the 68th NSCC."
            source: nrai-sel26
          - p: "Medals at the <strong>Khelo India Youth Games (above 18)</strong>, Junior Nationals and SGFI school games also count for central sports-quota jobs."
            source: dopt-2024
      - id: academies
        nav: "Ranges"
        eyebrow: "Top elite academies &amp; cities"
        heading: "Where India's shooters train"
        parts:
          - list:
              - "<strong>Dr. Karni Singh Shooting Range, New Delhi</strong> is SAI's National Centre of Excellence for shooting — one of SAI's 13 priority disciplines, with residential training, coaches, sports science and nutritionist-set diets."
            source: sai-schemes
          - list:
              - "The same Karni Singh ranges were named as the venue for NRAI's Shooting League of India."
            source: nrai-sli-eoi
          - note: "Education Margdarshan lists only ranges whose role is confirmed by SAI or NRAI's own files. Private academies are not listed until we can verify them from their own notices."
            source: sai-schemes
      - id: costs
        nav: "Guns &amp; cost"
        eyebrow: "Equipment costs &amp; who pays"
        heading: "Guns, ammunition, import permits — and who pays"
        parts:
          - table:
              caption: "NRAI import rules for renowned shooters (approved 10 Oct 2022, amended 12 Aug 2023)"
              head: ["Rule", "What it says"]
              rows:
                - ["Who is 'renowned'", "Shot an Open event at the National Shooting Championship and reached NRAI's <strong>MQS</strong>"]
                - ["Weapons", "<strong>One weapon + one extra barrel</strong> per event in which you are renowned (Arjuna awardees: two); <strong>no magnum</strong> weapons"]
                - ["Ammunition", "Up to <strong>15,000 rounds a year</strong>; .22 rifle and pistol ammunition must be lead, <strong>not jacketed</strong>; shotgun cartridges at most 24.5 g of shot"]
                - ["Permit", "Fee <strong>₹5,000 + GST</strong>; valid <strong>24 months</strong>, extendable by 6"]
                - ["Duty", "NRAI issues customs <strong>duty-exemption certificates</strong> for listed shooting items under a Finance Ministry notification"]
                - ["Licence", "The shooter must hold a valid arms licence covering the weapon and the ammunition quantity"]
            source: nrai-import
          - list:
              - "Education Margdarshan does not print gun or ammunition prices: neither ISSF nor NRAI publishes them, and they depend on the model and the import route."
            source: nrai-import
          - table:
              caption: "Who pays — shooting"
              head: ["Stage", "Paid by", "What you get"]
              rows:
                - ["SAI NCOE trainee", "Sports Authority of India", "Coaching, boarding, sports science at Karni Singh"]
                - ["Khelo India athlete", "Ministry of Youth Affairs &amp; Sports", "<strong>₹6.28 lakh a year</strong> incl. ₹1.20 lakh cash"]
                - ["Junior medal prospect", "TOPS Development Group", "₹25,000 a month"]
                - ["Olympic prospect", "TOPS Core Group", "<strong>₹50,000 a month</strong> + approved training plan"]
                - ["Athlete in hardship", "PDU National Welfare Fund", "Up to ₹2.50 lakh"]
            source: "sai-schemes,pib-support"
      - id: earnings
        nav: "Earnings &amp; jobs"
        eyebrow: "Earning channels &amp; central job quotas"
        heading: "Awards, league fees and sports-quota jobs"
        parts:
          - list:
              - "Shooting is one of the <strong>65 sports</strong> in the central sports quota for <strong>Group C</strong> posts, with up to 5 years' age relaxation (10 for SC/ST)."
              - "Medals at the Olympics, Asian Games, Commonwealth Games or World Championships can bring up to <strong>three out-of-turn promotions</strong>."
            source: dopt-2022
          - list:
              - "<strong>SLI tournament fee</strong> of €5,000–10,000 per shooter, set by the auction (per NRAI's 2025 fact sheet)."
            source: nrai-sli
          - p: "Retired champions can receive the <strong>Pension to Meritorious Sportspersons</strong> of ₹12,000–20,000 a month."
            source: pib-support
      - id: traps
        nav: "Red flags"
        eyebrow: "Disqualification traps"
        heading: "Mistakes that cost shooters their ranking"
        parts:
          - list:
              - "<strong>Withdrawing mid-competition</strong> — once you have started (even sighters), your score so far, or zero, goes into your average."
              - "<strong>Not replying in 3 days</strong> — if you cannot go to an international event, email NRAI within 3 days of the team announcement or face a penalty."
              - "<strong>Breaking dress code or range safety</strong> — penalties up to disqualification and debarment."
            source: nrai-sel26
          - list:
              - "<strong>Letting an import permit lapse</strong> — no extension after expiry unless an advance was paid, and no new permit until the old one is used or surrendered."
            source: nrai-import
          - list:
              - "<strong>A junior carrying the gun alone</strong> — breaking the parents' undertaking can get the licence cancelled."
            source: nrai-licence
      - id: doubts
        nav: "Player doubts"
        eyebrow: "Real-world player doubts"
        heading: "Late start, sports-quota jobs, money and certificates — straight answers"
        parts:
          - qa:
              q: "I am 18, 20 or 22. Is it too late to start shooting?"
              a: "Shooting ranks by score, not age. NRAI's ladder uses the <strong>Moving Average Method</strong> (best four of your latest five scores in 180 days), and a senior who shoots the <strong>MQS</strong> at the National Championship enters Group B trials — 615 in men's 10 m air rifle, 565 in men's 10 m air pistol. Under-21s carry an extra rule: a junior <strong>may not carry the firearm alone until 21</strong>. The real clock is the job deadline: Railways sports quota stops at <strong>25</strong> and CRPF at <strong>23</strong> (28 for an unreserved sportsperson after relaxation)."
            source: "nrai-sel26,nrai-licence,rrc-wr26,crpf26"
          - qa:
              q: "Which government jobs can shooting get me?"
              a: "<strong>Central Group C posts</strong> under DoPT rules list shooting among 65 sports. Western Railway's 2026-27 notice advertised <strong>no shooting posts</strong> — each zone advertises only the events its team needs. <strong>CRPF's 2026 sports quota</strong> includes shooting, with rifle and pistol events from 10 m air to 50 m."
            source: "dopt-2022,rrc-wr26,crpf26"
          - table:
              caption: "Sports-quota job routes open in 2026 — age, qualifying results, pay"
              head: ["Route", "Age", "Main qualifying results", "Pay level"]
              rows:
                - ["Railways <strong>Level 5/4</strong> (graduates)", "18–25 on 1 Jan 2027", "Played the <strong>Olympics</strong>, or top 3 at a World Cup, World Championship, Asian Games, Commonwealth Games or Youth Olympics", "Level 5/4"]
                - ["Railways <strong>Level 3/2</strong> (12th, or 10th + apprenticeship)", "18–25 on 1 Jan 2027", "Top 3 at <strong>Senior, Youth or Junior Nationals</strong>, National Games or All India Inter-University; or Federation Cup gold", "Level 3/2"]
                - ["Railways <strong>Level 1</strong>", "18–25 on 1 Jan 2027", "Played for your state and finished <strong>at least 8th at Senior Nationals</strong>; or top 3 at the Federation Cup", "Level 1"]
                - ["CRPF <strong>Head Constable (GD)</strong> (10+2)", "18–23 on 1 Aug 2026; sportspersons get <strong>+5 years</strong> (OBC +8, SC/ST +10)", "Played for India; or top 3 for your state at Nationals or National Games; or <strong>gold/silver at Junior Nationals</strong>", "Level 4 · ₹25,500–81,100"]
                - ["CRPF <strong>Constable (GD)</strong> (10th pass)", "18–23 on 1 Aug 2026; sportspersons get <strong>+5 years</strong> (OBC +8, SC/ST +10)", "Played for your state at <strong>Senior or Junior Nationals</strong>; or top 3 at SGFI school nationals or Khelo India Games", "Level 3 · ₹21,700–69,100"]
            source: "rrc-wr26,crpf26"
          - note: "Railways count results from <strong>1 April 2024</strong>; CRPF counts the <strong>two years before 30 September 2026</strong>. Railways fee ₹500 (₹400 back if you attend the trial; ₹250, refunded in full on attending, for SC/ST, women, PwBD, minorities, ex-servicemen and EBC). CRPF fee ₹100 for UR/OBC/EWS men; free for women, SC, ST and ex-servicemen. CRPF picks sign a <strong>₹1 lakh bond to serve at least 3 years</strong>."
            source: "rrc-wr26,crpf26"
          - qa:
              q: "We are a lower-middle-class family. How do we keep costs down?"
              a: "Guns and ammunition are the big bill, and no official body publishes their prices. The official fees are small: NRAI's arms-licence recommendation costs <strong>₹1,770</strong> (new licence or extra weapon), and a renowned shooter's import permit <strong>₹5,000 + GST</strong>, with customs <strong>duty-exemption certificates</strong>. Aim for the free seats — the <strong>Karni Singh NCOE</strong>, Khelo India (₹6.28 lakh a year) and TOPS."
            source: "nrai-licence,nrai-import,sai-schemes,pib-support"
          - qa:
              q: "Does any 'national' certificate count for a job?"
              a: "No. Railways will <strong>not recruit on a certificate from a federation MoYAS did not recognise</strong> at the time of the championship, and CRPF counts only championships of MoYAS-recognised federations or the IOA's National Games. NRAI also makes every age-category shooter take a <strong>medical age examination</strong> before tournaments or camps."
            source: "rrc-wr26,crpf26,nrai-age"
