  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What is NDA?"
    parts:
      - overview:
          points:
            - "NDA is one of the world's most respected military training institutions, where future officers of the Indian Army, Indian Navy and Indian Air Force train together before joining their respective services."
            - "Students can apply after Class 12, and successful candidates become <strong>commissioned officers</strong> — Class-I Gazetted Officers — at a young age, a genuinely direct route unmatched by most other career paths."
            - "Admission runs through the <strong>UPSC</strong>, the same body that conducts the Civil Services Examination."
          more:
            - "The process is deliberately two-gated: a demanding written exam tests academic ability, followed by a five-day <strong>SSB interview</strong> that assesses leadership, personality and psychological fitness — a genuinely different, and in many ways tougher, filter than academic exams alone."
  - id: "who"
    hid: "who-heading"
    alt: true
    eyebrow: "Fit check"
    heading: "Who should choose NDA"
    parts:
      - fit:
          match:
            - "Have a genuine, sustained desire to serve the nation and lead, not just an interest triggered by uniforms or prestige."
            - "Are prepared for a genuinely demanding, disciplined training life and a fitness standard maintained throughout your career."
            - "Are willing to prepare seriously for both the written exam and the SSB interview — the personality assessment is not something you can cram for last minute."
          mismatch:
            - "Are choosing NDA mainly for family pressure or prestige, without genuine willingness to embrace military discipline long-term."
            - "Aren't prepared for a genuinely tough, multi-stage selection process with a very small number of seats relative to applicants."
            - "Want the higher, more flexible pay ceilings available in some private-sector tech or consulting careers instead."
