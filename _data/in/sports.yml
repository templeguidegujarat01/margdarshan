  # ------------------------------------------------------------------------------------------------ Hindustani music
  - slug: hindustani-music
    short: "Hindustani Music"
    domain: arts
    checked: 2026-10-16
    body_label: "Recognised by"
    body: "Sangeet Natak Akademi · Prasar Bharati (All India Radio)"
    rules_note: "Akademi, Ministry, Prasar Bharati &amp; ICCR files only"
    sources_note: "Every fact on this Education Margdarshan page is taken from an All India Radio, Sangeet Natak Akademi, Ministry of Culture or ICCR file below, or from an academy's own 2026-27 notice (used only for that academy). Fees, grades and scheme amounts change — open the current file before you apply or pay."
    card: "Vocal and instrumental: AIR's B-to-Top grading, the approved raga and tala lists, Gandharva exam levels, SNA awards and the scholarships for training."
    card_facts: ["AIR grades B → Top", "Top only after 10 yrs in A", "60 ragas on AIR's list"]
    eyebrow: "Performing Arts Cockpit · Classical Music · AIR audition guidelines 2024"
    title: "Hindustani Classical Music — AIR grades, ragas, training ladder &amp; scholarships"
    lede: "For a Hindustani vocalist or instrumentalist, the clearest official benchmark is All India Radio's music audition: what it tests, which ragas and talas it accepts, what it charges and how an artiste climbs from B to Top grade. This page adds the Gandharva exam levels, Kathak Kendra's music courses, the Sangeet Natak Akademi honours, ICCR empanelment, scholarships, fellowships and what broadcasting actually pays."
    official:
      - { label: "AIR Music Audition guidelines (PDF)", url: "https://prasarbharati.gov.in/wp-content/uploads/2024/04/Guidelines_AIR_Music_Auditions.pdf" }
      - { label: "sangeetnatak.gov.in", url: "https://sangeetnatak.gov.in/" }
    facts:
      - { label: "AIR grades", value: "<strong>B · B-High · A · Top</strong>, awarded by expert boards", source: air-aud }
      - { label: "Fresher audition fee", value: "<strong>₹1,298</strong> incl. GST (SC/ST ₹1,003)", source: air-aud }
      - { label: "Top grade", value: "Only after <strong>10 years in A</strong> grade", source: air-aud }
      - { label: "Young-artiste scholarship", value: "<strong>₹5,000 a month</strong> for 2 years · age 18–25", source: pib-ksvy }
    sections:
      - id: rules
        nav: "Raga &amp; tala rules"
        eyebrow: "Core rules, lineages &amp; raga–tala frameworks"
        heading: "What AIR auditions in Hindustani music — and how it judges"
        parts:
          - list:
              - "<strong>Vocal</strong>: Khayal, Dhrupad / Dhamar, Haveli Sangeet, and light classical vocal — Thumri, Dadra, Tappa, Kajari and Raag Pradhan."
              - "<strong>Instrumental</strong>: any of the 42 instruments on AIR's approved list, from sitar, sarod, surbahar, rabab, sarangi, esraj, dilruba, santoor, flute and shehnai to tabla, pakhawaj and harmonium."
            source: air-aud
          - table:
              caption: "Hindustani audition format (vocal / instrumental, excluding percussion)"
              head: ["Level", "What you perform", "Duration"]
              rows:
                - ["Fresh and B → B-High", "Two ragas — one morning/afternoon, one evening/night — one of your choice and one the station picks from your list of 25", "30 min (2 × 15)"]
                - ["B-High → A", "Three items: two ragas of your choice (one of each time band) + one of the station's choice from your list", "60 min (30 + 10 + 20)"]
                - ["Percussion, fresh and B → B-High", "Two solo talas (your choice + station's) from your list of 10, plus accompaniment (Masitkhani and Razakhani, vilambit and drut)", "45 min"]
                - ["Light classical, fresh / B → B-High", "Thumri 15 min, Dadra 10 min, Kajri / Chaiti / Tappa 5 min", "30 min"]
            source: air-aud
          - list:
              - "<strong>Swar (melody)</strong>: raga swarup — the grammar of the raga — purity of raga and of tradition (<strong>gharana</strong>); voice or tonal quality and pitch alignment; developing the raga in its entirety; aesthetics and style."
              - "<strong>Taal (rhythm)</strong>: command of laya and tempo; systematic improvisation in a percussion solo; variety of patterns across talas; for percussionists, accompaniment with understanding, grace and finesse."
              - "<strong>Sahitya (composition)</strong>: purity of the text with bhava and correct pronunciation; performing the composition — or, for instruments, the gat — in its entirety and developing it with musical phrasing."
              - "No reverb, echo or other effects on audition recordings; recordings made outside the AIR studio are not accepted."
            source: air-aud
          - p: "AIR's list of ragas for Dhrupad, Khayal and instrumental auditions runs to <strong>60 ragas</strong> (from Bilaskhani Todi, Malkauns, Bhairav, Yaman, Darbari and Bihag to Vrindabani Sarang and Kausi Kanhra), with 13 more for Thumri/Dadra. Percussion talas on the list: <strong>Teentaal, Jhaptaal, Roopak, Adachautaal, Savari (15 beats), Dhamar, Chautaal, Sooltaal, Laxmitaal, Teevra and Ektaal</strong>."
            source: air-aud
          - warn: "AIR's assessment names purity of 'tradition (gharana)' as a criterion, but no Government file lists or ranks Hindustani gharanas — so this page does not. A guru's gharana is a teaching lineage; the audition judges what you actually sing or play."
      - id: recognition
        nav: "Grades &amp; awards"
        eyebrow: "Institutional &amp; national recognition"
        heading: "AIR grading, Akademi honours and ICCR"
        parts:
          - table:
              caption: "Who grades a classical musician at All India Radio"
              head: ["Board", "Where", "Role in classical music"]
              rows:
                - ["Local Audition Board (LAB)", "Every AIR station", "Live preliminary screening; successful candidates are recorded and sent on"]
                - ["Central Audition Board (CAB)", "Directorate General, AIR, New Delhi", "Grades every fresh case and every upgrade from B up to Top"]
            source: air-aud
          - list:
              - "A <strong>B-grade artiste must be upgraded within 5 years</strong> or is removed from the list; if the CAB keeps you at B, the 5 years restart from the result date."
              - "For B-High, A and Top artistes, a station that sees a decline in quality can send a recent recording to the CAB, which may reduce or withhold bookings."
              - "The decisions of LAB, RAB and CAB are final; the Director General, AIR settles disputes."
            source: air-aud
          - table:
              caption: "Sangeet Natak Akademi honours (Hindustani vocal and instrumental are named music categories)"
              head: ["Honour", "Who is considered", "What it carries"]
              rows:
                - ["<strong>Akademi Ratna</strong> (Fellow)", "Ordinarily <strong>age 50+</strong>; at most 40 living Fellows", "₹3 lakh, citation, angavastram, tamrapatra; medical cover up to ₹1.5 lakh a year"]
                - ["<strong>Akademi Puraskar</strong> (Award)", "Ordinarily <strong>age 35+</strong>; 12 awards a year in the music field", "₹1 lakh, citation, angavastram, tamrapatra; medical cover up to ₹1 lakh a year"]
                - ["<strong>Ustad Bismillah Khan Yuva Puraskar</strong>", "<strong>Up to age 40</strong>; at most 33 a year, 8 of them in music", "₹25,000 and a tamrapatra; invitation to perform at the Akademi's festival"]
            source: "sna-awards,sna-yuva"
          - list:
              - "ICCR empanels artists <strong>aged 18 and above</strong> in Hindustani vocal and instrumental music, with applications open all year and expert committees meeting annually."
              - "Its genre-wise list (updated 25 Nov 2025) shows each artist's <strong>current category — Outstanding, Established or Proficient</strong>."
            source: "iccr-intro,iccr-list"
      - id: eligibility
        nav: "Fees, ages &amp; scholarships"
        eyebrow: "Professional portfolios &amp; age benchmarks"
        heading: "What each step costs, and the age limits"
        parts:
          - table:
              caption: "AIR music audition fees (audition fee + ₹100 form fee + 18% GST)"
              head: ["Category", "Total", "SC/ST (25% off the audition fee)"]
              rows:
                - ["<strong>Fresher</strong>", "₹1,298", "₹1,003"]
                - ["<strong>Any upgrade</strong> (B → B-High, B-High → A)", "₹2,478", "₹1,888"]
                - ["<strong>A → Top</strong>", "₹6,018", "₹4,543"]
                - ["Folk / tribal fresher", "Nil", "Nil"]
                - ["Divyaang, senior citizens, AIR / Doordarshan staff artists", "Nil", "Nil"]
            source: air-aud
          - list:
              - "There is <strong>no waiting period</strong> to re-audition or seek an upgrade — except Top: you need <strong>10 years in A grade</strong>, and after a failed Top attempt you wait a year."
              - "A classical fresher who fails at the CAB gets <strong>one exemption from the LAB</strong> screening if they reapply within a year."
              - "If your discipline is not available at your home station, apply at the nearest station that has it; no TA/DA for the audition, but TA/DA is paid for a booked broadcast."
            source: air-aud
          - table:
              caption: "Central scholarships and fellowships open to musicians"
              head: ["Scheme", "Age", "Amount", "Term"]
              rows:
                - ["<strong>CCRT Cultural Talent Search Scholarship</strong>", "10–14", "₹3,600 a year + guru/institution tuition reimbursed up to ₹9,000 a year", "2 years at a time, renewable up to the first degree or age 20; 650 new awards a year"]
                - ["<strong>Scholarship to Young Artistes</strong>", "18–25, with at least 5 years under a guru or institution", "₹5,000 a month", "2 years; up to 400 a batch"]
                - ["<strong>Junior Fellowship</strong>", "25–40", "₹10,000 a month", "2 years, research project; 200 a batch"]
                - ["<strong>Senior Fellowship</strong>", "Above 40", "₹20,000 a month", "2 years; 200 a batch"]
            source: "ccrt-ctss,pib-sya,pib-ksvy"
          - warn: "M.Mus / B.Mus and BPA / MPA are university degrees; Gandharva titles such as Visharad and Alankar are the Mandal's own examinations. Margdarshan found no Government file setting out their equivalence to degrees, so ask the university or employer in writing before relying on one in place of the other."
      - id: roadmap
        nav: "Guru to Top grade"
        eyebrow: "Grassroots-to-maestro pipeline"
        heading: "From the first lesson to Top grade"
        parts:
          - table:
              caption: "The Hindustani music ladder, step by step"
              head: ["Stage", "Typical age", "What happens", "Who pays"]
              rows:
                - ["<strong>Guru–shishya start</strong>", "Childhood", "Lessons with a guru; Gandharva Mahavidyalaya New Delhi takes children's vocal at 11–14+ and instruments from 11", "Family"]
                - ["<strong>Talent scholarship</strong>", "10–14", "CCRT Cultural Talent Search Scholarship", "Govt: ₹3,600 a year + tuition up to ₹9,000"]
                - ["<strong>Graded examinations</strong>", "Teens onward", "Akhil Bharatiya Gandharva Mahavidyalaya Mandal levels: Prarambhik → Praveshika → Madhyama → Visharad → Alankar (each after Prarambhik in Pratham and Purna parts)", "Family"]
                - ["<strong>First AIR grade</strong>", "Adult", "LAB screening at your station → recording → CAB grades you B (or higher)", "₹1,298 fee"]
                - ["<strong>Advanced training</strong>", "18–25", "Young-artiste scholarship after 5 years' training", "Govt ₹5,000 a month"]
                - ["<strong>Climb the grades</strong>", "Within 5 years of B", "B-High, then A, by recorded upgrade auditions", "₹2,478 per upgrade"]
                - ["<strong>Senior artiste</strong>", "10 years after A", "Top grade audition; SNA Award (35+), Ratna (50+); a guru's Repertory grant", "₹6,018 fee; Ministry of Culture, SNA"]
            source: "gmv-prosp,ccrt-ctss,air-aud,pib-sya,sna-awards,pib-ksvy"
          - p: "The Ministry of Culture's <strong>Repertory grant (Guru–Shishya Parampara)</strong> supports music ensembles too — one guru and up to 18 shishyas, <strong>₹15,000 a month for the guru</strong> and <strong>₹2,000–10,000 a month per shishya</strong>, depending on age."
            source: pib-ksvy
      - id: academies
        nav: "Academies"
        eyebrow: "Top elite academies &amp; universities"
        heading: "Where to train — verified 2026-27 details"
        parts:
          - list:
              - "<strong>Gandharva Mahavidyalaya, New Delhi</strong> — founded 1939 by Pandit Vinaya Chandra Maudgalya, headed by Pandit Madhup Mudgal, affiliated to the Akhil Bharatiya Gandharva Mahavidyalaya Mandal, Mumbai."
              - "Subjects: Hindustani vocal, and sitar, flute, tabla and harmonium; separate girls' and boys' vocal classes from <strong>age 15</strong>, instruments from <strong>11</strong>, children's vocal at <strong>11 to 14+</strong> (ages as on 1 May 2026)."
              - "Audition: a 1-minute song of any kind for vocal; viva only for instruments (no instrument needed)."
              - "Classes: 1 hour, 3 days a week (children's vocal 45 minutes); 75% attendance compulsory; certificates only after 2 years' training."
              - "2026-27 fees: form ₹500, admission ₹5,000, tuition and instrument fee <strong>₹3,000 a month</strong> (Indian nationals), cash only; for the 2026 batch the Mandal's exams are taken privately at other centres."
            source: gmv-prosp
          - table:
              caption: "Kathak Kendra (SNA), New Delhi — music courses for accompanists"
              head: ["Course", "Age (1 June 2026)", "Qualification", "Fee"]
              rows:
                - ["Certificate — tabla, pakhawaj, sarangi or vocal (1 year)", "19–21", "Class XII passed", "₹400 a month"]
                - ["Diploma Special — tabla, pakhawaj, sarangi or vocal (3 years)", "20–25", "Graduate", "₹650 a month"]
            source: "kk-adm,kk-fees"
          - warn: "<strong>Bhatkhande Sanskriti Vishwavidyalaya, Lucknow</strong> is a major Hindustani music university, but its official website could not be reached when Margdarshan checked (16 Oct 2026), so no fees, seats or dates are quoted. Take them only from the university's own notice."
      - id: costs
        nav: "Costs"
        eyebrow: "Instrumentation expenses &amp; who bears the cost"
        heading: "What Hindustani music training costs — and who pays"
        parts:
          - list:
              - "At an AIR audition the station provides tanpura and tabla/pakhawaj accompaniment; if you bring your own accompanists they must hold <strong>at least B-High grade</strong>, and AIR pays them nothing."
              - "Gandharva Mahavidyalaya's monthly ₹3,000 is a combined <strong>tuition and instrument fee</strong>; students pay for any damage to its instruments."
            source: "air-aud,gmv-prosp"
          - list:
              - "<strong>Guru's fees, ages 10–14</strong>: CCRT reimburses actual tuition up to ₹9,000 a year."
              - "<strong>Ages 18–25</strong>: the young-artiste scholarship pays ₹5,000 a month for advanced training."
              - "<strong>Touring abroad</strong>: for a 'Festival of India', the Government bears all expenditure on deputing the artist."
              - "<strong>Institutions</strong>: SNA grants-in-aid (₹30,000–₹1,00,000) <strong>do not pay for buying or repairing musical instruments</strong>."
            source: "ccrt-ctss,pib-sya,pib-foi,sna-grants"
          - warn: "A sitar, sarod, tanpura or a pair of tablas is the family's biggest single cost, and no Government file publishes prices — so Margdarshan prints none. Learn first on the institute's instrument, buy only with your guru, and budget for strings, skins and tuning as running costs."
      - id: earnings
        nav: "Earnings &amp; jobs"
        eyebrow: "Earning channels &amp; government-job reality"
        heading: "What broadcasting pays — and the government-job reality"
        parts:
          - table:
              caption: "AIR basic fee per booking by grade — AIR Mumbai's annual list of music artistes, as on 1 Jan 2020"
              head: ["Grade", "Basic fee shown"]
              rows:
                - ["<strong>Top</strong>", "₹11,000"]
                - ["<strong>A</strong>", "₹7,400"]
                - ["<strong>B-High</strong>", "₹3,000"]
                - ["<strong>B</strong>", "₹1,700"]
            source: air-mumbai
          - note: "These are the figures printed in one station's 2020 list — the latest grade-wise fee list Margdarshan could find on Prasar Bharati's site. Ask your station for the current rate before you rely on it. A grade is not a salary: bookings depend on the station, and the boards can reduce booking frequency."
          - list:
              - "<strong>Guru's Repertory grant</strong>: ₹15,000 a month."
              - "<strong>Junior / Senior Fellowship</strong>: ₹10,000 / ₹20,000 a month for 2 years."
              - "<strong>Festival engagements</strong> through the Zonal Cultural Centres' Rashtriya Sanskriti Mahotsavs (14 since November 2015)."
              - "<strong>Veteran Artists</strong>: up to ₹6,000 a month at 60+ with annual income up to ₹72,000."
              - "<strong>Prize money</strong>: SNA Yuva ₹25,000, Akademi Puraskar ₹1 lakh, Akademi Ratna ₹3 lakh."
            source: "pib-ksvy,sna-yuva,sna-awards"
          - warn: "There is <strong>no 'cultural quota'</strong> in the central sports-quota rules — DoPT's qualifying list covers games and sports only. Government income for a musician comes from open teaching posts, graded broadcasts and festival engagements, and the schemes above."
            source: dopt-2022
      - id: traps
        nav: "Red flags"
        eyebrow: "Red flags &amp; honest warnings"
        heading: "Before you pay anyone"
        parts:
          - list:
              - "<strong>Nobody can 'arrange' an AIR grade</strong> — classical grades are given only by the Central Audition Board, and its decision is final."
              - "Recordings for an audition are made <strong>at the AIR studio</strong>; a privately produced recording is not accepted."
              - "An unused B grade <strong>lapses after 5 years</strong> without an upgrade — plan the next audition early."
              - "<strong>Akademi honours are by nomination only</strong> — no one can sell you an 'SNA award application'."
              - "Gandharva Mahavidyalaya, New Delhi says it has <strong>no other branch</strong> — anyone selling admission to a 'branch' is not part of it."
            source: "air-aud,sna-yuva,gmv-prosp"
          - note: "Riyaz builds a career, but strain does not: vocalists should treat lasting hoarseness, and instrumentalists lasting wrist or finger pain, as a reason to see a doctor."
