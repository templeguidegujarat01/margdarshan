            source: fiba-chg26
          - table:
              caption: "Court, backboard, ring and ball (FIBA 2026)"
              head: ["Item", "Standard"]
              rows:
                - ["Court", "<strong>28 m × 15 m</strong>, with at least 2 m clear on every side (floor 32 m × 19 m)"]
                - ["3-point line", "Arc of radius <strong>6.75 m</strong> from the point under the basket"]
                - ["Backboard", "<strong>1,800 mm × 1,050 mm</strong>"]
                - ["Ring", "Top edge <strong>3,050 mm (± 6 mm)</strong> above the floor; inside diameter <strong>450–459 mm</strong>"]
                - ["Ball, men", "<strong>Size 7</strong>: 750–770 mm round, 580–620 g"]
                - ["Ball, women", "<strong>Size 6</strong>: 715–730 mm round, 510–550 g"]
                - ["Ball pressure", "Dropped from about <strong>1,800 mm</strong>, it must bounce back to <strong>1,035–1,085 mm</strong> (both measured to the underside of the ball); the recommended pressure is marked on the ball"]
            source: "fiba-obr26,fiba-eq26"
          - list:
              - "<strong>4 quarters of 10 minutes</strong>, 15-minute half-time, and as many <strong>5-minute overtimes</strong> as needed."
              - "A team in control must shoot within <strong>24 seconds</strong>; the shot clock is reset to <strong>14 seconds</strong> in many frontcourt situations."
              - "No more than <strong>3 seconds</strong> in the opponents' restricted area; 8 seconds to cross into the frontcourt."
              - "A player with <strong>5 fouls</strong> leaves the game; a team is in the penalty after <strong>4 team fouls in a quarter</strong>; up to <strong>12 team members</strong> may play."
            source: fiba-obr26
          - list:
              - "New in 2026: the unsportsmanlike foul is replaced by the <strong>disruptive foul</strong> and the <strong>flagrant foul</strong>. Two category-1 technical fouls, two flagrant fouls, or one of each mean <strong>game disqualification</strong>."
              - "Instant replay can now also review goaltending or interference after a foul."
            source: "fiba-chg26,fiba-obr26"
