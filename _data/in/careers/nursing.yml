    parts:
      - chips:
          - label: "NEET-UG (AIIMS & government colleges)"
            text: "Required for AIIMS and most central/state government nursing colleges; this requirement has tightened since 2024. AIIMS BSc Nursing General category cutoff is typically 500-560+ marks."
          - label: "State & private entrance exams"
            text: "Many state and private colleges still run their own separate entrance exam or admit directly on Class 12 merit — always verify your specific target college."
          - label: "Armed Forces route"
            text: "Indian Army/Navy/Air Force nursing entry via the AFMC combined entrance test, offering a prestigious government career path."
          - label: "INC approval matters"
            text: "Confirm any college is INC-approved before enrolling — non-approved degrees are not valid for government jobs, PG nursing admission, or international licensing."
      - exam_cards:
          - title: "NEET-UG"
            text: "NEET-UG is required at AIIMS and increasingly at many government nursing colleges — though not universally, so always confirm the specific college's admission route."
  - id: "fees"
    hid: "fees-heading"
    eyebrow: "Genuinely affordable at government colleges"
    heading: "Fees & scholarships"
    parts:
      - prose:
          - "Government nursing colleges are genuinely affordable, with annual fees commonly in the <strong>₹10,000-50,000</strong> range. Private colleges vary more widely, commonly <strong>₹50,000-2,50,000 per year</strong> depending on the institute and city. Choosing a cost-effective city or state for your nursing education, while still confirming INC approval, is a genuine way to improve your overall return on investment for this degree. Always confirm current fees directly on your target college's official admission page."
