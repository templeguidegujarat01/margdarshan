# Journey Blueprint — Insurance Officer / Underwriter (Public Sector AO). Printed on journey-insurance-officer.html (_includes/journey-doubts.html).
# Rules, classes and the money items / sources several careers share: _data/in/journey_common.yml.
# `money_defs` / `sources` below are used only by this career. Check: node scripts/check-journey-matrix.mjs
id: insurance-officer
v: 2
name: "Insurance Officer / Underwriter (Public Sector AO)"
search: ["insurance underwriter", "insurance officer", "insurance administrative officer", "underwriting officer", "niacl ao", "lic aao"]
page: "bcom.html"
doubts_page: "journey-insurance-officer.html"
gate: "Any Class 12 stream → any graduate or postgraduate degree with 60% (55% SC / ST / PwBD) → a public sector insurer's Administrative Officer (Scale I) exam — for example New India Assurance, age 21–30 → pass the Insurance Institute of India's non-life Licentiate during probation."
gate_source: niacl-ao25
core:
  what:
    text: "Public sector general insurers recruit officers to run their insurance work. New India Assurance, a Government of India undertaking, hires Administrative Officers (Scale I) as Generalists and as Specialists — Risk Engineers, Automobile Engineers, Legal, Accounts, Health, IT, Business Analysts, Company Secretary and Actuarial."
    source: niacl-ao25
  day:
    - "Check proposals and decide on cover and terms (underwriting)."
    - "Handle claims, documents and customers."
    - "Run branch accounts and office work."
  pay:
    - { level: "Administrative Officer (Scale I), New India Assurance 2025", value: "Basic ₹50,925 (scale to ₹96,765) · gross about ₹90,000 a month in metros", source: niacl-ao25 }
  routes:
    - { title: "Generalist AO", text: "A graduate or postgraduate degree in any discipline with 60% (55% SC / ST / PwBD). 193 of the 550 posts in 2025 were for Generalists.", source: niacl-ao25 }
    - { title: "Specialist AO", text: "Separate posts for engineers, law graduates, CA / CMA, doctors (AO Health), IT, business analysts, company secretaries and actuarial candidates, each with its own degree rule at 60%.", source: niacl-ao25 }
  cost_time:
    - { label: "Age", value: "21–30 on 1 Aug 2025", source: niacl-ao25 }
    - { label: "Probation", value: "1 year, extendable up to 1 more year", source: niacl-ao25 }
    - { label: "Service bond", value: "4 years, with two sureties for one year's gross salary", source: niacl-ao25 }
  cost_note: "The application fee is printed in the online form, not in the notice text we read, so we do not print it."
  challenges:
    - text: "You must pass the Insurance Institute of India's <strong>non-life Licentiate</strong> during probation — or face termination."
      source: niacl-ao25
    - text: "One-fourth of a question's marks is cut for every wrong answer, in both phases."
      source: niacl-ao25
    - text: "The minimum stay at your first posting is 5 years, and resigning during probation means repaying your gross salary plus ₹25,000."
      source: niacl-ao25
  not_for:
    - "You dislike paperwork and checking documents."
    - "You want to stay in your home town — first postings last at least 5 years."
    - "You cannot handle angry customers during claims."
journey:
  - stages: [c8, c9]
    title: "English, maths and reasoning"
    do:
      - text: "The AO preliminary exam is 100 marks in 3 separately timed sections, starting with English Language (30 questions, 20 minutes)."
        source: niacl-ao25
    doubts:
      - q: "What does an insurance officer do?"
        a: "Runs the insurance work of the company — Generalist officers and Specialists such as risk engineers, legal, accounts, health and actuarial officers. New India Assurance recruits them as Administrative Officers (Scale I)."
        next: "Read the Routes list above."
        source: niacl-ao25
      - q: "Is a public sector insurance job a government job?"
        a: "New India Assurance calls itself 'A Govt. of India Undertaking' in its recruitment notice — it is a public sector company, not a ministry."
        next: "Compare it with bank and SSC jobs."
        source: niacl-ao25
  - stages: [c10]
    title: "Any stream"
    do:
      - text: "Generalist AO accepts a degree in any discipline — what counts is 60% in the degree."
        source: niacl-ao25
    stream: "Any stream."
    doubts:
      - q: "Which stream do I need for an insurance officer job?"
        a: "Any. Generalist AO needs a graduate or postgraduate degree in any discipline with 60% (55% SC / ST / PwBD)."
        next: "Choose a stream you can score well in."
        source: niacl-ao25
  - stages: [c11, c12]
    title: "Pick a degree you can score 60% in"
    do:
      - text: "Plan a degree where you can reach 60% — it is the main eligibility rule."
        source: niacl-ao25
    exams:
      - { name: "CUET (UG) 2026", when: "11–31 May 2026 (bulletin schedule)", source: cuet26 }
    money: [csss]
    doubts:
      - q: "Do Class 12 marks matter for insurance AO?"
        a: "The 2025 notice sets the 60% rule on the graduate or postgraduate degree; it sets no Class 12 percentage for Generalists."
        next: "Focus on scoring well in your degree."
        source: niacl-ao25
      - q: "Which degree is best for insurance?"
        a: "Any degree for Generalist posts. Specialist posts need a matching qualification — engineering, law, CA or CMA, MBBS or other medical degrees, IT, or actuarial papers."
        next: "Choose based on the post you want."
        source: niacl-ao25
      - q: "How many officers did New India Assurance recruit in 2025?"
        a: "550 Administrative Officers (Scale I), of which 193 were Generalists."
        next: "Numbers change every year."
        source: niacl-ao25
  - stages: [ug]
    title: "During the degree: watch your percentage"
    do:
      - text: "Percentage = total marks of all semesters / years ÷ maximum marks; fractions are ignored, so 59.99% counts as below 60%."
        source: niacl-ao25
    doubts:
      - q: "Is 59.99% enough for insurance AO?"
        a: "No. Fractions are ignored, so 59.99% is treated as less than 60%."
        next: "Aim well above 60%."
        source: niacl-ao25
      - q: "Can I apply in my final year of college?"
        a: "Only if your result is declared on or before the eligibility cut-off date (1 August 2025 for the 2025 notice)."
        next: "Check the cut-off date against your result date."
        source: niacl-ao25
      - q: "Is there a specialist post for statistics or actuarial students?"
        a: "Yes. New India Assurance's 2025 notice had 5 Actuarial Specialist posts needing a degree with 60% (55% reserved) and at least four actuarial papers passed from IAI."
        next: "See the Actuary blueprint for the IAI route."
        source: niacl-ao25
  - stages: [grad]
    title: "Two phases, interview, then probation"
    do:
      - text: "Phase-I prelims → Phase-II mains (objective + 30-mark descriptive English) → interview. Online exam and interview count 75:25."
        source: niacl-ao25
      - text: "During probation you must pass the non-life Licentiate exam of the Insurance Institute of India."
        source: niacl-ao25
    doubts:
      - q: "What is the age limit for insurance AO?"
        a: "21 to 30 years on 1 August 2025 for New India Assurance's 2025 notice, with category relaxations up to a maximum of 45."
        next: "Count the cycles your age allows."
        source: niacl-ao25
      - q: "Is there negative marking in the insurance AO exam?"
        a: "Yes. One-fourth of a question's marks is deducted for each wrong answer in both prelims and mains; blank answers cost nothing."
        next: "Answer only what you are fairly sure of."
        source: niacl-ao25
      - q: "How is the final insurance AO list made?"
        a: "From the online exam and the interview in the ratio 75:25."
        next: "Prepare for the interview alongside the mains."
        source: niacl-ao25
      - q: "What is the Licentiate exam?"
        a: "The non-life Licentiate examination of the Insurance Institute of India. New officers must pass it during probation to be confirmed; failing it within the extended probation leads to termination."
        next: "Start preparing as soon as you join."
        source: niacl-ao25
      - q: "What is the insurance AO service bond?"
        a: "You undertake to serve at least 4 years including probation, backed by two sureties for one year's gross salary. Resigning during probation means repaying the gross salary received plus ₹25,000."
        next: "Read the bond terms before joining."
        source: niacl-ao25
  - stages: [work]
    title: "Coming in as a professional"
    do:
      - text: "Accounts Specialist posts take CA or CMA members with a degree at 60%."
        source: niacl-ao25
    doubts:
      - q: "I am a CA or CMA. Is there a post for me?"
        a: "Yes. Accounts Specialist AO posts need membership of ICAI or the Institute of Cost Accountants of India plus a graduate or postgraduate degree with 60% (55% SC / ST / PwBD)."
        next: "Watch the Specialist section of the next notice."
        source: niacl-ao25
board_note: "Any board and stream; the 60% rule applies to your degree."
board_source: niacl-ao25
