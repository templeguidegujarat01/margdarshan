  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Is NEET compulsory for BDS?"
            a: "Yes. NEET-UG is mandatory for admission to every BDS programme in India, government or private — it's the same exam used for MBBS, though the cutoffs and counselling process differ."
          - q: "Is BDS just a backup option if I don't get MBBS?"
            a: "Not anymore, genuinely. Three real forces have reshaped BDS into a standalone career: the cosmetic and aesthetic dentistry boom, corporate dental chains offering structured salaries without needing your own capital investment, and MDS super-specialisation opening high-earning specialist tracks. If your NEET score gives you a choice between a mediocre private MBBS seat and a good government or top private BDS seat, BDS from a strong institution is a legitimate, rewarding career in its own right."
          - q: "What is a realistic dentist salary in India?"
            a: "Fresh graduates working at a clinic or corporate dental chain commonly earn ₹2.5-6 LPA, or roughly ₹20,000-40,000 per month. Government dentist posts via state PSC recruitment typically pay ₹55,000-75,000 per month plus benefits. The real earning growth comes with private practice — established dentists are reported to earn ₹15-40+ LPA within 5-7 years, and MDS specialists commonly earn ₹25-60 LPA, though this genuinely takes time to build, not immediately."
          - q: "Should I do MDS after BDS?"
            a: "It's a strong option if you want to specialise and increase your earning ceiling — MDS in fields like Orthodontics, Oral & Maxillofacial Surgery or Prosthodontics is reported to open specialist income brackets of ₹25-60 LPA. It isn't mandatory, though — many BDS graduates build successful, high-earning private practices without pursuing MDS, particularly in growing areas like cosmetic dentistry."
          - q: "Is a private or management quota BDS seat worth the cost?"
            a: "It depends heavily on the specific seat cost and your plans. Management and NRI quota seats costing ₹50 lakh to over ₹1 crore offer genuinely poor return on investment at typical BDS-level starting salaries, unless you're planning a strong MDS specialisation from a top college or intend to practise abroad. Mid-range private seats, commonly ₹25-50 lakh total, are a more reasonable investment if the college has a solid clinical training reputation."
      - note: "Figures are indicative (2026) — confirm on the official college or authority website."
        class: "table-note mt-lg"
