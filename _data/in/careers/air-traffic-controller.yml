sections:
  - id: "quick"
    hid: "quick-heading"
    alt: true
    eyebrow: "Quick answers"
    heading: "Air Traffic Controller at a glance"
    intro: "Check whether your Class 12 background qualifies. Duration and pay are in the summary at the top of the page."
    parts:
      - subhead: "Can I apply from my stream?"
      - streams:
          - label: "Science"
            fit: "Eligible"
            tone: "y"
            icon: "science"
          - label: "Commerce"
            fit: "Not eligible"
            tone: "n"
            icon: "commerce"
          - label: "Arts / Humanities"
            fit: "Not eligible"
            tone: "n"
            icon: "arts"
      - note: "The degree must include Physics and Mathematics, so the Science stream (PCM) is the natural route."
  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What does an Air Traffic Controller do?"
    parts:
      - overview:
          points:
            - "Controllers give clearances, sequence take-offs and landings, keep aircraft separated and guide pilots through weather and emergencies."
            - "Work is split into aerodrome (tower), approach and area control, each needing its own rating."
            - "It is shift work in high-concentration conditions, with strict rest rules and regular proficiency checks."
  - id: "who"
    hid: "who-heading"
    alt: true
    eyebrow: "Fit check"
    heading: "Who should become an Air Traffic Controller"
    parts:
      - fit:
          match:
            - "Think fast, multitask and stay calm under pressure."
            - "Have clear spoken English and good spatial awareness."
            - "Want a secure central PSU career in aviation."
          mismatch:
            - "Struggle with stress or shift work."
            - "Do not have Physics and Maths in your degree."
            - "Want a creative or unstructured job."
  - id: "eligibility"
    hid: "elig-heading"
    eyebrow: "Eligibility"
    heading: "What you need, stage by stage"
    parts:
      - elig_list:
          - "Full-time <strong>3-year B.Sc with Physics and Mathematics</strong>, or a full-time <strong>B.E./B.Tech in any discipline</strong> with Physics and Mathematics in any semester."
          - "Proficiency in spoken and written English (at least 10+2 level), as the AAI notification sets."
          - "Age limit and relaxations as per the current AAI recruitment notice."
          - "Medical fitness and voice test standards set by AAI; psychoactive substance and background checks."
  - id: "roadmap"
    hid: "roadmap-heading"
    alt: true
    eyebrow: "Step-by-step"
    heading: "Your full path to becoming an Air Traffic Controller"
    parts:
      - steps:
          - title: "Class 12 PCM"
            text: "Keeps both degree routes open."
          - title: "B.Sc (Physics & Maths) or B.E./B.Tech"
            text: "Full-time, regular degree."
          - title: "AAI JE (ATC) online exam"
            text: "General and technical sections; the notification states which part decides merit."
          - title: "Voice test and verification"
            text: "Clarity of speech and English, then documents."
          - title: "Medical and checks"
            text: "Medical, psychoactive substance test, psychological assessment and background check."
          - title: "Training and licence"
            text: "AAI training, ATC licence and ratings, then posting."
  - id: "exams"
    hid: "exams-heading"
    eyebrow: "Exams & licences"
    heading: "AAI recruitment stages"
    parts:
      - chips:
          - label: "Online exam"
            text: "Computer-based test with general aptitude, English and technical (Physics & Maths) parts."
            source: "aai"
          - label: "Voice test"
            text: "Checks clear, confident speech — essential for radio communication."
            source: "aai"
          - label: "Medical and background checks"
            text: "Medical, psychoactive substance test, psychological assessment and verification."
            source: "aai"
          - label: "Licence and ratings"
            text: "After training, controllers are licensed and rated for each control unit."
  - id: "salary"
    hid: "salary-heading"
    alt: true
    eyebrow: "Official pay scale"
    heading: "Air Traffic Controller pay in India"
    intro: "AAI is a central PSU; the Junior Executive pay scale is published in its recruitment notices, with allowances on top."
    parts:
      - salary:
          - label: "Junior Executive (ATC)"
            value: "₹40,000–1,40,000"
            text: "E-1 pay scale stated in AAI notices, plus DA, HRA/perks and other allowances."
          - label: "Promotions"
            value: "Higher E-grades"
            text: "Assistant/Deputy/Joint General Manager levels with experience."
          - label: "Benefits"
            value: "PSU benefits"
            text: "Medical, leave and retirement benefits as per AAI rules."
  - id: "jobs"
    hid: "jobs-heading"
    eyebrow: "Where they work"
    heading: "Employers & growth path"
    parts:
      - chips:
          - label: "Employer"
            text: "Airports Authority of India (civil ATC across Indian airports and area control centres)"
          - label: "Growth path"
            text: "Junior Executive → Manager → Senior Manager → AGM → DGM → GM (ATM)"
          - label: "Related"
            text: "Indian Air Force and Navy run their own military ATC branches"
  - id: "proscons"
    hid: "pc-heading"
    alt: true
    eyebrow: "Honest take"
    heading: "Advantages and disadvantages"
    parts:
      - proscons:
          pros:
            - "Secure central PSU job with good pay and benefits."
            - "Critical, respected safety role."
            - "No coaching-heavy degree needed beyond B.Sc/B.Tech."
          cons:
            - "High-stress, shift-based work."
            - "Limited vacancies each cycle."
            - "Regular proficiency and medical checks."
  - hid: "related-heading"
    alt: true
    eyebrow: "Related careers"
    heading: "If you're considering Air Traffic Controller, also look at"
    parts:
      - related:
          - name: "Commercial Pilot"
            sub: "DGCA CPL & airline flying"
            href: "commercial-pilot.html"
          - name: "Aircraft Maintenance Engineer"
            sub: "DGCA-licensed engineering"
            href: "aircraft-maintenance-engineer.html"
          - name: "Electronics Engineering"
            sub: "Communication & navigation systems"
            href: "electronics.html"
          - name: "AFCAT"
            sub: "Air Force officer entry"
            href: "afcat.html"
  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Can I become an ATC with B.Sc Chemistry?"
            a: "Only if Physics and Mathematics are also subjects in your B.Sc; AAI asks for both."
          - q: "Is GATE needed for AAI ATC?"
            a: "No. AAI recruits JE (ATC) through its own online exam."
          - q: "What is the pay of an AAI Junior Executive?"
            a: "The scale is ₹40,000–1,40,000 (E-1) plus allowances, as stated in AAI notices."
          - q: "Is an engineering degree from any branch accepted?"
            a: "Yes, if Physics and Maths were part of the curriculum in any semester."
      - note: "*Pay figures are indicative unless they quote an official pay level, and rules change: confirm eligibility, dates and fees on the official websites listed under Sources before you act."
        class: "table-note mt-lg"
