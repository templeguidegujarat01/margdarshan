    lede: "Photographers typically need a high school diploma. Many take classes or earn a certificate or degree in photography, and many start as an assistant to a professional photographer. Some employers require or prefer a bachelor's in photography or photojournalism. Flying a drone commercially needs an FAA certificate."
    for: "Creative, detail-minded people who are comfortable finding clients and working irregular hours."
    soc: ["27-4021"]
    does: { text: "Photographers use their technical expertise and creativity to produce and preserve images of people, landscapes, merchandise, or other subjects.", source: ooh_qf_photographers }
    work: { text: "Many photographers are self-employed. They work in varied settings, including in studios and on location. Travel may be required. Part-time work is common, and work schedules may vary.", source: ooh_qf_photographers }
    become: { text: "Photographers typically need a high school diploma to enter the occupation. Many photographers take classes or earn a certificate or degree in photography or a related field to improve their skills.", source: ooh_qf_photographers }
