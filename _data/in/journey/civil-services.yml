# Journey Blueprint — Civil Servant (UPSC Civil Services — IAS, IPS, IFS). Printed on journey-civil-services.html (_includes/journey-doubts.html).
# Rules, classes and the money items / sources several careers share: _data/in/journey_common.yml.
# `money_defs` / `sources` below are used only by this career. Check: node scripts/check-journey-matrix.mjs
id: civil-services
name: "Civil Servant (UPSC Civil Services — IAS, IPS, IFS)"
search: ["indian administrative service", "indian police service", "indian foreign service", "ias officer", "ips officer", "civil servant"]
page: "upsc-civil-services.html"
roadmap: "roadmaps/upsc-civil-services.html"
gate: "Any graduate aged 21–32 (more for SC, ST, OBC and others) → Preliminary (screening) → Main (9 written papers) → Personality Test → service by rank and preference."
gate_source: cse26
foundation:
  - stages: [c8, c9]
    title: "Read widely and write every week"
    points:
      - text: "Prelims General Studies and the Main Essay and GS papers cover heritage, history, geography, polity, economy, environment, technology and ethics — your school Social Science and Science books are the first layer."
        source: cse26
      - text: "Read a newspaper daily and write short answers on what you read. Writing speed matters: every Main paper is a 3-hour essay-type paper."
        source: cse26
  - stages: [c10]
    title: "Any stream is fine — choose what you can score in"
    points:
      - text: "The exam asks only for a <strong>graduate degree in any subject</strong> from a recognised university. No Class 10 or 12 stream or percentage is checked."
        source: cse26
      - text: "Pick a Class 11 stream you enjoy; a degree subject you like often becomes your Optional paper later."
  - stages: [c11, c12]
    title: "Plan your language — you may write Main in it"
    points:
      - text: "You may answer every Main paper except the two qualifying language papers in <strong>any language of the Eighth Schedule</strong> (including Hindi, Gujarati, Marathi and Bengali) or in English. Prelims papers are set in Hindi and English."
        source: cse26
      - text: "Main Paper A (an Indian language) and Paper B (English) are of Matriculation standard and only need <strong>25% each</strong>; they do not count for rank."
        source: cse26
  - stages: [ug, grad]
    title: "Final-year students can apply"
    points:
      - text: "You can sit Prelims while your final degree exam is pending; proof of passing is needed only if you reach the interview."
        source: cse26
      - text: "Age <strong>21–32</strong> on 1 August of the exam year (CSE 2026); upper limit +5 years for SC/ST and +3 for OBC. Attempts: 6 (General / EWS), 9 (OBC and PwBD), unlimited for SC/ST."
        source: cse26
board_notes:
  gseb: "<strong>Gujarati</strong> is an Eighth Schedule language: you may choose it for Main Paper A and write the GS, Essay and Optional papers in it."
  cbse-gj: "You may write Main in English or in an Eighth Schedule language such as Gujarati or Hindi; Prelims is in Hindi and English."
  upmsp: "You may write Main in <strong>Hindi</strong> and pick Hindi for Paper A; Prelims papers are also set in Hindi."
  msbshse: "<strong>Marathi</strong> is an Eighth Schedule language: you may choose it for Main Paper A and write the GS, Essay and Optional papers in it."
  wb: "<strong>Bengali</strong> is an Eighth Schedule language: you may choose it for Main Paper A and write the GS, Essay and Optional papers in it."
  cbse: "You may write Main in English or any Eighth Schedule language; Prelims is in Hindi and English."
  other: "If your state language is in the Eighth Schedule, you may write Main in it; Prelims is in Hindi and English."
board_source: cse26
exam:
  name: "UPSC Civil Services Examination 2026 (Notice 05/2026-CSE)"
  body: "Union Public Service Commission"
  href: "upsc-civil-services.html"
  facts:
    - { label: "Vacancies (approx.)", value: "933, incl. 33 for PwBD", source: cse26 }
    - { label: "Prelims date", value: "24 May 2026", source: cse26 }
    - { label: "Fee", value: "₹100 Prelims + ₹200 Main · women, SC, ST, PwBD exempt", source: cse26 }
    - { label: "Age", value: "21–32 on 1 Aug 2026 (relaxations by category)", source: cse26 }
  stages:
    head: ["Stage", "Papers", "Marking", "Rule"]
    rows:
      - ["Preliminary", "GS Paper I + GS Paper II (CSAT): 200 marks each, 2 hours each, objective", "−1/3 of the question's marks per wrong answer", "Screening only; GS II needs 33%; about 12–13 times the vacancies go to Main"]
      - ["Main — written", "Essay, GS I–IV and two Optional papers (250 marks each, 1,750 in all) + qualifying Paper A (Indian language) and Paper B (English), 300 each; 3 hours per paper", "Conventional essay type", "Papers A and B need 25% each and do not count for rank"]
      - ["Personality Test", "Interview, 275 marks", "No minimum qualifying marks", "About twice the vacancies are called"]
      - ["Final merit", "Main written + interview = 2,025 marks", "—", "Ties: compulsory papers + interview, then compulsory papers, then the older candidate"]
    source: cse26
  notes:
    - text: "Services are allotted by your rank and the order of preference you give for services and posts."
      source: cse26
    - text: "This is the 2026 notice. UPSC publishes the CSE 2027 notice early in 2027 on upsc.gov.in — check age, attempts and vacancies there."
state_rules:
  - text: "Paper A (Indian language) is <strong>not compulsory</strong> for candidates from Arunachal Pradesh, Manipur, Meghalaya, Mizoram, Nagaland and Sikkim."
    source: cse26
  - text: "Selection is on one all-India rank list; the notice prints no state quota for candidates. Your state language matters through the medium you choose for Main."
    source: cse26
  - state: west-bengal
    text: "The West Bengal <strong>Student Credit Card</strong> loan covers coaching for competitive exams such as IAS, IPS and WBCS (see Money help)."
    source: wbscc
multiverse:
  - { title: "IAS, IPS, IFS and more", text: "One exam fills many central services; your rank and preference decide which.", href: "upsc-civil-services.html" }
  - { title: "State civil services", text: "Your state PSC exam (GPSC, UPPSC, MPSC, WBCS) runs on a similar pattern.", href: "state/gujarat/gpsc.html" }
  - { title: "CAPF Assistant Commandant", text: "UPSC's exam for officer posts in the central armed police forces.", href: "upsc-capf-ac.html" }
  - { title: "Coaching", text: "UPSC coaching centres near you.", href: "coaching-upsc.html" }
money: [nmmss, csss, pms-sc, upsc-fee, wbscc, mysy]

money_defs:
  - id: upsc-fee
    kind: fee
    name: "UPSC Civil Services fee exemption"
    by: "Union Public Service Commission"
    amount: "No fee at all — others pay ₹100 for Prelims and ₹200 more for Main"
    who: "Women, SC, ST and Persons with Benchmark Disability candidates."
    apply: "Choose the category in the online form on upsconline.nic.in; the exemption is automatic."
    stages: [ug, grad]
    source: cse26

sources:
  - { id: cse26, name: "UPSC — Civil Services Examination 2026, Examination Notice No. 05/2026-CSE (4 Feb 2026)", url: "https://www.upsc.gov.in/sites/default/files/Notif-CSP-26-Engl-040226.pdf", covers: "933 vacancies, Prelims 24 May 2026, age, attempts, degree, fee and exemptions, Prelims / Main / interview scheme, negative marking, Eighth Schedule media, Paper A exemptions, tie-break", checked: 2026-10-25 }
