  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What is BA Geography?"
    parts:
      - overview:
          points:
            - "BA Geography is a 3-year undergraduate degree (4 years for Honours with Research under National Education Policy (NEP) 2020) that studies the earth's physical processes — climate, landforms, rivers, soils and ecosystems — alongside human geography — population, migration, urbanisation, agriculture and economic activity."
            - "It's one of the more hands-on Arts subjects, involving fieldwork, mapwork and increasingly, GIS and remote-sensing tools alongside traditional classroom study."
            - "It's offered widely across Indian universities."
          more:
            - "Delhi University colleges — <strong>Hindu College, Delhi College of Arts and Commerce and Miranda House</strong> — are among the strong destinations, alongside Jawaharlal Nehru University's undergraduate programmes, Presidency University Kolkata, and Banaras Hindu University, under the University Grants Commission (UGC) framework."
  - id: "who"
    hid: "who-heading"
    alt: true
    eyebrow: "Fit check"
    heading: "Who should choose BA Geography"
    parts:
      - fit:
          match:
            - "Enjoy maps, spatial thinking, and understanding how physical and human systems interact."
            - "Are considering UPSC, urban planning, environmental work, disaster management or GIS-based careers."
            - "Don't mind a mix of essay writing, mapwork and some fieldwork, rather than pure theory."
          mismatch:
            - "Dislike both essay writing and quantitative/mapwork elements — Geography needs some comfort with both."
            - "Want a degree with a fixed, direct pipeline into campus placements straight after graduation."
            - "Are not open to eventually adding a GIS, remote sensing or planning certification — without it, options stay narrower."
  - id: "eligibility"
    hid: "elig-heading"
    eyebrow: "Eligibility"
    heading: "Who can apply for BA Geography"
    parts:
      - elig_list:
          - "Class 12 pass (10+2) from a recognised board, typically <strong>45-50% aggregate</strong> for General/EWS/OBC and slightly relaxed for SC/ST/PwD categories, varying by university."
          - "Open to students from any stream — Arts, Commerce or Science — since no specific Class 12 subject is compulsory."
          - "Having studied Geography at Class 11-12 helps with familiarity, and some Science-stream students also carry over useful map and diagram skills."
