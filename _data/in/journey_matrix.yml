    state: west-bengal
    name: "West Bengal Student Credit Card (WBSCC)"
    by: "Government of West Bengal"
    amount: "Loan up to ₹10 lakh at 4% simple interest a year; 1% interest concession if the interest is fully serviced during the study period"
    who: "Students from West Bengal aged 40 or under when applying — school (Class X onward), UG, PG, professional degree courses in India or abroad, and coaching for competitive exams such as Engineering, Medical, Law, IAS, IPS and WBCS. The state's scheme page asks for 10 years' residence in West Bengal and a co-borrower (usually a parent)."
    apply: "On wbscc.wb.gov.in. Repayment runs up to 15 years, including the moratorium (course duration + 1 year); no margin money up to ₹4 lakh."
