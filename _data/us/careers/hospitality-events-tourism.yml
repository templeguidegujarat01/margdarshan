# Hospitality, Events, & Tourism careers (USA Master Plan Phase 8). Schema: comment at the top of _includes/us-career-overview.html.
# Every fact is copied from the page its `source` names, opened 2026-10-21: BLS Occupational Outlook Handbook (pay May
# 2025, jobs 2025, outlook 2025–35; pages last modified 27 Aug or 14 Sep 2026), the DOL RAPIDS spreadsheet, the
# American Culinary Federation and the state agencies named below (_data/us/sources.yml).
# Cooks have their own BLS profile (2.7 million jobs); here they are the first rungs of the chef route, with the cook
# apprenticeship terms. Barbers and cosmetologists are NOT in this cluster: Advance CTE's crosswalk puts them only in
# Healthcare & Human Services (Personal Care Services), so their page is in healthcare-human-services.yml.
# Batch notes: docs/us-edition/PHASE-8-ARTS-HOSPITALITY.md.
checked: 2026-10-21
review_by: 2027-04-21
list:

  # 344,300 jobs (crosswalk: Hospitality 1)
  - slug: food-service-manager
    short: "Food Service Manager"
    title: "Food service manager: years in restaurant jobs, or a hospitality or culinary management degree"
    eyebrow: "Hospitality, Events, & Tourism · Culinary & Food Services"
    lede: "Food service managers typically need a high school diploma and several years of experience as a cook, waiter or waitress, or supervisor. Upscale restaurants and hotels may prefer a postsecondary degree, and some chains recruit management trainees from college hospitality programs."
    for: "Calm organizers who like people and can handle busy evenings, weekends and unhappy customers."
    soc: ["11-9051"]
    does: { text: "Food service managers are responsible for the daily operation of restaurants or other establishments that prepare and serve food and beverages.", source: ooh_qf_foodmgr }
    work: { text: "Food service managers work in restaurants, hotels, school cafeterias, and other establishments where food is prepared and served. They often work evenings, weekends, and holidays. The work is often hectic, and dealing with dissatisfied customers may be stressful.", source: ooh_qf_foodmgr }
    become: { text: "Food service managers typically need a high school diploma and several years of work experience in the food service industry. Some receive additional training at community colleges, technical or vocational schools, culinary schools, or 4-year colleges.", source: ooh_qf_foodmgr }
    metrics: { pay: 69390, pay_hour: "33.36", pay_by: "Food service managers", jobs: 344300, outlook: 6, outlook_words: "Faster than average", change: 19900, entry: "High school diploma or equivalent", experience: "Less than 5 years", training: "Short-term on-the-job training", source: ooh_qf_foodmgr }
    license_text: "Not required"
    routes:
      - id: experience
        title: "Work up from cook, server or supervisor"
        tag: "Typical"
        who: "Most food service managers spend years in the industry before they are promoted."
        steps:
          - { tag: "Start", title: "High school diploma", text: "", kind: start, source: ooh_foodmgr }
          - { tag: "Years", title: "Cook, waiter or waitress, or food preparation supervisor", text: "", kind: stage, source: ooh_foodmgr }
          - { tag: "At least 1 month", title: "On-the-job training as a manager", text: "Food preparation, sanitation, security, company policies, personnel management and recordkeeping.", kind: stage, source: ooh_foodmgr }
          - { tag: "Goal", title: "Food service manager", text: "", kind: goal, source: ooh_qf_foodmgr }
      - id: degree
        title: "Associate's or bachelor's in restaurant and hospitality management"
        tag: "Management trainee"
        who: "Programs teach nutrition, sanitation and food preparation plus accounting, business law and management, often with internships."
        steps:
          - { tag: "Start", title: "High school diploma", text: "", kind: start, source: ooh_foodmgr }
          - { tag: "2 or 4 years", title: "Degree in restaurant and hospitality management, institutional food service management or business", text: "", kind: stage, source: ooh_foodmgr }
          - { tag: "Hired as", title: "Management trainee at a chain, hotel or food service company", text: "", kind: stage, source: ooh_foodmgr }
          - { tag: "Goal", title: "Food service manager", text: "", kind: goal, source: ooh_qf_foodmgr }
      - id: apprenticeship
        title: "Registered Apprenticeship"
        tag: "Earn while you learn"
        who: "DOL lists Manager, Food Service (also titled Restaurant Manager) as an apprenticeable occupation."
        steps:
          - { tag: "Start", title: "High school diploma", text: "", kind: start, source: ooh_foodmgr }
          - { tag: "Find a program", title: "A Registered Apprenticeship", text: "Validated by the U.S. Department of Labor or a State Apprenticeship Agency.", kind: stage, source: dol_rap }
          - { tag: "6,000 hours", title: "Manager, Food Service (RAPIDS 0593)", text: "Time-based minimum term: <strong>6,000 hours</strong>; the Restaurant Manager version is 4,000 hours (competency-based).", kind: stage, source: dol_occupations }
          - { tag: "Goal", title: "Food service manager", text: "", kind: goal, source: ooh_qf_foodmgr }
    certs:
      - { name: "Food Protection Manager Certification (FPMC)", who: "Food safety exam providers", kind: "Voluntary", text: "Not always required; earned by passing a food safety exam.", source: ooh_foodmgr }

  # 220,300 jobs (crosswalk: Hospitality 1, Management & Entrepreneurship 1 → tie, placed by the field's main industry)
  - slug: chef-head-cook
    short: "Chef & Head Cook"
    title: "Chef or head cook: years as a line cook, culinary school, or a cook apprenticeship"
    eyebrow: "Hospitality, Events, & Tourism · Culinary & Food Services"
    lede: "Chefs and head cooks typically need a high school diploma and years of kitchen experience, often starting as line cooks. Some attend a culinary program at a community college, technical school, culinary arts school or 4-year college; others learn through apprenticeships, some registered with the U.S. Department of Labor."
    for: "Creative, fast, steady cooks who like leading a team through early mornings, late nights and weekends."
    soc: ["35-1011"]
    does: { text: "Chefs and head cooks oversee the daily food preparation at restaurants and other places where food is served.", source: ooh_qf_chefs }
    work: { text: "Chefs and head cooks work in restaurants, hotels, and other food service establishments. They often work early mornings, late evenings, weekends, and holidays. The work can be hectic and fast-paced. Most chefs and head cooks work full time.", source: ooh_qf_chefs }
    become: { text: "Chefs and head cooks typically need a high school diploma and work experience to enter the occupation. Some attend a culinary program at a community college, technical school, culinary arts school, or 4-year college. Others learn through apprenticeship programs.", source: ooh_qf_chefs }
    metrics: { pay: 62470, pay_hour: "30.03", pay_by: "Chefs and head cooks", jobs: 220300, outlook: 7, outlook_words: "Much faster than average", change: 14400, entry: "High school diploma or equivalent", experience: "5 years or more", training: "None", source: ooh_qf_chefs }
    license_text: "Food handler card (some states, cities)"
    routes:
      - id: kitchen
        title: "Kitchen helper → line cook → chef"
        tag: "Typical"
        who: "Many spend years in kitchens before they have enough experience to be promoted; some train in mentorship programs under an experienced chef."
        steps:
          - { tag: "Start", title: "Kitchen helper or food preparation worker", text: "Teaches basic skills.", kind: start, source: ooh_cooks }
          - { tag: "Years", title: "Line cook, learning from the chefs you work for", text: "", kind: stage, source: ooh_chefs }
          - { tag: "Some places", title: "Food handler's certification", text: "Some states and localities require it.", kind: licence, source: ooh_chefs }
          - { tag: "Goal", title: "Chef or head cook", text: "", kind: goal, source: ooh_qf_chefs }
      - id: culinary-school
        title: "Culinary program (a few months to 4 years)"
        tag: "School"
        who: "Students spend most of their time in kitchens; most programs require an internship or apprenticeship in a commercial kitchen."
        steps:
          - { tag: "Start", title: "High school diploma (may be required)", text: "", kind: start, source: ooh_cooks }
          - { tag: "Months to 2 years (or a 4-year degree)", title: "Culinary program", text: "Menu planning, food sanitation, purchasing and inventory.", kind: stage, source: ooh_chefs }
          - { tag: "Then", title: "Entry-level cook, then years of experience", text: "", kind: stage, source: ooh_cooks }
          - { tag: "Goal", title: "Chef or head cook", text: "", kind: goal, source: ooh_qf_chefs }
      - id: apprenticeship
        title: "Registered Apprenticeship: cook, then chief cook"
        tag: "Earn while you learn"
        who: "Apprenticeship programs for cooks typically require age 17 and a high school diploma; apprentices learn sanitation, knife skills and equipment, then cook under a chef."
        steps:
          - { tag: "Start", title: "Age 17 + high school diploma", text: "", kind: start, source: ooh_cooks }
          - { tag: "4,000 hours", title: "Cook (Hotel & Restaurant), RAPIDS 0663", text: "Time-based minimum term: <strong>4,000 hours</strong>.", kind: stage, source: dol_occupations }
          - { tag: "2,000 hours", title: "Cook, Chief (Chefs and Head Cooks), RAPIDS 1053", text: "Time-based minimum term: <strong>2,000 hours</strong>.", kind: stage, source: dol_occupations }
          - { tag: "Goal", title: "Chef or head cook", text: "", kind: goal, source: ooh_qf_chefs }
    certs:
      - { name: "Certified Culinarian (CC)", who: "American Culinary Federation (ACF)", kind: "Voluntary", text: "A high school diploma with two years of entry-level experience, or an associate's in culinary arts (no experience), or an ACFEF apprenticeship; 30-hour courses in nutrition, food safety and supervisory management; written and practical exams. Renewed every five years.", source: acf_cc }
      - { name: "Food handler's certification", who: "Some states and localities", kind: "Employer may require", text: "Contact your state or local licensing board.", source: ooh_chefs }

  # 172,100 jobs (crosswalk: Hospitality 1)
  - slug: event-planner
    short: "Meeting, Convention & Event Planner"
    title: "Event planner: bachelor's degree (meeting and event management, business, communications) plus event experience"
    eyebrow: "Hospitality, Events, & Tourism · Conferences & Events"
    lede: "Meeting, convention and event planners typically need a bachelor's degree. Some colleges offer meeting and event management programs; business, communications and social science are also common. Work at hotels, convention centers or convention bureaus, or running university or volunteer events, helps."
    for: "Organized communicators who like detail, travel and the rush of a live event."
    soc: ["13-1121"]
    does: { text: "Meeting, convention, and event planners arrange all aspects of events and professional gatherings.", source: ooh_qf_events }
    work: { text: "Meeting, convention, and event planners work in their offices and onsite at hotels or conference centers. They often travel to attend events and visit meeting sites. During meetings or conventions, planners may work many more hours than usual.", source: ooh_qf_events }
    become: { text: "Meeting, convention, and event planners typically need a bachelor’s degree. Some experience related to event planning may be helpful.", source: ooh_qf_events }
    metrics: { pay: 61160, pay_hour: "29.41", pay_by: "Meeting, convention, and event planners", jobs: 172100, outlook: 6, outlook_words: "Faster than average", change: 10000, entry: "Bachelor's degree", training: "None", source: ooh_qf_events }
    license_text: "Not required"
    routes:
      - id: degree
        title: "Bachelor's + event experience"
        tag: "Typical"
        who: "Shadowing professionals and coordinating university or volunteer events also count as useful experience."
        steps:
          - { tag: "Start", title: "High school diploma", text: "", kind: start, source: ooh_events }
          - { tag: "About 4 years", title: "Bachelor's in meeting and event management, business, communications or social science", text: "", kind: stage, source: ooh_events }
          - { tag: "Experience", title: "Jobs at hotels, convention centers or convention bureaus", text: "", kind: stage, source: ooh_events }
          - { tag: "Goal", title: "Meeting, convention or event planner", text: "", kind: goal, source: ooh_qf_events }
    certs:
      - { name: "Meeting and convention planner certifications", who: "Industry organizations", kind: "Voluntary", text: "Not required, but they demonstrate specific knowledge or professional expertise.", source: ooh_events }

  # 61,500 jobs (crosswalk: Hospitality 1)
  - slug: travel-agent
    short: "Travel Agent"
    title: "Travel agent: high school diploma, on-the-job training; some states register sellers of travel"
    eyebrow: "Hospitality, Events, & Tourism · Travel & Leisure"
    lede: "A high school diploma is typically required, but employers may prefer sales experience, travel courses or a degree. Employers usually train new agents for at least a month on reservation systems. Some states require travel businesses to register, such as California and Florida's seller of travel laws."
    for: "Friendly salespeople who know destinations well and are comfortable on the phone and computer all day."
    soc: ["41-3041"]
    does: { text: "Travel agents sell transportation, lodging, and entertainment activities to individuals and groups planning trips.", source: ooh_qf_travel }
    work: { text: "Travel agents typically spend much of their day sitting, working on the phone and on the computer. Most travel agents work for travel agencies; many are self-employed.", source: ooh_qf_travel }
    become: { text: "A high school diploma typically is required for someone to become a travel agent. However, employers may prefer to hire candidates who have sales experience or relevant certification or education. Good communication and customer service skills are essential.", source: ooh_qf_travel }
    metrics: { pay: 50160, pay_hour: "24.11", pay_by: "Travel agents", jobs: 61500, outlook: 0, outlook_words: "Little or no change", change: 100, entry: "High school diploma or equivalent", training: "Moderate-term on-the-job training", source: ooh_qf_travel }
    license_text: "Some states (seller of travel)"
    routes:
      - id: agency
        title: "Hired by an agency, trained on the job"
        tag: "Typical"
        who: "Some agencies prefer agents who have travelled widely or who focus on particular destinations or travellers."
        steps:
          - { tag: "Start", title: "High school diploma", text: "", kind: start, source: ooh_travel }
          - { tag: "Optional", title: "Travel courses or a certificate", text: "Community colleges, vocational schools and industry associations; some 4-year colleges offer travel and tourism degrees.", kind: stage, source: ooh_travel }
          - { tag: "At least 1 month", title: "On-the-job training", text: "For example, a reservation system used by several airlines.", kind: stage, source: ooh_travel }
          - { tag: "Goal", title: "Travel agent", text: "", kind: goal, source: ooh_qf_travel }
      - id: own-business
        title: "Your own travel business"
        tag: "Self-employed"
        who: "Some states require travel agents to have a business license, to register with the state or to meet other conditions."
        steps:
          - { tag: "Start", title: "Experience as a travel agent", text: "", kind: start, source: ooh_travel }
          - { tag: "Before you sell", title: "State seller of travel registration, where required", text: "See California and Florida below.", kind: licence, source: ooh_travel }
          - { tag: "Goal", title: "Self-employed travel agent", text: "", kind: goal, source: ooh_qf_travel }
    certs:
      - { name: "Professional travel credentials", who: "Industry organizations", kind: "Voluntary", text: "Not required; some travel agents choose to earn them.", source: ooh_travel }
    states_note: "Requirements vary by state; contact the state licensing agency. Two states' seller of travel laws, from their own agencies:"
    states_source: ooh_travel
    states:
      - { place: "California", body: "Attorney General, Seller of Travel Program", rule: "All sellers of travel must <strong>register before operating</strong> in California: file at least 10 days before doing business, <strong>$100 a year per business location</strong>, meet trust account or bond rules, and (for most California-based sellers) join the Travel Consumer Restitution Fund.", sources: [ca_oag_sot] }
      - { place: "Florida", body: "Department of Agriculture and Consumer Services (FDACS)", rule: "Sellers or promoters of travel-related services must <strong>register every year</strong> unless exempt, with a performance bond of up to $25,000 ($50,000 if they sell vacation certificates).", sources: [fl_fdacs_sot] }

  # 54,800 jobs (crosswalk: Hospitality 1)
  - slug: lodging-manager
    short: "Lodging (Hotel) Manager"
    title: "Hotel manager: front-desk experience, a hotel management certificate or associate's, or a hospitality bachelor's"
    eyebrow: "Hospitality, Events, & Tourism · Accommodations"
    lede: "Lodging managers take one of three paths: a high school diploma plus several years in a lodging facility; an associate's degree or certificate in hotel management; or a bachelor's in hospitality or hotel management, which full-service hotels may prefer."
    for: "Service-minded leaders who stay calm when a building runs around the clock."
    soc: ["11-9081"]
    does: { text: "Lodging managers ensure that guests have a pleasant experience at an accommodations facility. They also plan, direct, or coordinate activities to ensure that the facility is efficient and profitable.", source: ooh_qf_lodging }
    work: { text: "Most lodging managers work full time. Work schedules may vary and often include evenings, weekends, and holidays. Because these facilities are open around the clock, some managers are on call 24 hours a day.", source: ooh_qf_lodging }
    become: { text: "To enter the occupation, lodging managers typically take one of three paths: a high school diploma combined with several years of experience working in a lodging facility, a bachelor’s degree in hospitality or hotel management, or an associate’s degree or certificate in hotel management.", source: ooh_qf_lodging }
    metrics: { pay: 69250, pay_hour: "33.29", pay_by: "Lodging managers", jobs: 54800, outlook: 4, outlook_words: "As fast as average", change: 2100, entry: "High school diploma or equivalent", experience: "Less than 5 years", training: "None", source: ooh_qf_lodging }
    license_text: "Not required"
    routes:
      - id: experience
        title: "Front desk or guest services → assistant manager"
        tag: "Experience"
        who: "Employees who show leadership potential and have several years of experience may qualify for assistant manager positions."
        steps:
          - { tag: "Start", title: "High school diploma", text: "", kind: start, source: ooh_lodging }
          - { tag: "Several years", title: "Guest services, front desk or related jobs", text: "", kind: stage, source: ooh_lodging }
          - { tag: "Promotion", title: "Assistant manager", text: "", kind: stage, source: ooh_lodging }
          - { tag: "Goal", title: "Lodging manager", text: "Large chains may offer moves to managing several facilities in a region.", kind: goal, source: ooh_qf_lodging }
      - id: associate
        title: "Associate's or certificate in hotel management"
        tag: "Limited-service hotels"
        who: "Technical institutes and vocational or trade schools also offer courses recognized by the industry."
        steps:
          - { tag: "Start", title: "High school diploma", text: "", kind: start, source: ooh_lodging }
          - { tag: "Up to 2 years", title: "Associate's or certificate in hotel, restaurant or hospitality management", text: "", kind: stage, source: ooh_lodging }
          - { tag: "Goal", title: "Manager of a limited-service facility", text: "", kind: goal, source: ooh_qf_lodging }
      - id: bachelor
        title: "Bachelor's in hospitality or hotel management"
        tag: "Full-service hotels"
        who: "Employers may seek a degree from an accredited hospitality management program; graduates often gain experience through internships or as management trainees."
        steps:
          - { tag: "Start", title: "High school diploma", text: "", kind: start, source: ooh_lodging }
          - { tag: "About 4 years", title: "Bachelor's in hospitality or hotel management", text: "Hotel administration, housekeeping, food service management, maintenance, accounting, marketing and hospitality software.", kind: stage, source: ooh_lodging }
          - { tag: "Experience", title: "Internship or management trainee", text: "", kind: stage, source: ooh_lodging }
          - { tag: "Goal", title: "Lodging manager", text: "", kind: goal, source: ooh_qf_lodging }
    certs:
      - { name: "Professional certification", who: "Industry organizations", kind: "Voluntary", text: "May be beneficial; may require exams and industry work experience.", source: ooh_lodging }
