lede: "In Alaska, the Alaska Bar Association, Law Examiners Committee handles bar admission for lawyers, the Alaska State Medical Board licenses physicians, the Alaska Board of Public Accountancy licenses CPAs and the Alaska Board of Nursing licenses registered nurses."

boards:
