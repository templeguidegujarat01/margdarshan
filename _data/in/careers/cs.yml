  - id: "faq"
    hid: "faq-heading"
    alt: true
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Do I need a law or commerce background to become a CS?"
            a: "No. CSEET, the entry point into the CS course, is open to students from any stream after Class 12. A commerce background helps with accounting-related papers, but plenty of successful CS professionals come from Science or Arts."
          - q: "Is a Company Secretary just an administrative role?"
            a: "No. A CS advises the board of directors on legal and regulatory matters, signs off on statutory filings, and is legally accountable for a company's compliance — closer to a governance and legal advisory role than an administrative one."
          - q: "Does a CS earn less than a CA?"
            a: "Starting salaries are often somewhat lower for CS than CA, but the gap narrows with experience. Senior CS professionals in listed companies, especially those holding the Company Secretary and Compliance Officer (KMP) role, can earn salaries comparable to or exceeding many CA roles."
          - q: "Can I do CS along with a college degree?"
            a: "Yes. Many students pursue CS Executive and Professional alongside a regular B.Com, Bachelor of Business Administration (BBA) or LLB degree, since ICSI's programme is largely self-study with periodic training requirements rather than full-time attendance."
          - q: "What is the difference between an in-house CS and a Practising Company Secretary (PCS)?"
            a: "An in-house CS is employed by a single company to handle its compliance and governance. A Practising Company Secretary holds a Certificate of Practice from ICSI and offers advisory, certification and compliance services to multiple client companies, similar to a CA in independent practice."
