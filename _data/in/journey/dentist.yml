state_uses: [board, med, scholarship, psc]
state_rules:
  - state: uttar-pradesh
    text: "UP government dental colleges need a <strong>UP domicile</strong>; private colleges are open to other states. Government BDS students sign a <strong>2-year, ₹10 lakh service bond</strong>. Counselling fee ₹2,000; security money ₹30,000 (government) or ₹2,00,000 (private)."
    source: up-neet
  - state: maharashtra
    text: "The State CET Cell fills BDS seats in government, aided, municipal and private colleges on NEET (UG) merit. Register with it separately even if you registered with MCC."
    source: mh-neet3
  - state: gujarat
    text: "ACPUGMEC's state process (medical and dental) is for students who passed <strong>SSC and HSC from Gujarat</strong> and are domiciled in or born in Gujarat; merit is on the NEET All India Rank. ₹1,000 PIN + ₹10,000 refundable deposit."
    source: acpug-reg
  - state: west-bengal
    text: "State-quota seats need a domicile certificate: 10 years' residence as on 31 Dec 2025 with Class 10 and 12 passed in West Bengal, or a parent who is a permanent resident living there for those 10 years."
    source: wb-neet
  - state: karnataka
    text: "Medical, dental and AYUSH seats use your NEET rank, but you must <strong>also register with KEA</strong> for Karnataka's counselling."
    source: kcet-ib
    href: "state/karnataka/kcet.html"
  - state: kerala
    text: "Kerala's KEAM process ranks MBBS / BDS on NEET (UG) and asks for <strong>50% in Physics, Chemistry and Biology</strong> (40% for SC / ST / SEBC / PwD)."
    source: ke-noti
    href: "state/kerala/keam.html"
  - text: "MCC counsels the 15% All India Quota and central, ESIC, central-university and deemed-university seats; every state counsels its own state-quota seats."
    source: neet-ib
