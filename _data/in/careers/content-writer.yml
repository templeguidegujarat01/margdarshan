    parts:
      - overview:
          points:
            - "A Content Writer produces written material designed to inform, engage or educate a reader — blog posts, articles, website pages, product descriptions, email newsletters, and increasingly, content optimised to perform well in search engines (SEO content)."
            - "The role sits at the intersection of writing, research and a basic understanding of how the content will actually be used — whether that's ranking on Google, explaining a product, or building a brand's voice."
            - "Unlike engineering or medicine, there's no single licensing exam or mandatory degree — graduates from Bachelor of Journalism and Mass Communication (BJMC), Bachelor of Arts (BA) English, BA Philosophy, Commerce or Science backgrounds all work as content writers."
          more:
            - "What consistently matters is the ability to write clearly, research accurately, and adapt tone for different audiences."
