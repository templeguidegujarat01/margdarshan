# Journey Blueprint — Cost Accountant (ICMAI: CMA Foundation → Intermediate → Final → ACMA). Printed on journey-cost-accountant.html (_includes/journey-doubts.html).
# Rules, classes and the money items / sources several careers share: _data/in/journey_common.yml.
# `money_defs` / `sources` below are used only by this career. Check: node scripts/check-journey-matrix.mjs
id: cost-accountant
v: 2
name: "Cost Accountant (ICMAI: CMA Foundation → Intermediate → Final)"
search: ["cost accountant", "cma", "cma india", "cost and management accountant", "icmai", "icwa", "cost auditor"]
page: "cma.html"
roadmap: "roadmaps/cma.html"
doubts_page: "journey-cost-accountant.html"
gate: "Class 12 (any stream) → CMA Foundation → CMA Intermediate (or enter directly after any graduation except Fine Arts) → 15 months' practical training + skills training → CMA Final → Associate member (ACMA) after 3 years' practical experience."
gate_source: [icmai-adm, cma-pros]
core:
  what:
    text: "Cost and Management Accountants work out what products and services really cost, plan budgets and audit cost records. The profession is regulated by the Institute of Cost Accountants of India (ICMAI), set up in 1959 under the Cost and Works Accountants Act, 1959."
    source: cma-pros
  day:
    - "Build and check product and service cost sheets."
    - "Prepare budgets, variance reports and pricing advice."
    - "Do cost audits and internal audits, and advise on GST and tax records."
  pay:
    - { level: "CMA Final qualified, practical-training stipend from a company (Category X city)", value: "₹42,000 → ₹45,000 → ₹50,000 a month in years 1–3", source: cma-pros }
  pay_note: "ICMAI publishes trainee stipends only; salaries after qualifying are not officially published, so they are not printed."
  routes:
    - { title: "After Class 12 → Foundation", text: "Class 10 and Class 12 (or the National Diploma in Commerce); students awaiting the Class 12 result may take provisional admission.", source: icmai-adm }
    - { title: "Graduates → straight to Intermediate", text: "Graduation in any discipline other than Fine Arts, or 10+2 with ICSI's Foundation, lets you register directly for Intermediate.", source: icmai-adm }
    - { title: "Final → membership", text: "Pass Final, then become an Associate member after at least 3 years of practical experience in costing or industrial accounting — the 15-month practical training counts towards it.", source: cma-pros }
  cost_time:
    - { label: "Course fees (inland)", value: "Foundation ₹6,000 · Intermediate ₹23,100 · Final ₹25,000 (plus GST)", source: cma-pros }
    - { label: "Exam fees", value: "Foundation ₹1,500 · Intermediate ₹1,500 per group / ₹2,800 both · Final ₹1,800 per group / ₹3,200 both", source: cma-pros }
    - { label: "Training", value: "15 months' practical training + 120 h (Intermediate) and 80 h (Final) skills training + IOTP", source: cma-pros }
  cost_note: "Coaching-centre fees outside ICMAI are not printed."
  challenges:
    - text: "Every paper needs at least 40%, and each group needs 50% in aggregate."
      source: cma-pros
    - text: "You cannot sit the Final exam until you complete 15 months of practical training."
      source: cma-pros
    - text: "Membership needs 3 years of relevant practical experience in addition to passing Final."
      source: cma-pros
  not_for:
    - "You dislike numbers, spreadsheets and detail."
    - "You want a course with no internship or training — CMA has 15 months of it."
    - "You give up after one failed attempt — exemptions and carry-forward exist because many students resit."
journey:
  - stages: [c8, c9]
    title: "Get comfortable with numbers"
    do:
      - text: "CMA Foundation has four papers: Business Laws and Communication, Financial and Cost Accounting, Business Mathematics and Statistics, and Business Economics and Management."
        source: cma-pros
    doubts:
      - q: "What does a cost accountant do?"
        a: "Cost and Management Accountants work out what products and services cost, plan budgets, run cost audits and advise managers. ICMAI, set up under the Cost and Works Accountants Act 1959, regulates the profession."
        next: "Read the Routes list above."
        source: cma-pros
      - q: "Is CMA the same as CA?"
        a: "No. CMA is run by the Institute of Cost Accountants of India and focuses on cost and management accounting; CA is run by a different institute (ICAI)."
        next: "Compare both on our CA vs CMA vs CS page."
        source: [cma-pros, icmai-adm]
  - stages: [c10]
    title: "Any stream works"
    do:
      - text: "Foundation needs Class 10 and Class 12 from a recognised board — no stream is fixed."
        source: icmai-adm
    stream: "Any stream; Commerce with Maths makes Foundation easier."
    doubts:
      - q: "Can a Science or Arts student do CMA?"
        a: "Yes. ICMAI's Foundation rule asks for Class 10 and Class 12 from a recognised board without fixing a stream."
        next: "Pick the stream you enjoy; brush up accounts later."
        source: icmai-adm
  - stages: [c11, c12]
    title: "Register for Foundation"
    do:
      - text: "Register before 31 January for the June exam or before 31 July for the December exam; admission is open all year."
        source: icmai-adm
      - text: "You can take provisional admission while waiting for your Class 12 result."
        source: icmai-adm
    doubts:
      - q: "When should I register for CMA Foundation?"
        a: "Registration is open all year, but apply before 31 January to sit the June term exam and before 31 July for the December term."
        next: "Register early in Class 12 or right after it."
        source: icmai-adm
      - q: "Can I join CMA Foundation before my Class 12 result?"
        a: "Yes. Students waiting for the result can apply for provisional admission."
        next: "Submit your Class 12 marks once they arrive."
        source: icmai-adm
      - q: "What is the pass mark in CMA Foundation?"
        a: "At least 40% in each paper and 50% in aggregate. Exemptions and carry-forward of marks do not apply at Foundation."
        next: "Prepare all four papers evenly."
        source: cma-pros
  - stages: [ug]
    title: "Intermediate alongside college"
    do:
      - text: "Graduates (except Fine Arts) can skip Foundation and register directly for Intermediate."
        source: icmai-adm
      - text: "Practical training of 15 months can start from Intermediate level; around 15,000 companies are associated with ICMAI for it."
        source: cma-pros
    money: [cma-stipend, cma-sch]
    doubts:
      - q: "Can I skip CMA Foundation after graduation?"
        a: "Yes. Graduation in any discipline other than Fine Arts lets you register directly for Intermediate; ICSI Foundation with 10+2 also qualifies."
        next: "Register for Intermediate with your degree certificate."
        source: icmai-adm
      - q: "Do CMA trainees get a stipend?"
        a: "Yes. Under a practising Cost Accountant: ₹2,000, ₹3,000 and ₹4,000 a month in years 1–3. In companies (from 1 August 2024): Intermediate students ₹15,000–₹25,000 a month and Final students ₹20,000–₹30,000 a month, depending on the city category and year."
        next: "Look for training at a company in a larger city for a higher stipend."
        source: cma-pros
      - q: "What if I fail one paper but score well in another?"
        a: "If you fail a group but score 60% or more in a paper, you are exempted in that paper for the next three exam terms (counted as 50 for the aggregate). With 40% in all other papers too, the actual marks carry forward."
        next: "Aim for 60% in your strongest papers."
        source: cma-pros
      - q: "Does ICMAI give scholarships?"
        a: "ICMAI lists a fee-waiver scheme for meritorious Foundation students, a waiver scholarship for economically challenged-cum-meritorious Intermediate students, a refund scheme for differently abled students and a national scholarship for graduate and post-graduate rank holders."
        next: "Check the scheme papers on icmai.in when you register."
        source: cma-pros
  - stages: [grad]
    title: "Final, training and IOTP"
    do:
      - text: "Before sitting the Final exam (both or remaining group) you must finish 15 months' practical training, 80 hours of skills training and the Industry Oriented Training Programme."
        source: cma-pros
    doubts:
      - q: "Who can enrol for CMA Final?"
        a: "Students who have qualified both groups of CMA Intermediate."
        next: "Finish both Intermediate groups first."
        source: cma-pros
      - q: "Can I write CMA Final without practical training?"
        a: "No. You need 15 months of practical training before appearing in both or the remaining group of the Final exam."
        next: "Start training during Intermediate to save time."
        source: cma-pros
      - q: "How much does a CMA Final-qualified trainee earn?"
        a: "ICMAI's company stipend table (from 1 August 2024) gives Final-qualified trainees ₹37,000 to ₹50,000 a month, depending on the city category and year."
        next: "Read the Pay list above for the Category X figures."
        source: cma-pros
  - stages: [work]
    title: "Membership"
    do:
      - text: "Associate membership needs a Final pass and at least 3 years of practical experience in costing or industrial accounting, gained before or after the Final."
        source: cma-pros
    doubts:
      - q: "When do I become a member of ICMAI?"
        a: "After passing Final and completing at least 3 years of practical experience in costing or industrial accounting in a responsible position — the 15-month practical training period counts towards it."
        next: "Keep your training and job certificates."
        source: cma-pros
      - q: "Can engineers get exemptions in CMA?"
        a: "Yes. ICMAI grants qualification-based subject exemptions to engineering graduates under Syllabus 2022, at ₹3,000 per subject; qualified Company Secretaries get exemptions at ₹1,000 per subject."
        next: "Apply online at least 60 days before the exam."
        source: cma-pros
board_note: "Any board and any stream. Foundation needs Class 10 and Class 12 passed (provisional admission while the result is awaited)."
board_source: icmai-adm
