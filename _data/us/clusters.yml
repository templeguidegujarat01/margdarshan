  - slug: construction
    name: "Construction"
    phase: 6
    live: true
    summary: "The Construction Career Cluster focuses on professions involved in designing, planning, managing, and executing projects in the built environment."
    definition: "The Construction Career Cluster focuses on professions involved in designing, planning, managing, and executing projects in the built environment. It emphasizes sustainable building practices to ensure that structures are both environmentally responsible and resilient. Careers in this Cluster are pivotal in creating durable infrastructure that meets present needs without compromising future generations’ ability to meet their own, covering a range of roles from architects and engineers to construction managers and skilled tradespeople."
    source: acte_construction
    connected: [advanced-manufacturing, agriculture, arts-entertainment-design, energy-natural-resources, supply-chain-transportation]
    sub_clusters:
      - name: "Architecture & Civil Engineering"
        line: "Careers combining the planning, design, and drafting of infrastructure, structures, and landscapes with the application of technical expertise through architecture and civil and structural engineering."
        programs: ["Architectural Design", "Drafting", "Landscape Architecture"]
      - name: "Construction Planning & Development"
        line: "Careers emphasizing the critical initial stages of construction and development projects, including preconstruction activities, property development, and land use planning."
        programs: ["Construction Management", "Surveying"]
      - name: "Equipment Operation & Maintenance"
        line: "Careers skilled in managing and servicing the heavy equipment and machinery that are essential for building and infrastructure projects."
        programs: ["Diesel Mechanics", "Heavy Machine Operation"]
      - name: "Skilled Trades"
        line: "Careers focused on skilled work that is essential to constructing, maintaining, and repairing buildings and infrastructure including carpentry; welding; masonry; electrical; plumbing; and heating, ventilation, air conditioning, and refrigeration (HVAC-R)."
        programs: ["Carpentry", "Electrical Systems", "Green Construction", "HVAC-R", "Welding Technology"]
    careers:
      - { pathway: civil-engineering, sub: "Architecture & Civil Engineering", also: [public-service-safety], tie: true }
      - { trade: electrician, soc: "47-2111", sub: "Skilled Trades" }
      - { trade: plumber, soc: "47-2152", sub: "Skilled Trades" }
      - { trade: hvac-technician, soc: "49-9021", sub: "Skilled Trades" }
  - slug: advanced-manufacturing
    name: "Advanced Manufacturing"
    phase: 6
    live: true
    summary: "The Advanced Manufacturing Career Cluster blends innovative technologies and practices to enhance design and production."
    definition: "The Advanced Manufacturing Career Cluster blends innovative technologies and practices to enhance design and production. It covers areas such as engineering, research and development, automation and artificial intelligence, equipment maintenance, safety protocols, and quality control. This Cluster aims to increase efficiency, reduce waste, ensure safety, and produce high-quality goods, driving the industry’s growth and adapting to modern demands."
    source: acte_advanced_manufacturing
    connected: [agriculture, arts-entertainment-design, construction, energy-natural-resources, healthcare-human-services, supply-chain-transportation]
    sub_clusters:
      - name: "Engineering"
        line: "Careers that use engineering principles to develop and improve manufacturing processes and systems and to design products."
        programs: ["Engineering & Technology", "Pre-Engineering", "Semiconductor Manufacturing", "Engineering Technology"]
      - name: "Industrial Machinery"
        line: "Careers focused on working with manual equipment, such as computer-numerical-controlled (CNC) machines, 3D printers, quality control equipment, material handling tools, maintenance and repair devices, specialized machining and surface treatment machines, fabrication equipment, and energy management systems."
        programs: ["Industrial Machine Mechanics", "Precision Machining"]
      - name: "Production & Automation"
        line: "Careers centered on the hands-on management and execution of manufacturing processes."
        programs: ["Apparel & Textile Production", "Manufacturing Production Process Development"]
      - name: "Robotics"
        line: "Careers involved in developing, implementing, and maintaining technologies that deploy robotics."
        programs: ["Industry 4.0", "Robotics Technology"]
      - name: "Safety & Quality Assurance"
        line: "Careers dedicated to ensuring workplace safety, worker health, environmental compliance, and product quality."
        programs: ["Safety & Environmental Assurance"]
    careers:
      - { pathway: mechanical-engineering, sub: "Engineering" }
      - { pathway: electrical-engineering, sub: "Engineering", also: [energy-natural-resources] }
      - { pathway: aerospace-engineering, sub: "Engineering" }
      - { trade: welder, soc: "51-4121", sub: "Production & Automation", also: [construction], tie: true }
  - slug: supply-chain-transportation
    name: "Supply Chain & Transportation"
    phase: 7
    live: true
    summary: "The Supply Chain & Transportation Career Cluster encompasses the transfer, coordination, and management of goods from production to consumption, ensuring efficient movement across various modes of transportation including air, ground, and water, as well as maintenance of the respective transport modes."
    definition: "The Supply Chain & Transportation Career Cluster encompasses the transfer, coordination, and management of goods from production to consumption, ensuring efficient movement across various modes of transportation including air, ground, and water, as well as maintenance of the respective transport modes. This Cluster integrates logistics and distribution networks to facilitate the seamless flow of materials and products, playing a crucial role in global commerce, economic development, and community health."
    source: acte_supply_chain_transportation
    connected: [advanced-manufacturing, agriculture, construction, energy-natural-resources, hospitality-events-tourism]
    sub_clusters:
      - name: "Air & Space Transportation"
        line: "Careers related to the design, operation, and management of both air and space transportation, including air cargo and passenger services, as well as space exploration and satellite operations."
        programs: ["Aviation Technology", "Avionics", "“Your Place in Space” Department of Education Program"]
      - name: "Ground & Rail Transportation"
        line: "Careers related to the transportation of goods and passengers by road and rail."
        programs: ["Commercial Driving", "Railroad Operations"]
      - name: "Maintenance & Repair"
        line: "Careers encompassing the repair and maintenance of transportation systems, including ground vehicles, rail vehicles, aircraft, and nautical vessels."
        programs: ["Auto Body Technology", "Automotive Maintenance", "Diesel Mechanics", "Electric Vehicle Maintenance"]
      - name: "Marine Transportation"
        line: "Careers in the design, operation, and management of maritime vessels and infrastructure for the transportation of goods and passengers, and watercraft used in sports and leisure activities."
        programs: ["Marine Transport", "Vessel Operations"]
      - name: "Planning & Logistics"
        line: "Careers focused on managing and optimizing the supply chain’s flow of goods and information."
        programs: ["Transportation, Distribution, & Logistics Systems"]
      - name: "Purchasing & Warehousing"
        line: "Careers centered around procurement, warehousing, and facility maintenance."
        programs: ["Business Administration", "Supply Chain Management"]
    careers:
      - { trade: automotive-service-technician, soc: "49-3023", sub: "Maintenance & Repair" }
      - { career: purchasing-manager, sub: "Purchasing & Warehousing", also: [management-entrepreneurship, marketing-sales] }
      - { career: logistician, sub: "Planning & Logistics" }
      - { career: logistics-manager, sub: "Planning & Logistics" }
  - slug: energy-natural-resources
    name: "Energy & Natural Resources"
    phase: 7
    live: false
    summary: "The Energy & Natural Resources Career Cluster spans careers in traditional and renewable fuel production, power generation and energy conversion, utilities, environmental preservation, ecological research, and resource extraction."
    definition: "The Energy & Natural Resources Career Cluster spans careers in traditional and renewable fuel production, power generation and energy conversion, utilities, environmental preservation, ecological research, and resource extraction. These industries focus on efficient and responsible resource management, including conservation, transmission, distribution and storage, to minimize environmental impacts and meet global energy needs. Careers in this Cluster are dedicated to creating a sustainable future, innovating cleaner energy solutions, and preserving our planet's natural resources for generations to come."
    source: acte_energy_natural_resources
    connected: [advanced-manufacturing, agriculture, construction, public-service-safety, supply-chain-transportation]
    sub_clusters:
      - name: "Clean & Alternative Energy"
        line: "Careers focused on energy generation and infrastructure development from clean energy sources such as low carbon fuels, natural gas, nuclear, biofuels, hydrogen processes, and other alternative sources aimed at addressing climate change impacts."
        programs: ["Renewable Energy", "Electric Vehicle Installation & Maintenance", "Solar System Design & Installation", "Wind Turbine Installation & Maintenance"]
      - name: "Conservation & Land Management"
        line: "Careers rooted in environmental and natural sciences, focusing on protecting and managing natural resources and landscapes."
        programs: ["GIS Mapping", "Natural Resource Conservation", "Wildlife Management"]
      - name: "Ecological Research & Development"
        line: "Careers emphasizing the scientific study of and research in ecological, geological, electrical, chemical, nuclear, biological, environmental engineering, and other sciences as they relate to energy production, sustainability, and the management of natural resources."
        programs: ["Environmental Engineering", "Environmental Management", "Environmental Science & Sustainability"]
      - name: "Environmental Protection"
        line: "Careers centered on regulating and managing the impacts of both natural processes and human activities, such as resource production and consumption."
        programs: ["Climate Resilience", "Sustainable Communities"]
      - name: "Resource Extraction"
        line: "Careers focused on the efficient extraction of natural materials including fossil fuels, minerals, natural gas, and geothermal resources that are essential for fuel production in energy and manufacturing."
        programs: ["Clean Energy System Design", "Energy Transfer", "Mining Technology"]
      - name: "Utilities"
        line: "Careers involving the transmission and maintenance of utility systems for clean and alternative energy, electricity, water, waste remediation, and telecom/broadband; distribution and infrastructure development; and storage."
        programs: ["Telecommunications", "Water & Wastewater Systems", "Plant Operations", "Underground or Overhead Linework", "Utility Maintenance and Repair"]
    careers: []
  - slug: agriculture
    name: "Agriculture"
    phase: 7
    live: false
    summary: "The Agriculture Career Cluster concentrates on scientific advancement of agriscience, cultivation, processing, and distribution of agricultural products, employing advanced technologies and sustainable practices to optimize global food systems."
    definition: "The Agriculture Career Cluster concentrates on scientific advancement of agriscience, cultivation, processing, and distribution of agricultural products, employing advanced technologies and sustainable practices to optimize global food systems. This Cluster also supports other plant- and animal-based industries including regenerative agriculture, sustainable logging, and fisheries. This Cluster has meaningful connections with the Energy and Natural Resources Cluster, highlighting a symbiotic relationship that emphasizes stewardship and resilient communities."
    source: acte_agriculture
    connected: [construction, energy-natural-resources, hospitality-events-tourism, supply-chain-transportation]
    sub_clusters:
      - name: "Agribusiness"
        line: "Careers focused on the economic aspects of agriculture, encompassing farm and rangeland management, agribusiness finance, international relations, supply chain management, and other functions that are essential for agricultural profitability."
        programs: ["Agribusiness", "Agricultural Policy", "Agricultural Finance"]
      - name: "Agricultural Technology & Automation"
        line: "Careers at the intersection of agriculture and technology, focusing on the design and operation of agricultural equipment and systems; repair and maintenance of agricultural equipment; and agricultural engineering, mechanics, and automation processes."
        programs: ["Agricultural Technology", "Precision Agriculture", "Urban Farming", "Agricultural Mechanics"]
      - name: "Animal Systems"
        line: "Careers that both promote the health and well-being of animals, including companion, livestock, and exotic animals, and facilitate the efficient production of animal-related products within the food system."
        programs: ["Animal Nutrition", "Livestock Management", "Veterinary Science"]
      - name: "Food Science & Processing"
        line: "Careers centered on applying scientific and technological principles to the development, enhancement, processing, and usability of agricultural food products."
        programs: ["Food Science", "Meat Science", "Sustainable Food & Farming"]
      - name: "Plant Systems"
        line: "Careers involving the study and management of plant growth, soil health, and pest management, focusing on sustainable crop production for both food and goods."
        programs: ["Horticulture", "Forestry", "Plant Science", "Floriculture"]
      - name: "Water Systems"
        line: "Careers centered on the effective management and use of water resources in agricultural settings, including precision irrigation, aquaculture, and fisheries."
        programs: ["Aquaculture", "Marine Biology"]
    careers: []
