  - id: "faq"
    hid: "faq-heading"
    alt: true
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "What is the difference between Mechanic Motor Vehicle and Mechanic Diesel trades?"
            a: "Mechanic Motor Vehicle covers cars and light vehicles broadly, including petrol and diesel light-vehicle systems, engines, transmission, brakes and electrical systems. Mechanic Diesel focuses specifically on diesel engines, commonly used in trucks, heavy vehicles, tractors and generators. Motor Vehicle is broader for light vehicles; Diesel is a deeper specialisation in diesel-powered machinery."
          - q: "How long is the ITI Mechanic Motor Vehicle course?"
            a: "Mechanic Motor Vehicle is typically a 2-year NCVT-affiliated trade, combining trade theory, vehicle systems study and substantial hands-on servicing and repair practice."
          - q: "Can I get a job at a car dealership service centre after this trade?"
            a: "Yes, this is one of the most common paths. Major car brands and their authorised service centres regularly recruit ITI Mechanic Motor Vehicle-qualified technicians, often providing additional brand-specific training after hiring."
          - q: "Does this trade cover electric vehicles (EVs)?"
            a: "Traditional ITI Motor Vehicle syllabus centres on conventional petrol/diesel vehicle systems. EV-specific training is a newer, separate area — some institutes and companies now offer add-on EV technician certifications, which are increasingly valuable given the growing EV market, but aren't automatically covered in the base trade everywhere."
          - q: "Can I open my own garage after this trade?"
            a: "Yes, this is a genuine and common path. Many mechanics build independent garage/repair businesses after gaining practical experience, though success depends on location, reputation, equipment investment and building a reliable customer base."
      - note: "*Fee and salary figures are indicative, based on publicly available information as of 2026, and vary significantly by state, institute and employer — always verify current figures directly with your target ITI."
