  # 93,400 jobs (crosswalk: Energy 2, AM 1, HHS 1, PSS 1)
  - slug: environmental-scientist
    short: "Environmental Scientist"
    title: "Environmental scientist: bachelor's in a natural science, internships, then certification for some jobs"
    eyebrow: "Energy & Natural Resources · Ecological Research & Development"
    lede: "Environmental scientists and specialists typically need a bachelor's degree in environmental science or a related field such as natural resources, biology or physical science. Internships or volunteering help; some employers prefer or require certification for the work."
    for: "Science students who care about clean air, water and land and like both lab and field work."
    soc: ["19-2041"]
    does: { text: "Environmental scientists and specialists conduct research or investigations to protect the environment or human health.", source: ooh_qf_envsci }
    work: { text: "Environmental scientists and specialists typically work in office settings and laboratories but may spend time in the field. Most environmental scientists and specialists work full time.", source: ooh_qf_envsci }
    become: { text: "To enter the occupation, environmental scientists and specialists typically need a bachelor’s degree in a natural science or a related field.", source: ooh_qf_envsci }
    metrics: { pay: 82220, pay_hour: "39.53", pay_by: "Environmental scientists and specialists, including health", jobs: 93400, outlook: 6, outlook_words: "Faster than average", change: 5700, entry: "Bachelor's degree", training: "None", source: ooh_qf_envsci }
    license_text: "None"
    routes:
      - id: degree
        title: "Bachelor's in environmental science or a natural science"
        tag: "Typical"
        who: "Coursework often includes chemistry, geology and physics; hydrology, waste management or environmental policy courses also help."
        steps:
          - { tag: "Start", title: "High school: science and math", text: "", kind: start, source: ooh_envsci }
          - { tag: "About 4 years", title: "Bachelor's in environmental science, natural resources, biology or physical science", text: "", kind: stage, source: ooh_envsci }
          - { tag: "During college", title: "Internship or volunteering", text: "With an environmental science organization.", kind: stage, source: ooh_envsci }
          - { tag: "Goal", title: "Environmental scientist or specialist", text: "Later: supervising technicians, project leader or program manager.", kind: goal, source: ooh_envsci }
    certs:
      - { name: "Work-related certification", who: "Employer may require", kind: "Employer may require", text: "Some employers prefer or require certification related to the work.", source: ooh_envsci }

  # 25,400 jobs (crosswalk: Energy 1)
  - slug: geoscientist
    short: "Geoscientist (Geologist)"
    title: "Geoscientist: bachelor's in geoscience, ASBOG exams and a state license in most states"
    eyebrow: "Energy & Natural Resources · Resource Extraction"
    lede: "Geoscientists typically need a bachelor's degree in geoscience; some jobs prefer a master's. Most geoscientists need a state-issued license: 30 states and Puerto Rico license geologists, usually through the two ASBOG exams (Fundamentals of Geology and Practice of Geology) plus years of experience."
    for: "Curious students who like rocks, maps, field trips and solving earth-science puzzles."
    soc: ["19-2042"]
    does: { text: "Geoscientists study the physical aspects of the Earth.", source: ooh_qf_geosci }
    work: { text: "Geoscientists usually split their time between work in an office setting, in laboratories, and outdoors. Most geoscientists work full time, and some work more than 40 hours per week. Schedules vary to include irregular hours when doing fieldwork.", source: ooh_qf_geosci }
    become: { text: "Geoscientists typically need a bachelor’s degree to enter the occupation. For some positions, employers prefer to hire candidates who have a master’s degree. Most geoscientists need a state-issued license.", source: ooh_qf_geosci }
    metrics: { pay: 101920, pay_hour: "49.00", pay_by: "Geoscientists, except hydrologists and geographers", jobs: 25400, outlook: 5, outlook_words: "Faster than average", change: 1300, entry: "Bachelor's degree", training: "None", source: ooh_qf_geosci }
    license_text: "Most states (30 + Puerto Rico)"
    routes:
      - id: degree
        title: "Bachelor's in geoscience → geoscientist"
        tag: "Typical"
        who: "Programs include mineralogy, geology, math and engineering, with geology fieldwork; internships help."
        steps:
          - { tag: "Start", title: "High school: science and math", text: "", kind: start, source: ooh_geosci }
          - { tag: "About 4 years", title: "Bachelor's in geoscience, physical science or natural resources", text: "", kind: stage, source: ooh_geosci }
          - { tag: "Optional", title: "Master's or doctorate", text: "More specialization and research; may be more competitive for some jobs.", kind: stage, source: ooh_geosci }
          - { tag: "Goal", title: "Entry-level geoscientist", text: "", kind: goal, source: ooh_qf_geosci }
      - id: pg
        title: "Professional Geologist (P.G.) license"
        tag: "To offer services to the public"
        who: "Most states require licensing for geologists who offer services to the public, such as for civil engineering projects, environmental protection and regulatory compliance."
        steps:
          - { tag: "Start", title: "Four-year degree with 30 semester hours of geoscience", text: "Texas's rule for the FG exam; each state board sets its own.", kind: start, source: tx_tbpg_exams }
          - { tag: "Exam", title: "ASBOG Fundamentals of Geology (FG)", text: "4 hours, computer-based at Prometric centers. In Texas, passing it can lead to Geoscientist-in-Training (GIT) certification.", kind: exam, source: asbog_exams }
          - { tag: "About 5 years", title: "Qualifying work experience", text: "", kind: stage, source: tx_tbpg_exams }
          - { tag: "Exam", title: "ASBOG Practice of Geology (PG)", text: "4 hours; FG and PG can be taken on the same day.", kind: exam, source: asbog_exams }
          - { tag: "Goal", title: "State geologist license", text: "ASBOG writes the exams but licenses no one: you apply to your state board.", kind: goal, source: asbog_licensure }
        facts:
          - { k: "Exam dates", v: "Twice a year: 2027 spring session 18–19 March, fall session 30 September–1 October; boards set their own deadlines, typically 60 to 90 days before.", source: asbog_exams }
    certs:
      - { name: "State geologist license (P.G.)", who: "State licensing board", kind: "State license", text: "Applicants typically meet education and experience minimums and pass an exam.", source: ooh_geosci }
    states_note: "30 states and Puerto Rico require professional licensing or registration for geologists. One state's rule, from its own board:"
    states:
      - { place: "Texas", body: "Texas Board of Professional Geoscientists (TBPG)", rule: "ASBOG FG and PG for the geology discipline. FG: a four-year degree with <strong>30 semester (45 quarter) hours</strong> of geoscience. PG: the FG passed plus <strong>5 years</strong> of qualifying work experience (or within 6 months of it), with a P.G. application on file. Geophysics applicants take the Texas Geophysics Examination.", sources: [tx_tbpg_exams] }

  # 18,500 jobs (crosswalk: Energy 1)
  - slug: petroleum-engineer
    short: "Petroleum Engineer"
    title: "Petroleum engineer: bachelor's in petroleum or another engineering field, internships, optional PE"
    eyebrow: "Energy & Natural Resources · Resource Extraction"
    lede: "Petroleum engineers typically need a bachelor's degree in petroleum engineering or a related field such as mechanical, civil or chemical engineering. Employers value internship and co-op experience. No license is needed for entry-level jobs; experienced engineers may earn a PE license."
    for: "Strong math and physics students who want to work on oil and gas fields, drilling sites and energy projects."
    soc: ["17-2171"]
    does: { text: "Petroleum engineers devise methods to improve oil and gas extraction and production.", source: ooh_qf_peteng }
    work: { text: "Petroleum engineers generally work in offices or at drilling and well sites. Travel may be required to visit these sites or to meet with other engineers, oilfield workers, and customers.", source: ooh_qf_peteng }
    become: { text: "Petroleum engineers typically need a bachelor’s degree in petroleum engineering or a related field, such as mechanical, civil, or chemical engineering. Employers also value practical experience, which students sometimes gain through internships.", source: ooh_qf_peteng }
    metrics: { pay: 144910, pay_hour: "69.67", pay_by: "Petroleum engineers", jobs: 18500, outlook: 2, outlook_words: "Slower than average", change: 400, entry: "Bachelor's degree", training: "None", source: ooh_qf_peteng }
    license_text: "Optional (PE)"
    routes:
      - id: bachelor
        title: "Bachelor's in engineering → petroleum engineer"
        tag: "Typical"
        who: "Programs include academic, laboratory and field work in engineering principles, geology and thermodynamics. Some employers prefer an accredited program or a master's."
        steps:
          - { tag: "Start", title: "High school: algebra, geometry, calculus, biology, chemistry, physics", text: "", kind: start, source: ooh_peteng }
          - { tag: "About 4 years", title: "Bachelor's in petroleum, mechanical, civil or chemical engineering", text: "Some schools offer a 5-year bachelor's + master's program.", kind: stage, source: ooh_peteng }
          - { tag: "During college", title: "Co-op or internship", text: "", kind: stage, source: ooh_peteng }
          - { tag: "Goal", title: "Entry-level petroleum engineer", text: "Licensure is not required for entry-level positions.", kind: goal, source: ooh_peteng }
      - id: pe
        title: "Optional: Professional Engineer (PE) license"
        tag: "To sign off on projects"
        who: "A PE can oversee other engineers, sign off on projects and provide services directly to the public."
        steps:
          - { tag: "Start", title: "Engineering bachelor's degree", text: "", kind: start, source: ooh_peteng }
          - { tag: "Exam", title: "FE exam", text: "", kind: exam, source: ncees_fe, href: "us/professional-licenses/pe/#exams", link: "FE and PE exams" }
          - { tag: "Several years", title: "Relevant work experience", text: "", kind: stage, source: ooh_peteng }
          - { tag: "Exam", title: "PE exam", text: "", kind: exam, source: ncees_pe }
          - { tag: "Goal", title: "State PE license", text: "Each state issues its own; several require continuing education.", kind: goal, source: ooh_peteng, href: "us/professional-licenses/pe/", link: "PE license steps" }

  # 40,900 jobs (conservation scientists and foresters; crosswalk: Energy 5, PSS 1, AM 1, Agriculture 1)
  - slug: forester
    short: "Forester & Conservation Scientist"
    title: "Forester or conservation scientist: bachelor's in forestry or natural resources; a license in some states"
    eyebrow: "Energy & Natural Resources · Conservation & Land Management"
    lede: "Conservation scientists and foresters typically need a bachelor's degree in forestry, natural resources or a related subject such as agriculture or biology, with a background in GIS and remote sensing. Several states require some type of credential, and in some of them foresters must be licensed."
    for: "Outdoor-loving students who like ecology, maps and managing forests, parks and rangelands."
    soc: ["19-1030"]
    does: { text: "Conservation scientists and foresters manage the land quality of forests, parks, rangelands, and other natural resources.", source: ooh_qf_forester }
    work: { text: "Conservation scientists and foresters work for federal, state, and local governments; on privately owned lands; or in social advocacy organizations. Most conservation scientists and foresters work full time, and schedules may vary.", source: ooh_qf_forester }
    become: { text: "Conservation scientists and foresters typically need a bachelor’s degree in forestry, natural resources, or a related field.", source: ooh_qf_forester }
    metrics: { pay: 73920, pay_hour: "35.54", pay_by: "Conservation scientists and foresters", jobs: 40900, outlook: 4, outlook_words: "As fast as average", change: 1700, entry: "Bachelor's degree", training: "None", source: ooh_qf_forester }
    license_text: "Some states"
    routes:
      - id: degree
        title: "Bachelor's in forestry or natural resources"
        tag: "Typical"
        who: "Programs typically include biology, ecology and forest measurement, plus GIS, remote sensing and computer modeling."
        steps:
          - { tag: "Start", title: "High school: biology and math", text: "", kind: start, source: ooh_forester }
          - { tag: "About 4 years", title: "Bachelor's in forestry, natural resources, agriculture or biology", text: "", kind: stage, source: ooh_forester }
          - { tag: "Some states", title: "State credential or license", text: "Check with your state licensing board.", kind: licence, source: ooh_forester }
          - { tag: "Goal", title: "Forester or conservation scientist", text: "", kind: goal, source: ooh_qf_forester }
    certs:
      - { name: "Optional certification", who: "Professional associations", kind: "Voluntary", text: "Some conservation scientists and foresters earn optional certification related to their area of work.", source: ooh_forester }
    states_note: "Several states may require some type of credentialing for conservation scientists and foresters, and in some of these states they must be licensed; check with your state licensing board."
    states_source: ooh_forester
