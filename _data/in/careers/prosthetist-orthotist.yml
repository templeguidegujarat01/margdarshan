hero:
  eyebrow: "Science · Rehabilitation Profession"
  title: "Prosthetist & Orthotist — Artificial Limbs and Braces"
  meta:
    - "Registered with RCI"
    - "Class 12 Science with English"
  read_time: "8 min read"
  intro:
    - "Prosthetists and orthotists design, fit and adjust artificial limbs (prostheses) and supportive braces and splints (orthoses) for people with amputations, polio, cerebral palsy, injuries and other conditions. The professional degree is the Bachelor in Prosthetics and Orthotics (BPO), with an internship. It is a rehabilitation profession: you must be registered with the Rehabilitation Council of India (RCI) to practise."
