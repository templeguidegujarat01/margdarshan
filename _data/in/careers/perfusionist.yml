  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What does a Perfusionist do?"
    parts:
      - overview:
          points:
            - "Perfusionists set up and run the cardiopulmonary bypass (heart-lung) machine, managing blood flow, oxygen, temperature and blood chemistry during surgery."
            - "They manage ECMO for critically ill patients and support heart-transplant and paediatric cardiac programmes."
            - "The job is high-stakes teamwork with cardiac surgeons and anaesthetists."
  - id: "who"
    hid: "who-heading"
    alt: true
    eyebrow: "Fit check"
    heading: "Who should become a Perfusionist"
    parts:
      - fit:
          match:
            - "Stay calm and precise under pressure."
            - "Like physiology, machines and teamwork."
            - "Want a specialised, high-skill hospital career."
          mismatch:
            - "Faint at the sight of blood."
            - "Want predictable hours — emergencies happen."
            - "Want to live where there is no cardiac surgery centre."
  - id: "eligibility"
    hid: "elig-heading"
    eyebrow: "Eligibility"
    heading: "What you need, stage by stage"
    parts:
      - elig_list:
          - "Class 12 with <strong>Physics, Chemistry and Biology</strong> (English often compulsory); minimum marks set by each university."
          - "Admission by merit or the university/state allied-health entrance."
          - "Complete the course and internship at a hospital with an active cardiac surgery programme."
