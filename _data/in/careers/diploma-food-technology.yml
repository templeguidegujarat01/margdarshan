    hid: "faq-heading"
    alt: true
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "What is FSSAI and how does it relate to Food Technology careers?"
            a: "FSSAI (Food Safety and Standards Authority of India) is India's food safety regulatory body. Food Technology graduates often work in roles that involve ensuring compliance with FSSAI standards, such as quality assurance and food safety officer positions, in both government and private food companies."
          - q: "Is this diploma offered after Class 10 or Class 12?"
            a: "It varies by institute — some offer it as a 3-year polytechnic diploma after Class 10, while others offer shorter post-Class 12 diploma or certificate programmes, particularly for students with a Science (PCB/PCM) background. Check your target institute's specific entry point."
          - q: "What industries hire Food Technology diploma holders?"
            a: "Food processing and packaged food companies, dairy companies, beverage manufacturers, and quality assurance departments at food businesses are among the main employers, given India's large and growing organised food processing sector."
          - q: "Is food safety training a significant part of this diploma?"
            a: "Yes. Food safety, hygiene standards and quality control are core, mandatory components of the curriculum, since food processing directly affects public health and is subject to regulatory compliance requirements."
          - q: "What jobs can I get with just this diploma, without a further degree?"
            a: "Common roles include quality control technician, food processing supervisor, packaging technician, and production assistant at food processing, dairy and beverage companies — genuine, established entry-level options directly after the diploma."
