  - slug: sports-careers
    short: "Careers in sports"
    eyebrow: "Sports Guide · Careers · Beyond being a player"
    title: "Careers in sports — player, coach, sports scientist, doctor, manager, referee and more"
    lede: "Education Margdarshan's plain guide to every road into sport in India, with the real eligibility, entrance test and seats from the institutes' own admission pages: playing and sports-quota jobs, coaching at SAI NSNIS Patiala and the National Sports University, physical education at LNIPE, sports science, nutrition, psychology, sports medicine, management, journalism, refereeing and sports law."
    meta: "SAI NSNIS, National Sports University, LNIPE and Government of India files only"
