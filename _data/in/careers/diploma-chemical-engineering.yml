  - id: "safety"
    hid: "safety-heading"
    alt: true
    eyebrow: "A genuinely important part of the field"
    heading: "Industrial safety training"
    parts:
      - chips:
          - label: "Why it matters"
            text: "Chemical plants handle hazardous, flammable and sometimes toxic materials under specific pressure/temperature conditions — safety isn't optional, it's foundational to the work."
          - label: "What's covered"
            text: "Hazard identification, personal protective equipment (PPE) use, emergency response procedures, and understanding material safety data sheets (MSDS)."
          - label: "Industry standards"
            text: "Plants follow established safety protocols and regulations, and employees typically undergo additional site-specific safety induction training before starting work."
          - label: "Career relevance"
            text: "Strong safety awareness and discipline is genuinely valued by employers and directly affects hiring and workplace trust in this field."
  - id: "fees"
    hid: "fees-heading"
    eyebrow: "Very affordable at government polytechnics"
    heading: "Fees & scholarships"
    parts:
      - prose:
          - "Government polytechnic fees for the full 3-year diploma are typically in the range of <strong>₹15,000-60,000</strong>, making it one of the most affordable technical qualifications in India. Private polytechnic institutes charge considerably more, often ₹60,000-1.5 lakh per year. Merit-based, SC/ST and income-linked scholarships are available at most government institutions. Always confirm current fees directly on your target institute's official admission page."
