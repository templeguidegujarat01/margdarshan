lede: "In Massachusetts, the Massachusetts Board of Bar Examiners handles bar admission for lawyers, the Massachusetts Board of Registration in Medicine licenses physicians, the Massachusetts Board of Public Accountancy licenses CPAs and the Massachusetts Board of Registration in Nursing licenses registered nurses."

boards:
