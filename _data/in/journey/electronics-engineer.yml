# Journey Blueprint — Government Electronics Engineer (B.Tech ECE → GATE / ISRO / UPSC ESE). Printed on journey-electronics-engineer.html.
# Rules, classes and the money items / sources several careers share: _data/in/journey_common.yml.
# `money_defs` / `sources` below are used only by this career. Check: node scripts/check-journey-matrix.mjs
id: electronics-engineer
v: 2
name: "Government Electronics Engineer (ISRO · UPSC ESE · GATE)"
search: ["government electronics engineer", "electronics engineer", "electronics and communication engineer", "ece engineer", "isro scientist electronics", "telecom engineer", "indian telecommunication service"]
page: "electronics.html"
roadmap: "roadmaps/electronics.html"
doubts_page: "journey-electronics-engineer.html"
gate: "Class 12 with Physics and Mathematics → JEE Main or your state CET → B.E. / B.Tech in Electronics & Communication → ISRO's written test or GATE score (65% in the degree), UPSC Engineering Services Category IV, or a GATE-based PSU / CERT-In post."
gate_source: [jm-ib, isro-cbt26, isro-gate26, ese27, certin-scb]
core:
  what:
    text: "A government electronics engineer designs, tests and runs electronic, communication and satellite systems — at ISRO centres, in telecom and radio regulation, railway signalling and defence services. ISRO hires Scientist / Engineer 'SC' in Electronics, and UPSC's Engineering Services fill Electronics & Telecommunication posts."
    source: [isro-cbt26, ese27]
  day:
    - "Design and test circuits, communication links and satellite or launch-vehicle electronics."
    - "Run and maintain telecom, radio-monitoring or signalling systems."
    - "Write test reports and follow quality and safety procedures."
  pay:
    - { level: "Scientist / Engineer 'SC', ISRO (2026 adverts)", value: "Pay Level 10 · minimum basic ₹56,100 a month + DA, HRA, transport allowance", source: isro-gate26 }
    - { level: "Indian Telecommunications Service officer via UPSC ESE", value: "Pay Level 10", source: dot-its }
  pay_note: "Private-sector electronics salaries are not officially published."
  routes:
    - { title: "ISRO written test (CBT)", text: "Advt ISRO:ICRB:03(EMC):2026 had 99 Electronics posts (BE001). B.E. / B.Tech in Electronics & Communication with 65% or CGPA 6.84/10; age up to 28.", source: isro-cbt26 }
    - { title: "ISRO through GATE", text: "Advt ISRO:ICRB:02(EMC-CEPO):2026 had 34 Electronics posts, shortlisted on a GATE 2025 or 2026 score in Electronics & Communication; final panel 50% GATE score + 50% interview.", source: isro-gate26 }
    - { title: "UPSC ESE Category IV", text: "Electronics & Telecommunication Engineering fills services such as the Indian Radio Regulatory Service, Indian Telecommunications Service, Indian Railway Management Service (Signal & Telecommunication) and Junior Telecom Officer. Age 21–30.", source: ese27 }
    - { title: "CERT-In Scientist-B", text: "CERT-In's 2026 advert had 25 Electronics and Communication posts, shortlisted on a GATE 2024 / 2025 / 2026 score.", source: certin-scb }
  cost_time:
    - { label: "ISRO application", value: "₹250 application fee; everyone first pays ₹750 processing fee, refunded after the written test (in full for women, SC, ST, PwBD, ex-servicemen)", source: isro-cbt26 }
    - { label: "GATE 2027 fee (one paper)", value: "₹2,000 · ₹1,000 for women, SC, ST, PwD (regular period)", source: gate27-fee }
    - { label: "UPSC ESE fee", value: "₹200 · women, SC, ST and PwBD exempt", source: ese27 }
  cost_note: "College fees depend on the institute and state, so they are not printed here."
  challenges:
    - text: "ISRO's bar is high: 65% (CGPA 6.84) in the degree just to apply, then 50% in each part of the written test (40% reserved)."
      source: isro-cbt26
    - text: "The 2026 GATE cut-off for ISRO Electronics was a GATE score of 690 (UR) — scores, not marks or rank, decide the shortlist."
      source: isro-cut26
    - text: "Posts are few compared with applicants: 99 + 34 Electronics posts across ISRO's two 2026 adverts."
      source: [isro-cbt26, isro-gate26]
  not_for:
    - "You dislike Mathematics and Physics — the degree and every test build on them."
    - "You want a job without a competitive test — ISRO, ESE and PSUs all select on a test or GATE score."
    - "You cannot move — ISRO and central services post you to centres across India."
journey:
  - stages: [c8, c9]
    title: "Build Maths and Physics"
    do:
      - text: "B.Tech admission through JEE Main needs Physics and Mathematics in Class 12, so these two subjects matter from now."
        source: jm-ib
    doubts:
      - q: "What does a government electronics engineer do?"
        a: "Designs, tests and runs electronic, communication and satellite systems — for example as an ISRO Scientist / Engineer 'SC' in Electronics, or in UPSC Engineering Services posts such as the Indian Telecommunications Service and Indian Radio Regulatory Service."
        next: "Read the Routes list above."
        source: [isro-cbt26, ese27]
      - q: "Which government bodies hire electronics engineers?"
        a: "ISRO (Scientist / Engineer 'SC'), UPSC's Engineering Services (Electronics & Telecommunication category) and CERT-In (Scientist-B, Electronics and Communication) are three central routes with 2026 notices."
        next: "Keep Maths and Physics strong."
        source: [isro-cbt26, ese27, certin-scb]
  - stages: [c10]
    title: "Pick Science with Mathematics"
    do:
      - text: "Choose Physics, Chemistry and Mathematics in Class 11 — JEE Main's B.E. / B.Tech paper tests these three."
        source: jm-ib
    stream: "Science with Physics, Chemistry and Mathematics (PCM)."
    doubts:
      - q: "Can I become an electronics engineer with PCB?"
        a: "The B.E. / B.Tech route through JEE Main needs Physics and Mathematics in Class 12, so take Mathematics in Class 11."
        next: "Choose PCM."
        source: jm-ib
      - q: "Is a polytechnic diploma a route?"
        a: "A diploma can lead to a B.Tech later, but ISRO's Scientist / Engineer 'SC' posts and UPSC ESE ask for an engineering degree, so plan for the degree."
        next: "If you take a diploma, plan lateral entry into a B.Tech."
        source: [isro-cbt26, ese27]
  - stages: [c11, c12]
    title: "JEE Main and your state CET"
    do:
      - text: "Write JEE Main (and your state engineering CET) in Class 12 for a B.E. / B.Tech in Electronics & Communication."
        source: jm-ib
    exams:
      - { name: "JEE Main", when: "Two sessions in Class 12 — check the NTA bulletin for the year", source: jm-ib }
    doubts:
      - q: "Which branch should I choose after JEE?"
        a: "ISRO's Electronics posts ask for B.E. / B.Tech in Electronics & Communication Engineering or equivalent; ESE Category IV also takes Electronics & Telecommunication graduates."
        next: "Put ECE high in your choices."
        source: [isro-cbt26, ese27]
      - q: "Do Class 12 marks matter for ISRO?"
        a: "ISRO looks at your degree marks — 65% or CGPA 6.84 out of 10 — not your Class 12 percentage. In the interview, academic performance and institute type carry a few marks."
        next: "Aim for a strong degree record."
        source: isro-cbt26
  - stages: [ug]
    title: "B.Tech ECE: keep 65% and prepare for GATE"
    do:
      - text: "Keep at least <strong>65% aggregate (CGPA 6.84/10)</strong> — ISRO does not convert CGPA to percentage."
        source: isro-cbt26
      - text: "You can write GATE from the third year of your degree."
        source: gate27-elig
    exams:
      - { name: "GATE 2027", when: "6–7, 13–14, 20–21 Feb 2027 · result 19 Mar 2027", source: gate27 }
    money: [gate-fee]
    doubts:
      - q: "When can I write GATE?"
        a: "From the third year of any undergraduate degree, or after you finish it."
        next: "Plan GATE for your third or final year."
        source: gate27-elig
      - q: "How much did ISRO's GATE route need in 2026?"
        a: "ISRO's 2026 GATE cut-off for Electronics (BE001) was a GATE score of 690 for UR and 244 for PwBD."
        next: "Aim well above the last cut-off."
        source: isro-cut26
      - q: "Which GATE paper do I write for ISRO Electronics?"
        a: "Electronics & Communication Engineering. ISRO counts GATE scores of the two latest years (2025 or 2026 for its 2026 advert)."
        next: "Register for the EC paper."
        source: isro-gate26
      - q: "My university gives only CGPA. How does ISRO check it?"
        a: "If the degree shows only CGPA, the CGPA itself must meet 6.84/10; converting CGPA to a percentage is not allowed."
        next: "Check your degree certificate format."
        source: isro-cbt26
  - stages: [grad]
    title: "ISRO, ESE or a GATE-based post"
    do:
      - text: "ISRO written test: Part A — 80 MCQs in your discipline (90 minutes, +1, −1/3); Part B — 15 aptitude questions (30 minutes, no negative). 100 marks; 50% in each part to qualify (40% reserved)."
        source: isro-cbt26
      - text: "Interview shortlist 1:5; final panel 50% written test + 50% interview."
        source: isro-cbt26
    exams:
      - { name: "ISRO Scientist / Engineer 'SC' CBT", when: "Postponed to 29 Oct 2026", source: isro-icrb13 }
      - { name: "UPSC ESE 2027 prelims", when: "31 Jan 2027", source: ese27 }
    money: [isro-fee, ese-fee]
    doubts:
      - q: "What is the age limit for ISRO Scientist / Engineer?"
        a: "28 years (as on 16 September 2026 for the CBT advert), with relaxation as per Government of India orders."
        next: "Apply while you are young enough."
        source: isro-cbt26
      - q: "Is there negative marking in ISRO's test?"
        a: "Yes in Part A: +1 for a correct answer and −1/3 for a wrong one. Part B (aptitude) has no negative marking."
        next: "Answer Part A carefully."
        source: isro-cbt26
      - q: "How is the final ISRO merit list made?"
        a: "50% weight to the written test marks and 50% to the interview; ties go to written-test marks, then degree marks, then the older candidate."
        next: "Prepare for the interview as seriously as the test."
        source: isro-cbt26
      - q: "Which ESE services can an electronics graduate join?"
        a: "Category IV (Electronics & Telecommunication) includes the Indian Radio Regulatory Service, Indian Telecommunications Service, Indian Naval Armament Service (E&T posts), Indian Railway Management Service (Signal & Telecommunication), Junior Telecom Officer and others."
        next: "Read the ESE 2027 notice before you apply."
        source: ese27
      - q: "Do women pay ISRO's fee?"
        a: "Women, SC, ST, PwBD and ex-servicemen are exempt from the ₹250 application fee and get the ₹750 processing fee back in full if they appear in the written test."
        next: "Upload the certificate that proves your category."
        source: isro-cbt26
  - stages: [work]
    title: "Already working in electronics"
    do:
      - text: "Serving Central Government civilian employees and ex-servicemen get age relaxation for ISRO's posts as per Government of India orders; serving employees need a no-objection certificate at the interview."
        source: isro-cbt26
    doubts:
      - q: "I work in a private company. Can I still join ISRO?"
        a: "Yes, if you meet the 65% degree rule and the age limit (28, relaxable only for listed categories). Selection is the same written test (or GATE score) and interview."
        next: "Watch isro.gov.in careers for the next advert."
        source: [isro-cbt26, isro-gate26]
board_note: "Any board. JEE Main needs Physics and Mathematics in Class 12; ISRO judges your degree marks, not your board marks."
