  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "How competitive is NDA really?"
            a: "Extremely. UPSC announces only a few hundred vacancies per exam cycle — 394 for the NDA 2 2026 cycle, split across Army, Navy, Air Force and the Naval Academy — against hundreds of thousands of applicants twice a year. Clearing the written exam is only the first gate; the five-day SSB interview that follows has its own significant elimination rate, testing leadership, personality and psychological fitness, not just academic knowledge."
          - q: "What is the difference between NDA, CDS and Agnipath?"
            a: "NDA is for Class 12 students, leading to a permanent commission as an officer after training at the NDA plus a service-specific academy. CDS is the equivalent route for graduates, also leading to a permanent commission. Agnipath/Agniveer is a separate, shorter (4-year) enlisted-tier entry scheme for soldiers, sailors and airmen — not officers — with only a portion retained beyond the initial term. These are genuinely different tracks with different eligibility, training length, and rank outcomes."
          - q: "What is the NDA salary and career progression?"
            a: "During training at the NDA and the respective service academy (roughly 4 years total), cadets receive a stipend of ₹56,100 per month. After commissioning as a Lieutenant, Sub-Lieutenant or Flying Officer, starting basic pay is also ₹56,100 under the 7th Pay Commission, with Military Service Pay and allowances bringing in-hand pay to roughly ₹75,000-1,20,000 per month depending on posting. Pay and rank rise with promotions over a career, reaching considerably higher figures at senior ranks, up to ₹2,50,000/month for the Chief of Army Staff."
          - q: "Can women apply for NDA?"
            a: "Yes. NDA was opened to women candidates starting in 2022 following a Supreme Court directive, and women are now eligible to apply across the Army, Navy and Air Force wings, including the Naval Academy course. Recent exam cycles have specifically reserved a portion of vacancies for women candidates."
          - q: "Does NDA require Physics and Maths?"
            a: "It depends on the wing. The Army wing accepts candidates from any Class 12 stream — Science, Commerce or Arts. The Navy and Air Force wings specifically require Physics and Mathematics at Class 12. Candidates should decide their preferred wing before Class 12 to ensure they meet the correct subject requirements."
      - note: "Figures are indicative (2026) — confirm on the official college or authority website."
        class: "table-note mt-lg"
