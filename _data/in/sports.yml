          - warn: "The Ministry's cash-award scheme pays for medals at the <strong>Olympic, Asian and Commonwealth Games</strong> in all disciplines, but its sport-by-sport list of world championships has <strong>no ICC event</strong> — only the Blind Cricket World Cup in the para section."
            source: myas-cash
      - id: eligibility
        nav: "Fitness &amp; anti-doping"
        eyebrow: "Physical benchmarks &amp; anti-doping"
        heading: "How the BCCI tests fitness and clears injured players"
        parts:
          - list:
              - "Contracted and <strong>targeted</strong> players go through <strong>pre-season screening</strong> at the BCCI Centre of Excellence — fitness assessments and field tests, including the <strong>Bronco Test</strong>."
              - "Every session is logged on the <strong>Athlete Management System</strong>, with GPS used to track activity and workloads."
              - "Each fast bowler — contracted, targeted and Under-19 — has an <strong>individual weekly workload range</strong>."
              - "An injured player returns only after meeting the fitness <strong>benchmark</strong> and playing <strong>two return-to-play matches</strong>; the CoE sends fitness reports to the selectors."
            source: bcci-coe
          - list:
              - "Keep to the anti-doping rules: be available for testing, check every medicine against the <strong>Prohibited List</strong> and get a <strong>TUE</strong> when no permitted treatment exists."
            source: nada-rr
          - note: "Cricket is not one of the 27 SAI Training Centre disciplines, so SAI's battery of entry tests does not apply — selection runs through state associations and BCCI tournaments."
