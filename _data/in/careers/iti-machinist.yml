    heading: "What is the Machinist trade?"
    parts:
      - overview:
          points:
            - "ITI Machinist is a <strong>2-year</strong>, NCVT/DGT-affiliated trade under the Craftsman Training Scheme, training students to operate lathes, milling machines, grinding machines and shapers to manufacture precision metal parts."
            - "Unlike <a href=\"iti-fitter.html\">Fitter</a>, which focuses on manual assembly, Machinist centres specifically on machine-tool operation and precision measurement."
            - "Training is heavily hands-on — reading engineering drawings, setting up machines, and producing parts to tight tolerances — combined with trade theory and workshop calculation, following the standard Craftsmen Training Scheme (CTS) structure."
          more:
            - "Many institutes now also introduce basic Computer Numerical Control (CNC) machine exposure as part of the modernised syllabus."
