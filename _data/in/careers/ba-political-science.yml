  - id: "higher"
    hid: "higher-heading"
    alt: true
    eyebrow: "Beyond the degree"
    heading: "Higher studies"
    parts:
      - prose:
          - "An MA in Political Science or International Relations — at institutions like <strong>Jawaharlal Nehru University, Delhi University or the Jindal School of International Affairs</strong> — is the natural next step for students aiming at research, teaching (via UGC-NET) or diplomacy-adjacent careers. Others follow with a 3-year LLB for a law career, a Master of Business Administration (MBA) for a corporate/policy-consulting route, or move directly into UPSC/state PSC preparation, all of which build well on the degree's foundation in governance and institutions."
  - id: "proscons"
    hid: "pc-heading"
    eyebrow: "Honest take"
    heading: "Advantages and disadvantages"
    parts:
