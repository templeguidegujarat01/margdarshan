      - note: "Exemptions aren't automatic — you apply through ACCA's online exemption calculator with your transcripts, and you still pay an exemption fee per paper (roughly £86 for Applied Knowledge, £111–114 for Applied Skills) rather than the full exam fee. Even with maximum exemptions, sitting a couple of the \"skippable\" papers instead is a legitimate strategy some candidates use to build exam technique before the harder Strategic Professional papers."
