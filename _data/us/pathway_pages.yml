physical-therapy:
  intro: "Physical therapy helps people recover movement and manage pain after injuries, surgery or illness. U.S. physical therapists earn a Doctor of Physical Therapy (DPT) after college and must pass a national exam and get a state license."
  study: "Pre-PT prerequisites (anatomy and physiology, biology, chemistry, physics, psychology, statistics), then the DPT: biomechanics, neuroscience, kinesiology, clinical reasoning and supervised clinical rotations."
  hs: ["Biology, anatomy or health science", "Physics and chemistry", "Sports, coaching or anything that builds people skills", "Volunteering or observing in a PT clinic"]
  majors: ["Exercise science or kinesiology", "Biology", "Any major with the DPT prerequisites"]
  route:
    - "High school|Science and people|Biology, physics and time with patients or athletes."
    - "College|Bachelor's + prerequisites|Most DPT programs require observation hours."
    - "DPT|Doctor of Physical Therapy|Typically 3 years at a CAPTE-accredited program."
    - "Exam|NPTE|National exam by FSBPT; all jurisdictions use the same passing standard."
    - "Goal|State license|Optional residency (about 1 year) to specialize."
  key_numbers:
    - { label: "Projected growth 2025–35", value: "+12%", note: "Much faster than average", source: bls_ooh }
