  - id: "future"
    hid: "future-heading"
    eyebrow: "Looking ahead"
    heading: "Future scope & the impact of AI"
    parts:
      - prose:
          - "The deeper accounting, tax and finance grounding that Honours provides tends to age well against automation, since routine data-entry work is what's most exposed to Artificial Intelligence (AI) tools — not the analytical and judgment-based skills Honours emphasises. Demand for genuinely strong finance and accounting talent, particularly for roles that blend commerce knowledge with data analysis, has stayed resilient."
          - "Students who pair their B.Com Honours with modern tools — Excel/Power BI, basic data analytics, or a professional qualification — consistently see the strongest outcomes, rather than relying on the degree title alone."
