  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Is a BSc Biotechnology degree alone enough to get a good job?"
            a: "Not usually a well-paying one, honestly. The gap between a plain BSc Biotechnology degree and meaningful, well-paying employment is genuinely wider here than in many other science disciplines. Without a deliberate specialisation (MSc or PhD) or a clear alternate path like Regulatory Affairs or Clinical Research, many BSc graduates land in modest-paying quality control or lab technician roles, commonly ₹2.5-4 LPA."
          - q: "Do I need an MSc or PhD to succeed in biotechnology?"
            a: "For research-heavy roles like drug discovery and development, generally yes — these typically require an MSc at minimum, usually a PhD. However, Regulatory Affairs and Clinical Research Associate roles are reported as well-compensated, critical-path careers that don't require a PhD, making them genuine alternate routes for graduates who don't want to pursue a full doctorate."
          - q: "What is a realistic Biotechnology salary in India?"
            a: "Freshers with an unspecialised BSc commonly earn ₹2.5-4 LPA in quality control or lab technician roles. With specialisation, internships, or a BTech instead of BSc, this commonly rises to ₹4-7 LPA. Regulatory Affairs and Clinical Research Associate roles are reported to reach ₹6-15 LPA at mid-career without needing a PhD, while PhD-holders in research roles commonly start above ₹10 LPA with research stipends."
          - q: "What are the best career paths in biotechnology that don't require a PhD?"
            a: "Regulatory Affairs — preparing drug approval dossiers for agencies like India's DCGI, the US FDA, or Europe's EMA — is reported as a well-compensated, critical-path role reaching ₹6-15 LPA at mid-career. Clinical Research, working as a Clinical Research Associate monitoring trial sites (requiring GCP certification, not a PhD), is another fast-growing path within India's substantial clinical research industry."
          - q: "Is NEET required for Biotechnology?"
            a: "No. Admission is via CUET, university-specific entrance exams, state-level admissions, or direct Class 12 merit, depending on the institute — NEET is not required."
      - note: "Figures are indicative (2026) — confirm on the official college or authority website."
        class: "table-note mt-lg"
