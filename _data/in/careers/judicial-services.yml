  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What are Judicial Services?"
    parts:
      - overview:
          points:
            - "Judicial Services refers to the state-level recruitment process through which law graduates are appointed as <strong>Civil Judges (Junior Division)</strong>, the entry point into India's subordinate judiciary."
            - "Each state conducts its own exam — commonly called the PCS-J (Provincial Civil Services - Judicial) or Judicial Services Examination — through its Public Service Commission or under High Court supervision, since there's no single all-India judiciary exam like Union Public Service Commission (UPSC)."
            - "Once appointed, a Civil Judge presides over cases within their jurisdiction and progresses through a structured career ladder within the subordinate judiciary, eventually becoming eligible for elevation to more senior judicial positions with experience."
