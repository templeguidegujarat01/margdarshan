  - id: "faq"
    hid: "faq-heading"
    alt: true
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "What is the difference between a translator and an interpreter?"
            a: "A translator works with written text, converting documents, books or content from one language to another, usually with time to research and refine. An interpreter works with spoken language in real time, at meetings, conferences or courtrooms, requiring quick thinking under pressure. The skill sets overlap but are genuinely different in practice."
          - q: "Do I need a specific degree to become a translator or interpreter?"
            a: "Not one fixed degree, but you do need demonstrable, certified proficiency in at least one foreign or classical language beyond your native language(s). This can come from a BA in that language, a diploma from a language institute (like Alliance Française or Goethe-Institut), or an internationally recognised proficiency certification."
          - q: "Which languages are most in demand for translators in India?"
            a: "French, German, Spanish, Japanese, Chinese (Mandarin) and Korean are commonly in demand for business, diplomatic and localisation work, alongside strong ongoing demand for translation between English and major Indian regional languages for government, media and publishing needs."
          - q: "Can I become a conference interpreter without formal interpreter training?"
            a: "It's uncommon. Simultaneous conference interpreting is a specialised skill usually built through dedicated interpreter training programmes (like those at Jawaharlal Nehru University or specialised institutes), not just general language fluency — it requires distinct techniques beyond simply knowing both languages well."
          - q: "How much do translators and interpreters earn in India?"
            a: "It varies by language, specialisation and whether you're salaried or freelance. Rarer languages and specialised fields like legal or medical translation typically command higher rates, while conference interpreters at high-profile international events can earn significantly more per assignment than general document translators."
      - note: "*Salary figures are indicative, based on publicly available information as of 2026, and vary significantly by language, specialisation and work arrangement."
        class: "table-note mt-lg"
