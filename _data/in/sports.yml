  # ------------------------------------------------------------------------------------------------ Archery
  - slug: archery
    short: "Archery"
    domain: solo
    checked: 2026-10-16
    body: "World Archery · Archery Association of India (AAI)"
    card: "World Archery's 2026 bow and arrow rules, the 70 m / 50 m rounds, the LA28 events and minimum scores, compound's Olympic debut, SAI archery centres, the Archery Premier League, awards and jobs."
    card_facts: ["Recurve 70 m · compound 50 m", "Compound peak draw ≤ 60 lb", "LA28 MQS: 650 / 620 recurve"]
    eyebrow: "Sports Cockpit · Solo, Track &amp; Pool · World Archery rules Jan 2026 · LA28 qualification"
    title: "Archery — bow rules, distances &amp; the road to LA28"
    lede: "Education Margdarshan's archery map for India: what a recurve, compound and barebow archer may legally shoot under World Archery's January 2026 rule books, the distances and target faces, how matches are scored, the six LA28 events and the minimum scores to get there, the SAI centres and the Archery Premier League, who pays, and the awards and jobs after a medal."
    official:
      - { label: "World Archery Book 3 — Target Archery, 27 Jan 2026 (PDF)", url: "https://extranet.worldarchery.sport/documents/index.php/Rules/Rule_Book_versions/2026-01-27/EN-Book_3_-_2026-01-27_Version.pdf" }
      - { label: "worldarchery.sport", url: "https://www.worldarchery.sport/" }
    facts:
      - { label: "Olympic distance", value: "<strong>Recurve 70 m</strong> · compound 50 m", source: wa-book2 }
      - { label: "Compound bow limit", value: "<strong>Peak draw weight ≤ 60 lb</strong>", source: wa-book3 }
      - { label: "Arrow shaft", value: "<strong>Max 9.3 mm</strong> diameter, point max 9.4 mm", source: wa-book3 }
      - { label: "LA28 minimum score", value: "<strong>650 men · 620 women</strong> (recurve, 70 m)", source: wa-la28 }
    sections:
      - id: rules
        nav: "Bows &amp; rounds"
        eyebrow: "Core rules &amp; equipment standards"
        heading: "Recurve, compound and barebow — what you may shoot, and from how far"
        parts:
          - p: "World Archery's rule books in force are the <strong>27 January 2026</strong> versions. Book 3 (Target Archery) lists the equipment for each division; an archer caught using illegal equipment at any point of a tournament is <strong>disqualified and loses any position gained</strong>."
            source: wa-book3
          - table:
              caption: "The three divisions — equipment limits in Book 3"
              head: ["Division", "Bow", "Sight &amp; release", "Key limits"]
              rows:
                - ["<strong>Recurve</strong> (Olympic)", "Riser and two flexible limbs, drawn and released with the fingers", "<strong>One</strong> bow sight with a single sighting point; no release aid", "Book 3 sets no draw-weight cap for recurve"]
                - ["<strong>Compound</strong>", "Draw varied mechanically by pulleys or cams", "Sight with fibre-optic points allowed; a <strong>release aid</strong> may be used if not fixed to the bow", "<strong>Peak draw weight ≤ 60 lb</strong>"]
                - ["<strong>Barebow</strong>", "Recurve-type bow", "<strong>No sight</strong> allowed", "Bow with attachments must pass through a <strong>12.2 cm ring</strong>"]
            source: wa-book3
          - list:
              - "Arrow shafts: <strong>maximum 9.3 mm</strong> in diameter; points <strong>maximum 9.4 mm</strong>."
              - "Every arrow must carry the archer's <strong>name or initials</strong> on the shaft or wrap."
            source: wa-book3
          - table:
              caption: "Outdoor qualification rounds (72 arrows) and target faces"
              head: ["Distance", "Target face", "Who shoots it"]
              rows:
                - ["<strong>70 m</strong>", "122 cm", "Recurve men &amp; women, U21"]
                - ["60 m", "122 cm", "Recurve U18 and 50+"]
                - ["<strong>50 m</strong>", "80 cm (6-ring for matches)", "Compound — all classes except U15"]
                - ["50 m", "122 cm", "Barebow — all classes except U15"]
                - ["40 m / 30 m", "122 cm or 80 cm", "U15 recurve and compound (40 m), U15 barebow (30 m)"]
                - ["18 m (indoor)", "40 cm", "All divisions, 60 arrows"]
            source: wa-book2
          - list:
              - "<strong>Recurve and barebow matches use set play</strong>: win an end = 2 set points, a tie = 1 each; the first archer to <strong>6 set points</strong> wins (teams: first to 5)."
              - "<strong>Compound matches are cumulative</strong>: the total score over the ends decides."
              - "Time: <strong>20 seconds per arrow</strong> in alternate shooting and all team and mixed-team matches; 30 or 40 seconds per arrow when archers shoot together, depending on the event."
            source: wa-book3
      - id: recognition
        nav: "Recognition"
        eyebrow: "Institutional &amp; global recognition"
        heading: "Olympics, Asian Games, World Championships — and India's archery league"
        parts:
          - table:
              caption: "LA28 Olympic archery (version 10 August 2026)"
              head: ["Rule", "What it says"]
              rows:
                - ["Events", "Recurve individual (M/W), recurve team (M/W), recurve mixed team and — new — <strong>compound mixed team</strong>"]
                - ["Places", "116 quota + 8 host + 4 universality = <strong>128 archers</strong> (64 men, 64 women)"]
                - ["Per country", "Up to 3 (+1) per gender, <strong>8 in all</strong>; at most <strong>one compound mixed team</strong>"]
                - ["Minimum score (MQS)", "Recurve 70 m round: <strong>650 men, 620 women</strong>. Compound 50 m round: <strong>690 men, 670 women</strong>"]
                - ["MQS window", "From the first day of the Asian Games archery event, at a World Archery-registered event"]
                - ["Routes", "2027 World Championships (Medellín, 20–27 Sep 2027), continental championships and games, final qualification tournaments, host and universality places"]
            source: wa-la28
          - p: "At the <strong>Asian Games 2026</strong> in Japan, <strong>Sahil Jadhav and Chikitha Taniparthi</strong> won compound mixed-team gold and with it a <strong>2028 Olympic quota place</strong>; the women's compound team (Jyothi Surekha Vennam, Chikitha Taniparthi, Prithika Pradeep) also won gold."
            source: air-ag26
          - table:
              caption: "Government cash award for a senior archery medal (₹ lakh)"
              head: ["Event", "Gold", "Silver", "Bronze"]
              rows:
                - ["<strong>Olympic Games</strong>", "75", "50", "30"]
                - ["Asian Games / Commonwealth Games", "30", "20", "10"]
                - ["World Championship (biennial)", "20", "14", "8"]
                - ["Asian Championship (biennial)", "7.5", "5", "2.5"]
            source: myas-cash
          - note: "In a team event each member gets <strong>75%</strong> of the individual amount; the coach of an individual medallist gets 50%. Apply on the DBT-MIS portal within six months."
            source: myas-cash
          - p: "The <strong>Archery Premier League</strong>, started by the Archery Association of India with the Government of Telangana, runs six mixed-gender franchise teams; its second season (Hyderabad, <strong>8–18 October 2026</strong>) has 36 Indian and 12 international archers and a <strong>15-second shot clock</strong> — five seconds quicker than standard Olympic timing. Delhi will host the second leg of the <strong>Asia Cup 2027</strong>, India's first big international archery event since 2005."
            source: "air-apl,air-asiacup"
      - id: eligibility
        nav: "Age &amp; testing"
        eyebrow: "Physical benchmarks &amp; NADA clearance"
        heading: "Age classes, age tests and anti-doping"
        parts:
          - table:
              caption: "World Archery age classes"
              head: ["Class", "You may shoot it"]
              rows:
                - ["U15", "Up to and in the year of your 14th birthday"]
                - ["<strong>U18</strong>", "Up to and in the year of your <strong>17th</strong> birthday"]
                - ["<strong>U21</strong>", "Up to and in the year of your <strong>20th</strong> birthday"]
                - ["50+", "From the year of your 50th birthday"]
            source: wa-book2
          - list:
              - "SAI's <strong>Age Verification Test</strong> applies to boys up to 17 and girls up to 15: a doctor's physical examination, a dentist's examination and an X-ray (TW3 method) — the age certificate is signed by all three experts and matched against the claimed age."
              - "Bring a birth certificate, matriculation certificate, passport or Aadhaar. An athlete who disagrees can appeal to the <strong>Medical Appellate Board at AIIMS New Delhi</strong>. Fee: ₹1,000 per opinion plus ₹1,000 per X-ray opinion."
            source: sai-avt
          - list:
              - "Archery has no weight or height test, but SAI centres admit trainees only after <strong>anthropometric, physiological and psychological tests</strong> and a battery of tests — there is no direct admission."
            source: sai-schemes
          - list:
              - "Every LA28 archer must follow the <strong>World Anti-Doping Code</strong>. In India you must be available for testing in and out of competition and check every medicine against the <strong>Prohibited List</strong>; if no permitted treatment exists, apply to NADA for a <strong>TUE</strong>."
            source: "wa-la28,nada-rr"
      - id: roadmap
        nav: "Roadmap"
        eyebrow: "Grassroots-to-elite residential pipeline"
        heading: "From the school range to the national camp"
        parts:
          - table:
              caption: "The archery ladder"
              head: ["Step", "Age", "What happens"]
              rows:
                - ["1. Talent hunt", "9–18", "SAI's <strong>KIRTI</strong> tests children at 174 Talent Assessment Centres"]
                - ["2. District &amp; State", "10–18", "Top 3 at district or state championships may enter SAI selection trials"]
                - ["3. SAI Training Centre", "12–18", "Up to 8th at Sub-Junior/Junior Nationals, or top 3 in the state, plus a battery of tests"]
                - ["4. Nationals &amp; Khelo India", "U15 to U21", "National championships of the Archery Association of India; Junior Nationals and Khelo India Games medals count for jobs"]
                - ["5. SAI NCOE", "Scouted", "Residential training at an archery NCOE with coaches, sports science and diet"]
                - ["6. Selection trials &amp; national camp", "Senior", "Trials pick the squads for World Cups, Asian Games and LA28 qualifiers"]
            source: "pib-transform,sai-schemes,dopt-2024"
          - list:
              - "You <strong>cannot apply</strong> to become a Khelo India athlete — scouts pick from recognised competitions; create your profile on the <strong>National Sports Repository System</strong> with age proof."
            source: kia-guide
          - list:
              - "Medals at the <strong>Khelo India Youth Games (above-18 category)</strong>, Junior Nationals and SGFI school games now count for central sports-quota jobs."
            source: dopt-2024
      - id: academies
        nav: "Centres"
        eyebrow: "Top elite academies &amp; cities"
        heading: "Where India's archers train"
        parts:
          - table:
              caption: "SAI National Centres of Excellence with archery"
              head: ["Centre", "Other sports there"]
              rows:
                - ["<strong>Kolkata</strong>, West Bengal", "Athletics, gymnastics, hockey, table tennis"]
                - ["<strong>Sonepat</strong>, Haryana", "Athletics, hockey, kabaddi, wrestling"]
                - ["Guwahati, Assam", "Athletics, boxing, cycling, fencing, football, taekwondo"]
                - ["Imphal, Manipur", "Athletics, cycling, fencing, football, hockey, judo, weightlifting, wushu"]
            source: sai-schemes
          - note: "Archery is one of SAI's <strong>13 priority disciplines</strong>. Archery also runs in SAI Training Centres and in STC extension centres at schools and colleges."
            source: sai-schemes
          - warn: "Education Margdarshan could not find an official Government file listing the Army Sports Institute's current disciplines or entry route, so it is not listed here. Ask the Army recruiting office directly."
      - id: costs
        nav: "Gear &amp; cost"
        eyebrow: "Equipment costs &amp; who pays"
        heading: "Bows, arrows and who pays the bills"
        parts:
          - list:
              - "A recurve archer needs a riser, limbs, string, <strong>one sight</strong>, stabilisers, finger tab and arrows within the 9.3 mm shaft limit; a compound archer adds a <strong>release aid</strong> and a bow that peaks at <strong>60 lb or less</strong>."
              - "Arrows wear out and must each be marked with your name or initials — budget for spares."
            source: wa-book3
          - note: "Education Margdarshan does not print shop prices — no governing body publishes them. Until a scheme picks you up, equipment is the family's or the academy's cost."
          - table:
              caption: "Who pays — archery ladder"
              head: ["Stage", "Paid by", "What you get"]
              rows:
                - ["SAI school (NSTC/extension) trainee", "Sports Authority of India", "Coaching while you study"]
                - ["SAI centre trainee", "Sports Authority of India", "Coaching, boarding, sports science, diet"]
                - ["Khelo India athlete", "Ministry of Youth Affairs &amp; Sports", "<strong>₹6.28 lakh a year</strong> incl. ₹1.20 lakh cash"]
                - ["Junior medal prospect", "TOPS Development Group", "₹25,000 a month"]
                - ["Olympic prospect", "TOPS Core Group", "<strong>₹50,000 a month</strong> + approved training plan"]
                - ["Athlete in hardship", "PDU National Welfare Fund", "Up to ₹2.50 lakh"]
            source: "sai-schemes,pib-support"
          - list:
              - "Calming or focus pills and powders are a doping risk: no supplement is 100% safe and <strong>strict liability</strong> applies — food first, with a certified nutritionist."
            source: nada-supp
      - id: earnings
        nav: "Earnings &amp; jobs"
        eyebrow: "Earning channels &amp; central job quotas"
        heading: "Awards, league seasons and sports-quota jobs"
        parts:
          - list:
              - "Archery is <strong>No. 1</strong> on the list of <strong>65 sports</strong> in the central sports quota for <strong>Group C</strong> posts, with up to 5 years' age relaxation (10 for SC/ST)."
              - "Medals at the Olympics, Asian Games, Commonwealth Games or World Championships can bring up to <strong>three out-of-turn promotions</strong>."
              - "These central instructions do not apply to Railways Services, the Department of Atomic Energy, the Department of Space and some DRDO technical services."
            source: dopt-2022
          - list:
              - "<strong>Archery Premier League</strong>: six franchises and 48 archers in season 2 — a paid league season on top of national-team work."
            source: air-apl
          - list:
              - "<strong>Pension to Meritorious Sportspersons</strong>: ₹12,000–20,000 a month after retirement."
              - "National Sports Awards — Khel Ratna, Arjuna, Dronacharya (coaches)."
            source: pib-support
      - id: traps
        nav: "Red flags"
        eyebrow: "Disqualification traps"
        heading: "Mistakes that cost an archer the tournament"
        parts:
          - list:
              - "<strong>Illegal equipment</strong> — a second sight, an oversized arrow or a compound bow over 60 lb means disqualification and loss of any position gained."
              - "<strong>Unmarked arrows</strong> — every arrow needs your name or initials."
            source: wa-book3
          - list:
              - "<strong>No MQS on record</strong> — even a quota place is useless if the archer has not shot the minimum score at a World Archery-registered event inside the window."
            source: wa-la28
          - list:
              - "<strong>Age fraud</strong> — the SAI age test (doctor, dentist, X-ray) catches it, and the AIIMS appeal is the only route to challenge it."
            source: sai-avt
