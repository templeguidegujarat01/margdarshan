<script>
(function(){
  "use strict";
  var root = document.documentElement;
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- Theme ---------- */
  var themeToggle = document.getElementById('themeToggle');
  function applyTheme(theme){
    if(!themeToggle) return;
    if(theme === 'dark'){ root.setAttribute('data-theme','dark'); themeToggle.setAttribute('aria-pressed','true'); }
    else { root.removeAttribute('data-theme'); themeToggle.setAttribute('aria-pressed','false'); }
  }
  var saved = null;
  try { saved = localStorage.getItem('md-theme'); } catch(e){}
  if(saved){ applyTheme(saved); }
  else if(window.matchMedia('(prefers-color-scheme: dark)').matches){ applyTheme('dark'); }
  if(themeToggle){
    themeToggle.addEventListener('click', function(){
      var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      applyTheme(next);
      try { localStorage.setItem('md-theme', next); } catch(e){}
    });
  }

  /* ---------- Streams dropdown (desktop) ---------- */
  var streamsBtn = document.getElementById('streamsBtn');
  var streamsMenu = document.getElementById('streamsMenu');
  function closeDropdown(){ if(streamsMenu && streamsBtn){ streamsMenu.hidden = true; streamsBtn.setAttribute('aria-expanded','false'); } }
  if(streamsBtn && streamsMenu){
    streamsBtn.addEventListener('click', function(){
      var open = streamsBtn.getAttribute('aria-expanded') === 'true';
      if(open){ closeDropdown(); } else { streamsMenu.hidden = false; streamsBtn.setAttribute('aria-expanded','true'); }
    });
    document.addEventListener('click', function(e){
      if(!streamsBtn.contains(e.target) && !streamsMenu.contains(e.target)){ closeDropdown(); }
    });
  }
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape'){ closeDropdown(); closeMobilePanel(); }
  });

  /* ---------- Mobile panel ---------- */
  var menuToggle = document.getElementById('menuToggle');
  var mobilePanel = document.getElementById('mobilePanel');
  function closeMobilePanel(){
    if(!mobilePanel || !menuToggle) return;
    mobilePanel.classList.remove('is-open');
    menuToggle.setAttribute('aria-expanded','false');
    menuToggle.setAttribute('aria-label','Open menu');
  }
  if(menuToggle && mobilePanel){
    menuToggle.addEventListener('click', function(){
      var open = mobilePanel.classList.toggle('is-open');
      menuToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
      menuToggle.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
    });
  }
  var mobileStreamsBtn = document.getElementById('mobileStreamsBtn');
  var mobileStreamsSub = document.getElementById('mobileStreamsSub');
  if(mobileStreamsBtn && mobileStreamsSub){
    mobileStreamsBtn.addEventListener('click', function(){
      var open = mobileStreamsSub.classList.toggle('is-open');
      mobileStreamsBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
  }

  /* ---------- Career search overlay (only present on index.html) ----------
     Opened from the header search icon, or by navigating to #careers
     (the header/footer "Explore Careers" links already use this hash). */
  var searchOverlay = document.getElementById('careers');
  var searchOverlayBackdrop = document.getElementById('searchOverlayBackdrop');
  var searchOverlayClose = document.getElementById('searchOverlayClose');
  var careerSearchInput = document.getElementById('careerSearch');

  function openCareerSearch(){
    if(!searchOverlay) return;
    searchOverlay.setAttribute('data-open', 'true');
    document.body.style.overflow = 'hidden';
    if(careerSearchInput){ setTimeout(function(){ careerSearchInput.focus(); }, reduceMotion ? 0 : 300); }
  }
  function closeCareerSearch(){
    if(!searchOverlay) return;
    searchOverlay.setAttribute('data-open', 'false');
    document.body.style.overflow = '';
  }

  var searchNavBtn = document.getElementById('searchNavBtn');
  if(searchNavBtn){ searchNavBtn.addEventListener('click', openCareerSearch); }
  if(searchOverlayBackdrop){ searchOverlayBackdrop.addEventListener('click', closeCareerSearch); }
  if(searchOverlayClose){ searchOverlayClose.addEventListener('click', closeCareerSearch); }
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && searchOverlay && searchOverlay.getAttribute('data-open') === 'true'){ closeCareerSearch(); }
  });
  if(searchOverlay && window.location.hash === '#careers'){ openCareerSearch(); }
  window.addEventListener('hashchange', function(){
    if(window.location.hash === '#careers'){ openCareerSearch(); }
  });

  /* ---------- Career search + filter (only present on index.html) ----------
     Idle by default (no query, "All" filter) so the homepage doesn't dump
     50+ cards on load — results only render once the person searches or
     picks a category. */
  var searchInput = document.getElementById('careerSearch');
  var tabs = document.querySelectorAll('.tab-btn');
  var items = document.querySelectorAll('.career-item');
  var noResults = document.getElementById('noResults');
  var countEl = document.getElementById('explorerCount');
  var searchPrompt = document.getElementById('searchPrompt');
  var activeFilter = 'all';

  function refineCareers(){
    if(!items.length) return;
    var q = searchInput ? searchInput.value.trim().toLowerCase() : '';
    var isIdle = (q === '' && activeFilter === 'all');
    var visible = 0;
    items.forEach(function(item){
      var text = item.textContent.toLowerCase();
      var matchesCategory = activeFilter === 'all' || item.dataset.category === activeFilter;
      var matchesQuery = q === '' || text.indexOf(q) !== -1;
      var show = !isIdle && matchesCategory && matchesQuery;
      item.hidden = !show;
      if(show) visible++;
    });
    if(searchPrompt) searchPrompt.hidden = !isIdle;
    if(noResults) noResults.hidden = isIdle || visible !== 0;
    if(countEl) countEl.textContent = isIdle ? '' : (visible + (visible === 1 ? ' career guide shown' : ' career guides shown'));
  }

  if(searchInput){ searchInput.addEventListener('input', refineCareers); }
  if(tabs.length){
    tabs.forEach(function(tab){
      tab.addEventListener('click', function(){
        tabs.forEach(function(t){ t.setAttribute('aria-selected','false'); });
        tab.setAttribute('aria-selected','true');
        activeFilter = tab.dataset.filter;
        refineCareers();
      });
    });
  }
  if(items.length && (searchInput || tabs.length)){ refineCareers(); }

  /* ---------- FAQ accordion ---------- */
  document.querySelectorAll('.faq-item').forEach(function(faqItem){
    var btn = faqItem.querySelector('.faq-q');
    if(!btn) return;
    btn.addEventListener('click', function(){
      var isOpen = faqItem.getAttribute('data-open') === 'true';
      var panel = faqItem.querySelector('.faq-a');
      if(isOpen){
        faqItem.setAttribute('data-open','false');
        btn.setAttribute('aria-expanded','false');
        if(panel) panel.style.maxHeight = null;
      } else {
        faqItem.setAttribute('data-open','true');
        btn.setAttribute('aria-expanded','true');
        if(panel) panel.style.maxHeight = panel.scrollHeight + 24 + 'px';
      }
    });
  });

  /* ---------- Scroll progress + back to top ---------- */
  var progressBar = document.getElementById('progressBar');
  var backToTop = document.getElementById('backToTop');
  function onScroll(){
    var scrollTop = window.scrollY;
    var docHeight = document.documentElement.scrollHeight - window.innerHeight;
    var pct = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
    if(progressBar) progressBar.style.width = pct + '%';
    if(backToTop) backToTop.classList.toggle('is-visible', scrollTop > 500);
  }
  window.addEventListener('scroll', onScroll, {passive:true});
  onScroll();
  if(backToTop){
    backToTop.addEventListener('click', function(){
      window.scrollTo({top:0, behavior: reduceMotion ? 'auto' : 'smooth'});
    });
  }

  /* ---------- Reveal on scroll ---------- */
  var revealEls = document.querySelectorAll('.reveal');
  if(revealEls.length){
    if(reduceMotion || !('IntersectionObserver' in window)){
      revealEls.forEach(function(el){ el.classList.add('is-visible'); });
    } else {
      var observer = new IntersectionObserver(function(entries){
        entries.forEach(function(entry){
          if(entry.isIntersecting){ entry.target.classList.add('is-visible'); observer.unobserve(entry.target); }
        });
      }, {threshold:.12});
      revealEls.forEach(function(el){ observer.observe(el); });
    }
  }

  /* ---------- Read More / Read Less for long plain-text prose blocks ----------
     Auto-detects genuine long-form paragraph sections (e.g. "What is CA?")
     without touching tables, lists, FAQs, myth/fact, pros/cons, cards or
     roadmaps, since those never use a bare .prose block containing only
     <p> tags. Height is measured from real line-height so it works at any
     font-size/viewport instead of a fixed pixel cutoff. */
  function initReadMore(){
    var LINES_VISIBLE = 3;      // collapsed preview height
    var LINE_THRESHOLD = 5;     // only collapse if longer than this
    var blocks = document.querySelectorAll('.prose');
    blocks.forEach(function(block){
      // Only target plain paragraph content: skip anything with lists,
      // tables, or other structured/nested content.
      if(block.querySelector('ul,ol,table,div')) return;
      var paras = block.querySelectorAll('p');
      if(!paras.length) return;

      var lineHeight = parseFloat(getComputedStyle(block).lineHeight);
      if(!lineHeight || isNaN(lineHeight)){
        lineHeight = parseFloat(getComputedStyle(block).fontSize) * 1.5;
      }
      var fullHeight = block.scrollHeight;
      var thresholdHeight = lineHeight * LINE_THRESHOLD;
      if(fullHeight <= thresholdHeight) return; // short block, leave untouched

      var collapsedHeight = lineHeight * LINES_VISIBLE;
      block.classList.add('js-readmore');
      block.style.maxHeight = collapsedHeight + 'px';

      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'readmore-btn';
      btn.setAttribute('aria-expanded', 'false');
      btn.innerHTML = '<span class="rm-label">Read more</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
      block.insertAdjacentElement('afterend', btn);

      btn.addEventListener('click', function(){
        var expanded = block.classList.toggle('is-expanded');
        var label = btn.querySelector('.rm-label');
        if(expanded){
          block.style.maxHeight = fullHeight + 'px';
          btn.setAttribute('aria-expanded', 'true');
          if(label) label.textContent = 'Read less';
        } else {
          block.style.maxHeight = collapsedHeight + 'px';
          btn.setAttribute('aria-expanded', 'false');
          if(label) label.textContent = 'Read more';
          block.scrollIntoView({behavior: reduceMotion ? 'auto' : 'smooth', block: 'nearest'});
        }
      });
    });
  }
  if(document.readyState === 'complete'){ initReadMore(); }
  else { window.addEventListener('load', initReadMore); }
})();
</script>
