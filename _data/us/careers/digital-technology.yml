# 2025, jobs 2025, outlook 2025–35; pages last modified 27 Aug 2026) and the certification owners (CompTIA, ISC2,
# NCEES) in _data/us/sources.yml. No job in this cluster needs a state license; certifications are voluntary unless an
# employer asks for them, and `certs[].kind` says so. A `pathway:` entry keeps its existing us/careers/<pathway>/ page
