            source: sai-schemes
          - list:
              - "You must be available for testing in and out of competition and check every medicine against the <strong>Prohibited List</strong>; if no permitted treatment exists, apply to NADA for a <strong>TUE</strong>."
            source: nada-rr
      - id: roadmap
        nav: "Roadmap"
        eyebrow: "Grassroots-to-elite residential pipeline"
        heading: "From the school court to the national team"
        parts:
          - table:
              caption: "The basketball ladder"
              head: ["Step", "Age", "What happens"]
              rows:
                - ["1. Talent hunt", "9–18", "SAI's <strong>KIRTI</strong> tests children at 174 Talent Assessment Centres"]
                - ["2. SAI-adopted school (NSTC)", "School age", "Basketball is one of the 9 sports in SAI's regular schools scheme"]
                - ["3. State team &amp; age-group Nationals", "U13 to U18", "State associations pick teams for the BFI Sub-Junior, Youth and Junior Nationals"]
                - ["4. SAI Training Centre", "12–18", "Top-4 team at Sub-Junior/Junior Nationals or top-2 at the State championship, plus tests"]
                - ["5. U23, Senior &amp; 3x3 Nationals", "U23 / Open", "The pool from which national camps are drawn"]
            source: "pib-transform,sai-schemes,bfi-cal"
          - list:
              - "Being part of a team that finishes in the <strong>first four at Sub-Junior or Junior Nationals</strong>, first two at inter-zonal/inter-university/SGFI, or first two at the State championship qualifies you for SAI Training Centre trials."
            source: sai-schemes
          - list:
