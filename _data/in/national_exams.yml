  # ---------------------------------------------------------------- UPSC CMS
  - slug: upsc-cms
    short: "UPSC CMS"
    stream: govt
    body: "Union Public Service Commission (UPSC)"
    eyebrow: "Recruitment Exam · Government doctors · 2026 cycle"
    title: "UPSC CMS — eligibility, age limits, exam scheme & pay"
    lede: "The UPSC exam that recruits MBBS doctors as Medical Officers in the Central Health Service, Assistant Divisional Medical Officers in the Railways, and General Duty Medical Officers in NDMC and MCD."
    colleges_href: "colleges-mbbs.html"
    facts:
      - { label: "Conducted by", value: "Union Public Service Commission (UPSC)", source: cms26 }
      - { label: "Vacancies (2026)", value: "1,358 tentative across four services", source: cms26 }
      - { label: "Written exam", value: "2 papers × 250 marks · 2 hours each", source: cms26 }
      - { label: "Age on 1 Aug 2026", value: "Under 32 (CHS posts: up to 35)", source: cms26 }
    official:
      - { label: "CMS 2026 notice (PDF)", url: "https://www.upsc.gov.in/sites/default/files/Notification-CMSE-2026-English-110326.pdf" }
      - { label: "upsconline.nic.in", url: "https://upsconline.nic.in/" }
    sections:
      - id: overview
        nav: "Overview"
        eyebrow: "Overview &amp; governing authority"
        heading: "Who runs CMS, and which posts it fills"
        parts:
          - p: "The Combined Medical Services Examination (CMS) is held by the <strong>Union Public Service Commission (UPSC)</strong>. The 2026 notice is Examination Notice No. 9/2026-CMS, dated 11 March 2026. One application covers all the posts; you give your service preferences later."
            source: cms26
          - table:
              caption: "CMS 2026 tentative vacancies"
              head: ["Category", "Post", "Vacancies"]
              rows:
                - ["Category-I", "Medical Officers Grade, General Duty Medical Officers Sub-cadre, Central Health Service", "864"]
                - ["Category-II", "Assistant Divisional Medical Officer, Railways", "450"]
                - ["Category-II", "General Duty Medical Officer, New Delhi Municipal Council", "14"]
                - ["Category-II", "General Duty Medical Officer Grade-II, Municipal Corporation of Delhi", "30"]
            source: cms26
          - table:
              caption: "CMS 2026 calendar"
              head: ["Event", "Date"]
              rows:
                - ["Notification", "11 Mar 2026"]
                - ["Last date to apply", "31 Mar 2026"]
                - ["Written exam", "2 Aug 2026"]
            source: cms26
          - note: "On 2 August 2026, Paper I ran 9:30–11:30 AM and Paper II 2:00–4:00 PM."
            source: cms-tt
          - p: "The written result came out on <strong>1 September 2026</strong>, and Personality Tests for <strong>2,842 candidates</strong> began on <strong>12 October 2026</strong>."
            source: cms-pt
          - warn: "The CMS 2027 notice was not published on 14 October 2026 (the 2026 notice came out in March), so this page describes the 2026 cycle. Check upsc.gov.in for the 2027 dates, vacancies and rules."
      - id: eligibility
        nav: "Eligibility"
        eyebrow: "Academic eligibility"
        heading: "MBBS is the only qualifying degree"
        parts:
          - list:
              - "You must have passed the <strong>written and practical parts of the final M.B.B.S. examination</strong>."
              - "Students who have appeared, or are yet to appear, in final MBBS may apply provisionally; proof of passing must be uploaded in the 15-day window after the written result."
              - "<strong>Internship:</strong> a candidate still doing the compulsory rotating internship may sit the exam, but is appointed only after completing it."
              - "Only a degree certificate, final marksheet or provisional degree certificate issued by the competent authority is accepted as proof."
            source: cms26
          - note: "Physical and medical standards in Appendix III of the CMS Rules apply to every candidate."
            source: cms26
      - id: scheme
        nav: "Exam scheme"
        eyebrow: "Exam scheme &amp; marking matrix"
        heading: "A 500-mark written test, then a 100-mark interview"
        parts:
          - table:
              caption: "CMS 2026 plan of examination"
              head: ["Part", "Paper", "Questions", "Duration", "Marks"]
              rows:
                - ["Written", "Paper I — General Medicine (96) &amp; Paediatrics (24)", "120", "2 hours", "250"]
                - ["Written", "Paper II — Surgery, Gynaecology &amp; Obstetrics, Preventive &amp; Social Medicine (40 each)", "120", "2 hours", "250"]
                - ["Personality Test", "Interview", "—", "—", "100"]
                - ["Total", "", "", "", "600"]
            source: cms26
          - table:
              caption: "Marking in both papers (objective, multiple choice)"
              head: ["Response", "Marks"]
              rows:
                - ["Correct answer", "Marks assigned to the question"]
                - ["Wrong answer", "One-third (0.33) of the question's marks deducted"]
                - ["More than one answer marked", "Treated as wrong — same penalty"]
                - ["Left blank", "0 (no penalty)"]
            source: cms26
          - list:
              - "Both papers are of <strong>MBBS standard</strong>, set in English only. No calculators."
              - "UPSC may fix qualifying marks in either or both papers; only those who qualify are called to the interview."
              - "<strong>Tie-break:</strong> higher written total, then the older candidate, then the earlier internship completion date."
            source: cms26
      - id: reservation
        nav: "Age &amp; relaxations"
        eyebrow: "Age limits &amp; category relaxations"
        heading: "Under 32 on 1 August 2026, with fixed relaxations"
        parts:
          - p: "You must not have reached <strong>32 years on 1 August 2026</strong> — born on or after <strong>2 August 1994</strong>. For Medical Officers in the <strong>Central Health Service</strong>, the upper limit is <strong>35 years</strong> on the same date. The notice sets no lower age limit."
            source: cms26
          - table:
              caption: "Relaxation of the upper age limit"
              head: ["Category", "Relaxation", "Highest limit (32 base · CHS 35 base)"]
              rows:
                - ["SC / ST", "Up to 5 years", "37 · 40"]
                - ["OBC (eligible for reservation)", "Up to 3 years", "35 · 38"]
                - ["Defence personnel disabled in hostilities / disturbed areas and released", "Up to 3 years", "35 · 38"]
                - ["Ex-servicemen incl. Commissioned Officers and ECOs/SSCOs with 5 years' service by 1 Aug 2026", "Up to 5 years", "37 · 40"]
                - ["ECOs/SSCOs with extended assignment and an MoD certificate", "Up to 5 years", "37 · 40"]
                - ["PwBD (benchmark disabilities under Section 34, RPwD Act 2016)", "Up to 10 years", "42 · 45"]
            source: cms26
          - list:
              - "SC, ST and OBC candidates who are also ex-servicemen or PwBD get the relaxations <strong>added together</strong>."
              - "Reservation for SC, ST, OBC, EWS and PwBD is as fixed by the Government."
              - "PwBD vacancies in 2026: 34 in CHS, 18 in Railways (listed locomotor classes), 2 in MCD, none in NDMC."
            source: cms26
      - id: fees
        nav: "Application &amp; fees"
        eyebrow: "Application steps &amp; registration fee"
        heading: "Apply online at upsconline.nic.in — ₹200, many exempt"
        parts:
          - list:
              - "<strong>Step 1 — URN:</strong> create the one-time Universal Registration Number profile on upsconline.nic.in."
              - "<strong>Step 2 — Common Application Form:</strong> upload photograph, live photograph and signature, plus your date-of-birth, category and MBBS documents."
              - "<strong>Step 3 — Exam-specific form:</strong> choose the centre, pay the fee and submit. One application and one fee cover every CMS post."
              - "No addition, deletion or change after submission."
            source: cms26
          - table:
              caption: "CMS 2026 examination fee"
              head: ["Candidate", "Fee"]
              rows:
                - ["General, OBC and EWS (male)", "₹200"]
                - ["All female candidates", "Exempt (₹0)"]
                - ["SC / ST", "Exempt (₹0)"]
                - ["PwBD", "Exempt (₹0)"]
            source: cms26
          - note: "Pay by net banking, Visa / Master / RuPay credit or debit card, or UPI. OBC and EWS candidates get no fee exemption. The fee is not refunded or carried to another exam."
            source: cms26
      - id: horizons
        nav: "Pay &amp; cadre"
        eyebrow: "Pay scales &amp; cadre placement"
        heading: "Level 10 entry pay, plus Non-Practising Allowance"
        parts:
          - table:
              caption: "Entry pay and posting for each CMS post (7th CPC Pay Matrix)"
              head: ["Post", "Pay", "Allowance", "Posting &amp; probation"]
              rows:
                - ["Medical Officer, CHS (GDMO Sub-cadre)", "Level 10 · ₹56,100 – ₹1,77,500", "NPA as per Government orders", "Any CHS dispensary or hospital in India · 2 years"]
                - ["Assistant Divisional Medical Officer, Railways", "Level 10, Group A Junior Scale · ₹56,100 – ₹1,77,500", "NPA as per rules", "Railway health units; liable to transfer to any Railway · 1 year"]
                - ["General Duty Medical Officer, NDMC", "Level 10 · ₹56,100 – ₹1,77,500", "Restricted NPA", "NDMC hospitals, dispensaries and centres · 2 years"]
                - ["General Duty Medical Officer Gr-II, MCD", "Level 10, first cell · starts at ₹56,100", "NPA and admissible allowances", "MCD hospitals, dispensaries and PHCs · 2 years"]
            source: cms26
          - table:
              caption: "Promotion ladder for an NDMC General Duty Medical Officer"
              head: ["Grade", "Pay Matrix level", "Range"]
              rows:
                - ["Senior Medical Officer", "Level 11", "₹67,700 – ₹2,08,700"]
                - ["Chief Medical Officer", "Level 12", "₹78,800 – ₹2,09,200"]
                - ["CMO (Non-functional Selection Grade)", "Level 13", "₹1,18,500 – ₹2,14,100"]
                - ["Senior Administrative Grade", "Level 14", "₹1,44,200 – ₹2,18,200"]
            source: cms26
          - list:
              - "<strong>Private practice is prohibited</strong> in every CMS post, including lab and consultant practice in CHS."
              - "Railway ADMOs are under the Contributory Pension System (for entrants from 1 January 2004), get Railway passes, and must pass a Hindi exam during probation."
              - "Railway ADMOs may be required to serve up to four years in Defence-linked posts (not after ten years of service or, ordinarily, after age 45)."
            source: cms26
          - note: "These are basic pay ranges. In-hand pay adds DA, HRA, NPA and other allowances, which change over time and are not stated as amounts in the notice."
            source: cms26
          - links:
              - { label: "MBBS (Doctor)", url: "mbbs.html" }
              - { label: "NEET UG", url: "neet-ug.html" }
              - { label: "MBBS college finder", url: "colleges-mbbs.html" }
    sources:
      - { id: cms26, name: "UPSC — Combined Medical Services Examination 2026, Notice No. 9/2026-CMS (11 Mar 2026)", url: "https://www.upsc.gov.in/sites/default/files/Notification-CMSE-2026-English-110326.pdf", covers: "Vacancies, MBBS eligibility, age and relaxations, fee, application, plan of exam, marking, tie-break, pay and posting", checked: 2026-10-14 }
      - { id: cms-tt, name: "UPSC — CMS Examination 2026 Time Table", url: "https://www.upsc.gov.in/sites/default/files/TT-CMSE-2026-English-140526.pdf", covers: "2 August 2026 paper timings", checked: 2026-10-14 }
