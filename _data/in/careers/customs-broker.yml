sections:
  - id: "quick"
    hid: "quick-heading"
    alt: true
    eyebrow: "Quick answers"
    heading: "Customs Broker at a glance"
    intro: "Check whether your Class 12 background qualifies. Duration and pay are in the summary at the top of the page."
    parts:
      - subhead: "Can I apply from my stream?"
      - streams:
          - label: "Science"
            fit: "Eligible"
            tone: "y"
            icon: "science"
          - label: "Commerce"
            fit: "Eligible"
            tone: "y"
            icon: "commerce"
          - label: "Arts / Humanities"
            fit: "Eligible"
            tone: "y"
            icon: "arts"
      - note: "Any stream; Commerce helps with duties, invoices and accounts."
  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What does a Customs Broker do?"
    parts:
      - overview:
          points:
            - "Customs brokers classify goods under the tariff, calculate duty, file bills of entry and shipping bills, and deal with Customs officers on behalf of clients."
            - "They advise traders on licences, exemptions, free-trade-agreement benefits and compliance."
            - "Most work from port and airport cities, often with freight forwarders and logistics firms."
  - id: "who"
    hid: "who-heading"
    alt: true
    eyebrow: "Fit check"
    heading: "Who should become a Customs Broker"
    parts:
      - fit:
          match:
            - "Like rules, documents and problem-solving."
            - "Want to run your own trade-services business."
            - "Are based in (or willing to move to) a port or airport city."
          mismatch:
            - "Dislike regulatory detail and deadlines."
            - "Want a purely desk-based corporate job."
            - "Are not ready for a tough exam with limited attempts."
  - id: "eligibility"
    hid: "elig-heading"
    eyebrow: "Eligibility"
    heading: "What you need, stage by stage"
    parts:
      - elig_list:
          - "A <strong>graduate degree</strong>, or a professional qualification or customs-clearance diploma that the Regulations accept."
          - "Apply in response to the <strong>yearly notice</strong> through the Customs Commissionerate with jurisdiction."
          - "Pass the <strong>written exam</strong> and then the <strong>oral exam</strong>."
          - "Meet financial and fit-and-proper conditions for the licence; attempts are limited under the Regulations."
  - id: "roadmap"
    hid: "roadmap-heading"
    alt: true
    eyebrow: "Step-by-step"
    heading: "Your full path to becoming a Customs Broker"
    parts:
      - steps:
          - title: "Graduate"
            text: "Commerce, law or logistics helps."
          - title: "Work in customs clearance"
            text: "Many first work for a broker and learn on the job."
          - title: "Apply when NACIN invites"
            text: "Through your jurisdictional Customs Commissionerate."
          - title: "Written exam"
            text: "Customs law, tariff, procedures and allied laws."
          - title: "Oral exam"
            text: "Practical knowledge of clearance."
          - title: "Licence and practice"
            text: "Run a brokerage or work for logistics firms."
      - roadmap_card: "Customs Broker"
  - id: "exams"
    hid: "exams-heading"
    eyebrow: "Exams & licences"
    heading: "The CBLR licensing exam"
    parts:
      - chips:
          - label: "Written exam"
            text: "Objective exam on customs law and procedure; marks and pass rules are in the yearly notice."
            source: "cblr"
          - label: "Oral exam"
            text: "For those who pass the written exam."
            source: "cblr"
          - label: "Notice"
            text: "NACIN invites applications every year."
            source: "nacin"
  - id: "salary"
    hid: "salary-heading"
    alt: true
    eyebrow: "Indicative figures"
    heading: "Customs Broker pay in India"
    intro: "Pay varies a lot by employer, city and whether you practise independently; these are broad, commonly reported ranges, not guarantees."
    parts:
      - salary:
          - label: "Employee in a brokerage"
            value: "Entry level"
            text: "Clearance staff learn under a licensed broker."
          - label: "Licensed broker"
            value: "Business income"
            text: "Fees per shipment; grows with clients."
          - label: "Large brokerage / logistics"
            value: "High"
            text: "Firms serving big importers and exporters earn well."
  - id: "jobs"
    hid: "jobs-heading"
    eyebrow: "Where they work"
    heading: "Employers & growth path"
    parts:
      - chips:
          - label: "Employers"
            text: "Customs brokerages, freight forwarders, shipping lines, e-commerce and import-export firms"
          - label: "Growth path"
            text: "Clearance executive → licensed broker → own brokerage / logistics business"
          - label: "Related"
            text: "Trade compliance roles in manufacturing and e-commerce"
  - id: "proscons"
    hid: "pc-heading"
    alt: true
    eyebrow: "Honest take"
    heading: "Advantages and disadvantages"
    parts:
      - proscons:
          pros:
            - "Can build an independent business."
            - "Steady demand with India's trade growth."
            - "Open to graduates of any stream."
          cons:
            - "Tough exam with limited attempts."
            - "Port-city based."
            - "High compliance responsibility."
  - hid: "related-heading"
    alt: true
    eyebrow: "Related careers"
    heading: "If you're considering Customs Broker, also look at"
    parts:
      - related:
          - name: "B.Com"
            sub: "Commerce degree"
            href: "bcom.html"
          - name: "BBA"
            sub: "Business management"
            href: "bba.html"
          - name: "Travel & Tourism"
            sub: "Travel and logistics"
            href: "travel-tourism.html"
          - name: "Company Secretary (CS)"
            sub: "Compliance & corporate law"
            href: "cs.html"
  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Who conducts the customs broker exam?"
            a: "NACIN conducts it for CBIC under the Customs Brokers Licensing Regulations, 2018."
          - q: "Is there an oral exam?"
            a: "Yes. Candidates who pass the written exam take an oral exam."
          - q: "Can a fresher take the exam?"
            a: "If you meet the CBLR eligibility, yes; practical clearance experience makes passing much easier."
      - note: "*Pay figures are indicative unless they quote an official pay level, and rules change: confirm eligibility, dates and fees on the official websites listed under Sources before you act."
        class: "table-note mt-lg"
