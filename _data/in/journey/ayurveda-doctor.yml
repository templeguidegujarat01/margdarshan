# Journey Blueprint — Ayurveda Doctor (NEET-UG → BAMS). Printed on journey-ayurveda-doctor.html (_includes/journey-doubts.html).
# Rules, classes and the money items / sources several careers share: _data/in/journey_common.yml.
# `money_defs` / `sources` below are used only by this career. Check: node scripts/check-journey-matrix.mjs
id: ayurveda-doctor
v: 2
name: "Ayurveda Doctor (NEET-UG → BAMS)"
search: ["ayurvedic practitioner", "ayurvedic physician", "ayurvedic surgeon", "ayurveda doctor", "bams"]
search_not: ["pharmacist", "wellness consultant", "formulation", "research scientist"]
page: "bams.html"
roadmap: "roadmaps/bams.html"
doubts_page: "journey-ayurveda-doctor.html"
gate: "Class 12 with Physics, Chemistry and Biology (50% in PCB for General) → NEET (UG) → BAMS seat through AACCC (All India Quota) or your state's AYUSH counselling → 5½ years including a 12-month internship → registration on a State or the National Register for Indian System of Medicine → AIAPGET for MD / MS (Ayurveda)."
gate_source: [ncism-msr, neet-ib, aiap26]
core:
  what:
    text: "An Ayurveda doctor (Ayurvedacharya) diagnoses and treats patients using Ayurvedic principles, gives clinical care, keeps medical records and can run AYUSH health centres and national health programmes."
    source: upsc-adv06
  day:
    - "See patients in an OPD or your own clinic: ask about the illness, examine, decide the treatment and diet advice."
    - "Supervise therapies such as Panchakarma and prepare or prescribe Ayurvedic medicines."
    - "In government service: run an AYUSH dispensary or wing, keep records and help with health camps."
  pay:
    - { level: "Government entry (UPSC, 2026)", value: "Pay Level 9 (7th CPC) — Medical Officer (Ayurveda), UT of Ladakh, UPSC Advertisement 06/2026", source: upsc-adv06 }
  pay_note: "No official body publishes private-practice or senior Ayurveda doctor pay, so we print only a government entry level."
  routes:
    - { title: "Own clinic or hospital", text: "After BAMS, the internship and registration on a State or the National Register for Indian System of Medicine.", source: upsc-adv06 }
    - { title: "Government Medical Officer (Ayurveda)", text: "UPSC and state commissions recruit BAMS graduates who are enrolled on a State or National Register.", source: upsc-adv06 }
    - { title: "MD / MS (Ayurveda)", text: "AIAPGET, run by NTA, is the entrance for postgraduate Ayurveda seats.", source: aiap26 }
  cost_time:
    - { label: "BAMS", value: "5 years 6 months: three professional years of 18 months each + 12-month compulsory rotatory internship", source: ncism-msr }
    - { label: "NEET (UG) fee 2026", value: "₹1,700 General · ₹1,600 EWS / OBC-NCL · ₹1,000 SC / ST / PwBD / third gender", source: neet-ib }
    - { label: "AIAPGET fee 2026", value: "₹2,700 General · ₹2,450 EWS / OBC-NCL · ₹1,800 SC / ST / PwBD / third gender", source: aiap26 }
  cost_note: "College fees depend on the state fee committee and the college type, so we do not print one national figure."
  challenges:
    - text: "BAMS needs both the NEET qualifying percentile <strong>and 50% marks in Physics, Chemistry and Biology</strong> in Class 12 (40% for SC / ST / OBC, 45% for General candidates with a disability)."
      source: ncism-msr
    - text: "Every seat — government, private or management — is filled only through counselling. NCISM cancels any direct admission."
      source: ncism-msr
    - text: "AIAPGET cuts one mark for every wrong answer."
      source: aiap26
  not_for:
    - "You want to practise modern (allopathic) medicine — that needs MBBS."
    - "You are not ready for 5½ years of study and internship before you earn."
    - "You expect a fixed government job straight away — many Ayurveda doctors start in private practice."
journey:
  - stages: [c8, c9]
    title: "Science basics and curiosity about health"
    do:
      - text: "NEET (UG) is half Biology: <strong>90 of the 180 questions</strong>. Build your Science base from your board's textbooks."
        source: neet-ib
    doubts:
      - q: "Is NEET needed for BAMS?"
        a: "Yes. All BAMS seats, in every state and every kind of college, are filled through NEET (UG)."
        next: "Plan for NEET in your Class 12 year, just like MBBS aspirants."
        source: [neet-ib, ncism-msr]
      - q: "Is an Ayurveda doctor a real doctor?"
        a: "A BAMS graduate gets the Ayurvedacharya degree and, after registering on a State or National Register for Indian System of Medicine, can work as a Medical Officer (Ayurveda) and treat patients using Ayurveda."
        next: "Read the Routes list above to see where BAMS doctors work."
        source: [ncism-msr, upsc-adv06]
  - stages: [c10]
    title: "Choose Science with Biology"
    do:
      - text: "BAMS needs Class 12 with <strong>Physics, Chemistry and Biology</strong>."
        source: ncism-msr
    stream: "PCB. English is needed for NEET (UG) too."
    mistakes:
      - "Taking PCM and planning to switch later — BAMS needs Biology in Class 12."
    doubts:
      - q: "Do I need Sanskrit for BAMS?"
        a: "No subject rule asks for Sanskrit in Class 12 — you need Physics, Chemistry and Biology. Colleges may teach in Sanskrit, Hindi, a regional language or English; colleges admitting students from other states teach in English."
        next: "Pick PCB; Sanskrit is learned during the course."
        source: ncism-msr
      - q: "Can I join BAMS straight after Class 10?"
        a: "No. You need Class 12 with Physics, Chemistry and Biology, and a NEET (UG) rank."
        next: "Choose Science with Biology for Class 11."
        source: ncism-msr
  - stages: [c11, c12]
    title: "Class 12 marks + NEET + AYUSH counselling"
    do:
      - text: "Score at least <strong>50% in Physics, Chemistry and Biology together</strong> (40% SC / ST / OBC; 45% General with a disability) — this is on top of the NEET cut-off."
        source: ncism-msr
      - text: "You must be <strong>17 by 31 December</strong> of your admission year."
        source: [ncism-msr, neet-ib]
      - text: "After the result, register with <strong>AACCC</strong> (Ministry of Ayush) for All India Quota seats and with your state's AYUSH counselling for state seats."
        source: neet-ib
    exams:
      - { name: "NEET (UG) 2026", when: "Re-held 21 June 2026 · result 16 July 2026", source: [neet-re, neet-res] }
    money: [neet-fee, csss, pms-sc]
    mistakes:
      - "Looking only at the NEET percentile and forgetting the 50% PCB rule in Class 12."
      - "Paying a college for 'direct admission' — NCISM cancels any seat not given through counselling."
    late: "Missed the cut-off this year? NEET has no cap on attempts, so you can try again next year."
    doubts:
      - q: "What NEET percentile do I need for BAMS?"
        a: "The 50th percentile for General and EWS, the 40th for SC, ST and OBC; candidates with benchmark disabilities need the 45th (General / EWS) or 40th (SC / ST / OBC)."
        next: "Aim well above it — the percentile only makes you eligible."
        source: neet-ib
      - q: "How many marks do I need in Class 12 for BAMS?"
        a: "At least 50% in Physics, Chemistry and Biology taken together — 40% for SC, ST and OBC, and 45% for General candidates with a disability."
        next: "Protect your PCB marks as hard as your NEET score."
        source: ncism-msr
      - q: "Is there an upper age limit for BAMS?"
        a: "The NEET (UG) 2026 bulletin lists only a minimum age of 17 for BAMS, and Kerala's 2026 rules say no upper limit. NCISM's 2022 regulation had printed an upper limit of 25 (30 for reserved categories)."
        next: "If you are over 25, ask your state's AYUSH counselling body in writing before you plan."
        source: [neet-ib, ke-noti, ncism-msr]
      - q: "Who conducts BAMS counselling?"
        a: "AACCC, under the Ministry of Ayush, counsels All India Quota seats and central and deemed-university seats. Your state's AYUSH counselling body fills the state-quota seats."
        next: "Register with both."
        source: [neet-ib, ncism-msr]
      - q: "Can I get a BAMS seat by paying a donation?"
        a: "No. NCISM's rules say every seat, including management seats, must be given through central, state or UT counselling. Direct admissions are not approved and are cancelled."
        next: "Join only through the counselling portal."
        source: ncism-msr
  - stages: [ug]
    title: "In BAMS: three professional years, then a paid internship"
    do:
      - text: "BAMS has <strong>three professional years of 18 months each</strong>, then a <strong>12-month compulsory rotatory internship</strong>."
        source: ncism-msr
      - text: "Before the internship you need your provisional degree certificate and <strong>provisional registration</strong> from your State Board or Council."
        source: ncism-msr
      - text: "Interns in central, state and UT government institutions get a stipend <strong>at par with other medical systems</strong> in that government."
        source: ncism-msr
    money: [bams-intern]
    doubts:
      - q: "How long is BAMS?"
        a: "Five years and six months: 18 months for each of the three professional years, plus a 12-month compulsory rotatory internship."
        next: "Plan for about 5½ years before you can practise."
        source: ncism-msr
      - q: "Do BAMS interns get a stipend?"
        a: "In central, state and UT government institutions, yes — at par with interns of other medical systems in that government. The rules print no national amount."
        next: "Ask your college what its government pays."
        source: ncism-msr
  - stages: [grad]
    title: "Register, then practise or go for MD / MS"
    do:
      - text: "Enrol on a <strong>State Register or the National Register for Indian System of Medicine</strong> — government posts ask for it."
        source: upsc-adv06
      - text: "For MD / MS (Ayurveda), sit <strong>AIAPGET</strong>: 120 questions, 480 marks, 2 hours, +4 / −1, in Hindi or English for Ayurveda."
        source: aiap26
    exams:
      - { name: "AIAPGET 2026", when: "Applications 10–30 July 2026 · exam 22 August 2026", source: aiap26 }
    doubts:
      - q: "How do I do MD in Ayurveda?"
        a: "Through AIAPGET, run by NTA. You need a recognised BAMS, a permanent or provisional registration and the one-year internship done by the notified cut-off date."
        next: "Start AIAPGET practice during your internship."
        source: aiap26
      - q: "In which language can I write AIAPGET?"
        a: "For Ayurveda, in Hindi or English. If a translated question is unclear, the English version is final."
        next: "Practise in the language you will choose on the form."
        source: aiap26
      - q: "How do I get a government job as an Ayurveda doctor?"
        a: "Watch UPSC and your state commission for Medical Officer (Ayurveda) posts. In UPSC Advertisement 06/2026 the post needed a BAMS and enrolment on a State or National Register, at Pay Level 9."
        next: "Keep your registration certificate ready."
        source: upsc-adv06
  - stages: [work]
    title: "Starting late"
    do:
      - text: "NEET (UG) itself has no upper age limit, but check your state's BAMS age rule before you plan (see the age doubt above)."
        source: neet-ib
    doubts:
      - q: "I already have a B.Sc. Can I still do BAMS?"
        a: "Yes, if your Class 12 had Physics, Chemistry and Biology with the required marks and you clear NEET (UG). Check the age rule your state applies to BAMS."
        next: "Register for the next NEET (UG)."
        source: [ncism-msr, neet-ib]
board_note: "BAMS needs Class 12 with Physics, Chemistry and Biology and 50% in those three together (40% SC / ST / OBC). Every recognised board counts the same."
board_source: ncism-msr
exam:
  name: "NEET (UG) 2026 → BAMS · AIAPGET 2026 → MD / MS"
  body: "National Testing Agency (both) · AACCC and state AYUSH counselling"
  href: "neet-ug.html"
  facts:
    - { label: "NEET paper", value: "180 questions · 720 marks · 3 hours", source: neet-ib }
    - { label: "BAMS cut-off", value: "50th percentile (General / EWS) · 40th (SC / ST / OBC)", source: neet-ib }
    - { label: "AIAPGET paper", value: "120 MCQs · 480 marks · 2 hours", source: aiap26 }
    - { label: "AIAPGET marking", value: "+4 correct · −1 wrong", source: aiap26 }
  stages:
    head: ["Stage", "What it is", "Rule"]
    rows:
      - ["NEET (UG)", "One national paper for MBBS, BDS and AYUSH", "Cross the category percentile"]
      - ["Counselling", "AACCC for All India Quota; state AYUSH counselling for state seats", "No admission outside counselling"]
      - ["BAMS", "3 × 18-month professional years + 12-month internship", "Provisional registration before internship"]
      - ["AIAPGET", "PG entrance for MD / MS (Ayurveda)", "Internship done by the cut-off date"]
    source: [neet-ib, ncism-msr, aiap26]
  notes:
    - text: "In the All India Quota of government and aided colleges, reservation is SC 15%, ST 7.5% and PwBD 5%; OBC 27% and EWS 10% apply only in national institutes and central universities. State seats follow the state's policy."
      source: neet-ib
state_uses: [board, med, scholarship, psc]
state_rules:
  - state: karnataka
    text: "AYUSH seats use your NEET rank, but you must <strong>also register with KEA</strong> for Karnataka's counselling."
    source: kcet-ib
    href: "state/karnataka/kcet.html"
  - state: kerala
    text: "Kerala's KEAM process ranks BAMS on NEET (UG) and sets <strong>no upper age limit</strong> for BAMS."
    source: ke-noti
    href: "state/kerala/keam.html"
  - state: delhi
    text: "At GGSIPU, <strong>BAMS</strong> seats are filled on the NEET-UG 2026 rank."
    source: ipu-ib
    href: "state/delhi/ipu-cet.html"
  - text: "AACCC counsels the All India Quota and central and deemed-university seats; each state or UT runs its own counselling for state-quota seats, and no seat may be given outside counselling."
    source: [neet-ib, ncism-msr]
