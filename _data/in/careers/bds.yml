    eyebrow: "Overview"
    heading: "What is BDS?"
    parts:
      - overview:
          points:
            - "BDS is the primary professional degree required to become a dentist in India, covering oral health, teeth, gums, jaw and dental surgery — diagnosis, treatment and increasingly, cosmetic dental procedures."
            - "It's a 5-year programme combining classroom study with hands-on clinical training treating real patients."
            - "India has approximately <strong>28,000 BDS seats across roughly 329 dental colleges</strong> — a far larger number of colleges than MBBS has, which is part of why the field faces a genuine paradox: a real national shortage of dentists in rural and tier-2/tier-3 areas exists alongside genuine oversaturation in metro cities."
          more:
            - "Where and how you build your career matters as much as the degree itself."
