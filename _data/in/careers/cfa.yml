  - id: "higher"
    hid: "higher-heading"
    eyebrow: "Beyond the charter"
    heading: "Higher studies, certifications & international opportunities"
    parts:
      - prose:
          - "Many CFA charterholders later pursue a Master of Business Administration (MBA) in Finance for broader management exposure, or add the FRM (Financial Risk Management) credential for risk-focused roles. Because the charter is globally recognised by the same CFA Institute everywhere, it's one of the more portable Indian finance qualifications for working abroad — charterholders regularly move into roles in Singapore, the UK, the Middle East and North America without needing a separate local equivalent exam, though local securities-industry registrations (where required) still apply."
  - id: "future"
    hid: "future-heading"
    alt: true
    eyebrow: "Looking ahead"
    heading: "Future scope & the impact of AI"
    parts:
      - prose:
          - "Artificial Intelligence (AI) and quantitative tools are automating a growing share of routine data-gathering and basic screening in equity research, and this trend will continue. But the core CFA skill set — judging which valuation assumptions actually make sense, constructing a portfolio around a client's real goals and risk tolerance, and applying ethical judgment under pressure — remains difficult to automate and is what employers are ultimately paying a charterholder for."
          - "Charterholders who add data analysis skills (Python, Structured Query Language (SQL)) to their core CFA training are increasingly well positioned, since quantitative and traditional fundamental analysis are converging in many investment teams."
  - id: "proscons"
    hid: "pc-heading"
    eyebrow: "Honest take"
    heading: "Advantages and disadvantages"
    parts:
      - proscons:
          pros:
            - "Genuinely global credential — the same charter is recognised the same way in almost every major financial centre."
            - "Directly aligned with high-paying investment management and equity research careers."
            - "Can be studied alongside a job or degree — no mandatory full-time attendance."
          cons:
            - "Among the most expensive professional qualifications covered on this site, and fees are billed in USD."
            - "Pass rates below 50% at every level mean multiple attempts are common and add real time and cost."
            - "The charter alone, without real investment-related work experience, opens fewer doors than most students expect."
  - hid: "myth-heading"
    eyebrow: "Common myths"
    heading: "Myths vs facts"
    parts:
      - myths:
          - myth: "CFA is an Indian government-recognised qualification like CA."
            fact: "CFA is a private, globally-issued credential from the US-based CFA Institute — not an Indian statutory body, though it's widely respected by employers here."
          - myth: "You can start CFA straight after Class 12, just like CA."
            fact: "CFA Level I generally requires a bachelor's degree in progress (within 23 months of graduating) or completed — most students begin during their degree, not right after school."
          - myth: "Passing all three levels guarantees a top investment banking job."
            fact: "The charter significantly strengthens a resume, but real investment-related work experience and networking still matter enormously for landing top roles."
  - hid: "tips-heading"
    alt: true
    eyebrow: "Practical advice"
    heading: "Expert tips for CFA candidates"
    parts:
      - prose:
          - list:
              - "Register early — early registration fees are meaningfully cheaper than standard, and you lock in your preferred exam window sooner."
              - "Don't skip Ethics — it's weighted heavily at every level and is one of the most \"learnable\" scoring areas if you study it properly."
              - "Use official mock exams close to your real exam date — they're the closest simulation of actual difficulty and timing pressure."
              - "Try to line up an internship or entry-level role in research, banking or asset management while you study — the charter and real experience compound each other."
            ticks: true
