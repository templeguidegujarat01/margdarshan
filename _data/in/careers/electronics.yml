  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "What percentage of ECE graduates actually get core electronics jobs?"
            a: "Industry estimates suggest roughly 60% of ECE graduates end up in IT/software roles similar to CSE graduates, around 20% work in core ECE domains like VLSI, embedded systems or telecom, about 10% join government technical services such as DRDO or ISRO, and the remaining 10% pursue higher studies or other paths. The degree name doesn't determine your career — the path you choose does."
          - q: "Is VLSI a good career choice after ECE?"
            a: "Yes, and it's currently one of the fastest-growing core ECE specialisations, backed by real investment through the India Semiconductor Mission and companies like Micron and Tata Semiconductor expanding their India operations. Skilled freshers at Tier-1 companies like Intel and Qualcomm are reported to earn ₹15-30 LPA, though this reflects a competitive, specialised slice of the field, not the typical outcome."
          - q: "Can ECE graduates get software jobs like CSE graduates?"
            a: "Yes, and in practice most do. A large share of ECE graduates are hired into the same IT/software roles as CSE graduates, especially at mass-recruiting IT services companies. Building solid programming skills alongside your core ECE coursework keeps this path genuinely open."
          - q: "What is a realistic ECE fresher salary in 2026?"
            a: "It depends heavily on which path you land in. IT/software roles commonly start around ₹3-8 LPA at most colleges. Core embedded systems roles are similar, around ₹3-10 LPA. VLSI/semiconductor roles range enormously, from ₹4 LPA at smaller companies to ₹15-30 LPA at Tier-1 firms like Intel and Qualcomm for specialised, well-prepared candidates."
          - q: "Is ECE better than CSE?"
            a: "Neither is universally better. <a href=\"cse.html\">CSE</a> is the more direct, focused route into software careers. ECE is broader — it keeps both a software career and a genuinely distinct hardware/semiconductor career open — but that breadth means outcomes vary more, and you'll need to actively choose and prepare for a specific path rather than relying on the degree alone."
      - note: "Figures are indicative (2026) — confirm on the official college or authority website."
        class: "table-note mt-lg"
