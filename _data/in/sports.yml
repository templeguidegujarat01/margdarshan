              head: ["Sport", "What you do"]
              rows:
                - ["<strong>Mallakhamb</strong>", "Yoga and gymnastic moves on a wooden <strong>pole</strong> or a hanging <strong>rope</strong>"]
                - ["<strong>Yogasana</strong>", "Yoga postures done as a sport — held poses (traditional) or routines to music (artistic, rhythmic), judged by a panel"]
                - ["<strong>Gatka</strong>", "Sikh martial art with wooden sticks and shields"]
                - ["<strong>Kalaripayattu</strong>", "Kerala's martial art of strikes, kicks, weapon forms and flexibility drills"]
                - ["<strong>Thang-Ta</strong>", "Manipur's martial art of the sword (thang) and spear (ta)"]
            source: "kiyg25,ccscsb-yoga"
          - table:
              caption: "Yogasana events (government competition rules)"
              head: ["Event", "What is judged"]
              rows:
                - ["<strong>Traditional solo</strong>", "3 compulsory and 2 optional asanas from a set list; each compulsory pose held <strong>30 s</strong>, each optional <strong>15 s</strong>"]
                - ["<strong>Artistic solo</strong>", "8–10 postures of your choice to music in <strong>2½–3 minutes</strong>; each held at least 5 s; slow, artistic transitions"]
                - ["<strong>Artistic pair</strong>", "Two athletes do <strong>different</strong> postures at the same time, with pyramids; body touch allowed"]
                - ["<strong>Rhythmic pair</strong>", "Two athletes do the <strong>same</strong> postures together in sync with music; no body touch"]
            source: ccscsb-yoga
          - list:
              - "Judges give <strong>marks out of 10</strong> for each asana, looking at execution, perfection of the pose, a calm face (no strain), stability, smooth movement and holding time."
              - "Stepping on or over the arena line costs <strong>0.5 mark</strong> each time; a pose not held 5 s is not counted; no props in artistic and rhythmic events."
              - "The highest and lowest referees' totals are dropped and the rest averaged."
