hero:
  eyebrow: "Science (PCB) · Agriculture & Allied"
  title: "Fisheries Scientist (B.F.Sc) — Aquaculture & Fisheries"
  meta:
    - "ICAR-accredited agricultural education"
    - "Class 12 PCB (PCM/PCMB at some colleges)"
  read_time: "8 min read"
  intro:
    - "Fisheries science covers fish farming (aquaculture), fish health, processing, marine fisheries and fisheries economics — a fast-growing sector in India. The professional degree is the 4-year Bachelor of Fisheries Science (B.F.Sc) at fisheries colleges of state agricultural/veterinary/fisheries universities. ICAR fills a share of seats nationally through CUET-UG; states fill the rest. Research scientist posts are recruited by the Agricultural Scientists Recruitment Board (ASRB)."
