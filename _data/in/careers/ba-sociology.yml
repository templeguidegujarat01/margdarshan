  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Is BA Sociology the same as BSW (Bachelor of Social Work)?"
            a: "No. BA Sociology is a theory-driven degree studying how societies, institutions and social structures function. BSW is a more applied, practice-based degree focused on fieldwork, case work and directly intervening to help individuals and communities. Many social workers actually hold a Sociology background before specialising further."
          - q: "Do I need CUET to get into a good BA Sociology college?"
            a: "For Delhi University and most central universities, yes — CUET (UG) scores decide admission, submitted through the DU CSAS portal or the respective university's counselling system. Many state and private universities instead admit directly on Class 12 marks."
          - q: "What jobs can I get with a BA Sociology degree?"
            a: "Graduates commonly work in HR and people functions, market and social research, the development and NGO sector, journalism, and civil services after clearing UPSC. Roles in clinical or organisational settings, and academic teaching, typically need a master's degree in Sociology or a related applied field on top."
          - q: "Is Sociology a good optional subject for UPSC?"
            a: "Yes. Sociology is one of the more scoring and popular optional subjects for the UPSC Mains exam, partly because its syllabus overlaps significantly with the General Studies papers on Indian society, social justice and governance."
          - q: "Can I work in HR after BA Sociology?"
            a: "Yes, this is a common path. Sociology builds a strong understanding of group behaviour, social structures and organisational dynamics, which transfers well into HR, and many graduates follow up with an MBA in HR or a PGDM in Human Resource Management to specialise further."
      - note: "*Fee and salary figures are indicative, based on publicly available information as of 2026, and vary significantly by institution and admission cycle — always verify current figures on the official college or university website."
