slug: "ethical-hacker"
hero:
  eyebrow: "Tech · Cyber Security"
  title: "Ethical Hacker / Penetration Tester"
  meta:
    - "Security audits by CERT-In empanelled firms"
    - "Degree + hands-on skills"
  read_time: "8 min read"
  intro:
    - "Ethical hackers — penetration testers — break into systems with written permission to find weaknesses before criminals do. There is no Government licence: employers hire on skills, a computer degree and respected private certifications. Many government and regulated-sector audits must be done by organisations empanelled by CERT-In, India's national cyber-security agency. Testing without permission is a crime under the IT Act."
  quickfacts:
    - label: "Licence"
      value: "None — skill & certification based"
    - label: "Audit empanelment"
      value: "CERT-In"
      source: "certin"
    - label: "Key law"
      value: "IT Act, 2000"
      source: "itact"
    - label: "Typical degree"
      value: "B.Tech CSE / BCA / B.Sc IT"
