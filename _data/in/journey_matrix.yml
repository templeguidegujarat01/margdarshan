# --------------------------------------------------------------------- MONEY HELP (scholarships, stipends, fee cuts)
# kind: scholarship | stipend | fee | state. `amount` only when the official document prints it.
money:
  - id: nmmss
    kind: scholarship
    name: "National Means-cum-Merit Scholarship (NMMSS)"
    by: "Ministry of Education, through your state"
    amount: "₹1,000 a month, Class 9 to 12"
    who: "Class 8 students of government schools who passed Class 7 with 55% (50% SC/ST, as in Nagaland's notice) and clear the state's NMMSS test. Family income limit: see the scheme rules on the National Scholarship Portal."
    apply: "Your state's SCERT announces the test in Class 8; renewals are on scholarships.gov.in."
    stages: [c8]
    source: nmmss
  - id: csss
    kind: scholarship
    name: "Central Sector Scheme of Scholarships (PM-USP CSSS)"
    by: "Ministry of Education"
    amount: "₹12,000 a year for the first 3 years of a degree; ₹20,000 a year in years 4–5 of a 5-year integrated course (and in PG)"
    who: "Above the 80th percentile of your board's Class 12 pass-outs in your stream, in a regular degree course (not diploma or distance), family income up to ₹4.5 lakh, and <strong>not taking any other scholarship</strong> — including state schemes."
    apply: "On the National Scholarship Portal after Class 12; renewal needs 50% marks and 75% attendance each year."
    stages: [c11, c12, grad]
    source: csss
  - id: pms-sc
    kind: scholarship
    name: "Post-Matric Scholarship for SC students"
    by: "Ministry of Social Justice &amp; Empowerment, through your state"
    amount: "Compulsory non-refundable fees (tuition included) plus a yearly academic allowance — the college cannot ask you to pay the fee first"
    who: "SC students after Class 10 (ITI, diploma, degree and CA/CMA/CS courses count), family income up to ₹2.5 lakh. Separate post-matric schemes exist for ST, OBC and minority students on the same portal."
    apply: "Your state scholarship portal or scholarships.gov.in. The printed guidelines cover 2020-21 to 2025-26; check the 2026-27 rules on the portal."
    stages: [c11, c12, grad]
    source: pms-sc
  - id: mysy
    kind: state
    state: gujarat
    name: "Mukhyamantri Yuva Swavalamban Yojana (MYSY)"
    by: "Government of Gujarat"
    who: "Gujarat students joining a diploma or degree course on merit: it pays part of the tuition fee and, in some cases, a hostel grant for students who must study away from home."
    apply: "mysy.guj.nic.in. We could not open the official portal on 24 Oct 2026, so we print no amounts or cut-offs — read them in the current year's resolution on the portal."
    stages: [c10, c11, c12, grad]
    source: mysy
  - id: apprentice-iti
    kind: stipend
    name: "Act apprenticeship stipend — ITI pass"
    by: "Employer, under the Apprenticeship Rules"
    amount: "At least ₹9,600 a month, +10% in year 2 and +15% more in year 3"
    who: "ITI pass-outs (National or State certificate) training as apprentices — including railway apprenticeships, which also qualify you for ALP."
    apply: "apprenticeshipindia.gov.in or the railway's apprentice notice."
    stages: [c10, c11, c12]
    source: gsr610
  - id: apprentice-dip
    kind: stipend
    name: "Act apprenticeship stipend — diploma holder"
    by: "Employer, under the Apprenticeship Rules"
    amount: "At least ₹10,900 a month"
    who: "Diploma holders training as technician apprentices."
    apply: "apprenticeshipindia.gov.in."
    stages: [c10, c11, c12, grad]
    source: gsr610
  - id: rrb-fee
    kind: fee
    name: "RRB exam fee back after CBT-1"
    by: "Railway Recruitment Boards"
    amount: "₹400 of ₹500 refunded; the ₹250 fee is refunded in full"
    who: "Everyone who sits CBT-1. The ₹250 fee applies to SC, ST, ex-servicemen, women, transgender, minority and EBC candidates."
    apply: "Give correct bank details in the RRB form — wrong details mean no refund."
    stages: [c10, c11, c12, grad]
    source: rrb-cen
  - id: clat-fee
    kind: fee
    name: "Lower CLAT fee"
    by: "Consortium of National Law Universities"
    amount: "₹3,500 instead of ₹4,000"
    who: "SC, ST, BPL and PwD candidates, with the certificate uploaded in the form."
    apply: "In the CLAT application (closes 31 Oct for the December exam)."
    stages: [c11, c12]
    source: clat-ins
  - id: icai-need-inter
    kind: scholarship
    name: "ICAI need-based scholarship — Intermediate"
    by: "ICAI Board of Studies"
    amount: "₹1,500 a month for 9 months (+3 months for finishing the orientation and IT courses within 9 months, +3 more for passing one Intermediate group within 12 months)"
    who: "Students registered for Intermediate (Foundation or Direct Entry route) whose parents earn up to ₹3,00,000 a year."
    apply: "Any time on the ICAI Self Service Portal (eservices.icai.org); grants are processed every quarter."
    stages: [c12, grad]
    source: icai-sch
  - id: icai-need-final
    kind: scholarship
    name: "ICAI need-based scholarship — Final"
    by: "ICAI Board of Studies"
    amount: "₹1,500 a month for 30 months or the rest of your articleship, whichever is less"
    who: "Students registered for CA Final whose parents earn up to ₹3,00,000 a year."
    apply: "ICAI Self Service Portal, with an income certificate approved by your principal (or any CA if articleship has not started)."
    stages: [grad]
    source: icai-sch
  - id: icai-merit-need
    kind: scholarship
    name: "ICAI merit-cum-need scholarship"
    by: "ICAI Board of Studies"
    amount: "₹2,000 a month for 30 months or the rest of your articleship"
    who: "Intermediate rank holders (outside the top-10 merit list) who have registered for Final, parents' income up to ₹3,00,000 a year."
    apply: "ICAI Self Service Portal."
    stages: [grad]
    source: icai-sch
  - id: icai-merit
    kind: scholarship
    name: "ICAI merit scholarship"
    by: "ICAI Board of Studies"
    amount: "₹2,500 a month for 30 months or the rest of your articleship"
    who: "Intermediate rank holders at ranks 1–10 (and everyone sharing rank 10) who have registered for Final. No income limit is printed."
    apply: "ICAI Self Service Portal."
    stages: [grad]
    source: icai-sch
  - id: articleship
    kind: stipend
    name: "Articleship stipend (paid by your principal)"
    by: "Fixed by ICAI regulations (Regulation 48)"
    amount: "Minimum per month by city size — 20 lakh+ population: ₹4,000 (year 1), ₹5,000 (year 2); 5–20 lakh: ₹3,000 / ₹4,000; under 5 lakh: ₹2,000 / ₹3,000. These 2023 rates come from a press report; a June 2026 draft proposes ₹1,000 more in each slab. Confirm both on icai.org."
    who: "Every CA student in articleship. Firms can pay more than the minimum."
    apply: "Nothing to apply for — it is part of your articleship terms."
    stages: [c12, grad]
    source: icai-stip
  - id: cfa-sch
    kind: fee
    name: "CFA Program Access and Student scholarships"
    by: "CFA Institute"
    amount: "Lower programme fees (amount set per award)"
    who: "Access: candidates who cannot afford the fees and are not registered for an exam. Student: students of a CFA Institute affiliated university."
    apply: "On cfainstitute.org before you register for an exam — you cannot apply while registered or waiting for results."
    stages: [grad]
    source: cfa-sch
  - id: wbscc
    kind: state
    state: west-bengal
    name: "West Bengal Student Credit Card (WBSCC)"
    by: "Government of West Bengal"
    amount: "Loan up to ₹10 lakh at 4% simple interest a year; 1% interest concession if the interest is fully serviced during the study period"
    who: "Students from West Bengal aged 40 or under when applying — school (Class X onward), UG, PG, professional degree courses in India or abroad, and coaching for competitive exams such as Engineering, Medical, Law, IAS, IPS and WBCS. The state's scheme page asks for 10 years' residence in West Bengal and a co-borrower (usually a parent)."
    apply: "On wbscc.wb.gov.in. Repayment runs up to 15 years, including the moratorium (course duration + 1 year); no margin money up to ₹4 lakh."
    stages: [c10, c11, c12, grad]
    source: [wbscc, wb-scc-info]
  - id: tfw-up
    kind: fee
    state: uttar-pradesh
    name: "Tuition Fee Waiver seats (UPTAC)"
    by: "AKTU / UPTAC counselling, Uttar Pradesh"
    amount: "No tuition fee, on up to 5% extra seats over the approved intake"
    who: "Economically weaker meritorious students in B.Tech, MCA, MBA, B.Pharm, BHMCT, BFAD, BFA and B.Des (not B.Arch), with an income certificate. It is separate from the EWS category, which gets no fee concession."
    apply: "Claim it in your UPTAC registration and upload the income certificate."
    stages: [c11, c12, grad]
    source: tac-ib
  - id: ibps-pet
    kind: training
    name: "IBPS Pre-Examination Training (PET)"
    by: "IBPS and the participating banks"
    who: "A limited number of SC, ST, OBC and minority-community candidates who opt for it. Attending gives no right to selection."
    apply: "Tick the PET column in the online application; it runs online before the Preliminary exam (August in the 2026 cycle)."
    stages: [grad]
    source: ibps16
  - id: ibps-fee
    kind: fee
    name: "Lower IBPS PO fee"
    by: "IBPS"
    amount: "₹175 instead of ₹850 (both include GST)"
    who: "SC, ST and PwBD candidates."
    apply: "Paid online in the application form; bank charges are extra."
    stages: [grad]
    source: ibps16
  - id: upsc-fee
    kind: fee
    name: "UPSC Civil Services fee exemption"
    by: "Union Public Service Commission"
    amount: "No fee at all — others pay ₹100 for Prelims and ₹200 more for Main"
    who: "Women, SC, ST and Persons with Benchmark Disability candidates."
    apply: "Choose the category in the online form on upsconline.nic.in; the exemption is automatic."
    stages: [grad]
    source: cse26

