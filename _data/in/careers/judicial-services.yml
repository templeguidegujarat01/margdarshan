  - id: "faq"
    hid: "faq-heading"
    alt: true
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Can I become a judge right after LLB, without practising as a lawyer first?"
            a: "In most states, yes — fresh LLB graduates can directly appear for the Civil Judge (Junior Division) exam without a minimum years of practice requirement, though some states have specific rules, so it's worth checking your target state's latest notification. This differs from becoming a District Judge through direct recruitment, which usually requires several years of practice as an advocate."
          - q: "Is there one common exam for judicial services across India?"
            a: "No. Each state conducts its own Judicial Services exam (often called PCS-J or Civil Judge exam), through its Public Service Commission or High Court, with its own eligibility, syllabus emphasis and vacancy numbers. There is no single all-India judiciary exam equivalent to UPSC, though a national-level exam has been discussed in policy circles."
          - q: "What is the exam pattern for Judicial Services?"
            a: "Most states follow a three-stage process: a Preliminary exam (objective-type, covering law and general knowledge), a Mains exam (written, covering substantive and procedural law papers plus language and essay), and a Viva-voce/Interview for candidates who clear the Mains."
          - q: "How do High Court and Supreme Court judges get appointed?"
            a: "They aren't appointed through the entry-level Judicial Services exam. High Court and Supreme Court judges are appointed through a collegium-based process, usually from senior advocates or by elevating experienced judges from the subordinate judiciary — this is a separate track from the state-level Civil Judge exams covered here."
          - q: "Is Judicial Services a good alternative to litigation practice?"
            a: "For many law graduates, yes — it offers a stable government salary, job security and a defined career ladder much earlier than independent litigation typically does. The trade-off is a demanding, competitive exam and, once appointed, less flexibility than private practice or corporate law."
      - note: "*Salary figures reflect typical state judicial pay commission structures and are indicative, based on publicly available information as of 2026 — always verify current figures on your target state's official judicial recruitment website, since pay scales and rules vary by state."
        class: "table-note mt-lg"
