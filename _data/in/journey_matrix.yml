        - { title: "Primary (Classes 1–5)", text: "Class 12 with 50% + a 2-year D.El.Ed (or a 4-year B.El.Ed), then a TET Paper I.", source: ncte-mq11 }
        - { title: "Upper primary (Classes 6–8)", text: "Graduation + B.Ed (50%) or D.El.Ed, or a 4-year integrated B.A.Ed / B.Sc.Ed, then a TET Paper II.", source: ncte-mq11 }
        - { title: "Secondary and senior secondary", text: "A subject degree (TGT) or master's (PGT) with 50% + B.Ed, as in Delhi's DSSSB posts.", source: [d-0625, d-1024] }
        - { title: "4-year ITEP", text: "The Integrated Teacher Education Programme straight after Class 12, through NCET.", source: ncet26 }
      cost_time:
        - { label: "D.El.Ed", value: "2 years after Class 12", source: ncte-mq11 }
        - { label: "B.Ed", value: "After graduation (1-year B.Ed in the 2011 rules; check the current length with your university)", source: ncte-mq11 }
        - { label: "ITEP", value: "4 years after Class 12 · NCET fee 2026 ₹1,200 / ₹1,000 / ₹650", source: ncet26 }
        - { label: "CTET fee", value: "₹1,000 one paper · ₹1,200 both (₹500 / ₹600 SC / ST / disabled)", source: ctet-ib }
      cost_note: "D.El.Ed and B.Ed college fees are set by each state and college, so we do not print one figure."
      challenges:
        - text: "A TET pass is only an eligibility: it gives no right to a job — you still need the recruitment exam."
          source: ctet-ib
        - text: "TET pass mark is <strong>60%</strong>; employers may give reserved categories some concession."
          source: ctet-ib
        - text: "State schools use the <strong>state TET</strong>; CTET mainly covers central schools (KVS, NVS) and UT schools — pick the right test for the job you want."
          source: ctet-ib
      not_for:
        - "You do not enjoy explaining the same thing many times in different ways."
        - "You want a job without paperwork — marks, attendance and reports are part of every week."
        - "You lose patience easily in a large, noisy class."
    journey:
      - stages: [c8, c9]
        title: "Become the student others ask for help"
        do:
          - text: "Explain a chapter to a younger sibling or a friend each week — it is the best test of whether you enjoy teaching."
          - text: "Keep your language skills strong: the CTET has two language papers in Paper I."
            source: ctet-ib
        doubts:
          - q: "What do I need to become a government school teacher?"
            a: "Three things: the NCTE minimum qualification for your level (D.El.Ed for Classes 1–5, B.Ed or D.El.Ed for Classes 6–8), a Teacher Eligibility Test pass, and then the recruitment exam of your state or of KVS / NVS."
            next: "Decide which classes you want to teach — it decides your course."
            source: [ncte-mq11, ctet-ib]
          - q: "Which subject should I like to become a teacher?"
            a: "Any. Primary teachers teach all subjects; from Class 6 up you teach the subject of your degree. The NCTE rules are about the course and the TET, not one subject."
            next: "Pick the subject you enjoy most — you may teach it for 30 years."
            source: ncte-mq11
      - stages: [c10]
        title: "Any stream works — choose what you will teach"
        do:
          - text: "Every stream can lead to teaching. For a subject teacher, choose the stream that leads to that subject's degree (Science for Maths / Science, Commerce for Accountancy, Arts for History and languages)."
        stream: "Any stream. Plan for 50% in Class 12 — primary routes need it."
        doubts:
          - q: "Is Science compulsory to become a teacher?"
            a: "No. The NCTE qualifications ask for Class 12 or a degree with set marks plus a teacher-education course — not a stream. Your stream only decides which subject you can teach later."
            next: "Choose the stream of the subject you want to teach."
            source: ncte-mq11
      - stages: [c11, c12]
        title: "Score 50% and pick D.El.Ed, ITEP or a degree"
        do:
          - text: "Aim for <strong>50% in Class 12</strong> — the primary-teacher route (D.El.Ed or B.El.Ed) needs it (5% less for reserved categories)."
            source: ncte-mq11
          - text: "After Class 12, choose: a 2-year D.El.Ed (primary), the 4-year ITEP through NCET, or a degree and then B.Ed."
            source: [ncte-mq11, ncet26]
        exams:
          - { name: "NCET 2026 (for ITEP)", when: "Form 12 Feb – 10 Mar 2026 · exam 17 Apr 2026", source: ncet26 }
        money: [csss, pms-sc]
        mistakes:
          - "Joining a teacher-education college that is not NCTE-recognised."
          - "Scoring under 50% in Class 12 and losing the primary route."
        late: "Already doing a regular degree? Finish it, then do B.Ed — it opens Classes 6–12."
        doubts:
          - q: "Can I become a primary teacher right after Class 12?"
            a: "You need Class 12 with 50% and a 2-year D.El.Ed (or the 4-year B.El.Ed), and then a TET Paper I pass."
            next: "Look for NCTE-recognised D.El.Ed colleges in your state."
            source: ncte-mq11
          - q: "What is ITEP?"
            a: "The 4-year Integrated Teacher Education Programme, joined straight after Class 12 through NCET, in central and state universities, IITs, NITs, RIEs and government colleges."
            next: "Watch for the NCET form in February of your Class 12 year."
            source: ncet26
          - q: "Is there an age limit for NCET?"
            a: "No. NCET 2026 had no age limit; students who passed or were appearing in Class 12 could sit it. Each university may set its own age rule for admission."
            next: "Check the age rule of the university you want."
            source: ncet26
          - q: "Can NIOS students apply for NCET?"
            a: "Yes. The NIOS Senior Secondary exam with at least five subjects is a listed qualifying exam for NCET 2026."
            next: "Keep your NIOS marksheet with five subjects ready."
            source: ncet26
      - stages: [ug]
        title: "In college: degree, then B.Ed — or D.El.Ed / ITEP"
        do:
          - text: "For Classes 6–8: graduation with <strong>50%</strong> and a B.Ed, or graduation and a 2-year D.El.Ed."
            source: ncte-mq11
          - text: "For TGT / PGT posts: a subject degree or master's with 50% plus B.Ed (DSSSB's rule)."
            source: [d-0625, d-1024]
          - text: "Sit the TET in your final year or right after the course."
        exams:
          - { name: "CTET (22nd edition)", when: "Applications 11 May – 10 Jun 2026 (reopened 25 Aug – 1 Sep) · exam 12–13 Dec 2026", source: [ctet-ib, ctet-reopen, ctet-dates] }
        doubts:
          - q: "Can I teach primary classes with a B.Ed?"
            a: "The primary route in the NCTE rules is D.El.Ed or B.El.Ed. Recent primary-teacher notices — Delhi's DSSSB 2025 and Chhattisgarh's 2026 recruitment — ask for D.El.Ed or B.El.Ed, not B.Ed."
            next: "If you want Classes 1–5, do D.El.Ed; B.Ed is for Classes 6 and above."
            source: [ncte-mq11, d-0525, ls-advt]
          - q: "What marks do I need in graduation for B.Ed teaching posts?"
            a: "50% in graduation with B.Ed for Classes 6–8, with up to 5% relaxation for reserved categories."
            next: "Protect your graduation percentage."
            source: ncte-mq11
          - q: "Can I teach with a master's and an integrated B.Ed-M.Ed?"
            a: "Yes. Since NCTE's 2021 amendment, post-graduation with 55% and a 3-year integrated B.Ed-M.Ed counts for Classes 6–8, and for Classes 1–5 with a six-month bridge course within two years of joining."
            next: "Check your recruitment notice for the exact wording."
            source: ncte-mq21
      - stages: [grad]
        title: "Pass the TET, then the recruitment exam"
        do:
          - text: "<strong>CTET</strong>: Paper I for Classes 1–5, Paper II for Classes 6–8 — 150 one-mark MCQs each, 2½ hours, no negative marking. 60% is a pass."
            source: ctet-ib
          - text: "A TET certificate is now valid for life (unless your government notifies otherwise)."
            source: ctet-valid
          - text: "Then apply to recruitment exams: KVS / NVS, DSSSB in Delhi, your state's teacher recruitment body."
            source: ctet-ib
        exams:
          - { name: "CTET (22nd edition)", when: "12–13 Dec 2026", source: ctet-dates }
        doubts:
          - q: "What is the CTET pass mark?"
            a: "60% or more is a TET pass. School managements may give concessions to SC, ST, OBC and disabled candidates under their reservation policy."
            next: "Aim for at least 90 out of 150."
            source: ctet-ib
          - q: "Is there negative marking in CTET?"
            a: "No. All 150 questions in each paper are one-mark MCQs with no negative marking."
            next: "Attempt every question."
            source: ctet-ib
          - q: "How long is my TET certificate valid?"
            a: "For life, unless your government notifies otherwise. NCTE changed the old seven-year rule in 2021."
            next: "Keep the certificate safe; you will not need to re-sit for validity."
            source: ctet-valid
          - q: "CTET or state TET — which should I take?"
            a: "CTET applies to central government schools (KVS, NVS) and schools of the UTs, and private schools may accept it. State government and aided schools use the state's own TET, unless the state decides to accept CTET."
            next: "Take the TET of the schools you want to join — many students take both."
            source: ctet-ib
          - q: "Does passing CTET give me a job?"
            a: "No. CTET is only one eligibility condition; it gives no right to recruitment. You must still clear the recruiting body's exam."
            next: "Prepare for KVS, NVS or your state's recruitment exam."
            source: ctet-ib
      - stages: [work]
        title: "Switching to teaching later"
        do:
          - text: "Many recruitment exams have age limits — Delhi's DSSSB primary, TGT and PGT posts took candidates up to 30 years, with relaxations."
            source: [d-0525, d-0625, d-1024]
          - text: "NCET for ITEP has no age limit, but universities can set one."
            source: ncet26
        doubts:
          - q: "I am 28 and working. Can I still become a teacher?"
            a: "Yes, but check age limits. Delhi's DSSSB teacher posts allowed up to 30 years (with relaxations), and Chhattisgarh's 2026 assistant teacher posts 21 to 35. TET itself has no age limit."
            next: "Do B.Ed or D.El.Ed now and watch your state's age rule."
            source: [d-0525, ls-advt]
    board_note: "Every board's Class 12 counts for D.El.Ed, ITEP (NCET also accepts NIOS with five subjects) and degrees. Your Class 12 percentage matters for the primary route (50%)."
    board_source: [ncte-mq11, ncet26]
    exam:
      name: "CTET (22nd edition) · state TETs · recruitment exams"
      body: "CBSE for CTET · state boards / recruitment bodies"
      href: "bed.html"
      facts:
        - { label: "CTET papers", value: "Paper I (Classes 1–5) · Paper II (Classes 6–8)", source: ctet-ib }
        - { label: "Each paper", value: "150 MCQs · 150 marks · 2½ hours · no negative", source: ctet-ib }
        - { label: "Pass", value: "60%", source: ctet-ib }
        - { label: "Next CTET", value: "12–13 Dec 2026", source: ctet-dates }
      stages:
        head: ["Paper", "Sections", "Who takes it"]
        rows:
          - ["Paper I", "Child Development &amp; Pedagogy, Maths, Environmental Studies, Language I, Language II — 30 each", "Teachers for Classes 1–5"]
          - ["Paper II", "Child Development &amp; Pedagogy, Language I, Language II, and Maths &amp; Science or Social Studies", "Teachers for Classes 6–8"]
          - ["Both", "Take both papers", "Teachers for Classes 1–8"]
        source: ctet-ib
      notes:
        - text: "The CTET applies to central government schools (KVS, NVS, Central Tibetan Schools) and UT schools; private unaided schools may also accept it."
          source: ctet-ib
    state_uses: [board, tet, psc, scholarship]
    state_rules:
      - state: delhi
        text: "DSSSB recruits Delhi government teachers with <strong>CTET</strong>: Primary — Class 12 (50%) + D.El.Ed; TGT — subject degree (50%) + B.Ed; PGT — master's (50%) + B.Ed. Age up to 30. Pay Levels 6, 7 and 8."
        source: [d-0525, d-0625, d-1024]
        href: "state/delhi/dsssb.html"
      - state: rajasthan
        text: "BSER runs <strong>REET</strong>. The last one, REET-2024, was held on 27 February 2025 (fee ₹550 one level, ₹750 both); no REET 2026 notice was out when we checked."
        source: [reet-24, bser-site]
        href: "state/rajasthan/reet.html"
      - state: chhattisgarh
        text: "Assistant Teacher 2026: Higher Secondary with 50% + D.El.Ed (or B.El.Ed), <strong>and a TET pass</strong>; age 21–35 on 1 Jan 2026 (relaxations up to 45). The exam was moved to <strong>6 December 2026</strong> after a High Court order."
        source: [ls-advt, ls-oct]
        href: "state/chhattisgarh/vyapam.html"
      - state: west-bengal
        text: "WBSSC's 2nd SLST (2025) for Classes IX–X needs a degree or PG with 50% + B.Ed; Classes XI–XII need a PG with 50% + B.Ed. Age 21–40. You must have passed the language of the school's medium."
        source: ssc-at
        href: "state/west-bengal/wbssc.html"
      - text: "NCTE's minimum qualifications apply in every state. State government and aided schools use the state TET; central schools and UT schools use CTET."
        source: [ncte-mq11, ctet-ib]
    multiverse:
      - { title: "B.Ed guide", text: "The teacher-education degree after graduation.", href: "bed.html" }
      - { title: "Assistant Professor", text: "Teaching in colleges needs NET or a Ph.D.", href: "journey-blueprint.html?career=assistant-professor" }
      - { title: "Special educator", text: "Teaching children with disabilities." }
      - { title: "Delhi DSSSB", text: "PRT, TGT and PGT recruitment in Delhi.", href: "state/delhi/dsssb.html" }
    money: [nmmss, csss, pms-sc, mysy, wbscc]

  # ------------------------------------------------------------------ POLICE (batch 5, three-layer schema)
  - id: police
    v: 2
    name: "Police Constable / Sub-Inspector (State Police)"
    search: ["police constable", "police head constable", "police sub-inspector", "assistant police sub-inspector", "police inspector"]
    search_not: ["superintendent", "inspector general", "director general", "commissioner", "service officer", "railway protection force"]
    page: "state-pathways.html"
    doubts_page: "journey-police.html"
    gate: "Constable: Class 12 in most states (Class 10 in Madhya Pradesh) → state police recruitment board's written test → physical measurement and running test → documents and medical. Sub-Inspector: a bachelor's degree → the state board's or State PSC's SI exam (SSC for Delhi Police). Every state runs its own recruitment."
    gate_source: [up-pc, up-si, mp-pc, dl-si]
    core:
      what:
        text: "Police constables and Sub-Inspectors keep law and order: patrol, register complaints (FIRs), investigate crimes, manage traffic and crowds, and guard people and property. Each state recruits its own police; in Delhi the Staff Selection Commission runs the written exams and Delhi Police holds the physical tests."
        source: dl-pc
      day:
        - "Shift duty at a police station, beat patrol, traffic point or VIP duty — nights and holidays included."
        - "Sub-Inspectors register FIRs, lead investigations, collect evidence and appear in court."
        - "Training, drills and physical fitness never stop after joining."
      pay:
        - { level: "Delhi Police Constable", value: "Pay Level 3", source: dl-si }
        - { level: "Delhi Police / CAPF Sub-Inspector", value: "Pay Level 6", source: dl-si }
        - { level: "Karnataka Civil Police Constable (2026)", value: "₹37,500 – ₹76,100 pay scale", source: ka-pc }
        - { level: "Maharashtra PSI (MPSC 011/2026)", value: "S-14: ₹38,600 – ₹1,22,800", source: mh-psi }
      pay_note: "Every state has its own pay rules; Gujarat's PSI gets a fixed ₹49,600 during the contract period."
      routes:
        - { title: "Constable (state police)", text: "Class 12 (Class 10 in MP) → state recruitment board's written test and physical tests.", source: [up-pc, mp-pc] }
        - { title: "Sub-Inspector", text: "Any degree → the state board's SI exam, or the State PSC in some states (Rajasthan, Chhattisgarh, Maharashtra).", source: [up-si, rj-si, cg-si, mh-psi] }
        - { title: "Delhi Police and CAPF", text: "SSC runs the Delhi Police Constable exam and the 'SI in Delhi Police and CAPFs' exam for the whole country.", source: [dl-pc, dl-si] }
        - { title: "DSP and IPS", text: "Deputy Superintendent posts come through State PSC exams such as GPSC Class 1–2; IPS comes through the UPSC Civil Services exam.", source: [gj-gpsc, rj-pc] }
      cost_time:
        - { label: "UP Constable fee 2025", value: "₹500 · SC / ST ₹400", source: up-pc }
        - { label: "Assam / Kerala constable fee", value: "No application fee", source: [as-pc, kl-pc] }
        - { label: "West Bengal Constable fee 2024", value: "₹170 · WB SC / ST ₹20", source: wb-pc-info }
      cost_note: "There is no course fee — training is given after selection. Coaching is optional."
      challenges:
        - text: "Competition is huge: Telangana's 2026 drive got <strong>5,77,064 applications</strong> from about 4.29 lakh people for 7,437 posts."
          source: tg-pn
        - text: "Physical standards are strict and differ by state — for example 168 cm for a Rajasthan General constable and for Chhattisgarh's male SI candidates."
          source: [rj-pc, cg-si]
        - text: "Age windows are narrow: UP took male constables only from 18 to 22 in the 2025 drive."
          source: up-pc
      not_for:
        - "You cannot work nights, holidays and long shifts."
        - "You are not ready to keep fit and pass running and physical tests."
        - "You dislike rules, uniforms and a strict chain of command."
    journey:
      - stages: [c8, c9]
        title: "Fitness and a clean record start now"
        do:
          - text: "Start running and sports now — every state has a running test. Gujarat's: men 5 km in 25 minutes, women 1.6 km in 9 minutes 30 seconds."
            source: gj-gprb
          - text: "Stay away from fights and cases — police verification checks your character before appointment."
        doubts:
          - q: "Can girls join the police?"
            a: "Yes. States recruit women constables and Sub-Inspectors — West Bengal's 2024 drive had 3,537 posts for women, and UP took women constables up to age 25."
            next: "Start your fitness training early — women have their own running standard."
            source: [wb-pc-vac, up-pc]
          - q: "Is police a state job or a central job?"
            a: "Mostly state. Each state recruits its own police through its own board. Delhi Police and the central armed police forces recruit through the Staff Selection Commission."
            next: "Find your state's police recruitment board in the State rules block of your blueprint."
            source: [dl-pc, dl-si]
      - stages: [c10]
        title: "Any stream — pass Class 12"
        do:
          - text: "Most states need <strong>Class 12</strong> for constables — UP, Gujarat, Karnataka, Maharashtra, Telangana, Delhi. Madhya Pradesh asks only Class 10 (Class 8 for ST)."
            source: [gj-gprb, ka-pc, mh-pc, tg-pc, dl-pc, mp-pc]
        stream: "Any stream. Keep your Class 10 certificate — your date of birth is checked from it."
        doubts:
          - q: "Can I become a police constable after Class 10?"
            a: "In Madhya Pradesh, yes — its 2026 constable test asks for Class 10 (Class 8 for ST candidates). Most other states, such as UP, Gujarat and Karnataka, need Class 12."
            next: "Plan to finish Class 12 to keep every state open."
            source: [mp-pc, gj-gprb, ka-pc]
          - q: "Which stream is best for police?"
            a: "Any stream. The constable rules ask for a Class 12 pass, and the SI rules ask for a bachelor's degree in any subject."
            next: "Choose the stream you can score well in."
            source: [ka-pc, dl-si]
      - stages: [c11, c12]
        title: "Class 12, height and the constable age window"
        do:
          - text: "Watch the age windows: UP constable 2025 — men 18–22, women 18–25; Karnataka 18–33; Assam 18–26 (unreserved, this cycle)."
            source: [up-pc, ka-pc, as-pc-corr]
          - text: "Check the height rule of your state early — Rajasthan's General male constable needs 168 cm."
            source: rj-pc
          - text: "In Tamil Nadu you must clear a <strong>Tamil language test</strong> (40%) before your written paper is even marked."
            source: tn-pc
        exams:
          - { name: "Telangana PC prelims", when: "20 Dec 2026 (tentative)", source: tg-pn }
          - { name: "MP Constable (GD) test", when: "From 19 Nov 2026", source: mp-pc }
        money: [csss, pms-sc]
        mistakes:
          - "Ignoring the physical test until the written result — there is no time to build stamina then."
          - "Missing the narrow age window by waiting for 'the next drive'."
        late: "Crossed the constable age? Sub-Inspector exams take older candidates — UP's SI 2025 went up to 28 (+3 one-time)."
        doubts:
          - q: "What is the age limit for police constable?"
            a: "It depends on the state and the drive. UP 2025: men 18–22, women 18–25. Karnataka 2026: 18–33. Kerala PSC: 18–26. Reserved categories get extra years."
            next: "Read your state's latest notice in the State rules block of your blueprint."
            source: [up-pc, ka-pc, kl-pc]
          - q: "Is there a physical test in police recruitment?"
            a: "Yes, in every state: body measurement and a running test. Gujarat's: men run 5 km in 25 minutes and women 1.6 km in 9 minutes 30 seconds."
            next: "Train for your state's running standard months before the exam."
            source: [gj-gprb, up-pc]
          - q: "Do I need to know the state language?"
            a: "Some states test it. Tamil Nadu's constable recruitment has a qualifying Tamil test (40%), and only those who pass it get their main paper marked."
            next: "Check your state's notice for a language test."
            source: tn-pc
          - q: "How much is the police exam fee?"
            a: "It varies: UP constable 2025 was ₹500 (₹400 SC / ST); West Bengal ₹170 (₹20 for WB SC / ST); Assam and Kerala PSC charged no fee."
            next: "Keep a little money aside for each state form you fill."
            source: [up-pc, wb-pc-info, as-pc, kl-pc]
          - q: "How tough is the competition for police jobs?"
            a: "Very tough. Telangana's 2026 police drive received 5,77,064 applications from about 4.29 lakh people for 7,437 posts."
            next: "Prepare for the written test and the running test together, and apply in more than one drive."
            source: tg-pn
      - stages: [ug]
        title: "In college: aim for Sub-Inspector"
        do:
          - text: "Sub-Inspector exams ask for <strong>a bachelor's degree</strong> — Delhi Police / CAPF SI, Telangana and Gujarat PSI all do."
            source: [dl-si, tg-pc, gj-gprb]
          - text: "Keep training: SI selection also has physical tests."
        doubts:
          - q: "What qualification do I need for Sub-Inspector?"
            a: "A bachelor's degree in any subject. Delhi Police and CAPF SI 2026 took graduates aged 20 to 25; UP's SI 2025 took 21 to 28 (+3 years one time)."
            next: "Apply in your final year if the notice allows appearing graduates."
            source: [dl-si, up-si]
          - q: "Who conducts the SI exam in my state?"
            a: "Usually the state police recruitment board. In some states the State PSC runs it — RPSC in Rajasthan, CGPSC in Chhattisgarh and MPSC (through its Group-B combined exam) in Maharashtra."
            next: "Check the State rules block of your blueprint for your state."
            source: [rj-si, cg-si, mh-psi]
      - stages: [grad]
        title: "Graduated: SI, CAPF SI or a State PSC officer post"
        do:
          - text: "<strong>SSC 'SI in Delhi Police and CAPFs' 2026</strong>: any degree, age 20–25 on 1 Aug 2026, Pay Level 6. CBT on 20–28 Nov 2026."
            source: dl-si
          - text: "Officer entry: Deputy Superintendent of Police through State PSC (e.g. GPSC Class 1–2), IPS through UPSC."
            source: [gj-gpsc, rj-pc]
        exams:
          - { name: "SSC SI in Delhi Police &amp; CAPFs 2026", when: "CBT 20–28 Nov 2026", source: dl-si }
          - { name: "Telangana SI prelims", when: "29 Nov 2026 (tentative)", source: tg-pn }
        doubts:
          - q: "How do I join Delhi Police as a Sub-Inspector?"
            a: "Through the SSC exam 'Sub-Inspector in Delhi Police and CAPFs'. The 2026 notice asked for any degree and age 20–25 on 1 August 2026; the pay is Level 6."
            next: "Watch ssc.gov.in for the next notice."
            source: dl-si
          - q: "Can I become a DSP directly?"
            a: "Yes, through your State PSC's civil services exam where DSP is one of the posts — Gujarat's GPSC Class 1–2 exam includes it. IPS comes through UPSC."
            next: "See the Civil Services blueprint for UPSC."
            source: [gj-gpsc, rj-pc]
          - q: "What is the pay of a Sub-Inspector?"
            a: "It depends on the state: Delhi Police / CAPF SI is Pay Level 6, Maharashtra PSI is S-14 (₹38,600–₹1,22,800), Rajasthan SI is Level 11, and Gujarat's PSI gets ₹49,600 fixed during the contract period."
            next: "Read your state's SI notice for the exact pay."
            source: [dl-si, mh-psi, rj-si, gj-gprb]
      - stages: [work]
        title: "Joining police later"
        do:
          - text: "Upper age limits are the main barrier — SI windows are higher than constable ones, and reserved categories get extra years."
            source: [up-si, gj-gprb]
        doubts:
          - q: "I am 27. Is it too late for police?"
            a: "For constable in many states, yes — but not everywhere: Karnataka 2026 took constables up to 33 and Gujarat's Lokrakshak up to 33; Gujarat's PSI went up to 35."
            next: "Check states with higher limits and your category relaxation."
            source: [ka-pc, gj-gprb]
    board_note: "Any board's Class 10 and Class 12 count. Your date of birth on the Class 10 certificate is what recruitment boards check."
    board_source: mp-pc
    exam:
      name: "State police recruitment: written test → physical tests → documents and medical"
      body: "State police recruitment boards · State PSCs · SSC (Delhi Police and CAPF)"
      href: "state-pathways.html"
      facts:
        - { label: "Constable", value: "Class 12 in most states (MP: Class 10)", source: [ka-pc, mp-pc] }
        - { label: "Sub-Inspector", value: "Any bachelor's degree", source: dl-si }
        - { label: "UP Constable 2025", value: "32,679 posts · Level 3", source: up-pc }
        - { label: "SSC SI 2026 CBT", value: "20–28 Nov 2026", source: dl-si }
      stages:
        head: ["Stage", "What it is", "Example rule"]
        rows:
          - ["Written test", "Objective written paper (subjects differ by state)", "Tamil Nadu: a 40% Tamil test must be passed first"]
          - ["Physical measurement", "Height, chest and other body standards", "Rajasthan General male constable: 168 cm"]
          - ["Running / efficiency test", "Timed run (qualifying)", "Gujarat: men 5 km in 25 min, women 1.6 km in 9:30"]
          - ["Documents and medical", "Certificate check and medical exam", "UP: documents checked with body measurement"]
        source: [tn-pc, rj-pc, gj-gprb, up-pc]
      notes:
        - text: "UP's process for constables and SIs: one written test, document checks with body measurement, and a qualifying run."
          source: [up-pc, up-si]
    state_uses: [board, police, psc]
    state_rules:
      - { state: uttar-pradesh, text: "UPPRPB Constable 2025: <strong>32,679 posts</strong>, Level 3; age men 18–22, women 18–25; fee ₹500 (SC / ST ₹400). SI 2025: age 21–28 (+3 one-time).", source: [up-pc, up-si], href: "state/uttar-pradesh/police.html" }
      - { state: bihar, text: "Constables through <strong>CSBC</strong> (Advt 01/2025: 19,838 posts, Level 3, age 18–25, more for BC / EBC / SC / ST); Sub-Inspectors through <strong>BPSSC</strong> (Advt 05/2025: 1,799 posts, Level 6).", source: [br-pc, br-si], href: "state/bihar/police.html" }
      - { state: gujarat, text: "<strong>GPRB</strong> recruits PSI (degree, max age 35) and Lokrakshak constables (Class 12, age 18–33) together. Run: men 5 km in 25 min, women 1.6 km in 9:30. PSI gets ₹49,600 fixed during the contract.", source: gj-gprb, href: "state/gujarat/police.html" }
      - { state: maharashtra, text: "Constables (Class 12) are recruited by each commissionerate / district under the 2011 Rules; <strong>PSI through MPSC</strong>'s Group-B combined exam (011/2026: 310 posts, age 19–31 open, S-14 pay).", source: [mh-pc, mh-psi], href: "state/maharashtra/police.html" }
      - { state: karnataka, text: "Civil Police Constable 2026: PUC (Class 12), age 18–33 (35 for reserved), pay ₹37,500–₹76,100. KEA runs the application and written test.", source: ka-pc, href: "state/karnataka/police.html" }
      - { state: madhya-pradesh, text: "Constable (GD) 2026 through <strong>MPESB</strong>: 7,500 posts, <strong>Class 10</strong> (ST Class 8), age 18–33 (38 for MP women and reserved), pay ₹19,500–62,000; test from 19 Nov 2026.", source: mp-pc, href: "state/madhya-pradesh/police.html" }
      - { state: rajasthan, text: "Constables are recruited district by district (Class 12, 168 cm, age 18–23 for General); <strong>SI through RPSC</strong> (2025: 1,076 posts, age 20–25, Level 11).", source: [rj-pc, rj-si], href: "state/rajasthan/police.html" }
      - { state: telangana, text: "TSLPRB 2026: 7,437 posts — constable needs Intermediate, SI a degree. Prelims: SI 29 Nov, PC 20 Dec 2026 (tentative).", source: [tg-pc, tg-pn], href: "state/telangana/police.html" }
      - { state: andhra-pradesh, text: "SLPRB AP notified 1,156 constable-level and 378 SI-level posts on 16 Sep 2026; constable age 18–24 on 1 Jul 2026 (+5 reserved). Application dates awaited.", source: [ap-pc, ap-si], href: "state/andhra-pradesh/police.html" }
      - { state: tamil-nadu, text: "<strong>TNUSRB</strong> Common Recruitment 2025: Grade II Police Constable, age 18–26 (OC), a qualifying <strong>Tamil test (40%)</strong>, merit out of 100 (written 70); 20% priority for Tamil-medium students.", source: tn-pc, href: "state/tamil-nadu/tnusrb.html" }
      - { state: west-bengal, text: "WBPRB Constable 2024: 11,749 posts (8,212 men, 3,537 women); fee ₹170 (WB SC / ST ₹20).", source: [wb-pc-vac, wb-pc-info], href: "state/west-bengal/police.html" }
      - { state: assam, text: "SLPRB Assam Constable (UB &amp; AB): 1,052 + 663 posts in the 2025-26 drive, age 18–26 (unreserved, this cycle), <strong>no application fee</strong>.", source: [as-pc, as-pc-corr], href: "state/assam/police.html" }
      - { state: chhattisgarh, text: "SI-cadre posts are filled by <strong>CGPSC</strong> (Advt 02/2024: 341 posts); height 168 cm men, 153 cm women.", source: cg-si, href: "state/chhattisgarh/police.html" }
      - { state: kerala, text: "Kerala PSC recruits Police Constables (Armed Police Battalion) — Plus Two, men only in that notification, age 18–26 (OBC 29, SC / ST 31), no fee.", source: kl-pc, href: "state/kerala/kerala-psc.html" }
      - { state: delhi, text: "Delhi Police does not hold its own written exam: <strong>SSC</strong> runs the Constable (Class 12, age 18–25) and SI (degree, age 20–25) exams, and Delhi Police holds the physical tests. Pay Level 3 and Level 6.", source: [dl-pc, dl-si], href: "state/delhi/delhi-police.html" }
      - { text: "Every state writes its own police recruitment rules — qualification, age, height, running standard and fee all change by state and by drive.", source: [up-pc, gj-gprb, mp-pc] }
    multiverse:
      - { title: "Civil Services (IPS)", text: "IPS through the UPSC Civil Services exam.", href: "journey-blueprint.html?career=civil-services" }
      - { title: "NDA (defence officer)", text: "Officer entry to the armed forces after Class 12.", href: "nda.html" }
      - { title: "State-level pathways", text: "State exams, CETs and quota rules, state by state.", href: "state-pathways.html" }
      - { title: "Forensic science", text: "Crime labs and investigation support.", href: "forensic-science.html" }
    money: [csss, pms-sc, mysy, wbscc]

  # ------------------------------------------------------------------ CIVIL ENGINEER (batch 5, three-layer schema)
  - id: civil-engineer
    v: 2
    name: "Civil Engineer (B.E. / B.Tech Civil or Diploma)"
    search: ["civil engineer", "civil site engineer", "government civil engineer", "railway civil engineer", "environmental civil engineer", "structural engineer", "site engineer"]
    search_not: ["software", "cad technician", "documentation"]
    page: "civil.html"
    roadmap: "roadmaps/civil.html"
    doubts_page: "journey-civil-engineer.html"
    gate: "Class 12 with Physics and Mathematics → JEE Main or your state's engineering entrance → 4-year B.E. / B.Tech Civil. Or Class 10 → 3-year polytechnic diploma in Civil (Junior Engineer route) → lateral entry to B.Tech. Government jobs: UPSC ESE (Civil), state commissions for AE / JE posts."
    gate_source: [jm-ib, jee-ib, ese27]
    core:
      what:
        text: "A civil engineer plans, designs and builds roads, bridges, buildings, water supply, drains and railways — and checks that they are safe. In government, civil engineers run services such as the Central Engineering Service, Central Water Engineering Service and Border Roads."
        source: ese27
      day:
        - "On site: check that work matches the drawings, test materials, guide contractors and workers."
        - "In the office: prepare drawings, estimates and bills, and get approvals."
        - "In government: plan public works, inspect quality and manage budgets and tenders."
      pay:
        - { level: "Junior Engineer (Civil), Delhi govt (DSSSB 2026)", value: "Pay Level 6 · ₹35,400 starting basic", source: d-0126 }
        - { level: "Assistant Engineer (Civil), Delhi govt (DSSSB 2026)", value: "Pay Level 7 · ₹44,900 starting basic", source: d-0126 }
        - { level: "Group A officer through UPSC ESE (example: ITS, ESE 2024)", value: "Pay Level 10 · ₹56,100 – ₹1,77,500", source: dot-its }
      pay_note: "Private construction pay is not published officially, so we print only government levels."
      routes:
        - { title: "B.E. / B.Tech Civil", text: "Class 12 with Physics and Maths → JEE Main or a state CET → 4 years. JoSAA seats at NITs need 75% in Class 12 (65% SC / ST / PwD) or your board's top 20 percentile.", source: jm-ib }
        - { title: "Polytechnic diploma (Junior Engineer)", text: "After Class 10 — e.g. UP's JEECUP needs Class 10 with 35% — then JE jobs or lateral entry into B.Tech.", source: [jee-ib, acpc-be] }
        - { title: "Central government Group A", text: "UPSC Engineering Services (ESE) — Civil category: Central Engineering Service, CES (Roads), Survey of India, Central Water Engineering, Railway Management Service (Civil) and more.", source: ese27 }
        - { title: "State and city government", text: "State commissions and boards recruit JE / AE (Civil) — e.g. DSSSB for Delhi Jal Board and NDMC.", source: d-0126 }
      cost_time:
        - { label: "B.E. / B.Tech", value: "4 years after Class 12", source: acpc-be }
        - { label: "JEE Main fee 2026 (per session)", value: "₹1,000 General male · ₹800 female · ₹500 SC / ST / PwD", source: jm-ib }
        - { label: "UPSC ESE fee", value: "₹200 · women, SC, ST and PwBD exempt", source: ese27 }
      cost_note: "College fees vary by state, college type and quota, so we do not print one national figure."
      challenges:
        - text: "ESE is three stages — a 500-mark objective prelims with <strong>−1/3 per wrong answer</strong>, a conventional mains and an interview — for about 480 posts across four branches in 2027."
          source: ese27
        - text: "Most good government-college seats depend on JEE Main or your state CET rank — and board marks still count (for example 50% of ACPC's Gujarat merit is your HSC theory percentile)."
          source: [jm-ib, acpc-advt]
        - text: "Site work means heat, dust, travel and long hours, especially early in your career."
      not_for:
        - "You dislike Maths and Physics — the whole degree is built on them."
        - "You want only a desk job in one city — civil work moves from site to site."
        - "You are not ready to take responsibility for safety — a design mistake can cost lives."
    journey:
      - stages: [c8, c9]
        title: "Maths, drawing and how things are built"
        do:
          - text: "JEE Main Paper 1 is Mathematics, Physics and Chemistry, 100 marks each. Strong school Maths now makes Class 11–12 easier."
            source: jm-ib
          - text: "Look at buildings and bridges around you; try simple models — it shows whether you enjoy structures."
        doubts:
          - q: "What does a civil engineer actually build?"
            a: "Roads, bridges, buildings, dams, water supply and railways. Government civil engineers work in services such as the Central Engineering Service, CES (Roads), Central Water Engineering and Border Roads."
            next: "Read the Routes list above."
            source: ese27
          - q: "Can I become a civil engineer without JEE?"
            a: "Yes. State engineering seats use state routes too (Gujarat's GUJCET with ACPC, Maharashtra's MHT-CET), and a polytechnic diploma after Class 10 leads to Junior Engineer jobs or lateral entry into B.Tech."
            next: "Check your state's route in the State rules block of your blueprint."
            source: [acpc-advt, mht-ib, jee-ib, acpc-be]
      - stages: [c10]
        title: "Science with Maths — or a polytechnic diploma"
        do:
          - text: "For B.E. / B.Tech at NITs and NIT+ institutes, Class 12 must include <strong>Physics and Mathematics</strong>."
            source: jm-ib
          - text: "Or join a 3-year polytechnic diploma in Civil after Class 10 — UP's JEECUP asks for Class 10 with 35%, age 14+."
            source: jee-ib
        stream: "PCM (Physics, Chemistry, Mathematics) for the degree route."
        mistakes:
          - "Dropping Mathematics in Class 11 — it closes the B.Tech route."
        doubts:
          - q: "Can I do civil engineering after Class 10?"
            a: "Yes, as a polytechnic diploma. UP's JEECUP, for example, admits to engineering diplomas with Class 10 and 35% marks, age 14 or more. Diploma holders can later join B.Tech through lateral entry."
            next: "Look up your state's polytechnic entrance (JEECUP, ACPDC, JEXPO, POLYCET)."
            source: [jee-ib, acpc-be]
          - q: "Is Maths compulsory for civil engineering?"
            a: "For B.E. / B.Tech, yes — Class 12 must include Physics and Mathematics."
            next: "Take PCM in Class 11."
            source: jm-ib
      - stages: [c11, c12]
        title: "JEE Main year and your state CET"
        do:
          - text: "JEE Main can be taken in your Class 12 year and the two years after it, two sessions a year, with <strong>no age limit</strong>."
            source: jm-ib
          - text: "For NIT seats you also need <strong>75% in Class 12</strong> (65% SC / ST / PwD) or your board's top 20 percentile."
            source: jm-ib
          - text: "Register for your state's counselling too — ACPC, UPTAC, MHT-CET CAP, WBJEE and others."
            source: [acpc-advt, tac-ib, mht-ib, wb-ib]
        exams:
          - { name: "JEE Main 2026", when: "Session 1: 21–30 Jan · Session 2: 2–9 Apr 2026", source: jm-ib }
        money: [csss, pms-sc]
        mistakes:
          - "Ignoring board marks — NIT eligibility and some state merit lists use them."
          - "Choosing a branch only by rank — if you want civil, check the college's civil department too."
        late: "Rank too low for a top college? ESE asks for an engineering degree from a recognised university — not a particular college — so a good B.Tech anywhere keeps Group A open."
        doubts:
          - q: "How many attempts do I get in JEE Main?"
            a: "You can sit JEE Main in your Class 12 year and the two following years, with two sessions each year. There is no age limit."
            next: "Treat your Class 12 sessions as real attempts."
            source: jm-ib
          - q: "Do Class 12 marks matter for engineering?"
            a: "Yes. NIT, IIIT and other JoSAA seats need 75% (65% SC / ST / PwD) or the top 20 percentile of your board. In Gujarat, half of ACPC merit is your HSC theory percentile."
            next: "Prepare for boards and JEE together."
            source: [jm-ib, acpc-advt]
          - q: "What is the home-state quota at NITs?"
            a: "NIT seats are split into Home State and Other States quotas. Your home state is where you passed Class 12, not your home town."
            next: "Remember this if you plan to study Class 12 in another state."
            source: [jm-ib, josaa-br]
      - stages: [ug]
        title: "In B.Tech Civil: build skills for site and exams"
        do:
          - text: "Lateral entry: polytechnic diploma holders can join the second year of B.E. / B.Tech — Gujarat fills these seats through ACPC's DDCET."
            source: acpc-be
          - text: "If you aim for UPSC ESE, note the age window: <strong>21 to under 30</strong> on 1 January of the exam year (2027 notice)."
            source: ese27
        doubts:
          - q: "Can a diploma holder get a B.Tech?"
            a: "Yes, through lateral entry into the second year. In Gujarat ACPC runs this through the DDCET; other states have their own lateral-entry tests or merit."
            next: "Check your state's lateral-entry notice in your final diploma year."
            source: acpc-be
          - q: "Can I apply for ESE in my final year of B.Tech?"
            a: "Yes, if you are appearing in the degree exam. You must upload proof of passing within 10 days after the mains result, or you will not be allowed into the interview."
            next: "Plan your ESE attempt to match your final-year result."
            source: ese27
          - q: "Can I write ESE for more than one branch?"
            a: "No. You apply in only one category — Civil, Mechanical, Electrical, or Electronics and Telecommunication."
            next: "Civil graduates choose Category I: Civil Engineering."
            source: ese27
      - stages: [grad]
        title: "Government exams or the private sector"
        do:
          - text: "<strong>UPSC ESE 2027</strong> (Civil): prelims 31 Jan 2027, mains 18 Jun 2027; about 480 vacancies across all four categories; age 21–30; fee ₹200 (women, SC, ST, PwBD exempt)."
            source: ese27
          - text: "State / city JE and AE posts — e.g. DSSSB 2026: one 300-mark paper with 0.25 negative marking."
            source: d-0126
        exams:
          - { name: "UPSC ESE 2027 prelims", when: "31 Jan 2027", source: ese27 }
          - { name: "UPSC ESE 2027 mains", when: "18 Jun 2027", source: ese27 }
        doubts:
          - q: "What is UPSC ESE?"
            a: "The Engineering Services Examination. You pick one category — Civil, Mechanical, Electrical or Electronics &amp; Telecommunication. It has an objective prelims (500 marks: Paper I 200, Paper II 300), a conventional mains and a personality test."
            next: "Start preparing in your final year."
            source: ese27
          - q: "Is there negative marking in ESE?"
            a: "Yes. In the objective papers one-third of a question's marks is cut for each wrong answer, and marking two answers counts as wrong."
            next: "Answer only what you are sure about."
            source: ese27
          - q: "What is the age limit for ESE?"
            a: "At least 21 and under 30 on 1 January of the exam year — for ESE 2027, born between 2 January 1997 and 1 January 2006 — with relaxations for reserved categories."
            next: "Count how many attempts your age allows."
            source: ese27
          - q: "What do JE and AE (Civil) earn in government?"
            a: "In Delhi's DSSSB 2026 recruitment, Junior Engineer (Civil) is Pay Level 6 (₹35,400 starting basic) and Assistant Engineer (Civil) Level 7 (₹44,900)."
            next: "Check your own state's JE / AE notice."
            source: d-0126
      - stages: [work]
        title: "Switching later"
        do:
          - text: "JEE Main has no age limit, so a later start is possible; but government exams like ESE stop at age 30 (plus relaxations)."
            source: [jm-ib, ese27]
        doubts:
          - q: "I have a B.Sc. Can I still become a civil engineer?"
            a: "Only by doing an engineering degree or diploma. JEE Main has no age limit, but its attempts are counted from your Class 12 year."
            next: "Look at your state's engineering admission rules for older students."
            source: jm-ib
    board_note: "Every board counts for JEE Main and state CETs. NIT seats need 75% in Class 12 (65% SC / ST / PwD) or the top 20 percentile of your own board."
    board_source: jm-ib
    exam:
      name: "JEE Main → B.Tech · UPSC ESE (Civil) → Group A"
      body: "NTA · UPSC"
      href: "upsc-ese.html"
      facts:
        - { label: "JEE Main Paper 1", value: "75 questions · 300 marks · 3 hours", source: jm-ib }
        - { label: "ESE prelims", value: "500 marks (Paper I 200 + Paper II 300)", source: ese27 }
        - { label: "ESE negative marking", value: "−1/3 per wrong answer", source: ese27 }
        - { label: "ESE 2027", value: "About 480 vacancies (all categories)", source: ese27 }
      stages:
        head: ["Stage", "What it is", "Rule"]
        rows:
          - ["JEE Main / state CET", "Entrance for B.E. / B.Tech", "Physics + Maths in Class 12"]
          - ["ESE Stage I", "Objective: General Studies &amp; Engineering Aptitude + Civil Engineering", "−1/3 per wrong answer; marks count in final merit"]
          - ["ESE Stage II", "Two conventional Civil Engineering papers", "About 6–7 times the vacancies are called"]
          - ["ESE Stage III", "Personality test", "Final merit and service allotment"]
        source: [jm-ib, ese27]
      notes:
        - text: "Services are allotted by merit rank, your preferences, vacancies and medical fitness."
          source: ese27
    state_uses: [board, tech, psc, scholarship]
    state_rules:
      - { state: gujarat, text: "ACPC merit = <strong>50% HSC theory percentile</strong> (Maths, Physics, Chemistry) + <strong>50% GUJCET percentile</strong>; 95% of Govt / GIA seats go to Gujarat-schooled GUJCET candidates and 5% on JEE Main. Diploma holders enter through DDCET.", source: [acpc-advt, acpc-be], href: "state/gujarat/acpc.html" }
      - { state: uttar-pradesh, text: "UPTAC fills B.Tech seats on <strong>JEE Main</strong> rank (45%, 40% SC / ST, in the required subjects). Polytechnic diplomas after Class 10 go through <strong>JEECUP</strong> (35% in Class 10, fee ₹300 / ₹200).", source: [tac-ib, jee-ib], href: "state/uttar-pradesh/aktu-uptac.html" }
      - { state: maharashtra, text: "MHT-CET is compulsory for Maharashtra-candidature B.E. / B.Tech seats; B.E. needs 45% in PCM (40% reserved) and a non-zero MHT-CET score.", source: [mht-ib, cap-ib], href: "state/maharashtra/mhtcet.html" }
      - { state: west-bengal, text: "WBJEE counselling: West Bengal domicile is needed for government-aided seats and every reserved seat.", source: wb-ib }
      - { state: karnataka, text: "Engineering government seats go through <strong>KCET (PCM)</strong>; B.E. needs II PUC with English, Physics and Maths and 45% (40% reserved).", source: kcet-ib, href: "state/karnataka/kcet.html" }
      - { state: andhra-pradesh, text: "<strong>AP EAPCET</strong>: engineering test 12–15 and 18 May 2026; 45% (40% reserved) in the qualifying subjects; diploma holders from SBTET AP may also apply.", source: eap-ib, href: "state/andhra-pradesh/eapcet.html" }
      - { state: telangana, text: "<strong>TG EAPCET</strong>: ranks only from normalised EAPCET marks; fee ₹900 (₹500 SC / ST / PH).", source: tg-eap-dn, href: "state/telangana/eapcet.html" }
      - { state: delhi, text: "DSSSB 2026: Junior Engineer (Civil) Level 6 and Assistant Engineer (Civil) Level 7 for Delhi Jal Board, NDMC and others; one 300-mark paper with 0.25 negative marking.", source: d-0126, href: "state/delhi/dsssb-combined.html" }
      - { text: "UPSC ESE and JEE Main are national; NIT seats split into Home State and Other States quotas by the state where you passed Class 12.", source: [ese27, josaa-br] }
    multiverse:
      - { title: "Civil engineering guide", text: "Subjects, colleges and jobs.", href: "civil.html" }
      - { title: "Diploma in Civil", text: "The polytechnic route after Class 10.", href: "diploma-civil-engineering.html" }
      - { title: "UPSC ESE", text: "Group A engineering services.", href: "upsc-ese.html" }
      - { title: "Architect", text: "Designing buildings rather than engineering them.", href: "journey-blueprint.html?career=architect" }
    money: [nmmss, csss, pms-sc, tfw-up, mysy, wbscc]

  # ------------------------------------------------------------------ FASHION DESIGNER (batch 5, three-layer schema)
  - id: fashion-designer
    v: 2
    name: "Fashion Designer (B.Des — NIFT / NID / UCEED)"
    search: ["fashion designer", "digital fashion designer", "fashion illustrator", "textile designer", "knitwear designer", "accessory designer", "fashion stylist"]
    search_not: ["influencer", "model", "backstage", "coordinator", "sourcing"]
    page: "fashion-design.html"
    roadmap: "roadmaps/fashion-design.html"
    doubts_page: "journey-fashion-designer.html"
    gate: "Class 12 in any stream → NIFT entrance (GAT + CAT, then a Situation Test), NID DAT, UCEED or a state / private design test → 4-year B.Des in Fashion, Textile, Knitwear or Accessory Design → design studio, brand, export house or your own label."
    gate_source: [nift-ag, nid-hb, uc-ib]
    core:
      what:
        text: "A fashion designer creates clothes and accessories: researches trends, sketches, chooses fabrics, makes samples and works with production teams. NIFT, the national fashion institute, is a statutory institute under the NIFT Act, 2006, with 20 campuses."
        source: nift-ib
      day:
        - "Research trends and customers, then sketch and build a collection idea."
        - "Pick fabrics and colours, make patterns and samples, and fit them on models."
        - "Work with tailors, factories, merchandisers and buyers to meet costs and deadlines."
      pay_note: "No official body publishes fashion designer pay, so none is printed here."
      routes:
        - { title: "NIFT B.Des", text: "Fashion, Textile, Knitwear, Accessory, Leather, Fashion Communication and Fashion Interiors — 4,014 UG seats in the 2026 guidelines.", source: nift-ag }
        - { title: "NID", text: "The Design Aptitude Test admits to the 5½-year Integrated M.Des at NID Ahmedabad and B.Des / Integrated M.Des at other NIDs.", source: nid-hb }
        - { title: "IIT B.Des (UCEED)", text: "UCEED is the only route into B.Des at IIT Bombay, Delhi, Guwahati, Hyderabad, Indore, Roorkee and IIITDM Jabalpur.", source: uc-ib }
      cost_time:
        - { label: "NIFT B.Des", value: "4 years — NIFT prints the fee structure for the 2026-30 batch", source: nift-pr }
        - { label: "NIFT application 2026", value: "₹2,000 one programme · ₹3,000 B.Des + B.F.Tech (₹500 / ₹750 SC / ST / PwD)", source: nift-ag }
        - { label: "NID DAT 2027-28", value: "₹3,000 · women ₹2,000 · SC / ST ₹1,500 · PwD ₹500", source: nid-hb }
        - { label: "UCEED 2027", value: "₹4,000 · women and SC / ST / PwD ₹2,000", source: uc-ib }
      cost_note: "Design colleges charge high fees — read each institute's fee notice (NIFT prints its 2026-30 fee structure in the prospectus)."
      challenges:
        - text: "Age limits are tight: NIFT B.Des needs you to be <strong>under 24 on 1 August</strong> of the admission year (5 years more for SC / ST / PwD)."
          source: nift-ag
        - text: "NID needs Class 12 passed <strong>in the first attempt</strong> — a compartment or supplementary cancels the admission."
          source: nid-hb
        - text: "A rank is not a seat: UCEED qualifiers must apply again for B.Des seats, and the seat acceptance fee is ₹65,000 (₹20,000 SC / ST / PwD), adjusted in the institute fee."
          source: uc-ib
      not_for:
        - "You want a fixed 10-to-5 job — collections and shows bring deadline rushes."
        - "You cannot take criticism of your work — design is reviewed and changed many times."
        - "You only like drawing but not fabrics, costs and production details."
    journey:
      - stages: [c8, c9]
        title: "Sketch, observe and build a portfolio habit"
        do:
          - text: "Keep a sketchbook: draw people, clothes and objects every week. NIFT's B.Des merit gives 50% weight to its Creative Ability Test (CAT)."
            source: nift-ag
          - text: "Read newspapers — NIFT's written test has a General Knowledge and Current Affairs section."
            source: nift-ag
        doubts:
          - q: "Do I need to be good at drawing for fashion design?"
            a: "It helps a lot. NIFT's B.Des merit is 50% Creative Ability Test, 30% General Ability Test and 20% Situation Test, and UCEED and NID also test drawing and design."
            next: "Start a sketchbook now and fill it every week."
            source: [nift-ag, uc-ib, nid-hb]
          - q: "Which are the main design entrance tests?"
            a: "NIFT's entrance (NIFTEE) for NIFT campuses, the NID Design Aptitude Test for the National Institutes of Design, and UCEED for B.Des at IITs and IIITDM Jabalpur."
            next: "Read each test's dates in the Exams block when you reach Class 12."
            source: [nift-ag, nid-hb, uc-ib]
      - stages: [c10]
        title: "Any stream is fine"
        do:
          - text: "NIFT B.Des and NID accept Class 12 in <strong>any stream</strong>. Only B.F.Tech (NIFT) needs Mathematics."
            source: [nift-ag, nid-hb]
        stream: "Any stream. Take Maths if you may want B.F.Tech or IIT Guwahati / Roorkee B.Des (they need PCM)."
        doubts:
          - q: "Which stream should I take for fashion design?"
            a: "Any stream works for NIFT B.Des and NID. Maths is needed only for NIFT's B.F.Tech, and IIT Guwahati and IIT Roorkee B.Des need Physics, Chemistry and Mathematics."
            next: "Pick the stream you will score well in."
            source: [nift-ag, nid-hb, uc-ib]
          - q: "Can Commerce or Arts students do fashion design?"
            a: "Yes. NIFT B.Des has no subject condition, and NID accepts Science, Arts, Commerce or Humanities."
            next: "Build your drawing skills alongside your subjects."
            source: [nift-ag, nid-hb]
      - stages: [c11, c12]
        title: "Entrance year: NID in December, UCEED in January, NIFT in February"
        do:
          - text: "Apply early: NID DAT forms close in November; UCEED in October; NIFT in early January."
            source: [nid-hb, uc-ib, nift-ag]
          - text: "Pass Class 12 in the first attempt — NID cancels admission for any compartment."
            source: nid-hb
        exams:
          - { name: "NID DAT Prelims 2027-28", when: "Apply by 30 Nov 2026 · exam 20 Dec 2026", source: nid-hb }
          - { name: "UCEED 2027", when: "Register 1–31 Oct 2026 · exam 17 Jan 2027", source: uc-ib }
          - { name: "NIFT entrance 2026 (last cycle)", when: "Register 8 Dec 2025 – 6 Jan 2026 · test 8 Feb 2026", source: [nift-ag, nift-pn] }
        money: [csss, pms-sc]
        mistakes:
          - "Missing the UCEED or NID window because you planned only for NIFT."
          - "Preparing only GK and English and ignoring the drawing paper."
        late: "Missed this year's tests? NIFT allows you until just under 24, so you can sit the next cycle."
        doubts:
          - q: "What is the age limit for NIFT?"
            a: "You must be under 24 on 1 August of the year of admission; SC, ST and PwD candidates get 5 more years."
            next: "Count how many NIFT cycles you have left."
            source: nift-ag
          - q: "What is the age limit for UCEED?"
            a: "For UCEED 2027 you must be born on or after 1 October 2002 (Open, EWS, OBC-NCL) or 1 October 1997 (SC, ST, PwD)."
            next: "Check your birth date against the brochure."
            source: uc-ib
          - q: "Is there negative marking in NIFT?"
            a: "In the General Ability Test, yes: +1 for a correct answer and −0.25 for a wrong one."
            next: "Skip questions you are unsure of in the GAT."
            source: nift-ib
          - q: "Can I take the NIFT test while in Class 12?"
            a: "Yes, but you must prove you have passed at seat allocation — by 30 September in the 2026 cycle — or the admission is cancelled and fees forfeited."
            next: "Do not neglect your board exams."
            source: nift-ag
          - q: "What is the NIFT Situation Test?"
            a: "The second stage for B.Des candidates, worth 20% of the final merit. B.F.Tech has no second stage — its written test is final."
            next: "Practise making quick models from simple materials."
            source: nift-ag
          - q: "Is there negative marking in UCEED?"
            a: "In Part A, yes: −0.71 for a wrong single-answer MCQ and −1 for a wrong multiple-select question; numerical-answer questions have no negative marking."
            next: "Attempt every numerical-answer question."
            source: uc-ib
          - q: "Which IITs give B.Des through UCEED?"
            a: "IIT Bombay, IIT Delhi, IIT Guwahati, IIT Hyderabad, IIT Indore, IIT Roorkee and IIITDM Jabalpur. IIT Guwahati and IIT Roorkee need Physics, Chemistry and Mathematics in Class 12."
            next: "Register for UCEED in October of your Class 12 year."
            source: uc-ib
      - stages: [ug]
        title: "In B.Des: build a strong portfolio"
        do:
          - text: "NIFT B.Des seats in 2026: Fashion Design 801, Fashion Communication 719, Textile 681, Accessory 637, Knitwear 351, Leather 152, Fashion Interiors 82."
            source: nift-ag
          - text: "Keep every project, internship and photo shoot — your portfolio gets you jobs."
        doubts:
          - q: "Does NIFT have state quota seats?"
            a: "Yes, at some campuses. Bhopal, Bhubaneswar, Daman, Jodhpur, Kangra, Kannur, Nava Raipur, Panchkula, Patna, Shillong, Srinagar and Varanasi keep supernumerary domicile seats — seven each (12 at Srinagar). Domicile is the state where you finished Class 12."
            next: "Check if your state has a NIFT campus with domicile seats."
            source: nift-ag
          - q: "What is the reservation at NIFT?"
            a: "SC 15%, ST 7.5%, OBC (non-creamy layer) 27%, GEN-EWS 10%, and 5% horizontal for PwD."
            next: "Keep your category certificate in the central format ready."
            source: nift-ag
      - stages: [grad]
        title: "After B.Des: work, your own label, or a master's"
        do:
          - text: "Join a brand, export house, retailer or design studio — or start your own label."
          - text: "For a master's, NIFT and NID run M.Des programmes; UCEED's sister test CEED covers M.Des at IITs."
        doubts:
          - q: "Does an NID or UCEED rank guarantee a seat?"
            a: "No. A UCEED rank is not a seat — you must apply again through the joint seat allocation, and the score is valid only for that year's admissions."
            next: "Fill the B.Des application window after the result."
            source: uc-ib
      - stages: [work]
        title: "Starting design later"
        do:
          - text: "Age limits are the main barrier for B.Des at NIFT, NID and IITs — check each before you plan."
            source: [nift-ag, nid-hb, uc-ib]
        doubts:
          - q: "I am 23. Is it too late for NIFT?"
            a: "Not yet — NIFT B.Des takes candidates under 24 on 1 August of the admission year (under 29 for SC, ST and PwD). NID's 2027 cut-off was born on or after 1 July 2006 for General candidates."
            next: "Apply in the next cycle without delay."
            source: [nift-ag, nid-hb]
    board_note: "Every board counts. NIFT also accepts NIOS Senior Secondary with five subjects; NID accepts NIOS and other listed equivalents."
