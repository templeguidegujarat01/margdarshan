    eyebrow: "Beyond the degree"
    heading: "Higher studies"
    parts:
      - prose:
          - "BBM is a common feeder degree into an MBA, M.Com or other master's programmes. Karnataka-based students frequently prepare for <strong>Karnataka PGCET</strong>, the state entrance exam for MBA admission into Karnataka's universities and colleges, alongside national exams like Common Admission Test (CAT), XAT or MAT if they're targeting business schools outside the state."
