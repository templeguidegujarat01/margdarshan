lede: "In Arkansas, the Arkansas State Board of Law Examiners handles bar admission for lawyers, the Arkansas State Medical Board licenses physicians, the Arkansas State Board of Public Accountancy licenses CPAs and the Arkansas State Board of Nursing licenses registered nurses."

