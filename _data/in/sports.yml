  # ------------------------------------------------------------------------------------------------ Wushu
  - slug: wushu
    short: "Wushu"
    domain: combat
    checked: 2026-10-17
    body: "International Wushu Federation (IWUF) · Wushu Association of India (WAI)"
    card: "Sanda (fighting) and taolu (routines) under IWUF 2024 rules — points, weight classes, age groups, routine timing, SAI wushu centres, Asian Games medals and CRPF posts."
    card_facts: ["Sanda: win 2 of 3 rounds", "Taolu: 10-point score", "Adult sanda 18–40"]
    eyebrow: "Sports Cockpit · Combat &amp; Mat · IWUF rules 2024 · Asian Games sport"
    title: "Wushu — sanda fights, taolu routines &amp; the Asian Games road"
    lede: "Education Margdarshan's wushu map for India in simple words: the two halves of the sport — sanda (kick-boxing style fights) and taolu (judged routines) — how points are won in each, the age groups and weight classes, the papers you need, the SAI wushu centres, India's Asian Games and World Cup medals, who pays and the jobs that follow."
    official:
      - { label: "IWUF Sanda rules 2024 (PDF)", url: "https://www.iwuf.org/xhimg/soft/240912/WUSHU-SANDA-COMPETITION-RULES-JUDGING-METHODS-2024.pdf" }
      - { label: "IWUF Taolu rules 2024 (PDF)", url: "https://www.iwuf.org/xhimg/soft/240912/WUSHU-TAOLU-COMPETITION-RULES-AND-JUDGING-METHODS-2024.pdf" }
    facts:
      - { label: "Sanda bout", value: "<strong>3 rounds × 2 min</strong> — win 2 rounds", source: iwuf-sanda }
      - { label: "Taolu full score", value: "<strong>10 points</strong> (5 quality · 3 performance · 2 difficulty)", source: iwuf-taolu }
      - { label: "Adult sanda age", value: "<strong>18 to 40</strong> · youth 15–17 · junior 12–14", source: iwuf-sanda }
      - { label: "Asian Games 2026", value: "<strong>Silver</strong> — Roshibina Devi, women's 60 kg sanda", source: air-ag26 }
    sections:
      - id: rules
        nav: "Sanda &amp; taolu"
        eyebrow: "Core rules &amp; selection formats"
        heading: "Two sports in one: sanda fights and taolu routines"
        parts:
          - p: "Wushu is the Chinese martial art played as a sport. <strong>Sanda</strong> is a fight on a raised platform with punches, kicks and throws. <strong>Taolu</strong> is a solo routine of set moves — bare-handed or with a weapon — scored by judges, like gymnastics."
            source: "iwuf-sanda,iwuf-taolu"
          - table:
              caption: "Sanda — how points are won"
              head: ["Action", "Points"]
              rows:
                - ["Kick to the <strong>body or head</strong>", "<strong>2</strong>"]
                - ["Opponent <strong>falls off the platform</strong>", "<strong>2</strong>"]
                - ["Opponent falls while you stay standing (a throw)", "<strong>2</strong>"]
                - ["Opponent gets a warning, or a forced count", "<strong>2</strong>"]
                - ["Punch to the body or head", "<strong>1</strong>"]
                - ["Kick to the thigh", "<strong>1</strong>"]
                - ["Opponent gets an admonishment, or fails to attack within 5 seconds when told to", "<strong>1</strong>"]
            source: iwuf-sanda
          - list:
              - "A bout is <strong>three rounds of two minutes</strong> with a minute's rest; the first to win <strong>two rounds</strong> wins the bout. Junior and youth events may use 1 minute 30 seconds."
              - "If one fighter leads by <strong>12 points or more</strong> in a round (confirmed by five side judges), that fighter is declared the <strong>winner of the bout</strong>."
              - "No points for a strike while holding or clinching, or for unclear techniques."
            source: iwuf-sanda
          - table:
              caption: "Taolu — the 10-point score"
              head: ["Part of the score", "Points", "Judged by"]
              rows:
                - ["Quality of movements", "<strong>5</strong>", "Group A judges — mistakes are deducted"]
                - ["Overall performance (power, rhythm, style, music)", "<strong>3</strong>", "Group B judges"]
                - ["Degree of difficulty (jumps, balances and their links)", "<strong>2</strong>", "Group C judges"]
            source: iwuf-taolu
          - list:
              - "Main taolu events: <strong>Changquan</strong> (long fist), <strong>Nanquan</strong> (southern fist) and <strong>Taijiquan</strong>; weapons <strong>Daoshu</strong> (broadsword), <strong>Jianshu</strong> (straight sword), <strong>Gunshu</strong> (staff), <strong>Qiangshu</strong> (spear), Nandao, Nangun and Taijijian."
              - "Adult optional routines of Changquan, Nanquan and the weapons last <strong>1 min 20 s to 1 min 35 s</strong>; taiji routines <strong>2 min 45 s to 3 min 15 s</strong>."
            source: iwuf-taolu
      - id: recognition
        nav: "Recognition"
        eyebrow: "Institutional &amp; global recognition"
        heading: "Asian Games, World Cups, World Games — and India's medals"
        parts:
          - list:
              - "Wushu is an <strong>Asian Games</strong> sport (Aichi-Nagoya 2026) and a <strong>World Games</strong> sport (sanda and taolu at Chengdu 2025). It is <strong>not</strong> in the Olympic programme."
            source: "ag26,twg25"
          - list:
              - "<strong>Asian Games 2026</strong>: <strong>Roshibina Devi Naorem</strong> won silver in women's 60 kg sanda — her third Asian Games medal after bronze in 2018 and silver in 2023."
              - "<strong>World Games 2025</strong>: <strong>Namrata Batra</strong> won silver in women's 52 kg — India's first-ever wushu medal at the World Games."
              - "<strong>Sanda World Cup (Macau)</strong>: India won 2 gold, 1 silver and 2 bronze; <strong>Shivani</strong> (BSF, 75 kg) and <strong>Aparna</strong> (52 kg) took gold."
              - "India will host the <strong>Asian Senior Wushu Championships in 2028</strong> for the first time."
            source: "air-ag26,air-twg25,air-swc,air-asian28"
          - table:
              caption: "Government cash award for a senior wushu medal (₹ lakh)"
              head: ["Event", "Gold", "Silver", "Bronze"]
              rows:
                - ["Asian Games", "30", "20", "10"]
                - ["Wushu World Cup (every 2 years)", "20", "14", "8"]
                - ["Asian Championship (every 4 years)", "15", "10", "5"]
            source: myas-cash
      - id: eligibility
        nav: "Ages &amp; papers"
        eyebrow: "Physical benchmarks &amp; anti-doping"
        heading: "Age groups, medical papers and the weigh-in"
        parts:
          - table:
              caption: "IWUF age groups"
              head: ["Group", "Sanda", "Taolu"]
              rows:
                - ["Adult", "<strong>18 to 40</strong>", "18 and above"]
                - ["Youth", "15 to 17", "15 to 17"]
                - ["Junior", "12 to 14", "12 to 14"]
                - ["Children", "9 to 11", "11 and below"]
            source: "iwuf-sanda,iwuf-taolu"
          - list:
              - "A sanda fighter needs a valid <strong>passport</strong>, <strong>life-insurance certificate</strong> and a <strong>health certificate</strong> with EEG, ECG, blood pressure and heart rate from a check-up done <strong>within 15 days</strong> before registration."
              - "<strong>Weigh-in</strong>: lighter classes first; each class has <strong>one hour</strong>. Miss your registered class in that hour and you cannot fight in the event. A class with only one fighter is cancelled."
              - "Bring your own sanda kit in <strong>both red and blue</strong>. Breathing oxygen between rounds is banned, as is any doping."
            source: iwuf-sanda
          - table:
              caption: "Sanda weight classes (kg)"
              head: ["Group", "Classes"]
              rows:
                - ["<strong>Adult</strong>", "48 · 52 · 56 · 60 · 65 · 70 · 75 · 80 · 85 · 90 · 100 · +100"]
                - ["Youth (15–17)", "48 · 52 · 56 · 60 · 65 · 70 · 75 · 80 · 85 · 90"]
                - ["Junior (12–14)", "39 · 42 · 45 · 48 · 52 · 56 · 60 · 64 · 68 · 72"]
            source: iwuf-sanda
          - list:
              - "Under the anti-doping code you must be <strong>available for testing</strong> and check every medicine against the <strong>Prohibited List</strong>; apply to NADA for a <strong>TUE</strong> if you need a banned medicine."
            source: nada-rr
      - id: roadmap
        nav: "Roadmap"
        eyebrow: "Grassroots-to-elite residential pipeline"
        heading: "From the club to the national camp"
        parts:
          - table:
              caption: "The wushu ladder"
              head: ["Step", "Age", "What happens"]
              rows:
                - ["1. Club / state association", "From 9", "Learn basics; choose sanda, taolu or both"]
                - ["2. State championships", "Junior to adult", "Your state association picks its team for the nationals"]
                - ["3. SAI Training Centre", "12–18", "Up to 8th at Sub-Junior or Junior Nationals, or top 3 in the state, then a battery of tests"]
                - ["4. Junior &amp; Senior Nationals", "12–17 · 18+", "National medals are the door to the Indian camp"]
                - ["5. SAI NCOE", "Scouted", "Residential training at Bhopal, Imphal or Itanagar"]
                - ["6. India team", "Senior", "Asian Championships, World Championships, Sanda and Taolu World Cups, Asian Games"]
            source: "sai-schemes,iwuf-sanda"
          - p: "Many top Indian wushu fighters belong to <strong>services and police teams</strong> — the 2026 Sanda World Cup gold medallist Shivani is from the <strong>Border Security Force</strong> — so a sports-quota job can also be your training base."
            source: air-swc
      - id: academies
        nav: "Centres"
        eyebrow: "Top elite academies &amp; cities"
        heading: "Where India's wushu players train"
        parts:
          - table:
              caption: "SAI National Centres of Excellence with wushu"
              head: ["Centre", "Other sports there"]
              rows:
                - ["<strong>Bhopal</strong>, Madhya Pradesh", "Athletics, boxing, hockey, judo, kayaking &amp; canoeing"]
                - ["<strong>Imphal</strong>, Manipur", "Archery, athletics, cycling, fencing, football, hockey, judo, weightlifting"]
                - ["<strong>Itanagar</strong>, Arunachal Pradesh", "Boxing, weightlifting"]
            source: sai-schemes
          - note: "Wushu is also one of the 27 sports at SAI Training Centres (ages 12–18)."
            source: sai-schemes
      - id: costs
        nav: "Gear &amp; cost"
        eyebrow: "Equipment costs &amp; who pays"
        heading: "Kit, gloves and who pays the bills"
        parts:
          - list:
              - "Sanda: IWUF-approved shorts and vest (one red set, one blue), gloves whose weight depends on your class — <strong>230 g</strong> for women and men up to 65 kg, <strong>280 g</strong> for men 70–85 kg, <strong>330 g</strong> for men 90 kg and above — in red or blue with the headgear and chest protector (younger groups also wear shin and instep guards). You bring your own <strong>mouthguard, groin cup and hand wraps</strong> (3.5–4.5 m long)."
              - "Taolu: routine costume and IWUF-standard weapons for your events. Education Margdarshan does not print shop prices — no governing body publishes them."
            source: "iwuf-sanda,iwuf-taolu"
          - table:
              caption: "Who pays — wushu ladder"
              head: ["Stage", "Paid by", "What you get"]
              rows:
                - ["SAI centre trainee", "Sports Authority of India", "Coaching, boarding, sports science, diet"]
                - ["Khelo India athlete", "Ministry of Youth Affairs &amp; Sports", "<strong>₹6.28 lakh a year</strong> incl. ₹1.20 lakh cash"]
                - ["Athlete in hardship", "PDU National Welfare Fund", "Up to ₹2.50 lakh"]
            source: "sai-schemes,pib-support"
          - list:
              - "<strong>Weight-cutting with pills or powders</strong> is a doping risk: no supplement is 100% safe and <strong>strict liability</strong> applies."
            source: nada-supp
      - id: earnings
        nav: "Earnings &amp; jobs"
        eyebrow: "Earning channels &amp; central job quotas"
        heading: "Awards, pension and sports-quota jobs"
        parts:
          - list:
              - "Wushu is one of the <strong>65 sports</strong> in the central sports quota for <strong>Group C</strong> posts, with up to 5 years' age relaxation (10 for SC/ST)."
              - "Medals at the Asian Games or World Championships can bring up to <strong>three out-of-turn promotions</strong>."
            source: dopt-2022
          - list:
              - "<strong>CRPF's 2026 sports quota</strong> has <strong>20 wushu posts</strong>: taolu (nanquan, changquan with jianshu or daoshu, taijiquan) and sanda 45 to 70 kg."
            source: crpf26
          - list:
              - "<strong>Pension to Meritorious Sportspersons</strong>: ₹12,000–20,000 a month after retirement."
            source: pib-support
      - id: traps
        nav: "Red flags"
        eyebrow: "Disqualification traps"
        heading: "Mistakes that end a wushu tournament"
        parts:
          - list:
              - "<strong>Missing the weigh-in hour</strong> for your class — you are out of the event."
              - "<strong>An old medical</strong> — the EEG/ECG health certificate must be from the <strong>last 15 days</strong>."
              - "<strong>Only one kit colour</strong> — you need both red and blue."
              - "<strong>Taolu routine too short or too long</strong> — timing is part of the rules; check your event's limits."
            source: "iwuf-sanda,iwuf-taolu"
      - id: doubts
        nav: "Player doubts"
        eyebrow: "Real-world player doubts"
        heading: "Sanda or taolu, late start, jobs and money — straight answers"
        parts:
          - qa:
              q: "Should I choose sanda or taolu?"
              a: "Sanda suits a fighter who likes contact: punches, kicks and throws, by weight class. Taolu suits someone strong in flexibility, jumps and balance: you perform set routines and judges give up to <strong>10 points</strong>. Both are Asian Games events, and CRPF's 2026 quota had posts in both."
            source: "iwuf-sanda,iwuf-taolu,ag26,crpf26"
          - qa:
              q: "I am 18 or 20. Is it too late to start wushu?"
              a: "Not for competing: adult sanda runs from <strong>18 to 40</strong>, and adult taolu has no upper limit. It is late for the free pipelines — SAI Training Centres take ages <strong>12–18</strong> — so a late starter trains at a club and must win at state and national level to be noticed. The real clock is the job deadline: Railways sports quota stops at <strong>25</strong> and CRPF at <strong>23</strong> (28 for an unreserved sportsperson after relaxation)."
            source: "iwuf-sanda,iwuf-taolu,sai-schemes,rrc-wr26,crpf26"
          - qa:
              q: "Which government jobs can wushu get me?"
              a: "<strong>Central Group C posts</strong> under DoPT rules list wushu among 65 sports. <strong>CRPF's 2026 sports quota</strong> had <strong>20 wushu posts</strong> in sanda and taolu. Railways recruit zone by zone — Western Railway's 2026-27 notice had <strong>no wushu posts</strong>, so read every zone's notice."
            source: "dopt-2022,crpf26,rrc-wr26"
          - table:
              caption: "Sports-quota job routes open in 2026 — age, qualifying results, pay"
              head: ["Route", "Age", "Main qualifying results", "Pay level"]
              rows:
                - ["Railways <strong>Level 5/4</strong> (graduates)", "18–25 on 1 Jan 2027", "Played the <strong>Olympics</strong>, or top 3 at a World Cup, World Championship, Asian Games, Commonwealth Games or Youth Olympics", "Level 5/4"]
                - ["Railways <strong>Level 3/2</strong> (12th, or 10th + apprenticeship)", "18–25 on 1 Jan 2027", "Top 3 at <strong>Senior, Youth or Junior Nationals</strong>, National Games or All India Inter-University; or Federation Cup gold", "Level 3/2"]
                - ["Railways <strong>Level 1</strong>", "18–25 on 1 Jan 2027", "Played for your state and finished <strong>at least 8th at Senior Nationals</strong>; or top 3 at the Federation Cup", "Level 1"]
                - ["CRPF <strong>Head Constable (GD)</strong> (10+2)", "18–23 on 1 Aug 2026; sportspersons get <strong>+5 years</strong> (OBC +8, SC/ST +10)", "Played for India; or top 3 for your state at Nationals or National Games; or <strong>gold/silver at Junior Nationals</strong>", "Level 4 · ₹25,500–81,100"]
                - ["CRPF <strong>Constable (GD)</strong> (10th pass)", "18–23 on 1 Aug 2026; sportspersons get <strong>+5 years</strong> (OBC +8, SC/ST +10)", "Played for your state at <strong>Senior or Junior Nationals</strong>; or top 3 at SGFI school nationals or Khelo India Games", "Level 3 · ₹21,700–69,100"]
            source: "rrc-wr26,crpf26"
          - note: "Railways count results from <strong>1 April 2024</strong>; CRPF counts the <strong>two years before 30 September 2026</strong>. Railways fee ₹500 (₹400 back if you attend the trial; ₹250, refunded in full on attending, for SC/ST, women, PwBD, minorities, ex-servicemen and EBC). CRPF fee ₹100 for UR/OBC/EWS men; free for women, SC, ST and ex-servicemen. CRPF picks sign a <strong>₹1 lakh bond to serve at least 3 years</strong>."
            source: "rrc-wr26,crpf26"
          - qa:
              q: "We are a lower-middle-class family. How do we keep costs down?"
              a: "Aim for the free seats: SAI Training Centres and the wushu NCOEs at <strong>Bhopal, Imphal and Itanagar</strong> give coaching, boarding, sports science and diet; a Khelo India athlete gets <strong>₹6.28 lakh a year</strong>. A player in hardship can apply to the PDU National Welfare Fund for up to ₹2.50 lakh."
            source: "sai-schemes,pib-support"
          - qa:
              q: "Does any 'national' certificate count for a job?"
              a: "No. Railways will <strong>not recruit on a certificate from a federation MoYAS did not recognise</strong> at the time of the championship, and CRPF counts only championships of MoYAS-recognised federations or the IOA's National Games. Several private bodies use 'wushu' or 'kung fu' in their names — check that your nationals are run by the federation affiliated to IWUF and the IOA."
            source: "rrc-wr26,crpf26"
