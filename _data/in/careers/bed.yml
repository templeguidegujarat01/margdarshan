  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What is B.Ed?"
    parts:
      - overview:
          points:
            - "B.Ed (Bachelor of Education) is a professional teacher-training degree regulated by the <strong>National Council for Teacher Education (NCTE)</strong>, designed to prepare graduates to teach at the secondary and senior secondary school level."
            - "It covers educational psychology, pedagogy (how to actually teach a subject effectively), curriculum planning, classroom management, and includes supervised teaching practice in real schools."
            - "The standard route is a <strong>2-year B.Ed</strong> after completing any bachelor's degree."
          more:
            - "Under National Education Policy (NEP) 2020, a <strong>4-year Integrated B.A B.Ed / B.Sc B.Ed</strong> is also increasingly offered, letting students combine a regular degree with teacher training in one continuous programme straight after Class 12, at institutions like Regional Institutes of Education (RIEs) and several state universities."
  - id: "who"
    hid: "who-heading"
    alt: true
    eyebrow: "Fit check"
    heading: "Who should choose B.Ed"
    parts:
      - fit:
          match:
            - "Genuinely enjoy explaining things to others and want a stable, meaningful career shaping young minds."
            - "Already have (or plan to complete) a bachelor's degree in the subject you want to teach."
            - "Are prepared for the additional CTET/TET exam step needed to teach in government schools."
          mismatch:
            - "See teaching as a fallback option rather than a genuine interest — classroom management is demanding, daily work."
            - "Expect high pay quickly — government teaching salaries are stable but not typically the highest-paying Arts route."
            - "Aren't willing to prepare for CTET/TET on top of the degree — many capable B.Ed graduates struggle here without dedicated prep."
