        late: "Missed this year's merit list? Most states run it every year, so you can apply again next year with the same marks."
        doubts:
          - q: "How many marks do I need for BPT?"
            a: "NCAHP's curriculum asks for 50% in Physics, Chemistry and Biology. Uttar Pradesh and West Bengal accept 40% for SC, ST and OBC."
            next: "Keep your PCB total above the cut-off — it often decides your rank too."
            source: [ncahp-bpt, cahet, jenpas]
          - q: "Is there an entrance exam for BPT?"
            a: "Some states have one, some do not. West Bengal uses JENPAS(UG); Uttar Pradesh, Karnataka and Gujarat admit on Class 12 marks."
            next: "Find your state in the State rules block of your blueprint."
            source: [jenpas, cahet, kcet-ib, gj-nur]
          - q: "Can NIOS students join BPT?"
            a: "Yes in some states. Uttar Pradesh's 2026 bulletin accepts NIOS and state open schools with science subjects and English, and NCAHP's curriculum also names the National Open School."
            next: "Check your own state's bulletin."
            source: [cahet, ncahp-bpt]
          - q: "Is there an upper age limit for BPT?"
            a: "West Bengal's JENPAS(UG) 2026 sets no upper age limit for BPT. Uttar Pradesh sets only a minimum age of 17."
            next: "Check your state's bulletin if you are older."
            source: [jenpas, cahet]
          - q: "Do I need a domicile for government BPT colleges?"
            a: "Often yes. Uttar Pradesh government colleges need a UP domicile certificate, or Class 10 and 12 both passed from UP."
            next: "Get your domicile certificate ready before counselling."
            source: cahet
      - stages: [ug]
        title: "In BPT: four years, then the internship"
        do:
          - text: "Under NCAHP's 2025 curriculum: <strong>4 years of study</strong> (annual pattern) and a <strong>1-year full-time rotatory internship</strong>, taught in English."
            source: ncahp-bpt
          - text: "Keep <strong>75% attendance in theory and 85% in skills training</strong> — otherwise you cannot sit the final exam."
            source: ncahp-bpt
        doubts:
          - q: "How long is BPT?"
            a: "Under NCAHP's 2025 curriculum, 4 years of study plus a 1-year internship. Before this it was 4½ years including internship, so older colleges may still list that."
            next: "Ask your college which pattern your batch follows."
            source: ncahp-bpt
          - q: "Is BPT taught in Hindi or my state language?"
            a: "NCAHP's curriculum makes English the medium of instruction and examination for all BPT subjects."
            next: "Work on your English reading in Class 11–12 if it is weak."
            source: ncahp-bpt
          - q: "Can I take a break during BPT?"
            a: "Be careful: NCAHP's curriculum does not re-admit students whose break is five years or more, or who have more than two spells of break."
            next: "Finish the course in one go if you can."
            source: ncahp-bpt
      - stages: [grad]
        title: "Register, then specialise"
        do:
          - text: "The NCAHP Act provides for a Central and State Register of allied and healthcare professionals; register before you practise."
            source: ncahp-bpt
          - text: "For teaching posts, NCAHP's curriculum asks for at least 55% in MPT."
            source: ncahp-bpt
        doubts:
          - q: "Do physiotherapists need registration?"
            a: "Yes. The NCAHP Act provides for a Central and State Register of allied and healthcare professionals, and NCAHP's curriculum speaks of physiotherapists registered to practise."
            next: "Watch your State Allied and Healthcare Council for registration notices."
            source: ncahp-bpt
          - q: "What marks do I need in MPT to teach?"
            a: "At least 55% in the MPT examinations is required for academic posts under NCAHP's curriculum."
            next: "Aim for 55% or more if you want to teach."
            source: ncahp-bpt
      - stages: [work]
        title: "Switching to physiotherapy later"
        do:
          - text: "Where your state sets no upper age (West Bengal does not for BPT), you can start later with Class 12 PCB marks."
