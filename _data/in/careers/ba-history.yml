  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What is BA History?"
    parts:
      - overview:
          points:
            - "BA History is a 3-year undergraduate degree (4 years for Honours with Research under National Education Policy (NEP) 2020) that studies human civilisation across Ancient, Medieval and Modern periods, with a strong focus on Indian history alongside key developments in world history."
            - "Rather than memorising dates, the degree trains you to interpret primary sources, compare historical accounts, understand cause and consequence, and write structured, evidence-based arguments — skills that transfer directly into law, journalism, civil services and research."
            - "It's offered widely across Indian universities."
          more:
            - "Delhi University colleges — <strong>Hindu College, Miranda House, St. Stephen's and Lady Shri Ram College</strong> — are among the most competitive destinations, alongside Jadavpur University, Presidency University Kolkata, Banaras Hindu University and Jamia Millia Islamia, under the University Grants Commission (UGC) framework."
  - id: "who"
    hid: "who-heading"
    alt: true
    eyebrow: "Fit check"
    heading: "Who should choose BA History"
    parts:
      - fit:
          match:
            - "Enjoy reading widely, connecting events across time, and building a well-supported argument."
            - "Are seriously considering UPSC Civil Services, archives, museums, heritage work or academic research."
            - "Are comfortable that a plain undergraduate degree alone won't guarantee a job — most strong outcomes need a further exam or master's."
          mismatch:
            - "Dislike reading long texts and writing extended essays — that is most of the coursework."
            - "Want a degree with a fixed, direct pipeline into campus placements straight after graduation."
            - "Are choosing it only because you're \"not good at Maths\" rather than genuine interest — that rarely sustains three years of reading-heavy work."
  - id: "eligibility"
    hid: "elig-heading"
    eyebrow: "Eligibility"
    heading: "Who can apply for BA History"
    parts:
