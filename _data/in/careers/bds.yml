          - "A qualifying score in <strong>NEET-UG</strong> is mandatory — the same exam used for MBBS."
          - "The qualifying floor is just the 50th percentile, but actual government-college admission needs considerably higher — typically <strong>530-620+ marks</strong> for General category, depending on the state and college."
