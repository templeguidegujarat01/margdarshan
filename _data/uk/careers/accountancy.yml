slug: accountancy
title: "Chartered accountant: ACA or ACCA"
eyebrow: "UK · Finance · Accountancy"
lede: "Two big UK routes. <strong>ACA</strong> from ICAEW is usually done while working at an accountancy firm. <strong>ACCA</strong> is flexible: you can start straight after A levels. Both take years of <strong>exams + paid work</strong> together."
checked: 2026-10-09
in_page: ca.html
us_pathway: accounting
pay:
  - { soc: "2421", label: "Chartered and certified accountants" }
