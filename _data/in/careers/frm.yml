  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Can I register for FRM Part I right after Class 12?"
            a: "Yes, technically — GARP imposes no formal educational prerequisites to register for FRM Part I. In practice, the exam is quantitatively demanding and assumes comfort with statistics and calculus, so most candidates start during or after a bachelor's degree, but there is no rule stopping an earlier attempt."
          - q: "Does a CA, CFA or CPA get any papers exempted in FRM?"
            a: "No. GARP grants no exemptions to any part of the FRM exam for any prior qualification, including CA, CFA and CPA. Every candidate must pass both FRM Part I and Part II independently."
          - q: "Is passing both FRM parts enough to use the FRM designation?"
            a: "No. Passing both exam parts qualifies you to apply for certification, but you cannot use the FRM designation after your name until you also submit two years of relevant full-time risk management work experience to GARP and it is verified."
          - q: "Is FRM better than CFA for a risk management career?"
            a: "For roles specifically focused on risk measurement and management, FRM is generally considered more directly relevant than CFA, which covers broader investment management. Many risk professionals pursue both, since CFA's portfolio and valuation grounding complements FRM's specialised risk toolkit."
          - q: "How long does it realistically take to complete FRM?"
            a: "Most candidates complete both exam parts within 1-2 years, studying roughly 250 hours per part. Full FRM certification also requires two years of relevant work experience, which can be completed before, during or after the exams, so total time to certification varies by individual career timing."
      - note: "*Exam duration alone is typically 1-2 years; full certification timing also depends on when you accumulate your 2 years of qualifying work experience."
        class: "table-note mt-lg"
