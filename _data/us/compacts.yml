ube:
  license: law
  name: "Uniform Bar Examination (UBE)"
  what: "A UBE score earned in one UBE jurisdiction can be transferred to other UBE jurisdictions, each of which sets its own minimum score, time limits and any local-law requirement and still decides admission itself. Most jurisdictions move from the legacy UBE to the NextGen UBE between July 2026 and July 2028."
  source: ncbe_ube_list
  checked: 2026-10-07
  review_by: 2027-01-05
