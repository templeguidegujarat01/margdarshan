# Journey Blueprint — Preschool Teacher (NCTE Diploma in Preschool Education, DPSE). Printed on journey-preschool-teacher.html.
# Rules, classes and the money items / sources several careers share: _data/in/journey_common.yml.
# `sources` below are used only by this career. Check: node scripts/check-journey-matrix.mjs
id: preschool-teacher
v: 2
name: "Preschool Teacher (Class 12 → NCTE Diploma in Preschool Education)"
search: ["preschool teacher", "pre-school teacher", "nursery teacher", "kindergarten teacher", "kg teacher", "pre-primary teacher", "montessori teacher", "early childhood educator", "dpse", "d.e.c.ed", "play school teacher"]
page: "journey-preschool-teacher.html"
doubts_page: "journey-preschool-teacher.html"
gate: "Class 12 with 50% (any stream) → 2-year Diploma in Preschool Education (DPSE, earlier D.E.C.Ed) at an NCTE-recognised institution, with 20 weeks of preschool internship → teacher in nursery, kindergarten or preparatory classes for children aged 3 to 6."
gate_source: ncte-dpse
core:
  what:
    text: "A preschool teacher teaches children aged 3 to 6 through play and activity in nursery, kindergarten and preparatory classes. NCTE's norms for the Diploma in Preschool Education (DPSE) set the training for this job."
    source: ncte-dpse
  day:
    - "Plan play-based activities for language, numbers and the world around."
    - "Watch each child's growth and keep simple records."
    - "Talk with parents and keep the classroom safe and joyful."
  pay_note: "No central pay scale for preschool teachers was found in a current official notice, so pay is not printed."
  routes:
    - { title: "Class 12 → DPSE", text: "Candidates with at least 50% in Class 12 (or equivalent) are eligible; reservation and relaxation follow central or state rules.", source: ncte-dpse }
    - { title: "Admission", text: "On merit — Class 12 marks and / or an entrance test or another process set by the state government or UT administration.", source: ncte-dpse }
    - { title: "Move to primary classes", text: "Teaching Classes I–V in central schools needs an elementary teacher qualification and CTET Paper I — see the school teacher blueprint.", source: ctet-ib }
  cost_time:
    - { label: "DPSE", value: "2 academic years (finish within 3)", source: ncte-dpse }
    - { label: "Internship", value: "At least 20 weeks: 4 in year 1, 16 in year 2", source: ncte-dpse }
  cost_note: "DPSE fees are set by the affiliating body or state; NCTE bans donations and capitation fees, so no amount is printed."
  challenges:
    - text: "You need 80% attendance in course work and practicum and 90% in the school internship."
      source: ncte-dpse
    - text: "One-fourth of the total marks come from classroom observation and the 16-week internship — practice counts as much as theory."
      source: ncte-dpse
    - text: "Admission rules differ by state — some use Class 12 marks only, others an entrance test."
      source: ncte-dpse
  not_for:
    - "You lose patience with noise, tears and repetition."
    - "You prefer lecturing to playing and singing with children."
    - "You dislike talking with parents every day."
journey:
  - stages: [c8, c9]
    title: "Enjoy young children"
    do:
      - text: "DPSE prepares teachers for children aged 3 to 6 in nursery, kindergarten and preparatory schools."
        source: ncte-dpse
    doubts:
      - q: "What does a preschool teacher do?"
        a: "Teaches children aged 3 to 6 through joyful, play- and activity-based learning in nursery, kindergarten or preparatory classes, as NCTE's DPSE norms describe."
        next: "Read the Routes list above."
        source: ncte-dpse
      - q: "Is DPSE the same as D.E.C.Ed?"
        a: "Yes. NCTE says the Diploma in Preschool Education (DPSE) was earlier known as the Diploma in Early Childhood Education (D.E.C.Ed)."
        next: "Look for either name in college lists."
        source: ncte-dpse
  - stages: [c10]
    title: "Any stream — keep 50%"
    do:
      - text: "DPSE needs at least 50% in Class 12 or equivalent — no stream is fixed."
        source: ncte-dpse
    stream: "Any stream; aim for 50% or more in Class 12."
    doubts:
      - q: "Which stream do I need to become a nursery teacher?"
        a: "Any. NCTE's only rule for DPSE is at least 50% in Class 12 or equivalent, with relaxations for reserved categories as per central or state rules."
        next: "Choose a stream you can score 50%+ in."
        source: ncte-dpse
      - q: "Can I join DPSE right after Class 10?"
        a: "No. NCTE requires at least 50% in the higher secondary (Class 12) or an equivalent exam."
        next: "Finish Class 12 first."
        source: ncte-dpse
  - stages: [c11, c12]
    title: "Score 50% and apply"
    do:
      - text: "Admission is on merit — Class 12 marks and / or an entrance test, as the state or UT decides."
        source: ncte-dpse
    doubts:
      - q: "Is there an entrance exam for DPSE?"
        a: "It depends on your state. NCTE says admission is on merit from Class 12 marks and / or an entrance examination or another process set by the state government or UT administration."
        next: "Check your state's DPSE admission notice."
        source: ncte-dpse
      - q: "What percentage do I need for DPSE?"
        a: "At least 50% in Class 12 or equivalent. SC, ST, OBC, PwD and other categories get relaxations as per central or state rules."
        next: "Keep your category certificate ready."
        source: ncte-dpse
  - stages: [ug]
    title: "Two years of DPSE"
    do:
      - text: "Theory, practicum and school internship: observation of preschools, planned practice teaching, then full-time internship in public, private or NGO preschools."
        source: ncte-dpse
      - text: "Courses include child development, health and nutrition, maths and language in early years, children with special needs and working with parents."
        source: ncte-dpse
    doubts:
      - q: "How long is the DPSE course?"
        a: "Two academic years, and you must finish within three years of admission. There are at least 200 working days a year."
        next: "Plan two full years of study."
        source: ncte-dpse
      - q: "How much internship does DPSE have?"
        a: "At least 20 weeks in preschools — 4 weeks of classroom observation in year 1 and 16 weeks of internship in year 2."
        next: "Treat the internship like your first job."
        source: ncte-dpse
      - q: "What attendance does DPSE need?"
        a: "80% for course work and practicum, and 90% for the school internship."
        next: "Do not miss internship days."
        source: ncte-dpse
      - q: "What subjects are taught in DPSE?"
        a: "Early childhood care and education in India, understanding children, health and nutrition, gender and diversity, preschool curriculum, methods and materials, maths, language and environment for young children, planning a preschool programme, children with special needs and working with parents and community."
        next: "Start reading about how young children learn."
        source: ncte-dpse
  - stages: [grad]
    title: "Assessment and your first school"
    do:
      - text: "20–30% of each theory course is internal assessment and 70–80% is the examining body's exam; one-fourth of total marks are for classroom observation and the 16-week internship."
        source: ncte-dpse
    doubts:
      - q: "How are DPSE students assessed?"
        a: "Each theory course has 20–30% internal assessment and 70–80% external exam. One-fourth of the total marks go to classroom observation and the 16-week school internship."
        next: "Keep good observation records."
        source: ncte-dpse
      - q: "How do I check that a DPSE college is genuine?"
        a: "NCTE's norms apply to recognised teacher education institutions; each must charge only the fee prescribed by the affiliating body or state and may not take donations or capitation fees."
        next: "Ask to see the institution's NCTE recognition order."
        source: ncte-dpse
      - q: "Where do DPSE students do their internship?"
        a: "Each institution must tie up with at least ten preschools or pre-primary schools for internship and school-based work; having its own attached preschool is desirable."
        next: "Ask the college which preschools it works with."
        source: ncte-dpse
  - stages: [work]
    title: "Grow into primary teaching"
    do:
      - text: "To teach Classes I–V in central schools you need an NCTE elementary teacher qualification and CTET Paper I."
        source: [ctet-ib, kvs-nvs25]
    doubts:
      - q: "Can a preschool teacher later teach Class 1 to 5?"
        a: "Yes, with the right qualifications. Primary teaching in central schools needs an NCTE-recognised elementary teacher qualification and CTET Paper I — DPSE alone is for ages 3 to 6."
        next: "Read the school teacher blueprint for the CTET road."
        source: [ctet-ib, kvs-nvs25, ncte-dpse]
      - q: "Can I work with children with special needs after DPSE?"
        a: "DPSE includes a course on working with children with special needs. To teach them as a special educator you need an RCI-recognised course and RCI registration."
        next: "See the special education teacher blueprint."
        source: [ncte-dpse, rci-act]
board_note: "Any board and stream. You need at least 50% in Class 12."
board_source: ncte-dpse
