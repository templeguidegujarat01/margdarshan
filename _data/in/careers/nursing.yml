          - title: "Choose your route"
            text: "BSc Nursing (4 years, broadest scope), General Nursing and Midwifery (GNM) (3.5-year diploma), or Auxiliary Nurse Midwifery (ANM) (2 years, most limited)."
          - title: "Clinical training + INC registration"
            text: "Hands-on hospital practice, then register with the Indian Nursing Council and your State Nursing Council."
          - title: "Build experience, then consider abroad licensing"
            text: "1-2 years of Indian hospital experience typically strengthens international applications."
