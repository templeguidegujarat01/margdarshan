# Country editions — the single source of truth for region context.
# Read as site.data.regions. A page's region comes from its front matter
# `region:` (set automatically for every page under a region's `path_prefix`
# by `defaults` in _config.yml); pages with no region belong to `default`.
#
# Adding a country later (uk, ca, au …) = one entry here + one defaults
# block in _config.yml + its nav/content data. Layouts and includes must read
# from here instead of hard-coding "India" / "USA".
#
#   id            short code used in front matter, data-region, localStorage
#   name          full edition name shown in the region switcher
#   short         compact label (collapsed rail, small screens)
#   country       country name in copy ("careers in the {{ country }}")
#   lang / locale <html lang> and og:locale for that edition's pages
#   currency      ISO 4217 code; currency_symbol for display
#   home          the edition's home page, root-relative (no leading slash)
#   path_prefix   URL folder that belongs to this edition ("" = top level)
#   flag_svg      inline SVG body for a 24x24 viewBox (emoji flags do not
#                 render on Windows, see the note in nav.yml)
#   status        live | beta — beta editions show a small badge
#   data_note     how this edition's salary/outlook figures are sourced
#   nav           _data file holding this edition's `sidebar` (and optional
#                 `footer`) — read as site.data[nav]
#   crumb_home    label of the first breadcrumb (links to `home`)
#   tagline       optional one-line subtitle on the India home edition picker
#   og_image / og_image_alt   1200x630 social preview (WhatsApp, Facebook, X) for the edition's pages
#   vocab         plain words each edition uses for the same idea, short enough for a 15-year-old:
#                 money_note (how to read pay figures), path_title (heading of the route strip).
#                 Read by in-career.html and us-career-v2.html; change wording here only.

default: in

# localStorage key for the visitor's chosen edition. URL context always wins
# over the stored value (a /us/ page is always USA).
storage_key: md-region

# Pages that belong to no edition (legal, contact, 404). They render every
# edition's sidebar; the visitor's saved edition (html[data-region], set
# before first paint from storage_key) decides which one shows.
neutral_pages:
  - about.html
  - contact.html
  - privacy-policy.html
  - terms-and-conditions.html
  - disclaimer.html
  - cookie-policy.html
  - 404.html

list:
  - in
  - us
  - uk

in:
  id: in
  name: India Edition
  short: India
  country: India
  lang: en
  locale: en_IN
  currency: INR
  currency_symbol: "₹"
  home: index.html
  path_prefix: ""
  nav: nav
  crumb_home: Home
  status: live
  data_note: "Salary ranges are indicative INR figures; check each page's sources."
  vocab:
    money_note: "LPA = lakh rupees per year. ₹1 lakh = ₹1,00,000, so ₹6 LPA is about ₹50,000 a month before tax."
    path_title: "The path, step by step"
  og_image: assets/img/og-in.png
  og_image_alt: "Margdarshan India Edition: free career guidance for Indian students"
  flag_svg: '<rect x="2" y="5" width="20" height="14" rx="2" fill="#fff" stroke="currentColor" stroke-width="1"/><rect x="2.5" y="5.5" width="19" height="4.33" fill="#FF9933"/><rect x="2.5" y="14.17" width="19" height="4.33" fill="#138808"/><circle cx="12" cy="12" r="1.6" fill="none" stroke="#000080" stroke-width=".8"/>'

us:
  id: us
  name: USA Edition
  short: USA
  country: the United States
  lang: en-US
  locale: en_US
  currency: USD
  currency_symbol: "$"
  home: us/
  path_prefix: us/
  nav: nav_us
  crumb_home: USA Home
  status: beta
  data_note: "Pay and outlook figures come from the U.S. Bureau of Labor Statistics (BLS); each figure shows its reference year."
  vocab:
    money_note: "Pay is in U.S. dollars per year, before tax."
    path_title: "How to get there"
  og_image: assets/img/og-us.png
  og_image_alt: "Margdarshan USA Edition: careers, colleges and licenses in the U.S."
  flag_svg: '<rect x="2" y="5" width="20" height="14" rx="2" fill="#fff" stroke="currentColor" stroke-width="1"/><path d="M2.5 6.6h19M2.5 8.7h19M2.5 10.9h19M2.5 13.1h19M2.5 15.3h19M2.5 17.4h19" stroke="#B22234" stroke-width="1.1"/><rect x="2.5" y="5.5" width="8.5" height="7.6" fill="#3C3B6E"/>'

uk:
  id: uk
  name: UK Edition
  short: UK
  country: the United Kingdom
  lang: en-GB
  locale: en_GB
  currency: GBP
  currency_symbol: "£"
  home: uk/
  path_prefix: uk/
  nav: nav_uk
  crumb_home: UK Home
  tagline: "Careers, routes and pay"
  status: beta
  data_note: "Pay figures come from the Office for National Statistics (ONS) Annual Survey of Hours and Earnings; each page shows the year."
  vocab:
    money_note: "Pay is in pounds (£) per year, before tax, for full-time employees."
    path_title: "How to get there"
  flag_svg: '<rect x="2" y="5" width="20" height="14" rx="2" fill="#012169" stroke="currentColor" stroke-width="1"/><path d="M2.5 5.5l19 13M21.5 5.5l-19 13" stroke="#fff" stroke-width="2.4"/><path d="M2.5 5.5l19 13M21.5 5.5l-19 13" stroke="#C8102E" stroke-width=".9"/><path d="M12 5.5v13M2.5 12h19" stroke="#fff" stroke-width="3.6"/><path d="M12 5.5v13M2.5 12h19" stroke="#C8102E" stroke-width="2"/>'
