            - { t: "In September 2022 NMC accepted Ukraine's academic mobility programme with the degree from the parent Ukrainian university.", source: nmc_amp_news }
            - { t: "Any final degree must still meet NMC's FMGL rules to lead to an Indian licence.", source: nmc_fmgl }
doubts:
