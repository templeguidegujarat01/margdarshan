  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What does an AI Engineer actually do?"
    parts:
      - overview:
          points:
            - "An AI Engineer builds and deploys intelligent systems and AI-powered applications — increasingly centred on <strong>Generative AI and large language models (LLMs)</strong>."
            - "Unlike an AI Research Scientist, who develops new algorithms (typically requiring a PhD-level path), an AI Engineer is closer to an applied software engineer: integrating LLMs, building RAG (Retrieval-Augmented Generation) pipelines, and keeping AI systems reliable in production."
            - "The demand story here is genuinely backed by numbers: India is projected to host over 1 million active AI/ML job roles, driven by record VC funding into AI startups and near-universal enterprise adoption of GenAI across banking, healthcare, logistics and e-commerce."
          more:
            - "Companies that rushed to build AI teams after 2022-23 largely had no existing talent pipeline — which is exactly why the shortage, and the salary premium, are real rather than hype."
  - id: "who"
    hid: "who-heading"
    alt: true
    eyebrow: "Fit check"
    heading: "Who should aim for an AI Engineer career"
    parts:
      - fit:
          match:
            - "Enjoy both Machine Learning (ML) fundamentals and practical software engineering — APIs, deployment, production systems — not just theory."
            - "Want to ride a genuinely scarce, high-premium specialisation window while it lasts."
            - "Are comfortable with job titles in this space still being in flux — Prompt Engineer, LLM Engineer and Applied AI Engineer often mean similar things."
          mismatch:
            - "Want deep, theory-only research work — an AI Research Scientist path, typically needing a PhD, is closer to that."
            - "Assume today's GenAI salary premium will last indefinitely without continuously updating your skills."
            - "Want to rely on prompting skills alone — without Python, salary is reported to cap meaningfully lower."
