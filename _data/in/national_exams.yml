          - table:
              caption: "AILET 2027 calendar"
              head: ["Step", "Date"]
              rows:
                - ["Applications open", "7 Aug 2026"]
                - ["Last date to apply", "Tue 10 Nov 2026"]
                - ["Admit cards", "30 Nov 2026"]
                - ["AILET 2027", "Sun 13 Dec 2026, 2:00–4:00 PM"]
            source: ai-portal
          - p: "AILET 2027 is held in 32 cities, from Ahmedabad, Bengaluru and Bhopal to Varanasi and Visakhapatnam. A city with fewer than 200 candidates gets no centre and those candidates move to their 2nd or 3rd choice."
            source: ai-adm
          - note: "NLU Delhi's other postgraduate programmes — the Insolvency programme (PGIP / MA / LL.M.), the Joint Master's / LL.M. in IP Law, the LL.M. in Digital Technology, Policy &amp; Governance, and the Ph.D. — use a separate test, AIET, on 2 May 2027; that notice comes in January 2027."
            source: ai-adm
      - id: eligibility
        nav: "Eligibility"
        eyebrow: "Academic eligibility"
        heading: "45% in Class 12 for BA LLB, 50% in LL.B. for LL.M."
        parts:
          - list:
              - "<strong>B.A. LL.B. (Hons.):</strong> Class 12 (10+2) or equivalent with at least <strong>45%</strong> aggregate — <strong>42%</strong> for OBC and <strong>40%</strong> for SC / ST / Persons with Disability."
              - "Class 12 candidates appearing in 2027 can apply, but must be eligible by the cut-off date notified with the result; a compartment in the admission year makes you ineligible."
              - "Foreign nationals skip AILET and are admitted on Class 12 marks (at least 65%). OCI / PIO candidates can apply in that category and also as Indian candidates through AILET, with two separate forms."
            source: ai-ug-elig
          - list:
              - "<strong>LL.M.:</strong> LL.B. or equivalent from a recognised university with at least <strong>50%</strong> — <strong>45%</strong> for SC / ST / Persons with Disability."
              - "Final-year LL.B. candidates can apply on the same cut-off-date condition."
              - "Foreign nationals need 55% in the LL.B. and are judged on their record, English skills and an interview."
            source: ai-llm-elig
          - warn: "The 2027 admission notice also says that \"in all the above-mentioned cases\" a minimum of 55% (50% for SC / ST / PwD) is needed, without saying which programmes it means. The eligibility pages give the figures above — ask NLU Delhi (ailetsupport@nludelhi.ac.in) if your marks fall between the two."
            source: ai-adm
      - id: scheme
        nav: "Exam scheme"
        eyebrow: "Exam scheme &amp; marking matrix"
        heading: "Two papers, both 120 minutes, both −0.25"
        parts:
          - table:
              caption: "AILET 2027 — B.A. LL.B. (Hons.) paper"
              head: ["Section", "Questions", "Marks"]
              rows:
                - ["A — English Language", "50", "50"]
                - ["B — Current Affairs &amp; General Knowledge", "30", "30"]
                - ["C — Logical Reasoning", "70", "70"]
                - ["Total (120 minutes)", "150", "150"]
            source: ai-ug-test
          - list:
              - "<strong>0.25 mark</strong> is deducted for each wrong answer — four wrong answers cost one mark."
              - "Legal principles may appear in Logical Reasoning, but no legal knowledge is required."
              - "<strong>Tie-break (BA LLB):</strong> higher Logical Reasoning marks, then the older candidate, then a computerised draw of lots."
            source: ai-ug-test
          - list:
              - "<strong>LL.M. paper:</strong> 100 MCQs of one mark each from different branches of law, in <strong>120 minutes</strong>, with the same −0.25 for a wrong answer."
              - "<strong>Tie-break (LL.M.):</strong> the older candidate, then a computerised draw of lots."
            source: ai-llm-test
      - id: reservation
        nav: "Seats &amp; reservation"
        eyebrow: "Reservation &amp; quotas"
        heading: "120 BA LLB and 81 LL.M. seats, OBC at 22%"
        parts:
          - table:
              caption: "B.A. LL.B. (Hons.) 2027-28 seat matrix"
              head: ["Category", "Seats", "Of which PwD"]
              rows:
                - ["General", "50", "3"]
                - ["OBC-NCL (22%)", "24", "1"]
                - ["SC (15%)", "17", "1"]
                - ["ST (7.5%)", "8", "0"]
                - ["EWS (10%)", "11", "1"]
                - ["Foreign Nationals 5 + OCI/PIO 5", "10", "—"]
                - ["Total", "120", "6"]
            source: ai-ug-seat
          - list:
              - "<strong>OBC is 22%</strong>, not 27%. A non-creamy-layer certificate under the Central list <strong>or the Delhi State list</strong> of OBCs is accepted, issued on or after 1 April 2026; the EWS certificate must also be dated on or after 1 April 2026."
              - "<strong>30% of all seats</strong> go horizontally to women, counting those selected in reserved and foreign national categories; PwD reservation is 5% horizontal."
              - "Unfilled SC seats go to ST and vice versa, and only then to General; unfilled foreign national seats go to General on AILET merit."
              - "The seat matrix has no Delhi domicile quota."
            source: ai-ug-seat
          - table:
              caption: "LL.M. 2027-28 seat matrix"
              head: ["Category", "Seats", "Of which PwD"]
              rows:
                - ["General", "32", "2"]
                - ["OBC-NCL (22%)", "15", "1"]
                - ["SC (15%)", "11", "1"]
                - ["ST (7.5%)", "5", "—"]
                - ["EWS (10%)", "7", "—"]
                - ["Kashmiri Migrant (supernumerary)", "1", "—"]
                - ["Foreign Nationals 5 + OCI/PIO 5", "10", "—"]
                - ["Total", "81", "4"]
            source: ai-llm-seat
      - id: fees
        nav: "Application &amp; fees"
        eyebrow: "Application steps &amp; registration fees"
        heading: "₹3,000, or ₹1,000 for SC / ST / PwD"
        parts:
          - table:
              caption: "AILET 2027 application fee"
              head: ["Category", "Fee"]
              rows:
                - ["General / OBC / EWS / Foreign Nationals", "₹3,000"]
                - ["SC / ST / Persons with Disability", "₹1,000"]
                - ["SC / ST and women candidates who are Below Poverty Line", "Exempt"]
            source: ai-ug-fee
          - list:
              - "Fill the form with your name and parents' names exactly as on your Class 10 certificate, and pick <strong>three test centres</strong> in order of preference."
              - "Upload a colour photo and signature (JPG/PNG, up to 1 MB each), plus a BPL or PwD certificate (up to 2 MB) if you claim one. Category certificates are checked at counselling."
              - "Pay by debit / credit card, UPI or net banking; an acknowledgement receipt appears in your login. The application fee is not refundable."
            source: ai-guide
      - id: horizons
        nav: "Where it leads"
        eyebrow: "Career horizons &amp; mapped institutions"
        heading: "B.A. LL.B. and LL.M. at NLU Delhi, Dwarka"
        parts:
          - table:
              caption: "B.A. LL.B. (Hons.) fees for Indian students (2027-28)"
              head: ["Fee head", "Amount"]
              rows:
                - ["Tuition", "₹1,63,000 a year (rises ₹7,000 each year)"]
                - ["Academic services and facilities", "₹43,000 a year"]
                - ["Student welfare + utility services", "₹7,000 + ₹20,000 a year"]
                - ["Admission fee (once)", "₹10,000"]
                - ["Refundable estate deposit (once)", "₹25,000"]
                - ["Hostel (if allotted) + mess", "₹92,000 + ₹50,000 a year"]
            source: ai-ug-fee
          - note: "Hostel rooms are limited and allotted by aerial distance from NLU Delhi and the reservation policy, not by rank."
            source: ai-ug-fee
          - p: "The <strong>LL.M. is non-residential</strong>: NLU Delhi provides no hostel for LL.M. students. Its listed fees are the same heads as the BA LLB without hostel and mess — ₹1,63,000 tuition a year, plus academic services, welfare, utilities, the admission fee and the deposit."
            source: ai-llm-fee
          - links:
              - { label: "CLAT UG", url: "clat.html" }
              - { label: "CLAT PG", url: "clat-pg.html" }
              - { label: "Law (LLB) career guide", url: "llb.html" }
              - { label: "Law college finder", url: "colleges-law.html" }
              - { label: "CLAT &amp; AILET coaching finder", url: "coaching-clat.html" }
