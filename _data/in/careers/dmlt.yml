  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "What is DMLT?"
            a: "DMLT is a 2-year diploma that trains students to perform diagnostic lab tests — blood tests, biochemistry, microbiology, pathology and more — under the supervision of a pathologist or lab head."
          - q: "Can I run my own diagnostic lab after DMLT?"
            a: "Not independently as the registered head. Most states require a lab to have a qualified pathologist (MD Pathology) or equivalent as the responsible signing authority. DMLT holders can work as lab technicians, and many go on to manage or co-own labs alongside a qualified pathologist, but the diploma alone does not make you eligible to independently certify diagnostic reports."
          - q: "What is the difference between DMLT and B.Sc MLT?"
            a: "DMLT is a 2-year diploma with a strong practical, technician-level focus. B.Sc MLT is a 3-4 year degree with deeper theory and typically better access to senior lab technologist, supervisory and hospital administrative roles. Many DMLT holders pursue B.Sc MLT later via lateral entry where available."
          - q: "Is an entrance exam required for DMLT admission?"
            a: "It varies by state and institute. Many colleges admit purely on Class 12 merit, while some states run their own paramedical entrance exam. There is no single national entrance exam that every DMLT college requires, so always check your target institute's and state's current admission process."
          - q: "What subjects are covered in DMLT?"
            a: "Core subjects include Human Anatomy & Physiology, Clinical Biochemistry, Microbiology, Hematology, Histopathology, Clinical Pathology and Blood Banking, combined with substantial hands-on lab practice."
      - note: "*Fee and salary figures are indicative, based on publicly available information as of 2026, and vary significantly by state, institute and employer — always verify current figures directly with your target institute."
        class: "table-note mt-lg"
