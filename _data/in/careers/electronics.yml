  - id: "fees"
    hid: "fees-heading"
    eyebrow: "Wide range by college type"
    heading: "Fees & scholarships"
    parts:
      - prose:
          - "Government-funded institutes remain the most economical route: total fees for the full 4-year Electronics Engineering programme at IITs and NITs commonly fall in the <strong>₹2-8 lakh</strong> range, with fee waivers available based on family income and category. Private colleges vary widely — total costs of roughly <strong>₹5-15 lakh</strong> are typical. Merit-based scholarships and category-based fee concessions are available at most institutes; always confirm current fees directly on your target college's official admission page."
