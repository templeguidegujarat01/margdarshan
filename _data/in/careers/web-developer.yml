  - id: "higher"
    hid: "higher-heading"
    alt: true
    eyebrow: "Skills over further degrees"
    heading: "Career growth paths"
    parts:
      - prose:
          - "Further formal education isn't the typical growth lever here — deepening your framework skills (React, Next.js), moving from frontend-only or backend-only into full-stack, or building a specific specialisation like performance engineering, accessibility, or design systems are reported as the clearest paths to higher pay. A senior frontend developer with 10+ years can transition into a <strong>Web Architect</strong> role, designing scalable architectures for large projects; others transition fully into <a href=\"software-engineer.html\">broader software engineering</a> or specialise into <a href=\"app-developer.html\">mobile app development</a>."
