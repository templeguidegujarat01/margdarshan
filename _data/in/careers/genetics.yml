  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "What is a realistic Genetics salary in India?"
            a: "Freshers with a BSc or MSc, in research-support or lab roles, commonly earn ₹3-4 LPA. Genetic Counselors start around ₹2-3 LPA, rising to ₹6 LPA at mid-level and ₹12 LPA for experienced professionals. Government research roles requiring a Master's or PhD, through bodies like CSIR, ICMR or DBT, generally start at Pay Level-6 (₹35,400-1,12,400 basic pay) with promotions leading to senior positions. Online salary content for this field is unusually inconsistent — some sources cite averages as high as ₹17-28 LPA, which don't reflect typical entry-level or even most mid-career outcomes, so treat very high figures with real skepticism."
          - q: "Is Genetics different from Biotechnology as a career?"
            a: "They overlap heavily in coursework, but Genetics is even more research and PhD-dependent as a standalone career than Biotechnology. Biotechnology has genuine non-PhD alternate paths like Regulatory Affairs and Clinical Research. Genetics' clearest non-PhD path is specifically Genetic Counseling — a patient-facing clinical role — while most other substantial Genetics career tracks (research scientist, genomics researcher) benefit significantly from, or require, a Master's or PhD."
          - q: "What is a Genetic Counselor and is it a good career?"
            a: "A Genetic Counselor helps patients understand genetic test results and make informed decisions about hereditary conditions, often specialising in areas like prenatal care, pediatrics or oncology. It's a genuine, growing clinical career path in India as genomic testing and precision medicine expand, and is one of the few Genetics-related roles offering real patient-facing work without necessarily requiring a full PhD — a relevant Master's degree is typically the standard qualification instead."
          - q: "Do I need a PhD for a career in Genetics?"
            a: "For most substantial research roles — genomics research, gene therapy, academic positions — yes, a PhD is typically required or strongly preferred. Genetic Counseling is the clearest exception, generally requiring a relevant Master's degree rather than a PhD. Laboratory technician and research-support roles are accessible with a Bachelor's or Master's, though these tend to be lower-paying entry points rather than long-term career destinations."
          - q: "Is NEET required for Genetics?"
            a: "No. Genetics-related undergraduate programmes admit via CUET, university-specific entrance exams (including specialised tests like the IISER Aptitude Test or NEST for research-oriented students), state-level admissions, or direct Class 12 merit — NEET is not required."
      - note: "Figures are indicative (2026) — confirm on the official college or authority website."
        class: "table-note mt-lg"
