  read_time: "8 min read"
  intro:
    - "Cyber forensic investigators recover and analyse evidence from phones, computers, networks and the cloud — for police, courts, companies and banks. Typical routes are a B.Sc/M.Sc in Forensic Science with digital forensics (the National Forensic Sciences University, NFSU, is the specialist central university) or a B.Tech/BCA in computer science followed by forensics training. Government forensic labs recruit through UPSC and state commissions."
