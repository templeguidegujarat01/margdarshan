    eyebrow: "Sports Guide · How sport works · Paralympics, Special Olympics &amp; Deaflympics"
    title: "Paralympics, Special Olympics and Deaflympics — sport for every body"
    lede: "Education Margdarshan's plain guide for players with a disability and their families: the three big world events and who each one is for, how classification puts players into fair groups, how many take part, how India has done, and the same government cash awards and jobs that Olympians get."
