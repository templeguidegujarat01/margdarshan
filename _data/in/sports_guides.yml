  # ------------------------------------------------------------------------------------------------ Multi-sport games
  - slug: multi-sport-games
    short: "Asian Games, CWG &amp; Khelo India"
    eyebrow: "Sports Guide · How sport works · Continental &amp; national games"
    title: "Asian Games, Commonwealth Games, National Games and Khelo India — the ladder below the Olympics"
    lede: "Education Margdarshan's plain guide to the big games an Indian player meets on the way up: the Khelo India Games for schools, colleges and more, the National Games between states, the Asian Games and Commonwealth Games abroad — how many countries and players take part, how India did in 2026, and which medals count for jobs."
    meta: "OCA, Commonwealth Sport and Government of India files only"
    official:
      - { label: "PIB — Asian Games 2026 factsheet", url: "https://www.pib.gov.in/FactsheetDetails.aspx?id=151080" }
      - { label: "Khelo India Youth Games", url: "https://youth.kheloindia.gov.in/" }
    facts:
      - { label: "Asian Games 2026 (Japan)", value: "India <strong>4th</strong> · <strong>85 medals</strong> (21 gold)", source: air-ag26 }
      - { label: "Commonwealth Games 2026 (Glasgow)", value: "India <strong>4th</strong> · <strong>39 medals</strong> (13 gold)", source: pib-ki-making }
      - { label: "Commonwealth Games 2030", value: "<strong>Amdavad (Ahmedabad)</strong> — the 100th-year Games", source: pib-cwg30 }
      - { label: "Khelo India Games since 2018", value: "<strong>63,000+</strong> players have competed", source: pib-cwg26 }
    sections:
      - id: ladder
        nav: "The ladder"
        eyebrow: "Step by step"
        heading: "Which games come at which level"
        parts:
          - table:
              caption: "The games an Indian player meets, from bottom to top"
              head: ["Level", "Games", "Who plays"]
              rows:
                - ["School &amp; youth", "<strong>Khelo India Youth Games</strong> (since 2018, first called Khelo India School Games)", "Young players picked by their states"]
                - ["College", "<strong>Khelo India University Games</strong> (since 2020)", "University students"]
                - ["Special", "Khelo India <strong>Winter</strong> (2020), <strong>Para</strong> (2023), <strong>Beach</strong> (2025) and <strong>Tribal</strong> (2026) Games", "Winter, para, beach and tribal sport players"]
                - ["National", "<strong>National Games</strong>", "State teams, plus Services"]
                - ["Asia", "<strong>Asian Games</strong> (every 4 years)", "India's national team"]
                - ["Commonwealth", "<strong>Commonwealth Games</strong> (every 4 years)", "India's national team"]
                - ["World", "<strong>Olympics</strong>, world championships", "The very best"]
            source: "pib-cwg26,pib-ag26fs,air-ng38,pib-cwg30"
          - links:
              - { label: "Summer Olympics guide", url: "olympic-games.html" }
              - { label: "Para sports guide", url: "para-sports.html" }
      - id: khelo
        nav: "Khelo India"
        eyebrow: "Khelo India"
        heading: "Khelo India — the government's grassroots plan"
        parts:
          - list:
              - "<strong>Khelo India</strong> started in 2017 by joining three older schemes. It builds training centres and sports grounds, trains coaches, uses sports science and runs competitions."
              - "By July 2026: <strong>1,067 Khelo India Centres</strong>, <strong>349</strong> new sports infrastructure projects (₹3,176 crore), and <strong>2,745 Khelo India Athletes</strong> getting coaching, kit, medical care and a monthly allowance."
              - "More than <strong>63,000 players</strong> have competed in the Khelo India Games since 2018."
            source: pib-cwg26
          - list:
              - "The Khelo India Youth Games 2025 (Bihar) had <strong>27 sports</strong>, including Indian games like gatka, kalaripayattu, mallakhamb, thang-ta, yogasana and kho-kho."
            source: kiyg25
          - list:
              - "In July 2026 the Cabinet approved a much bigger Khelo India scheme for 2026-27 to 2030-31 (₹36,441 crore together with help to federations). It adds <strong>Khelo India Feeder Schools</strong>, <strong>Khelo India Utkrishta Vidyalayas</strong> and a new <strong>Emerging Khelo India Athletes</strong> group about ten times bigger, and a clear path from Khelo India to TOPS."
            source: pib-ki-revamp
          - note: "Since 4 March 2024, medal winners of the Khelo India Youth (above-18 category), University, Para and Winter Games can claim central government sports-quota jobs."
            source: dopt-2024
      - id: national
        nav: "National Games"
        eyebrow: "National Games"
        heading: "National Games — states play each other"
        parts:
          - list:
              - "The <strong>National Games</strong> are India's own Olympics-style event: states (and the Services team) send players, and medals go to their team. The <strong>38th National Games</strong> were held in <strong>Uttarakhand</strong> in 2025, with venues in Dehradun, Haldwani and other cities."
            source: air-ng38
          - list:
              - "A medal (top 3) for your state at the <strong>National Games</strong> is one of the results that count for central sports-quota jobs."
            source: dopt-2024
      - id: asian
        nav: "Asian Games"
        eyebrow: "Asian Games"
        heading: "Asian Games — Asia's biggest sports event"
        parts:
          - list:
              - "The Asian Games are held <strong>once every four years</strong> by the <strong>Olympic Council of Asia</strong>, which has <strong>45 member countries or regions</strong>. India had the idea: the <strong>first Asian Games</strong> were held in <strong>New Delhi in March 1951</strong> — 11 nations, 489 athletes, six sports."
            source: pib-ag26fs
          - table:
              caption: "Asian Games 2026, Aichi-Nagoya (Japan), 19 Sep – 4 Oct 2026"
              head: ["What", "Number"]
              rows:
                - ["Sports / disciplines", "<strong>43</strong> sports, 71 disciplines"]
                - ["Medal events", "<strong>469</strong> (1,407 medals given)"]
                - ["India's team", "<strong>501 players</strong> in 36 disciplines — over 300 at their first Asian Games"]
                - ["India's result", "<strong>4th</strong> — 85 medals: 21 gold, 27 silver, 37 bronze"]
                - ["India's top gold sports", "Archery 5 · shooting 3 · boxing 3 · cricket, hockey and kabaddi 2 each"]
                - ["Next Asian Games", "Doha, Qatar, 2030"]
            source: "pib-ag26fs,air-ag26"
          - table:
              caption: "India's Asian Games medals"
              head: ["Games", "Medals"]
              rows:
                - ["Incheon 2014", "57"]
                - ["Jakarta 2018", "69"]
                - ["Hangzhou (2023)", "107 — India's best ever"]
                - ["Aichi-Nagoya 2026", "85"]
            source: "pib-cwg26,air-ag26"
      - id: cwg
        nav: "Commonwealth Games"
        eyebrow: "Commonwealth Games"
        heading: "Commonwealth Games — and India hosts in 2030"
        parts:
          - table:
              caption: "Commonwealth Games 2026, Glasgow (23 Jul – 2 Aug 2026)"
              head: ["What", "Number"]
              rows:
                - ["Countries", "<strong>74</strong>"]
                - ["Sports", "<strong>10</strong> (6 para sports fully included), at 4 venues"]
                - ["India's team", "<strong>124 players</strong> — 78 men, 46 women"]
                - ["India's result", "<strong>4th</strong> — 39 medals: 13 gold, 17 silver, 9 bronze"]
            source: "pib-cwg26,pib-ki-making"
          - list:
              - "India's firsts at Glasgow 2026: <strong>Asmita Dey</strong> became India's first Commonwealth Games judo champion; <strong>Tejaswin Shankar</strong> won India's first decathlon medal; <strong>Mirabai Chanu</strong> won her third Commonwealth gold in a row."
            source: pib-ki-making
          - list:
              - "India's earlier Commonwealth Games: <strong>64</strong> medals (Glasgow 2014), <strong>66</strong> (Gold Coast 2018), <strong>61</strong> (Birmingham 2022)."
              - "<strong>Amdavad (Ahmedabad)</strong> will host the <strong>2030 Commonwealth Games</strong> — the 100th-year (centenary) Games, and India's first as host in 20 years."
            source: "pib-cwg26,pib-cwg30"
      - id: other
        nav: "World Games &amp; Youth Olympics"
        eyebrow: "Two more you should know"
        heading: "World Games and Youth Olympic Games"
        parts:
          - list:
              - "<strong>The World Games</strong> are for sports that are mostly <strong>not</strong> in the Olympics — like korfball, tug of war, kickboxing and life saving. Chengdu 2025 had 34 sports; the next is Karlsruhe 2029."
            source: twg25
          - list:
              - "The <strong>Youth Olympic Games</strong> are for players up to <strong>17</strong>. Dakar 2026 (Senegal) runs for two weeks from <strong>31 October 2026</strong>."
            source: ioc-dakar
          - links:
              - { label: "Every sport A–Z — which games each sport is played at", url: "all-sports.html" }
      - id: doubts
        nav: "Quick doubts"
        eyebrow: "Quick doubts"
        heading: "Straight answers"
        parts:
          - qa:
              q: "Does a Khelo India medal count for a government job?"
              a: "Yes. Since 4 March 2024, medals at the <strong>Khelo India Youth Games (above-18 category), University, Para and Winter Games</strong> count for central government sports-quota jobs."
            source: dopt-2024
          - qa:
              q: "Which is bigger for India — Asian Games or Commonwealth Games?"
              a: "In 2026 the Asian Games had <strong>469 events</strong> and India won <strong>85 medals</strong>; the Commonwealth Games had only <strong>10 sports</strong> and India won <strong>39</strong>. Both give the same government cash award: <strong>₹30 lakh</strong> for gold."
            source: "pib-ag26fs,air-ag26,pib-ki-making,myas-cash"
