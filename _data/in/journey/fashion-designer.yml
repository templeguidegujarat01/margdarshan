# Journey Blueprint — Fashion Designer (B.Des — NIFT / NID / UCEED). Printed on journey-fashion-designer.html (_includes/journey-doubts.html).
# Rules, classes and the money items / sources several careers share: _data/in/journey_common.yml.
# `money_defs` / `sources` below are used only by this career. Check: node scripts/check-journey-matrix.mjs
id: fashion-designer
v: 2
name: "Fashion Designer (B.Des — NIFT / NID / UCEED)"
search: ["fashion designer", "digital fashion designer", "fashion illustrator", "textile designer", "knitwear designer", "accessory designer", "fashion stylist"]
search_not: ["influencer", "model", "backstage", "coordinator", "sourcing"]
page: "fashion-design.html"
roadmap: "roadmaps/fashion-design.html"
doubts_page: "journey-fashion-designer.html"
gate: "Class 12 in any stream → NIFT entrance (GAT + CAT, then a Situation Test), NID DAT, UCEED or a state / private design test → 4-year B.Des in Fashion, Textile, Knitwear or Accessory Design → design studio, brand, export house or your own label."
gate_source: [nift-ag, nid-hb, uc-ib]
core:
  what:
    text: "A fashion designer creates clothes and accessories: researches trends, sketches, chooses fabrics, makes samples and works with production teams. NIFT, the national fashion institute, is a statutory institute under the NIFT Act, 2006, with 20 campuses."
    source: nift-ib
  day:
    - "Research trends and customers, then sketch and build a collection idea."
    - "Pick fabrics and colours, make patterns and samples, and fit them on models."
    - "Work with tailors, factories, merchandisers and buyers to meet costs and deadlines."
  pay_note: "No official body publishes fashion designer pay, so none is printed here."
  routes:
    - { title: "NIFT B.Des", text: "Fashion, Textile, Knitwear, Accessory, Leather, Fashion Communication and Fashion Interiors — 4,014 UG seats in the 2026 guidelines.", source: nift-ag }
    - { title: "NID", text: "The Design Aptitude Test admits to the 5½-year Integrated M.Des at NID Ahmedabad and B.Des / Integrated M.Des at other NIDs.", source: nid-hb }
    - { title: "IIT B.Des (UCEED)", text: "UCEED is the only route into B.Des at IIT Bombay, Delhi, Guwahati, Hyderabad, Indore, Roorkee and IIITDM Jabalpur.", source: uc-ib }
  cost_time:
    - { label: "NIFT B.Des", value: "4 years — NIFT prints the fee structure for the 2026-30 batch", source: nift-pr }
    - { label: "NIFT application 2026", value: "₹2,000 one programme · ₹3,000 B.Des + B.F.Tech (₹500 / ₹750 SC / ST / PwD)", source: nift-ag }
    - { label: "NID DAT 2027-28", value: "₹3,000 · women ₹2,000 · SC / ST ₹1,500 · PwD ₹500", source: nid-hb }
    - { label: "UCEED 2027", value: "₹4,000 · women and SC / ST / PwD ₹2,000", source: uc-ib }
  cost_note: "Design colleges charge high fees — read each institute's fee notice (NIFT prints its 2026-30 fee structure in the prospectus)."
  challenges:
    - text: "Age limits are tight: NIFT B.Des needs you to be <strong>under 24 on 1 August</strong> of the admission year (5 years more for SC / ST / PwD)."
      source: nift-ag
    - text: "NID needs Class 12 passed <strong>in the first attempt</strong> — a compartment or supplementary cancels the admission."
      source: nid-hb
    - text: "A rank is not a seat: UCEED qualifiers must apply again for B.Des seats, and the seat acceptance fee is ₹65,000 (₹20,000 SC / ST / PwD), adjusted in the institute fee."
      source: uc-ib
  not_for:
    - "You want a fixed 10-to-5 job — collections and shows bring deadline rushes."
    - "You cannot take criticism of your work — design is reviewed and changed many times."
    - "You only like drawing but not fabrics, costs and production details."
journey:
  - stages: [c8, c9]
    title: "Sketch, observe and build a portfolio habit"
    do:
      - text: "Keep a sketchbook: draw people, clothes and objects every week. NIFT's B.Des merit gives 50% weight to its Creative Ability Test (CAT)."
        source: nift-ag
      - text: "Read newspapers — NIFT's written test has a General Knowledge and Current Affairs section."
        source: nift-ag
    doubts:
      - q: "Do I need to be good at drawing for fashion design?"
        a: "It helps a lot. NIFT's B.Des merit is 50% Creative Ability Test, 30% General Ability Test and 20% Situation Test, and UCEED and NID also test drawing and design."
        next: "Start a sketchbook now and fill it every week."
        source: [nift-ag, uc-ib, nid-hb]
      - q: "Which are the main design entrance tests?"
        a: "NIFT's entrance (NIFTEE) for NIFT campuses, the NID Design Aptitude Test for the National Institutes of Design, and UCEED for B.Des at IITs and IIITDM Jabalpur."
        next: "Read each test's dates in the Exams block when you reach Class 12."
        source: [nift-ag, nid-hb, uc-ib]
  - stages: [c10]
    title: "Any stream is fine"
    do:
      - text: "NIFT B.Des and NID accept Class 12 in <strong>any stream</strong>. Only B.F.Tech (NIFT) needs Mathematics."
        source: [nift-ag, nid-hb]
    stream: "Any stream. Take Maths if you may want B.F.Tech or IIT Guwahati / Roorkee B.Des (they need PCM)."
    doubts:
      - q: "Which stream should I take for fashion design?"
        a: "Any stream works for NIFT B.Des and NID. Maths is needed only for NIFT's B.F.Tech, and IIT Guwahati and IIT Roorkee B.Des need Physics, Chemistry and Mathematics."
        next: "Pick the stream you will score well in."
        source: [nift-ag, nid-hb, uc-ib]
      - q: "Can Commerce or Arts students do fashion design?"
        a: "Yes. NIFT B.Des has no subject condition, and NID accepts Science, Arts, Commerce or Humanities."
        next: "Build your drawing skills alongside your subjects."
        source: [nift-ag, nid-hb]
  - stages: [c11, c12]
    title: "Entrance year: NID in December, UCEED in January, NIFT in February"
    do:
      - text: "Apply early: NID DAT forms close in November; UCEED in October; NIFT in early January."
        source: [nid-hb, uc-ib, nift-ag]
      - text: "Pass Class 12 in the first attempt — NID cancels admission for any compartment."
        source: nid-hb
    exams:
      - { name: "NID DAT Prelims 2027-28", when: "Apply by 30 Nov 2026 · exam 20 Dec 2026", source: nid-hb }
      - { name: "UCEED 2027", when: "Register 1–31 Oct 2026 · exam 17 Jan 2027", source: uc-ib }
      - { name: "NIFT entrance 2026 (last cycle)", when: "Register 8 Dec 2025 – 6 Jan 2026 · test 8 Feb 2026", source: [nift-ag, nift-pn] }
    money: [csss, pms-sc]
    mistakes:
      - "Missing the UCEED or NID window because you planned only for NIFT."
      - "Preparing only GK and English and ignoring the drawing paper."
    late: "Missed this year's tests? NIFT allows you until just under 24, so you can sit the next cycle."
    doubts:
      - q: "What is the age limit for NIFT?"
        a: "You must be under 24 on 1 August of the year of admission; SC, ST and PwD candidates get 5 more years."
        next: "Count how many NIFT cycles you have left."
        source: nift-ag
      - q: "What is the age limit for UCEED?"
        a: "For UCEED 2027 you must be born on or after 1 October 2002 (Open, EWS, OBC-NCL) or 1 October 1997 (SC, ST, PwD)."
        next: "Check your birth date against the brochure."
        source: uc-ib
      - q: "Is there negative marking in NIFT?"
        a: "In the General Ability Test, yes: +1 for a correct answer and −0.25 for a wrong one."
        next: "Skip questions you are unsure of in the GAT."
        source: nift-ib
      - q: "Can I take the NIFT test while in Class 12?"
        a: "Yes, but you must prove you have passed at seat allocation — by 30 September in the 2026 cycle — or the admission is cancelled and fees forfeited."
        next: "Do not neglect your board exams."
        source: nift-ag
      - q: "What is the NIFT Situation Test?"
        a: "The second stage for B.Des candidates, worth 20% of the final merit. B.F.Tech has no second stage — its written test is final."
        next: "Practise making quick models from simple materials."
        source: nift-ag
      - q: "Is there negative marking in UCEED?"
        a: "In Part A, yes: −0.71 for a wrong single-answer MCQ and −1 for a wrong multiple-select question; numerical-answer questions have no negative marking."
        next: "Attempt every numerical-answer question."
        source: uc-ib
      - q: "Which IITs give B.Des through UCEED?"
        a: "IIT Bombay, IIT Delhi, IIT Guwahati, IIT Hyderabad, IIT Indore, IIT Roorkee and IIITDM Jabalpur. IIT Guwahati and IIT Roorkee need Physics, Chemistry and Mathematics in Class 12."
        next: "Register for UCEED in October of your Class 12 year."
        source: uc-ib
  - stages: [ug]
    title: "In B.Des: build a strong portfolio"
    do:
      - text: "NIFT B.Des seats in 2026: Fashion Design 801, Fashion Communication 719, Textile 681, Accessory 637, Knitwear 351, Leather 152, Fashion Interiors 82."
        source: nift-ag
      - text: "Keep every project, internship and photo shoot — your portfolio gets you jobs."
    doubts:
      - q: "Does NIFT have state quota seats?"
        a: "Yes, at some campuses. Bhopal, Bhubaneswar, Daman, Jodhpur, Kangra, Kannur, Nava Raipur, Panchkula, Patna, Shillong, Srinagar and Varanasi keep supernumerary domicile seats — seven each (12 at Srinagar). Domicile is the state where you finished Class 12."
        next: "Check if your state has a NIFT campus with domicile seats."
        source: nift-ag
      - q: "What is the reservation at NIFT?"
        a: "SC 15%, ST 7.5%, OBC (non-creamy layer) 27%, GEN-EWS 10%, and 5% horizontal for PwD."
        next: "Keep your category certificate in the central format ready."
        source: nift-ag
  - stages: [grad]
    title: "After B.Des: work, your own label, or a master's"
    do:
      - text: "Join a brand, export house, retailer or design studio — or start your own label."
      - text: "For a master's, NIFT and NID run M.Des programmes; UCEED's sister test CEED covers M.Des at IITs."
    doubts:
      - q: "Does an NID or UCEED rank guarantee a seat?"
        a: "No. A UCEED rank is not a seat — you must apply again through the joint seat allocation, and the score is valid only for that year's admissions."
        next: "Fill the B.Des application window after the result."
        source: uc-ib
  - stages: [work]
    title: "Starting design later"
    do:
      - text: "Age limits are the main barrier for B.Des at NIFT, NID and IITs — check each before you plan."
        source: [nift-ag, nid-hb, uc-ib]
    doubts:
      - q: "I am 23. Is it too late for NIFT?"
        a: "Not yet — NIFT B.Des takes candidates under 24 on 1 August of the admission year (under 29 for SC, ST and PwD). NID's 2027 cut-off was born on or after 1 July 2006 for General candidates."
        next: "Apply in the next cycle without delay."
        source: [nift-ag, nid-hb]
board_note: "Every board counts. NIFT also accepts NIOS Senior Secondary with five subjects; NID accepts NIOS and other listed equivalents."
board_source: [nift-ag, nid-hb]
