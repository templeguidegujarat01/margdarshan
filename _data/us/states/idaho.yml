# Idaho (USA 50-state licensure portal, 2026-10-22). Schema: _data/us/state_index.yml. Boards tier: the
# licensing boards for lawyers, physicians, CPAs and nurses, copied from the national directories of state boards (NCBE,
# FSMB, NASBA, NCSBN). Diploma, state test, tuition, aid, jobs and apprenticeship blocks are still in the Phase 11 queue;
# the page prints only the blocks that exist.
name: "Idaho"
abbr: ID
checked: 2026-10-22
review_by: 2027-04-22
lede: "In Idaho, the Idaho State Bar handles bar admission for lawyers, the Idaho Board of Medicine licenses physicians, the Idaho State Board of Accountancy licenses CPAs and the Idaho Board of Nursing licenses registered nurses."

boards:
  # 50-state portal (2026-10-22): bar admission agency (NCBE jurisdiction page), medical board(s) (FSMB directory),
  # board of accountancy (NASBA directory), board of nursing (NCSBN member page). Links checked 2026-10-22.
  law: { body: "Idaho State Bar", url: "https://www.isb.idaho.gov", stat: "NextGen UBE", exam: "NextGen UBE.", note: "MPRE required (passing score 85).", src: ncbe_id }
  medicine:
    src: fsmb_boards
    boards:
      - { body: "Idaho Board of Medicine", url: "https://dopl.idaho.gov/bom/" }
  cpa:
    src: nasba_boards
    boards:
      - { body: "Idaho State Board of Accountancy", url: "https://dopl.idaho.gov/boa/" }
  nursing:
    src: ncsbn_id
    boards:
      - { body: "Idaho Board of Nursing", url: "https://dopl.idaho.gov/bon/" }
