# Journey Blueprint — Indian Coast Guard Assistant Commandant (CGCAT → PSB → FSB → INA Ezhimala). Printed on journey-coast-guard-officer.html.
# Rules, classes and the money items / sources several careers share: _data/in/journey_common.yml.
# `money_defs` / `sources` below are used only by this career. Check: node scripts/check-journey-matrix.mjs
id: coast-guard-officer
v: 2
name: "Indian Coast Guard Assistant Commandant (CGCAT)"
search: ["indian coast guard assistant commandant", "coast guard officer", "assistant commandant coast guard", "cgcat", "coast guard general duty", "coast guard technical officer"]
page: "coaching-defence.html"
doubts_page: "journey-coast-guard-officer.html"
gate: "Class 12 with Mathematics and Physics → any graduate degree (GD) or an engineering degree in listed branches (Technical) → age 21–25 → CGCAT online test → Preliminary Selection Board → Final Selection Board → medicals → Naval Orientation Course at INA Ezhimala."
gate_source: icg-ac27
core:
  what:
    text: "The Indian Coast Guard is an Armed Force of the Union under the Ministry of Defence. An Assistant Commandant is its entry-level Group 'A' gazetted officer, in the General Duty or Technical (Engineering / Electrical-Electronics) branch."
    source: icg-ac27
  day:
    - "Command or serve on Coast Guard ships and boats on patrol at sea."
    - "Lead search and rescue, maritime safety and law-enforcement tasks."
    - "Technical officers maintain ship engines, hulls, electrical and electronic systems."
  pay:
    - { level: "Assistant Commandant", value: "Pay Level 10 · starting basic ₹56,100 + allowances", source: icg-ac27 }
    - { level: "Commandant", value: "Pay Level 13 · starting basic ₹1,23,100", source: icg-ac27 }
  routes:
    - { title: "General Duty (GD)", text: "Any graduate degree, with Mathematics and Physics up to Class 12 (or a diploma with Physics and Mathematics before the degree). 140 vacancies for the 2027 batch.", source: icg-ac27 }
    - { title: "Technical (Engineering / Electrical)", text: "Engineering degree in Naval Architecture, Mechanical, Marine, Automotive, Mechatronics, Industrial & Production, Metallurgy, Design, Aeronautical or Aerospace (Engineering) — or Electrical, Electronics, Telecom, Instrumentation, Power Engineering or Power Electronics (Electrical). 30 vacancies for the 2027 batch.", source: icg-ac27 }
    - { title: "Women (SSA)", text: "The 2027-batch advertisement invited men only. ICG's officer site lists a separate Assistant Commandant (Women-SSA) entry — check each year's advertisement.", source: [icg-ac27, icg-women] }
  cost_time:
    - { label: "Exam fee", value: "₹300 · SC / ST exempt", source: icg-ac27 }
    - { label: "Selection", value: "2027 batch: applications Jul 2025, CGCAT Sep 2025, induction by Dec 2026", source: icg-ac27 }
    - { label: "Training", value: "Naval Orientation Course at INA Ezhimala: 44 weeks (GD), 22 weeks (Technical), then training on ships and units", source: icg-ac27 }
  cost_note: "The advertisement does not print a training fee or a stipend amount, so neither is printed here."
  challenges:
    - text: "Five stages, each one compulsory — CGCAT, PSB, FSB, special medicals and induction."
      source: icg-ac27
    - text: "Strict age window: 21–25 on 1 July of the batch year (born 1 Jul 2001 – 30 Jun 2005 for the 2027 batch)."
      source: icg-ac27
    - text: "Trainees can be discharged as unsuitable if their progress or conduct is unsatisfactory during training."
      source: icg-ac27
  not_for:
    - "You do not want life at sea or postings along the coast."
    - "You want to choose your city — officers serve where the Coast Guard needs them."
    - "You cannot meet the physical standards (157 cm minimum height for men in GD / Technical)."
journey:
  - stages: [c8, c9]
    title: "Fitness and Maths–Physics"
    do:
      - text: "Every branch needs Mathematics and Physics up to Class 12 — keep both."
        source: icg-ac27
    doubts:
      - q: "What does a Coast Guard Assistant Commandant do?"
        a: "Assistant Commandant is the Coast Guard's entry Group 'A' gazetted officer rank — leading ships, patrols, search and rescue (General Duty) or keeping the ships' engineering and electrical systems running (Technical)."
        next: "Read the Routes list above."
        source: icg-ac27
      - q: "Is the Coast Guard part of the Navy?"
        a: "No. It is a separate Armed Force of the Union under the Ministry of Defence, though its officers train at the Indian Naval Academy, Ezhimala."
        next: "Compare it with the Navy officer road below."
        source: icg-ac27
  - stages: [c10]
    title: "Pick Science with Mathematics and Physics"
    do:
      - text: "Take Mathematics and Physics in Class 11–12: the GD branch needs both up to Class 12, and engineering degrees need them too."
        source: icg-ac27
    stream: "Science with Mathematics and Physics."
    doubts:
      - q: "Can I wear glasses?"
        a: "General Duty needs 6/6 and 6/9 without glasses (6/6, 6/6 corrected). Technical allows 6/36 without glasses if corrected to 6/6 in each eye."
        next: "Get your eyes tested early."
        source: icg-ac27
      - q: "Are tattoos allowed?"
        a: "Permanent tattoos are allowed only on the inner forearm (elbow to wrist) and the back of the hand; candidates from notified tribal areas get concessions."
        next: "Think before getting a tattoo."
        source: icg-ac27
      - q: "Can a Commerce student become a Coast Guard officer?"
        a: "General Duty needs Mathematics and Physics up to Class 12 (or a diploma with Physics and Mathematics before the degree). Without them you are not eligible for the 2027-batch entries."
        next: "Keep Maths and Physics in Class 11."
        source: icg-ac27
  - stages: [c11, c12]
    title: "Class 12 with Maths and Physics, then a degree"
    do:
      - text: "Pass Class 12 with Mathematics and Physics, then choose any degree (GD) or an engineering degree in a listed branch (Technical)."
        source: icg-ac27
    doubts:
      - q: "Can I join the Coast Guard as an officer straight after Class 12?"
        a: "No. Assistant Commandant entries need a graduate degree; the age window is 21–25."
        next: "Pick a degree you will finish by about 21–22."
        source: icg-ac27
      - q: "Is there a minimum percentage in the degree?"
        a: "The 2027-batch advertisement asks only for a graduate degree from a recognised university — it prints no minimum percentage. ICG's Women (SSA) entry page lists 60% (55% SC / ST), so read each year's advertisement."
        next: "Keep good marks anyway."
        source: [icg-ac27, icg-women]
  - stages: [ug]
    title: "Final-year students can apply"
    do:
      - text: "Final-year students may sit CGCAT, but must show proof of passing the degree by the deadline and bring a bonafide certificate to PSB / FSB."
        source: icg-ac27
      - text: "CGCAT: 100 MCQs in 2 hours — English, Reasoning & Numerical Ability, General Science & Mathematics, General Knowledge (25 each); +4 correct, −1 wrong; English medium."
        source: icg-ac27
    money: [icg-fee]
    doubts:
      - q: "Is there negative marking in CGCAT?"
        a: "Yes: four marks for each correct answer and minus one for each wrong answer."
        next: "Skip questions you cannot narrow down."
        source: icg-ac27
      - q: "Which subjects are in CGCAT?"
        a: "English, Reasoning & Numerical Ability, General Science & Mathematics, and General Knowledge — 25 questions each, 2 hours in all."
        next: "Practise all four sections."
        source: icg-ac27
      - q: "Can I apply for both GD and Technical?"
        a: "Yes, if you are eligible for both: give Option-I and Option-II. Stage-I shortlisting considers only your first option."
        next: "Put the branch you want most as Option-I."
        source: icg-ac27
  - stages: [grad]
    title: "PSB, FSB, medicals, merit"
    do:
      - text: "PSB (Stage II): a computerised cognitive test and a Picture Perception & Discussion Test — qualifying only. FSB (Stage III): psychological test, group task and interview."
        source: icg-ac27
      - text: "The All India merit list uses combined marks of Stage I and Stage III; the 2027 batch's merit list was due in December 2026, with training from early January 2027."
        source: icg-ac27
    money: [icg-fee]
    doubts:
      - q: "Where is the medical test?"
        a: "At Base Hospital, New Delhi (Special Medical Board). If declared unfit you may appeal within 42 days."
        next: "Get any eye or health issue checked early."
        source: icg-ac27
      - q: "What is the minimum height?"
        a: "157 cm for Assistant Commandant (GD) and Technical; lower limits apply to candidates from hilly and tribal areas as per Central Government rules. The Women (SSA) page lists 152 cm."
        next: "Check the medical standards before applying."
        source: [icg-ac27, icg-women]
      - q: "How long is training?"
        a: "Naval Orientation Course at INA Ezhimala — 44 weeks for General Duty and 22 weeks for Technical — followed by training at Navy and Coast Guard establishments, units and ships."
        next: "Be fit before you report."
        source: icg-ac27
      - q: "What do Coast Guard officers earn?"
        a: "Assistant Commandant starts at Pay Level 10 (basic ₹56,100); Deputy Commandant Level 11 (₹67,700); Commandant Level 13 (₹1,23,100), plus allowances."
        next: "See the pay line above."
        source: icg-ac27
      - q: "Do SC / ST candidates get travel fare?"
        a: "Yes. SC / ST candidates not employed by government get second-class train / bus fare for CGCAT if home is over 30 km away, and second-class fare for PSB and FSB however many times they appear. Every candidate appearing in FSB for the first time gets AC III / chair car or bus fare. Original tickets are needed."
        next: "Keep your tickets."
        source: icg-ac27
  - stages: [work]
    title: "Already working"
    do:
      - text: "Serving government employees must upload a no-objection certificate; serving Coast Guard and equivalent Army / Navy / Air Force personnel get 5 years' age relaxation."
        source: icg-ac27
    doubts:
      - q: "I am 24 and working. Can I still apply?"
        a: "Yes, if you are within the 21–25 window on the batch's reference date and hold the required degree. Serving government employees need an NOC from their employer."
        next: "Check the age window in the next advertisement."
        source: icg-ac27
board_note: "Any board. You need Mathematics and Physics up to Class 12 (or a diploma with both before your degree)."
board_source: icg-ac27
