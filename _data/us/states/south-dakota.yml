lede: "In South Dakota, the South Dakota Board of Bar Examiners handles bar admission for lawyers, the South Dakota Board of Medical and Osteopathic Examiners licenses physicians, the South Dakota Board of Accountancy licenses CPAs and the South Dakota Board of Nursing licenses registered nurses."

