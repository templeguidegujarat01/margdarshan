          - { tag: "About 2 years", title: "Master of Social Work (MSW)", text: "From an accredited program, with a supervised practicum or internship.", kind: stage, source: ooh_socialwork }
          - { tag: "Exam", title: "ASWB Masters exam (LMSW, where offered)", text: "New York, for example, requires it for the LMSW.", kind: exam, source: ny_op_lmsw, href: "us/professional-licenses/social-work/#exams", link: "ASWB exams" }
          - { tag: "Years", title: "Supervised clinical experience", text: "The length varies by state and may take several years.", kind: stage, source: ooh_socialwork }
          - { tag: "Exam", title: "ASWB Clinical exam", text: "", kind: exam, source: aswb_exam, href: "us/professional-licenses/social-work/#exams", link: "ASWB exams" }
