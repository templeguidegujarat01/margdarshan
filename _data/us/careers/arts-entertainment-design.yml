  # 253,100 jobs (crosswalk: Arts 1)
  - slug: graphic-designer
    short: "Graphic Designer"
    title: "Graphic designer: bachelor's in graphic design (or training after another degree) and a portfolio"
    eyebrow: "Arts, Entertainment, & Design · Design & Digital Arts"
    lede: "Graphic designers usually need a bachelor's degree in graphic design or a related field, and a portfolio that shows their creativity and originality. Many degree programs ask for a year of basic art and design courses first, and some schools ask applicants for sketches or other examples of their work."
    for: "Creative people who like solving visual problems for clients and can juggle several deadlines."
    soc: ["27-1024"]
    does: { text: "Graphic designers create visual concepts, using computer software or by hand, to communicate ideas that inspire, inform, and captivate consumers.", source: ooh_qf_graphic }
    work: { text: "Many of these workers are employed in specialized design services, publishing, or advertising, public relations, and related services industries.", source: ooh_qf_graphic }
    become: { text: "Graphic designers usually need a bachelor’s degree in graphic design or a related field. Candidates for graphic design positions should have a portfolio that demonstrates their creativity and originality.", source: ooh_qf_graphic }
    metrics: { pay: 62960, pay_hour: "30.27", pay_by: "Graphic designers", jobs: 253100, outlook: -2, outlook_words: "Decline", change: -4200, entry: "Bachelor's degree", training: "None", source: ooh_qf_graphic }
    license_text: "Not required"
    routes:
      - id: degree
        title: "Bachelor's in graphic design + portfolio"
        tag: "Typical"
        who: "More than 360 postsecondary colleges, universities and independent institutes are accredited with programs in art and design."
        steps:
          - { tag: "Start", title: "High school: basic art and design courses", text: "", kind: start, source: ooh_graphic }
          - { tag: "Admission", title: "Sketches or other examples of your artistic ability", text: "Some schools require them; many programs require a year of basic art and design courses before admitting you to the degree.", kind: stage, source: ooh_graphic }
          - { tag: "About 4 years", title: "Bachelor's in graphic design or a related fine arts field", text: "Studio art, principles of design, computerized design, commercial graphics production, printing techniques and website design.", kind: stage, source: ooh_graphic }
          - { tag: "While studying", title: "Internships and a portfolio", text: "Employers rely on portfolios in making hiring decisions.", kind: stage, source: ooh_graphic }
          - { tag: "Goal", title: "Graphic designer", text: "", kind: goal, source: ooh_qf_graphic }
      - id: other-degree
        title: "Degree in another field + graphic design training"
        tag: "Career change"
        who: "People who have a bachelor's degree in another field may complete technical training in graphic design to meet most hiring qualifications."
        steps:
          - { tag: "Start", title: "Bachelor's degree in any field", text: "", kind: start, source: ooh_graphic }
          - { tag: "Training", title: "Technical training in graphic design", text: "", kind: stage, source: ooh_graphic }
          - { tag: "Proof", title: "A portfolio of completed work", text: "", kind: stage, source: ooh_graphic }
          - { tag: "Goal", title: "Graphic designer", text: "", kind: goal, source: ooh_qf_graphic }
      - id: apprenticeship
        title: "Registered Apprenticeship"
        tag: "Earn while you learn"
        who: "DOL lists Graphic Designer as an apprenticeable occupation."
        steps:
          - { tag: "Start", title: "High school diploma", text: "", kind: start, source: ooh_graphic }
          - { tag: "Find a program", title: "A Registered Apprenticeship", text: "Validated by the U.S. Department of Labor or a State Apprenticeship Agency.", kind: stage, source: dol_rap }
          - { tag: "3,000 hours", title: "Graphic Designer (RAPIDS 0010)", text: "Time-based minimum term: <strong>3,000 hours</strong>.", kind: stage, source: dol_occupations }
          - { tag: "Goal", title: "Graphic designer", text: "", kind: goal, source: ooh_qf_graphic }
    certs:
      - { name: "Software certification", who: "Software product vendors", kind: "Voluntary", text: "Certification in graphic design software demonstrates competence and may give jobseekers a competitive advantage.", source: ooh_graphic }
    states_title: "What an art school publishes"
    states_col: "School"
    states_note: "There is no national rule for art school portfolios: each school sets its own. One school's published rule, as an example; check every school you apply to."
    states:
      - { place: "Rhode Island School of Design (RISD)", body: "First-year admission", rule: "A portfolio of <strong>12 to 20 examples</strong> of your most recent work, uploaded to SlideRoom after you start the Common Application ($60 application fee plus $10 for the portfolio). RISD strongly recommends some drawing or painting from direct observation; up to three slides may show research or preparatory work, and any use of AI must be described.", sources: [risd_apply] }

