            fit: "Eligible"
            tone: "y"
            icon: "arts"
      - note: "Any stream; Maths at Class 12 helps a lot for economics degrees at the most selective colleges."
  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What does an Economist do?"
    parts:
      - overview:
          points:
            - "Economists study data on growth, prices, jobs, trade and public finance, and build models to test policy choices."
            - "IES officers support ministries on budgets, schemes, regulation and international economic matters."
            - "In business, economists forecast demand, assess risk and advise on markets."
  - id: "who"
    hid: "who-heading"
    alt: true
    eyebrow: "Fit check"
    heading: "Who should become an Economist"
    parts:
      - fit:
          match:
            - "Enjoy economics, data and current affairs."
            - "Can write clear analysis."
            - "Want a policy or research career."
          mismatch:
            - "Dislike maths and statistics."
            - "Want a quick job after graduation — most economist roles need a master's."
            - "Prefer field or creative work."
  - id: "eligibility"
    hid: "elig-heading"
    eyebrow: "Eligibility"
    heading: "What you need, stage by stage"
    parts:
      - elig_list:
          - "For IES: a <strong>postgraduate degree in Economics, Applied Economics, Business Economics or Econometrics</strong>."
          - "Age limits and relaxations as per the current UPSC notice."
          - "RBI and research roles have their own eligibility in each notice."
  - id: "roadmap"
    hid: "roadmap-heading"
    alt: true
    eyebrow: "Step-by-step"
    heading: "Your full path to becoming an Economist"
    parts:
      - steps:
          - title: "Class 12"
            text: "Maths keeps top economics programmes open."
          - title: "BA/B.Sc Economics"
            text: "Build micro, macro and statistics basics."
          - title: "MA Economics"
            text: "Needed for IES and most economist roles."
          - title: "UPSC IES/ISS exam"
            text: "Economics papers, General English, General Studies, interview."
          - title: "IES or other routes"
            text: "Ministries, RBI, research institutes, banks and consultancies."
      - roadmap_card: "Economist"
  - id: "exams"
    hid: "exams-heading"
    eyebrow: "Exams & licences"
    heading: "UPSC IES/ISS examination"
    parts:
      - chips:
          - label: "Combined exam"
            text: "One UPSC examination for the Indian Economic Service and Indian Statistical Service."
            source: "upsc"
          - label: "IES papers"
            text: "General English, General Studies and economics papers, followed by an interview."
            source: "upsc"
          - label: "Other routes"
            text: "RBI Grade B (DEPR), UGC-NET for research and teaching."
  - id: "salary"
    hid: "salary-heading"
    alt: true
    eyebrow: "Official pay level"
    heading: "Economist pay in India"
    intro: "IES is a Group A central service on the 7th CPC pay matrix; private and research pay varies."
    parts:
      - salary:
          - label: "IES entry"
            value: "Level 10"
            text: "Group A central services start at Level 10 of the 7th CPC pay matrix (₹56,100 entry basic), plus DA, HRA and other allowances."
          - label: "Private economist"
            value: "Varies"
            text: "Banks, consultancies and rating agencies hire economists with a master's."
          - label: "Senior IES"
            value: "Higher levels"
            text: "Adviser-level posts in ministries."
  - id: "jobs"
    hid: "jobs-heading"
    eyebrow: "Where they work"
    heading: "Employers & growth path"
    parts:
      - chips:
          - label: "Government"
            text: "Union ministries (finance, commerce and others), NITI Aayog, statistical and planning bodies"
          - label: "Central bank"
            text: "Reserve Bank of India research departments"
          - label: "Private & research"
            text: "Banks, rating agencies, consultancies, think tanks, universities"
  - id: "proscons"
    hid: "pc-heading"
    alt: true
    eyebrow: "Honest take"
    heading: "Advantages and disadvantages"
    parts:
      - proscons:
          pros:
            - "Elite Group A policy service."
            - "Varied careers across government, RBI and business."
            - "Intellectually rich work."
          cons:
            - "Needs a master's degree."
            - "Very few IES vacancies a year."
            - "Competitive preparation."
  - hid: "related-heading"
    alt: true
    eyebrow: "Related careers"
    heading: "If you're considering Economist, also look at"
    parts:
      - related:
          - name: "BA Economics"
            sub: "Undergraduate economics"
            href: "ba-economics.html"
          - name: "Statistician (ISS)"
            sub: "Indian Statistical Service"
            href: "statistician.html"
          - name: "RBI Grade B"
            sub: "Central bank officer"
            href: "rbi-grade-b.html"
          - name: "UPSC Civil Services"
            sub: "IAS/IPS route"
            href: "upsc-civil-services.html"
  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Can I apply for IES after BA Economics?"
            a: "No. IES needs a postgraduate degree in Economics or a listed related subject."
          - q: "Are IES and IAS the same?"
            a: "No. IES is a specialist economic service with its own UPSC exam; IAS comes through the Civil Services Examination."
          - q: "Do I need Maths for economics?"
            a: "Not always, but most strong economics programmes and IES papers use maths and statistics."
      - note: "*Pay figures are indicative unless they quote an official pay level, and rules change: confirm eligibility, dates and fees on the official websites listed under Sources before you act."
        class: "table-note mt-lg"
