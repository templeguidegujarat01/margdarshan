  - id: "faq"
    hid: "faq-heading"
    alt: true
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Is Travel & Tourism the same as Hotel Management?"
            a: "No, though they overlap. Hotel Management (BHM) focuses on in-property operations — running a hotel's front office, food service and housekeeping. Travel & Tourism focuses on planning trips, tour packages, destination marketing and travel operations, typically working for tour operators, travel agencies or tourism boards rather than within a hotel."
          - q: "Do I need to study a specific stream in Class 11-12 for Travel & Tourism?"
            a: "No. It's open to students from any Class 12 stream — Arts, Commerce or Science — since it's a service and management-oriented field rather than one requiring specific prior subject knowledge."
          - q: "Has online travel booking made traditional travel agents obsolete?"
            a: "Not entirely. While simple bookings have shifted online, specialised, complex itinerary planning — corporate travel management, destination weddings, luxury and adventure travel — still relies on knowledgeable travel professionals who can navigate logistics that self-service platforms handle poorly."
          - q: "Can I work for an international airline or tourism board after this degree?"
            a: "Yes, this is a realistic outcome for graduates who build relevant experience — roles in airline ground operations, international tourism boards' India offices, and destination marketing organisations are genuine paths, though often more competitive and experience-dependent than domestic tour operator roles."
          - q: "How much do Travel & Tourism graduates earn in India?"
            a: "It varies by role and employer. Entry-level roles at tour operators or travel agencies typically start modestly, while experienced travel consultants, destination managers or roles at larger travel-tech companies can earn considerably more, especially with strong sales performance in commission-linked roles."
      - note: "*Fee and salary figures are indicative, based on publicly available information as of 2026, and vary significantly by institution and role — always verify current figures on the official institute website."
        class: "table-note mt-lg"
