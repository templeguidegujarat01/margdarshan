name: "Montana"
abbr: MT
checked: 2026-10-22
review_by: 2027-04-22
lede: "In Montana, the State Bar of Montana handles bar admission for lawyers, the Montana Board of Medical Examiners licenses physicians, the Montana Board of Public Accountants licenses CPAs and the Montana Board of Nursing licenses registered nurses."

boards:
