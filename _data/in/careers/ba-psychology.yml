  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Can I become a psychologist with just a BA Psychology degree?"
            a: "No, not to practise as a licensed clinical psychologist. A BA (or B.Sc) in Psychology is the essential first step, but practising clinically requires an MA/M.Sc in Psychology followed by an M.Phil in Clinical Psychology, which is what the RCI recognises for independent practice."
          - q: "Should I choose BA or B.Sc Psychology?"
            a: "Both lead to the same core discipline and career paths — the difference is mostly administrative, based on which faculty (Arts or Science) a particular university places the course under. Some B.Sc versions lean slightly more into statistics and biological/neuroscience content, but check your specific university's syllabus rather than assuming based on the degree name alone."
          - q: "Do I need CUET to get into a good BA Psychology college?"
            a: "For Delhi University and most central universities, yes — CUET (UG) scores decide admission, submitted through the DU CSAS portal or the respective university's counselling system, and Psychology is one of the more competitive, high-demand subjects in this process. Many state and private universities admit directly on Class 12 marks or run their own entrance test."
          - q: "What jobs can I get with just a BA Psychology degree?"
            a: "A plain BA Psychology alone mostly leads to roles like HR assistant, research assistant, and entry-level counselling-support or Non-Governmental Organisation (NGO) positions that don't require licensed clinical practice. Roles as a therapist, clinical psychologist or organisational psychologist require further postgraduate study."
          - q: "Is Psychology a good UPSC optional subject?"
            a: "Yes, Psychology is a commonly chosen and reasonably scoring UPSC Mains optional subject, valued for its structured, conceptually clear syllabus, though success depends more on preparation quality than the subject choice itself."
      - note: "*Fee and salary figures are indicative, based on publicly available information as of 2026, and vary significantly by institution and admission cycle — always verify current figures on the official college or university website."
        class: "table-note mt-lg"
