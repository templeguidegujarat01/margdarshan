  - id: "higher"
    hid: "higher-heading"
    alt: true
    eyebrow: "Beyond the degree"
    heading: "Higher studies"
    parts:
      - prose:
          - "An MA in English — at institutions like <strong>Delhi University, JNU or Jadavpur University</strong> — is the natural next step for students aiming at research, teaching (via UGC-NET) or a career in publishing at a more senior level. Others follow with a B.Ed for school teaching, a Master of Business Administration (MBA) in Marketing/Communications for a corporate route, or move directly into UPSC preparation, all of which build on the degree's strong foundation in reading, writing and analysis."
  - id: "proscons"
    hid: "pc-heading"
    eyebrow: "Honest take"
    heading: "Advantages and disadvantages"
    parts:
