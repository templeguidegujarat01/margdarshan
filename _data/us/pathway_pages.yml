  faqs:
    - { q: "How long does it take to become a physical therapist?", a: "A bachelor's degree (usually 4 years) and a DPT program that typically lasts 3 years, then the NPTE and a state license." }
    - { q: "Is part-time work possible?", a: "Yes. BLS says most physical therapists work full time, but part-time work is common." }
