      source: [ncahp-bpt, cahet]
state_uses: [board, med, scholarship, psc]
state_rules:
  - state: uttar-pradesh
    text: "ABVMU's <strong>Common Allied &amp; Healthcare Admission</strong> fills BPT seats on <strong>Class 12 PCB marks</strong>, with no direct admission. 50% in PCB (40% SC / ST / OBC / PwD), English passed, age 17 by 31 Dec 2026; NIOS accepted. Government colleges need UP domicile. Fee ₹750 (₹500 SC / ST / PwD)."
    source: cahet
  - state: west-bengal
    text: "BPT goes through <strong>JENPAS(UG)</strong> (7 June 2026): pass Physics, Chemistry, Biology and English, with 50% aggregate in PCB (40% SC / ST / OBC). No upper age limit for BPT."
    source: jenpas
  - state: karnataka
    text: "BPT has <strong>no entrance test</strong>: seats go on II PUC marks after you register with KEA."
    source: kcet-ib
    href: "state/karnataka/kcet.html"
  - state: gujarat
    text: "One Gujarat merit list covers BPT along with nursing and other allied courses; your merit report shows the courses you are eligible for."
    source: gj-nur
  - text: "NCAHP's 2025 curriculum sets the national course rules (50% PCB, 4 years + 1-year internship); admissions and seat quotas are run by each state."
    source: ncahp-bpt
