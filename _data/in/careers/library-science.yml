  - id: "faq"
    hid: "faq-heading"
    alt: true
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Is Library Science still relevant given how much information is now online?"
            a: "Yes, arguably more than ever. The field has shifted toward digital information management, database systems, metadata and digital archiving — skilled information professionals are needed to organise, preserve and make discoverable the vast amount of digital content organisations now hold."
          - q: "Do I need a B.Lib to become a librarian, or can I do a shorter course?"
            a: "A B.Lib (or B.LISc) is the standard undergraduate qualification for most librarian roles, especially in government and academic libraries. Shorter diploma courses exist and can suit certain assistant-level roles, but a full B.Lib, and often an M.Lib for senior positions, is generally expected for stable, well-recognised library careers."
          - q: "What is the difference between a Librarian and an Archivist?"
            a: "A Librarian manages a collection of books, journals and digital resources for public or institutional access and use. An Archivist preserves and organises historical records, documents and unique materials, often with a focus on long-term preservation rather than everyday lending — the two roles overlap in skills but serve different purposes."
          - q: "Can I work in a corporate setting with a Library Science degree?"
            a: "Yes. Corporate knowledge management, information/data organisation roles, and research support positions at companies, law firms and consultancies increasingly value information science skills — this is a growing, less traditional path beyond public and academic libraries."
          - q: "How much do Library Science graduates earn in India?"
            a: "It varies by sector. Government and academic library roles offer more structured, stable pay scales, while corporate information management and digital archiving roles can offer a wider range, sometimes higher, depending on the organisation and specialisation."
      - note: "*Fee and salary figures are indicative, based on publicly available information as of 2026, and vary significantly by institution and sector — always verify current figures on the official university website."
        class: "table-note mt-lg"
