    eyebrow: "Overview"
    heading: "What is Diploma in Information Technology?"
    parts:
      - overview:
          points:
            - "Diploma in Information Technology is a 3-year polytechnic programme covering computer networks, system administration, IT infrastructure management, database fundamentals and basic programming."
            - "Compared to Computer Engineering's stronger software-development emphasis, IT diplomas typically weight more toward keeping networks, servers and systems running reliably — a genuinely distinct, valuable skill set that most organisations need."
            - "It's offered at government polytechnics run by each state's technical education board, as well as private AICTE-approved polytechnic institutes."
          more:
            - "Nearly every organisation, regardless of industry, needs IT infrastructure support, giving this diploma broad, cross-industry relevance."
