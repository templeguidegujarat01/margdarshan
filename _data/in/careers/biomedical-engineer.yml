            href: "prosthetist-orthotist.html"
  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Can a PCB student do biomedical engineering?"
            a: "Some colleges accept PCB with Mathematics; most engineering admissions need PCM. Check each college's rules."
          - q: "Is biomedical engineering the same as biotechnology?"
            a: "No. Biomedical engineering is about medical devices and equipment; biotechnology is about biological processes and products."
          - q: "Who regulates medical devices in India?"
            a: "CDSCO, under the Medical Devices Rules, 2017."
      - note: "*Pay figures are indicative unless they quote an official pay level, and rules change: confirm eligibility, dates and fees on the official websites listed under Sources before you act."
        class: "table-note mt-lg"
