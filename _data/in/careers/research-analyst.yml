  eyebrow: "Commerce · Regulated Finance"
  title: "SEBI Registered Research Analyst (Equity Research)"
  meta:
    - "Registered with SEBI"
    - "Graduate + NISM Series XV"
  read_time: "8 min read"
  intro:
    - "Anyone who publishes buy/sell research or recommendations on listed securities for clients must be registered with SEBI as a Research Analyst (or work for one). Individuals need a graduate degree and the NISM Series XV Research Analyst certification. Equity research jobs in brokerages and fund houses use the same skills — and the same certification."
