  - id: "passing"
    hid: "passing-heading"
    alt: true
    eyebrow: "Simpler than India's group system"
    heading: "Passing criteria"
    parts:
      - prose:
          - "Unlike ICAI/ICSI/ICMAI's group-and-aggregate system, ACCA papers are assessed <strong>individually</strong> — each paper has its own standard pass mark, generally <strong>50%</strong>, with no aggregation across multiple papers and no concept of \"groups.\" You either pass a given paper or you don't, and you re-sit only that specific paper if you fail — you never lose credit for papers you've already passed."
      - note_box: "This paper-by-paper system is one reason many students find ACCA less stressful to plan around than CA or CMA's group-based structure — a single weak paper doesn't drag down an otherwise strong group."
  - id: "per"
    hid: "per-heading"
    eyebrow: "Beyond the exams"
    heading: "Ethics module & Practical Experience Requirement (PER)"
    parts:
      - prose:
          - "Passing all 13 papers makes you an <strong>ACCA affiliate</strong> — not yet a full member. To become a full member, you also need:"
          - list:
              - "The <strong>Ethics and Professional Skills Module (EPSM)</strong> — a mandatory ~20-hour online module, required before you can attempt Strategic Professional exams."
              - "The <strong>Practical Experience Requirement (PER)</strong> — 36 months of relevant work experience, with specific performance objectives signed off by a workplace mentor. This can be completed before, during, or after your exams."
            ticks: true
      - warn_box: "<strong>Common mistake:</strong> assuming \"ACCA qualified\" means the same as \"ACCA member.\" An affiliate who hasn't completed PER is meaningfully behind a full member on salary and recognition — start lining up relevant work experience early rather than treating it as an afterthought."
