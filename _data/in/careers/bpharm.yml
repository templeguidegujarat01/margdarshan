  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What is B.Pharm?"
    parts:
      - overview:
          points:
            - "B.Pharm (Bachelor of Pharmacy) is a 4-year undergraduate degree in pharmaceutical sciences — drug formulation, pharmaceutical chemistry, pharmacology, pharmacognosy, and clinical and hospital pharmacy."
            - "It's regulated by the <strong>Pharmacy Council of India (PCI)</strong>, a long-established national body, and is one of the most career-oriented science degrees in India."
            - "India is the world's largest producer of generic medicines and a major global pharmaceutical hub — this creates a genuinely wide universe of career options far beyond the \"corner chemist\" image most people have, spanning manufacturing, R&amp;D, quality assurance, regulatory affairs, clinical research and pharmaceutical marketing."
          more:
            - "The honest complication: these sectors pay very differently, and the choice between them matters more than almost any other decision in this career."
  - id: "who"
    hid: "who-heading"
    alt: true
    eyebrow: "Fit check"
    heading: "Who should choose B.Pharm"
    parts:
      - fit:
          match:
            - "Are genuinely interested in how medicines work, are manufactured, tested and regulated — not just dispensed."
            - "Are willing to strategically choose a sector (industry, regulatory affairs, government) rather than defaulting into retail pharmacy."
            - "Are interested in India's globally significant generic-drug and pharmaceutical export industry."
          mismatch:
            - "Assume all pharmacy jobs pay similarly regardless of sector — the gap is genuinely enormous."
            - "Want to skip building a specialisation (regulatory affairs, pharmacovigilance) and still expect top-tier pharma salaries."
            - "Are considering a non-PCI-approved college — this blocks Registered Pharmacist certification entirely."
  - id: "eligibility"
    hid: "elig-heading"
    eyebrow: "Eligibility"
    heading: "Who can apply for B.Pharm"
    parts:
      - elig_list:
          - "Class 12 pass with <strong>Physics and Chemistry compulsory</strong>, plus either <strong>Biology or Mathematics</strong> depending on the university — genuinely more flexible than most other medical-adjacent degrees, which require PCB specifically."
          - "Minimum aggregate typically <strong>45-50%</strong>, varying by college and category."
          - "Admission is via <strong>merit, state-level entrance exam, or university-specific test</strong> — there is no single national exam the way National Eligibility cum Entrance Test (NEET) is for Bachelor of Medicine and Bachelor of Surgery (MBBS)."
