  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What is B.A. Economics?"
    parts:
      - overview:
          points:
            - "B.A. Economics (usually offered as B.A. Honours Economics) is a 3-year undergraduate degree that studies how goods and services are produced, distributed and consumed, how financial systems and markets behave, and how government policy shapes inflation, employment and growth."
            - "At top colleges it is taught as a rigorous, mathematics-heavy discipline built on microeconomics, macroeconomics, statistics and econometrics rather than as a general humanities subject."
            - "Delhi University's colleges — <strong>SRCC, St. Stephen's, Hindu College and Lady Shri Ram College</strong> among them — are the most competitive and widely recognised destination for this degree, but it is also offered strongly at Presidency University Kolkata, Madras Christian College, Christ University and Symbiosis School of Economics, among many others, under the University Grants Commission (UGC) framework."
  - id: "who"
    hid: "who-heading"
    alt: true
    eyebrow: "Fit check"
    heading: "Who should choose B.A. Economics"
    parts:
      - fit:
