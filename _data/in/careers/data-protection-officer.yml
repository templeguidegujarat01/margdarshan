hero:
  eyebrow: "Law / Tech / Commerce · Emerging Role"
  title: "Data Protection Officer & Privacy Specialist (DPDP Act)"
  meta:
    - "Role created by the DPDP Act, 2023"
    - "No single mandatory degree"
  read_time: "8 min read"
  intro:
    - "India's Digital Personal Data Protection Act, 2023 requires every “Significant Data Fiduciary” — organisations the Government notifies because of the scale or sensitivity of the personal data they handle — to appoint a Data Protection Officer (DPO) based in India, answerable to the board. The law does not prescribe one degree: privacy professionals come from law, cybersecurity and compliance backgrounds."
