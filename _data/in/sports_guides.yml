# Sports system guides (India edition) -> olympic-games.html, winter-olympics.html, para-sports.html,
# multi-sport-games.html, sports-bodies.html, sports-careers.html, sports-doubts.html.
# Rendered by _includes/sports-guide.html (same .sc-* markup as the sport pages) and validated by
# scripts/check-in-data.mjs. Written for a 15-year-old: short sentences, everyday words, the number first.
# Part kinds: p, list, table, note, warn, links, qa. Every p / list / table / qa and every hero fact carries
# `source:` naming ids from that guide's sources[] (several ids joined by commas). links are internal pages
# (or https:// links) and need no source.
# Facts come only from official bodies: IOC (its press releases), LA28, IPC, OCA / Aichi-Nagoya 2026, Commonwealth
# Sport / Glasgow 2026, ICSD (Deaflympics), Special Olympics, WADA / Athletics Integrity Unit, Indian Olympic
# Association, national federations, and Government of India files (PIB, MYAS, SAI, NADA, DoPT, All India Radio),
# plus the institutes' own admission pages (SAI NSNIS Patiala, National Sports University, LNIPE).
# Forums (Reddit, Quora) were read only to learn which doubts students ask — never as a source of facts.
checked: 2026-10-18

guides:
  # ------------------------------------------------------------------------------------------------ Summer Olympics
  - slug: olympic-games
    short: "Summer Olympics"
    eyebrow: "Sports Guide · How sport works · The Olympic Games"
    title: "The Olympics, explained simply — who plays, who wins, how you get there"
    lede: "Education Margdarshan's plain guide to the Summer Olympic Games: how many countries and players take part, how many win and how many go home with nothing, every sport at Los Angeles 2028, how a player is picked, what education you need, and how India has done."
    meta: "IOC, LA28 and Government of India files only"
    official:
      - { label: "LA28 — every Olympic sport", url: "https://la28.org/en/games-plan/olympics.html" }
      - { label: "IOC — Paris 2024 in numbers", url: "https://www.3blmedia.com/news/paris-2024-record-breaking-olympic-games-and-field" }
    facts:
      - { label: "Teams at Paris 2024", value: "<strong>206 countries</strong> + the Refugee Olympic Team", source: ioc-paris }
      - { label: "Medal events at Paris 2024", value: "<strong>329</strong> — so 329 gold medals", source: ioc-paris }
      - { label: "LA28 (Los Angeles)", value: "<strong>36 sports · 351 events</strong>, from 14 July 2028", source: "ioc-la28,la28-oly" }
      - { label: "India at Paris 2024", value: "<strong>6 medals</strong> (1 silver, 5 bronze)", source: pib-ye24 }
    sections:
      - id: basics
        nav: "What it is"
        eyebrow: "The basics"
        heading: "What the Olympic Games are"
        parts:
          - list:
              - "The Olympics are the world's biggest sports event. The <strong>Summer Games</strong> happen <strong>once every four years</strong>, each time in a different city."
              - "The next Summer Games are in <strong>Los Angeles, USA, from 14 July 2028</strong> — called <strong>LA28</strong>. It is the third time Los Angeles hosts, after 1932 and 1984."
            source: la28-oly
          - list:
              - "Players do not enter by themselves. Each country sends one team through its <strong>National Olympic Committee</strong> (NOC). In India that is the <strong>Indian Olympic Association (IOA)</strong>."
              - "Paris 2024 was the first Olympics with <strong>exactly half women and half men</strong> — the IOC split the places 50:50."
            source: "ioc-paris,ioa-2036"
          - links:
              - { label: "Winter Olympics guide", url: "winter-olympics.html" }
              - { label: "Paralympics, Special Olympics & Deaflympics", url: "para-sports.html" }
              - { label: "Asian Games, CWG, National Games, Khelo India", url: "multi-sport-games.html" }
      - id: numbers
        nav: "Winners &amp; losers"
        eyebrow: "Who takes part, who wins"
        heading: "How many play — and how many go home with a medal"
        parts:
          - table:
              caption: "Paris 2024 — the real numbers"
              head: ["What", "Number"]
              rows:
                - ["Teams (countries) that took part", "<strong>206</strong> + the Refugee Olympic Team"]
                - ["Medal events (one gold each)", "<strong>329</strong> (152 women's, 157 men's, 20 mixed)"]
                - ["Teams that won <strong>at least one</strong> medal", "<strong>91</strong> + the Refugee Olympic Team"]
                - ["Teams that won <strong>no medal at all</strong>", "<strong>115</strong> of the 206"]
                - ["Countries that won their first-ever gold", "4"]
                - ["Olympic records broken", "125 (and 32 world records)"]
            source: ioc-paris
          - list:
              - "The Summer Games have a fixed limit of about <strong>10,500 athletes</strong>. LA28 keeps that limit and adds <strong>698 places</strong> for its five new sports."
              - "So roughly <strong>10,500 players fight for 329 golds</strong> at Paris. Most Olympians — even very good ones — go home without a medal. Just being selected is already a huge achievement."
            source: "ioc-la28,ioc-paris"
          - note: "A medal is decided in each event: gold for first, silver for second, bronze for third."
            source: ioc-paris
      - id: sports
        nav: "Sports at LA28"
        eyebrow: "Every sport at Los Angeles 2028"
        heading: "36 sports — and where to read about each"
        parts:
          - p: "LA28 has <strong>31 sports</strong> chosen by the IOC plus <strong>5 sports added by Los Angeles</strong>: baseball/softball, cricket (T20), flag football, lacrosse (sixes) and squash. In all there are <strong>351 medal events</strong> — 161 for women, 165 for men and 25 mixed."
            source: "ioc-la28,la28-new"
          - table:
              caption: "LA28 Olympic sports (Margdarshan guide linked where we have one)"
              head: ["Group", "Sports"]
              rows:
                - ["Team games", "<a href=\"football.html\">Football</a> · <a href=\"hockey.html\">Hockey</a> · <a href=\"basketball.html\">Basketball &amp; 3x3</a> · <a href=\"volleyball.html\">Volleyball &amp; beach volleyball</a> · <a href=\"handball.html\">Handball</a> · <a href=\"rugby.html\">Rugby sevens</a> · <a href=\"water-polo.html\">Water polo</a>"]
                - ["New for LA28", "<a href=\"cricket.html\">Cricket (T20)</a> · <a href=\"baseball-softball.html\">Baseball &amp; softball</a> · <a href=\"flag-football.html\">Flag football</a> · <a href=\"lacrosse.html\">Lacrosse</a> · <a href=\"squash.html\">Squash</a>"]
                - ["Combat", "<a href=\"boxing.html\">Boxing</a> · <a href=\"wrestling.html\">Wrestling</a> · <a href=\"judo.html\">Judo</a> · <a href=\"taekwondo.html\">Taekwondo</a> · <a href=\"fencing.html\">Fencing</a> · <a href=\"weightlifting.html\">Weightlifting</a>"]
                - ["Track, gym &amp; aim", "<a href=\"athletics.html\">Athletics</a> · <a href=\"gymnastics.html\">Gymnastics (artistic, rhythmic, trampoline)</a> · <a href=\"archery.html\">Archery</a> · <a href=\"shooting.html\">Shooting</a> · <a href=\"modern-pentathlon.html\">Modern pentathlon</a> · <a href=\"triathlon.html\">Triathlon</a>"]
                - ["Racket sports", "<a href=\"badminton.html\">Badminton</a> · <a href=\"tennis.html\">Tennis</a> · <a href=\"table-tennis.html\">Table tennis</a>"]
                - ["Water", "<a href=\"swimming.html\">Swimming &amp; open water</a> · <a href=\"diving.html\">Diving</a> · <a href=\"artistic-swimming.html\">Artistic swimming</a> · <a href=\"rowing.html\">Rowing</a> · <a href=\"canoe-kayak.html\">Canoe (slalom &amp; sprint)</a> · <a href=\"sailing.html\">Sailing</a> · <a href=\"surfing.html\">Surfing</a>"]
                - ["Wheels, horses &amp; more", "<a href=\"cycling.html\">Cycling (road, track, BMX, mountain bike)</a> · <a href=\"equestrian.html\">Equestrian</a> · <a href=\"golf.html\">Golf</a> · <a href=\"sport-climbing.html\">Climbing</a> · <a href=\"skateboarding.html\">Skateboarding</a>"]
            source: la28-oly
          - links:
              - { label: "Every sport A–Z (Olympic and non-Olympic)", url: "all-sports.html" }
      - id: qualify
        nav: "How players get in"
        eyebrow: "The selection process"
        heading: "How a player reaches the Olympics"
        parts:
          - table:
              caption: "The usual steps"
              head: ["Step", "What happens"]
              rows:
                - ["1. Play for your state", "Win or place at district, state and national championships of your sport"]
                - ["2. Make the national team", "Your <strong>national federation</strong> picks players through trials and results"]
                - ["3. Earn an Olympic place", "Each world federation sets the route: <strong>world ranking</strong>, a <strong>qualifying standard</strong> (a time, distance or score) or a <strong>qualifying tournament</strong>"]
                - ["4. Get entered", "The country's Olympic committee (IOA) enters the qualified players"]
            source: "afi-ag26,ioc-la28"
          - p: "Example — athletics in India: for the 2026 Asian Games, the <strong>National Inter-State Senior Athletics Championships</strong> were the <strong>only selection trial</strong>. Normally <strong>one athlete per event</strong> who meets the qualifying standard is picked; a second one is added only if the selection committee decides so, and its decision is final."
            source: afi-ag26
          - warn: "Meeting a qualifying mark does not guarantee a ticket. Athletes must also keep their <strong>whereabouts</strong> updated with the federation, and hiding an injury after selection can get you <strong>removed from the team</strong>."
            source: afi-ag26
          - links:
              - { label: "Judo: how LA28 places are won on the world ranking", url: "judo.html" }
              - { label: "Athletics: standards and selection", url: "athletics.html" }
      - id: education
        nav: "Age &amp; education"
        eyebrow: "Age and education"
        heading: "Is there an age limit? Do you need a degree?"
        parts:
          - list:
              - "There is <strong>no single Olympic age limit</strong>. Each sport sets its own. For example, an LA28 judo player must be born on or before 31 December 2013."
              - "Teenagers aged up to <strong>17</strong> have their own event: the <strong>Youth Olympic Games</strong>. The 2026 edition is in <strong>Dakar, Senegal</strong>, for two weeks from <strong>31 October 2026</strong> — the first Olympic event in Africa."
            source: "ijf-la28,ioc-dakar"
          - list:
              - "<strong>No exam, degree or marks</strong> are needed to be selected. Players are picked on <strong>results</strong> — trials, rankings and qualifying standards."
              - "Studies still matter. India's National Sports Policy 2025 wants sport joined with education and backs a <strong>dual career</strong> — sport and studies together."
            source: "afi-ag26,pib-nsp25"
      - id: india
        nav: "India's record"
        eyebrow: "India at the Olympics"
        heading: "How India has done — and what is next"
        parts:
          - table:
              caption: "India's Olympic medals"
              head: ["Games", "Medals"]
              rows:
                - ["Rio 2016", "2"]
                - ["Tokyo 2020", "7 (Neeraj Chopra won India's first athletics gold)"]
                - ["Paris 2024", "6 — 1 silver, 5 bronze"]
            source: "pib-cwg26,pib-ye24"
          - p: "At Paris 2024, <strong>shooting</strong> gave three bronzes (Manu Bhaker, Sarabjot Singh, Swapnil Kusale); <strong>Neeraj Chopra</strong> won silver in javelin, <strong>Aman Sehrawat</strong> bronze in wrestling, and the <strong>men's hockey team</strong> bronze again."
            source: pib-ye24
          - p: "India wants to host the <strong>2036 Olympic and Paralympic Games</strong> in <strong>Amdavad (Ahmedabad)</strong>. On 7 October 2026 the IOA welcomed the IOC's list of countries in the 2036 host process and said India will present its plan to the IOC's Future Host Commission at the end of November 2026."
            source: ioa-2036
          - links:
              - { label: "TOPS, Khelo India and who pays", url: "sports-bodies.html" }
      - id: doubts
        nav: "Quick doubts"
        eyebrow: "Quick doubts"
        heading: "Straight answers"
        parts:
          - qa:
              q: "Is cricket really in the Olympics now?"
              a: "Yes. <strong>Cricket (T20)</strong> is one of the five sports added for <strong>LA28</strong>, together with baseball/softball, flag football, lacrosse and squash."
            source: la28-new
          - qa:
              q: "How many people win a gold medal?"
              a: "One gold per event. Paris 2024 had <strong>329 events</strong> for about 10,500 athletes, and <strong>115 of the 206 teams</strong> won no medal at all."
            source: "ioc-paris,ioc-la28"
          - links:
              - { label: "Every sports doubt answered", url: "sports-doubts.html" }
