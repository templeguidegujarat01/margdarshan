sections:
  - id: "quick"
    hid: "quick-heading"
    alt: true
    eyebrow: "Quick answers"
    heading: "Veterinarian at a glance"
    intro: "Check whether your Class 12 background qualifies. Duration and pay are in the summary at the top of the page."
    parts:
      - subhead: "Can I apply from my stream?"
      - streams:
          - label: "Science"
            fit: "Eligible"
            tone: "y"
            icon: "science"
          - label: "Commerce"
            fit: "Not eligible"
            tone: "n"
            icon: "commerce"
          - label: "Arts / Humanities"
            fit: "Not eligible"
            tone: "n"
            icon: "arts"
      - note: "Class 12 Science with Physics, Chemistry and Biology, plus English."
  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What does a Veterinarian do?"
    parts:
      - overview:
          points:
            - "Vets examine, diagnose and treat animals; perform surgery; vaccinate; and advise owners and farmers on nutrition, breeding and disease prevention."
            - "Government vets run state animal-husbandry hospitals, disease-control and breeding programmes."
            - "Other routes include dairy and poultry industry, wildlife and zoo medicine, pharma, research and food safety."
  - id: "who"
    hid: "who-heading"
    alt: true
    eyebrow: "Fit check"
    heading: "Who should become a Veterinarian"
    parts:
      - fit:
          match:
            - "Love animals and are comfortable with their handling."
            - "Want a medical science career outside human medicine."
            - "Are ready for rural postings if you choose government service."
          mismatch:
            - "Are uncomfortable with blood, surgery or euthanasia decisions."
            - "Want a city-only career with fixed hours."
            - "Think it is an easier NEET option — it needs full medical-style study."
  - id: "eligibility"
    hid: "elig-heading"
    eyebrow: "Eligibility"
    heading: "What you need, stage by stage"
    parts:
      - elig_list:
          - "Class 12 with <strong>Physics, Chemistry, Biology and English</strong>; minimum marks and age as VCI and the state set."
          - "Qualify <strong>NEET-UG</strong>: VCI uses its merit list for the 15% All India Quota."
          - "State quota (85%) through each state's counselling authority, following its own rules."
  - id: "roadmap"
    hid: "roadmap-heading"
    alt: true
    eyebrow: "Step-by-step"
    heading: "Your full path to becoming a Veterinarian"
    parts:
      - steps:
          - title: "Class 12 PCB"
            text: "With English."
          - title: "NEET-UG"
            text: "Conducted by NTA."
          - title: "Counselling"
            text: "VCI for the 15% All India Quota, state authority for the rest."
          - title: "BVSc & AH"
            text: "Animal anatomy, medicine, surgery, livestock production."
          - title: "Internship"
            text: "Compulsory clinical internship."
          - title: "Register and work"
            text: "Practice, government service, industry or MVSc."
  - id: "exams"
    hid: "exams-heading"
    eyebrow: "Exams & licences"
    heading: "Admission and registration"
    parts:
      - chips:
          - label: "NEET-UG"
            text: "National entrance conducted by the National Testing Agency."
            source: "neet"
          - label: "VCI counselling"
            text: "15% All India Quota seats in recognised colleges."
            source: "vci"
          - label: "State counselling"
            text: "85% of seats filled by state authorities."
            source: "vci"
          - label: "Registration"
            text: "Under the Indian Veterinary Council Act, 1984 to practise."
            source: "vci"
  - id: "salary"
    hid: "salary-heading"
    alt: true
    eyebrow: "Indicative figures"
    heading: "Veterinarian pay in India"
    intro: "Pay varies a lot by employer, city and experience; these are broad, commonly reported ranges, not guarantees."
    parts:
      - salary:
          - label: "Government vet"
            value: "State pay level"
            text: "Veterinary officer pay follows each state's pay rules."
          - label: "Private practice"
            value: "Variable"
            text: "Pet clinics in cities can earn well over time."
          - label: "Industry"
            value: "Mid to high"
            text: "Pharma, dairy and poultry companies hire vets."
  - id: "jobs"
    hid: "jobs-heading"
    eyebrow: "Where they work"
    heading: "Employers & growth path"
    parts:
      - chips:
          - label: "Employers"
            text: "State animal-husbandry departments, pet clinics, dairy and poultry firms, pharma, zoos, research institutes"
          - label: "Government"
            text: "State PSCs recruit Veterinary Officers / Veterinary Assistant Surgeons"
          - label: "Higher study"
            text: "MVSc and PhD for specialisation and teaching"
  - id: "proscons"
    hid: "pc-heading"
    alt: true
    eyebrow: "Honest take"
    heading: "Advantages and disadvantages"
    parts:
      - proscons:
          pros:
            - "Real doctor role, in animal health."
            - "Steady government demand in rural India."
            - "Growing pet-care market in cities."
          cons:
            - "Competitive NEET-based admission."
            - "Physically demanding, sometimes risky work."
            - "Rural postings in government service."
  - hid: "related-heading"
    alt: true
    eyebrow: "Related careers"
    heading: "If you're considering Veterinarian, also look at"
    parts:
      - related:
          - name: "MBBS"
            sub: "Human medicine"
            href: "mbbs.html"
          - name: "Agriculture Science"
            sub: "Farming & agri-tech"
            href: "agriculture-science.html"
          - name: "Microbiology"
            sub: "Disease research"
            href: "microbiology.html"
          - name: "NEET UG"
            sub: "The entrance exam"
            href: "neet-ug.html"
  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Is NEET required for BVSc?"
            a: "NEET-UG is used for the 15% All India Quota run by VCI. Many states also use NEET for their seats, but check your state's rules."
          - q: "How long is the BVSc & AH course?"
            a: "It is a multi-year degree with a compulsory internship, as set in VCI's minimum standards; check the current VCI regulations for the exact duration."
          - q: "Can a veterinarian work in government?"
            a: "Yes. State PSCs recruit veterinary officers for animal-husbandry departments."
      - note: "*Pay figures are indicative unless they quote an official pay level, and rules change: confirm eligibility, dates and fees on the official websites listed under Sources before you act."
        class: "table-note mt-lg"
