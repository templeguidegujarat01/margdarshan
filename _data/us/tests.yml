# USA Edition — tests students meet on the way to college and professional school.
# Facts only from the test owners (College Board, ACT, IB, AAMC, ADA, AACP).
# A test's role in admissions is decided by each college: pages must say
# "required / recommended / optional / test-optional / test-blind varies by
# institution" and never call SAT or ACT universally required.

high_school:
  psat-8-9:
    name: "PSAT 8/9"
    by: "College Board"
    grades: "8 and 9"
    total: "240–1440"
    sections: "Reading and Writing 120–720; Math 120–720"
    source: cb_psat_score_structure
    last_verified: 2026-10-07
  psat-10:
    name: "PSAT 10"
    by: "College Board"
    grades: "10"
    total: "320–1520"
    sections: "Reading and Writing 160–760; Math 160–760"
    notes:
      - "Same test as the PSAT/NMSQT, but scores do not enter the National Merit Scholarship Program."
    source: cb_psat_score_structure
    last_verified: 2026-10-07
  psat-nmsqt:
    name: "PSAT/NMSQT"
    by: "College Board (with National Merit Scholarship Corporation)"
    grades: "10 or 11"
    total: "320–1520"
    sections: "Reading and Writing 160–760; Math 160–760"
    notes:
      - "Only 11th-grade (junior-year) scores count toward the National Merit Scholarship Program."
      - "Uses the same score scale as the SAT."
    source: cb_psat_score_structure
    last_verified: 2026-10-07
  sat:
    name: "SAT"
    by: "College Board"
    grades: "Usually 11 and 12"
    total: "400–1600"
    sections: "Reading and Writing 200–800; Math 200–800"
    notes:
      - "Total score is the sum of the two section scores."
      - "College Board college-readiness benchmarks: 480 Reading and Writing, 530 Math."
    admissions_role: "Set by each college (required, recommended, optional, test-optional or test-blind)."
    source: cb_sat_scores
    last_verified: 2026-10-07
  act:
    name: "ACT (enhanced)"
    by: "ACT"
    grades: "Usually 11 and 12"
    total: "Composite 1–36"
    sections: "English, Math, Reading (each 1–36); Science optional; Writing optional"
    notes:
      - "Since the September 2025 national test, the Composite is the average of English, Math and Reading only; Science is optional."
      - "Students who take Science also get a STEM score; students who take Writing also get an ELA score."
      - "State and district (school-day) ACT tests moved to the enhanced format from spring 2026."
    admissions_role: "Set by each college (required, recommended, optional, test-optional or test-blind)."
    source: act_enhanced
    last_verified: 2026-10-07
  ap:
    name: "AP Exams"
    by: "College Board"
    grades: "Usually 10–12, after an AP course"
    total: "1–5 per exam"
    scale:
      - "5 — extremely well qualified"
      - "4 — very well qualified"
      - "3 — qualified"
      - "2 — possibly qualified"
      - "1 — no recommendation"
    notes:
      - "Each college decides which scores earn credit or placement; many give credit for 3 or higher."
    source: cb_ap_scores
    credit_source: cb_ap_credit
    last_verified: 2026-10-07
  ib:
    name: "IB Diploma Programme"
    by: "International Baccalaureate"
    grades: "Usually 11 and 12"
    total: "Up to 45 points"
    notes:
      - "Six subjects graded 1–7, plus up to 3 points for Theory of Knowledge and the Extended Essay."
      - "Creativity, Activity, Service (CAS) earns no points but must be completed."
      - "At least 24 points plus other conditions are needed for the diploma."
    source: ib_dp
    last_verified: 2026-10-07

professional_admission:
  mcat:
    name: "MCAT"
    by: "AAMC"
    for: "Medical school (M.D. and D.O.)"
    total: "472–528"
    sections: "Four sections, each 118–132: Biological and Biochemical Foundations of Living Systems; Chemical and Physical Foundations of Biological Systems; Psychological, Social, and Biological Foundations of Behavior; Critical Analysis and Reasoning Skills"
    source: aamc_mcat
    last_verified: 2026-10-07
  dat:
    name: "DAT (Dental Admission Test)"
    by: "American Dental Association"
    for: "Dental school (D.D.S./D.M.D.)"
    sections: "Survey of the Natural Sciences (biology, general chemistry, organic chemistry), Perceptual Ability, Reading Comprehension, Quantitative Reasoning"
    source: ada_dat
    last_verified: 2026-10-07
  law-admission:
    name: "LSAT or GRE"
    by: "LSAC (LSAT) / ETS (GRE)"
    for: "Law school (J.D.)"
    notes:
      - "ABA Standard 503 still requires a valid and reliable admission test, but the ABA grants variances; 21 of 198 accredited schools held one as of August 2026."
    source: aba_journal_503
    last_verified: 2026-10-07
  pcat:
    name: "PCAT (retired)"
    by: "Pearson / AACP"
    for: "Pharmacy school"
    notes:
      - "Retired January 2024. No new test dates; do not list it as a pharmacy school requirement."
    source: aacp_pcat
    last_verified: 2026-10-07
