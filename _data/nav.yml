        href: career-fit.html
        icon: '<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/>'
      - label: Career Comparison
        short: Compare
        href: career-comparison.html
        icon: '<path d="M7 4v16M17 4v16M3 8h8M13 16h8"/>'
  # Career guides: two dropdown nodes + one standalone action tile.
  # `toggle: true` = the row is a button that opens its children (it has no page of its own);
  # its `href` is used only by the collapsed desktop icon rail, which cannot show children.
  # `tile: true` = drawn as a solid, high-contrast action tile instead of a plain row.
  - id: streams
    label: Career Guides
