  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What is LLB?"
    parts:
      - overview:
          points:
            - "LLB (Bachelor of Legislative Law) is India's standard law degree, regulated by the <strong>Bar Council of India</strong>."
            - "There are two routes: a <strong>5-year integrated degree</strong> — Bachelor of Arts (BA) LLB, Bachelor of Business Administration (BBA) LLB, B.Com LLB or similar — taken directly after Class 12, combining a general bachelor's degree with legal training; and a <strong>3-year LLB</strong> taken after completing any bachelor's degree first."
            - "Both lead to the same professional qualification and eligibility to practise after clearing the All India Bar Examination (AIBE)."
          more:
            - "The 5-year integrated route is offered at the <strong>National Law Universities (NLUs)</strong> — like NLSIU Bengaluru, NALSAR Hyderabad and NLU Delhi — along with hundreds of other law colleges nationwide, admitted primarily through CLAT."
            - "The 3-year route is offered widely at university law faculties, including Delhi University's Faculty of Law and many state universities."
  - id: "who"
    hid: "who-heading"
    alt: true
    eyebrow: "Fit check"
    heading: "Who should choose law"
    parts:
      - fit:
          match:
            - "Enjoy precise reading, constructing arguments, and finding the exact meaning of a written rule."
            - "Are comfortable with a demanding, competitive path — top NLUs and good firm placements both require sustained effort."
            - "Are drawn to litigation, corporate law, policy work or judicial services specifically — not just choosing law as a \"safe\" professional label."
          mismatch:
            - "Expect a guaranteed high income right after graduation — early litigation income especially can be modest and slow to build."
            - "Dislike heavy reading of dense, technical text — statutes, case law and judgments are the bulk of the coursework."
            - "Aren't prepared for the sustained CLAT preparation needed for a top NLU seat — competition is intense."
  - id: "eligibility"
    hid: "elig-heading"
    eyebrow: "Eligibility"
    heading: "Who can apply for LLB"
    parts:
      - elig_list:
          - "<strong>5-year integrated route:</strong> Class 12 pass (10+2) from any stream, typically 45-50% aggregate minimum, with an upper age limit at some NLUs (varies by institute)."
          - "<strong>3-year route:</strong> Any bachelor's degree (BA, B.Com, B.Sc, etc.) with minimum required marks, usually 45-50%, varying by university."
          - "Open to students from any Class 12 or graduation stream — no specific prior subject is compulsory for either route."
  - id: "roadmap"
