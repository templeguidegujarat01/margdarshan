              - "<strong>Akademi honours are by nomination only</strong> — no one can sell you an 'SNA award application'."
              - "Kalakshetra's diploma closes at <strong>age 25</strong>; plan the application before that birthday."
              - "Kalakshetra fees, once paid, are <strong>not refunded</strong>, and a student who leaves mid-term pays for the whole term."
              - "The young-artiste scholarship needs proof of <strong>at least 5 years of training</strong> — keep a certificate for every year."
            source: "dd-dance,sna-yuva,kala-prosp,pib-sya"
          - note: "The half-sitting stance and footwork load the knees and ankles, and Kalakshetra makes every dance applicant pass its own medical examination. Report pain to a doctor early rather than dancing through it."
