hero:
  eyebrow: "Science · Aviation Engineering"
  title: "Aircraft Maintenance Engineer (AME) — DGCA-Licensed"
  meta:
    - "Licensed by DGCA (CAR-66)"
    - "Class 12 with Physics, Chemistry & Maths"
  read_time: "8 min read"
  intro:
    - "Aircraft Maintenance Engineers (AMEs) inspect, repair and certify aircraft as safe to fly. The licence is issued by DGCA under its CAR-66 rules after you pass DGCA module exams and gain practical experience — usually starting with a basic training course at a DGCA-approved (CAR-147) organisation. It is a licence, not just a degree."
