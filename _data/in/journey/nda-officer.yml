# Journey Blueprint — Defence Officer via NDA (Army, Navy, Air Force). Printed on journey-nda-officer.html (_includes/journey-doubts.html).
# Rules, classes and the money items / sources several careers share: _data/in/journey_common.yml.
# `money_defs` / `sources` below are used only by this career. Check: node scripts/check-journey-matrix.mjs
id: nda-officer
name: "Defence Officer via NDA (Army, Navy, Air Force)"
search: ["nda", "indian army", "indian navy", "indian air force"]
search_not: ["medical", "education", "architect", "inspector", "commando", "meteorology", "logistics", "hydrographic", "air traffic", "administration", "flight test"]
page: "nda.html"
roadmap: "roadmaps/nda.html"
gate: "Unmarried and born inside the notice's window (1 Jan 2008 – 1 Jan 2011 for NDA (II) 2026) → Class 12 (Physics, Chemistry and Maths for Navy and Air Force) → UPSC NDA & NA written exam → SSB interview (+ pilot test for flying) → 3 years at NDA → service academy → commission as an officer."
gate_source: nda226
foundation:
  - stages: [c8, c9]
    title: "Maths and English decide the written paper"
    points:
      - text: "The written exam is <strong>Mathematics (300 marks)</strong> and the <strong>General Ability Test (600)</strong> — English 200 + General Knowledge 400 (Physics, Chemistry, General Science, Social Studies, Geography and Current Events). No calculators."
        source: nda226
      - text: "Start running and swimming now. Medical and physical standards are checked after SSB, and they are listed in Appendix III of every notice."
        source: nda226
  - stages: [c10]
    title: "Choose PCM if you want the Navy or Air Force"
    points:
      - text: "<strong>Army wing:</strong> Class 12 pass in any stream. <strong>Air Force and Naval wings</strong>, and the 10+2 Cadet Entry at the Indian Naval Academy: Class 12 with <strong>Physics, Chemistry and Mathematics</strong>."
        source: nda226
      - text: "Your Class 10 certificate is the only proof of date of birth UPSC accepts — check that it is correct now."
        source: nda226
  - stages: [c11, c12]
    title: "Apply while you are in Class 12"
    points:
      - text: "Students appearing in Class 12 can apply; proof of passing was due by <strong>10 June 2027</strong> for NDA (II) 2026. Class 11 students cannot apply."
        source: nda226
      - text: "You must stay <strong>unmarried until training ends</strong>. A cadet who marries during training is discharged and must refund the cost of training."
        source: nda226
      - text: "UPSC holds the NDA &amp; NA exam twice a year (I and II), so a Class 12 student usually gets more than one try inside the age window."
  - stages: [ug, grad]
    title: "Past the age window?"
    points:
      - text: "NDA is a school-level entry. After the birth-date window closes, graduate entries such as UPSC's Combined Defence Services exam are the route to a commission."
board_notes:
  gseb: "UPSC counts your GSEB HSC like any 10+2 pass; your <strong>SSC certificate</strong> is the only accepted proof of date of birth."
  cbse-gj: "Your CBSE Class X certificate is the only proof of date of birth UPSC accepts — no birth certificates, affidavits or horoscopes."
  upmsp: "Your UP Board High School certificate fixes your date of birth for UPSC. Agra, Aligarh, Bareilly, Gorakhpur, Kanpur, Lucknow, Meerut, Prayagraj and Varanasi are among the exam centres."
  msbshse: "Your SSC certificate fixes your date of birth for UPSC. Mumbai, Navi Mumbai, Thane, Pune, Nashik, Nagpur and Chhatrapati Sambhajinagar are exam centres; NDA itself is at Khadakwasla, Pune."
  wb: "Your Madhyamik certificate fixes your date of birth for UPSC. Kolkata and Siliguri are exam centres."
  cbse: "Every 10+2 board counts the same; for the Navy and Air Force, Class 12 must include Physics, Chemistry and Mathematics."
  other: "The Mathematics paper and Part B (General Knowledge) of the GAT are set in both Hindi and English."
board_source: nda226
exam:
  name: "UPSC NDA & NA Examination (II) 2026 → SSB"
  body: "Union Public Service Commission · Services Selection Boards"
  href: "nda.html"
  facts:
    - { label: "Vacancies", value: "394 (370 men, 24 women) — 158th NDA course and 120th INAC, from 1 Jul 2027", source: nda226 }
    - { label: "Written exam", value: "Mathematics 300 + General Ability Test 600; objective, OMR", source: nda226 }
    - { label: "Fee", value: "₹100 · SC / ST, women and eligible wards of JCOs / NCOs / ORs exempt", source: nda226 }
    - { label: "2026 cycle", value: "Notified 20 May · exam 13 Sep · written result 9 Oct 2026", source: [nda226, nda226-wr] }
  stages:
    head: ["Stage", "What it is", "Marking", "Rule"]
    rows:
      - ["Written (UPSC)", "Mathematics 300 + GAT 600 (English 200, General Knowledge 400)", "Wrong answer: −⅓ of that question's marks", "Qualifying marks set by UPSC; men and women ranked separately"]
      - ["SSB Stage I", "Officer Intelligence Rating tests + Picture Perception and Description Test", "—", "Only those who clear Stage I go on"]
      - ["SSB Stage II", "Interview, group testing tasks, psychology tests and the conference, over 4 days", "SSB carries 900 marks", "Assessed by the interviewing officer, GTO and psychologist"]
      - ["CPSS (flying only)", "Computerised Pilot Selection System for the Air Force flying branch", "—", "Taken once in life; fail it and flying is closed, ground duties stay open"]
      - ["Medical and final merit", "Medical board against Appendix III standards; merit = written + SSB", "—", "Separate merit lists for men and women, by vacancy"]
    source: nda226
  notes:
    - text: "First-time SSB candidates get AC III-tier rail fare (or bus fare) both ways."
      source: nda226
    - text: "NDA cadets earn JNU degrees: B.Sc, B.Sc (Computer) or B.A. at NDA, or a B.Tech completed at the next academy. Naval Academy 10+2 cadets do a 4-year B.Tech."
      source: nda226
    - text: "This is the 2026 (II) notice. UPSC posts the NDA &amp; NA (I) 2027 notice on upsc.gov.in — check the age window, vacancies and dates there."
state_rules:
  - state: gujarat
    text: "Gujarat scholarship at NDA: <strong>₹6,000 a year</strong> for wards of serving or ex-servicemen (officers included) who are natives or domiciles of Gujarat."
    source: nda226
  - state: uttar-pradesh
    text: "Uttar Pradesh Sainik Punarvas Nidhi pays a one-time <strong>₹50,000</strong> to UP-domiciled cadets who are wards of ex-servicemen or widows up to JCO rank."
    source: nda226
  - state: maharashtra
    text: "Maharashtra gives a one-time <strong>₹1,00,000</strong> to wards of Maharashtrian ex-service officers and men training as NDA cadets; parents apply through the Zilla Sainik Welfare Office."
    source: nda226
  - state: west-bengal
    text: "West Bengal pays a lump sum of ₹5,000 / ₹3,750 / ₹2,500 and ₹1,800 / ₹1,350 / ₹900 a semester, by family income (up to ₹9,000 a month / ₹9,001–18,000 / above), to domiciled cadets without other government aid."
    source: nda226
  - text: "There is no state quota: men and women are selected on separate all-India merit lists against the notified vacancies."
    source: nda226
multiverse:
  - { title: "NDA", text: "The full guide to the NDA entry.", href: "nda.html" }
  - { title: "CDS (after graduation)", text: "UPSC's graduate entry to IMA, INA, AFA and OTA.", href: "cds.html" }
  - { title: "Defence coaching", text: "NDA and SSB coaching centres near you.", href: "coaching-defence.html" }
  - { title: "Merchant Navy", text: "A sea career in commercial shipping instead.", href: "merchant-navy-officer.html" }
  - { title: "Commercial pilot", text: "Flying as a career outside the Air Force.", href: "commercial-pilot.html" }
money: [nda-fee, nda-free, nda-aid, nda-stipend, nmmss]

money_defs:
  - id: nda-fee
    kind: fee
    name: "No NDA exam fee"
    by: "Union Public Service Commission"
    amount: "₹0 instead of ₹100"
    who: "SC and ST candidates, women, and wards of serving or ex JCOs / NCOs / ORs studying in a Military School or a Sainik School (with the principal's certificate, shown at SSB). OBC and EWS candidates pay the full fee."
    apply: "Choose the category in the online form on upsconline.nic.in."
    stages: [c11, c12]
    source: nda226
  - id: nda-free
    kind: training
    name: "Government-paid training at NDA"
    by: "Government of India"
    amount: "Training, accommodation, books, uniform, boarding and medical treatment are paid by the Government"
    who: "Every NDA cadet. Parents meet pocket and private expenses — the notice expects these not to exceed ₹3,000 a month — and cadets deposit ₹41,495 on arrival (pocket allowance, insurance, first-semester costs), with clothing charged later."
    apply: "Nothing to apply for once you are selected; the joining instructions list the deposit."
    stages: [c10, c11, c12]
    source: nda226
  - id: nda-aid
    kind: scholarship
    name: "Government financial assistance at NDA"
    by: "Government of India"
    amount: "₹2,500 a month for the period of training"
    who: "Cadets whose parents' or guardian's income is below ₹45,000 a month. If two sons or wards train at the same time, both qualify."
    apply: "The parent applies through the District Magistrate to the Commandant, NDA, right after final selection."
    stages: [c11, c12]
    source: nda226
  - id: nda-stipend
    kind: stipend
    name: "Fixed stipend at the service academy"
    by: "Ministry of Defence"
    amount: "₹56,100 a month (starting pay of Level 10) during training at IMA and the other service academies"
    who: "Cadets who move on from NDA to IMA or the equivalent Navy and Air Force academies. On commissioning, pay is fixed in the first cell of Level 10 (Lieutenant: ₹56,100 – ₹1,77,500)."
    apply: "Nothing to apply for — paid during academy training."
    stages: [c11, c12]
    source: nda226

sources:
  - { id: nda226-wr, name: "UPSC — Press note: Written result of NDA & NA Examination (II) 2026 (9 Oct 2026)", url: "https://www.upsc.gov.in/sites/default/files/WR-NDA-NA-II-2026-Engl-13102026.pdf", covers: "written result date, SSB registration on joinindianarmy.nic.in", checked: 2026-10-25 }
