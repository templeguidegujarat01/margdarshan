  lede: "The Fee Paying Student Visa is for students paying international fees themselves or with family, loan or partial scholarship support."
  facts:
    - { label: "Fee", value: "From NZD 850", source: fpsv }
    - { label: "Processing", value: "80% within 7 weeks", source: fpsv }
    - { label: "Funds", value: "NZD 20,000 a year", source: fpsv }
