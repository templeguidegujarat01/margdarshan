          - label: "State entrance exams"
            text: "A few states run their own pharmacy/paramedical entrance exam as part of admission; check your state's current process, since there's no single national exam every college requires."
          - label: "PCI approval"
            text: "Always confirm the institute is approved by the Pharmacy Council of India before enrolling — this approval is what makes your qualification valid for pharmacist registration later."
