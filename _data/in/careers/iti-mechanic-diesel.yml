    hid: "faq-heading"
    alt: true
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "What kind of vehicles/machines does a Mechanic Diesel work on?"
            a: "Primarily diesel-powered vehicles and machinery — trucks, buses, tractors, construction equipment, generators and industrial diesel engines — rather than the petrol/light-vehicle focus of the Mechanic Motor Vehicle trade."
          - q: "How long is the ITI Mechanic Diesel course?"
            a: "Mechanic Diesel is typically a 2-year NCVT-affiliated trade, combining trade theory, diesel engine systems study and substantial hands-on servicing and repair practice."
          - q: "Is Mechanic Diesel a good trade for transport/logistics industry jobs?"
            a: "Yes. Transport and logistics companies operate large diesel truck and bus fleets, creating consistent demand for diesel mechanics to maintain and repair these vehicles — this is one of the trade's most reliable job markets."
          - q: "What is the difference between Mechanic Diesel and Mechanic Motor Vehicle?"
            a: "Mechanic Diesel focuses specifically on diesel engines used in trucks, heavy vehicles, tractors and generators. Mechanic Motor Vehicle covers cars and light vehicles broadly, including both petrol and diesel light-vehicle systems. Diesel is a deeper specialisation in diesel/heavy machinery; Motor Vehicle is broader for everyday cars."
          - q: "Can I work on construction/agricultural equipment after this trade?"
            a: "Yes. Diesel engines power much construction and agricultural machinery — tractors, excavators, harvesters — and diesel mechanics with relevant experience are commonly employed by equipment dealers and rental companies in these sectors."
