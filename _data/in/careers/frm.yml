    eyebrow: "Set expectations correctly"
    heading: "Difficulty & approximate pass rates"
    parts:
      - prose:
          - "Most candidates report studying roughly <strong>250 hours per part</strong>. Recent pass rates have run approximately <strong>45–58% for Part I</strong> and <strong>50–63% for Part II</strong> (Part II has historically had a somewhat higher pass rate, since only candidates who've already cleared Part I attempt it) — these move with each sitting, so treat them as a general sense of difficulty rather than a fixed target. Most candidates complete both parts within <strong>1–2 years</strong>."
