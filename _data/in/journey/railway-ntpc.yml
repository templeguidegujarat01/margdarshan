# Journey Blueprint — Railway Clerk / Station Master (RRB NTPC). Printed on journey-railway-ntpc.html (_includes/journey-doubts.html).
# Rules, classes and the money items / sources several careers share: _data/in/journey_common.yml.
# `money_defs` / `sources` below are used only by this career. Check: node scripts/check-journey-matrix.mjs
id: railway-ntpc
v: 2
name: "Railway Clerk / Station Master (RRB NTPC)"
search: ["railway ticket clerk", "railway reservation clerk", "railway station master", "assistant station master", "railway goods guard", "railway goods train manager", "rrb ntpc", "commercial cum ticket clerk", "trains clerk", "traffic assistant"]
page: "rrb-ntpc.html"
doubts_page: "journey-railway-ntpc.html"
gate: "Class 12 with 50% (not insisted on for SC / ST / PwBD / ex-servicemen) → RRB NTPC Under Graduate posts such as Commercial cum Ticket Clerk, age 18–30. Any degree → NTPC Graduate posts such as Station Master and Goods Train Manager, age 18–33. Selection: two computer-based tests, then a typing or aptitude test for some posts, documents and medical."
gate_source: [ntpc-ug, ntpc-g]
core:
  what:
    text: "NTPC — Non-Technical Popular Categories — are the railway jobs that keep stations and trains running without an engineering degree: selling tickets, keeping accounts and records, running a station's train movements (Station Master) and travelling with goods trains (Goods Train Manager). The Railway Recruitment Boards fill them through one national notice."
    source: [ntpc-ug, ntpc-g]
  day:
    - "Ticket clerk: issue tickets and reservations at the counter, handle cash and passenger questions."
    - "Station Master: control train movements at your station and keep the safety records."
    - "Goods Train Manager: travel with goods trains and look after their running and paperwork."
    - "Shift work, including nights, Sundays and festivals — railways run 24 hours."
  pay:
    - { level: "Commercial cum Ticket Clerk (CEN 07/2025)", value: "Pay Level 3 · ₹21,700 initial pay", source: ntpc-ug }
    - { level: "Accounts Clerk, Junior Clerk, Trains Clerk (CEN 07/2025)", value: "Pay Level 2 · ₹19,900 initial pay", source: ntpc-ug }
    - { level: "Goods Train Manager, Senior Clerk, Junior Accounts Assistant (CEN 06/2025)", value: "Pay Level 5 · ₹29,200 initial pay", source: ntpc-g }
    - { level: "Station Master, Chief Commercial cum Ticket Supervisor (CEN 06/2025)", value: "Pay Level 6 · ₹35,400 initial pay", source: ntpc-g }
  pay_note: "These are the initial pay figures printed in the notices; allowances are extra and are not printed there."
  routes:
    - { title: "Under Graduate posts (after Class 12)", text: "CEN 07/2025 had 3,058 posts: Commercial cum Ticket Clerk 2,424, Accounts Clerk cum Typist 394, Junior Clerk cum Typist 163, Trains Clerk 77. Class 12 with 50% in aggregate — not insisted on for SC, ST, PwBD, ex-servicemen or candidates with a higher qualification.", source: ntpc-ug }
    - { title: "Graduate posts (after any degree)", text: "CEN 06/2025 had 5,810 posts: Goods Train Manager 3,416, Junior Accounts Assistant cum Typist 921, Senior Clerk cum Typist 638, Station Master 615, Chief Commercial cum Ticket Supervisor 161, Traffic Assistant 59.", source: ntpc-g }
    - { title: "One RRB, many zones", text: "You apply to only one RRB and rank its railway zones. More than one application — to different RRBs or the same one — gets all of them rejected.", source: ntpc-ug }
  cost_time:
    - { label: "Exam fee", value: "₹500, of which ₹400 comes back after CBT-1 · ₹250 (fully refunded after CBT-1) for SC, ST, ex-servicemen, PwBD, women, transgender, minority and EBC candidates", source: ntpc-ug }
    - { label: "Age, Under Graduate posts", value: "18–30 on 1 Jan 2026 · +3 years OBC-NCL, +5 SC / ST", source: ntpc-ug }
    - { label: "Age, Graduate posts", value: "18–33 on 1 Jan 2026", source: ntpc-g }
    - { label: "One cycle, start to CBT-2", value: "Graduate notice: applications 21 Oct – 20 Nov 2025 · CBT-2 on 10 Jul 2026", source: [ntpc-g, ntpc-cbt2] }
  cost_note: "The rules ask for no degree beyond the post's qualification and no coaching; the only official cost is the exam fee."
  challenges:
    - text: "Both CBTs cut <strong>1/3 mark for every wrong answer</strong>, and CBT-1 only shortlists about 15 times the vacancies for CBT-2."
      source: ntpc-ug
    - text: "Station Master and Traffic Assistant need medical standard A-2 and a computer-based aptitude test with a T-score of at least 42 in every test battery — no relaxation for any category."
      source: ntpc-g
    - text: "Eyesight decides posts: Trains Clerk needs A-3 (distant vision 6/9, 6/9, glasses no stronger than 2D) and candidates with LASIK are not eligible for A-3 posts."
      source: ntpc-ug
  not_for:
    - "You want a fixed 10-to-5 job — stations and trains run round the clock."
    - "You cannot stay away from home — Goods Train Managers travel with trains."
    - "You dislike cash, crowds and queues — ticket counters are busy all day."
journey:
  - stages: [c8, c9]
    title: "School Maths, reasoning and general knowledge"
    do:
      - text: "NTPC papers test General Awareness, Mathematics, and General Intelligence and Reasoning. The Maths is school level — percentages, ratio, time and work, profit and loss, mensuration."
        source: ntpc-ug
      - text: "General Science questions are pitched up to Class 10 (CBSE) level, so your school science counts."
        source: ntpc-ug
    doubts:
      - q: "What is RRB NTPC?"
        a: "NTPC means Non-Technical Popular Categories — railway posts such as Commercial cum Ticket Clerk, Trains Clerk, Station Master and Goods Train Manager. The Railway Recruitment Boards fill them through computer-based tests."
        next: "See the Routes list above for every post."
        source: [ntpc-ug, ntpc-g]
      - q: "What subjects come in the NTPC exam?"
        a: "General Awareness, Mathematics, and General Intelligence and Reasoning. CBT-1 has 100 questions in 90 minutes: about 40 General Awareness, 30 Maths and 30 Reasoning."
        next: "Keep school Maths and general knowledge strong from now."
        source: ntpc-ug
  - stages: [c10]
    title: "Any stream — but pass Class 12 well"
    do:
      - text: "Any Class 12 stream works for the Under Graduate posts. The rule is <strong>50% in aggregate</strong> (not insisted on for SC, ST, PwBD and ex-servicemen)."
        source: ntpc-ug
      - text: "RRB accepts only the date of birth in your Class 10 certificate — a different date in the form leads to disqualification."
        source: ntpc-ug
    stream: "Any stream — Science, Commerce or Arts."
    mistakes:
      - "Taking Class 12 lightly — below 50% closes the UG posts for general candidates."
    doubts:
      - q: "Which stream should I take for railway NTPC jobs?"
        a: "Any stream. The Under Graduate posts ask for Class 12 (or equivalent) with 50% marks, and the Graduate posts ask for a degree in any subject from a recognised university."
        next: "Pick the stream you can score well in."
        source: [ntpc-ug, ntpc-g]
      - q: "Does my Class 10 certificate matter for railway jobs?"
        a: "Yes. RRB takes your date of birth only from your Class 10 (matriculation) certificate, and a mismatch in the application leads to disqualification."
        next: "Make sure the name and date of birth on your Class 10 marksheet and Aadhaar match."
        source: ntpc-ug
  - stages: [c11, c12]
    title: "Class 12: the 50% line and your first form"
    do:
      - text: "You must hold the qualification on the closing date — candidates waiting for results cannot apply."
        source: ntpc-ug
      - text: "The lower age limit is 18: for the 2025 UG notice you had to be born on or before 1 January 2008."
        source: ntpc-ug
    exams:
      - { name: "RRB NTPC Under Graduate CBT-1 (CEN 07/2025)", when: "7–9 May and 13–20 Jun 2026", source: ntpc-ug-cbt1 }
    money: [rrb-fee]
    mistakes:
      - "Applying to two RRBs to improve chances — every application gets rejected."
    doubts:
      - q: "Can I apply for NTPC while I am in Class 12?"
        a: "No. You must already have the qualification on the closing date; candidates waiting for final results are not eligible."
        next: "Apply in the first NTPC notice after your Class 12 result."
        source: ntpc-ug
      - q: "What if I score less than 50% in Class 12?"
        a: "For the UG posts, 50% is not insisted on for SC, ST, PwBD and ex-servicemen, or for candidates with a qualification higher than Class 12. Others need 50%."
        next: "Short of 50%? The Graduate posts after a degree remain open."
        source: ntpc-ug
      - q: "How much is the RRB NTPC fee and do I get it back?"
        a: "₹500 for most candidates, and ₹400 is refunded after you appear in CBT-1. SC, ST, ex-servicemen, PwBD, women, transgender, minority and EBC candidates pay ₹250, refunded after CBT-1."
        next: "Give correct bank details so the refund reaches you."
        source: ntpc-ug
      - q: "Is there negative marking in RRB NTPC?"
        a: "Yes. In both CBT-1 and CBT-2, one-third of a mark is cut for every wrong answer."
        next: "Do not guess blindly."
        source: ntpc-ug
  - stages: [ug]
    title: "In college: the Graduate posts open up"
    do:
      - text: "Graduate posts (Station Master, Goods Train Manager and others) need a completed degree; candidates waiting for final results are not eligible."
        source: ntpc-g
      - text: "Typist posts need 30 words a minute in English or 25 in Hindi on a computer, without editing tools or spell-check."
        source: ntpc-g
    doubts:
      - q: "Can a college student apply for Station Master?"
        a: "Not until the degree is complete. The Graduate notice says candidates waiting for final results of the qualification are not eligible to apply."
        next: "Plan for the first Graduate notice after your final result."
        source: ntpc-g
      - q: "What is the age limit for NTPC Graduate posts?"
        a: "18 to 33 years on 1 January 2026 for CEN 06/2025, with the usual category relaxations."
        next: "Work out how many notices your age allows."
        source: ntpc-g
  - stages: [grad]
    title: "CBT-2, then typing or aptitude test"
    do:
      - text: "CBT-2: 120 questions in 90 minutes (50 General Awareness, 35 Maths, 35 Reasoning), −1/3 per wrong answer; minimum marks 40% UR / EWS, 30% OBC-NCL and SC, 25% ST."
        source: ntpc-g
      - text: "Station Master / Traffic Assistant merit = <strong>70% CBT-2 + 30% aptitude test</strong> (CBAT, English and Hindi only, no negative marking)."
        source: ntpc-g
      - text: "Documents are checked 1:1 with vacancies; if marks tie, the older candidate ranks higher."
        source: ntpc-g
    exams:
      - { name: "RRB NTPC Graduate CBT-2 (CEN 06/2025)", when: "10 Jul 2026", source: ntpc-cbt2 }
    money: [rrb-fee]
    doubts:
      - q: "What is CBAT in RRB NTPC?"
        a: "The Computer Based Aptitude Test, only for Station Master and Traffic Assistant. Eight times the vacancies are called after CBT-2; you need a T-score of 42 in each test battery, with no relaxation for any category."
        next: "Read RDSO's psycho-technical guidelines before the test."
        source: ntpc-g
      - q: "Is the NTPC typing test counted in merit?"
        a: "No. The typing test is qualifying — 30 words a minute in English or 25 in Hindi — and merit comes from CBT-2."
        next: "Practise typing on a computer without spell-check."
        source: ntpc-g
      - q: "How is my railway zone decided?"
        a: "You choose one RRB and rank its zones in the form. After selection the RRB allots a zone by merit, medical standard and vacancies; once you are empanelled you lose the right to your next preference."
        next: "Rank zones in the real order you want."
        source: ntpc-g
      - q: "In which languages can I write the NTPC exam?"
        a: "English, Hindi and 13 regional languages — Assamese, Bengali, Gujarati, Kannada, Konkani, Malayalam, Manipuri, Marathi, Odia, Punjabi, Tamil, Telugu and Urdu. Questions appear in your language and in English."
        next: "Choose your medium in the online form."
        source: ntpc-g
      - q: "Where are RRB results and updates published now?"
        a: "Since 18 August 2026 the websites of all 21 RRBs are merged into one site, rrb.indianrailways.gov.in; the old regional sites get no new updates."
        next: "Bookmark your RRB's page on the new site."
        source: rrb-web
  - stages: [work]
    title: "Already working?"
    do:
      - text: "Serving railway Group C / erstwhile Group D staff with 3 years' service can apply up to age 40 (UR / EWS), 43 (OBC-NCL) or 45 (SC / ST)."
        source: ntpc-ug
    doubts:
      - q: "I work in a government office. Can I apply for NTPC?"
        a: "Yes, directly, but inform your employer and produce a No Objection Certificate at document verification, or your candidature is cancelled."
        next: "Ask your office for the NOC early."
        source: ntpc-ug
board_note: "Any board's Class 12 counts. The rule is 50% in aggregate, not insisted on for SC / ST / PwBD / ex-servicemen."
board_source: ntpc-ug
