            text: "Software Engineer (IT path), VLSI Design Engineer, Embedded Systems Engineer, RF Engineer, Telecom Engineer, IoT Solutions Architect, Hardware Design Engineer"
          - label: "IT/software recruiters"
            text: "TCS, Infosys, Wipro and similar mass-recruiting IT services and product companies — the largest single destination for ECE graduates."
          - label: "VLSI/semiconductor recruiters"
            text: "Intel, Qualcomm, Texas Instruments, Samsung, Micron and Tata Semiconductor, driven by India's expanding chip-design ecosystem."
          - label: "Government & defence recruiters"
            text: "DRDO, ISRO, Bharat Electronics Limited (BEL) and Indian Railways for core technical and research roles."
  - id: "higher"
    hid: "higher-heading"
    alt: true
    eyebrow: "Beyond the degree"
    heading: "Higher studies"
    parts:
      - prose:
          - "An <strong>M.Tech via Graduate Aptitude Test in Engineering (GATE)</strong> — in VLSI Design or Communication Engineering — is the standard route into IITs/NITs for research, teaching, or a stronger semiconductor-industry application. An <strong>MS abroad</strong> is especially common for students targeting global semiconductor companies, alongside an <strong>Master of Business Administration (MBA)</strong> for a move into tech/hardware product management, or focused certifications in VLSI/chip design tools for a faster path into the field's better-paid core roles."
  - id: "proscons"
    hid: "pc-heading"
    eyebrow: "Honest take"
    heading: "Advantages and disadvantages"
    parts:
      - proscons:
          pros:
            - "Genuinely the most flexible engineering branch — real crossover into IT/software plus a distinct, fast-growing hardware/VLSI track."
            - "Backed by real, ongoing investment in India's semiconductor industry through the India Semiconductor Mission."
            - "Strong government/defence electronics presence through Defence Research and Development Organisation (DRDO), Indian Space Research Organisation (ISRO) and BEL."
          cons:
            - "Outcomes vary enormously depending on which of the several genuinely different career paths you land in."
            - "The headline VLSI salary figures apply to a competitive, specialised slice of Tier-1 hiring, not a typical outcome."
            - "Students who want one clearly defined lane may find the branch's breadth unfocused compared to CSE or a core branch."
  - hid: "myth-heading"
    eyebrow: "Common myths"
    heading: "Myths vs facts"
    parts:
      - myths:
          - myth: "ECE and CSE lead to completely different careers."
            fact: "Roughly 60% of ECE graduates end up in IT/software roles doing very similar work to CSE graduates — many companies hire ECE and CSE freshers into the same software positions."
          - myth: "Every ECE graduate walks into a ₹15-30 LPA VLSI job."
            fact: "Those figures apply specifically to skilled freshers at Tier-1 semiconductor companies like Intel and Qualcomm — most ECE graduates in core roles earn meaningfully less, roughly ₹4-8 LPA, without that specific specialisation."
          - myth: "If you're not great at coding, ECE keeps hardware options fully open instead."
            fact: "Even core hardware careers like embedded systems and VLSI increasingly require solid programming skills (C/C++, Verilog) — coding isn't optional in ECE either."
