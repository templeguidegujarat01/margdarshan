  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Is NEET compulsory for BSc Nursing?"
            a: "For AIIMS and most government nursing colleges, yes — this requirement has tightened since 2024, with most central and state government nursing college admissions now aligned with NEET-UG scores. However, many state and private colleges still run their own separate entrance exams or admit directly on Class 12 merit, so always verify your specific target college's exact requirement."
          - q: "What is the real salary difference between nursing in India and abroad?"
            a: "It's substantial. Freshers in India commonly earn ₹2.5-4 lakh per annum (LPA) at private hospitals. Indian-trained nurses who complete additional international licensing — NCLEX-RN for the US, the CBT for the UK — are reported to earn 3-10 times their India salary once placed abroad, with UK nurses reported to earn roughly ₹30-55 lakh annually and US nurses $60,000-80,000. This gap is genuinely large and well-documented, not marketing exaggeration."
          - q: "What is the difference between ANM, GNM and BSc Nursing?"
            a: "They have genuinely different scope of practice and career ceilings. BSc Nursing is a 4-year degree offering the broadest scope of practice and the clearest path to postgraduate study and international licensing. GNM is a 3.5-year diploma with solid general scope, and can later bridge into a Post-Basic BSc Nursing. ANM (Auxiliary Nursing Midwifery) is the shortest route at 2 years, with the most limited scope, typically focused on rural and community health roles."
          - q: "What exams do I need to work as a nurse abroad?"
            a: "It depends on the country. The US requires NCLEX-RN; the UK requires the NMC's CBT; Australia requires AHPRA registration; and Gulf countries require DHA, MOH or HAAD registration depending on the emirate/country. Most also require an English proficiency test like IELTS or OET, alongside a recognised nursing degree and valid nursing registration from India."
          - q: "Is nursing a good career in 2026?"
            a: "Yes, genuinely so. The WHO projects a global nursing shortage of 45-60 lakh professionals by 2030, which is a real, sustained driver of international demand, not hype. India-based salaries remain comparatively modest, but nursing offers one of the clearest, most well-documented pathways to global mobility of any Indian healthcare degree, provided you're willing to invest in the additional licensing steps required for international roles."
      - note: "Figures are indicative (2026) — confirm on the official college or authority website."
        class: "table-note mt-lg"
      - source_link:
          href: "https://www.indiannursingcouncil.org/"
          label: "Official source: Indian Nursing Council (indiannursingcouncil.org)"
