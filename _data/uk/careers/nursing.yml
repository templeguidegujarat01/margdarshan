tracks:
  - id: degree
    title: "Nursing degree"
    tag: "NMC"
    who: "A degree in adult nursing approved by the <strong>Nursing and Midwifery Council</strong>."
    steps:
      - { tag: "School", title: "GCSEs + 2 or 3 A levels", text: "Including a science, or an equivalent level 3 course.", kind: stage, source: ncs_nurse }
      - { tag: "Degree", title: "Adult nursing degree: 3 years full time", text: "Extra money may come from the NHS Learning Support Fund.", kind: stage, source: ncs_nurse }
      - { tag: "Register", title: "Apply to the NMC", text: "Your university sends your details; you pay the fee and apply in MyNMC.", kind: gate, source: nmc_uk_trained }
      - { tag: "Goal", title: "Registered nurse", text: "", kind: license, source: ncs_nurse }
