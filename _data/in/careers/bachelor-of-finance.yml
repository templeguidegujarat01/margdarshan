    heading: "What is Bachelor of Finance (BFM)?"
    parts:
      - overview:
          points:
            - "BFM is a 3-year specialised undergraduate degree covering financial markets, equity research, derivatives, risk management, investment banking and financial modelling — subjects a general B.Com only touches briefly, if at all."
            - "It was introduced by the <strong>University of Mumbai</strong> and remains concentrated at its affiliated colleges, making it the closest thing India has to a dedicated \"Bachelor of Finance\" degree."
            - "Where B.Com builds a broad foundation across accounting, taxation and business law, BFM goes narrow and deep into how stock markets, banks and investment firms actually function — closer in spirit to a specialised finance-track degree than to a general commerce one."
