          - label: "Top PSU recruiters (via GATE)"
            text: "NTPC, Power Grid Corporation (PGCIL), BHEL, NHPC, SAIL and GAIL, alongside state electricity boards/discoms."
          - label: "Top private recruiters"
            text: "Siemens, ABB, L&amp;T, Schneider Electric, and renewable energy majors like Adani Green, ReNew Power and Tata Power."
          - label: "Industries"
