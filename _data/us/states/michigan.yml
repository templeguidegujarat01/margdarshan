      - { body: "Michigan Board of Osteopathic Medicine and Surgery", url: "https://www.michigan.gov/lara/bureau-list/bpl/health/hp-lic-health-prof/osteo" }
  cpa:
    src: nasba_boards
    boards:
      - { body: "Michigan State Board of Accountancy", url: "https://www.michigan.gov/lara/bureau-list/bpl/occ/prof/accountancy" }
  nursing:
