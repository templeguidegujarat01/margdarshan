    heading: "Higher studies"
    parts:
      - prose:
          - "Unlike some tech specialisations where a portfolio alone can substitute for a degree, machine learning genuinely rewards formal study for its more research-oriented roles. An <strong>M.Tech via GATE</strong> or an <strong>MS abroad</strong> in Machine Learning, Data Science or a related quantitative field meaningfully strengthens applications for Research ML Engineer roles, and a <strong>PhD</strong> remains close to a requirement at research labs and deeptech firms specifically working on novel model architectures."
  - id: "proscons"
    hid: "pc-heading"
    eyebrow: "Honest take"
    heading: "Advantages and disadvantages"
    parts:
      - proscons:
          pros:
            - "Consistently one of the highest-paying specialisations in Indian IT, even without a specific GenAI focus."
            - "Genuinely diverse sub-types mean you can find a flavour of the role — research, production, platform, or application — matching your actual strengths."
            - "Strong, genuine remote and global opportunities for engineers with demonstrated skills."
          cons:
            - "The job title is used inconsistently for very different work — a real risk of preparing for the wrong type of interview."
            - "Production and deployment work can be less glamorous than the \"building AI\" image, with real infrastructure and operations responsibility."
            - "Research-oriented roles increasingly expect a Master's or PhD, raising the entry bar specifically for that track."
  - hid: "myth-heading"
    eyebrow: "Common myths"
    heading: "Myths vs facts"
    parts:
      - myths:
          - myth: "All \"ML Engineer\" jobs are the same."
            fact: "The role varies hugely by sub-type — Research, Production, Data Platform and Application ML Engineers do genuinely different work with different skill requirements. Always check which one a job posting actually means."
          - myth: "You need a PhD to work in machine learning."
            fact: "A PhD is generally only preferred for Research ML Engineer roles specifically. Production, Platform and Application ML Engineer roles are commonly filled by B.Tech/M.Tech graduates and even strong self-taught candidates with real project experience."
          - myth: "ML Engineer and AI Engineer are just two names for the same job."
            fact: "They overlap but differ in emphasis — a classic ML Engineer role often centres on structured-data models and production reliability, while an AI Engineer role today is increasingly centred on GenAI/LLM application building. Check the actual responsibilities, not just the title."
