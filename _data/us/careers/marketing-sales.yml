      - { name: "Sales certification", who: "Professional associations", kind: "Voluntary", text: "Not required; some representatives choose to earn professional certification.", source: ooh_wholesale }

  # 952,700 jobs (market research analysts and marketing specialists)
  - slug: market-research-analyst
    short: "Market Research Analyst"
    title: "Market research analyst: bachelor's with statistics and research methods, often a master's or MBA for leadership"
    eyebrow: "Marketing & Sales · Market Research, Analytics, & Ethics"
    lede: "Market research analysts typically need a bachelor's degree in market research or a related business, communications or social science field. Some employers require or prefer a master's degree, which is often required for leadership or more technical research jobs."
    for: "Curious people who like statistics, surveys and finding out why customers buy."
    soc: ["13-1161"]
    does: { text: "Market research analysts study consumer preferences, business conditions, and other factors to assess potential sales of a product or service.", source: ooh_qf_mktresearch }
    work: { text: "Because most industries use market research, these analysts are employed throughout the economy. Most analysts work full time during regular business hours.", source: ooh_qf_mktresearch }
