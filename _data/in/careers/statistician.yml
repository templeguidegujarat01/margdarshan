sections:
  - id: "quick"
    hid: "quick-heading"
    alt: true
    eyebrow: "Quick answers"
    heading: "Statistician at a glance"
    intro: "Check whether your Class 12 background qualifies. Duration and pay are in the summary at the top of the page."
    parts:
      - subhead: "Can I apply from my stream?"
      - streams:
          - label: "Science"
            fit: "Eligible"
            tone: "y"
            icon: "science"
          - label: "Commerce"
            fit: "Eligible with Maths"
            tone: "m"
            icon: "commerce"
          - label: "Arts / Humanities"
            fit: "Eligible with Maths"
            tone: "m"
            icon: "arts"
      - note: "Maths at Class 12 is what matters; many universities admit Commerce and Arts students with Maths to B.Sc/BA Statistics."
  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What does a Statistician do?"
    parts:
      - overview:
          points:
            - "Statisticians design surveys and experiments, clean and analyse data, build models and report findings."
            - "ISS officers run national surveys, price indices, national accounts and statistical systems across ministries."
            - "In industry, statisticians work in analytics, clinical trials, insurance, finance and market research."
  - id: "who"
    hid: "who-heading"
    alt: true
    eyebrow: "Fit check"
    heading: "Who should become a Statistician"
    parts:
      - fit:
          match:
            - "Enjoy maths, probability and data."
            - "Like turning numbers into clear conclusions."
            - "Want strong government and private options."
          mismatch:
            - "Dislike maths and programming."
            - "Want a field-heavy outdoor job."
            - "Expect quick success in UPSC without deep subject study."
  - id: "eligibility"
    hid: "elig-heading"
    eyebrow: "Eligibility"
    heading: "What you need, stage by stage"
    parts:
      - elig_list:
          - "For ISS: a bachelor's degree with <strong>Statistics, Mathematical Statistics or Applied Statistics</strong> as one of the subjects, or a master's in one of these."
          - "Age limits and relaxations as per the current UPSC notice."
          - "Private roles: a statistics/maths degree plus skills in R, Python or SQL."
  - id: "roadmap"
    hid: "roadmap-heading"
    alt: true
    eyebrow: "Step-by-step"
    heading: "Your full path to becoming a Statistician"
    parts:
      - steps:
          - title: "Class 12 with Maths"
            text: "Strong maths foundation."
          - title: "B.Sc Statistics"
            text: "Or Maths with Statistics."
          - title: "M.Sc Statistics (optional)"
            text: "Helps for UPSC and research."
          - title: "UPSC IES/ISS exam"
            text: "Written papers and interview."
          - title: "ISS officer or analyst"
            text: "Government service or industry analytics."
      - roadmap_card: "Statistician"
  - id: "exams"
    hid: "exams-heading"
    eyebrow: "Exams & licences"
    heading: "UPSC IES/ISS examination"
    parts:
      - chips:
          - label: "Combined exam"
            text: "UPSC runs one examination for the Indian Economic Service and Indian Statistical Service."
            source: "upsc"
          - label: "ISS papers"
            text: "General English, General Studies and statistics papers, followed by an interview."
            source: "upsc"
          - label: "Other routes"
            text: "SSC CGL statistical posts and state statistical services."
  - id: "salary"
    hid: "salary-heading"
    alt: true
    eyebrow: "Official pay level"
    heading: "Statistician pay in India"
    intro: "ISS is a Group A central service on the 7th CPC pay matrix; private pay depends on skills and employer."
    parts:
      - salary:
          - label: "ISS entry"
            value: "Level 10"
            text: "Group A central services start at Level 10 of the 7th CPC pay matrix (₹56,100 entry basic), plus DA, HRA and other allowances."
          - label: "Private analytics"
            value: "Varies"
            text: "Statistics plus programming skills earns well in analytics."
          - label: "Senior ISS"
            value: "Higher levels"
            text: "Senior posts across MoSPI and ministries."
  - id: "jobs"
    hid: "jobs-heading"
    eyebrow: "Where they work"
    heading: "Employers & growth path"
    parts:
      - chips:
          - label: "Government"
            text: "MoSPI, NSO, ministries, RBI and statistical bodies"
          - label: "Private"
            text: "Analytics firms, pharma (clinical trials), insurance, banks, market research"
          - label: "Research"
            text: "Indian Statistical Institute and universities"
  - id: "proscons"
    hid: "pc-heading"
    alt: true
    eyebrow: "Honest take"
    heading: "Advantages and disadvantages"
    parts:
      - proscons:
          pros:
            - "Elite Group A service with clear exam route."
            - "Skills that also pay in the private sector."
            - "Intellectually rich work."
          cons:
            - "Very few ISS vacancies a year."
            - "Needs strong maths throughout."
            - "UPSC preparation takes time."
  - hid: "related-heading"
    alt: true
    eyebrow: "Related careers"
    heading: "If you're considering Statistician, also look at"
    parts:
      - related:
          - name: "Data Science"
            sub: "Analytics & BI"
            href: "datascience.html"
          - name: "Actuarial Science"
            sub: "Risk & insurance maths"
            href: "actuarial-science.html"
          - name: "Economist (IES)"
            sub: "Indian Economic Service"
            href: "economist.html"
          - name: "SSC CGL"
            sub: "Statistical investigator posts"
            href: "ssc-cgl.html"
  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Who is eligible for the Indian Statistical Service?"
            a: "Graduates with Statistics, Mathematical Statistics or Applied Statistics as a subject, or postgraduates in these, within the UPSC age limits."
          - q: "Are IES and ISS the same exam?"
            a: "UPSC conducts them as one combined examination with different papers for each service."
          - q: "Can a BA Economics student apply for ISS?"
            a: "Only if Statistics was one of the subjects in the degree."
      - note: "*Pay figures are indicative unless they quote an official pay level, and rules change: confirm eligibility, dates and fees on the official websites listed under Sources before you act."
        class: "table-note mt-lg"
