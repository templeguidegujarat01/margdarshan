  meta:
    - "Registered with IBBI"
    - "Qualification + experience in the asset class"
  read_time: "8 min read"
  intro:
    - "A Registered Valuer gives the independent valuations that the Companies Act and the Insolvency and Bankruptcy Code require — for mergers, insolvency cases and share issues. The Insolvency and Bankruptcy Board of India (IBBI) registers valuers in three asset classes after they join a Registered Valuers Organisation (RVO), complete a 50-hour educational course and pass IBBI's valuation exam."
