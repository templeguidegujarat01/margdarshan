  - { id: pae27, name: "Office of the CGPDTM — Public Notice: Trade Marks Agent Examination 2027 and Patent Agent Examination 2027 (23 Jun 2026)", url: "https://ipindia.gov.in/storage/uploads/others/QfDfIWdlzwBwlF8u1Sd3okSu1KHgyjpTWMXeUVT0.pdf", covers: "PAE 10 Jan 2027 at 15 locations, section 126 eligibility, rule 110 qualifying, Paper I MCQ 2 h / Paper II descriptive 3 h, 100 marks each, 50% each for 50-mark viva, syllabus, English / Hindi choice, registration 1 Jul – 30 Sep 2026 (no extension), timeline, ₹1,600 fee, final-year degree within 6 months, no recognised coaching", checked: 2026-10-28 }
