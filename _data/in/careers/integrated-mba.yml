  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "What does Integrated MBA actually mean in India?"
            a: "It most often refers to the 5-year IPM, pioneered by IIM Indore in 2011 and now also offered by IIM Rohtak, IIM Ranchi, IIM Shillong and a few other IIMs. A number of private universities — NMIMS, Symbiosis, Christ and others — also run their own 5-year \"integrated MBA\" style programmes, though these don't carry the same weight as an IIM's IPM."
          - q: "Is IPMAT compulsory for the Integrated MBA?"
            a: "For the IIM route, yes — IPMAT (the IPM Aptitude Test, conducted by IIM Indore) is the standard entrance exam, and several other IIMs accept the same score. Private universities running their own integrated MBA-style programmes typically use their own entrance test or admit on Class 12 merit with an interview."
          - q: "Is IIM's Integrated MBA (IPM) really as good as a regular 2-year MBA?"
            a: "At the IIMs offering it, the final placements for IPM students happen alongside the institute's regular 2-year MBA batch, so outcomes are generally reported as being at par. This is specific to the small number of IIMs running IPM — a similarly named \"integrated MBA\" at a less prestigious private university will not carry the same placement strength."
          - q: "How much does the IIM Integrated MBA (IPM) cost?"
            a: "It is genuinely expensive — total fees for the full 5-year programme at IIM Indore, Rohtak, Ranchi and similar institutes are commonly reported in the range of ₹35-45 lakh for domestic students, covering tuition, residential accommodation and related costs. Need-based financial assistance and scholarships are available at some IIMs for eligible students."
          - q: "What if I'm not sure I want a management career at 17-18?"
            a: "Then a 5-year IPM commitment made straight after Class 12 carries real risk, since it locks you into a management-focused path early with a significant financial and time investment. A regular undergraduate degree followed by CAT/XAT for a separate MBA later gives you more room to explore other fields first before committing."
      - note: "*Fee, eligibility and salary figures are indicative, based on publicly available information as of 2026, and vary significantly by institute and admission cycle — always verify current figures on the official IIM or university website."
        class: "table-note mt-lg"
