hero:
  eyebrow: "Science · Govt Regulatory Job"
  title: "Food Safety Officer — Enforcing the FSS Act"
  meta:
    - "Appointed under the FSS Act, 2006"
    - "Degree in food tech, microbiology, chemistry & more"
  read_time: "8 min read"
  intro:
    - "Food Safety Officers inspect restaurants, factories and markets, take food samples and enforce the Food Safety and Standards Act, 2006. They are appointed by each state's Commissioner of Food Safety, usually through state public service commission exams, and must hold a qualification listed in the Food Safety and Standards Rules — such as a degree in food technology, dairy technology, biotechnology, microbiology, agriculture or veterinary science, or a master's in chemistry."
