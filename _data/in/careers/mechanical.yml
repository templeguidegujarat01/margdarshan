  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Is Mechanical Engineering still worth it in 2026?"
            a: "Yes, for the right student. It has the widest public-sector presence of any engineering branch — ONGC, BHEL, SAIL, HAL, Defence Research and Development Organisation (DRDO) and Indian Space Research Organisation (ISRO) all hire mechanical engineers regularly through GATE — and core industries like manufacturing, energy and defence keep hiring steadily even when private tech hiring slows down. What's changed is that added skills like automation, simulation software and EV technology now matter more for a strong private-sector salary."
          - q: "What's the real salary difference between private and PSU jobs after Mechanical Engineering?"
            a: "Private-sector fresher salaries typically start lower than in branches like CSE, commonly ₹3-5 LPA at most colleges. PSU roles secured through GATE often start around ₹6-8 LPA including allowances, and come with much stronger job security and a predictable government pay scale, even though the starting number isn't always dramatically higher."
          - q: "Do I need to clear GATE after Mechanical Engineering?"
            a: "No, it isn't compulsory. GATE is specifically the route into PSU jobs like ONGC, BHEL and SAIL, and into M.Tech programmes at IITs and NITs. Plenty of mechanical engineers build strong private-sector careers in design, manufacturing or automation without ever taking GATE — it's a choice based on whether you want the PSU/government route."
          - q: "Can a diploma student join Mechanical Engineering directly in the second year?"
            a: "Yes. Most states run a lateral entry route (often through an exam like LEET) that lets Diploma in Mechanical Engineering holders join the second year of a B.Tech/B.E. programme directly, skipping the first year and JEE entirely."
          - q: "Is Mechanical Engineering better than CSE for government jobs?"
            a: "For core government and PSU technical roles, yes — Mechanical Engineering has more GATE-recruiting PSUs and government departments than almost any other branch. For government jobs outside core engineering, such as Union Public Service Commission (UPSC) or Staff Selection Commission (SSC), both branches are on largely equal footing since those exams don't depend on your engineering specialisation."
      - note: "Figures are indicative (2026) — confirm on the official college or authority website."
        class: "table-note mt-lg"
