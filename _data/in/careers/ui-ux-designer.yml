    heading: "Cost of each route"
    parts:
      - prose:
          - "A formal design education at an institute like <strong>NID or Srishti</strong> is a multi-lakh, multi-year commitment, similar in scale to any other specialised undergraduate degree — check each institute's current fee structure directly. The self-taught route is genuinely far cheaper: <strong>Figma itself is free to learn</strong>, and countless free tutorials cover the fundamentals. Guided, structured courses, for students who want a faster, more organised path, commonly cost <strong>₹20,000-1,50,000</strong> — always verify a course's actual placement outcomes before enrolling."
