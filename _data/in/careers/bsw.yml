  - id: "what"
    hid: "what-heading"
    eyebrow: "Overview"
    heading: "What is BSW?"
    parts:
      - overview:
          points:
            - "BSW is a 3-year undergraduate degree that trains students in social work theory and, crucially, applied practice — case work, community organisation, counselling fundamentals and social policy — directed at helping individuals and communities facing poverty, abuse, disability, addiction and other social challenges."
            - "Unlike a purely theoretical social science degree, BSW builds in mandatory <strong>supervised fieldwork</strong> throughout the programme, placing students directly in Non-Governmental Organisations (NGOs), hospitals, schools or community settings."
            - "It's offered at institutions like the <strong>Tata Institute of Social Sciences (TISS)</strong>, Delhi University's affiliated colleges, and several state universities, under the University Grants Commission (UGC) framework."
