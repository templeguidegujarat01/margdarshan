  - id: "faq"
    hid: "faq-heading"
    eyebrow: "Good to know"
    heading: "Frequently asked questions"
    parts:
      - faq:
          - q: "Is the CMA (India) the same as the US CMA?"
            a: "No. This guide covers the Indian CMA qualification awarded by the ICMAI. The US CMA is a separate, shorter, globally-recognised certification issued by the Institute of Management Accountants (IMA) in the US. Some professionals in India pursue both, but they are different courses with different regulators, syllabi and fee structures."
          - q: "Is CMA easier than CA?"
            a: "CMA is generally considered somewhat less time-consuming than CA, mainly because its practical training period is shorter and its syllabus, while demanding, is slightly narrower in scope. Both use a similar 40% per paper plus 50% aggregate passing rule, and both require serious, sustained preparation."
          - q: "Can I do CMA and B.Com together?"
            a: "Yes. Many students pursue CMA Foundation and Intermediate alongside a regular B.Com degree, since ICMAI's programme is primarily self-study with periodic exams rather than full-time classes."
          - q: "Do CMAs only work in manufacturing companies?"
            a: "No. While CMAs have deep roots in manufacturing cost control, they are now widely hired across FMCG, IT services, banking, consulting, e-commerce and Global Capability Centres (GCCs) for FP&amp;A, budgeting and financial planning roles."
          - q: "What is the difference between CMA and CS?"
            a: "CMA (ICMAI) focuses on cost accounting, financial management and strategic decision-making. CS (ICSI) focuses on corporate law, governance and regulatory compliance. Some large companies employ both a CMA and a CS in different roles, since the two qualifications solve different problems."
