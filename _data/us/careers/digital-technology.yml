          - { tag: "During college", title: "Internship", text: "Students may gain software development experience through an internship, such as at a software company.", kind: stage, source: ooh_swdev }
          - { tag: "Goal", title: "Software developer, QA analyst or tester", text: "No license is needed.", kind: goal, source: ooh_swdev }
      - id: master
